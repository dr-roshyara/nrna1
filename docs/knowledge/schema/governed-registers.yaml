# Governed register(ns) — configuration for CAP-001 Identifier Integrity.
#
# ⚠️⚠️ THIS FILE IS CONFIGURATION, NOT A RULING.
#
# G-1 is OPEN: no canonical enumeration of governed registers exists. M4 names the
# "bare, unregistered series" liability but lists no registers, and supplying that list
# is an AUTHORITY act — it is also the first limb of M6 §7.5's reopening trigger.
#
# House rule observed (ADRs govern policy · the registry stores configuration):
#   every row stores WHAT and carries a `ref:` pointing at WHO SAYS SO.
#   Nothing here authors a criterion (AP-7 · DR-4 — criteria are used here, owned elsewhere).
#
# Placement: beside statuses.yaml / authorities.yaml / bounded-contexts.yaml /
# repository-migrations.yaml, where enumerations already live.
# ⛔ NOT under `engineering/registers/` — that would be a new folder under R-37's
#    structural freeze ("no new top-level folders").
#
# Behaviour when a series is absent below: INCONCLUSIVE. That is CORRECT — it measures
# G-1 rather than hiding it. Absence of evidence is never PASS.
#
# Consumed by: scripts/identifier-check.php (CAP-001)
version: 1

registers:

  R:
    label: Platform rulings
    ref: 'R-30 — "Proposals sealed permanently… From R-30 onward, rulings live HERE."'
    # ⚠️ SPLIT ACROSS TWO FILES, on the register's own statement:
    #    "R-1..R-29 remain there as the historical record of the program."
    # ⚠️ FINDING: R-30 cites the sealed half at
