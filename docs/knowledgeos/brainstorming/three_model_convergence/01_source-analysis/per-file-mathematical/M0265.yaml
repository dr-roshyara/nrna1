about: >
  Document 12 of the 15-document consolidated theory series, written in the DDD-architect role and
  explicitly self-limited: "[DESIGN] — a strategic model, NOT an adopted architecture. Kernel NOT
  SELECTED... this document models; it decides nothing." Fixes the ubiquitous language, proposes
  candidate bounded contexts organized around a shared constitutional-invariant kernel that no
  single context owns, derives an ownership rule for read-disjointness explicitly paralleling the
  anonymity invariant of "the sibling platform," gives concrete new quantified numbers for Zero's
  contract/reference relativity and minimal-element generation failure, defines aggregates/value
  objects/domain events/ports, and closes with an explicit list of what the model deliberately does
  not resolve.
introduces:
  - "A 9-row ubiquitous-language table fixing Inquiry/Frame/Transformation/Representation/Observable/Eliminability/Adequacy/Realization/Boundary-information, each paired with an explicit 'does NOT mean' disambiguation (e.g. Frame does not mean 'a filter'; Transformation does not mean 'a cleanup step'; Boundary information does not mean 'metadata')"
  - "A quantified justification for treating boundary information (provenance/uncertainty/scope/contradiction state) as non-metadata: 'one elimination in six is blocked by boundary information alone. Calling it metadata would model it as removable, and the data say it is not'"
  - "A candidate bounded-context diagram organized around a shared CONSTITUTIONAL KERNEL (the three predicates, the type discipline, read-disjointness) that 'NO context owns... EVERY context preserves,' with five child contexts (Inquiry, Transformation, Eliminability, Preservation Assessment, Evidence & Contradiction) plus Realization hanging off Preservation"
  - "A five-strategic-questions table (Owns/Affects/Published-Language?/Ownership-changes?) applied per context, with Evidence & Contradiction explicitly marked unresolved on both Published-Language and Ownership-changes, blocked on DECISION-02 — 'the model must not proceed to tactical work there. A frame belongs to Inquiry; a partition belongs to Evidence. The answer decides which context owns φ, and no experiment can decide it'"
  - "THE OWNERSHIP RULE the experiments force: read-disjointness is a CONSTITUTIONAL invariant that no single context can own, because it relates Π (Eliminability), Q (Inquiry) and T (Transformation) simultaneously — Inquiry doesn't know Π; Eliminability doesn't know Q; Transformation knows neither but its provenance map is what makes the invariant checkable"
  - "A STRIKING self-drawn analogy: 'this is exactly the shape of the anonymity invariant in the sibling platform: a constitutional invariant that a context preserves rather than owns. The experiments reached the same structure independently, which is mild evidence the shape is real' — an explicit cross-reference to what is very likely this repository's own real PublicDigit voting platform (per the established X3 precedent at M0225, and this repository's own CLAUDE.md/ADR-T11 anonymity-invariant discipline), a notable instance of this simulated research corpus drawing directly on its own authoring repository's real architectural findings"
  - "A tactical consequence of FR-003: 'Transformation must publish its provenance map as part of its Published Language, and that map must be empirically verified, not declared'"
  - "An 8-row aggregates/entities/value-objects table: InquiryFrame (aggregate root, Q/C/O change together, O immutable once issued); TransformationSpec (aggregate root, T+provenance+family-kind as one unit); EliminationAssessment (aggregate root, a Zero verdict inseparable from its (S,T,Π,contract,reference)); Representation (entity, identity=transformation-applied+source-case); ProvenanceMap/MultiplicityProfile/AdequacyVerdict/EpistemicStatus (value objects)"
  - "CONCRETE NEW QUANTIFIED NUMBERS not previously recorded in this pass, forcing the EliminationAssessment aggregate boundary: 'Zero is contract-relative (495/4049 verdicts flip) and reference-relative (541/4260) — an assessment stored without them is not a fact about the data and will be wrong when reused'"
  - "A further concrete new number confirming the already-established 'no EliminableCore aggregate' negative: 𝒵 is not generated by its minimal elements, evidenced by 286/826 failures — 'any design that caches minimal eliminable sets and closes upward is refuted by the data'"
  - "A 7-row domain-events table (FrameIssued/TransformationRegistered/ProvenanceVerificationFailed/EliminationAssessed/AdequacyEvaluated/RealizationFailed/StatusPromoted), with an explicit named identification of the two events the programme learned it needed: 'ProvenanceVerificationFailed and RealizationFailed... both name failures that were invisible in the first designs' — plus a rule for StatusPromoted: 'never [EXP]→[THM] without a proof artifact'"
  - "A 5-row port table (ZeroObservablePort/InquiryPort/DecoderPort+ConstraintPort/ProvenancePort/EpistemicStatusPort), with an explicit architectural finding about the limits of port-based enforcement: 'the port structure enforces read-disjointness by construction... but only if ProvenancePort is consulted, because the leak came through T, not through the ports' — directly explaining why BRIDGE-02's rank/tag leak evaded a naive pairwise gate"
  - "An 8-item earned anti-pattern list, each tied to a specific finding: treating 'eliminate everything eliminable' as well-defined (L is non-confluent); caching minimal eliminable sets and closing upward (𝒵 not generated by minimal elements); storing a Zero verdict without contract/reference; a single 'reduction size' scalar; re-fitting the decoder after seeing R; declaring rather than verifying a field read-set; modelling boundary/provenance as removable metadata; letting a ticket accrete into architecture ('architecture produces tickets; tickets do not become architecture')"
  - "An explicit closing scope statement: the model does NOT select a kernel [OPEN]; does NOT declare a carrier [OPEN] ('without a carrier the tactical model cannot be completed'); does NOT resolve DECISION-02 (leaving Evidence & Contradiction deliberately unowned); does NOT promote FR-003 (needs a second adopter, ES-006.1) — 'the correct next strategic act is a carrier decision, not more tactical modelling'"
defines:
  - "The candidate bounded-context map: Constitutional Kernel + Inquiry/Transformation/Eliminability/Preservation-Assessment/Evidence-Contradiction/Realization"
  - "InquiryFrame, TransformationSpec, EliminationAssessment as aggregate roots; Representation as an entity; ProvenanceMap/MultiplicityProfile/AdequacyVerdict/EpistemicStatus as value objects"
