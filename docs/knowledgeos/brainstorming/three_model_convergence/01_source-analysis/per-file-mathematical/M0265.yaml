title: "Theory 12 — The DDD Architecture the Experiments Imply: the corpus's strategic DDD model (explicitly [DESIGN], kernel NOT SELECTED, decides nothing), fixing candidate bounded contexts around a shared 'Constitutional Kernel' that no context owns but every context preserves — with a striking self-drawn analogy to 'the anonymity invariant in the sibling platform' (very likely this repository's own PublicDigit voting platform, per the established X3 precedent), concrete new quantified Zero-relativity numbers (495/4049 contract-relative flips, 541/4260 reference-relative flips, 286/826 minimal-element failures), and a port design that enforces read-disjointness by construction while explaining exactly why BRIDGE-02's leak still got through"
