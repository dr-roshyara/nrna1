about: >
  The successor document explicitly flagged as unlocated at M0135 — confirmed here by its own text:
  "Supersedes …155427_the-research-model-and-the-optimized-model.md as a proposal." Introduces a
  three-register architecture (Research / Decision / Optimized Model), ratifies DECISION-01
  (non-evidential invariance), opens DECISION-02 (semantic status of a frame), and gives 31
  experiments' worth of load-bearing results plus a fully updated artifact map (33-file v1.2 lane,
  FDE package, COMP/COMP-SEP results).
introduces:
  - "The three-register architecture: RESEARCH (what evidence can settle → experiments), DECISION (what evidence cannot settle → decision records), OPTIMIZED MODEL (what to build given both → a proposal) — explicitly framed as preventing conflation between these as the document's central purpose"
  - "DECISION-01 [DECIDED]: the non-evidential invariance principle — E ∼_evidential E′ ⟹ Comp(E)=Comp(E′) — the first design law in the programme to originate from a decision rather than an experiment; C6 (permutation invariance) and C7 (frame-refinement invariance) ratified as INSTANCES of this principle, not free-standing criteria"
  - "DECISION-02 [DECISION REQUIRED]: the semantic status of a frame — does φ identify semantically meaningful evaluation frames (Option B, semantic context) or merely organize evidence (Option A, representational partition)? Blocks the composition rule choice. φ={time,context} is explicitly NOT promoted to a semantic primitive by this document — it is a detection criterion, not an ontology"
  - "The reorganized dependency chain: ℛ_req → Evaluation Representation → Typed Boundary/Reason → Composition → Aggregation → Zero → Determination, with Contradiction explicitly demoted to 'ONE required distinction, NOT the root' — a further reordering beyond M0135's Contr-first-to-third move"
  - "Sat→Zero, never the reverse — confirmed from two independent directions (document W §8, and KR-CONTR-MODELS §6's saturation result)"
  - "Evaluation representation formalized and measured: Evaluation = Status/Polarity × Typed Boundary/Reason, with a comparison table over 13 required distinctions: Classical preserves 1/collapses 1/not-representable 11; K3 preserves 3/collapses 10; FDE two-channel preserves 11/collapses 2; Structured preserves all 13"
  - "Composition rule: φ⊇{time,context} REQUIRED and NON-ADDITIVE (18/90 with {time} alone 0/15, {context} alone 0/15); union, strict, and last-wins all EXCLUDED (last-wins excluded twice — once for discarding an earlier genuine conflict, once for failed well-definedness under multiset reordering); supersession subsumed by temporal separation (no separate supersession rule needed)"
  - "A third composition shape held open as [PROP]: stop requiring the composition operator to manufacture a frame-free Standing at all — Evaluation=(frame-relative standings, divergence), with a SEPARATE determination operation deciding whether a frame-free conclusion is justified; cross-frame divergence marked [DEFERRED]"
  - "The decision register (§B.3): six items total, two [DECIDED] (factivity/R1, DECISION-01), four still open/deferred (DECISION-02, composition rule, ℛ_req, adopting M3≅M4/𝓑)"
  - "Revised build order: steps 1,2,4,7 of the first 7 are DECISIONS not experiments — 'the shape of a programme that has run out of things experiments can settle in this area — which is a result, not a stall'"
