introduces:
  - "A new explicit distinction not previously stated this precisely: 'first failure in one chain ≠ global representation optimum' — the experiment establishes only that R5→R4 is the FIRST OBSERVED failure in THIS sequential chain, not that R4 is a globally minimal adequate representation; a differently-constructed parallel R'_4=T'(D) could be substantially smaller than R5 while remaining adequate — connects directly to the sequential-vs-parallel distinction"
  - "An internal-inconsistency catch in the reviewed assessment: it states H(Q|R5)=0 (a population-level claim) while elsewhere correctly acknowledging only the empirical/finite-sample Ĥ(Q|R5)=0 was established — corrected to 'no observed training or test collisions were found at R5; this provides empirical evidence consistent with adequacy, but does not establish population H(Q|R5)=0' — the same empirical-vs-theoretical-adequacy discipline (M0198) applied here to catch a live drafting slip"
  - "A three-way graded refinement of the single blanket claim 'Zero≠Preservation': split into '[EXP] No association observed in KR-REP-REDUCTION-2026-09' / '[NEG] Zero⇒Adequacy is unsupported' / '[OPEN] whether Zero and preservation have a deeper relationship' — preventing a negative single-experiment result from silently becoming a universal non-equivalence theorem"
  - "A parallel correction to the 'three research stages' narrative: 'Stage 3: NO EVIDENCE OF EQUIVALENCE' softened to 'no evidence of equivalence UNDER THE TESTED CONDITIONS' — the same discipline against overgeneralizing a negative result from one experimental setup"
  - "A small notation cleanup: 'Zero(S)=0' (implying Zero is numeric-valued) corrected to the Boolean-predicate form Zero_{T,Π}(S;D)=true or simply Zero_{T,Π}(S;D), since Zero has consistently been treated as a Boolean predicate throughout this thread, not a numeric function"
  - "The most complete single-document 18-row adjudication table for the KR-REP-REDUCTION result to date, adding the first-failure≠global-optimum and Q-relative-residual-representation rows to M0222's 16-row version"
