about: >
  Delivers the most rigorous engineering-discipline artifact in the Zero-algebra/representation-
  reduction thread: a complete 12-phase Production Corpus Audit & Adapter specification for
  KR-REP-DATASET-2026-09, opening with an explicit honest disclaimer that the actual KR-ZERO corpus
  files are not available for direct inspection. Each phase carries an explicit stop-condition or
  status vocabulary preventing the audit from silently manufacturing results it cannot support.
introduces:
  - "A 12-phase audit protocol: (1) Corpus Discovery — search for all KR-ZERO/KR-ZERO-ORDER/KR-ZERO-ALGEBRA artifacts by keyword, including the unreconciled 1395/1496/1475 count tokens; (2) Denominator Reconciliation — a mandatory table explaining KR-ZERO-baseline/O2/O4/O6 populations, explicitly 'do not repair the historical numbers'; (3) Source Schema Discovery — a 6-value status vocabulary (VERIFIED_OBSERVED/VERIFIED_DERIVED/PARTIAL/UNOBSERVED/AMBIGUOUS/CONTRADICTORY), with VERIFIED_DERIVED permitted only for deterministic derivations from observed data; (4) Independent Q Audit; (5) Representation Reconstruction; (6) Transformation Registry; (7) Dataset Construction; (8) Completeness Audit; (9) Auditor Execution (only after completeness is established); (10) Canonical n* Determination; (11) Boundary Diagnosis; (12) Final Audit Report (14 mandatory sections)"
  - "An explicit circularity guard for Q-independence (Phase 4): accept ONLY 'Q explicitly evaluated from raw D' or 'Q deterministically reproducible from raw D'; explicitly REJECT 'Q derived from R_n,' 'Q inferred from Zero-status,' 'Q reconstructed from the desired experimental outcome' — if independence cannot be demonstrated, Q=NULL with Q_independence_status=UNVERIFIED rather than manufactured ground truth"
  - "An explicit warning that historical k=1/k=2/k=3/irreducible classifications (from KR-ZERO-ORDER-2026-09) are PROVENANCE CLASSIFICATIONS, not automatically R1/R2/R3/R4/R5 representation levels — restated even more forcefully than at M0198/M0200: if an intermediate representation was not actually recorded and cannot be deterministically reconstructed, R_n=NULL, and it must 'never [be] interpolate[d]'"
  - "A formal Completeness metric: Comp_n=N_n/N_source where N_n=|{i:R_{n,i}≠NULL}| — a mandatory table (Phase 8) that must precede any level-metric calculation"
  - "A canonical n* determination rule: n*=min{n: Comp_n=1 ∧ A_n=1 ∧ N_viol,n=0 ∧ Ĥ(Q|R_n)≤ε} — with the explicit rule that if NO level satisfies this, n*=NULL is itself 'a valid scientific result,' and the completeness requirement must NEVER be lowered merely to manufacture an n*"
  - "A structural-identity internal-consistency check: N_viol,n=0 ⟺ Ĥ(Q|R_n)=0 for the finite empirical support — if the implementation produces disagreement between these two independently-computed quantities, the instruction is to 'stop and diagnose the implementation/data canonicalization rather than proceeding'"
  - "A precise None-vs-0.0 entropy discipline: when N_n=0 (no observations at a level), entropy fields (H_Q_given_R, H_R_given_Q, H_R) must be set to None, not 0.0 — because zero entropy legitimately means 'a measured deterministic relationship,' whereas zero observations means the quantity is simply UNDEFINED; conflating the two would misrepresent absence-of-data as a positive empirical finding"
  - "An explicit, forceful warning against a specific substitution error: 'we should not use the previously reported 89.7%, 1.8%, 0.2%, and 8.24% as substitutes for these metrics. Those are results from the KR-ZERO ORDER experiment, not results of the NEW representation-reduction experiment' — the sharpest statement yet of the KR-ZERO-ORDER-vs-KR-REP-DATASET non-identity first flagged at M0198"
  - "A clear division of what can be delivered now (the frozen dataset contract, the production auditor code, schema, denominator-reconciliation logic, canonicalization logic, completeness calculation, N_viol calculation, entropy calculations, n* determination, boundary classifier, report format, an implementation prompt) versus what genuinely requires the raw corpus (the actual A_n/F_n/N_viol,n/entropy values and the actual n*) — an honest, explicit boundary between specification-readiness and result-readiness"
defines:
  - "Comp_n=N_n/N_source — the completeness metric gating all downstream level-metric computation"
  - "n*=min{n: Comp_n=1 ∧ A_n=1 ∧ N_viol,n=0 ∧ Ĥ(Q|R_n)≤ε}, with n*=NULL as an explicitly valid outcome"
  - "The three-dimension boundary diagnosis (Representation: N_viol>0∨Ĥ(Q|R)>0; Contract: A(R)<1; Operator: Ĥ(Q|R)=0∧F(R)<1), explicitly non-mutually-exclusive"
refines:
  - "M0198's corpus-integrity finding and M0200's stop-condition discipline: both operationalized into a complete, phase-by-phase engineering specification with explicit status vocabularies at every step"
