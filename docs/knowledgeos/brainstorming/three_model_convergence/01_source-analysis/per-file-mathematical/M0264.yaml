title: "Theory 11 — Statistical Inference Standards: the formal statistical toolkit backing the corpus's claims — exact Mantel-Haenszel OR/RD formulas with declared minimum stratum size (n_k≥200), a formal informative-stratum criterion, per-stratum CI formula as 'the diagnostic that exposed' the sign-only-replication failure, a new resolution-not-convenience stratification-variable principle (multiplicity PARTITION finer than redundancy count), and an explicit MH-homogeneity-must-be-shown-not-invoked rule"
