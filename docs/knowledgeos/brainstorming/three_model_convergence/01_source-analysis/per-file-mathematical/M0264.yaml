about: >
  Document 11 of the 15-document consolidated theory series, written explicitly "in the
  statistician's role... these are the standards the programme's claims are held to." Formalizes
  the corpus's entire statistical apparatus (Mantel-Haenszel stratification, replication criteria,
  effect-size floors, estimator hygiene, confounding standards, power analysis) with exact formulas
  and declared thresholds, largely consolidating already-recorded findings (M0257/M0260/M0263) into
  a single rigorous statistical reference, with several genuine formal additions not previously
  stated with this precision.
introduces:
  - "The estimand-naming principle: the programme's central error was estimating the WRONG quantity competently — marginal P(A|Z)-P(A|¬Z) (is Zero associated with adequacy?) vs within-stratum Σ_k w_k[P(A|Z,k)-P(A|¬Z,k)] (is it associated GIVEN the confounder?) — 'the estimand for any bridge claim is the within-stratum effect'"
  - "Exact Mantel-Haenszel estimator formulas given in full for the first time: OR_MH=Σa_kd_k/n_k / Σb_kc_k/n_k; RD_MH=Σw_k(a_k/(a_k+b_k)-c_k/(c_k+d_k))/Σw_k with weights w_k=(a_k+b_k)(c_k+d_k)/n_k — with a declared-before-inspection minimum stratum size, n_k≥200"
  - "A formal informative-stratum criterion: (a_k+b_k)>0 ∧ (c_k+d_k)>0 ∧ (a_k+c_k)>0 ∧ (b_k+d_k)>0 — both Zero and non-Zero occur, AND both Adequate and Inadequate occur — 'strata at deterministic extremes contribute nothing... balance is not power'"
  - "A new stratification-variable-choice principle: 'choose the stratification variable for RESOLUTION, not convenience' — redundancy COUNT is coarse; the multiplicity PARTITION is finer (r=2 is either 2+2 or 3+1); (partition,|S|) is finer still — 'finer strata gave 13× the informative strata and better confounder control at once' — supplying the precise statistical mechanism behind the corpus's already-known record-count/finer-stratification power gains"
  - "The exact per-stratum standard-error formula that served as 'the diagnostic that exposed' the sign-only-replication failure: SE(RD_k)=√(p1k(1-p1k)/n1k + p2k(1-p2k)/n2k)"
  - "A new explicit statistical-hygiene rule: 'report per-stratum RDs, not only the pooled MH estimate. A pooled estimate whose per-stratum signs disagree is not an effect; MH assumes homogeneity, and the assumption must be shown, not invoked'"
  - "Named sparse-table correction tools not previously listed: Haldane +0.5 continuity correction for the odds ratio, and Woolf's confidence interval on log OR, for sparse 2×2 tables"
  - "A crisp final reformulation of the power-analysis finding: 'power is a property of the informative region, not of n' — consolidated 4-lever table: population size n (none, 73/74/70 across 1500/4000/8000); flattening the confounder's distribution (none, 73→75); record count (73→233); finer stratification variable (~30→388) — 'two of four plausible levers do nothing... when power stops responding to sampling, the constraint has moved into the design'"
