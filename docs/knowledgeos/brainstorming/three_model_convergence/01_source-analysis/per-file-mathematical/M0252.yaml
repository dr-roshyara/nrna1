mathematical_content: >
  A cleaner three-way Zero taxonomy (Absence/Elimination/Balance), explicitly non-collapsible; a
  formalized argument/challenge contribution model with a Boundary(A,Y) domain-of-validity object;
  a ten-item experimental agenda for testing whether contributions form a genuine algebraic
  structure (compositionality, cancellation, associativity, identity, invertibility, ordering).
