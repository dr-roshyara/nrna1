  - "The corpus's much earlier Śūnya/Vedanta anti-reification discipline (established for the Gita/Vedanta material much earlier in the reconstruction): reapplied here to the newly-arising Śūnya/Nirvana/Moksha vocabulary in the contribution/polarity context, with an explicit refusal to claim literal identity with mathematical zero"
