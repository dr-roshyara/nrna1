about: >
  A direct answer to "are these the same" regarding the corpus-baseline '00/01' documents (compared
  in M0012) versus the newer atomic-claim K_t model (M0009/M0010): "No -- they are not the same,
  although there is a large and important overlap." Delivers a 26-row side-by-side comparison table
  classifying each concept as Same / Partial-Expanded / New-in-01 / New-in-later-work, and organizes
  the material into three explicit layers: Layer 1 (corpus-established results: Sigma!=K_i, K_t!=
  possible-worlds, Conflict permitted, non-deductive-closure, governance!=epistemic-update,
  information!=meaning!=knowledge -- all "corpus-backed, not recently invented"); Layer 2 (Dretske/
  mathematical extension: the full World->Observation->Channel->Signal->Information->Probability->
  Determination->K_t acquisition chain, not present in 00/01); Layer 3 (the newer atomic-claim
  mathematical K_t model itself: k_i=(O,d_i,v_i,t,E_i,C_i,p_i,q_i), X* != K_t != I_t(P,C), and the
  vector-valued gap G_t=(G_1,t,...,G_n,t) -- none of which 00/01 provide).

  **DELIVERS AN EXPLICIT FOUR-TAG PROVENANCE DISCIPLINE**: [CORPUS] (what the corpus itself already
  states, e.g. "K_t has competing definitions and unresolved formalization"); [EXT] (external
  mathematical structures -- Dretske, probability theory, information theory, DEL -- that provide
  candidate machinery); [INF] (what those external theories constrain a plausible K_t model to look
  like, or rule out); [PROP] (this research's own proposed construction, e.g. the atomic-claim
  tuple) -- explicitly named as "exactly the separation discipline your 00 document demands," i.e.
  a discipline this document is APPLYING (from an earlier corpus document) rather than inventing.

  **DELIVERS AN EXPLICIT ANTI-HINDSIGHT-BIAS CORRECTION**: "we should not retrospectively pretend
  that the newer atomic-claim model was already the corpus definition" -- given the corpus's own
  00 document states there are "two rival definitions of K_t and zero shared symbols," this
  document explicitly refuses to claim the newer [PROP] model as having been the corpus's answer
  all along. This is a direct, native instance of this reconstruction's own standing rule against
  hindsight bias, arising independently within the KR-SIM lane's own provenance discipline.

  **REFRAMES THE OVERALL RESEARCH STATE MORE CAUTIOUSLY**: replaces "we have now defined K_t" with
  "the corpus has not yet ratified a unique formal definition of K_t; external-theory analysis has
  ruled out or constrained several candidate interpretations; current research has produced a more
  explicit [PROP] candidate" -- an explicit downgrade of confidence relative to how the K_t work
  might otherwise be summarized.
