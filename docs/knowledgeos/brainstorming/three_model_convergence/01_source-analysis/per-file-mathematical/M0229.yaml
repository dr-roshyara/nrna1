mathematical_content: >
  Delivers the second genuine large-scale empirical dataset in this research programme (after
  KR-REP-REDUCTION at M0219): a massive four-way contingency table with real counts positively
  rejecting both directions of a Zero-adequacy implication, a precise stratified risk-difference
  analysis (RD: -0.363→-0.291→0.000) isolating redundancy as the confounding common cause, and a
  genuine, evidence-driven withdrawal of an initial explanatory mechanism when it failed to survive
  stratification — a rigorous applied-statistics result, not merely a qualitative negative finding.
