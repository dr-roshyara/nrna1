about: >
  Reports the actual executed results of KR-BRIDGE-01-ZERO-PRESERVATION-2026-09 (the definitive
  falsification-oriented bridge experiment specified at M0226) — the second genuine empirical dataset
  (after KR-REP-REDUCTION at M0219) for this research programme's central open question: whether
  Zero and preservation/adequacy are related. The result is a strongly executed, informative negative
  result: an apparent pooled correlation is shown to be entirely explained by a confound
  (redundancy), with a genuine mid-experiment self-correction when an initial explanatory mechanism
  failed to survive stratification, and disciplined governance conclusions throughout.
introduces:
  - "THE MASSIVE FOUR-WAY CONTINGENCY TABLE with real counts: Zero+Adequate=12,046; Zero+Inadequate=164,158; Non-Zero+Adequate=679,604; Non-Zero+Inadequate=894,192 — both off-diagonal cells enormous, giving two direct counterexamples: Zero⟹Adequate is FALSE (164,158 Zero+Inadequate cases) and Adequate⟹Zero is FALSE (679,604 Non-Zero+Adequate cases) — 'the experiment does not merely fail to establish a bridge; it POSITIVELY REJECTS necessity and sufficiency in this regime'"
  - "The central confounding-resolution finding, with precise risk-difference (RD) figures: pooled RD=-0.363 → transformation-stratified RD=-0.291 → transformation+redundancy-stratified RD=0.000 — demonstrating that the apparent pooled Zero/adequacy association is FULLY EXPLAINED by redundancy as a common cause, once properly stratified — the correct statement is 'in this experimental regime, the observed pooled association... is explained by redundancy; no residual Zero-adequacy association was observed after the specified stratification,' explicitly NOT 'Zero and preservation are universally independent'"
  - "A genuine mid-experiment self-correction, praised as exemplary methodology: an initial single-mechanism 'exact factorization' explanation for the Zero-count pattern was proposed, operationally tested across redundancy strata, and WITHDRAWN when it failed at stratum r=2 (Zero count varies there, breaking the factorization explanation; adequacy is simply uniformly zero) — 'a clean explanatory mechanism was generated, operationally tested, and rejected when it failed to explain all strata... a genuine demonstration that the governance discipline is functioning'"
  - "The single-informative-stratum limitation, correctly left unrepaired rather than patched post hoc: redundancy strata r=0 (Zero impossible), r=1 (informative — the only stratum actually driving the comparison), r=2 (adequacy uniformly zero), r=3 (Zero saturated) — the redundancy-as-common-cause conclusion is explicitly narrowed from a general causal claim to 'within the tested deduplication regime, redundancy behaves as a common cause of Zero occurrence and inadequacy'"
  - "Validation of pre-registration discipline via control A1: transformation T_B_lossy was pre-registered to produce adequacy<0.05 but actually measured 0.0916, and was explicitly NOT redefined after seeing the result — preserved as a worked example of 'pre-registered semantic labels ≠ observed empirical behavior'"
  - "Confirmation that the Q/Π anti-circularity design succeeded exactly as required by M0226: Q(D)=(argmax_source, #distinct tags) reads source/tag fields, while Π(R)=sorted value multiset reads the value field — they share NO field, making the negative bridge result 'substantially more credible' since it cannot trivially arise from Zero and preservation secretly sharing an observable"
  - "The KR-ZERO⊥KR-REP-REDUCTION decoupling upgraded from a purely designed/governance assumption (M0224) to an EVIDENCE-SUPPORTED research conclusion: 'not as a mathematical theorem, but as a governance/research conclusion supported by the current experimental evidence' — with explicit confirmation that the experiment correctly followed Outcome A discipline (M0226) by NOT inventing a new bridge hypothesis after the negative result"
  - "A second documented, praised instance of the Gita-material anti-reification discipline operating on live research output (after M0213's verse-2.50 rejection): a companion Gita interpretive study explicitly refuses to claim 'the Gita contains confounding analysis,' instead maintaining a strict separation between 'textual/philosophical lens → suggests a shape of reasoning' and 'experimental machinery → actually detects the confounding' — with stratification, not the Gita reading, remaining the actual scientific procedure"
  - "A precise wording tightening applied before freezing: 'Redundancy is a common cause of Zero and of inadequacy under dedup transformations' corrected to 'Within the tested deduplication regime, redundancy behaves as a common cause of Zero occurrence and inadequacy' — preventing a regime-specific empirical finding from silently becoming a general causal law, given the scope constraints (one informative stratum, one carrier, one Π, one Q, one principal Zero-producing transformation)"
  - "A clear, explicitly endorsed next-experiment direction: VARY Π AND Q (both were deliberately held fixed in KR-BRIDGE-01) — because a CONDITIONAL bridge Zero_{T,Π}(S;D)↔Adequacy_Q(D,T) could still exist for some particular (Π,Q) pair even though none appeared for the tested pair; the results explicitly identify M0226's own falsification questions Q4, Q5, and Q10 as still unanswered and pointing toward this next step"
  - "Explicit governance discipline reconfirmed: 'I would not move to a new algebra, carrier selection, or Vedic-derived operator yet' and 'I would keep the Gita strand exactly where it is: external interpretive lens, never machinery, never kernel primitive'"
