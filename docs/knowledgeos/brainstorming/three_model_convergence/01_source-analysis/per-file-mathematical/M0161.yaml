about: >
  A follow-up to M0156's Handbook review, proposing a disciplined "controlled theory patch" rather
  than another broad research section: twelve numbered FR items (FR-1 through FR-12), most promoted
  from candidate to explicit STRONG (theory-level) status, plus a genuinely new six-way typed
  UNKNOWN decomposition and a DerivationLineage concept stronger than ordinary Provenance.
introduces:
  - "A six-way typed UNKNOWN decomposition: U_rep (not represented), U_der (not derivable under S), U_avail (derivable but unavailable under resource boundary), U_evid (insufficient evidence), U_eval (evaluation cannot determine), U_scope (outside declared scope) — explicitly NOT to be flattened into one enum value, extending EVal=(Value,Reason,Boundary,...) rather than the flat T/F/U model — the most granular UNKNOWN typing in this reconstruction's read order, synthesizing Williamson's three-way (M0147) and Gödel's system-relative (M0150) classifications with two further computational-boundary-derived kinds"
  - "DerivationLineage (FR-8): stronger than ordinary provenance — 'derived epistemic content has a dependency lineage that may be invalidated when supporting commitments are revised, contracted or superseded'; Support(q)={p,p→q,...} as a candidate dependency-structure representation, distinguishing derivation dependency from mere origin-provenance"
  - "A general meta-theoretical principle explicitly generalized BEYOND revision: 'Semantic invariants constrain admissible operations but do not, by themselves, select a unique operation unless an additional selection criterion is established' — explicitly declared applicable to equality, evaluation, contradiction, aggregation, transition, and policy semantics, not merely to the AGM-derived revision-underdetermination finding it originates from — a candidate reusable methodological rule for the whole corpus"
  - "Model multiplicity as a candidate Determination foundation (FR-12): |ℳ(K,Γ)|=0 (inconsistency under the relevant model semantics) / =1 (model-level uniqueness) / >1 (underdetermination) — with the explicit warning ModelUniqueness≠KnowledgeDetermination, i.e. model uniqueness alone does not constitute a KnowledgeOS determination"
  - "DiscriminativePower(e,H) as a candidate evidence-quality property (evidence evaluated by which distinctions it preserves among admissible hypotheses) — explicitly NOT reviving N_eff (PairwiseDistinguishability⇏FamilyComplexity remains the frozen negative result)"
  - "The recommended controlled artifact 'KR-HR — KnowledgeOS Theory Integration from Handbook of Knowledge Representation', with an explicit promotion tiering: FR-1–FR-7 'eligible for theory promotion after corpus reconciliation', FR-8–FR-10 'strong candidates requiring one additional validation pass', FR-11–FR-12 'research candidates', while Contr/Zero/Sat/Equality/δ/Kernel-selection explicitly 'remain open' and 'unchanged'"
