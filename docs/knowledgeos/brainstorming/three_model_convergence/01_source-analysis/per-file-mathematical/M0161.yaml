  Restates the K^exp≠K^der, Derive_S, Avail_S⊆Cn_S, Revision/Contraction/Update, and adequacy
  formalisms from M0156 in a more consolidated FR-numbered form, and states |ℳ(K,Γ)|∈{0,1,>1} for the
