  - "The first fully LINEARIZED 13-stage proof dependency graph consolidating the entire apparatus built across M0235-M0241 into one explicit chain: 𝔠_KOS→𝔎_adm→ℳ_K→Tr_K→Obs_𝔠→⊑_𝔠→≡_sem→Cap_𝔠→≡_cap→ℬ→𝔎_adm^{-c}→Irred_sem→K⊨𝔠→MinKer"
