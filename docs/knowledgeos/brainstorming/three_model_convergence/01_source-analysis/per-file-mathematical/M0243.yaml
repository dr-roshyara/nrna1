  all already recorded at M0240), then adding one genuinely new methodological device: refusing to
  commit yet to the specific four-field capability representation c=(I_c,O_c,Γ_c,ℐ_c) proposed
  earlier, in favor of an intermediate, representation-agnostic abstraction Cap_𝔠(K).
introduces:
  - "The intermediate abstraction Cap_𝔠(K) — 'the contract-distinguishable semantic contribution' of an implementation K — introduced deliberately as a placeholder BEFORE committing to any specific representation of an individual capability (e.g. the four-field c=(I_c,O_c,Γ_c,ℐ_c) proposed in M0240/M0241), motivated by an explicit question left open on purpose: 'Is a capability itself a behavior, a relation, a transformation class, or an equivalence class of such objects?' — with the explicit warning: 'otherwise we risk replacing the old \"13 operators are primitives\" problem with a subtler version: \"these four fields constitute a capability\"'"
