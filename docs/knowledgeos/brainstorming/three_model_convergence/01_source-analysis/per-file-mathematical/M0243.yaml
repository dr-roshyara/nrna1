about: >
  A short acceptance pass over M0240's four-pass review, restating its eight core principles as
  "frozen" (operator-removal≠capability-removal; minimality-is-relative; capability-identity-before-
  basis; transition-semantics-primary; lossless-is-contract-relative; K_adm/K_sat separation;
