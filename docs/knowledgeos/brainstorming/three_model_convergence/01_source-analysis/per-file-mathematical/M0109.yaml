about: >
  Declares "the KnowledgeOS programme has reached a structural milestone. The broad conceptual
  space has been explored. The remaining work is concentrated around a small number of load-
  bearing semantic decisions," listing six corrections applied to a prior (unnamed, presumably
  earlier) TODO register: (1) Factivity does NOT block Contr -- contradiction semantics can be
  investigated independently; (2) Composition separated from Reduction as a distinct concern; (3)
  Projection/Invariant established as a parallel foundational lane, NOT dependent on delta; (4)
  ==_sem reframed as a candidate prerequisite for reduction, not an already-established foundation;
  (5) Kernel selection reframed as depending on whichever subset of TODO groups A-I proves
  load-bearing, not mechanically on every group; (6) N_eff permanently placed off the critical
  path, per FR-001.

  **EXPLICITLY REPRIORITIZES THE RESEARCH QUEUE**: whereas M0103/M0104/M0106/M0108 all state the
  queue as "Factivity -> Contr -> >=," this document's own Priority Order table places Contr FIRST
  (Priority 1, "immediate next experiment"), Factivity SECOND (Priority 2, "decision track, can
  proceed in parallel"), and >= THIRD (Priority 3) -- justified by the explicit dependency note
  under Group B: "Contr is the immediate next experiment. It does NOT depend on Factivity." This is
  presented as one of the six corrections, not as an unexplained reversal.

  **FORMALIZES TEN TODO GROUPS (A-J)**, each with a Status/Type/Dependency header, a governing
  question, background, sub-TODOs, and (where applicable) candidate resolutions:

  GROUP A -- Factivity (DECISION, does not block Contr): "does KnowledgeOS claim truth, or only
  epistemic warrant?" Four sub-TODOs (A1-A4: define knowledge without internal truth; decide
  factivity; locate factivity as mathematical-property/external-assumption/architectural-boundary/
  not-required; choose among three candidate resolutions). THE THREE CANDIDATES: Rename (A_t =
  Attributed State, Knows external -- "honest but semantically weaker"); Externalize (factivity
  verified outside the kernel, kernel emits claims -- cites a NEW QUANTIFIED RESULT: "88.25%
  survival rate measurable under tested conditions," explicitly marked "an experimental result, not
  an architectural recommendation"); Hybrid (kernel emits attributed states, some factive some not
  -- "most complex but most expressive").

  GROUP B -- Contr (EXPERIMENT, does not depend on Factivity, PRIORITY 1): "can contradiction be
  represented without confusing it with uncertainty, absence, insufficient evidence, or theory
  incompleteness?" Four candidates (Fourth Value C added to the codomain; Delegate-to-Consistency,
  which "makes content depend on a blocked class"; Exclusive-by-Construction, which "silently loses
  the contradiction"; Structured Evaluation EVal=(value,reason,provenance), "most expressive; keeps
  contradiction distinct"). States the real question as "determine the minimum evaluation domain
  required -- then C may emerge, or may not. Do not let the simulator force the theory to supply a
  value merely because the simulator needs one" -- a disciplined methodological warning against
  reverse-engineering theory from implementation convenience.

  GROUP C -- >= (DECISION/DEFINITION, conceptual analysis can begin independently): "how does
  KnowledgeOS order epistemic progress?" Cites 1,491 claims specifying no ordering (matching
  M0099/M0106's already-sourced figure) and the Linga-Yoni finding that generation != progress.
  Five sub-TODOs (define what is ordered; define x>=y explicitly; determine order type -- preorder/
  partial/total/preference/dominance/admissibility; keep admissibility != ranking != selection
  explicit since scalar ranking can manufacture uniqueness; define multiple orderings for accuracy/
  coverage/decision/robustness separately). Real question: "there may be no universal total
  ordering. Progress may be multi-dimensional."

  GROUP D -- ==_sem (DEFINITION, candidate prerequisite not established foundation): eight
  sub-TODOs (semantic contract scope; identity scope; context/temporal/provenance sensitivity;
  observational-vs-semantic-vs-operational equivalence types; decidability; identity relationship).
  Real question: "equivalence + required invariants + observability + adequacy + operational
  preservation may all be needed" for reduction -- not equivalence alone.

  GROUP E -- delta (DEFINITION, static semantics can be studied independently): signature, causes,
  composition, and closure semantics (reaffirming ClosureEvent != ClosureState).

  GROUP F -- Lifecycle/Retirement (DEFINITION, related to delta but separate): retirement,
  retraction, supersession, expiration, and the explicit warning "don't assume these are states --
  investigate relations/events, not automatically a state machine."

  GROUP G -- Composition (REDUCTION, separate from Reduction proper): evaluation/transition/
  structure composition.

  GROUP H -- Projection/Invariant Framework (RESEARCH, parallel foundational lane, not dependent on
  delta): five sub-TODOs formalizing M0098/M0099's Structure->Projection->Induced-Equivalence->
  Information-Loss->Invariant-Preservation->Adequacy chain, invariant custody, and the Adequacy
  Principle, with the real question "this may be the mathematical foundation of the entire
  KnowledgeOS kernel."

  GROUP I -- Reduction (REDUCTION, depends on ==_sem, Composition, Invariant framework): defining
  reduction criteria, applying the Adequacy Principle, identifying invariant-bearing distinctions,
  and determining whether a minimal rich structure actually exists.

  GROUP J -- Kernel Selection (REDUCTION+GOVERNANCE, depends on the load-bearing subset of A-I):
  reaffirms "Kernel = NOT SELECTABLE" as the verdict (not merely "unfinished"), with the explicit
  statement "kernel selection depends on the subset of A-I that is demonstrated to be semantically
  load-bearing. Some TODOs may eventually be shown not to belong in the kernel at all... Kernel
  Selection blocks Theory v1.3."

  **PRESENTS A REVISED DEPENDENCY GRAPH**: a Semantic Lane (Factivity/Contr/>= -> Evaluation
  Semantics) running in parallel with a Structural Lane (Projection/Invariant and ==_sem ->
  Reduction -> {delta, Lifecycle, Composition}) converging at Kernel Selection -> Theory v1.3?,
  with N_eff explicitly annotated as permanently off this critical path.

  **DELIVERS A FULL PRIORITY-ORDER TABLE (1-10)** and a "WHAT NOT TO DO" TABLE (seven items:
  continuing the N_eff formula hunt; making Factivity block Contr; making Yoni/Linga architecture;
  making Gita concepts into primitives; implementing the eight Sat classes prematurely; selecting
  the kernel yet; creating Theory v1.3 yet) -- a consolidated, actionable anti-pattern list drawing
  together discipline established across many prior documents in this pass.
