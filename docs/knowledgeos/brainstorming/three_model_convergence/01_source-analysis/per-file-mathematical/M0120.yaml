about: >
  Reviews W-KR-CONTR-2026-09, which tests "what evaluation structure is minimally required to
  preserve the distinctions the KnowledgeOS programme has already declared important," reporting:
  Candidate A (fourth value) 7/12; B (delegation) 7/12; C (exclusive construction) 7/12; D
  (structured evaluation) 12/12 -- with the critical observation that A, B, and C fail on the SAME
  seven distinctions, and those failures collapse the UNKNOWN FAMILY (Unobservable ==
  InsufficientEvidence == Underdetermined == TheoryIncomplete == ... -> U), not the contradiction
  dimension: "adding another value for contradiction does not solve a problem whose missing
  distinctions lie outside the contradiction dimension."

  **THE CHROMATIC-NUMBER RESULT, CAREFULLY BOUNDED**: the experiment builds a "must-differ" graph
  over required distinctions and finds chi(G)=3, so the tested required distinctions do NOT
  mathematically force a four-valued flat evaluation domain -- but this "does not establish that
  the correct evaluation domain has three values," only that "given this particular required-
  distinction set and adequacy criterion, at least three distinguishable flat classes are
  required." Immediately qualified by the stronger, structural result: the nine no-determinate-
  value conditions CANNOT be adequately represented by ANY flat value domain, regardless of
  cardinality -- "the obstruction is structural rather than cardinal," explicitly named "the
  headline finding." Yields the methodological principle: "cardinality sufficiency != semantic
  adequacy" (colorability only proves pairwise coding capacity under the chosen abstraction, not
  that the resulting values carry the required semantic/operational meaning).

  **THE REAL MINIMUM REPRESENTATION IS TWO FIELDS, NOT THREE VALUES**: exhaustive search finds
  min|representation|=2, with two minimum representations {value,reason} and {polarity,reason} --
  "reason is indispensable," CAREFULLY SOFTENED to "within the tested representation language and
  candidate fields, an explicit reason/boundary component is indispensable for separating the
  required distinctions" (explicitly not an absolute claim, since Reason(x)=x could trivially
  encode everything). Proposes distinguishing FLAT semantics (Eval:X->V) from STRUCTURED semantics
  (Eval:X->V x R) as new research vocabulary, with Candidate D reframed as a genuine product/
  structured evaluation space E = V x R, "structurally closer to what Zero Lens has been
  discovering" -- NOT simply a richer many-valued logic.

  **CANDIDATE C's FAILURE EXPOSES A GENUINE INVARIANT-SUITE COVERAGE GAP**: Candidate C maps
  Contradiction -> T (Satisfied) yet PASSES invariants I1-I5, because those invariants only test
  Contr against the UNKNOWN family, never against SATISFACTION itself -- "an invariant suite that
  checks only the separation of contradiction from the unknown family can allow contradiction to
  collapse into satisfaction." Yields "passing invariants does not imply semantic adequacy" and
  motivates a new candidate invariant I11: Contr != Satisfied, explicitly kept as [PROP], not
  canon, with the discipline "do not fix the history by retroactively declaring the invariant
  suite complete" -- preserving the conflict (I1-I5 pass, capability guard fails) as a recorded
  fact rather than papering over it.

  **INTRODUCES "SAME STATUS DOES NOT IMPLY SEMANTIC EQUIVALENCE" AS A NEW ==_sem PRINCIPLE**:
  Eval_1(p)=U and Eval_2(p)=U does not imply Eval_1 ==_sem Eval_2, because the underlying reasons
  may differ (Unobservable vs InsufficientEvidence) and downstream operations may distinguish
  them -- a genuinely new candidate observation principle for the corpus's semantic-equivalence
  work, distinct from (though compatible with) the previously-established equivalence-relation
  requirements (FR-001, M0119's representative-invariance principle).

  **REFRAMES THE OVERALL DEPENDENCY CHAIN, PLACING CONTRADICTION AS ONE DISTINCTION AMONG MANY,
  NOT THE ROOT**: Required Distinctions -> Evaluation Representation -> Typed Boundary/Reason ->
  Composition -> Aggregation -> Zero -> Determination, with Contradiction explicitly demoted to
  "one particular required distinction" feeding this chain, rather than the chain's starting
  point -- "a significant architectural clarification," reversing the earlier framing where
  contradiction drove the whole investigation.

  **RESOLVES A GENUINE ID-COLLISION** between this new structured-evaluation experiment and
  M0116's earlier model-separation experiment: renames M0116's experiment KR-CONTR-MODELS-2026-09
  (alias KR-CONTR-2026-09, legacy), assigning this new experiment the canonical KR-CONTR-2026-09
  ID (or KR-CONTR-EVAL-2026-09 if a scope suffix is permitted), with explicit cross-provenance
  notes in both artifacts -- careful corpus-hygiene discipline, though it creates a SECOND
  candidate "FR-002" proposal (thirteen items, about structured evaluation) DISTINCT FROM M0116's
  own candidate FR-002 (ten items, about M3/M4 model isomorphism) -- a fresh ID-collision risk this
  document does not itself flag, left noted here for the eventual reclassification pass.

  **PROPOSES KR-COMP-2026-09 (Composition of Structured Evaluation)** as the next experiment, with
  a precise decisive test: does there exist x,y,op such that Compose_structured(x,y,op) is NOT
  equivalent to Encode(Compose_flat(Encode(x),Encode(y),op))? -- if such a witness exists, the
  structured representation has genuine semantic power beyond mere metadata. Recommends a
  reformulated Priest extraction targeting exactly this: semantic values, designated values,
  truth-function composition, consequence, negation, conjunction, implication, and which
  KnowledgeOS distinctions could or could not be represented by flat versus structured systems.

  **HANDLES THE GITA MATERIAL WITH APPROVED DISCIPLINE**: the 18.63 observation (exhaustion of
  presented reasoning -> return of resolution to Arjuna) is endorsed as corroboration/lens only,
  mapped onto the already-established Determination!=Decision!=Authorization!=Action separation;
  the samsaya (doubt->inquiry) versus visada (halt/impairment) distinction is noted as potentially
  useful for distinguishing epistemic uncertainty from agent inability/unwillingness, but
  explicitly "interpretive research, not architecture," producing no kernel candidate.

  Closes: "Theory v1.2 remains unchanged. Contr remains OPEN. Composition is promoted to the
  immediate research target... use Priest specifically to formalize the value/composition side
  before running KR-COMP-2026-09."
