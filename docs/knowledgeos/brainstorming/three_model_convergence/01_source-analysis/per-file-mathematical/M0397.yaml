about: >
  A genuine, substantive Gita-content document: a direct textual analysis of Bhagavad Gita Chapter 3 (Karma Yoga, 43 verses), explicitly distinguishing itself from mere metaphor-borrowing ('not Karma Yoga = KnowledgeOS action'). Extracts Arjuna's opening fact-finding problem (an apparent Knowledge->Action inconsistency), the discipline that action cannot be deferred until perfect knowledge is reached, the yajna-rain-food causal cycle read as a structural/systemic (not merely religious) explanation exercise for tracing dependencies behind an observation, and the 'doer' problem (3.27-28) read as a provenance/action-attribution question (ActionOccurrence != ActionAttribution). Concludes with a proposed KR-FACTFINDING-ACTION-2026-09 research artifact distinguishing Determination != Action Readiness != Decision != Authorization != Action, explicitly declining to modify the currently-frozen KR-ZOOM-FACTFINDING-01 experiment.
introduces:
