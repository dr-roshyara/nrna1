title: "Three-pass synthesis integrating the dialectical Argument/Challenge/Balance model (M0252) into KR-ALGEBRA as a new Contribution/Challenge sub-lane — catches and corrects FOUR genuine methodological errors in the already-recorded M0249 document (sufficiency-statistic mislabeling, DPI mislabeling, entropy-distribution overreach, axiom-vs-hypothesis renaming), then a final self-correcting pass catches a CIRCULARITY in the BalanceZero formulation itself (it pre-assumes the very algebra the experiment is meant to discover) and a genuine Balance≠loss-of-information distinction, converging on a properly neutral pre-registered KR-CONTRIBUTION-01 experiment with an eight-hypothesis discovery ladder"
