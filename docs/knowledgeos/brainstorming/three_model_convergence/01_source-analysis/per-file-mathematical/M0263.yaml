title: "Theory 10 — Experimental Methodology and Falsification Engineering: the master methodology consolidation, every rule traced to a specific origin failure — reveals TWO PREVIOUSLY UNRECORDED EXPERIMENTS (KR-ZOOM-03, KR-ZOOM-OUT-01) whose post-hoc estimand/population choices had to be rejected despite crossing the significance floor, a dated experimental-protocol freeze (2026-09-05) introducing a new Estimand Non-Degeneracy Preflight (O-F*) gate, a genuinely important provenance-check-discriminates finding (the same check both dissolved a prior 'case J' finding AND strengthened the interaction-order finding), and a SECOND instance of verbatim wording matching this actual project's own real CLAUDE.md engineering discipline ('engineering supplies evidence and never accepts its own work')"
