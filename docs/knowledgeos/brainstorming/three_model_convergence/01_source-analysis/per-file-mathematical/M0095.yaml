about: >
  Rejects four claims from an antecedent "Linga's Millions" document with specific formal
  counterarguments: (A) "Knowledge = one selected proposal" -- rejected because Knowledge !=
  Determination != AcceptedHypothesis != EpistemicState, and Select(H)=P* does not imply Knows(P*),
  at most Accepted(P*) (the unresolved factivity problem); (B) "the field selects the best
  proposal" -- rejected because a selection function presupposes a comparison/evaluation relation
  (>=) that the corpus does not yet have; (C) "one candidate survives" -- rejected because the
  corpus's own set-valued-determination work already establishes |A_Q| in {0,1,>1}, so "Million ->
  One" must become "Many Candidates -> Admissible Candidate Set"; (D) "most hypotheses are false"
  -- rejected as an empirical property of a specific generator, not a universal mathematical fact.

  **EXTRACTS A GENUINE FIVE-STAGE MATHEMATICAL PIPELINE**: G_t(K_t,Q_t)->H_t (Generation),
  A_t(H_t,E_t,M_t,S_t,C_t)->V_t (Assessment, producing a structured assessment vector per
  hypothesis, e.g. Evidence/Consistency/ExplanatoryPower/PredictivePerformance/Robustness/
  AssumptionCost), S_t(H_t,V_t)->A_t (Selection, as a POWER-SET-valued map Select: H_Q x V_t ->
  P(H_Q), replacing the antecedent's single-winner argmax), D_t(A_t,Q_t)->D_t (Determination), and
  Gamma_t(D_t,E_t,factivity-policy)->K_t^attrib (Knowledge Attribution) -- "substantially more
  rigorous than the original K_new = Transform(Select(Millions,E,C,S),Y)."

  **INTRODUCES CANDIDATE REDUCTION rho_t = 1 - |H_{t+1}|/|H_t|** as a measure of FILTERING, not
  knowledge gain -- explicitly distinguished, "that distinction is critical" -- and reframes the
  biological funnel (10^6 -> 10^4 -> 10^2 -> 7 -> 2) as a candidate funnel with no requirement the
  final count equal one.

  **PROPOSES PARTIAL ORDERING >= OVER MULTI-CRITERIA ASSESSMENT VECTORS AS SUPERIOR TO SCALAR
  argmax**: rejects the antecedent's arg-max_i f(E_i,C_i,X_i) as either requiring arbitrary
  weights (f = w1*E+w2*C+w3*X) or a partial order H_i >= H_j; works a concrete non-dominance
  example (H1 stronger evidence/weaker explanatory power; H2 the reverse; neither dominates, so
  both survive, A_Q={H1,H2}) and explicitly notes "the Linga's Millions model has accidentally
  brought us directly to one of our existing theoretical bottlenecks" -- the corpus's own
  unfinished >= relation, corroborating (not deriving) its centrality from an independent source.

  **ESTABLISHES Selection != Determination != Knowledge AS A HARD DDD BOUNDARY** with a worked
  example: Selection reduces 100 hypotheses to A_Q={H1,H2} (successful filtering), but
  Determination(Q) = "cannot determine uniquely" -- so Candidate reduction != Determination, and
  even a singleton A_Q={H1} gives Determined(H1) but not automatically Knows(H1), requiring "the
  unresolved factivity mechanism" -- yielding the five-link chain Generation -> Assessment ->
  Selection -> Determination -> Knowledge Attribution, each a distinct responsibility.

  **DELIVERS A GENUINELY NEW STATISTICAL CONTRIBUTION NOT PREVIOUSLY RECORDED IN THIS PASS**:
  identifies the "million-to-one" model as instantiating the statistical phenomenon of SELECTION
  BIAS / MULTIPLE COMPARISONS / WINNER'S CURSE -- "if you generate millions of hypotheses and then
  select the strongest-performing one, you can get max_i Score(H_i) that looks impressive even
  when all candidates are noise... Best observed candidate != Best underlying hypothesis... If an
  AI generates 10,000 candidate explanations and picks the one with the best apparent fit, it may
  simply be selecting the best overfit." This yields a new KnowledgeOS requirement, "Selection must
  be separated from validation," formalized as an anti-overfitting principle: H* = argmax_H
  S_train(H) does NOT imply H* = argmax_H S_future(H), giving Selection Evidence != Validation
  Evidence as "potentially a very important architectural distinction" -- directly and specifically
  relevant to any AI-driven hypothesis-generation component of KnowledgeOS.

  **PROPOSES THE KR-M2O-2026-09-02 CANDIDATE-MULTIPLICITY EXPERIMENT**: vary hypothesis count N in
  {1,10,100,1000,10000} under identical evidence, measure candidate reduction/unique-determination
  rate/false-selection rate/validation-failure rate/hypothesis diversity/inter-candidate
  dependence, compare scalar ranking vs. partial-order selection vs. threshold admissibility vs.
  Bayesian posterior ranking vs. multi-criteria Pareto selection, testing the adversarial
  hypothesis H0: "more candidate generation does not necessarily improve epistemic quality" --
  explicitly predicting "I strongly suspect this will survive."

  **RECONFIRMS THE ALREADY-FLAGGED UNRESOLVED Freedman/Dretske CITATIONS**: cites "our previous
  statistical work on Freedman, Good, Bayesian epistemology, Dretske, state estimation" as directly
  relevant to the validation-evidence distinction -- the third sighting of Freedman and Dretske in
  this pass (first flagged at M0044), still unattributed/unresolved.

  Proposes clean DDD vocabulary separation: bounded-context terms (Hypothesis/Candidate/
  Generation, EvidenceAssessment/Support/Defeat/Contradiction/Consistency/ExplanatoryPower,
  Admissibility/CandidateSet/SelectionCriterion/SelectionResult, Determination/
  UniqueDetermination/MultipleDetermination/NoDetermination, KnowledgeAttribution/Factivity,
  EpistemicTransition/Revision/Supersession/EmergentProduct) versus philosophical/interpretive-
  context terms kept separate (Linga/Yoni/Millions/Fertilization/Offspring) -- "that is the clean
  DDD boundary."

  Closes with an explicit refusal to amend Theory v1.2 pending the candidate-multiplicity
  experiment, framing the decisive question as "whether Selection, Assessment, or CandidateSet
  introduces any irreducible capability that the existing kernel reduction experiments could not
  already derive" -- directly echoing M0094's minimality-testing discipline applied to this
  document's own new constructs.
