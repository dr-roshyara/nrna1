about: >
  Document 04 of the 15-document consolidated theory series (M0255-M0256), sourced explicitly from
  KR-REP-REDUCTION-2026-09 and its audit. Consolidates the entropy/adequacy apparatus into its
  final rigorously-tagged form: the Data Processing Inequality as the theory's sole borrowed
  theorem, the exact N_viol statistic as authoritative over the biased plug-in entropy estimate,
  a corrected epistemic-status history for the adequacy-non-monotonicity hypothesis, the permanent
  sequential-vs-parallel scope distinction, a genuinely new multi-dimensional-reduction finding
  refuting any single-scalar reduction measure, and a properly contained bootstrap-CI defect.
introduces:
  - "The operational fiber Q-homogeneity definition of Adequate(D): Adequate(D)⟺|{Q(D'):T(D')=T(D)}|=1, with an explicit [DEFECT] flag that adequacy so defined is population-dependent by construction (a property of (T,Q,population), not of (T,Q)) — checked (informativeness flat across n=1500/4000/8000), not assumed, but 'the dependence is real and any transfer must re-establish it'"
  - "N_viol = the exact number of conflicting Q-pairs within a representation fiber: N_viol=#{(D1,D2):T(D1)=T(D2), Q(D1)≠Q(D2)} — explicitly declared exact and bias-free where Ĥ (plug-in entropy estimate) has known small-sample bias, and 'authoritative for the question is adequacy exactly zero? — because that question is combinatorial, not estimative'; the Miller-Madow bias correction formula Ĥ_MM=Ĥ_plug+(K-1)/(2Nln2) is given for wherever Ĥ IS reported"
  - "THE ONE THEOREM IN THE WHOLE THEORY, explicitly and humbly labeled: the Data Processing Inequality for a deterministic sequential chain, H(Q|R5)≤H(Q|R4)≤H(Q|R3)≤H(Q|R2) — 'proof: standard, cited, not re-derived here. This is the only [THM] in the theory, and it is not ours. Stating that plainly is the point of the status vocabulary'"
  - "'THE CORRECTION THAT MATTERS' — the definitive final reclassification of the adequacy-non-monotonicity hypothesis (H-C): originally recorded as 'refuted a priori' — corrected to recognize the distinction a priori impossible ≠ empirically falsified: 'Hypothesis H-C was unfalsifiable in the negative direction from the start. It was not defeated by data; it was ill-posed against a sequential design. Recording it as refuted would have credited the experiment with a result it could not have produced'"
  - "A reframing of the DPI-obeying empirical check itself: 'the empirical check was still run and is still worth having: it confirms the implementation obeys the DPI, which is a correctness check on the code, not a test of the hypothesis' — a crisp epistemic-status distinction between validating an implementation and testing a scientific claim"
  - "THE PERMANENT SEQUENTIAL-VS-PARALLEL SCOPE DISTINCTION, elevated to a permanent feature of the theory: the DPI applies to sequential families (Rk=Tk(Rk+1)) but NOT to parallel families (Rk=Tk(D) computed directly from D, where non-monotone adequacy is perfectly possible) — 'sequential vs parallel is therefore a permanent distinction in the theory, not a detail of one design' — with the explicit confirmation that 'KR-BRIDGE-01/02/03 deliberately used a parallel family for exactly this reason,' legitimizing all three bridge experiments (including the previously-unrecorded KR-BRIDGE-03, M0256) as intentionally scope-matched designs"
  - "A genuinely new MULTI-DIMENSIONAL-REDUCTION finding with concrete measured numbers: at R5, 37.0 bytes / 2 fields / 26,826 distinct values / Ĥ(R)=15.042; at R4, 37.0 bytes / 2 fields / 5,696 distinct values / Ĥ(R)=12.307 — 'bytes are FLAT across R5→R3 while cardinality falls 8×. Fields never change' — [NEG]: 'reduction dimensions cannot be treated as independent, and cannot be collapsed into a single size scalar... a design that measures how much was reduced with one number is measuring nothing'"
  - "A scope-limiting entropy-floor observation: Ĥ(R)≥Ĥ(Q) at EVERY tested level (Ĥ(Q)=5.0098 bits over 39 distinct answers, against 15.04 bits at R5) — 'representation entropy never dropped below inquiry entropy in the tested chain, so the chain never approached the information-theoretic floor' — an explicit acknowledgment that the tested reduction chain never got close to its theoretical limit"
  - "A properly CONTAINED estimator-hygiene [DEFECT]: bootstrap confidence intervals on Ĥ are INVALID in this design, because resampling with replacement duplicates cases, shrinks fiber diversity, and 'depresses conditional entropy downward,' biasing reported CIs toward 'adequate' — CONTAINMENT explicitly stated: every adequacy verdict in the programme rests on N_viol (exact) and the train/test split, NOT the bootstrap CI — 'the defect is recorded, its blast radius is stated, and no conclusion depends on it' — [REC]: a valid interval requires resampling at the fiber-structure level (not attempted, [OPEN])"
  - "An 11-row final consolidated status register summarizing every claim in the document with its exact epistemic tag ([DEF]/[DEFECT]/[EXP]/[THM]/[COR]/[NEG]/[OPEN])"
