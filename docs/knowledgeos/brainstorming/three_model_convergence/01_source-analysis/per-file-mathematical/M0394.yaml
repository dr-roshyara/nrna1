about: >
  Explicitly rejects using the Gang-of-Four (GoF) Design Patterns book to derive KnowledgeOS primitives directly, instead proposing it as a comparative/falsification lens: test whether candidate KnowledgeOS operations (e.g. ZoomIn) are genuinely distinct/irreducible by asking the same structural questions GoF asks of its own 23 patterns (intent, applicability, constraints, participants, collaboration, consequences, trade-offs, related patterns). Central meta-principle: Pattern != Primitive and Pattern != Implementation.
introduces:
