title: "Theory 08 — Contradiction, Evaluation Structure, Composition, Factivity: the 'other lane' of the programme (explicitly KR-ZERO⊥KR-REP-REDUCTION), consolidating the much-earlier Contradiction/Composition/Factivity thread into final form — reframes the contradiction problem as actually a boundary/unknown problem, corrects an overclaim ('reason is the sole indispensable field'), answers the reason-expressivity objection directly, delivers a new witness-construction methodological finding ('the separating witness must have NO internal conflict'), and names DECISION-02 (is φ a frame or a partition?) as 'the single largest open governance item in the lane'"
