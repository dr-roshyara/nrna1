about: >
  Document 08 of the 15-document consolidated theory series, explicitly self-identified as "the
  other lane of the programme," governed separately from documents 03-07 (KR-ZERO⊥KR-REP-
  REDUCTION). Consolidates the much-earlier Contradiction/Composition/Factivity research thread
  (KR-CONTR-MODELS/EVAL/FDE, KR-COMP, KR-COMP-SEP, DECISION-01, DECISION-02, the factivity
  adjudication) into its final rigorously-tagged form, with several genuine refinements: a crisper
  reframing that the apparent contradiction problem is actually a boundary/unknown problem, a
  corrected overclaim about reason's indispensability, a direct answer to the reason-expressivity
  objection, a new witness-construction methodological principle, and a clear naming of DECISION-02
  as the single largest open blocking governance item in this lane.
introduces:
  - "The final, crisply reframed negative result: 'KnowledgeOS requires four-valued logic' is NOT supported — flat candidates A/B/C fail the SAME SEVEN required distinctions, and their common failure lies in the unknown/boundary family, NOT in contradiction at all — 'the problem that looked like a contradiction problem is a boundary/unknown problem'"
  - "A corrected overclaim, explicitly labeled as a correction 'by measurement, not by rewording': the original claim 'reason is the sole indispensable field' was too strong — corrected to 'a structured reason/boundary component is indispensable within the tested candidate representation language'"
  - "A crisp, generalizable epistemic principle: 'minimum flat cardinality depends on the declared required-distinction set. There is no context-free answer to \"how many truth values do we need\"; the question is ill-posed without the distinction set'"
  - "A new [PRP]-tagged required candidate invariant: Contr≠Satisfied — explicitly stated separately rather than assumed to follow from interface tests, because Candidate C can map contradiction to Satisfied while passing tests I1-I5"
  - "The final cardinality-is-the-wrong-axis framing for KR-CONTR-EVAL: the structural requirement grew the state space from χ=3 to χ=21, but 'the finding is not \"we need 21 values.\" It is that cardinality is the wrong axis. Adding flat values does not buy the distinctions; adding structure does'"
  - "A direct, previously-unrecorded answer to the reason-expressivity objection: 'a trivial Reason(x)=x would make reason is indispensable vacuous. It was tested — reason takes 10 values in the tested language, and the finding survives factorization' — closing a real methodological gap that could otherwise have made the reason-indispensability finding empty"
  - "A three-witness composition-elimination table for KR-COMP-SEP: W1 (the commissioned witness shape) unexpectedly ELIMINATES last-wins (a C1 failure on all six surviving triples) instead of separating the three candidate rules as intended; W2 (the actual separator) separates majority from intraframe-only; C6 order-invariance eliminates last-wins a SECOND, independent time"
  - "A new witness-construction methodological principle: 'adding internal conflict to a witness DESTROYS the separation rather than creating it. The two surviving rules differ only in what they do when NO frame conflicts internally — exactly the case the commissioned shape excludes by construction. The separating witness must have NO internal conflict'"
  - "Two further reasons last-wins is eliminated: it reports W1 as negative-support rather than conflict (reads only the last frame, discards the internally-contradictory one entirely); and it is not well-defined on the evidence set because its output depends on enumeration order — 'a composition rule must be a function of the evidence set, not of its listing'"
  - "A specific detail on the factivity repair: 'an earlier evaluator returned T for uninterpreted/theory-incomplete states, which was a defect and unfair to the competing candidate. The strengthened evaluator carries an explicit evaluator_exists flag'"
  - "The two standing decisions given their final register status: DECISION-01 RATIFIED (semantic evaluation must be invariant under non-evidential variation; C6/C7 are instances), with the rank-convention result explicitly re-confirmed as NOT a further instance (21,369 tie violations, per Document 06); and DECISION-02 explicitly named as 'the single largest open governance item in the lane' — Is φ a semantic evaluation frame, or an evidence partition? [OPEN], blocking both the composition rule and the δ transition — 'nothing downstream of it may be settled by inference from the experiments — the experiments constrain it, they do not decide it'"
