about: >
  A formal, deliberately non-promotional master reference ("nothing here promotes anything")
  consolidating the entire KnowledgeOS v1.1/v1.2 research programme. Opens with a precise
  three-term glossary (BASELINE = the theory experiments run against, changed only by adjudicated
  theoretical change; FROZEN = supervisory-review-closed in that form, e.g. FR-001; PROPOSED =
  candidate, tested or not, not adopted), with the load-bearing discipline: "freezing is not
  promotion... a frozen [NEG] stays [NEG]," and a frozen entry may be cited, superseded by an
  explicit act, or reopened by naming new evidence, but never silently revised or re-litigated by
  rerunning the same experiment.

  **STATES THE v1.2 BASELINE'S FOUR CONSTITUTIVE MOVES AND CURRENT STATUS**: (1) a constitutional
  four-layer separation (Philosophy -> Epistemic mathematics -> DDD -> Architecture) with an
  explicit ban on the inference chain Gita-concept -> mathematical-concept -> primitive -> DDD-
  object -> architecture; (2) an eleven-value epistemic status vocabulary (ESTABLISHED, DERIVED,
  BOUNDED, HYPOTHESIS, INTERPRETATION, CORROBORATION, NORMATIVE, TECHNICALLY OPEN, DEFERRED,
  REFUTED, UNKNOWN) applied to every claim; (3) reopening several v1.1 closures (Observation
  reopened; Zero demoted from construct to candidate boundary-construct; E_t!=K_t demoted from
  correction to research distinction; Buddhi and Sarathi become lenses, not domain objects); (4)
  three-valued class-indexed satisfaction Sat: K x R -> {top,bottom,U} over eight requirement
  classes. States v1.2's status after thirteen experiments: Theory = B (PARTIALLY EXECUTABLE);
  Sat = SEMANTICALLY INCOHERENT under its own proposed model; Kernel = NOT SELECTABLE (explicitly
  "not 'unfinished'"); Factivity = OPEN.

  **PRESENTS FR-001 (M0103/M0104's KR-DIST FREEZE) IN ITS FULLY DETAILED, QUANTIFIED FORM**,
  supplying the exact regime parameters and numbers only summarized elsewhere: Lambda=(m,sigma,
  alpha)=(40,1.0,0.05), standard error 0.1581, resolution delta=0.3099, twelve hypotheses spaced at
  0.9*delta, endpoint span 3.068 -- confirming the corpus's already-tracked non-transitivity
  counterexample with its exact numeric construction. Adds a methodology catch not previously
  recorded in this pass: "a direct search for a transitivity witness inside the equicorrelated
  space found none -- there every pair has the same separation, so the relation is vacuously
  transitive. Non-transitivity appears only where separations vary. A homogeneous test space
  conceals the defect." Presents the full six-row packing-vs-measured-N_eff table with exact ratios
  (0.98, 0.99, 1.06, 4.99, 111, 222), stating "packing matches redundancy to within 6% and fails on
  coupling by up to 222x" -- confirming and sourcing M0104's "222x" figure precisely.

  **RESOLVES TWO OF THE THREE PREVIOUSLY-UNVERIFIED QUANTIFIED CLAIMS FLAGGED IN M0099**: (1)
  "83% of progress claims in the corpus specify no ordering -- 1,491 of 1,793" -- this is the exact
  source and denominator for M0099's cited "1,491 claims unspecified," now fully sourced and
  quantified (83% = 1491/1793). (2) "typed facet conditions -- only 2 of 11 facets need typing; 37
  of 41 distinctions unsupported" -- this is the exact source and denominator for M0099's cited "37
  distinctions unsupported," now fully sourced (37/41). NEITHER document explicitly cross-
  references the other by name, but the numbers match exactly, confirming these are genuine,
  traceable corpus statistics rather than unsupported assertions. (3) M0099's separate "13 and 8
  are both minima under different algebras" figure is ALSO independently confirmed here --
  "Minimality is representation-relative -- |K_min| = 13 and 8 under two algebras -- exhaustive
  over 16,384 subsets" -- fully sourcing that figure too, with its exact search-space size.
  HOWEVER, M0102's DISTINCT figures ("14 irreducible powers under one representation; 12
  irreducible operators under another") appear NOWHERE in this master reference's kernel-
  minimality entries, which cite only 13-and-8 -- leaving M0102's 14-vs-12 figures an unreconciled
  outlier not corroborated by this otherwise comprehensive index, strengthening the case that
  M0102's citation is either a garbled restatement of the 13-vs-8 result or refers to a genuinely
  separate, otherwise-undocumented sub-experiment.

  **SURFACES A TENSION WITH M0098/M0099's DOWNGRADE OF 'KERNEL NEVER READS HISTORY'**: this
  document's Section 4.2 lists, among "load-bearing established results" (not merely proposed or
  candidate), "the kernel writes history and never reads it -- 0 reads, 0 behavioural differences,
  static" -- presented at the same evidentiary tier as the factivity-unsatisfiability and Zero-
  chain-derivation results. This directly conflicts with M0098's explicit critique ("the evidence...
  does not establish a theoretical law... retrospective epistemic revision may legitimately require
  historical information") and M0099's resulting downgrade of this exact claim to Law L3 [PROP
  Conditional]. Whether this document's Section 4.2 framing is a looser use of "established" (i.e.
  established-as-a-measured-fact-about-the-current-implementation, not established-as-a-
  theoretical-law) or a genuine unreconciled tension with M0098/M0099's explicit critique is left
  for the eventual reclassification pass; both readings are plausible from the text, and this
  document elsewhere (Part 4 heading) explicitly warns "frozen != established... none has been
  adjudicated and closed, so all remain open to further work," which is consistent with the milder
  reading.

  **REVEALS A SIGNIFICANT CORPUS-SCOPE GAP**: Part 5 catalogs an extensive, ACTUALLYEXECUTED,
  reproducible codebase and result-file tree located ENTIRELY OUTSIDE this reconstruction's current
  mathematical_ideas_that_can_be_implemented/ scope, under docs/knowledgeos/research/: kernel-
  reduction/ (22 files: 00-INDEX, 01-19, FINAL-kernel-reduction-report.md; 12 Python modules;
  run_all.py; 13 JSON results), theory-v1.1-simulation/ (14 files: 00-INDEX, A-L, FINAL-VERDICT.md),
  theory-v1.2-simulation/ (22 files: 00-INDEX, A-S, FINAL-VERDICT.md, including
  S-frozen-results-register.md -- the canonical freeze register containing FR-001 and the five
  standing consequences -- and R-distinguishability-....md, the frozen KR-DIST experiment itself).
  Also documents a full code inventory: kos12/ (23 Python modules mapped to specific experiment
  letters -B through -I, including zerolens.py/zeroH.py/zeroI.py, closure.py/history.py,
  yonizero.py, category_check.py, m2o.py/neff.py/distinguish.py), 61 JSON result files across 9
  subdirectories (audit, closure, dist[2, FR-001's own data], evaluation, history, m2o, neff, yz,
  zero, plus 21 top-level), reproduction commands (dependency-free standard-library Python, fixed
  and recorded seeds), and session records at .claude/sessions/2026-09-01.md and 2026-09-02.md
  covering "every self-correction." This CONFIRMS, for the first time in this pass with concrete
  file-path evidence, that KR-M2O, KR-NEFF, KR-DIST, the Zero Lens experiments, the kernel-reduction
  13-operator experiment, and the Yoni-Zero cycle were all ACTUALLY EXECUTED as real, reproducible
  code -- not merely proposed or discussed -- directly answering several open_questions this
  reconstruction has carried since M0097. It also means this reconstruction's current pass, scoped
  only to mathematical_ideas_that_can_be_implemented/, has NOT yet read the canonical primary
  sources (S-frozen-results-register.md, the FINAL-VERDICT.md files, the 22-file kernel-reduction
  lane) that this KR-SIM sub-thread has been discussing secondhand throughout -- a scope
  observation for the eventual global-reclassification pass to weigh.

  **ADDS SEVERAL FURTHER QUANTIFIED ESTABLISHED RESULTS NOT PREVIOUSLY RECORDED WITH THIS
  PRECISION IN THIS PASS**: "only 3 of 8 Sat_c classes are executable; five have named blockers (>=,
  Contr, no evaluator, no temporal semantics, delta)"; "every composite of arity >= 4 is permanently
  U, with five classes blocked (Kleene conjunction over the class set)"; "winner's curse: apparent
  quality 0.00 -> 0.61 while real quality stays 0, 200 trials/arm, null world" (a specific,
  previously-unquantified figure for the winner's-curse finding referenced informally in M0095/
  M0097/M0101/M0103); "multiplicity and evidence are coupled -- at fixed evidence a real signal
  becomes inadmissible: m > (z*sigma/signal)^2, z^2 ~ 2*ln(n)" (a new, specific formula); "channel
  independence, not validation, does the work -- same channel detects a decoy 0.75%; independent
  99.3%" (matches M0101's numbers exactly, confirming cross-document consistency); "11 live
  lens/domain category violations -- one pattern accounts for 6."

  Closes with explicit usage guidance: cite FR-001 and the register, not this file; to reopen a
  frozen result, name new evidence (rerunning KR-DIST is explicitly NOT new evidence); the queue
  Factivity -> Contr -> >= remains, with the first two framed as "decisions, not experiments"; and
  before proposing any equation, check it against C-1 (statistical mechanism != kernel operator)
  and the lens/domain category-error rule. Final statement: "the programme's most valuable output
  so far is not a model. It is a set of boundaries -- places where a natural formulation was shown
  not to work, and why. FR-001 is the first of them to be formally frozen."
