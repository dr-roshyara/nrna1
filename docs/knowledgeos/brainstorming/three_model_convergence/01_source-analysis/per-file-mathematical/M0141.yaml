mathematical_content: >
  States ALC syntax/semantics, TBox/ABox axiom forms, the six tableau rules for ALCN with clash
  conditions, named complexity results (a full table across FL0 through ALC+role-constructors),
  the DL-modal-logic translation table, qualified number restriction syntax, nominal semantics,
  fixpoint constructs (µX.C, νX.C) with tree/stream examples, and the epistemic operator semantics
  (KC)^I = ⋂_{J∈M} C^J — all cited as established textbook results, not new derivations.
