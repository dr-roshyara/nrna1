about: >
  A comprehensive extraction of Description Logic theory, offering concrete formal machinery
  (tableau algorithms, named complexity classes, TBox/ABox separation, non-standard inference
  operations) for several of this reconstruction's open constructs — ℛ_req (as TBox), Sat (as
  instance checking), Boundary (as frame axioms/persistence), and a NEW candidate for generalization
  (least common subsumer / most specific concept).
introduces:
  - "TBox/ABox separation: TBox (terminology/concept definitions, mapped to ℛ_req) vs. ABox (assertions about individuals, mapped to K_t^E) — the core DL architectural split"
  - "The ALC family and its extensions (U, E, N, C, I, H, R+, O, Q) with named complexity classes: FL0/AL polynomial, ALE NP-complete, ALU coNP-complete, ALC/ALCN PSpace-complete, ALC+TBox ExpTime-complete — concrete evidence for the expressiveness/tractability tradeoff already flagged as a candidate principle (M0136/M0138/M0139/M0140)"
  - "The 'computational cliff' phenomenon: a slight increase in expressiveness can drastically change reasoning complexity (e.g. adding role restriction to FL⁻ takes subsumption from polynomial to coNP-hard)"
  - "Tableau algorithms as a concrete, sound-and-complete reasoning procedure (six rules for ALCN: ⊓,⊔,∃,∀,≥,≤) with explicit clash-detection conditions — the first fully mechanical reasoning procedure given in this reconstruction's read order, rather than only semantic definitions"
  - "The ALC≅multi-modal-K correspondence: results transfer between modal logic and DL (decidability of PDL → decidability of ALC with role expressions; ExpTime-completeness of PDL → ExpTime-completeness of ALC+TBox)"
  - "Epistemic operators (K-operator): KC = concepts known to be in C, with KC⊑D rule pattern ('if known to be in C, also in D') — a DIFFERENT K from KnowledgeOS's own K_t/A_t state symbol; a modal operator over concept membership, not a state"
  - "Non-standard inferences: Least Common Subsumer (LCS, most specific concept subsuming given concepts — candidate for requirement generalization), Most Specific Concept (MSC, classification), Matching, Unification (schema integration) — new formal machinery not previously seen in this corpus for generalization tasks"
  - "Default-rule pattern C(x):D(x)/E(x) with the explicit unsolved problem of precedence among defaults of different specificity — directly relevant to the already-tracked lifecycle/retirement OPEN question"
  - "Concrete domains (integrating numerical/built-in predicates) with an explicit undecidability alert: concrete domains + general inclusion axioms often undecidable"
