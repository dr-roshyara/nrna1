about: >
  The most formally complete external candidate for Zero seen anywhere in this reconstruction's read
  order: Only-Knowing (Oα ⟺ e={w | e⊨α}, "α is ALL that is known") plus a full Representation
  Theorem making TELL/ASK operations reducible to objective first-order entailment via an explicit
  RES/reduction function — a mechanizable formal definition, not merely a philosophical analogy.
  Also introduces a four-valued explicit-belief (B) operator structurally convergent with this
  corpus's own independently-derived FDE evaluation apparatus.
introduces:
  - "TELL/ASK given full formal semantics: ASK[α,e]=YES⟺e⊨Kα; TELL[α,e]=e∩{w | e,w⊨α} — not informal signatures as in prior extractions (M0136/M0141) but complete truth-conditional definitions"
  - "The K operator: e,w⊨Kα ⟺ for every w'∈e, e,w'⊨α — standard epistemic-logic possible-worlds semantics, with objective/subjective/mixed sentence classification"
  - "De dicto vs. de re distinction formalized: K∃xP(x) ('known that a P exists') ≠ ∃xKP(x) ('an x known to be a P') — de re implies de dicto but not conversely; explicitly flagged as 'critical for evaluation semantics... knowing that a requirement is satisfied (de dicto) vs. knowing WHICH requirement is satisfied (de re)' — a genuinely new distinction not previously present in this corpus's evaluation vocabulary"
  - "The Representation Theorem (full statement): for finite objective KB, TELL[α,ℜ[KB]]=ℜ[KB∧‖α‖_KB] and ASK[α,ℜ[KB]]=YES⟺KB⊨‖α‖_KB, where ‖·‖_KB is a reduction function eliminating K operators via the RES function — 'the ‖·‖ function is analogous to a compiler for epistemic content'"
  - "Only-Knowing (O operator), the candidate formal Zero definition: e,w⊨Oα ⟺ for every w', w'∈e ⟺ e,w'⊨α — 'e consists EXACTLY of the world states where α is true' — this is the strongest, most complete external candidate for Zero=knowing-nothing-is-missing seen anywhere in this reconstruction, backed by a full characterization theorem (ASK[α,ℜ[KB]]=YES⟺⊨(OKB⊃Kα))"
  - "Determinate sentences: δ is determinate if it uniquely determines an epistemic state, with a theorem that for any determinate δ there is an objective φ such that ⊨Oδ≡Oφ — the formal underpinning making the Representation Theorem possible"
  - "Only-Knowing-About (O(π)): all the agent knows about a specific SUBJECT MATTER π (a set of atomic sentences) is α — computed via e-π-minimal clauses and prime implicates (P(φ,π) = conjunction of prime implicates of φ mentioning π) — explicitly proposed for 'focused boundary queries... what is known vs. not known about a topic'"
  - "Stable sets and stable expansions (autoepistemic logic connection): Γ stable iff closed under FOL entailment, K-introspective, and negative-introspective; theorem that e⊨Oα iff e's basic belief set is a stable expansion of {α} — connects Only-Knowing to nonmonotonic/default reasoning and 'the closed world assumption as only-knowing'"
  - "Four-valued explicit belief (B), avoiding logical omniscience: situations are four-valued (True-only/False-only/Both-conflict/Neither-unknown), beliefs NOT closed under implication (satisfiable: {Bp,B(p⊃q),¬Bq}), a valid sentence need not be believed, and INCONSISTENT beliefs are representable WITHOUT triggering omniscience/explosion ({Bp,B¬p,¬Bq} is satisfiable) — structurally convergent with, though independently derived from, this corpus's own FDE four-valued evaluation apparatus (Standing(S+,S-), M0137)"
  - "Complexity results for B: propositional tautological entailment co-NP-complete, CNF linear (O(mn)), FOL with existential generalization undecidable, FOL WITHOUT existential generalization decidable — concrete complexity bounds paralleling the DL Handbook's complexity table (M0141)"
  - "The △ operator for quantifying-in with explicit belief: marks terms evaluated at substitution-time inside modal contexts (Teach(father(tom),sara)∧¬BTeach(father(tom)△,sara)) — solving a term-reference problem this corpus has not previously named"
  - "EOC (Explicit Only-knowing with Complete introspection) and AOL (Action + Only-Knowing Logic): AOL directly combines Situation Calculus (S0, do(a,s), fluents, Poss, successor-state axioms) with Only-Knowing, giving Knows(φ,t) and OKnows(φ,t) defined via an accessibility-across-situations relation K(s1,s2) — the FIRST source in this reconstruction's read order to formally unify the 'dynamic lane' (Reiter/M0145-M0146) and the 'epistemic lane' (Williamson/M0147) into one language"
