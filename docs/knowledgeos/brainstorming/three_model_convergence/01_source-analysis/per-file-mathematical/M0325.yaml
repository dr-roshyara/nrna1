about: >
  Now independently read and content-verified (superseding an earlier title-only classification in this reconciliation pass). Defines K_t as the KnowledgeOS state at time t and the fundamental transition K_{t+1}=delta(K_t,o_t,Gamma_t). Decomposes a knowledge state as K=<N,R,H,S,C,P,G> (semantic objects, relations, history, epistemic-status assignments, contexts/contracts, provenance, governance), explicitly declared a conceptual decomposition, not yet an implementation schema. Argues K cannot be reduced to a bare set of currently-accepted propositions, since two systems can share the same current propositions while differing in provenance, assertion time, supporting/challenging evidence, and retraction history.
