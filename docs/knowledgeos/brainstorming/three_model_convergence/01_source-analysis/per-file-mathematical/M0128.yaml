about: >
  Extracts Stephen Rice's legal-logic textbook specifically for KnowledgeOS relevance, framing its
  value as "a very practical model for structuring arguments, separating reasoning modes,
  detecting invalid transitions, naming failures, and repairing reasoning" rather than a new
  epistemological theory.

  **INDEPENDENTLY CORROBORATES "REJECT(H1) DOES NOT IMPLY ACCEPT(H2)" FROM A COMPLETELY DIFFERENT
  DOMAIN**: Rice's negative-premise-fallacy discussion (excluding one route does not establish
  another; a police officer not being motivated by one reason does not establish the officer's
  actual motivation) gives Reject(H_1) does not imply Accept(H_2) unless the hypothesis space's
  exclusivity/completeness is established -- explicitly noted: "this is particularly strong
  because it now has support from both our experiments and Rice's formal-logical analysis. It is
  therefore not merely a statistical insight from the previous experiments. We now have an
  independent logical source supporting it" -- precisely the same high-value pattern as M0119's
  Priest-validates-FR-001/Hilbert cross-domain corroboration.

  **INDEPENDENTLY CORROBORATES M0127's JUST-COMPLETED STRUCTURED-EVALUATION RESULT**: Rice's
  treatment of fallacies as named, structured patterns (FallacyInstance = (Argument, Rule,
  Violation, Pattern, Consequence), e.g. "INVALID because DENYING_ANTECEDENT, applied_to
  HYPOTHETICAL_SYLLOGISM, violated INFERENCE_RULE" rather than a bare "valid=false") gives
  independent conceptual evidence that a flat validity status is insufficient -- explicitly
  connected: "the book provides independent conceptual evidence for our experimental finding:
  EvaluationStatus != EvaluationMeaning," directly corroborating M0127's just-completed Status-C
  (Structured Evaluation Required) verdict from a domain (legal argumentation) entirely unrelated
  to the statistical/logical machinery that produced M0127's own result.

  **INTRODUCES A NEW CANDIDATE ANTI-FABRICATION INVARIANT, WITH A DISCIPLINED SELF-CORRECTION
  CAUGHT WITHIN THE SOURCE ITSELF**: Invalid(Inference) does not imply False(Conclusion) -- "when a
  formal argument is fallacious, its conclusion is not thereby proven false. The failure is that
  the argument does not guarantee the conclusion." Explicitly flags and REJECTS one overly-strong
  sentence from Rice's own book ("if a premise is false or the form is invalid, the conclusion
  necessarily cannot be true") as [NEG] -- too strong as written, since an invalid argument can
  still have a true conclusion -- noting Rice HIMSELF later makes the correct, weaker statement
  elsewhere in the same book. This is a disciplined example of extracting from an authoritative
  external source while still catching and rejecting an internally inconsistent overclaim within
  that same source, rather than importing it uncritically.

  **PROPOSES A STRUCTURED ARGUMENT OBJECT AND SEVERAL FURTHER CANDIDATE CONSTRUCTS**: Argument =
  (Premises, Inference, Conclusion, Form, Warrant); the Truth!=Validity!=Support!=Knowledge chain
  (strongly compatible with the established Credence!=Truth and Fit!=Validity discipline);
  ReasoningMode in {Deductive, Inductive, Analogical, Abductive,...} as a mode-sensitive dimension
  of assessment, with induction able to supply a premise for subsequent deduction (a compositional
  pattern directly relevant to the Composition TODO); rule applicability as a first-class property
  distinct from rule outcome (Applicable(r,A,C) evaluated before Evaluate(r,A,C), reinforcing
  UNKNOWN!=DOES-NOT-APPLY!=NOT-APPLICABLE); non-exclusive multi-valued failure representation
  (Failures(A) subseteq F, rather than a single exclusive Fallacy(A) in F) -- directly relevant to
  the just-completed structured-evaluation result's multi-dimensional Boundary metadata; a
  repair pipeline DetectFailure->ExplainFailure->RepairProposal with RepairProposal!=Decision!=
  Knowledge; and a meta-language framing (Argument->MetaAssessment(Argument)) reinforcing E_t!=A_t
  and Claim!=Assessment.

  **REINFORCES THE ESTABLISHED "CAPABILITY != KERNEL PRIMITIVE" DISCIPLINE**: "Logic Engine !=
  KnowledgeOS Kernel," since Rice himself repeatedly emphasizes formal logic is only one reasoning
  tool among deduction/induction/analogy and is explicitly "foundational but not sufficient" --
  matching the corpus's own established conclusion from the N_eff/Hilbert/Contr work that "a useful
  mathematical or logical capability does not become a kernel primitive merely because KnowledgeOS
  can use it."

  **DELIVERS AN EIGHT-ITEM "WHAT NOT TO EXTRACT" DISCIPLINE LIST**: rejecting claims that formal
  logic is the KnowledgeOS kernel; that syllogistic logic is the universal KnowledgeOS logic; that
  the six named fallacies constitute the complete KnowledgeOS error ontology; that deductive
  validity equals epistemic validity; that legal reasoning supplies the KnowledgeOS epistemology;
  that a fallacious argument has a false conclusion; that rejecting one hypothesis establishes
  another; and that every argument reduces to a syllogism.

  Closes by proposing three specific candidates for the next invariant/Composition test suite --
  Reject(H1)=/=>Accept(H2); Invalid(Inference)=/=>False(Conclusion); Same-EvaluationStatus=/=>
  Same-EvaluationMeaning -- explicitly noting "this book does not settle the Contr experiment. It
  gives us additional source-grounded reasons to investigate composition and structured
  evaluation, which is exactly why the next KR-COMP-2026-09 experiment remains the right research
  direction."
