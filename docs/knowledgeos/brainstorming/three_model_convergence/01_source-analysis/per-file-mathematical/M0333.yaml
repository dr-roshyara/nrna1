about: >
  Now independently read and content-verified. Establishes Event Time != Observation Time != Knowledge Time != Transaction Time != Decision Time as five non-collapsible temporal dimensions (worked example: a contract terminated on 1 June but learned of on 15 June -- replacing the first date with the second changes the meaning of the knowledge, not just its metadata). Treats time as semantic information requiring a typed, potentially multi-dimensional temporal domain tau, not a single timestamp field.
