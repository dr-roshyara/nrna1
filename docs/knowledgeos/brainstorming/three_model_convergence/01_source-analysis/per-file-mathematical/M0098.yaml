  secondary: c
  secondary_note: "reviews and refines a restructuring proposal (itself already internally reviewed and kept at [PROP], not Theory v1.3) that unifies Sat/Zero/Gap/Balanced/K_t/the argument field under a single projection/information-loss theory -- this is the capstone theoretical formalization of the projection-destroys-structure pattern this reconstruction has tracked since M0043-M0077 and independently corroborated in M0085 ('worth investigating -- but it is not yet a theorem'); here it is given a rigorous mathematical treatment (induced equivalence, invariant custody, a named adequacy principle) rather than remaining an informal observation"
