title: "Restructuring Proposal and a Terminology Correction: FORMALIZES the Corpus's Already-Tracked 'Projection Destroys Structure' Diagnosis (M0043-M0077, Independently Corroborated M0085) Into a Rigorous Induced-Equivalence Framework (x1 ~pi x2 iff pi(x1)=pi(x2)), Replaces the Dangerous 'Kernel of the Projection' Language, Introduces Invariant Custody and the Representation Adequacy Principle [PROP], Retires Zero<=>Delta=EmptySet, Reframes E_t/B_t/AF_t/M_t as Candidate (Not The) Primary Structures, and Names KR-PROJ-2026-09-02 as the Decisive Next Research Gate"
