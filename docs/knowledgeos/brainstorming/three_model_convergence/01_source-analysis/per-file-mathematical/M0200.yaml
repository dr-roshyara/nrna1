  - "A NEW corpus-count discrepancy: alongside the established 1,395 total (k=1:1252/89.7%, k=2:25/1.8%, k=3:3/0.2%, irreducible:115/8.24%), 'separate populations/results such as the O2/O4/O6 analyses' produced totals of 1,496 and 1,475 — figures not reconciled with the 1,395 total or with each other, joining this reconstruction's other long-tracked corpus-count discrepancies (the main-corpus ~1,193/2,376 figure, the KR-SIM lane's own 1,452+330=1,782 figure from M0035)"
