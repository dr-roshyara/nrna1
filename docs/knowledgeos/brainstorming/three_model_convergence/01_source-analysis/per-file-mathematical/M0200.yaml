about: >
  A methodological clarification refining M0198/M0199's corpus-audit discussion: an explicit,
  self-aware admission that the reviewer does not have direct access to the actual 1,395-record
  case-level KR-ZERO dataset, only the previously-discussed aggregates — and a corresponding
