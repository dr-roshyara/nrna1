title: "Self-correcting review of M0273's 'Containment Zero': demotes both Balance Zero AND Containment Zero from asserted algebraic facts to explicitly candidate structures ('Zero is not a universal primitive'), corrects a dangerous additive '+' notation in the four-component state equation, weakens the boundary-generation and H8 claims from universal set-subtraction to testable candidates, introduces RESIDUALITY as potentially more fundamental than Containment Zero itself, and retitles the whole proposal from 'Three Operational Modes of Zero' to 'Three Candidate Resolution Structures for Zero' — with two sharpened formal hypotheses H-CONTAIN-01/02 and a precise engineering comparison test refining H7"
