title: "Four corrections to M0277's clean consolidation: 'independent' is too strong for non-implying Zero projections (non-implication≠independence); the uniform projection equation Zero_i⟺Π_i(K_t)=0 forced Elimination Zero's genuinely relational predicate into the wrong shape; Balance Zero and Containment Zero both re-demoted to candidate status ('Containment Neutrality' pending a test against 'Containment Zero'); the 'Question-Projections Axiom' downgraded to a 'Research Principle'; and — most concretely — KR-STATE-01 REDIRECTED from a premature probability experiment to a prior Zero-Projection-Independence test with a concrete empirical relation matrix M_ij=P(Z_i=1|Z_j=1)"
