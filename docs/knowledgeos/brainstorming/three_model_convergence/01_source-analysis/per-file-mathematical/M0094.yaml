title: "Three (Really Nine) Mathematical Derivations From the Linga-Yoni/Gita Structural Hypothesis: L!=Y by Domain/Codomain Argument, the Ksetra/Ksetrajna Factorization Know(J,F_t,p,t) (Never J=F_t), an Abstract Interaction mu:L x Y -> O With Group-Action alpha:L x Y -> Y as the Strongest Candidate, a Clean Theorem Candidate P1 (Infinite Distinct States Does Not Imply a Monotonic Progress Measure, With Concrete Counterexamples), an Invariant/Identity-Preservation Question, a Five-Valued Eval() Outcome Type, and a Five-Question Research Programme Whose Decisive Fifth Question Is Minimality (Can Theta=Y-compose-L Reduce to an Ordinary Transition Operator?)"
