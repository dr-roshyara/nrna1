about: >
  **THE CENTRAL DISTINCTION**: separates two things "previously conflated" -- (1) **Zero Lens**
  Z(K_t,Gamma_t) = examination of the boundary of what K_t represents (what is not represented,
  assessed, resolved, observed, interpreted, supported, inside the current dimensional model,
  visible past abstraction, examined as an assumption, or otherwise established), which CAN be
  defined now; and (2) **Zero Closure predicate** Zero_closure(K_t,R_t,Gamma_t) = "are all
  requirements relevant to this inquiry sufficiently satisfied?", which remains genuinely open --
  "this is where v1.2 was correct to stop."

  **DELIVERS ZeroLens(K_t,Gamma_t,L) -> Boundary_t AS A RICH, NON-BOOLEAN OBJECT**: rather than
  Z(K_t)->{T,F,U}, proposes ZReport_t/Boundary_t as a structured tuple (MissingValues,
  MissingDimensions, MissingRelations, UnresolvedClaims, UnassessedAreas, EvidenceGaps,
  Contradictions, Assumptions, ScopeBoundaries, TemporalBoundaries, ModelBoundaries, ...) [PROP],
  with Boundary_t != K_t and Boundary_t != Truth-minus-K_t (since the complete truth space may
  itself be unknown) -- the boundary itself can be PARTIALLY UNKNOWN.

  **DELIVERS THE KNOWN-GAP vs UNKNOWN-GAP DISTINCTION, "THE STRONGEST MATHEMATICAL CONTRIBUTION OF
  THIS DOCUMENT TO ZERO THEORY"**: a known gap is "we know the backup configuration has not been
  assessed"; an unknown gap is "there may be dimensions of the backup configuration we have not
  even conceptualized" -- D_t subset-of D* may hold while D* itself is not fully known.

  **WEAKENS A CLAIM FROM THE SOURCE DOCUMENT TO AVOID AN UNNECESSARY PREREQUISITE**: "Zero exists
  precisely because D_t != D*" (which presupposes a meaningful D*) is revised to "Zero is required
  because the current representation cannot assume that its recognized dimensional space is
  exhaustive" -- explicitly avoiding turning an unbounded/infinite Knowledge Space hypothesis into
  a prerequisite for Zero, so Zero remains valid even in a bounded domain.

  **DELIVERS TEN ZERO INVARIANTS (ZI-01 through ZI-10)**: Unknown!=Absent; NotAssessed!=
  LowConfidence; NotApplicable!=Unknown; NoEvidence!=InvalidEvidence; Unresolved!=False;
  UnknownDimension!=UnknownValue; Representation!=Reality; PreviouslyUnknown!=PreviouslyAbsent;
  Conflict!=Invalidity; NoKnownGap!=Complete -- yet another independently-numbered invariant
  registry (alongside EW-*, I1-I9, G1-G10, G1-G9, P1-P20), flagged for eventual cross-reconciliation.

  **REINTERPRETS THE V1.2 SIMULATION RESULT**: it did NOT prove Zero itself is three-valued; it
  showed only that "a three-valued evaluation layer does not uniquely determine Zero closure" and
  "closure semantics depend on unresolved semantic contracts" -- so the correct response is not to
  force a premature choice among Zero_strict/Zero_reasoned/Zero_weak/Zero_kleene, but to define the
  Zero Lens first, then test evaluation semantics, then derive closure semantics.

  **THE SECOND-HALF BREAKTHROUGH: DISSOLVES THE APPARENT CONTRADICTION/EVALUATION/ZERO-DOMAIN
  COUPLING** the prior experiment (G/H) had concluded were entangled. Reframes the problem: the
  {T,F,U} codomain is both non-total (N2a) and not information-preserving (N2b) -- adding a fourth
  value C does not solve this, since TheoryIncomplete, NoEvidence, Unobservable, and Underdetermined
  can ALL still collapse into U regardless. The real question is "why are we forcing a rich
  epistemic boundary into a small value domain in the first place?" rather than "how many truth
  values do we need?"

  **INTRODUCES FOUR INDEPENDENT FORMAL OPERATIONS, REPLACING THE PRESUMED SINGLE COUPLED DOMAIN**:
  Contr: K -> ConflictStructure; Eval: (K,r,Gamma) -> EVal; ZeroLens: (K,Gamma,L) -> Boundary;
  Closure: (Boundary,EVal,Req,Gamma) -> ? -- "operationally related, but not necessarily the same
  formal domain," each with distinct responsibilities.

  **MAKES ZERO MORE FUNDAMENTAL THAN Sat**: rather than Sat -> Delta -> Zero, proposes K_t ->
  ZeroLens -> Boundary_t (independently) and K_t,r -> Eval -> EVal (independently), converging only
  at (Boundary_t,EVal_t,R_t,Gamma_t) -> Closure_t -- "Zero is no longer merely a wrapper around Sat.
  It becomes a meta-epistemic operation over representation boundaries."

  **DELIVERS "ZERO CAN OPERATE BEFORE WE KNOW THE COMPLETE SEMANTICS"**: directly building on the
  prior experiments' finding that "evaluator needed by simulator does not imply evaluator supplied
  by theory" -- Zero Lens can report "Boundary detected: evaluation semantics unavailable; reason:
  theory does not define evaluator; status: theory-boundary" WITHOUT inventing an answer, exposing
  theoretical incompleteness "without pretending to resolve it."

  **REFRAMES U AS A COARSE PROJECTION, NOT A FUNDAMENTAL ONTOLOGICAL STATE**: proposes six
  sub-kinds (U_epistemic, U_semantic, U_evidential, U_observational, U_theoretical, U_operational)
  preserved by the Boundary but coarsened by any value(EVal) projection -- explaining precisely why
  adding a fourth truth value C never actually solves the information-loss problem (3->4 values
  fails for the same structural reason 2->3 did).

  **PROPOSES A COMPOSITIONAL ZERO THEORY**: reframes Zero itself as "a boundary-generating
  operation" rather than a predicate, with derived views Zero_coverage, Zero_evidence,
  Zero_semantic, Zero_model, Zero_temporal, Zero_contradiction, Zero_assumption defined as
  PROJECTIONS pi_x(Boundary_t) rather than separate Zero concepts.

  **CROSS-CONNECTS TO M0050'S EQUALITY-TAXONOMY PROBLEM**: proposes K_1 equiv_Q K_2 does NOT imply
  Boundary(K_1)=Boundary(K_2) unless the relevant Zero lens is included in the equivalence contract
  -- a genuine new link between this Zero-Lens breakthrough and the main corpus's own four-relation
  equality taxonomy (identity/=/approx/cong_lambda) surfaced via the M0050 bridge, suggesting the
  equality-relation multiplicity problem and the Zero-boundary-richness problem may be facets of the
  same underlying issue.

  **REFRAMES DetectGap AS A PROJECTION OF ZERO, NOT A KERNEL PRIMITIVE**: DetectGap_Q(K) =
  pi_requirement(ZeroLens(K,Q)) -- a [PROP] hypothesis with potentially significant kernel-
  minimality consequences, since a primitive candidate operator (DetectGap, present in the earlier
  13-operator baseline and referenced throughout M0030-M0049) may reduce to a mere consumer/view of
  boundary information rather than requiring independent kernel status.

  **PROPOSES THE NEXT EXPERIMENT, JUDGING THE PRIOR PLANNED EXPERIMENT POSSIBLY OBSOLETE**: rather
  than the H-experiment recommended by the prior document (repairing contradiction+evaluation+Zero
  domain jointly), proposes "KR-ZERO-2026-09-02-H -- Boundary Separation Experiment": construct nine
  adversarial states (S1-S9: contradiction, empty, insufficient evidence, unobservable,
  underdetermined, theory-evaluator-unavailable, agent-remediable uncertainty, not-applicable, not-
  assessed) and test only whether ZeroLens(S_i) != ZeroLens(S_j) pairwise wherever the theory
  requires the underlying conditions to remain distinct -- explicitly NOT yet assigning T/F/U/C
  values ("that comes later"). Closes with an explicit caution against overclaiming: Zero Lens does
  not prove Boundary is formally complete or exhaustive, and does not itself solve Sat, Contr,
  the epistemic-status order, or Factivity.
