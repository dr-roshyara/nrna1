  - "M0136's Zero candidate (vivid-KB / CWA): explicitly REJECTED as KnowledgeOS theory claims ('Zero≠CWA', 'too strong' for Δ=∅-universally), replaced with Zero_requirements≠Completeness_world as the safer, narrower result"
  - "M0136's δ candidate (situation calculus / successor-state axioms): downgraded from 'candidate formalism' to 'a strong δ RESEARCH BASIS, not yet a δ definition' — T4 explicitly labeled 'research formalism, not yet δ definition'"
