about: >
  A formal experiment-design specification for KR-ZOOM-01 (Recursive Epistemic Zoom), phrased as a governance-constrained prompt to be given to an implementing agent: four falsifiable questions (can a value expand into a non-trivial state at finer resolution; can the same value expose different structure by traversal direction; can a silent dimension become operative at finer resolution; can the expanded state become a new reasoning substrate), an explicit prohibition on modifying the constitutional kernel or Theory v1.2 or promoting any result to primitive/axiom/law, and a required experiment directory structure (README/DESIGN/AUDIT/RESULTS/CONCLUSIONS). IMPORTANT CROSS-REFERENCE: this appears to be the origin of the KR-ZOOM-01/02/03 and KR-ZOOM-OUT-01/02 experiment series referenced later in this same file cluster (M0315, M0317, M0318) and possibly connected to prior corpus material -- not yet cross-checked against the original 282-file pass's own references to a 'KR-ZOOM' experiment.
