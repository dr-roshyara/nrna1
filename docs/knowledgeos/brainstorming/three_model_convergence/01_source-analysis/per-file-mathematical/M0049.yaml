about: >
  A complete, ready-to-run prompt (Experiment ID KR-SIM-2026-09-02, Model KnowledgeOS-Simulation-
  v1.1) explicitly NOT yet executed within this file -- it specifies what an executable simulation
  of the derived KnowledgeOS theory must test, not the results of running it. Structurally the
  direct successor to the M0030 kernel-reduction protocol (later confirmed executed via M0035/
  M0037), but now testing whether ~26 named conceptual roles (Reality, Observation, Evidence,
  Hypothesis Space, Evidence Assessment, Determination, Knowledge Attribution, K_t, Gap, Zero,
  Decision, Authorization, Action, History, Identity, ...) can coexist operationally without one
  concept secretly doing another's work.

  **EMBEDS THE FULL CORE THEORY AS AN EXECUTABLE SPEC (Secs 2.1-2.12)**: restates E_t, Knowledge
  Attribution K_t=Gamma(E_t,Q_t,C_t,EC_t), Inquiry Q, Ideal State I_t, Adequacy, Gap Delta, Zero,
  Hypothesis Space H_Q with set-valued Determination, target-relative Evidence Assessment
  (explicitly demoting Good's likelihood ratio to "only one possible assessment regime," not a
  universal law), Epistemic Standards S_t^epi, and Model M_t=(Structure,Assumptions,Parameters) --
  consolidating M0043/M0047/M0048's definitions into one executable reference.

  **DELIVERS THE MOST COMPLETE 'REQUIRED STATE SEPARATIONS' LIST IN THE PASS (~28 non-collapse
  pairs, Sec 3)**: from Reality!=Observation through Semantic Equivalence!=Representation Equality
  and Mathematical Regime!=Knowledge Ontology -- consolidating nearly every non-collapse claim
  established across M0025-M0048 into one checklist the simulator must operationally preserve.

  **DELIVERS TEN DETAILED SCENARIO FAMILIES (A-J)**, each testing a specific failure mode: Simple
  Determination (Knowledge not merely copied from Observation); Incomplete Evidence (anti-
  fabrication -- the system must not invent a value); Multiple Competing Hypotheses (explicit
  Reject(H1)!=Accept(H2) test); Different Epistemic Standards (testing whether standards are "merely
  decorative" if they have no effect); Different Inquiries (same K_t, different Ideal States/gaps --
  inquiry-relative knowledge); Conflicting Evidence (preserve unresolved conflict, do not average);
  Dependent Evidence (anti-double-counting); Model Mismatch (fit != causal validity); Retrospective
  Revision (history preserved, not rewritten); Unobservable Property (must not collapse into
  observed-false, probability-zero, or rejected).

  **DELIVERS A NOTATION/TYPE-COLLISION AUDIT DIRECTLY ANSWERING M0045'S HISTORY-vs-HYPOTHESIS
  FINDING (Sec 25)**: requires a formal type table for 24 named types, with an EXPLICIT instruction
  to inspect notation collisions involving the single-letter symbols {P,H,E,K,S,C,R,M,I,Q} --
  generalizing M0045's specific H (history) vs H (hypothesis) collision into a systematic
  pre-simulation audit across every overloaded symbol used throughout the pass.

  **DELIVERS A CIRCULARITY AUDIT DIRECTLY TARGETING THE THM-11/SEMANTIC-EQUIVALENCE CONCERN
  (Sec 26)**: explicitly tests five named candidate circularities (Knowledge<->Truth, Semantic-
  equivalence<->Behavior, Adequacy<->Satisfaction, Determination<->Knowledge, Zero<->Gap), with an
  explicit instruction NOT to repair silently but to report CIRCULARITY-ID, the two definitions,
  why circular, whether harmless recursion or fatal circularity, and possible independent grounding
  -- directly operationalizing M0045's and M0048's shared concern about the THM-11 proof.

  **REUSES AND EXTENDS THE KERNEL EXPERIMENT'S METHODOLOGICAL APPARATUS**: the vacuity audit
  ("if guard_active=0, then 100% pass means nothing"), the no-smuggling audit (now applied to a
  DIFFERENT candidate operator list mixing old and new names: Observe/Interpret/Represent/
  Discriminate/Hypothesize/Determine/Select/Revise/Validate), and oracle independence (the test
  oracle must not duplicate the implementation; distinguish empirical evidence from logical/
  definitional consequence) -- all imported wholesale from the M0030 kernel-reduction protocol's own
  discipline.

  **PROPOSES A NEW, SMALLER CANDIDATE TRANSITION-OPERATOR VOCABULARY (Sec 12)**: Acquire, Interpret,
  Assess, Determine, Attribute, Revise, Reject, Accept, Supersede -- NINE operators, explicitly NOT
  claimed as final kernel operators, and NOT the same set as the earlier 13-operator baseline
  {Observe, Interpret, Represent, Relate, Discriminate, Hypothesize, Infer, DetectGap, Challenge,
  Validate, Revise, Determine, Select} -- yet another distinct candidate operator set in the
  recurring kernel-cardinality debate, unreconciled with the 13-vs-8 result.

  **REFRAMES KERNEL MINIMALITY WITH A SIX-CONSTRAINT VERSION (Sec 13)**: adds capability
  completeness, fixed semantic carrier, and fixed observable behavior contract to M0043's original
  five constraints (semantic adequacy, transition completeness, invariant preservation) -- a richer,
  still-unreconciled variant of the kernel-minimality optimization problem.

  **DELIVERS 20 PROPERTY-BASED TESTS (P1-P20)** and **17 success criteria (S1-S17)**, plus 12
  required output artifacts (A-L) including a "Theory Gap Register" classified into NINE
  CATEGORIES (G1 Mathematical, G2 Semantic, G3 Epistemological, G4 Statistical, G5 DDD,
  G6 Computational, G7 Empirical, G8 Architectural, G9 Governance).

  **CORPUS-INTEGRITY FLAG -- A GENUINE NAMING COLLISION**: this document's own "Theory Gap
  Register" (Sec 31.L) uses the label "G1" through "G9" for GAP CATEGORIES (Mathematical/Semantic/
  Epistemological/.../Governance), which is a COMPLETELY DIFFERENT registry from M0045's "G1"
  through "G10" (Canonical type of K_t / Non-circular semantic equivalence / Sat(K,r) / Knowledge
  Attribution / Hypothesis Space / .../ Kernel minimality after semantic equivalence). Both use
  identical "G<n>" notation for unrelated content -- flagged explicitly as a corpus-integrity risk
  for the eventual reclassification pass, alongside at least five OTHER independently-numbered
  registries already active in this pass (EW-01-18 in M0044; C1-C13/G-C1-9 in M0045/M0046; I1-I9 in
  M0043; P1-P20 here; and now this G1-G9), none formally reconciled against one another.

  **DELIVERS THE MOST DISCIPLINED ANTI-OVERCLAIMING INSTRUCTION SET IN THE PASS**: repeated explicit
  bans on writing "the theory is proven," a required four-way Theory Status classification
  (INCONSISTENT / PARTIALLY EXECUTABLE / INTERNALLY COHERENT UNDER TESTED CONDITIONS / STRONGLY
  SUPPORTED BUT NOT PROVED) with an explicit warning not to over-select the strongest option merely
  because tests pass, and the closing scientific principle that "the strongest possible outcome is
  NOT 'everything passed'" but a precise map of what is definitional, derivable, simulation-
  supported, or still open.
