about: >
  Synthesizes eleven experiments (KR-2026-09-01 kernel reduction; the KR-SIM Theory v1.1
  simulation; and the nine-step v1.2 chain B/C/D/E/F/G/I/H/-I) into ONE unifying structural
  diagnosis: **"the programme has repeatedly defined a projection and then asked it to do the work
  of the structure it projects from"** -- shown to be the SAME mistake underlying five apparently
  distinct failures: Eval_c -> EVal / Sat_c:=value-o-Eval_c (broke at -G: nine evaluation situations
  collapse into U); the boundary B / Zero<=>Delta=empty (broke at -B: three non-equivalent
  readings; -G's D-0: a contradictory state closes); B again / Gap (broke at I: Gap=pi_Q(B),
  attribute-lossy in kind and remediability); ZeroLens / DetectGap (broke at -A: derivable 12/12;
  I: recoverable as pi_Q(ZeroLens(...))); the epistemic state E_t / K_t=Gamma(E_t,...) (broke at
  v1.1: Gamma cannot be factive, because its domain excludes truth). "This is a structural
  diagnosis, not a metaphor."

  **CONFIRMS AND QUANTIFIES THE FACTIVITY-IMPOSSIBILITY THEOREM WITH CONCRETE NUMBERS**: DEF-1
  factivity and K=Gamma(E,Q,C,EC) are jointly unsatisfiable [EXP] -- two worlds differing in truth
  produce a bit-identical epistemic state, so Gamma (a function of E alone) necessarily returns the
  same K, true in one world and false in the other. Reproduced at scale: **420 violations out of
  10,000 paired worlds**. This is the KR-SIM lane's OWN independent confirmation of the exact
  factivity-impossibility finding this reconstruction has already tracked from main-corpus files
  2321/2324/2328 and from M0001's own founding thesis -- now with concrete experimental numbers.
  Explicitly notes what is NOT established: "that KnowledgeOS should be non-factive."

  **UPGRADES THE ZERO-CHAIN TO FULLY PROVEN [DEF] STATUS**: Zero_strict => Zero_reasoned =>
  Zero_weak, "proved in two lines and machine-checked over 1,620,000 assignments including EVERY
  choice of which reason-buckets close: 0 counterexamples" -- a genuine upgrade beyond M0052/M0055's
  own "experimentally supported"/[DERIVED] status, now exhaustively verified rather than merely
  observed over a handful of test cases, and confirmed independent of the reason-partition (which
  has itself been revised twice).

  **QUANTIFIES THE VALUE-PROJECTION'S INFORMATION LOSS PRECISELY**: T, F, C, UNDEFINED each receive
  exactly ONE distinct evaluation situation; **U receives NINE**, spanning [OPEN]/[PROP]/[NEG]
  statuses -- the exact distinction the theory most needs (epistemic insufficiency vs theory
  incompleteness vs context absence vs world unobservability) is precisely what the projection
  destroys.

  **QUANTIFIES BLOCKED-CLASS CONTAGION**: under Kleene conjunction with five of eight evaluator
  classes undefined, every composite requirement of arity >= 4 is permanently U; supplying three
  candidate evaluators HALVED low-arity contagion but changed NOTHING at arity >= 7; the residual
  blockage is attributable to exactly TWO classes (status: succeq undefined; consistency: Contr
  undefined).

  **UNIFIES THE TWO REMAINING BLOCKERS INTO ONE DECISION**: succeq (epistemic-status ordering) and
  Contr (contradiction predicate) are shown NOT independent -- "the only contradiction repair that
  is total, three-valued and preserves absence!=negation routes Sat_content through
  Sat_consistency, and Contr carries the fourth-value question. Four open items are one decision."

  **DELIVERS A RIGOROUS STATISTICAL SELF-AUDIT OF THE WHOLE PROGRAMME'S OWN METHODOLOGY (Part III)**:
  "model uncertainty dominates sampling uncertainty by a wide margin, and the programme's
  instruments were calibrated the wrong way round." Across 150,000 randomized trials, EXACTLY ONE
  non-vacuous result was produced; seven of eleven experiments used no randomization at all and
  produced MORE. Four dated methodological self-corrections: (S-1) vacuity is mandatory -- removing
  Validate drove a guard-activation rate to 0.00, meaning "no failures" actually meant "cannot
  fail"; (S-2) a published "95% CI [.5847,.6040]" was WRONG because the outcome given the world and
  operator set is deterministic (conditional rate exactly 1.0000) -- only the generator's own
  guard-activation rate was genuinely sampled, and "the corrected statement is stronger than the
  published one"; (S-3) fifteen test arms shared one world stream, an exactly PAIRED design (10,000
  worlds x 15 arms), not 150,000 independent observations -- reporting independent-binomial
  intervals over a paired design was the error; (S-4) identical failure sets across five seeds shows
  determinism given a seed, establishing neither universal-seed robustness nor robustness to
  generator specification. Concludes randomized testing is the wrong instrument for semantic
  discrimination; the three approaches that actually produced results were 2 worlds (factivity
  theorem), 1,620,000 exhaustive assignments (Zero chain), and 2^11 exhaustive facet subsets (two
  minimal typing sets).

  **CONFIRMS THE CONSTITUTIONAL FOUR-LAYER SEPARATION HELD UNDER PRESSURE (D-1)**: the ban on
  "philosophy -> mathematics -> primitive -> DDD object -> architecture" held; Buddhi/Sarathi/Zero
  remained lenses; the Gita tiering (M0064) placed ZERO new primitives; "corroboration != derivation
  is doing real work" -- an explicit confirmation that this pass's own anti-reification discipline
  (M0057-M0076) actually functioned as intended under adversarial pressure, not merely as a stated
  aspiration.

  **DELIVERS THREE ADDITIONAL DOMAIN-DESIGN FINDINGS (D-2 through D-4)**: the theory's declared
  distinctions are operationally real under adversarial test (zero fabrications in 10,000 trials);
  three notions of necessity (formal/functional/domain) genuinely disagree for Discriminate/Select/
  Revise, "collapsing them would have produced a confident and wrong kernel"; invariant custody can
  shrink while cardinality shrinks (eliminating Challenge moved custody of "a verdict must be
  challengeable" from one operator to two) -- "cardinality minimization is blind to this."

  **DELIVERS SIX FURTHER PROCESS FINDINGS (I-1 through I-6)**: TEN notation collisions, the worst
  being E denoting both Evidence and EpistemicState "inside the very correction whose purpose is to
  separate them" (also P/K/H/I each collide three times) -- confirming and quantifying the
  notation-collision problem M0045/M0049/M0058 repeatedly flagged; specification defects (Sat_
  content's non-totality, an incomplete reason vocabulary, non-well-founded operational evaluation)
  are invisible until adversarially attacked and "would have been concealed by implementation";
  OVER-specification is as dangerous as under-specification -- the typed facet vocabulary has **37
  of 41 distinctions doing no work** on the motivating suite, "a vocabulary large enough to separate
  anything separates nothing"; a **corpus-hygiene finding directly relevant to this reconstruction's
  own concerns**: a derived analysis lane wrote its output into the primary corpus (325 files, all
  one day), with a hard-coded folder-list exclusion rule unable to see a lane created after it was
  written -- "provenance should be a property of the artifact, not its directory," and "the primary
  corpus grew ~1.7% during a single session"; measuring before repairing biases the measurement
  (contagion at arity 3 understated 0.643 vs corrected 0.821); and the status vocabulary itself
  needs one more term, unable to express "refuted as reading A, surviving as reading B" (exactly
  Zero's own situation).

  **DELIVERS THE AUTHORITATIVE KERNEL-QUESTION VERDICT**: "the kernel cannot be selected, and the
  reason is not that the work is unfinished... a kernel selected now would be a selection of a
  representation, disguised as a discovery about knowledge."

  **REFRAMES THE RESEARCH DIRECTION**: ABANDON "define the projection, then try to recover the
  structure from it"; ADOPT "define the structure, then derive the projection" -- with all five
  failures from Part I recast as instances of the abandoned direction.

  **PROPOSES THE NEXT FOUR EXPERIMENTS IN STRICT ORDER**: N-1 decide factivity (a DECISION, not an
  experiment -- R1/rename-K_t and R2/externalize-factivity are behaviorally identical; R3 does not
  repair anything; R2 makes measurable that 88.25% of the kernel's claims survived external
  verification; the remaining choice is architectural: "may any KnowledgeOS component assert
  Knows?"); N-2 define Contr and the fourth value together (unblocks both consistency and content;
  any codomain extension must extend the Zero readings in the same step or closure silently
  swallows the new value); N-3 define succeq (with Contr, the entire residual contagion); N-4 test
  the 37 unsupported typed distinctions or drop them.

  **DELIVERS AN EXPLICIT 'WHAT TO STOP DOING' LIST**: stop running large randomized simulations;
  stop implementing before the specification survives adversarial attack; stop supplying missing
  semantics as test fixtures (confirming that two evaluators were retracted as corpus-unsupported,
  and had manufactured a Zero separation that vanished when they were removed); stop treating
  cross-lane agreement (DetectGap's non-primitive status, confirmed by two lanes) as derivation.

  **REOPENS THE FOUNDATIONAL QUESTION**: "What mathematical structure must an epistemic state
  preserve under all admissible representations and transitions?" -- concluding the original kernel
  question ("which operators belong to the kernel") is downstream of at least four prior questions
  (the type of K_t, semantic equivalence, the contradiction predicate, the status ordering): "the
  kernel question is not hard because the answer is elusive. It is hard because it was asked
  first."

  **DELIVERS A FULL APPENDIX TABLE OF ALL ELEVEN EXPERIMENTS** with IDs and one-line surviving
  results, confirming this reconstruction's own tracked findings across M0030/M0037 (kernel
  reduction), M0051 (factivity witness), M0055 (Zero chain derived), M0057 (value-o-Eval lossy 9->1,
  D-0), and M0064 (boundary closure repairs D-0 6/6, Gita tiering 0 new primitives) -- plus TWO
  experiments (-H "boundary separation," -I "typed vocabulary") whose detailed reports this pass has
  not yet directly encountered under those exact names, confirming M0067's earlier citation of
  "Experiment H" findings was accurate.

  **RECORDS SIX SELF-CORRECTIONS ACROSS THE CHAIN**: two evaluators retracted as corpus-unsupported;
  a Zero separation that was an artifact of them; a sequencing violation that biased a measurement;
  a confidence interval on the wrong quantity; a parsimony test that measured the wrong thing; and a
  minimal repair presented as THE minimal repair -- "each was found by a later experiment attacking
  an earlier one, which is the only reason to run them in a chain."
