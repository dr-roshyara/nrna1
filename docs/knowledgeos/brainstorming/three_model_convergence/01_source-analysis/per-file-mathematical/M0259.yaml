about: >
  Document 06 of the 15-document consolidated theory series, sourced from KR-REP-REDUCTION-2026-09
  and its audit. Consolidates the corpus's central representation-reduction experimental finding —
  a preservation boundary at R5→R4 — into its final, tightly scope-bounded form, adds a genuinely
  new formal corollary (the boundary's uniqueness along a sequential chain, derived purely from the
  DPI), restates the H-RR2 negative result and the rank-invertibility audit withdrawal with exact
  final numbers, and supplies a nuanced clarification distinguishing where the adequacy/realization
  separation was and was not actually exhibited.
introduces:
  - "Final experimental parameters: 40,000 cases per split, independent seeds, full population persisted; seven falsification tests (FT-1..FT-7) ran BEFORE any result and all passed; the positive control passed (N_viol>0 at three levels), confirming the experiment was not blind"
  - "The final boundary table: R5 (drop timestamps) F=1.00, Ĥ(Q|R)=0.0000, N_viol=0, adequate=YES; R4 (round to 3 s.f.) F=1.00, Ĥ(Q|R)=0.4299, N_viol=35532, adequate=no — 'last adequate stage: R5. First inadequate: R4. Crossing transformation: T4 — rounding to 3 significant digits'"
  - "A TEST-reproduces-TRAIN confirmation with exact numbers: R4 Ĥ 0.4408 (test) vs 0.4299 (train); N_viol 36,445 (test) vs 35,532 (train) — 'the Ĥ(Q|R5)=0 observation is not a one-sample artifact'"
  - "THE CLEANEST STATEMENT OF THE SCOPE-BOUND DISCIPLINE in the entire corpus: explicit forbidden claim ('three significant digits is the universal preservation limit') contrasted with the permitted claim ('for THIS carrier, THIS inquiry Q, THIS transformation chain, THIS contract and THIS value domain, rounding to three significant digits crossed the observed preservation boundary') — with the carrier and inquiry stated exactly (r=(value,source,timestamp); Q=(argmax_source, decile(total))) and the explicit generalization: 'the boundary is a property of the frame, not of the number 3'"
  - "An explicit negative-space clarification of what the boundary is NOT a boundary of: not eliminability (§4 — Zero doesn't mark it); not realization (Document 05 — never exhibited); not 'size' (Document 04 §4 — bytes were flat across it) — the boundary is specifically and only a boundary of ADEQUACY, i.e. of Ĥ(Q|R) crossing zero"
  - "A GENUINELY NEW FORMAL COROLLARY, derived purely from the DPI theorem (Document 04) rather than from data: 'the boundary is unique along the sequential chain: once crossed it cannot be re-crossed back into adequacy. This is a corollary, not an observation — it follows from the theorem and does not need the data' — the first explicit statement of preservation-boundary uniqueness in the corpus"
  - "Restatement of the H-RR2 negative result with exact numbers, explicitly identified as 'the first of the four independent negatives that make up Document 07' (confirming Document 07's existence and role as the consolidated four-negative registry): R5→R4 (the crossing) Zero rate 0.0377 over 12,000 cases; R4→R3 (not a crossing) Zero rate 0.0426 over 12,000 cases; Zero vanishes entirely thereafter — 'the Zero rate at the boundary crossing is not distinguishable from the rate at a non-crossing step, and is in fact lower. Eliminability carries no signal about where preservation fails'"
  - "The exact final tie-violation count for the rank-invertibility audit withdrawal: 'desc≠(n+1)-asc when values tie — 21,369 violations; the induced partitions differ' — therefore 'this is NOT an instance of DECISION-01 (non-evidential invariance)... the headline built on it was withdrawn — both my wording and the review's replacement wording'"
  - "A NUANCED CLARIFICATION distinguishing where the adequacy/realization separation was and was not actually exhibited, refining Document 05's cleaner 'never exhibited' framing: 'what survives: the sensitivity is located precisely. Adequacy is nearly invariant across the [rank] convention change where realization is not, and the gap MEASURES THE SEPARATION between them — which is the ONE PLACE in the corpus where the adequacy/realization distinction was visible at all, even though it was not exhibited in the clean form Document 05 requires'"
  - "A consolidated 7-row FALSIFICATION SCORECARD summarizing every named hypothesis's final verdict: A (adequacy) SURVIVES; H-RR1/H-A (boundary exists) CONFIRMED; H-RR2 (Zero marks boundary) [NEG]; H-B (adequacy/realization separation) [DEFECT] — design could not exhibit it; H-C (non-monotone adequacy) structurally inapplicable, not refuted; H-D (reduction is multi-dimensional) CONFIRMED; H-E (Ĥ(R)≥Ĥ(Q)) holds at every level"
  - "A final consolidated 8-row status register summarizing every statement in the document with its exact epistemic tag"
