  as "one of the strongest Zero formulations produced so far," while rejecting three specific
  overclaims in the submitted formalization: an unjustified direct-sum decomposition, an
  unestablished projection-operator/idempotence claim, and an "Algebraic Zero" name that collides
  with established mathematical vocabulary.
introduces:
  - "Transformation-relative Zero (replacing 'Algebraic Zero'): Zero_{T,Π}(x) ⟺ Π(T(D))=Π(T(D\\x)) — a counterfactual eliminability judgment relative to a declared transformation T and an explicit inquiry-relative preservation contract Π, generalizing the submitted (O_I,B_I) pair-based criterion; Π itself is parameterized as Π_{Q,C,R,S} (inquiry, context, reasoning regime, epistemic standard), so different inquiry types (causal: adds identifiability I_d; governance: adds authorization A_u) instantiate different contracts"
  - "A formal architectural separation Invariant≠Zero, now expressible precisely: Inv_T(D)=Inv_T(T(D)) asks a structural-preservation-under-T question, while Zero_{T,Π}(x) asks a different, contract-relative eliminability question — an element can be non-invariant-but-Zero, invariant-but-not-Zero (if provenance matters), a difference-but-not-Zero, or a remainder-and-not-Zero"
  - "Rejection of the direct-sum decomposition T_R(D)=Inv_T(D)⊕Δ_R(D)⊕Rem_T(D) as unjustified for arbitrary representations (requires vector-space/module/group structure a corpus/graph/logical theory does not automatically have) — replaced with a plain structural tuple T_R(D)↦(Inv_T(D),Δ_R(D),Rem_T(D)), with direct-sum reserved as a provable special case in specific regimes"
  - "Generalization of Difference itself: Δ_R(D)=D-R only works for typed spaces (numbers/vectors/functions); for arbitrary representations the regime must supply Diff_R:D_R×R_R→Δ_R — restated as 'Difference itself is regime/representation dependent,' explicitly tied to the corpus's own prior Shapiro-derived insight"
  - "Rejection of the elimination operator's claimed 'projection' status: idempotence L(L(D))=L(D) is asserted but not established — a concrete counterexample sketch shows one-pass vs. iterative elimination can differ (removing a makes b redundant, then removing b makes c redundant) — reclassified as an 'elimination/retention operator,' with idempotence left as an empirical question (H1) rather than an assumed property"
  - "A fully specified 20-section adversarial empirical protocol (KR-ZERO-ALGEBRA-2026-09) with 8 primary research questions (RQ1-RQ8) and 11 algebraic hypotheses (H1-H11: idempotence, order-independence/commutativity L_A L_B=L_B L_A, fixed-point convergence, monotone decrease, individual-Zero⟹group-Zero, group-Zero-decomposes-to-individual, reference-invariance, contract-independence, Invariant=Zero coincidence, Remainder=D-Eliminated, RuleEliminable=CounterfactualZero) each required to resolve to CONFIRMED/REFUTED/PARTIALLY-CONFIRMED/INCONCLUSIVE/IMPLEMENTATION-DEFECT rather than a forced binary"
  - "The critical dual-path implementation requirement: PATH A computes the FORMAL counterfactual (baseline=Π(T(D)) vs counterfactual=Π(T(D\\x))) independently of PATH B's declared heuristic rule_eliminable(x,D,Π), explicitly forbidding making them identical by implementation and requiring disagreements to be reported as 'scientifically important' — directly preventing the corpus's own recurring overclaim pattern (declaring a heuristic proxy equivalent to a formal predicate without testing)"
  - "Adversarial case taxonomy (A-J) explicitly targeting hidden boundary-sensitivity: cases where removing x preserves the visible answer but changes provenance/uncertainty/contradiction-status/scope, and — most importantly — cases I/J where two elements are individually Zero but jointly non-Zero (or vice versa), explicitly flagged as testing whether Zero is genuinely element-wise or requires a set/group formulation"
  - "An explicit STOP-condition list (Section 19): stop and report rather than silently repair the theory if the preservation contract cannot be operationalized, equality between contract outputs is undefined, a result depends on an arbitrary implementation choice, or a property appears true only because the generator excludes counterexamples"
