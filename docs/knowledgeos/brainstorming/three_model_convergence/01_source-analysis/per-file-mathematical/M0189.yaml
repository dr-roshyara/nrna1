about: >
  A disciplined review-and-redesign of a proposed "Algebraic Zero" formalization for the corpus's
  long-tracked Zero concept (Zero Lens, Zero closure predicate — M0057-M0064 and onward), followed
  by a fully specified, adversarial, 20-section empirical research protocol (KR-ZERO-ALGEBRA-2026-09)
