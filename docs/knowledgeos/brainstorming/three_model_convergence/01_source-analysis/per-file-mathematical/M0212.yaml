about: >
  Reframes the corpus's KR-ZERO-ORDER-2026-09 higher-order-Zero results as evidence for a
  mechanism-discovery research question, not a universal law: "Zero_{T,Π}(S;D) is predominantly
  locally determined, but not universally singleton-determined." Introduces a genuinely new formal
  quantity (interaction order), a new counterfactual-structural-decomposition analysis method for
  irreducible witnesses, escalates the thread's ongoing denominator-discrepancy problem with two
  further unreconciled figures, and resequences the whole research programme so that the
  mathematical carrier is discovered from the mechanism rather than assumed in advance.
introduces:
  - "A new formal quantity, the interaction order: ord_{T,Π}(S;D)=min{k: Zero(S;D) is decidable from admissible information of order ≤k} — explicitly marked a research definition, not yet a ratified mathematical construct — with the interpretive hypothesis (to be tested, not assumed) that ord=1 corresponds to independent/local eliminability, ord=2 to pairwise interaction, ord=3 to genuine three-way interaction"
  - "A new analysis methodology, 'counterfactual structural decomposition,' replacing mere classification of the 115 irreducible cases: for every irreducible witness, ask 'what changes when the interaction-producing structure is removed?' and identify the minimal structural feature F⊆R on which Zero(S;D) depends — with a proposed reporting table (Witness/T/S/k/Structural cause/Minimal dependency), explicitly naming the last two columns as 'the actual scientific target'"
  - "ESCALATION OF THE DENOMINATOR DISCREPANCY: two further unreconciled figures beyond the already-tracked 1395/1496/1475 (M0198/M0200) — a total of 1500, and a SECOND percentage pair (90.04%/7.89%) alongside the already-established 89.7%/8.24% — explicitly demanding a full accounting identity N_generated=N_eligible+N_excluded+N_vacuous+N_invalid+... before any percentage is treated as a headline empirical estimate: '1500≠1395≠1496≠1475... cannot simply be left implicit'"
  - "A resequenced research programme: ORDER→MECHANISM→CARRIER→REPRESENTATION-REDUCTION, explicitly REJECTING the more direct ORDER→REPRESENTATION-REDUCTION sequence used by the parallel M0196-M0210 track — because 'the carrier should be discovered from the mechanism,' with explicit carrier-hypothesis mappings: duplicate interaction→multiset; pairwise relation→graph; higher-order relation→hypergraph; state-dependent rewriting→relational/rewrite-state representation"
  - "A new commissioned experiment, KR-ZERO-MECHANISM-2026-09, with three explicit gates: (1) Denominator/accounting reconciliation; (2) Complete witness extraction for irreducible cases; (3) Mechanism classification + minimal dependency analysis — 'only after those pass should we decide whether the next formal object is a graph, hypergraph, multiset, rewrite system, or something else,' making the empirical-to-mathematical-structure transition 'evidence-driven rather than theory-driven'"
defines:
