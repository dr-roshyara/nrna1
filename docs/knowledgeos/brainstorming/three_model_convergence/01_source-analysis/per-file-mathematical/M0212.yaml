refines:
  - "M0194/M0195/M0198's already-established higher-order-Zero findings: reframed from 'Zero is predominantly singleton-determined, with a non-negligible higher-order class' into a sharper, more actionable research question about the STRUCTURAL MECHANISM producing higher-order behavior, rather than merely its frequency"
