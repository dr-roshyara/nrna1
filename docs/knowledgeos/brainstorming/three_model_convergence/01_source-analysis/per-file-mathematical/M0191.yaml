  ("don't change Theory v1.2 and don't touch kernel selection... create this as a new research
  lane") — a notably more disciplined scope boundary than most of the concurrently-processed
  ratification-tension arc documents, which repeatedly blurred research findings into premature
  theory-ratification claims.
