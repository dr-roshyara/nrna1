about: >
  The most comprehensive, disciplined experimental design document in the entire Zero-algebra/
  representation-reduction thread: a 29-section Claude Code/Codex implementation prompt for
  KR-BRIDGE-01-ZERO-PRESERVATION-2026-09, explicitly designed as a bridge/falsification experiment
  between the independently-established KR-ZERO and KR-REP-REDUCTION result families — directly
  attacking the central open question this thread has left unresolved since M0219/M0225 (whether
  Zero is systematically related to preservation/adequacy at all), with explicit instructions NOT to
  privilege any hypothesis and to treat a clean negative result as fully successful.
introduces:
  - "The central primary research question with four explicit non-privileged hypotheses: H0 (Zero and preservation not systematically related in the tested regime); H1 (Zero associated with preservation under specified conditions); H2 (Zero predictive only under particular transformation/observable/contract configurations); H3 (any apparent relationship explained by a confounding factor) — 'do NOT privilege H1'"
  - "CRITICAL DESIGN RULE explicitly learned from KR-REP-REDUCTION's limitation (M0219's DPI-derived structural constraint): use a PARALLEL representation family (R_a=T_a(D), R_b=T_b(D), independently generated, neither a deterministic function of the other), NOT only a deterministic sequential chain — because a sequential chain R(n-1)=T(Rn) has H(Q|Rn)≤H(Q|R(n-1)) and therefore CANNOT test non-monotone adequacy, the exact limitation this thread already discovered and now explicitly designs around"
  - "An explicit anti-circularity rule for the Zero/Q relationship: 'NEVER DEFINE ZERO USING Q' — Zero_{T,Π}(S;D) must use its own declared observable Π, structurally independent of the preservation target Q; defining Zero(S):=Q(D)=Q(E_S(D)) 'would build the desired bridge into the definition' — the clearest, most explicit statement of this circularity guard in the entire thread"
  - "The FOUR-CELL CROSSING DESIGN, the experiment's central methodological innovation: a 2×2 contingency table {Zero,¬Zero}×{Adequate,Inadequate} = {Z+A, Z-I, NZ+A, NZ-I}, with explicit interpretation — a populated Z-I (Zero+Inadequate) cell would demonstrate Zero is NOT SUFFICIENT for preservation; a populated NZ+A (Non-Zero+Adequate) cell would demonstrate Zero is NOT NECESSARY for preservation; if either cell is empty, the design mandates investigating WHY (generator constraints/contract constraints/transformation design/sample size/mathematical necessity/implementation error) rather than declaring a law"
  - "A six-control battery required before any interpretation: CONTROL A (known information-preserving representation); CONTROL B (known information-destroying representation); CONTROL C (invertible recoding of the same representation); CONTROL D (a representation where Zero is known to vary independently of Q, if the generator permits); CONTROL E (positive control that the preservation test can detect information loss); CONTROL F (positive control that the Zero test can detect elimination differences)"
  - "Ten explicit required falsification questions (Q1-Q10): can Zero occur while preservation fails; can preservation hold while Zero fails; does the relationship survive changes in T, in Π, in contract, in redundancy; does determination order predict preservation independently of T/Π/C; does the relationship survive an invertible recoding; is any apparent relationship explained by transformation class or by the preservation target Q itself"
  - "Four required outcome classes, each with an explicit interpretive boundary: OUTCOME A (no relationship observed — 'Zero remains analytically independent in the tested regime,' explicitly NOT proof of universal independence); OUTCOME B (conditional relationship — do NOT generalize beyond the tested T/Π/C/Q configuration); OUTCOME C (robust relationship, surviving transformations/observables/contracts/controls — the ONLY case in which a formal bridge hypothesis may be proposed for a new experiment); OUTCOME D (design failure — the four-way space cannot be generated or controls fail; do not interpret results theoretically, revise the experiment instead)"
  - "An explicit reframed success criterion: 'the experiment is NOT successful merely because it finds an association. It is successful if it establishes, with controlled evidence, whether the Zero/preservation bridge is absent, conditional, robust, or currently untestable. A clean negative result is equally valuable.'"
  - "A hard governance-immutability constraint: DO NOT modify Theory v1.2, KR-ZERO historical results, KR-REP-REDUCTION historical results, kernel operators, production application code/database, or existing governance decisions; if a new finding conflicts with an old statement, record the conflict for adjudication rather than silently rewriting historical artifacts"
  - "Confounding-analysis requirement: stratify by transformation T, observable Π, contract C, representation family, source structure, and elimination size |S|; report both pooled and stratified relationships, and explicitly forbid reporting an association that disappears after stratification as a general Zero-preservation relationship"
  - "Explicit T×Π interaction testing requirement, directly citing the already-established finding that Zero behavior is transformation-specific and that mechanism analysis found interaction effects — with an explicit prohibition against resurrecting the already-withdrawn claim 'relational transformations produce higher order; element-wise transformations do not'"
defines:
