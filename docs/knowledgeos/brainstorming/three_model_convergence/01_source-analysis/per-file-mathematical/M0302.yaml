about: >
  A substantial formal development applying DDD bounded-context separation (Question/Claim/Evidence/Challenge/Determination/Revision contexts) to locate where Knowledge Sunya arises: not in any single object, but in a MISSING RELATION between contexts (e.g. Claim minus Question -> determination may vanish while the claim persists). Formally states H-SUNYA-01 ('Relational Epistemic Emptiness'): Empty_{Q,C,E,S}(x,K_t) iff no d exists such that Determine(d|x,Q,C,E,S,K_t), while explicitly preserving Empty does-not-imply not-True(x) and does-not-imply x=empty. Distinguishes Object Sunya / Determination Sunya / Relational Sunya (Contribution(X|Q,C,E)=0) as three non-equivalent concepts, and proposes K_t=(C_t,E_t,Ch_t,D_t,Q_t,R_t,H_t) as an explicit DDD-flavored knowledge-state signature. NOTE: this document's own H-SUNYA-01 formalization needs cross-referencing against the already-classified H-SUNYA-01 record in the original 282-file pass (M0270-M0282 range, per that range's own summary) to determine whether this is the originating document, an independent parallel draft, or a duplicate under a different session -- NOT resolved in this reconciliation pass; flagged as an open question.
introduces:
