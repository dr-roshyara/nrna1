  - "M0234's initial K_min=argmin Complexity(K) formulation: explicitly corrected/postponed until the semantic partial order K1⪯_sem K2 is established, since 'complexity' was never defined"
  - "M0234's five-item Kernel≠X exclusions and 32-item FOUNDATIONAL RESEARCH CLOSURE: both carried forward and formally justified via the completed theorem apparatus"
  - "This reconstruction's much earlier 13-vs-8-operator kernel-cardinality instability finding: given its definitive mathematical resolution (K_A≡_sem K_B despite differing packagings/counts)"
