about: >
  A methodological correction to a proposed KR-CONTRIBUTION-01 experiment: the candidate hypothesis C_Q^+(D)+C_Q^-(D)=0 already assumes a positive/negative decomposition, an addition operation, an identity element, and composability -- exactly the structure the experiment is meant to discover. Replaces this with a neutral preregistration: C_Q(x|D) in a contribution space, a candidate polarity map P_Q to {+,-,0,?}, and an unknown composition relation Gamma_Q (a relation, not assumed to be a function/operation) to be characterized empirically.
