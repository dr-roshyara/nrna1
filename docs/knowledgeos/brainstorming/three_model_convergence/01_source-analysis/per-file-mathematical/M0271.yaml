title: "KR-STATE-TRANSITION-01 refined: 'the transition itself becomes an epistemic object' — a tripartite residue Δ_t=(Δ_t^-,Δ_t^○,Δ_t^+) replacing naive set-difference, the 'Residue Necessity' principle (two different transitions can reach the same endpoint state with different histories — 'endpoint state alone is insufficient'), a properly defined reversibility relation, a category-vs-monoid open question for transitions, a clean six-row 'Taxonomy of Non-Being' table, six formal hypotheses (H1-H6), and a concrete JSON implementation schema for logging transition records — part of the KR-ALGEBRA/Contribution research thread later declared negative and closed by the consolidated Theory series (Document 13/M0266)"
