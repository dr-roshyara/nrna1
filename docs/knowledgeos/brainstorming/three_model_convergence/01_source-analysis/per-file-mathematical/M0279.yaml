title: "KR-STATE-01 working spec finalized, with a genuine statistical correction reusing the corpus's established BRIDGE methodology: 0<M_ij<1 does NOT establish correlation/dependence (worked counterexample), corrected via a proper marginal-vs-conditional comparison and an imported risk-difference statistic RD_ij; three logical/statistical relationships (implication/association/independence) formally separated and never to be conflated; mandatory stratified (not just pooled) analysis reusing the BRIDGE-01/02 confounding lesson; and the crucial framing that some 'Zero' variants may turn out to be DERIVED functions of others rather than independent state dimensions"
