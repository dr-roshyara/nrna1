about: >
  **CORPUS-INTEGRITY NAMING MISMATCH**: the document's own heading is "EXPERIMENT G -- SAT_c /
  EPISTEMIC EVALUATION SEMANTICS," but its declared Experiment ID is "KR-SIM-2026-09-02-E" -- a
  letter/ID mismatch. Later in the same document, a genuinely DIFFERENT proposed experiment
  ("Contradiction and Epistemic Status Semantic Closure") is explicitly named "KR-SIM-2026-09-02-G,"
  REUSING the letter G for unrelated content. Flagged as a corpus-integrity issue for the eventual
  reclassification pass, alongside the earlier G1-G9/G1-G10 registry-naming collision (M0049).

  **PART 1 -- THE REWRITTEN EXPERIMENT PROMPT (not itself confirmed executed within this document)**:
  makes **Eval_c(K_t,r,Gamma_t) -> EVal_c the primary research object**, demoting Sat_c to a
  possible projection (Sat_c := value o Eval_c, "do not assume this equivalence") -- directly
  implementing M0053's own recommended reframing. Introduces an explicit **six-level distinction**
  (semantic specification / candidate evaluator / implementation / experimental observation /
  theoretical derivation / governance decision) that must never be collapsed -- richer than any
  prior classification-discipline statement in the pass.

  **DELIVERS A NINE-ITEM REASON VOCABULARY** (UNOBSERVED, UNINTERPRETED, UNDERDETERMINED,
  INSUFFICIENT_PROVENANCE, NO_EVALUATOR, NO_ORDERING, NO_TEMPORAL_SEMANTICS, DELTA_UNDEFINED,
  UNOBSERVABLE), consolidating M0052's three-branch (epistemic/theory/world) U taxonomy into named
  leaves while explicitly refusing exhaustiveness ("if another reason is required, report it as a
  discovered candidate").

  **INTRODUCES THE OPEN-vs-U EPISTEMIC-CATEGORY DISTINCTION, LATER CONFIRMED CRITICAL BY EXPERIMENT
  H**: for the p-and-not-p contradiction case, "the critical question is not which value should D
  receive -- it is: does the existing theory contain enough semantics to determine what D means? If
  not, the correct result is [OPEN], not U invented by convention." This distinguishes OPEN (the
  THEORY has not specified enough to evaluate at all) from U (the evaluator ran and returned
  undetermined) -- a genuinely new, sharper epistemic category than the pass's prior U-taxonomies.

  **INTRODUCES THE TRUTH-ORTHOGONAL-TO-CLOSURE NOTATION**: "if no existing semantic component
  legitimately establishes truth... record Truth ⟂ Closure" -- using an orthogonality symbol rather
  than mere non-implication, a slightly stronger and more precise statement than M0051/M0052's
  Zero-does-not-imply-Truth findings.

  **DELIVERS PHASE D1, SEPARATING FOUR DISTINCT ZERO-CONSEQUENCE CLAIMS**: Zero=>Truth, Zero=>
  Knowledge, Zero=>Decision-readiness, Zero=>No-remaining-epistemic-work -- "these are distinct
  claims. Do not conflate them," a further decomposition beyond the single Closure!=Truth finding
  (M0052/M0051), recognizing that "no more epistemic work" and "the knowledge is true" and "ready to
  decide" are three separately-testable claims that collapsing Zero would otherwise conflate.

  **DELIVERS TEN REQUIRED NEGATIVE (FALSIFICATION-SEEKING) TESTS N1-N10**: Eval_c is total; three
  values are sufficient; every U has a valid reason; the eight classes are mutually independent; the
  eight classes are exhaustive; Kleene conjunction is appropriate; operational evaluation is
  well-founded; Zero implies truth; Zero_reasoned is merely another spelling of Zero_weak; supplying
  evaluators automatically makes Sat canonical -- with the explicit rule "a failed negative test is
  a result, not a problem to repair away," the clearest single falsification-first discipline
  statement in the pass.

  **PART 2 -- CONFIRMS A FURTHER EXECUTED EXPERIMENT ("H -- Repair Phase and Re-ordered Re-run")**:
  reports that PB-2's strongest candidate repair (R_b, delegating content contradiction to
  Sat_consistency) is explicitly NOT adopted, because Sat_consistency itself remains undefined --
  "Sat_content(K,r)=Sat_consistency(K,r) for contradictory content would be premature theory
  selection, not an experimentally established result." PB-3 remains open (three structural U-
  sources is "a promising model," not proven exhaustive). PB-5 has "stratification" as the dominant
  candidate, but its underlying measure/stratification semantics remain theory-unestablished.
  Zero_strict=>Zero_reasoned=>Zero_weak is now classified [DERIVED] (a logical relation following
  from the definitions themselves, an upgrade from M0052's "experimentally supported" status), but
  this is explicitly NOT the same as which Zero interpretation KnowledgeOS should normatively adopt.

  **RE-ORDERS THE RESEARCH SEQUENCE A SECOND TIME**: from "repair -> evaluators -> Zero" to "semantic
  foundation -> repair -> evaluation -> closure," inserting TWO new prerequisite experiments before
  even reaching Eval_c/Sat_c: **Experiment I (Contradiction/Consistency Semantics)**, testing a
  four-row truth table (p-only, not-p-only, neither, both) with the OPEN-vs-U distinction as its
  central question; **Experiment II (Epistemic Status Order)**, testing whether the theory actually
  supports an ordering such as UNKNOWN < HYPOTHESIZED < DETERMINED < CORROBORATED, explicitly "do not
  assume this ordering"; only then **Experiment III (Evaluation Semantics)** and **Experiment IV
  (Zero Closure)**.

  **DELIVERS AN IMPORTANT SCOPE-LIMITING CORRECTION TO A PRIOR VERDICT**: "Zero is the closure
  predicate of the whole theory" is judged "too strong given the evidence currently available" --
  revised to "in the tested v1.2 model, Zero functions as the candidate closure predicate through
  which adequacy and downstream decision conditions are evaluated. Whether Zero is canonically the
  theory's closure construct remains OPEN" -- explicitly guarding against "a simulator convenience
  silently becoming a theoretical primitive."

  **PROPOSES THE NEXT EXPERIMENT EXPLICITLY MISLABELED "KR-SIM-2026-09-02-G"**: "Contradiction and
  Epistemic Status Semantic Closure" -- reusing the letter G already claimed (with a mismatched ID)
  by Part 1's own "Experiment G" prompt, for entirely different content (contradiction/consistency
  and epistemic-status-order semantics, not evaluation-semantics repair).
