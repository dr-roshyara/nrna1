about: >
  Proposes a sharper, testable three-part hypothesis than the preceding Yoni Lens documents:
  K_Linga(K_t,Q_t) -> P_t (an epistemic projection/contribution -- proposal, hypothesis,
  assertion, question, candidate interpretation, expected state, or candidate action), then
  Y_Transform(P_t,E_t,H_t,C_t,S_t,R_t) -> O_t (the candidate offspring), explicitly testing --
  not assuming -- whether the kernel's irreducible function can be interpreted as "the Linga
  pole," i.e. K = initiating differentiation rather than merely storage.

  **PROPOSES A FIVE-WAY NON-COLLAPSE CHAIN AS THE EXPERIMENT'S CENTRAL TEST TARGET**: Projection
  != Transformation != Offspring != Knowledge != Truth != ClosureEvent -- explicitly framed as
  preventing the metaphor from collapsing five distinct concepts into one, directly extending the
  corpus's established non-collapse discipline pattern (cf. M0073-M0080's Reconciliation!=
  Closure!=Determination!=Knowledge!=Truth chain) to a new set of constructs.

  **DESIGNS A GENUINELY WELL-CONSTRUCTED 2x2 ADVERSARIAL EXPERIMENT**: projection-absent/field-
  absent (can anything emerge?), projection-present/field-absent (can projection alone generate
  offspring?), projection-absent/field-present (can field generate offspring without projection?),
  and projection-present/field-present (does interaction generate a distinct offspring?) -- with
  the interesting result framed as Projection + Field -> Transformation while neither alone
  suffices, explicitly instructed to let the experiment falsify this rather than assume it.

  **DESIGNS TWO FURTHER CONTROLLED VARIATION TESTS**: (a) same projection P_1=H, different field
  conditions (E_1|=H vs E_1|=not-H vs E_1=empty), observing whether the SAME projection under
  DIFFERENT field conditions yields DIFFERENT offspring (H determined / H rejected / H
  unresolved) -- framed as the potentially deepest structural result, "Same Projection + Different
  Field => Different Offspring"; (b) the reverse, holding the field constant and varying the
  projection (P_1, P_2, P_3), to test whether Linga and Yoni are functionally distinguishable
  poles.

  **NAMES THE DECISIVE EXPERIMENT KR-LINGA-YONI-2026-09-02** with three explicit null hypotheses:
  H0-A (Linga and Yoni are not functionally distinguishable), H0-B (Yoni is merely a different
  description of ordinary state transition), H0-C (Offspring is merely another name for K_{t+1}
  with no additional useful semantics) -- against the alternative that Linga, Yoni, and Offspring
  correspond to three functionally distinguishable roles in epistemic transformation.

  **EXPLICITLY REFUSES THE OBVIOUS OVERCLAIM EVEN CONDITIONAL ON SUCCESS**: "If the experiment
  succeeds, we should not immediately conclude that the kernel is Linga. Instead, the result could
  be: Kernel has a Linga-like functional pole" -- reframing the corpus's ongoing kernel-boundary
  question (cf. M0080's kernel-vs-history question) as: "Is the kernel the whole epistemic
  process, or is it the minimal initiating mechanism embedded in a larger epistemic field?" --
  and proposing the Linga/Yoni experiment as a way to test this question "without assuming the
  answer."

  Presents the full analogical mapping table (Linga->initiating mechanism, Yoni->receptive-
  transformative field, union->epistemic interaction, tension->unresolved discrepancy,
  argument->differentiated contribution, reconciliation->assessment outcome, orgasm->closure
  event, offspring->emergent epistemic product, new cycle->recursive inquiry), explicitly marked:
  "these remain analogical mappings until experimentally supported. The metaphor itself cannot
  establish the KnowledgeOS ontology" -- exemplary epistemic discipline.

  Proposes typing Offspring as a genuine variant set O_{t+1} in {K_{t+1}, Revision, Hypothesis,
  Rejection, Conflict, Uncertainty, ClosureEvent, ...} rather than assuming it always equals
  knowledge, with the suggested strongest formulation Offspring = Emergent Epistemic Product --
  explicitly allowing "the available evidence cannot determine H" to count as a legitimate
  epistemic outcome even though it is not knowledge of H.
