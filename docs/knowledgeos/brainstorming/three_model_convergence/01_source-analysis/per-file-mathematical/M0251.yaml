  - "Δ_{T,Π}(x;D)∈𝒞 — the general semantic contribution of x, valued in an unspecified contribution space 𝒞 (not assumed ℝ)"
  - "Zero-A (contribution Zero) vs Zero-B (observational Zero) — two explicitly non-equivalent notions of Zero"
  - "Neg_{T,Π,Q}(x;D) / Pos_{T,Π,Q}(x;D) — typed adverse/supporting contribution relations, kept explicitly separate from Zero"
  - "𝒫={+,0,-,?} — a candidate (non-axiomatic) polarity domain"
