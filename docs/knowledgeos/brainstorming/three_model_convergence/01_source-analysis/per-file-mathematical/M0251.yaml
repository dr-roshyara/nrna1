title: "A rare pre-emptive textual-search refutation ('no occurrence of negative/minus found') stops a possible overclaim before it starts, correctly attributes signed-number history to Brahmagupta (not the Atharva Veda), then builds a genuinely new SIGNED CONTRIBUTION theory: Zero-A (contribution-Zero) vs Zero-B (observational Zero) explicitly NOT automatically equivalent, a Zero≠Cancellation mechanistic hypothesis (C(a)=+1,C(b)=-1 ⟹ pair-neutral without either being individually Zero) offered as a candidate explanation for the corpus's own group-Zero≠individual-Zero finding, a typed non-numeric polarity domain {+,0,-,?}, and a new prerequisite experiment KR-CONTRIBUTION-01 inserted BEFORE the Knowledge Algebra construction attempt"
