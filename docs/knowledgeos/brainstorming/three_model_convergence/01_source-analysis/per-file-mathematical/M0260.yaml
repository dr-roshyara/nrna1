title: "Theory 07 — The Bridge Programme: a Stable Negative: the full consolidated three-experiment Bridge programme (BRIDGE-01/02/03), delivering for the first time in this pass the complete BRIDGE-03 protocol and results (nine calibrated redundancy regimes; an elegant mathematical explanation for why flattening the redundancy distribution FAILS to raise informative strata; record count identified as the actual effective lever; population size ruled out; the BRIDGE-02 borderline cell definitively closed as noise at 0.000000 exactly) plus a genuinely important structural finding that adequacy SATURATES (67 dead cells invariant across all nine regimes, a property of the adequacy definition itself, not the generator) and a final precisely-refutable standing conjecture that no Zero/preservation bridge exists for read-disjoint (Π,Q)"
