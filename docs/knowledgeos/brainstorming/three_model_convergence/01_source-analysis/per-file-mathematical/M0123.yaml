about: >
  Proposes implementing the FDE-inspired evaluation layer as a sandboxed experiment, explicitly
  bounded: "implement the candidate evaluation mechanism, not 'FDE as KnowledgeOS logic.'" Proposes
  a small pipeline (Evidence -> EvidenceAssessment -> Standing(positive/negative support) ->
  Evaluation(+Boundary/Reason, Context, Provenance) -> Determination -> AttributedState), with the
  experimental core Standing(p)=(S+,S-) in {0,1}^2 giving four interpretations (positive support,
  negative support, conflict, no support).

  **EXPLICITLY REFUSES TO REIFY PRIEST'S VALUES AS A KNOWLEDGEOS DOMAIN PRIMITIVE**: rejects an
  enum KnowledgeState{TRUE,FALSE,BOTH,NEITHER} as premature ontology, proposing instead an
  experimental-only record Standing(positive,negative) kept separate from a record Boundary(facet,
  condition,context,provenance) -- reinforcing that (0,0) can mean no-evidence, not-assessed,
  unobservable, underdetermined, or theory-incomplete, none of which FDE alone can distinguish.

  **PROPOSES FOUR EXPERIMENTAL ADAPTERS** (Classical/K3/FDE/Structured, not four KnowledgeOS
  states) tested against the fourteen scenarios from M0120, measuring required-distinction ->
  representation -> preserved/collapsed -> reason-for-collapse, with distinction preservation
  (not value count) as the key metric. Specifies a concrete artifact directory layout (experiments/
  KR-CONTR-FDE-2026-09/ with scenarios/, models/{classical,k3,fde,structured}/, evaluators/,
  invariants/, witnesses/, results/, verdict.md).

  **APPLIES A DISCIPLINED CORRECTION AT THE IMPLEMENTATION LEVEL**: refuses to implement
  Contr(p)=S+(p) AND S-(p) directly as the definition of Contr; instead implements it as a
  candidate detector (FDEConflictDetector), to be TESTED for equivalence against epistemic Contr
  across the scenarios rather than assumed identical -- "the experiment may demonstrate that FDE
  conflict is useful for representing contradiction without demonstrating that it is identical to
  KnowledgeOS Contr."

  Closes by proposing the precise research question the implementation should answer: "can
  independent positive/negative support plus an orthogonal boundary/reason dimension preserve all
  distinctions that KnowledgeOS currently requires for Contr and Zero?" -- and offers to design
  exact classes/interfaces against the actual codebase if given repository access, explicitly not
  modifying the constitutional kernel, Theory v1.2, A_t, or production domain vocabulary.
