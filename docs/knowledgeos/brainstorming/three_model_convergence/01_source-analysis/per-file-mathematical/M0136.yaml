mathematical_content: >
  States standard FOL entailment (S⊨α), CWA (KB⁺, KB⊨_C α), default-logic extensions
  (⟨α:β/δ⟩), Bayes' rule, belief-network factorization, subsumption (d1⊑d2), prime implicates, and
  situation-calculus successor-state axioms (F(x,do(a,s))≡γ_F(x,a,s)∨(F(x,s)∧¬δ_F(x,a,s))) — all
  cited as established textbook formalism, not original derivations of this corpus.
