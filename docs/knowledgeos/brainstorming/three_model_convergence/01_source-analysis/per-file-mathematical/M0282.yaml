title: "FINAL FILE of the 282-file pass: Knowledge Zero as zeroing selected dimensions — introduces FOCUS (deliberate dimensional restriction) vs SURFACE (joint observation of all dimensions) as formal concepts distinct from both Elimination Zero and Determination Śūnya, connects dimensional cross-interaction directly to the corpus's earlier-established higher-order eliminability finding, links to the previously-unexplained KR-ZOOM references (M0263) via a 'zoom' operation (Surface→Focus→deeper Focus→re-expand), and closes with a THIRD disciplined self-correction pass catching three real overclaims (an unjustified algebraic-identity assumption for zeroed dimensions, an unjustified additive determination-differential, and a premature scalar determination_score schema field) — ending the entire pass with the cleanest final reformulation: 'what happens to knowledge when selected dimensions are made epistemically silent?'"
