about: >
  An implementation-level refinement of M0201's frozen 12-phase audit contract, confirming it
  "coherent enough to proceed to implementation" while correcting one genuine implementation risk
  (implicit Python object equality for structured R/Q values) and adding a closed-form combinatorial
  identity for N_viol computation, a transformation-registry schema addition, and a numerical-
  tolerance refinement for the n* determination — all while reiterating (for the third time in this
  thread) the discipline against treating k=1/k=2/k=3/irreducible as R1..R5 levels, and insisting the
  actual corpus must be inspected before any mapping parser is written.
introduces:
  - "A closed-form combinatorial identity for N_viol, replacing an implied O(pairs) implementation: for an R-fiber with Q-value counts c_{r,q1},...,c_{r,qk}, the number of conflicting unordered pairs is V_r=Σ_{a<b}c_{r,qa}c_{r,qb}=[(Σ_q c_{r,q})²−Σ_q c_{r,q}²]/2, and N_viol=Σ_r V_r — avoiding repeated q_list.count(q_val) calls and making the statistic's structural meaning explicit"
  - "A canonicalized-equality implementation contract: 'R_n equality := canonicalized representation equality' and 'Q equality := canonicalized inquiry-state equality,' explicitly replacing reliance on implicit Python object equality/hashability — necessary because the KR-ZERO corpus may contain structured (non-trivially-hashable) objects"
  - "An explicit canonical_n_star() method specification using epsilon-tolerant entropy comparison (abs(H_Q_given_R)<=epsilon with a documented tolerance) rather than floating-point exact equality — while noting that for an exact finite categorical calculation, entropy should theoretically evaluate to exactly zero whenever every empirical fiber has a single Q, so the tolerance is a numerical-robustness safeguard, not a concession that zero is merely approximate"
  - "An explicit transformation-registry schema addition (T5_definition...T1_definition, or a registry with transformation_id/input_level/output_level/transformation_definition/source_provenance/reconstruction_status) — motivated by the observation that otherwise 'we can measure that R5→R4 lost information without being able to establish what operation actually caused the loss,' explicitly flagged as 'crucial for the later mechanism experiment'"
  - "A consolidated final execution architecture diagram: Actual KR-ZERO Corpus → Schema Discovery → Denominator Reconciliation → Q Independence Audit → R5..R1 Reconstruction Audit (branching OBSERVED/UNOBSERVED→NULL) → KR-REP-DATASET → Level Metrics → n* → Boundary Diagnosis"
defines:
  - "V_r=[(Σ_q c_{r,q})²−Σ_q c_{r,q}²]/2 — the closed-form per-fiber violation count"
