title: "Implementation refinement of M0201's auditor: a closed-form N_viol formula from fiber counts, a canonicalized-equality contract for structured R/Q objects, an explicit transformation registry addition to trace WHICH operation caused information loss, and epsilon-tolerant (not floating-point-exact) entropy comparison for n*"
