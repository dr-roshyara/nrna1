about: >
  Document 02 of the new 15-document consolidated theory series (M0255), explicitly self-declared
  as "the load-bearing result of the programme." Delivers the final, rigorously epistemic-status-
  tagged statement of the corpus's central finding — that Eliminability (Zero), Preservation
  (Adequacy), and Realization are three genuinely distinct, non-implying questions — with a
  business-language translation, the full experimental evidence chain for each of the three
  pairwise non-implications (including a fourth, previously unrecorded bridge experiment,
  KR-BRIDGE-03), a new explicit design-defect acknowledgment about the original KR-REP-REDUCTION
  experiment, a logical-rigor clarification about corollary status, decision-relevant consequences
  for implementation, and a new testable conjecture about ordering among the three predicates.
introduces:
  - "The final consolidated statement, deliberately kept [EXP] not [THM]: Zero_{T,Π}(S;D) ≠ Adequate(T,Q) ≠ Realized(T,Q,O) as three genuinely distinct questions — 'we have no proof that these must differ in general. We have demonstration that they do differ in every system tested, by independent mechanisms. Promoting this to a theorem would require proving the separations are necessary — which nobody has done, and which the epistemic-status rule exists to prevent us from doing by accident'"
  - "A business-language translation using a concrete customer record (Customer=Müller, Order=€1,000, Channel=Online, Time=10:42, Internal ID=847291) and the question 'which channel generated the highest revenue?': Eliminability asks can I drop the timestamp without changing what I observe; Preservation asks is the channel-revenue answer still determined by what remains; Realization asks can the downstream report actually compute it from what remains — 'a system which answers one and assumes the others is wrong in a way that is invisible until it matters'"
  - "The full evidence chain for §3.1 (Eliminability does NOT predict Preservation), now including a FOURTH bridge experiment not previously recorded in this pass: KR-REP-REDUCTION H-RR2 (Zero rate 0.0377 at the R5→R4 crossing vs. 0.0426 at the non-crossing R4→R3 — 'not distinguishable'; Zero vanishes entirely at R3); KR-BRIDGE-01 (marginal RD=-0.363, fully accounted for by redundancy as a common cause); KR-BRIDGE-02 (H1 not refuted; the one substantial candidate was an artifact of shared reads); and NEW — KR-BRIDGE-03 (5Π×5Q×7T design, gated, run at '13× the informative strata' of BRIDGE-02: 'H1 not refuted; surviving cells 14→1, substantive 0' — the negative result is 'stable under a 13-fold increase in power, which is the strongest form this evidence can currently take')"
  - "A new explicit self-critical [DEFECT] finding about the original KR-REP-REDUCTION design (M0219): 'the design failed to operationalize' the Preservation-does-not-give-Realization separation — its transformation chain never dropped a record or a source, so the constraint C could never fail, and the only adequate level had F=1.0000 — 'the separation is real; that experiment could not exhibit it. Recorded as a design defect rather than as evidence against the separation'"
  - "A logical-rigor clarification for §3.3 (Eliminability does NOT give Realization): explicitly NOT labeled [COR] (corollary), since 'not implied via A and not implied via B' is not a valid derivation — instead separately observed via construction: Zero is defined by Π, which is read-disjoint from Q BY CONSTRUCTION, so 'Zero carries no information about Q's recoverability by design' — 'we built them to be independent, and then verified the independence held'"
  - "A decision-relevant consequences table for practical implementation failure modes: conflating Eliminability with Preservation → deleting fields that were 'safe to remove' and losing the answer; conflating Preservation with Realization → certifying a representation as adequate that the consumer cannot read; conflating Eliminability with Realization → both failures, silently — 'the three predicates need three separate gates in any implementation. Document 12 places those gates in the DDD model' — confirming Document 12 of the series exists and connects this apparatus to a DDD model"
  - "A new testable [CONJ]: Realization ⟹ Adequacy — 'if a fixed decoder recovers Q from R, then R determines Q on the realized cases' — with an explicit refutation condition given but NOT yet tested: a case where O(T(D))=Q(D) holds on every observed case while the fiber is Q-heterogeneous, i.e. the decoder is right by luck"
  - "Two remaining explicit [OPEN] items closing the document: whether the three separations must hold in general or only in the tested carriers (the [EXP]-to-[THM] gap); and whether the separations survive a non-synthetic carrier ('the central transfer problem')"
