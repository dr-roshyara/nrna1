about: >
  Formally accepts M0098's core insight ("a representation cannot recover distinctions that its
  projection has identified") and governing principle (Structure -> Projection -> Induced
  Equivalence -> Information Loss -> Invariant Preservation -> Adequacy) as the confirmed research
  path, restating the unifying pattern across six named prior failures (Sat_c's value-compose-
  Eval_c 9->1 collapse; Zero's pi_V(B) boundary-type ambiguity; Gap's pi_Q(B) kind/remediability
  insufficiency; Balanced's scalar-compose-AF relation-type loss; K's E_t->K_t factivity-relevant
  distinction loss; U's B->U nine-to-one collapse) under: "we repeatedly defined a projection and
  then asked it to do the work of the structure it projects from."

  **RESTATES THE INDUCED-EQUIVALENCE FORMALIZATION, THE REPRESENTATION ADEQUACY PRINCIPLE
  (Adequate(pi,Q) => D_Q subseteq Preserved(pi)), AND THE INVARIANT CUSTODY PRINCIPLE** with an
  explicit set-valued definition: Custody(I) = {c | c is responsible for preserving invariant I},
  and the formal validity condition for all(I in I_required): Custody_before(I)!=empty-set =>
  Custody_after(I)!=empty-set -- the first fully set-theoretic formalization of custody in this
  sub-thread (M0098 stated it informally).

  **DEFINES A SIX-LAYER CANDIDATE ARCHITECTURE**: Layer 0 Lenses (Zero, Yoni, Lord, Sarathi --
  "instruments, never domain objects"); Layer 1 Structures (E_t, B_t, AF_t, M_t -- candidate
  primary); Layer 2 Projections (Sat, Gap, U, Zero, Balanced -- "all derived, none primitive");
  Layer 3 Attribution (A_t=Gamma(E_t,Q,C,EC) -- "not knowledge"); Layer 4 Transition+Event
  (delta:E_t->E_{t+1}); Layer 5 History (append-only, kernel-written).

  **NAMES FOUR STRUCTURAL LAWS (L1-L5, one renumbered/merged)**: L1 No projection is primitive
  [PROP Very Strong]; L2 "Every projection declares its kernel" [PROP Very Strong] -- SEE
  CONTRADICTION NOTE BELOW; L3 Kernel writes history, never reads [PROP Conditional -- correctly
  downgraded from M0098's critique of the overclaimed 'established' version]; L4 Lens never on RHS
  of domain equation [PROP Strong]; L5 Every claim of progress names its ordering [PROP Very
  Strong].

  **SIGNIFICANT INTERNAL REGRESSION -- FLAGGED, NOT SILENTLY CORRECTED**: Part 1.2 of this very
  document correctly restates M0098's corrected principle, "every projection must declare which
  distinctions it identifies or discards" -- but Law L2 in Part 2.2, two sections later in the SAME
  document, reverts to "every projection declares its kernel," the exact phrasing M0098 explicitly
  replaced one document earlier specifically because "kernel" has narrow, specific meaning for
  structure-preserving maps between algebraic objects and is "mathematically dangerous" when used
  loosely for a general semantic map pi:X->Y. This is either a drafting inconsistency within the
  same ruling or a silent reversion of a just-established terminology correction -- recorded as an
  open item for the eventual reclassification pass, not corrected here.

  **GIVES ZERO AN EXPLICIT CLOSURE-BASED DEFINITION**, sharper than M0098's own treatment: Gap =
  pi_Q(B_pi), U = pi_V(B_pi), and NEW: Zero = closure(B_pi) -- the first place in this pass Zero is
  given a specific closure-operator-based formal definition rather than left as "boundary
  examination" in prose; the precise meaning of "closure" here (topological? logical? transitive?)
  is not specified.

  **PROVIDES A FULL QUANTIFIED STATUS MATRIX WITH SPECIFIC, NOT-INDEPENDENTLY-VERIFIED COUNTS**:
  cites "13 and 8 are both minima under different algebras" (for why semantic equivalence must
  precede kernel minimality -- consistent with the corpus's already-tracked 13-vs-8 tension, now
  given a specific resolution: both counts are genuine minima, just under different algebraic
  structures, dissolving the apparent contradiction rather than requiring one to be wrong); "1,491
  claims unspecified" (for why the progress ordering >= remains open); "37 distinctions
  unsupported" (for why the exact Boundary structure remains open) -- these specific figures are new
  to this pass and their provenance (which prior experiment produced them) is not given in this
  document.

  **FORMALIZES THE YONI-LINGA INTEGRATION AS THE SUB-THREAD'S FINAL CLOSURE**: Yoni ~
  (H,R,Theta) (candidate space, relations, transformations), explicitly [EXT]; Linga ~
  G:K_t x Q_t -> H_t (candidate generation), explicitly [EXT] -- "the Yoni-Linga metaphor has
  served its purpose -- it helped us discover the distinction between interaction, reconciliation,
  closure, and successor state. But the new structure/projection work gives us something more
  powerful." This is the explicit terminal ruling closing the entire M0081-M0098 Linga-Yoni/Gita
  sub-thread traced in this pass.

  **COMMISSIONS KR-PROJ-2026-09-02** with an explicit five-step method (define a rich structure
  E_t; define candidate projections pi_i; for each determine collapsed distinctions, their
  materiality, recoverability, and invariant survival; test whether Zero is a boundary-analysis
  lens over these losses; test whether Gap/Sat/Balanced/DetectGap are correctly understood as
  projections), an explicit critical rule ("Do not assume Claude's four structures are correct.
  Let the experiment try to falsify them"), and precise success/failure criteria (success: all
  prior failures explained as projection-induced information loss; failure: some observed failure
  cannot be so explained).

  **RETIRES THE OLD KERNEL-MINIMALITY DEPENDENCY CHAIN** ("Operators -> Count -> Minimum ->
  Kernel") in favor of the corrected chain ("Structure -> Observables -> Semantic Equivalence ->
  Invariant Preservation -> Reduction -> Minimality"), reconfirming M0098's methodological
  correction with an explicit "old chain (retired)" label.

  Closes with a full supervisory verdict table (Structure-first framework, projection/information-
  loss theory, invariant-custody principle, representation-adequacy principle, four candidate
  structures, Zero-as-boundary-analysis all [PROP] at varying strength; KR-PROJ COMMISSIONED;
  Theory v1.3 explicitly NOT YET).
