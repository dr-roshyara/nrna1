kernel_content: >
  Gives the corpus's epistemic-change (lifecycle/revision/retraction) research its most complete
  external grounding yet via the Revision/Contraction/Update triad and the Event Calculus release
  mechanism, and introduces a genuinely new task-knowledge/Problem-Solving-Method layer directly
  compatible with the corpus's own DDD discipline.
