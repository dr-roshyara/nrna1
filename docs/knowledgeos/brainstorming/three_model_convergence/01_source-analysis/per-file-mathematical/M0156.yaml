  secondary_note: >
    A disciplined treatment of the (van Harmelen/Lifschitz/Porter) Handbook of Knowledge
    Representation, extracting implications against the corpus's own open TODOs rather than
    summarizing the book. Covers belief revision/update/contraction (AGM), Event Calculus,
    multi-agent epistemic logic, model-based diagnosis, knowledge engineering/Problem-Solving
    Methods, ontology engineering, and constraint programming — the broadest single-document sweep
    of external KR&R literature in this reconstruction's read order.
