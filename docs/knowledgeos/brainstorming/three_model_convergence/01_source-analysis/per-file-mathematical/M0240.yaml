  - "[[c]]_𝒞 — capability equivalence classes under c1≡_𝒞c2"
  - "ℬ⊆𝒞 — a capability basis under a fixed contract/equivalence/admissible-implementation-class triple"
  - "ρ:𝒞_KOS→ℬ — the responsibility-projection map from system capabilities to bounded contexts (Kernel/Representation/Reasoning/Governance/Execution/...)"
  - "K1⊑_𝔠 K2 — contract-preserving transition-system refinement/simulation"
