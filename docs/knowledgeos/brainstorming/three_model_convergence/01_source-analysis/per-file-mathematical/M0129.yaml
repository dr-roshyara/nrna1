about: >
  Consolidates the results of KR-COMP-SEP-2026-09 into a revised, seventeen-item TODO landscape
  (color-coded 4 DECISION-REQUIRED / 6 OPEN-DEPENDENT / 5 OPEN / 2 BLOCKED), explicitly stating
  "the old linear A -> B -> C -> ... list is no longer accurate."

  **NEW EXPERIMENTAL RESULTS FROM KR-COMP-SEP-2026-09**: composition-rule candidates "union" and
  "strict" are EXCLUDED, "last-wins" is EXCLUDED, leaving only two surviving tested candidates,
  "majority" (aggregate across frames) and "intraframe-only" (refuse frame-free aggregation) --
  with NO rule yet selected, and a third, unnamed composition operator explicitly "not excluded"
  by the decision record. The frame variable phi is established to satisfy phi superset-of-or-equal
  {time, context} for every successful tested combination, but the experiment did NOT establish
  what a frame actually IS semantically (candidates: semantic context, evidence partition,
  evaluation context, temporal/contextual coordinate, or something else) -- explicitly judged
  "currently more fundamental than choosing the aggregation rule." The composition record
  additionally establishes a scoped lifecycle result, "supersession ~ temporal separation," for the
  specific tested composition witnesses, while explicitly leaving retirement/retraction/expiration
  outside that tested case untouched. Confirms the composition record explicitly finds NO kernel
  implications from either surviving composition option (majority or intraframe-only).

  **PROPOSES A NEW UNIFYING NON-EVIDENTIAL SEMANTIC-INVARIANCE CRITERION**: E ~_non-evidential E'
  implies Eval(E)=Eval(E') is identified as the common principle underlying two previously separate
  ad-hoc criteria, C6 (permutation/order invariance) and C7 (frame-refinement invariance) -- if
  ratified as a general semantic criterion, C6 and C7 become INSTANCES of it rather than
  independent ad-hoc rules, explicitly flagged as the highest-priority open decision because it
  "directly affects whether majority is admissible at all."

  **NAMES R_req (THE REQUIRED-DISTINCTION UNIVERSE) AS A RECURRING, NOW-EXPLICIT DEPENDENCY**:
  notes R_req "has now repeatedly determined experimental outcomes: FDE evaluation, E12, E13, phi,
  composition" -- meaning every major result across this entire research stretch (M0119-M0129) has
  been implicitly scoped to whatever R_req happened to be assumed, and "until this is settled,
  claims of adequacy remain scoped to the current tested distinction set" -- a significant
  methodological caveat retroactively applied to the whole preceding line of results.

  **IDENTIFIES A NEW REQUIRED BOUNDARY VOCABULARY ITEM CONDITIONAL ON THE CROSS-FRAME DECISION**:
  if intraframe-only (or another refusal/unresolved mechanism) is selected, a new boundary
  condition "cross-frame-divergence" becomes load-bearing, requiring NoEvidence != CrossFrame
  Divergence != Underdetermined != TheoryIncomplete as a genuinely new non-collapse distinction not
  previously named in this pass's Zero/boundary vocabulary.

  **DELIVERS A REVISED CRITICAL-PATH DIAGRAM**: R_req (decision) -> Non-evidential invariance
  (decision) -> phi semantics (decision) -> Cross-frame meaning (decision) -> Evaluation model/
  Boundary -> {Contr, Zero, Determination} -> Composition -> delta -> Kernel candidates ->
  Ratification -> Theory v1.3 -- explicitly noting Projection/Invariant, identity/equality, and
  Lifecycle should continue as PARALLEL research lanes rather than waiting for the entire semantic
  lane to resolve first.

  **REFRAMES THE ENTIRE REMAINING RESEARCH PROGRAMME**: "we have now moved from 'find the correct
  composition rule' to 'determine what semantic commitments are legitimate before a composition
  rule can even be selected.' And the immediate highest-value unresolved issue is therefore: what
  is a frame, semantically? -- because that determines whether the objection to majority is merely
  a cost we knowingly accept, or a violation of a fundamental invariance principle." Notes the
  underlying decision record itself "essentially arrives at this boundary: C7 exposes majority's
  dependence on recording resolution, while intraframe-only introduces a different semantic cost;
  neither can be selected without an explicit prior commitment."

  Reaffirms, unchanged: Kernel remains BLOCKED/NOT SELECTABLE ("no semantic mechanism enters the
  kernel merely because it is useful"); Theory v1.2 remains unchanged, no v1.3; Contr remains
  undefined (FDEConflictDetector != Contr and Contr != Satisfied remain [PROP] pending I11);
  Evaluation = Standing x Boundary/Reason x Context x Provenance remains the strongest tested
  candidate shape but explicitly "FDE is not adopted... Standing is not a KnowledgeOS primitive...
  Boundary vocabulary is not adopted"; Zero remains undefined, explicitly "Zero != Standing" and
  cannot be determined from Standing alone, deferred until evaluation/boundary semantics stabilize;
  Determination remains OPEN pending the cross-frame-divergence policy decision (majority permits
  determination, intraframe-only blocks it, a third mechanism might preserve unresolved divergence
  explicitly); ==_sem remains OPEN but explicitly not itself refuted (family-level complexity was
  what failed in the distinguishability experiments, not semantic equivalence per se).
