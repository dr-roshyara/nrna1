about: >
  A structured extraction of Ziem's frame-semantics theory (slots, fillers, default
  values; evocation vs. invocation; hyperonym type reduction; matrix frames; generic
  frames for metaphor; basic discourse-semantic figures; entrenchment via token/type
  frequency), each concept explicitly mapped onto existing KnowledgeOS constructs
  (ℛ_req, Boundary, Contr, Zero, Provenance, Lifecycle, Composition, δ).
introduces:
  - "U-relevance postulate: no U-relevant distinction may be excluded from analysis on grounds of theoretical convenience — external literature's own name for ℛ_req"
  - "Slot / filler / default-value triad as the structural anatomy of a frame (Minsky, via Ziem)"
  - "Evocation (form→frame, automatic) vs. Invocation (interpreter→memory, inferential) as two distinct knowledge-activation mechanisms"
  - "Hyperonym type reduction: a systematic method for determining a frame's slots by reducing the target concept to its highest non-circular hyperonym and inheriting that hyperonym's matrix-frame slots"
  - "Matrix frame hierarchy: slots inherited top-down (Entity → Stable Object → Primary Object → Organism/Role/etc.)"
  - "Empirically validated predicator classes (definition, relevance-for-humans, constitutive relations I/II/III, properties, part-of-event, manifestation) as an operationalization of slot content"
  - "Generic frame for metaphor: the intersection of slots shared by source (input frame I) and target (input frame II) matrix frames"
  - "Basic discourse-semantic figures: three criteria (metalinguistic referentialization, high type frequency, entrenched content structure) for when a frame-structured expression becomes a discourse-level fixture"
  - "Meaning potential: the full set of default values an evoked frame could feed into interpretation, of which only part is ever exploited"
defines: []
refines:
  - "Zero (Zero⟺Δ=∅, frozen since Gap Theory v1.0/M0132): reframed via Minsky's dictum that frames are never stored with unassigned terminal values — 'Zero is not a frame with empty slots. Zero is a frame with satisfied slots' — an independent linguistic-theory statement landing on the same non-emptiness structure already frozen in this corpus"
  - "Contr (gap classes, M0132): named explicitly as gap type G5 in the book's own vocabulary, corroborating the non-exclusive gap-tagging principle independently found at M0128 (Failures(A)⊆F)"
  - "Composition (KR-COMP-SEP-2026-09, M0129's open bottleneck question 'what is a frame, semantically?'): answered at the level of external theory — a frame is a slot/filler/default-value schema; composition of two frames (e.g. for metaphor) is formalized as the generic frame (shared-slot intersection)"
contradicts: []
repeats:
  - "Holistic-vs-modularist semantics debate substantiates, rather than repeats, the corpus's own prior rejection (never itself argued from external literature until now) of drawing a hard linguistic/conceptual boundary"
bridge_candidates:
  - "Sat(K_t,r) — the book explicitly leaves this open (its own Part 8.3, item 1) as 'how is satisfaction formally defined?' — directly matching M0132's identification of Sat(K_t,r) as 'the bridge problem'; still unresolved after this extraction"
  - "Hyperonym type reduction as a candidate concrete algorithm for KnowledgeOS's still-unformalized slot-determination procedure — not yet connected to any executed code in this reconstruction's corpus"
  - "Whether 'evocation vs. invocation' should be modeled as two distinct transition operators (δ_evoke, δ_invoke) or as a single δ with a mode flag — undecided, flagged for the tactical-design stage"
mathematical_content: >
  No new formalism introduced beyond what the book's own prose provides; the extraction
  stays at the conceptual/translation level. The closest to formal content is the
  frame-hierarchy inheritance diagram (Part 5.3) and the generic-frame-as-intersection
  characterization for metaphor (Part 6.2), both informal set-theoretic sketches rather
  than stated theorems.
