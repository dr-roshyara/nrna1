  "projection lattice" idea (Pi={pi_1,...,pi_n}, x~_{pi_i}y); the Zero-as-boundary-analysis-lens
  reinterpretation (ZeroLens(K,Pi) examining [x]_pi); the Yoni~(H,R,Theta) and Linga~G:K_t x Q_t ->
  H_t reinterpretations, both explicitly non-identity; the version-diff-discipline correction (a
  semantic change is a real change even if no paragraph is deleted); the KR-PROJ-2026-09 proposal
  with its eight-part method and the explicit instruction "do not assume Claude's four structures
  are correct... let the experiment try to falsify them"; and the final S_t -> pi_i -> R_{i,t}
  research-architecture formulation with Structure!=Projection!=Lens!=Transformation!=History. See
