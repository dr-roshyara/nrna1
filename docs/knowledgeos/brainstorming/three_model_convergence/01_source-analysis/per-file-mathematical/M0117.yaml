about: >
  Presents the original structures-first proposal (Layer 0 Lenses / Layer 1 Structures (E_t, B_t,
  AF_t, M_t) / Layer 2 Projections (Sat_c, Gap, U, Zero, Balanced) / Layer 3 Attribution / Layers
  4-5 Transition+History), the four structural laws L1-L4 (plus a proposed but not-yet-enforceable
  L5), a migration plan (six cheapest-first steps), DDD bounded-context consequences, and an
  "honest summary" explicitly warning against adopting the model merely because experiments
  succeeded and against repairing open items by silent implementation -- all already summarized via
  this reconstruction's M0098/M0099 records (which reviewed this same content one step removed).

  **CARRIES A SUPERSEDED-AS-A-PROPOSAL NOTICE** (added 2026-09-02, at the top): states a REVISED
  proposal, "20260902-155427_the-research-model-and-the-optimized-model.md" -- NOT YET PROCESSED IN
  THIS RECONSTRUCTION'S PASS AS OF THIS RECORD -- "incorporates the review appended below" together
  with FR-001, KR-HILBERT, the R1 factivity decision, and KR-CONTR, and explicitly instructs "this
  document is NOT withdrawn. It stands as the record of the proposal that was reviewed... read it
  as of its date." This is a genuine forward pointer to a further consolidation this reconstruction
  should expect to encounter and connect back to this document when reached.

  **PROVIDES SEVERAL SPECIFIC QUANTIFIED EVIDENCE CITATIONS NOT PREVIOUSLY RECORDED WITH THIS
  PRECISION**: for B_t as a candidate primary structure, cites "KR-ZERO-H: 9 distinct, 36/36 pairs"
  (all 36 pairwise comparisons among the nine boundary conditions remain distinct); for M_t, cites
  a concrete model-fit-vs-causal-validity witness "beta=1.852, R^2=0.899, true effect 0" (a strong
  apparent statistical fit masking zero actual causal effect) from "v1.1 scenario H"; for the
  minimum-typing result, gives the exact minimal sufficient sets "{G_value, G_assessment, G_model}
  or {G_assessment, G_evidence, G_model}" (two of eleven facets, G_assessment and G_model, are the
  common minimum); the migration plan's exact six-step cheapest-first ordering (declare the lens
  register; decide factivity; decide whether Delta is a count or ordered; define Contr with the
  fourth value and Zero readings together; define >=; test-or-drop the 37 distinctions); and the
  DDD "three notions of necessity disagree for Discriminate, Select, Revise" finding.

  **THE APPENDED REVIEW SECTION (lines 253-1486) IS SUBSTANTIVELY THE SAME CONTENT ALREADY RECORDED
  IN THIS RECONSTRUCTION'S M0098 ENTRY**: the induced-equivalence correction (x1~_pi x2 iff
  pi(x1)=pi(x2), replacing the "kernel of the projection" phrasing); the strengthened L2 (every
  projection declares distinctions identified OR discarded); the "candidate primary structures"
