  - "Part A's weighted evidence vector W:E×H→[-1,1]: explicitly rejected as premature — 'we previously found that scalar ranking can manufacture uniqueness and that evidence multiplicity does not automatically justify scalar aggregation... introducing [-1,1] as a canonical evidence scale would be a new statistical assumption' — the safer formulation is Support(e,h) with structured provenance/polarity first"
  - "M0169's master status register: extended and refined here with a fourth (🟠) level and a more granular per-component breakdown of EVal's tuple (ν/J/τ/μ each separately assessed, 'strong candidate'/'candidate', with the product tuple itself marked 🟡 OPEN — 'EVal ≠ just a tuple of everything useful... we are again constructing a database schema rather than deriving a kernel' unless each component is proven semantically necessary)"
