  - "Correction 4: Zero's exclusion is given an explicit scope-relativization qualifier — Zero_{T,Π}∉Prim(𝒦_epi) under (𝔠_KOS,𝔎_adm) — preventing a future contract change from being 'logically prohibited' from ever re-admitting Zero as primitive"
  - "A DEEPER CATEGORY-ERROR CATCH on M0237's status ledger: 'K_epi is the minimal semantic equivalence class in MinKer' conflates an equivalence class with a concrete implementation — corrected hierarchy: K∈𝔎_adm (concrete implementation) → [K]_≡sem (its semantic-equivalence class) → MinKer(𝔠_KOS) (set of minimal implementations) → NEW: MinKer_/≡sem = {[K]_≡sem | K∈MinKer(𝔠_KOS)} (the set of distinct minimal semantic classes) — 'mathematically much cleaner'"
  - "Restated frozen core (accepted): MinKer(𝔠_KOS)=Min_⪯sem{K∈𝔎_adm|K⊨𝔠_KOS}; K1≡_sem K2⟺K1⪯_cap K2∧K2⪯_cap K1 (conditional on future ⪯_cap trace-formalization); K*∈MinKer(𝔠_KOS)⟺K*⊨𝔠_KOS∧∄K'⊨𝔠_KOS:K'≺_sem K* — labeled 'the actual mathematical minimality criterion'"
  - "The 'most important consequence': a clean four-stage conceptual pipeline — 𝔠_KOS (what must be preserved) → ⪯_cap (what can simulate what) → ≡_sem (what is semantically the same) → Min (what cannot be reduced further) — with the explicit reaffirmation that '13/12/8 operators are now correctly demoted from candidate Kernel to implementation hypotheses'"
