about: >
  Identifies a structural gap in all of M0001-M0018's accumulated apparatus: none of it models
  WHY KnowledgeOS is looking for knowledge in the first place. Proposes Inquiry as a first-class
  theoretical object, distinct from a mere linguistic question (Question subset-of Inquiry).

  **DELIVERS THE FORMAL INQUIRY DEFINITION**: Q=(T,P,C,R,Gamma) -- Target (what must be
  known/determined), Purpose (why), Context (frame), Requirements (what constitutes an adequate
  answer), and adequacy-rules/constraints Gamma. Logged [PROP].

  **DELIVERS THE TOP-DOWN/BOTTOM-UP DUALITY**: bottom-up (World -> Information -> Knowledge, all of
  M0005-M0018's apparatus) is complemented by a top-down direction (Inquiry -> Requirements ->
  Investigation), closing into a single loop: Inquiry -> Required Knowledge -> Investigation ->
  Knowledge -> Answer.

  **REINTERPRETS THE IDEAL STATE AS INQUIRY-DERIVED**: rather than I_t(P,C) floating independently,
  Q -> I_Q, i.e. I_Q = IdealState(Q) -- the inquiry determines what knowledge would be sufficient,
  making the Ideal State inquiry-relative rather than a free-standing parameter. Correspondingly,
  Zero(K_t,I_Q,EC)=0 means "we know enough for THIS inquiry," never "we know everything."

  **DELIVERS THE SMALLEST-ADEQUATE-ANSWER FORMALIZATION, EXPLICITLY A SECOND, DISTINCT MINIMIZATION
  PROBLEM FROM M0018's MINIMAL-KERNEL OPTIMIZATION**: A_Q* = argmin_{A in Calligraphic-A(Q,K_t)}
  Complexity(A) subject to Adequate(A,Q) -- explicitly NOT the same as K_t*'s minimal-sufficient-
  representation optimization (M0018): "We could have K_t = very large while A_Q* = very small.
  That is exactly what we want." Answer_Q = Projection_Q(K_t), an inquiry-dependent projection, so
  Answer != Knowledge State.

  **DELIVERS THE ADEQUATE(A,Q) PREDICATE (COMPONENTS NAMED, EXACT FORM LEFT AS RESEARCH WORK)**:
  target satisfied AND required evidence satisfied AND required certainty satisfied AND required
  context preserved AND required provenance preserved AND decision condition satisfied.

  **DELIVERS 'UNKNOWN' / 'CANNOT BE DETERMINED' AS A LEGITIMATE SMALLEST ADEQUATE ANSWER**: when
  Zero(K_t,I_Q,EC) != 0 (e.g. missing firewall configuration for a migration-feasibility inquiry),
  the correct minimal answer is an explicit epistemic-status value from
  {Determined,PartiallyDetermined,Undetermined,Conflicting,NotApplicable,Unknown} naming exactly
  what is missing -- "much better than hallucinating a completion," directly connecting to the
  corpus's anti-fabrication principle and to M0018's data-processing anti-hallucination law.

  **DELIVERS INQUIRY-RELATIVE INVESTIGATION**: refines M0010's dimension-discovery formula
  (d*=argmax_d E[Delta-G_t|investigate d]) into an inquiry-relative version d_Q* = argmax_d
  E[adequacy improvement for Q|investigate d]/Cost(d) -- investigation should target only the gaps
  that matter to the current inquiry, not all missing knowledge indiscriminately.

  **DELIVERS INQUIRY AS KNOWLEDGEOS'S MISSING STOPPING CONDITION**: "without Inquiry, the system
  has no principled reason to stop learning -- there is always more information." With Inquiry:
  Stop iff Zero(K_t,I_Q,EC)=0 -- explicitly flagged as "one of the most important theoretical
  functions of Inquiry," resolving an implicit open problem (when does investigation terminate)
  that none of M0001-M0018 had named directly.

  **DELIVERS ANSWER-MINIMALITY-IS-SEMANTIC-NOT-LINGUISTIC**: a 500-word answer can be more minimal
  (in the relevant sense) than a 20-word answer if the 20-word answer omits a required
  qualification -- minimality is measured against Adequate(A,Q), not surface length.

  **CONNECTS DRETSKE'S (M0017) AND COVER-THOMAS'S (M0018) CONTRIBUTIONS THROUGH INQUIRY**:
  Information -> Semantic Content -> Inquiry Relevance -> Knowledge -> Answer -- giving Dretske's
  semantic-selection idea a concrete role (Inquiry determines which content matters) and
  Cover-Thomas's sufficiency/compression apparatus a concrete target (minimum representation
  subject to epistemic adequacy FOR THE INQUIRY, not merely for an abstract purpose P).

  **DELIVERS THE 'TWO BOUNDARIES' FRAMING**: the Knowledge boundary (what can currently be
  known/determined, K_t) and the Inquiry boundary (what needs to be known, Q/I_Q); Zero = the gap
  between them; Answer = the minimal projection of adequate knowledge onto the inquiry. "Inquiry
  defines the destination. Knowledge State defines what has been established. Zero identifies
  what is still missing. Investigation reduces the relevant gap. Answer is the smallest adequate
  projection of the resulting knowledge."

  **PROPOSES THE NEXT TEST**: check this Inquiry->IdealState->Zero->SmallestAdequateAnswer model
  against the (separately tracked) 1,155-file KnowledgeOS brainstorming corpus, to determine
  whether Inquiry was already implicitly present under a different name, and whether it is a
  genuinely missing primitive or a derived construct -- explicitly not yet claiming either.
