about: >
  Twelve direct Q&A pairs consolidating the KR-SIM-2026-09-02-D findings already fully recorded
  under M0052: (1) yes, the eight Sat_c can be specified without implementation, and doing so
  already surfaced findings; (2) no, the eight do not yet have coherent interpretations (three
  executable: content/evidence/provenance; five blocked: status/consistency/governance/temporal/
  operational, each with a named blocker); (3) Sat should remain [PROP], now for structural
  reasons rather than mere unimplementedness; (4) factivity is not shown unnecessary, only that no
  current Sat_c class carries it (Sat(K,r)=top does not imply Truth(K)); (5) PB-2 (Sat_content
  non-totality under contradiction) is a real defect, left OPEN among three unchosen repairs; (6)
  PB-3 (missing UNDERDETERMINED reason) matters methodologically, not as a one-word fix, recorded
  as "reason vocabulary completeness = OPEN"; (7) PB-4 shows blocked classes contaminate composite
  satisfaction under Kleene conjunction (arity>=4 => U for every tested combination); (8) Zero_
  reasoned is a legitimate [PROP], demonstrated distinct from Zero_weak via a separating case; (9)
  the Zero_strict=>Zero_reasoned=>Zero_weak chain is experimentally supported but not yet a proven
  theorem; (10) Zero does not imply Truth (case B1: false attribution with Zero_weak=Zero_reasoned=
  true) -- "probably the most important conceptual result of the experiment"; (11) which Zero
  reading is correct remains a normative/governance decision, not something the experiment can
  select; (12) the next step is repair (PB-2/PB-3/PB-5) before introducing candidate governance/
  temporal/operational evaluators, then rerunning the same deterministic cases B1-B4.

  **THE SECOND HALF (from the unlabeled '#' section onward) IS A VERBATIM SECOND COPY** of the
  Eval_c(K_t,r,Gamma_t)->EVal_c reformulation, hypothesis H-EVAL-01, the "discover the codomain
  rather than presuppose it" principle, and the fifteen-case "Epistemic Evaluation Semantics
  Experiment" proposal -- identical in every sentence and equation to the content first recorded
  under M0053. Not re-summarized here; see M0053 for the full record of that material.
