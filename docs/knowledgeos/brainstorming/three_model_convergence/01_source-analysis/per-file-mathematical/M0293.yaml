about: >
  A variant covering similar ground to M0292: knowledge is continuously re-based (K_t -> interpret -> reason -> revise -> K_{t+1}, with the output becoming the next cycle's input, not mere accumulation). States the temporal non-implication Neutrality(x,K_t) does not imply Neutrality(x,K_{t+1}) as a temporal instance of the corpus's established context-dependence-of-neutrality principle, and distinguishes 'irrelevant now' from 'incapable of ever contributing under the admissible future' as radically different concepts (echoing M0292's delayed-activation framing but without M0292's formal transition-record apparatus or its comparative experiment design).
