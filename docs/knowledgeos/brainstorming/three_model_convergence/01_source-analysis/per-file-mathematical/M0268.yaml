about: >
  Document 03a, inserted between Documents 03 and 04 specifically because "document 03 gives Zero's
  definition and its algebra. It does not say what the concept IS." The single most conceptually
  precise document on Zero in the entire reconstruction: a word-by-word deconstruction of Zero's
  defining sentence, a formal distinction from four neighboring mathematical notions (each with
  exact violation counts), the corpus's first explicit framing of Zero against graphoid irrelevance
  axioms, a genuinely new positive Remainder identity that was omitted from Document 03's original
  draft, a clean final table of L's operator properties, and a closing honest statement of what the
  concept is (and is not) good for.
introduces:
  - "A word-by-word deconstruction of Zero's defining sentence ('can this be removed without changing what I have chosen to observe?'), with each word tied to a specific formal requirement: 'this'→a specific subset S, not a field/column/type; 'removed'→via a TYPED E_S that re-establishes level invariants, not set subtraction; 'changing'→equality of observation, not similarity/approximation; 'I have chosen'→Π is a choice, changing Π changes the answer; 'observe'→Π(T(D)), NOT the answer Q(D), read-disjoint from it"
  - "The naming rationale: Zero is 'a statement about a difference vanishing, not about a thing being empty or worthless' — Π(T(D))-Π(T(E_S(D)))=0"
  - "§2.1 Zero is NOT sufficiency (adequacy is): sufficiency is about what a representation RETAINS; Zero is about what a case can LOSE — 'a design that reaches for Zero when it wants sufficiency will delete the wrong things'"
  - "§2.2 Zero is NOT invariance, with EXACT violation counts not previously given this precisely: 1,865 invariant-not-Zero cases and 858 Zero-not-invariant cases (H9) — 'the two are near-orthogonal, not near-equal'"
  - "§2.3 THE SHARPEST CHARACTERIZATION YET: Zero is NOT a conditional-independence/irrelevance relation in the formal GRAPHOID sense (decomposition, weak union, contraction, composition axioms) — tested in two directions with exact violation counts: composition (individual Zero⟹group Zero) fails with 131 violations; decomposition (group Zero⟹individual Zero) fails with 63 violations — 'Zero fails in both directions between the element level and the set level. It is therefore not an irrelevance relation in the graphoid sense, and no reasoning calculus built on those axioms applies to it' — the first time this pass frames Zero's non-element-wise-ness against the formal probabilistic-graphical-model vocabulary"
  - "Two canonical counterexample shapes given clean permanent names for the first time: [x,x] named REDUNDANCY (the composition failure — each copy individually removable, removing both changes Π); [+c,-c] named EMERGENT ELIMINABILITY (the decomposition failure — neither individually removable, together they cancel and become removable), with the explicit qualifier that emergent eliminability is 'conditional on a balance-preserving (cancelling) contract... a legitimate preservation contract, so emergent eliminability is real — but the condition is named, not suppressed. Removing the cancelling contract removes the phenomenon'"
  - "§2.4 Zero is NOT an independence system, with the crisp conceptual consequence stated for the first time this precisely: 'Zero has NO BASIS. There is no small set of eliminable cores from which the rest follows. Eliminability must be asked, per subset, per frame — it CANNOT be indexed'"
  - "Zero formally reframed as irreducibly a QUADRUPLE relation (S;D|T,Π,contract,reference), never a property, with a consolidated four-relativity evidence table (contract: 495/4049 flip, H8; reference: 541/4260 differ, H7; observable Π: rates ranged 0.000→1.000 across five Π on the same data; transformation T: higher-order rates 28.2% under dedup vs exactly 0 under T7) — 'there is no such thing as this field is redundant. There is only this subset is Zero under this frame'"
  - "THE REMAINDER — a GENUINELY NEW POSITIVE RESULT explicitly flagged as previously omitted: 'the most conceptually interesting positive result in the Zero lane, and it was omitted from document 03's first draft.' Three candidate constructions of 'what is left over' — A=D-Eliminated (not removed); B=the transformation residual (what survives T); C=contract-unresolved material (what the contract leaves open) — with the EXACT IDENTITY A≡C holding in 1,182/1,182 cases EXACTLY: '\"not eliminated\" IS exactly \"contract-relevant unresolved material.\" A genuine and non-obvious identity — and it holds without exception in the tested space' — while B is confirmed a DIFFERENT object (A=B only in 816/1182, B=C only in 816/1182): 'the transformation residual is not what the contract leaves unresolved... a system that computes what survived my pipeline and calls it what remains open is conflating B with C, and the data say they differ on 31% of cases' — with the retrospective note that H10 (Remainder=D-Eliminated for the TRANSFORMATION residual) being [NEG] was 'the refutation... reporting only [which] understated the result,' since A≡C is the genuine positive half of the same experiment"
  - "A sharpened restatement of the rule-vs-counterfactual eliminability disagreement (H11, 55.75% agreement, already established at M0194/M0195): 'a rule that says this is removable is wrong far more often in the DANGEROUS direction — it removes what the counterfactual says must stay' — [REC]: 'never implement eliminability as a rule over field types. The counterfactual test is not an optimization of the rule; it is a different and stricter object'"
  - "A clean final consolidated table of L's ('repeatedly eliminate what is Zero') operator properties: reductive (holds by construction); terminating ([EXP], 0 cycles, max 2 iterations); iteration-monotone-decreasing ([EXP], 0 violations); idempotent (operator-relative — 0 failures for L_sequential/L_rule, but 4 failures for L_simultaneous — a NEW specific breakdown by operator variant not previously given this precisely); confluent ([NEG], 11/1162 non-commuting); monotone-in-argument ([OPEN], never tested, not claimed) — 'L is not a projection and not an interior operator. It is a terminating, non-confluent rewriting process'"
  - "A consolidated named-counterexample reference table for L's failure modes: H1 [the,the,key,key]; H2 [c,ref1,c]; H5 [x,x]; H6 [+c,-c] — 'which normal form you reach depends on the order you eliminate in. A system must either fix and declare an order, or carry the set of reachable normal forms — it may not pretend there is one answer'"
  - "A restated higher-order finding with the explicit necessity-vs-correlation distinction sharpened: relational transformations correlate strongly with higher-order eliminability (dedup 28.2%, interacting 22.9%, context 11.2%, vs element-wise ≤0.8%/T7 exactly 0) but are NOT NECESSARY for it (tested and refuted) — 'the correlation is strong; the necessity claim is false'"
  - "THE FINAL HONEST CHARACTERIZATION of what the concept is good for: 'Zero answers can I drop this? — and the programme's central negative is that this is all it answers... Zero is a safety question about a specific removal under a specific frame. It is not a preservation guarantee, and treating it as one is the single most likely way to misuse this theory'"
  - "A five-item concept-level (not merely experiment-level) open-questions register, with the deepest one named explicitly: 'is there a well-defined group/set formulation of Zero? [OPEN] — H5+H6 show the element-wise formulation fails in both directions; they do not supply the replacement. This is the deepest open question about the concept' — plus L-monotonicity, ladder-depth-beyond-k=3, regime-genuineness-vs-contract-relativity, and semantic-equivalence-never-invented (all comparisons in the corpus are structural)"
