  - "The earlier H10 (Remainder=D-Eliminated) [NEG] finding: retroactively clarified as understating the result — the positive half (A≡C exactly) was omitted from Document 03's first draft and is restored here"
  - "M0265's contract/reference-relativity numbers (495/4049, 541/4260): confirmed as the same H7/H8 findings, now given as part of Zero's formal quadruple-relativity characterization"
