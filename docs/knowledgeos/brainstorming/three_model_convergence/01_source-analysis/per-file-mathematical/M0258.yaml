about: >
  Document 05 of the 15-document consolidated theory series, explicitly self-described as the
  shortest document with the largest importance-to-evidence gap: "Realization is the least-tested
  of the three predicates, and this document says so rather than padding it." Restates the
  Realization definition, the Realization⟹Adequacy conjecture, and the KR-REP-REDUCTION design
  defect already recorded at M0256/M0257, with two genuine refinements: a clean architectural
  rationale placing the constraint C in the inquiry frame rather than the transformation, and a
  more granular representation-level-vs-operator-level breakdown of exactly where the design could
  and could not exhibit the adequacy/realization separation.
introduces:
  - "The final Realized(R,Q,O)⟺O(R)=Q(D) definition with O fixed in advance as part of Π_frame=(Q,C,O): 'the fixing is the whole content of the definition. If O may be chosen after seeing R, then realization is just some function of R equals Q, which is adequacy restated. Realization is a claim about the decoder you actually have, not about the existence of one'"
  - "A clean two-reason explanation for why Realization≠Adequacy: (1) the decoder may be weaker than the information (R determines Q, but O does not compute the determining function); (2) the constraint C may fail (Adequate∧¬C(R)⟹not realizable, though the information is present) — with an explicit architectural rationale not previously stated this crisply: 'this is why C belongs in the frame and not in the transformation. Constraints are conditions on use, not on construction'"
  - "A more granular breakdown of the already-recorded KR-REP-REDUCTION design defect, distinguishing where the adequacy/realization separation COULD be exhibited from where it could NOT: at the REPRESENTATION level (N_viol>0), the design DID exhibit the separation — at R4, R3, R2; but at the OPERATOR level (Ĥ(Q|R)=0 but F<1), the design NEVER exhibited it — the only adequate level, R5, has F=1.0000 exactly — 'the design excluded its own target case by construction'"
  - "A concrete [REC] for the next realization experiment: it must ensure at least one level satisfies both Ĥ(Q|R)=0 AND F<1, requiring either a decoder deliberately weaker than the information or a constraint that bites at an adequate level — 'neither is hard; neither was done'"
  - "An explicit closure of the asymmetry left implicit at M0256: 'the converse, Adequacy⟹Realization, is [NEG] by §2 — a strictly weaker decoder, or a failing constraint, breaks it' — confirming the one-directional [CONJ] (Realization⟹Adequacy) is not accompanied by its converse"
