title: "Theory 05 — Realization and the Decoder: 'the shortest document in the set, and the one with the largest gap between its importance and its evidence' — restates the Realization⟹Adequacy conjecture and the KR-REP-REDUCTION design defect (already recorded at M0256/M0257) with two genuine refinements: an explicit architectural rationale for why the constraint C belongs to the inquiry frame rather than the transformation, and a granular representation-level-vs-operator-level distinction for exactly where the adequacy/realization separation could (and could not) be exhibited"
