about: >
  Extracts Williamson's anti-luminosity/margin-for-error/structural-unknowability philosophy as
  formal research candidates for KnowledgeOS's Evaluation/Zero/Determination core, proposing a
  candidate FIFTH factor (Accessibility) for the already-frozen four-factor FDE evaluation
  representation (Standing×Boundary×Context×Provenance), and a three-way UNKNOWN classification
  (current/access-limited/structural).
introduces:
  - "Epistemic Non-Transparency (anti-luminosity) principle: P(x) ⇏ Accessible(P(x)) — an epistemic property may obtain without the evaluator being able to determine that it obtains; marked [DERIVED — very strong]"
  - "Knowledge Iteration Non-Closure: K^n(p) ⇏ K^{n+1}(p) — higher-order knowledge requires separate grounds, explicitly protecting against the AI-system error 'the system knows X, therefore it knows that it knows X'; directly extended to Verification≠MetaVerification (Verify(V) requires its own evidence/context/authority)"
  - "Margin for error candidate: Known(p,Γ)⇒Margin(p,Γ)>0, with an explicit rejection that Margin=Confidence or that epistemic quality reduces to a scalar score — 'the required margin can vary from point to point and need not be uniform'"
  - "Three-way UNKNOWN classification: Unknown_current (resolvable with more evidence), Unknown_access (resolvable in principle, not from current access/capability), Unknown_structural (not resolvable by the relevant epistemic system even in principle) — a genuinely new refinement of the Zero/Unknown vocabulary, marked [PROP — strong research candidate]"
  - "Evidence decomposition candidate: Evidence(e,h,Γ)=f(Support(e,h),Standing(e),Context(Γ)) — reinforcing, with independent philosophical grounding, the corpus's own FDE-derived Standing≠Boundary≠Reason separation"
  - "Evidence relativity/context-dependence: Same Proposition ⇏ Same Evidence; Same Evidence Content ⇏ Same Epistemic Situation — a new dimension for the cross-frame-divergence research question, reinforcing φ⊇{time,context} with independent philosophical argument"
  - "Candidate FIFTH factor for the FDE evaluation representation: Evaluation = Standing×Boundary×Context×Provenance×Accessibility — explicitly marked 'DO NOT adopt yet', pending the recommended KR-ACCESS-2026-09 experiment"
  - "The concrete KR-ACCESS-2026-09 experiment design: a 7-row test table (cases A-G) crossing Truth/Evidence-quality/Accessible?/Knowable?/Knowledge-outcome, introducing notation U (ordinary unknown), U_s (structurally unknowable), U_a (accessibility-limited)"
  - "Revised critical path (§36): Accessibility (NEW, high priority) → ℛ_req → Frame semantics (φ) → Evaluation representation (5-factor test) → Contr (only after the above) → Zero → Determination → δ → Composition (split Eval vs. Transition) → Kernel selection"
  - "Assertion-responsibility candidate: Assertion(p)→Responsibility(p), extended explicitly to LLM-generated claims: LLM confidence≠Knowledge, GeneratedAssertion≠Determination — directly supporting the corpus's anti-reasoner/deterministic-kernel-boundary discipline"
