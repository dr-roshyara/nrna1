about: >
  Reports the complete KR-CONTR-FDE-2026-09 result: "an FDE-inspired two-channel semantic
  representation CAN preserve the distinctions required by KnowledgeOS Contr and Zero, BUT ONLY IF
  the representation maintains separate channels for evaluation result (S+,S-) and boundary
  metadata (Reason, Provenance, Context, Condition)." Reports collapse rates across all four models
  against fourteen scenarios: Classical {T,F} collapses 12/14 (85.7%); K3 {T,F,U} collapses 8/14
  (57.1%); FDE {T,F,B,N} collapses 6/14 (42.9%); Structured (S+,S-,Reason,Provenance,Context)
  collapses only 2/14 (14.3%) -- and both remaining collapses are explicitly judged ACCEPTABLE,
  not failures: C1 (No-Evidence vs Not-Assessed, both (0,0), distinguished by Reason -- "epistemic
  state" vs "procedural state," a genuine semantic category not requiring distinct S+/S- values)
  and C2 (five distinct contradiction types -- direct contradiction, conflicting sources,
  contradictory rules/observations/interpretations -- all (1,1), correctly distinguished by
  Reason/Provenance rather than requiring additional value-channel distinctions, since "a value
  channel should not be overloaded with type distinctions that belong in the boundary metadata").

  **DELIVERS FIVE DETAILED COUNTERMODELS**, each showing exactly what a simpler model loses:
  (1) Classical collapses direct contradiction to an error/undefined state (bottom), losing the
  ability to distinguish genuine contradiction from logical impossibility or evaluation failure;
  (2) K3 collapses direct contradiction to Unknown, losing the distinction between genuine
  contradiction and ordinary epistemic uncertainty; (3) FDE collapses distinct contradiction TYPES
  (direct contradiction vs conflicting sources) to the single value Both, losing the "why" of the
  contradiction that matters for choosing a resolution strategy (further observation vs authority
  weighting); (4) K3/FDE both collapse "no evidence after exhaustive search" (which may itself
  inform belief) and "not yet assessed" (which cannot) onto the same value; (5) Classical/K3/FDE
  all collapse "current evidence supports p" and "superseded evidence once supported p" onto the
  same value T, losing the temporal status critical for knowledge lifecycle.

  **DELIVERS A DEFINITIVE DECISION-GATE VERDICT**: Status C -- STRUCTURED EVALUATION REQUIRED
  (Value + Reason + Provenance), explicitly REFUTING THE "FOURTH-VALUE MAGIC" HYPOTHESIS OUTRIGHT:
  "the experiment refutes the hypothesis that a fourth value (B or C) is sufficient. The problem is
  not the number of values -- it is the type of representation. Values alone cannot carry boundary
  metadata." And a Kernel Verdict: K2 -- new semantic representation required, but explicitly
  OUTSIDE the kernel: "the structured representation must exist outside the kernel. The kernel
  should continue to operate on the existing v1.2 components. The structured representation is a
  semantic layer over the kernel, not a replacement for it." Recommends NOT adopting FDE as
  KnowledgeOS logic (useful reference model only) and recommends proceeding next to TODO C (the
  progress-ordering >= problem).

  **DELIVERS A COMPLETE SET OF CANDIDATE FORMAL DEFINITIONS**: Standing(p) = (S+(p), S-(p), R(p),
  P(p), Ctx(p), Cond(p)); Contr(p) iff S+(p)=1 and S-(p)=1, with contradiction TYPE distinguished by
  R(p) in {Direct, Source, Rule, Observation, Interpretation}; ZeroLens(K_t) = the set of p whose
  Standing shows S+=0 or S-=0 or R="Unknown"-family, examining the boundary of what is not
  established; Adequate(R,Q) iff D_Q subseteq Preserved(R) (restating the already-established
  Adequacy Principle, here explicitly verified rather than merely asserted); and a DELIBERATELY
  STRONG semantic-equivalence definition requiring complete structural identity across all six
  Standing components (S+,S-,R,P,Ctx,Cond) simultaneously -- explicitly justified as "deliberately
  strong... this ensures no silent collapse," a notably more conservative equivalence criterion
  than any previously recorded in this pass.

  **NAMES A NEW STANDING INVARIANT**: "Value-Boundary Separation" -- S+/S- channels carry only
  standing; boundary metadata carries reasons for standing; Reason(standing) != standing (Reason is
  not a value channel); "no silent collapse" (if two scenarios have different meanings, their
  representation must differ; if S+/S- are identical, boundary metadata must differ) -- with FDE
  explicitly cited as violating this invariant by collapsing contradiction type into a single value
  B, and K3 violating it by collapsing absence into a single value U.

  **PROPOSES A MINIMUM FOUR-COMPONENT BOUNDARY STRUCTURE AND A PARTIAL TAXONOMY**: Boundary_t =
  (Reason_t, Provenance_t, Context_t, Condition_t), with named candidate value sets for each
  (Reason in {Evidence, Authority, Logic, Temporal, Scope, Assessment, Interpretation, Conflict};
  Provenance in {Observed, Inferred, Reported, Calculated, Assumed, ...}; Context in {Current,
  Stale, Expired, Unknown, Obsolete}; Condition in {InScope, OutOfScope, Conditional,
  Unconditional, Principle}) -- explicitly left OPEN as to formal completeness (Section 13.1-13.4:
  reason/provenance/context/condition types "need formal definition and completeness proof").

  **DISCUSSES A CANDIDATE (NOT ADOPTED) THEORY v1.3 MAPPING**: notes the structured standing
  representation could populate the C_t (Conflict) component of the eleven-component K_t structure
  seen in M0125/M0126 -- explicitly marked "a candidate -- not an architectural decision," and
  Theory v1.2 remains unchanged and unmodified by this experiment.

  **LEAVES FIVE CATEGORIES OF ITEMS EXPLICITLY OPEN**: formalization of the four boundary-type
  taxonomies with completeness proofs; standing-vs-reason interaction rules (when can standing
  change without reason changing, and vice versa); Zero's operational semantics (invocation
  interface, output, computational cost); boundary adequacy verification (are the four boundary
  dimensions themselves sufficient); and two explicit hypotheses about N_eff independence
  ("does structured standing affect N_eff? Hypothesis: No" / "does boundary metadata affect
  N_eff? Hypothesis: No" -- both stated as hypotheses to be tested, not established facts).
