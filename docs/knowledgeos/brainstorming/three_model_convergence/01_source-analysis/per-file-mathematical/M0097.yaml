about: >
  Specifies KR-M2O-2026-09-02 as a controlled, adversarial empirical/formal experiment against
  KnowledgeOS Theory v1.2, explicitly instructed: "Do NOT try to confirm the Linga-Yoni metaphor.
  Do NOT make the model work by construction. Do NOT silently repair theory gaps. Do NOT promote
  philosophical analogy into KnowledgeOS architecture." Status [EXP]; Theory v1.2 must not be
  modified, no v1.3 created; any amendment recorded separately as [PROP], never auto-promoted.

  **REFRAMES THE CENTRAL QUESTION**: not "does millions-to-one prove Knowledge?" but "does
  candidate multiplicity and selection introduce irreducible epistemic capability that KnowledgeOS
  v1.2 currently lacks?"

  **SPECIFIES TWELVE INDEPENDENTLY TESTABLE HYPOTHESES (H1-H12)**, considerably more detailed than
  M0095's H0: H1 (more candidates does not necessarily improve quality), H2 (candidate reduction !=
  epistemic progress), H3 (selection != validation), H4 (selection != determination), H5 (unique
  survivor does not imply Knowledge), H6 (multiple survivors can be correct), H7 (zero survivors
  can be correct), H8 ("best candidate" requires an ordering/comparison criterion; no assumed total
  scalar ranking), H9 (more candidates can increase selection bias/overfitting/false-selection
  risk), H10 (generation/assessment/selection/validation/determination/knowledge-attribution may
  be separate responsibilities), H11 (if all behavior is reproducible without an irreducible
  capability, candidate-multiplicity does NOT justify a new kernel primitive), H12 (the biological
  million-to-one ratio has no universal epistemological status merely because biology has that
  property).

  **MANDATES SIXTEEN NON-COLLAPSE DISTINCTIONS** to be preserved throughout: Candidate!=
  Assessment, Assessment!=Selection, Selection!=Validation, Validation!=Determination,
  Determination!=Knowledge, CandidateCount!=KnowledgeQuantity, CandidateCount!=KnowledgeQuality,
  CandidateReduction!=EpistemicProgress, Acceptance!=Truth, Survival!=Factivity, Ranking!=
  Validation, Fit!=CausalValidity, Evidence!=Assessment, Credence!=Truth, Knowledge!=
  EpistemicState, Zero!=Selection/Evaluation/StateTransformation -- "Do not collapse these
  distinctions merely to simplify implementation."

  **FORMALIZES THE PIPELINE AS EXPLICITLY SET-VALUED**: G(K_t,Q_t)->H_t (n not assumed =1),
  A(H_t,E_t,M_t,S_t,C_t)->V_t, Sel(H_t,V_t)->A_t (A_t subseteq H_t, "Selection MUST initially be
  set-valued... Do NOT define selection as argmax returning exactly one candidate," |A_t| in
  {0,1,>1}), Det(A_t,Q_t,S_t,C_t)->D_t, Gamma(D_t,E_t,factivity-policy)->K_t^attrib, with the
  explicit prohibition "Do NOT assume |A_t|=1 => Knowledge."

  **MANDATES A PARTIAL-ORDER-FIRST METHODOLOGY**: construct incomparability-preserving cases
  (H1>=H2 but not H2>=H1; neither dominates) BEFORE introducing scalar ranking as a "secondary
  experimental arm," and even then requiring explicit sensitivity testing to weights,
  normalization, metric choice, candidate count, and candidate dependence.

  **SPECIFIES FIVE (OPTIONALLY SIX) EXPERIMENTAL ARMS** varying candidate count across five orders
  of magnitude (n=1,10,100,1,000,10,000, optionally 100,000), explicitly warning "do NOT sacrifice
  experimental validity merely to obtain a larger number."

  **REQUIRES FIFTEEN GROUND-TRUTH-ISOLATED CONTROLLED EPISTEMIC WORLDS** (unique true hypothesis;
  multiple observationally-compatible hypotheses; no admissible hypothesis; one false but highly-
  fitting hypothesis; multiple false hypotheses; correct-hypothesis-weak-evidence; false-hypothesis-
  strong-apparent-fit; model misspecification; dependent evidence; independent evidence;
  contradictory evidence; unobservable target; underdetermined target; temporal evidence conflict;
  selection-induced overfitting), with the evaluator (not the epistemic agent) permitted access to
  ground truth, and a mandatory STATIC audit of the simulator to ensure no truth leakage.

  **SPECIFIES SEVEN CANDIDATE GENERATOR TYPES (G1-G7)** (random, diverse, correlated, near-
  duplicate, adversarial, high-false-proportion, high-correct-proportion), explicitly mandating
  that "most hypotheses are false" must NOT be assumed but MEASURED per generator -- directly
  operationalizing M0095's rejected Claim D.

  **MANDATES EXPLICIT CANDIDATE-DEPENDENCE MODELING**: "3 candidates != 3 independent
  alternatives" when they share an underlying assumption; requires measuring candidate_dependence
  distinct from candidate_count, framed as "a major statistical requirement."

  **MANDATES THE SELECTION-BIAS/WINNER'S-CURSE TEST**: constructs a null world where no candidate
  has real predictive advantage, generates increasingly many candidates, selects the best apparent
  training fit, and compares training performance against independently-evaluated held-out
  performance, explicitly testing whether max(training_score) increases with candidate count while
  held-out performance does not -- "this directly tests 'More candidates => better knowledge' and
  should be treated as an adversarial statistical control." Formalizes: |H| up-arrow does NOT imply
  KnowledgeQuality up-arrow, and (ideally) |H| up-arrow implies SelectionBias up-arrow under null
  conditions.

  **MANDATES AN ANTI-SMUGGLING RULE**: every capability must be tagged as explicitly represented /
  derivable / evaluator-only / simulator infrastructure / imported-from-the-proposed-model /
  inherited-from-KnowledgeOS-v1.2, with particular attention to Represent, Select, Validate,
  Determine, Score, Order, GroundTruth, Truth, Progress -- "a capability must not be declared
  irreducible if it was silently implemented elsewhere."

  **MANDATES A REPRESENTATION-INVARIANCE TEST**: repeat selected experiments under scalar-score,
  vector, partial-order, and explicit-relation-graph representations, testing whether observed
  epistemic behavior changes due to representation rather than semantics -- "do NOT confuse
  computational representation with semantic capability."

  **SPECIFIES FOURTEEN NEGATIVE CONTROLS (NC1-NC14)** and TWENTY-FIVE required metrics (candidate
  count, surviving count, reduction ratio, diversity, dependence, selection/unique-selection/
  multiple-survivor/zero-survivor rates, validation-failure rate, false-selection rate, selection
  optimism, held-out performance, determination unique/multiple/none rates, knowledge-attribution
  rate, factivity violations, epistemic gap before/after) -- "do not invent an aggregate 'knowledge
  score' unless explicitly justified."

  **MANDATES MONTE CARLO DISCIPLINE**: distinguish simulation uncertainty from epistemic
  uncertainty, report sample size/seeds/generator configuration, use Wilson intervals for binomial
  proportions, perform vacuity audits, ensure controls are non-vacuous -- "do not treat 10,000
  trials as a population proof."

  **EXPLICITLY DEFERS KERNEL MINIMALITY**: reuses the corpus's already-established finding
  ("semantic equivalence unresolved, kernel minimality blocked") to require "DO NOT perform kernel
  minimality comparisons until semantic equivalence is adequately specified... may identify
  candidate irreducible capability but may NOT claim final minimal kernel... if blocked, explicitly
  report KERNEL MINIMALITY NOT TESTABLE."

  **EXPLICITLY SUBORDINATES THE LINGA/YONI AND GITA INTERPRETATIONS**: only after the mathematical
  experiment is complete may the Linga/Yoni metaphor be discussed, and then only as [EXT]
  philosophical analogy / [PROP] structural interpretation, explicitly forbidding Linga=Generator/
  Yoni=Selector/Linga=Kernel/Yoni=KnowledgeSpace "unless a separate structure-preserving
  correspondence has been demonstrated. The biological sperm analogy is NOT evidence for the
  epistemic model." Analogously for the Gita: "It cannot serve as mathematical evidence... Do NOT
  claim: 'The Gita proves candidate selection.'"

  **NAMES THE MOST IMPORTANT METHODOLOGICAL PRINCIPLE**: "Do not ask 'How can we make the million-
  to-one model fit KnowledgeOS?' Ask 'Under what conditions would the million-to-one model be
  unnecessary, false, useful, or genuinely structurally necessary?' The experiment must be capable
  of concluding 'The model adds no new capability.' That is a successful result."

  **DEFINES THE DECISIVE THREE-WAY DISCOVERY-OUTCOME TAXONOMY**: (A) Redundancy -- Selection =
  f(Discriminate,Validate,Determine), no new kernel capability; (B) Independent domain
  responsibility but not a kernel primitive -- semantically distinct in DDD, computationally
  derivable; (C) Irreducible epistemic capability -- no existing kernel operation reproduces
  selection semantics under the same semantic carrier and observable behavior. "Only C would give
  us a serious reason to reopen the kernel question. And because Contr, >=, factivity, and
  semantic equivalence are still unresolved, Claude must not jump from C to a new canonical
  kernel" -- an explicit, disciplined refusal to let even the strongest possible outcome bypass the
  corpus's established unresolved-prerequisite chain.

  Specifies a complete artifact directory structure (experiments/KR-M2O-2026-09-02/ with protocol/,
  src/, results/, analysis/, verdict/ subdirectories), a 23-section FINAL-VERDICT.md template, a
  20-question required final verdict, an absolute version-control rule (no Theory v1.3), and a
  16-item completion-criteria checklist -- among the most operationally complete experimental
  specifications in the entire corpus.
