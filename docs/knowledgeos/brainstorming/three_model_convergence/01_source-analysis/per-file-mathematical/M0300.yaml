about: >
  Mines a Kashmir Shaivism source book for a contrast with Madhyamaka Sunyata: proposes that emptiness of content/form does not imply emptiness of the underlying 'field' (Consciousness in the source tradition), giving a candidate third Sunya type -- Field Sunya -- alongside the already-distinguished Content Sunya (R(x)=empty) and Determination Sunya (no justified determination, the corpus's established 'Knowledge Sunya'). Proposes a comparative research program (Madhyamaka Sunyata <-> Kashmir Shaivism <-> KnowledgeOS) before defining Knowledge Sunya formally, and explicitly declines to adopt Consciousness/Omega as a KnowledgeOS primitive ('not proposing Omega as a primitive yet -- that would be premature').
introduces:
  - "Field Sunya: the layer distinguishing 'what appears/disappears' (content/determination) from 'the field in which it appears' (Omega(K)), explicitly NOT adopted as a KnowledgeOS primitive"
  - "A three-layer decomposition F(K) [form/content] / R(K,Q,C,E) [relations/determination] / Omega(K) [field/awareness]"
