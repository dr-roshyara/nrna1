title: "Review of KR-NEFF -- Be Careful With 'N_eff Is Real': A Genuinely Executed Effective-Hypothesis-Complexity Experiment (N_eff Approx 9, 51, 202, 941 for |H|=1000 Under Varying Dependence Structure), Confirming |H| Is Not an Adequate Complexity Measure, Retracting an Apparent Closed Form N_eff=n(1-rho)^2 After Widening the Test Domain, Showing Dependence Affects Downstream Validation/Determination Rates, a Validation-Channel-Independence Result (0.0075 vs 0.9928 Decoy-Detection Probability), and a Speculative Unification Hypothesis Linking N_eff to the Unresolved Semantic-Equivalence Problem and M0098's Projection/Invariant-Preservation Line"
