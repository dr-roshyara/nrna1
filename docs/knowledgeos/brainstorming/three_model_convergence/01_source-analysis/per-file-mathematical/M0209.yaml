title: "Fifth pass over the representation-reduction protocol: fixes a concrete R6=D/T5-R5 indexing inconsistency, distinguishes representation-capacity from Shannon entropy as the correct monotone-decrease criterion, gives the thread's first worked illustrative status table, and explicitly forbids inferring a unique eliminated payload S from a failed transition unless an explicit elimination decomposition exists — tying back to KR-ZERO-ORDER's non-element-wise finding"
