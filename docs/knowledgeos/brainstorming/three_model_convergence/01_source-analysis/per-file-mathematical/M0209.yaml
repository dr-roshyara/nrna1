  - "Whether the worked illustrative table's numeric pattern (adequate-and-redundant → adequate → Q-equivalent-optimal → boundary-crossed) is ever reproduced by an actual executed experiment"
mathematical_content: >
  Corrects a specific overclaim (entropy must strictly decrease across a representation-reduction
  chain) with a concrete counterexample and introduces a four-way conceptual separation (capacity/
  storage-cost/entropy/minimality) not made this precisely elsewhere in the thread; the connection
  between failed-transition-payload-inference and KR-ZERO-ORDER's non-element-wise finding is a
  genuine cross-connection within the same overall research programme.
