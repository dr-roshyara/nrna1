about: >
  Introduces the "Basing relation" as a candidate missing middle layer between Evidence and
  Determination — Evidence→Basing→Process→Determination, with Reliability(Process,Environment,
  Context) as an explicit, environment-relative evaluable property — argued to be one of the
  highest-value missing pieces in KnowledgeOS theory, alongside a strengthened epistemic-lineage
  model of Provenance and a descriptive/normative process distinction directly relevant to AI-
  generated determinations.
introduces:
  - "The Basing relation: Base(e,d|Γ) — 'determination d is epistemically based on evidence e under context Γ', later refined to Basing=(E,P,D,Γ,Π) (evidence set, process, determination, context, provenance) — distinguishing Evidence exists ≠ Evidence supports proposition ≠ Determination was actually based on evidence ≠ Determination was produced by a reliable process"
  - "Explicit Epistemic Process category: Process:Evidence→Determination, with P=(type,implementation,inputs,outputs,environment,provenance) and Reliable(P,Γ) as an environment-relative evaluable property — Reliable(P,Γ1) ⇏ Reliable(P,Γ2) — illustrated by the stopped-clock case (apparently good evidence + accidentally true conclusion ≠ knowledge, because the producing process is unreliable in that environment)"
  - "DeterminationAdequacy = Evidence + Basing + Process + Context — a candidate four-dimensional decomposition, explicitly 'not an equation of values, but distinct dimensions an evaluator may inspect'"
  - "Strengthened Provenance via EpistemicLineage: Source→Acquisition→Evidence→Process→Determination, distinguishing 'ordinary provenance' (where an artifact came from) from 'epistemic provenance' (why a determination exists, what evidence originally supported it, which process transformed it) — with the explicit consequence Accessible(e,t)=False ⇏ PreviouslySupported(d,e)=False (the 'forgotten evidence' problem)"
  - "Descriptive vs. normative epistemic layers: ObservedProcess≠NormativelyAcceptedProcess, ObservedDetermination≠AcceptedDetermination — explicitly applied to AI systems: 'retrieval→LLM synthesis→unsupported assumption→answer' is a descriptive fact whose epistemic acceptability is a separate normative/governance question; 'we must never infer epistemic validity merely from the fact that a process successfully produced an output'"
  - "Generate ≠ Preserve ≠ Transform as a candidate operation classification for δ research, mapped to Observation(generative)/Memory-retrieval(preservative)/Inference-Reconciliation(transformational)/Verification(evaluative)"
  - "Zero/accessibility strengthening: NoEvidence ≠ EvidenceUnavailable ≠ EvidenceForgotten ≠ EvidenceOfAbsence — a four-way split extending (not identical to) Williamson's three-way Unknown classification (M0147) and Gödel's system-relative Unknown_S (M0150)"
  - "Three-level evidence chain: Source→Process→Evidence, with SourceSystem(e)=S and Reliability(S,Γ) — treating Evidence as produced by a system/process rather than an atomic thing with intrinsic quality"
  - "EpistemicProcess ⊄ InternalState (an Extended-Mind-style architectural point, explicitly NOT adopting 'Extended Mind' as a thesis): 'epistemic process boundaries cannot be assumed to coincide with the boundary of the agent' — directly relevant to AI+retrieval+database+verifier chains, which should be preserved as distinct components rather than collapsed into one 'knower'"
  - "Distributed epistemic processes (social externalism): EpistemicProcess = IndividualProcess ∪ DistributedProcess, with Reliability(P,Γ) potentially a property of a network rather than an individual source — DistributedProcess=(Nodes,Edges,Roles,Transformations,Controls), explicitly a research candidate, not a primitive"
  - "Source-monitoring failure lesson: Presentation≠Reliability, AuthorityCue≠EvidenceQuality, Confidence≠Truth — reinforcing the existing Evidence/Authority/Provenance/Determination/Verification separation with an argument for machine-readable source lineage over human memory of provenance"
  - "SourceReliability(s,Γ) ≠ EvidenceStanding(e) ≠ DeterminationStanding — a highly reliable source can give bad evidence on a particular question, and vice versa"
  - "InformationEffect(δ) classification candidate: preservative/deductive-extractive/inductive-expansive/reconstructive/evaluative — from the deduction-extracts/induction-extends distinction, explicitly NOT proposed as 'Deduction vs Induction' primitives but as a general operator-property research dimension for δ"
  - "KnowledgeStanding ≠ Assurance, CanAssertKnowledge ≠ HasKnowledge — from the skepticism discussion, explicitly noted as 'extraordinarily compatible with our recent R1 decision' (factivity retained externally, Verification separate)"
  - "Explicit negative results: pragmatic encroachment (Knowledge should not derive from Risk/Stake(Γ)) and contextualism (context should not automatically redefine Standing/truth) both EXPLICITLY REJECTED by the source itself as inadequate solutions — preserved instead as KnowledgeStanding≠DecisionThreshold with DecisionThreshold=f(Knowledge,Risk,Authority,Purpose)"
  - "Candidate SEVEN-factor evaluation representation: EVal=(Standing,Boundary,Reliability,Accessibility,Context,Provenance,Assurance) — a THIRD proposed extension to the frozen four-factor FDE representation (after M0147's fifth-factor Accessibility proposal and M0150's sixth-factor DerivabilityStatus proposal), explicitly 'not adopted... the research target exposed by Shieber'"
  - "Recommended research artifact KR-SHIEBER-2026-09 — Basing, Process Reliability and Epistemic Lineage, with five sub-experiments: S1 (Basing, testing whether it is a distinct required relation), S2 (Process Reliability, six named process types P1-P6 with identical conclusions but different processes), S3 (Epistemic Lineage / forgotten-evidence formalization), S4 (Assurance vs. Standing, four comparison cases), S5 (Distributed vs. Individual Process)"
  - "Revised critical path: Evidence→Basing→Process→Reliability→Evaluation→Standing/Boundary→Contr/Zero→Determination→Assurance→Decision→δ, with Provenance/Context/Time/Authority orthogonal"
