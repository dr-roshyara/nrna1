about: >
  A compact, largely consolidating restatement of M0275/M0276's projection theory of Zero, giving
  it clean final formal notation, a concrete illustrative independence example, and — its main new
  contribution — an explicitly named governing methodological rule ("The Question-Projections
  Axiom") plus the cleanest single 4-row comparative summary table of the entire Elimination/
  Balance/Containment/Determination Zero cluster.
introduces:
  - "A clean unified restatement of the projection theory: K_t∈𝒦 observed through a family Π={Π_1,...,Π_n}, each Π_i:𝒦→O_i, with Zero_i(K_t)⟺Π_i(K_t)=0_{O_i} — 'instead of postulating multiple disjoint Zeros as primitive operators, we define a unified multidimensional state observed through a family of projection operators'"
  - "A concrete illustrative example of projection independence: a system state K_t can be Elimination Zero under Π_elim (a claim is redundant to query Q) while being explicitly Non-Zero under Π_cont (the historical trace and boundary remain active in memory)"
  - "THE QUESTION-PROJECTIONS AXIOM, an explicitly named governing methodological rule for all future KnowledgeOS specifications, elevating M0275's culminating reframing into formal axiom status: 'never ask \"What is the Zero of this knowledge state?\" Always ask: \"Under projection Π_i, relative to question Q and transformation T, does the state component evaluate to neutral element 0_{O_i}?\"'"
  - "The cleanest single 4-row comparative structural summary table produced for the entire Zero cluster, mapping each of the four established Zero projections (Elimination/Dialectic Contribution/Containment-Harm/Epistemic Determination) to its observable domain, exact zero-condition formula, and epistemic meaning, side by side for the first time"
