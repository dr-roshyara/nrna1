about: >
  Five concatenated reviews. The most significant reports KR-BRIDGE-02-ZERO-PRESERVATION (varying Π
  and Q, the exact next step identified at M0229/M0231) as ACTUALLY EXECUTED, revealing that the
  experiment caught and corrected two of its own methodological errors before adjudicating any
  result — a genuine demonstration of the research programme's self-correcting discipline operating
  at the design-validation stage rather than only post-hoc. The remaining reviews largely consolidate
  already-recorded KR-BRIDGE-01/KR-REP-REDUCTION findings, except for a substantially richer third
  documented instance of the Gita-companion-study anti-reification discipline.
introduces:
  - "KR-BRIDGE-02-ZERO-PRESERVATION-2026-09 EXECUTED: an experiment specifically varying Π and Q (both held fixed at BRIDGE-01, M0229) to test whether a CONDITIONAL Zero-preservation bridge exists for some particular (Π,Q,T) combination"
  - "METHODOLOGICAL ERROR 1 caught and corrected: the original read-disjointness gate (checking that Q and Π declare disjoint SOURCE fields) was UNSOUND, because a transformation can DERIVE an output field from other input fields, so declared-disjoint source reads do not guarantee the actual transformed representation is disjoint — the corrected gate must operate on the ACTUAL transformed representation and be VERIFIED EMPIRICALLY, not merely checked against declared field lists"
  - "METHODOLOGICAL ERROR 2 caught and corrected: the first proposed adjudication criterion (marginal risk difference, RD) was WRONG because it simply rediscovers the already-known redundancy confound identified in BRIDGE-01 (M0229) rather than testing a genuine conditional relationship — the corrected criterion requires the bridge to survive WITHIN redundancy strata, using the Mantel-Haenszel stratified risk difference (a standard epidemiological method for combining stratum-specific estimates while controlling for a known confounder) — a genuine statistical-rigor upgrade over BRIDGE-01's own analysis"
  - "The scoped negative result: 'No admissible (Π,Q,T) produced a substantive within-stratum Zero-preservation relationship replicated on both train and test' — but explicitly NOT a universal 'no-bridge law,' since only 31 of 112 candidate cells were actually searched after applying the (increasingly strict) admissibility gates and informativeness requirements — the negative result is scoped to the tested region, consistent with the thread's established discipline against overgeneralizing negative findings"
  - "A NEW methodological principle: 'Π-family size ≠ mechanism count' — after deduplication, several apparently distinct observations (value multiset, value set, arity) become MUTUALLY DETERMINED, so what looks like multiple independent Π candidates actually tests the SAME underlying mechanism repeatedly under that transformation — an important design-quality insight preventing false statistical power from illusory observation diversity"
  - "A third, substantially richer documented instance of the Gita-companion-study anti-reification discipline (after M0213's verse-2.50 rejection and M0229's high-level praise): four specific graded outputs — verse 3.27 (correlation can have mistaken attribution: moderate-but-limited lens/corroboration of shape); verse 14.19 (don't name an agent where evidence doesn't support one: useful interpretive lens); verse 2.48 (don't privilege outcomes/hypotheses: explicitly weak corroboration); verse 2.48a ('release attachment and move on': explicitly REFUSED as a research move) — with the explicit acknowledgment that the Gita 'provides no statistical machinery for detecting the confounder; the actual detection came from the experiment's stratification procedure'"
  - "The meta-observation elevated as the strand's own strongest characterization: 'the refusals are the most reliable output this strand produces' — turning philosophical material into a 'shortcut-detection mechanism' (Gita passage → candidate interpretive temptation → explicit methodological refusal) rather than a source of theory, explicitly NOT 'the Gita anticipated our theory'"
  - "A caught wording-drift risk in the Gita companion study itself: its phrase 'redundancy was causing both Zero and inadequacy' is stronger than the experimental report's own tightened scope ('within the tested deduplication regime, redundancy behaves as a common cause...') — flagged so the philosophical companion study does not accidentally re-strengthen a causal claim the primary experimental report deliberately weakened"
  - "Explicit refusal semantics for Outcome A: 'OUTCOME A ⟹ no formal bridge hypothesis is currently licensed' — so the Gita's 2.48a ('move on') cannot mean 'declare the question resolved,' only 'continue under the newly established constraint'"
  - "Confirmation of the full experimental sequence and its governance rule: KR-ZERO → KR-REP-REDUCTION → BRIDGE-01 → BRIDGE-02, all under 'Experiment → Audit → Adjudication → Theory v1.3,' with Theory v1.2 explicitly still frozen"
