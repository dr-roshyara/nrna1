about: >
  Audits I. J. Good's *Probability and the Weighing of Evidence* (1950) for KnowledgeOS
  consequences, explicitly framed as filling a gap: "KnowledgeOS has been developing evidence,
  probability, uncertainty, hypotheses, validation and determination separately. Good gives us a
  rigorous conceptual bridge between them: evidence changes the relative standing of hypotheses."
  The central finding is explicitly NOT "make KnowledgeOS Bayesian" but to introduce an
  evidence-assessment layer between Evidence and Determination.

  **DELIVERS WEIGHT OF EVIDENCE AS AN INTRINSICALLY RELATIONAL (HYPOTHESIS-COMPARATIVE) OBJECT**:
  F(E;H,H̄) = O(H|E)/O(H) = P(E|H)/P(E|H̄) (the likelihood ratio), with logarithmic weight
  W=log F making evidence additive across independent observations (Final plausibility = Initial
  plausibility + Weight of evidence) -- but explicitly non-additive under dependence: W(E_1,E_2)
  != W(E_1)+W(E_2) unless the experiments are independent under the competing hypotheses. This
  directly strengthens an "evidence dependence" open problem from prior corpus into a mathematically
  grounded requirement, and gives a formal account of the "double counting" problem (three
  correlated observations of the same underlying fact must not be summed as three independent
  weights).

  **DELIVERS EVIDENCE POLARITY (Support/Weakening/Neutral via F>1/<1/=1)** and rejects a universal
  scalar `evidence_strength` field in favor of a DDD candidate EvidenceAssessment structure keyed by
  (evidence, targetHypothesis, competingHypothesis, context, model).

  **DELIVERS PRECISION != DETERMINATION (EW-04)**: P(E|H) can be precise while P(H|E) and P(H) are
  not -- directly reinforcing the KnowledgeOS `Determine` problem and Titelbaum's epistemic-standards
  work (M0032/M0033/M0036).

  **DELIVERS REJECT != ACCEPT (EW-03) AND PAIRWISE-SUPERIORITY != GLOBAL DETERMINATION**: rejecting
  H_1 in favor of H_2 under a two-hypothesis comparison does not establish H_2 as globally true if a
  third hypothesis H_3 exists -- reinforcing "Determination requires an adequately scoped alternative
  space" and distinguishing comparative/exclusive/global/insufficiently-scoped determination.

  **DELIVERS GOOD'S TRICHOTOMY (axioms/rules/suggestions) AS A DIRECT EXTERNAL ANALOGUE OF THE
  KNOWLEDGEOS THEOREM/INVARIANT/HEURISTIC PROBLEM**: mapped to Formal Law != Application Rule !=
  Heuristic -- a genuinely useful external validation of the classification discipline M0043 had just
  formalized as [DEF]/[AX]/[THM]/[COR]/[EMP]/[ARCH]/[OPEN].

  **DELIVERS "APPROXIMATION PROVENANCE MUST SURVIVE TRANSFORMATION" (EW-06)**: if M'≈M is used for
  convenience, Result(M') must not silently become Result(M) -- explicitly identified as "almost
  exactly the anti-fabrication problem we have been dealing with," and motivating a second
  provenance type (InferenceProvenance, distinct from SourceProvenance): "under what
  inferential/model assumptions did this result arise?"

  **DELIVERS "SELECT RELEVANT EVIDENCE" AS A NEW CANDIDATE OPERATOR, EXPLICITLY LEFT [OPEN] AS TO
  KERNEL MEMBERSHIP**: directly engages the unresolved 13-vs-8 kernel debate (M0037/M0040/M0041/
  M0043) by asking whether relevance-selection is irreducible, part of Discriminate, part of
  Inquiry, part of Evidence assessment, or infrastructure -- "Good gives evidence for the function,
  not for its kernel membership," an explicit methodological caution against over-attributing kernel
  status to a demonstrated functional need.

  **STRENGTHENS DOUBT ABOUT `Select` AS KERNEL-PRIMITIVE**: Evidence -> Hypothesis Assessment ->
  Decision, where Decision additionally requires Utility/Cost/Consequence, suggesting Select may sit
  downstream of the epistemic kernel entirely -- proposes distinguishing Select_epistemic from
  Select_decision, explicitly noting "this could materially change the interpretation of the recent
  13-operator kernel experiment."

  **DELIVERS INFORMATION QUANTITY != EVIDENCE WEIGHT != SEMANTIC ADEQUACY != KNOWLEDGE** via Good's
  own Chapter 6.9 distinction between Shannon information (-log p, entropy H=-Σp_i log p_i) and
  hypothesis-relative weight of evidence -- "one of the cleanest cross-source conclusions so far,"
  directly preventing KnowledgeQuality=InformationQuantity, KnowledgeGain=EntropyReduction, and
  KnowledgeGain=EvidenceWeight as candidate (mis)identifications.

  **DELIVERS AN 18-ITEM EW-01 THROUGH EW-18 CANDIDATE-INVARIANT REGISTRY**, explicitly labeled
  "research hypotheses, not canon" -- the most systematic evidence-specific invariant catalogue in
  the pass, covering relational weight, dependence semantics, reject-vs-accept, precision-vs-
  determination, evidence-content-vs-effect, approximation provenance, decision-vs-truth thresholds,
  proxy non-identity, evidence polarity, hypothesis-space scoping, comparative-vs-global
  determination, model uncertainty, relevance, significance/estimation/determination, information-
  vs-weight, standards-dependence, dependence-blocks-summation, and practical-vs-logical certainty.

  **DELIVERS AN EXPLICIT [NEG] ANTI-IMPORT LIST** -- Bayesianism-as-universal-epistemology, numeric
  probability as universal uncertainty representation, log-odds as universal measure, maximum
  likelihood as universal inference rule, entropy-as-knowledge, significance-testing-as-
  determination, simplicity-as-truth-criterion, mandatory subjective priors, unevidenced
  independence assumptions, and Good's own 1950 terminology as DDD language -- an unusually
  disciplined negative-import list, itself grounded in Good's own text ("this book actually supports
  our decision not to reduce KnowledgeOS to Bayesianism").

  **REVISES THE ATOMIC CLAIM MODEL** from the earlier binary k_i=(O,d_i,v_i,t,E_i,p_i,q_i) to
  k_i=(O,d_i,𝒱_i,t,E_i,A_i,S_i,q_i), where 𝒱_i may be an interval, distribution, or set rather than
  a single value -- reinforcing Good's estimation discussion (best value/interval/distribution/
  confidence-interval) as a reason atomic claims cannot always be binary-valued.

  **SIGHTS "BROWN-HWANG" A FOURTH TIME** (Sec 32, "this reinforces our Brown-Hwang conclusion: M_t
  != M*") and **"FREEDMAN" A SEVENTH TIME** (Sec 63, in a source list alongside Good, Titelbaum,
  Brown-Hwang, Davidson, Dretske and the Measure Theory work) -- both still without any dedicated
  extraction found anywhere in this pass's own sequence. **INTRODUCES A NEW UNATTRIBUTED CITATION,
  "DRETSKE"** (same Sec 63 list) -- very plausibly Fred Dretske (information-theoretic
  epistemology, *Knowledge and the Flow of Information*), consistent with this document's own
  information-vs-knowledge themes, but likewise never independently extracted in this pass -- flagged
  alongside Freedman and Brown-Hwang as a third open corpus-integrity question for the eventual
  reclassification pass.
