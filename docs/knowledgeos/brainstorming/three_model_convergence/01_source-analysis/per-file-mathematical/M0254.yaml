title: "'Purification' named as a candidate KnowledgeOS hypothesis (explicitly not theorem): a valid challenge can be negative to an argument while purifying knowledge — with a crucial validity/relevance/successful-integration CAVEAT preventing over-broad application, and a temporal distinction that Purification-Zero is reached AFTER information is added and processed, unlike Elimination Zero where information simply disappears"
