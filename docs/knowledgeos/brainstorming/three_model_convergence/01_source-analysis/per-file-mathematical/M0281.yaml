title: "KR-STATE-01 design baseline, the capstone of the recursive/temporal Zero-Śūnya research thread: reframes the object of study from 'neutral information' to the TRAJECTORY of an epistemic element across successive knowledge bases; sharpens latent activation into three causally distinct types (state/query/transformation-induced); replaces 'latent utility' with the stronger, formally testable FUTURE EPISTEMIC NECESSITY (retention changes future contract-observable behavior); adds a critical safeguard preserving Elimination Zero's established relational (non-intrinsic) character; adds a counterfactual retain/delete transition branch; and closes with a clean, minimal, explicitly frozen five-hypothesis set (H1-H5) for the experiment to test"
