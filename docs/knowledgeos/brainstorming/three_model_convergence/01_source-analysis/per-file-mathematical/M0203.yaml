about: >
  Catches one genuine internal inconsistency in the prior audit specification (M0201/M0202): the
  proposed level-metric formulas implicitly used the full source count |N|, while the missing-field
  policy requires excluding incomplete levels — these two statements conflict. Fixes it by defining
  A_n/F_n/entropy explicitly over the valid support N_n={i:R_{n,i}≠NULL}, not |N|, and freezes the
  dataset contract into 7 explicit invariants before declaring the specification stage complete.
introduces:
  - "The caught denominator inconsistency: level metrics (A_n,F_n,Ĥ_n(Q|R),Ĥ_n(R|Q)) must be computed over the valid empirical support N_n, NOT the full source corpus size |N|=1395 — 'your current formulas use |N|, but your missing-field policy says incomplete levels are excluded. Those two statements conflict'"
  - "Explicit formulas fixing the inconsistency: A_n=(1/|N_n|)Σ_{i∈N_n}C_n(R_{n,i}); F_n=(1/|N_n|)Σ_{i∈N_n}𝟙[O_n(R_{n,i})=Q_i] — both restricted to N_n"
  - "An explicit dual-quantity distinction: |N|=1395 (source corpus size) versus |N_n| (usable empirical support at level n) — 'we should never silently normalize [the 1395/1496/1475 denominator] differences away'"
  - "A stricter n* guard: for the primary canonical n*, require Comp_n=1 (full completeness) at any level used; a partial-support result may additionally be reported but must be explicitly labeled as such — narrower than M0201's Comp_n=1∧A_n=1∧N_viol=0∧Ĥ(Q|R)≤ε compound condition, isolating completeness as a separate prerequisite gate"
  - "The frozen 7-point dataset contract for 𝒟_REP: (1) no synthetic intermediate states; (2) Q_i established independently from R_n; (3) every missing representation explicitly NULL/UNOBSERVED; (4) every metric reports its actual denominator N_n; (5) completeness reported separately; (6) KR-ZERO's original classifications remain provenance fields, not newly inferred labels; (7) no empirical result promoted to a population-level theorem"
defines:
  - "𝒟_REP={(D_i,Q_i,R_{5,i},R_{4,i},R_{3,i},R_{2,i},R_{1,i},C_{1..5},O_{1..5})}_{i=1}^N — the frozen dataset contract"
refines:
  - "M0201/M0202's audit specification: catches and fixes the |N|-vs-|N_n| denominator inconsistency, freezes the contract into 7 explicit invariants"
contradicts:
  - "The prior formulas' implicit use of |N| for level metrics, corrected to N_n"
repeats:
