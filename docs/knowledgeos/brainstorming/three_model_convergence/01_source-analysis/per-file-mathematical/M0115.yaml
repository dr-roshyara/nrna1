about: >
  Declares "Hilbert space is NOT adopted as a foundational framework for KnowledgeOS," summarizing
  KR-HILBERT-2026-09's result: "Hilbert space supplies a well-defined joint object (the spectrum)
  and a vocabulary for stating what is missing -- and otherwise reproduces the existing obstructions
  in new coordinates rather than removing them... partially confirmed in the weakest sense... a
  useful vocabulary, not a solution."

  **PRESENTS THE FULL HYPOTHESIS-BY-HYPOTHESIS VERDICT TABLE**, with mechanism detail not previously
  this fully consolidated in this reconstruction's record: H1 (K_t as vector) REFUTED -- "Unknown,
  Absent, NotAssessed, Contradiction collapse onto zero vector" (a specific, concrete failure
  mechanism -- all four distinct epistemic-boundary conditions map to the SAME zero vector, a direct
  Hilbert-space analogue of the corpus's already-tracked 9-situations-collapse-to-U pattern); H3
  (orthogonality=independence) REFUTED via the X~Uniform{-1,0,1}/Y=1[X=0] witness (Cov=0,
  deterministic dependence); H6 (amplitude=probability=truth) REFUTED because "truth is not in the
  domain of the representation" -- explicitly connecting the Hilbert-space finding to the corpus's
  established DEF-1/Gamma-domain factivity problem (M0111 Phase 2), a genuine cross-thread
  convergence; H7 (spectral functional=N_eff) REFUTED (all four functionals fail on
  equicorrelation); H8 (Hilbert distance=semantic equivalence) REFUTED (transitivity fails via the
  sorites construction); H9 (basis invariance) PARTIALLY CONFIRMED (rotation-invariant, not
  rescaling-invariant); H12 (genuine reduction) REFUTED -- "no reduction on any question tested,"
  the most sweeping single verdict in the table.

  **DELIVERS "CAN DO" / "CANNOT DO" SYNTHESIS TABLES**: can represent block/duplicate structure
  exactly, supply a well-defined joint object (the spectrum), rotation-invariant summaries, a
  similarity geometry, second-moment dependence, a Born-rule probability measure, and a vocabulary
  for the gap; cannot represent equicorrelation's contribution to multiplicity burden (up to 50x
  under), the tail behavior governing the burden, rescaling invariance, a valid semantic
  equivalence relation, probabilistic independence, truth/factivity/the Gamma-domain problem, or
  Unknown/Absent/NotAssessed/Contradiction as distinct states.

  **PRESENTS THE DECISION TABLE WITH ONE NEW PRECISION NOT PREVIOUSLY RECORDED**: "orthogonality as
  independence -- REJECTED -- only under Gaussian restriction" -- i.e. explicitly notes the
  orthogonality-independence correspondence is not universally false but holds ONLY under a
  Gaussian assumption, a sharper qualification than a blanket rejection.

  **SIGNIFICANT INTERNAL SELF-CONTRADICTION, FLAGGED NOT RESOLVED**: Part 3.2 explicitly states
  "what is NOT frozen: 'The answer lies between them'" -- correctly honoring M0111's explicit
  withdrawal of that exact claim (recorded there as withdrawn from both the working document and
  the frozen register itself, "the worst possible destination for an unearned claim," because
  'between' presupposes a formally defined ordering on candidate functionals and a proof that the
  sought functional lies in that interval, and neither exists). YET Part 2.3 of THIS SAME DOCUMENT,
  titled "The Deepest Finding," states without qualification: "the two natural routes bracket the
  truth from opposite sides... the measured family-level burden lies between them and is captured
  by neither" -- and Part 5.2's "Final Statement" repeats it as "the experiment's most valuable
  finding," boxed as a headline claim: "The two natural routes bracket the truth from opposite
  sides." Neither restatement carries M0111's required caveat about the missing ordering/proof.
  This is either (a) a permissible looser use of 'lies between' as an informal, non-mathematical
  description of the bracketing pattern (pairwise overestimates, spectral underestimates, measured
  value in between) that Part 3.2's stricter formal-freeze language correctly withholds from
  canonization, or (b) a genuine drift back toward the exact overclaim M0111 worked to excise --
  left unresolved for the eventual reclassification pass, consistent with this reconstruction's
  standing discipline of flagging rather than silently adjudicating such tensions.

  **RECONFIRMS ALL CONSEQUENCES ALREADY ESTABLISHED**: Theory v1.2 unchanged; FR-001 strengthened
  (not reopened) by "a second failed route from the opposite direction"; Kernel unchanged, still
  NOT SELECTABLE; N_eff remains off the critical path; the new research question for future work
  restated verbatim from M0108/M0111 (does P(M_n<=x) depend on joint-dependence information beyond
  the spectrum; the decisive check is whether two covariance structures share a spectrum but differ
  in extreme-value behavior). Closes with the explicit sequencing confirmation: "Next: KR-CONTR-
  2026-09," directly linking this closure to M0114's protocol.
