title: "Knowledge as an epistemic probability space: formalizes M0275's KR-STATE-02 hypothesis into K_t≡(Ω_E,𝓕,P_t,𝓗_t) — a measure-space-like structure where knowledge is a DISTRIBUTION over possible epistemic configurations, not a single configuration — resolving the multidimensionality-vs-probability tension ('dimensions describe the state space; probability describes uncertainty over that space'), giving a precise three-way non-conflation (P(x)=0 ≠ Determine(x)=∅ ≠ x=∅), reconnecting to Nīlakaṇṭha (P(effect)→0 while P(trace)>0), and introducing 'epistemacy' as a guardrail preventing probability from becoming the whole KnowledgeOS kernel"
