  - "M0151's ASK[α,e]=YES⟺e⊨Kα → Sat(K_t,r) mapping: explicitly rejected as ASK≠Sat_c; ASK is reclassified as ASK_S(K,α)→QueryResult, 'one input into evaluation', not evaluation itself"
  - "M0151's TELL[α,e]→'adding requirements to ℛ_t' mapping: explicitly rejected as a TYPE ERROR — 'Requirements and knowledge are different types' — TELL is reclassified as an epistemic-state update operation, TELL_S(K,α)→K', distinct from ℛ_t→ℛ_{t+1}"
  - "M0151's Only-Knowing→Zero claim (the most complete external Zero candidate flagged at M0151): explicitly downgraded to OnlyKnowing→Zero-candidate, NOT OnlyKnowing=Zero — 'Only-knowing can provide a formal model for one aspect of epistemic completeness, but Zero is broader'"
  - "M0151's noted structural convergence between the four-valued B operator and this corpus's own FDE apparatus: here made explicit and firmly bounded — 'Four-valued belief ≠ Contr' and 'B/N ≠ Zero' remain intact, reaffirming (not merely noting) the already-established KR-CONTR-FDE finding that four values are insufficient"
