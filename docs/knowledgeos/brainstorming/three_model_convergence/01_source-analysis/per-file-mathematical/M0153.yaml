about: >
  RESOLVES M0151's flagged bridge_candidate: this is the adjudication review of the Levesque &
  Lakemeyer "Logic of Knowledge Bases" extraction, following the same disciplined pattern as every
  other extraction→adjudication pair in this sub-thread. Downgrades ASK=Sat_c, TELL=requirement-
  addition, Only-Knowing=Zero, and four-valued-belief=Contr from 'established' to
  'candidate/supporting evidence', while confirming Explicit/Derived representation, Query≠
  Evaluation≠Determination, and successor-state/persistence as genuine contributions.
introduces:
  - "Query≠Evaluation≠Determination: a clean three-way separation not previously stated this precisely — 'Does K entail p?' (query) vs. 'Should p receive Standing=positive?' (evaluation) vs. 'Should p become a determination?' (determination)"
  - "ExistentialKnowledge≠IdentifiedInstanceKnowledge — the corrected KnowledgeOS value of the de dicto/de re distinction, reframed from M0151's rejected 'requirement satisfaction' mapping to Identity/Grounding research (example: knowing a PostgreSQL-using service exists ≠ knowing WHICH service does)"
  - "KnowGap(K,π) as a candidate refinement of Zero: a system may have Gap(K,π)≠∅ without knowing the gap exists — Zero is therefore NOT simply Gap=∅ but potentially BoundaryKnown(K,π)∧NoUnrepresentedRequiredDistinction(K,π), explicitly flagged as a research hypothesis, not adopted"
  - "K|_π (subject-matter epistemic projection) explicitly distinguished from the corpus's own canonical structural projection π_K(K_t): 'our canonical projection was a structural projection; K|_π is a subject-matter epistemic restriction. We should not conflate them.' — a precise disambiguation of two similarly-named but distinct projection concepts"
  - "Full FR (Formal Representation & Reasoning) candidate theory layer, FR.1-FR.10: Explicit Representation, Derived Representation (Cn_S), Query (ASK_S), Update (TELL_S), Subject-Matter Projection (K|_π), Epistemic Boundary, Representation Reduction (ρ_S with adequacy conditions), Bounded Reasoning (AvailableDerivation⊆LogicalClosure), Reasoning Complexity, Action-Conditioned Knowledge (Succ_S candidate, explicitly 'not yet the final δ')"
  - "A four-way convergence naming Gödel(derivability)→Williamson(accessibility)→Shieber(process/basing)→Levesque(explicit/implicit/bounded reasoning) as jointly filling Derivable_S(p)/Accessible_S(p)/ExplicitlyRepresented(p)/Determined(p) — a structured four-predicate research space"
  - "A full seven-source convergence table (§26): Plato (knowledge/reality distinction), Davidson (interpretation/triangulation/truth), Williamson (factivity/accessibility/limits), Gödel (derivability/formal boundaries/meta-level), Description Logic (structured representation/subsumption/consistency), Shieber (basing/process reliability/evidence lineage), Levesque/Lakemeyer (explicit/implicit reasoning, ASK/TELL, bounded belief, subject-matter boundary, successor-state reasoning) — CONFIRMING Plato and Davidson as genuine sources in this reading programme, still unlocated as separate extracted documents anywhere in this reconstruction's read order"
  - "Recommended experiment KR-LL-2026-09 with 14 concrete test cases (E1-E14) spanning explicit/derivable/unrepresented propositions, de dicto/de re existential knowledge, contradictory explicit beliefs, three distinct reasons for Unknown (no-information/reasoning-system-cannot-derive/subject-matter-outside-boundary), TELL-then-reasoning, action effects on fluents (change vs. persistence, representation vs. truth), and cross-reasoning-system comparison"
