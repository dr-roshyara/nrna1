mathematical_content: >
  States the full situation-calculus foundational axioms (unique names, second-order induction,
  subhistory), effect-axiom normal forms and the causal-completeness/explanation-closure axioms
  underlying the successor-state-axiom derivation, the Regression Theorem, the Do-macro definitions
