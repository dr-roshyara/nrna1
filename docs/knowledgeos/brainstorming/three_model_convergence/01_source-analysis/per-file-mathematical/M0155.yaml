about: >
  The full extraction underlying both M0145 (review) and M0146 (formal derivation), giving the
  situation calculus's complete formal apparatus. Introduces two mechanisms not covered in either
  M0145 or M0146's summaries: Reactive Golog (RGolog) condition-action interrupts with DoR semantics,
  and stGolog stochastic actions with Markov-Decision-Process value functions.
introduces:
  - "Reactive Golog (RGolog): condition-action rules φ→α compiled to (πx)[φ(x)?;α(x)], with an n-rule interrupt procedure and DoR semantics interleaving program execution with rule-triggered interrupts/exogenous actions — genuinely new content not present in M0145's or M0146's own summaries of this source"
  - "stGolog stochastic actions and MDP apparatus in full: choice(β,a) abbreviating nature's stochastic outcomes, prob(a,β,s) as a probability-of-outcome predicate, stDo as the stochastic program-execution relation, probF(ψ,γ) as sentence probability via summation over (probability,situation) pairs, value(do(a,σ))=value(σ)+reward(a,σ)-cost(a,σ), and eValue(γ) as expected value over initial-state distribution and stochastic execution — the full formal detail behind M0145's brief 'probability and MDPs should NOT be theory-core' recommendation"
  - "The Precondition Interaction Problem for concurrent actions: Poss(startMoveLeft,s)≡¬movingLeft(s) and Poss(startMoveRight,s)≡¬movingRight(s) can each individually hold while their conjunction (concurrent execution) should be impossible — 'the converse of the foundational axiom need not hold' — a subtlety not mentioned in M0145/M0146's concurrency coverage"
  - "The Natural-World Assumption (all actions are natural) with a determinism theorem: executable(do(c,s))∧executable(do(c',s))∧NWA⊃c=c' — natural-world evolution is provably deterministic"
  - "Progression's formal definition and its key limitation theorem: progression is NOT always first-order definable; finite progression is SECOND-ORDER definable — a precision not present in M0145/M0146's informal progression discussion"
