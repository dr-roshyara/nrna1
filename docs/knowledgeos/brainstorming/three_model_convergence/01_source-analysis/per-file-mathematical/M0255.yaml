about: >
  The opening document of an apparently new, structurally distinct 15-document consolidated theory
  series ("Document 01 of 15," dated 2026-09-04, explicitly "Theory v1.2 FROZEN · kernel NOT
  SELECTED"). Unlike the discursive review-chain documents of M0235-M0254, this is a terse, tightly
  scoped formal reference document using a disciplined per-statement epistemic tagging convention
  ([DEF]/[EXP]/[REC]/[OPEN]) throughout. It fixes the six primitive objects and one operator
  underlying the whole theory, gives final clean forms of the three canonical predicates with an
  explicit proof that they are three distinct quantities over three distinct index sets, introduces
  a new FR-003 anti-circularity candidate rule with two concrete worked failure cases from
  KR-BRIDGE-02, and explicitly reiterates that KnowledgeOS still lacks a declared mathematical
  carrier — the single most load-bearing open problem named in the whole series.
introduces:
  - "Six primitive objects + one operator, given exact signatures: D (data/case, a finite multiset of records r); T (transformation, T:𝒟→ℛ); R (representation, R=T(D), derived not primitive); Q (inquiry, Q:𝒟→Y); Π (observable, Π:ℛ→O); O (decoder, O:ℛ→Y); C (constraint, a predicate on R) — with E_S (elimination) as the one operator"
  - "The tested experimental record schema r=(value,source,tag,timestamp), optionally a derived rank — explicitly flagged [DEF] AND immediately disclaimed: 'this is an experimental carrier and is NOT declared to be the mathematical carrier of KnowledgeOS'"
  - "The inquiry frame Π_frame=(Q,C,O) — 'what is asked, what must hold, how the answer is decoded' — with the decoder O explicitly FIXED IN ADVANCE, never chosen after seeing R: 'choosing O post hoc converts realization into curve-fitting'"
  - "A rigorously TYPED elimination operator: E_S(R) = the representation obtained by removing S AND RE-ESTABLISHING the level's invariants — with an explicit [EXP] warning that naive set subtraction D\\S is INVALID wherever a field is relative (e.g. within-group rank), since it 'leaves stale ranks and silently produces a representation that the level's own rules forbid' — [REC]: 'every elimination operator must declare the level it acts at. An untyped E_S is a defect, not a simplification'"
  - "Final clean forms of the three canonical predicates: Zero_{T,Π}(S;D)⟺Π(T(D))=Π(T(E_S(D))); Adequate(T,Q)⟺Ĥ(Q|T(D))=0; Realized(T,Q,O)⟺O(T(D))=Q(D) — with an explicit index-set argument for their non-identity: Zero is indexed by (T,Π) AND the subset S; Adequacy by (T,Q) AND the population; Realization by (T,Q,O) AND the case — 'they are not three readings of one quantity. They are three quantities over three different index sets'"
  - "A NEW anti-circularity requirement, candidate FR-003: Π and Q must read DISJOINT fields, and disjointness must be discharged on the TRIPLE (Π,Q,T), not merely the pair (Π,Q) — because Π reads T(D), not D, and T can derive an output field from sources Π never declared, so a pairwise-disjoint declaration can still hide an effective shared read"
  - "Two concrete worked failure cases from KR-BRIDGE-02 motivating FR-003: (1) rank=f(value,tag) because T_D ranks within tag group ⟹ Π falling back to rank effectively reads {value,tag} ⟹ if Q reads {source,tag}, they SHARE tag despite a declared disjoint pair; (2) dedup selects survivors by value ⟹ surviving source/tag/time columns depend on value ⟹ record COUNT depends on value ⟹ even Π_arity, which declares NO field reads at all, effectively reads {value}"
  - "A sharp methodological principle: 'Declaration is not verification. Two hand-written provenance maps were wrong; a perturbation test caught both, code review caught neither. The effective read-set must be COMPUTED through T's provenance and VERIFIED empirically' — [REC]: promote to FR-003 once a second independent adopter exists (citing this repository's own governance standard ES-006.1)"
  - "An explicit, maximally load-bearing [OPEN] declaration: 'KnowledgeOS has no declared mathematical carrier. Every experiment used a deliberately small numerical carrier so that fibers would collide and adequacy would be measurable. That is a calibration choice, not an ontological one' — with a table explicitly disclaiming that the tested carrier (value/source/tag/time, |D|≤6, 4-8 distinct values, argmax/tag-counts/deciles) IS a knowledge representation, a value domain, or business inquiries — 'the move from this to documents, claims, entities, relations, provenance, contradictions, temporal states and evidence is the open research problem. No result in this set should be quoted without its carrier'"
  - "A final consolidated 4-rule TYPE DISCIPLINE table: E_S level-declaration+invariant-reestablishment ([DEF]+[EXP]); Π/Q read-disjointness on the triple, empirically verified ([EXP], candidate FR-003); O fixed before R is seen ([DEF]); transformation family strictly sequential (R_{k+1}=T_k(R_k)) OR parallel (R_k=T_k(D)), never silently mixed ([EXP], load-bearing because 'document 04 shows the DPI applies to one and not the other')"
