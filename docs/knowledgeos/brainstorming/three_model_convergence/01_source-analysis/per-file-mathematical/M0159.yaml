about: >
  The first fully formal specification of ℛ_req anywhere in this reconstruction's read order — one
  of the longest-tracked OPEN/DECISION-REQUIRED items across the entire corpus (named OPEN or
  [DECISION REQUIRED] in nearly every decision-register table since M0135/M0137/M0140). Models
  distinctions as equivalence relations on the state space S, gives a nine-item catalogued inventory
  across four categories, a comparison matrix against Classical/K3-L3/FDE logics, a dependency map,
  two concrete formal verification tests, and a three-tier priority ranking (P1/P2/P3).
introduces:
  - "Formal machinery: a distinction d is an equivalence relation ~_d on state space S; ℛ_req={d_1,...,d_k}; a knowledge representation language 𝒦 with encoding ℰ:S→𝒦 PRESERVES d iff ∀s1,s2: s1≁_d s2 ⟹ ℰ(s1)≠ℰ(s2), and COLLAPSES d otherwise; a transformation π:𝒦→𝒦' is ℛ_req-ADEQUATE iff it preserves every d∈ℛ_req"
  - "A nine-distinction catalogued inventory across four categories: (1.1) Knowledge Status (KnownTrue/KnownFalse/Unknown/Contradictory/Underdetermined/NotAssessed, FDE double-powerset semantics V(φ)⊆{T,F}), (1.2) Justification Mode (Evidenced/Inferred/Reported/Assumed, formalized as ⟨φ,J,m⟩ with J a proof/justification graph), (1.3) Intensional vs. Extensional Identity, (2.1) Currency & Validity (Current/Stale/Expired/Historical, with t_now/t_valid-window/t_ttl), (2.2) Allen Interval Temporal Relations (the full 13-relation algebra), (3.1) Evidence Directionality (Supporting/Refuting/Neutral/Dual, formalized as signed weight W:E×H→[-1,1]), (3.2) Absence-of-Evidence vs. Evidence-of-Absence (formalized as ¬Kφ vs. K¬φ with explicit KB-membership conditions), (4.1) Resolution Status (Resolved/Unresolved/InProgress/Irresolvable), (4.2) Boundary & Scope (InScope/OutOfScope/ConditionalScope)"
  - "A structural comparison matrix (§3) showing, per distinction, whether Classical FOL / K3-L3 / 4-valued FDE / KnowledgeOS's ℛ_req preserve or collapse it — explicitly showing that even FDE (which preserves Contradiction-vs-Unknown) COLLAPSES Absence-of-Evidence-vs-Evidence-of-Absence, Justification-Source, Temporal-Currency, and Intensional-vs-Extensional-Identity, while ℛ_req preserves all five — the single clearest, most systematic statement in this reconstruction's read order of exactly what distinguishes ℛ_req's ambition from every prior logic examined (Classical, K3/L3, FDE)"
  - "A distinction dependency map (§4): Epistemic Status (1.1) is the root dependency for Justification (1.2) and Evidential Direction (3.1); Absence-of-Evidence (3.2) requires Knowledge Status (1.1) to evaluate open-world assumptions; Resolution Status (4.1) depends on detecting a Contradiction state in Epistemic Status (1.1)"
  - "Two concrete, executable formal verification criteria (§5): the SEPARATION TEST (for every pair of distinct values in any d∈ℛ_req, construct minimal test states s_i,s_j; verification FAILS if π(ℰ(s_i))=π(ℰ(s_j))) and the ROUND-TRIP TRANSFORMATION TEST (for projection f and reconstruction g, ∀d∈ℛ_req: s ~_d (g∘f)(s) must hold)"
  - "A three-tier priority ranking: P1 Core Invariants (Epistemic Status, Justification Mode, Currency, Absence-vs-Evidence-of-Absence — 'must be preserved by ALL core kernels and projections'), P2 Required (Allen Relations, Resolution Status, Scope Boundary, Intensional Identity — 'must be supported natively by the top-level KR language'), P3 Extended Domain-Specific (deontic/normative Can-vs-Should distinctions, fine-grained probability distributions)"
defines:
  - "ℛ_req itself, formally, for the first time in this reconstruction's read order — prior documents (M0135, M0137, M0140, M0142, M0148 etc.) uniformly listed ℛ_req as OPEN/[DECISION REQUIRED] without ever giving it this level of concrete formal shape"
refines:
  - "The frozen four-factor FDE evaluation representation and the KR-CONTR-FDE research (M0116-M0127, M0137): explicitly cited as evidence for distinction 1.1 (Knowledge Status) — 'Demonstrated by KR-CONTR-FDE-2026-09. Classical logic collapses Contradictory to explosive falsity; 3-valued logics collapse Contradictory and Underdetermined into a single Undefined state' — showing GOOD cross-thread awareness of the corpus's own completed research, unlike the desynchronization flagged at M0146/M0147"
  - "Gap Theory v1.0 (M0132): explicitly cited as evidence for distinction 1.2 (Justification Mode, 'Required by Gap Theory v1.0 Class G3: Lineage/Justification Gap') and distinction 4.1 (Resolution Status, 'Gap Theory v1.0 Class G7: Unresolved Contradiction Gap') — direct, correctly-attributed cross-referencing of the corpus's own frozen gap-class register"
  - "The Zero anti-reification family (Unknown≠Absent, NoEvidence≠EvidenceOfAbsence, tracked since early in this reconstruction): given its most formal statement yet as distinction 3.2, explicitly cited to a 'Zero Lens Specification (Non-collapse Invariant #3)' — naming a specific numbered invariant not otherwise located as a standalone document in this reconstruction's read order"
