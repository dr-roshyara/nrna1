about: >
  Document 13 of the consolidated theory series (self-described here as "this thirteen-document
  set," in apparent tension with Document 01's "Document 01 of 15" header). Consolidates every
  remaining open question into a dependency-ordered roadmap, gives an explicit "what NOT to do
  next" table, and delivers two major definitive closing verdicts: the entire KR-ALGEBRA/Vedic-
  Contribution research thread (M0245-M0254) is declared negative and not worth pursuing further,
  and the Gita interpretive strand's five-cycle track record is given its final, conclusive
  assessment.
introduces:
  - "Seven open questions in explicit dependency/priority order: OQ-1 The carrier [OPEN], blocks everything tactical, no experiment can decide it, governance decision required, informed by not derived from the experiments; OQ-2 DECISION-02 [OPEN], blocks the composition rule and δ transition, also decides which bounded context owns φ; OQ-3 The transfer problem [OPEN] — 'the largest scientific risk in the programme: every result could be an artifact of small numeric multisets,' one non-synthetic-carrier reproduction experiment would close it, not attempted; OQ-4 Adequacy vs Realization actually exhibited [OPEN], 'the highest-value experiment available'; OQ-5 the 67 dead cells [OPEN], requires a (T,Q) design change (transformations that partially preserve Q), not a sampling change; OQ-6 (NEW): 'does the eliminability ladder reach k>3?' [OPEN] — k=3 demonstrated only for n≤6, an explicitly acknowledged design bound, not a property of eliminability itself; OQ-7 a valid interval for Ĥ [OPEN], requires fiber-structure-level resampling, not attempted"
  - "A restatement of the two standing conjectures (no-bridge for read-disjoint (Π,Q); Realization⟹Adequacy) with their refutation conditions, explicitly: 'neither may be cited as established'"
  - "An explicit 'what NOT to do next' table with seven prohibitions, each with a stated reason — most significantly a DEFINITIVE CLOSING VERDICT on the entire KR-ALGEBRA/Vedic-Contribution thread (M0245-M0254): 'do not move to a new algebra or a Vedic-derived operator — the algebra results were negative; there is nothing to build on yet' — the first explicit, unambiguous closure statement for that entire research direction in this corpus"
  - "The remaining six 'what NOT to do' items: do not tune the generator further (the one working lever, record count, is exhausted at n_rec=6, two others do nothing); do not widen the Π×Q grid (two-thirds of cells uninformative for reasons sampling cannot touch); do not declare a 'no-bridge law' (three experiments, one carrier family, 31/112 cells searchable); do not promote any [EXP] to [THM] ('a theorem needs a proof, not more evidence — this is the specific failure the status rule exists to prevent'); do not test the Gītā strand for kernel candidacy (the candidacy question is answered, §6); do not open Theory v1.3 (adjudication has not happened per the governance order)"
  - "A recommended 7-step forward order: (1) OQ-1 carrier decision — governance, not research; (2) OQ-2 DECISION-02 adjudication — governance, not research; (3) OQ-4 exhibit Adequacy≠Realization — the highest-value experiment; (4) OQ-3 one transfer experiment — the largest scientific risk; (5) OQ-5 partially-preserving (T,Q) designs — unblocks the dead cells; (6) FR-003 second adopter (ES-006.1); (7) ADJUDICATION→Theory v1.3 — with the explicit summary: 'the programme's constraint is no longer experimental capacity; it is that two decisions have not been made'"
  - "THE FINAL, DEFINITIVE VERDICT on the entire Gita interpretive strand tracked throughout the corpus, given after five full cycles (contradiction, elimination, reduction, audit, bridge): 'in NONE did it produce a kernel primitive, and in each it produced a question already answerable by experiment... the lens has been consistently useful for framing and consistently empty of machinery. It has never once been the source of a result, and after five cycles that is evidence, not an accident' — with the recommendation: 'keep the strand, keep it external, and stop testing it for kernel candidacy. Its role is naming what an experiment already earned, and naming is enough'"
  - "The final honest standing-position statement closing the document: 'Theory v1.2 remains FROZEN. The kernel remains NOT SELECTED. No algebra is declared. No carrier is declared. Nothing in this thirteen-document set is adjudicated. The set exists so that adjudication is now possible — every claim, its status, its scope and its refutation condition are in one place'"
  - "A self-description of the series as 'this thirteen-document set,' which conflicts numerically with Document 01's header ('Document 01 of 15') — an internal inconsistency in the series' own self-count, worth flagging for the eventual global-reclassification pass"
