about: >
  A steering/methodology document (advice to "tell Claude" how to continue the KR-SIM lane's own
  internal reading pass at its checkpoint 0098), arguing explicitly AGAINST premature consolidation:
  "the proliferation itself is now becoming a research finding, rather than a problem to immediately
  repair." At this point the lane's OWN internal corpus has already reshaped its anchor eight times
  and produced nine unreconciled candidate-ID schemes, with canonical kernel status still "not yet
  established" and maturity <=3 -- explicitly framed as "exactly what we should expect during
  discovery," not evidence of failure.

  **DELIVERS A SIX-WAY RELATIONSHIP TAXONOMY** for classifying any new candidate against existing
  ones, more granular than this reconstruction's own introduces/defines/refines/contradicts/repeats
  fields: (1) New concept (genuinely new semantic entity); (2) New representation (same candidate,
  different expression); (3) New decomposition (same candidate, different components); (4)
  Refinement (existing concept, added semantics); (5) Genuine contradiction (cannot both hold); (6)
  **Unresolved equivalence** (two formulations MIGHT be the same thing, equivalence not yet
  established) -- explicitly instructed to be recorded as its own relationship type
  (`type: unresolved_equivalence`, `equivalence_status: unproven`) RATHER THAN merging into a new
  canonical concept. "Never merge candidate IDs merely because they appear semantically related."

  **DELIVERS THE phi_ij TRANSFORMATION-EQUIVALENCE FRAMING**: given competing representations
  R_1(K),...,R_n(K) of a candidate kernel K, ask whether there exists a structure-preserving
  transformation phi_ij: R_i -> R_j such that phi_ij(R_i(K)) ≅ R_j(K); if so, the different "kernels"
  are not competing theories but different coordinate systems / representations of ONE underlying
  structure -- explicitly framed as "a much more powerful result than simply selecting the best six
  dimensions."

  **DELIVERS THE EXPLICIT CROSS-MODEL CONVERGENCE STATEMENT**: K_t in a space 𝒦 with candidate
  representations R_DDD(K_t), R_Gita(K_t), R_math(K_t), and potentially R_engineering(K_t); "the
  convergence question becomes R_DDD(K_t) ~ R_Gita(K_t) ~ R_math(K_t), where '~' must eventually mean
  demonstrable structural equivalence or a precisely bounded correspondence, NOT 'sounds similar.'"
  This is, almost verbatim, THIS RECONSTRUCTION'S OWN stated mandate (three-model convergence,
  circular-validation forbidden, resemblance != identity) -- delivered from inside the KR-SIM lane's
  own methodology, independently, on 2026-09-01, i.e. before or concurrently with this reconstruction
  project's own formation. A strong bridge candidate: the SAME convergence question, independently
  and precisely formulated, from a different vantage point within the same overall research effort.
