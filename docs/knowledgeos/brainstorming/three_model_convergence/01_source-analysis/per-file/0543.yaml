tier2_reason: "LANDMARK sharpening of the corpus's evidence-identity theory delivering a formally rigorous four-relation system (Identity/Semantic-equivalence/Observation-equivalence/Dependency) worked through seven fully concrete test cases, including a genuinely novel and practically consequential distinction — DERIVATION_CONFLICT, separating interpretation disagreement about a single source from contradiction between genuinely independent observations, not previously present anywhere in the corpus's Conflict theory. Also delivers the CommonCause≠SameObservation≠AutomaticDependence nuance extending the prior file's common-ancestry finding, a non-enum multi-relational representation of evidence relationships replacing a single mutually-exclusive category scheme, a three-tier computability classification for evidence relations, and a Fact-about-provenance vs. Inference-about-provenance architectural principle — collectively the corpus's most concrete and implementation-ready treatment yet of what it actually means for two pieces of evidence to be 'the same.'"
