defines:
  - concept: "InformationGain≠TruthGain"
    definition: "A reduction in entropy (increased confidence/certainty) can occur from bad or misleading evidence just as readily as from genuine evidence — InformationGain>0 never by itself implies the system's belief has moved closer to the truth"
  - concept: "Q(E)=(q_r,q_f,q_i,q_d,q_c) — the typed evidence quality vector"
    definition: "Evidence quality is represented as a vector of reliability, freshness, independence, directness, and completeness dimensions, explicitly proposition-relative (Q(E,p)), rather than a single scalar whose meaning would otherwise be ambiguous"
  - concept: "EpistemicQuality as a partial order"
    definition: "Because epistemic quality EQ(C) is multidimensional, two knowledge states can be genuinely incomparable (K_A∥K_B) when neither Pareto-dominates the other across all relevant dimensions — forcing a single scalar comparison would misrepresent this structure"
  - concept: "InformationValue is decision-contextual"
    definition: "The practical value of a given piece of information depends on which bounded context/use case is consuming it — high information gain can have zero decision value if no active decision depends on the affected proposition, while a small information gain can have high decision value if it crosses a decision threshold; information gain is never a universal business metric"
  - concept: "The anti-circular-self-validation caution"
    definition: "An AI or statistical model's calibration must be assessed against externally grounded, independent outcomes rather than the model's own generated outcomes, to avoid a circular AI→AI-evaluation→AI-confidence loop that would produce spurious self-confirmation"
