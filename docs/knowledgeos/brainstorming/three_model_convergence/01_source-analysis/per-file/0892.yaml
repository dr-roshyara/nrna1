defines:
  - concept: "Dependent sum type formalization of the proposition space"
    definition: "𝒫=Σ_{E∈ℰ}Σ_{D∈𝒟}V_D, i.e. the proposition space is not the unrestricted Cartesian product ℰ×𝒟×𝒱 but a dependent sum (Sigma type) where, for each entity E and dimension D, only values v drawn from that dimension's specific admissible value space V_D are permitted. This is mathematically stronger than an unrestricted product because it encodes, directly in the type, that not every value is valid for every dimension (e.g. (Nexus,SecurityStatus,3.69) is ill-typed since 3.69∉V_SecurityStatus={Compliant,NonCompliant,Unknown}), making well-formedness WF:𝒫→{true,false} a decidable structural predicate rather than a post-hoc validation rule"
  - concept: "Corpus definition exists vs. Corpus definition is mathematically valid"
    definition: "A methodological distinction requiring that the mere presence of a definition or classification within the prior corpus (e.g. Q14's classification of Version as an Interval-scale dimension) must not be treated as automatically mathematically correct. The corpus's historical existence of a claim is one (weaker) epistemic status; its independent mathematical validation is a separate (stronger) status that must be checked, not assumed -- concretely demonstrated by finding Q14's Interval classification of version numbers indefensible (3.69−3.68 is not a meaningful magnitude) and proposing Ordinal instead"
