    refinement: "Recast into a measure-theoretic framework: each dimension becomes a named measure (mu_C, mu_E, mu_K, mu_R, mu_U) or a measure-derived quantity (Q_K, Gap, Alignment, Utility), giving the prior ad hoc formulas a unifying mathematical structure (measurable spaces and integration) rather than a list of separate metrics"
  - concept: "0324's Flux(t)=d(K_t,K_t+dt)/dt discrete 'Knowledge Flux' formula"
    refinement: "Superseded by a continuous epistemic flow field J_A(x,t) and a full continuity-equation-style research model, richer than the discrete-distance version"
  - concept: "The corpus's long-standing 'orientation toward the infinite Knowledge Space' / 'serve the nature of the Knowledge Space' intuition (tracked since 0324's three proxies)"
    refinement: "Given its most mathematically precise treatment yet: convergence-under-refinement / projection coherence under restriction, explicitly proposed as one of the best interpretations found so far"
  - concept: "The corpus's topological lens (tracked across multiple prior files) and its boundary concept"
    refinement: "Given explicit measure-theoretic formulas for the first time: internal knowledge K(B), boundary interaction K(partial B), cross-boundary flow J_{partial B}, and a derived topic-openness ratio"
