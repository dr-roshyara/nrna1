title: "Step 243 -- Formal Reduction and Layer Correspondence Test: DELIVERS A RIGOROUS, WELL-EXECUTED NEGATIVE RESULT -- The K8-to-K5 Reduction Is FORMALLY REJECTED (Neither Equivalence Nor Conservative Extension in Either Direction Holds; Action Has No K5 Counterpart at All), Replaced by a Well-Motivated THREE-LAYER TYPED-UNIVERSE ARCHITECTURE Hypothesis (Ontology/Knowledge-State/Transformation-Governance) -- Delivers a Sharp Further Refinement of 0867's Heterogeneous-Kernel Finding: sigma, theta, lambda May Be FUNCTIONS OF G Rather Than Independent Primitives (K5's 'Five Primitives' Proven to Be Only 'Five Named Components,' Independence Unproven) -- Reframes the Entire Reduction Question From '8-to-5?' to 'What Is the Minimal Typed Structure for the Required Semantics?' -- Explicitly Declines a Premature Step 244, Redirecting to Formal-Universe Construction First"
