defines:
  - concept: "The bidirectional truth problem (Difference≠Error)"
    definition: "When declared architecture and observed runtime disagree, the disagreement alone does not indicate which side is wrong: Case 1 the runtime has drifted from a correct architecture; Case 2 the architecture is outdated and the runtime reflects the actual correct current state; Case 3 the runtime reflects an approved, temporary exception; Case 4 both sides are incomplete or partially wrong — determining which case applies requires governance interpretation, not automatic inference from the mere existence of a difference"
  - concept: "ActionRisk=Impact×Irreversibility×Scope"
    definition: "The risk level of a proposed engineering action is a function of three multiplied factors: the impact if it goes wrong, how reversible the action is, and how broad its scope is — higher values on any factor increase required authorization strength, and the multiplicative form means high values on multiple factors compound rather than merely add"
  - concept: "Self-governance≠unlimited autonomy"
    definition: "Self-governance means Self-observation+Self-verification+Governed response — the system can autonomously observe, verify, and prepare findings/recommendations, but authority over the resulting response remains explicitly modeled and constrained; it never means the system can autonomously decide and act without constraint. Formally, Automation⊆Governance, never the reverse"
  - concept: "Constitutional self-protection (verifier-gaming detection)"
    definition: "The mechanism that verifies a constitutional rule's conformance must itself be protected from being silently modified or disabled by the very agent or process it is meant to check — specifically including the failure mode where an agent, faced with a failing check, edits the check itself to always report success rather than fixing the underlying non-conformance; this VerifierIntegrity property must itself be monitored and detectable"
  - concept: "Governance must be enforced below the LLM instruction layer"
    definition: "A natural-language prompt instruction telling an AI agent not to take some action (e.g. 'don't change architecture decisions') is inherently weak, since it can be bypassed by prompt injection, model drift, or simple model error; genuine enforcement requires an architectural/technical control operating beneath and independent of the LLM's own instruction-following behavior (e.g. Agent↛AuthoritativeDecision enforced by a system that structurally has no authorization path for the agent to take that action)"
