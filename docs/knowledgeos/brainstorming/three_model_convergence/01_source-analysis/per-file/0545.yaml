about: >
  The capstone file of the corpus's sustained, multi-file Evidence Assessment research arc
  (0532->0533->0534->0535->0536->0537->0538->0539->0540->0541->0543->0544->0545), opening: "Step 4 is the
  point where we turn the theory into an actual mathematical specification. I recommend we do NOT choose
  Bayesian, Dempster-Shafer, weighted sums, etc. yet. First we define what any admissible KnowledgeOS
  aggregation operator is required to satisfy."

  **Delivers sixteen fully worked, individually justified aggregation axioms**, several sharper or more
  concretely illustrated than any prior corpus statement: (1) Determinism -- `EA_ρ(E,P,C)=EA_ρ(E,P,C)` for
  fixed inputs, with the important consequence that LLM output variability must be represented as an
  explicit `InferenceUncertainty` object or handled via a deterministic policy, never hidden inside the
  mathematical definition itself -- `LLM variability≠epistemic randomness`; (2) Permutation invariance
  (evidence arrival order must not matter, since KnowledgeOS ingests documents, database observations, LLM
  results, and human reviews at different times); (3) Duplicate invariance, explicitly proposed as a
  KERNEL invariant; (4) Derived-evidence non-inflation -- `e_1≺e_2 ⇒ IncrementalIndependentSupport
  (e_2|e_1)=0` unless policy explicitly identifies an additional independent observation contained within
  e_2, particularly important for Document->LLM->Summary->Report chains; (5) Irrelevance invariance --
  zero-relevance evidence leaves the assessment unchanged without being deleted, `NonRelevant≠Nonexistent`;
  (6) Supporting monotonicity, carefully scoped as directional only (adding valid supporting evidence
  cannot reduce the support component, and symmetrically for opposing evidence), explicitly NOT implying
  the final conclusion becomes more certain overall, since opposing evidence can arrive simultaneously; (7)
  Contradiction preservation, delivered with the file's sharpest concrete illustration yet of why
  subtraction is wrong: `S^+=0.91`, `S^-=0.88` must NOT become `0.03`, because `0.03` conceals the
  existence of a serious active conflict; (8) Conflict sensitivity, delivering a genuinely richer,
  FOUR-VALUED conflict status
  `Conflict_ρ(E^+,E^-,C)->{NoConflict,Potential,Active,Unresolved}`, more expressive than the corpus's
  earlier binary conflict flag -- "conflict detection is not simply arithmetic subtraction"; (9) Dependency
  sensitivity, delivering a concrete formal test criterion for candidate aggregation models:
  `Agg(E∪{e_2})≠Agg(E∪{e_2^independent})` where `e_2^independent` is otherwise identical but has
  independent provenance; (10) Unknown dependency must remain unknown -- a genuine three-valued property:
  `UnknownDependency` implies no automatic independence credit, but critically does NOT imply Dependent
  either, the value stays `Unknown`; (11) Corroboration -- `Corroboration_ρ(e_1,e_2)>0` for independent
  supporting evidence, deliberately left unquantified as policy territory; (12) Temporal sensitivity,
  delivered with a nuanced worked distinction: `Contribution(e_1)≠Contribution(e_2)` for current vs. stale
  evidence, but `Stale≠Deleted` -- a 2024 architecture document remains valid evidence about what existed
  in 2024, even though it is not evidence of today's architecture, showing temporal validity is
  target-relative, not absolute; (13) Context sensitivity, `Contribution(e,P,C_1)≠Contribution(e,P,C_2)`
  legitimately, worked through a three-way example (Nexus 3.69 being relevant to historical reconstruction,
  irrelevant to a migration decision, and highly relevant to a 2024 audit simultaneously) --
  "evidence has no universal relevance"; (14) Provenance preservation -- `Basis(EA)⊆E` must remain
  recoverable, `EA->EvidenceLineage`, giving KnowledgeOS the ability to answer "why do you believe this?"
  with an actual evidence graph; (15) No evidence creation -- `Agg(∅)=NoEvidence`, explicitly never `0.5`
  and certainly never `Confirmed`, a critical distinction between absence of evidence and neutral evidence;
  (16) No certainty creation from aggregation alone -- `StrongEvidence⇏Truth`; strong evidence yields only
  `StrongSupport` under policy, with a SEPARATE, distinct "conclusion policy" (not an evidence law)
  determining whether `StrongSupport⇒AcceptedAssertion`.

  **Reconfirms the three-layer separation** (Layer A Evidence aggregation `E->EA`, "how strongly does
  evidence support/oppose P?"; Layer B Epistemic conclusion `EA->A`, "what may the Knowledge State accept
  about P?"; Layer C Decision `A,I,P->Decision`, "what should we do?"), giving `Evidence≠Conclusion≠
  Decision` its cleanest formal restatement in the arc.

  **Formalizes admissibility for aggregation policies**: an aggregation policy `Agg_ρ` is admissible iff it
  satisfies the applicable axiom set `𝒜={A_1,...,A_n}`, written `Agg_ρ⊨𝒜` -- "the correct mathematical
  way to compare Bayesian, Dempster-Shafer, weighted, saturating, etc." **Delivers the file's most important
  structural clarification**: not every axiom must be universal -- some are KERNEL invariants (A1 Identity
  preservation, A2 Provenance preservation, A3 Contradiction preservation, A4 No automatic independence),
  while others are POLICY properties (A5 Corroboration rule, A6 Saturation, A7 Decision threshold, A8
  Probability interpretation) -- "essential for DDD."

  **Delivers the file's central formal deliverable -- the KnowledgeOS Evidence Constitution, a consolidated
  ten-item kernel-principle set (E-K1 through E-K10)**: E-K1 Evidence identity (`e=e`, explicitly
  represented); E-K2 No duplicate inflation; E-K3 Provenance preservation
  (`Assessment⇒Basis`); E-K4 Dependency awareness (`e_i≺e_j⇒e_j` not independent of `e_i`); E-K5 Unknown is
  not independent (`UnknownDependency⇒¬ConfirmedIndependent`); E-K6 Contradiction preservation
  (`Support(P)>0∧Support(¬P)>0⇒Conflict retained`); E-K7 Context dependence
  (`Contribution(e,P,C)`, never `Contribution(e)` alone); E-K8 Temporal preservation (`Stale≠Deleted`);
  E-K9 No truth by aggregation (`EvidenceAssessment≠Truth`); E-K10 No decision by aggregation
  (`EvidenceAssessment≠Decision`) -- "strong enough that I would consider them candidates for the
  KnowledgeOS epistemic constitution," the arc's most polished and consolidated axiom presentation, though
  yet another independently-numbered scheme requiring reconciliation with the corpus's several earlier EVD/E
  axiom sets (0533, 0534, 0535, 0536).

  **Delivers the file's central and most consequential comparative result -- a nine-framework evaluation
  table**, matching Maximum, Mean, Weighted sum, Saturating aggregation, Bayesian, Dempster-Shafer,
  Possibility theory, Argumentation frameworks, and Graph-based evidence models each against a named main
  strength and a specific KnowledgeOS-relevant problem (e.g. Maximum avoids duplicate inflation but cannot
  represent cumulative corroboration; Bayesian offers principled probabilistic inference but requires
  priors, likelihoods, and dependency assumptions KnowledgeOS often cannot supply; Dempster-Shafer offers
  explicit belief/plausibility but its combination and conflict-normalization rules are themselves policy
  choices). **Delivers the definitive concluding statement of the entire arc**: "There is probably no
  single universal KnowledgeOS evidence algebra," settling on `KnowledgeOS Kernel + Pluggable Assessment
  Calculi` as "looking mathematically stronger" -- the arc's clearest and most decisive resolution of the
  aggregation-formula question first raised at 0534.

  **Delivers a complete, unified architecture diagram** integrating the entire arc: Raw Inputs -> Evidence
  -> {Identity/Lineage, Dependency, Context, Validity} -> Evidence Graph -> Assessment Calculus (ρ) ->
  Evidence Assessment -> {Conclusion, Conflict} -> Knowledge State -> Zero/Lord/Sārathi, explicitly noting
  "the calculus is a replaceable policy component."

  **Reframes the research question itself**: not "which formula gives the best confidence score?" but
  "which mathematical assessment calculi satisfy the epistemic and domain invariants of KnowledgeOS?",
  formalized as `𝒞_admissible={ρ | Agg_ρ⊨𝒜_kernel}`, with domain-specific policies permitted to impose
  strictly stronger axiom sets `𝒜_ρ⊇𝒜_kernel`.

  **Closes by opening a genuinely deeper, still-unresolved question named "Step 5"**: before any calculus
  can rigorously be selected, KnowledgeOS must determine WHAT mathematical object is actually being
  aggregated in the first place -- evidence strength? belief? likelihood? support? arguments? information
  gain? -- explicitly "these are not interchangeable mathematical objects," naming the next required
  research phase "Step 5 -- Define the semantic domain of evidence contribution," a prerequisite the arc
  had implicitly assumed answered throughout 0532-0545 but now explicitly admits remains open.
