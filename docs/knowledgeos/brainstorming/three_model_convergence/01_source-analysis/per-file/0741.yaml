defines:
  - concept: "'Prefer allowlists'"
    definition: "When declaring which modules a domain component may depend on, an explicit allowlist (AllowedDependencies) is architecturally safer than an explicit forbidden-list, because any new, previously-unanticipated dependency then fails by default until explicitly permitted (Unknown→FAIL), rather than silently succeeding because it was never named as forbidden (Unknown→implicitly allowed) -- the standard default-deny security principle applied to architecture-dependency governance"
  - concept: "Architecture Graph vs. Knowledge Graph"
    definition: "The Architecture Graph, derived from the Architecture Registry, describes how KnowledgeOS itself is structured (contexts, modules, dependencies, ports, adapters); the Knowledge Graph (the Assurance Graph established at 0716) describes what is known about the engineering subjects KnowledgeOS governs (e.g. Nexus, its decisions, its evidence); the two may eventually coexist but must never be conflated, since one describes the platform and the other describes the world the platform governs"
  - concept: "The Architecture Assurance Pyramid"
    definition: "A four-layer verification stack -- Constitution (what must be true) at the base, Architecture Registry (what we declare) above it, Implementation Conformance (does the code match the registry) above that, and Runtime Behavior (does the running system actually enforce it) at the top -- each layer independently verifiable, together forming the complete architecture assurance model"
