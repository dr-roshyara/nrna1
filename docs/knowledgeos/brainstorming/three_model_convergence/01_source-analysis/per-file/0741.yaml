  - concept: "0716's Assurance Graph"
    refinement: "Precisely distinguished from a newly introduced, separate Architecture Graph describing KnowledgeOS's own module structure rather than the engineering subjects it governs"
  - concept: "0727's/0734's/0737's/0740's graph-rebuildability discipline"
