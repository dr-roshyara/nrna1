defines:
  - concept: "The orthogonal C0-C4 closure vocabulary"
    definition: "A five-level classification for any KnowledgeOS governance construct, explicitly declared to consist of ORTHOGONAL (independently assessable) dimensions rather than a single linear scale, despite the ordinal-looking C0-C4 labeling: C0 (OPEN) means a necessary semantic or mathematical definition is entirely missing; C1 (FORMALLY SPECIFIED) means definitions, types, relations, and invariants have been specified, but executable closure has not been demonstrated; C2 (COMPUTATIONALLY PARAMETRIC) means an executable decision procedure exists for a fully specified parameter set, even though the parameters themselves remain externally or governance-controlled (e.g. a policy evaluator that runs correctly once a specific policy π is supplied, without that meaning the choice of π itself is resolved); C3 (EMPIRICALLY CLOSED) means the formal model has actually been implemented, executed against representative cases, and had its expected invariants experimentally verified; C4 (GOVERNANCE CLOSED) means the organization has formally ratified who may establish, modify, authorize, and retire the governing parameters themselves. A single construct like Policy can simultaneously be C1 (its structure is fully specified), on its way to C2 (an evaluator exists for a fixed policy), while remaining explicitly C4-open (no organization has yet ratified who the root authority actually is) -- this is not treated as a contradiction, only as an honest, granular accounting of exactly what remains to be done"
