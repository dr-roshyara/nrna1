defines:
  - concept: "The five-level theory-implementation gap taxonomy (G0-G4)"
    definition: "A precise, actionable classification for any observed discrepancy between a formal theoretical construct and its actual implementation/observed behavior, used to determine whether the discrepancy reopens theoretical work: G0 (Exact correspondence -- theory and implementation fully agree, no gap); G1 (Implemented but untested -- an implementation exists but there is insufficient evidence to confirm its behavior matches the theory); G2 (Implemented differently -- the implementation exists and has been observed, but its behavior diverges from the formal specification -- this case is genuinely ambiguous and 'may indicate theory or implementation defect,' requiring further investigation rather than an automatic classification); G3 (Not implemented -- the theory defines the construct but no implementation of it currently exists); G4 (Theory underspecified -- exercising the implementation reveals that the theory itself lacks a definition needed to interpret or predict the observed behavior). The decision rule is: G0, G1, and G3 never by themselves indicate a theory defect (they are implementation-status facts, not evidence against the theory); G2 is genuinely inconclusive and must be investigated case by case; only G4 automatically and necessarily reopens theoretical work, since it demonstrates the theory itself, not merely its implementation, is incomplete"
  - concept: "The event-derived Q_t formalization"
    definition: "A precise resolution of how the inquiry register Q_t (selected as the canonical missingness repair at file 0919) relates to the rest of the KnowledgeOS state model: rather than being an independently stored, authoritative piece of state, Q_t is defined as a PROJECTION derived from the history/event log: Q_t=π_Q(Replay(K_0,H_t)), where a proposition p belongs to Q_t exactly when the history H_t contains an Ask(p) event (subject to temporal semantics). This means Q_t is fully determined by, and reconstructible from, the same history H_t that determines K_t itself -- it requires a determinism/replay invariant (identical histories must produce identical Q_t) and a canonical event-serialization schema, but crucially does NOT require adding any new primitive field to the minimal canonical Knowledge State K or the epistemic status Σ. The remaining obligation this creates is purely an engineering one (implementing replay and serialization for InquiryEvent records), not a further theoretical extension"
refines:
  - concept: "0919's unresolved T-3, T-4, and I-2 gap items, and its underspecified Q_t/Σ-unchanged claim"
    refinement: "ALL FOUR DIRECTLY AND DECISIVELY RESOLVED with precise formal analysis: T-3 and T-4 both explicitly closed as non-core-blockers with formal definitions and explicit distinguishing invariants; I-2 resolved via the semantic/implementation dependency separation; and Q_t given a complete, precise event-derived formalization (π_Q(Replay(K_0,H_t))) that 0919 had left as merely 'Σ unchanged' without further specification"
  - concept: "0919's revised six-step roadmap (Step 284=Final Empirical Conformance, Step 285=Canonical Theory Freeze, Step 286=Book Publication)"
