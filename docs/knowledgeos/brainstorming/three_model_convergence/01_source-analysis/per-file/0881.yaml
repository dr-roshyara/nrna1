defines:
  - concept: "The semantically-ill-typed-before-mathematically-ill-typed finding"
    definition: "A meta-level discovery that a proposed mathematical kernel tuple can fail at a deeper level than incomplete formalization: even before asking whether a symbol like C or A in a candidate kernel K=(K,C,T,E,A) has a properly declared mathematical domain and codomain, one must first ask whether the symbol denotes a SINGLE, stable semantic concept at all. The file shows C has been used across the corpus to mean at least four genuinely different things (DDD bounded context, operational context, transition context, evidence context) and A has been used to mean at least four different things (Authority, Assessment, Action, Assertion) -- meaning that any given occurrence of 'K=(K,C,T,E,A)' across different files may not even be referring to the same underlying concepts, regardless of how mathematically precise the tuple notation looks. This directly and retroactively explains much of the recurring difficulty this reconstruction has tracked throughout the kernel-comparison sub-arc (0863-0880), where multiple candidate kernels sharing similar-looking symbols (C, A, T, E) repeatedly turned out not to be directly comparable or reducible to one another -- the underlying problem was, at least in part, a prior semantic-typing failure rather than solely an unresolved mathematical-typing question"
refines:
  - concept: "This reconstruction's own extensive kernel-comparison tracking since 0863 (K8, K230, K230v1, K232v2, K5, and their various component symbols)"
    refinement: "RETROACTIVELY EXPLAINED at a deeper level: the recurring difficulty comparing and reconciling these candidate kernels -- previously attributed mainly to unresolved mathematical questions (typing, equality, closure, minimality) -- is now shown to also stem from a prior, more fundamental semantic-typing failure in the corpus's own use of single-letter symbols like C and A across different files and contexts. Future synthesis work comparing these kernel candidates should first establish semantic-type consistency for each symbol before attempting mathematical reconciliation"
  - concept: "0866's D-15 finding (the deepest contradiction may be semantic, not mathematical -- what type does each symbol denote in each context?) and 0864's Zero/Lord polysemy findings"
    refinement: "DIRECTLY CONFIRMED AND GENERALIZED into a comprehensive, corpus-wide vocabulary audit with a full twenty-nine-term classification, a consolidated sixteen-item non-collapse set, and the crisp semantic-type-discipline rule -- moving from isolated polysemy observations (Zero, Lord, individual symbols) to a systematic DDD methodology applied across the entire corpus vocabulary"
  - concept: "0858's Transformation≠Validation distinction and 0878's/0880's overloaded-Transformation and Reasoning/Assessment≠State-Transition findings"
    refinement: "REAFFIRMED and given a concrete DDD naming remedy: rather than merely noting Transformation's polysemy, this file recommends reserving the word as a mathematical umbrella term only, replacing it operationally with precise DDD names (Assess/Validate/Determine/Revise/Admit/Supersede/Apply-Event/Transition-Knowledge-State)"
