defines:
  - concept: "Correct_internal≠True_world"
    definition: "A system can be internally correct (it faithfully implements its specified model and rules) while its underlying model or assumptions are externally wrong relative to reality (e.g. flawlessly implementing Y=2X when the true relationship is Y=3X); model correctness must separately include assumption validity, empirical validation, and applicability-domain scoping, not merely code correctness"
  - concept: "C_global=C_contract∧C_invariant∧C_provenance∧C_epistemic∧C_context"
    definition: "Global compositional assurance requires five simultaneously satisfied dimensions: interfaces compose (contract), rules remain true (invariant), ancestry remains traceable (provenance), semantic status is not improperly strengthened (epistemic), and meaning remains valid across bounded-context boundaries (context) — a direct extension of the file's own initial four-dimension formula"
  - concept: "Failure containment"
    definition: "A local epistemic failure or component failure should remain local and not silently propagate as if successful; it should only affect downstream artifacts that the dependency graph actually establishes as dependent, directly connecting the corpus's contradiction-propagation discipline (0652) to component-level failure handling"
  - concept: "Agents communicate through governed artifacts, not through implicit trust"
    definition: "Multi-agent workflows should not require agents to trust one another's internal cognition or reasoning process; instead, agents interact solely through typed, contract-governed artifacts, allowing heterogeneous agents (built on different underlying models) to remain workflow-compatible via shared semantic contracts rather than shared implementation"
