about: >
  Derives a disciplined Nyaya/Tarka falsification lens directly from the primary text of the Tarka-sangraha
  with Annambhatta's Dipika commentary and notes -- explicitly distinguished from a "generic Tarka lens"
  by being grounded in the actual book's technical apparatus. Organizes nine attack families: (1) Lakshana
  definition-adequacy test (avyapti/ativyapti/asambhava -- a definition that under-covers, over-covers, or
  cannot apply at all), applied directly to the working Kernel definition; (2) the five-member Nyaya
  syllogism (pratijna/hetu/udaharana/upanaya/nigamana) as a template for stress-testing architectural claims
  like "ConflictRecord must be inside the Kernel boundary"; (3) vyapti (invariable concomitance, anvaya/
  vyatireka positive/negative testing) as a sharper, more rigorous version of the atomicity test already in
  use, capable of exposing false-atomicity arguments; (4) hetvabhasa, five defective-reason types
  (savyabhicara/viruddha/satpratipaksha/asiddha/badhita) proposed for direct application to all 21 open
  adjudication questions; (5) samsaya (doubt, defined as contradictory attributes apprehended in the same
  substratum) used to argue UNKNOWN/DOUBT/CONTRADICTION/ERROR must not collapse into one state (feeds
  F-CM-1, C-17); (6) viparyaya (erroneous apprehension, the shell-mistaken-for-silver example) mapped onto
  the anti-reasoner boundary -- warns against silently converting representation into semantic truth
  without a legitimate pramana; (7) abhava/pratiyogi (absence requires an established counter-correlative,
  with absolute/prior/subsequent/locus-specific absence subtypes) applied to C-15/C-17 retraction --
  "retraction doesn't exist as a Kernel state" must specify exactly what is being negated; (8) anvaya-
  vyatireka bidirectional dependency testing (cause-present/effect-present AND cause-absent/effect-absent)
  for every claimed "X requires Y" dependency; (9) nigrahasthana, a catalogue of debate-failure points
  (abandoning/changing the proposition, changing the reason, irrelevant meaning, conclusion-exceeds-
  premises, etc.) proposed for governance adjudication record-keeping. Formalizes all nine into
  TARKA-KERNEL-FALSIFICATION-001, a named ten-point (T1-T10) checklist, explicitly scoped as an independent
  falsification lens against an already-adjudicated boundary, never as an architecture-generating tool.
  Explicitly caveats that the extraction is not yet exhaustive of the full ~200-page text.

