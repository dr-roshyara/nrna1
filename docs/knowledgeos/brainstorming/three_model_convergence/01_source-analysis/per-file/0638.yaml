defines:
  - concept: "The three correctness levels"
    definition: "Level 1 MathematicalConsistency (the abstract model's internal coherence, tested at 0631); Level 2 ReferenceMachineConsistency (the reference machine's specified behavior hand-exercised against adversarial scenarios, as in this file); Level 3 ProductionSystemCorrectness (an actual running implementation's correctness, explicitly not yet demonstrated anywhere in the corpus)"
  - concept: "Safety (□I(X_t)) vs. Liveness (◊Goal)"
    definition: "Safety guarantees that a bad state never occurs across all reachable states; liveness guarantees that a desired good state or outcome is eventually reached; a system can satisfy every safety invariant while still failing to make progress (e.g. remaining permanently in a Waiting state), making liveness a genuinely distinct and often harder property to establish"
  - concept: "PASS WITH QUALIFICATION"
    definition: "A verdict indicating the reference state machine survives its defined adversarial test scenarios at the specification/model level with no contradiction discovered, while explicitly declining to claim production implementation correctness — a more cautious phrasing than the plain 'STEP N — PASS' used throughout the rest of the corpus"
