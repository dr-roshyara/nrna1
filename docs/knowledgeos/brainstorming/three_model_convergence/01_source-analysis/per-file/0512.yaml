defines:
  - concept: "Claim (Cavell-derived candidate Kernel category)"
    definition: "The standing of one person upon another, requiring a response (acceptance or refusal, acknowledgment or avoidance) rather than a truth-evaluation; proposed as distinct from and not reducible to a Proposition"
  - concept: "Position (Cavell-derived candidate distinction from Assertion)"
    definition: "What a speaker is doing in making an assertion (e.g. claiming authority, taking responsibility, concealing themselves), as distinct from the propositional content asserted"
  - concept: "Ultimate grounds / end of justification"
    definition: "The recognized point at which reasons legitimately stop (e.g. 'this is what I see, this is what I hear'), proposed as a boundary the Kernel must represent rather than treat as an unfilled verification gap"
