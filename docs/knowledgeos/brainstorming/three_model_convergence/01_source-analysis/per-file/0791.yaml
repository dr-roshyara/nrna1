defines:
  - concept: "'AI-assisted assurance' (LLM interpretation must not replace deterministic verification)"
    definition: "Where a deterministic oracle already exists for evaluating whether an observed state matches an expected one, that oracle's verdict must remain authoritative -- an AI/LLM may assist by generating candidate expected values or by interpreting ambiguous observations, but it must never be substituted for, or allowed to override, the deterministic verification mechanism itself when one is available"
  - concept: "'The deeper principle' (State+Process+Lineage)"
    definition: "A system that acts without losing track of why it acted must maintain three distinct, interconnected structures: State (what is currently true), Process (what work is presently underway or being waited on), and Lineage (how the current state was reached historically) -- combined with the epistemic chain (Evidence/Knowledge/Determination answering why a belief is held), Governance (who had authority to decide), and Operations (what actually happened), these six questions together constitute the system's full epistemic-operational accountability"
