title: "Step 166 -- Process Managers, Sagas, and Long-Running Consistency (MAJOR SYNTHESIS MILESTONE, delivers 0790's promised register): Process≠Aggregate ('a Process Coordinates. an Aggregate Protects Invariants') -- Distinguishes Four Non-Synonymous Coordination Mechanisms (Domain Events/Process Manager/Saga/Workflow Engine) -- Delivers 'LLM Interpretation Must Not Replace Deterministic Verification' (Oracle(Observed) Remains Authoritative) -- Delivers the Nine-Statement Architectural Synthesis (Aggregates Protect/Events Record/Commands Request/Processes Coordinate/Governance Authorizes/Evidence Supports/Knowledge Represents Governed Claims/Agents Contribute/Observations Reconnect Execution to Knowledge) -- Delivers 'the Deeper Principle': 'How Can a System Act Without Forgetting Why It Acted?' via Three Separate but Connected Structures (State+Process+Lineage) -- Delivers 'a Major Architectural Milestone': Connecting DDD+Epistemology+Statistics+Governance+AI+Operational Assurance 'Without Requiring Them to Become One Model' -- Opens Step 167, Aggregate Invariants→Formal Verification Obligations, Posing 'Can We Prove, Test, or Otherwise Substantiate That the Architecture's Important Claims Actually Hold?'"
