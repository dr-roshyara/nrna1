defines:
  - concept: "Booleanization"
    definition: "A newly-named anti-pattern occurring when a contract or transformation collapses a multidimensional epistemic state (e.g. Supported/Uncertain/Conflicted/Conditional) into a single Boolean value the receiving domain treats as complete, when the domain actually requires the finer-grained distinctions -- examples given include Unknown→False, Uncertain→False, and Conditional→True, all potentially invalid collapses; distinct from but complementary to 0836's Semantic Laundering (which concerns a claim's apparent strength increasing without justification), Booleanization specifically concerns dimensional/informational collapse that destroys the receiving context's ability to make a properly qualified decision"
  - concept: "Locally valid but globally invalid (semantic non-compositionality)"
    definition: "The file's central negative architectural result: two semantic contracts can each individually satisfy their own semantic-sufficiency and semantic-integrity requirements (SI(C_1)=True, SI(C_2)=True) while their composition SI(C_2∘C_1) fails to preserve what the final receiving context actually needs, because information relevant three steps downstream may be silently discarded at an earlier, individually-correct step -- directly explaining, at the level of formal semantic contracts, why a distributed architecture composed entirely of individually-correct services can nonetheless produce a wrong overall decision"
  - concept: "The provisional contract safety theorem"
    definition: "A candidate (explicitly not formally proven) architectural theorem stating that a composed chain of contracts is 'safe' for a given responsibility R_C if three conditions jointly hold: Semantic Sufficiency (the composed chain preserves everything R_C legitimately needs, S_{R_C}⊆Preserve(C_2∘C_1)), Provenance Preservation (the chain's provenance is at least as rich as R_C requires, Provenance(C)⊇RequiredProvenance(R_C)), and Temporal Validity (the versions and time windows referenced remain historically accurate) -- explicitly labeled a 'provisional architectural theorem, not a mathematically proven theorem in the formal-methods sense,' preserving the arc's continued epistemic discipline against overclaiming formal rigor it has not yet earned"
