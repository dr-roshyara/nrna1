defines:
  - concept: "Scale-type admissible-transformation groups Φ_D"
    definition: "For each measurement scale type, the group/monoid of transformations φ that preserve the scale's intended structure and under which a statement's meaningfulness must be invariant: Nominal Φ_D={arbitrary bijections} (preserves only equality/classification); Ordinal Φ_D={strictly monotone transformations} (preserves ordering, not meaningful differences); Interval Φ_D={x↦ax+b|a>0} (preserves differences up to a common scale, not ratios); Ratio Φ_D={x↦ax|a>0} (preserves ratios, fixed zero point). A statement/predicate about values on dimension D is only 'meaningful' if its truth value is unchanged under every transformation in Φ_D -- this is the formal criterion (Roberts' meaningfulness) distinguishing legitimate reasoning from computationally-possible-but-semantically-invalid operations"
  - concept: "No averaging of ordinal epistemic strength"
    definition: "A concrete corollary of the scale-type/AllowedOperations framework: if an epistemic-strength or confidence dimension is established as ordinal (rather than interval or ratio), then arithmetic aggregation operations over its values -- averaging, summing, or weighted combination -- are not admissible under the meaningfulness criterion, regardless of how computationally convenient such an operation would be, because ordinal scales do not license meaningful differences (Ordinal⇏meaningful difference), and averaging presupposes differences are meaningful. Any such aggregation must instead be explicitly authorized by the scale semantics of the dimension in question, not introduced merely because it is easy to compute"
