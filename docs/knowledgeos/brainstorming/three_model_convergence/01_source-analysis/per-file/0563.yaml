title: "LANDMARK: Full Typed-Uncertainty Taxonomy — Eight Distinct Uncertainty Types (Unknown/Incomplete/Ambiguous/Imprecise/Probabilistic/Conflicting/Indeterminate/ModelUncertain), None Interchangeable; 'KnowledgeOS Shall Never Force Heterogeneous Uncertainty Into a Single Scalar Confidence Value at the Kernel Level'; LLMReportedConfidence≠CalibratedProbability; 'No Universal Uncertainty Propagation Formula' (Explicit Sixth+ Instance of the No-Universal-Formula Pattern); Fifteen Canonical U1-U15 Invariants; Opens Step 21 (Goals, Intentions, Decisions, Actions, Utility, Risk, Constraints, and Outcomes)"
