about: >
  Directly executes 0562's closing "Step 20," opening with the observation that the corpus has repeatedly
  used informal words like "unknown," "uncertain," "confidence," "support," and "probability" that, left
  informal, would eventually make the mathematical model inconsistent. Delivers the file's governing
  principle: **`Uncertainty is not one quantity`**, more precisely
  **`Unknown≠Ambiguous≠Incomplete≠Imprecise≠Conflicting≠Probabilistic`**, and
  **`LLM confidence≠calibrated probability`**.

  **Delivers the file's foundational six-case worked example**, all describing the single statement
  "the Nexus server is running version 3.72": Case A (no evidence, `Unknown`), Case B (ambiguous referent,
  `Ambiguous`), Case C (known entity, missing attribute, `Incomplete`), Case D (conflicting authoritative
  sources, `Conflict`), Case E (an interval-only source statement, `Imprecise`), Case F (a repeated-
  measurement probability estimate, `Probabilistic`) -- six genuinely distinct epistemic conditions,
  concluding `KnowledgeOS must preserve the type of uncertainty`.

  **Formalizes Uncertainty as a structured object rather than a scalar**: explicitly rejects `U∈[0,1]` in
  favor of `𝒰=(Type,Scope,Object,Representation,Source,Basis,TemporalScope,Resolution)`, with `Type` drawn
  from an eight-member taxonomy `𝒰_types={Unknown,Incomplete,Ambiguous,Imprecise,Probabilistic,
  Conflicting,Indeterminate,ModelUncertain}`.

  **Formalizes Unknown**: `Unknown(A)` means neither A nor ¬A is sufficiently established, explicitly
  distinct from `False(A)`. **Delivers the Open-World Assumption as an explicit KnowledgeOS principle**:
  `Absence of evidence≠Evidence of absence` -- a missing `HasOwner(Nexus)` fact yields `Unknown`, never
  `¬HasOwner(Nexus)`, "essential for enterprise knowledge." **Formalizes Incomplete knowledge** as known
  structure plus missing components, connected directly to the corpus's Discrepancy model. **Formalizes
  Ambiguity as a set of known candidate interpretations** (`Ambiguity(x)={c_1,...,c_n}`), explicitly
  distinct from Unknown -- "we have known alternatives" -- with an LLM permitted to extract candidate
  referents but the kernel forbidden from arbitrarily selecting one.

  **Formalizes Imprecision as interval-valued, explicitly distinct from probability**
  (`CPU∈[0.80,0.90]` does NOT mean every value is equally likely) -- **`IntervalUncertainty≠Probability`**.
  Formalizes Probability rigorously via a probability measure `P:ℱ→[0,1]`, and delivers **`Probability is
  model-relative`**: `P(A)=0.8` does not mean "reality is 80% true," only that under a specified
  probabilistic model and information state that probability is assigned -- echoing the corpus's recurring
  model-relativity theme (0556 causal, 0560 semantic).

  **Delivers Bayesian probability** `P(A|E)=P(E|A)P(A)/P(E)` as supportable "where statistically
  justified," alongside the crucial caution **`Not every uncertainty should be probabilized`**, worked
  through a concrete example: assigning `P=0.97` to a governing constitutional requirement for approval
  actually WORSENS the representation, since the real issue is `NormativeValidity`, not probabilistic
  uncertainty at all -- directly reinforcing 0561's Normative/Descriptive rule separation.

  **Delivers the file's central conceptual disambiguation -- four distinct senses of "confidence"**:
  Statistical confidence (interval/procedure property), Subjective confidence (a person's degree of
  belief), Model confidence (an AI's internal/reported confidence), Epistemic support (assertion support
  strength) -- explicitly must not be conflated. **Delivers the file's hard invariant**:
  **`LLMReportedConfidence≠CalibratedProbability`**: an LLM's stated "95% confident" must be stored as
  `LLMReportedConfidence=0.95`, never treated as `P(SameServer)=0.95`, unless the model is demonstrably
  calibrated for that task. **Formalizes Calibration empirically**: among predictions assigned p=0.8,
  roughly 80% should be correct for the model to be calibrated in that region, and delivers
  `Calibration(Model,Task,Context)` as strictly preferable to `Calibration(Model)` alone (an LLM well
  calibrated for text classification may be poorly calibrated for infrastructure-identity questions).

  **Formalizes Conflict as a distinct epistemic category, not a probability value**: `Conflict(A,¬A)`
  can coexist with high certainty ABOUT the conflict's existence while remaining uncertain which side is
  correct -- `Conflict is a property of the evidence state, not simply a probability value`. Delivers
  **Conflict-probability coexistence**: `Conflict(A,¬A)` and `P(A|E)=0.8` can both hold simultaneously; the
  probability is a synthesis result, the conflict remains as preserved provenance and must not be erased.

  **Formalizes Indeterminacy**, stronger than mere not-knowing: `Indeterminate = not derivable and not
  refutable under the current [formal] model`, connecting directly to 0561's four-valued reasoning-result
  taxonomy. **Delivers `ModelUncertainty≠ParameterUncertainty`**: uncertainty arising from choice of
  statistical model itself (two valid models yielding `P_1(A)=0.8` vs `P_2(A)=0.55`) is categorically
  different from uncertainty in an estimated parameter within a chosen model (`p̂=0.8`,
  `p∈[0.74,0.85]`) -- "a standard statistical distinction." Formalizes **Measurement uncertainty** as a
  third distinct category (`CPU∈[78%,82%]` from ±2% instrument error), explicitly warning it "should not
  automatically become `P(CPU=80)=0.95`" -- **`ErrorInterval≠Probability`**.

  **Delivers Uncertainty propagation with type-dependent semantics**: deterministic interval propagation
  (`x∈[1,2]`, `y=2x+1`⟹`y∈[3,5]`) is categorically different from probabilistic distribution
  transformation for `Y=2X+1` -- **`Propagation semantics depend on uncertainty type`**, motivating typed
  uncertainty storage over a bare `confidence=0.8` field, worked through four concrete typed-uncertainty
  record examples (interval/probabilistic/ambiguity/conflict). **Formalizes an Uncertainty object**
  `U=(Type,Target,Scope,Representation,Basis,Magnitude,Source,TemporalScope,PropagationRule)`, with
  `PropagationRule` singled out as particularly important.

  **Delivers `EpistemicStatus≠UncertaintyType`**: `Σ=Supported` can coexist with `U=Probabilistic`, or
  `Σ=Disputed` with `U=Conflict` -- genuinely orthogonal dimensions, worked through a concrete "probably
  running 3.72" vs. "3.72 or 3.73" contrast showing the latter must not be assigned an invented
  probability. **Delivers `Unknown does not imply UniformProbability`**: KnowledgeOS must not assign
  `P(A)=0.5` merely because there are two possibilities, an "unjustified assumption." **Delivers the
  general invariant `No numerical confidence without a defined basis`**, naming five legitimate bases
  (statistical model, calibrated classifier, Bayesian posterior, expert elicitation, measurement model)
  and explicitly excluding raw LLM felt-confidence from automatically qualifying.

  **Delivers Evidence uncertainty vs. proposition uncertainty**: uncertainty in the evidence itself (e.g. a
  possibly-misconfigured monitoring system) can propagate into uncertainty about the supported proposition.
  **Delivers Source uncertainty formalized via the corpus's established Bayesian reliability model**
  (`Rel(S,A)~Beta(α,β)`), creating a hierarchical statistical model when warranted, directly reusing
  0562's reliability-estimation machinery. **Delivers Uncertainty propagation through inference**: whether
  uncertainty in A propagates deterministically, probabilistically (`P(B|A)`), or causally (`P(B|do(A))`)
  into B depends entirely on the applicable rule's semantics -- **`There is no universal uncertainty
  propagation formula`**, explicitly elevated to a major architectural principle: `Every uncertainty type
  has its own semantics and propagation rules`, preventing "a mathematically invalid universal 'confidence
  engine.'" This is a clean, explicit additional instance of the corpus's recurring "no universal formula"
  architectural pattern (previously confirmed at 0545/0546, 0554, 0556, 0561, arguably 0560), this time
  applied to uncertainty propagation itself.

  **Connects decision-making under uncertainty directly to Sārathi (0557)**: standard expected-utility
  formulas `EU(a)=Σ_s P(s|K)U(a,s)` (discrete) and its integral form are valid "only when the uncertainty
  has a defensible probabilistic model"; otherwise interval decision analysis, minimax, robust
  optimization, worst-case analysis, or human escalation are required. Formalizes Risk conceptually as
  `Risk(a)=f(Likelihood,Impact,Uncertainty,Reversibility)`, with the explicit caution that likelihood must
  not be invented if unavailable -- **`Unknown probability must not be replaced by an arbitrary
  probability`**: a high-impact action with unknown likelihood should trigger escalation rather than an
  assumed value, worked through a concrete "human approval required" example.

  **Delivers `RequiredEpistemicStrength=f(ActionRisk)`**, directly connecting Step 20 to Step 19's
  risk-adjusted epistemic-requirement principle (0562), worked via a contrasting "show a possible
  explanation" (0.95 sufficient) vs. "delete production data" (0.95 likely insufficient) example. **Delivers
  a formal robust decision-making criterion** `a*=argmax_a min_{P∈𝒫} EU_P(a)` over a plausible-distribution
  set 𝒫, extending 0557's robust/minimax decision theory. **Delivers Uncertainty reduction as an explicit
  action type**: information-gathering formalized as `a_info:K→K'` where ideally `U(K')<U(K)`, with the
  explicit caveat that this does not mean all uncertainty must be eliminated. **Formalizes Value of
  Information** `VOI=EU(with information)-EU(without information)`, possibly minus acquisition cost,
  directly reprising and generalizing 0557's EVSI/VOI formalization to the general uncertainty-reduction
  case, delivering the framing **"Active Epistemic Management"** as "a significant distinction from
  ordinary RAG systems."

  **Extends Zero**: can now detect `UncertaintyTooHighForPurpose`, worked through a concrete Nexus-version
  "Supported but Not decision-ready" example, delivering **`Supported≠Sufficient`**. Extends Lord (query
  system of record, request human confirmation, perform independent measurement), with the goal reframed
  from "reduce uncertainty to zero" to **`reduce uncertainty enough for the intended purpose`**. Extends
  Sārathi: formalizes decision readiness
  `Ready(K,P)=SufficientEvidence∧AcceptableUncertainty∧NoCriticalConflict∧ApplicableGovernance`.

  **Delivers a typed extension of the discrepancy model**: `d_uncertainty` now includes MissingValue,
  AmbiguousIdentity, InsufficientPrecision, UncalibratedProbability, ConflictingEvidence, and
  ModelUncertainty as named deficiency subtypes. **Formalizes a richer epistemic-state structure for
  assertions** `EA=(Status,Support,Uncertainty,Conflict,Provenance,TemporalScope)`, and a
  **structured truth space rejecting bare True/False**:
  `TruthStatus(A)=(Support(A),Refutation(A),Uncertainty(A),Commitment(A))`, explicitly permitting
  simultaneous non-zero support AND refutation to represent genuine dispute -- "not necessarily a bug."

  **Delivers the file's central architectural-humility principle**: `No forced resolution` -- KnowledgeOS
  must be permitted to return `Unresolved` as a valid, non-failure epistemic result, explicitly stated as
  an architectural principle: "the system must be able to represent 'we do not know' without converting it
  into an invented answer." Delivers a full Uncertainty lifecycle (Unknown→Evidence acquired→Ambiguity
  identified→Candidates generated→Evidence assessed→Uncertainty characterized→Corroborated/resolved/
  remains uncertain→Commitment decision), explicitly contrasted with a naive "retrieve→answer" RAG pattern.

  **Delivers four proposed DDD bounded contexts for uncertainty/decision concerns**: Epistemic Context
  (uncertainty, epistemic status, support, conflict), Statistical Context (probability, distributions,
  calibration, estimation), Decision Context (risk, utility, thresholds, action readiness), Evidence
  Context (evidence, provenance, source assessment) -- explicitly preventing probability concepts from
  "contaminating the entire domain model." Delivers a DDD Ubiquitous-Language caution: "confidence" must
  not become one shared field across bounded contexts (`Confidence_LLM` vs `Confidence_Statistical` are
  different concepts entirely) -- "precisely the type of semantic ambiguity DDD helps us avoid," directly
  echoing 0560's semantic theory.

  **Formalizes two distinct domain objects**: `UncertaintyAssessment=(Type,Target,Basis,Scope,
  Representation,Provenance)` and `ProbabilisticAssessment=(RandomVariable,Distribution,Model,Prior,
  Posterior,Calibration)`, explicit about making the statistical boundary architecturally visible.

  **Delivers a three-tier computability assessment**: deterministically computable (unknown-state
  detection, missing fields, ambiguity sets, interval arithmetic, temporal uncertainty, evidence conflict,
  logical indeterminacy, constraint uncertainty, provenance); statistically computable (probability
  distributions, posteriors, confidence intervals, calibration, expected utility, Bayesian updating);
  AI-assisted (extracting ambiguity/candidates/uncertainty expressions from language) -- with the explicit
  caution `AI extraction does not make an uncertainty claim mathematically valid`.

  **Delivers the file's central formal deliverable -- fifteen canonical invariants (U1-U15)**: Unknown≠
  False; AbsenceOfEvidence≠EvidenceOfAbsence; Ambiguity≠Unknown; Imprecision≠Probability; Conflict≠
  Probability; EpistemicStatus≠UncertaintyType; LLMConfidence≠CalibratedProbability; no numerical
  confidence without a defined basis; not every uncertainty should be probabilized; every uncertainty type
  has explicit propagation semantics; unknown probability must not be replaced by an arbitrary probability;
  conflict must preserve the competing claims; decision thresholds are governance/policy, not universal
  mathematical constants; the system may legitimately return Unresolved; uncertainty must be represented
  according to its actual semantic type.

  **Delivers Step 20's compact mathematical core** (the eight-type uncertainty taxonomy, the uncertainty
  assessment structure, the probability measure, Bayesian updating, expected-utility decision-making,
  robust minimax decision-making, and value-of-information) -- "distinct mathematical mechanisms rather
  than one universal 'confidence formula.'" **Delivers Step 20's verdict**: THEORETICALLY RESOLVED AT THE
  FRAMEWORK LEVEL, with the file's single strongest architectural decision explicitly stated:
  **"KnowledgeOS shall never force heterogeneous uncertainty into a single scalar confidence value at the
  kernel level"** -- a scalar may be derived for a specific decision model downstream, but the underlying
  structured uncertainty is never collapsed at the kernel: `Structured Uncertainty→Derived Decision
  Metric`, never `Uncertainty→One Universal Confidence Number`.

  **Delivers a consolidated fourteen-stage sources-to-outcome pipeline** spanning Reality through
  DomainState/Evidence/Assertion/Meaning/Validity/EpistemicState/KnowledgeState/DerivedKnowledge/
  Discrepancy/CandidateActions/Decision/AuthorizedAction/DomainEvent/NewObservation, cross-cut by
  `Identity+Semantics+Time+Evidence+Provenance+Authority+Reliability+Uncertainty+Rules+Governance` --
  explicitly described as "approaching a closed mathematical architecture rather than a collection of
  philosophical definitions."

  **Closes by identifying a remaining gap DESPITE the near-closure framing**: KnowledgeState, IdealState,
  and Discrepancy have been defined, along with reasoning, uncertainty, evidence, time, and semantics, but
  the transition from knowledge to action and the meaning of "Action" itself have not been FULLY
  formalized -- posing "what is an Action? What is a Decision? What is a Goal? What is an Outcome?" **Opens
  "Step 21 — Goals, Intentions, Decisions, Actions, Utility, Risk, Constraints, and Outcomes,"** explicitly
  framed as the step that will "let us test whether the entire KnowledgeOS loop is actually operational
  rather than merely descriptive" -- noteworthy because Step 15 (0557) already delivered a substantial
  formal treatment of actions, utility, risk, and decision-making via Sārathi, raising an open question
  about the relationship (extension vs. overlap/redundancy) between Step 15 and the newly opened Step 21.
