  - concept: "This reconstruction's long-tracked K-definitional-collision finding (files 0941, 0942, 0957)"
    refinement: "REFRAMED from a mere definitional inconsistency into an explicit two-lane structural split (Architecture Canon vs Research/Verification), with an explicit missing-bridge diagnosis and a governance-level (not derivation-level) resolution requirement"
  - concept: "File 0949's independently-derived six-candidate operation-registry count and 88/99-empty-cell figure"
    refinement: "INDEPENDENTLY CONFIRMED via an apparently separate document lineage (the unseen 06/07/08 documents), a valuable cross-corroboration of these specific quantitative findings"
  - concept: "File 0941's four-state discussed/defined/derived/ratified discipline"
    refinement: "EXTENDED into a five-stage Discovery/Derivation/Architecture/Ratification/Implementation principle, elevated to first-class programme-methodology status"
  - concept: "Files 0919's, 0928's, 0942's, and 0944's/0947's four prior, mutually incompatible Steps-285+ roadmap namings"
    refinement: "A FIFTH, FURTHER INCOMPATIBLE NAMING is introduced here, issued (by this reconstruction's reading order) AFTER file 0947's explicit Final Ruling had already formally ratified the fourth scheme -- the most severe instance yet of this corpus's roadmap-numbering instability, now spanning five mutually incompatible content assignments to overlapping step-number ranges across five separate files"
  - concept: "File 0941's A6/Article 8.3 authority-evidence-boundary open question"
    refinement: "LIKELY THE SAME UNDERLYING ISSUE, referenced here under a different name ('I-12/Article 8'), delivering a seven-way candidate classification for what 'Reject' formally is -- this reconstruction notes the naming discrepancy (A6/Article-8.3 vs I-12/Article-8) as itself unreconciled and worth tracking"
