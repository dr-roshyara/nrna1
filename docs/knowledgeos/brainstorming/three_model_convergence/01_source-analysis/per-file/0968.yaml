defines:
  - concept: "The Kernel Core vs KnowledgeOS Services architectural boundary"
    definition: "The minimal computational kernel required to make KnowledgeOS's core theory executable consists only of State, Operations, Transformations, Rejection semantics, Replay, and the Invariant registry. Constructs important to the broader KnowledgeOS product but NOT required by this minimal kernel include Q_t, Missingness, Determination, Authority, Authorization, Assessment, Qualification, Measurement, Lineage, and Orphan -- these belong to a separate 'KnowledgeOS Services' layer built atop the kernel, not to the kernel itself, meaning the kernel's critical path does not require resolving these services' own open questions first"
  - concept: "The missing canonical bridge (between Architecture Canon and Research/Verification lanes)"
    definition: "The unresolved, explicitly governance-level question of how the ratified architectural canon's state model (K_t, eight primitives) relates to the independently-developed research/verification lane's state model (K=(A,R) plus the surrounding Sigma/Q_t/I/O/delta apparatus) -- whether they are identical, one subsumes the other, they represent different abstraction layers, or they are simply two different, non-interchangeable models entirely. This relationship has never been authoritatively decided, and until it is, no derivation building on either model can be safely treated as canonical for the other"
