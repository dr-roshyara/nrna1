defines:
  - concept: "The no-hindsight reconstruction constraint"
    definition: "A reconstruction of a historical decision D_t must represent only the knowledge, evidence, and context that were actually available at time t (Knowledge_then), never silently incorporating information discovered afterward (Knowledge_now) even when that later information would have changed the decision -- violating this constraint constitutes 'historical falsification,' since it makes a past decision appear better- or worse-justified than it actually was given what was genuinely knowable at the time, directly extending 0803's 'hindsight leakage' concept to the specific context of reconstructing past reasoning"
  - concept: "Reconstruction is not summarization"
    definition: "A summary compresses a decision into a plausible-sounding narrative ('the team decided to migrate because the system was outdated') that discards the specific evidentiary and deliberative structure; a genuine reconstruction instead preserves which specific evidence items existed, their relative authority and reliability, which alternatives were considered and why each surviving or rejected, which constraints applied, and who held the authorizing role -- the reconstruction is a structured reasoning trace, not a prose gloss, and the distinction matters because a summary can be internally consistent while being epistemically hollow"
  - concept: "The reconstruction contract's essential clause: 'to the extent actually recorded'"
    definition: "A KnowledgeOS reconstructability guarantee must be explicitly bounded by what was genuinely captured at the time -- it commits to making everything that WAS recorded reconstructable, never to manufacturing an explanation for something that was never recorded; omitting this clause would create pressure toward fabricating plausible-sounding justifications for decisions whose actual reasoning was simply never documented, which would be worse than an honest gap"
