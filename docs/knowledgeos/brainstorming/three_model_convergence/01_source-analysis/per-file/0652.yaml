defines:
  - concept: "ApparentContradiction≠LogicalContradiction"
    definition: "Two propositions that appear to contradict (p and ¬p) are not genuinely contradictory if they differ in temporal scope, context, population, or any other implicit qualifier; genuine contradiction requires identical subject, predicate, context, time, and scope"
  - concept: "LocalConflict⇏GlobalFailure"
    definition: "A contradiction concerning one proposition p must not, via the classical principle of explosion, be permitted to make arbitrary unrelated propositions derivable; KnowledgeOS requires a paraconsistent reasoning layer that keeps Inconsistent(p) distinct from EverythingInconsistent"
  - concept: "ResolveConflict≠DeleteConflict"
    definition: "Resolving a conflict between p and ¬p may produce a PreferredClaim while retaining the CompetingClaim as an auditable, non-deleted record; there is no universal resolution ranking across domains"
  - concept: "Authority≠Truth"
    definition: "An authoritative source's claim does not automatically override independent, high-quality contradicting evidence; automatically deleting contradicting evidence in favor of an authoritative source is an explicitly tested and rejected failure mode, directly paralleling Decision≠Authorization, Model performance≠Model authorization, and AgentCapability≠AgentAuthority"
  - concept: "Concept=Name+Context"
    definition: "Apparent semantic contradictions can arise purely from merging the same term across different bounded contexts with different meanings (e.g. Customer=Purchaser vs Customer=ContractHolder); KnowledgeOS must attach a MeaningContext to every proposition rather than assuming SameWord⇒SameConcept, reinforcing DDD bounded-context discipline mathematically"
  - concept: "EpistemicState≠DecisionPolicy"
    definition: "Knowledge describes what is believed (including Conflicted states); policy determines what actions may proceed given that state (e.g. via an explicit probability threshold), so conflict does not universally block decisions, nor does it get silently treated as resolved truth"
