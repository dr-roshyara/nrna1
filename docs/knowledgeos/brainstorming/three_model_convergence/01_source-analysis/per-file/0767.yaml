about: >
  Continues the external_research/ dialogue chain, opening by praising a prior (off-record) analysis as
  "the fundamental distinction that elevates KnowledgeOS from 'another RAG system' to a true epistemic
  platform. The answer to 'Where does ChatGPT get its information?' is the key that unlocks the entire
  architecture." Per 0762's provenance caution, recorded as external/skepticism-requiring content.

  **Delivers "the core insight: three distinct information pathways,"** a three-row comparison table:
  **(A) Model Knowledge** (Training→Parameters→LLM Response; implicit, non-traceable, non-governed;
  "interpret, but do not treat as authoritative"); **(B) External Retrieval** (Source→Retrieval→Context→
  LLM; explicit, traceable, but ungoverned; "source of evidence candidates, not knowledge"); **(C)
  KnowledgeOS Knowledge** (Observation→Assertion→Evidence→Epistemic State; explicit, traceable, governed,
  versioned; "the authoritative Knowledge State"). Delivers the critical-error warning: `LLM Response≠
  KnowledgeOS Knowledge`, `Retrieved Document≠KnowledgeOS Knowledge`, `Training Data≠KnowledgeOS
  Knowledge`.

  **Delivers "the Source Plane vs. Knowledge Plane distinction,"** explicitly named "the most important
  architectural contribution of your analysis": Source Plane answers "where did this information come
  from?", Knowledge Plane answers "what do we currently represent as knowledge?", and the Epistemic Engine
  (Zero/Lord/Sārathi) answers "how justified, complete, current, and coherent is that knowledge?" -- a
  genuinely clean three-tier architectural decomposition.

  Delivers a ten-stage ingestion pipeline (External Source→Source Connector→Raw Artifact→Document Parser→
  Structural Model→Semantic Parser→Observations→Candidate Assertions→Evidence Objects→Knowledge State
  Update→{Zero, Lord}→Sārathi), explicitly presented as the "precise formalization of Document→Observation→
  Interpretation→Assertion→Evidence→Knowledge... established in our earlier work."

  **Delivers "the Epistemic Retrieval Loop," explicitly named "perhaps the most powerful contribution"**:
  instead of `Query→Retrieve→Answer`, KnowledgeOS implements `Zero→Gap→Sārathi→Retrieval→Observation→
  Evidence→Knowledge→Zero` -- "a closed-loop epistemic investigation system, not a question-answering
  system." Delivers a complete worked diagram (Knower→Intent→Semantic Reconstruction→Dimension Discovery→
  Knowledge State→{Zero, Lord, Evidence}→Sārathi→Investigation Plan→Source Retrieval→[Documents/APIs/Git]→
  Observation→Candidate Assertions→Evidence Model→Knowledge State'→back to Zero).

  **Delivers three new "constitutional invariants for sources,"** each with a worked instance list --
  **Invariant 1: Source≠Knowledge** (`Document≠Knowledge`, `API Response≠Knowledge`, `Git Repository≠
  Knowledge`); **Invariant 2: LLM Output≠Knowledge** (`LLM Output→Candidate Interpretation→Epistemic
  Processing→Knowledge`); **Invariant 3: Retrieval≠Knowledge Creation** (`Retrieve(Q)→EvidenceCandidates→
  Evaluate→Knowledge`) -- plus the overarching principle: "sources provide information; KnowledgeOS
  constructs governed knowledge from it. LLMs interpret; KnowledgeOS evaluates and governs. Retrieval
  supplies evidence candidates; it does not automatically create knowledge." **This is a strong,
  independently-derived external re-affirmation, substantively convergent with the primary corpus's own
  0750 finding "RAG is therefore not the architecture" and "retrieval ranking is not epistemic ranking"** --
  recorded here as an independent corroboration from a different source, not as a novel discovery, and
  consistent with 0762's caution, not assumed to add authority beyond what 0750 already established within
  the primary corpus's own primary reasoning voice. Adds yet another unnumbered "constitutional invariants"
  set to the reconstruction's tracked proliferation of parallel invariant catalogs.

  Delivers a three-layer architecture diagram (Source Layer / Cognitive Layer / Action Layer, all feeding
  Knowledge State→{Zero, Lord, Sārathi}), with six implementation implications: Source Connectors as
  "first-class citizens... epistemic components that understand the provenance, reliability, and context
  of their sources" (not mere "data loaders"); Semantic Reconstruction as a core capability; **Candidate
  Assertions held in a pending state until evaluated -- "not automatically promoted to knowledge"**;
  Evidence Objects stored with full provenance; **"Zero drives Retrieval": gaps identified by Zero become
  the basis for investigation plans generated by Sārathi**; and **"LLMs are Tools, not the Knowledge State
  ... their output is processed through the epistemic pipeline."**

  **Delivers a fourth independent artifact (after 0763, 0765, 0766) characterizing Lord's role**, here
  glossed as "Lord (orient/synthesize)" in the Epistemic Engine summary -- again consistent with the
  analytical/orientation characterization, never action-selection, further (unverified, external)
  corroborating context for the open `CON-02` question.

  Closes with a direct RAG-vs-KnowledgeOS comparison: RAG (`Query→Retrieve Chunks→LLM→Answer`) vs.
  KnowledgeOS (`Intent→Semantic Reconstruction→Dimension Discovery→Knowledge State→Zero[Diagnose]→
  Sārathi[Plan]→Retrieve Evidence→Observe→Assert→Evaluate→Update Knowledge State→Present`) -- "RAG asks
  what chunks are relevant to this question? KnowledgeOS asks what do we need to know, what do we know,
  what are the gaps, what evidence exists, and how should we investigate?" -- "this is the fundamental
  difference. KnowledgeOS is an epistemic investigation system, not a question-answering system." No
  actual code execution, repository inspection, or verified filesystem/architecture claim is made anywhere
  in this file.
