defines:
  - concept: "Candidate Ideal State / Approved Ideal State"
    definition: "hat-I_t = a proposed revision produced by KnowledgeOS (Zero/Lord/Sārathi); I_t = the approved Ideal State, produced only via Authorize(hat-I_{t+1},Authority,Policy)->I_{t+1}. KnowledgeOS never mutates I_t directly."
  - concept: "Strengthened Ideal State definition (Q18 final)"
    definition: "An authorized, purpose- and context-dependent normative model describing the knowledge, understanding, and/or domain conditions considered required, sufficient, desirable, or acceptable for a given purpose. It may be proposed for revision by KnowledgeOS, but it changes only through an authorized revision. Formally I_t=(I^K_t,I^U_t,D*_t,C_t,P_t,Γ_t), Γ_t = applicable governing constraints/norms."
  - concept: "Ideal-State event-sourcing (δ_I)"
    definition: "I_{t+1}=δ_I(I_t,r_t) where r_t is an authorized IdealStateRevisionAuthorized event, symmetric with Q17's K_{t+1}=δ_K(K_t,e_t); I_t=Replay(I_0,H^I_t,Π_I)"
