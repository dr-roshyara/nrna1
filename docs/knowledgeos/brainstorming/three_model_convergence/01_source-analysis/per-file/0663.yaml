defines:
  - concept: "LocalCorrectness⇏GlobalCorrectness (organizational generalization)"
    definition: "A generalization of 0662's LocalCorrectness⇏CollectiveCorrectness: even a fully individually-correct, individually-optimal set of agents can produce a globally incorrect or suboptimal system outcome, mathematically traceable to non-separable interaction terms (I_ij) in the true organizational utility function that agent-local optimization cannot see"
  - concept: "IndividualFeasibility⇏CollectiveFeasibility"
    definition: "Multiple resource requests or actions that are each individually valid against locally-checked constraints can jointly violate an aggregate system-level constraint (e.g. total resource capacity or total risk budget) that no individual check can detect"
  - concept: "Centrality≠Risk"
    definition: "A node's high centrality in a dependency graph (many workflows depending on it) indicates high potential systemic impact if it fails, but does not by itself establish high systemic risk; actual risk requires jointly considering dependency, failure probability, impact, and recoverability (e.g. redundancy can keep risk moderate despite high centrality)"
  - concept: "CausalContribution≠OrganizationalResponsibility"
    definition: "An agent whose action causally contributed to a bad outcome is not automatically at fault if it correctly followed authorized policy, valid protocol, and its assigned responsibility boundary; fault attribution requires separately evaluating causation, contribution, assigned responsibility, policy compliance, and negligence as five distinct relations, not a single collapsed judgment"
