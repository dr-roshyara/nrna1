defines:
  - concept: "Identity (e_1=e_2)"
    definition: "Two evidence records are literally the same data object (same hash, same observation ID, same acquisition event) — a data/infrastructure-level property"
  - concept: "Equivalence (e_1∼e_2)"
    definition: "Two distinct evidence records represent the same underlying evidential content according to an explicitly declared equivalence policy — formalized as a true mathematical equivalence relation (reflexive, symmetric, transitive) relative to that policy"
  - concept: "Independence (e_1⊥e_2)"
    definition: "Two evidence objects derive from genuinely separate acquisition events with no established shared evidential dependency — logically distinct from semantic equivalence, since independently-acquired evidence can express identical propositions"
  - concept: "UnderlyingObservation(e)"
    definition: "The single real-world event or state that a given evidence object o is a representation of; multiple heterogeneous evidence objects sharing the same UnderlyingObservation value are representations of one event, not multiple independent observations"
  - concept: "Operational Independence Test"
    definition: "Independence_ρ(e_i,e_j,G_E,C)->{Confirmed,Rejected,Unknown} — a policy-relative, evidence-graph-aware, three-valued test for whether two evidence objects can be treated as independent, explicitly acknowledging that absolute metaphysical independence cannot be proven"
