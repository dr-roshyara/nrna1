about: >
  Directly resolves 0539's flagged open problem, opening: "This is more fundamental than choosing the
  aggregation formula. If KnowledgeOS gets this wrong, every downstream confidence, conflict, gap, and
  conclusion can be wrong." Poses the central question: when do two pieces of evidence constitute the same
  evidential contribution, when are they dependent transformations, and when are they genuinely independent
  observations?

  **Delivers the file's foundational three-way (later five-way) separation**: Identity (`e_1=e_2`, a
  literal data/infrastructure-level sameness -- same hash, same observation ID); Equivalence (`e_1∼e_2`,
  different records expressing the same underlying evidential content, worked via two differently-phrased
  documents both stating "Nexus 3.69 is installed"); Independence (`e_1⊥e_2`, genuinely separate acquisition
  events, worked via an API report and an independent filesystem inspection both reporting 3.69) --
  crystallized as `Equivalence≠Independence`, "crucial." Then adds **Dependency as richer than
  Equivalence**: a worked chain (Database->LLM->Architecture report->Human summary,
  `e_1->e_2->e_3->e_4`) shows later items may have entirely DIFFERENT semantic content while their
  epistemic ancestry remains related, giving `Dependency≠Equivalence`.

  **Formalizes an Evidence Graph** `G_E=(V,E)` with typed provenance edges (DERIVED_FROM, INTERPRETED_AS,
  REVIEWED_BY), explicitly "not merely metadata. It affects the mathematics of evidence aggregation."
  **Introduces `UnderlyingObservation(e)=o`**, formalizing when multiple representations (a database
  record, a screenshot, an LLM extraction, a human report) all trace to one underlying event --
  "much more precise than simply saying 'duplicate.'" **Formalizes provenance as a causal partial order**
  `e_j≺e_i` ("e_i was produced using e_j"), giving the conservative rule `Dependency⇒NonIndependent`, while
  explicitly noting the converse fails (`NonIndependent⇏DirectDependency`) since two sources can share a
  common ancestor without one directly producing the other.

  **Delivers a subtle and statistically important finding on common-source dependency**: two LLM outputs
  (`LLM_A`, `LLM_B`) both derived from one original document, with neither directly producing the other, are
  still not independent observations in the relevant epistemic sense -- requiring a first-class
  `CommonSource(e_i,e_j)` relationship "to protect against correlated evidence inflation."

  **Delivers three formally named epistemic dependency classes**: Class 1 Same contribution (`e_i≡e_j`,
  count once); Class 2 Dependent contribution (`e_i⤳e_j`, never treated as independent corroboration);
  Class 3 Independent contribution (`e_i⊥e_j`, no shared dependency established, may contribute
  independently under the selected policy).

  **Directly resolves 0539's central flagged question with the corpus's clearest statement yet of the
  Unknown-Dependency principle**: `UnknownDependency≠Independence`; conservatively,
  `UnknownDependency⇒DoNotAssumeIndependentCorroboration`, explicitly named "a very strong candidate for a
  kernel invariant." **Delivers an important statistical qualification immediately after**, preventing
  over-application of that principle: unknown dependency does NOT mean the evidence is useless -- it only
  means "we cannot safely quantify its incremental independent evidential contribution"; the evidence may
  still be relevant, historically useful, supportive, contradictory, or useful for discovery --
  `UnknownIndependence≠NoEvidence`.

  **Formalizes the Evidence Identity relation `∼_E` as a genuine mathematical equivalence relation**
  (Reflexivity, Symmetry, Transitivity), but with the crucial qualifier "according to an explicitly
  declared equivalence policy," since semantic equivalence is not always automatically decidable. **Delivers
  a critical LLM-boundary rule**: an LLM may PROPOSE `e_i∼_Ee_j` based on semantic similarity, but "must not
  silently establish the mathematical fact" -- the proposal must pass through an explicit
  Proposed->Confirmed pipeline via rule, human, or deterministic check -- `LLM judgment≠authoritative
  epistemic fact`.

  **Delivers a five-concept DDD model**: Evidence, Provenance, EvidenceIdentity (EvidenceId,
  UnderlyingObservationId, EquivalenceClass, IdentityConfidence), DependencyAssessment (EvidenceA,
  EvidenceB, Relationship, Status, Basis), and EvidenceAssessment (PositiveSupport, NegativeSupport,
  Uncertainty, DependencyStructure, Quality, Qualifications) -- explicitly noting "EvidenceAssessment does
  not contain Truth." **Formalizes the emerging mathematical structure** as a complete pipeline:
  `ℰ --∼_E--> ℰ/∼_E`, `D:(ℰ/∼_E)²->{Dependent,Independent,Unknown}`, `Q:ℰ/∼_E->𝒬`, `⊕_ρ->EA` --
  "becoming a genuine computational calculus."

  **Delivers an explicit warning against a mathematically wrong definition**: `Independent(e_i,e_j)=
  SemanticDifference(e_i,e_j)` is WRONG, since two semantically identical statements (two independent
  sensors both reporting "temperature=20°C") can be genuinely independently observed -- crystallized as
  `SemanticEquivalence≠EvidentialIndependence`, "fundamental."

  **Proposes six concrete new test cases (A-F)** with explicit expected outcomes: exact duplicate -> 1
  contribution; semantic duplicate -> 1 contribution; independent identical observations (same proposition
  but genuinely ⊥) -> 2 contributions; LLM transformation of a source -> 1 independent contribution overall
  (the LLM output does not add a second contribution); common-source outputs -> not independent; unknown
  provenance -> do not assume independence.

  **Delivers the file's central formal result -- a provisional theorem**: "Evidence multiplicity is not
  equivalent to evidential independence," formalized as `|E|≠|IndependentContributions(E)|`, and more
  strongly `InformationVolume≠EvidenceStrength` -- "ten documents copied from one source do not necessarily
  provide ten pieces of evidence."

  **Closes with an honest progress ledger and a profound epistemic-limits admission**: strongly established
  now are Evidence Identity, Evidence Equivalence, Evidence Dependency, Common-Source Detection, and Unknown
  Dependency; still open is "how can KnowledgeOS computationally determine independence?" -- answered with
  unusual philosophical honesty: "Absolute epistemic independence is generally not computable from
  arbitrary documents alone... we cannot magically prove metaphysical independence. That is not a failure
  of KnowledgeOS. It is a boundary condition of the problem." Proposes the next concrete research step: an
  Operational Independence Test `Independence_ρ(e_i,e_j,G_E,C)->{Confirmed,Rejected,Unknown}`, to be tested
  against the corpus's full established heterogeneous input taxonomy (documents, databases, Internet
  sources, rules, manifests, human instructions, scope, constitution, settings, ADRs, textbooks, AI/LLM
  outputs) as "the next computational-closure test."
