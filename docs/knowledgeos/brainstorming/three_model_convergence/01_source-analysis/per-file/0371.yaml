about: >
  Intra-file self-duplicated (lines 1-310 byte-identical to lines 312-621, bare "#" marker at the boundary
  -- the EIGHTH instance of the pattern first seen at 0267, repeated at 0343/0354/0360/0362/0365/0366).
  Directly answers 0368's declared "What is a Fact?" research focus by introducing a more fundamental
  distinction than "fact = something observed": FACT DETERMINATION versus FACT EXTRACTION. Rejects the
  claim "a fact is extracted from previous actions, doings, principles and methods" as risking treating
  everything historical as fact; instead proposes Past-record -> observation -> interpretation ->
  determination -> fact, with DETERMINATION explicitly named "an epistemic act" -- illustrated via a
  worked two-level example: an observed action ("Person X approved Y on date Z") versus a higher-level
  determined fact ("Approval of Y requires authority X") that is NOT simply extracted from one event but
  DETERMINED from a body of previously determined actions, principles, decisions and methods. Formalizes
  fact-as-lineage: F=D(O,P,M,A,H) where O=observations, A=previous actions/doings, P=previously established
  principles, M=established methods, H=historical determinations, D=the determination process --
  crystallized as "Extraction retrieves material. Determination establishes what that material warrants
  asserting," explicitly connected to the corpus's existing expression/interpretation/epistemic-assessment/
  admission distinction. Introduces a FIVE-KIND FACT TAXONOMY, proposed as necessary before any design work:
  (A) OBSERVED FACT (Observation->Fact, directly recorded, contingent on observation trustworthiness); (B)
  HISTORICAL FACT (O1,...,On -> H, repeated/corroborated observations, "already an inference"); (C)
  PROCEDURAL FACT (extracted from established DOING/method, not documentation -- "when situation S occurs,
  organization performs action X"); (D) NORMATIVE FACT (Action-X-required/permitted/prohibited-under-
  condition-S, explicitly FUNDAMENTALLY DIFFERENT from a descriptive "Action X happened" -- normative versus
  descriptive, extending 0366 Section 4's epistemic-vs-normative-justification dichotomy specifically to the
  Fact level); (E) DERIVED FACT (F1+F2+F3 -> F4, "where reasoning becomes important"). Models KnowledgeOS as
  a RECURSIVE EPISTEMIC SYSTEM (a full ASCII diagram: OBSERVATIONS -> previous doings -> determinations ->
  [ACTIONS, PRINCIPLES, METHODS] -> NEW EVIDENCE -> NEW CLAIM -> DETERMINATION -> FACT), explicitly noting
  KnowledgeOS accumulates "previous determinations that become evidence for later determinations" -- "a
  much deeper model" than simple fact-accumulation. Introduces an explicit CIRCULARITY-AVOIDANCE INVARIANT:
  if F1 was determined using F2 and F2 is later justified using F1, a circular-justification cycle
  F1->F2->F1 results; therefore every determined fact requires a JUSTIFICATION ANCESTRY, explicitly NOT
  necessarily a tree but potentially a DIRECTED GRAPH (F1->F3, F2->F3, F3->F4) -- explicitly connected to
  the Navya-Nyaya relational lens (0370) and the corpus's existing finding that claims/evidence/
  justification must not be collapsed into one object. Proposes a formal research-hypothesis definition of
  determination: "Fact determination is the disciplined establishment of a claim as warranted, based on
  observations and/or previously determined knowledge, under applicable principles, methods, and contextual
  constraints" -- yielding a clean three-part division: Determination != Extraction; Extraction supplies
  material; Determination establishes warrant; Admission records the resulting epistemic status -- directly
  consistent with the corpus's existing evidence/justification/epistemic-determination/knowledge
  distinction. Poses the recursive-grounding question ("where did the FIRST determinations come from?"),
  answered via an explicit cycle: Observation -> Evidence -> Determination -> Fact -> Future Evidence -> New
  Determination -- crystallized as "Knowledge has memory, but memory itself is not knowledge." Explicitly
  invokes the Ganesha lens (observation -> memory -> discrimination -> revision -> integration, first named
  at 0370) as "particularly powerful" for this recursive-memory model, and proposes the fundamental research
  question superseding Candidate->Knowledge: "How does a system move from what happened, to what was
  determined about what happened, to what can subsequently be used as a basis for determining something
  else?"
introduces:
  - concept: "Fact Determination != Fact Extraction, the direct answer to 0368's declared 'What is a Fact?' research focus: extraction retrieves material; determination establishes what that material warrants asserting; admission records the resulting epistemic status -- a clean three-stage division"
  - concept: "Fact-as-lineage formalization F=D(O,P,M,A,H): a determined fact is a function of observations, previously established principles, established methods, previous actions/doings, and historical determinations, via a determination process D -- generalizing the simple Observation->Fact model into a recursive, multi-input determination"
  - concept: "Five-kind fact taxonomy: Observed fact (Observation->Fact); Historical fact (O1,...,On->H, already an inference); Procedural fact (extracted from established doing/method, not documentation); Normative fact (required/permitted/prohibited, explicitly distinguished from descriptive facts -- extends 0366's epistemic-vs-normative dichotomy to the Fact level itself); Derived fact (F1+F2+F3->F4, where reasoning matters)"
  - concept: "Recursive epistemic system model: KnowledgeOS accumulates 'previous determinations that become evidence for later determinations,' not merely facts -- a full ASCII pipeline (OBSERVATIONS -> previous doings -> determinations -> [ACTIONS,PRINCIPLES,METHODS] -> NEW EVIDENCE -> NEW CLAIM -> DETERMINATION -> FACT)"
  - concept: "Circularity-avoidance invariant via justification ancestry as a DIRECTED GRAPH (not necessarily a tree): F1->F3, F2->F3, F3->F4, explicitly preventing circular-justification cycles F1->F2->F1 -- connected to the Navya-Nyaya relational lens (0370) and the corpus's claims/evidence/justification non-collapse finding"
  - concept: "Formal research-hypothesis definition of determination: 'the disciplined establishment of a claim as warranted, based on observations and/or previously determined knowledge, under applicable principles, methods, and contextual constraints'"
  - concept: "Recursive grounding cycle answering 'where did the first determinations come from?': Observation -> Evidence -> Determination -> Fact -> Future Evidence -> New Determination -- crystallized as 'Knowledge has memory, but memory itself is not knowledge'"
  - concept: "Explicit invocation of the Ganesha lens (observation->memory->discrimination->revision->integration, introduced at 0370) as the natural formal framework for the recursive-memory model, and the proposed fundamental research question superseding Candidate->Knowledge: how does a system move from what happened, to what was determined about it, to what can subsequently ground further determinations?"
