  - concept: "Three-type completeness taxonomy: Actual completeness (D_t=D*, generally unknowable), Demonstrated completeness (evidence of exhaustion relative to a bounded universe), Apparent completeness (no further dimensions currently discovered) -- with ApparentComplete does-not-imply Complete"
  - concept: "Four-way dimension taxonomy: Primitive Dimension, Derived Dimension, Relationship Dimension, Meta Dimension"
  - concept: "Truth(P) vs Determination(P) as a distinct pair: a proposition can be objectively true while its determination remains undetermined because nobody has yet discovered the evidence -- named one of the most important missing foundational distinctions"
  - concept: "Delta-Reality != Delta-Knowledge: state change (the world actually changing) and knowledge change (discovering something that was already true) are explicitly independent"
  - concept: "Explicit three-layer discipline for the Lord Lens: Religious claim / Philosophical interpretation / KnowledgeOS abstraction must remain separate, with an explicit retrospective warning that the recent Lord Lens arc 'sometimes gets too close to' collapsing these"
  - concept: "R_t / S*_t / K_t whiteboard reduction: actual observed reality/state, ideal complete characterization of that state, and current justified knowledge representation, with K_t->S*_t as directional convergence, K_t!=S*_t as a permanent gap, and S*_t subset-of Omega connecting to the Lord/Zero lens division of labor"
  - concept: "Explicit methodological pivot: the corpus should now focus on rigorously defining R_t/S*_t/D*/K_t/evidence/reason/determination and their transformations rather than adding further philosophical lenses"
  - concept: "Candidate six-component Context formalization: C=(BoundedContext,Environment,Purpose,Time,Actor,RuleSet)"
  - concept: "Ideal value V*(d,O,C,t) vs estimated value V-hat(d,O,C,t), with KnowledgeGap=V*-V-hat when the value space admits a numeric difference -- formally connecting the corpus's original 'difference between actual and ideal state' intuition to the current model"
  - concept: "Call for a formal Lens Contract: Lens(O,K)->? left undefined, with seven candidate lens functions enumerated (discover dimensions, transform statements, challenge assumptions, generate hypotheses, classify evidence, calculate values, detect contradictions)"
  - concept: "Zero's undefined output schema: candidate Zero(K)={MissingDimension,UnknownValue,MissingEvidence,Assumption,Conflict,...}"
  - concept: "Recalculation's undefined scope: candidate targets Values/DerivedStatements/Confidence/Relationships/Decisions/Risk/Completeness, proposing an Impact(NewDimension,K_t) function and dependency graphs as the needed mechanism"
  - concept: "Decision-sufficiency named explicitly undefined despite Knowledge-completeness != Decision-sufficiency being established: who determines sufficiency, and according to what rule, remains open"
