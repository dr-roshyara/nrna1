defines:
  - concept: "The federation-of-semantic-state-machines architectural decision"
    definition: "KnowledgeOS's central state-modeling resolution, directly answering 0827's self-named 'biggest unresolved issue': the system is neither one monolithic Cartesian-product state machine (which suffers combinatorial explosion and, more fundamentally, forces semantically unrelated dimensions like Evidence-verification and Governance-approval to be tracked as one indivisible tuple) nor a collection of fully disconnected, uncoordinated services -- instead it is a federation of independently-governed state spaces (Domain/Epistemic/Governance/Decision/Execution/Outcome), each with its own invariants and lifecycle, interacting only through explicit semantic contracts, controlled consistency guarantees, and a persistent cross-cutting lineage mechanism"
  - concept: "The rigorous aggregate-boundary criterion"
    definition: "A precise DDD test replacing vague justifications for aggregate membership: two objects belong to the same aggregate if and only if they share a transactional invariant that requires atomic (all-or-nothing, immediately-consistent) enforcement -- explicitly NOT because they are conceptually related, both loosely 'knowledge,' or merely co-located in the same database; an Assessment referencing multiple Evidence items via immutable references, allowing the Evidence to evolve independently outside the Assessment's aggregate boundary, is the file's worked example of applying this criterion correctly"
  - concept: "SystemHistory⊆RealityHistory (epistemic humility about lineage completeness)"
    definition: "The genuinely new architectural extraction from the recurring Krishna/'only Krishna knows' lens: even when a system's lineage mechanism successfully preserves the complete history of everything it has recorded, that recorded history is not guaranteed to be the complete history of what actually happened in reality, because genuinely missing evidence (E_missing≠∅) can exist outside what the system ever captured -- so the existence of complete SYSTEM lineage must never be mistaken for completeness of knowledge about the external world, formalized as Invariant I75 and flagged as particularly important for AI and statistical inference (an AI reasoning only from recorded system history could otherwise silently assume that history is exhaustive)"
