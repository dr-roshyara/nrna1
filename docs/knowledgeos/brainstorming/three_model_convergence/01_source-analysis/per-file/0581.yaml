defines:
  - concept: "Conditional information gain"
    definition: "IG(E_2;H|K_t) — the reduction in entropy about H provided by new evidence E_2 relative to the CURRENT knowledge state, not relative to zero prior knowledge; the operationally correct quantity for KnowledgeOS"
  - concept: "Decision-theoretic Value of Information"
    definition: "VOI(q)=𝔼_{E_q}[max_a EU(a|K_t,E_q)] - max_a EU(a|K_t) - Cost(q) — the expected improvement in the best achievable expected utility from acquiring evidence via information-gathering action q, net of its cost"
  - concept: "EpistemicZero vs OperationalZero"
    definition: "OperationalZero = gap between current and target WORLD state; EpistemicZero = gap between current KNOWLEDGE and the knowledge required by the epistemic contract — two mathematically distinct quantities that can diverge substantially"
  - concept: "The three separated value metrics"
    definition: "Information Gain (IG, mathematical uncertainty reduction) ≠ Knowledge Gap Reduction (KGR, epistemic contract satisfaction) ≠ Decision Value (DV, actual decision improvement) — genuinely distinct dimensions that must not be collapsed into one number"
  - concept: "Lord's refined optimization formula (provisional)"
    definition: "Lord(q)≈argmax_q [ExpectedReductionInDecisionCriticalGap(q)/(Cost(q)+Risk(q))] — prioritizing the decision-critical portion of the epistemic gap specifically, not the epistemic gap generally"
