about: >
  "23 — GĪTĀ Ch 10-15 AS A KERNEL-RECONSTRUCTION LENS," verdict "The disciplined lane does what
  `external_research` claimed to do: it TYPE-CHECKS its composition. Result -- a FOUR-way separation adding
  the kernel `𝓜` as a distinct object, a kernel identity invariant that re-derives `25I.30` one level up, and
  a THIRD `T4-SHAPE`. Still 0 new primitives." The culminating file of an 8-file cumulative composition
  sequence, and the third in this sub-arc's escalating chain of disciplined kernel-shape attempts (following
  the already-tracked files 1098's `𝕂=(K_t,Ω_K,ℐ)` and 1100's five-slot operation-identity schema).

  **DELIVERS THE DECISIVE, STRIKING DISCIPLINE CONTRAST, DIRECTLY EXTENDING THE ALREADY-TRACKED FILE-1096/
  1100 THEME**: on EXACTLY the same subject matter where the already-tracked `external_research` `Θ_total`
  failed (all four composition junctions ill-typed, files 1096/1100), this lane's composition `τ∘δ∘Z`
  ($Z:K_t→G_t$, $δ:(K_t,G_t,E_t,C_t)→D_t$, $τ:(K_t,D_t)→K_{t+1}$) IS TYPE-CORRECT: "0 of 4 ill-typed" (in
  fact 0 of 3 junctions for this 3-operator composition, versus `Θ_total`'s 5 operators and 4 of 4 ill-typed
  junctions). Also explicitly respects the ratified 5-axis `Σ` (unlike `Θ_total`'s already-tracked flattening
  defect, file 1096's `E2`). Boxed: "Same source material. Opposite discipline. The type-checking lane
  produced the usable result -- and it is the one that CLAIMS LESS" (self-declared "must not yet be declared
  canonical" versus `Θ_total`'s "Complete").

  **INTRODUCES THE KERNEL `𝓜` AS A FOURTH DISTINCT OBJECT, EXTENDING THE ALREADY-TRACKED `C1` CONSTRAINT INTO
  A FOUR-WAY SEPARATION**: `𝒩≠𝓜≠K_t≠𝒦` (knower, kernel, state-at-t, potentially-unbounded knowledge space).
  Derives `𝓜≠𝒩` from Ch 6 §15's already-tracked "'the mind' is NOT the Knower." **Discovers a genuinely
  important new question the corpus has never asked, `G-94`**: "Is `𝓜∈K`? NEITHER ANSWER IS FREE": if
  `𝓜∈K`, the kernel is self-referential and `δ`/`τ` must handle a state containing their own implementation;
  if `𝓜∉K`, then "`258.9`'s congruence condition is UNDER-SPECIFIED -- congruence quantifies over `T∈𝒯`,
  and `𝒯` would live OUTSIDE the state being compared." Classified NOT ESTABLISHED, explicitly "feeds `N-4`
  AND congruence" -- directly connecting to two already-tracked central blockers.

  **DELIVERS A KERNEL-LEVEL IDENTITY INVARIANT THAT PRECISELY RE-DERIVES THE ALREADY-TRACKED `25I.30`/`258.2`
  PATTERN ONE LEVEL UP**: `Identity(𝓜_t)=Identity(𝓜_{t+1})` while `K_t≠K_{t+1}` is permitted -- "persistent
  kernel identity + mutable epistemic state," exactly `25I.30`'s already-tracked shape at the assertion level
  ("KnowledgeIdentity is persistent; KnowledgeState evolves"), applied prospectively to the kernel itself
  BEFORE any construction has violated it (unlike the assertion level, where the already-tracked `id=H(...)`
  construction, files 1041/1048/1088, already DID violate the pattern). Delivers the precise, disciplined
  reasoning for why this timing matters: "stating it now is CHEAP, and stating it later would NOT BE." Still
  explicitly `[H]`: it presupposes kernel identity, and "a kernel has no identity rule either. The invariant
  is well-formed and has no subject."

  **DELIVERS THE KERNEL SIGNATURE `𝓜=(𝕊,𝕆,∘,δ,τ,𝕀)`, "THE THIRD `T4-SHAPE`" AND EXPLICITLY "THE MOST
  COMPLETE OF THE THREE"**: type-checks over five carriers, four of which are entirely undefined (`G_t`
  gap/zero state -- no carrier anywhere, connects to already-tracked `𝒪`-vocabulary #6/`G-91`; `E_t` evidence
  -- already-tracked `Qualify=G1`; `C_t` context -- already-tracked `G-15` untyped; `D_t` decision -- a fifth
  rival codomain, see below), with only `Σ_t` genuinely defined. "Well-formed. Uninstantiable." Explicitly
  reconfirms the already-tracked Audit-H application: "shape → content needs a derivation, and none exists."

  **DISCOVERS TWO GENUINELY NEW DEFECTS**: `G-95`, a THIRD glyph collision (joining the already-tracked `𝒪`
  operations-vs-observations and `≅`/`≡` overloading collisions): this lane's `δ:(K_t,G_t,E_t,C_t)→D_t`
  ("discrimination," returning a decision) collides with the corpus's own already-established `δ(K,o)→K'`
  (the transition function, returning a state) -- "different codomains, same glyph," with this lane's own
  transition role actually assigned to `τ` instead. `G-96`: `Qualify` now carries a THIRD ROLE (already-
  tracked `G1` function; already-tracked `𝒪`-vocabulary member `Q`, file 1099; and now a decision OUTCOME
  value in the fifth rival codomain `{Accept,Reject,Uncertain,Contradictory,Investigate,Qualify}`, the fifth
  such rival codomain per the already-tracked `25S.3`/`38.10`/`012 §35`/`012 §36` sequence, file 1088).

  **DELIVERS A NINTH NEGATIVE CONSTRAINT, `C9`**: "`𝓜≠K_t` -- the kernel must not become identical to the
  state it produces."

  Confirms three unprompted self-refusals matching the already-tracked disciplined pattern: "'must not yet be
  declared canonical'," "'we cannot simply write `δ∘Z` unless their types match'," "'that does not mean the
  software kernel literally IS the philosophical mind.'"
