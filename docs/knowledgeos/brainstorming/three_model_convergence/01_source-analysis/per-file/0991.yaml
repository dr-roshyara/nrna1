about: >
  A genuinely executable Python script (a qualitatively significant artifact, continuing the pattern first
  seen in files 0974/0982) directly implementing Reviewer B's mandate (file 0989) sections E3 (hierarchy
  test), E4 (D285-5 revalidation), E5 (injectivity precision), E6 (identity-boundary separation).

  **DISCOVERS AND NAMES A FOURTH CORPUS EQUALITY RELATION NOT PREVIOUSLY TRACKED BY THIS RECONSTRUCTION**,
  citing a NEW corpus reference **"Step 246" / "[CORPUS 246]"**: the corpus defines FOUR relations, not
  three -- (A) structural `=` (byte/structurally identical), (B) semantic `==` ("encode the same knowledge
  semantics"), (C) observational `~` (every permitted observation gives the same result), and **(D)
  provenance-sensitive `=_lam`** (content AND relevant provenance equivalent) -- quoting the corpus directly:
  **"These are not interchangeable."** This directly extends this reconstruction's already-tracked
  three-level equality analysis (files 0982-0990) with a fourth, corpus-native relation.

  **E4 executes the concrete witness** (two `Assert` operations differing only in provenance metadata `Π`,
  "origin:scan" vs "origin:vendor") against all four relations: structural FALSE (Π inside id, different
  sets); semantic SUBSTANTIVE-BUT-QUALIFIED ("equal IF Π is discarded -- but that CHOICE is Decision 3,
  OPEN" -- a new corpus decision-point reference); observational holds under cardinality-only observation;
  provenance-sensitive FALSE by construction (explicitly compares Π).

  **E3 DELIVERS A GENUINELY IMPORTANT FORMAL DOWNGRADE**: tests whether the long-repeated corpus hierarchy
  `history⊊structural⊊semantic` is itself CORPUS or DERIVED, concluding: **"'history' equality is NOT among
  [the corpus's four relations]... the HIERARCHY is a verification-lane construct (DERIVED), not CORPUS."**
  What IS actually testable from the corpus's own four relations: `structural⊊semantic` is WITNESSED (strict,
  via the executed example); `provenance⊆semantic` holds BY DEFINITION (D is defined as semantic+Π);
  observational is "NOT comparable without fixing the permitted-observation set."

  **E5 DELIVERS A SUBSTANTIVE CORRECTION TO D285-5'S OWN CENTRAL CLAIM**: explicitly rejects "delta is
  non-injective" and "delta is non-injective in o" as overclaims; the precise, defensible statement is only
  "there EXIST `o1≠o2` and a state `K0` such that `δ(K0,o1)==_semantic δ(K0,o2)` under a semantic projection
  that DISCARDS Π" -- **"non-injectivity MODULO a chosen semantic quotient... NOT a property of δ. It is a
  property of δ COMPOSED WITH that quotient. Under the corpus's relation D (provenance-sensitive), the same δ
  IS injective on this witness."** Concludes: "D285-5 does not establish non-injectivity of δ."

  **E6 DELIVERS A SELF-CORRECTION**: separates D285-5's property (an equivalence-relation/quotient choice on
  states) from the previously-mentioned `grantId` collision (an ID-ASSIGNMENT defect on a different object,
  authority acts) as genuinely different layers, concluding "D285-5 does NOT imply a general identity rule
  for authority acts. Citing it as motivation for typing `humanActRef` is an OVERREACH. **(Correction to my
  own R5.)**" -- a further disciplined self-correction in the pattern already established by files 0982's/
  0985's reflexive corrections.
