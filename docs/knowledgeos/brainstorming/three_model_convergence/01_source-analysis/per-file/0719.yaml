about: >
  Opens declaring entry into "the evidence phase," reaffirming the FACT/DERIVED/HYPOTHESIS/TARGET discipline
  from 0718 with a worked archaeology-principle chain (`Artifact→Observation→Semantic Interpretation→
  Architecture Classification`, illustrated: `.claude/memory/foo.md exists`→FACT: persistent local memory
  exists→DERIVED: Claude has persistent contextual state→QUESTION: is that state authoritative?→
  classification — explicitly warning against jumping directly to "Claude memory is the KnowledgeOS
  knowledge base"). **This file constitutes the THIRD consecutive file in the 0717→0718→0719→0720 mode-
  change arc to defer genuine empirical archaeology**: every data-gathering table introduced (the eight-row
  Knowledge authority matrix at §133.8, the eight-row Claude/Codex symmetry test at §133.30) is populated
  entirely with `?` placeholders; every worked example (the `verify-package-structure.sh` checker, the
  session-change logger, the D42/D17/D31 duplicate-authority scenario) remains explicitly hypothetical or
  illustrative rather than an actually inspected artifact. The file's own closing section again reframes the
  still-undone archaeology as the next step's job (Step 134, "Actual Repository Reconstruction") — the
  fourth consecutive promise of the same concrete empirical transition. Per the 0694 calibrating
  meta-finding, this is recorded factually without further escalating framing, since 0717 already carries
  the "sharpest promise" designation; this file's specific contribution to the pattern is being the third
  deferral in that particular arc.

  Despite the continued non-fulfillment, delivers substantial new, genuinely reusable methodology.
  `DirectoryStructure≠Architecture` (worked example: a file misleadingly named `domain/KubernetesClient.java`
  shows physical naming can mislead; dependency evidence is required, not directory names). The critical
  data question for every knowledge-bearing store: "is this authoritative, derived, cached, temporary, or
  merely a pointer?" — "this single classification will resolve many of the current KnowledgeOS
  architectural ambiguities."

  **Delivers an eight-way Artifact classification taxonomy, more granular than any prior scheme**:
  Authoritative (establishes binding organizational truth), Derived (generated from authoritative
  information), Observational (represents something observed in reality), Evidentiary (supports a claim),
  Operational (controls execution), Contextual (helps an agent reason but is not authoritative), Temporary
  (valid only for a limited workflow/session), Historical (preserves previous state) — worked through
  concrete illustrative classifications: `AGENTS.md`=Operational+Contextual (not AuthoritativeArchitecture,
  if pointer-structured); `.claude/settings.json`=OperationalConfiguration (not EnterpriseGovernanceTruth);
  hooks=Operational+Assurance; memory=Contextual, never automatically Authoritative ("that transition
  requires governance").

  Delivers the Knowledge-promotion pipeline `ContextualKnowledge→CandidateClaim→Verification→
  AuthoritativeKnowledge`, "a central KnowledgeOS capability," worked through a concrete Claude-discovery
  example ("Service A appears to use Database B" is a `Claim_candidate`, never a `Fact_authoritative`, until
  evidence and verification promote it) — directly extending 0716's/0714's candidate-relationship promotion
  lifecycle to knowledge-item promotion specifically.

  Delivers Evidence archaeology (enumerating existing mechanisms that may already record commands/tool
  calls/test results/repository state/checks/runtime observations/agent changes/approvals — "the important
  question is whether they are connected"), a Fragmented-evidence diagram showing siloed logs with no
  cross-references, and an Evidence-integration test: "can we traverse from the change to its authorization,
  implementation, evidence, and verification?" — a broken chain is recorded as a `TraceabilityGap`.

  **Delivers the R0 through R5 Registry maturity ladder** (Name list→Structured catalog→Identity+metadata→
  Relationships→Provenance+lifecycle→Evidence-backed governance) — a fourth maturity ladder (after 0718's
  G0-G6/K0-K6/A0-A6), specifically for the registry. **Delivers a genuinely valuable pragmatic insight
  directly reinforcing 0717's/0718's migration and anti-duplication principles**: "the registry may be more
  important than expected" — if the existing registry already provides Identity+Relationships+Lifecycle+
  Provenance, "creating a new 'Knowledge Graph' could be unnecessary. Instead: `ExistingRegistry→Strengthen→
  AssuranceGraph`. This is exactly why archaeology must precede implementation."

  **Delivers the important ADR≠Decision-entity distinction**: an ADR file's actual architectural role could
  be (1) the authoritative decision itself, (2) a document representing a decision, (3) evidence supporting
  a decision, or (4) a historical artifact — "those are architecturally different," extended by Decision
  lifecycle archaeology (`Draft→Review→Approved→Effective→Superseded`) with the honest caution that a bare
  `ADR-042.md` file alone represents "documentation, but not necessarily a full governance model." Delivers
  Assurance archaeology (a Check-object field checklist: Rule/Implementation/Input/Execution/Result/
  Evidence) and the Assurance lineage `Principle→Rule→Checker→Execution→Result→Evidence`.

  Delivers Session-change-logger archaeology ("`LoggerExists≠CompleteTraceability`" — a logger must record
  actor/task/repository/action/authorization/resulting state to be genuinely useful evidence) and the Agent
  execution chain (`Task→Session→Context→Tool→Action→Change→Evidence→Verification`, "if some links are
  missing, those become explicit gaps"). Delivers the Symmetry-does-not-mean-identical-files clarification
  (Claude's `.claude/settings.json`/`commands/`/`hooks/` vs. Codex's `.codex/`/`AGENTS.md` — "acceptable";
  the actual question is `SemanticContract_Claude=SemanticContract_Codex?`) and a refined Agent-pointer-layer
  diagram.

  Delivers the Current Architecture Record template (fifteen fields: System, Version/Date, Repository,
  Components, Dependencies, Data Stores, Agent Interfaces, Governance, Assurance, Integrations, Runtime,
  Evidence, Known Constraints, Known Gaps, Confidence — "each major statement should link to evidence") and
  a three-level Confidence scale (High/Medium/Low), worked with two contrasting examples.

  **Delivers "Architecture uncertainty is data," a genuinely valuable epistemic-discipline extension**:
  rather than hedging in prose ("the system probably does X"), an uncertain claim should be recorded as a
  structured object (`Claim`, `Status: UNKNOWN`, `Evidence required: [...]`) — "Unknown becomes a first-class
  reconstruction result" — directly extending the corpus's long-standing Unknown-preservation discipline
  (0693/0699/0708/AFR-10) into documentation-practice terms specifically.

  **Delivers seven named Reconstruction finding types, a genuinely valuable, more precise alternative to
  generic "technical debt"**: `MissingCapability, SemanticAmbiguity, ArchitectureViolation, TraceabilityGap,
  DuplicateAuthority, StaleKnowledge, UnverifiedAssumption`. **Delivers a vivid, sharply worked "Duplicate
  Authority" scenario**, the most concrete illustration of authority conflict in the reconstruction to date:
  three separate sources (KnowledgeOS, `AGENTS.md`, Claude memory) each independently claim a DIFFERENT
  decision (D42/D17/D31) is currently in effect — "this is not merely documentation inconsistency. It is:
  `AuthorityConflict`" — with the precedence resolution `GovernedAuthority>GeneratedContext>AgentMemory`,
  explicitly requiring governance, "the agent should not decide which source 'feels newer.'"

  **Delivers a new named invariant, AAI-01** ("Architecture Archaeology Invariant"): "no architectural
  conclusion may be promoted from hypothesis to fact without supporting evidence" — a new, distinctly-named
  single-member invariant series, notationally separate from the A/C/K/S/AFR families tracked earlier.

  Delivers the next concrete artifact's template ("KnowledgeOS Current Architecture Inventory," fifteen
  sections: Repository Topology through Target Delta) and "what we must NOT do yet" — an explicit list of
  premature technology decisions to avoid (PostgreSQL vs. graph DB, microservices vs. modular monolith,
  Kafka vs. synchronous APIs, vector DB, a new KnowledgeOS service, a new evidence database, replacing the
  existing registry) — "first: understand the existing system" — directly reinforcing 0716's "DDD comes
  before technology selection."

  Delivers Step 133's verdict — again a mode-transition DECLARATION rather than a fulfilled transition
  ("the KnowledgeOS investigation has transitioned from Conceptual Design to Evidence Based Architecture
  Archaeology," though no actual evidence was gathered in this file) — with the fundamental chain
  `Artifact→Fact→Relationship→Current Architecture→Fitness Assessment→Target Delta` and **the memorable
  capstone caution: "do not build a second KnowledgeOS while investigating the first"** — directly matching
  this reconstruction's own and this repository's own anti-duplication/Canonical-Discovery discipline.

  **Closes by opening "Step 134 — Actual Repository Reconstruction," the fourth consecutive promise in the
  0717-0720 mode-change arc**: "the next step is therefore no longer another conceptual model. We need to
  inspect the actual KnowledgeOS artifacts and populate the Current Architecture Inventory," with a
  nine-step per-component analysis template (What exists? → What does it own? → What does it depend on? →
  What knowledge does it contain? → What authority does it have? → What evidence does it produce? → Which
  bounded context does it belong to? → Which target capability does it satisfy? → What is
  missing/misaligned?), promising "the first genuinely evidence-backed CURRENT KNOWLEDGEOS ARCHITECTURE." No
  actual code execution, repository inspection, or verified filesystem/architecture claim reported anywhere
  in this file — every table, ladder, and worked scenario remains hypothetical.
