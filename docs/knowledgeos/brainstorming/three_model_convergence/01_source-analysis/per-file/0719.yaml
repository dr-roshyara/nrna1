defines:
  - concept: "Eight-way Artifact classification"
    definition: "Every architecturally significant artifact should be tagged with one or more of: Authoritative (establishes binding truth), Derived (generated from authoritative information), Observational (records something observed), Evidentiary (supports a claim), Operational (controls execution), Contextual (aids agent reasoning without being authoritative), Temporary (valid only within a limited workflow/session), or Historical (preserves prior state)"
  - concept: "Duplicate Authority"
    definition: "A finding in which two or more sources independently and inconsistently claim to be authoritative for the same semantic fact (e.g. three different sources each naming a different decision as 'currently in effect'); this is categorically different from mere documentation inconsistency because it represents an unresolved authority conflict requiring an explicitly governed precedence rule, never an agent's ad hoc judgment about which source 'feels newer'"
  - concept: "AAI-01"
    definition: "No architectural conclusion may be promoted from hypothesis to fact without supporting evidence — the governing discipline for the entire archaeology phase of the reconstruction"
  - concept: "Architecture uncertainty is data"
    definition: "Rather than expressing uncertainty as hedged prose, an unresolved architectural claim should be recorded as a structured object with an explicit UNKNOWN status and a list of the specific evidence that would resolve it, making 'unknown' a first-class, queryable reconstruction result rather than an implicit gap"
