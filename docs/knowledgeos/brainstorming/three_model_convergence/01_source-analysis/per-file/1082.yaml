about: >
  "05 — Dependency Graph, Recomputed (mandate §9)." Reports the executed output of `exec/t291_bootstrap.py`
  (already tracked as file 1075's script), the first fully three-way-separated (`𝒪`, `𝒯`, `𝒪_K` distinct)
  dependency-graph audit of the entire equality/kernel research programme: 29 nodes, 44 edges.

  **DIRECTLY CLOSES FILE 1075'S OPEN QUESTION, CONFIRMING WITH FRESH MEASUREMENT THAT THE ALREADY-TRACKED
  `{≡}` UNIQUE MINIMAL BOOTSTRAP CUT (files 1052, 1069) SURVIVES THE FULL THREE-WAY SEPARATION**: cycles drop
  from Step 289's 4 to exactly 3 (matching Step 290's already-tracked prediction, file 1069, verbatim: "Step
  290's prediction confirmed independently... Measured: 3"); `{≡}` remains acyclic and is reconfirmed the
  UNIQUE size-1 cut, now "over 13 resolvable nodes"; `𝒪`, `𝒯`, and `𝒪_K` are each measured to be in ZERO of
  the three cycles (`𝒪_K` measured for the first time as a separated node, confirming it is not itself
  cycle-bearing); `≡` remains in all three cycles. Lists the three cycles explicitly: `congruence→≡→
  congruence`; `congruence→≡→δ→congruence`; and the already-tracked Z-3-lineage cycle now remodelled as
  `≈→≡_cand→≡→bindings→≈` (the candidate-edge remodelling directly implementing file 1069's Z-1 correction).

  **DELIVERS A GENUINELY IMPORTANT NEW STRUCTURAL MEASUREMENT NOT PREVIOUSLY QUANTIFIED**: "Cutting ALL THREE
  of `𝒪`, `𝒯`, `𝒪_K` STILL LEAVES THE GRAPH CYCLIC" -- directly confirmed by probe (`cut ['O','O_K','T'] ->
  False`), reinforcing the already-tracked acyclicity-boundary-vs-derivation-boundary distinction (file 1052)
  with fresh, more precise evidence: the derivation boundary `{𝒪,𝒯,𝒪_K}` unblocks exactly SEVEN named edges
  when cut (`𝒯→δ`, `𝒪_K→≈`, `𝒪→Π`, `𝒪→bindings`, `𝒪→assess_det`, `𝒯→congruence`, `𝒯→≡_𝒯`) while leaving the
  equality cycles fully intact. Boxed capstone, sharpest formulation yet of this already-tracked distinction:
  "`{≡}` breaks the CYCLES; `{𝒪,𝒯,𝒪_K}` unblocks the DERIVATION. Different structural roles, neither
  substitutable."

  **DELIVERS A DISCIPLINED §18 DEGENERACY CHECK CONFIRMING THE ZERO-RESULTS ARE SUBSTANTIVE**: "Recorded
  because the `≈_∅` incident makes this mandatory" -- directly citing the already-tracked degeneracy-audit
  discipline established after the universal/discrete degenerate-endpoint discovery (files 1057-1058, 1068,
  1077).

  Confirms the STATUS block's honest closing admission: "UNKNOWN whether edges this list omits exist" --
  maintaining the disciplined scope-limitation already established across the entire bootstrap-cut research
  thread (files 1052, 1075).
