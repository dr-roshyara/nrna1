    refinement: "CONTRADICTED by this file's own table, which glosses π as 'policy' -- a small, directly checkable internal notation inconsistency within the corpus's own kernel presentation, the reconstruction's fifth distinct confirmed notation-drift finding (after the I-series collisions and the three/four/five Gita-taxonomy variants)"
