    specified relative to their dynamical validity-making conditions -- proposed as a candidate foundational
    KnowledgeOS research axiom, the single most important extraction from the book"
  - "Ten new candidate concepts explicitly logged as a dedicated 'Condition-Structured Knowledge' research
    thread, not Kernel changes: ValidityContext, Perspective, EvidenceEvaluation, KnowledgeTransition,
    OpenInvestigation, RobustnessProfile, AdaptiveOption, SystemBoundary, Model, ModelPurpose"
  - "Dynamical perspectivism / poly-ocularity explicitly distinguished from relativism: multiple
    perspectives != multiple realities, all reconstructible from a sufficiently complete underlying model"
  - "The ontic/epistemic distinction (Bishop) and faithful-model-assumption warning: SYSTEM, MODEL-OF-
    SYSTEM, OBSERVATION-OF-SYSTEM, and INTERPRETATION-OF-OBSERVATION must remain four distinct layers,
    directly preventing AI-generated models from being silently treated as reality"
  - "Process metaphysics reversing the classical default: change is default, stability/persistence is what
    requires explanation -- challenging Git-style versioning to ask what invariant pattern unifies
    successive states of the same evolving knowledge object"
  - "Boundaries-are-hypotheses: system/environment and part/whole distinctions are pragmatic, not inherent,
    reinterpreting DDD bounded contexts as deliberately selected boundaries rather than metaphysically
    isolated objects"
  - "Emergence-is-not-mere-complexity: a precise bifurcation-based definition distinguishing self-
    organization from organization proper, warning against inferring domain boundaries from mere component
    co-membership"
  - "A non-monotonic epistemic ladder (Observation->Pattern->Correlation->Model->Mechanism->Explanation->
    Validated invariant) where promotion between any two levels is never automatic -- directly targeting
    AI-generated pattern-vs-mechanism conflation"
  - "The 'Russell Chicken' example as a concrete demonstration that rational inference from identical
    evidence can fail catastrophically under a wider context -- motivating an EvidenceEvaluation object
    replacing static evidence-supports-claim booleans"
  - "Open-vs-closed-problem formal distinction (Brinsmead & Hooker), motivating an OpenInvestigation object
    distinct from a Question or Closed Work Item"
  - "Problem-solution co-evolution (SDAL/double-loop model): new information can change the problem
