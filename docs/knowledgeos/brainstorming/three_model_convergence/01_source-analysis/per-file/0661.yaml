defines:
  - concept: "The four-change attribution problem (WorldChange/KnowledgeChange/DecisionModelChange/PolicyChange)"
    definition: "A change in a system's decision output can originate from four fundamentally distinct causes — the world itself changing, the system's knowledge of the world changing, the organization's values/decision model changing, or the applicable policy changing — and KnowledgeOS must be able to distinguish which cause(s) actually produced any given decision change, rather than conflating them into an undifferentiated 'the recommendation changed'"
  - concept: "Learning≠SelfAuthorization"
    definition: "An AI agent operating within KnowledgeOS may learn, perform inference, and propose changes within its designated capability boundary, but it cannot silently or autonomously redefine the governance (policy, decision model, objectives) under which it itself operates; legitimate model evolution requires an explicit ObservedOutcomes→ModelEvaluation→ModelProposal→GovernanceReview→ApprovedModel loop — AI-assisted governance, never AI-controlled governance"
  - concept: "OptimalUnderModel≠GovernanceSelected"
    definition: "A governance body may deliberately select an action that is not the mathematically optimal one under the current decision model, for legal, ethical, strategic, fairness, or public-trust reasons not captured in the formal utility function; this override is a legitimate governance action requiring an explicit OverrideReason record, and must never be disguised as though it were itself the mathematical optimum"
  - concept: "Approved≠CurrentlyApplicable"
    definition: "A governance artifact (policy, decision model) can be formally Approved while not yet Effective (e.g. scheduled for a future EffectiveFrom date); approval status and current applicability are two distinct properties that must not be conflated"
