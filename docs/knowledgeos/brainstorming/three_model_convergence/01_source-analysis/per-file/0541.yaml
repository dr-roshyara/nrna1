about: >
  Opens with an explicit incremental discipline: "we will proceed one step at a time, and I will not jump
  ahead until each step is mathematically and architecturally defensible," beginning with "Step 1:
  Operational Independence." Poses the concrete question: "Can KnowledgeOS determine whether two evidence
  items are independent using computable information?"

  **Delivers the file's foundational distinction**: True Independence (a metaphysical fact KnowledgeOS
  cannot generally prove) versus Operationally Established Independence (independence relative to an
  explicit, declared evidence model), formalized as
  `Ind_ρ(e_i,e_j,G,C)->{Independent,Dependent,Unknown}`. Defines the inspectable evidence-metadata tuple
  `M(e)=(Source,AcquisitionEvent,Timestamp,Actor,Method,ParentEvidence,Transformation,Location,Content,
  Context)`, worked through a concrete DB-observation-vs-LLM-summary pair.

  **Delivers a first fully deterministic rule**: if `e_i⤳e_j` in the provenance graph, then
  `Ind(e_i,e_j)=Dependent`, requiring no LLM judgment at all. **Delivers a common-ancestry finding**: two
  LLMs both reading the same document, with no direct edge between them, must default to `Unknown`
  independence rather than an assumed `Independent`, since `CommonAncestor(e_i,e_j)⇒Independent≠Confirmed`
  unless the policy supplies a justified conditional-independence model. **Delivers an important negative
  finding**: different sources do NOT automatically mean independent -- two documents both ultimately from
  Reuters are not proven independent merely because their URLs/records differ -- `DifferentSource⇏
  Independent`. **Delivers the corresponding positive case**: two genuinely separate sensors with
  independent acquisition mechanisms, hardware, and provenance CAN be established as
  `OperationallyIndependent` under a declared policy -- "notice the word operationally."

  **Delivers the file's central representational innovation**: rather than a Boolean or scalar, independence
  is represented as a vector `I(e_i,e_j)=(i_S,i_A,i_P,i_M,i_T,i_C)` (Source, Acquisition, Provenance,
  Method, Temporal independence, and Common-ancestor status), each valued in
  `{Confirmed,Rejected,Unknown}`, explicitly rejecting a collapsed `IndependenceScore=0.87` since a single
  number "would obscure why the evidence is considered independent" -- delivering "much more auditable"
  structured output.

  **Formalizes the decision rule**: `Ind_ρ(e_i,e_j,G,C)` returns Dependent if dependency is established,
  Independent only if ALL required conditions hold (where "required" is explicitly policy-dependent -- a
  high-risk security decision may require very strong independence, exploratory research weaker), and
  Unknown otherwise. **Delivers a precisely-stated central epistemic principle**: the three-valued result
  `𝕀={I,D,U}` is strictly better than a Boolean `{True,False}` because `Unknown≠False` and `Unknown≠True`
  -- crystallized as "Absence of evidence for independence is not evidence of dependence, but neither is it
  evidence of independence."

  **Delivers a DDD `IndependenceAssessment` domain object** (EvidenceA, EvidenceB, SourceRelation,
  AcquisitionRelation, ProvenanceRelation, MethodRelation, CommonAncestor, Result, Policy, Basis,
  Timestamp), explicitly "a domain object, not merely a database flag," with two formal domain invariants:
  `Dependent(e_i,e_j)⇒¬Independent(e_i,e_j)` and `Unknown(e_i,e_j)⇒¬ConfirmedIndependent(e_i,e_j)`.

  **Works through six concrete test cases with explicit expected results**: exact duplicate ->
  Dependent/SameContribution; LLM transformation of a source -> Dependent; two LLMs reading the same
  document -> Unknown (absent a justified conditional-independence model); two genuinely independent
  sensors -> Independent under the declared policy; two websites copying the same underlying source ->
  Dependent/Correlated; missing provenance -> Unknown.

  **Delivers the file's central provisional law**: "Independence must be established, not assumed," with
  its computational form -- `Independence(e_i,e_j)=Confirmed` only when the declared policy's conditions
  are actually satisfied, `Unknown` otherwise.

  **Delivers the file's most important statistical nuance**: `OperationallyIndependent⇏
  StatisticallyIndependent` -- two sensors with genuinely separate acquisition events and hardware may
  still share the same environmental bias, so operational independence is only "evidence about possible
  statistical independence," never proof of it; a statistical model must still separately justify its own
  conditional-independence assumption (`P(E_1,E_2|H)=P(E_1|H)P(E_2|H)`) before Bayesian multiplication is
  applied -- "exactly why Evidence Architecture and Statistical Inference Policy must remain separate,"
  sharpening the corpus's Kernel/Policy boundary (0539) with a rigorous statistical justification.

  **Delivers the file's closing conclusion**: operational independence is "computable in a qualified
  sense" -- KnowledgeOS can deterministically inspect Provenance, Dependency, Common ancestry, Acquisition
  events, Sources, Methods, and Context to produce Independent/Dependent/Unknown per a declared policy, but
  "must not claim universal statistical independence merely from metadata."

  **Closes naming "Step 2"**: the Evidence Identity/Equivalence Calculus (largely already delivered at
  0540, but framed here as requiring testing "with concrete examples rather than defining it abstractly"),
  noting this is "where deterministic hashing, canonicalization, semantic comparison, provenance, and LLM
  assistance all meet."
