defines:
  - concept: "Precision≠Accuracy / Representational precision must not exceed epistemically justified precision"
    definition: "A system can output a numerically precise value (e.g. 87.3421%) that is nonetheless badly wrong (e.g. only 52% historically calibrated); the number of significant digits displayed must never exceed what the underlying evidence quality actually justifies, and qualitative source uncertainty ('likely') must never be silently converted into unjustified numeric precision"
  - concept: "Decision robustness (∀u∈𝒰:D(u)=A)"
    definition: "A decision is robust, not merely expected-value-optimal, if it remains the selected action across the entire specified plausible-uncertainty set, not merely at the point estimate/expected value of the uncertain parameters — a strictly stronger and more defensible criterion than D(E[u])=A"
  - concept: "Structural causal uncertainty"
    definition: "Uncertainty in a causal estimate can arise not only from numerical parameter imprecision (σ_β) but from unverified structural assumptions about the causal model itself (e.g. no unmeasured confounding); these two sources of uncertainty are qualitatively different and must both be exposed as AssumptionRisk when unverified"
