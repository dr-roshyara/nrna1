about: >
  "02 — Identity Register (mandate §5 · identity investigated INDEPENDENTLY of equality)."

  **§5.1 delivers the definitive eleven-identity-kind x twelve-question matrix** (Entity, Assertion, State
  `K_t`, History, Event, Operation, Authority-act, Policy, Provenance, Record, Knowledge-artifact `KAID`),
  the most comprehensive identity analysis in this reconstruction's entire tracking. **Score: only 2 of 11
  are established** (Assertion -- with the already-tracked live mutable-state contradiction; Provenance), **5
  of 11 are wholly absent** (State, Event, Operation, Authority-act, Policy).

  **§5.2 delivers two orthogonal identity axes**: by LEVEL (`EntityID≠KAID≠RecordID`) and by KIND (the eleven
  rows), with `25S.43`'s clarification that `KAID↔EntityID` is itself "an explicit, versioned semantic
  relationship -- not an equality, a relation requiring its own semantics."

  **§5.3 DELIVERS THE MANDATE'S DEFINITIVE FORMAL VERDICT ON `id=H(P,e,c,t,Π)`**: "Which is it: an
  established state identity definition, a candidate construction, a hash-based implementation suggestion, or
  something else?" -- Boxed answer: **"A hash-based IMPLEMENTATION SUGGESTION that is internally inconsistent
  -- NOT A DEFINITION."** Delivers the evidence in explicit strength order: (1) EXECUTED (file 1039's own
  demonstration, cross-referenced as "06§H"): withdrawal changes the id, dangling `ℛ`-edges violate
  `StructuralValid`'s own no-dangling clause; (2) EXECUTED (file 1039, "06§H"): canonicalization-dependence
  (key-order flips the hash); (3) CORPUS, ruling against this construction BEFORE it existed -- introduces two
  NEW corpus loci, **"258.2"** (boxed "Identity persistence ≠ value equality -- exactly what Revision
  requires") and **"258.18"** (the `(id=1,Proposed)` vs `(id=1,Accepted)` example, boxed "Identity alone
  cannot define Knowledge-State semantics"). Classification: **"CORPUS PRINCIPLE vs LATER CONSTRUCTION
  CONFLICT -- a governance matter, not an engineering fix,"** with the candidate repair (projecting mutable
  `state` out of `id`) explicitly "not adopted, not recommended as architecture."

  **§5.4 confirms `I_48`'s context-scoping as "the one place the equality/identity problem admits a real
  narrowing,"** already tracked (file 1038), while reiterating the unbound-parameter caveat.

  **§5.5 delivers the complete identity-orthogonality summary**: identity⊥lineage (`195.24`), identity⊥
  provenance (`261.9`, cross-referencing file 1041's new locus), `SameState⇏SameEntity`,
  `SemanticEquivalent⇏SameEntity`, `Similarity≠Identity`, `Reference≠Entity`.

  **§5.6 DELIVERS A GENUINELY NEW CRITERION FOR "WHEN DOES IDENTITY MATTER?"**: a formal operational-relevance
  test, `OperationalIdentity(x)⟺∃T∈𝒯: changing id(x) can change T(K,c)` (`258.20`), generalized to any
  property `p` via `Relevant(p)` (`258.21`) -- but explicitly caveated: **"Both quantify over `𝒯`, which is
  unenumerated. The criterion is correct and inapplicable"** -- a precise instance of the already-tracked
  pattern (files 1008, 1035, 1038) where a genuinely well-posed formal criterion is rendered unusable by the
  still-unenumerated operation/transformation space.

  **§5.7 delivers `38.76`'s boxed principle "Identity is itself knowledge,"** requiring its own status
  machinery (`IdentityStatus∈{Unknown,Candidate,Probable,Confirmed,Rejected,Contextual}`), reiterating the
  already-tracked `Closure(Identity)`/`AffectedKnowledge(x)` gap and the `G_I`-separate-graph structural
  tension with the kernel's reduced `ℛ`.
