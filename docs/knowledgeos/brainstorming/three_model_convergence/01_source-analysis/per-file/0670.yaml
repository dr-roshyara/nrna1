defines:
  - concept: "Individual rationality≠organizational rationality"
    definition: "There is no guarantee that an agent's utility function Ui aligns with the organization's utility function U_org; agents may be individually rational (utility-maximizing for themselves) while producing organizationally suboptimal or even harmful collective outcomes"
  - concept: "Metric≠Objective (Goodhart's Law formalization)"
    definition: "A measure M=f(S) that correlates with a desired state S under passive observation may decouple from S once an agent actively optimizes max M directly, since the optimization process can find ways to move M without moving S — governance metrics must not be silently treated as equivalent to the underlying objective"
  - concept: "NashEquilibrium≠OrganizationallyOptimal"
    definition: "A stable strategy profile where no agent benefits from unilaterally deviating (a Nash equilibrium) provides no guarantee of organizational optimality; a coordinated but individually non-incentivized alternative outcome can produce strictly higher organizational utility while remaining unreachable without external mechanism intervention"
  - concept: "Governance is only as strong as its uncontrolled bypass paths"
    definition: "A preventive governance control implemented at one interface (e.g. a governed deployment API) provides no protection if an agent can achieve the same effect through an alternative, uncontrolled path (e.g. direct infrastructure credentials); governance boundary analysis must account for all materially available execution paths, not just the primary governed one"
  - concept: "Unknown⇏Allowed"
    definition: "When authorization status cannot be determined (Unknown), the correct default for actions requiring authorization is Escalate, never a silent Allowed — an explicit strategic-domain extension of the corpus's established three-valued (True/False/Unknown) epistemic logic, since a strategic agent will otherwise exploit ambiguous authorization as if it were permission"
  - concept: "MetaGovernance"
    definition: "The rules and processes governing how governance mechanisms themselves may be changed (who may change rules, based on what evidence, how quickly, what review is required, how rollback works) are themselves a governed layer, distinct from and above ordinary governance; an agent autonomously rewriting governance rules upon detecting a gaming opportunity is a MetaGovernanceViolation regardless of whether the new rules would be objectively better"
