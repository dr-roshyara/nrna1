    refinement: "Given a concrete four-outcome admission function, a purpose-dependence principle connecting it to Ideal State discrepancy, and an explicit Admission≠Validation distinction clarifying what 'admitted' does and does not guarantee"
  - concept: "0528/0530's NumberOfAIOutputs≠AmountOfIndependentEvidence / EvidenceCount≠IndependentEvidenceCount findings"
    refinement: "Generalized from an LLM-specific observation into a general evidence-dependency-graph mechanism applicable to any evidence type, not only AI outputs"
  - concept: "The corpus's earlier equation Assertion=Knowledge"
    refinement: "Explicitly corrected to Assertion∈KnowledgeState with KnowledgeState≠SetOfAssertions, given a full structured Knowledge State tuple"
  - concept: "0492's Discrepancy Δ=(Δ_E,Δ_U,Δ_D) framework"
    refinement: "Given a concrete new source: a purpose-dependent admission policy mismatch against the Ideal State is itself classified as a Discrepancy rather than an invalid assertion"
