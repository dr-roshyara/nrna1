about: >
  "PROMPT INSTRUCTIONS: GAP UPDATE & METHODOLOGICAL STANDARDIZATION," status "EXECUTION AUTHORIZED," listing
  two input artifacts: `01-GAP-UPDATE-FROM-REVISED-286.md` (NOT YET DIRECTLY ENCOUNTERED by this
  reconstruction -- a new bridge candidate) and `02-GAP-UPDATE-FROM-HPA-REVIEW-D285-5.md` (= file 0985,
  already fully documented).

  **Parts 1-4 substantially restate content already documented via files 0985-0987**: the governing equality
  rule ("a property stated without naming its equality relation is not a well-formed proposition"); the
  per-artifact equality-relation table (D285-1 weak/D285-2 holds/D285-4 correct-no-equality/D285-5
  template/D285-6 corrected/D285-7 correct-no-equality); the Sañjaya recovery closing three gaps (`(W,Ω)`
  referent layer promoted `G3→G5`; `Observation` primitive closed as discovery gap; `Σ₀`/`Sañjaya_K` layer
  distinction); the `GK-13` Jñāna correction (Tripuṭī `Jñātā·Jñāna·Jñeya` = knower·knowing·known); the
  D285-6 correction (`(𝒜,ℛ)=_semantic π_K(K_t)`, not unqualified `=`).

  **Part 5 DELIVERS GENUINELY NEW, DIRECTLY USEFUL CONTENT: THE FORMAL H-K IDENTIFIER DISAMBIGUATION TABLE**,
  resolving two identifier collisions found in the corpus's own hypothesis register: **`H-K04`** was used for
  BOTH "Kṣetra-jña" (Part 3 of an earlier document) AND "Equanimity" (Part 15) -- disambiguated as `H-K04`
  (Kṣetra-jña) vs **`H-K04e`** (Equanimity); **`H-K06`** was used for BOTH "Karma" AND "Failed
  Action/Negative Knowledge" -- disambiguated as `H-K06` (Karma/Phala) vs **`H-K06f`** (Failed action,
  matching the already-tracked `H-K06f` posterior-changed criterion from file 0988); and **`H-K13`** is
  formally assigned to Jñāna. **This directly resolves an identifier-collision risk this reconstruction had
  not previously flagged as explicit**, and confirms `H-K06f`'s naming (already used without derivation in
  file 0988) traces to this exact disambiguation act.

  **Part 5 also formally records a Sañjaya mis-prioritization finding**: `GK-16 Sañjaya` was placed in
  "Priority 3 (exploratory)" by an earlier, not-yet-encountered prompt, when the evidence shows it belongs in
  Priority 1 (touches a named blocker, is a ratified primitive with a formalized corpus construct, and
  refines `GK-04` which the same prompt itself ranks Priority 1) -- recorded as "a recommendation to HPA," not
  a unilateral reclassification.

  **Part 6 delivers a consolidated eight-row gap register** (three closed by recovery, one corroborated
  absent, one irreducible blocker (`Qualify` has no body, `G1`) unchanged, two new items), closing "no
  innovation used anywhere."

  **Part 7 spells out, for the first time in full, the formally MANDATED seven-section D285-x template**
  (Property Statement/Trivial vs Substantive/Execution/Qualification/Equality Specification/Independence/
  Classification), explicitly exempting D285-8 ("not a test artifact and asserts no property").

  **Part 9 delivers a consolidated SIX-ITEM list of governing principles** boxed together for the first time:
  (1) every D285 hypothesis must be typed before testing; (2) every equality-dependent hypothesis must
  specify its equality relation; (3) a property without a named equality relation is not well-formed; (4)
  corroboration≠derivation, corroboration stronger when independently required; (5) the Gītā provides
  candidate distinctions, KOS research determines survival; (6) **"The corpus is richer than the model built
  from it"** -- a new, pithy closing principle not previously seen boxed in this exact form.
