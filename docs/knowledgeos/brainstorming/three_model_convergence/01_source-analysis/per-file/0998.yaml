about: >
  The actual R5 Research-to-Architecture Report (previously known only by cross-reference), status "survivors
  only... no governance decision taken, one raised," tracing six surviving hypotheses (of the sixteen in R2,
  the eleven-plus in R3) through the full chain: `Hypothesis→formal consequence→DDD consequence→architecture
  consequence→governance question`.

  **H-K03 (`R5`)**: formal `Knower∉K` persistence; DDD `Knower` is an external actor, goal owned outside the
  state it constrains; architecture already enforced (`Zero/Lord/Sārathi∉State Mutation Boundary`); NO
  governance question (already ratified). **Delivers an explicit programme-level caution not previously
  captured in this exact form**: "because this concept entered via the Sanskrit lineage and is now ratified,
  any further Gītā mapping will be tempted to cite it as precedent. It is not precedent. It is one ratified
  convergence, and R4 shows it is the ONLY non-independent survivor."

  **H-K06 (`R6`)**: formal semantic-equality-qualified non-injectivity (already corrected per file
  0994's E5); DDD commands vs domain events, `Command≠Transformation` (§256.21); architecture: registry keys
  on operation identity; governance explicitly WITHDRAWN (the `humanActRef` typing motivation retracted).

  **H-K11 (`R6`)**, **H-K08 (`R6`)**, **H-K09 (`R4`, four not five epistemic stages)**, **H-K16 (`R5`)** all
  confirmed in their already-tracked forms, with H-K16 restating the `Σ`/`Sañjaya_K` layer-distinction finding
  (already tracked via files 0979, 0985, 0990) as a formal DDD/architecture consequence for the first time in
  this exact framing.

  **H-K13 (`R4`)**: "a correction rather than an addition," `Jñātā→Knower`, `Jñeya→Proposition`, `Jñāna→δ`,
  "Architecture consequence: none — it reinforces an existing ratified decision."

  **DELIVERS THE SINGLE GOVERNANCE QUESTION IN ITS DEFINITIVE, CANONICAL FORM**, explicitly tying it to an
  EXISTING, PRE-DATING governance register entry: "It is already on the estate's register (`D-2`), and
  nothing in this research resolves it." This CONFIRMS the `humanActRef`/`grantId` identity-boundary question
  this reconstruction has tracked as open since file 0988 was NOT newly discovered by this research
  programme but is a pre-existing item this programme merely surfaced via H-K08's architecture consequence.

  **DELIVERS A COMPREHENSIVE, DISCIPLINED "WHAT THIS RESEARCH DID NOT DO" NEGATIVE-SCOPE CLOSING LIST**,
  consolidating every already-tracked rejection/non-promotion in one place: did not redefine `K`; did not
  choose the canonical state; did not define `δ`; did not introduce Knowledge Ātma (destroyed, `RX`); did not
  reintroduce `Knowledge` as a primitive; did not promote Sañjaya (recorded as corpus-native, not proposed);
  did not make `Ω` canonical; did not equate Kṛṣṇa with `Ω` (blocked by E-10 -- a new corpus reference); did
  not equate Dharma with Policy; did not equate Buddhi with AI; did not declare Arjuna the Knower (flagged as
  a two-role conflation); did not modify the Constitution; **did not resolve Blocker 1 by assumption — it
  resolved it by projection, formally, and named the one function that blocks its computation** (a direct
  reference to file 0974's `Qualify`-undefined finding).
