defines:
  - concept: "TraceID vs. entity IDs"
    definition: "A TraceID (e.g. GT-NEXUS-001) identifies an entire logical workflow instance and is shared by every record participating in it, while entity-level IDs (ActionID, EvidenceID, etc.) identify individual objects within that workflow -- the two identity types must never be conflated"
  - concept: "NoContext⇒NoExecution"
    definition: "For high-risk governed actions, if KnowledgeOS cannot produce authoritative context, the action must not proceed -- context unavailability is itself a blocking condition, not merely a degraded-quality warning"
  - concept: "UNKNOWN≠PASS (Golden Trace platform invariant)"
    definition: "When a verification's evidence is insufficient or unavailable, the resulting UNKNOWN verdict must never be reinterpreted by an agent as an implicit PASS; this must be enforced as a platform invariant, not left to agent judgment"
  - concept: "Golden Trace as architecture baseline"
    definition: "Once the Golden Trace is implemented, it becomes the reference implementation against which every future KnowledgeOS capability is fit-tested: a capability that cannot be located within the Golden Trace's state-transition model should have its inclusion in the core architecture questioned"
