defines:
  - concept: "The three fundamentally different transition kinds"
    definition: "The architecture's transitions decompose into three categorically distinct kinds that must never be collapsed into a single undifferentiated 'workflow status': Epistemic transitions (changes in what is currently believed/assessed, e.g. Unknown→Supported), Governance transitions (changes in what is authorized, e.g. Proposed→Authorized), and Operational transitions (changes in what has actually been executed in the world, e.g. Planned→Executed) -- a complete business process typically composes all three, but each retains its own preconditions, postconditions, and semantics, and conflating them (as a conventional Review→Approve→Execute workflow implicitly does) hides the richer nine-question audit trail (what was known, what evidence supported it, what was assessed, who was authorized, what policy applied, what was decided, what was executed, what actually happened, what was learned afterward) the architecture is meant to preserve"
  - concept: "Rollback≠Reversal"
    definition: "A formal transition τ:S→S' is mathematically reversible only if a true inverse τ^-1 exists such that τ^-1(τ(s))=s; but once a transition has caused an effect in the external world outside the system's own state (a message sent, a payment executed, an external system updated), restoring the system's internal state to its prior value does not undo that external effect -- so 'rolling back' internal state must never be confused with genuinely reversing what happened, and the correct architectural response for such irreversible transitions is an explicit compensating transition (e.g. Payment→Refund) that creates a new, additional domain event/state rather than attempting to erase the original one"
