about: >
  The actual D285-1 artifact (previously known only by cross-reference), delivering the full comparison of
  every competing definition of `K` this reconstruction has encountered.

  **§1 DELIVERS THE COMPLETE SEVEN-ROW K-DEFINITION TABLE FOR THE FIRST TIME**: K-1 (`K_t` over 8 primitives,
  RATIFIED, "50 attack classes, no counterexample," COMPUTATIONALLY TESTED); K-2 (`K=(𝒜,ℛ)`, verification
  lane, NOT RATIFIED, 0 occurrences in any ratified artifact per GN-75); K-3 (`K=(A,R,Σ,E_L)`, Step 272B/273,
  "Authority: HPA self-attested, no ledger entry" -- a governance-provenance red flag not previously
  captured); K-4 (`K_t` 10-tuple, non-authoritative, "superseded by ~120 steps"); K-5
  (`K(t)=M(t)+iA(t)` complex, REJECTED by FA-4); K-6 (`𝒦=(K,H)`, provenance track, 2 layers); K-7
  (`Zero(K_t)=Ω\Represented(K_t)`, Zero lens, presupposes `Ω`,`D_t`,`Z_t`). **Measured: ~28 distinct `K`
  definitions across the corpus in 7 shape-families** -- a new quantitative scale-of-fragmentation finding.

  **§2 delivers the full, executed primitive-level comparison**: ratified `K_t` (8: Action, Entity, Event,
  Observation, Policy, Proposition, Relation, State) vs verification `(𝒜,ℛ)` (2: Assertion, Relation, with
  Assertion expanding to Proposition/Entity/Evidence/Context/Time/Provenance), yielding SHARED (3: Entity,
  Proposition, Relation), RATIFIED-ONLY (5: Action, Event, Observation, Policy, State), VERIFICATION-ONLY (4:
  Context, Evidence, Provenance, Time). **Confirms the already-tracked Sañjaya-based resolution of the
  Observation asymmetry** and the already-tracked narrowing of the "lanes agree" claim (file 1003), placed
  here in its canonical source location.

  **§3 delivers the full, complete GN-75 vocabulary measurement**: "`𝒜·ℛ·Σ·Q_t·𝒪·Provenance·Replay·
  Measurement = 0 occurrences each. Exactly one construct on the registry carries an explicit governance act:
  `Policy`." -- confirming and completing the partial GN-75 citation already tracked (file 0985). Closes: "This
  is not evidence that the lanes conflict. It is evidence that they have never been placed in a shared
  vocabulary."

  **§4 delivers the definitive statement on `Knowledge`'s deliberate absence**: "The ratified model
  deliberately does not name `Knowledge` a primitive. `K_t` is therefore NOT 'the knowledge state' in the
  verification lane's sense — it is a STATE OVER A KNOWLEDGE-BEARING VOCABULARY. Two different objects
  wearing one letter."

  **Template §5 (Equality Specification)** delivers the already-tracked "weak relation" finding (file 0985)
  in its canonical source form: set equality on primitive NAMES only; conceptual identity of the 3 shared
  names remains untested. **Template §6 (Independence)**: "No Gītā input. Pure measurement... INDEPENDENT."
