about: >
  Continues the breakthrough, opening with the synthesis instructions' explicit rule: "an earlier
  understanding may be refined, contradicted, extended, specialized, generalized, or replaced;
  'newer=correct' is explicitly forbidden" -- reaffirming 0863's Chronology≠Supersession principle as an
  operating rule for this specific registry-construction step.

  **§240.1-240.2 delivers D-01, the strongest contradiction**: the transition equation `K_{t+1}=?` has
  approximately **25 materially different right-hand sides** in the corpus (based on `δ`, `T`, `T_K`,
  `Transition`, `Update`, `Revision`, `⊕ΔK`, `F(...)`, `I^K_t`, `Derive(...)`), verdict boxed
  **`OPEN — major contradiction`**, "we should not choose one merely because it appears latest." Amid
  this instability, one deeper principle survives as much more stable, boxed:
  **`Domain evolution≠knowledge evolution`** (via the temporal-model distinction
  `X_{t+1}=δ_X(X_t,e_t)` vs. `K_{t+1}=δ_K(K_t,o_t,ρ_t,Ω_t)`, independently computationally checked in
  part).

  **§240.3-240.6 delivers D-02 through D-04**: `K_t`'s canonical type is contested across at least three
  incompatible tuple representations, culminating in the book-level candidate `𝒦=(E,S,T,O,P,R,Π,A)`, all
  verdict **`OPEN`**; §240.4 proposes but explicitly does NOT establish a possible reconciliation
  (`K_t^{ontology}` vs. `K_t^{projection}` vs. `K_t^{runtime representation}` as different views of one
  state), boxed **`Possible reconciliation — not yet demonstrated`**; `S_t`'s arity varies across 7/8/9-
  component formulations, `OPEN`, though the 9-component version's explicit separation of knowledge/
  understanding/domain-state/ideal-state/questions/context/knower/policy/guidance is flagged as worth
  preserving even under eventual compression; `Zero` carries at least FIVE distinct mathematical
  signatures (`Zero(K_t,I_t,Q_t,C_t)`, `Zero(U_t,C_t,A_t,R_t)`, `Zero(K_t,I_t)→Δ_t`,
  `Zero(K_t,I_t,P_t,C_t)`, `Zero(K,EC)`), `OPEN` -- "we have not established what Zero IS: a function? a
  relation? a lens? a finding? a transformation? a gap detector?"

  **§240.7-240.8 delivers D-05/D-06**: a historical "complete mathematical specification" listing twenty
  separate objects is explicitly downgraded, boxed **`ConceptualInventory≠MathematicalKernel`**; the
  five-element kernel `𝔎=(G,σ,θ,λ,π)` is explicitly identified by the corpus's own contradiction registry
  as belonging to a **"lossy-compression family"** relative to the richer corpus mathematics --
  "PERHAPS THE MOST IMPORTANT MATHEMATICAL ISSUE IN THE ENTIRE PROJECT," formalized as
  `ρ:K_rich→K_compact` with the open question `Loss(ρ)=?`. §240.9 delivers the resulting discipline
  boxed **`Abstraction⟺CriticalSemanticsPreserved`**, directly connecting compression legitimacy to the
  repaired semantic-integrity criterion from 0862.

  **§240.10 delivers D-07, resolving a puzzle this reconstruction's own reading has implicitly carried
  all session**: measure theory -- **the namesake of the `phase_measure_theory` folder this entire
  session has been reading from** -- was explicitly deferred after initial exploration and was NEVER
  subsequently restored as the foundation; the audit reports the σ-algebra appears only ONCE in the
  broader corpus. Boxed **`MeasureTheory≠CurrentFoundation`** -- "should be treated as a decision/
  history, not an unresolved mathematical preference." The surviving uncertainty machinery instead
  traces to Bayesian reasoning, belief functions, algebraic structures, and type theory.

  **§240.11-240.13 delivers D-08 through D-10, identifying the file's strongest, genuinely-VERIFIED
  mathematical components**: D-08, the five-time-coordinate temporal model (`T_e≠T_o≠T_k≠T_d`,
  `T_v=[t_start,t_end)`, `X_t≠K_t`) is "the temporal core of the final theory," partially computationally
  checked, classified boxed **`HIGH CONFIDENCE`** (unlike the OPEN transition/arity contradictions); D-09,
  the three-valued epistemic model `Eval(P,K)∈{T,F,U}` was **independently exhaustively checked and
  identified as strong Kleene logic, with commutativity, associativity, and monotonicity VERIFIED** --
  "HistoricalClaim+FormalDefinition+IndependentComputation all align. That should be one of our reference
  mathematical components"; D-10, the EVSI formula was **independently implemented and tested over
  20,000 RANDOM BINARY DECISION PROBLEMS**, with expected non-negativity holding "up to floating-point
  noise" -- "mathematical import→formal definition→executable verification," proposed as "the standard
  against which weaker mathematical claims are judged." **These are the first genuinely computationally-
  executed, not merely claimed, verification results identified anywhere in this reconstruction's
  entire read-through of this model's corpus.**

  **§240.14-240.15 delivers D-11/D-12**: `DecisionReady≠Complete` (`DecisionReady=SufficientForPurpose`,
  `ShouldStop=f(Sufficiency,Cost,Urgency,Risk,Policy)`) is conceptually powerful but partially
  unoperationalized (`Σ_A≥Σ_I` requires an undefined ordering on epistemic states); the resulting general
  validation rule, boxed **`Every comparison operator requires a declared type/order`**.

  **§240.16-240.17 delivers D-13 and a proposed ontology-vs-lenses reconciliation**: the Gītā-lens
  objects (`Z_t` Zero, `L_t` Lord, `a_t` Sārathi) have heterogeneous, contested mathematical status,
  boxed **`GitaLensObjects≠automatically primitive mathematical objects`** -- they "may instead be
  interpretive operators over a more fundamental state model." §240.17 proposes (explicitly not yet
  established) reframing `Z,L,S` as VIEWS/OPERATORS over the underlying `K_t` rather than additional
  state components, boxed caveat **`This is a proposed reconciliation, not yet a corpus-established
  decision`** -- "would substantially reduce the 20-object model without destroying its historical
  meaning."

  **§240.18 delivers D-14**: `Policy≠Authority≠Knower`, aligning with the earlier DDD finding
  (0863's `State≠Authority`) that authority is never inferred by state orchestration; a candidate
  dependency chain `Authority→_{governance}Policy→_{constraint}Transformation`, again explicitly a
  candidate, not final.

  **§240.19 delivers D-15, the file's sharpest reframing**: the deepest contradiction "may actually be
  semantic, not mathematical" -- the same symbols (`K_t`, `S_t`, `Z_t`, Zero, Lord, Evidence) repeatedly
  denote different semantic roles across contexts, reframing the fundamental question from "which formula
  is correct?" to boxed **`What type of object does each symbol denote in each bounded context?`** --
  "a DDD problem and a mathematical type-theory problem simultaneously."

  **§240.20 delivers a genuinely reusable five-category contradiction classification**: `C1` Genuine
  logical contradiction (`A∧¬A`); `C2` Competing models (`M_1≠M_2`, no proof of equivalence); `C3`
  Refinement (`M_2=M_1+Δ`); `C4` Projection/view difference (`M_2=π(M_1)`); `C5` Terminological/type
  collision (same symbol, different semantic type) -- "will prevent us from incorrectly 'resolving'
  harmless historical variation." **This taxonomy is directly reusable by this reconstruction's own
  future gated (§29) cross-model comparison and contradiction-adjudication work.**

  **§240.21-240.22 delivers the actual populated contradiction register** (D-01 through D-11 with
  real assessments: mostly `OPEN`, one `Document contradiction`, one `Confirmed discrepancy`) and an
  explicit resolved-vs-open ledger: RESOLVED/STRONG (`X_t≠K_t`; `Eval(P,K)∈{T,F,U}`; `EVSI`;
  `MeasureTheory` not the surviving foundation) versus STILL OPEN (`K_t` canonical type, `S_t` canonical
  type, `K_{t+1}` canonical transition, `Zero` exact type, `𝔎_5` minimality,
  `𝒦_8→𝔎_5` semantic adequacy).

  **§240.23-240.24 delivers the file's central methodological resolution**: rather than continuing to
  seek "the one correct tuple," construct a **typed meta-model** boxed
  **`ℳ=(𝒪,𝒯,ℛ,ℱ,𝒫)`** (object types, state/time types, relations, transformations/functions,
  predicates/invariants) into which every competing formulation can be mapped -- "much more
  mathematically robust than selecting one historical tuple and declaring everything else obsolete."
  Proposes a resulting **three-level architecture** for the eventual synthesis: Level 1 Ontology (what
  exists), Level 2 State (how the current configuration is represented), Level 3 Dynamics (how it
  changes, with invariants constraining transitions) -- "may ultimately allow the five-component kernel
  to emerge naturally rather than being imposed."

  **§240.25 delivers the Step 240 verdict**: boxed **`The theory is conceptually mature but
  mathematically not yet normalized`**, and boxed **`The strongest mathematics is not necessarily the
  latest mathematics`** -- best-supported elements combine clear type + formal definition + reasoning +
  execution/verification (exactly the D-08/D-09/D-10 pattern); the biggest unresolved issue remains
  boxed **`𝒦_8→^?𝔎_5 without semantic loss`**.

  **Closes opening "Step 241 — Experiment Registry,"** distinguishing three categories that must not be
  conflated: claimed experiment, computational verification, and actual software/repository experiment --
  "the corpus contains all three categories, and sometimes labels conceptual derivations as though they
  were experiments," directly continuing the archaeology's now-established discipline of separating
  claim from execution.
