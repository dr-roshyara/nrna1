defines:
  - concept: "The measure-theory-abandonment confirmation (D-07)"
    definition: "A specific, quantified archaeological finding directly relevant to this reconstruction's own corpus-navigation history: measure theory -- the framework whose name this entire session's primary source folder (phase_measure_theory) bears -- was explored early in this model's research history but was explicitly deferred after that initial exploration and was never subsequently restored as the mathematical foundation. The audit further reports that the σ-algebra construct specifically appears only ONCE across the entire broader corpus. This should be treated, per the file's own framing, as a settled historical decision rather than an ongoing unresolved mathematical preference -- the corpus's surviving uncertainty-handling machinery instead derives from Bayesian reasoning, belief functions, algebraic structures, and type theory, not from measure-theoretic probability. This finding retrospectively clarifies why so much of this reconstruction's own read-through of the phase_measure_theory folder (hundreds of files) has concerned invariants, DDD, epistemic status, and typed kernels rather than sustained measure-theoretic content: the folder's name reflects an early, abandoned research direction, not the actual mathematical substance that dominates its later files"
  - concept: "The five-category contradiction classification (C1-C5)"
    definition: "A reusable taxonomy proposed for adjudicating any apparent disagreement between two formulations within the corpus, designed to prevent both under-reconciliation (treating a genuine logical contradiction as harmless variation) and over-reconciliation (treating a genuine competing model or terminological collision as if it were mere refinement): C1 Genuine logical contradiction (A∧¬A, both cannot be true under any interpretation); C2 Competing models (M1≠M2 with no proof either subsumes or equals the other -- genuinely alternative theories); C3 Refinement (M2=M1+Δ, M2 extends M1 without invalidating it); C4 Projection/view difference (M2=π(M1), both are valid representations of the same underlying object from different vantage points); C5 Terminological/type collision (the same symbol is used for two genuinely different semantic types, a naming problem rather than a substantive disagreement). This taxonomy is directly and immediately reusable by this reconstruction's own future gated (§29) cross-model comparison work, where analogous questions will arise about whether apparently conflicting claims from different models are C1-C5 in the same sense"
  - concept: "The typed meta-model resolution strategy"
    definition: "A proposed methodological pivot for resolving the corpus's own ~25-formulation transition-equation contradiction (and the broader K_t/S_t arity contradictions): rather than attempting to identify which single historical tuple formulation is 'the correct one' and discard the rest, construct a general typed meta-model ℳ=(𝒪,𝒯,ℛ,ℱ,𝒫) (object types, state/time types, relations, transformations, predicates/invariants) capacious enough that every competing historical formulation can be expressed as a specific instantiation or projection of it. This reframes competing formulations as different views/parameterizations of one underlying typed structure rather than as mutually exclusive claims requiring a winner, and is explicitly assessed as 'much more mathematically robust' than the alternative of declaring one historical tuple canonical and the rest obsolete"
