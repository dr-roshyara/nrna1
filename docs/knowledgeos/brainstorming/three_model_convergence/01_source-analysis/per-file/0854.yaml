defines:
  - concept: "'Architecture often precedes vocabulary'"
    definition: "A historiographical insight proposing that the intuitive assumption 'first we conceive a concept, then we implement it' (Concept→Implementation) may often be historically backwards for real engineering work: a system can enforce a behavioral constraint, or repeatedly exhibit a pattern, well before anyone recognizes it, names it, or formalizes it as an explicit principle -- so the more historically accurate sequence is frequently Implementation→repeated constraint→observed pattern→named principle→formal invariant (Implementation→Concept→Formalization). This motivates tracking both a first-explicit-occurrence time t_E(c) and an earliest-defensible-implicit-occurrence time t_I(c) for every concept, with the interval [t_I,t_E] representing the period during which the concept was genuinely present in the system's behavior but had not yet been named or formalized"
  - concept: "The three named falsification outcomes for the candidate phase model"
    definition: "The three genuinely distinct possible results of actually performing the long-deferred historical audit against the candidate eight-phase model: Outcome A, Strong confirmation, where most proposed transitions have clear historical evidence and the reconstructed architecture closely matches the current theoretical synthesis; Outcome B, Partial confirmation, where some transitions are genuinely historical while others turn out to be later retrospective synthesis layered onto a simpler historical core; and Outcome C, Major falsification, where the actual historical trajectory differs substantially from the proposed model, requiring the architecture theory itself to be revised -- explicitly framed as not a failure of the audit but precisely its intended function, since an audit that could only ever confirm its own starting hypothesis would not be a genuine test at all"
