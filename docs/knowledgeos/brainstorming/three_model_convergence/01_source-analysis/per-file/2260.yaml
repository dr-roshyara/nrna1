about: >
  The culminating formalization document of the entire Gītā-lens Kernel-hypothesis arc (files 2245-2259):
  "we should define the kernel from the combined KnowledgeOS evidence + mathematical requirements + DDD
  boundaries, while using the Gītā as a philosophical lens — not define it by Sanskrit terminology."

  **CENTRAL HYPOTHESIS**: "KnowledgeOS Kernel = the smallest unit capable of epistemic state transition,"
  explicitly not merely the smallest unit that stores knowledge — directly extending and formalizing the
  already-tracked H6-KERNEL-MIND (file 2249) and Knower-Mind-Knowledge Model (file 2252) hypotheses.

  **DELIVERS THE FORMAL KERNEL DEFINITION**: 𝕂=(K_t,Ω_K,ℐ) where K_t=current knowledge state, Ω_K=permitted
  kernel operations, ℐ=kernel invariants, with the transition rule K_t→_{ω∈Ω_K}K_{t+1} valid only if
  ℐ(K_t,ω,K_{t+1})=true — the most precise formal kernel candidate produced across the entire Gītā-lens
  thread, superseding the looser candidate transition functions of files 2252/2254/2256.

  **DELIVERS AN ELEVEN-OPERATION CANDIDATE ALGEBRA Ω_K**, each grounded in the already-tracked Mind/Buddhi/
  Karma/Phala lens (Mind→evolving epistemic state; Buddhi→discriminative capability; Karma→action/
  transition; Phala→resulting state/outcome, explicitly "analytical lenses, not yet DDD names"):
  ① Observe(O_t) — explicitly O_t≠K_t, preserving the already-tracked Observation≠Knowledge distinction;
  ② Discriminate(K_t,O_t)→{d_1,...,d_n} — the Buddhi operation, explicitly "should not yet mean 'decide
  truth' — it means distinguish"; ③ Qualify(x,E,C,t,Π) — "our G1 unresolved operation," with a candidate
  four-value result set {admit,reject,defer,qualify} explicitly preferred over binary {true,false} — the
  THIRD distinct candidate Qualify signature in this thread (after files 2252, 2254), converging toward a
  non-binary result-domain consensus; ④ Incorporate(K_t,p)→K_{t+1} — explicitly "a state transformation, not
  simply an insertion"; ⑤ Reject(K_t,p) — explicitly Reject≠Prove-False, "a proposition can be rejected...
  without being established as false"; ⑥ Contradict — recognizing p⊥q via the corpus's existing Relation
  primitive; ⑦ Revise(K_t,p,E) — explicitly warning "we must not import AGM revision theory merely because
  it exists. Step 287 correctly warned against that" (a direct citation of the already-tracked corpus
  discipline); ⑧ Supersede — p_1 supersedes p_2 while preserving lineage; ⑨ Recall(K_t,h) — distinguishing
  currently-known from historically-known, explicitly reinforcing K_t≠ℋ_K (the already-tracked file-2256
  history-object distinction); ⑩ Withdraw(p) — explicitly withdraw≠delete-history, "the historical fact that
  the proposition was once held may remain... extremely important for an auditable KnowledgeOS"; ⑪ Act(a) —
  explicitly likely EXTERNAL to the kernel, reinforcing Command≠Transformation≠Result and citing the
  already-established Step-285 finding that Action/Event/Policy were external to the verification
  projection.

  **DELIVERS A DDD BOUNDARY-MEMBERSHIP TABLE** classifying all eleven-plus candidates by kernel-membership
  status: Discriminate/Qualify/Incorporate/Reject/Contradict/Revise/Supersede rated strong candidates (⭐);
  Observe/Recall/Withdraw rated uncertain (depends on boundary/memory model); Act/Authorize/Policy-evaluation/
  Replay rated ❌/external — Authorize explicitly "governance/authority," Replay explicitly "requires H
  according to Step 285."

  **PROPOSES THE MINIMAL-KERNEL QUESTION**: "What is the minimal operation set without which a KnowledgeOS
  kernel ceases to be a kernel?" — hypothesizes (not asserts) Ω_K might reduce to
  {Discriminate,Qualify,Transition}, with Accept/Reject/Revise/Supersede as specialized transition types,
  explicitly "we should not assume this minimality."

  **PROPOSES A NAMED RESEARCH STEP — "Step 291 — KnowledgeOS Kernel and Operation Algebra"** with 12
  explicit research questions (minimal kernel definition; whether K_t IS the kernel state or the kernel
  contains additional state; minimal Ω_K; which operations are genuinely epistemic vs external — Governance/
  Authority/Action/Replay; whether Discriminate is primitive or composed; Qualify's exact consume/produce
  signature; whether every legitimate transition can be classified; determinism status; inviolable
  invariants; provable minimality; independent-derivability vs mere-Gītā-correspondence for each part) —
  culminating in the boxed research hypothesis: "Kernel ≠ Knowledge Store" but potentially "Kernel = Epistemic
  State + Discrimination + Legitimate State Transition."
