    definition: "The process by which KnowledgeOS derives and evaluates candidate semantic axes from the Knower's intent, context, domain knowledge, observations, epistemic gaps, possible horizons, and learned patterns, without requiring the Knower to explicitly specify those dimensions. Formally (Q,K_t,C)->D^candidate_t->D^assessed_t, with D^candidate_{t+1}=Refine(D^candidate_t,O_t,Z_t,L_t,P_t)"
refines:
  - concept: "0454's consolidated Dimension definition (d:Observation/Entity/Relation->V_d)"
    refinement: "Adds the prior discovery pipeline: dimensions are not observer-supplied but reconstructed by KnowledgeOS via a seven-source candidate-generation-then-assessment process, explicitly rejecting a naive union-of-candidates-equals-dimensions collapse"
  - concept: "0453's Zero-scope-limitation and Lord-as-horizon-expansion"
    refinement: "Sharpened into two distinct, non-collapsible Zero findings and a Lord output constrained to D^possible (never D^true), nested within an explicitly unbounded/non-enumerable dimension space 𝒟"
  - concept: "0454's Statement=(Subject,Dimension,Value) first-order form"
    refinement: "Statement is now explicitly constructed only after both DimensionDiscovery and ValueDiscovery complete -- not derived directly from the initial question"
