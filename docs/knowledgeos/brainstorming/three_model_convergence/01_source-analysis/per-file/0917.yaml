defines:
  - concept: "The precise missingness defect (T-1, T-2)"
    definition: "A demonstrated theory defect in the canonical Knowledge State's assertion set 𝒜=Set(Assertion): the representation offers no way to distinguish a proposition that was NEVER FORMULATED as a query at all (not-asked) from a proposition that WAS formulated but for which no supporting assertion currently exists (asked-and-absent) -- both situations produce the identical observable fact a∉𝒜 for the proposition a in question. Additionally, the EKP's 'orphan' construct (an assertion that exists but carries no semantic relationships to other knowledge objects) has no representation at all within the canonical K, meaning the theory cannot even express that such states occur in the real system. Both gaps were surfaced only by actual empirical execution against representative data (Test E4), not by prior theoretical analysis -- directly illustrating the value of the empirical-closure discipline this sub-arc committed to"
  - concept: "The Two Repair Principles"
    definition: "A consolidated two-principle summary of the entire sub-arc's minimality/sufficiency methodology, applied here specifically to repairing a discovered theory defect: Distinguishability requires that every mandatory epistemic/missingness state (not-asked, asked-and-absent, asked-and-unknown, asked-and-supported, asked-and-refuted, asked-and-conflicted, orphan) have its own distinct representation, so that no operation can conflate two genuinely different situations; Minimality requires that the chosen repair add the SMALLEST possible additional structure sufficient to achieve that distinguishability, adding no redundant distinctions beyond what is empirically and operationally required. This directly generalizes the K-minimality and Σ-minimality methodologies established across files 0902-0904 and 0912 into a reusable template for repairing any future discovered theory defect"
