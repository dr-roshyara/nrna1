defines:
  - concept: "Commuting-diagram (factorization) congruence"
    definition: "The strictly stronger form of the congruence requirement for a candidate state abstraction F_i:ℋ→K_i relative to a history-level transformation T̂:ℋ×C→ℋ: there must exist a state-level transformation T_i:K_i×C→K_i such that F_i(T̂(H,c))=T_i(F_i(H),c) for all admissible H,c -- i.e. the square with ℋ→^F K on both sides and T̂ on top / T_i on bottom must commute. This is stronger than the earlier output-equality-only formulation (F_i(H_1)=F_i(H_2)⇒F_i(T̂(H_1,c))=F_i(T̂(H_2,c))) because it additionally requires that the state-level transition function itself be well-defined and total on K_i, not merely that its outputs happen to agree pairwise"
  - concept: "Local vs global congruence"
    definition: "Congruent_tested(F) denotes that no counterexample was found within a specific finite test set of histories, contexts, and transformations actually executed -- 'evidence of survival,' not proof. Congruent_global(F) denotes that the biconditional/commuting property has been established for ALL admissible histories, contexts, and the FULL mandatory transformation family -- 'proof of universal congruence.' The file insists these must never be conflated, and that a formal global proof further requires the relevant domains (history space, context space, transformation family) to be sufficiently and explicitly closed before the universal quantifier ∀T∈𝒯 has determinate meaning"
