about: >
  A short direct-continuation refinement note following 0325 (Brachman & Levesque), replacing a proposed
  'correct/incorrect' knowledge criterion with a stronger three-part capability model: knowledge enables a
  participant to DISCRIMINATE among competing possibilities, SELECT relevant/trustworthy information, and
  DECIDE/act. Explicitly keeps Truth/Knowledge/Selection/Decision as four distinct, non-identical things
  that knowledge merely enables. Grounds the model in Brachman & Levesque's operational claim that a
  knowledge base is useful because reasoning can reach conclusions not explicitly stored, and their
  distinction between logically guaranteed entailments and plausible non-entailing assumptions. Proposes
  three task-specific (not universal) probability measurements D(K), S(K), A(K), and closes with a clean
  Kernel-boundary restatement: 'the Kernel preserves the structures that enable discrimination; reasoning
  regimes perform the discrimination.'
introduces:
  - concept: "Refined knowledge-capability triad, replacing a rejected 'correct/incorrect' formulation: DISCRIMINATE (correct/incorrect/plausible/uncertain) / SELECT (relevant/reliable information) / DECIDE (what to believe/do) -- all descending from KNOWLEDGE"
  - concept: "Explicit four-way non-identity chain: Truth != Knowledge != Selection != Decision -- 'knowledge can enable these activities without making them identical'; worked incident-response example (Information: server reachable -> Knowledge: combined with topology/history/dependencies -> Selection: this observation is relevant -> Decision: investigate network path first)"
  - concept: "Refined definition: 'Knowledge is a capacity for epistemic discrimination: the capacity to distinguish relevant possibilities, evaluate information and infer consequences within a bounded projection of the Knowledge Space' plus 'Knowledge permits selection of information according to context, purpose, evidence and inferential consequences' -- explicitly said to fit the corpus's earlier 'capacity' idea better than 'capacity to write information'"
  - concept: "Three task-specific (not universal) probability measurements: D(K)=Pr(selects correct/relevant hypothesis|K), S(K)=Pr(selects relevant information|K), A(K)=Pr(appropriate decision|K) -- grounded in Brachman & Levesque's warning that a reasoning system may be sound/incomplete/deliberately approximate depending on task, and that computational reasoning and logical truth are not identical"
  - concept: "Extended pipeline: Infinite Knowledge Space -> Information -> Knowledge (discrimination) -> [select, infer, reject] -> decide -> act"
  - concept: "Consolidated working definition: 'Knowledge is not merely possession of information. It is a factive epistemic capacity/state that allows a participant to discriminate among possibilities, select relevant information, form and evaluate commitments, infer consequences, revise its position, and support decisions within a bounded projection of an unbounded Knowledge Space'"
  - concept: "Clean Kernel-boundary restatement: 'the Kernel preserves the structures that enable discrimination; reasoning regimes perform the discrimination' -- a compact companion to 0322/0324/0325's Representation-Reasoning/Epistemic-Model Separation principles"
