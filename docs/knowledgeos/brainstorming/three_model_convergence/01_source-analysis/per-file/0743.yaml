defines:
  - concept: "Conformance≠GovernanceApproval"
    definition: "Code can be technically conformant to a declared architecture that has never actually been organizationally approved -- passing a static/dynamic architecture check is not the same fact as that architecture having gone through, and survived, the governance approval process; the two must never be conflated when reasoning about whether a system is 'correct'"
  - concept: "Actor vs. Authority"
    definition: "The Actor is the individual person who performs a governance operation (e.g. submits or reviews a proposal); the Authority is the organizational role or body formally empowered to make the corresponding decision (e.g. the Architecture Board) -- a Domain Architect may act, but the Architecture Board may be the authority whose approval the action represents"
  - concept: "'Exception is not architecture change'"
    definition: "Approving a scoped, time-bounded, conditional deviation from a rule for a specific subject (an Exception) is a categorically different governance act from actually changing the rule itself (an ArchitectureChange); the underlying architecture principle remains unmodified and still applies everywhere the exception does not explicitly cover"
  - concept: "Two Golden Traces"
    definition: "The reconstruction's Golden Trace pattern (0732) applies at two distinct levels that intersect but remain conceptually separate: the Engineering Golden Trace (Agent→Context→Action→Execution→Evidence→Verification, tracing one engineering task) and the Governance Golden Trace (Proposal→Review→Decision→Architecture→Implementation→Assurance, tracing one architectural change), with governed architecture versions and their implementation/assurance evidence forming the intersection between them"
  - concept: "KnowledgeOS as a closed-loop system (Govern-Guide-Build-Observe-Assure-Learn-Govern)"
    definition: "Govern (an authoritative decision is made) → Guide (that decision becomes governed context available to engineering) → Build (engineering implements against that context) → Observe (the resulting system is observed) → Assure (deterministic verification evaluates the observation against the expectation) → Learn (the outcome becomes validated knowledge) → Govern (that knowledge informs subsequent decisions) -- the most compact, memorable single-cycle summary of the entire KnowledgeOS architecture"
