title: "LANDMARK — 'Most Important Discovery of the Round': Knower/Observer (N) Added as FOURTH Fundamental Ontological Category; Explicitly Disciplines 0421's Un-Collapsed Claims; Decision Sufficiency, Knowledge Quality, Trust Formalized; Four Zero Boundaries (New Representation Boundary); Eight-Component K_t; Reduces 24 Questions to 5"
