about: >
  Answers 0472's Question 9 (What is a Conflict, and how is it resolved?), building directly on Coherence's
  Conflict!=Incoherence principle, then undergoes a dense critical refinement.

  **Part A (initial answer)** defines Conflict as "a situation in which two or more assertions cannot both
  be fully accepted within the same scope/context/temporal framework, or generate incompatible implications
  for the Knower's purpose," with the key insight **Conflict != Incoherence**. Proposes **five conflict
  types** -- Logical Contradiction, Normative Conflict, Epistemic Conflict, Temporal Conflict, Contextual
  Conflict -- each formalized and paired with resolution strategies, plus a Conflict tuple
  (Type,Assertions,Status,Evidence,Resolution,tau) and a simple Detected->Active->InProgress->Resolved/
  Unresolvable lifecycle. Works the Bhīṣma normative-conflict example through to a "Resolved" status via
  reinterpretation ("Arjuna's duty to kingdom is his duty to dharma").

  **Part B (critical review)** delivers roughly a dozen substantive corrections. First, **splits Conflict
  into two distinct levels**: **Conflict_A(A1,A2)** (the assertions themselves cannot jointly be accepted
  under the same frame) versus **Conflict_I(I1,I2|P,K,C)** (the assertions may both be true, but their
  *derived implications* create competing requirements for the Knower) -- worked precisely via Bhīṣma:
  Grandfather(Bhishma,Arjuna) AND Opponent(Bhishma,Arjuna) is perfectly satisfiable (no assertion-level
  conflict), while the real tension is between the derived implications "protect grandfather" and "fight
  opponent." States the resulting invariant **Conflict(A1,A2) != Conflict(Implication(A1),Implication(A2))**
  as fundamental -- this precisely mechanizes WHY Normative Conflict differs from Logical Contradiction.

  **Demotes Temporal and Contextual Conflict from independent conflict types to conditions of an applicable
  Frame**: apparent temporal/contextual "conflicts" (different versions at different times; different
  values in different environments) are usually not conflicts at all once the frame is properly accounted
  for. Reformulates: **Conflict = ContentConflict + ApplicableFrame**, with Frame F=(Scope,Context,Time,
  Purpose) and Conflict(A1,A2|F) -- reducing the taxonomy to three genuine conflict kinds (Logical,
  Normative, Epistemic) parameterized by a shared frame, rather than five independent types.

  Distinguishes **EvidenceConflict(E1,E2,P) from AssertionConflict**: conflicting evidence sources do not
  automatically mean the underlying assertions conflict -- timestamps, scope, source authority, observation
  method, and semantics must be considered first, "exactly where Zero becomes powerful."

  **Delivers the file's biggest correction**: **Resolution != Elimination**. Introduces **six distinct
  resolution outcomes** -- **Eliminated** (the conflict was only apparent), **Decided** (one side selected
  by rule), **Reframed** (the conflict disappears after introducing a new dimension), **Accepted**
  (consciously retained, not resolved), **Deferred** (left to a later Knower decision), and **Irreducible/
  Unresolved** (genuinely remains) -- formalized as Resolve(C) -> {Eliminated,Decided,Reframed,Accepted,
  Deferred,Unresolved}, explicitly rejecting the "one side wins" framing used throughout Part A.

  **Delivers a philosophically profound re-reading of the Gita example**: rejects encoding "Arjuna's duty to
  kingdom is his duty to dharma" as simply "Resolved," arguing that Krishna does not choose between Family
  and Kingdom -- he **changes the conceptual frame** through which Arjuna understands the problem; the
  original assertions remain true, only their meaning and relationship within the model change. States the
  major new KnowledgeOS principle: **"Some conflicts are resolved by knowledge transformation, not merely by
  evidence selection."** Introduces a new first-class operation, **Reframe(K,C) -> K'**, which can add a new
  dimension, reinterpret an existing dimension, add a new relationship, change the applicable purpose, or
  change the normative model, such that Conflict(K,C) -[Reframe]-> Conflict(K',C') can reach empty *without*
  rejecting either original observation -- explicitly named as "exactly what we need to explain the
  transition from Arjuna's initial understanding to Krishna's guidance."

  Sharpens the lens triad with Reframe added to Sārathi's action vocabulary (Zero=Detect; Lord=Expand;
  Sārathi=Navigate, now including Reframe alongside Ask/Investigate/CollectEvidence/Compare/Defer/Escalate;
  Knower=Decide). Delivers a DDD correction: **Conflict is a domain object; ConflictDetection/
  ConflictClassification/ConflictResolution/Reframing are domain operations/capabilities**, explicitly
  warning against flattening the ontology by treating LogicalConflict, NormativeConflict, Zero, Sārathi, and
  Lord as equal-level domain entities. Revises the conflict lifecycle from a linear
  Detected->Active->InProgress->Resolved/Unresolvable sequence into a branching model
  (Detected->Classified->Evaluated->{Apparent->Reframed/Eliminated; Evidence-based->Investigate;
  Normative->Deliberate; Contextual->Scope; Genuine->RemainActive->{Resolved,Deferred,Accepted}}), with the
  new invariant **Accepted != Resolved**. Formalizes a complete four-stage transition system:
  K_t -[Detect]-> C_t -[Classify]-> C_t* -[Navigate]-> e_t -[Apply]-> K_{t+1}.

  **Identifies three fundamentally different, orthogonal uncertainty-reduction mechanisms**: Evidence
  acquisition (K_t -[Evidence]-> K_{t+1}), Dimension discovery (K_t -[NewDimension]-> K_{t+1}), and
  Reframing (K_t -[Reframe]-> K_{t+1}) -- observing that "more evidence is not always the solution":
  sometimes the wrong question is being asked, sometimes the right facts exist under the wrong dimensions,
  sometimes the right dimensions lack sufficient evidence -- "exactly where your Gita-derived model becomes
  more interesting than a conventional knowledge graph." Closes marking Question 9 "🟡 Accepted as a strong
  working model, but not yet frozen," with six invariants (Conflict!=Incoherence; Conflict!=Contradiction;
  EvidenceConflict!=AssertionConflict; Resolution!=Elimination; Acceptance!=Resolution; some conflicts
  require Reframing), and launches **Question 10 -- What is a Gap, and how is a Gap different from a
  Conflict?**, flagged as especially important since Zero operates on both.
