defines:
  - concept: "Conflict (two-level, corrected)"
    definition: "Conflict_A(A1,A2): the assertions themselves cannot jointly be accepted under a shared frame F=(Scope,Context,Time,Purpose); distinct from Conflict_I(I1,I2|P,K,C): the assertions may both be true while their derived implications compete for the Knower"
  - concept: "Reframe (new operation)"
    definition: "Reframe(K,C) -> K': transforms the knowledge model itself (new/reinterpreted dimensions, new relationships, changed purpose or normative model) such that a prior conflict may dissolve without either original assertion being rejected"
  - concept: "Resolve (six-outcome)"
    definition: "Resolve(C) -> {Eliminated, Decided, Reframed, Accepted, Deferred, Unresolved}: conflict resolution is not reducible to 'one side wins'"
