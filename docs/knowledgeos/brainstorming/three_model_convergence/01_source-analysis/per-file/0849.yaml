defines:
  - concept: "The operationalized, falsifiable Semantic Integrity predicate"
    definition: "SI(T,K,C), for a transformation T applied to knowledge object K within receiving context C, equals 1 if and only if every semantic distinction the context C requires for correct interpretation, governance, verification, or historical reconstruction (CriticalSemantics(K,C)) either remains recoverable from the transformed object (Recoverable(T(K))) or its loss is explicitly and visibly represented (Loss(T,K,C) is declared) -- otherwise SI(T,K,C)=0. This converts the previously loosely-stated 'preserve meaning' aspiration into a testable, binary predicate that can in principle be checked against any specific transformation, giving the concept genuine falsifiability rather than remaining a vague aspiration"
  - concept: "The universal-rule-to-conditional-invariant reframing"
    definition: "Rather than claiming an architectural principle P holds universally and unconditionally, the more precise and defensible architectural claim takes the form P|C -- 'principle P is invariant under condition/context C' -- formalized as a pair I=(Condition,Invariant). This directly resolves the apparent contradiction discovered when a principle like Identity≠State holds in one bounded context but not another: rather than declaring the principle simply false, the correct resolution recognizes that the principle was always conditionally true, and the accumulated set of such conditional invariants (ℐ={I_1,...,I_n}) forms something closer to an actual engineering constitution than a list of universal rules ever could"
