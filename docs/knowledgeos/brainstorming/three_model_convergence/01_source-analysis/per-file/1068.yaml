about: >
  "04 — Observational Family Audit (mandate §5)." Explicitly does NOT re-run the 2240-state audit, carrying
  results forward from Step 289. Answers five audit questions with a definitive, disciplined scope
  clarification of the already-tracked `≈_X` construct (files 1057-1058) relative to the corpus's actual `≈`
  and `≡_K` relations (the subject of files 1063-1067).

  **CONFIRMS `≈_X` DOES NOT INSTANTIATE THE CORPUS'S `≈`**: "corpus `≈` is `∀O∈𝒪_K` (`261.5`); `≈_X` is
  `π_X(Σ_1)=π_X(Σ_2)`. DIFFERENT INDEX, DIFFERENT CARRIER." Confirms `≈_X` is merely ONE formalization of
  "observational" (not the corpus's own relation), that no primary artifact specifies which `X`, and --
  crucially -- that **`≈_X` IS NOT EVEN THE SAME KIND OF RELATION AS `≡_K`**: "`≈_X` is `Σ`-level; `≡_K` is
  `K`-level, and NO `π:K→Σ` EXISTS (`289 §5`) -- `Σ` is a COMPONENT of `K`." This is a decisive structural
  clarification that the entire `≈_X`/30-candidate-family track (files 1057-1058) and the entire `≡_K`/`≈`
  N-1 track (files 1063-1067, this window's dominant content) operate at DIFFERENT LEVELS of the corpus's own
  ontology and were never in direct competition to begin with.

  **RETRACTS THE "32/30 USABLE CHOICES" MENU FRAMING**: "30 non-degenerate candidates... this REPLACES all
  earlier 'usable choices' language -- locked per the reviewer's item 4." Delivers the precise closing
  distinction: "`≈_X` was built in Step 287 to BOUND a candidate space, and it did... What it is NOT is
  evidence about the corpus's `≈`... the number 30 is seductive: it looks like an answer to 'which `≈`?' when
  it is an answer to 'how many ways could one read `≈` AT `Σ`-LEVEL?'" Boxed: "30 IS A MEASURE OF
  UNDER-SPECIFICATION, NOT A MENU."

  Confirms the STATUS block's precise final scoping: ESTABLISHED `≈_X` is not the corpus's `≈`; no artifact
  specifies `X`; the 30 measures under-specification · BOUNDED at 30 non-degenerate · EMPIRICALLY VERIFIED
  (from 289, not re-run) · NORMATIVE `N-5`, and ONLY IF the `Σ`-reading is ever adopted.
