defines:
  - concept: "K(p)=(Support^+(p),Support^-(p),Uncertainty,Provenance)"
    definition: "A two-dimensional epistemic assessment of a proposition, distinguishing support for p from support for ¬p separately (rather than a single scalar confidence), not automatically interpretable as probabilities unless an explicit statistical model justifies that interpretation"
  - concept: "KnowledgeOS cannot yet be declared a lattice"
    definition: "A lattice requires every pair of knowledge states to have both a Meet and a Join; Join(K_A,K_B) may fail to exist within the set of internally consistent knowledge states (e.g. the union of {p} and {¬p} is inadmissible if consistency is required), so lattice structure remains an open, unproven hypothesis rather than an assumed architectural property"
  - concept: "Merge≠Resolve"
    definition: "Merging two knowledge states may legitimately produce a state containing an explicit conflict (p and ¬p both present); resolving that conflict is a distinct, separately governed operation requiring additional evidence, policy, human adjudication, or a statistical model — the two must never be collapsed into one generic update"
  - concept: "EvidenceCount≠EvidenceStrength"
    definition: "The number of evidence items supporting a proposition is not the same as the strength of that support; identical or dependent evidence items must be deduplicated (via provenance/dependency identity) before being combined statistically, preventing naive multiplicative double-counting of correlated or duplicate evidence"
  - concept: "Claim≠Text"
    definition: "A KnowledgeOS Claim is a structured epistemic object C=(Proposition,Evidence,Status,TemporalScope,Uncertainty,Version,SemanticContext), not merely a natural-language sentence — this structure is what allows semantically equivalent but textually different claims (as commonly produced by different AI agents) to be properly identified, deduplicated, or kept distinct"
