defines:
  - concept: "SourceObservation (final typed schema)"
    definition: "{id, artifact_id, content, method, observed_at, context, provenance} — documents what was produced, not what it means; immutable once created"
  - concept: "SemanticInterpretation (final typed schema)"
    definition: "{id, source_observation_id, semantic_structure, interpreter, confidence, alternatives, interpreted_at, context, provenance} — an interpretation, not yet knowledge; explicitly preserves alternative interpretations of the same observation"
  - concept: "CandidateAssertion (final typed schema)"
    definition: "{id, semantic_interpretation_id, proposition, status∈{Pending,UnderReview,Rejected,Accepted}, assessed_at, context, provenance} — cannot become an Assertion without passing through EpistemicAssessment"
  - concept: "Assertion (final typed schema)"
    definition: "{id, proposition, epistemic_state, evidence, lineage, asserted_at, context, provenance} — the Knowledge State entry, whose lineage must trace back through SemanticInterpretation and SourceObservation to an Artifact"
