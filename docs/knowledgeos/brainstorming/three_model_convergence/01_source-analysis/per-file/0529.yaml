about: >
  A large, multi-part landmark file combining four distinct movements. **Part 1** (secondary-model
  elaboration) restates and extends 0499's Three Information Pathways (A. Model Knowledge:
  Training->Parameters->LLM Response, implicit/non-traceable/non-governed; B. External Retrieval:
  Source->Retrieval->Context->LLM, explicit/traceable/ungoverned; C. KnowledgeOS Knowledge:
  Observation->Assertion->Evidence->Epistemic State, explicit/traceable/governed/versioned -- the
  authoritative Knowledge State), crystallizing the critical error to avoid: `LLM Response≠KnowledgeOS
  Knowledge`, `Retrieved Document≠KnowledgeOS Knowledge`, `Training Data≠KnowledgeOS Knowledge`. Restates
  0499's Source Plane/Knowledge Plane/Epistemic Engine split, an ingestion pipeline diagram, the Zero->Gap->
  Sārathi->Retrieval->Observation->Evidence->Knowledge->Zero "epistemic retrieval loop" (explicitly "a
  closed-loop epistemic investigation system, not a question-answering system"), three constitutional
  invariants for sources (Source≠Knowledge, LLM Output≠Knowledge, Retrieval≠Knowledge Creation), a
  Source/Cognitive/Action three-layer architecture diagram, six implementation implications, and a final
  RAG-vs-KnowledgeOS contrast ("KnowledgeOS is an epistemic investigation system, not a question-answering
  system").

  **Part 2** shifts into the Domain-Authority persona explicitly resolving Option 3 (paralleling and
  extending 0528): delivers five justifications for the Two-Level Observation Model (preserves the
  epistemic chain; prevents silent conflation of LLM output with fact; supports auditability via
  `Assertion->InterpretedObservation->SourceObservation->Artifact` lineage; enables different reliability
  models per source type; aligns with the existing `X_t->O_t->R_t->A_t->K_t` theory), then delivers
  concrete, fully-typed DDD schemas for `SourceObservation` and `InterpretedObservation` (with explicit
  invariants: "SourceObservation documents what was produced, not what it means"; "InterpretedObservation is
  an interpretation; it is not yet knowledge"), a formal signature chain
  `Observe:A×M×C->O_s`, `Interpret:O_s×C->O_i`, `Construct:O_i->P_c`, `Assess:P_c×K_t×I_t->Assertion`, a
  "Five Cases Revisited" table giving concrete SourceObservation/InterpretedObservation pairs for
  Database/Document/Human/LLM/Sensor (notably the Human case yields BOTH an interpreted proposition AND a
  separate `Human_belief(...)` structure), four named DDD bounded contexts (Acquisition/Semantic
  Reconstruction/Knowledge/Epistemic Governance) each with explicit root aggregates/entities/value objects,
  six numbered key invariants (SourceObservation immutability; InterpretedObservation cannot exist
  independently; CandidateAssertion cannot exist independently; an Assertion may reference multiple
  CandidateAssertions/Evidence; every Assertion needs at least one provenance link; no CandidateAssertion
  automatically becomes an Assertion), and complete `KnowledgeState`/`SystemState` type definitions.

  **Part 3** refines the model per 0528's SourceObservation/SemanticInterpretation split ("I approve the
  refinement... cleaner and more mathematically precise than bundling interpretation into the observation
  itself"), delivering the FINAL observation pipeline (`Input->Artifact->SourceObservation->
  SemanticInterpretation->CandidateAssertion->EpistemicAssessment->Assertion`) with fully concrete typed
  schemas for all six objects (Artifact, SourceObservation, SemanticInterpretation -- now including an
  `alternatives:List<AlternativeInterpretation>` field for preserving multiple candidate interpretations,
  CandidateAssertion -- with an explicit status enum {Pending,UnderReview,Rejected,Accepted},
  EpistemicAssessment, Assertion -- with a `lineage` field), and the five key invariants plus the critical
  provenance-chain invariant `Assertion.lineage -> SemanticInterpretation -> SourceObservation -> Artifact`.

  **Part 4 -- the file's central event -- formally executes all eight adversarial test cases proposed at
  0528** and declares victory: Case 1 (Database Result) -- clean, high trust; Case 2 (Unstructured Document)
  -- clean, validity correctly flagged Stale due to a dated reference; Case 3 (Internet Page, unknown site)
  -- clean, weak support/high uncertainty correctly captured; Case 4 (Human Statement, "I believe...") --
  clean, the semantic structure explicitly carries a `belief:true` flag distinguishing reported belief from
  direct observation; Case 5 (LLM Answer) -- clean, AI_Generated acquisition with None support and
  VeryHigh uncertainty correctly marks LLM output as low-trust; Case 6 (Conflicting Sources, DB says 3.69.0
  vs. LLM says 3.70.0) -- clean, conflict modeled relationally per the corpus's established Conflict theory;
  Case 7 (Incomplete Question, Arjuna's "those with whom I have to fight") -- clean, the model explicitly
  refuses to construct a CandidateAssertion when the target is underdetermined, instead triggering
  GapDetection{gap:MissingTarget,severity:High,type:Semantic} and a clarification question -- "the model
  stops at interpretation and does not prematurely assert knowledge"; Case 8 (Stale Source, a 2025
  observation superseded by a 2026 observation) -- clean, validity is updated to Stale while history is
  preserved without deletion. **All eight cases survive cleanly** (a summary verdict table confirms
  ✅ for every case).

  **Delivers the file's central formal conclusion**: "The Observation boundary is computationally closed,"
  with the model shown to (1) preserve provenance at every step, (2) never conflate source/interpretation/
  knowledge, (3) handle different source types with different reliability models, (4) detect gaps, (5)
  handle conflicts relationally, (6) handle temporal staleness without losing history, (7) prevent silent
  conflation of LLM output with knowledge, and (8) maintain full auditability via the provenance chain.
  **Restates the final invariant set**, explicitly re-affirming 0528's `NumberOfAIOutputs≠
  AmountOfIndependentEvidence` finding verbatim ("The number of AI outputs does not equal the amount of
  independent evidence") alongside `Artifact≠SourceObservation≠SemanticInterpretation≠CandidateAssertion≠
  Assertion`, the two key per-type invariants, `LLM Output≠Knowledge`, and the lineage-completeness
  requirement. **Closes with the corpus's explicit named decision**: "The Observation boundary is
  computationally closed. We can now proceed to the next step of formalizing the Knowledge State and its
  transitions with this clean observation model as the foundation" -- directly resolving the bridge_candidate
  flagged at 0527/0528 regarding the eight-case test's outcome.
