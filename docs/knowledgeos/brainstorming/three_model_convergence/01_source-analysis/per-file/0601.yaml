defines:
  - concept: "Bitemporal-plus-epistemic temporal model"
    definition: "TemporalKnowledge=(ValidTime,RecordedTime,EpistemicStateTime) — extends classical bitemporal data (ValidTime, TransactionTime) with a third dimension marking when the system became epistemically justified in accepting the assertion as knowledge"
  - concept: "Snapshot"
    definition: "The complete set of epistemically valid knowledge available under a specified temporal and contextual boundary, formally S=(t,Context,IdentityVersion,SemanticVersion,RuleVersion,ModelVersion,PolicyVersion) — strictly more precise than a bare database-state-at-time-t notion"
  - concept: "Version alignment / temporal consistency condition"
    definition: "Valid(D)⇒Compatible(Evidence,Rules,Semantics,Models,Identity,Context) — a derivation is temporally valid only if every dependency it used is compatible within the same requested snapshot"
  - concept: "Hindsight-leakage prevention"
    definition: "KnowledgeCutoff strictly bounds which knowledge may be used when reconstructing or replaying a historical decision, preventing later-discovered information from silently contaminating the retrospective evaluation of an earlier decision"
