about: >
  The actual D288 scoping artifact commissioned by file 1002's mandate, status "SCOPED, NOT EXECUTED — 3 of
  4 targets are NORMATIVE and cannot close without a human act." Delivers per-target derivability analysis
  for all four D288 targets, disciplined to scope rather than execute since executing three of four would
  itself constitute a forbidden normative decision.

  **Target 1 (`≡` semantic equality)**: blocked entirely on the already-tracked Step 254 Decision 3 (open:
  is `Π` inside `≡`?). "The question IS the decision. Both answers are formally consistent; the corpus
  declines to choose." Classified **NORMATIVE, not `G1`-irreducible — `G1`-pending-a-decision**. Delivers the
  exact consequence of each branch: `Π` inside ⇒ D285-5's property VACUOUS and `≅_λ` collapses into `≡`; `Π`
  outside ⇒ the property is SUBSTANTIVE.

  **Target 2 (`≈` observational equality)**: the FORM is derivable (it is a FAMILY of relations `≈_𝒬` indexed
  by a declared observation/query set, not one relation), but the SET itself is NORMATIVE per bounded
  context, since "`K_A(Reality)≠K_B(Reality)` is a corpus principle." Cites the already-tracked Sañjaya
  parameterisation (`Knowledge=f(Access_Level,Role,Purpose)`).

  **Target 3 (`≅_λ` provenance-sensitive equality)**: introduces a NEW corpus reference, **"step-105,"**
  quoting "What matters is decision-relevant provenance, not private chain-of-thought" -- a corpus-supported
  relevance PRINCIPLE, though not a full predicate definition. Classified NORMATIVE with a corpus-supported
  constraint. **Flags this target as mattering most**: "`≅_λ` is the relation under which `δ` IS injective on
  D285-5's witness. Defining it therefore changes an existing published result."

  **Target 4 (`Qualify`)**: unlike the other three, **explicitly classified `G1` IRREDUCIBLE ON CURRENT
  EVIDENCE** — "not a pending decision... no corpus passage states necessary-and-sufficient qualification
  criteria." Explicitly reconfirms `Φ` (the Knowledge Qualification Problem's state-qualification function)
  is NOT `Qualify`'s body (different layer: state vs observation).

  **DELIVERS THE FILE'S CENTRAL, MAJOR SIMPLIFYING RESULT**: "Three of four are one decision away; the
  fourth is a genuine formal gap. That is a materially better position than 'four blockers.' The equality
  cluster is not a mathematical wall — it is a single open governance question (Decision 3) plus two
  context-parameterisations. Only `Qualify` is irreducible."

  **§4 delivers "the one question that unlocks the most"**: Step 254 Decision 3, with a full five-row
  consequence table for both branches (`Π` inside vs outside `≡`), covering D285-5's substantiveness,
  `≅_λ` vs `≡` distinctness, D285-6's projection legitimacy, provenance-blindness handling, and audit
  strength. **"No recommendation is offered. Both branches are formally consistent; the choice is about what
  KnowledgeOS wants equality to MEAN, which is exactly why the corpus left it open."**

  **§3 explicitly justifies non-execution**: "Proceeding would break a gate the research lane set for itself
  before this programme existed" (citing Step 261 §261.23, already tracked via file 1003).

  **§5 confirms discipline compliance**: no new relation invented, `Qualify` not solved by assumption, no
  Sanskrit expansion (GK-14/GK-15 still undeveloped), `Sañjaya=Ω` not canonical, `=_semantic` still not
  promoted.
