defines:
  - concept: "Migration Integrity ('migration cannot invent knowledge')"
    definition: "A schema or ontology migration process must never convert an unknown, missing, or uncertain field value into a stronger, more certain value (e.g. NULL confidence becoming confidence=1.0, or absent provenance-level data becoming Verified) merely to satisfy a new schema's structural requirements; migration must preserve the original epistemic status even when the new schema demands a value"
  - concept: "Reproducibility≠Repeatability (HistoricalReproduction≠CurrentReexecution)"
    definition: "Replaying a historical decision's exact recorded inputs under the current (updated) model may legitimately produce a different result than the original historical decision; this does not invalidate the historical record, since HistoricalReproduction (reconstructing what was decided and why, under the original model/policy/version) is a distinct concept from CurrentReexecution (running the same inputs through today's system)"
  - concept: "InvariantRegression"
    definition: "A new system version passing all ordinary functional tests while violating a previously-established mathematical invariant (e.g. allowing unauthorized execution) constitutes a regression even though functional testing alone would not detect it; regression testing must specifically re-verify previously-established invariants, not merely functional behavior"
  - concept: "Learning⇏PolicyChange (governed learning loop)"
    definition: "An AI system discovering a pattern or proposing what it believes is an improved policy or rule produces a PolicyProposal, never an automatically PolicyEffective change; legitimate policy evolution requires an explicit AIProposal→HumanReview→Authorization→EffectivePolicy pipeline for high-impact changes, with only genuinely low-risk parameters eligible for bounded automatic adaptation within an explicitly authorized AdaptationBoundary"
