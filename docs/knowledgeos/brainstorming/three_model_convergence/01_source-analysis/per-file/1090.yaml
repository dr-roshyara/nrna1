about: >
  `t291b_graph_universe.py` — "AUDIT B: state the graph universe explicitly and recompute. The 29-node vs
  13-node question: they are NOT two graphs. 29 = the node universe; 13 = the subset searched for cuts.
  Cycles are computed on the FULL 29; cuts are SELECTED from the 13." A follow-up executable script
  explicitly auditing the scope precision of the already-tracked `{≡}` unique minimal bootstrap cut (files
  1052, 1069, 1082).

  **DELIVERS A DISCIPLINED, EXPLICIT RECONSTRUCTION OF THE GRAPH-CONSTRUCTION METHODOLOGY**, rebuilding the
  graph directly from the already-tracked `t291_bootstrap.py` (file 1075) source, and stating the exact edge-
  generation rules for the first time in this precision: "admitted: a cited passage states that B REQUIRES
  SOMETHING FROM A; rejected: co-mention... definitions: an IDENTIFICATION... contributes ONE edge, in the
  direction of determination, not two (Step 289 v1 artifact removed [already-tracked file 1089 bug fix]);
  candidates: a CANDIDATE proposal is modelled as its own node (`equiv_cand`), NOT as a definitional edge
  (Step 290 correction [already-tracked file 1069]); blocked: blocked dependencies ARE included -- blockage
  is a status, not an absence; transitive: NOT included; only direct dependencies are edges."

  **DELIVERS THE GENUINELY IMPORTANT METHODOLOGICAL CLARIFICATION THAT THE 29-NODE VS 13-NODE DISTINCTION IS
  NOT TWO COMPETING GRAPHS**: "29 and 13 are NOT two graphs. One graph; a restricted CANDIDATE SET for
  cuts." Cycles are always computed over the full 29-node universe; feedback-vertex-set (cut) SEARCH is
  restricted to the 13 decision-resolvable nodes (already-tracked `RESOLVABLE` set, file 1075), on the
  disciplined ground that a cut through a purely derivable node "cannot be 'decided'."

  **DIRECTLY PROBES A POTENTIAL SCOPE OVERCLAIM IN THE PROGRAMME'S OWN MOST LOAD-BEARING RESULT**: the script
  computes the minimal feedback-vertex-set TWICE -- once restricted to the 13 resolvable nodes (reproducing
  the already-tracked `{≡}` unique cut), and once over the FULL, UNRESTRICTED 29-node universe, "a DIFFERENT
  question." Explicitly flags the audit's own concern: "if the full-universe result differs from `{equiv}`...
  REPORTED AS A SEPARATE RESULT (mandate B): over the FULL universe the minimal cut is NOT unique... A cut
  through a DERIVABLE node is not actionable: it cannot be 'decided'. But it must be reported, because
  UNIQUENESS WAS CLAIMED WITHOUT STATING THE CANDIDATE SET." This is a genuinely disciplined, self-critical
  audit directly targeting whether the already-tracked "unique minimal cut" claim (a result this reconstruction
  has treated as load-bearing across files 1052, 1069, 1082, 1085, and 1087) was stated with sufficient
  scope precision, or whether it silently smuggled in a restriction (to decision-resolvable nodes) without
  disclosing it as such.

  This is executable script content only (not yet showing its own printed output in this record); its
  execution results -- specifically whether the full-29-node-universe minimal cut set equals exactly
  `{equiv}` or is a larger, non-unique set including derivable-only nodes -- are the load-bearing evidentiary
  content this file's own logic anticipates, expected as a subsequent sequence.
