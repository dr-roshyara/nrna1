    refinement: "The counterexample is directly reused as 'Class I' of a now-systematic ten-class catalogue, and the associated user-decision question ('is provenance part of Knowledge?') is sharpened into the more directly testable and narrower question of whether any mandatory operation distinguishes histories SOLELY due to provenance -- a genuine methodological refinement making the open question more concretely actionable"
  - concept: "0875's commutative-diagram criterion (F∘T̂=T∘F) and 0870's/0872's minimality-relative-to-transformation-language insight"
    refinement: "Both are directly synthesized and sharpened into the single coarsest-sufficient-abstraction target (F(H1)=F(H2)⟺H1≡H2), unifying the congruence criterion and the relativity-to-𝒯 insight into one precise mathematical definition of minimality"
  - concept: "0866's D-06 lossy-compression concern and the ongoing kernel-primitiveness investigation"
    refinement: "Resolved into the concrete three-type history-dependence classification, giving a systematic, reusable framework for deciding whether any specific candidate piece of information belongs in the state, in the transformation parameters, or in an external audit substrate"
