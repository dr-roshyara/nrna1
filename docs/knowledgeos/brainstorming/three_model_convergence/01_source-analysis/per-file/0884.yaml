title: "Step 255 -- State/History Congruence and Counterexample Catalogue: Delivers a Formal TEN-CLASS COUNTEREXAMPLE CATALOGUE (Only Class I, External Provenance at t=0, Formally Established -- the Other Nine Remain Conditional/Candidate), Delivers 'Replayability!=State Sufficiency,' a THREE-TYPE HISTORY-DEPENDENCE CLASSIFICATION (Intrinsic/Transformation-Context/Audit) Resolving the Apparent Provenance Contradiction (Non-Reconstructibility From History(T) Does NOT Imply Provenance Must Be Inside K -- It May Belong to K, H, or an External Audit Substrate), and 'the Coarsest Sufficient Abstraction' -- a Mathematically Precise Reformulation of Minimality as the Coarsest Operationally-Valid Equivalence -- Narrows 0883's Provenance REQUIRES-USER-DECISION Into a Sharper, More Testable Question -- Opens Step 256's Formal Operation Signature Registry"
