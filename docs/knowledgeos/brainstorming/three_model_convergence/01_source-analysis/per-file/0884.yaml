defines:
  - concept: "The three-type history-dependence classification"
    definition: "A refinement of the earlier binary in-K-or-not framing for candidate kernel information, distinguishing three genuinely different relationships a piece of historical information can have to the current knowledge state: Type I, Intrinsic state dependence, where the information is constitutive of what the current knowledge state actually MEANS (e.g. a proposition together with its epistemic standing) and therefore likely belongs inside the semantic state itself; Type II, Transformation-context dependence, where the information affects how a transformation should be evaluated without itself being part of the knowledge content (e.g. an applicable policy, which can instead be supplied as an external parameter to the transformation function, T(K,Π), rather than stored inside K); and Type III, Audit/history dependence, where the information is needed for reconstruction, explanation, or accountability purposes but does not necessarily change what the current knowledge state itself means (e.g. provenance) -- explicitly flagged as remaining KnowledgeOS's central unresolved question of where such information should actually be stored"
  - concept: "The coarsest-sufficient-abstraction target"
    definition: "A precise mathematical reformulation of what a minimal Knowledge State abstraction should achieve, replacing the vague goal of 'the smallest number of fields' with an exact equivalence-theoretic target: define H_1≡H_2 to mean that no mandatory KnowledgeOS operation can ever distinguish the two histories. The ideal state abstraction F should then satisfy F(H_1)=F(H_2) if and only if H_1≡H_2 -- collapsing exactly the histories that are truly indistinguishable under every semantically relevant future operation, and no more. Minimality is then defined as achieving the COARSEST such equivalence that remains a genuine congruence for the mandatory transformation set -- a materially stronger and more precise target than counting or minimizing the number of named fields in a candidate tuple"
