about: >
  A citation-grounded extraction directly from the Nyaya-sutra with Vatsyayana's commentary (each
  observation anchored to a specific sutra number, e.g. 1.1.1, 4.2.35, 2.1.20), distinct from and deeper
  than 0170's Tarka-sangraha/Dipika extraction (a later digest text) -- applying pramana theory, tarka,
  Nyaya realism, and the Nyaya debate framework as falsification lenses on the minimal Knowledge Kernel
  question. Three headline findings stated up front: (1) Nyaya treats knowledge as fundamentally relational
  and process-based, not a static property of a true+justified proposition -- a claim is knowledge only if
  generated by the right kind of process (pramana) and defeasible by legitimate doubt; (2) a two-tier
  epistemology distinguishing default trust in cognition (accepted absent a specific reason to doubt) from
  reflective certification (systematic investigation via pramana/tarka once doubt arises) -- mapped onto a
  KnowledgeOS "knowledge core" (trusted default) vs. "adjudication process" (certification) distinction;
  (3) Nyaya's theory of error is parasitic on truth -- error is a misplacement of a property onto the wrong
  object (the shell-mistaken-for-silver example), which presupposes prior knowledge of the correct object
  (its "counter-correlative"), directly relevant to the anti-reasoner/representation-vs-truth problem. Ten
  numbered observations, each sutra-cited: (1) the four-factor knower/known/knowledge-source/knowledge
  structure as a unified relational whole a Kernel storing bare propositions would lose; (2) the parasitism-
  of-error thesis; (3) the two-tier default-trust/certification model; (4) pramanas as CAUSES of veridical
  cognition rather than internal justificatory reasons -- "a causal account of knowledge," raising whether
  the Kernel should treat justification as an internal claim-property or as a causal relationship to a
  generation process; (5) the inferential-mark (linga) three-part structure (previous perception of mark-
  marked relationship -> current perception of the mark -> recollection-triggered inference), distinct from
  a flat "evidence supports claim" link; (6) vyapti anvaya/vyatireka bidirectional invariant testing
  (repeats 0170's already-tracked content, here independently sutra-cited at 1.1.34); (7) abhava/pratiyogi
  absence-requires-a-counter-correlative (repeats 0170, sutra-cited at 4.2.33); (8) perception's four
  defining conditions (sense-object connection, language-independence, inerrancy, definitiveness),
  producing a falsification question about whether "does not depend on language" can be met by a digital
  system that inherently depends on language -- a genuinely new self-undermining tension the source itself
  raises; (9) the "lamp analogy" (Nyaya-sutra 2.1.19) reinterpreted via Vatsyayana as MUTUAL certification
  among pramanas rather than self-certification -- a coherentist element inside Nyaya's broader
  foundationalist framework; (10) doubt (samsaya, sutra 1.1.23) as the catalyst for inquiry rather than a
  failure state, with five distinct causal triggers (common-properties-cognized, distinguishing-properties-
  cognized, controversy, experience-based non-determination, lack-of-experience-based non-determination) --
  richer than 0170's flat samsaya definition, arguing uncertainty needs five distinct types, not a single
  confidence scalar. Also restates (without extending) the T1-T10-equivalent falsification apparatus already
  tracked at 0170 (definition defects, pancavayava, hetvabhasa, nigrahasthana) and the three-fold Nyaya
  debate taxonomy (vada/jalpa/vitanda). Explicitly flags five observations that should NOT influence
  architecture without further evidence (perception-as-inerrant, the four-category metaphysics, Nyaya
  theism, the full 22-clincher catalogue, universals/jati realism).

introduces:
  - "The four-factor knower-known-knowledge-source-knowledge unified structure (Nyaya-sutra 1.1.1): a
    Kernel storing bare propositions loses the relational whole; raises whether the Kernel must track the
    knower and the generation source, not just the claim content"
  - "The parasitism-of-error thesis (Nyaya-sutra 4.2.35): error is a misplacement of a property onto the
    wrong object, presupposing prior knowledge of the correct object -- proposed as grounds for treating
    error as a MODIFIED version of truth rather than an independent category, inverting the more common
    Western default-doubt framing"
  - "A two-tier default-trust vs. reflective-certification epistemology (Nyaya-sutra 2.1.20): cognition is
    trusted by default absent a specific reason to doubt, contrasted explicitly with a Cartesian doubt-
    first default -- mapped onto a candidate 'trusted default core' vs. 'certified/adjudicated' KnowledgeOS
    distinction"
  - "Pramanas as CAUSES of veridical cognition, not merely internal justificatory reasons -- a causal
    theory of knowledge generation, raising whether Kernel justification should be modeled as a causal
    relationship to a generation process rather than a claim-internal property (extends 0172's Audi
    causal/justificational/epistemic-grounding trichotomy with an independent classical source)"
  - "The inferential-mark (linga) three-stage structure: previous perception of the mark-marked
    relationship, current perception of the mark, recollection-triggered inference -- a more granular
    inference model than a flat evidence-supports-claim link"
  - "A self-undermining falsification question the source raises against its own material: Nyaya defines
    perception as language-independent, but a digital KnowledgeOS system inherently depends on language --
    does the Kernel's own definition of 'perception'/'observation' meet this Nyaya criterion at all?"
  - "The 'lamp analogy' reinterpreted as mutual certification among pramanas (a coherentist element inside
    Nyaya's foundationalism), distinct from self-certification -- raising whether the Kernel should require
    knowledge sources to mutually corroborate rather than stand alone"
  - "Five distinct causal types of doubt (Nyaya-sutra 1.1.23), richer than 0170's flat samsaya definition:
    common-properties-cognized, distinguishing-properties-cognized, controversy, experience-based non-
    determination, lack-of-experience-based non-determination -- proposed as a typed uncertainty model
    rather than a single confidence scalar"

