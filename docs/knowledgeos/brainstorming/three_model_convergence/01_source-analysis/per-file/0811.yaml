defines:
  - concept: "The four transition types (Correction/Change/Refinement/Recontextualization)"
    definition: "Correction: the world did not change, but the earlier assertion was factually wrong, and new evidence demonstrates this for the same referent, property, and time. Change: the earlier assertion was correct when made, but the underlying reality has since legitimately changed (both X at t_1 and Y at t_2 are simultaneously true relative to their own times). Refinement: the earlier assertion was true but incomplete, and the later assertion adds resolution/detail without falsifying the original. Recontextualization: an apparent conflict dissolves once it is recognized that the two assertions belong to different bounded contexts (the same word or claim means something different in each) -- these four require entirely different evidentiary support and produce entirely different historical-record treatments, so collapsing them into a single 'the value changed' event destroys essential organizational meaning"
  - concept: "The bitemporal model RealityTime × KnowledgeTime"
    definition: "Every organizationally significant proposition has two independent temporal coordinates: validity time (T_valid, when the proposition was actually true in the world) and knowledge time (T_known, when the organization actually came to know or record it) -- these can differ substantially (a vulnerability existing since January but only discovered in March has RealityState(Jan)=Vulnerable but KnowledgeState(Jan)=Unknown), and conflating them by retroactively asserting the organization 'knew' something during a period when it had not yet discovered it constitutes a historical falsification; this independently reconstructs the established bitemporal-database concept of valid-time versus transaction-time"
