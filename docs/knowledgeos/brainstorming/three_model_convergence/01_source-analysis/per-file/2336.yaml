about: >
  Delivers the exact detail behind file 2332's already-tracked "P1: Situation = KnowledgeOS state --
  REFUTED. And refuted by KnowledgeOS's own prior evidence, not by Reiter's authority."

  **DELIVERS THE EXACT WORKED COUNTEREXAMPLE (A1)**: s_1=do(turn_on,S_0), s_2=do(turn_on,do(turn_off,
  do(turn_on,S_0))) -- state(s_1)={F}=state(s_2) (IDENTICAL) while s_1≠s_2 (DISTINCT SITUATIONS).
  "collision_demonstrated=True. No function of the state recovers the history. Situation≠State is
  forced, not stipulated."

  **DELIVERS THE EXPLICIT SELF-CONTRADICTION CRITIQUE**: "the supplied extraction's §1.2 table maps
  Situation→K_t state representation, do(a,s)→δ(K_t,e_t)→K_{t+1}. The mandate forbids accepting this,
  and it is right to: the extraction's own next line contradicts its own table" -- quoting the
  extraction's own admission that situations are histories not states -- "a source that maps
  Situation→K_t two lines above stating that situations are not states has supplied a correspondence,
  not a derivation."

  **DELIVERS THE CORPUS-INDEPENDENT PRIOR EVIDENCE, NAMED**: KR-HISTORY-2026-09-02
  (M-closure-event-kernel-vs-history.md, bridge candidate) ran the decisive configuration before Reiter
  was read: K_t,K_{t+1} identical ∧ History_1≠History_2. Test T2: "can historical closure be
  reconstructed from state alone? No -- identical current content, different histories; no function of
  K_t separates them." Kernel reads of history: 0, statically verified. ClosureEvent∈𝒦 REFUTED [NEG].
  Independence label reaffirmed: "KnowledgeOS-DERIVED · CORROBORATED BY REITER. Not Reiter-derived...
  this is the strongest possible outcome for the mandate's independence requirement, and it must not be
  inverted in later citation."

  **DELIVERS A NEGATIVE CORPUS-SEARCH FINDING ON THE THREE-LEVEL MODEL**: tests whether the corpus
  supports History→Situation→State-projection (three levels); a search of docs/knowledgeos/research/
  finds History=7 files, knowledge-state=2, provenance=32, identity=16, Observation=18, but
  "operation history"=0 and "event history"=0. `[NEG]`: "the corpus distinguishes History from State.
  It has NO attested intermediate Situation level, and no distinct notions of 'operation history' or
  'event history' at all. Therefore importing Reiter's three-level model would ADD a level the corpus
  does not have. That requires independent evidence, not analogy. Recorded as OPEN, not adopted." This
  is a precise, methodologically important negative finding not previously captured at this level of
  detail: even though Situation≠State is confirmed, the additional Situation LEVEL itself (distinct from
  both History and State) is NOT independently attested and must not be imported wholesale.

  **DELIVERS THE COLLAPSE-TEST CONCLUSION**: collapsing History and State would demonstrably contradict
  corpus evidence (KR-HISTORY T2 is a direct counterexample); collapsing "operation history"/"event
  history" is undefined since those concepts have no corpus extension at all -- "OPEN."
