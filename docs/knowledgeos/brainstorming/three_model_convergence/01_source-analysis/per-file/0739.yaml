defines:
  - concept: "'Checker must not use the LLM'"
    definition: "A deterministic checker's verdict function must satisfy f(input)=same output for the same relevant input every time it is executed; an LLM may be used to explain or contextualize a verdict after the fact, but it must never itself determine the authoritative PASS/FAIL/UNKNOWN result"
  - concept: "Golden Trace acceptance criterion (delete-and-rebuild)"
    definition: "The strongest test of the architecture's projection discipline: deliberately delete all derived projections (graph, search index, etc.), then rebuild them entirely from authoritative state and event history; the rebuilt projections must exactly match the originals, proving that the projections were never secretly holding authoritative information the domain state lacked"
  - concept: "The three-tier truth taxonomy"
    definition: "Every claim in KnowledgeOS carries one of three authority levels: Agent assertion (LOW authority -- what an AI believes or recommends), Engineering observation (OBSERVATIONAL authority -- what an external system currently reports), or Governed decision (GOVERNANCE authority -- what has been organizationally approved); Assurance is the mechanism that connects Governance's Expectation to Engineering's Observation via Verification"
  - concept: "The KnowledgeOS core equation"
    definition: "KnowledgeOS=Governance+Knowledge+Evidence+Assurance+Context+Authorization+Traceability, with AI functioning only as Consumer+Reasoning Actor and external EngineeringSystems retaining Operational Authority -- the most compact single summary of the entire target architecture"
