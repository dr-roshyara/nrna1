defines:
  - concept: "The five-state maturity chain (OBSERVED/DESIGNED/IMPLEMENTED/ENFORCED/ASSURED)"
    definition: "A concept's maturity within KnowledgeOS's architecture passes through five distinct states, none reached automatically from the prior: OBSERVED (directly evidenced in reality), DESIGNED (intentionally specified in the architecture), IMPLEMENTED (present in actual software/artifacts), ENFORCED (runtime/tooling actively prevents violation), and ASSURED (evidence demonstrates the required property holds) -- a design can exist without being implemented, an implementation can exist without being enforced, and an enforcement mechanism can exist without ever having been independently assured"
  - concept: "'The crucial DDD test'"
    definition: "Before accepting any candidate concept as a genuine bounded context, ask specifically what invariant cannot be maintained without that boundary existing -- if no answer can be given, the concept should not become a bounded context merely because its name sounds architecturally significant; this prevents 'architecture by noun collection,' where nouns accumulate bounded-context status without earning it through model, language, invariants, ownership, and lifecycle"
  - concept: "'Agent sessions as ephemeral epistemic states'"
    definition: "An individual AI agent session's observations, working hypotheses, temporary memory, and candidate conclusions must never be treated as KnowledgeOS's authoritative historical record -- they are inputs that may flow into that governed record, but the session itself remains ephemeral and non-authoritative, directly following from Continuity≠Memory"
