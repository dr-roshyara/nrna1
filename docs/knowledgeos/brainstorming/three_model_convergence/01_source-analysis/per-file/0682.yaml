defines:
  - concept: "Responsibility≠Authority≠Accountability"
    definition: "Three distinct organizational dimensions: Responsibility (who is tasked with producing something), Authority (who is permitted to approve/decide it), and Accountability (who is answerable for the outcome) — these may overlap for a given actor but are not identical, and delegating execution (even to AI) does not automatically delegate accountability"
  - concept: "Dissent→KnowledgeArtifact"
    definition: "A legitimate minority objection or technical concern raised during a collective decision process, even when overruled by the final decision, must be preserved as a discoverable knowledge artifact — dissent is evidence about residual uncertainty and alternative models, not mere social friction to be discarded once a decision is reached"
  - concept: "ProceduralValidity≠SubstantiveTruth"
    definition: "A collective decision can be fully procedurally valid (correct authority, quorum, voting rule, timing) while resting on low-quality or incorrect evidence, and conversely a substantively well-supported recommendation can arise from a procedurally invalid (bypassed) process; Assurance(D)=(ProceduralValidity,EpistemicSupport) as two independent dimensions, neither implying the other"
  - concept: "Decision≠Fact (organizational memory)"
    definition: "A governance decision should be recorded as 'the organization decided X under conditions Y (rationale, evidence, authority, date, scope)', never as 'X is objectively true' — preserving the decision as a scoped, conditioned organizational act rather than promoting it to universal fact"
  - concept: "OrganizationalStructure≠DomainStructure (Conway's-Law-adjacent)"
    refinement: "A change to organizational reporting structure should not automatically force a redesign of the business-domain model it is unrelated to, but a genuine transfer of domain ownership between organizational units does require explicit authority-impact analysis — the two structures are related but must not be conflated"
