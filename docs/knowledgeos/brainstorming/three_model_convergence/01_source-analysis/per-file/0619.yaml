defines:
  - concept: "T_{A→B}:K_A→K_B (semantic translation)"
    definition: "A directional, generally non-invertible mapping between knowledge structures of two bounded contexts, classified by TranslationType∈{Lossless,Lossy,Approximate,Partial,Invalid}, always distinct from equality"
  - concept: "TranslatedEvidence≠NativeEvidence"
    definition: "A claim translated from one bounded context into another must never be represented as though it originated natively in the target context; its lineage must remain traceable back through the translation to its source claim and evidence"
  - concept: "Semantic conflict vs. factual conflict"
    definition: "A factual conflict is a disagreement about the value of the same proposition (X=10 vs X=20); a semantic conflict is merely two contexts using the same term with different meanings, and must not be treated as contradiction until meaning-equivalence under context is established"
  - concept: "Four-transformation taxonomy"
    definition: "Identity (Reference→Entity), Semantic (Concept_A→Concept_B), Epistemic (Evidence→Claim→Model), and Decision (Knowledge→Action) transformations, explicitly required to remain distinct rather than being unified under one generic Transform() operation"
  - concept: "KOS={(K_C,G_C,T_C)}_{C∈Contexts}"
    definition: "KnowledgeOS reformulated as a multi-context epistemic system — per-context knowledge, per-context semantics/dependencies, and per-context translation mappings — rather than a single monolithic knowledge graph"
