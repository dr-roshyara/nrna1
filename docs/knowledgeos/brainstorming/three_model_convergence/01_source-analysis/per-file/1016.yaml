about: >
  "07 · GK Registry Reconciliation," status "RECONCILED — 19 v0.1 entries × 16 r286 entries → 20 distinct
  terms; 6 ID collisions; 1 term agrees" [likely a minor internal miscount, since §1 itself shows 8 IDs
  agreeing, not 1 -- recorded as observed, not corrected].

  **§1 delivers the definitive full crosswalk of all twenty distinct terms**: 8 IDs agree (Kṛṣṇa,
  Arjuna, Kṣetra, Kṣetra-jña, Ātman, Karma, Karma-phala, Sārathi, Jñāna); 6 collide (Sañjaya `GK-09/v0.1`
  vs `GK-16/r286`; Buddhi `GK-10/v0.1` vs `GK-09/r286`; Dharma `GK-12/v0.1` vs `GK-10/r286`; Vairāgya
  `GK-14/v0.1` vs `GK-11/r286`; Yoga `GK-15/v0.1` vs `GK-12/r286`; Guṇa `GK-16/v0.1` vs `GK-14/r286`; Mokṣa
  `GK-17/v0.1` vs `GK-15/r286`); Manas exists only in v0.1 (`GK-11`); `Ω` and Zero exist only in v0.1
  (`GK-18`, `GK-19`).

  **§2 NAMES THE "WORST" COLLISION**: **`GK-16` means Guṇa in v0.1 and Sañjaya in r286** -- "a citation of
  `GK-16` could mean the strongest finding [Sañjaya, the observation-layer recovery] or an unexamined one
  [Guṇa, flagged not opened]." Also flags `GK-09` as doubly dangerous: "same term (Sañjaya) has two IDs AND
  one ID has two terms."

  **§3 ADOPTS THE FORMAL CITATION RULE**: "Always spell the term. Where an ID is used, qualify it:
  `GK-nn/v0.1` or `GK-nn/r286`. A bare `GK-nn` is not a resolvable reference in this programme." Confirms
  retroactive application: prior artifacts used r286 throughout.

  **§4 DELIVERS A FORMAL RECOMMENDATION TO THE REGISTRY OWNER (explicitly NOT a decision)**: "One numbering
  must become authoritative... Recommended: adopt v0.1's numbering and extend it, since renumbering the
  smaller set is cheaper and v0.1 is the document that declares itself a register." **But explicitly flags
  three v0.1 classifications that need strengthening before adoption**: `Kṣetra-jña` Candidate→RATIFIED;
  `Sañjaya` Analogy→corpus-native construct; `Jñāna→Knowledge` Partial→REFUTED (relocate to `δ`). Closes:
  "Not adopted. Not renumbered. Recorded for the registry owner." This is a disciplined recommendation with
  its own governance-boundary respected, consistent with file 1015's already-tracked finding that the
  programme has reached a governance boundary.
