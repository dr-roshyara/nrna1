    refinement: "Applied here to BOTH of the user's earlier Chapter-4-related observations in immediate succession within the same file (state continuity and 'only Krishna knows'), each given a precise, theology-free mathematical/architectural restatement, and the file closes with the arc's most explicit summary disclaimer yet about the relationship between the Gita material and the architecture -- the clearest single statement of the discipline's actual epistemic status to date"
