defines:
  - concept: "The five formal temporal dimensions"
    definition: "Valid time (T_v, when a proposition is actually true in the domain), Observation time (T_o, when an actor or system observed it), Knowledge/record time (T_k, when the organization acquired or recorded the information), Decision time (T_d, when an authorized decision was made based on it), and Execution time (T_x, when an action actually occurred) are five potentially distinct temporal coordinates for the same underlying proposition -- collapsing them into a single timestamp destroys the ability to answer basic organizational questions like 'what was known at time t' versus 'what was actually true at time t'"
  - concept: "'Representation precision must not exceed epistemic precision'"
    definition: "When the actual available knowledge about a temporal fact is bounded or uncertain (e.g. 'the change happened sometime between 08:00 and 08:15'), the system must not force that knowledge into a fabricated exact value (e.g. storing T_v=08:07) merely because the storage schema demands a single timestamp -- doing so manufactures false precision that misrepresents the genuine epistemic state, directly extending the arc's broader discipline against silently upgrading uncertain knowledge into apparently certain knowledge"
  - concept: "The theology-free reformulation of 'the new state does not know the old state'"
    definition: "A current state representation S_t is generally a lossy projection of its full causal history H_t (S_t=Projection(H_t), but S_t⇏H_t) -- this is stated here explicitly as a legitimate, self-contained software architecture principle ('a state representation need not be sufficient to reconstruct its own causal history') rather than as a claim imported from or dependent upon the Gita Chapter 4 source material, demonstrating that the architectural insight stands on its own mathematical merits independent of its originating conceptual lens"
