about: >
  A two-part, non-duplicated file (bare "#" marker at line 484 separates two sequentially connected
  documents, verified distinct, not the intra-file duplication pattern) that identifies REASON as "the
  missing bridge we have been searching for" between observation and fact, directly deepening 0371's
  Fact-Determination answer.

  PART 1 (lines 1-483) refines the chain from Observation->Evidence->Fact to Observation->Evidence->
  Reason->Determination->Fact, with Reason=(Evidence,Facts,Rules,Principles,Methods,Arguments,Context).
  Enumerates SEVEN KINDS OF REASON (Empirical: O->F; Logical: A,A=>B|-B; Historical: consistent prior
  observation; Procedural: follows established method; Institutional: authorized-body determination per
  applicable rule; Legal/normative: applicable law requires X; Probabilistic: most-supported explanation
  given evidence) -- crystallized as "Probability is one kind of reason. It is not the definition of
  reason." Proposes a research-hypothesis Fact definition: Fact(p) <= Warrant(p|R,C,t) [p=proposition,
  R=reason/justification, C=context, t=time], yielding a candidate (explicitly NOT frozen) tuple
  F=(p,reason,context,time,provenance). Demonstrates via a worked example (two systems both stating "Nexus
  version is 3.69," System A's reason = live observation, System B's reason = three-year-old document) that
  SYNTACTICALLY IDENTICAL propositions can have DIFFERENT epistemic status because their reasons differ --
  "content alone is insufficient; we need the reason behind the content." Formalizes a recursive reasoning/
  history structure Reason_t->Fact_t->Reason_{t+1}->Fact_{t+1}->... extending 0371's recursive-memory model
  with an explicit Reason-indexed-by-time notation. Distinguishes REASON (why should this determination be
  made? R=>F) from JUSTIFICATION (why is that reason legitimate under applicable rules/principles?
  J(R,C)=>Valid(R)), yielding a five-stage chain Evidence->Reason->Justification->Determination->Fact.
  Applies the corpus's mathematical AND philosophical lenses (0369/0370) specifically to Reason: Logic
  (does R|-p?), Probability (P(p|R)?), Information theory (does R distinguish p from competing
  propositions?), Temporal mathematics (when was the reason valid?), Causal reasoning (does R explain p or
  merely correlate?), Argumentation (what reasons support/attack p?), Nyaya (what is the valid pramana --
  the means by which p is known?), Navya-Nyaya (what precisely is the Reason<->Proposition relation?),
  Viveka (have we accidentally collapsed Observation=Evidence=Reason=Fact?), DDD (which distinctions must
  be preserved as domain invariants?) -- explicitly validating the multi-lens instruction's value.
  Introduces the corpus's first explicit "a fact can be WRONGLY DETERMINED" finding: Fact-determination !=
  Truth-in-reality -- a fact F1 properly determined from R1 at t1 can later be shown insufficient/incorrect
  by O_t2, becoming Superseded/invalidated, directly preserving the corpus's "Knowledge can be correct at
  one point in time and become incomplete or invalid later" principle (0354/0362/0363) -- with the crucial
  new implication that the REASON must be preserved ALONGSIDE the fact, otherwise the system cannot
  understand why the fact was ever accepted. Sketches the resulting Kernel-content candidate structure
  (Fact: proposition, reason, evidence, context, time, determination lineage), explicitly "not yet a Kernel
  design" pending lens-survival testing. Reformulates the research question from "What is a Fact?" to "What
  makes a reason sufficient to warrant the determination of a proposition as a Fact, under a given context,
  time, method, and set of governing principles?" Closes with the deepest synthesis to date: "Knowledge is
  not merely a collection of facts. It is a structured body of determinations whose facts are connected to
  the reasons that warranted them and can therefore participate in subsequent determinations" -- explicitly
  proposed as a falsification target under all lenses, not an adopted conclusion.

  PART 2 (lines 485-951) separates REASONING (=Logic, the inferential mechanism) from the truth-value V(p)
  it produces, formalizing V(p|E,F,R,C,t) in [0,1] with the classical/ideal case V(p) in {0,1} explicitly
  demoted to "the ideal/extreme case," not the whole model. Works a compliance-proposition example, then
  poses the pivotal underdetermination question: what does V(p)=0.8 actually MEAN? -- listing three
  explicitly non-equivalent candidate interpretations (Probability P(p|E)=0.8; Fuzzy truth T(p)=0.8; Degree
  of support Support(p)=0.8), warning "we must not automatically call every number between 0 and 1 a
  probability." Connects to the "try our best" principle via V_t*(p) in {0,1} (ideal) versus V-hat_t(p)=0.73
  (actual), with gap Delta_t(p)=V_t*(p)-V-hat_t(p) "if such a comparison is mathematically justified."
  Refines Reasoning-vs-Reason: Facts+Evidence+Rules -[Logic]-> Conclusion, then "Logic produces/controls the
  inference; V(p) characterizes the resulting epistemic assessment" -- Logic and its output value are
  explicitly distinct objects. Poses a genuine open mathematical research question via a worked example
  (A=0.9, A=>B, what should V(B) be? V(B)=f(V(A),V(A=>B)), what is f?), surveying SEVEN distinct
  mathematical regimes that would answer differently: Classical logic (V(p) in {0,1}); Fuzzy logic (V(p) in
  [0,1] with fuzzy inference rules); Probability (P(p|E) in [0,1]); Bayesian inference (P(p|E) propto
  P(E|p)P(p)); Dempster-Shafer/evidence theory (separates support from uncertainty); Many-valued logic;
  Intuitionistic logic (explicitly: "not proven" != "false") -- "these are different meanings of the
  interval [0,1]... precisely why we should not choose probability prematurely." Proposes the pivotal
  Kernel-content candidate: preserve Assessment(p,context,time,basis) rather than a committed P(p)=0.8,
  letting a REGIME interpret the assessment as P(p)=0.8 or T(p)=0.8 or Support(p)=0.8 -- explicitly
  restating the corpus's central principle "The Kernel preserves the epistemic substrate; regimes provide
  mathematical interpretations." Reformulates the deep ideal-vs-observed distinction as Ideal Knowledge ->
  deterministic resolution where possible, Observed Knowledge -> graded epistemic assessment where
  necessary, listing seven named causes of gradedness (incomplete observations, overlapping observations,
  complex phenomena, conflicting evidence, partial observability, missing facts, underdetermining rules).
  Closes by declaring the "Is Knowledge probabilistic?" question ALREADY ANSWERED (no), replacing it with
  the sharper "What is the mathematical meaning of an epistemic value v in [0,1], and under what conditions
  should it be interpreted as probability, truth degree, evidence strength, confidence, or something else?"
  -- reapplying the eight-regime lens list (Classical Logic/Fuzzy Logic/Probability/Evidence Theory/
  Measurement Theory/Information Theory/Epistemic Logic/Temporal Logic) and proposing that whatever is
  COMMON across all these representations (not probability, not fuzzy truth, not measure theory alone) "may
  be one of the strongest candidates for the eventual KnowledgeOS substrate."
