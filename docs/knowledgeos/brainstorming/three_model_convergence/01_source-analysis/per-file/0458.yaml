about: >
  A focused DDD architectural-boundary decision directly following 0455-0457's Dimension Discovery/Semantic
  Reconstruction/parser-lens work: **should natural-language parsing belong inside KnowledgeOS?** Answers
  yes, but with an important boundary: KnowledgeOS should own the **semantic reconstruction capability**,
  while individual parsing technologies (C-type structural, Sanskrit-type semantic) remain **replaceable
  implementation mechanisms**. Justifies ownership because the Knower never supplies dimensions explicitly
  (only an intention, e.g. "Show me those with whom I have to fight"), so KnowledgeOS itself must transform
  intent into structured inquiry: KnowledgeOS ⊃ SemanticReconstruction ⊃ Parsing. If parsing were fully
  external, an unowned architectural gap would open exactly where KnowledgeOS is supposed to understand the
  Knower's intent (Human -> External parser -> ??? -> KnowledgeOS).

  Rejects making "the parser" itself a fundamental domain object (no `KnowledgeOS.CParser` /
  `KnowledgeOS.SanskritParser` as domain classes). Instead places parser implementations *under* an explicit
  Inquiry/Semantic Reconstruction capability (Structural Analysis, Semantic Role Analysis, Reference
  Resolution, Modality Analysis, Context Extraction) sitting alongside a separate Knowledge Model
  (Observation, Dimension, Statement, Value, Relationship, Evidence) -- both are named KnowledgeOS
  capabilities, with concrete parser implementations as swappable adapters beneath the Semantic
  Reconstruction capability. States the DDD dependency rule explicitly: "the domain capability owns the
  contract; parsing technologies implement the contract" -- the architecture depends on the abstract
  SemanticRepresentation type, never concretely on CParser or SanskritParser.

  Explicitly uses this boundary to **protect the corpus's Sanskrit-lens research discipline**: since the
  Sanskrit lens is something the corpus has repeatedly said it is *learning from*, not something proven to
  be the final implementation (directly continuing 0457's self-correction of the "universal semantic
  ontology" overclaim), KnowledgeOS must never say "our parser is Sanskrit grammar" but rather "KnowledgeOS
  requires semantic-role reconstruction; Sanskrit grammar provides one important lens from which we can
  derive and test the required semantic capabilities" -- "much safer architecturally."

  Establishes the precise ownership boundary: KnowledgeOS owns Intent->SemanticRepresentation->
  DimensionCandidates->Inquiry; parsing engines merely provide NaturalLanguage->Structural/Semantic
  Representation, entering KnowledgeOS as "replaceable analytical providers" via a full architecture
  diagram (Knower Intent -> Semantic Reconstruction -> Dimension Discovery -> Zero/Lord/Sārathi ->
  Investigation -> Knowledge, with structural and semantic-role parsers feeding in from outside the
  capability boundary). Gives a deeper justification tied to Parsing != Dimension Discovery: a parser only
  produces role-value pairs (Agent=Arjuna, Action=fight, Target=unknown, Modality=obligation);
  KnowledgeOS itself must then reason about relevance (Dimension Discovery), gaps (Zero), and next action
  (Sārathi) -- "that entire orchestration cannot sensibly belong to an external parser. It is the epistemic
  responsibility of KnowledgeOS."

  Closes with a formal architectural conclusion: **KnowledgeOS = SemanticReconstruction + DimensionDiscovery
  + EpistemicOperations + KnowledgeModel**, while **Parser ∈ Implementation of SemanticReconstruction**.
  Explicitly defers the separate infrastructure question of *where* a parser is physically deployed
  (in-process, separate service, or external model/library) as a later implementation decision, distinct
  from and subordinate to the architectural-ownership question this file resolves.
