defines:
  - concept: "The historical-regression finding (Later≠Better, Chronology≠Supersession)"
    definition: "A discovery from the corpus's own later verification work that its historical steps do not form a monotonically improving sequence: several identified later steps actually contain LESS formal content, weaker treatments, or dropped details relative to specific identified earlier steps, even though they are chronologically later and might naively be assumed to supersede them. Five concrete named examples are given (Step 068 vs. earlier AGM-insufficiency detail; Step 075 vs. earlier EVSI; Step 081 vs. earlier identifiability structure; Step 078 vs. earlier multi-agent/adversarial-source treatment; Step 094 vs. earlier hash-chain machinery). The resulting methodological rule -- a later-numbered document must never be assumed superior or authoritative over an earlier one purely by virtue of its position in the sequence; supersession must be independently verified -- is declared a core rule for reconstructing the corpus's true history, and is directly relevant to this reconstruction's own future canonical-synthesis work, where the same discipline should apply to files read later in this very sequential pass relative to files read earlier"
  - concept: "The earlier eight-element candidate kernel 𝒦=(E,S,T,O,P,R,Π,A)"
    definition: "A candidate mathematical/domain kernel for KnowledgeOS discovered by the archaeology to have existed HISTORICALLY PRIOR to (and independently of) the five-element kernel 𝔎=(G,σ,θ,λ,π) this reconstruction's own mathematical-kernel sub-arc (0856-0861) derived through pure theoretical construction: E Entities, S States, T temporal/event structure, O Observations, P Propositions, R typed Relations, Π Policies, A Actions. The file explicitly forbids assuming the later five-element kernel simply supersedes or replaces this earlier eight-element one (applying the Chronology≠Supersession principle to the reconstruction's own central open question), instead posing the relationship as an open, unaccepted candidate reduction mapping (G↔(E,R), σ↔(P,O,epistemic status), θ↔(S,T), λ↔(R,T,O), π↔(Π,A)) requiring independent demonstration -- a genuinely important discovery bearing directly on this reconstruction's own eventual gated (§29) canonical Kernel synthesis, since it shows at least two independently-arising, non-identical candidate kernels exist within just this one model's own corpus, before any cross-model comparison has even begun"
