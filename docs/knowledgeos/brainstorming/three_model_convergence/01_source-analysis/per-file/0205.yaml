about: >
  Extracts David Freedman's Statistical Models and Causal Inference (essays warning that statistical
  sophistication cannot substitute for research design, subject-matter knowledge, relevant data, and
  empirical testing) explicitly not as a statistics source but as "an epistemic discipline for preventing a
  system from turning models, correlations, assumptions, or fluent explanations into unjustified
  knowledge" -- ranked by its own final table as more important for KnowledgeOS than the preceding Human-AI
  Interaction book (0204). Central architectural principle: "No inference without an explicit inferential
  basis" -- Data->Observation->Interpretation->Inference->Claim must never collapse into Data->AI-says-X->
  Knowledge=X. Reinforces Observation-vs-Inference as distinct epistemic objects with a worked example
  ("teams using pattern X had fewer incidents" is an observation; "pattern X reduces incidents" is a causal
  claim). Proposes an explicit Inference object (question/conclusion/evidence/observations/method/
  assumptions/mechanism/rival_explanations/limitations/validation/confidence/authority/provenance) with
  Inference != Evidence != Observation != Claim as a fundamental separation. Elevates Assumption to a
  first-class object -- "probably the most important architectural addition" -- with a schema (statement/
  type/justification/evidence/testability/status/consequence_if_false/scope) and a six-state status
  vocabulary (SUPPORTED/PARTIALLY_SUPPORTED/UNSUPPORTED/UNTESTED/UNTESTABLE/CONTRADICTED), organized into an
  AssumptionLedger per model. Elevates "we can't tell from the data available" (the book's own core lesson,
  per its editors) into a first-class KnowledgeOS outcome vocabulary (SUPPORTED/REFUTED/INCONCLUSIVE/
  INSUFFICIENT_EVIDENCE/NOT_IDENTIFIABLE), explicitly framing NOT_IDENTIFIABLE as successful epistemic
  processing, not failure. Elevates RivalExplanation to a first-class object (hypothesis/supporting_
  evidence/contradicting_evidence/tests/status/unresolved_questions), reframing a Claim's structure to carry
  supporting AND contradicting evidence, observations, inferences, assumptions, rival explanations,
  validation, scope, and uncertainty together. Proposes an EvidenceConvergence pattern (claim supported by
  multiple independent evidence types -- direct/indirect/quantitative/qualitative/experimental/
  observational/case-based/mechanistic/temporal/comparative -- with claim status calculated from the
  STRUCTURE of the argument, not an LLM confidence number). Reframes Anomaly as a generative architectural
  event (Observation->Anomaly-detected->Research-Question->New-Hypothesis->Investigation), extending the
  corpus's Observation concept into a bridge between Knowledge and Research, illustrated with a worked AI-
  Engineering example (an agent's policy-inconsistent recommendation becomes an anomaly, a research question
  about the retrieval pipeline, and new knowledge about validity filtering). Explicitly rejects quantitative-
  data-automatically-dominates-qualitative-evidence, motivating an eight-value Evidence type taxonomy
  (quantitative/qualitative/documentary/observational/experimental/experiential/expert/computational) and
  validating domain/subject-matter expertise as knowledge that can determine inference validity, assumption
  plausibility, confounder existence, and model appropriateness -- not merely supplementary documentation.
  Proposes a ResearchDesign object (research_question/population/observations/comparison/intervention/
  natural_variation/confounders/rival_explanations/measurement/analysis_method/validation/limitations,
  grounded in Snow's cholera work as an example of natural-experiment rigor). Extracts "method != truth" --
  sophisticated methods (regression adjustment, logistic regression, propensity scores, robust standard
  errors) do not rescue a bad model, motivating a Method->Analysis->Result->Validation->InferenceStatus
  pipeline and a concrete "[CAUSAL-INFERENCE-GATE]" nine-question AI-Engineering-Platform guard (research
  design? mechanism? assumptions? confounders? rival explanations tested? causal pathway identifiable?
  observational-or-experimental? validation? scope of inference?) that BLOCKs or DOWNGRADEs an AI causal
  claim to a mere association claim if the answers are unavailable. Extracts "diagnostics are not proof" --
  model diagnostics cannot have general power against all alternatives and cannot validate basic regression
  assumptions from data alone, motivating a precise verification-result semantics distinction (PASS meaning
  "specified invariant satisfied," never "model is correct" or "system is trustworthy"). Proposes a
  CausalIdentificationAssessment gate (mechanism-specified? / confounders-addressed? / rival-pathways-
  excluded? / research-design-adequate? -> IDENTIFIED/PARTIALLY_IDENTIFIED/NOT_IDENTIFIED/UNKNOWN) and an
  explicit five-value association-vs-causation semantic ladder that LLMs must not silently promote across
  (ASSOCIATION/CORRELATION/TEMPORAL_ASSOCIATION/MECHANISTIC_INFERENCE/CAUSAL_CLAIM). Produces a five-rung
  Claim Maturity Ladder (OBSERVED->DESCRIPTIVE->ASSOCIATIVE->EXPLANATORY->CAUSAL, each rung requiring
  progressively stronger evidence/identification), explicitly proposed as the basis for policy-driven
  epistemic governance -- a claim typed CAUSAL automatically requires ResearchDesign/AssumptionLedger/
  RivalExplanationAnalysis/IdentificationAssessment/EvidenceConvergence/Validation, while a DESCRIPTIVE
  claim requires much less. Explicitly rejects an anti-statistics over-reading ("models are instruments,
  not authorities," not "statistical models are bad"), listing ten legitimate mechanism types (statistics/
  ML/Bayesian-models/regression/causal-models/simulation/LLMs/expert-judgment/qualitative-research/case-
  studies) none of which gets automatic epistemic authority from mathematical sophistication alone. Produces
  a full architectural diagram (Observations+Sources->Evidence[Qualitative/Quantitative]->Inference
  [Assumptions/Rival-Explanations/Mechanisms]->Validation/Testing->Identification-Status->Claim
  [Supported/Inconclusive]) and an AI-Platform-above-KnowledgeOS diagram with the explicit governing
  principle "the AI Platform can generate an inference, but KnowledgeOS determines what epistemic status
  that inference has." Produces fifteen candidate new domain objects (Observation/Evidence/Inference/Claim/
  Assumption/Model/ResearchQuestion/ResearchDesign/Mechanism/RivalExplanation/Confounder/Validation/
  IdentificationAssessment/Anomaly/Uncertainty), explicitly noting some may already exist under different
  names -- "I would not automatically create duplicates; the important thing is the conceptual separation."
  Produces ten named architectural invariants (Evidence!=Inference, Inference!=Truth, a-model-does-not-
  validate-its-own-assumptions, association!=causation, a-method's-successful-execution!=validity-of-its-
  conclusion, unresolved-alternatives-reduce-claim-strength, Unknown-is-a-valid-epistemic-outcome,
  qualitative-evidence-is-legitimate-when-sourced-and-contextualized, subject-matter-knowledge-is-part-of-
  inference-validity-not-mere-documentation, a-validation-gate-only-establishes-what-it-was-designed-to-
  establish). Closes by explicitly connecting back to 0204's Human-AI Collaboration finding: Freedman
  explains WHY AI should not replace human judgment -- judgment is required to select the question, data,
  assumptions, mechanism, confounders, alternatives, and method, and to determine what a result actually
  establishes -- reframing the architecture's starting point from "AI -> answer" to "Question -> Research
  framing -> Evidence -> Method -> Inference -> Challenge -> Validation -> Claim."

