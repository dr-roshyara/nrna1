  - concept: "0331's frozen MeasurementResult=(Value,Status) and its four-status Zero-Lens-safe vocabulary"
    refinement: "Extended to (Value,Status,Scale,Regime,...) with optional Unit/Reference/AdmissibleTransformations, since a bare Value+Status is judged insufficient without knowing the underlying scale type and regime"
  - concept: "0331's frozen four-tier Kernel candidate list (Very-high-confidence/Semantic/Epistemic/Derived) and its Non-Redundant Work Test"
    refinement: "Sharpened Kernel-boundary statement: from preserving 'the substrate from which measurements can be derived' to preserving 'enough of the empirical relational structure to prove or test whether a desired measurement representation exists' -- a stronger, formally-grounded requirement"
  - concept: "0324/0327's ten-dimensional/measure-theoretic Knowledge Vector K(e)/Q_K and their proposed weighted scalarization"
    refinement: "Explicitly retained but gated: Score(Q_K) may only be formed if a measurement theorem (representation + meaningfulness) is established for the combining operation; produces a compatible-vs-incompatible decision tree rather than unconditional aggregation"
  - concept: "The corpus's earlier casual evidence-accumulation and delta-confidence proposals (E1+E2+...+En, Delta-Confidence=C_t2-C_t1)"
    refinement: "Both explicitly subjected to Roberts' extensive-measurement and difference-measurement conditions respectively; neither automatically legitimate without a demonstrated formal structure"
  - concept: "An uploaded synthesis's scale-type table (Truth=Absolute, Epistemic Distance=Ratio) -- likely part of the 0327-0331 Measure Theory lineage though not itself a numbered file in this reconstruction's pass"
    refinement: "Explicitly corrected on both points as category errors, with Information Gain also downgraded from unconditional 'ratio scale' to 'information-theoretic quantity with a defined unit, not automatically ratio'"
  - concept: "The corpus's identity-primitive discussions (McGinn, 0273/0276/0278) and the Kernel-boundary discussion of measurement-indistinguishability"
    refinement: "Directly connected: measurement equivalence (aE_R b under regime R) is explicitly distinguished from ontological identity, reinforcing the corpus's prior discipline against collapsing resemblance into identity (MD-017-adjacent)"
  - concept: "0322/0324/0325's capacity formalizations (Representational/Reasoning/Observation/Memory/Computation etc.)"
    refinement: "Enriched with a fourth explicit Measurement dimension: Capacity_A=(Representational,Epistemic,Inferential,Measurement)"
contradicts:
