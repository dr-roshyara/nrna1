  - concept: "Four-level causal knowledge hierarchy"
    definition: "Sequence (A≺B, directly observable) < Association (A~B, statistical) < CausalHypothesis (A⇒?B, provisional) < CausalKnowledge (A→B, accepted under an explicit causal model and evidence)"
  - concept: "Identification"
    definition: "Whether P(Y|do(X)) can be validly computed from available observational data via an explicit causal model and adjustment formula (P(Y|do(X))=Σ_z P(Y|X,z)P(z)); when no valid strategy exists, Identifiable=False is an explicit, first-class state, not a silent failure"
