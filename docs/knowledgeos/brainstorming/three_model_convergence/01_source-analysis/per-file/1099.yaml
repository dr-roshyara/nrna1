about: >
  "21 — Dimension · Value · Purification — candidates from the newest Gītā-lens batch," verdict "a FIFTH
  independent arrival at 'no total order on `K`' -- this time as a PARETO problem. Plus a `dimension`/`value`
  layer that `≡_D` silently presupposes and the ratified eight primitives do not carry. Still 0 new
  primitives."

  **DELIVERS THE HEADLINE FIFTH ARRIVAL AT "NO TOTAL ORDER ON `K`"**, via a purification proposal that
  unprompted refuses `v_{t+1}>v_t` ("'higher is not always better': uncertainty may decrease, provenance
  completeness may increase, contradiction may decrease"), correctly identified as a PARETO/dominance
  problem: "A Pareto order is a PARTIAL order and admits INCOMPARABLE states by construction." **Lists the
  full five-route convergence table**, consolidating this reconstruction's already-tracked findings: (1)
  measured, the `Σ`-axis audit (already tracked, files 1037-1039, 0 of 5 axes ordered); (2) measured,
  retraction non-monotonicity (already tracked, EXECUTED); (3) corpus, `060 §60.71` ("cannot yet assert...
  semilattice," already tracked, file 1058/1073); (4) corpus, `274.32` (already tracked, file 1092's second
  join-semilattice warning); (5) this philosophical lens, Pareto not total order. Boxed: "Five routes, five
  methods, one conclusion: there is no total order on `K`. This is now AMONG THE BEST-SUPPORTED NEGATIVE
  RESULTS IN THE PROGRAMME."

  **DELIVERS A GENUINELY VALUABLE SYNTHESIS MERGING TWO PREVIOUSLY SEPARATE REGISTER ITEMS**: sharpens
  `M-Q3` (the missing metric) into a precise statement -- "the gap is not 'we lack a number.' It is: the
  dimensions are HETEROGENEOUS and their improvement DIRECTIONS differ, so no scalar metric can exist without
  a NORMATIVE WEIGHTING" -- and discovers "`M-Q3` and `M-Q4` [the undeclared loss function] are therefore the
  SAME DECISION SEEN TWICE, which NEITHER `17` NOR `291` HAD NOTICED." A genuinely valuable cross-cutting
  discovery unifying two previously distinct open items.

  **DELIVERS A STRIKING NEW FINDING: THE ALREADY-RATIFIED `≡_D` (VALUE-LEVEL SEMANTIC EQUALITY) SILENTLY
  PRESUPPOSES A MISSING `DIMENSION` OBJECT**: `264.15`'s already-established `3m≡_D 300cm` "holds because both
  are values of the DIMENSION length. Without `d`, `≡_D` has nothing to quantify over." Delivers the precise
  gap: the ratified eight primitives carry `Proposition` (the sentence) but NEITHER `dimension` NOR `value`,
  though `≡_D` operates on the latter. Explicitly NOT promoted, recorded as `D-Q1` with two open readings ((a)
  derived structure inside `Proposition`, cheaper; (b) missing primitives, which would CONTRADICT `C-022`'s
  "50 attack classes, no counterexample" claim). Delivers a genuinely sharp connection to the already-tracked
  Audit-A "wrong level" finding for `≡_D` (file 1079/1092): "This says the 'wrong level' is not merely
  irrelevant to `K`; IT IS A LEVEL WITH NO CARRIER."

  **DELIVERS THE SIXTH DISJOINT OPERATION VOCABULARY, EXPLICITLY TALLIED AGAINST THE ALREADY-TRACKED
  SEQUENCE**: `𝒪={E,R,C,X,Q,Z,...}` (Expansion/Refinement/Correction/Contradiction-resolution/Qualification/
  Zero-detection). Delivers the full six-item vocabulary tally table: `272A`'s `𝒪_sem` (19, already tracked);
  `external_research`'s pseudo-algorithm (43, already tracked); the corpus registry (22, already tracked);
  Chapter 13's type ontology (7, already tracked); `Ω_K` + 11 named operations (already tracked, file 1098);
  and this batch's `{E,R,C,X,Q,Z}` (6). Boxed: "SIX vocabularies. `G-68` recorded three. `G-86` added a
  fourth. This adds a sixth." **Discovers a genuinely important point of contact**: `Qualify` appears in BOTH
  the newest two vocabularies (`Ω_K`'s `Qualify` and this batch's `Q`), "reinforcing `20 §1`: any minimal
  kernel algebra containing `Qualify` inherits `G1`" -- a second independent construction landing on the same
  irreducible gap.

  **DELIVERS THE T0-LEVEL REFUSAL "SENTENCE = DIMENSION"** and its formal C8 constraint: "Purification ≠
  monotonic accumulation" ("higher is not always better").

  Confirms the disciplined non-license: "The Pareto finding does not supply an order -- it explains WHY NONE
  EXISTS... The dimension/value layer is not promoted... The sixth vocabulary is not adopted... Steps 288-291
  unchanged; all `R6`." And confirms the discipline held again: "both new sources refuse their own strongest
  reading... BEFORE being asked to."
