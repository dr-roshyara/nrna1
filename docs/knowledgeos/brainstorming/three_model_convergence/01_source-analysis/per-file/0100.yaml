about: >
  A review of the real Tarka-Saṅgraha (Annambhaṭṭa, 17th century), a Nyāya-Vaiśeṣika synthesis
  textbook, organized as 8 "lenses" each producing an H-KOS-* candidate. Primarily a systematic
  recombination of already-tracked concepts (Pramāṇa, reasoning trace, relations-as-first-class,
  semantic precision, agent reasoning) under one coherent 7-layer architecture, with two genuinely new
  contributions: an ontology-category typing requirement (Vaiśeṣika-sourced, ⭐ first substantive
  Vaiśeṣika content beyond a single prior mention) and a 5-state error/knowledge vocabulary distinct
  from 0096's similarly-shaped one.

introduces:
  - "⭐ First substantive Vaiśeṣika ontology content (previously only a single passing mention, 0094's
    Abhāva-as-one-of-seven-Vaiśeṣika-categories): H-KOS-Ontology-001 -- 'every knowledge object SHALL
    have an explicit ontological category describing what kind of entity, property, relation, event,
    or absence it represents.' A category-TYPING requirement (what KIND of thing is this, prior to any
    field values), distinct from but related to the Identity 6-tuple (0099) and Avacchedaka type
    system (0099)"
  - "H-KOS-ErrorState-001 (Mithyājñāna/erroneous cognition): a 5-state discrete vocabulary VALID/
    UNKNOWN/CONFLICTED/SUPERSEDED/INVALID -- overlapping but NOT identical to 0096's Reasoning
    Verification Engine vocabulary (VALIDATED/QUESTIONABLE/CONFLICTED/INVALID/UNKNOWN): SUPERSEDED is
    new here, VALID/VALIDATED and UNKNOWN/QUESTIONABLE differ in naming -- a near-duplicate discrete-
    vocabulary proposal, not merged"
  - "Six other H-KOS-* candidates, all substantially restating already-tracked concepts: H-KOS-Pramana-
    001 (preserve how knowledge became known), H-KOS-ReasoningTrace-001 (preserve inference chain, ~=
    Reasoning Provenance), H-KOS-KnowledgeGraph-001 (relations first-class, ~= Relation/Sambandha),
    H-KOS-SemanticPrecision-001 (prevent ambiguous predicates, ~= Semantic Boundary Precision/Context-
    Bounded Meaning cluster), H-KOS-AgentReasoning-001 (preserve reasoning agent identity, ~= Agency)"
  - "Eleventh anchor reshaping: 7-layer 'KnowledgeOS Constitutional Model' -- Truth Constitution /
    Ontology Layer ('what exists?') / Pramana Layer ('how known?') / Reasoning Layer ('how concluded?')
    / Semantic Layer ('what does it mean?') / Evidence Graph / Revision Engine ('how corrected?')"
  - "Clean summary table: 'New Invariant Set Extracted From Tarka-Saṅgraha', 7 rows, ID+one-line purpose"
  - "Final characterization: 'Knowledge is not a stored object. Knowledge is a justified relationship
    between reality, observer, evidence, reasoning, and conclusion.'"

