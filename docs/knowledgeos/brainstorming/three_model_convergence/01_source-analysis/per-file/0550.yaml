  - concept: "Explicit rejection of classical AGM-style belief revision as insufficient for KnowledgeOS's kernel, since KnowledgeOS may intentionally retain inconsistent information rather than always restoring consistency"
  - concept: "A three-way classification of conflict responses: Contextual resolution, Epistemic resolution, and Irreducible conflict (a legitimate permanent endpoint, not a failure)"
  - concept: "'Conflict detection can reveal a modeling deficiency': an apparent contradiction between two propositions may actually indicate they concern different, previously unmodeled dimensions"
  - concept: "Sārathi's CommitWithConflict action, establishing that decisions do not require complete epistemic resolution"
  - concept: "Supersession formalized as a distinct relation from Conflict (Supersedes(P_new,P_old)), with the superseded assertion remaining historically valid for its own period"
  - concept: "Dependency propagation as reassessment, not automatic deletion: retracting one premise of a multiply-supported derived assertion does not automatically retract the derived assertion if other support remains"
  - concept: "The Kernel decidability vs. Open-world semantic inference boundary: general logical entailment and natural-language semantic equivalence are not generally decidable, so the kernel guarantees only deterministic handling of explicit relationships while AI-proposed interpretations always enter as Inferred/Proposed"
  - concept: "'Undecidable semantic questions must never be silently converted into deterministic facts,' a major KnowledgeOS principle enforcing a clean boundary between computation and interpretation"
  - concept: "Eight canonical Step-9 invariants (C1-C8) governing contradiction, paraconsistency, and belief revision"
  - concept: "'Step 10 — Inference and Derivation' as the corpus's next named research phase, directly targeting the original question of whether KnowledgeOS can actually compute, not merely describe, its knowledge transformations"
defines:
  - concept: "Four-valued epistemic status (𝔹={00,10,01,11})"
    definition: "00=neither side supported (Unknown), 10=P's side supported, 01=¬P's side supported, 11=both sides supported (Conflicted) — an epistemic-support status, never to be read as a four-valued truth value"
  - concept: "The paraconsistent principle (P,¬P⇏Q)"
    definition: "The presence of a contradiction P and ¬P within the Knowledge State must never license derivation of an arbitrary proposition Q — contradiction must remain local, without committing the kernel to any single specific paraconsistent logical system"
  - concept: "Revise (belief revision function)"
    definition: "K_{t+1}=Revise_ρ(K_t,e_t,EA_t) — identifies affected assertions, recalculates assessments, updates conflict relations, updates acceptance status, propagates to dependent assertions, and preserves history; a genuinely partial, policy-governed operation over nine named revision operations"
