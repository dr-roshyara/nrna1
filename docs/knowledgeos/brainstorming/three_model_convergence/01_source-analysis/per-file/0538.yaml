about: >
  Opens adopting an explicit tri-role discipline for all subsequent Evidence-theory work: Senior
  mathematician (algebraic structure, invariants, proofs, counterexamples), Senior statistician
  (uncertainty, dependence, sampling assumptions, calibration, likelihood, robustness), and Senior DDD
  architect (bounded contexts, aggregates, invariants, policies, events, implementation boundaries) --
  "We do not choose mathematics because it looks useful. We test candidate mathematics against the
  semantics and invariants of KnowledgeOS."

  **Delivers an important correction to the prior experiment's framing**: the four candidates (Max,
  Weighted Mean, Saturating combination, Bayesian Updating) should not all be called "evidence algebras" in
  the same sense -- they actually span THREE distinct layers: Layer 1 Evidence representation
  (`e=(P,π,ρ,κ,τ,δ,...)`), Layer 2 Evidence aggregation (`⊕_ρ`), Layer 3 Inference
  (`Γ⊢_ρP` or `P(H|E)`), crystallized as `Aggregation≠Inference` -- "Bayesian inference is not merely an
  alternative 'score formula.' It is a much richer inferential framework."

  **Delivers a consolidated ten-item test-criteria list (A-J)**: Duplicate invariance; Independent
  corroboration; Order invariance (commutativity); Associativity (critical since evidence may arrive
  continuously); Contradiction preservation (the output can never be a single `Score(P)=0.73`, it must
  retain `Support(P)` and `Support(¬P)` separately); Dependency awareness (an LLM restatement of an
  observation is not independent of it); Irrelevance (zero-relevance evidence must not materially
  strengthen P); Temporal validity (`Stale evidence≠nonexistent evidence`, it remains historically
  valuable); Context dependence; Policy dependence.

  **Delivers a genuinely new, rigorously statistical property not previously present in the corpus**:
  Calibration -- if a system states `P(H)=0.9`, then among all cases it classifies near 0.9, approximately
  90% should actually satisfy H, if the number is genuinely intended as a calibrated probability; otherwise
  "0.9 is merely a number pretending to be probability," crystallized as `Probability≠Confidence Score` --
  explicitly given as one reason the corpus should not casually convert KnowledgeOS's epistemic states into
  probabilities.

  **Delivers a second major statistical critique**: Bayesian multiplication commonly assumes conditional
  independence (`P(E_1,E_2|H)=P(E_1|H)P(E_2|H)`), but a realistic evidence chain (Database->LLM->Report->
  Human presentation) is NOT four independent observations -- it is a linear dependency chain
  `E_1->E_2->E_3->E_4` -- so treating them as independent "can produce severe overconfidence," directly
  validating the corpus's decision (0532/0534/0536/0537) to make the dependency graph a first-class
  KnowledgeOS concept rather than an afterthought.

  **Delivers a refined, four-bounded-context DDD structure**, extending the corpus's prior three-context
  models: Evidence bounded context (Evidence, Observation, Provenance, Dependency, Polarity,
  EvidenceQuality, EvidenceAssessment); a NEWLY PROMOTED, independent Conflict bounded context (Conflict,
  ConflictRule, ConflictStatus, ResolutionReference -- previously folded into Evidence or Reasoning, now
  given its own explicit responsibility); Reasoning bounded context (InferenceRule, InferencePolicy,
  Inference, Conclusion); Knowledge State bounded context (Assertion, KnowledgeState, StateTransition,
  Coherence). Delivers three explicit ownership invariants: `Evidence does not own Truth`,
  `LLM does not own Truth`, `Inference does not own Evidence`.

  **Delivers an explicitly-labeled HYPOTHESIS (not a conclusion)**: a predictive table estimating how the
  four candidate algebras will likely perform on Duplicate/Corroboration/Dependency/Contradiction/
  Probability-semantics properties, explicitly stated to require actual experimental confirmation rather
  than being accepted on the strength of the prediction alone -- sound epistemic discipline mirrored in the
  file's own methodology.

  **States the architectural conclusion the corpus is converging toward**: a full pipeline
  `RawInputs->Observations->Evidence->EvidenceGraph->Assessment->Inference->Conclusion`, alongside
  `KnowledgeState<->IdealState<->Discrepancy` and the established `Zero->Detect`, `Lord->Expand`,
  `Sārathi->Navigate` triad, reaffirming "The LLM is therefore not the epistemic foundation. It is one
  possible producer/transformer of observations and candidate propositions."

  **Closes proposing ten explicit adversarial stress cases** for the next experiment (100 copies of the
  same document; 100 LLMs reading the same document; 10 genuinely independent measurements; 5 contradictory
  authoritative sources; stale plus current evidence; highly reliable but irrelevant evidence; weak but
  independent evidence; evidence chains; missing provenance; deliberately misleading evidence), aimed at
  producing "a KnowledgeOS Evidence Calculus Test Report" with a Pass/Fail/Conditional verdict for every
  mathematical law -- explicitly framed as determining "what belongs in the KnowledgeOS kernel, what
  belongs in a policy, and what must remain an optional statistical inference mechanism."
