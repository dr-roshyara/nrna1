about: >
  A second, full domain-modeling pass over Stigler's Seven Pillars (companion to 0213's falsification-
  only pass), explicitly claimed by the source as possibly "even more important for KnowledgeOS than the
  Bayesian book" (0212). Central thesis: KnowledgeOS should provide the epistemic infrastructure on which
  different reasoning methods (statistics being one family) operate -- "a disciplined architecture for
  turning observations into defensible knowledge." Identifies Stigler's own open "eighth pillar" question
  (calibration/epistemic control under massive computational/exploratory-search flexibility) as almost a
  direct description of the problem KnowledgeOS is being designed to solve, and proposes a candidate
  KnowledgeOS Eighth Pillar: Epistemic Traceability and Calibration / Epistemic Control.
introduces:
  - concept: "Seven-pillar KnowledgeOS translation table: Aggregation->evidence compression, Information->marginal evidence value, Likelihood->uncertainty calibration, Intercomparison->reference-class reasoning, Regression->conditional/multivariate reasoning, Design->evidence-acquisition design, Residual->contradiction/model-diagnostics"
  - concept: "KnowledgeOS must distinguish retention from understanding (Funes the Memorious / 'big data without Statistics' as a cautionary figure)"
  - concept: "AggregationPolicy object (purpose/population/dimensions-retained/dimensions-discarded/weighting/assumptions/information-loss-assessment/reversibility); principle: information may be discarded only relative to an explicitly stated epistemic purpose"
  - concept: "Knowledge compression must remain traceable to evidence (Pattern with supporting/excluded observations, aggregation method, scope, confidence)"
  - concept: "Quetelet's Average Man warning: an aggregate representation must never silently acquire the ontological status of the observations from which it was derived ('a pattern is not a thing')"
  - concept: "EvidenceValue object (expected uncertainty reduction/decision relevance/acquisition cost/time/reliability/independence/discriminative power), grounded in Peirce's 'economy of research'"
  - concept: "ReferenceComparison object (Subject/ComparisonClass/InternalDistribution/RelativePosition/Assessment) with an explicit two-standard requirement: internal comparison must never replace an external standard"
  - concept: "InferenceFrame object (target/conditioning-variables/population/time-window/assumptions/perspective/purpose); 'No context-free inference' -- claim C under Frame F1 is not automatically equivalent to claim C under Frame F2"
  - concept: "EvidenceExperiment object (question/competing-hypotheses/variables/intervention/control/randomization-strategy/measurement-plan/stopping-criteria/expected-evidence/analysis-plan) -- 'evidence isn't just found, it can be designed'"
  - concept: "Residual object (Observed Reality - Explained Reality = Residual) as a first-class knowledge-generating source, not mere error; UnexplainedPhenomenon object (originating-model/observed-deviation/magnitude/context/recurrence/candidate-explanations/investigation-status)"
  - concept: "ModelFamily and ModelAssessment objects for explicit model comparison (does B explain something A cannot?)"
  - concept: "High-dimensional sparsity warning: dataset size does not determine epistemic adequacy (Stigler's 4^20-regions example); global data volume != local evidence density, directly applicable to LLM 'seen billions of tokens' overconfidence"
  - concept: "SearchMultiplicity object (hypotheses-considered/evidence-sources/queries/paths-explored/alternatives-rejected/final-conclusion) -- multiple-comparison awareness applied to AI agent search behavior"
  - concept: "'Garden of forking paths' translated directly into an AI-agent epistemic problem: an agent's hidden path-selection process (queries/documents/interpretations/hypotheses/tools/analyses tried and discarded) is invisible unless explicitly preserved"
  - concept: "Search-path provenance / Epistemic Lineage object (Question/Hypotheses/SearchPaths/Sources/Evidence/Transformations/Analysis/Alternatives/Selection/Conclusion/Confidence) as a fourth provenance category beyond Source/Acquisition/Analytical"
  - concept: "Proposed invariant: a conclusion whose selection path materially influenced its evidential status must retain the path information necessary to assess that influence"
  - concept: "KnowledgeOS-as-operating-system analogy made explicit: manages evidence / controls inference / preserves epistemic state / mediates knowledge access / records reasoning lineage / provides reasoning primitives / enables agents"
  - concept: "Candidate primitive list (~19 items: Observation/Evidence/EvidenceSet/Aggregation/InformationAssessment/LikelihoodAssessment/Comparison/InferenceFrame/Hypothesis/Model/ModelFamily/Prediction/Outcome/Residual/ModelAssessment/Experiment/ReferenceClass/SearchPath/AnalyticalPath/EpistemicState) and candidate domain services list, both explicitly flagged as discovery candidates, not architecture decisions"
  - concept: "Deterministic verification should verify the epistemic process, not only the final artifact (did we inspect competing explanations, account for selection, inspect residuals, was evidence independently generated, did search path bias the conclusion, are assumptions explicit)"
  - concept: "Refined AI-platform principle: agent behavior uses KnowledgeOS, creates epistemic investigation, KnowledgeOS preserves evidence lineage -- the agent never becomes the permanent owner of knowledge; KnowledgeOS owns the epistemic record"
  - concept: "Internal validity != External validity distinction; KnowledgeScope object (population/context/time/conditions/reference-class/assumptions/generalization-boundary) attached to every claim"
  - concept: "Candidate KnowledgeOS Eighth Pillar: 'Epistemic Traceability and Calibration' / 'Epistemic Control' -- maintaining epistemic calibration as search/model/evidence space expands; explicitly proposed as a research-backlog hypothesis, not constitutionalized"
  - concept: "Combined epistemic quality loop (Question->Hypotheses->Design Evidence->Observe->Aggregate->Assess Information Value->Calibrate->Compare->Condition->Model->Predict->Observe Outcome->Analyze Residual->Compare Models->Revise Knowledge->Calibrate Future Predictions->New Question), explicitly claimed 'far more powerful than a RAG pipeline'"
  - concept: "Combined candidate principle: knowledge is not accumulation of information but the justified, calibrated, contextual and revisable reduction of uncertainty produced through an auditable process"
defines: []
refines:
  - concept: "0208/0210/0211/0212's evidence-acquisition, causal-assurance and Bayesian belief-revision apparatus"
    refinement: "Unifies them into a single combined loop (Designed Observation -> Evidence -> Aggregation/Information/Provenance -> Calibration -> Bayesian/Causal/Comparative reasoning -> Model -> Predict -> Residual -> Model Comparison -> Knowledge Revision -> Wisdom -> Decision), and adds the previously-missing Search-path/Epistemic-Lineage provenance category and the Residual-as-knowledge-source discipline."
  - concept: "0213's falsification-question-only pass over the same book"
    refinement: "Converts several of 0213's falsification questions into concrete candidate domain objects (AggregationPolicy for the aggregation question, InferenceFrame for the regression-directionality question, EvidenceExperiment for the design question, Residual/UnexplainedPhenomenon for the residual question)."
