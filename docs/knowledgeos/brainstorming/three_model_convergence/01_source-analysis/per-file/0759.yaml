    refinement: "Substantially revised via genuine self-correction: Ω is shown to decompose into three sub-responsibilities rather than simply vanishing, with one (Ω-a) demonstrating a supported survival lineage into the Epistemic Contract, while the Lord-collision conclusion is downgraded from accepted to 'strongly supported hypothesis' pending further evidence -- an explicit, formally-recorded instance (GN-03) of the methodology correcting its own prior conclusion rather than protecting it"
  - concept: "0758's formalization semantic-preservation test (I_C(C)=I_C(F(C)))"
    refinement: "Sharpened into the more precise and defensible principle that invariants specifically (not the whole conceptual construct) are the candidates for preservation, while definitions are expected and permitted to transform -- resolving an ambiguity in the earlier, more general formulation"
  - concept: "0758's Phase 2B authorization and its explicit non-premature-finalization constraint"
    refinement: "Honored: the delivered eight-layer model is explicitly held at CANDIDATE MODEL status (GN-06) rather than accepted as final, and a further gate (Phase 2C, Architectural Coherence Review) is proposed before Phase 3 can even be considered"
