defines:
  - concept: "Concept disappearance≠responsibility disappearance"
    definition: "When a named concept from an earlier regime no longer appears under that name in a later regime, this does not by itself establish that the responsibility it once carried was abandoned -- the responsibility may have decomposed and survived under different names or as part of different concepts; a genuine archaeology must trace responsibilities, not merely names, before concluding abandonment"
  - concept: "Invariants are candidates for preservation; definitions are candidates for transformation"
    definition: "When a philosophical or conceptual construct is formalized into a computational/mathematical object, its invariants (the properties that gave it architectural meaning and are meant to constrain any valid reformulation) are the parts expected to survive the transformation intact; its definitions (the specific descriptive language used to express the concept) are legitimately expected to change when moving from philosophical to computational vocabulary -- surviving invariants with transformed definitions indicates healthy formalization, while lost invariants indicate a genuine semantic displacement regardless of how the definition reads"
  - concept: "The three kinds of boundary (Epistemic / Decision / Computational)"
    definition: "An architecture may need to track three genuinely distinct boundary types that are easily conflated: the Epistemic boundary (what can, in principle, be known), the Decision boundary (who or what is authorized to decide), and the Computational boundary (what can actually be computed or evaluated) -- a single artifact (e.g. an Epistemic Contract) may define one of these boundaries without automatically defining the others, and treating them as interchangeable risks silently smuggling a computational limitation into what should be a decision-authority question, or vice versa"
  - concept: "Corpus statistics as time-stamped observations, not timeless properties"
    definition: "Any quantitative claim about a historical corpus (e.g. file counts, line counts) must be reported as an observation qualified by the specific date/time it was measured, never as a bare, apparently permanent fact -- because the corpus itself may still be actively growing or changing while it is being analyzed, an unqualified statistic silently misrepresents a moving target as a fixed one"
