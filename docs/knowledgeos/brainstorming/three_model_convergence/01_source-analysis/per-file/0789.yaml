defines:
  - concept: "The strict domain-event definition"
    definition: "A domain event is a record of a meaningful fact that has already occurred within the domain -- distinct from a command (a request for something to happen), a method call or API endpoint (technical invocation mechanisms), a database update (a persistence-layer side effect), or an intention (a plan not yet realized); an event's defining property is that it reports something that has genuinely already happened and is domain-significant"
  - concept: "'Domain signal versus technical noise'"
    definition: "Before promoting any observed fact to formal domain-event status, ask whether that fact actually matters to the domain model or its invariants -- purely technical occurrences (a file being opened, an HTTP request arriving, a database query executing) that carry no domain significance belong in ordinary telemetry/logging, not the domain event model; treating every technical occurrence as a domain event causes event volume to explode and buries the actual domain model inside undifferentiated technical noise"
refines:
  - concept: "0788's Step 163 context map and its recommendation of Step 164"
    refinement: "DELIVERED: the full, disciplined domain-event derivation methodology, a provisional twenty-one-event taxonomy across four categories, and an explicit technology-independence principle for the event model"
  - concept: "0787's kernel principle (small, stable, authoritative, high burden of proof) and 0787's/0788's general anti-over-modeling discipline"
    refinement: "Directly extended into the event-modeling domain: the same discipline that prevented every noun from becoming a bounded context now prevents every state transition or verb from becoming a domain event, via the identical burden-of-proof pattern (Invariant+State transition+Domain significance⇒Candidate Event)"
