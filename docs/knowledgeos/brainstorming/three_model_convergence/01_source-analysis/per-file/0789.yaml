title: "Step 164 -- Domain Events and Legitimate State Transitions (MAJOR SYNTHESIS MILESTONE, delivers 0788's promised register): 'A Domain Event Represents a Meaningful Fact That Has Already Occurred' -- Delivers Command≠Event, Event≠State, Event≠Relationship, and the Event Derivation Rule (Invariant+State Transition+Domain Significance⇒Candidate Event) -- Delivers a Four-Category, Twenty-One-Event Provisional Taxonomy (Epistemic/Governance/Authorization/Operational) and the Naming Rule Event=Past Tense+Domain Fact -- Delivers Domain Event≠Audit Event and 'Domain Signal Versus Technical Noise' (Does This Fact Matter to the Domain Model or Its Invariants?) -- Delivers the Explicit Restraint List: NOT Every Concept an Aggregate, NOT Every Transition an Event, Kafka/Event-Sourcing/CQRS/Microservices NOT Required -- 'KnowledgeOS Should Derive Its Event Model From Domain Invariants... Rather Than Deriving Its Domain Model From an Infrastructure Messaging Technology' -- Opens Step 165, Aggregate and Consistency-Boundary Derivation"
