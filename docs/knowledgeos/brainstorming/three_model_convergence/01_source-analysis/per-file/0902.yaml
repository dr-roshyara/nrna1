defines:
  - concept: "The Deletion Test and Replacement Test (minimality methodology)"
    definition: "A two-stage formal minimality methodology for determining Knowledge State components: the Deletion Test asks, for candidate component X of K=(X,Y), whether removing it (forming K^{-X}=Y) causes some mandatory operation o∈𝒪_core to produce a different result on the reduced state than on the full state (∃o:o(K,x)≠o(K^{-X},x)) -- if so, X is REQUIRED. The Replacement Test then separately asks whether a required component can nonetheless be reconstructed (derived as a function of other retained components, e.g. E_L=f(R)) rather than stored as its own independent primitive -- if so, the component is required but NOT primitive. This two-stage structure prevents the common error of concluding that a component belongs in the canonical kernel merely because some operation depends on the information it carries, when that information might be fully recoverable from other, already-retained components"
  - concept: "Semantic necessity vs Representation necessity"
    definition: "A methodological distinction, presented as one of the step's most important safeguards, between two different senses in which a piece of information can be 'required' by KnowledgeOS: semantic necessity means some mandatory operation's correct behavior depends on that information being available in some form (it must exist somewhere, in some derivable or accessible form); representation necessity (equivalently, primitivity) means the information must be explicitly stored as its own independent field/component of the canonical state K. The safeguard is that semantic necessity does NOT imply representation necessity -- 'EvidenceLinks required' does not imply 'EvidenceLinks primitive'; 'Σ required' does not imply 'Σ stored' rather than derived on demand. Conflating the two leads to an unnecessarily large kernel that stores redundant, reconstructible information as if it were foundational"
