about: >
  The actual D285-4 artifact (previously known only by cross-reference and outcome, via files 0973, 0975,
  0980, 0984), delivering the formal, definitive record of the Θ-algebra's destruction.

  **§1 delivers a SIX-CLASS TRANSFORMATION TAXONOMY** (replacing, not extending, the operator-algebra
  framing): Epistemic (`δ(K,e)`; Assert/Retract/Supersede/Merge), Operational (`𝒪_sem` five families, "272A"
  -- a new corpus step reference), Evidential (`Qualify`, `LinkEvidence`, `e.state`), Normative (`Policy`
  versioning, `I-11`), Agent/Knower (outside, per D285-2), External world (`W`, `Ω` -- outside, "not in any
  claimed model"). **Only the first four are kernel-relevant.**

  **§2 delivers the corpus's standing nine-stage pipeline diagram** (`Intent→Guidance→Decision→Operation→
  Authorization→Execution→Transition→Result→Observation`) with the two boundary annotations explicitly
  marked as "standing corpus invariants, not proposals": `Zero/Lord/Sārathi ∉ State Mutation Boundary`
  (gating Authorization) and "only validated domain events mutate K" (gating Execution/Transition).

  **§3 DELIVERS THE FORMAL, DEFINITIVE TYPE-CHECKING TABLE** that rejects `Θ_X∘Θ_I∘Θ_K∘Θ_T∘Θ_A`: `Θ_A`
  (`𝕂×𝒪⇀𝕂`), `Θ_T` (`𝕂×Event⇀𝕂`, needs an Event which `Θ_A` does not return), `Θ_K` (`𝒩→𝒩`, codomain `𝒩` not
  `𝕂` -- cannot compose), `Θ_I` (`Q_t→Q_t`, different carrier again), `Θ_X` (`W→W`, `W` not in the model at
  all). **Conclusion, quoting the governing rule (Step 286 §16 -- a new corpus reference)**: "If it cannot be
  type-checked: reject the composition. Do not invent types to rescue it" -- **REJECTED (`RX`)**. "What
  survives is the taxonomy, not the algebra. Five names for transformations across five carriers is a
  classification; calling it a composable operator family was the error."

  **§4 delivers a dependency graph among the four kernel classes** (Evidential→Epistemic; Normative
  →Operational; Operational→Epistemic; Epistemic→History), explicitly acyclic, and explicitly distinguished
  from an EARLIER-TRACKED cycle (`Evidence→Policy→K→Assertion→Evidence`) which "runs through objects, not
  through these classes" -- a disciplined guard against conflating two different graphs.

  **Template §7 (seven-way classification)**: mathematical Θ-algebra `RX`; architectural taxonomy `R6`; DDD:
  four kernel classes map to service/command/event/policy layers; analogy: the five-fold naming is `R2` at
  best; corroboration/unresolved/governance: none.
