defines:
  - concept: "Semantic edge≠Technical edge"
    definition: "A technical dependency (e.g. ServiceA→Database) and a semantic relationship (e.g. Evidence→supports→Decision) are both real and both must be preserved by a knowledge system, but they answer different questions (how the system is built vs. what the knowledge means) and must not be conflated when reconstructing or reasoning about the system"
  - concept: "Evidence consistency (temporal-causality anti-fabrication check)"
    definition: "For a claimed supports relationship Evidence→Decision, the evidence's timestamp should generally not postdate the decision's timestamp; a decision claiming to be justified by evidence that did not yet exist at the time of the decision indicates a provenance inconsistency — potentially a retroactively fabricated or post-hoc-rationalized justification"
  - concept: "The Three graph layers (Fact/Knowledge/Reasoning)"
    definition: "Layer 1 (Fact graph) represents observed reality directly; Layer 2 (Knowledge graph) represents interpreted and validated knowledge; Layer 3 (Reasoning graph) represents AI or human inferences drawn from the other layers — these three layers must remain distinguishable and must not be silently merged into one undifferentiated graph"
  - concept: "CriticalPathCompleteness"
    definition: "Rather than measuring overall graph completeness as a simple ratio of observed to expected edges, identify the specific critical path (e.g. Authority→Decision→Action→Observation) required for a given assurance claim; a single missing edge on that critical path breaks the entire end-to-end trace regardless of how complete the rest of the graph is"
