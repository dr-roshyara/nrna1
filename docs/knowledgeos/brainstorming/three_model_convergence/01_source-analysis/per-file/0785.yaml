defines:
  - concept: "'No fake certainty'"
    definition: "A system must never present an uncertain conclusion with the surface confidence of a certain one merely because the generating process (particularly an AI/LLM) produced fluent, confident-sounding text -- fluency and grammatical certainty are properties of the text, not evidence for the claim it makes, and the two must never be conflated"
  - concept: "'The architecture is relation-centric'"
    definition: "After defining each core KnowledgeOS concept individually, the more fundamental discovery is that the domain's real structure is not adequately captured by the objects (nouns) alone -- it is captured by the explicit relationships between them (supports, derivedFrom, determines, authorizes, executes, supersedes, contradicts, observes) together with the invariants, temporal, and authority dimensions surrounding those relationships; the domain model is therefore Objects+Relationships+Invariants+Time+Authority, not simply a set of objects"
  - concept: "Evidence≠Proof"
    definition: "Engineering evidence supporting a claim is generally not equivalent to a mathematical proof establishing a theorem under a formal system -- evidence can be strong, weak, contested, or superseded, while a proof (properly so called) is a specific formal-logical artifact; the term 'proof' should be reserved for contexts where the domain and method genuinely justify it, not used loosely for any form of supporting evidence"
