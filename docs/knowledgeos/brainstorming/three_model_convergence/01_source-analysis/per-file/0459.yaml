about: >
  A two-part file. **Part 1** fully agrees with and mathematically formalizes 0458's architectural boundary
  decision, restating it symbolically: KnowledgeOS ⊃ SemanticReconstruction ⊃ Parsing; Parser ⊂
  Implementation of SemanticReconstruction; the invariant KnowledgeOS != Parser / Parser ∈ KnowledgeOS's
  Implementation. Produces a fully detailed architecture diagram (Semantic Reconstruction Capability with
  Structural Analysis/C-type lens and Semantic Role Analysis/Sanskrit lens sub-boxes -> Dimension Discovery
  Capability, incorporating Zero/Lord -> Investigation Capability/Sārathi -> Knowledge Model with Observation/
  Dimension/Statement/Value/Relationship/Evidence contracts). Restates the DDD dependency rule
  (SemanticReconstruction -> SemanticRepresentation; Parser -> SemanticRepresentation;
  SemanticReconstruction NOT-IMPLIES CParser or SanskritParser) and a formal capability contract
  Reconstruct(Q,C,K) -> S with four named sub-capabilities (Structural Analysis, Semantic Role Analysis,
  Reference Resolution, Context Extraction -- notably omitting Modality Analysis, present in 0456/0458's
  five-way lists, a minor taxonomy variance). Gives three explicit reasons parsing engines must remain
  replaceable (technological evolution -- future LLM/neural parsers; domain adaptation -- different parsers
  per domain; research/learning -- learning from multiple grammatical traditions without dependency lock-in),
  and formalizes the Learning Principle: KnowledgeOS <- LearnFrom(Sanskrit Grammar); KnowledgeOS !=
  Implement(Sanskrit Grammar). Frames parser physical placement (in-process / separate service / external
  library, with an explicit pros/cons table) as an implementation/infrastructure decision explicitly
  independent of and deferred relative to the architecture. Proposes Question 3 (Statement) next, this time
  explicitly requiring "associated epistemic status, evidence, and temporal validity" as part of a
  Statement's definition -- directly consistent with 0457's reformulation.

  **Part 2** delivers the corpus's **first concrete implementation-technology recommendation**: proposes
  **Rust** as the core KnowledgeOS Semantic Reconstruction engine, preferred over C for a new implementation
  while explicitly retaining "the C/Unix parser philosophy" (lexer -> parser -> AST). Introduces a
  terminology-clarifying distinction not previously stated: **"C-type parser" != "parser implemented in C"**
  -- the former names an architectural pattern (deterministic structural decomposition), the latter a literal
  implementation-language choice; this resolves a latent ambiguity carried since 0456. Lists eight desired
  parser properties (deterministic, structurally explicit, fast, memory-safe, AST/semantic-representation-
  producing, suitable for a long-running service, extensible with multiple lenses, and -- most
  architecturally significant -- **able to preserve uncertainty rather than silently resolve it**) and argues
  Rust satisfies all of them. Sketches a strongly-typed `SemanticRepresentation` struct (entities, actions,
  relations, modalities, contexts, unresolved) to establish the property "Parser Output is a typed semantic
  representation," not an arbitrary JSON blob.

  Identifies a genuinely valuable architectural insight: **Rust's type system is particularly suitable for
  the Zero Lens**, because instead of a parser silently resolving ambiguity (e.g. "those" -> assume
  "opponents"), the representation can explicitly encode `UnresolvedReference{expression, possible_targets,
  status: Unknown}` -- formalized as Parser -> Uncertainty rather than Parser -> Guess, "fits our Zero
  principle extremely well." This makes epistemic-boundary preservation a **structural, type-level
  guarantee** rather than a downstream convention. Sketches an `EpistemicStatus` enum
  (Unknown/Observed/Reported/Inferred/Assumed/Conflicting/Unresolved) modeling the CandidateDimension ->
  DimensionAssessment -> {accepted, uncertain, rejected} lifecycle from 0455, directly connected to but not
  identical to 0457's six-value epistemic-status list (renames CONTESTED to Conflicting and adds a separate
  Unresolved value alongside Unknown -- a minor vocabulary drift worth tracking).

  Proposes a `SemanticParser` interface with pluggable ports (StructuralParser, SanskritLens, DomainParser,
  FutureParser) each producing the same intermediate semantic representation, merged as
  SR=Merge(SR_struct,SR_semantic,SR_domain), with Dimension Discovery explicitly operating on the merged SR,
  "not directly on the parser" -- technically reinforcing 0458's ownership boundary. Names **Tree-sitter**
  as a concrete candidate structural-parsing engine paired with Rust as the surrounding Semantic
  Reconstruction engine (NL -> Tree-sitter/structural analysis -> Rust semantic reconstruction -> Sanskrit
  semantic-role lens -> Unified Semantic Representation -> Dimension Discovery), avoiding "reinventing a
  parser generator." Reaffirms that the domain architecture must be KnowledgeOS/SemanticReconstructionCapability
  /{Structural Analysis Port, Semantic Analysis Port, Domain Analysis Port, Reference Resolution Port}, never
  KnowledgeOS/RustParser, formalized as Capability-contract > implementation-technology. Closes with a
  ten-row recommendation table (Rust for the core engine and semantic reconstruction; Tree-sitter or a Rust
  parser framework for structural parsing; Rust implementation/prototype plus external linguistic resources
  for the Sanskrit lens; Dimension Discovery/Zero/Lord/Sārathi as native KnowledgeOS capabilities; **LLM as
  an optional analytical provider, explicitly NOT the source of truth**) and states a new, generalizable
  invariant: **LLM != Knowledge** -- an LLM may propose a semantic interpretation, but KnowledgeOS must
  preserve what was parsed, what was inferred, what remains unresolved, and what evidence supports it,
  extending 0457's "Zero and Lord are Sources, Not Authorities" invariant explicitly to LLMs. Confirms the
  research sequence: define the Semantic Representation contract first, then design the Rust parser around
  it -- contract-first, not implementation-first.
