defines:
  - concept: "Boundary Violation Catalog (V1-V10)"
    definition: "A named taxonomy of ten characteristic ways a bounded-context boundary can be violated: agent authority violation, memory authority violation, evidence authority violation, assurance authority violation, external model leakage, cross-context mutation, missing provenance, missing authorization, missing verification, and historical destruction"
  - concept: "The capstone invariant (MaterialTransition⇒Owner+Authority+Evidence(+Verification))"
    definition: "Every material state transition in KnowledgeOS must be traceable to an owning context (Owner), an explicit authorization basis (Authority), and supporting evidence (Evidence); transitions affecting production systems or governance additionally require post-transition Verification -- the single most compact general-purpose synthesis of the reconstruction's distributed governance discipline"
  - concept: "Engineering accountability graph"
    definition: "A reframing of the Assurance Graph specifically emphasizing its accountability function: for any material Action, the graph must represent who performed it (Actor), under what authority (authorizedBy), based on what knowledge (basedOn), what it changed (changes→Artifact), what evidence it produced (produces→Evidence), and whether it was verified (verifiedBy) -- more than a knowledge graph, an accountability record"
  - concept: "Boundary completeness"
    definition: "A workflow is boundary-complete only if, for every material transition, the owner is never Unknown, the authority is never merely implicit, and the evidence is never missing -- a property that can itself be checked as a fitness rule"
