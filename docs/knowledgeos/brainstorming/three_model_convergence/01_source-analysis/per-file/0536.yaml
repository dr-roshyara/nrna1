  - concept: "A sharper monotonicity/non-monotonicity distinction: individual polarity contributions remain monotonic (positive monotonicity for supporting evidence, negative monotonicity for contradicting evidence), while the OVERALL Evidence Assessment may legitimately be non-monotonic as new contradicting evidence arrives"
  - concept: "Formal rejection of KnowledgeConfidence=ΣEvidenceScores as violating double-counting, contradiction-hiding, provenance-loss, incomparability, and support/truth-confusion principles simultaneously"
  - concept: "Six named candidate evidence-combination algebras (Ordinal, Weighted vector, Numeric support with an aggregation operator, Probability, Belief/plausibility/Dempster-Shafer, Hybrid), posed as the corpus's central remaining open mathematical question"
  - concept: "'Structured Evidence Calculus + Pluggable Inference Mathematics' as the corpus's architectural resolution: the domain (core KnowledgeOS mathematics) defines invariants (Evidence/Provenance/Dependency/Polarity/Quality/Conflict/Assessment), while pluggable policies (deterministic/Bayesian/statistical/rule-based) implement domain-specific aggregation decisions — explicitly analogized to DDD's domain/policy separation"
  - concept: "Empirically confirmed via simulation: Duplicate Invariance, Corroboration≠Duplication, an LLM restatement correctly excluded from independent corroboration when its dependency is recorded, Stale≠Deleted, Evidence existence≠Evidence relevance, and simultaneous preservation of Support(P) and Support(¬P) under contradiction"
  - concept: "The empirically-discovered necessary pipeline ordering Normalize≺DependencyAnalysis≺QualityAssessment≺Aggregation≺Inference, illustrated via a Database->LLM->Report->ManagerPresentation chain that looks like four sources but is epistemically one underlying observation with three transformations"
  - concept: "Honest admission that the executed experiment's specific aggregation formula (a third distinct formula in the corpus, using a saturating 1-∏(1-s_i) combination) is an engineering choice, not a theoretically derived result, and must not be frozen"
defines:
  - concept: "Evidential relation (e, foundational form)"
    definition: "e=(o,p,r,c,π,τ) with o∈𝒪, p∈𝒫, r∈ℛ, c∈𝒞, provenance π, temporal information τ — the atomic mathematical object of the Evidence Algebra"
  - concept: "Polarity(e)"
    definition: "A ternary value ∈{+,-,0} indicating whether an evidential relation supports P, supports ¬P, or does neither directly — the core calculus's minimal relation vocabulary, with richer relation types (qualifies, contextualizes) kept as separate metadata"
  - concept: "Positive/Negative monotonicity (directional, contribution-level)"
    definition: "Support^+(E∪{e})≥Support^+(E) if e supports P (subject to e not being invalidated/superseded); symmetrically for Support^- and ¬P — holding at the level of individual polarity contributions even when the overall aggregate assessment is non-monotonic"
