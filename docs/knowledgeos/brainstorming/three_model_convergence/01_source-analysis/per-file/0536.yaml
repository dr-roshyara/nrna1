about: >
  A landmark, twelve-step ground-up rebuild of Evidence Assessment theory ("Evidence Algebra Step 01 —
  Define the Universe"), directly executing 0535's proposed test program, followed by the corpus's first
  documented EXECUTED computational experiment against a concrete ten-case test universe with a downloadable
  CSV artifact -- a genuine methodological escalation from discursive mathematics to a runnable simulation.

  **Steps 1-7 rebuild the mathematical foundations cleanly**: the universe 𝒪(observations), 𝒫(propositions),
  𝒞(contexts), ℛ(rules), with an evidential relation `e=(o,p,r,c,π,τ)` and `ℰ⊆𝒪×𝒫×ℛ×𝒞×Π×T` (Step 1);
  polarity separated into a clean ternary `Polarity(e)∈{+,-,0}` (supports P / supports ¬P / neither),
  explicitly keeping richer relation types like "qualifies"/"contextualizes" as metadata rather than
  forcing them into this core calculus (Step 2); a quality vector `Q(e)=(q_R,q_Re,q_F,q_I,q_C)` with the
  important correction that these need NOT be numbers -- categorical values like {Unknown,Low,Medium,High}
  are acceptable, crystallized as `Quality≠Score`, "protects the theory from prematurely committing to
  numerical confidence" (Step 3); a dependency graph `G_E=(V_E,L_E)` with typed edges (DerivedFrom,
  ObservedFrom, CopiedFrom, InterpretedFrom, DependsOn) yielding the crucial `Independent(e_i,e_j,G_E)`
  operation, "without this, aggregation is unsafe" (Step 4); a normalization operator `N:ℰ->ℰ*` that
  identifies exact/semantic/derived duplicates, superseded observations, invalid provenance, irrelevant
  evidence, and temporal incompatibilities, worked through a DB->LLM->Document copy-chain that must
  collapse to dependent, not independent, evidence (Step 5); a clean assessment input tuple
  `(E_P^+,E_P^-,G_E,C,ρ)->Assess_ρ->EA` (Step 6); and a non-collapsing output object
  `EA=(S^+,S^-,U,D,Q,Γ)`, explicitly "not EA=0.87" (Step 7).

  **Step 8 states five foundational laws** (Duplicate invariance, Independent corroboration, Contradiction
  preservation, Context dependence, Policy dependence -- largely paralleling 0535's E1-E9 under an
  independent "Law 1-5" numbering). **Step 9 delivers a genuinely sharper refinement of monotonicity**
  beyond 0535's single Law E6: separate directional POSITIVE monotonicity (supporting evidence can only
  increase or maintain `Support^+`) and NEGATIVE monotonicity (contradicting evidence can only increase or
  maintain `Support^-`), each holding at the level of individual polarity contributions. **Step 10 then
  delivers the file's sharpest new mathematical nuance**: the OVERALL Evidence Assessment may still be
  NON-monotonic even while each individual polarity contribution remains monotonic -- adding contradicting
  evidence can legitimately DECREASE the system's aggregate Support^+ for P under certain aggregation
  policies ("the system has learned something contradictory"), crystallized as
  `EvidenceAssessment may be non-monotonic` while individual polarity contributions stay monotonic -- a
  precise distinction the corpus had not previously drawn this sharply.

  **Step 11 formally rejects a tempting naive model**: `KnowledgeConfidence=ΣEvidenceScores` is shown to
  violate multiple established principles (double-counting, hiding contradiction, losing provenance, making
  incomparable evidence artificially comparable, confusing support with truth), replaced by
  `Evidence->StructuredAssessment->PolicySpecificDecision`.

  **Step 12 poses the file's central open mathematical problem and delivers a decisive architectural
  resolution**: "What algebra should combine independent evidential contributions?" -- surveying six
  candidate models (A: Ordinal, no arithmetic; B: Weighted vector with partial ordering; C: Numeric
  support in [0,1] with an aggregation operator ⊕; D: Probability P(H|E); E: Belief/plausibility
  (Dempster-Shafer, Bel/Pl); F: Hybrid). **Delivers the file's central architectural recommendation**:
  **"Structured Evidence Calculus + Pluggable Inference Mathematics"** -- the core KnowledgeOS mathematics
  defines Evidence, Provenance, Dependency, Polarity, Quality, Conflict, and Assessment, but explicitly
  does NOT dictate one universal numerical aggregation theory; individual policies implement
  `ρ_deterministic`, `ρ_bayesian`, `ρ_statistical`, `ρ_ruleBased`, etc. -- explicitly analogized to DDD:
  "the domain defines the invariants; policies implement domain-specific decisions."

  **Proposes and then EXECUTES a concrete ten-evidence test universe**, the corpus's first documented run
  of an actual computational simulation (with a downloadable CSV result artifact), reporting six major
  empirical findings: (1) Duplicate evidence -- an exact duplicate e_2 of e_1 does NOT increase the
  assessment (`Assess({e_1})=Assess({e_1,e_2})`), confirming Duplicate Invariance empirically; (2)
  Independent corroboration -- an independent monitoring-system observation e_3 genuinely increases
  support (`Assess(e_1,e_3)>Assess(e_1)`), confirming `Corroboration≠Duplication`; (3) LLM-derived evidence
  -- an LLM restatement e_4 explicitly recorded as derived from e_1 is correctly NOT counted as independent
  corroboration, crystallized as "an LLM can generate another representation of knowledge without
  generating another independent observation"; (4) Stale evidence -- an old document e_5 remains in the
  evidence graph with diminished contribution due to low Currency, confirming `Stale≠Deleted` (historical
  evidence remains part of provenance); (5) Irrelevant evidence -- an ADR e_6 mentioning Nexus but with
  `Relevance(e_6,P)=0.05` contributes negligibly, confirming `Evidence existence≠Evidence relevance`; (6)
  Contradictory evidence -- e_7 (version=3.70) against e_1 (version=3.69) causes the system to preserve
  BOTH `Support(P)` and `Support(¬P)` simultaneously, producing a concrete structured output (P:3.69/
  strong support; ¬P:3.70/substantial support; Conflict:ACTIVE; Resolution:OPEN) rather than silently
  picking a winner.

  **Delivers the file's central conclusion**: KnowledgeOS should NOT search for one universal function
  `f(E)->[0,1]`; the fundamental object must remain the structured `A_ρ(E,P,C)->EA` (Support(P),
  Support(¬P), Uncertainty, Conflict, Dependencies, Qualifications), with any scalar
  `M_ρ(EA)∈[0,1]` an explicitly SECONDARY, policy-derived quantity.

  **Delivers a genuinely important empirical discovery**: the experiment EXPOSES a concrete, necessary
  pipeline ordering -- `Normalize ≺ DependencyAnalysis ≺ QualityAssessment ≺ Aggregation ≺ Inference` --
  "this should become an architectural invariant," vividly illustrated via a
  Database->LLM->Report->ManagerPresentation chain that LOOKS like four sources but is epistemically ONE
  underlying observation with three transformations. Formalizes the resulting five-stage core pipeline
  (`N(E)=E*`, `D(E*)=G_E`, `Q(E*,G_E,P,C,ρ)`, `A_ρ(E*,G_E,P,C)->EA`, `I(EA,R,C)->Conclusion`).

  **Delivers "the laws that survived the experiment" -- an eight-item E-1..E-8 list** (Duplicate Invariance,
  Corroboration, Dependency Preservation, Contradiction Preservation, Context Relativity, Policy
  Relativity, Assessment≠Truth, Assessment≠Conclusion) -- a THIRD independent axiom-numbering convention
  within this single file (alongside its own earlier "Step 8" Laws 1-5 and 0535's E1-E12).

  **Closes with an important honest admission**: the executed experiment used a SPECIFIC, ad hoc formula
  (`s(e)=Reliability×Relevance×Currency×Independence` with a saturating aggregation
  `1-∏(1-s_i)` -- itself a THIRD distinct aggregation formula in the corpus, differing from both 0534's
  logarithmically-dampened sum and any prior proposal) that are "reasonable engineering choices" but "not
  derived from our theory" and explicitly "must not freeze them." Names the remaining question -- what
  algebra, if any, should KnowledgeOS use to combine independent evidence (Max, Weighted Mean,
  Probabilistic, Bayesian, Dempster-Shafer, Ordinal, or hybrid) -- and proposes the corpus's next concrete
  research step: systematically test each candidate algebra against the full accumulated law set (duplicate
  invariance, corroboration, dependency, contradiction, monotonicity, non-double-counting, irrelevance,
  evidence removal, policy changes, context changes, reproducibility) to move from "a plausible evidence
  model" to "a formally tested evidence calculus suitable for implementation in KnowledgeOS."
