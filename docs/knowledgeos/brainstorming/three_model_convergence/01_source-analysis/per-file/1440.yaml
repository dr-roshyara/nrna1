  extensive external material).

  **DELIVERS THE BOOK'S FULL STRUCTURAL OUTLINE FROM ITS OWN PREFACE**: Part I "Perspective" (Ch 1 mathematics'
  place in the history of philosophy; Ch 2 a broad survey of philosophy-of-mathematics problems and positions);
  Part II "History" (Ch 3 Plato and Aristotle; Ch 4 Kant and Mill); Part III "The Big Three" (Ch 5 logicism;
  Ch 6 formalism; Ch 7 intuitionism); Part IV "The Contemporary Scene" (Ch 8 mathematical realism/Platonism;
  Ch 9 nominalism/anti-realist reinterpretation; Ch 10 STRUCTURALISM -- "This is my own position (Shapiro
  1997), so one might say that I have saved the best for last"). Confirms the book's central epistemological
