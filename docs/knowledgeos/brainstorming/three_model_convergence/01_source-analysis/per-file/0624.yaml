defines:
  - concept: "G_C (causal graph)"
    definition: "A formally distinct graph of causal relationships, separate from knowledge relationships (G_K), identity relationships (G_I, 0618), and provenance/dependency relationships (G_P); CausalEdge≠GenericRelationship — neither relatedTo nor dependsOn implies causes"
  - concept: "CausalClaim (eleven-field object)"
    definition: "(Cause, Effect, Mechanism, Evidence, StudyDesign, Assumptions, Scope, Time, EffectSize, Uncertainty, Model) — a causal edge is itself a knowledge assertion (CausalEdge∈K) supported by evidence, never metaphysical truth"
  - concept: "PredictiveAccuracy≠CausalValidity"
    definition: "A model can predict an outcome accurately without correctly identifying the underlying causal mechanism that produces it; predictive success is not evidence of correct causal explanation"
  - concept: "AI causal hallucination"
    definition: "The failure mode of an AI agent inferring a causal relationship A→B merely from observing that A precedes B, explicitly rejected by KnowledgeOS as sufficient evidence for a validated causal claim"
  - concept: "Do not force one causal graph (Markov-equivalence discipline)"
    definition: "When observational data underdetermine a unique causal structure (multiple DAGs sharing the same conditional-independence structure, or multiple models M_1, M_2 fitting equally well), KnowledgeOS should preserve the full CausalGraphSet or disjunction M_1∨M_2 rather than arbitrarily selecting one model"
