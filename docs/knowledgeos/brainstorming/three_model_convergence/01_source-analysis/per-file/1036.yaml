  (fixing B-1); §4's fully corrected heading and per-axis order audit (fixing M-2, M-3, Issue 4); §8's
  six-column decomposition and corpus-CONSTRUCT terminology; §13's Step-288 boundary; §14's explicit
  non-closure statement; and the complete twelve-row §12 phrasing-discipline table, the single most complete
  "do not write / write instead" reference across the entire equality-closure programme.

  **§1 DELIVERS A GENUINELY IMPORTANT NEW DISCOVERY**: "Step 246 is NOT the origin: `25I.11` (2026-08-28)
  states the same warning over THREE relations, `≡_exact`/`≡_struct`/`≡_sem,C`, and indexes semantic equality
  BY CONTEXT" -- an EARLIER corpus antecedent (dated 28 August, before the 31 August Step-246 citation this
  reconstruction has tracked throughout), pointing to a new bridge candidate,
  "14-GAP-UPDATE-FROM-THE-025-ALGEBRA-SEAM.md §1." **This reveals the four-relations finding this
  reconstruction has tracked as originating at "Step 246" (files 0989-0994, 1005, 1019, 1026, 1031) actually
  has an even earlier corpus precedent with a DIFFERENT relation count (three, context-indexed) --
  potentially yet another layer to the escalating notation/formulation history.**

  **§3 DELIVERS THE MOST SIGNIFICANT NEW FINDING IN THIS FILE, EXPLICITLY DATED AND SOURCED TO "REFINED-STEP-
  288.md §1"** -- **CONFIRMING STEP 288 HAS ALREADY BEEN EXECUTED (contrary to files 1030's/1034's
  recommendation to wait)**: "behavioural equivalence IS in the corpus" -- the artifact's own prior claim that
  it was absent is explicitly withdrawn. `CORPUS` Step 260 ("minimality of the knowledge state") makes
  behavioural equivalence "THE FOUNDATION OF MINIMALITY": it distinguishes CANDIDATE `≡_𝒯^cand` from PROVEN
  `≡_𝒯^prov` behavioural equivalence, states "at this stage we have the former," and proposes "the candidate
  state is therefore an equivalence class of HISTORIES" -- meaning **`K` is proposed as `ℋ/≡_𝒯`** (a quotient
  of the history set), **NOT downstream of `δ` but UPSTREAM of `K` itself**. Step 260.11 warns "the quotient
  is NOT automatically implementable." **Consequence explicitly stated: "there are FIVE relations in play,
  not four" -- a genuinely major revision to the "four corpus relations" framing this reconstruction has
  tracked as foundational since file 0989 (Step 246), now shown incomplete by the corpus's own further
  material.** The fifth relation "inherits `𝒪`'s defect: `𝒯` has never been enumerated against the ratified 8
  primitives."

  **Also delivers, within §3, a precise external-literature classification (never imported as architecture)**:
  weak bisimulation IS the correct technical name for the behavioural sense of observational equivalence, and
  `≈_X` (label-projection) is explicitly the WEAKER sense -- "the two senses must never be conflated."

  **§14 delivers the mandated final non-closure statement**: "Step 287 does NOT close equality. It
  establishes exactly what is known, what is bounded, what is normative, and what remains technically
  unspecified. The corpus has named equality-related constructs but has not supplied the decision procedures
  and semantic commitments required to make them executable."

  **The STATUS block delivers the complete, definitive ESTABLISHED/BOUNDED/NORMATIVE/TECHNICALLY-OPEN/
  DEFERRED classification**, now including the fifth-relation finding under TECHNICALLY OPEN
  ("`≡_𝒯^prov` -- proven behavioural equivalence; the corpus holds only `≡_𝒯^cand`... and `𝒯` is
  unenumerated").
