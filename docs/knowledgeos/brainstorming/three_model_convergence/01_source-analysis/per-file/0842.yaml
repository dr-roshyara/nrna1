defines:
  - concept: "'Negative Knowledge'"
    definition: "Knowledge about approaches, assumptions, transitions, or interpretations that have been demonstrated to be unsuitable under specified conditions -- distinct from mere failure, because a failure only becomes negative knowledge (i.e. genuinely useful) once the reason it failed is understood; recording negative knowledge explicitly (via a dedicated 'Rejected alternative' ledger field) preserves the fact that architecture is defined as much by what was deliberately excluded as by what was ultimately chosen, preventing the historical record from making the final design look like the only option ever considered"
  - concept: "The 'late naming' phenomenon"
    definition: "An engineering pattern, distinction, or architectural principle can exist implicitly in the actual work (code, experiments, repeated problems) well before anyone gives it a formal conceptual name -- the typical sequence is implementation→repeated problem→experiment→pattern recognized→concept named. The discipline this requires is that the later, formal name must never be projected backward onto the earlier, unnamed period as though the concept had been consciously and deliberately designed from the very beginning; doing so would distort the true epistemic chronology and falsely suggest foresight that did not exist at the time"
