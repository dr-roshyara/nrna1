about: >
  Direct continuation of 0210, applying Zero Lens plus the Chinese philosophical lens (Dao, Yin-Yang,
  Confucianism, the concept of li) to push behind evidence acquisition itself. Zero Lens asks for the
  minimum structure needed to move from "something happened" to "we may rely on this" without smuggling
  in assumptions. The Chinese lens adds a relational question: what relationship must exist between the
  thing observed, the situation, the observer, and the resulting action. Reformulates evidence not as a
  stored thing but as a STATUS an observation may acquire through a defensible relationship between
  phenomenon, observation, acquisition, situation, hypothesis and explanation.
introduces:
  - concept: "Four epistemically distinct objects that must not collapse: World event / Observation of event / Interpretation of observation / Knowledge claim"
  - concept: "Rule: never promote an observation to an explanation without preserving the transition between them (Observation -> interpretation -> Hypothesis, not Observation -> Truth)"
  - concept: "Situational Provenance, extending ordinary Source/Method provenance with conditions/environment/relation/phase/actors/constraints/what-changed/what-was-absent/what-was-excluded"
  - concept: "Yin-Yang polarity principle for evidence collection: actively seek both supporting AND contradicting observations, not merely 'find evidence for H'"
  - concept: "EvidenceInquiry object with SupportingObservations/ContradictingObservations/MissingObservations/AlternativeExplanations/ContextualConditions"
  - concept: "Change as evidence-bearing structure: a true snapshot (e.g. 99.9% availability) can be misleading; the trajectory (99.99%->99.98%->99.9%->99.4%) carries information the snapshot does not"
  - concept: "EvidenceTrajectory object (observations/temporal ordering/transitions/environmental changes/inferred pattern)"
  - concept: "Confucian observer-role dimension: WHO is preserved not as identity alone but as ROLE/AUTHORITY/RESPONSIBILITY/PURPOSE -- the same observation collected by different roles for different purposes carries a different epistemic context (explicitly NOT 'trust the person')"
  - concept: "'li' as a conceptual lens for appropriate pattern/form/procedure/ordering, mapped onto SelectionProcedure/ObservationProtocol/MeasurementProtocol/EvidenceProtocol"
  - concept: "Refined definition: evidence acquisition is deliberate creation/retrieval of observations under explicit conditions/procedures/relationships/purposes such that the result CAN SUBSEQUENTLY BE ASSESSED -- not is automatically evidence"
  - concept: "Complete Zero-Lens chain: REALITY -> PHENOMENON -> OBSERVATION -> OBSERVATION RECORD -> CANDIDATE EVIDENCE -> EVIDENCE -> KNOWLEDGE -> WISDOM -> ACTION, overlaid with a Situation/Person/Time/Relation relational structure"
  - concept: "Full EvidenceInquiry conceptual object (Question/Claim-Hypothesis/DecisionContext/TargetPhenomenon/AcquisitionIntent/SelectionProcedure/ObservationProcedure/MeasurementContext/Observer[identity,role,authority]/Situation[time,environment,actors,constraints]/ExpectedObservations/ContradictingObservations/AlternativeExplanations/Deviations/ResultingObservations)"
  - concept: "Evidence quality as multi-dimensional (Observation:accuracy/integrity/precision, Acquisition:selection-procedure/bias, Situation:completeness/context/change) feeding Interpretation feeding Assessment -- explicitly rejecting a single reductive quality score"
  - concept: "Absence-as-evidence: six-way epistemic distinction (Observed / Not observed / Expected-but-absent / Unexpectedly-present / Unknown / Not-measurable / Not-collected), with 'not observed' explicitly != 'does not exist'"
  - concept: "Epistemic state model per proposition: OBSERVED / UNOBSERVED / UNKNOWN, each with its own sub-questions, explicitly contrasted with AI's naive true/false binary"
  - concept: "'Conceptual hardening' warning (Daoist lens): Observation->pattern->category->reality collapse; the system must retain 'our conceptualization may be wrong even when the underlying observation is correct' at every transition (Phenomenon->Description->Pattern->Interpretation->Concept->Hypothesis)"
  - concept: "AI reframed as 'Epistemic Inquiry Assistant' rather than evidence collector -- an eleven-question inquiry checklist precedes any collect/search/measure action"
  - concept: "Agent workflow chain: Question->Inquiry Formulation->Evidence Need->Acquisition Design->Collection->Provenance Capture->Selection Audit->Contradiction Search->Alternative Explanation->Evidence Assessment->Knowledge Update, to be verified (not bypassed) by the Verification Engine"
  - concept: "Core principle: 'Evidence is not a thing KnowledgeOS merely stores. Evidence is a status an observation may acquire through a defensible relationship between phenomenon, observation, acquisition procedure, situation, hypothesis and explanation.'"
  - concept: "Proposed five-lens 'Evidence Acquisition Discovery Round' agenda (Zero/Chinese/Achinstein/Causal/Wisdom questions) to derive the domain model from first principles rather than prematurely inventing entities"
