about: >
  "Gītā Mapping Terms to KnowledgeOS" -- explicitly framed as producing "a Gītā → KnowledgeOS translation
  dictionary: not claiming that the two systems are identical, but documenting the vocabulary we have
  actually been using." THIS IS THE ORIGIN DOCUMENT of the v0.1 `GK-nn` register this reconstruction has
  tracked being reconciled, challenged, and crosswalked throughout the entire Gītā-track arc (files 1095's
  `GK-Q1`/`GK-Q2` challenges, 1109's `GK-Q4`/`GK-Q5`, 1117's already-tracked "20 terms crosswalked... 8 agree,
  6 collide, 3 exist only in v0.1 (incl. `Ω`, `Zero`)").

  **DELIVERS THE ORIGINAL, LITERAL `GITA-KOS-TRANSLATION-REGISTER` (v0.1), `GK-01` THROUGH `GK-19`**, exactly
  matching this reconstruction's already-tracked v0.1-only-entries finding: `GK-18` (Knowledge space → `Ω`)
  and `GK-19` (Boundary → Zero Lens) confirmed here as v0.1-exclusive entries (the "3 exist only in v0.1
  (incl. `Ω`, `Zero`)" already-tracked finding, file 1117). Confirms `GK-05` (Ātman → Knowledge Ātma,
  classification "Hypothesis," canonical "No") as the exact source-locus for the already-tracked `GK-Q1`
  register challenge (file 1095), and `GK-13` (Jñāna, classification "Partial," canonical "No") as the exact
  source-locus for the already-tracked `GK-Q2` split challenge.

  **DELIVERS THE ORIGIN OF THE PRECISE `Arjuna≠Knower` CORRECTION**, already-tracked throughout the Gītā
  track's `𝒩∉K` corroboration thread (files 1096-1117): "Arjuna is not simply 'the Knower.'... The Gītā's
  more precise technical term `kṣetra-jña` is what maps to the Knower of the field." Delivers the boxed
  formal statement: "Arjuna ↔ Human Knower + Actor," explicitly "Not: Arjuna = Knower."

  **DELIVERS THE ORIGIN OF THE ALREADY-TRACKED `Karma≠Karma-phala`/`Command≠Transformation` FINDING**
  (already-tracked `256.21`-corroborated hypothesis, files 1097/1103/1109): "This is the source of our
  Action ≠ Result hypothesis. `Karma≠Karma-phala`... KnowledgeOS reflection: `o≠K'`."

  **DELIVERS THE ORIGIN OF THE ALREADY-TRACKED `Vairāgya`/`I-V` INVARIANT**: "This is the basis of our H2
  hypothesis. `Vairāgya→non-attachment to outcome`... `Valid(o,K)⇏Desired(K')`. This must remain a research
  hypothesis" -- the direct ancestor of the already-tracked, later `CORPUS-SUPPORTED` `I-V` invariant (files
  1104, 1109's third-and-fourth independent arrivals).

  **DELIVERS THE ORIGIN OF THE ALREADY-TRACKED `Sārathi`/`Guidance≠Authority` ARCHITECTURAL METAPHOR** (later
  formalized as `AP-1`, "implemented 132/132 `humanActRef`," already-tracked throughout files 1097-1105):
  "'KnowledgeOS is an epistemic Sārathi -- observing/reconstructing state, exposing knowledge boundaries...
  accompanying the human Knower toward informed decision WITHOUT TAKING OWNERSHIP of the decision/action.'
  So: Sārathi → KnowledgeOS guidance role. But: KnowledgeOS≠Krishna."

  **DELIVERS THE ORIGIN OF THE ALREADY-TRACKED THREE-LEVEL PROMOTION DISCIPLINE**, the exact ancestor of the
  entire already-tracked `correspondence⇏type⇏primitive⇏canonical-architecture` chain (files 1096, 1109,
  1117): "Level 1 — Gītā term... Level 2 — conceptual reflection... Level 3 — KnowledgeOS candidate
  construct. The arrow is therefore: Gītā term → philosophical interpretation → KnowledgeOS research
  construct -- NOT: Gītā term = KnowledgeOS construct. That distinction should become a formal rule in Step
  286" -- directly and explicitly commissioning what this reconstruction has tracked as Step 286's entire
  governing discipline.

  **CONFIRMS `Zero` AS A GĪTĀ-TRACK RESEARCH CONSTRUCT, NOT A GĪTĀ TERM, HERE AT ITS ORIGIN**: "The Zero Lens
  is not a Gītā term. It is our research construct... Zero=boundary between known and unknown... Do not
  write: 'The Gītā defines Zero.' It does not." This directly resolves the open question this reconstruction
  flagged in file 1119's analysis of the earlier (2026-08-25) DDD "Zero Lens" admission-test methodology: THIS
  document's "Zero Lens" is a DIFFERENT, Gītā-track-specific construct (the known/unknown epistemic boundary,
  already-tracked as the origin of "Zero=missing/absent knowledge detection," files 1102/1104/1114) --
  confirming the two "Zero Lens" usages are indeed a genuine terminological name-collision between two
  independently-purposed frameworks, not the same concept, resolving the open question flagged in file 1431.

  **DELIVERS THE FULL ORIGIN OF THE CENTRAL CORRESPONDENCE DIAGRAM** (Brahman/Krishna→Ω→Knowledge Field→
  `K_t`→Kṣetra-jña→Arjuna→Krishna/guidance→Decision) and the recommendation, taken up throughout the entire
  already-tracked Gītā track, to formalize this as a dedicated `GITA-KOS-TRANSLATION-REGISTER` artifact "as
  an input to the hypothesis programme, not part of the canonical kernel until individual mappings survive
  the derivation and governance gates" -- the explicit disciplined scoping this reconstruction has tracked
  being honored throughout every subsequent Gītā-track document.
