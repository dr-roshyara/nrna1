about: >
  A genuine convergence point: reconnects the mathematical arc (0202-0225, HMM/HSMM/Bayesian/statistical)
  back to the corpus's original 26-lens Sanskrit/DDD lens system (Vani/Panini/Karaka/Nyaya/Navya-Nyaya/
  Godel/Escher/Siva-Sakti/Ganesha/Leonardo/Moksha/Negative-Epistemology/Isnad/Witness/Dharma) from the
  earlier Kernel Boundary Discovery cycle. Central proposal: use the cheapest model that answers the
  current question with sufficient accuracy, escalating only when evidence shows it inadequate --
  "Evidence-Gated Hybrid Temporal Inference" (EG-HTI), explicitly frozen as a research hypothesis, not
  adopted architecture.
introduces:
  - concept: "Lens-as-computational-role reinterpretation table: each of the 26 lenses assigned a computational function (DDD reduces state space, Zero detects missing prerequisites, Vani/Panini normalize representations, Nyaya validates justification, Godel prevents inference->truth collapse, Wisdom decides escalation, etc.) -- the lenses become a complexity-reduction mechanism, not merely a philosophical apparatus"
  - concept: "Eight-layer hybrid architecture: Semantic compression (Vani/Panini/Karaka/SNF) -> Evidence qualification (Nyaya/Navya-Nyaya/Isnad/Witness/Zero) -> Domain reduction (DDD/Leonardo/Dharma) -> Fast inference (HMM/deterministic) -> Selective temporal inference (HSMM) -> Deep inference (smoothing/Bayesian/offline reconstruction) -> Assurance (Godel/Zero/Negative-Epistemology/Ganesha) -> Wisdom (decide escalation/review/action)"
  - concept: "DDD as the largest computational optimization: reducing legitimate domain state count M before inference cuts HMM cost O(TM^2) and HSMM cost O(TM^2D) quadratically (worked example: M=100->10 gives ~100x transition-space reduction)"
  - concept: "HSMM Escalation Score E_HSMM = weighted sum of uncertainty/duration-dependence/conflict/regime-change-signal/temporal-volatility/missing-observation-complexity, with calibrated (not arbitrary) thresholds driven by false-negative/false-positive/compute-budget costs"
  - concept: "Empirical HMM-adequacy test: KL(P_observed(duration) || P_geometric(duration)) below epsilon means HMM's implicit geometric-duration assumption is adequate; above epsilon justifies explicit HSMM duration modeling"
  - concept: "Hybrid state model S = S_H (HMM states) union S_HS (explicit-duration states) -- not every state needs HSMM, only those with demonstrably non-geometric duration"
  - concept: "State-specific duration bounds D_max(s) and parametric duration distributions (Poisson/Gamma/log-normal/negative-binomial/Weibull) reducing an unrestricted duration table O(D) to O(k) parameters, plus duration pruning with an explicit invariant: optimization may reduce computation, it may NOT erase uncertainty (discarded probability mass must be recorded, e.g. retained_probability:0.997/discarded_tail:0.003)"
  - concept: "Sparse transition matrices from DDD-bounded domain lifecycles (E << M^2 legitimate transitions), reducing HSMM cost from O(TM^2D) to O(TED)"
  - concept: "Model registry per bounded context (architecture_assessment:hmm->hsmm, governance_lifecycle:deterministic-only, semantic_identity:deterministic_snf, evidence_admissibility:rule_engine, long_term_knowledge_evolution:hsmm->bayesian) -- no single universal model"
  - concept: "Async 'anytime' inference: online filtering fast-path response, offline smoothing/historical-correction runs in background and updates the assessment later; five-level response taxonomy (INSUFFICIENT EVIDENCE / DETERMINISTIC RESULT / FAST PROBABILISTIC / DURATION-AWARE HSMM / SMOOTHED DEEP ANALYSIS), never paying Level-4 cost for a Level-1 question"
  - concept: "Escalation function combining entropy, state margin (p_max - p_2nd), duration-divergence R_D, and conflict, not confidence alone"
  - concept: "Risk-sensitive escalation via ExpectedLoss = P(error) x Cost(error); computational decision theory: a* = argmin_a[C_compute(a)+C_error(a)] over {Deterministic,HMM,HSMM,Deep}"
  - concept: "Godel-lens guard against a dangerous optimization: skipping mandatory evidence validation because a cheap model is confident is unacceptable for certain evidence classes -- Mandatory Evidence Tiers by risk class (A: full validation+HSMM/deep+human acceptance; B: deterministic+HMM+optional HSMM; C: fast path acceptable)"
  - concept: "Negative-Epistemology-derived forbidden-shortcut list: KnowledgeOS is explicitly NOT a truth generator/semantic oracle/evidence owner/unrestricted reasoner/confidence accumulator/representation authority/automatic selector -- high probability never automatically becomes admitted knowledge, it becomes a candidate assessment subject to admission rules"
  - concept: "Escher/Siva-Sakti-justified semantic caching: compress RawEvidence->CompressedRepresentation only if Invariant(Raw)=Invariant(Compressed); provenance-aware cache key (SemanticHash, Context, ModelVersion, EvidenceClass) preventing invalid cross-context reuse of semantically-identical-but-differently-sourced observations"
  - concept: "Moksha-motivated model drift detection: periodically test KL(P_new||P_old) against threshold to trigger model reassessment; self-optimizing but explicitly NOT self-certifying -- external governance remains outside the inference loop"
  - concept: "Progressive Epistemic Computation principle (formal): KnowledgeOS shall not perform more expensive inference than required by evidence/temporal-complexity/context/uncertainty/consequence; Level* = argmin_L[Compute(L)+ExpectedError(L)] subject to Assurance(L) >= RequiredAssurance"
  - concept: "Accuracy principle: every computational shortcut must declare what it approximates and what uncertainty it introduces (worked YAML example showing why HSMM was skipped, with duration-divergence/entropy/context-completeness reasons and validation stats) -- explicitly contrasted with a bare 'AI is 97% confident'"
  - concept: "Final combined formula: Inference = Gate_{DDD,Zero,Nyaya} composed with Normalize_{Vani,Panini,SNF} composed with Select[Deterministic,HMM,HSMM,Deep], constrained by Truth != Inference != Evidence != Authority"
  - concept: "Named research hypothesis: Evidence-Gated Hybrid Temporal Inference (EG-HTI) -- deterministic preprocessing, HMM as default cheap baseline, selective state-specific HSMM escalation, deep inference only when uncertainty/risk justifies cost; explicitly frozen as hypothesis, not adopted"
