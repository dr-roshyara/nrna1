    sentences, used against inventing a Claim->VerifiedClaim->Fact->Knowledge chain merely because ordinary
    language supplies the noun -- prefer fixed-identity-with-evolving-epistemic-standing instead"
  - "A disagreement-protection principle: 'coherence must not be obtained by deleting legitimate
    disagreement,' compatible with forward-only ConflictRecord preservation"
  - "A finite-core/unbounded-expression argument independently supporting the corpus's inverse-scaling ADR
    vision, grounded in Davidson's requirement that infinitely many sentences be generated from finitely
    many semantic primitives"
  - "A formalized 'INTERPRETATION-VARIANCE TEST': two lawful interpreters producing different claims P!=Q
    from identical evidence/authority/prerequisites must both be processable under the same constitutional
    rules without the Kernel adjudicating semantic superiority -- a concrete fitness test for a future
    'epistemic core of every computer' architecture"
  - "A twenty-item D-01..D-20 non-collapse register and six named DAV-KOS-1..6 candidate findings, both
    explicitly reserved for the same later cross-agent adjudication test referenced in 0185"

