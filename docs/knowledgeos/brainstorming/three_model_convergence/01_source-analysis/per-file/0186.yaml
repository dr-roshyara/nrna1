  - "Explicit F-CM-2/deduplication falsification application: noticing two candidates 'mean the same thing'
    is an interpretive act (via Davidson's inscrutability-of-reference), so semantic-equivalence must never
    silently become KnowledgeId equality inside the Kernel -- called one of the strongest Davidson-derived
    confirmations of the existing architecture"
