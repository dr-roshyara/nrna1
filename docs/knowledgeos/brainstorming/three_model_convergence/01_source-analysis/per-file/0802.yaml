defines:
  - concept: "The epistemic tuple K=⟨C,E,M,S,T,V,P⟩"
    definition: "A knowledge statement's full semantic model, distinguishing its claim (C), supporting evidence (E), method of evaluation (M), scope/context (S, e.g. staging vs. production), temporal validity (T), epistemic status/validity (V), and provenance (P) -- explicitly a semantic model rather than a mandated persistence schema, capturing why a bare textual claim is insufficient: the same sentence can carry different validity depending on scope and time"
  - concept: "AI-hallucination prevention as a KnowledgeOS architectural responsibility"
    definition: "A hallucination becomes architecturally dangerous specifically at the moment a generated claim is silently promoted to established knowledge without passing through the required epistemic process (evidence gathering, evaluation, determination) -- KnowledgeOS's responsibility is not to prevent AI from generating claims (which is legitimate and useful, symmetric with human belief formation) but to prevent the Generation→Authority transition from occurring without the applicable promotion rule being satisfied, directly extending the file's Belief≠Knowledge distinction to AI-generated hypotheses"
  - concept: "Truth rejected as a single undifferentiated predicate"
    definition: "Rather than one universal Truth(x) predicate, KnowledgeOS should represent multiple domain-owned predicates -- Supported(x) (epistemic, evidence-grounded), Established(x) (epistemic, sufficiently supported), Valid(x,t,S) (scoped and temporal), Approved(x,t) (governance), Authorized(x,t) (authorization) -- because a single word like 'status' otherwise hides materially different domain meanings across the Epistemic, Governance, Authorization, and Operational contexts, and because organizational facts (e.g. an Architecture Board's approval) can be authoritative without being empirically true in a universal sense"
refines:
  - concept: "0801's opening of Step 176 and its closing promise of a Truth/Claim/Evidence/Belief/Knowledge/Determination/Decision distinction"
    refinement: "DELIVERED IN FULL: the claim/evidence/belief/knowledge/determination/decision distinctions each formalized with worked examples, the epistemic tuple, the promotion pipeline, and the rejection of a single undifferentiated Truth(x) in favor of domain-owned predicates"
  - concept: "0801's epistemic-status vocabulary {Candidate,Supported,Established,Disputed,Superseded,Invalidated} and its 'AI may participate in the epistemic process without owning organizational truth' principle"
    refinement: "Extended with a concrete mechanism for exactly how AI participation is bounded: the epistemic promotion pipeline and the explicit naming of hallucination prevention (Generation→Authority without due process) as the specific failure mode this discipline exists to prevent, plus the explicit AI/human symmetry principle absent from 0801's more AI-focused framing"
  - concept: "0798's three-zone architecture (Epistemic→Governance→Operational→Epistemic) and 0799's three domain contracts"
    refinement: "Substantially upgraded into an explicit eight-stage 'semantic lifecycle architecture' (Observation→Claim→Evidence→Determination→Decision→Authorization→Execution→Outcome→Observation), inserting Claim and Evidence as distinct named stages between Observation and Determination that the three-zone model had left implicit within the Epistemic zone"
  - concept: "The arc's repeated Chapter-4-derived Current(K)≠Lineage(K) / CurrentKnowledge≠HistoricalKnowledge family of distinctions"
