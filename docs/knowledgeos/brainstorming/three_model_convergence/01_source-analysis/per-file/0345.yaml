  - concept: "T-1 origin pushed FOUR DAYS EARLIER and OUTSIDE the kernel/ corpus: 20260819-205757 (a Phase-1 critique document, tagged [X], predating even the earliest kernel/ document) states the atomicity-not-relatedness aggregate criterion verbatim ('a KnowledgeProduct aggregate is valid only if it owns invariants that must be maintained atomically... not simply a large object graph or a database document'); the god-object correction is now a FOUR-arrival pattern (205757 -> 110248 -> 111730 -> 113243) across six days, all in AGREEMENT with each other -- 'the contradiction is between the corpus and the earlier drawn model,' its significance being the quadruple independent arrival, not disagreement"
