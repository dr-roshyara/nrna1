  - concept: "Resolved terminological collision: 'AMBIGUOUS' -- intent-resolution-outcome (mechanism, 103255/104148/104251) vs proposed epistemic state (T-2 side B) -- 'keep separate; only the second is constitutional'"
  - concept: "NEW UNRESOLVED terminological collision: 'agent' -- epistemic participant INCLUDING wires/buffers (125708 SS10, matching this reconstruction's own tracked Fagin epistemic-participant material) vs accountable actor (governance model) -- explicitly flagged UNRESOLVED, 'a wire cannot be accountable,' directly bearing on 0285's Agent-vs-Accountable-Actor split (this reconstruction's own tracked distinction)"
  - concept: "MAJOR PROVENANCE FINDING directly examining this reconstruction's own file 0323 (source timestamp 20260825-171853): 0323 attributes its Knowledge-Space-projection reframing of C-15 to 'your earlier conceptual model' (Knowledge Space potentially unbounded/evolving -> projection at time t); tested against all 13 original-region ([O]) documents: 'knowledge space' occurs 0 times; 'projection' IS present (110950:10, 114530:13, 113645:7) but in a different sense; 'at time t'/'knowledge-at-time' occurs only ONCE (113645); retract/withdraw vocabulary is HEAVY (114358:32, 111647:24, 113410:14, 123619:11, 112855:10); first substantial 'Knowledge Space' appearance anywhere in the corpus is 103542, two days after the original region closed"
  - concept: "Explicit reading/verdict on the 0323 provenance finding: 'the original region contains a strong retraction thread and no Knowledge Space concept. The Knowledge-Space-projection reading of C-15 is therefore a CROSS-GENERATION HYPOTHESIS -- original retraction thinking combined with later research -- and must be labelled as such. It is NOT a recovery of something the original architecture already contained' -- with an explicit stated limit: absence of the phrase is not proof of absence of the idea, but 'the burden of showing otherwise sits with the claim, not against it'"
  - concept: "Final tally and closing statement: of eight temptations, FIVE are genuine (T-3, T-4, T-5, T-7, T-8); field-9 reclassified three of the original seven as NOT genuine conceptual contradictions (T-1 agreement-with-recurrence, T-2 partly-same-word, T-6 definition-lag); of the four non-T-8 genuine contradictions (T-3/T-4/T-5/T-7), ONLY T-4 has a K4 document on one side AND addresses a constitutional invariant directly -- the corpus's own self-assessed single highest-stakes unreconciled tension"
