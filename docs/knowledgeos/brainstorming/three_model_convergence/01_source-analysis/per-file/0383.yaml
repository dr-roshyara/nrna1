    refinement: "REVERSED: the Ideal State is now the STARTING point, not an endpoint or late-stage comparison target -- observation is evaluated AGAINST a pre-existing (though possibly unknown) ideal state, not used to construct one from scratch"
  - concept: "0366's Ideal Knowledge State K_t* (answerability-based, explicitly unobservable) and 0374's withdrawal of K_t*(p) in {0,1} establishing Ideal Knowledge != omniscience"
