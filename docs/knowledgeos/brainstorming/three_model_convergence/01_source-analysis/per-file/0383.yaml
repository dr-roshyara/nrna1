  - concept: "0378's declared singular next research focus 'What is a conditional determination?'"
    refinement: "Explicitly SUPERSEDED in priority ordering: this file argues Determination D_t=Compare(Observed_t,Ideal_t) cannot be properly understood until Ideal_t itself is understood, inserting 'What is the Ideal State?' as a logically prior research question"
  - concept: "0382's three-level problem decomposition and explicit self-correction against premature Kernel-tuple-writing"
    refinement: "Directly reinforced: this file's closing forward reading list (Ideal State / normative state / etc.) is explicitly deferred 'before we touch the Kernel again,' consistent with 0382's declared Level-2 (Scientific) research stage"
