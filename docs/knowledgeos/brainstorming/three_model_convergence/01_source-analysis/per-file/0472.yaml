  - concept: "Contradiction requires scope alignment and temporal overlap: Contradictory(A1,A2) <=> CompatibleScope(A1,A2) AND OverlappingTemporalScope(A1,A2) AND IncompatibleContent(A1,A2), further deepened to depend on a dimension's own value semantics (Boolean vs. multi-valued dimensions behave differently)"
  - concept: "Epistemic State != Support Score: evidence must not be prematurely collapsed to a scalar in [-1,1], preserving the distinction between weak/conflicting/insufficient/irrelevant/unknown evidence"
  - concept: "Temporal currency reframed as derived, not primitive: ValidityInterval(A)=[t_start,t_end), with Current(A,t) a derived membership predicate, and Current(A,t) != True(A,t)"
  - concept: "Relationship typing generalized beyond assertion-to-assertion: Source(R),Target(R) in a typed universe 𝒰, with relationship type determining legal type combinations"
  - concept: "Lord != CoherenceRepair: Lord expands the horizon (potentially increasing completeness), which is distinct from and does not necessarily increase coherence"
  - concept: "Four independent evaluative properties named: Coherence, Completeness (Complete(K,P)), Adequacy (Adequate(K,I)), and Truth/Correctness (Correct(K,X), possibly never absolutely establishable)"
  - concept: "Coherence is relational, not a property of an isolated assertion: Coherence(A,K,C,t), generalized to Coherence(K|P,C,t,R) -- coherence under a specified epistemic frame"
  - concept: "Zero's scope corrected to include gaps as well as violations: Zero(K) = CoherenceViolations(K) ∪ EpistemicGaps(K) ∪ UnresolvedStates(K)"
  - concept: "Sārathi's output renamed from a_t (action) to e_t (EpistemicAction), to avoid confusion with the human's real-world action"
  - concept: "Five-way, mutually non-synonymous status taxonomy: Incoherent, Unknown, Incomplete, Conflicted, Unresolved -- illustrated with a concrete truth table showing several of these can coexist with Coherent=Yes"
  - concept: "Question 9 launched: Conflict != Contradiction, with four already-discovered conflict forms (logical, epistemic, normative, decision) and an explicit acknowledgment that more may exist"
defines:
  - concept: "Coherence (final, corrected)"
    definition: "The integrity of a Knowledge State under its structural, logical, epistemic, temporal, and contextual constraints, relative to a specified epistemic frame Coherence(K|P,C,t,R); explicitly independent of Completeness, Adequacy, and Truth"
  - concept: "Four independent evaluative properties"
    definition: "Coherence (internal integrity), Completeness (Complete(K,P): contains everything required for a purpose), Adequacy (Adequate(K,I): sufficient for a decision relative to an Ideal State), Truth/Correctness (Correct(K,X): corresponds to reality, possibly never absolutely establishable)"
  - concept: "Contradiction (final, corrected)"
    definition: "Contradiction = SemanticRule(Dimension) + Scope + Time + Context + Values: whether two assertions genuinely contradict depends on the dimension's own value semantics plus scope compatibility and temporal overlap, not raw value inequality alone"
