about: >
  "02 — Definition-by-Definition Comparison (mandate §§2, 3)." Lays out all five actual definitions the
  corpus supplies for state/history-level equality relations (D1 `=`; D2 `≈` over histories; D3 `≈` over
  states; D4 `≡_K` from `261.21`; D5 `≡_K` from `258.8`), confirming "D3 and D4 are CHARACTER-FOR-CHARACTER
  the same predicate. That is the fact Steps 288-289 found" -- explicitly owning and re-examining this
  reconstruction's own already-tracked headline finding (file 1041).

  **FORMALLY WITHDRAWS THE "CORPUS CONTRADICTION" CHARACTERIZATION** this reconstruction has carried since
  file 1041 as "arguably the most important finding of the entire equality-research arc," propagated through
  files 1047, 1054-1055, 1057-1062. **Names the exact inference that was wrong**: "Inference made: D3=D4 ⟹
  either `≈` collapses into `≡`, or `≡` is undefined ⟹ CORPUS CONTRADICTION. THE INFERENCE TREATS D4 AS AN
  ASSERTION. IT IS NOT." Quotes `261.21` in full: "Instead, define a CANDIDATE semantic equality:
  `K_1≡_K K_2⟺∀O∈𝒪_K:O(K_1)=O(K_2)`... However: `𝒪_K` is not yet completely closed. Therefore this is A
  CANDIDATE FORMAL DEFINITION, NOT A COMPLETED THEOREM." Boxed: **"D4 and D5 are PROPOSALS TO FILL the
  `≡_sem` slot. Proposing `≡:=≈`'s formula is NOT ASSERTING `≡=≈`."**

  **DELIVERS THE PRECISE, DEFINITIVE, TWO-SPEECH-ACT DISTINCTION THAT RESOLVES THE ENTIRE SAGA**: an ASSERTION
  ("`≡_K` IS `∀O∈𝒪_K`") would make `≡` and `≈` the same relation and the register would genuinely
  contradict itself; a CANDIDATE ("`≡_K` COULD BE `∀O∈𝒪_K`; not a theorem") leaves the register standing and
  merely creates a ratification question. "BOTH LOCI PERFORM THE SECOND ACT. This is the WHOLE of the
  correction -- the FORMULAS were read correctly; the MODALITY was not." This is a genuinely rare and
  important class of self-correction: not a factual error (the shared-formula observation itself, tracked
  since file 1041, was and remains correct), but an interpretive/linguistic error in how a correctly-observed
  fact was characterized.

  **DELIVERS THE PRECISE ASYMMETRIC STRUCTURE THAT WAS THE ACTUAL SITUATION ALL ALONG**: "`≈` is the relation
  WITH A DEFINITION; `≡` is the relation WITH A NAME. The corpus's candidate move is therefore the NATURAL
  one -- define the unfilled slot using the filled one -- and its own reason for not ratifying it is that the
  filled one is ITSELF CONDITIONAL on an unclosed `𝒪_K`. THE BLOCKER IS `𝒪_K`, NOT A CONTRADICTION." This
  precisely reframes the entire arc's central obstacle: not a corpus-level logical inconsistency requiring
  arbitration between two conflicting readings, but a single, already-well-known unresolved dependency
  (`𝒪_K`'s closure) that was always the true root cause.

  **DELIVERS THE STATUS BLOCK'S EXPLICIT, FORMAL WITHDRAWAL**: "WITHDRAWN: the contradiction reading."
