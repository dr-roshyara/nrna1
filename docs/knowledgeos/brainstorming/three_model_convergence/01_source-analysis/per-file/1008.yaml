about: >
  The actual D285-7 artifact, tracing the fixed dependency `K→𝓘→𝒪→δ→Kernel` per candidate state model.

  **Delivers the full five-candidate consequence matrix for the first time**: K-1 (`K_t`, ratified) --
  invariants `I-1...I-12` ratified, Action is a primitive so operations are inside the vocabulary, replay
  expressible, but "`𝒪` never enumerated against these primitives"; K-2 (`(𝒜,ℛ)`) -- invariants derived and
  unratified, `𝒪_sem` 19 candidates/5 families "not minimal" (new corpus citation "272A §27"), the commit case
  has no carrier ("`Γ` derived"), replay NOT expressible, commit is a no-op; K-3 (`(A,R,Σ,E_L)`) -- **`Σ`
  stored contradicts the retract/OR-merge proof, so `Σ` must be derived, causing K-3 to "collapse toward
  K-2"** (a genuinely new finding not previously captured); K-6 (`𝒦=(K,H)`) -- adds replay invariants and a
  `Replay` operation class, `fold(δ,H,K_0)`, "restores replay — the minimal repair to K-2"; K-7 (Zero
  layering `Ω/D_t/K_t/Z_t`) -- adds non-collapse laws and `Ask`/dimension-recognition operations, "the only
  candidate expressing missingness," but presupposes undefined `Ω`.

  **Delivers the layering diagram (already tracked in outline, now in full canonical form)**: `K_t (governance
  anchor, replay-capable) --π_K[DEFINABLE, NOT COMPUTABLE, blocked on Qualify]--> (𝒜,ℛ) (epistemic sub-state,
  replay-INcapable) --+H--> 𝒦=(K,H) (restores replay); --+D_t--> expresses missingness; --+Σ derived (never
  stored)--> proven, not chosen.`

  **DELIVERS THE FILE'S CENTRAL "NEW FINDING OF THIS STEP"**: "`𝒪` cannot be settled at either level until it
  is enumerated against a STATED primitive set. `272A` enumerated 19 operations against the verification
  lane's vocabulary; NOBODY has enumerated `𝒪` against the ratified 8 primitives — and that, NOT MINIMALITY,
  is why `𝒪_core` cannot close." This is the canonical source for this reconstruction's already-tracked
  finding (files 0993, 0999, 1003, 1005) that operation-space enumeration is one of D288's/the programme's two
  genuine remaining open fronts.

  **Restates the already-tracked four-line scope resolution** and delivers the sharpened D285-7 conclusion:
  "Minimality has NOT been demonstrated, because the operation space has not been enumerated against the
  ratified 8-primitive state model. `𝒪_sem`'s 19 operations were enumerated against the VERIFICATION-LANE
  vocabulary only. Against the ratified 8 primitives, `𝒪` is UNKNOWN."

  **Template §4 explicitly disclaims any selection function**: "The matrix is a dependency trace, not a
  selection. It ranks nothing and selects nothing." **Template §5**: no equality asserted -- "an implication,
  not an identity." **Template §7**: architectural `R6` for the layering; unresolved flagged explicitly as
  the `𝒪`-non-enumeration finding, "the real reason `𝒪_core` cannot close."
