defines:
  - concept: "Normative State (N_t)"
    definition: "N_t represents duties, permissions, prohibitions, obligations, principles, authoritative instructions, and role-based norms -- distinct from the Ideal State, which describes the desired state's content rather than an actor's normative obligations"
  - concept: "Actor State"
    definition: "ActorState=(Role,Capabilities,KnowledgeAccess,Authority,Purpose,Commitments,AffectiveContext) -- the formal representation of the Knower/agent, distinct from the Knowledge State they hold"
  - concept: "Action (extended)"
    definition: "Action=(Actor,Operation,Purpose,Authority,Context,Execution,Outcome,Attribution) -- distinguishing who performed, who authorized, who caused, and who is responsible as potentially different parties/relations"
  - concept: "Understanding (U, formal)"
    definition: "U=(ConceptualModel,Relations,Implications,NormativeMeaning,DecisionConsequences,Uncertainty) -- 'what it means, implies and requires in this context,' distinct from Knowledge ('what is represented')"
  - concept: "Five-way Gap taxonomy"
    definition: "Epistemic gap (we don't know), Understanding gap (we know facts but not their meaning), Normative gap (we don't know what ought to be done), Decision gap (we know enough facts but can't determine the decision), Domain gap (reality doesn't match the desired state)"
