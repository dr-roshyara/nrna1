defines:
  - concept: "Difference structure (Δ, corrected)"
    definition: "Δ_E(K,I^K)=(Δ_D,Δ_V,Δ_Σ,Δ_R,Δ_C): the raw output of Compare(K,I^K), a gap/mismatch structure -- not itself a distance. A distance requires a further, separate measurement function Measure_E(Δ_E)->D_E"
  - concept: "Zero (final reformalization)"
    definition: "Zero: State x Ideal -> Epistemic Difference (Δ), i.e. Epistemic Boundary Detection; never a distance calculator. Measurement is a distinct, later capability: Epistemic Difference -> Quantification"
  - concept: "Dynamic epistemic navigation (vs. static optimization)"
    definition: "The joint transition (K_t,U_t,X_t,I_t) -> (K_{t+1},U_{t+1},X_{t+1},I_{t+1}), where I_{t+1}=Revision(I_t,K_t,U_t,X_t,Knower) -- the target itself evolves as knowledge/understanding/domain evolve, so reaching zero distance to a fixed ideal is not the correct framing of the KnowledgeOS problem"
