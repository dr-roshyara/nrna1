  - concept: "The arc's many prior partial/informal treatments of Zero (0405-0476)"
    refinement: "Definitively settled: Zero's canonical output is a difference structure Δ, never a scalar distance -- quantification is a separate, later operation"
  - concept: "0472's Coherence!=Completeness!=Adequacy!=Truth four-way separation"
    refinement: "Extended to the Ideal Understanding State: I^U(P) must be purpose-relative sufficiency, never 'complete understanding'"
  - concept: "0460's earlier audit-and-retraction pattern (closing the 0450-0459 arc)"
