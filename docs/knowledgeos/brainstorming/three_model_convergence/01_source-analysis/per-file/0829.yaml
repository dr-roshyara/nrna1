defines:
  - concept: "The canonical semantic elevation chain"
    definition: "The architecture's most precise formal statement of its recurring no-implicit-elevation principle: Information⇏Evidence⇏Truth⇏Authority⇏Decision⇏Outcome, meaning no artifact may silently cross from one category to the next stronger one -- each of the five arrows requires an explicit, named mechanism (Information becomes Evidence only through qualification; Evidence becomes an Assessment only through assessment; an Assessment becomes a Decision only through authorized decision; a Decision becomes an Action only through execution; an Action becomes an Outcome only through world interaction) -- crystallized as Invariant I73 ('no semantic elevation may occur implicitly') and proposed as a candidate Architecture Constitution Principle, the most compact and complete restatement yet of the theme first named at 0823 and re-affirmed at 0827"
  - concept: "KnowledgeArtifact"
    definition: "An intentionally curated, reusable organizational knowledge object distinct from raw information, a single observation, a piece of evidence, a proposition, or an assessment -- formalized as the tuple KA=(Content,Propositions,Evidence,Assessment,Context,Lineage,Validity) -- introduced specifically to resolve the dangerous overload of the word 'Knowledge' (which had been used across at least seven distinct senses in the corpus) and to give the deliberately-produced, durable knowledge objects KnowledgeOS is meant to manage their own distinct vocabulary slot, separate from the transient epistemic objects (observation, evidence, assessment) that feed into them"
  - concept: "Descriptive versus Normative (D(x)⇏N(x))"
    definition: "An architectural instantiation of the philosophical is/ought distinction: a descriptive proposition D(x) states what is observed to be the case (e.g. 'most teams do X'), while a normative rule N(x) states what should happen (e.g. 'teams should do X') -- knowing the former never by itself establishes the latter, so the architecture must never silently promote an observed regularity into a governance rule; this is crystallized as Invariant I71 (descriptive observations must not be silently promoted to normative rules) and further sharpened via Invariant I72 for the specific case of machine-learned statistical regularities (Statistical regularity≠Governance legitimacy), providing a direct, concrete safeguard against a model's learned P(Y|X) being mistaken for a governance-defined Allowed(Y|X)"
