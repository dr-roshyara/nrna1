    refinement: "Directly reused: NextBestInformation=argmax_O VOI(O) formalizes uncertainty reduction as a planning problem, explicitly connecting Step 27 to both 25Z and Step 26"
  - concept: "0603's OrphanKnowledge and the recurring capstone Zero unification (0598/0604/0605)"
