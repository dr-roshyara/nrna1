defines:
  - concept: "Unknown vs. numeric probability"
    definition: "Unknown means 'we do not possess a justified probability model' for H; a stated probability of 0.5 means 'under the specified probability model, H has probability 0.5' — these are categorically different claims, and the former must never be silently encoded as the latter"
  - concept: "Eight-dimensional uncertainty vector"
    definition: "U(H)=(U_measurement,U_epistemic,U_aleatoric,U_model,U_semantic,U_identity,U_temporal,U_causal) — a structured, diagnostically separable representation replacing any single scalar confidence value; not every component applies to every proposition"
  - concept: "ConfidenceInterval≠CredibleInterval"
    definition: "A classical (frequentist) confidence interval describes a procedure's long-run coverage property, not a probability that the fixed parameter lies within it; a Bayesian credible interval directly states P(θ∈[L,U]|E)=0.95 — the two must not be conflated"
  - concept: "Naked-number design principle"
    definition: "KnowledgeOS must never expose a bare numeric value whose semantics (meaning, reference context, method, time, uncertainty) are unclear; every exposed number requires this accompanying metadata"
