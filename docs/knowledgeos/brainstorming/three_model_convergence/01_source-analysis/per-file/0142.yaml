about: >
  First file in this reading stretch located under docs/knowledgeos/brainstorming/kernel/ rather than
  the flat root. Three turns. (1) External research grounding for the SNF formula: NSID (Normalized
  Semantic Information Distance, from a cited 2026 Semantic Algorithmic Information Theory paper),
  knowledge-graph normalization (1NF/2NF/3NF-KG), competing semantic-entropy definitions, and a
  hash-based (URDNA2015) alternative to raw Gödel numbering -- proposes one large combined SNF formula.
  (2) A rigorous internal rejection of that combined formula as over-prescriptive; redefines SNF at a
  higher abstraction (SNF(E,C) = N_S(M(E,C))), demotes the Gödel/hash idea to a mere "Fingerprint" (not
  semantic proof), and formalizes 0141's asymmetric-risk argument into two independent metrics: FCR
  (False Collapse Rate) and FDR (False Divergence Rate). (3) A "Senior Mathematical Review" that
  formally validates each of the 7 refined metrics property-by-property (boundedness, monotonicity,
  etc.) and issues a final accept/reject table.

introduces:
  - "FCR (False Collapse Rate, P(SNF(Ei)~SNF(Ej) | Ei not-equiv Ej)) and FDR (False Divergence Rate, the
    mirror case) as two independent, formally defined conditional-probability metrics -- FCR named 'the
    most critical metric for KnowledgeOS,' formalizing 0141's asymmetric-collision-risk argument"
  - "New architectural prohibition: 'SNF equality -> Knowledge identity is forbidden' -- a sharper
    operational restatement of the already-tracked Representation≠Identity/Vāṇī principle, not a new
    claim"
  - "Transformation classification: T^preserve / T^alter / T^ambiguous -- meaning-changing
    transformations must be measured via D_sep/FCR, not graded as failures of T_preserve"
  - "SNF redefined at a higher abstraction level (SNF(E,C) = N_S(M(E,C))) explicitly to keep the SNF
    representation 'replaceable' behind a stable measurement interface -- rejects the earlier
    over-prescriptive combined formula from within the same file"
  - "External research citations (NSID, SAIT/STMS, KG-NF 1NF/2NF/3NF) -- all explicitly deferred as
    research candidates, not adopted into SNF's definition"

