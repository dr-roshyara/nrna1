defines:
  - concept: "The fake truth ladder anti-pattern (rejected)"
    definition: "Modeling epistemic states as a single naturally-ordered scale (e.g. UNKNOWN < CLAIMED < SUPPORTED < VERIFIED, or an L0-L5 numeric ladder) is a category error; epistemic status is a function of claim, evidence, method, context and authority together, not a position on one linear axis -- a claim can be well-supported without being deterministically verified, and a structural property can be deterministically verified while its business rationale remains uncertain"
  - concept: "KnowledgeClaim≠Fact"
    definition: "A KnowledgeClaim is a proposition represented by KnowledgeOS about something; whether that proposition is actually true is a separate question tracked via a distinct TruthStatus dimension, never collapsed into the claim's mere existence or its EpistemicStatus"
  - concept: "Provenance≠Ownership≠Authority"
    definition: "Provenance is the lineage of a represented claim (where it came from, through which transformations); Ownership is who owns the artifact or responsibility for it; Authority is who or what has legitimate power to establish or approve it -- three distinct concepts that must never collapse into one field or role"
  - concept: "Authority(X,S,T)"
    definition: "Authority is meaningless without an explicit scope S and time T -- an actor or body authoritative for one scope (e.g. Domain Architecture) is not automatically authoritative for another (e.g. Production Operations), and authority claims must always be evaluated as scoped and temporally bounded, never as a global unconditional property"
  - concept: "Correlation≠Causation (KnowledgeOS analytical invariant)"
    definition: "An observed correlation between two facts (e.g. a deployment failed) must never automatically be represented in KnowledgeOS as a causal explanation (e.g. the architecture caused the deployment failure) without evidence and explicit causal reasoning connecting them"
  - concept: "Verification⊆Determination"
    definition: "Every verification is a kind of determination (a conclusion reached by applying a method to evidence against a proposition), but not every determination is a verification -- a RiskAssessment produces a determination without being a conformance verification, preserving finer semantic precision than treating all conclusions identically"
  - concept: "Knowledge drift / Drift≠Error"
    definition: "Divergence D_i=D(K_i,K_0) of a derived representation K_i from its authoritative source K_0 is detectable via structural/semantic comparison, missing provenance, changed terminology or constraints, contradiction, or version mismatch; such divergence is not automatically an error -- it must be classified (EXPECTED_ADAPTATION / AUTHORIZED_VARIATION / UNAUTHORIZED_DEVIATION / UNKNOWN) before any violation judgment is made"
  - concept: "ChatMessage≠Inquiry"
    definition: "A chat message is unstructured communication; an Inquiry is a first-class governed domain object with a subject, purpose, evidence requirements, method, and expected determination -- an AI conversation is never itself the authoritative artifact, only the governed Claims/Evidence/Determinations derived from it are"
  - concept: "Shared Kernel warning: Shared semantics≠shared aggregate"
    definition: "The Epistemic Kernel's shared concepts (KnowledgeClaim, Evidence, Decision, etc.) must establish shared contracts and invariants across bounded contexts, but must never be implemented as one giant shared database/object model forced onto every bounded context -- doing so recreates a 'Big Ball of Mud' despite superficially clean shared semantics"
