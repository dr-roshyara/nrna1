defines:
  - concept: "The central bounded-context detection test"
    definition: "A bounded context boundary is evidenced whenever a shared vocabulary term x carries genuinely different meaning across two candidate models: Meaning(x|BC_i)≠Meaning(x|BC_j). This is explicitly stronger than organizational or technical justifications ('these belong to different modules/teams/services') because it derives the boundary from the semantics of the domain language itself rather than from an accident of how the system happens to be structured -- the file's worked example is the word 'Decision,' which means an assessed epistemic conclusion, an authorized governance determination, and an execution instruction in three different candidate contexts, none of which should be forced to share one universal Decision object"
  - concept: "'Forgetting is a first-class phenomenon'"
    definition: "A system's currently-visible state (CurrentState_t) is formally a projection of its full history (π(History_≤t)), and that projection may deliberately omit information that the underlying history nonetheless retains -- so an actor's visible knowledge (InformationAvailable) is a strict subset of what the system has recorded (InformationRecorded), which is itself a strict subset of everything that actually happened in reality (Reality): Actor knowledge⊆System memory⊆Reality. This means an architecture must treat the deliberate narrowing of a current view relative to full history as a designed, legitimate architectural feature (supporting least-privilege, context management, and manageable cognitive load) rather than as an accidental information loss to be avoided"
  - concept: "'Inference has no implicit authority'"
    definition: "A named critical KnowledgeOS principle stating that an AI or statistical model's output -- however high its confidence or predicted probability -- never by itself confers organizational authority to act; a prediction such as P=0.87 must pass through the full chain Prediction→Assessment→Governance→Decision→Action before it can become an authorized action, and no step in that chain may be skipped merely because the underlying inference was confident, directly generalizing the arc's earlier statistical-confidence-cannot-manufacture-authority findings (e.g. 0813) into a compact, quotable statement specifically for the bounded-context/AI-governance boundary"
