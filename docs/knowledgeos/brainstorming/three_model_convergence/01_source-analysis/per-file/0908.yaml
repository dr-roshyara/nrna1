defines:
  - concept: "The mature Conditional Verdict with five resolution strategies"
    definition: "A structured refinement of the previously vague third truth-value 'Conditional' in the policy-verdict space: Verdict=Permit∣Deny∣Conditional(c)∣Unknown(u), where Conditional(c)=(RequiredConditions RC, SatisfiedConditions SC⊆RC, MissingConditions MC=RC∖SC, ResolutionStrategy s), with MC≠∅ as the existence condition. Every Conditional verdict must specify exactly one resolution strategy s∈{WAIT,REQUEST,ESCALATE,REASSESS,BLOCK}: WAIT means the required information is simply expected to arrive later without external action; REQUEST means an external actor must actively supply missing information; ESCALATE means the decision exceeds the currently available authority level and must go to a higher authority; REASSESS means a future event or changed evidence will require re-running the policy evaluation; BLOCK means the missing condition cannot currently be satisfied at all and execution is prohibited outright. This makes Conditional a computationally actionable, non-permanent state rather than an unresolved ambiguity, and is explicitly distinguished from Unknown (where the applicable policy itself cannot even be determined)"
  - concept: "The four-symbol closure taxonomy FC/CC/EC/GC"
    definition: "A refinement of the corpus's recurring closure-vocabulary proliferation into four independently-tracked symbols, each a binary or graded status per construct: FC (Formal Closure) holds when all symbols, types, and semantics for a construct are explicitly defined with no undefined dependency; CC (Computational Closure) holds when the construct is executable, deterministic under fixed inputs, total over its declared domain, and produces a defined result; EC (Empirical Closure) holds only when the construct has actually been tested against the real KnowledgeOS implementation with observed expected behavior and reproducible evidence; GC (Governance Closure) holds only when the construct's authority is defined, responsibility is assigned, its lifecycle is defined, and any normative choices bearing on it have been formally ratified. A construct can hold any combination of these four independently (e.g. FC=1,CC=0,EC=0,GC=1 for Policy at this stage: formally and governance-specified, but not yet executable or empirically validated), and none of the four may be inferred from another -- directly enforcing FormalClosure≠CompleteClosure"
