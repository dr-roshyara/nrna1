about: >
  A compact (31-line), disciplined ten-entry ([E-01] through [E-10]) source-evidence register, each entry
  tagged with what the source text `[S]` actually says, what the specific edition's commentary `[C]` adds,
  and what philosophical interpretation `[P]` is used -- directly implementing the discipline files 0970/
  0973 established (see file 0973's §2), opening "a [P] or [R] statement must never silently become [S]."

  **Entry `E-10` DELIVERS THE FILE'S MOST IMPORTANT SAFEGUARD, EXPLICITLY FLAGGED WITH A RED MARKER**:
  "Kṛṣṇa as Supreme Personality of Godhead -- a person, explicitly not an abstraction -- 🔴 BLOCKS ANY
  `Kṛṣṇa=Ω` IDENTITY CLAIM" -- **A DIRECT, EXPLICIT, STANDING GUARD AGAINST THE EXACT DECORATIVE MAPPING
  ALREADY COMMITTED IN FILES 0943, 0954, AND (MOST SEVERELY) 0971**, continuing the disciplined lineage's
  now-repeated (files 0970, 0973, 0975, and here) explicit rejection of this specific overclaim.

  **Entry `E-02` records the source's genuine two-level-knower structure** (Kṛṣṇa as universal knower
  distinct from the individual knower) as source evidence only, without yet drawing any KnowledgeOS
  conclusion -- this is the raw evidentiary basis that file 0975's D285-8 appendix later formally tested
  and refuted via the information-theoretic impossibility theorem.

  **The closing "Two things the register deliberately does NOT contain" section delivers an explicit,
  reusable discipline statement**: (1) "No Sanskrit term is treated as a KnowledgeOS type... `Kṣetrajña`
  appears in ratified FA-4, but it got there through the architecture's own lineage -- R1 records the
  source, not the ratification"; (2) "No verse is cited as authority for a mathematical proposition. Where a
  formal result exists, it is cited from the corpus (`31.19`, `§256.21`, `I-1`), never from the text" --
  **revealing a further new corpus reference, `§256.21`**, alongside the already-noted `31.19` and `I-1`
  references from file 0975, all bridge candidates for this reconstruction's future encounter.
