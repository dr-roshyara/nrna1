  - concept: "Observer-indexed notation K_t^A (observer A's extracted state) and O_t^A (observer A's observations) introduced into the Ideal-State lineage for the first time, connecting the single-observer 0383/0384 formulation back to the corpus's earlier participant-relative epistemic-logic tradition (Fagin)"
  - concept: "Three-way disambiguation of I_t named 'the next critical question': (1) all logically possible information; (2) all information actually TRUE about the thing at t; (3) all information that COULD IN PRINCIPLE be known -- explicitly not equivalent, and determinative of what the 'infinite Knowledge Space' and KnowledgeOS's extraction target actually mean"
