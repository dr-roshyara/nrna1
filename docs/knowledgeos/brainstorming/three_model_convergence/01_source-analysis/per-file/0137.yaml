about: >
  Delivers the CPU-only benchmark 0135 promised (and 0136 failed to deliver, presenting only labeled
  "theoretical projections" instead). Two rounds: a 4-sentence pilot exposing an English/German
  extraction asymmetry, then a 120-case KOS-SCB v0.1 benchmark with numbers explicitly labeled
  "measurements of the prototype running here, not estimates": 74.2% overall semantic accuracy,
  0.0081ms mean latency, ~123,000 parses/sec, ~0.05MB peak memory, 6 false accepts among 20 deliberately
  ambiguous cases. The FIRST empirically measured (not argued/philosophical) negative result in the
  corpus: "The computational model is cheap. The semantic model is hard." Proposes decomposing the
  single-layer KIR into three intermediate representations (Surface AST -> Semantic AST -> Knowledge
  IR) as the next step, and explicitly reconnects the false-accept failures to the need for a
  first-class UNKNOWN state, invoking "our earlier Zero + Tarka + Gödel + Nyāya research."

