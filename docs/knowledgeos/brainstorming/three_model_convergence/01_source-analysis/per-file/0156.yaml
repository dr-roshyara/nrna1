about: >
  Round 8 of the Kernel-boundary cycle, a very long (2507-line) file. DeepSeek answers a canonical
  "12 Fundamental Kernel Questions" checklist end to end for the first time (what is committed / owner /
  identity / evidence / justification / epistemic state / confidence / mutability / invariants /
  transition semantics / DDD classification / smallest consistency boundary), again concluding
  KnowledgeAggregate is the answer to Q12. The critique-voice grades each answer individually, explicitly
  marking Q12 "HYPOTHESIS -- NOT ACCEPTED" (reiterating 0155's semantic-relatedness-≠-aggregate
  correction), and introduces six concrete "Zero case" absence-scenario stress tests operationalizing
  the Zero-last discipline established at 0154. Perplexity then answers the same 12 questions with its
  own parallel worksheet, reproducing its 0154 discipline of leaving every single question UNRESOLVED.
  Round 9 is commissioned: a scenario-based falsification task against ~20 concrete domain scenarios,
  explicitly required to produce multiple candidate consistency boundaries rather than select one. The
  file ends mid-transition into what appears to be Kimi's next contribution.

introduces:
  - "DeepSeek's first end-to-end answered '12 Fundamental Kernel Questions' checklist -- a complete
    (if still contested) candidate domain model, more concrete than any prior round's partial answers"
  - "Six concrete 'Zero case' absence stress-tests: (1) candidate with no identity/evidence/
    justification -- is it Candidate or Knowledge?; (2) claim with identity but no valid evidence --
    can it be admitted?; (3) admitted claim whose evidence is later invalidated -- disappear/insufficient
    /historically-valid/contested?; (4) claim with two equally valid meanings and no resolving evidence
    -- choose/abstain/preserve-candidates/create-ambiguity-state?; (5) claim with no contradiction/
    challenge/supersession/new evidence -- what is its state?; (6) claim with no confidence -- is that
    0, UNKNOWN, NOT_ASSESSED, or NOT_APPLICABLE? -- a genuine operationalization of the Zero lens,
    explicitly tied to an unread SNF/P5 finding ('UNKNOWN ≠ NOT_EXPRESSED')"
  - "Perplexity's parallel 12-question worksheet, reproducing its established maximal-discipline stance:
    every question given 4-5 candidate answers with cross-lens analysis, every single one left
    explicitly UNRESOLVED"
  - "Round 9 commissioned: scenario-based falsification against ~20 concrete domain scenarios (admission,
    rejection, evidence invalidation, contestation, supersession, reconciliation, withdrawal, shared
    evidence across claims, conflicting/unknown/absent evidence, unresolved interpretation), explicitly
    required to produce MULTIPLE candidate consistency boundaries rather than prematurely select one,
    and to attempt concrete counterexample falsification of the KnowledgeAggregate hypothesis"

