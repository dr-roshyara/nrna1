about: >
  A second Chapter-1 pass, opening identically to file 2291: "Chapter 1 does not primarily add another
  knowledge primitive. It adds the initial pathological state from which the kernel must operate." This
  record captures the incremental content beyond the already-tracked closing document.

  **DELIVERS THE NAMED PRINCIPLE 'G1 — KNOWLEDGE IS INSUFFICIENT WITHOUT DISCRIMINATION'**: explicitly
  formalized as K_t⇏Decision_t; instead (K_t,B_t,C_t)⇒Decision_t subject to Q(K_t,C_t)=valid — "one of the
  most important refinements from Chapter 1 for the formal kernel." NOTE: this "G1" label is a LOCAL naming
  choice within this document (Chapter-1-derived principle #1), not to be confused with the already-tracked
  corpus-wide "G1" designation for the unresolved Qualify problem (which this same document elsewhere also
  uses, e.g. "Q remains our G1 unresolved operator") — a mild internal naming ambiguity within this single
  document, worth flagging.

  **DELIVERS THE EXPLICIT CONTAINMENT HIERARCHY**: Knower⊃Kernel/Mind⊃Buddhi⊃Operations-over-K_t, with K_t=
  "state operated upon" kept separate — "this preserves the very important distinction... between the state
  and the epistemic mechanism operating over the state... prevents us from accidentally collapsing Knower=
  Mind=Buddhi=Knowledge." Explicitly retracts an earlier looser formulation: "I would now REMOVE the earlier
  temptation to say 'The Knowledge Ātma is the kernel.' That is too strong."

  **DELIVERS A SIX-OPERATOR PRELIMINARY ALGEBRA**: Ω:W→O (observation), ρ:O→K (representation), β:K→D
  (discrimination), Q:K→{qualified,unqualified,undetermined} (qualification, "our G1 unresolved operator"),
  δ:K×E→K' (revision), α:K,B,C→A (decision) — composed as 𝔎_t→_Ω O_t→_ρ K_t→_{B_t} D_t→_Q E_t→_α A_t→_δ
  𝔎_{t+1}, with an explicit interrupt: Q(K_t)=⊥⇒Zero⇒Investigate.

  Reinforces the already-tracked two-type Zero distinction (Z_1 missing-information vs Z_2 model-
  insufficiency — a variant close to but not identical to file 2291's three-way split), and Purification=
  discrimination-improvement rather than accumulation, formalized as (K_t,B_t,M_t)→(K_{t+1},B_{t+1},M_{t+1}).
