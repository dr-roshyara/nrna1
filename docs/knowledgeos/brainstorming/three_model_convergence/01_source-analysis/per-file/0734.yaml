defines:
  - concept: "CanExecute(Action)"
    definition: "A material action may proceed only when four independently-verifiable conditions all hold: AuthorizationValid (a still-valid, granted authorization exists), ContextValid (the governing context has not expired or been superseded), RequiredAssurancePassed (any mandated pre-execution checks have passed), and SubjectAvailable (the target system is reachable) -- unifying the previously separate Authorization, Context, and Assurance architectural threads into one composable, deterministic precondition"
  - concept: "Named failure-reason taxonomy"
    definition: "When CanExecute fails, the platform returns a specific named reason (AUTHORIZATION_DENIED, CONTEXT_EXPIRED, ASSURANCE_FAILED, REQUIRED_EVIDENCE_MISSING, SUBJECT_UNAVAILABLE) rather than a generic error code, allowing an agent to reason over the semantic cause of the failure rather than an opaque technical status like an HTTP 403"
  - concept: "Correlation ID vs. Causation ID"
    definition: "CorrelationID identifies which overall workflow/trace an event belongs to (e.g. GT-NEXUS-001); CausationID identifies the specific prior event or action that directly produced this event -- the two answer different questions ('which workflow?' vs. 'what caused this specific step?') and must be tracked separately in the event envelope"
