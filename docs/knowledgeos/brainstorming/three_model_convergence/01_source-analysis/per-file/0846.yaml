defines:
  - concept: "Semantic Integrity (candidate central architectural concept)"
    definition: "The preservation of the distinctions, context, provenance, uncertainty and authority relationships required for a piece of knowledge to retain its intended meaning across transformations, boundaries and time -- symbolically SI(K,T)=Preservation(CriticalSemantics(K)) -- explicitly proposed as stronger than mere 'data integrity' (which only asks whether stored data is internally valid, e.g. a database constraint being satisfied) since semantic integrity instead asks whether the data still means what it was supposed to mean (e.g. a valid 'status=approved' row still leaving open who approved it, under which policy, at what time, for which object version, and with what evidence). Immediately and explicitly NOT certified as the book's actual central thesis pending the still-undelivered evidence audit of Steps 1-182, which alone can determine whether the concept was repeatedly present explicitly, repeatedly present implicitly, a later synthesis of independent ideas, or primarily the current retrospective interpretation -- all four outcomes being treated as equally legitimate possible findings"
  - concept: "The architecture-debt taxonomy"
    definition: "A precise three-way classification of what can go wrong between an architecture's four independent states (Intended/Designed/Implemented/Verified): an implementation gap occurs when something is Designed but not Implemented; an assurance gap occurs when something is Implemented but not Verified; an uncontrolled capability occurs when something is Implemented and Verified but was never actually Intended (i.e. a capability exists and demonstrably works, yet no one deliberately decided it should exist) -- each form of debt requires a different remedy and represents a genuinely different kind of architectural risk, directly complementing the earlier three-way Architecture/Implementation/Verification gap separation from 0840 by adding the specific case of unintended-but-functioning capability"
