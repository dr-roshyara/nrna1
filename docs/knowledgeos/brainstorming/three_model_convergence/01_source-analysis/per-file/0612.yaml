defines:
  - concept: "Three-way failure-state separation"
    definition: "False (established falsehood, H=False) ≠ Unknown (meaningful proposition whose truth value current knowledge cannot establish, Unknown(H)) ≠ Undefined/⊥ (the requested operation cannot legitimately be performed at all, f(x)=⊥) — three categorically distinct outcomes that must never be collapsed into one another"
  - concept: "Epistemic composition law"
    definition: "g∘f is valid only when Range(f)⊆Domain(g) at the level of epistemic types, not merely at the level of raw data shape — SemanticTypeCompatibility is a precondition for composition, formally preventing an under-qualified object (e.g. a Hypothesis) from silently satisfying a stronger downstream requirement (e.g. a ValidatedClaim)"
  - concept: "EpistemicClaim (proposed atomic unit)"
    definition: "EC=(Subject,Predicate,Value,Context,Time,Evidence,Provenance,EpistemicStatus,Uncertainty,Validation,Dependencies) — an eleven-field structure proposed to replace the bare notion of a Fact as the fundamental unit of KnowledgeOS knowledge representation"
  - concept: "Closure invariant"
    definition: "Every successful KnowledgeOS transformation must return an object of its declared epistemic type, or the undefined result ⊥ — it must never silently return an untyped or mistyped object"
