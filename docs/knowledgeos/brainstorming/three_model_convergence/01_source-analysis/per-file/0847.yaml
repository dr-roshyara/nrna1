defines:
  - concept: "Architecture Residuals"
    definition: "Borrowed directly from the statistical concept of a model residual (R=Observation-Prediction), an architecture residual is the gap between what the architecture is believed/declared to be and what is actually observed in the implemented system's evidence -- e.g. IntendedCapability-ImplementedCapability or DeclaredInvariant-ObservedBehavior. Rather than treating such mismatches merely as defects to be silently fixed, they are explicitly reframed as knowledge in their own right: examining where the conceptual model fails to explain the actual system reveals exactly the points where either the model or the implementation needs revision, closing a scientific audit loop (Model→Prediction→Observation→Residual→ModelRevision) that makes the architecture a self-correcting, living knowledge model rather than a static declaration"
  - concept: "Convergent discovery vs. divergent interpretation"
    definition: "Two opposite but equally informative outcomes when tracing a concept's genealogy across independent development paths. Convergent discovery occurs when multiple genuinely independent paths (e.g. an experiment, a DDD analysis, and a governance problem) each separately arrive at the same principle I -- counted as Convergence(I), this is treated not as a probability but as qualitative evidence of the principle's conceptual robustness. Divergent interpretation occurs when independent paths instead produce genuinely different conclusions (I_1≠I_2) about what should be the same concept -- rather than treating this as an error requiring forced reconciliation, it is reframed as a potential signal of a previously hidden bounded-context boundary (a 'concept collision': SameTerm+DifferentMeaning), turning apparent inconsistency into a DDD boundary-discovery mechanism"
