about: >
  The actual D285-6 artifact, status "OUTCOME B — LOSSY SEMANTIC PROJECTION," restated under the HPA equality
  mandate. Property: `(𝒜,ℛ)=_semantic π_K(K_t)` after unpacking `Assertion` and modulo a declared drop.

  **§3 delivers the complete six-model verdict table for the first time**: Model A (`K_t=(𝒜,ℛ,Σ,…)` complete)
  REFUTED (ratified `K_t` contains Action/Event/Policy, verification lane excludes them); Model B
  (`K_t=(𝒜,ℛ)`) REFUTED (FA-4 states 8 primitives, not 2); **Model C (`(𝒜,ℛ)=π_K(K_t)`) HOLDS, qualified**
  (every verification-only item is a field of an assertion, not a new primitive); Model D
  (`K_t=π_knowledge(S_t)`) holds, compatible with C, reverses the vantage; Model E
  (`S_t=(K_t,E_t,H_t,G_t,Q_t)`) holds, compatible with C, "names the complement"; Model F (separate products)
  REFUTED (Relation and Proposition shared). **Delivers the full primitive-by-primitive projection mapping**:
  Proposition/Entity/Relation/State map directly; **Observation maps only "after Qualify"**; Event/Policy/
  Action are DROPPED, declared external.

  **§4 delivers the two load-bearing qualifications in their canonical form**: (a) `π_K` is DEFINABLE and NOT
  COMPUTABLE because `Qualify:Observation×Policy→Evidence` "has no body in the corpus (one undefined hit,
  Step 170)," `G1`, irreducible; (b) the observation layer is NOT missing (Sañjaya recovery, already tracked)
  — "the structural gap is closed; only the function body remains."

  **§5 delivers the full three-way equality test with the specific query-class breakdown**: structural FALSE
  (`Assertion` is not a ratified primitive); semantic TRUE (only after unpacking Assertion, modulo the
  declared drop); observational FALSE, with the EXACT four-item split named: answerable under `(𝒜,ℛ)`
  (`member`, `contradicts`, `supersede`, `lineage`) vs NOT answerable (`replay`, `policy-eval`,
  `authorize`) -- "`=_observational` failing IS what 'lossy' means... three primitives and three query classes
  are lost, by design."

  **§5b restates, in its canonical source location, the already-tracked four-line scope resolution** (files
  0999, 1003, 1005): semantic state projection ESTABLISHED / operational equivalence NOT ESTABLISHED /
  observational equivalence REFUTED / computable projection BLOCKED.

  **§7 DELIVERS A GENUINELY IMPORTANT CLARIFYING DISTINCTION, DIRECTLY COMPLEMENTING FILE 1005'S D288-SCOPE
  FINDING**: "Blocker 1 needs governance? NO — it needs `Qualify`. Mathematical evidence discriminates; no
  normative choice is required." This explicitly confirms `Qualify`'s status is categorically different from
  the equality-relation blockers (semantic/observational/provenance-sensitive equality), which file 1005
  showed ARE normative (require a human governance act, Decision 3). D285-6 itself thus anticipates and is
  fully consistent with D288-scope's later three-normative/one-irreducible finding.
