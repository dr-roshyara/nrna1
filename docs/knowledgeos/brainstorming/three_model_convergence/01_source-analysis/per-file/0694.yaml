defines:
  - concept: "VectorStore≠KnowledgeModel"
    definition: "The existence of a vector database or embedding index within a system does not, by itself, constitute that system's authoritative semantic knowledge model; a vector store answers questions of semantic similarity, while a genuine knowledge model must additionally represent meaning, support, ownership, and authority"
  - concept: "Confidence=f(EvidenceDepth,EvidenceIndependence,EvidenceFreshness)"
    definition: "Confidence in a reconstruction claim about an architectural capability's existence must be derived from properties of the supporting evidence (how deep the evidence chain runs, how independent its sources are, how fresh/current it is) — never from an AI model's self-reported confidence score, which is not itself evidence"
  - concept: "Architectural mythology"
    definition: "The accumulated, often-repeated informal belief within a long-running project that a capability 'already exists,' which on investigation may actually correspond to a design intention, a prototype, a partial implementation, a once-implemented-but-since-removed mechanism, or a purely manual process — requiring explicit re-verification against actual artifacts rather than being taken at institutional face value"
