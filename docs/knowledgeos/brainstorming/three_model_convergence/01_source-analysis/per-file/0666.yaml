defines:
  - concept: "No observation→No justified claim"
    definition: "If the current observation mechanism cannot distinguish states that differ on a property Q, KnowledgeOS may only claim 'no violation was found in the observed evidence,' never the stronger 'no violation exists' — absence of detected failure is not evidence of correctness"
  - concept: "DecisionRelevantObservability"
    definition: "Full state observability is not the correct practical target; observability investment should specifically target uncertainties capable of changing a governed decision (D(S_1)≠D(S_2)); uncertainty in state dimensions that do not affect any decision is architecturally irrelevant"
  - concept: "ComplianceUndetermined / three-to-four-valued governance logic"
    definition: "When a required observation for a governance rule is unavailable, the correct compliance status is Unknown, not an implicit default to Compliant; governance status should be represented across (at minimum) Compliant, NonCompliant, and Unknown, with NotApplicable as a further distinct state for rules that do not apply to a given component — never collapsed into null or false"
  - concept: "ObservabilityDebt"
    definition: "A gap between the governance properties an organization wishes to enforce and the observations currently available to verify them; extends the corpus's epistemic/complexity-debt family (0625) into the observability dimension, motivating a concrete engineering roadmap (ObservationRequirement items) to close the gap"
