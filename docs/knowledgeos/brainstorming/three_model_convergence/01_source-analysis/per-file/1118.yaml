about: >
  `00-INDEX.md` — "Step 285+286 — Research Output Index." The master chronological ledger for the entire
  `research/` directory, structured as 43 numbered "headlines," each summarizing one incremental artifact or
  batch. Confirms, headline-by-headline, this reconstruction's entire already-tracked equality/kernel research
  arc (files 1010-1117, spanning Steps 285-291 and the full Gītā/Cavell philosophical-source programme through
  headline 33/document 28's track closure) in exact, cross-checkable summary form -- no discrepancies found
  against this reconstruction's own per-file records.

  **DELIVERS PREVIEW CONTENT FOR HEADLINES 34-41, CONFIRMING (WITHOUT CONTRADICTING) THIS RECONSTRUCTION'S
  ALREADY-DIRECTLY-READ FILES 1107-1116**: the step-number-collision root cause (`G-101`, already-tracked
  file 1107); the eight-primitives convergence (already-tracked file 1109); the vocabulary/operator-contract
  six-collision table (already-tracked file 1108); "THE LANE TURNS" absorption resolution (already-tracked
  file 1110); the live adjudication and four-way status split (already-tracked file 1111); the unschedulable
  OPERATIONS programme (already-tracked file 1112); the missingness-defect candidate carrier (already-tracked
  file 1114, "the most significant candidate the Gītā track has produced"); and the probability-space
  re-raising (already-tracked file 1115).

  **DELIVERS TWO GENUINELY NEW HEADLINES (42-43) NOT YET DIRECTLY READ AS PRIMARY DOCUMENTS IN THIS
  RECONSTRUCTION'S SEQUENCE**: **Headline 42 ("MD-006")** reports an INDEPENDENT arrival at the already-
  tracked file-1092 Audit-A central finding ("what is missing is not an enumeration but a MANDATORY-
  MEMBERSHIP RULE"), reached by an entirely different method: ordinary SEQUENTIAL CORPUS READING (not graph
  analysis) of only 16 per-file records against a 2,321-file manifest ("≈0.7% executed"). Delivers the boxed
  finding "`Kernel_engineering ≠ Kernel_epistemic`" (`C20`): distinguishes a PORTABILITY kernel (`EKS→PKS→
  KnowledgeOS_engineering`) from an EPISTEMIC kernel (`Knowledge→K_t→Kernel→Buddhi→Operators`), with the
  genuinely valuable addition that "'portability... vs epistemic necessity... these are different
  MINIMALITY TESTS and may select DIFFERENT SETS'" -- delivering a plausible partial EXPLANATION for why
  `𝒪`'s membership rule has proven so hard to state: "kernel" itself may carry TWO minimality criteria at
  once, adding a new glyph-collision instance at the corpus's own central term (`G-108`). Explicitly self-
  scoped as a beginning, not a result: "`MD-006` is `[HP]`," honestly stating its own tiny sample size.

  **HEADLINE 43 ("THE LAYERED MODEL")** reports a new, non-Gītā mathematical-literature review (Kallenberg,
  Shum, Dretske, Cover & Thomas, Audi, Plato/White, Davidson, Dynamic Epistemic Logic, Bayesian Epistemology
  -- 25 files) delivering two genuinely important findings: (1) TWO STRONG NEGATIVE CONVERGENCES across three
  independently-layered models (KnowledgeOS, Dretske information-flow, Kallenberg probability), all
  unanimously confirming the already-tracked 2026-08-25 refutations ("probability IS knowledge itself" --
  No/No/No; "one scalar probability defines knowledge" -- No/No/No), explicitly characterized as "the
  STRONGEST EVIDENCE CLASS available here" (negative convergence across independent traditions); (2) a new
  layered pipeline `X→Y_t→E_t→ℱ_t→Π_t→K_t` that structurally instantiates two of this reconstruction's own
  already-tracked recent corrections (the already-tracked file-1116 filtration/state correction, now
  structural rather than merely stated; the already-tracked file-1115 structured-epistemic-object correction,
  `Π_t` as one component not the whole) -- and gives the already-tracked recovered-but-unpositioned
  `Determination` object (file 1103) an actual POSITION in the pipeline (`K_t→Zero→Determination→Decision→
  Authorization→Action`) for the first time, still explicitly "re-raised, not re-instated."

  **DELIVERS A GENUINELY IMPORTANT NEW GAP, `G-109`, A SECOND UNDEFINED TRANSFORMATION**: `Φ:Π_t→K_t`,
  "UNDEFINED." Boxed: "The pipeline now has TWO undefined transformations: `Qualify` at `Y_t→E_t` (`G1`) and
  `Φ` at `Π_t→K_t`." Delivers the precise significance: "`Φ` sits EXACTLY where probability would become
  knowledge -- the step all THREE MODELS JOINTLY DENY is automatic. If 'probability is not knowledge' holds,
  something non-trivial must carry `Π_t` to `K_t`, and NOTHING NAMES IT." Explicitly disciplined against
  conflating this with the already-tracked `G1`/`Qualify` gap: "different carriers, different positions.
  (Five such merges refused now.)"

  **DELIVERS A REFINEMENT OF THE ALREADY-TRACKED FILE-1112 `M-Q8` FINDING**: "`258.21` gives RELEVANCE, not
  ATOMICITY or INDEPENDENCE. A property can be relevant while being decomposable." Precisely diagnoses that
  the already-tracked `258.21`-based dimension-membership routing (file 1112's `D-Q3`) is "necessary, not
  sufficient."

  **DISCOVERS A FOURTEENTH GLYPH COLLISION, `G-110`, WITH THE SAME `Π`/PROVENANCE GLYPH THE ALREADY-TRACKED
  FILE-1108 `G-102` COLLISION ALREADY FLAGGED AS "THE DANGEROUS ONE"**: `Π` now carries THREE distinct
  meanings across the estate -- provenance (`id=H(P,e,c,t,Π)`, `Lineage`, already-tracked Decision 3);
  Policy (already-tracked `G-102`); and, newly, "probabilistic representation" (this new layered model).
  Boxed: "Fourteenth collision -- and ONE READING CARRIES THE PROGRAMME'S CENTRAL NORMATIVE QUESTION." This
  directly extends and sharpens the already-tracked file-1108 warning about `Π`'s danger, now confirming a
  third independent source has minted yet another meaning for the exact same glyph.

  Delivers `C20` (`Kernel_engineering≠Kernel_epistemic`) and `C21` (`ℱ_t≠Π_t≠K_t`). Confirms the disciplined
  self-scoping throughout: "'I would not say we have filled it completely'... '`K_t` is still not formally
  solved -- I would NOT declare victory.'" Explicitly flags that "21 of the 25 new files are read by heading
  only" -- unexamined, with the already-tracked file-1096 warning that direct reading tends to move items to
  T0.
