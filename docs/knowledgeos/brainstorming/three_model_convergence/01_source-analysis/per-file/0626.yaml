defines:
  - concept: "Evidence should be immutable; interpretations may evolve"
    definition: "A piece of evidence E is never mutated once recorded; its interpretation under a given model (Interpret(E,M)) can change over time as models are revised, with every historical interpretation remaining traceable and distinguishable from the immutable evidence itself"
  - concept: "The eight-type drift taxonomy"
    definition: "Distribution drift (P_t(X)≠P_{t+1}(X)), Conditional drift (P_t(Y|X)≠P_{t+1}(Y|X)), Label drift (P_t(Y)≠P_{t+1}(Y)), Structural drift (a causal edge ceasing to hold), Parameter drift (edge strength changing), Semantic drift (concept meaning shifting), Governance drift (policy changing), and Architectural drift (the engineering architecture itself changing) — each requiring a distinct detection and response strategy"
  - concept: "SuccessfulOutcome≠GoodDecision"
    definition: "A decision's quality must be assessed from the information, reasoning, and policy compliance available at decision time, not from its eventual outcome — a well-justified decision can have an unlucky bad outcome, and a poorly-reasoned decision can have a lucky good one"
  - concept: "AI/Learning≠GovernanceAuthority (LearningContext boundary)"
    definition: "A dedicated LearningContext bounded context may evaluate outcomes, detect drift, update models, and propose revisions, but may never silently mutate governance policy or domain facts — it can only propose a PolicyChangeCandidate for GovernanceContext's own authorization"
  - concept: "Reproducibility via Traceability rather than determinism"
    definition: "For stochastic AI-based decision engines, exact byte-for-byte reproducibility is not required; instead, the system must be able to explain which knowledge, model, policy, and evidence state were available at decision time (ModelVersion, PromptVersion, ToolVersions, EvidenceSnapshot)"
