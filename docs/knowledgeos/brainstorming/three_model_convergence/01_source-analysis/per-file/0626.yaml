  - concept: "World time formally separated from Knowledge time (t_world vs. t_knowledge), yielding Learning latency and a non-age-based Knowledge freshness formula"
  - concept: "The corpus's most complete drift taxonomy to date — eight explicitly distinguished types (Distribution/Conditional/Label/Structural/Parameter/Semantic/Governance/Architectural), each requiring a different response"
  - concept: "Hindsight-bias prevention via strict Ex-ante/Ex-post separation, with SuccessfulOutcome≠GoodDecision as a crucial learning safeguard"
  - concept: "Catastrophic Forgetting explicitly named as continual learning's central risk, guarded against via a formal ModelLearning/KnowledgeHistory separation"
  - concept: "A new LearningContext DDD bounded context explicitly and formally subordinated to GovernanceContext — AI/Learning≠GovernanceAuthority, directly extending 0623's AI-agent-boundary principle into the learning/policy domain"
