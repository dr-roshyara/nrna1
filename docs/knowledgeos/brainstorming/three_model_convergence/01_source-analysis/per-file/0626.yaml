    refinement: "Directly reapplied to drift detection specifically: StatisticalDrift≠OperationallyMaterialDrift, extending the same statistical-literacy discipline into the concept-drift domain"
  - concept: "0624's (Step 43) Calibration≠CausalValidity discussion"
