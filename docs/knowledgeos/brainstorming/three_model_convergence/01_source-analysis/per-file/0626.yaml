    refinement: "Directly extended into the learning-specific case: a learning feedback loop can efficiently amplify an incorrect model, explicitly framed as the central problem motivating the newly opened Step 46"
  - concept: "0623's (Step 42) AI-agent boundary principle (AI may propose; the governed system decides)"
    refinement: "Directly and explicitly extended into the learning/policy domain via the new LearningContext/GovernanceContext boundary — Learning may only propose a PolicyChangeCandidate, never mutate policy directly"
