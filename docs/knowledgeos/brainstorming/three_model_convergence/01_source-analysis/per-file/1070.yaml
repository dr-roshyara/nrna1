about: >
  "06 — Declaration vs Derivation Fork (mandate §7)." Directly elaborates the already-tracked Step-289
  distinction (file 1052) between resolving `≡_K` via a DECLARATION route (a governance act) versus a
  DERIVATION route (requiring congruence, which needs `𝒯`/`δ` first) into a full, disciplined two-branch
  audit with precise consequences for each.

  **BRANCH A — `≡` NORMATIVELY DECLARED**: would establish a usable `≡` (making `δ`'s postconditions
  statable), break cycles Z-2 and Z-4 (already-tracked, file 1069), conditionally unblock the 8 derivable
  prerequisites (already-tracked, file 1052), and make "N-1′" moot. **Would NOT establish**: that the
  declared `≡` is a CONGRUENCE ("`258.9` must still be tested, and a declaration cannot make it true"),
  decidability (`012 §35`: "No authority can ratify decidability into existence"), resolution of `𝒪_K`
  (still open), minimality (`259` forbids the proof before congruence analysis), or the representation block
  (`261.23` conditions 4-5 untouched). Delivers the sharpest limit as a boxed claim: "declaring `≡` and then
  DISCOVERING it is not a congruence would mean `258.9`'s own verdict applies -- '`≡_K` is too coarse' --
  i.e. THE DECLARATION WOULD BE FALSIFIED BY THE VERY TEST IT WAS MEANT TO UNBLOCK. Declaration is not
  self-validating."

  **BRANCH B — `≡` MUST BE DERIVED**: names each blocking missing construct precisely -- `𝒯` (no congruence
  test or selection criterion without it), `δ` (congruence is a property OF `δ`; commit case
  unspecifiable), `𝒪_K` (the only candidates for `≡` are defined over it), and a minimality proof (`259`
  forbids it before congruence analysis). Boxed: "Branch B is blocked on `𝒯`, `δ`, `𝒪_K` -- i.e. on `N-4`."

  **CONFIRMS THE CORPUS CLOSES NEITHER BRANCH**: cites `261.21` (offers a candidate, declines to ratify --
  already tracked), `258.37` ("we still do not have the final `=_X` or `≡_K`" -- already tracked, file
  1067), `259` (blocks the derivation route on `𝒯`), and `261.23` ("selection must stop while equality
  remains ambiguous" -- states the block, does not resolve it). "No branch is selected."

  **DELIVERS A GENUINELY INTERESTING STRUCTURAL OBSERVATION ABOUT THE FORK'S OWN ASYMMETRY**: "Branch A is
  AVAILABLE NOW and NOT SELF-VALIDATING; Branch B is UNAVAILABLE NOW and WOULD BE SELF-VALIDATING. That
  asymmetry is a FACT ABOUT THE FORK, not an argument for either side" -- a disciplined refusal to let a
  structural observation slide into an implicit recommendation.

  Confirms the STATUS block: ESTABLISHED both branches' consequences, the corpus does not close the fork,
  Branch B is blocked on `N-4`, a declaration cannot establish congruence or decidability · BOUNDED exactly
  two branches · NORMATIVE the choice · DEFERRED, no branch selected.
