defines:
  - concept: "The five-gate control architecture (G1-G5)"
    definition: "G1 Knowledge Gate (is the agent operating from authoritative/current knowledge?), G2 Classification Gate (is the change correctly classified?), G3 Authorization Gate (is the actor authorized?), G4 Assurance Gate (does deterministic verification pass where required?), G5 Closure Gate (has the result been verified and recorded?) — five sequential control points a governed engineering change must pass through, each capable of independently blocking progress"
  - concept: "GovernedEngineeringFact (the central object)"
    definition: "The true fundamental semantic unit of KnowledgeOS is not a document but a GovernedEngineeringFact — an object with identity, provenance, authority, validity, evidence, relationships, and lifecycle; documents (Markdown, ADRs, diagrams, dashboards, agent context, API responses, reports) are merely projections/representations of these underlying facts, never the facts themselves"
  - concept: "The M0-M6 operating-model maturity ladder"
    definition: "M0 Documents; M1 Indexed Knowledge (searchable); M2 Governed Knowledge (authority/lifecycle modeled); M3 Evidence-linked Knowledge (connected to implementation/evidence); M4 Agent-operable Knowledge (agents consume governed context, produce traceable actions); M5 Closed-loop Knowledge (runtime feeds back into governance); M6 Self-assuring KnowledgeOS (verifies its own constitutional conformance) — a seven-stage maturity model with M6 as the explicit ultimate target, never assumed to be the current state"
