about: >
  Formalizes the Zero Lens as the foundational first lens of the 0238/0239 dhatu-extraction methodology:
  "remove as much prior structure as possible and ask what can be recovered from the source/data alone."
  Explicitly positions Zero before Ganesha/Leonardo/Krishna/Panini/Topology/Shani in that local six-lens
  framework's sequence. Central discipline: Zero Lens observes, does not explain; used as an explicit
  anti-confirmation-bias mechanism against circularly training a model to rediscover an assumption
  secretly encoded into the labeled data.
introduces:
  - concept: "Zero Lens core question: if we assume nothing about what the structure is supposed to be, what structure can we actually observe? (What survives when labels, theories, interpretations, and predefined categories are removed?)"
  - concept: "Five-stage discovery hierarchy: Stage 0 Zero (raw characters) -> Stage 1 Statistical (frequencies/co-occurrences/n-grams/transition-probabilities/mutual-information/entropy) -> Stage 2 Unsupervised ML (clustering/PCA/UMAP/spectral/latent-variable) -> Stage 3 Linguistic structure (aksara/matra/morpheme/dhatu) -> Stage 4 Paninian rules (formal transformation) -> Stage 5 Semantic inference (meaning)"
  - concept: "Anti-confirmation-bias experimental design: train unsupervised discovery on zero-labeled data first, THEN compare the independently-discovered latent structure against traditional dhatu theory as a test of the theory's explanatory power, rather than training with the theory's labels baked in ('confirmation by construction')"
  - concept: "Panini reframed as a testable hypothesis, not an unquestioned ontology: how much of the observed (Zero-discovered) transformation structure do traditional Paninian rules explain, and where does observed data violate or extend the assumed rule system?"
  - concept: "Zero applied to the earlier Expression!=Meaning principle: before assuming meaning, determine what is actually observable in the expression (characters/positions/repetitions/transitions/co-occurrences/transformations) -- prevents circular reasoning from expression straight to meaning"
  - concept: "Complete seven-lens sequence with Zero first: Zero(observe)->Ganesha(define)->Leonardo(discover alternatives)->Krishna(understand why)->Panini(model transformations)->Topology(analyse structure)->Shani(establish invariants)"
