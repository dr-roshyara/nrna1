  - concept: "VOI(I)=ExpectedDecisionImprovement-Cost(I)"
    definition: "The value of acquiring additional information equals the expected improvement to decision quality it would produce, minus its acquisition cost; information should be sought only when VOI>0"
  - concept: "BudgetExhausted⇏Verified"
    definition: "When a verification budget is exhausted before the required assurance threshold is reached, the correct epistemic state is VerificationIncomplete/InsufficientAssurance, never Verified — resource exhaustion must not be silently converted into a positive verification result"
  - concept: "HardConstraint vs OptimizationObjective"
    definition: "Some architectural conditions (security, privacy, authority, mandatory semantic invariants) are hard constraints that optimization must never trade away for cost, latency, or convenience; optimization operates strictly within the feasible region defined by satisfying all hard invariants — max f(x) subject to I_1(x)∧...∧I_n(x)"
  - concept: "DecisionEvidenceContract"
    definition: "The architecturally required object for auditable decisions is Evidence+Sources+DecisionBasis+Verification; this does not require retaining unrestricted raw internal model reasoning traces as a system dependency, giving the platform a formal boundary decoupling auditability from internal-state capture"
