about: >
  A self-contained session-handover package (prompt instructions + Knowledge Transfer Document) for
  continuing the Elements of Statistical Learning extraction (0228/0231) in a fresh session, since "this
  session has become too long." A second, more formal instance of the extraction-protocol pattern first
  seen at 0191 (Research Extraction Agent prompt). Formalizes the source-discipline four-category
  classification (SOURCE FACT / SOURCE INTERPRETATION / KNOWLEDGEOS TRANSFER / ARCHITECTURAL HYPOTHESIS),
  nine analysis lenses, a 20-point per-method analysis structure, and an explicit stop condition
  (do not proceed from book analysis to architecture redesign without a separate assignment). Largely
  consolidates and re-presents content already recorded from 0228/0231 (EP-01..16 catalogue, epistemic
  hierarchy, critical distinctions) rather than introducing substantial new domain content, but adds a
  formal eight-principle candidate set (P-01..P-08) distinct from the EP-numbered techniques.
introduces:
  - concept: "Four-category source-discipline classification: [SOURCE FACT] / [SOURCE INTERPRETATION] / [KNOWLEDGEOS TRANSFER] / [ARCHITECTURAL HYPOTHESIS], explicitly must not be conflated -- a second formal instance of this extraction discipline (cf. 0191's similar but differently-worded ladder)"
  - concept: "Nine-lens extraction protocol: DDD, Zero, Leonardo, Epistemic/Knowledge, Evidence & Provenance, Deterministic Assurance, Governance/Sovereignty, Architecture, AI Engineering/Agent -- each with a defined question set"
  - concept: "Twenty-point per-method analysis template (source location/category, what the book says, problem solved, mechanism, assumptions, strengths, weaknesses, failure modes, assessment mechanism, nine lens applications, KnowledgeOS transfer, transfer risk, and a five-way recommendation: ADOPT/ADAPT/INVESTIGATE/RECORD ONLY/REJECT -- a five-way scheme distinct from 0228's four-way ADOPT/ADAPT/REJECT/UNKNOWN and this file's own later five-way ADOPT/ADAPT/INVESTIGATE/RECORD-ONLY/REJECT)"
  - concept: "Eight formal candidate principles P-01..P-08 (Constituted Inference, Evidence Separation, Complexity Control, Sufficient Evidence, Stability Matters, Method Is Not Authority, Derived Structures Remain Derived, Simpler When Equivalent) -- explicitly NOT yet constitutional, held as research candidates"
  - concept: "Thirteen critical KnowledgeOS distinctions consolidated into one list (Observation!=Representation, Evidence!=Inference, Inference!=Prediction, Prediction!=Fact, Pattern!=Domain-Truth, Similarity!=Identity, Correlation!=Causation, Model-Agreement!=Truth, Confidence!=Assurance, Statistical-Significance!=Practical-Significance, Derived-Structure!=Canonical-Knowledge, Algorithm!=Domain-Capability, Method!=Authority)"
  - concept: "Explicit output order (11 parts: Executive Synthesis / Source Facts / Concept Extraction / DDD Analysis / Lens Analysis / Transferability Matrix / Candidate Principles / Candidate Methods / What NOT to Import / Open Questions / Knowledge Transfer Package) and a 12-item self-check quality test before concluding"
  - concept: "Handover principle stated as the single most important cross-session instruction: 'Extract first. Interpret second. Transfer third. Architect last.'"
