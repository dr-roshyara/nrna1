defines:
  - concept: "Version≠Validity"
    definition: "Version answers 'which representation of a claim is this?'; Validity answers 'during what domain time period does this claim's content actually apply?' -- a claim can have a fixed version while its validFrom/validTo window is entirely independent of when it was recorded"
  - concept: "'Evidence has many consumers'"
    definition: "A single Observation or piece of Evidence may support one Determination while simultaneously contradicting another; evidence must therefore be modeled as an independently referenceable object, never embedded inside or owned by any single Determination aggregate"
  - concept: "'The most important aggregate rule'"
    definition: "A database transaction should protect exactly one invariant boundary (e.g. creating an Inquiry, or finalizing a Determination, or making a Decision) -- never the entire multi-stage lifecycle (Inquiry→Evidence→Determination→Decision→Action) as one transaction, which would destroy the bounded-context model; the full lifecycle is instead a Long-Running Domain Process coordinated by a process manager/saga"
  - concept: "Process State≠Domain Truth"
    definition: "A process manager or saga tracks what should happen next in a long-running workflow, but must never become the authoritative source of what is true -- knowledge, evidence, determination, decision and authority remain owned by their respective bounded contexts, and the process manager can recover from interruption without ever becoming a knowledge source itself"
  - concept: "AGENTS.md≠KnowledgeOS"
    definition: "An agent-instruction file (AGENTS.md, or equivalent .claude/.codex configuration) may point an AI agent toward KnowledgeOS as the source of applicable architecture, but must never itself reproduce or duplicate that architecture -- agent configuration directories hold operating mechanics, never competing knowledge stores"
  - concept: "'The dangerous words'"
    definition: "Certain common words (Fact, Answer, User, Confidence, Approved) are architecturally ambiguous enough that they should be banned from unqualified use in specifications -- each must be replaced by a more precise term (e.g. Claim/Observation/Verified proposition instead of 'Fact'; Governance approval/Technical verification/Operational authorization instead of 'Approved') that names exactly which semantic dimension is meant"
  - concept: "Typed predicates (replacing overloaded status fields)"
    definition: "Instead of one generic status field like status=APPROVED, use distinct typed predicates for each semantic dimension -- e.g. GovernanceApproved(x,t,s,a), TechnicallyVerified(x,m,e,t), Authorized(a,s,t,r) -- so that an object can coherently be governance-approved while not technically verified, without producing a logical contradiction in a single overloaded field"
