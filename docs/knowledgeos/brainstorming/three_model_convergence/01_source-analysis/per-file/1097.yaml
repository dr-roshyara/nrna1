about: >
  "18 — Gītā Candidates for KnowledgeOS and for the Kernel," verdict "≈60 correspondences · 24 survive to a
  KnowledgeOS tier · 2 reach the KERNEL — and BOTH are corpus-native corroborations, not Gītā contributions.
  0 new primitives. 0 new canonical relations." The predecessor and evidentiary substrate for the already-
  tracked file-1096 completion (which discovers the major lane conflict G-85), later explicitly annotated
  live at §13 with a cross-reference to that completion.

  **DELIVERS THE FULL FIVE-TIER METHODOLOGY** (T0 REFUTED/`RX`, T1 correspondence-only, T2 typed-not-
  promoted, T3 KnowledgeOS-candidate-explicitly-not-kernel, T4 KERNEL-candidate), with a fifth explicit test
  question ("is this a KERNEL candidate, or a KnowledgeOS candidate that is NOT kernel?") added to the
  already-tracked standing promotion chain (`REFINED-STEP-286`).

  **DELIVERS THE FULL DETAIL OF THE TWO T4 KERNEL CANDIDATES (already-tracked at summary level, file 1096)**:
  `K1` -- Kṣetra/Kṣetrajña (field vs field-knower, Ch 13) corroborating the already-existing `𝒩∉K` (the knower
  is not inside the state), `R5`, `FA-4 grade [E]`, flagged "the only concept with the same Sanskrit lineage
  on both sides"; `K2` -- Sañjaya (the one who sees and reports, Ch 1) corroborating the already-existing `Ω`
  observation layer (`W --Ω--> O`, `Sañjaya_K` six values, corpus-native 2026-08-26). Both explicitly framed
  as corroborations, not derivations: "corroboration by an independent tradition is worth more than
  derivation from it -- but it is NOT A CONTRIBUTION TO THE KERNEL'S CONTENT."

  **DELIVERS A GENUINELY IMPORTANT EXPLICIT REFUSAL OF A T4-SHAPED OVERCLAIM**: `external_research` Ch 13's
  `K_t=Relationship(𝓕,A_t)` ("knowledge is the relationship between field and knower") is precisely
  distinguished from the ratified `𝒩∉K`: "the first is a SEPARATION; the second is a CONSTITUTIVE
  ARCHITECTURE CLAIM. The second is not ratified, not derived, and would SETTLE `K`'s COMPOSITION -- the
  very question Steps 285-291 hold open. T0. REFUSED." This is a precise, named instance of exactly the kind
  of overclaim file 1096's lane-conflict discovery (G-85) later generalizes.

  **DELIVERS THE FULL T3 (8 items, N1-N8) AND T2 (5 items, P1-P5) CANDIDATE TABLES**, most already-tracked at
  summary level but newly detailed: `N1` Karma≠Karma-phala↔already-tracked `Command≠Transformation`
  (`256.21`, `R6`); `N2` Vairāgya↔`Admissible` having no outcome-dependent conjunct, invariant `I-V`, flagged
  "the one invariant TESTABLE TODAY"; `N3` Sārathi↔already-tracked `Guidance≠Authority` (AP-1), flagged
  "implemented, 132/132 `humanActRef`... rare"; `N4` Buddhi↔assessment stages, `R4`, "four stages, not
  five: `Knowledge` is not a ratified primitive"; `N8` Dhyāna↔already-tracked `H-G6-1` epistemic drift,
  blocked on `δ←𝒯←𝒪`. `P1` Guṇa (needs a scale type, already tracked); `P2` Jñāna/Vijñāna (already-tracked
  `Qualify`=`G1`, and explicitly: importing conformal prediction/bootstrap to fill it is "INADMISSIBLE" per
  already-tracked file-17's mathematical audit); `P3` Māyā/Avidyā -- newly precisely identified as
  "specifically MNAR" (missing-not-at-random), connected to the already-tracked `A6`/`G-60` carrier defect.

  **DELIVERS THE LARGE T1/T0 CORRESPONDENCE TABLE WITH SEVERAL STRIKING SPECIFIC REFUTATIONS**: `Ātman=
  𝒦_ātma` T0 (already-tracked GK-Q1 territory); `Kṛṣṇa=𝒦_supreme` T0 ("the arrow is inspiration, never
  identity"); `Paramātmā=𝒦` T0; `Mokṣa=DR=1`/"infinite knowledge" T0, REFUTED by Ch 6 as too simplistic;
  **`Nirvāṇa="complete epistemic closure"` T0, with a genuinely sharp catch**: "'closure' is precisely the
  word Steps 288-291 established must NEVER BE USED UNQUALIFIED. The mapping IMPORTS A BANNED TERM" --
  directly connecting the already-tracked disciplined "closed" terminology restriction (files 1079, 1092's
  Audit A nine-sense taxonomy) to a fresh philosophical-lane instance; Sattva/Rajas/Tamas=`Σ∈{3 values}` T0,
  "flattens `Σ`'s FIVE axes (2240 states) into THREE values... the same flattening defect recorded twice
  already"; `Θ_total` five-operator algebra T0, "type-check failure across four carriers."

  **DELIVERS SIX NEGATIVE CONSTRAINTS (`C1`-`C6`), EXPLICITLY FRAMED AS THE GĪTĀ'S GENUINE YIELD**: `C1`
  Knower≠Knowledge≠Knowledge-Space (already tracked, "kills three identity mappings at once"); `C2` the
  kernel is a mind-like functional ANALOGY, not an identity; `C3` Mokṣa≠infinite knowledge; `C4` knowledge
  REVEALS rather than CREATES → obscured≠false≠absent, "= MNAR" (already-tracked as `H-G5-2`'s convergence,
  file 1095); `C5` action decomposes (already-tracked `H-290-1`, orthogonal to the `𝒪` blocker); `C6` `Guṇa`
  needs a scale before opening. Boxed: "The Gītā's STRONGEST CONTRIBUTION TO THE KERNEL IS A SET OF
  REFUSALS, NOT A SET OF OBJECTS."

  **DELIVERS THE "STRUCTURAL MATCH, REAL AND UNUSABLE" TABLE**: Kṣetra↔Ω(sample space), Kṣetrajña↔𝒩↔ℱ
  (sub-σ-algebra), Jñāna↔K_t↔"needs P" -- the match blocked because "`(Ω,𝓕,P)` DOES NOT EXIST in this
  theory" (already-tracked `G-22`/`MT-1`), with `0 of 5 Σ axes` ordered.

  **DELIVERS THE SYSTEMATIC EXPLANATORY CLOSING VERDICT**: "A kernel needs a membership rule, decision
  procedures, types and signatures, carriers. The Gītā supplies narrative/normative guidance, directions of
  practice, roles, distinctions." Boxed: "The Gītā is rich in DISTINCTIONS and empty of CARRIERS. A kernel is
  made of carriers. That is the whole explanation." Confirms this predicts the observed pattern exactly: both
  T4 hits are separations, all real contributions are refusals, every object-promotion attempt is refuted on
  type-checking.
