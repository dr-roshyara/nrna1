about: >
  "02 — Observation Inventory (mandate §6)." Assembles the strongest corpus-supported inventory of ten
  candidate observations (`TraceOrigin(x)`, `ExplainRevision(x)`, `Assess(K,x)`, `Authorize(...)`,
  `Compare(P_1,P_2,C,Ω)`, `orphan`, `circular_dependency`, `Lineage`, the five `Σ`-axis readings already-
  tracked as `≈_X`'s components (file 1068), and `deg_ℛ`/graph queries across `G_I`/`G_K`/`G_P`), each scored
  for locus, kind, typing, and evidence of permitted-observation status. Reconfirms the already-tracked case-
  C/schema-at-E classification (files 1076/1079) with the disciplined why-not-A/B/D reasoning restated.

  **DELIVERS THE SHARPEST, MOST CONCRETE SINGLE FINDING OF THE ENTIRE `𝒪_K`-CLOSURE RESEARCH ARC (files
  1052, 1063-1080)**: "The strongest single fact in this inventory: the two observations the corpus actually
  USES TO DO WORK -- `TraceOrigin` AND `ExplainRevision` -- appear ONLY as counterexample devices in
  `258.15`/`258.16`. THEY ARE UNTYPED, UNREGISTERED, AND LOAD-BEARING. They are what make Decision 3's
  technical half DECIDABLE IN PRINCIPLE (`258.31`), and they are NOT IN ANY REGISTRY." Boxed capstone: "THE
  OBSERVATION UNIVERSE IS NOT MERELY UNCLOSED. ITS TWO WORKING MEMBERS ARE UNREGISTERED." This is a genuinely
  striking result that sharpens every already-tracked abstract statement about `𝒪_K`'s openness (files 1052,
  1076, 1079) into a concrete, damning observation: the corpus's own arguments already DEPEND on specific
  observations to do real epistemic work, yet those exact observations have never been formally typed or
  entered into any registry.

  Confirms the STATUS block's quantified measurement: "0 of 10 [candidate observations] are declared
  PERMITTED by the corpus; 2 of 10 are load-bearing and unregistered." Closes with an honest open admission:
  "UNKNOWN whether kinds 2/3 [Assess, Authorize] count as observations" -- directly connecting to file 1078's
  already-tracked "equality-dependence wider than 𝒯" finding by leaving the observation-status of `Assess`/
  `Authorize` explicitly unresolved.
