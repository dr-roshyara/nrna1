    refinement: "DIRECTLY, RETROACTIVELY REFUTED (though not explicitly named) by this file's KnowledgeOS Independence Test, which would classify virtually every claimed Gita-derived KnowledgeOS principle as independently motivated (Test B = YES), meaning the Gita is at most a conceptual lens, never the claimed 'source code'"
  - concept: "Files 0943's and 0954's decorative 'Krishna=sup(Omega)' formulas"
    refinement: "EXPLICITLY, DIRECTLY CORRECTED: 'Krishna->Omega can only be a KnowledgeOS research abstraction, never a textual definition' -- this file draws exactly the distinction those two files' decorative formulas collapsed"
