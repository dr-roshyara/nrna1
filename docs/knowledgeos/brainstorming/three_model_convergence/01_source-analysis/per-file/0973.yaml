  - concept: "This reconstruction's entire tracked history of undefined, untyped Theta-operator compositions (files 0936, 0937, 0945, 0953, 0955, 0958, 0965-0967, 0971)"
    refinement: "DIRECTLY, EXPLICITLY SUPERSEDED by a rigorous fourteen-property specification requirement and an explicit type-checking rejection rule -- the most disciplined treatment of this recurring problem encountered anywhere in this reconstruction's tracking"
