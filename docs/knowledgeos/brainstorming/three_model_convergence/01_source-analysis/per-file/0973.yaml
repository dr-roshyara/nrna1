defines:
  - concept: "The KnowledgeOS Independence Test"
    definition: "For any proposed Gita-derived KnowledgeOS principle, ask: would this principle have been arrived at through ordinary software-engineering, epistemological, or architectural reasoning even without any reference to the Gita? If the answer is YES, the Gita may still serve as a useful conceptual lens or naming source for the principle, but it is explicitly NOT the foundation or origin of that principle -- the principle's actual justification lies elsewhere, and claiming the Gita as its source would misattribute genuine independent engineering/mathematical reasoning to a religious text. Only when the answer is genuinely NO or UNKNOWN does the Gita's contribution warrant being treated as load-bearing rather than merely illustrative"
