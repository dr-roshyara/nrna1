  - concept: "The foundational five-way separation Identity≠Provenance≠Lineage≠Causality≠Traceability, each formalized as its own distinct mathematical structure (typed graph or resolution function)"
  - concept: "EntityIdentity≠EntityState — an entity's stable identifier persists across attribute/version changes, preventing state changes from being mistaken for identity changes"
  - concept: "Source≠Provenance — provenance is the full derivation chain (extraction, interpretation, validation, commitment), of which the original source is only one link, not the whole"
  - concept: "Sequence≠Causality — an operational Decision→Action→Outcome sequence does not by itself establish that the decision or action caused the outcome; causal claims require separate causal evidence and semantics"
  - concept: "BasedOn≠Caused — provenance edges (what a decision was based on) and causal edges (what an action caused) are semantically distinct and must never be represented as an undifferentiated graph edge"
  - concept: "Three explicitly distinct graphs G_L (lineage) ≠ G_P (provenance) ≠ G_C (causal), unified architecturally into one typed epistemic graph rather than an untyped knowledge graph"
  - concept: "'No retrospective knowledge leakage' — reviewing a historical decision must use only the knowledge snapshot available at decision time, never silently substituting later knowledge, directly extending 0558's temporal non-contamination principle into decision lineage"
  - concept: "Decision vs. Execution deviation as an explicit, first-class representable divergence — what was decided and what was actually executed can differ, and the difference must be preserved"
  - concept: "Causal attribution formalized as an explicit epistemic claim with its own Candidate/Supported/Rejected lifecycle, never assumed automatically from a decision preceding an outcome"
  - concept: "Blast-radius analysis — Impact(A)=Reachable(A,E_depends) — a computable graph-based query for what depends on a given piece of knowledge, enabling provenance-aware re-evaluation when that knowledge changes"
  - concept: "Audit≠Provenance≠Traceability — three genuinely distinct capabilities that must not be conflated into one undifferentiated 'history' feature"
  - concept: "Integrity≠Truth and Authenticity≠Authority≠Truth and Authenticity≠Reliability — cryptographic tamper-evidence, authorial authenticity, organizational authority, and factual reliability are four genuinely distinct properties"
  - concept: "'No identity retroactive rewriting' — when entities later found to be the same were previously believed distinct, the historical distinct-belief state is preserved via an explicit IdentityResolutionEvent rather than silently erased"
  - concept: "Reconstructability named as KnowledgeOS's central differentiator from ordinary RAG systems — the ability to reconstruct not just what was known but why, under what semantics, under what rules, and what changed"
  - concept: "KnowledgeOS's headline architectural self-redefinition: 'a governed epistemic operating system for organizations', explicitly stated to supersede the earlier framing of 'an AI knowledge system' as now far too weak"
  - concept: "Twenty canonical Step-22 invariants across six labeled series (I/P/L/C/T/H) governing identity, provenance, lineage, causality, traceability, and historical integrity"
  - concept: "'Step 23 — Epistemic Sufficiency, Readiness, Completeness, and the Knowledge Boundary' opened as the corpus's next named research phase — flagged as a strong candidate for substantial overlap with the already-completed Step 13 (0553)"
