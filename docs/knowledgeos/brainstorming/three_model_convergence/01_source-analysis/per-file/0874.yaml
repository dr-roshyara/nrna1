    refinement: "DIRECTLY FULFILLED: the stress test provides a concrete, worked demonstration of exactly why the assumed ordering fails (equality's dependence on both representation and semantic significance of status/provenance), replacing it with a more accurate, evidence-grounded dependency chain"
