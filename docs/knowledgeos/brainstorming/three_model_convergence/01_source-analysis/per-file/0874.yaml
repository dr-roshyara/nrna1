defines:
  - concept: "The regime-relativity of contradiction"
    definition: "A finding that whether two propositions genuinely contradict one another is not a fixed, context-free property determinable from their content alone, but is instead a relation that must be evaluated relative to a specific semantic regime (a logical regime, a temporal regime, a probabilistic regime, etc.) that supplies the necessary context, temporal-validity assumptions, and domain constraints. Two propositions asserting different values for the same entity property are NOT automatically contradictory if their asserted temporal validity windows are disjoint; they ARE contradictory if the windows coincide and a domain invariant (such as at-most-one-current-version) is violated. Different regimes applied to the same pair of propositions may reach different contradiction classifications (a logical regime's binary Contradiction_L versus a probabilistic regime's continuous P(p1|E) and P(p2|E) assessments need not agree), meaning contradiction should be treated as regime-relative rather than as an absolute, primitive property of the knowledge state"
  - concept: "The Roberts measurement-theory constraint"
    definition: "A rigor requirement, drawing on representational measurement theory (the empirical relational structure and representation theorem framework historically associated with measurement theorists such as Fred S. Roberts, and the broader Krantz-Luce-Suppes-Tversky tradition), stating that assigning a numerical value to a knowledge-related quantity (such as a confidence score c(p)=0.83) does not automatically license standard arithmetic operations on that value. Whether c(p)+c(q) or 2·c(p) is a meaningful operation depends entirely on what measurement scale c actually represents (nominal, ordinal, interval, ratio, or something else) and whether that scale's empirical relational structure genuinely supports the arithmetic operation being performed. This gives the general principle that numeric representation is not the same thing as quantitative measurement, and is flagged as particularly important for any future statistical treatment of epistemic quantities in KnowledgeOS"
  - concept: "The identity-preservation invariant for regime projections"
    definition: "A candidate architectural invariant stating that when a regime R interprets or transforms a knowledge substrate K into a regime-specific representation Y_R (via a projection Π_R(K)=Y_R), that projection must not silently alter the historical identity of the underlying knowledge objects being represented -- formally, the projection must respect an identity mapping id_K:K→K, meaning it must never cause one knowledge object (e.g. evidence item e_1) to be silently conflated with or replaced by another (e.g. e_2) purely as a side effect of being viewed through a particular regime's lens. This is flagged as particularly important for provenance, since a regime that silently merges or reidentifies evidence objects during its own internal processing would corrupt the very lineage information KnowledgeOS is meant to preserve"
