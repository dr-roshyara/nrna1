about: >
  Three linked turns. (1) Reinterprets 0137's 74.2% result as expected for a "lexer + primitive
  parser," not a failure -- reframing only. (2) Proposes "KOS-SCB v0.2" with a 7-stage pipeline and
  projects 93-95% accuracy by ADDING per-stage percentage gains to the 74.2% baseline
  (74.2+20+10+25+15+19+25 ~ 95%). (3) A rigorous SELF-REJECTION of turn 2's arithmetic: "Accuracy
  improvements are not additive... We cannot make that inference," reclassifying every numeric
  projection from "projected accuracy" to "target hypothesis requiring measurement," explicitly
  REJECTing "93-95% projection," "LLM accuracy can be matched," and "Semantic Compiler = KnowledgeOS"
  in a KEEP/REJECT table. Introduces a new semantic-accuracy-vs-epistemic-correctness distinction and
  proposes splitting benchmarking into two separate suites (KOS-SCB semantic, KOS-EV epistemic).

introduces:
  - "Explicit naming and rejection of an 'additive accuracy fallacy': per-stage percentage-point gains
    cannot be summed to project overall accuracy, because different stages' fixes likely overlap on the
    same underlying failures -- a genuine statistical/methodological self-correction"
  - "New distinction: SEMANTIC accuracy (did we correctly parse the expression's meaning) vs. EPISTEMIC
    correctness (do we have sufficient grounds to believe the claim is true) -- explicitly named as
    'not the same problem,' with the example that a compiler can be semantically correct while
    KnowledgeOS must still report EpistemicState=UNKNOWN for lack of evidence"
  - "Proposed benchmark split: KOS-SCB (Semantic Compiler Benchmark, expression->meaning metrics) vs.
    KOS-EV (Epistemic Validation Benchmark, meaning->knowledge-state metrics) -- previously conflated
    in 0135/0136/0137's single benchmark"
  - "A KEEP/REJECT classification table applied to every element of the prior turn's v0.2 proposal --
    KEEP: the layered pipeline, Karaka-inspired roles (as hypothesis), type system, context binding
    (as hypothesis), canonical KIR, UNKNOWN state; REJECT: the 93-95% numeric projection, 'LLM accuracy
    can be matched,' and 'Semantic Compiler = KnowledgeOS'"
  - "Proposes an 'Identity Preservation' benchmark category testing Similarity≠Identity directly (e.g.
    'reviewed' must not collapse into 'approved'; 'probably approved' must not collapse into
    'approved') and a transformation-invariance category testing Transformation≠Identity-Loss (revision
    K1->K2 must preserve identity continuity without silently overwriting K1)"

