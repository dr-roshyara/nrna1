about: >
  Opens Step 25M directly executing 0590's closing commitment, posing the central practical question:
  what should happen when something previously accepted knowledge is later discovered to be wrong -- with
  the explicit warning that "wrong" has several distinct meanings a single Boolean state would lose.
  Delivers the revision model `K_{t+1}=Revise(K_t,E_{new})` alongside additive history `H_{t+1}⊇H_t`.

  **Delivers the file's central formal deliverable -- a six-kind taxonomy of "wrong," each independently
  motivated by a worked example and given its own formal signature**: (1) **Evolution** -- the system
  genuinely changed (`A_1→A_2`), the first assertion was true when made, `Evolution≠Correction`, old
  knowledge remains historically valid; (2) **Correction** -- the original record contained an error,
  represented as `Correction(E_1,E_2)` with `Status(E_1)=Corrected`, a new event rather than a destructive
  modification; (3) **Retraction** -- a source withdraws support (`Support(A)↓`) without establishing
  `¬A`, formalized as **`Retraction≠Refutation`** -- "especially important for statistical reasoning...
  losing support for a hypothesis is not automatically equivalent to proving the hypothesis false"; (4)
  **Refutation** -- new authoritative evidence under domain semantics (`A⊥B`) establishes falsity, explicitly
  a conclusion derived from evidence and domain semantics, "not merely the existence of a second
  assertion"; (5) **Reinterpretation** -- worked wrong-target example (a command executed against the
  development system misread as production), formalized as `ObservationValid∧AssertionInvalid`, explicitly
  identified as "exactly why the layered model from 25I is necessary"; (6) **ModelRevision** -- worked via
  the corpus's recurring multi-IP-address ontology example, `Ω_1→Ω_2` producing `K^{Ω_1}≠K^{Ω_2}` while the
  underlying observations remain unchanged, with the historical interpretation under `Ω_1` required to
  remain reproducible -- delivering **`Interpretation is versioned`**
  (`K^{(1)}=Derive(H,Ω_1)`, `K^{(2)}=Derive(H,Ω_2)`).

  **Delivers the file's second central formal deliverable -- Revision as event addition, never destructive
  mutation**: `H'=H∪{E_{revision}}`, `K'=Derive(H',Ω,EC,M)`, formalized as
  **`Revision=EventAddition+StateReDerivation`**, "considerably cleaner than destructive updates," worked
  through an auditability example demonstrating the pre-correction state `K_{before correction}` remains
  fully reconstructable after a correction is applied.

  **Delivers Assertion≠Assessment as a distinct revision dimension**: the proposition can remain unchanged
  while its support weakens (`Assessment(A):Strong→Weak`) due to newly discovered measurement unreliability
  -- explicitly flagged as becoming "even more important when we introduce formal statistical evidence
  aggregation in the next step." Delivers a worked Bayesian revision example
  (`P(H|E_1)=0.95→P(H|E_1,E_2)=0.40`), formalizing **`Probability revision≠Logical refutation`**, with an
  explicit caution against KnowledgeOS inventing priors or probability models implicitly, and a
  reconfirmation that deterministic and probabilistic knowledge must coexist without reducing the entire
  KnowledgeState to a probability distribution.

  **Delivers a disciplined revision-propagation treatment via a worked six-node dependency chain**
  (`E_1→A_1→K_1→R_1→Zero→Lord→D_1`): retracting `E_1` must not cascade-delete everything downstream,
  particularly when `A_1` carries independent support (`E_2→A_1`), formalized as **`Revision propagation
  =Support recomputation, not cascading deletion`**. Delivers an Affected Revision Frontier `RF(E)` enabling
  incremental recomputation rather than full-graph rebuild, and the DDD-scoping principle that revision
  propagation follows semantic dependencies -- cross-bounded-context effects travel through explicit
  integration relationships, not an uncontrolled global dependency graph.

  **Delivers a significant, concrete consequence for Zero, directly extending 0582's/0584's formal Zero
  treatment**: `Zero` is explicitly dynamic -- a previously-satisfied requirement can become unresolved
  again if its supporting evidence is later invalidated, formalized as **`Zero is dynamic`**, and reframed
  as representing "the current epistemic gap, not a permanent characteristic of a requirement." **Delivers
  an equally significant consequence for Sārathi's decisions, directly extending 0586's Decision-lifecycle
  treatment**: an invalidated prerequisite marks `DecisionAffected(D_1)=True`, but KnowledgeOS explicitly
  must NOT automatically reverse a decision unless governance policy explicitly permits it -- preserving
  "the distinction between computation and authority," with five named possible governance responses
  (review, pause, revocation, reassessment, no action). Delivers a six-value Decision status lifecycle
  (`Valid,Superseded,Questioned,Invalidated,Executed,Reversed`), reconfirming **`Historical existence≠
  Current validity`**.

  **Delivers seven labeled revision falsification experiments (Test 1-7), ALL PASS**: genuine evolution
  (not an error); wrong target (observation valid, assertion invalid); source withdrawal (retracted, not
  automatically false); genuine refutation; model revision (same history, potentially different derived
  knowledge); redundant support (an assertion with two independent supports survives retraction of one);
  decision dependency (`DecisionAffected=True`, automatic reversal remains governed, not assumed).

  Delivers a further normal-PC computational-feasibility reconfirmation for the revision machinery
  (EventAppend, DependencyTraversal, SupportRecalculation, TemporalEvaluation, RuleEvaluation,
  StateReconstruction), with large-scale performance concerns (incremental computation, dependency indexes,
  caching, materialized views) explicitly framed as a scalability concern, not a theoretical obstacle.

  **Delivers Step 25M's central formal invariant**: "KnowledgeOS must be able to revise its current
  epistemic state without destroying the historical events that explain how the earlier state arose,"
  formalized as `H_{t+1}=H_t∪{RevisionEvent}`, `K_{t+1}=Derive(H_{t+1},Ω,EC,M)`.

  **Delivers Step 25M's verdict**: **"25M — PASS,"** with the file's headline conceptual distillation --
  the model now distinguishes **four fundamentally different, non-identical dimensions of change**: World
  Change, Knowledge Change, Assessment Change, Model Change -- "related, but not the same event," explicitly
  called a substantial strengthening of the epistemic model.

  **Closes by reconfirming 0588's rejection of naive `Confidence=Average(SourceConfidences)`** as
  statistically unjustified, and posing a sharpened evidence-aggregation question: given heterogeneous
  evidence (independent/duplicate/derived/correlated/contradictory/authoritative/stale/retracted), how
  should KnowledgeOS calculate or represent aggregate support -- "counting them is not enough." **Opens
  "Step 25N — Evidence Aggregation Algebra,"** explicitly separating six distinct concepts
  (`Confidence≠Probability≠Reliability≠Authority≠Support≠Independence`), posing the central question
  "can KnowledgeOS aggregate heterogeneous evidence without committing statistical double-counting or
  epistemic errors?" -- "the next major mathematical test of the architecture." No actual code execution
  reported.
