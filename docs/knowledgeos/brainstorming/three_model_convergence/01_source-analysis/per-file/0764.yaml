defines:
  - concept: "'Open by decision, not by neglect'"
    definition: "A question or item is formally and explicitly kept open by an accountable governance ruling that considers it, records why it does not block the current decision, and retains it for future resolution -- as distinct from a question that simply never received attention; the former preserves epistemic honesty and traceability, the latter risks silent, unaccountable gaps"
  - concept: "Terminology policy vs. formal object change (as a ruling category)"
    definition: "A governance determination may resolve an apparent naming ambiguity or semantic collision purely by requiring qualified, distinguishing names for each distinct sense of a term going forward (a terminology policy), without adjudicating which sense is 'more correct,' merging the senses, or changing any underlying formal/architectural object -- this is a lighter-weight and different kind of resolution than declaring one sense PRESERVED and another TRANSFORMED or DISPLACED"
