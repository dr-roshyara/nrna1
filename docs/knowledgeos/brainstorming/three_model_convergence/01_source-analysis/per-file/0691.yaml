defines:
  - concept: "A_D (Deployed architecture)"
    definition: "The fourth tier in the architecture-conformance model, distinct from A_I (intended), A_C (implemented in source), and A_R (observed at runtime): what is actually deployed to an environment, which may itself diverge from both the source implementation (e.g. an old deployed version) and from what is subsequently observed running"
  - concept: "LogicalComponent≠RuntimeInstance"
    definition: "A single logical architectural component may correspond to many running runtime instances (e.g. via horizontal scaling); the count or identity of runtime instances must not be conflated with the count or identity of logical architectural components"
  - concept: "TemporalGovernanceDrift"
    definition: "The specific drift condition where a previously-authorized exception to an architectural or governance rule has expired, but the runtime deviation it covered still persists — this is escalated as a new GovernanceFinding, distinct from ordinary (non-temporally-lapsed) technical drift"
  - concept: "TechnicalReality↔OrganizationalIntent"
    definition: "KnowledgeOS must compare two distinct kinds of reality: technical reality (what the software/infrastructure actually does) and organizational reality (what people have actually decided and authorized); a divergence between them — e.g. an organization deciding to retire a service while runtime continues operating it — constitutes a governance/architecture finding in its own right, independent of any purely technical conformance check"
