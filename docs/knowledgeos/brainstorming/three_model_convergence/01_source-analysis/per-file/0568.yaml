title: "FIRST GENUINELY EXPERIMENTAL STEP: A Complete Adversarial Test-Scenario Design for the KnowledgeOS Reference Model (Nexus-Migration Artificial World) — Deliberately Injected Contradiction/Staleness/Identity-Ambiguity/Duplicate-Evidence/LLM-Hallucination/Statistical-Outlier/Non-Termination Cases; a Ten-Category Failure Taxonomy (F1-F10); 'A Model That Produces Zero Counterexamples on the First Experiment Is More Suspicious Than One That Produces Several'; the Central Reference-Model Invariant 'No Unexplained Magic Transitions'; Verdict Explicitly 'READY FOR EXECUTION,' NOT 'VERIFIED' — First Time in the Program This Distinction Is Drawn; Opens Step 25A (Build the Minimal Executable KnowledgeOS Kernel in Python) — the Corpus's First Proposed Move From Theory to Actual Code"
