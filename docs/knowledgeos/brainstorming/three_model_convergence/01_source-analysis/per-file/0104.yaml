about: >
  Deep engagement with Abhāva (absence) ontology from Nyāya-Vaiśeṣika, distinguishing FOUR precise
  types of absence (Prāgabhāva/prior, Pradhvaṃsābhāva/posterior-after-cessation, Atyantābhāva/absolute,
  Anyonyābhāva/mutual-difference). Explicitly and disciplinedly refuses to add "Absence" as a naive 7th
  flat dimension, instead proposing it as a sub-structure of the existing Unknown/Presence split -- a
  genuine refinement of Unknown Preservation, not a new dimension-count inflation event.

introduces:
  - "Four typed-absence categories (real Sanskrit ontology, precise and distinct): Prāgabhāva (prior
    absence -- not yet existing), Pradhvaṃsābhāva (posterior absence -- destroyed/ceased),
    Atyantābhāva (absolute/eternal absence -- impossible), Anyonyābhāva (mutual absence -- difference
    between two things). Each given a worked KnowledgeOS example (not excerpted in full here)"
  - "⭐ Disciplined non-inflation: 'Add: Absence Dimension. NOT a seventh dimension. Rather: a dual
    state' -- Knowledge State = Presence OR Structured-Absence OR Unknown, with Absence itself
    sub-typed (never-existed / destroyed / impossible / different). A rare instance of a file
    explicitly REFUSING to add a flat dimension where every precedent (0089-0100) would have invited
    one -- worth noting as a positive counter-example to the anchor's ongoing reshaping churn"
  - "Updated epistemic-state model: Present / Absent(typed) / Unknown(Investigation) -- a genuine
    refinement of the True/False/Unknown vocabulary already tracked (0081's DeepSeek finding, C-10),
    adding structured absence as a third parallel branch"
  - "This file's own 'existing invariants' list: Identity, Evidence, Authority, Context, Temporal,
    Unknown -- SIX items, notably OMITTING Transformation (present in 0087's original six and in most
    later reshapings) -- a data point for the anchor's ongoing instability, not itself flagged by the
    source"
  - "Deepest extraction: 'a trustworthy knowledge system must know the SHAPE of ignorance' -- distinct
    from merely knowing THAT something is unknown"

