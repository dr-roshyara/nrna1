about: >
  A significant methodological pivot for the whole semantic-operator/Dhatu research program (0239-0243):
  instead of asking "what is knowledge?", ask "what observable phenomena are demonstrably NOT knowledge?"
  and statistically infer the residual structure that survives elimination. Reframes the entire discovery
  problem as an inverse statistical problem (PRML's forward generative model z->x inverted to infer
  P(z|x)), giving the Zero/Dhatu hypothesis a rigorous, falsifiable, experimentally-attackable formulation
  for the first time in this sub-arc.
introduces:
  - concept: "Inverse-problem reframing: Define NOT-KNOWLEDGE -> collect observations -> statistically eliminate/explain non-knowledge -> residual stable structure -> candidate Knowledge; formally K = X\\N but explicitly not a simple set complement since non-knowledge itself is heterogeneous"
  - concept: "Fourteen-item non-knowledge taxonomy that must not be collapsed into one category: syntax, formatting, repetition, citation, convention, stylistic preference, accidental correlation, domain-specific naming, noise, memorized association, procedural habit, contextual artifact, measurement artifact, genuinely unknown"
  - concept: "Absence != negative evidence, formalized: a concept never appearing in a corpus could mean the corpus is too small, expressed differently, sampled with bias, implicit, or belongs to another domain -- non-observation must not collapse into negative evidence; requires estimating P(observation|latent structure) and its Bayesian inverse P(latent structure|observations)"
  - concept: "Generative model formalization: X = G(K,N,C,epsilon) where K=candidate knowledge structure, N=non-knowledge structure, C=context, epsilon=noise, G=generative process; solve the inverse problem P(K,N,C|X) rather than directly classifying X as 'knowledge'"
  - concept: "Sharpened Zero definition (third iteration in this sub-arc): the smallest stable explanatory structure that remains after statistically accounting for non-knowledge phenomena -- the primitive is not chosen, it SURVIVES elimination"
  - concept: "Invariance-under-transformation test as the strength criterion: apply multiple superficial transformations (different language/terminology/style/formatting/author/domain/paraphrasing) and test whether a candidate structure z(T_i(X)) approx z(X) survives all of them; survival across transformations increases confidence more than raw frequency does"
  - concept: "Frequency != fundamentality, formalized: fundamentality approx stability x cross-context invariance x explanatory power, with an explicit complexity penalty (Occam factor from PRML, 0230/0243) -- a formatting convention can occur millions of times while a profound problem-solving operation occurs only hundreds"
  - concept: "Discipline correction: reframe 'define what is not knowledge' more precisely as 'define observable classes of phenomena that do not constitute knowledge under the operational definition being tested,' to avoid smuggling philosophy into the statistical model; nine testable exclusion criteria (merely-syntactic/representational/contextual/conventional/correlated/non-predictive/non-transferable/non-invariant/non-explanatory)"
  - concept: "Candidate operational definition of knowledge (explicitly not final, but experimentally attackable): a statistically stable, transferable, explanatory structure that remains invariant under appropriate transformations after representational, contextual, conventional, and stochastic effects have been accounted for"
  - concept: "Full research loop: Observations -> Remove known non-knowledge -> Residual data -> Infer latent structure (inverse PRML) -> Candidate K -> {transformation testing, new-corpus testing} -> Stability test -> Complexity penalty -> Surviving structure -> Candidate 'knowledge' -> repeat -- 'scientific falsification through inverse modeling'"
