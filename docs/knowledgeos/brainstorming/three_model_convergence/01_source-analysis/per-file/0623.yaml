defines:
  - concept: "SufficientKnowledge≠ValidDecision≠AuthorizedAction"
    definition: "Three genuinely distinct evaluations — whether enough is known (epistemic), whether the decision's conditions are internally consistent (logical), and whether the resulting action is permitted (governance/safety) — none of which implies either of the others"
  - concept: "Admissible=Pre∧Invariant∧Assurance∧Authorization"
    definition: "A decision is admissible only under strict, unaveraged conjunction of all four dimensions; a single failing dimension (most critically a violated hard invariant) blocks the decision regardless of how strongly the others are satisfied"
  - concept: "HardInvariant / PolicyConstraint / AdvisoryCondition"
    definition: "A corrected three-way vocabulary replacing the imprecise Hard/Soft/Advisory invariant classification: a true invariant (HardInvariant) can never be violated by definition, while a violable-but-consequential property is properly a PolicyConstraint, and a violable-with-only-a-warning property is an AdvisoryCondition"
  - concept: "Evaluate(d) before Execute(d)"
    definition: "Decision evaluation is formally separated from decision execution, enabling dry-run simulation, review, what-if analysis, governance checks, and AI planning without side effects"
  - concept: "AI may propose; the governed system decides whether the proposal is admissible"
    definition: "An AI agent's proposed decision must pass through DecisionEvaluation and a PolicyGate before execution; the agent's capability is explicitly bounded by policy rather than granted blanket trust"
