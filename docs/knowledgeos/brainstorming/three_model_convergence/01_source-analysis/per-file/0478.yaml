title: "LANDMARK: 'Question 12A' Delivers Precise Mathematical-Rigor Corrections — Rejects 'Norm' and 'Distance' Without Verified Axioms (Epistemic Comparison Is Directional, Not Symmetric), Introduces a Three-Level Difference→Deficit→Distance Hierarchy, Identifies and Counters the 'Self-Adapting Ideal State Erases Its Own Deficit' Danger via a Declared/Derived/Horizon Ideal Split, Freezes a Seventh Invariant, and Launches Question 13: What Is the Formal Structure of the Knowledge State?"
