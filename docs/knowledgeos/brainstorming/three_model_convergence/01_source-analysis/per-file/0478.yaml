defines:
  - concept: "Difference/Deficit/Distance (three-level hierarchy)"
    definition: "Delta(K,I): what is different; S(Delta,P): how important the difference is for purpose P; d(K,I): a true metric distance, only if mathematically justified -- never conflated into one 'distance' concept"
  - concept: "Ideal State (governance-safe, three-way)"
    definition: "I^declared (Knower-stated requirement), I^derived (KnowledgeOS-derived from purpose/context/domain), I^horizon (Lord-proposed candidate horizon) -- explicitly separated so KnowledgeOS cannot silently redefine its own target"
  - concept: "Gap (final architectural invariant)"
    definition: "Absence relative to a justified requirement (Purpose+Context+Ideal/Horizon+Decision) -- never mere absence, preventing unbounded gap proliferation"
