about: >
  The source corpus's own provenance/intake-governance index (not research content). Documents four
  human-commissioned rename/classification batches (2026-08-21 through 2026-08-23) covering 117 files,
  with a "frozen classifier" system routing every lens-bearing file to an already-admitted "character"
  section rather than creating new register rows (register size stated as "25+4"). Provides exceptionally
  valuable independent cross-checks on this reconstruction's own findings: confirms the P4/OQ-4/AH-5
  governance-gate status exactly as this reconstruction has tracked it (all still unresolved as of
  2026-08-23); reveals two out-of-scope governed artifacts (an Independent DDD Critique record and a
  Kernel-thread Reading Report) containing a formal "20-point drift catalogue"; confirms 0145/0146 are
  explicitly retained as falsification counterexamples, never candidate architecture, exactly matching
  this reconstruction's own contemporaneous treatment; confirms 0162's topological-lens non-admission
  finding in the source's own words; and resolves two of this reconstruction's own "unconfirmed AI
  attribution" flags (0152=Perplexity, plus DeepSeek/Kimi attributions) directly from original
  pre-rename filenames.

