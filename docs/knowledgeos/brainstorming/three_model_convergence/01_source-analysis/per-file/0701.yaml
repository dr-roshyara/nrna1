defines:
  - concept: "The four-layer graph model (Implementation/Data/Semantic/Governance)"
    definition: "A KnowledgeOS reconstruction should maintain four distinct but related graphs: the Implementation Graph (components, dependencies, interfaces), the Data Graph (data entities and their relations), the Semantic Graph (domain concepts and semantic relationships), and the Governance Graph (actors, authorities, decisions, policies) — collapsing them into a single diagram loses essential distinctions between what exists in code, what exists in data, what it means, and who controls it"
  - concept: "Gap and Unexpected (bidirectional drift as set difference)"
    definition: "Given a declared architecture graph G_declared and an observed runtime/implementation graph G_observed, Gap=G_declared-G_observed identifies declared-but-unobserved elements (potential dead code, incomplete deployment, stale docs, unused features), while Unexpected=G_observed-G_declared identifies observed-but-undeclared elements (potential undocumented integration, architectural drift, accidental dependency, shadow capability)"
  - concept: "Similarity(A,B)≠Identity(A,B)"
    definition: "A high embedding/vector similarity score between two knowledge objects (e.g. 0.97) does not establish that they are the same entity or represent the same decision; identity must be established through explicit identifiers or independently-aligned attributes, never through similarity scores alone"
  - concept: "TechnicalOnly traceability"
    definition: "The weakest end-to-end traceability classification for an engineering change: the reconstructable trace begins only at the Git commit level, with no organizational decision, authority, or governance evidence connecting to it at all — distinct from Partial (some links present) and EndToEnd (fully evidenced)"
  - concept: "The six-level KnowledgeOS maturity ladder"
    definition: "Level 0 Documents; Level 1 Indexed knowledge (Documents+Search); Level 2 Structured knowledge (Objects+Relations); Level 3 Governed knowledge (+Authority); Level 4 Operational knowledge (+Actions+Observations); Level 5 Closed-loop KnowledgeOS (full Knowledge→Decision→Action→Observation→Evidence→Knowledge loop) — a maturity model for classifying how far a system has progressed toward being a genuine knowledge operating system, not itself a claim about any specific system's current level"
