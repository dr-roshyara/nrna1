defines:
  - concept: "Status(P)=⟨Basis,Method,Strength,Uncertainty⟩"
    definition: "A four-dimensional replacement for a flat true/false verdict or single linear ladder, recording the epistemic basis (declared/observed/inferred), the method that produced the status, the verification strength (assertion through deterministic verification), and the uncertainty associated with the claim -- introduced specifically because deterministic and probabilistic verification strengths are not mutually comparable on one scale"
  - concept: "The three-agent problem"
    definition: "When multiple agents (human or AI) appear to independently confirm a claim but each derives its output from the same underlying evidence source (A_i=f(E_0)), the apparent multiplicity of confirmations is not additional independent evidence -- it is one source expressed through several outputs; correctly modeling this requires an explicit evidence-independence graph distinguishing derivedFrom/copiedFrom relations from genuinely independentOf relations"
  - concept: "Status collapse / the danger of a single universal lifecycle status"
    definition: "Representing multi-dimensional state (Operational, Epistemic, Governance, Authorization) as a single flat status field (e.g. status=SUCCESS or status=completed) is a many-to-one projection that destroys information -- distinct states such as 'executed but unverified' and 'executed and verified' become indistinguishable once collapsed, so KnowledgeOS domain models should avoid a single universal lifecycle status"
