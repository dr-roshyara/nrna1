about: >
  Directly continues 0785, opening "we continue with Step 162 — Invariant and Boundary Derivation. This is
  an important step because we now stop asking 'what concepts do we have?' and ask the more rigorous DDD
  question: what must remain true, and where must that truth be protected?"

  **§162.1 delivers the central derivation equation**: `Semantic Concept→Invariant→Consistency
  Requirement→Boundary`, explicitly contrasted against the rejected shortcut `Noun→BoundedContext` --
  "that distinction will protect the architecture from over-modelling." **§162.2-162.3 delivers a
  four-category constraint taxonomy**: Semantic invariant (defines meaning, e.g. `Evidence≠Knowledge`),
  Consistency invariant (defines what must remain jointly consistent, e.g. `Decision.authority=
  ValidAuthority`), Governance invariant (defines what is permitted, e.g. `Execute(A)⇒Authorized(A)`),
  Technical invariant (defines implementation safety, e.g. "only immutable evidence records may enter the
  evidence store") -- with the explicit caution that the fourth category "should not be mistaken for a
  domain invariant unless the domain actually requires it."

  **Delivers fourteen numbered invariants, `I-01` through `I-14`** (a distinct series from 0785's
  consolidated `I1`-`I10`, worth flagging as another unreconciled but closely-related numbering set):
  I-01 Observation integrity (`Observation⇏Conclusion`; Observation ruled `Concept/Entity, not necessarily
  BC`); I-02 Evidence traceability (`Evidence→Source`, `Evidence→Observation`, provenance must remain
  reconstructable, "stronger than simply storing a URL"); I-03 Knowledge requires epistemic status
  (`Status(K)` required, else hypothesis and confirmed knowledge become indistinguishable); I-04 Knowledge
  must be versionable (`K_1→[superseded]→K_2`, history must be preservable, whether via event sourcing
  explicitly "not decided"); I-05 Knowledge cannot silently overwrite contradiction (`K_1="X"` and
  `K_2="not X"` must not simply replace one another -- `Contradiction(K_1,K_2)` modeled as a relationship,
  "not necessarily a separate aggregate"); I-06 Determination must expose reasoning basis (`D→{E,K,C,M}`,
  never an opaque conclusion string like "architecture approved"); I-07 **Determination≠Decision**
  (foundational, worked example distinguishing "current architecture violates rule R" from "migration must
  be completed before release" -- "different meanings, different authority, potentially different
  owners"); I-08 Decision requires authority (`Decision⇒Authority`, which may be Architecture Board,
  policy engine, delegated role, or automated governance mechanism, but must be defined); I-09
  Recommendation≠Decision (`Recommendation_AI≠Decision_Governance`, "the AI cannot silently cross the
  authority boundary"); I-10 Authorization≠governance (`GovernanceDecision≠Authorization`, governance asks
  "should this be permitted?", authorization asks "is this actor permitted to perform it?"); I-11
  Authorization must be contextual (`Auth=f(Actor,Action,Resource,Policy,Context,Time)`); I-12
  **Action≠Execution** (`A=Intent+Target+Parameters` vs. `X=ActualEffect`, allowing "authorized but not
  executed" to be recorded); I-13 Execution must generate observable consequences
  (`Execution→Observation`, closing the feedback loop, "an execution without any ability to establish its
  result creates an assurance gap"); I-14 Unknown is legitimate (`Unknown≠False`, `Unknown≠Null`).

  **Delivers the file's actual DDD bounded-context determinations, the culmination of the reconstruction's
  entire DDD-reduction arc**: **Evidence** upgraded to `Strong BC Candidate` -- "much stronger than our
  earlier position" -- justified by concerns distinct from Knowledge (acquisition, provenance, integrity,
  source, observation method, timestamp, relevance, immutability, verification); **Knowledge** also
  `Strong BC Candidate`, with the explicit boundary rule "Evidence and Knowledge are not one context...
  Evidence should not become an internal data structure of Knowledge merely for convenience" (the same
  evidence can support different claims under different contexts); **Determination** ruled `BC Candidate`
  but requiring further validation of genuine distinctness from Decision (resolved affirmatively by I-07);
  **Decision** ruled **`Existing/Strong Governance Boundary`, explicitly NOT a brand-new standalone
  "Decision BC"** -- folded instead into a broader Governance bounded context, "a significant DDD
  refinement"; **Authorization** modeled explicitly as **"a boundary object between Governance and
  Operations"** rather than being forced into either side, avoiding premature classification.

  **§162.38-162.41 delivers the KnowledgeOS kernel principle**: the kernel should contain only concepts
  requiring true system-wide consistency (`Identity, Provenance reference, Lineage reference,
  AuthorityReference, Integrity, Version, Correlation`), boxed `Kernel≠UniversalDomainModel` and required
  to be **"small, stable, authoritative"** -- "every concept added to the kernel increases coupling.
  Therefore the burden of proof for kernel inclusion should be high." Delivers an explicit list of what
  probably does NOT belong in the kernel: **Wisdom, Decision, Inquiry, business-specific Action,
  domain-specific Evidence, domain-specific Knowledge** -- "should remain context-owned unless proven
  otherwise," directly reaffirming 0783's/0785's disciplined non-promotion of Wisdom to any formal
  architectural status.

  **§162.42-162.46 delivers a genuinely careful, non-literal re-translation of the Chapter-4 "only Krishna
  knows" insight into precise architecture**: explicitly rejects "the system remembers everything" in favor
  of "the system preserves the lineage necessary to reconstruct relevant prior states." Delivers the
  architectural analogue: `GlobalHistoricalContext` (available to the system of record) versus
  `LocalActorContext` (intentionally incomplete), boxed as a design principle `SystemContext⊇ActorContext`
  -- "the actor need not possess the complete history." **Explicitly argues this is beneficial, not a
  limitation**: a complete memory model for every agent would be "expensive; difficult to govern;
  potentially unsafe; difficult to invalidate; difficult to reason about" -- `Agent→RelevantContext` is
  better than `Agent→Everything`. **Delivers Context Projection**, `Projection(H,C)→Context_C`, "the agent
  receives a context projection appropriate to its task," so KnowledgeOS may hold broad historical lineage
  while each agent receives only `RelevantKnowledge`. **Delivers a new invariant directly following from
  this**: "context supplied to an actor must be distinguishable from complete historical state" --
  otherwise the actor "may incorrectly assume: what I was given is everything that exists" -- a precise,
  currently and directly applicable AI-agent-safety principle.

  **§162.47 delivers "Step 162 major result"**: "we should NOT create a bounded context for every
  concept... boundaries emerge from invariants, ownership, lifecycle, and consistency," with the current
  strongest candidates explicitly named: **`Evidence, Knowledge, Governance`**, with `Determination`
  requiring further validation and `Authorization` acting as a boundary object between governance and
  operations.

  **§162.48 delivers "provisional architecture,"** the file's central consolidated diagram: `GOVERNANCE
  (Policy/Authority/Decision)→Authorization→OPERATIONS(Action/Execution/Runtime)→Observation→EVIDENCE
  (Source/Provenance/Integrity)→[supports]→KNOWLEDGE(Claims/Validity/Status/Contradiction)→DETERMINATION
  (Method/Context/Rationale)→GOVERNANCE`, explicitly noted "not a cycle because the operational feedback
  creates the next Observation," summarized as the complete chain `Execution→Observation→Evidence→
  Knowledge→Determination→Decision`.

  **§162.49 delivers the Step-162 exit criterion**: every major concept requires `Definition+Invariant+
  Owner+Lifecycle+Boundary+Evidence`, else "the architecture remains provisional."

  **Closes by opening "Step 163 — Context Map and Translation Boundaries,"** posing "how do these bounded
  contexts communicate without destroying their semantic independence?", boxed as `Context→Contract→
  Translation→Context`, with six specifically named boundary crossings to examine (Evidence→Knowledge;
  Knowledge→Determination; Determination→Governance; Governance→Authorization; Authorization→Operations;
  Execution→Observation) -- "this is where we begin to define the actual architecture interfaces, rather
  than merely the conceptual objects." No actual repository implementation or code execution occurs
  within this file itself; every boundary determination remains explicitly labeled "candidate" pending
  further verification, consistent with the file's own governing discipline.
