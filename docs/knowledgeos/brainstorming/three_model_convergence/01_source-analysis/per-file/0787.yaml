defines:
  - concept: "The kernel-inclusion burden of proof"
    definition: "A candidate concept should only be added to the small, stable, authoritative KnowledgeOS kernel if it can be shown to require true system-wide consistency shared across every bounded context (e.g. Identity, Provenance reference, Lineage reference, AuthorityReference, Integrity, Version, Correlation) -- every additional kernel concept increases coupling across the entire system, so the default assumption is exclusion, with inclusion requiring active, high-bar justification, not the reverse"
  - concept: "Context Projection (Projection(H,C)→Context_C)"
    definition: "Rather than granting every acting agent access to the complete historical lineage H maintained by KnowledgeOS, the system computes a task-appropriate projection of that history into a bounded Context_C relevant to the agent's current work -- the agent's limited view is a deliberate, beneficial architectural choice (reducing cost, governance burden, safety risk, and reasoning complexity), not an unfortunate limitation, provided the projected context is clearly marked as a projection rather than the complete historical record"
  - concept: "'Context supplied to an actor must be distinguishable from complete historical state'"
    definition: "Whenever an actor (particularly an AI agent) receives a bounded context projection rather than the full historical record, the system must make clear to that actor that what it has received is a projection, not the totality of what exists -- otherwise the actor may reason as though its limited view constitutes complete information, silently converting an epistemic gap into an unrecognized blind spot"
