defines:
  - concept: "Authority cannot be inferred from names"
    definition: "A repository, folder, or file whose name suggests governance authority or approval status (e.g. governance/, approved/, approved-architecture.md) does not thereby possess that authority or approval; organizational authority requires an actual governance record, never a naming convention alone"
  - concept: "Inventory evidence hierarchy"
    definition: "Different evidence sources carry different strength for different claim types: DirectRuntimeEvidence generally outweighs DocumentationClaim for current runtime-state facts, and AuthoritativeGovernanceRecord generally outweighs Filename for organizational-authority facts — evidence strength is claim-type-relative, not uniform"
  - concept: "Secret-hygiene principle (inventory-specific)"
    definition: "The architectural/inventory knowledge model may record that a secret/credential exists (SecretExists=True) as an inventory fact, but must never reproduce the secret's actual value within that knowledge model"
  - concept: "Discovery≠Classification"
    definition: "An automated repository/dependency/deployment scanner can reliably discover that an artifact exists, but cannot automatically determine its bounded-context membership or business-capability role — those require human or AI interpretive analysis layered on top of raw discovery"
