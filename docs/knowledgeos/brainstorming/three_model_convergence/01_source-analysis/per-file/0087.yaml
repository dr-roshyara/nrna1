    known), Pramā (valid knowledge) -- called 'almost a missing KnowledgeOS primitive'; mapped onto a
    proposed 'Knowledge Claim' object: Object / Source / Method / Validator / State"
  - "Direct EKS mapping: EKS's transitions != grants (evidence movement != authority assignment) is
    read as matching Pramāṇa != Pramā (validation method != the valid-knowledge result) -- reinforcing
    INV-001 Authority Separation with a second, independent structural analogy"
  - "Veda -> Upanishad -> Vedanta reinterpreted (explicitly not literally) as: large corpus -> essential-
    principle extraction -> systematic interpretation framework -- mapped onto EKS/PKS/AIP -> invariant
    discovery -> KnowledgeOS Constitutional Map, an explicit self-referential parallel to this very
    reconstruction's own reading-order arc, for a second time (after 0084's 6-phase roadmap)"
  - "Aparā Vidyā (lower/operational knowledge) vs Parā Vidyā (higher/meta-knowledge), reinterpreted
    structurally as Operational Knowledge vs Meta-Knowledge ('knowledge about knowledge') -- explicitly
    NOT copied literally from the Upanishadic source"
  - "Richer epistemic pipeline: Reality -> Observation -> Evidence -> Validation Method -> Knowledge
    Claim -> Authority Decision -> Published Knowledge -- reintroduces 'Knowledge Claim' as an explicit
    node, in apparent tension with 0081's finding that 'Claim' was empirically ABSENT from current
    EKS/PKS/AIP architecture; this tension is not addressed or reconciled by this document"
