about: >
  A deep (not merely structural) engagement with Vedantic epistemology -- centrally the Pramāṇa
  quartet (Pramātā/Pramāṇa/Prameya/Pramā: knower/means-of-knowing/object-known/valid-knowledge) and
  the Aparā Vidyā/Parā Vidyā (lower/higher knowledge) distinction -- reviewed against EKS evidence,
  followed by a closing synthesis that declares the five-lens conceptual-research phase COMPLETE and
  produces the corpus's FIRST explicit, numbered "Minimal Kernel Candidate": six protected dimensions
  plus one non-dimensional enforcement mechanism.

