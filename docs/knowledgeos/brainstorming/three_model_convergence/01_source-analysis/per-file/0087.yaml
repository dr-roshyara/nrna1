    plausible but not established"
  - "Nine-lens summary table: EKS, PKS, AIP, Topology, Vāṇī, Zero, Gita, Vedanta, and (NEW, undefined)
    'ECS' (Epistemic Control Systems) -- 'trusted advancement and publication gates' -- another
    forward/external reference to a document not yet located in the read corpus"
  - "⭐ FIRST explicit, numbered 'Minimal Kernel Candidate' in the corpus: SIX protected dimensions --
    (1) Identity Preservation 'what is this?', (2) Evidence Integrity 'why should this be believed?',
    (3) Authority Separation 'who can make it valid?', (4) Transformation Integrity 'how did it
    change?', (5) Temporal Validity 'when was it valid?', (6) Unknown Preservation 'what remains
    unresolved?' -- PLUS one explicitly non-dimensional mechanism: Structural Enforcement ('the kernel
    must make forbidden transformations impossible')"
  - "Kernel reframed as an 'Epistemic Integrity Layer': Separate -> Preserve -> Validate -> Relate ->
    Transform -> Project (a six-verb pipeline, distinct from the six-dimension list)"
