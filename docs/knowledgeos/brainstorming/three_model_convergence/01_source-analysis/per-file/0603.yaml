defines:
  - concept: "Four-way cryptographic-epistemic separation"
    definition: "Integrity (has the artifact been altered?) / Authenticity (who produced it?) / Authority (were they permitted to assert this?) / Truth (is the claim actually true?) — four independently verifiable, mutually irreducible properties of an evidentiary artifact"
  - concept: "Impact analysis via forward provenance"
    definition: "Impact(E)=Descendants(E) — the set of conclusions, derivations, decisions, and actions that depend on a given evidence item, computable to systematically identify what must be reconsidered when that evidence is later invalidated"
  - concept: "Evidence assessment vector"
    definition: "A(E)=(Integrity,Authenticity,Authority,Reliability,Independence,TemporalValidity,SemanticValidity) — a seven-dimensional structured assessment explicitly preferred over any single confidence scalar, since a scalar hides which epistemic dimension it actually represents"
  - concept: "Zero_provenance / OrphanKnowledge"
    definition: "The formal epistemic status for a conclusion whose derivation chain back to originating evidence cannot be established — such a conclusion must not be treated as equivalent to a fully-traceable one, regardless of how plausible it appears"
