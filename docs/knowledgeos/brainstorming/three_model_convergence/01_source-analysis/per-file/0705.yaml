defines:
  - concept: "ConstitutionalInvariant≠CodingConvention"
    definition: "A constitutional invariant is a property whose violation would fundamentally change the semantic character of the system (e.g. 'authoritative knowledge must have identifiable provenance'); a coding convention is an implementation preference (e.g. 'use PostgreSQL') that does not carry this consequence — only the former belongs in a constitution"
  - concept: "KnowledgeOS Architecture Constitution v0.1 (C1-C7)"
    definition: "C1 Provenance (authoritative knowledge must have identifiable provenance); C2 Authority (authoritative changes must have identifiable authority); C3 Epistemic Separation (observed/inferred/proposed/verified/authoritative information must remain distinguishable); C4 Temporal Validity (current knowledge must be distinguishable from historical/superseded knowledge); C5 Deterministic Assurance (deterministically testable claims SHOULD be established through reproducible evidence — softened to SHOULD, not MUST, since some verification domains require judgment); C6 Traceability (material governed engineering actions must be traceable to their authorization); C7 Feedback (material deviations must be capable of feeding back into governance and authoritative knowledge) — deliberately technology-independent, validated by a swap test"
  - concept: "KnowledgeOSIntegrity=P∩A∩E∩T∩V∩R∩F"
    definition: "Overall constitutional integrity is the logical AND (intersection), not an average or weighted sum, of all seven constitutional properties holding; satisfying six of seven does not constitute partial or acceptable integrity — any single violated principle breaks constitutional soundness"
  - concept: "RetrievalAccuracy≠KnowledgeCorrectness"
    definition: "A retrieval system can perform its technical retrieval function perfectly (returning exactly the document/record requested) while still delivering an agent an incorrect organizational context, if the retrieved knowledge has been superseded but is not marked as such — retrieval fidelity and knowledge currency/correctness are independent properties"
  - concept: "The fundamental AI governance failure"
    definition: "The specific, named failure mode where an AI-generated inference is silently treated as organizationally authoritative (Inference=Authority⇒AIOutput→OrganizationalTruth) without passing through any explicit promotion, review, or authorization process — identified as the central failure this reconstruction's entire epistemic-firewall discipline exists to prevent"
