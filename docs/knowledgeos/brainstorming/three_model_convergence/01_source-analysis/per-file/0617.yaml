  - concept: "EpistemicIntegrity (six-dimensional)"
    definition: "EI=(EvidenceIntegrity,ProvenanceIntegrity,SemanticIntegrity,InferenceIntegrity,ValidationIntegrity,DecisionIntegrity) — the preservation of the intended Reality→Observation→Evidence→Inference→Decision relationship, formally decomposed since a violation at any one dimension is independent of the others"
  - concept: "CorrectInferenceFromFalseEvidence"
    definition: "A failure mode in which every downstream reasoning step is formally valid, yet the entire conclusion is unsound because the original observation was adversarially manipulated — explicitly worse than an ordinary inference error since valid downstream reasoning cannot repair a compromised foundation"
  - concept: "Detectable(A,O)-gated evidence of absence"
    definition: "NotObserved(A) constitutes genuine evidence against A only when Detectable(A,O)=True — the observation mechanism O must have had demonstrated capability to detect A, distinguishing EvidenceOfAbsence(A) from mere NoEvidence(A)"
  - concept: "Mechanism design for truthful reporting"
    definition: "A governance-level incentive structure ensuring Utility(TruthfulReport)≥Utility(ManipulatedReport) for participating actors — an organizational design problem the epistemic architecture cannot solve through inference alone"
