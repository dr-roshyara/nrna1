about: >
  "STEP 287 — INVARIANTS `ℐ`," status "RESEARCH/TYPING/FALSIFICATION," explicitly NOT "STEP 287 — Invariants:
  Canonical." The founding mandate for the entire already-tracked Step-287-Invariants research programme
  (already tracked via `REFINED-STEP-287-INVARIANTS.md`'s "7 candidates, 0 established" finding, file 1117's
  headline 13), directly deriving from the already-tracked Step-286 ontology (file 2227) with the precise
  question shift: Step 286 asked "What exists?"; Step 287 asks "What must remain true?"

  **DELIVERS THE LITERAL ORIGIN OF THE VACUITY/DEGENERACY-AUDIT DISCIPLINE THIS RECONSTRUCTION HAS TRACKED
  BECOMING A STANDING PROGRAMME-WIDE RULE ACROSS THE ENTIRE EQUALITY RESEARCH ARC (files 1057-1058, 1069,
  1077, 1083, 1092, 1116)**: `§18`, "The Vacuity Problem," directly cites "the exact defect discovered in
  D285-5: a relation can silently carry the conclusion" and delivers the founding methodological requirement:
  "For every invariant: 1. establish that the antecedent can actually hold; 2. establish that the transition
  class is non-empty; 3. establish that the equality relation permits meaningful comparison; 4. only then
  evaluate preservation." Boxed: "NO VACUOUS INVARIANT COUNTS AS SUBSTANTIVELY ESTABLISHED." This is the
  DIRECT, LITERAL ANCESTOR of the already-tracked standing rule ("no algebraic property may be accepted from
  a zero-counterexample result without a degeneracy check," file 1058) that this reconstruction has tracked
  catching multiple vacuous PASSes throughout the entire subsequent research arc (`≈_∅`/`≈_{full}`, file
  1058; `≈_S∘≈_V`, file 1088; the supersession-merge model, file 1077/1083's "second vacuous PASS").

  **DELIVERS THE ORIGINAL 12-ITEM CANDIDATE INVARIANT MATRIX (`I-01` THROUGH `I-12`)**, the direct
  predecessor of the already-tracked "7 candidates, 0 established" `REFINED-STEP-287-INVARIANTS` finding:
  `I-01` Knower identity persistence (strong candidate); `I-02` relevant provenance survival ("open"); `I-03`
  admissibility outcome-independence (supported, already-tracked `I-V`'s direct ancestor -- see below);
  `I-04` `Command≠Transformation` (supported, already-tracked typing invariant); `I-05` `Validity≠Outcome`
  (supported); `I-06` Knower-not-in-observed-state (supported candidate, already-tracked `𝒩∉K`); `I-07`
  Reality≠Observation (supported); `I-08` Observation≠Interpretation (supported candidate, already-tracked
  `C14`, file 1106); `I-09` observation-status preservation (candidate); `I-10` semantic-state preservation
  under selected transformations (open); `I-11` provenance-sensitive preservation (open); `I-12` universal
  observer-independent state invariant ("open/likely too strong").

  **DELIVERS THE PRECISE ORIGIN OF THE ALREADY-TRACKED `I-V` INVARIANT (`CORPUS-SUPPORTED`, "one of only two
  invariants testable today," already-tracked across files 1104/1109/1111)**: `I-05`/`I_ADM` here proposed
  as "Validity≠Outcome," "Admissibility is evaluated from the applicable Preconditions, Invariants, Authority
  and NOT from the eventual outcome," with the precise, disciplined refinement rejecting an earlier weaker
  notation: "This should NOT be expressed as `Outcome⊥Valid`... The correct formulation is predicate-level:
  `Outcome(o)` is NOT A CONJUNCT of `Admissible(o,K)`."

  **DELIVERS THE ORIGINAL FOUR-CLASS INVARIANT TAXONOMY**, the direct ancestor of the already-tracked
  "`𝓘` is NOT one mathematical object" finding (already-tracked, file 1117's headline 13's "layer invariants
  hold statically, with no `δ`; forcing them into the transition schema makes them vacuously true. Merging
  them under one symbol is a category error"): Identity invariants (`𝒩` persistence, provenance), Typing
  invariants (`Command≠δ`, `𝒩∉K`), Transition invariants (`P(K_t)→P(K_{t+1})`, admissibility, lineage), and a
  proposed fourth class, Layer invariants (`Reality≠Observation`, `Observation≠Knower`, `Observation≠
  Interpretation`). Explicitly flags "whether these all legitimately belong to one mathematical object `ℐ`
  is itself a Step-287 RESEARCH QUESTION" -- directly anticipating the already-tracked later finding that
  `ℐ` is not one object.

  **DELIVERS THE ORIGINAL, PRECISE FALSIFICATION PROTOCOL**: for each candidate `P`, find a witness `K_0,o`
  such that `P(K_0)` holds, `¬P(δ(K_0,o))`, and `Admissible(o,K_0)` -- explicitly noting "an invariant that
  only survives BECAUSE NO ADMISSIBLE TRANSITION HAS BEEN TESTED is not established," the direct methodological
  ancestor of the already-tracked disciplined falsification-attempt requirement applied throughout Steps
  288-291's already-tracked negative-results ledgers.

  **DELIVERS THE FULL, EXPLICIT "WHAT STEP 287 MUST NOT DO" LIST (§22)**, a ten-item prohibition catalogue
  including several already-tracked standing disciplines at their origin: "assume semantic equality includes
  `Π`" (already-tracked Decision 3); "assume observational equality without defining the observation set"
  (already-tracked `𝒪_K` blocker); "repair rejected `Θ` constructions... introduce `𝒦_ātma`... introduce a
  universal Knower into the formal KnowledgeOS model" (already-tracked `RX` rejections, file 2227).

  Confirms the disciplined final boundary statement (§26): "Step 286: Ontology ⇓ Step 287: Invariant Research
  ⇓ Future step: Invariant Canonization" -- and the explicit recommendation, matching the already-tracked
  final status: "write Step 287 now, but label it explicitly `RESEARCH/FALSIFICATION`, not `CANONICAL`...
  do NOT let an apparently obvious formal object become canonical merely because the architecture needs a
  name for it."
