defines:
  - concept: "The formalized kernel-reduction problem (ρ:𝒦_8→𝔎_5)"
    definition: "The precise mathematical question of how the earlier, historically-prior eight-element kernel 𝒦_8=(E,S,T,O,P,R,Π,A) (discovered at 0863) relates to the later, theoretically-derived five-element kernel 𝔎_5=(G,σ,θ,λ,π) (derived at 0856-0861): a candidate reduction map ρ:𝒦_8→𝔎_5 is proposed, and its properties must be established rather than assumed -- injectivity (no primitive distinction from the historical kernel is lost in the reduction), surjectivity (every component of the later kernel has a genuine historical predecessor, rather than being invented independently), and bijectivity (the two kernels are informationally equivalent). The central open question SemanticLoss(ρ)=? is explicitly connected to the repaired semantic-integrity framework from 0862, giving a formal semantic-adequacy criterion: the reduction is adequate iff the critical semantic distinctions of the historical kernel are either recoverable from its image under ρ, or their loss is explicitly declared. This is the reconstruction's first fully rigorous formal treatment of the relationship between two independently-arising candidate kernels within a single model's corpus, directly relevant to the eventual gated (§29) canonical Kernel synthesis"
  - concept: "The Ksetrajna cross-corpus lineage finding"
    definition: "A specific, named archaeological finding that the Sanskrit term/concept Kṣetrajña (roughly, 'knower of the field,' a term with established usage in the Bhagavad Gita, notably Chapter 13) is the ONLY concept identified across this model's corpus that appears BOTH in the formal (mathematical/architectural) material AND in the repository's own governance/constitution material, under a consistent Sanskrit-derived lineage. This is presented as materially stronger evidence of a genuine conceptual connection between the Gita and the architecture than the much more common pattern of asserting a resemblance or analogy without any shared naming lineage -- but the file is careful to classify this as historical evidence of a conceptual lineage (i.e., the term's usage can be traced across artifacts) rather than as evidence of mathematical derivation (i.e., it does not claim the Gita mathematically generated any specific formal structure)"
