    refinement: "SHARPENS the minimality question specifically: Minimality=NOT YET COMPUTABLY ESTABLISHED is explicitly reclassified as a correct research status rather than a defect, and TestMinimal(K)≠ProveMinimal(K) formally explains why the removal-test tables built throughout 0888-0893 (however rigorously conducted) can never by themselves constitute a minimality proof -- directly retroactively contextualizing those tables' epistemic weight"
  - concept: "0893's rejection of KnowledgeOS=ProbabilityDistribution and 0889's F_E candidate"
    refinement: "GENERALIZES the specific probability-distribution objection into the general StatisticalFormula≠ComputableKnowledgeOSQuantity principle and the Uncertainty-is-not-computable-until-its-semantics-are-fixed finding, giving both a fuller formal justification via the Step-246 mandate's checklist (parameter, observable, model, assumptions, identifiability, estimator, uncertainty, actual data)"
  - concept: "0894's provenance-reference/provenance-object distinction"
    refinement: "APPLIED concretely: ProvenanceLookup=COMPUTABLE under stated infrastructure assumptions, but lookup≠validation (Resolve(π) being computable does not establish ProvenanceTruth(π)) -- extending 0894's placement recommendation with its computability consequence"
