defines:
  - concept: "The Three-Layer Architecture"
    definition: "A structural decomposition of the entire KnowledgeOS theory into three layers by computability character rather than by domain topic: (1) the FORMAL/DETERMINISTIC CORE, containing typing, identity references, canonicalization, equality, membership, transition validation, replay, and hashing -- operations that are computable given effective representations; (2) EXTERNAL/PARAMETRIC SEMANTICS, containing policy, evidence, time, the provenance store, authority, and measurement regime -- inputs that must be supplied from outside the deterministic core but which the core's operations are computable RELATIVE TO once supplied; (3) the NORMATIVE/ASSESSMENT BOUNDARY, containing truth assessment, relevance, adequacy, authority assignment, epistemic judgment, and unresolved statistical assumptions -- genuine human/normative judgments that must not be falsely represented as deterministic unless an actual decision procedure is defined for them. The architecture does not exclude layer 3 from KnowledgeOS; it requires that layer 3's non-deterministic character be made explicit and auditable rather than hidden inside code or notation that implies determinism"
  - concept: "ComputableCore vs JudgmentBoundary"
    definition: "The file's proposed replacement for the goal of making 'everything' computable: KnowledgeOS should explicitly define a ComputableCore, which guarantees that given the same formal inputs, the same result follows (full determinism), and a separate JudgmentBoundary, which guarantees only that a decision is recorded, attributed, contextualized, and auditable (not that it is deterministic or computable). This is presented as strictly more defensible than either (a) falsely claiming the whole theory is computable, or (b) abandoning computability rigor altogether, because it lets KnowledgeOS make precise, honest claims about exactly which parts of its behavior are guaranteed reproducible and which parts are governed, accountable human judgment"
