about: >
  A rigorous "philosophical-interpretation study run alongside KR-CONTR-2026-09" (the KR-SIM lane's
  contradiction-representation experiment, outside this reconstruction's primary scope). Independently
  applies a discipline nearly identical to this reconstruction's own already-tracked Gītā-thread rule
  (Gītā-term→hypothesis→test→architecture, never Gītā-term→primitive), but reads SIX DIFFERENT chapter
  loci than the ones extensively tracked in this reconstruction's own Gītā thread (files 2234-2321,
  which worked chapter-by-chapter across all 18 chapters for kernel-operator discovery): here the focus
  is narrowly contradiction/paralysis/decision, using 1.28-47 (viṣāda), 2.6-7, 2.45/7.27/15.5 (dvandva),
  4.40/6.39 (saṃśaya), 14.5-10/18.40 (guṇa), and 18.63.

  **DELIVERS THE EXPLICIT THREE-OUTPUT TYPING DISCIPLINE**: a philosophical reading may produce exactly
  three kinds of output -- question (may direct an experiment, never assert an answer), lens (may make a
  distinction visible, never become the thing it makes visible), corroboration (may agree from outside
  with something already derived, never serve as evidence for it). "A fourth kind -- entity -- is not
  produced. Where a reading looks like it yields an entity, that is the ban firing, and it is recorded as
  a refusal."

  **DELIVERS LENS L-1 -- 'INFORMED PARALYSIS'** (1.28-47, 2.1): Arjuna's viṣāda state is explicitly not
  uncertainty, not absence, not insufficient evidence, not unobservability, not non-assessment -- "a
  state may be complete in evidence and still non-actionable. Non-actionability is therefore not a
  deficit of evidence and cannot be repaired by acquiring more." Explicitly framed: "that is the
  protocol's required-distinction list, arrived at independently and about 2,000 years earlier. It is
  corroboration of the distinctions, not evidence for any representation of them."

  **DELIVERS CORROBORATION C-1** (2.7): Arjuna locates his confusion in dharma (the normative model)
  specifically, not in perception or evidence -- corroborates "EvidenceConflict≠ClaimContradiction≠
  ModelConflict" from KR-CONTR-2026-09 §12, "sustained... for eighteen chapters."

  **DELIVERS CORROBORATION C-2** (2.6, "nor do we know which of the two is the weightier"): "not doubt
  about facts. The absence of a comparative ordering over options" -- corroborates the programme's open
  item ⪰ (the epistemic-status ordering, already-tracked-elsewhere in this KR-SIM-adjacent research as a
  central open blocker) ONLY, with an explicit discipline note: "the programme has already ruled that
  N_eff and ⪰ are independent. This locus is corroboration for ⪰ only... must not be recruited for it."

  **DELIVERS LENS L-2 -- 'THE FRAME, NOT THE VALUE'** (2.45/7.27/15.5, dvandva/dvandva-atīta): the text's
  prescription for an opposed pair is neither picking a side, averaging, nor adding a third term, but
  changing the frame in which the pair was posed. Explicitly: "this is a lens on the fourth-value
  question, and it must not be read as an answer to it. KR-CONTR-2026-09 §9 reaches a structurally
  similar conclusion -- the obstruction is not the number of values -- by proof, from the evaluation-
  outcome family. The lens made the question askable; the theorem is what settles it. Reversing that
  order would be exactly the banned derivation."

  **DELIVERS CORROBORATION C-3 AND AN EXPLICIT CANONICAL-DISCOVERY DISCIPLINE APPLICATION** (4.40, 6.39,
  saṃśaya): "the Gītā treats saṃśaya and viṣāda as two distinct pathologies with two distinct remedies" --
  corroborates Contr≠Unknown. Critically, explicitly invokes ES-005.4 (consume or extend, never create a
  second): "the corpus already holds saṃśaya as a Candidate, extracted from Nyāya" -- citing a specific,
  dated, named corpus source file: `20260822-0218-tarka-shastra-nyaya-epistemology-research-extraction.md`
  (flagged as a bridge candidate to material this reconstruction may have already tracked earlier in its
  own reading order, given the August date predates this window's coverage). "This study therefore does
  NOT introduce a second saṃśaya candidate. It extends the existing one with a contrast the Nyāya
  extraction does not carry: saṃśaya initiates inquiry; viṣāda halts it. Same family, opposite dynamics."

  **DELIVERS LENS L-3 -- 'PROPORTION, NOT SELECTION'** (14.5-10, 18.40, guṇa): Sattva/Rajas/Tamas coexist
  in every state, differing in proportion, each prevailing by suppressing the other two -- a lens on
  KR-CONTR-2026-09 §11's finding that contradiction has internal structure (10 subtypes under a
  structured representation vs 2 classes under a flat one). "Explicitly NOT concluded: that KnowledgeOS
  should adopt a three-component proportion vector."

  **DELIVERS CORROBORATION C-4, EXPLICITLY 'THE STRONGEST IN THIS STUDY'** (18.63, "having reflected on
  this fully, do as you wish"): after seventeen chapters, the text resolves Arjuna's contradiction not by
  deriving an answer but by handing resolution back as a decision -- "exhaust the evidence, then decide.
  Not: keep gathering evidence until the answer appears." Corroborates evidence≠decision, described as
  independently derived FOUR TIMES already in the (KR-SIM-adjacent) programme (factivity/R1, FR-001's
  freeze, adopting M3≅M4, adopting 𝓑), with KR-CONTR-2026-09 §21 adding two more (ℛ_req and the frame
  qualifier φ). "It is corroboration, not evidence. The programme derived this from its own failures; the
  Gītā agrees with it. Agreement from outside is worth recording and is worth nothing as proof."

  **DELIVERS THE 'WHAT THE GĪTĀ DOES NOT SUPPLY' TABLE**: no definition of Contr; no frame qualifier φ
  content (only "change the frame," not which features); no value-domain cardinality guidance; no
  ordering ⪰ (2.6 states its absence as the problem, "naming a problem is not solving it"); no kernel
  capability whatsoever.

  **DELIVERS A TEN-ROW CORROBORATION MAP WITH AN EXPLICIT HONESTY CHECK**: "four of ten findings get
  nothing from the text, and the two most technically load-bearing are among them [minimum-structure-
  is-a-pair-containing-reason; chi-ranges-3-to-21]. That is the expected shape of an honest corroboration
  study. A source that corroborated everything would be being read into, not read." This is a
  methodologically important self-check against confirmation bias, directly comparable to this
  reconstruction's own governing discipline.

  **DELIVERS A SIX-ITEM TYPED CANDIDATE REGISTER** (G-1 through G-6), each explicitly typed lens/
  question/corroboration with a named promotion condition (never automatic): G-1 informed paralysis
  (lens, [PROP], promoted only if KnowledgeOS must act on the distinction not merely represent it); G-2
  the confusion's layer is nameable (question, [OPEN], promoted by an experiment on whether `reason` must
  carry a layer field); G-3 viṣāda extends the existing saṃśaya candidate (lens, [PROP], promoted by a
  second independent ES-006.1 adopter); G-4 frame-change (lens, [PROP], promoted by a formal definition
  of φ, "at which point it stops being a lens"); G-5 proportion-not-selection (lens, [OPEN], promoted by
  evidence subtypes are graded, contradicting KR-CONTR's discrete finding); G-6 exhaust-evidence-then-
  decide (corroboration, [EXT], explicitly "nothing -- it is already derived internally. Recorded so it
  is not re-derived from the text"). Explicit refusal list: dharma, guṇa, kṣetra/kṣetrajña, dvandva-atīta-
  as-operator, viṣāda-as-state-value -- "each of these would be an entity, and the ban forbids the chain
  that produces it."

  **DELIVERS THE EXPLICIT, ARGUED KERNEL VERDICT -- 'THE GĪTĀ SUPPLIES NO KERNEL CANDIDATE. NOT ONE.'**,
  with a four-point argument: (1) contradiction is already classified "K2 -- derivable from existing
  candidate powers, requiring a new representation, not a new capability. A philosophical source cannot
  overturn a derivability result"; (2) "C-1 is binding: do not put a mechanism into the kernel merely
  because KnowledgeOS can use it. Textual resonance is a much weaker warrant than usability, and
  usability already fails"; (3) the derivation ban structurally forbids the Gītā-to-kernel-power chain;
  (4) "the programme's record is consistent: across the whole corpus the Gītā's productive contribution
  has been questions and lenses, never entities -- and the one derivation it did produce, the Zero/Śūnya
  chain, was earned by 1,620,000 assignments, NOT BY THE READING." This is an INDEPENDENT, ARGUED
  confirmation (via a completely different chapter selection and a proof-driven experimental grounding)
  of this reconstruction's own already-tracked Gītā-thread finding (files 2291/2293's "FULL GĪTĀ TRACK
  CLOSED, 18/18 chapters, ZERO new primitives"), and directly parallels file 2328's independent D-1
  confirmation of the same underlying result.

  **DELIVERS FIVE EXPLICIT NON-CONCLUSIONS**: not that Gītā supports four-valued logic; not that viṣāda
  should become a state/value/type; not that dvandva-atīta is an operator; not that outside corroboration
  strengthens a KnowledgeOS result ("a result derived from 20,000 trials and a deterministic witness suite
  is exactly as strong after this document as before it"); not that the absence of kernel candidates is a
  failure of the study -- "it is the study's most disciplined output."

  **CLOSES REAFFIRMING THE GOVERNING RULE**: "the strongest statement made must never exceed the strength
  of the available evidence... a philosophical text is corroboration at best and decoration at worst. It
  earns its place here by making one distinction askable that the programme then settled by proof -- and
  by agreeing, from 2,000 years away, that some things are decided rather than derived." This is the same
  rule this reconstruction's own protocol.md adopts (confirmed in file 2323) as its own non-negotiable
  #7, here independently reaffirmed by a differently-scoped companion research effort.
