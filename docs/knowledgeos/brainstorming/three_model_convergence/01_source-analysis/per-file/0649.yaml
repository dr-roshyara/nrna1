defines:
  - concept: "AgentCount≠EvidenceCount"
    definition: "The number of AI agents agreeing on a proposition is not the same as the number of independent evidence paths supporting it; agents sharing a foundation model, training data, retrieval source, or pipeline stage can agree unanimously while contributing only a single effective independent confirmation"
  - concept: "The self-reinforcing knowledge failure mode"
    definition: "An AI-generated claim p, once stored, can be retrieved and cited by a later AI to produce a derivative claim p', which a subsequent process may incorrectly treat as independent support for the original p, artificially amplifying confidence in a claim using only its own prior output as evidence — corrected by requiring every derived artifact to preserve its DerivedFrom lineage and never count as independent evidence of its own ancestor"
  - concept: "Error-amplification coefficient λ"
    definition: "λ=ExpectedDownstreamFalseSupport/InitialFalseSupport; λ>1 indicates the multi-agent system actively amplifies an initially unsupported false claim through repeated AI-to-AI reproduction, motivating an explicit Independent-source policy (N_independent≥k) for high-consequence claims"
  - concept: "Untraceable agreement is not equivalent to independent confirmation"
    definition: "A stored consensus figure (e.g. '17 votes') without accompanying provenance/lineage metadata cannot be trusted as evidence of independent confirmation and must be treated as ConsensusEvidenceQuality=Unknown rather than strong support"
