defines:
  - concept: "Distributed convergence theorem (candidate)"
    definition: "If two KnowledgeOS instances share the same event set H, ontology Ω, epistemic contract EC, and assessment model M, deterministic derivation produces semantically equivalent KnowledgeStates: Derive(H_A,Ω_A,EC_A,M_A)≡Derive(H_B,Ω_B,EC_B,M_B)"
  - concept: "Convergence≠Consensus"
    definition: "Two independently synchronizing KnowledgeOS nodes converge on agreement about the epistemic state (including recognized, unresolved conflicts) — not necessarily on agreement about which assertion is true"
  - concept: "EventHistory can be monotonic while DerivedKnowledge can be non-monotonic (distributed instance)"
    definition: "Raw event-history union H_1⊔H_2=H_1∪H_2 is commutative/associative/idempotent (CRDT-like), but K=Derive(H) does not automatically inherit these properties due to temporal state, retraction, conflict resolution, authority, and policy in the derivation step"
  - concept: "Ten-step distributed Merge algorithm"
    definition: "Union event histories → Deduplicate → Preserve provenance → Establish causal relationships → Resolve ontology/version compatibility → Re-derive assertions → Detect equivalence/refinement/conflict → Recalculate assessments → Recalculate current KnowledgeState → Record unresolved integration issues"
refines:
  - concept: "0587's KnowledgeMeaningIdentity/KnowledgeRecordIdentity split"
    refinement: "Reconfirmed and extended to the distributed setting: independent systems A and B can share KAID (same meaning) while carrying distinct RecordIDs, formally grounding independent corroboration under merge"
  - concept: "0589's disciplined non-overclaiming for the state-transition layer (universal monotonicity/commutativity/associativity explicitly not claimed)"
    refinement: "Directly echoed and extended to the distributed layer: raw event-history union genuinely IS commutative/associative/idempotent, but the derived KnowledgeState explicitly is NOT — the corpus's most precise localization yet of exactly which layer carries the strong algebraic guarantees"
  - concept: "0562's/0578's/0580's/0588's evidence-independence-via-provenance discipline"
    refinement: "Extended into the multi-bounded-context setting: independence must be derived from provenance, not organizational separation, via a concrete shared-vendor-document example"
  - concept: "0566's/0589's DDD ownership/bounded-context and no-single-aggregate discussion"
    refinement: "Extended into a full no-universal-ontology principle (Ω per bounded context, explicit cross-context mappings) and the new insight that the mappings themselves require provenance as first-class epistemic objects"
