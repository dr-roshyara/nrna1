  - concept: "Proposition≠Claim"
    definition: "A proposition (S,R,O) is truth-apt logical content that could be true or false in itself; a claim represents that same proposition together with its current epistemic status, confidence/probability, and provenance information — the proposition is the content, the claim is the epistemically qualified assertion about it"
  - concept: "Atomicity (FailedTransition⇒NoPartialDomainMutation)"
    definition: "If a command/transition fails, the domain state after the attempt must be identical to the state before it (X_before=X_after) — no partial mutation may be observably committed on failure"
  - concept: "The specification-vs-execution distinction (this file's central self-awareness)"
    definition: "Passing an architectural derivation test for a detailed specification (STEP 55 — PASS) is categorically different from the specified reference implementation itself having been built and executed; the corpus explicitly declines to claim the latter until it actually happens"
  - concept: "Do not patch the test to hide the failure"
    definition: "If a genuine counterexample is found during the KOS_ref experiments (a valid transition that violates an invariant), the correct response is to treat it as evidence the architecture itself needs correction, never to alter the test so the failure no longer surfaces"
