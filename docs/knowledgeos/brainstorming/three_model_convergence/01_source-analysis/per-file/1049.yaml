about: >
  "Step 289: dependency graph -> cycles -> minimal feedback vertex set (bootstrap cut)," a genuinely
  sophisticated executable Python instrument, the first artifact in a new `research/step-289/` package
  following the closure of the `step-288/` equality-research package (files 1041-1048).

  **Formalizes nearly the entire equality/kernel research programme as a rigorously audited dependency
  graph**: 41 directed edges over roughly 20 nodes (`O`,`T`,`O_K`,`equiv`,`approx`,`delta`,`congruence`,
  `minimality`,`K`,`equiv_T`,`identity`,`id_context`,`Pi`,`bindings`,`canonicalization`,`struct_eq`,
  `evidence`,`merge`,`state_rep`,`invariants`,`sufficiency`,`kernel`,`assertion`,`temporal`,`policy`,
  `Qualify`,`projection`), EVERY EDGE INDIVIDUALLY CITED to either a specific corpus locus or explicitly
  marked `DERIVED`, with an explicit discipline rule: "A and B are mentioned together is NOT an edge (mandate
  section 4)." Directly encodes, as formal graph edges, dozens of findings this reconstruction has tracked
  across the equality-research arc: the `equiv`/`approx` formula-identity mutual entanglement (the already-
  tracked N-1 conflict, files 1041, 1047, now literally represented as a two-way graph cycle); `261.23`'s six
  conditions each as a directed edge into `kernel`; the `Qualify`-blocks-`projection` edge; `merge`'s
  equality-relative idempotence.

  **Computes ELEMENTARY CYCLES via exhaustive DFS** over this graph (not sampled), confirming the programme's
  dependency structure is genuinely circular, not merely deep.

  **DELIVERS A GENUINELY NEW, RIGOROUS FORMAL DISTINCTION**: partitions nodes into RESOLVABLE (governance-
  decidable, twelve named: `O`,`T`,`O_K`,`equiv`,`delta`,`Pi`,`id_context`,`assertion`,`temporal`,`evidence`,
  `policy`,`Qualify`, each with an explicit mechanism/reason -- most `NORMATIVE`, `Qualify` alone marked
  `G1` irreducible) versus DERIVED_ONLY (fifteen named, which follow automatically once the resolvable nodes
  are fixed: `approx`,`congruence`,`minimality`,`K`,`equiv_T`,`identity`,`bindings`,`canonicalization`,
  `struct_eq`,`merge`,`state_rep`,`invariants`,`sufficiency`,`kernel`,`projection`).

  **COMPUTES THE EXHAUSTIVE MINIMAL FEEDBACK VERTEX SET (bootstrap cut)** restricted to the RESOLVABLE nodes
  -- the smallest possible set of governance decisions that, once taken, would render the entire dependency
  graph acyclic (i.e., would genuinely unblock the programme). This is a rigorous, computational formalization
  of the already-tracked N-4 "master gate" finding (file 1047), moving from an informal observation ("N-4
  gates N-3, N-5, N-11") to an exhaustive, provable minimal-cut computation over the FULL dependency structure
  -- a qualitatively more rigorous instrument than any prior gap-priority finding in this reconstruction's
  tracking. Also explicitly tests specific candidate cuts including `{O,T}` alone, to determine whether the
  already-suspected operation/transformation pair is sufficient by itself.

  **Closes with an explicit scope discipline**: "the graph is the AUDITED EDGE LIST above. A different edge
  list gives a different cut. No operation set, transformation semantics or equality is proposed" -- this
  script computes structure, not content; it does not itself resolve any decision.
