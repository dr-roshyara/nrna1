about: >
  **Delivers the Evidence Execution Protocol (EEP), an eight-stage sequence (`E1` Claim through `E8`
  Report), arguably the single most concrete and directly operational specification produced anywhere in
  this reconstruction**, crystallized around the crisp central principle: "an agent must prove an
  architectural claim from evidence; it must not prove it from plausibility." Delivers `E1` Claim with a
  falsifiability requirement and a clean six-way claim-type taxonomy (Structural/Behavioral/Governance/
  Temporal/Assurance/Operational); `E2` Locate with the negative-evidence rule crisply reconfirmed
  (`NotFound(Location)≠Absent(System)`, directly extending 0693's/0694's negative-evidence discipline);
  `E3` Inspect distinguishing `DeclaredArchitecture`/`ImplementedArchitecture`/`VerifiedBehavior` as
  distinct evidence types; and `E4` Trace with **a genuinely valuable five-level Traceability-strength scale
  (`T0` No link through `T4` Verified causal/implementation relationship)**, the most granular such scale in
  this reconstruction, directly extending 0687's/0700's/0701's traceability-evidence disciplines.

  Delivers `E5` Test with a clean six-type test hierarchy (Static/Unit/Integration/Architecture/Deployment/
  Runtime) and `E6` Observe requiring genuine runtime inspection for operational claims (a "runs rootless"
  claim explicitly requiring runtime evidence, not merely a configuration file). Delivers `E7` Classify with
  the `FACT|INFERENCE|TARGET|GAP` four-way epistemic classification precisely defined with concrete
  examples for each, directly crystallizing 0705's/0706's epistemic-classification work into an operational
  reporting standard, and `E8` Report with a concrete eight-field structured report format
  (`CLAIM/FACTS/EVIDENCE/INFERENCE/VERIFICATION/GAP/TARGET/CONFIDENCE`) and a full worked example --
  "this format prevents architectural contamination."

  Delivers a practical investigation-artifact ID convention (`CLAIM-042`, `EVIDENCE-091`, `TEST-017`,
  `FINDING-008`, `DECISION-031`) making "the graph machine traversable," a formal Evidence object schema, and
  Evidence immutability (corrections create `E_2` rather than silently overwriting `E_1`, directly extending
  0672's/0677's historical-immutability discipline).

  **Delivers a five-level ordinal Confidence scale (`C0` Unknown through `C4` Verified), explicitly and
  precisely rejecting arbitrary LLM percentage-confidence as a substitute**: "an LLM saying 'I'm 95% sure'
  does not establish a quantitative probability... `LLMConfidence≠EvidenceConfidence`" -- directly and
  precisely extending 0687's/0694's/0704's evidence-derived-confidence discipline with a clean ordinal (not
  false-precision cardinal) scale, a genuinely valuable and currently applicable AI-evaluation principle.

  **Delivers the Agent stopping rule, directly and usefully extending 0699's meta-methodological "a negative
  finding is valuable, not a failure" principle into the agent's own reporting behavior specifically**: "I
  found the rule and implementation reference, but no executable verification. Therefore implementation is
  supported, enforcement is unverified. **This is a successful investigation, not a failure.**" Delivers the
  crisply formalized **Anti-hallucination rule**: "If evidence is insufficient, the agent MUST preserve
  UNKNOWN. It must not fill the gap using general knowledge" -- a sharp, currently critical AI-safety
  principle directly extending the corpus's central epistemic-honesty discipline into mandatory agent
  behavior.

  Delivers five Investigation modes (Architecture reconstruction/Governance verification/Assurance
  verification/Runtime verification/Knowledge reconstruction) as a clean task-structuring taxonomy, and
  Avoid-name-based-conclusions reconfirmed with a concrete five-question diagnostic checklist for any
  suspiciously-named service (`Who calls it? When? What happens if it fails? Is the result persisted? Can it
  be bypassed?`), directly extending the corpus's naming-proves-nothing family into an actionable
  investigative procedure.

  **Delivers the Enforcement test crystallized as the single most important diagnostic question for real
  security/governance auditing -- "Can the invariant be bypassed?"** -- directly and precisely extending
  0693's/0703's deterministic-enforcement discipline, culminating in **the file's single most operationally
  valuable deliverable: a complete per-constitutional-rule Bypass matrix, functioning as a genuine "red-team"
  test suite for the ratified Constitution (0705)**, pairing each of `C1`-`C7` with both a Primary test and
  an explicit Bypass test (e.g. `C1`: provenance required / direct-persistence bypass; `C2`: authority
  required / unauthorized-promotion bypass; `C7`: feedback path exists / finding-dead-end bypass) --
  "this is becoming a practical assurance suite," one of the most directly reusable artifacts produced
  anywhere in this reconstruction.

  Delivers a ten-item Agent execution contract (a concrete, literally followable checklist for any
  engineering agent) and Claude/Codex symmetry precisely clarified: "the important symmetry is NOT identical
  configuration. It is: `SameAuthority+SameEvidenceRules+SameConstitution+SameEpistemicDiscipline`" --
  directly extending and sharpening 0690's/0700's/0705's/0706's pointer-layer/symmetry discipline with a
  precise definition of what symmetry actually requires (behavioral/epistemic, not configuration-level).
  Delivers a concrete illustrative seven-directive `AGENTS.md` contract and parallel `.claude/`/`.codex/`
  treatments (the most concrete illustrative agent-instruction template in this reconstruction) and a full
  Evidence Execution Report template.

  **Delivers a precise, currently important critique of naive LLM-evaluation metrics, reframing agent
  evaluation around evidence quality rather than answer quality**: "a highly articulate but unsupported
  answer should score poorly. A cautious, evidence-backed answer should score highly," formalized as
  `AgentAssuranceScore=f(EvidenceCompleteness,Traceability,Verification,EpistemicDiscipline)` -- "much more
  useful than measuring only `LLMAnswerSimilarity`" -- directly and genuinely extending the corpus's
  deterministic-assurance discipline into agent-performance-evaluation specifically, with
  `WeightedCompleteness` ensuring a critical missing link (e.g. Authority) is not diluted by many present-
  but-non-critical technical links, directly extending 0699's/0702's/0705's Vector>Scalar/weighted-evidence
  discipline.

  Delivers the Evidence graph (`Claim→^{supportedBy}Evidence`, `→^{verifiedBy}Test`, `→^{observedAt}
  Runtime`, `→^{interpretedAs}Finding`, `→^{classifiedAs}Status`) with the elegant recursive observation that
  "the process of understanding the architecture becomes part of KnowledgeOS knowledge," directly
  crystallizing into **the recursive property "KnowledgeOS can use its own evidence protocol to verify
  KnowledgeOS"** (`KnowledgeOS→SelfObservation→SelfVerification`, "the beginning of self-assuring
  architecture"), illustrated with **the closest thing to an actual executable check specification anywhere
  in this reconstruction**: `Query: AuthoritativeDecision WHERE Provenance=NULL. Result: 0. Then: C1=PASS` --
  explicitly and correctly identified as "far stronger than documentation stating 'all decisions have
  provenance.'"

  **Delivers a Constitutional health check concept with the first REALISTIC, NON-UNIFORM illustrative
  dashboard result in this entire reconstruction**: a worked example showing `C1/C2/C3/C5=PASS`,
  `C4/C6=WARN`, `C7=FAIL` -- the first time an illustrative constitutional/conformance dashboard in this
  corpus shows a genuinely mixed, partial result rather than either uniform success or uniform blank
  placeholders, a small but notable maturation in the corpus's own illustrative style. Delivers the
  recurring, precisely restated caution against single-score reduction (an `87%` aggregate could conceal a
  catastrophic authority failure, directly restating 0699's/0702's/0705's Vector>Scalar discipline), and
  **the newly and precisely named concept of `Constitutional drift`**: a regression where a previously-
  satisfied rule (`C_1: PASS→FAIL`) fails in a later release -- "it should itself become an observable
  event" -- a valuable refinement of 0692's drift taxonomy specifically for temporal regression of
  constitutional conformance, distinct from 0689's/0692's static governance-drift concept (approved-rule-
  versus-actual-control) and from 0704's knowledge-drift concept (documentation-versus-reality staleness).

  Delivers the Self-governance loop (`KnowledgeOS→ConstitutionalCheck→Finding→Governance→Remediation→
  Verification→KnowledgeOS`), "the system applying its own operating principles to itself," directly
  consolidating and closing the recursive-governance property introduced at 0706 (`Constitution⊂
  AuthoritativeKnowledge`).

  Delivers Step 122's verdict, notably confident given the file's concreteness: "STEP 122 — EVIDENCE
  EXECUTION PROTOCOL: DEFINED... this gives Claude and Codex a common engineering-evidence discipline
  without duplicating KnowledgeOS knowledge into their local harnesses" -- consistent with the corpus's
  calibrated pattern (the protocol is fully specified but not itself executed within this file).

  **Closes by opening "Step 123 — Self-Verification of KnowledgeOS,"** naming a concrete test suite,
  **`KOS-SV-01`**, with seven test families directly mapped one-to-one onto the ratified Constitution
  (`SV_1`=Provenance through `SV_7`=Feedback), posing the decisive question: **"Can KnowledgeOS produce
  machine-verifiable evidence that its own constitutional rules are currently satisfied?"** -- explicitly
  framed as the foundation for "KnowledgeOS as a self-assuring engineering system rather than merely a
  governed knowledge platform," via the progression `KnowledgeOS→Self-Knowledge→Self-Verification→Self-
  Governance`. No actual code execution, repository inspection, or verified filesystem/relationship claim is
  reported anywhere in this file.
