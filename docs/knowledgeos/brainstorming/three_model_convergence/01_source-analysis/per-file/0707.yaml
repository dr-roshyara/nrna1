defines:
  - concept: "NotFound(Location)≠Absent(System) (negative evidence rule)"
    definition: "Failing to find evidence of a capability in the locations searched does not establish that the capability does not exist anywhere in the system; an agent must report 'no evidence found in the inspected locations,' never the stronger and unjustified 'the capability does not exist'"
  - concept: "The Bypass matrix"
    definition: "For each constitutional rule (C1-C7), a paired Primary test (confirming the rule's mechanism exists) and Bypass test (actively attempting to circumvent the mechanism, e.g. direct database persistence bypassing a provenance service, or unauthorized promotion bypassing an authority check) — together forming a practical, reusable assurance/red-team test suite"
  - concept: "AgentAssuranceScore"
    definition: "A function of EvidenceCompleteness, Traceability, Verification, and EpistemicDiscipline used to evaluate an AI agent's investigative output — deliberately not a function of answer fluency or LLM-answer-similarity, since an articulate but unsupported answer should score poorly while a cautious, evidence-backed answer should score highly"
  - concept: "Constitutional drift"
    definition: "The specific temporal-regression phenomenon where a constitutional rule that was previously satisfied (PASS) in an earlier release becomes violated (FAIL) in a later release; this regression should itself be treated as an observable, reportable event, distinct from static governance drift (approved rule vs. actual control) and knowledge drift (documentation staleness relative to reality)"
