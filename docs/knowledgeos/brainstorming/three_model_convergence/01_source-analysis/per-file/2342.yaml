about: >
  Tests Reiter's unique-names axioms (do(a_1,s_1)=do(a_2,s_2)⊃a_1=a_2∧s_1=s_2, "syntactic identity of
  constructed terms... complete, decidable at the term level, exactly what a history needs") against the
  corpus's own ≡_sem (semantic equivalence of knowledge contents) -- "a different question at a
  different level."

  **DELIVERS THE REFUTATION**: "[NEG] P5 REFUTED. Reiter provides no bridge from syntactic term identity
  to semantic equivalence, and does not claim to."

  **DELIVERS AN IMPORTANT EPISTEMIC-HYGIENE PRINCIPLE**: "what must not be inferred: ≡_sem is OPEN and
  NOT refuted. The standing instruction holds: it must not be asked a question it was not designed for.
  Reiter's silence on it is not evidence against it." This explicitly guards against conflating "an
  external source does not address X" with "X is refuted" -- a distinction with broad methodological
  applicability beyond this specific case.

  **DELIVERS THE GENUINE NEW SYNTHESIS -- A THIRD EQUIVALENCE LEVEL, NAMED FOR THE FIRST TIME**: A5
  ("observational equivalence does not imply situation identity -- two situations with identical fluent
  values remain distinct") yields: "[EXP] NEW SYNTHESIS: this gives the programme a third equivalence
  level to keep apart, where it previously tracked two: syntactic identity (unique names) ≠
  observational equivalence (same fluent values) ≠ semantic equivalence (≡_sem, OPEN). The middle level
  was not previously named in the corpus. Naming it is useful; it resolves nothing, and ≡_sem remains
  exactly as open as before." This directly bears on this reconstruction's already-tracked four-relation
  equality apparatus (=,≡,≈_X,≅_λ) from earlier project phases -- "observational equivalence" is a strong
  candidate correspondence to the already-tracked ≈_X (observational-equivalence) relation, now given an
  independent naming and worked counterexample (two situations, identical fluent values, distinct
  identity) from a completely different formal source.

  **CLOSES WITH THE EXPLICIT NON-BEARING DECLARATION**: "Step 288/290's equality work is untouched.
  Reiter must not be cited as bearing on it."
