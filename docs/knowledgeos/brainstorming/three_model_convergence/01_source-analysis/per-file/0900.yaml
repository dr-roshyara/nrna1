title: "Step 271 -- Policy Semantic Minimality and Assessment Boundary: Delivers the Formal, EXPLICITLY FALSIFIABLE Boundary Hypothesis H_271 (KnowledgeOS Core Defines Only Semantic Interfaces; Policy/Measurement Regimes Stay External Unless Evidence Forces a Universal Structure) With Five Named Falsification Conditions and Eight Concrete Required Experiments (P1-P8) -- Delivers 'Policy Notin Identity(K)' and 'K and Pi Are Different Ontological Categories' via Two Decisive Diagnostic Questions, the Orthogonality Test Separating Epistemic From Governance Status, and Reaffirms Graph-Independence Neq Statistical-Independence -- Opens Step 272's Reapplication of the K-Minimality Method to Sigma"
