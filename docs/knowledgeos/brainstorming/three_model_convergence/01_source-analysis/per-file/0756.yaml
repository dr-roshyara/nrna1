    refinement: "Independently and specifically instantiated at the level of this corpus's own internal regime structure: the R2/R3-to-R5 lens-to-algebra transition is explicitly flagged as the single highest-priority unresolved instance of exactly this kind of silent conversion risk, to be investigated rather than assumed resolved either way"
