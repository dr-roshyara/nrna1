defines:
  - concept: "The Lens→Formalization epistemic-bridge gap"
    definition: "A transition where a conceptual or metaphysical lens (e.g. a Gita-derived concept) becomes a formal algebraic or mathematical object in a later document, without any explicitly recorded reasoning establishing what specifically justified that formalization -- the absence of the bridge does not itself mean the resulting formalization is wrong, but it means the formalization's epistemic status (analogy? hypothesis? definition? derivation? experiment?) cannot be assumed and must be investigated in the corpus rather than assumed or retrospectively repaired"
  - concept: "SPECIAL RULE — HISTORICAL INTEGRITY"
    definition: "Later-regime (R5) knowledge or terminology must never be used to silently rewrite or reinterpret what an earlier-regime (R1/R2/R3) document actually said or meant; evolution must instead be represented explicitly as a three-step sequence -- earlier position, then later observation, then revised interpretation -- keeping the original historical record intact and separately visible from any later reassessment of it"
