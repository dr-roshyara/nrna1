defines:
  - concept: "Detecting a contradiction≠resolving a contradiction"
    definition: "KnowledgeOS's obligation is to identify, classify, and preserve genuine contradictions without fabricating a resolution merely for convenience; unresolved conflict is itself a legitimate, permanent epistemic state"
  - concept: "Authority≠Truth (TruthStatus vs. BindingStatus)"
    definition: "A rule or claim's normative bindingness is tracked independently from its factual truth status; a mandatory governance rule can remain binding while its underlying factual assumptions remain unknown or contested"
  - concept: "Optimal≠Authorized"
    definition: "A technically superior option is not automatically the authorized one; epistemic preference (what is technically best-supported) and binding decision (what governance mandates) are two independently tracked outcomes that may diverge"
  - concept: "Conflict Debt"
    definition: "ConflictDebt(t+1)=ConflictDebt(t)+NewCriticalConflicts-ResolvedConflicts+Aging — accumulated organizational risk from unresolved conflicts, directly analogous to 0615's Epistemic Debt, with priority explicitly not driven by age alone"
  - concept: "KOS=(E,R,I,K,G,T,U,D,V,C,A)"
    definition: "The most complete formal KnowledgeOS system definition to date: entities, references, identity relations, contextual knowledge, provenance/dependency graphs, semantic translations, uncertainty, decisions, validation mechanisms, conflicts, and authority/authorization structures"
