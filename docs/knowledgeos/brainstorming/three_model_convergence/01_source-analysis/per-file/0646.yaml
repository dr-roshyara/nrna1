defines:
  - concept: "NotIdentified vs. Unknown"
    definition: "Unknown reflects insufficient information that could in principle be resolved by acquiring more evidence; NotIdentified reflects a structural limitation where the desired causal quantity cannot be uniquely determined from any amount of data under the current model and assumptions, a fundamentally different and stronger kind of epistemic limit"
  - concept: "ComputationalDifficulty≠EpistemicNonIdentifiability"
    definition: "A causal quantity may be identified (uniquely determined by assumptions and data) yet computationally expensive to estimate, or it may be unidentified even given unlimited computational resources — these are two independent axes of difficulty that must not be conflated"
  - concept: "CausalEffect≠DecisionUtility"
    definition: "A validated, positive causal effect of an intervention does not by itself justify taking that intervention; the effect must still be weighed against implementation cost, risk, and constraints through the full decision-theoretic apparatus before a rational decision can be made"
