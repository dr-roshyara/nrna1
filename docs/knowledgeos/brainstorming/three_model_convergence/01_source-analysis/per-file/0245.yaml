about: >
  Adds Andrew Fraser's "Hidden Markov Models and Dynamical Systems" as a fourth book in the semantic-
  operator research stack (0239-0244). Central state-space framing: hidden state x(t), observation
  y(t)=G(x(t)), dynamics F; when G is non-invertible the state is genuinely hidden. Provides the strongest
  direct empirical precedent in this sub-arc: Fraser demonstrates an HMM trained on raw text (no
  dictionary, no manual categories) discovering hidden states that correspond to recognizable grammatical
  categories -- directly supporting the corpus's proposed semantic-state-discovery experiment. Most
  significant conceptual shift: reframes Dhatu as a TRANSITION/OPERATOR between latent states, not a noun
  or semantic-primitive object.
introduces:
  - concept: "State-space formalization of 'language is projection of meaning': y_t=G(x_t), if G is non-invertible several underlying states can generate the same observation -- research hypothesis: natural-language expressions are observations generated by an underlying semantic/problem-solving state space, not word->meaning directly"
  - concept: "Direct empirical precedent: Fraser's HMM trained on raw text with no dictionary/manual categories discovers hidden states that correspond to recognizable grammatical categories (parts of speech), via Baum-Welch training and Viterbi decoding -- the corpus's proposed semantic-discovery experiment would go one level deeper (grammatical structure -> semantic/operational structure)"
  - concept: "Explicit warning: latent state != knowledge -- an HMM can discover grammatical, stylistic, author-specific, topic, formatting, semantic, domain, or purely accidental statistical states; only the other lenses (Zero/invariance/cross-domain) determine whether a discovered state qualifies as knowledge"
  - concept: "Dhatu reframed as a TRANSITION/OPERATOR (Z_i --D--> Z_j) rather than a semantic-primitive noun -- a significant conceptual pivot in this sub-arc, directly compatible with the Paninian lens; worked example: UNKNOWN --OBSERVE--> OBSERVED --DIFFERENTIATE--> DISTINGUISHED --SELECT--> CONSTRAINED"
  - concept: "Reasoning-motif extraction via Viterbi trajectories: recover the most probable latent-state SEQUENCE (Z1->Z2->Z3->...) rather than isolated keyword extraction, enabling discovery of recurring reasoning motifs (e.g. Question->Decompose->Compare->Filter->Select)"
  - concept: "Baum-Welch local-optima warning as a new stability requirement: different random initializations can converge to different local maxima/different discovered state sets -- a candidate semantic state must be stable across runs (P(state structure survives initialization)), proposed as a new Shani invariant"
  - concept: "Entropy gap as a model-fidelity measure: delta = model-cross-entropy / process-entropy, an ideal model has a gap approaching zero; Fraser's own experiment shows cross-entropy decreasing (with diminishing gap) as HMM state count increases, giving an empirical complexity-vs-information curve"
  - concept: "Formal Zero criterion candidate: Z* = argmin_Z [Complexity(Z) + lambda*InformationLoss(Z)] -- explicitly NOT literally from Fraser, but assembled from the book's own ingredients (hidden-state representation, likelihood, entropy, cross-entropy, complexity, approximation error)"
  - concept: "Identifiability criterion for a candidate knowledge structure: test whether the posterior P(Z_t|Y_1..Y_T) becomes concentrated (less uncertain) as T increases; if it does, the latent state is identifiable from evidence -- if it stays ambiguous regardless of evidence volume, the candidate structure may not be identifiable at all"
  - concept: "Kalman filtering's predict->observe->update cycle offered as itself a candidate Dhatu (a transformation, not a noun), reinforcing the operator-not-object reframing"
  - concept: "Estimation != classification (Fraser's own explicit warning): optimizing likelihood and optimizing classification performance are not the same objective -- 'the HMM found this state, therefore it found knowledge' is explicitly rejected as a valid inference"
  - concept: "Eight-technique extraction table (state-space modeling/HMM/Viterbi/Baum-Welch-EM/forward-backward/entropy/entropy-gap/Kalman-continuous-state) mapped to specific research uses"
  - concept: "Five-experiment research design (A: linguistic-state recovery via HMM on tokens; B: semantic-state discovery via sentence features; C: operational-state discovery via problem-solving text; D: Zero -- vary state count 2..64 and measure complexity/prediction/cross-entropy/stability/generalization to find minimum stable representation; E: Dhatu -- examine recurring TRANSITIONS Z_i->Z_j rather than state labels as the candidate operators)"
