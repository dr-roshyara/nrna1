defines:
  - concept: "Feasible≠Permitted (counterfactual-governance synthesis)"
    definition: "An intervention can be fully causally modelable and analytically tractable (CausallyModelable) while remaining GovernanceForbidden in practice; counterfactual analysis of a forbidden action is legitimate epistemic work, entirely separate from whether that action is actually authorized"
  - concept: "Counterfactual≠Recommendation"
    definition: "A superior estimated causal outcome under an alternative intervention (P(Y|do(B))>P(Y|do(A))) does not automatically justify recommending that alternative; recommendation additionally requires satisfying policy, authority, values, and constitutional constraints — a technically better but constitutionally-forbidden option cannot be recommended"
  - concept: "Trajectory/multi-step counterfactuals (P(S_{t:t+H}|do(A_{0:H})))"
    refinement: "Real engineering counterfactuals often concern intervention sequences unfolding over a planning horizon rather than a single point-in-time action; evaluating only the first intervention in a multi-step sequence produces an IncompleteCounterfactual, since near-term apparent benefit can mask longer-horizon risk"
  - concept: "Interference (SUTVA violation) in counterfactual analysis"
    definition: "When one agent's action materially changes another agent's outcome even though the second agent's own action is unchanged (Y_i=f(X_i,X_j,...) rather than Y_i(X_i) alone), standard individual-treatment counterfactual assumptions fail, requiring system-level rather than isolated-agent counterfactual models — a correctly-named instance of the classical causal-inference SUTVA-violation concept"
