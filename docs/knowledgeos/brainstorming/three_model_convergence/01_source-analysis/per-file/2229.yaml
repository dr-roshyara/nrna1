about: >
  "STEP 287 · Invariants ℐ — Candidate Invariants, Derivability, Dependencies and Open Conditions," status
  "RESEARCH ARTIFACT — NOT NORMATIVE / NOT ARCHITECTURE." Despite its filename's "triplicate" label, this is
  NOT byte-identical to the already-tracked companion file 2228 (confirmed via checksum) -- a related, second-
  pass discussion of the same Step-287 scoping question, driven this time explicitly from the already-tracked
  D288-scope decision rather than directly from the invariant-research mandate.

  **DELIVERS THE PRECISE ORIGIN OF THE SIX-WAY CLASSIFICATION VOCABULARY THIS RECONSTRUCTION HAS TRACKED
  BEING USED PERVASIVELY THROUGHOUT THE ENTIRE RESEARCH PROGRAMME**: `DERIVED` / `CORPUS-SUPPORTED` /
  `CONDITIONALLY DERIVED` / `NORMATIVE` / `G1 OPEN` / `REFUTED`, explicitly framed as "consistent with the
  four-way gap discipline you just adopted." This is the exact terminology this reconstruction has
  encountered attached to hundreds of already-tracked findings throughout the entire equality and Gītā
  research arc (already-tracked `CORPUS-SUPPORTED` for `I-V`, files 1104/1109/1111; `NORMATIVE` for dozens of
  register items throughout files 1072-1112; `G1` for the already-tracked irreducible `Qualify` gap
  throughout the entire arc) -- confirming these terms of art originate as a single coherent six-way
  taxonomy rather than independently coined labels.

  **DELIVERS THE ORIGINAL STATUS-SEQUENCE TABLE** for Steps 285-288 as of this document's writing (285
  "Research completed with explicit limitations"; 286 "Can be written as a research/ontology artifact"; 287
  "Research/derivability analysis -- not yet normative closure"; 288 "Scoped, not executed"; later steps
  "Normative kernel/formal invariants -- only after the required decisions"), confirming the disciplined
  sequencing already-tracked throughout the Step 285-291 chronology.

  **DELIVERS A PRECISE, DISCIPLINED FRAMING FOR EQUALITY-DEPENDENT INVARIANTS**, already-tracked as a
  standing requirement throughout the equality arc (`§13` of the companion file 2228): "if we encounter
  something of the form `K_1≡K_2⟹P(K_1)=P(K_2)`, we CANNOT call that a final invariant until the semantics of
  `≡` are fixed... any invariant relying upon observational equality must CARRY THAT PARAMETER... provenance-
  sensitive invariants... must remain conditional until 'relevant provenance' is formally specified."

  **DELIVERS THE PRECISE, DISCIPLINED RESEARCH-CHAIN STATEMENT**, explicitly warning against the alternative
  bad path: "`Ontology→Candidate Invariants→Derivability Audit→Dependency on Equality/Qualification→D288`
  rather than: `Ontology→Invent Invariants→Declare them canonical`. The second path would violate the current
  research discipline." Delivers the precise instruction: "STEP 287 should NOT SOLVE D288. Instead, it should
  EXPOSE WHICH INVARIANTS ARE BLOCKED BY D288 AND EXACTLY WHY."

  Confirms, consistent with the already-tracked companion file 2228, that D288's own material establishes
  several foundations remain unresolved (`≡` no decision procedure; `≈` observation set `𝒬` not fixed;
  `≅_λ` provenance-relevance predicate not fixed; `Qualify` a genuine `G1` gap; `𝒪` unenumerated; the ratified
  eight primitives not yet demonstrated minimal against the operation space) -- the same blocker set already
  extensively tracked throughout the entire equality research arc.
