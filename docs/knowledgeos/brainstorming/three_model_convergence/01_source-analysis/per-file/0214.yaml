about: >
  A disciplined, explicitly non-prescriptive philosophical challenge document (citation-grounded:
  Daodejing, Zhuangzi, Ames & Hall 2003, Moeller 2006, Ziporyn 2009, plus peer-reviewed secondary
  literature) applying Daoist ziran ("naturalness," "self-so," non-forcing) against the corpus's own
  established, architecturally-grounded Kernel Identity invariant (fixed/intrinsic/forced identity,
  supporting the UNKNOWN->VALIDATED->SUPERSEDED epistemic lifecycle). Explicit mode: "Philosophical
  Investigation (Not Architecture Design)... Challenge the architecture; do not become its architect."
  Produces three named challenges (fixed-vs-transformational, intrinsic-vs-contextual, forced-vs-natural
  identity) as falsification questions, explicitly declining to answer them.
introduces:
  - concept: "Three-way ziran challenge to the Kernel Identity invariant: Fixed vs. Transformational identity, Intrinsic vs. Contextual identity, Forced vs. Natural identity"
  - concept: "Ziran ('self-so'): things are what they are naturally, without forcing/external imposition, in relation to context, constantly transforming (bianhua zhi liu, 'flow of change and transformation')"
  - concept: "wei ('forcing,' willful action) as the conceptual opposite of ziran, used to characterize the Kernel's 'assigned by mechanism' identity assumption"
  - concept: "Worked illustration of transformational identity: K123-UNKNOWN -> K123-VALIDATED -> K123-SUPERSEDED as identity that transforms with knowledge state, contrasted with a single immutable K123"
  - concept: "Worked illustration of contextual identity: K123-in-Context-C1 vs. K123-in-Context-C2 as identity relative to context, contrasted with a single context-independent K123"
  - concept: "Worked illustration of natural identity: identity arising from content (e.g. content hash) contrasted with identity assigned by mechanism"
  - concept: "Explicit discipline: ziran does NOT say the Identity invariant is wrong, nor prescribe replacement -- only that the Kernel should be investigated for whether it SUPPORTS (not necessarily replaces with) transformational/contextual/natural identity"
  - concept: "Six falsification questions and five explicitly-non-prescriptive architectural questions derived from the three challenges"
  - concept: "Five-tier Evidence Boundary classification (Strong Historical Evidence / Strong Scholarly Interpretation / Philosophical Inference / Architectural Speculation / Unknown) applied to a philosophical-source extraction, structurally resembling the corpus's own evidence-tiering discipline"
