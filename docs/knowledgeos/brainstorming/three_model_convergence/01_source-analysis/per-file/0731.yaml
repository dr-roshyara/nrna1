defines:
  - concept: "Golden Trace"
    definition: "A single canonical, complete end-to-end demonstration of the governed engineering lifecycle (Decision→Policy→Rule→Context→Agent→Recommendation→Authorization→Action→Evidence→Verification→Finding→Disposition) for one real scenario, used both as the reference implementation validating each architectural phase and as a permanent, ongoing architecture fitness test: every material governed agent action must have a reconstructable golden trace, formalized as Trace(A)=Reconstruct(Decision,Context,Recommendation,Authorization,Action,Evidence,Verification) with no dependence on an LLM's own conversational memory"
  - concept: "The ten-question MVP success criterion"
    definition: "The architecture is considered proven for its minimum viable scope if the system can answer, for one real scenario: what was expected, why, what the agent knew, what it recommended, who/what authorized the action, what actually happened, what evidence proves it, whether it was compliant, what finding was raised if not, and what governance decision followed"
  - concept: "The five-step evolutionary principle"
    definition: "Make implicit knowledge explicit, then make explicit knowledge addressable, then make addressable knowledge verifiable, then make verified knowledge actionable, then make actions traceable back to authority -- a compact ordering principle for the entire KnowledgeOS evolution"
