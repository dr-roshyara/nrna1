about: >
  Directly continues 0804, opening "we now reach a deeper epistemic boundary... what happens when the
  available evidence is insufficient? This is not a minor edge case. A trustworthy KnowledgeOS must be able
  to say: we do not know. And, more precisely: we know that we do not know."

  **§180.1-180.4 delivers the rejection of the binary True/False model** for engineering knowledge (a
  worked "can Nexus be migrated without downtime?" example with partial, mixed evidence yielding `Unknown`,
  not `True`/`False`), extends to three-valued logic `{True,False,Unknown}`, then delivers **`Unknown≠
  Contradictory`** as a further necessary distinction (Case A: no evidence either way, `E=∅⇒Unknown`; Case
  B: evidence on both sides, `E_1→C` and `E_2→¬C`, `⇒Contradictory`), and a provisional, explicitly
  unfrozen seven-state epistemic space `{Unasserted,Candidate,Supported,Established,Contradicted,Disputed,
  Unknown}`.

  **§180.5-180.8 delivers `KnownUnknown`**, boxed: **`KnownUnknown=Unknown+KnownMissingEvidence`** ("we
  know we don't know whether the firewall permits the connection, AND we know the missing evidence is a
  firewall test" -- "far more useful than simply saying unknown"), delivering **unknown-as-actionable**:
  `Unknown(C)∧EvidenceRequired(C)=E⇒NextAction=Collect(E)`. Delivers **an information-theoretic framing**:
  the relevant question is not "what is θ?" but "what observation would reduce uncertainty about θ?",
  formalized `X*=argmax_X E[H(Θ)-H(Θ|X)]` (expected information gain), explicitly not requiring information
  theory to be implemented everywhere but crystallized into the boxed principle **"a good knowledge system
  should know what evidence would be most useful next."** Explicitly connects this to the arc's own
  experimental methodology (`Question→Hypothesis→Evidence→Evaluation→Conclusion`, with
  `InsufficientEvidence→NextInvestigation` as a self-referential description of how the arc's own
  step-by-step experiments have been conducted).

  **§180.9-180.14 delivers "unknown must not become failure"**, boxed: **"recognizing uncertainty is
  itself a successful epistemic outcome"** (an assessment returning `Unknown` may mean
  `AssessmentCorrectlyIdentifiedMissingKnowledge`, not `AssessmentFailed`). **Delivers the file's central
  AI-safety contribution, explicitly named "the hallucination boundary"**: "a language model has a strong
  tendency to produce an answer even when evidence is insufficient... `NoEvidence⇏GeneratedFact`... instead
  `NoEvidence→Unknown`," crystallized as the boxed safety invariant **"an absence of evidence must never
  silently become evidence of absence,"** formalized `¬Evidence(C)⇏Evidence(¬C)` -- "a classic logical
  error." Worked through an infrastructure-documentation example (a firewall rule not found should yield
  `ExistenceUnknown`, not `FirewallRuleDoesNotExist`) and a statistical analogy (`p>0.05⇏H_0=True`, only
  `EvidenceInsufficientToReject(H_0)`), delivering **`NotEstablished≠False`** and, applied to this
  reconstruction's own methodology, **`CandidateBoundary≠ConfirmedBoundary`**, explicitly and directly
  self-referencing the corpus's own earlier bounded-context work: "we previously had 8 Candidate BCs. After
  analysis, 5 Confirmed BCs. That transition is meaningful precisely because we did not treat every initial
  hypothesis as truth" -- a direct callback to 0787's/0798's DDD context-discovery arc.

  **§180.17-180.22 delivers scope-dependent knowledge**: even a `Confirmed(BC)` determination means
  `ConfirmedWithin(CurrentArchitectureScope)`, not `UniversalTruth(BC)`, formalized `Valid(K,Scope,Time)`
  and `Knowledge=Claim+Scope+TemporalContext+Evidence`. Delivers **`Unknown(C,Scope,Time)`** as
  necessarily local, not global (multi-tenancy known-true for `SystemA,Version1` but `Unknown` for
  `Version2`), and **contradiction requiring matching scope** (apparently conflicting evidence across
  different versions is not a contradiction if the scopes differ).

  **§180.22-180.24 delivers the file's most important structural distinction**, boxed: **`Contradiction≠
  Change`** -- `K_1` ("system does not support X") followed by `K_2` ("system supports X") may be evolution
  (a new version introduced the feature), not contradiction, explicitly re-invoking "exactly the 'new
  state' insight": `S_{t+1}` may legitimately differ from `S_t`, and the system must preserve
  `Evolution(S_t,S_{t+1})` or "every change appears as contradiction."

  **§180.25-180.27 delivers four semantically distinct situations** -- Unknown (insufficient evidence),
  Contradiction (incompatible claims under identical scope/time), Supersession (a later valid state
  replaces an earlier one), Correction (an earlier determination is found to have been wrong) -- with
  **Correction singled out as especially important**: `D_2` correcting `D_1` (`Corrects(D_2,D_1)`) must
  never erase `D_1`, since it "was part of organizational history," boxed: **"correction should preserve
  the existence and provenance of the corrected artifact"** -- `Update(D_1)` is explicitly named "the wrong
  semantic operation"; the correct operation is `D_2→[corrects]→D_1`.

  **§180.28-180.30 delivers the KnowledgeOS-behavior contrast**: not an overwritable `knowledge.txt`, but a
  structure preserving `K1` with its evidence/provenance/determination plus an explicit
  `superseded/corrected by→K2` edge. Worked through a new-AI-agent-asking-"why did we choose this
  architecture?" scenario, receiving not merely the latest answer but "the lineage of reasoning" (a full
  `Decision_5←Determination_3←Evidence_{1,2,7}`, later refined by `Determination_8`). **Sharpens
  KnowledgeOS's own architectural definition**, boxed: **"governed institutional memory with epistemic
  lineage"** -- "much closer to what we are actually designing" than the earlier 0801 definition alone.

  **§180.31-180.34 delivers `Unknown` as a first-class domain object**: an `Investigation` tuple
  `⟨Question,Scope,Hypothesis,RequiredEvidence,Owner,Status,Outcome⟩`, the pipeline
  `Unknown→Investigation→Evidence→Determination`, and explicitly rejects investigating every unknown (a
  coffee-mug-color example has "no governance value"), delivering `InvestigationPriority=
  f(Impact,DecisionRelevance,Risk,Cost)`, crystallizing **"not all uncertainty is equally
  decision-relevant"** -- **decision-relevant uncertainty**, worked through a decision-boundary example
  (`x=8±3` versus a `x<10` safety threshold, the uncertainty interval overlapping the boundary) as "an
  excellent example of where statistics directly informs governance."

  **§180.36-180.38 delivers proportional evidence burden**: `RequiredEvidence∝Risk×Impact×Uncertainty`
  (conceptual, not a final formula), connecting to graduated `AssuranceLevel` (LowRisk→LightEvidence;
  HighRisk→StrongEvidence+IndependentVerification), paired with an **explicit anti-over-formalization
  warning**: rejecting a universal `confidence_score=0.873` as "false mathematical precision," boxed the
  methodological rule: **"formalize only where the domain semantics justify formalization."**

  **§180.39-180.40 delivers the Step 180 final model**, boxed: **`E_t={Claims,Evidence,Determinations,
  Unknowns,Contradictions,Corrections,Scope,Time,Provenance}`**, with `GovernanceInput_t=
  Projection(E_t,DecisionContext)`. **Delivers the Step 180 verdict**, boxed: **"a trustworthy knowledge
  system must represent uncertainty explicitly"** and the five-way inequality
  **`Unknown≠False≠Contradictory≠Superseded≠Corrected`**, crystallized: "we know what we don't know, why we
  don't know it, and what evidence would reduce the uncertainty... a considerably more mature epistemic
  architecture than a system that merely retrieves documents."

  **Closes opening "Step 181 — The 'What If Two Truths Disagree?' Experiment,"** posing a worked
  contradictory-knowledge scenario (`K_1`: "firewall access is available" vs. `K_2`: "firewall access is
  not available," both provenanced and both once credible), explicitly rejecting two naive resolution
  strategies ("choose the newest" and "choose the highest confidence" as "neither... generally
  sufficient"), promising to formalize: **"how does an organizational knowledge system represent, detect,
  and resolve disagreement?"** No actual repository implementation occurs within this file itself; every
  state, tuple, and invariant remains a conceptual specification pending Step 181's contradiction-
  resolution formalization.
