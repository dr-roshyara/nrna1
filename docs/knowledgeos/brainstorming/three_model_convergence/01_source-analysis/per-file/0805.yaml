defines:
  - concept: "The hallucination boundary"
    definition: "A formal safety invariant stating that the absence of evidence for a claim must never be silently converted into evidence for that claim's negation -- formally ¬Evidence(C)⇏Evidence(¬C) -- named specifically because language models have a strong tendency to produce a confident answer even when the available evidence is insufficient; the architecturally correct response to NoEvidence is the explicit state Unknown, never a GeneratedFact asserting either C or ¬C, extending the arc's earlier general hallucination-prevention discipline (0802) into a precise logical formalization"
  - concept: "Contradiction≠Change (or Evolution)"
    definition: "An apparent conflict between an earlier knowledge state K_1 and a later one K_2 (e.g. 'the system does not support X' followed by 'the system supports X') is not automatically a logical contradiction -- it may instead be a legitimate evolution if the underlying scope has changed (e.g. a new version introduced the feature); genuine contradiction requires incompatible claims under the SAME scope and time assumptions, so contradiction detection is impossible without first checking whether the compared claims share identical semantic and temporal scope"
  - concept: "Correction as a non-destructive operation"
    definition: "When an earlier determination D_1 is later found to have been based on an invalid assumption, the correct architectural operation is not to overwrite or delete D_1, but to create a new artifact D_2 that explicitly corrects D_1 via a Corrects(D_2,D_1) relation, preserving D_1's existence and provenance as part of organizational history -- this enables future actors (including AI agents) to receive not merely the latest answer but the full lineage of reasoning behind it, directly supporting the sharpened definition of KnowledgeOS as 'governed institutional memory with epistemic lineage'"
