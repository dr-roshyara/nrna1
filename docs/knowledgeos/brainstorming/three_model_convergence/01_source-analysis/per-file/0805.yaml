title: "Step 180 -- The 'Can the System Know That It Does Not Know?' Experiment (MAJOR SYNTHESIS MILESTONE, delivers 0804's promised Unknown/KnownUnknown formalization): Delivers Unknown≠Contradictory, KnownUnknown=Unknown+KnownMissingEvidence, and an Information-Gain-Seeking Statistical Framing (X*=argmax E[H(Θ)-H(Θ|X)]) -- Delivers the Named 'Hallucination Boundary' ('An Absence of Evidence Must Never Silently Become Evidence of Absence,' ¬Evidence(C)⇏Evidence(¬C)) -- Delivers Contradiction≠Change/Evolution and 'Correction Should Preserve the Existence and Provenance of the Corrected Artifact' (D_2→[corrects]→D_1, Never Silent Overwrite) -- Sharpens KnowledgeOS's Definition to 'Governed Institutional Memory With Epistemic Lineage' -- Delivers Decision-Relevant Uncertainty and 'Formalize Only Where the Domain Semantics Justify Formalization' -- Delivers the Five-Way Step 180 Verdict Unknown≠False≠Contradictory≠Superseded≠Corrected -- Opens Step 181's 'What If Two Truths Disagree?' Experiment"
