defines:
  - concept: "The Bootstrap paradox (constitutional self-amendment vulnerability)"
    definition: "If a constitution's own rules can be modified without passing through the constitution's own required authority mechanism, then the constitution provides no real protection — any actor can bypass any constitutional constraint simply by first changing the rule that constrains them; therefore constitutional change itself requires a higher-order (or at minimum equally rigorous) authority process, distinct from and prior to ordinary rule application"
  - concept: "Constitution⊂AuthoritativeKnowledge (recursive constitutional governance)"
    definition: "The constitution itself is a piece of authoritative organizational knowledge and must therefore satisfy its own constitutional requirements (provenance, authority, temporal validity, traceability); this produces a coherent, self-consistent closure where governance produces knowledge and knowledge (the constitution) in turn governs how knowledge evolves"
  - concept: "The Three truth layers"
    definition: "T1 Historical evidence (what a system actually contained or did, as a factual historical matter), T2 Architectural interpretation (what those historical mechanisms are understood to mean), and T3 Target architecture (what the system should become going forward) are three categorically distinct kinds of claim that must never be silently conflated when reconstructing or documenting a system's architecture from a large, heterogeneous body of accumulated material"
  - concept: "Architectural hallucination prevention"
    definition: "A documentation discipline in which architecture claims are never stated as unqualified present-tense facts ('KnowledgeOS has X') but are explicitly labeled by their epistemic/temporal status ('X — Target architecture; implementation evidence not yet established'), preventing aspirational or historical statements from being silently read as current implementation fact"
