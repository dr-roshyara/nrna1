defines:
  - concept: "Dynamic causal model / DynamicCausalModel (DCM)"
    definition: "DCM=(S,A,F,O,τ,ℳ) — state space, action/intervention space, transition mechanism, observation function, delays, and competing models/uncertainty — extending the corpus's static CausalClaim object (0624) into a fully dynamic, time-evolving formalism"
  - concept: "Complexity Debt (KnowledgeComplexity)"
    definition: "The epistemic/causal-reasoning complexity cost an architecture change can introduce even while reducing runtime risk, indicated by (explicitly non-universal) metrics such as GraphDepth, DependencyCount, CausalPathCount, ModelUncertainty, and ConflictCount"
  - concept: "Reachability safety (horizon-dependent)"
    definition: "An action is safe relative to a specific finite horizon H if its reachable state set under the model does not intersect the prohibited-state set within that horizon; safety generally cannot be proven for an infinite horizon, and an action safe over a short horizon may be unsafe over a longer one"
  - concept: "DDD Boundary as RiskContainmentBoundary"
    definition: "A well-chosen bounded-context boundary reduces causal and failure propagation between subsystems, so architectural boundaries can be partially evaluated through causal graphs — DDD boundaries are not merely organizational but also function as containment mechanisms for systemic risk"
