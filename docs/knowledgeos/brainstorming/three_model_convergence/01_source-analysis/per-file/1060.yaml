about: >
  "06 — Register Reconciliation (mandate §9) — authority · duplication · conflict," auditing the already-
  tracked nine equality registers (R1-R9 plus three further loci, file 1041) entry-by-entry for authority
  status, conflict, duplicate terminology, normative status, and historical status, explicitly: "No choice
  is made between conflicting definitions."

  **Restates the already-tracked `≡`/`≈` formula-identity conflict** in its canonical source-quotation form
  (`258.8`, `261.21`, `261.5`, `261.1`/`246`), and the three possible readings (collapse `≈` into `≡`; give
  `≡` a new non-observational definition; treat it as a notation-clash rename).

  **DELIVERS A GENUINELY IMPORTANT, DISCIPLINED EPISTEMIC FINDING NOT PREVIOUSLY CAPTURED**: explicitly
  determines whether the `≡`/`≈` duplication is "DOCUMENTARY or NORMATIVE" is **"NOT DETERMINABLE from the
  corpus"** -- "`261` states both the distinction (§261.1) and the shared definition (§261.5, §261.21)
  WITHOUT NOTING ANY TENSION -- so the text supports neither 'deliberate identification' nor 'editorial
  slip'. This is PRECISELY WHY IT NEEDS AN OWNER, NOT AN INFERENCE. No reading is chosen here." This is a
  disciplined refusal to guess at authorial intent where the text itself is genuinely ambiguous, rather than
  defaulting to either interpretation.

  **DELIVERS THE DEFINITIVE, EXPLICIT FINDING THAT NO REGISTER CARRIES ANY RATIFICATION RECORD WHATSOEVER**:
  "NONE. No register carries a ratification record. All nine are research-lane, self-verdicted, and R4 marks
  itself 'provisional'." **DELIVERS A GENUINELY IMPORTANT GOVERNANCE-DISCIPLINE WARNING**: "`261.1` is the
  widest and latest, which is NOT THE SAME AS AUTHORITATIVE -- and treating recency as authority would be
  EXACTLY THE PROMOTION THIS PROGRAMME FORBIDS. Register ownership is itself an open governance item." This
  explicitly names and forecloses the specific overclaim risk of implicitly treating the most recently
  dated/widest register as the de facto canonical one merely by virtue of coming last, extending the
  programme's already-tracked discipline against conflating "later" with "more authoritative" (a discipline
  this reconstruction has tracked as a standing corpus-wide principle since much earlier files).
