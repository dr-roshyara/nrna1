defines:
  - concept: "The Core/Supporting/Lens concept classification"
    definition: "Every concept the architecture accumulates must be sorted into exactly one of three categories: Core (C, necessary to the architecture -- removing it would break something essential), Supporting (S, useful but not foundational -- convenient rather than required), or Lens (L, a way of thinking about or discovering architectural questions, but explicitly NOT itself part of the software domain model) -- the Lens category is specifically introduced to formally house Gita-chapter-derived concepts (GitaChapter4 and similar), preventing them from ever being promoted into the domain model regardless of how useful they proved as a discovery tool"
  - concept: "The Gita interpretive-trace pipeline"
    definition: "A mandatory five-stage derivation chain required to justify any architectural claim connected to the four Gita chapters: Chapter (the source text) → Theme (its general subject, e.g. knowledge/transmission/continuity/action) → ArchitecturalQuestion (a concrete software-architecture question the theme provokes, e.g. 'how can a new state/actor act correctly when it does not possess the complete historical state?') → DerivedPrinciple (a general architectural principle answering that question) → FormalModel (the actual mathematical/DDD structure realizing the principle, e.g. Lineage+TemporalState+Evidence) -- replacing the weaker and rhetorically risky shortcut of asserting 'the architecture obeys the wisdom of Chapter N' directly"
  - concept: "'Every new concept carries a burden of proof'"
    definition: "From Step 201 onward, no new architectural concept may be introduced merely because it seems interesting or elegant; it must survive a seven-question admission test (what problem does it solve; what existing concept fails to solve that problem; what invariant does it introduce; what transition does it participate in; which bounded context owns it; what mathematical structure represents it; what happens if it is removed) -- failing to produce a compelling answer to these results in automatic rejection of the candidate concept, formally ending the exploratory concept-accumulation mode that characterized Steps 1-200"
