about: >
  "10 — Next Legitimate Act (mandate §§10, 17, 24, 25)." The closing capstone of the Step-291 package,
  directly resolving the open question this reconstruction flagged from file 1086's item #21.

  **DEFINITIVELY MEASURES AND EXPLAINS THE DOWNGRADE OF FILE 1072'S ALREADY-TRACKED CAPSTONE CLAIM ("N-4 is
  the unambiguous single root")**: measures SEVEN source nodes (in-degree 0, all resolvable by a decision) in
  the dependency graph: "`O  Qualify  assertion  evidence  id_context  policy  temporal` <- SEVEN." Measures
  leverage (nodes reachable) for each: `O` reaches 20, `id_context` reaches 17, `policy` reaches 16,
  `evidence` reaches 2, `Qualify`/`temporal`/`assertion` each reach 1. Boxed: "'N-4 is THE earliest legitimate
  act' → NOT ESTABLISHED. DOWNGRADED. 'N-4 is the highest-LEVERAGE independent root' → supported by
  measurement." Delivers the precise correction: "`𝒪` is A source node, not THE source node. Six others have
  no incoming edge either." This is the definitive resolution this reconstruction flagged as pending from
  file 1086: file 1072's already-tracked capstone finding is CORRECTED, not simply reaffirmed -- `N-4`
  remains the single HIGHEST-LEVERAGE root among seven independent, equally-legitimate candidate first acts.

  **DELIVERS A GENUINELY IMPORTANT SELF-CAUGHT METHODOLOGICAL CONFLATION**: tests all five meanings of
  "earlier" the mandate's §10 requires be kept separate (upstream-in-dependency-graph; prerequisite-for-
  derivation; prerequisite-for-governance; prerequisite-for-implementation; prerequisite-for-canonicalization)
  against `N-4`, finding meanings 4 (implementation) and 5 (canonicalization) DISAGREE: canonicalization needs
  `evidence` (`38.85`), "a SEPARATE root," while implementation needs operations. Boxed: "Meanings 4 and 5
  disagree. THEY WERE BEING CONFLATED. (That is exactly what §10 warned against, and I HAD DONE IT.)" This is
  a genuinely valuable, explicit self-catch of exactly the kind of conflation the mandate anticipated and
  warned against -- directly analogous to the already-tracked `259.7`/`259.8` near-miss (file 1078).

  **DELIVERS THE §17 COMPETING-FIRST-ACTS TABLE**: `N-4` (mandatory-membership rule, node `O`, leverage 20,
  independent, unblocked); `N-8` (define "identity context", node `id_context`, leverage 17, independent,
  unblocked); `N-13` (canonicalization/evidence policy, node `evidence`, leverage 2, independent, unblocked);
  policy semantics (node `policy`, leverage 16, independent, unblocked); `N-3` (`𝒪_K`'s extension, BLOCKED by
  `N-4`); `N-1′` (ratify `261.21`'s candidate, BLOCKED by `N-3`←`N-4`, already-tracked chain, file 1072).
  Reconfirms the already-tracked file-1085 finding that the four documentary items "require no decision at
  all... can be repaired NOW, by nobody's authority."

  **DECLARES THE FORMAL STOP CONDITION**: "STOP-B, with a STOP-D qualification." STOP-B: "a precise normative
  boundary is identified: mandatory membership of `𝒪`/`𝒯`, and no derivation crosses it (8 routes tested,
  already-tracked file 1085)." STOP-D: "a new dependency DOES INVALIDATE the assumption that `N-4` is THE
  earliest act: seven independent roots exist, and meanings 4 and 5 of 'earlier' disagree" -- an explicit,
  disciplined acknowledgment that this file's own findings invalidate a prior assumption from within the same
  package (file 1072, technically a Step-290 finding this Step-291 file itself measures against and corrects).

  **DELIVERS THE §25 REQUIRED FINAL STATEMENT -- THE SMALLEST HONEST CLAIM ABOUT `𝒪`/`𝒯` SUPPORTED BY
  EVIDENCE**: "The corpus supplies a five-kind classification of operations, typed signatures for eight of the
  twenty-two it names, and a subset relation `𝒯⊆𝒪`. It supplies no rule saying which operations are
  MANDATORY, and no operation has a semantic body, an identity, or a ratification. Nothing more can be
  claimed." Explicitly disciplined negative scope: "it does not say `𝒪` is open, closed, minimal, complete, or
  derivable; it does not name a member; it does not say the classification is right. It is the LARGEST
  statement the evidence supports and NO LARGER." This closes the entire equiv_K/O/T/O_K research arc (files
  1052, 1063-1087) with its most disciplined, minimal, and defensible summary statement.
