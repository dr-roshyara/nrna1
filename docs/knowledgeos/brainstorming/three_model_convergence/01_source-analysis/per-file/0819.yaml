defines:
  - concept: "'EpistemicState is non-monotonic; Lineage is monotonic'"
    definition: "A proposition's current epistemic status can move in any direction over time -- including apparently 'backward' from Supported to Conflicted or Refuted as new evidence arrives -- and this is not a system failure but normal epistemic evolution; what must remain strictly monotonic (only ever growing, never shrinking or being overwritten) is the historical lineage record itself (H_{t+1}=H_t∪{event_{t+1}}), which preserves every state the proposition has ever held along with its supporting evidence and timestamp, so that even a later-refuted claim's earlier 'Supported' status remains permanently reconstructable"
  - concept: "'The system does not need to know truth in order to govern knowledge about truth'"
    definition: "The central architectural insight of Step 192: a governance and epistemic-assurance architecture does not require access to objective, metaphysical truth (which may be permanently inaccessible to any information system) in order to rigorously govern the organization's evolving relationship to that truth -- evidence, assessment, determination, and decision can all be tracked, versioned, and validated as epistemic objects in their own right, with their own invariants and provenance, without the system ever needing to claim it knows what is objectively, ultimately true"
