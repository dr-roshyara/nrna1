defines:
  - concept: "The three-proposition actor-knowledge formalism"
    definition: "Three logically independent propositions about a knowledge artifact K, actor a, and time t must be kept distinct: Exists(K,t) (the artifact is present somewhere in the governed organizational knowledge system), Knows(a,K,t) (the specific actor currently possesses or is aware of it, e.g. within an AI's current context window or a human's memory), and CanRetrieve(a,K,t) (the actor has a mechanism available to fetch it on demand even without currently possessing it) -- an artifact can exist and be retrievable by an actor who does not currently know it, which is the desired steady state for a well-architected knowledge system rather than a failure mode"
  - concept: "KnowledgeOS as governed organizational memory and epistemic infrastructure"
    definition: "The domain purpose of KnowledgeOS is broader than any single implementation component (document repository, AI memory, vector database) -- it is the governed infrastructure that holds organizational knowledge external to any individual actor (human or AI), so that the knowledge's existence and authoritative status never depends on whether a particular current actor happens to remember or currently possess it; actors access this infrastructure through task/authority/time-scoped projections rather than owning or constituting the memory themselves"
  - concept: "Persist(x)=f(Significance,Traceability,Governance,Reuse)"
    definition: "Not every piece of information an actor (human or AI) produces or encounters should become permanent organizational knowledge -- transient artifacts like an AI's intermediate reasoning steps, a discarded search result, or a local implementation detail need not persist, while artifacts whose future meaning depends on their history (evidence, determinations, decisions, authorizations, architecture constraints, governance records, important outcomes) should; without this filter, uncontrolled accumulation drives the signal-to-noise ratio toward zero as the corpus grows, making retrieval and reliable inference progressively harder rather than better"
