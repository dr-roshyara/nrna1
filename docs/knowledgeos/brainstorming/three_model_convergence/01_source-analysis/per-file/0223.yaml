about: >
  Michael Rescorla's "Bayesian Models of the Mind" (2024), direct continuation of the 0216->0221->0222
  synthesis lineage. Central architectural verdict: Bayesian inference should be a supporting epistemic
  mechanism, not the KnowledgeOS Kernel itself -- "semantic epistemic kernel + pluggable reasoning
  mechanisms." Strongest philosophical contribution: a probability number is not itself epistemic
  meaning -- the same mathematical distribution (PDF) can represent entirely different things depending
  on what it is about; probability must always carry semantic reference. Produces twelve numbered
  "ZERO-01..ZERO-12" gap-exposure findings, a formal research-outcome record (KOS-RESEARCH-BAYES-001),
  and the most technically detailed epistemic pipeline in the corpus so far.
introduces:
  - concept: "Bayes's theorem (synchronic) vs. Conditionalization (diachronic, governs credence change over time) as a distinct pair -- motivates EpistemicStateTransition as first-class"
  - concept: "Credal State distinct from PDF/probability distribution: the mathematical object alone does not identify semantic content (a distribution over speed vs. size vs. distance looks identical mathematically)"
  - concept: "SemanticReference as a Kernel-level requirement: NoProbabilityWithoutSemanticReference invariant -- P(x) is insufficient, need P(speed=x) with variable/unit/context/hypothesis/time bound to it"
  - concept: "EpistemicState (hypotheses/credence/evidence-basis/model-context/timestamp/provenance) and EpistemicTransition (priorState+evidence+inferenceRule->posteriorState) as new core Kernel elements, allowing prior->posterior modeling without mandating Bayesian inference"
  - concept: "Hypothesis distinguished from Claim: a hypothesis is something against which uncertainty can be distributed (H1/H2 competing states), not yet an assessed assertion"
  - concept: "Inference Port pattern: KnowledgeOS Kernel -> EpistemicState -> Inference Port -> {Bayesian Engine, Deductive Engine, Other Engines} -- the DDD-safe architecture explicitly rejecting KnowledgeOS-Kernel-equals-Bayesian-Engine"
  - concept: "PriorBelief as first-class with mandatory origin/calibrationContext/provenance -- motivated by Rescorla's own acknowledgment that Bayesian cognitive models often postulate priors without explaining their etiology (a genuine open problem in the source discipline itself)"
  - concept: "Assumption provenance as a new provenance category distinct from Evidence provenance (worked example: prior 'most services are REST', origin=historical project data, scope=DGX services, last-calibrated, evidence=342 repos, known-exceptions=17)"
  - concept: "K-BAY-01 invariant: every persisted probabilistic epistemic transition must preserve sufficient information (prior+evidence+model+parameters+method-version+context) to reconstruct the resulting state -- not just the posterior scalar"
  - concept: "MathematicalValidity != EpistemicValidity: a Bayesian computation can be mathematically correct while epistemically inappropriate if the prior is badly calibrated or the likelihood model is wrong"
  - concept: "Twelve ZERO findings (gaps a naive Bayesian KnowledgeOS implementation would silently omit): ZERO-01 prior origin unexplained; ZERO-02 probability without semantic grounding; ZERO-03 incomplete hypothesis space (P(H1)+P(H2)=1 can silently exclude a true H3); ZERO-04 posterior != complete world knowledge, evidence coverage unrepresented; ZERO-05 likelihood model origin/validity untraced; ZERO-06 inference performed without recording environment; ZERO-07 utility function origin/justification outside probability theory; ZERO-08 ModelPrediction vs. ModelExplanation vs. ModelRealityClaim conflated (realism vs. instrumentalism); ZERO-09 no ModelFailure/Challenge/Retirement/Replacement representation; ZERO-10 exact vs. approximate inference not distinguished; ZERO-11 EpistemicValidity confused with ComputationalFeasibility (Bayesian intractability); ZERO-12 InferenceCorrectness can coexist with RepresentationError (correctly computing P(X) while X is the wrong variable)"
  - concept: "InferenceAssessment ten-dimension model (mathematical validity, semantic validity, evidence adequacy, model adequacy, calibration, environmental fit, approximation quality, provenance, temporal validity, decision suitability) explicitly stronger than a single confidence scalar"
  - concept: "Predictive coding explicitly classified as Supporting Research/Mechanism Candidate, NOT Kernel principle -- grounded in Rescorla's own stated equivocal empirical support, a rare case of the source author's own epistemic humility being directly inherited into the classification"
  - concept: "Bayesian cue combination pattern: multiple noisy evidence sources integrated without collapsing their individual provenance (EvidenceSet with per-item provenance feeding a CombinedAssessment)"
  - concept: "Dead-reckoning / slow-speed-prior worked example: observed behavior can result from interaction among multiple epistemic assumptions (prior+cue-reliability+uncertainty+distance+expected-utility), not one deterministic rule -- directly relevant to explaining AI agent behavior"
  - concept: "AI-confidence guard: 'AI confidence without an explicit epistemic object is not KnowledgeOS evidence' -- a bare confidence=0.91 is merely a claim about the model's own confidence unless backed by hypothesis/evidence/method/context/calibration/provenance"
  - concept: "Concrete worked agent-output example (Hypothesis/Prior/Evidence/LikelihoodModel/Posterior/Assurance/Decision fields) presented as epistemically inspectable, contrasted with a bare 'I am 91% confident'"
  - concept: "Formal research-outcome record KOS-RESEARCH-BAYES-001: status 'architecturally significant -- accepted as research input, not yet constitutionalized,' with explicit twelve-item Promote-to-Kernel-research list and explicit non-promotion of 'KnowledgeOS = Bayesian system'"
  - concept: "Three deepest new principles: epistemic quantities are meaningless without semantic identity; epistemic state is a stateful object, not merely a scalar assessment; an epistemic transition must be distinguishable from the mathematical mechanism used to calculate it"
  - concept: "Revised three-tier architecture: CORE (Claim/Hypothesis/Evidence/Basing/Provenance/SemanticReference/EpistemicState/EpistemicTransition/EpistemicStanding/Challenge-Revision/AssuranceContract) -> SUPPORTING (Bayesian/Statistical/Deduction/Induction/Retrieval/Simulation/Calibration/Verification/Testing/ModelEvaluation/ExpectedUtility/Risk) -> INFRASTRUCTURE (LLMs/Databases/VectorStores/Git/APIs/CI-CD/Agents/Sensors)"
