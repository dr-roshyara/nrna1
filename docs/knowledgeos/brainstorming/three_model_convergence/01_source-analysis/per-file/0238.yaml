about: >
  Governance-methodology note applying the Paninian/Sanskrit semantic lens to a four-lens Architecture
  Review Board (ARB) framework named Ganesha (clarity)/Leonardo (discovery)/Krishna (strategy)/Shani
  (invariants) -- a DIFFERENT lens-naming scheme from the corpus's earlier 26-lens system (Zero/Vani/
  Panini/Karaka/Nyaya/Navya-Nyaya/Godel/Escher/Siva-Sakti/Ganesha/Leonardo/Moksha/Negative-Epistemology/
  Isnad/Witness/Dharma/Wisdom), sharing only Ganesha and Leonardo by name. Central architectural decision:
  add Panini and Topology as CROSS-CUTTING DIAGNOSTIC lenses supporting the four ARB governance judgments,
  explicitly NOT as a fifth/sixth voting governance dimension. Applied to a concrete worked example
  (an "Evidence Context" / ConstitutionalEvidenceSnapshot aggregate architecture review), suggesting this
  file bridges abstract Kernel lens methodology with a specific engineering governance review.
introduces:
  - concept: "Panini lens formal question: when something changes form, how do we know its identity and meaning have been preserved? (EXPRESSION != MEANING as a review question, not an architectural assumption)"
  - concept: "Ganesha/Panini checkpoint: five-question definition-review checklist (concept vs. current wording; survives terminology change; survives translation; accidental synonym-as-different-concept; accidental different-concepts-collapsed-by-similar-wording)"
  - concept: "Leonardo/Panini checkpoint: a current preferred name (e.g. ConstitutionalEvidenceSnapshot) being the current expression does not prove it is the correct aggregate -- reinforces treating an aggregate hypothesis as still a hypothesis"
  - concept: "Krishna/Panini application: strategic 'why build it' question extended into a transformation-boundary checklist (Observation->Capture->Preservation->Replay->Verification->Interpretation->Decision->Expression/Reporting), asking at each boundary whether meaning remains intact -- likened to a 'semantic compiler'"
  - concept: "Shani/Panini invariant: semantic identity must not be altered merely by representational transformation (same evidence identity traceable across database/JSON/event/replay/audit/human-readable representations)"
  - concept: "Sandhi reinterpreted as boundary-transformation governance for composition: two contexts meeting at a boundary must not silently concatenate into ownership transfer -- 'composition must not silently transfer semantic ownership' as a candidate principle (worked example: Evidence + Evaluation must not silently become 'Evidence-with-interpretation')"
  - concept: "Three candidate architectural principles (not yet constitutional invariants): composition must not silently transfer semantic ownership; transformation must not silently change semantic identity; expression changes are not evidence of identity changes"
  - concept: "Vocabulary-layer distinction: Term != Concept != Usage (Term -> general concept -> constitutional Evidence -> implementation object -> database table), with an explicit review question of where architectural meaning actually becomes normative"
  - concept: "Five distinct time types for Evidence: Event Time (when it happened) / Capture Time (when observed) / Evaluation Time (when interpreted) / Publication Time (when frozen/published) / Knowledge Time (when the system knew it) -- more precise than a single created_at field"
  - concept: "Six-lens sequence for architecture review: Ganesha(what is it?)->Leonardo(what else could it be?)->Krishna(why should it exist?)->Panini(how can it transform?)->Topology(what survives transformation?)->Shani(what must never break?) -- meaning->alternatives->purpose->transformation->structure->invariants progression"
  - concept: "Explicit governance-architecture decision: Panini and Topology remain diagnostic/supporting lenses feeding the four ARB judgments (Ganesha/Leonardo/Krishna/Shani), never becoming additional equal voting dimensions -- preserves governance simplicity while strengthening architectural analysis"
