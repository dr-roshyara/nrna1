  - concept: "A formalized twenty-section source-extraction protocol (Book Identification, Why Read, Core Source Facts, Distinctions, Arguments, Evidence/Justification Model, Truth Model, Knowledge Limits, Identity/Reference/Meaning, Temporal/Revision Model, Failure Cases, Boundaries, KnowledgeOS Relevance, Challenges, Cross-Lens Comparison, New Research Questions, Falsification Opportunities, mandatory 'What This Book Does NOT Establish,' High-Value Extraction Table, Research Recommendation, Final Research Ledger), substantially more disciplined than the corpus's prior ad-hoc adversarial-lens engagements"
  - concept: "Referential opacity formally founded (Argument D, Giorgione=Barbarelli): referential identity does not guarantee substitutability inside every linguistic context"
  - concept: "'The unit of empirical significance is the whole of science' -- holistic empiricism crystallized as evidence constrains a system ≠ evidence uniquely determines which proposition changes"
  - concept: "Identity as a discourse-relative modelling operation ('identification of indiscernibles relative to a discourse'), explicitly distinguished from unrestricted metaphysical identity"
  - concept: "Anti-reification discipline: general terms need not name universals; converting a predicate/schema/distinction into a first-class entity changes the ontology of the discourse and is a consequential, auditable operation"
  - concept: "Ontological commitment analysable through quantification (what must be values of bound variables), providing a formal method for detecting hidden commitments instead of inferring them from surface vocabulary"
  - concept: "Explicit refusal to manufacture cross-lens convergence without independent evidence: only three narrowly-scoped cross-lens observations (Quine->Gödel, Quine->DDD, Quine->deterministic assurance) delivered, each explicitly labeled a research question or lens observation, never architecture"
  - concept: "Formally-tagged extraction status vocabulary (SOURCE FACT / SOURCE DISTINCTION / SOURCE ARGUMENT / SOURCE LIMIT / SOURCE FAILURE CASE / SOURCE BOUNDARY / RESEARCH HYPOTHESIS / RESEARCH QUESTION / LENS OBSERVATION / HIGH-VALUE RESEARCH QUESTION), applied consistently across the extraction table and relevance sections"
defines:
  - concept: "Ontological commitment (Quinean, formal)"
    definition: "A discourse is ontologically committed to the entities that must occur among the values of its bound variables for the discourse's assertions to be true; explicitly distinct from what actually exists, and not inferable from surface nouns/names/predicates"
  - concept: "Referential opacity"
    definition: "A linguistic context in which substitution of co-referential terms (e.g. Giorgione for Barbarelli) can change a statement's truth value -- identity of reference does not guarantee unrestricted substitutability"
  - concept: "Discourse-relative identity (identification of indiscernibles)"
    definition: "Objects that cannot be distinguished within a particular discourse may, for purposes of that discourse only, be reconstructed as one object -- identity-in-a-discourse is explicitly not unrestricted metaphysical identity"
