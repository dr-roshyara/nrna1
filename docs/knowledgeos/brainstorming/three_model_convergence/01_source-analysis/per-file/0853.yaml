defines:
  - concept: "The three/four-timeline model (C(t), I(t), V(t), G(t))"
    definition: "A historiographical safeguard requiring at least three (and, for philosophy-integrated projects, four) genuinely separate timelines to be tracked for any major concept: C(t) records when the underlying idea conceptually emerged, I(t) records when it was actually implemented in software, V(t) records when it was verified to actually work, and (specifically for this project) G(t) records when a corresponding Gita chapter reflection was introduced into the interpretation -- these four moments are frequently far apart in real engineering history (e.g. a provenance concept emerging at Step 20, implemented at Step 60, verified at Step 95), and collapsing them into a single date (as in 'we introduced provenance in Step 95') would misrepresent the actual intellectual history. Comparing C(t) against G(t) via the chronology-gap measure Δ_j=FirstGitaReflection-FirstTechnicalAppearance provides concrete, checkable evidence for whether a technical concept preceded or followed its corresponding philosophical reflection, without asserting the gap itself proves causation"
  - concept: "'Trust as an emergent property'"
    definition: "Rather than treating trust as a single implementable feature, trust is proposed as a property that emerges from the combination of five other established architectural concerns: Provenance, Verification, Authority, History, and Semantic Integrity (Trust=f(P,V,A,H,SI)) -- explicitly framed as a qualitative dependency model, not a probability equation, potentially explaining why a diverse set of seemingly unrelated architectural features (provenance, governance, AI generation validation, versioning, evidence, deterministic checks, semantic boundaries) all belong together: they each contribute to whether a downstream engineer can legitimately trust a knowledge artifact. This proposal is immediately self-disciplined with the explicit warning that Trust must not become 'the new vague umbrella' -- it should remain a derived property unless historical evidence specifically shows it was itself a primary architectural concept the corpus's own work was organized around"
