    refinement: "Operationalized at the scope-boundary level for Phase 3C specifically: this reconstruction's own primary corpus (docs/knowledgeos/brainstorming/) and the synthesis workplace itself are both explicitly excluded from feeding into the repository-conformance evidence base, precisely to prevent the same circularity risk identified there"
  - concept: "0759's new standing rule (corpus statistics as time-stamped observations, not timeless properties)"
    refinement: "Directly instantiated as conformance rule 9 ('record all counts and verdicts with timestamps'), confirming the standing rule proposed at 0759 was actually carried forward into the next phase's formal governance instructions"
  - concept: "0760's book-architecture discipline (folder-per-chapter, chapter titles deferred, no brainstorming-session-folder book structure)"
    refinement: "Reaffirmed and extended with the concrete capstone framing distinguishing what the old corpus explains (how KnowledgeOS was discovered) from what the canonical architecture explains (what KnowledgeOS became), with the book required to explain both without anachronism"
