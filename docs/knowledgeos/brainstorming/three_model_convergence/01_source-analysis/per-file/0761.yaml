defines:
  - concept: "'No NOT ESTABLISHED may be silently upgraded' (conformance rule 5)"
    definition: "Once a tested repository-vs-architecture relation is verdicted NOT ESTABLISHED (insufficient evidence to determine conformance either way), that verdict must never later be quietly changed to CONFORMANT or NON-CONFORMANT without new, explicitly recorded evidence and a documented reasoning trail -- the epistemic humility of 'we don't know' must be as durable and protected as a positive or negative finding"
  - concept: "The evidence/interpretation/verdict separation (⟦E⟧/⟦INT⟧/⟦V⟧)"
    definition: "Every conformance-audit statement must be explicitly tagged as raw repository evidence (⟦E⟧, what was directly observed in the code/config/docs), interpretation (⟦INT⟧, what that observation is understood to mean), or verdict (⟦V⟧, the resulting conformance classification) -- and every verdict must be traceable back through its interpretation to the specific evidence that grounds it, never asserted independently"
