    definition: "A computational provider (e.g. an LLM) producing an artifact of a given epistemic type (e.g. Hypothesis) does not thereby gain the authority to promote it to a higher epistemic status (e.g. VerifiedFact); the kernel retains epistemic authority while providers remain interchangeable computational participants"
