    definition: "K_L=(A,T,P,E,I,X,R) is the mathematically fundamental kernel (State is theoretically reconstructible from Events); K_O=K_L+StateProjection+Indexes+Caching adds operationally necessary but logically non-fundamental elements for practical performance"
  - concept: "I_CompositionalProvenance"
    definition: "Valid transformations must preserve required ancestry across composition — a composed transformation chain's ancestor set must be a superset of each component transformation's ancestor set plus its own direct inputs, preventing provenance loss through valid-looking pipeline composition"
