defines:
  - concept: "The Agent hallucination boundary"
    definition: "A named consolidation of three distinctions that must all hold for an AI-agent-integrated knowledge system to avoid confusing AI output with organizational truth: AgentAssertion≠Evidence (an agent's claim is not evidence unless backed by actual tool-execution/observation provenance), AgentRecommendation≠Decision (an agent's suggestion is not an authorized organizational decision), and AgentCapability≠Authority (an agent's technical ability to perform an action does not confer the authority to do so)"
  - concept: "Control-loop integrity ('weakest critical transition')"
    definition: "A control loop's overall strength is bounded by its weakest critical transition stage, not by the average or the strongest stage; excellent detection with zero governance yields a mere detection system, and excellent governance with zero runtime observation yields a mere governance repository — neither constitutes a genuine closed-loop KnowledgeOS"
  - concept: "KnowledgeOS must preserve epistemic status"
    definition: "Every knowledge item in the system must retain an explicit marker of its epistemic status along a spectrum (Observed, Verified, Asserted, Inferred, Proposed, Authoritative) and this status must never be silently upgraded (e.g. an Inference must never silently become Authoritative); self-declared arguably the most important architectural property discovered across this entire reconstruction"
  - concept: "The Knowledge-promotion pipeline"
    definition: "Raw→Observed→Supported→Validated→Authoritative — a five-stage pipeline through which a piece of information must pass before being treated as organizational knowledge, with the final Validated→Authoritative transition requiring explicit delegated authority, never occurring automatically regardless of how well-supported the information is"
  - concept: "The Candidate KnowledgeOS Constitution (K1-K7)"
    definition: "Seven candidate constitutional invariants consolidating the reconstruction's accumulated findings: K1 Provenance, K2 Authority, K3 Verification, K4 Temporal validity, K5 Epistemic separation, K6 Agent boundary, K7 Traceability — explicitly held as candidates pending further testing and deduplication in Step 120, not yet a ratified constitution"
