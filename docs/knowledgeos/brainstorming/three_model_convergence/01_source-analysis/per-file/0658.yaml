defines:
  - concept: "Recommendation≠EvidenceOfRecommendationCorrectness"
    definition: "An AI agent's recommendation being executed, followed by an observed positive outcome, does not validate the correctness of the AI's underlying causal reasoning; the outcome may result from unrelated external factors, and treating execution-plus-success as self-validating evidence creates a dangerous feedback loop biasing future recommendations"
  - concept: "Causal transportability (Effect(C_1)⇏Effect(C_2))"
    definition: "A causal effect estimated in one context (e.g. one organizational department, population, or time period) does not automatically transfer to a different context; applying a learned causal rule cross-context requires an explicit transferability assessment, not automatic extension"
  - concept: "The governed causal learning loop"
    definition: "Observe→Explain→Decide→Intervene→ObserveOutcome→EvaluateCause→ReviseKnowledge — a formalized organizational learning cycle explicitly requiring independent outcome evaluation (separating DecisionMaker from Evaluator) rather than allowing an AI's own recommendation-and-execution to self-certify its causal correctness"
