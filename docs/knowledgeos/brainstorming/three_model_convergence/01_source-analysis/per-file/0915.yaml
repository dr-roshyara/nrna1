defines:
  - concept: "The seven-level evidence hierarchy for empirical validation"
    definition: "A graded classification of evidentiary strength for any claim that a theory has been empirically validated: Level 0 (Assertion -- someone simply states the theory works, no evidence); Level 1 (Static correspondence -- an implementation object superficially appears to correspond to a theory construct, without execution); Level 2 (Unit execution -- an individual component executes in isolation); Level 3 (Integration execution -- several components execute together, still without comparison to expected/observed outcomes); Level 4 (Controlled empirical test -- predicted and observed behaviour are explicitly compared); Level 5 (Real KnowledgeOS validation -- the theory reproduces representative behaviour of the actual real system, not merely synthetic fixtures); Level 6 (Independent reproduction -- a separate implementation or test harness, built independently, reproduces the same result). The file explicitly states that only Levels 4 through 6 count as substantive empirical evidence -- Levels 0 through 3, however common they may be in practice, do not by themselves establish that a theory has survived empirical contact with reality"
  - concept: "Metamorphic testing for theoretical invariants"
    definition: "A testing methodology that validates a theory by checking that DERIVED, THEORY-PREDICTED RELATIONSHIPS between multiple test executions hold, rather than only comparing each individual execution's output against one fixed expected value. For example, if the theory establishes that two operations o_1 and o_2 are semantically independent (o_1⊥o_2), metamorphic testing checks the derived invariant T(T(K,o_1),o_2)≈T(T(K,o_2),o_1) (order-independence) directly, rather than merely checking each individual transformation's output separately. Critically, the test must never assume an invariant the theory itself does not predict -- if the theory does not establish commutativity for a given operation pair, the test must not silently assume or check for it, since doing so would test an unstated hypothesis rather than the theory actually specified"
