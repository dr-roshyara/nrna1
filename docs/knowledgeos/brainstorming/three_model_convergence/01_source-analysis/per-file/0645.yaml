defines:
  - concept: "DecisionPolicy≠UniversalMathematicalFormula"
    definition: "Expected-utility maximization, minimax, constrained optimization, risk-sensitive utility, satisficing, lexicographic prioritization, and regulatory rule-following are all legitimate decision policies in different domains; mathematics supplies the tools, but the domain/governance context determines which policy is legitimately applicable, preventing mathematics from silently becoming business policy"
  - concept: "Decision selection≠Authorization"
    definition: "The system can determine that a is the best feasible alternative under the applicable policy (Selected(a)=True) without that alone granting permission to execute it (Authorized(a) remains a separate, independently governed determination)"
  - concept: "Objective manipulation as a governance violation"
    definition: "Silently replacing a decision's governing objective (e.g. MaximizeProfit replaced by MaximizeAgentReward) is categorically different from an ordinary decision error — it corrupts the very criterion by which decisions are evaluated, requiring objectives and utility-model weights to be versioned, referenced, and governed rather than left implicit inside an AI prompt"
  - concept: "Decision sensitivity/local robustness"
    definition: "A decision D(K)=a is locally robust if it remains a across a neighborhood N(K) of the current knowledge state; a decision near a threshold where a small assumption change flips the optimal action is highly sensitive, and reporting this sensitivity is more useful to human governance than a bare confidence score"
  - concept: "I_DecisionAuthority, I_DecisionBasis, I_ActionBoundary, I_ObjectiveIntegrity"
    definition: "Four new formal invariants: knowledge alone cannot authorize an action; every consequential decision must reference its required knowledge/policy/objective/computational basis; decision selection does not imply execution; and consequential decision objectives cannot be silently modified by an ungoverned agent"
