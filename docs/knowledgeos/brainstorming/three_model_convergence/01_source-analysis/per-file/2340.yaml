about: >
  Opens with the mandate's own anticipated outcome, confirmed: "the correct outcome may be that Reiter
  gives a rigorous framework AROUND these boundaries rather than solving them. That is the outcome."

  **DELIVERS A FIVE-QUESTION TEST TABLE**: is Observation an action? (Reiter's sensing-action shape
  exists, but "the corpus reopened Observation as OPEN in v1.2 and has not closed it" -- OPEN); is
  Observation a fluent? (not decidable from either source -- OPEN); is sensing an action whose effect is
  on knowledge? (yes in Reiter [EXT], but whether KnowledgeOS's Observation is that kind of thing is not
  settled by Reiter merely having a construct of that shape -- OPEN); is Qualify a precondition?
  (REFUTED, P4, with the deepened reasoning: "Poss(a,s) gates whether an action may occur; Qualify
  concerns whether a qualification holds of a knowledge item. Different type, different pipeline
  position" -- directly sharpening this reconstruction's already-tracked Poss≠Qualify finding from
  files 2335/2339 with the precise type-distinction argument); is Qualify an operation, or an epistemic
  boundary rather than a computable function? (not decided, and KR-CONTR-EVAL "makes the third option
  live: the programme has already found one case where an apparent function was really a boundary
  [reason]" -- OPEN).

  **DELIVERS THE GOVERNANCE-LEVEL EXPLANATION FOR WHY SENSING DOES NOT TRANSFER**: "Reiter's sensing
  works because knowledge is modelled by an accessibility relation and is factive. R1 decided that
  KnowledgeOS's object is A_t, an attribution, and that no component may assert Knows. [NEG] Reiter's
  knowledge operator and KnowledgeOS's object are different predicates by governance decision, not by
  oversight. Sensing's formal guarantees are guarantees about a factive operator and do not carry over
  to attribution." This is an important methodological distinction: the gap between Reiter's Knows and
  KnowledgeOS's A_t is not an unfinished-research gap but a deliberate, already-ratified governance
  choice (R1), so no amount of further formal work on sensing will close it.

  **CLOSES CONFIRMING**: "Observation OPEN, Qualify OPEN, O/T OPEN. Reiter changes none of them. Recorded
  as required by the mandate."
