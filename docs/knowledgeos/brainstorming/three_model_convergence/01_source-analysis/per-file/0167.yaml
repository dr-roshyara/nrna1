about: >
  Produces the first formal ADR-format artifact in the corpus's own brainstorming thread:
  "ADR-KOS-KERNEL-001 -- KnowledgeOS Kernel Scope and Boundary," Status PROPOSED, explicitly
  "Implementation: NOT AUTHORIZED by this ADR." It resolves an altitude ambiguity (KnowledgeOS-as-
  ecosystem vs. KnowledgeCore-as-bounded-context vs. Kernel-as-constitutional-altitude vs. Kernel-as-
  smallest-executable-boundary) by declaring the Kernel a proper subset of KnowledgeOS, defined by "the
  smallest authoritative boundary that must exist to preserve KnowledgeCore's constitutional invariants,"
  explicitly ruling that conceptual relatedness is NOT sufficient justification for Kernel membership
  (restating the DDD falsification result from 0155/0157). Enumerates six explicit exclusions (semantic
  interpretation, truth determination, mechanism intelligence/no dependency on GPT/Claude/DeepSeek/Kimi/
  embeddings, workflow orchestration, infrastructure, governance administration). States the still-
  proposed hypothesis (KnowledgeAggregate + ConflictRecord + Verification Port as sole inbound admission
  gate) as PROPOSED, NOT an implementation contract, and lists nine still-unresolved questions (rejection/
  refusal semantics, ambiguity vs. contradiction, Confidence derivability, existing-aggregate operations,
  identity continuity, evidence resolvability, authority adequacy, capability taxonomy, DEF-1). Declares an
  explicit "Architectural Sequence" (Brainstorming -> Domain distinctions -> DDD scenario/invariant
  analysis -> Smallest consistency boundary -> Kernel boundary definition -> HPA/ARB ruling -> Kernel
  capability mapping -> Independent falsification -> Logical Architecture -> Implementation decision ->
  Kernel implementation), confirming the Kernel Boundary Definition step has still not been reached. A
  second, appended discussion then explores whether today's narrow Kernel could later anchor a "future
  cognitive computer" (perception/reasoning/planning wrapped around an epistemic core), explicitly warning
  that "the possibility of becoming part of a future computer brain must never be used to enlarge the
  present Kernel boundary."

introduces:
  - "ADR-KOS-KERNEL-001 (PROPOSED), the corpus's own first formal ADR artifact for Kernel scope: freezes
    vocabulary (KnowledgeOS != Kernel; Kernel is a proper subset of KnowledgeOS via KnowledgeCore), states
    the decisive membership question ('what invariant becomes invalid if these elements change
    independently?'), and explicitly is NOT an implementation authorization"
  - "Six explicit Kernel exclusions as governance-level prohibitions, not merely observations: semantic
    interpretation, truth determination, mechanism/vendor intelligence (named: GPT, Claude, DeepSeek,
    Kimi, embeddings, vector DBs), workflow orchestration, infrastructure, governance administration"
  - "Four-way capability taxonomy for future capability mapping: domain capabilities / boundary-invariant
    properties / anti-capabilities-prohibitions / supporting mechanisms -- explicitly must not be
    collapsed into one 'capability' list"
  - "An explicit twelve-step 'Architectural Sequence' from Brainstorming through Kernel implementation,
    confirming the current governance position sits at or before 'Kernel boundary definition'"
  - "A 'future cognitive computer' analogy (Kernel as the epistemic-memory/integrity substrate of a larger
    perceive/reason/plan/act system) with an explicit anti-scope-creep constraint: this future possibility
    must never be used to enlarge the present Kernel boundary"

defines:
  - "One-sentence canonical definition proposed for ratification: 'The KnowledgeOS Kernel is the smallest
    authoritative KnowledgeCore boundary required to preserve and enforce the constitutional integrity of
    admitted epistemic knowledge and its lawful state transitions, while remaining incapable of becoming
    the semantic interpreter, truth oracle, workflow engine, or external governance system.' -- PROPOSED
    only, pending HPA/ARB ruling"

