  - "Restates the still-proposed KnowledgeAggregate+ConflictRecord+Verification-Port hypothesis already
    seen at 0165's illustrative sketch, explicitly re-flagging it as PROPOSED, NOT an implementation
    contract, still carrying the same nine open questions"

