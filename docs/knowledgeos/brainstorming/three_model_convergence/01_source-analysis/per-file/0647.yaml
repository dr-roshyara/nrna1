defines:
  - concept: "Executable≠Validated"
    definition: "A model can continue to run successfully and produce outputs (Executable=True) while no longer meeting the conditions under which it was last confirmed trustworthy (Validated=False, e.g. its validity period has expired) — the two properties must be tracked independently"
  - concept: "OperationalHealth≠EpistemicValidity"
    definition: "A model service can be fully operational (available, responsive, returning HTTP 200) while its predictions are systematically wrong or biased — operational health measures whether the computation executes, epistemic validity measures whether its outputs remain trustworthy; the two are tracked as independent status dimensions"
  - concept: "Model performance≠Model authorization"
    definition: "A model achieving strong measured performance (e.g. high accuracy) does not by itself authorize its promotion to production use; promotion requires independent validation and governance approval, exactly analogous to the corpus's established Decision≠Authorization principle"
