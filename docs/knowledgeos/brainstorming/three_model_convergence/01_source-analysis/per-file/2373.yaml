about: >
  Fourth KR-SIM Gītā companion study (parallel to this reconstruction's already-tracked files 2329,
  2370, 2372), applied against KR-REP-REDUCTION-AUDIT-2026-09, whose decisive finding was "an assumption
  two parties held and neither tested -- that desc=(n+1)-asc. I asserted it; review restated it in
  better vocabulary; the tie-break falsified it, 21,369 times."

  **DELIVERS CORROBORATION C-1 FOR THE VALUE OF AN AUDIT STEP SPECIFICALLY** (2.11, "you grieve for
  those who should not be grieved for -- and you speak words of wisdom"): "Kṛṣṇa's first substantive
  line is not a correction of Arjuna's conclusion. It is the observation that his reasoning is well-
  formed and his premise is not examined... the defect is upstream of the argument." Corroborates "what
  the audit gate exists to catch" -- results.md §5 was well-formed, reviewed, and improved in wording by
  a second party, "neither pass touched the premise. The audit did, and only because its protocol said
  'formally prove' rather than 'state'." Explicitly: "this corroborates the VALUE OF AN AUDIT STEP. It
  supplies no method -- no way to know which premise to examine."

  **DELIVERS THE SHARP REVIEW-VS-AUDIT DISTINCTION (LENS L-1)** (4.40, 4.42, saṁśayātmā vinaśyati/
  jñāna-asinā): "an unexamined assumption and a live doubt are different failure modes. Saṁśaya is doubt
  one HAS; the §5 error was an assumption one DOES NOT KNOW ONE HAS. The text addresses the first and is
  silent on the second... the distinction is the whole difference between review and audit: REVIEW
  INTERROGATES WHAT IS STATED, AUDIT INTERROGATES WHAT IS ASSUMED." This is a genuinely sharp
  methodological distinction, independent of and beyond the already-tracked doubt≠contradiction finding
  from file 2329.

  **DELIVERS CORROBORATION C-2, EXPLICITLY 'THE MOST APT OF THE STUDY'** (2.47, reused a third time
  across this series for a new purpose): "the audit was run knowing it might destroy the experiment's
  headline result. It did... execute the check; do not select it by its expected outcome. A checklist
  run only where one expects to pass is not a checklist."

  **DELIVERS A SECOND EXPLICIT REFUSAL OF THE SERIES' MOST TEMPTING VERSE** (18.66, "abandoning all
  duties, take refuge in Me alone"): "⚠️ REFUSED. This is the most dangerous verse in the text for a
  research programme, because it licenses exactly what the governance freeze forbids: a shortcut from
  evidence to conviction." Explicitly connects the current frozen transition (EXPERIMENT→AUDIT→
  ADJUDICATION→THEORY-v1.3, "no shortcut into theory or kernel") to why reading 18.66 as "trust the
  synthesis" would dissolve it. Explicitly noted: "it is the SECOND TIME this strand has had to refuse
  its most quotable verse -- 2.50 (skill in action) was refused in the previous study for the same class
  of reason" -- directly confirming and cross-referencing this reconstruction's already-tracked file
  2372 refusal.

  **DELIVERS THE CORROBORATION MAP**: four of eight elements get nothing, including every technical
  finding -- "the text speaks to the posture of auditing, never to its content."

  **DELIVERS A FOUR-ITEM CANDIDATE REGISTER**: G-15 (competence-is-not-verification, lens, already
  operationalized by the audit protocol); G-16 (unexamined-assumption≠live-doubt, "the sharper of the
  two" lenses); G-17 (execute-check-independent-of-expected-outcome, corroboration, established
  internally not learned here); G-18 (~~set the framework aside for the synthesis~~, REFUSED).

  **DELIVERS THE UPDATED RUNNING COUNT AND AN EXPLICIT ARGUMENT-SHORTENING NOTE**: "kernel candidates --
  NONE. SIXTH CONSECUTIVE TIME. The argument is now purely structural and does not need restating at
  length" -- extending this reconstruction's already-tracked running count (files 2370's fourth, 2372's
  fifth) to a sixth occurrence, with the recurring argument now compressed to a bare structural
  restatement.

  **CLOSES WITH THE VALUABLE EPISTEMIC-HYGIENE OBSERVATION**: "not that two refusals in two studies
  means the text is unproductive. A source that never requires refusal is not being read critically."
  And: "this study's yield is two lenses, one corroboration, and one refusal. The refusal -- of the
  text's most famous verse, because it would license the one shortcut the programme forbids -- is again
  the most useful of the four," directly echoing file 2372's identical closing structure and confirming
  a consistent pattern across the series: the refusal of the most tempting misreading is repeatedly
  valued as the study's single most useful output.
