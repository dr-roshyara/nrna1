  - concept: "0673's Embeddings are never authoritative knowledge"
    refinement: "Complemented (not duplicated) by a distinct privacy-specific caution: embeddings can also leak sensitive information and require access control, addressing a different failure mode (confidentiality) from 0673's epistemic-authority concern"
