defines:
  - concept: "Permission to Act≠Permission to Know (CanAct(A,x)⇏CanKnow(A,k))"
    definition: "An actor authorized to perform an action is not automatically authorized to access all information relevant to that action; action authorization and information authorization are independent dimensions requiring separate evaluation"
  - concept: "Authorization should constrain retrieval, not merely final presentation"
    definition: "Restricting an AI agent's visible output after it has already retrieved and processed restricted information is insufficient, because the confidentiality boundary is crossed the moment restricted data enters the agent's processing context, regardless of whether it is later filtered from the final response; access policy should instead constrain what is retrieved in the first place (Retrieve(Q,A,P) rather than bare Retrieve(Q))"
  - concept: "Context=EpistemicBoundary+SecurityBoundary"
    definition: "The context window an AI agent receives simultaneously determines what the agent can epistemically reason about (extending the corpus's information-bottleneck framing) and what it can potentially disclose (a security boundary); both dimensions must be jointly managed by authorized, purpose-aware retrieval rather than treating context construction as a purely epistemic concern"
  - concept: "PrivacyPolicy≠PrivacyEvidence"
    definition: "A stated policy claiming that sensitive information is protected is not, by itself, evidence that protection is actually enforced; privacy claims require empirical testing (e.g. automated unauthorized-access-path attempts) analogous to the corpus's established test-versus-proof discipline, and such testing remains evidence, never universal proof"
