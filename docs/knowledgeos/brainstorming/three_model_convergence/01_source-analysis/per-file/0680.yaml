about: >
  **CONFIRMS the new-territory assessment from 0679.** Opens with the central distinction
  `Permission to Act≠Permission to Know` (`CanAct(A,x)⇏CanKnow(A,k)`, confirmed via a manager-authorized-to-
  approve-but-not-see-salary-details experiment, PASS). Delivers a formal information-access model
  `Access(A,K,C)` and Knowledge classification (`Public, Internal, Confidential, Restricted`), confirmed via
  a clearance-mismatch experiment (PASS), with the crucial and correctly-reasoned caveat that classification
  alone is insufficient -- **Need-to-know formalized** (`Need(A,K,Q)` for purpose `Q`, confirmed via a
  same-clearance-wrong-purpose experiment, PASS), crystallizing **`Purpose limitation`**:
  `Access=f(Identity, Role, Classification, Purpose, Need, Context, Time)`, significantly stronger than
  role-based access alone.

  Delivers Temporal access (`Auth(A,K,t_1)⇏Auth(A,K,t_2)`, confirmed via a revoked-access-date experiment,
  PASS) and **Data minimization** formally required (an exact date of birth exposed when only an age-range
  threshold was needed, confirmed via a dedicated experiment, PASS), with the important and correctly-
  reasoned caveat that **derived information can also leak** -- a sufficiently narrow salary band uniquely
  determining the raw salary, confirmed via a dedicated experiment (`PrivacyLeak` -- PASS). Delivers
  Inference attacks formally represented (`K_1,...,K_n⇒K̂`, an investigation inferred from access-log/
  workflow-state side signals without any direct disclosure, confirmed via a dedicated experiment, PASS),
  crystallizing privacy as "a property of information flow," not merely direct disclosure.

  **Delivers the file's first central formal deliverable -- a correctly-applied information-flow
  confidentiality lattice**: `Public⊑Internal⊑Confidential⊑Restricted`, with `PermittedFlow(Label(K_1),
  Label(K_2))` required before any information transformation, confirmed via a restricted-content-
  accidentally-embedded-in-a-public-artifact experiment (`InformationFlowViolation`/`IllegalFlow` -- PASS×2),
  and Sanitization explicitly requiring an approved, validated transformation rather than automatic
  reclassification (confirmed via a dedicated experiment, PASS) -- this is standard, correctly-applied
  information-security lattice theory (Bell-LaPadula-adjacent, though not explicitly named as such), a
  genuinely new formal tool for the corpus.

  **Delivers the file's second and most currently significant central formal deliverable -- AI-specific
  output-control and context-security, directly and precisely addressing a real, actively important
  production LLM/RAG security concern not previously this concretely addressed**: an AI agent with access to
  `K_restricted` incorrectly producing a `Public`-labeled summary in response to "summarize everything you
  know," confirmed via a dedicated experiment (`InformationDisclosure` -- PASS), motivating extended
  Knowledge lineage (`Source→Evidence→Knowledge→Inference→AIOutput`) with inherited classification
  constraints, confirmed via a paraphrased-but-still-sensitive-summary experiment (PASS), and
  `Classification(K)=f(Classification(E_1),...,Transformation)` -- a summary combining public and restricted
  sources cannot automatically inherit the public classification, confirmed via a dedicated experiment
  (PASS).

  **Delivers the file's third central formal deliverable -- Differential privacy correctly and precisely
  stated, genuinely new classical privacy-theory content**: `P(M(D)∈S)≤e^ε P(M(D')∈S)` for neighboring
  datasets, confirmed via a dedicated experiment (PASS), with Privacy budget composition correctly applied
  (`ε_total≤∑ε_i`, a worked example showing 100 releases at `ε=0.1` each accumulating to `ε_total≤10`,
  confirmed via a dedicated experiment, PASS), crystallizing `Privacy≠one isolated query` and motivating
  `HistoryOfDisclosures` tracking as a temporal-state concern.

  **Delivers the file's fourth central formal deliverable -- an explicitly acknowledged, unresolved
  governance tension between audit retention and privacy deletion, intellectually honest rather than
  papered over**: "Auditability may require ImmutableHistory. Privacy policy may require Deletion. These
  cannot always both be satisfied naively... KnowledgeOS must not hide the conflict," confirmed via a
  dedicated experiment correctly requiring `GovernanceConflict` escalation to an explicit retention/legal
  policy rather than a silent default resolution (PASS) -- directly and genuinely extending the corpus's
  established discipline of surfacing rather than silently resolving governance conflicts (0645, 0664).
  Delivers Deletion propagation across derived artifacts (a deleted source record whose AI-generated summary
  still contains identifying details, confirmed via a dedicated experiment, `Privacy lifecycle has not
  completed` -- PASS) and Identity/event-semantics separation as a practical minimization technique
  (confirmed via a dedicated experiment, PASS).

  Delivers Contextual, multi-factor access (`Access=f(A,K,P,t,C,R)` including device-trust and risk,
  confirmed via an untrusted-device-blocking-otherwise-permitted-access experiment, PASS) and Purpose-bound
  knowledge (evidence collected for a security investigation reused for employee-performance ranking,
  confirmed via a dedicated experiment, PASS).

  **Delivers the file's fifth and most architecturally consequential central formal deliverable --
  `Authorization should constrain retrieval, not merely final presentation`, a precise and currently
  critical RAG-architecture security principle**: filtering restricted content only after full retrieval is
  explicitly identified as unsafe because the restricted information has already entered the AI agent's
  processing environment (confirmed via a dedicated experiment, PASS), motivating policy-aware retrieval
  `Retrieve(Q,A,P)` rather than bare `Retrieve(Q)` (confirmed via a differential-retrieval-result-by-actor
  experiment, PASS), crystallizing **the reframed RAG architecture itself**: `Query→Identity→Purpose→
  Policy→AuthorizedRetrieval→Evidence→Context`, replacing ordinary `Query→VectorSearch→Context` -- explicitly
  declared "a major architectural consequence" and directly relevant to a genuine, actively discussed
  security gap in real production retrieval-augmented AI systems.

  Delivers Embeddings explicitly identified as potentially sensitive representations in their own right (a
  restricted document's embedding remaining searchable in a public index, confirmed via a dedicated
  experiment, PASS), directly and genuinely extending 0673's `Embeddings are never authoritative knowledge`
  principle with a complementary privacy-specific caution: embeddings must also be access-controlled, not
  merely epistemically demoted. Delivers `PrivacyPolicy≠PrivacyEvidence` (a bare compliance claim without
  information-flow testing correctly judged insufficiently assured, confirmed via a dedicated experiment,
  PASS) and Privacy testing (10,000 automated unauthorized-access-path attempts, correctly framed as
  evidence, not universal proof, confirmed via a dedicated experiment, PASS), directly and genuinely
  extending the corpus's established test-versus-proof discipline (0674, 0676) into the privacy-testing
  domain specifically.

  **Delivers the file's sixth and capstone formal deliverable -- the Knowledge boundary object and the
  AI context window formally reframed as simultaneously an epistemic and security boundary**:
  `KnowledgeBoundary(A,t,P)` (dynamic across authority/purpose/policy/classification changes, confirmed via
  a context-exceeding-the-authorized-boundary experiment, PASS), crystallized as `Context=
  EpistemicBoundary+SecurityBoundary` -- what an agent receives determines both what it can know and what it
  can potentially disclose, with the confidentiality boundary explicitly identified as crossed at retrieval/
  context-construction time, not merely at output time (confirmed via a dedicated experiment, PASS) --
  directly and genuinely synthesizing 0673's information-bottleneck framing with this file's own security
  discipline into one unified concept.

  **Delivers eleven new named invariants, NONE of which are exact-name matches to any previously tracked
  invariant** (a genuinely clean file for this specific tracking dimension): `I_{InformationAuthorization}`,
  `I_{PurposeLimitation}`, `I_{DataMinimization}`, `I_{InformationFlow}`, `I_{DerivedProtection}`, `I_
  {AuthorizedRetrieval}`, `I_{PrivacyComposition}`, `I_{TemporalPrivacy}`, `I_{DeletionPropagation}`, `I_
  {AuditPrivacy}`, `I_{AIContextBoundary}`.

  Delivers Step 95's verdict **"STEP 95 — PASS,"** with the significant extension: "security and privacy =
  who may act + who may know + what may flow + for what purpose + at what time," and the important AI-
  specific architectural reframing: the architecture should not be `Agent→RAG→EverythingAgentCanRetrieve`
  but `Agent→Identity→Purpose→Policy→AuthorizedKnowledgeBoundary→Retrieval→Reasoning→ControlledOutput→
  AuthorizedAction` -- "a very different architecture from ordinary AI applications."

  **Closes with a direct, coherent continuation into "Step 96 — Learning, Adaptation and Model Evolution"**
  (not a flagged collision candidate -- explicitly and correctly signaled as the natural next question once
  privacy/security protections are established): "how can KnowledgeOS evolve without losing the
  correctness, provenance, authority, privacy and invariants we have established?", previewing learning,
  feedback, model evolution, concept drift, policy evolution, schema evolution, backward compatibility,
  versioning, and continuous assurance, crystallized as "how can KnowledgeOS change itself without silently
  changing what the organization means by truth, authority, decision, and governance?" No actual code
  execution reported in this file.
