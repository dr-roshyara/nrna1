  `≅_λ` (already tracked); (4) the `grantId` citation is WITHDRAWN as a different-layer defect (already
  tracked). Closes: "The HPA review accepted this artifact as written. These amendments come from applying
  the review's own equality mandate more deeply — the methodology found them, and it found them in the
  artifact the methodology was built from." Cross-references "Full analysis: `E1-E7-EQUALITY-INVESTIGATION.md`"
  (= this reconstruction's already-documented file 0994).

  **This file is therefore the closing bookend of the entire equality-investigation arc**: the original
