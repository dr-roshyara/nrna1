defines:
  - concept: "Partial order of events"
    definition: "P=(E,≺), irreflexive and transitive but not requiring total comparability — e_1∥e_2 (concurrency/unknown order) is a legitimate, first-class relation, never silently resolved to a false causal direction"
  - concept: "Epistemic convergence"
    definition: "EpistemicConvergence=EquivalentKnowledgeUnderEquivalentInputs — independent KnowledgeOS nodes given the same authoritative evidence, rules, and context should eventually derive equivalent epistemic states, a strictly stronger notion than storage-level eventual consistency"
  - concept: "Reproducibility tuple (extended)"
    definition: "R=(EvidenceSnapshot,IdentityVersion,SemanticVersion,RuleVersion,ModelVersion,PolicyVersion,AlgorithmVersion) — matching R across two evaluations guarantees identical deterministic output, Evaluate(R)=K"
  - concept: "KnowledgeBoundary"
    definition: "The evidence and authoritative sources available to a particular evaluation or agent; KnowledgeState=Evaluate(KnowledgeBoundary) — differing boundaries across nodes/agents legitimately produce differing knowledge states without either being wrong"
