about: >
  A substantive, historically-grounded (Gaṅgeśa Upādhyāya's 14th-century Tattvacintāmaṇi, 17th-century
  Navadvīpa scholars) engagement with Navya-Nyāya ("New Logic") -- a genuine precision relational
  calculus described by Daniel Ingalls as "the most precise calculus of properties produced before
  Frege." Proposes H-KOS-Relation-001 (relationships as first-class, not object attributes) as
  "probably one of the strongest kernel candidates discovered so far," reframes Context via Avacchedaka
  (delimiter/boundary-condition, not a flat dimension), and produces an 8-item Kernel Formula -- a
  fifth non-identical reshaping of the anchor across files.

introduces:
  - "⭐ H-KOS-Relation-001: 'KnowledgeOS SHALL treat epistemic relationships as first-class entities and
    SHALL NOT reduce them into attributes of knowledge objects.' Explicitly reinterprets EVERY prior
    forbidden-collapse pair (Evidence!=Authority, Observation!=Decision, Assessment!=Authority,
    Expression!=Meaning, Representation!=Identity) as a RELATIONSHIP constraint, not an object
    property -- a potential fundamental reframing of the whole dimension-based approach: is the kernel
    about STATE COMPONENTS or about RELATIONSHIPS BETWEEN them? Sourced from Sambandha (Relation),
    described as 'ontologically primary, not merely grammatical' in Navya-Nyāya"
  - "H-KOS-Context-002 (Avacchedaka/delimiter): 'KnowledgeOS SHALL preserve the delimiting conditions
    under which a proposition is valid.' REFRAMES Context (contested since 0088-0091) away from a flat
    state-dimension toward a boundary/delimiter concept -- 'context is not metadata, context is a
    logical boundary'"
  - "16 Padārthas (categories) mapped onto an epistemic-inquiry LIFECYCLE (not kernel entities):
    Observation -> Doubt -> Investigation -> Reasoning -> Challenge -> Determination -> Knowledge
    State, formalized as H-KOS-Lifecycle-Reasoning-001"
  - "Vāda/Jalpa/Vitaṇḍā (truth-seeking / competitive / destructive debate) -> H-KOS-Intent-001: the
    INTENT behind reasoning matters and should be classified, not just its content"
  - "Hetvābhāsa (5-type fallacy taxonomy, already named at 0092) -> H-KOS-Failure-001, restated from
    0093's H-KOS-Fallacy-001 under a slightly different name -- an internal near-duplicate naming
    event within the H-KOS-* scheme itself"
  - "Navya-Nyāya vocabulary beyond Sambandha/Avacchedaka: Pratiyogin/Anuyogin (counter-correlate/
    subordinate -- the two terms in a relation), Abhāva (typed, structured ABSENCE, not mere
    'nothing'), Tādātmya (non-extensional identity), Paryāpti (completeness, a quantification
    concept), Viśeṣaṇa-viśeṣya (qualifier-qualificand structure) -- and 'unbounded relational depth'
    (paramparā-sambandha: relations of relations of relations) -- among the most mathematically
    sophisticated Indian-logic content encountered in the corpus, approaching genuine formal semantics
    (the document itself notes attempts to encode Navya-Nyāya in modern type theory)"
  - "Updated Kernel Formula (a FIFTH non-identical reshaping of the anchor, after 0087/0089/0090/0091):
    'Preserves' 1-8 = Identity, Evidence, Authority, Context, Transformation, Time, Uncertainty,
    Knower (BOTH Context and Knower kept as separate items here, unlike 0091's merge/fold); 'Through'
    9-12 = Relations, Reasoning chains, Validation processes, Revision history -- explicitly a
    two-tier structure (preserved STATE vs. the MECHANISM that preserves it)"
  - "Explicit demotion: 'Nyāya liberation goal' (i.e. Mokṣa) placed in the 'Research Only' category,
    NOT among kernel-relevant candidates -- the corpus's first explicit disciplinary ruling on the
    Purification/Mokṣa correspondence row of the MD-015 Candidate Cross-Model Correspondence Table:
    treated as out of scope for kernel design, at least by this document's own classification"
  - "Final Insight, a five-lens summary: Vāṇī (meaning survives expression) + Zero (identity survives
    transformation) + Gita/Vedanta (knower and known cannot be separated) + Tarka (reasoning must be
    governed) + Navya-Nyāya (relationships are the primitive through which knowledge exists) ->
    'Knowledge is not a thing. Knowledge is a justified network of relationships between a knower, an
    object, evidence, reasoning, context, and conclusion.' Explicitly called 'likely the final missing
    piece before P4 mapping'"

