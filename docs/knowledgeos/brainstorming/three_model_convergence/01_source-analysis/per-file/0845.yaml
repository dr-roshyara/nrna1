  - concept: "0837's/0838's/0842's semantic-loss and contract-composition discipline (semantic sufficiency, Booleanization, the p(C_A)⇒p'(C_B) preservation condition)"
    refinement: "Extended specifically for AI transformations via the formal AI semantic-loss audit (Loss_semantic=CriticalAttributes_in-CriticalAttributes_out) and the proposed AITransformation→SemanticDiff capability, giving the arc's recurring semantic-loss concern its most concrete, directly implementable AI-specific mechanism yet"
