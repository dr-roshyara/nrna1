defines:
  - concept: "Concept genealogy"
    definition: "A tracked history for each major architectural or theoretical concept answering two questions: where did this concept first appear (even in unnamed, implicit form), and when did its meaning materially change? Modeled as a chain C_0→C_1→C_2→C_3, concept genealogy is explicitly distinguished from simply stating the final formalized name of a concept, since a genealogy like 'Initial Problem→Ad-hoc Rule→Repeated Failure→Explicit Constraint→Invariant→Architecture Constitution→Automated Assurance' carries far more explanatory and historical value than the bare statement 'we introduced an architecture constitution' -- flagged as potentially the single most valuable output the retrospective reconstruction could produce"
  - concept: "Architectural Underdetermination"
    definition: "A named, legitimate epistemic state (not a failure) in which the available historical evidence is genuinely compatible with more than one plausible architectural interpretation -- when this occurs, the correct response is to retain all compatible interpretations as open candidates in an uncertainty register until further evidence distinguishes between them, rather than arbitrarily forcing one interpretation to be declared true; this directly parallels the concept of underdetermination in the philosophy of science and statistical inference, applied here to the specific problem of reconstructing an architecture's true history from incomplete records"
  - concept: "The Semantic Preservation Principle"
    definition: "A candidate core architectural law for KnowledgeOS: for a knowledge state K with a designated set of critical semantic properties (P_critical(K)), any transformation T applied to K must ensure those critical properties survive into the transformed state (P_critical(K)⇒P'_critical(T(K)), equivalently Critical(K)⊆Preserved(T(K))) -- and whenever a transformation does intentionally remove a critical property, that removal must satisfy four conditions: it must be explicit (not incidental), documented, justified, and visible to any downstream consumer of the transformed knowledge, rather than silently disappearing"
