  - concept: "The five-layer knowledge-state model 𝔎_t=(G_t,σ_t,θ_t,λ_t,π_t)"
    definition: "The file's central mathematical result and direct answer to the 'what is K?' question opened at 0856's close: a knowledge state at time t is modeled as a five-component hybrid structure rather than any single conventional mathematical object -- G_t, a typed semantic graph of knowledge nodes and relations (types include motivates/supports/contradicts/refines/implements/supersedes); σ_t:V_t→S, an epistemic-status function assigning each node a status from a provisional vocabulary (Observed/Reported/Inferred/Proposed/Validated/Accepted/Superseded/Rejected); θ_t:V_t→TimeIntervals, a temporal-validity function distinguishing historically-valid from currently-valid; λ_t, a provenance subgraph per node reconstructing why it exists; and π_t, an uncertainty representation applied only where appropriate and never forced into a bare number, explicitly preserving the semantic type of whatever uncertainty measure is used (probability, confidence interval, likelihood, or qualitative category). Paired with the governed transformation signature T:(𝔎_t,C,E,A,P)→𝔎_{t+1}. Explicitly labeled 'the most promising mathematical foundation so far,' not yet a final theorem"
  - concept: "The rejected-alternatives ledger for the knowledge-state model"
    definition: "An explicit list of five candidate definitions of K considered and provisionally discarded, each with a specific stated reason: K=documents (too narrow -- excludes non-document knowledge); K=database records (implementation-centric -- conflates the domain model with a storage technology); K=all information (semantically undefined -- provides no way to distinguish observation from claim from decision); K=P(X), a pure probability distribution (too probabilistic -- most architecture statements are deterministic structural facts, not distributions); K=graph only (cannot adequately represent epistemic and temporal state -- a graph alone specifies relationships but not status, validity, or uncertainty). This is a rare, directly checkable record of the elimination process behind a synthesis result, complementing rather than merely asserting the accepted five-layer model"
