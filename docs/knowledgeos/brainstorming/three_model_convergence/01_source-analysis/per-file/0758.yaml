defines:
  - concept: "SYNTHESIS-ECHO"
    definition: "A classification for any document discovered in a historical corpus that is actually a copy of, or output derived from, this same synthesis project's own prior analysis or prompts -- such artifacts must carry Evidential weight=0, since treating them as independent historical evidence would create a self-reinforcing feedback loop"
  - concept: "Generative artifact chain (evidentiary unit)"
    definition: "A prompt and its full sequence of model response, follow-up response, and refinement/derived-artifact outputs constitutes exactly ONE epistemic lineage for evidentiary-weighting purposes, not one independent observation per generated document -- it counts as multiple independent evidence events only where an independently introduced challenge, new evidence source, experiment, or decision genuinely intervenes within the chain"
  - concept: "The formalization semantic-preservation test"
    definition: "For a conceptual construct C and a proposed formalization F(C), identify the invariant set I_C that gave C its original architectural meaning; if I_C(C)=I_C(F(C)) holds, the formalization has preserved the concept's semantic integrity (PRESERVED/REFINED); if not, the transformation must be explicitly classified (TRANSFORMED/DISPLACED/ABSORBED) and evaluated for whether it was explicit and justified, rather than assumed erroneous by default"
  - concept: "Gita/Atman investigation's structural (not ontological) architectural value"
    definition: "The Gita-derived lens's legitimate contribution to this architecture is as a conceptual instrument for discovering where architectural boundaries should be drawn (e.g. Knower vs. what-is-known; proposal vs. decision) -- never as a claim that the resulting architecture is thereby proven, validated, or grounded by the Gita itself; the distinction between 'useful for discovering boundaries' and 'proves the architecture' must be preserved exactly"
