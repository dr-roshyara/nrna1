about: >
  "Refined Step 287 · Invariants `𝓘` — Candidate Invariants, Derivability, Dependencies, Open Conditions,"
  status "RESEARCH ARTIFACT — NOT NORMATIVE / NOT ARCHITECTURE." **Directly resolves the "REFINED-STEP-287-
  INVARIANTS.md" bridge candidate** named in file 1034.

  **CONFIRMS THE STEP-287 NUMBERING COLLISION IN ITS OWN OPENING NOTICE**: "Three sources place equality at
  285 and Invariants at 287; my existing `REFINED-STEP-287.md` is the equality artifact. Both bodies of work
  are real; the identifier is contested and its resolution is a REGISTRY decision, not a research one" --
  directly confirming file 1034's already-tracked caveat, adopting the disambiguation "287-EQUALITY" and
  "287-INVARIANTS" going forward.

  **DELIVERS THE PROGRAMME'S ARGUABLY MOST IMPORTANT FINDING YET, EXPLICITLY LABELED AS SUCH**: "TWO SCHEMA-
  LEVEL BLOCKERS, before any candidate is assessed": (1) **`Admissible` IS NOT EVALUABLE** -- it depends on
  "`Assurance`, which the corpus has REFUTED AS DEFINABLE" (a new, significant corpus finding), and the
  ratified DC (Decision Contract, presumably) is a 6-tuple with no admissibility conjunction of its own,
  while the relevant law belongs to a distinct 7-tuple -- "the schema's ANTECEDENT cannot be decided"; (2)
  **`δ` HAS NO COMMIT CASE**: "`Γ` is derived and is not a component of `K`, so `δ` has nowhere to write a
  commitment. Executed: `K_1 IS K_0`" -- meaning the central transformation operation is CURRENTLY A NO-OP
  in executable terms -- "the schema's CONSEQUENT cannot be evaluated for the central operation." Concludes:
  **"Every invariant below inherits both blockers. No candidate can be ESTABLISHED while `Admissible` is
  undecidable and `δ`'s central case is a no-op. This is a SCHEMA-LEVEL CEILING, and it is the single most
  important result of this step."** This means the invariant-derivation programme is blocked not by any
  single unresolved equality relation, but by a more fundamental structural gap sitting ABOVE the equality
  question entirely.

  **Delivers the full seven-candidate invariant register**: `I-𝒩` (Knower persistence, CORPUS-SUPPORTED via
  FA-4/`Kṣetrajña`); `I-Π` (Provenance persistence, DERIVED, `t=0` proof, refined by a NEW corpus reference
  "step 265" `π∈K`); `I-A` (Admissibility gate, `G1 OPEN`, self-referentially undecidable); `I-C` (Command≠
  Transformation, DERIVED via `§256.21-22`, VACUOUS under `=_structural` and `≅_λ`, meaningful only under
  `=_semantic`); `I-V` (Validity independent of outcome, CORPUS-SUPPORTED, "✅ yes — static inspection," one
  of only two testable candidates); `I-I` (Identity≠State, CONDITIONALLY DERIVED, "inherits a live
  contradiction" between `id=H(P,e,c,t,Π)` and mutable `e.state`); `I-O` (Observation≠Interpretation,
  CONDITIONALLY DERIVED via Sañjaya, `Ω` lacks executable semantics). **0 of 7 fully ESTABLISHED.**

  **DELIVERS A GENUINELY IMPORTANT TAXONOMIC FINDING**: "`𝓘` is NOT one mathematical object. At least two
  kinds are present -- TRANSITION invariants (schema-shaped, `I-𝒩,I-Π,I-C,I-I,I-A,I-V`) and LAYER/TYPE
  invariants (statically shaped, `I-O` -- `Reality≠Observation≠Knower` holds statically, with no `δ` in
  sight). MERGING THEM UNDER ONE SYMBOL IS A CATEGORY ERROR." Forcing layer invariants into the transition
  schema would make them "vacuously true, because the antecedent never engages them."

  **Connects to a new corpus reference, "Step 259 §259.18"**: "the quantifier has no determinate meaning if
  `𝒯` is incomplete" -- an already-recorded failure mode for congruence, shown here to "apply identically to
  invariants," since every `∀o` in the invariant register quantifies over the still-unenumerated `𝒪`.

  **The vacuity audit (§6) confirms only `I-V` and `I-O` are testable today, and precisely because neither
  needs `δ`** -- "the invariant programme is blocked exactly where it depends on the transition system." This
  is the ALREADY-CORRECTED form per file 1034's M-6/M-7 fixes: the Vacuity column is now split into
  vacuity-safe and testable-today, and the count is corrected to "two, not one."

  **§7 delivers a dependency matrix confirming `I-C` (Command≠Transformation) as "the most dependency-loaded"
  candidate**: substantive only under `≡`-with-`Π`-excluded, vacuous under `≅_λ` -- "Decision 3 does not
  merely refine it -- it DECIDES WHETHER IT SAYS ANYTHING."

  **§8 confirms the independence pattern already tracked**: 5 of 7 candidates are KnowledgeOS-independent;
  the 2 non-independent ones (`I-𝒩` via Kṣetrajña, `I-O` via Sañjaya) are both corpus-native, not
  philosophical inference -- consistent with every prior finding in this pattern.
