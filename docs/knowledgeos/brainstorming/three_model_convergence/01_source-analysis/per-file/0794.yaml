defines:
  - concept: "TruthState vs. VerificationState (three-valued and four-valued refinements)"
    definition: "TruthState(P)∈{True,False,Unknown} captures what is known about the proposition's actual truth; VerificationState(P)∈{Verified,Failed,Unverified} separately captures whether a defined verification process has run and what it found -- these are independent axes (a claim can be TruthState=Unknown and VerificationState=Unverified simultaneously, which is entirely coherent), and a further four-valued extension {True,False,Both,Neither} accommodates genuinely contradictory evidence without forcing premature resolution, directly connecting to the corpus's earlier Conflict≠Error principle"
  - concept: "'KnowledgeOS must justify every additional abstraction by a problem it solves'"
    definition: "Architectural parsimony principle derived from a minimal-system counterexample: a conventional deterministic system (Request→Approval→Execution→AuditLog, no AI, no probabilistic reasoning, no knowledge graph) may already be sufficient for many domains, so KnowledgeOS's additional epistemic machinery (uncertainty handling, evidence graphs, AI-generated assessments, etc.) is justified only when the domain actually exhibits conditions such as uncertain knowledge, heterogeneous evidence, conflicting sources, or verification dependencies -- not merely because the machinery is conceptually interesting"
  - concept: "Record≠History≠Truth"
    definition: "A recorded artifact (a log entry, a database row) is not automatically an accurate historical account, and a historical account -- even an accurate one -- is not automatically the truth of what happened, since history itself may contain errors, omissions, conflicting accounts, or corrupted records; each step in Record→[interpretation]→HistoricalAccount→[reasoning]→KnowledgeClaim introduces its own assumptions, so a disciplined system should be able to say 'this is what the recorded evidence indicates' rather than overclaiming 'this is what happened'"
