about: >
  A review of a second, distinct, real Matilal book -- "The Word and the World: India's Contribution
  to the Study of Language" (Oxford, 1990) -- shifting from Nyaya epistemology (0092-0097) to Sanskrit
  philosophy of LANGUAGE (Śabda-Pramāṇa, Pāṇinian grammar). Produces a third Context-adjacent proposal
  (Context-Bounded Meaning), directly relevant to the ongoing Context dispute, and a ninth anchor
  reshaping in yet another pipeline shape (two named "kernels" -- Semantic then Epistemic -- feeding a
  Knowledge Object then Decision/Action).

introduces:
  - "Central claim: language is not a transport layer, it is a knowledge-generation mechanism --
    World -> Language -> Meaning -> Cognition -> Knowledge, replacing Data->Message->Receiver"
  - "Sabda-Pramana as 'KnowledgeOS Communication Protocol': ordinary statements (not only scripture)
    generate knowledge, since most human knowledge comes through reading/listening -- reinforces
    Śabda (testimony) as a first-class Pramāṇa already tracked since 0092"
  - "'Meaning Resolution' directly connected to AI hallucination: a word has no meaning until resolved
    by context+usage+sentence-structure+convention; worked example ('Release' meaning deploy/publish/
    launch/remove-restriction depending on software/legal/business/security context) -- explicitly
    'exactly compatible with DDD'"
  - "ADR-KOS-SEM-001..004: Meaning precedes Knowledge; Language is a Knowledge Source;
    ⭐ Context-Bounded Meaning ('Terms SHALL be interpreted within their bounded context') -- a THIRD
    Context-adjacent proposal, joining 0094's Avacchedaka delimiter and 0095's Semantic Boundary
    Precision; Semantic Lineage (reinforces 0097's Commentary Lineage / Revisability)"
  - "'Semantic Audit Trail' worked example: term 'Authority' -> context 'Election Governance' ->
    definition -> implementation (AuthorizationPolicy) -> runtime check (CapabilityResolver) -- a
    concrete, DDD-native traceability chain"
  - "⭐ Ninth anchor reshaping, a new two-named-kernel pipeline shape: Observation/Language Input ->
    Semantic Kernel (Matilal, 'what does it mean?') -> Epistemic Kernel (Nyāya, 'why should we trust
    it?') -> Knowledge Object -> Decision/Action -- distinct in shape from both 0096's and 0097's
    process pipelines"
  - "Panini -> 'KnowledgeOS Grammar Engine' (structural precision in interpretation, not covered in
    depth here) and 'KnowledgeOS Vocabulary Governance' (named, not elaborated)"

