about: >
  An explicitly external-literature research review (W3C PROV, Walsh & Ungson organizational-memory
  theory, Capilla et al. software-architecture-knowledge-management, Truth Maintenance Systems, Belief
  Revision) scoped as "not a KnowledgeOS architecture proposal" but an independent evidence base for
  later comparison against EKS/PKS/AIP. Converges on nine cross-cutting dimensions (Identity,
  Provenance, Temporality, Authority, Decision-and-Rationale, Lineage, Evidence, Governed-Lifecycle,
  Integrity-Assurance) as the trustworthy-core of organizational knowledge systems, explicitly
  demoting knowledge graphs, event sourcing, and the OS/kernel analogy from architecture to
  inspiration/integration-layer status where evidence does not support them as the kernel itself.

introduces:
  - "Authority ≠ confidence: authority is organizational (who may treat X as settled), confidence is
    epistemic (how well-supported X is) — a proposition can be well-supported-but-unauthorized or
    authorized-but-uncertain"
  - "Candidate pipeline: Observation -> Evidence -> Claim -> Inference -> Belief -> {confidence,
    authority} -> Decision (explicitly marked hypothesis, not kernel design)"
  - "Provenance is not merely metadata: functions simultaneously as governance, trust, and domain
    information"
  - "Temporal knowledge distinctions: valid time / transaction time / observation time / decision time
    / effective time; central question 'what was considered authoritative at time T?'"
  - "Candidate future state shape: knowledge_state + validity + authority + lineage (explicitly
    deferred, not designed here)"
  - "Negative result: Knowledge System != Knowledge Graph (weak evidence graphs ARE the kernel; strong
    evidence they are an integration/query/semantic layer)"
  - "Negative result: event history is valuable; event sourcing as an implementation strategy is not
    universally necessary"
  - "OS/Linux kernel analogy 'correctly contained': validated as inspiration (stable primitives,
    minimal trusted core, mechanism-vs-policy, composability), explicitly NOT a literal specification,
    since knowledge systems lack OS-level deterministic execution and universal semantics"
  - "Direct answer to 0079's complex-number question: 'possibly as a formal modeling device, but not
    as the kernel primitive itself unless research and EKS/PKS/AIP comparison demonstrate an actual
    need' -- redirects toward a multi-dimensional epistemic state (identity, provenance, validity,
    authority, evidence, confidence, lineage, decision), explicitly keeping complex numbers as
    research hypothesis, not architecture"
  - "Closing research question: smallest set of semantic/mechanical primitives that must be
    universally trustworthy, cross-checked against a Candidate x {External evidence, EKS, PKS, AIP,
    Cross-cutting?, Kernel candidate?} matrix over 10 candidates (Identity, Provenance, Temporal
    validity, Authority, Evidence, Decision, Lineage, Lifecycle, Conflict, Assurance) -- 'let EKS/PKS/
    AIP evidence eliminate candidates, not merely confirm the research'"

