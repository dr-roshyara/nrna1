refines:
  - concept: "0327's central 'Knowledge Projection = Measure' definition and its five named measures (coverage/evidence/confidence/relevance/uncertainty)"
    refinement: "Reclassified as typed functions/functionals/fields (most do not satisfy countable additivity and should not be called measures); reformulated as Knowledge Projection = measurable state/field Pi_{A,t,R,C}=(lambda,c,e,q,u,r,s,...) with heterogeneous per-component types"
  - concept: "0327's knowledge element e in F (measurable-set membership)"
    refinement: "Rejected and replaced with e=(p,a,c,t,E,D,R,sigma) inducing measurable events/objects, and separately p -> [[p]] as the proposition-to-event mapping"
  - concept: "0327's continuity-equation PDE research model (partial(k)/partial(t)+div(J)=S-D)"
    refinement: "Explicitly NOT rejected as bad mathematics but reclassified as premature: requires geometric structure a bare measurable space lacks; introduces the Measurable->Metric->Topological->Geometric hierarchy to make the dependency explicit"
  - concept: "0327's epistemic-distance framework (TV/Wasserstein/JS/KL) and Alignment=1-distance formula"
    refinement: "Distance functions shown non-interchangeable and regime-dependent (d_R); Alignment reformulated as Alignment_R=F_R(d_R) with explicit regime-specific normalization rather than a generic 1-minus-distance formula"
  - concept: "0327's topic-openness ratio Open(B)"
    refinement: "Reclassified as a derived topological/geometric metric (a flux functional Flux_{partial B}), not a primitive"
  - concept: "0327's four-space architecture (Omega_S, Omega_E, Omega_D, Omega_A)"
    refinement: "Relabeled to avoid forcing all four into the same measurable-space formalism: Semantic domain / Epistemic state space / Evidence domain / Action-state-transition space, connected by typed mappings"
  - concept: "0327's convergence-under-refinement idea"
    refinement: "Elevated and formally named 'Refinement Coherence,' explicitly ranked as the single most important mathematical concept in the entire framework"
