defines:
  - concept: "TemporalWriteOrder≠EpistemicPriority"
    definition: "The order in which concurrent writes are committed must not determine which claim is epistemically preferred; a later but weaker claim overwriting an earlier stronger claim purely due to write-ordering (last-writer-wins) is an epistemic error, not a resolved conflict"
  - concept: "DataConsistency≠DecisionSufficiency"
    definition: "A data replica can be internally consistent (no corruption, well-formed) while still being too stale in wall-clock terms to satisfy a specific decision's freshness requirement; consistency and decision-readiness are separate, domain-specific concerns"
  - concept: "TransactionBoundary≈InvariantBoundary"
    definition: "A useful DDD/distributed-systems heuristic: artifacts that must be updated atomically to preserve a shared invariant belong within one transaction boundary; artifacts with no connecting invariant may be committed independently, and cross-context workflows spanning multiple invariant boundaries require saga-style compensating actions rather than one large ACID transaction"
  - concept: "AI computation reproducibility function"
    definition: "y=f_θ(x,K_t,C) — an AI agent's output is a function not only of its prompt but of model version, knowledge snapshot, tool configuration, and parameters; reproducibility requires recording all of these, and identical prompts against different knowledge snapshots legitimately producing different outputs is not automatically a nondeterminism failure"
  - concept: "Determinism trichotomy"
    definition: "DeterministicAlgorithm (the algorithm itself always produces the same output for the same input), DeterministicExecution (a specific run behaves predictably), and ReproducibleResult (a later re-run can approximately recover the same result via recorded metadata) are three distinct notions that must not be conflated, especially for probabilistic AI models"
