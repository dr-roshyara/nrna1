    refinement: "CONFIRMED SUBSTANTIAL RE-DERIVATION: this file independently re-derives optimistic concurrency, causal-versus-arrival ordering, domain-specific consistency policy, and the ConcurrencyConflict-vs-epistemic-disagreement distinction, all without cross-reference, and introduces a second I_Concurrency invariant of near-identical substance under the identical name — confirming, not merely flagging, the collision this reconstruction anticipated at 0655"
