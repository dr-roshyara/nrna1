defines:
  - concept: "DecisionReady (final, corrected)"
    definition: "DecisionReady(S_t,D,P,C) iff HardGates(S_t,D,P,C) AND AcceptableRemainingUncertainty(S_t,D,P,C) -- knowledge/understanding relevant to a SPECIFIC decision satisfy that decision's mandatory epistemic, coherence, contextual, and domain constraints, with remaining deficiencies either decision-irrelevant or explicitly policy-acceptable"
  - concept: "Decision Sufficiency Boundary (DSB)"
    definition: "DSB(P,D,C): the minimum conditions under which a decision D may responsibly be made for purpose P in context C; DecisionReady iff K_t⊨DSB(P,D,C)"
  - concept: "Four terminal investigation states (InvestigationStatus)"
    definition: "Ready (decision criteria satisfied), Continue (further investigation warranted), ForcedStop (must stop but not ready -- budget/urgency exhausted), Unresolvable (required knowledge cannot currently be obtained/resolved)"
