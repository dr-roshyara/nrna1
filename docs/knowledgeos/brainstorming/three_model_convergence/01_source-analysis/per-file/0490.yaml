  - concept: "Decision Sufficiency Boundary DSB(P,D,C): the Ideal State's minimum conditions for a responsible decision, distinguished from 'everything that could possibly be known,' preventing infinite investigation"
  - concept: "Unknown≠NotDecisionReady: some values may remain genuinely unknown while the decision stays valid, provided the uncertainty is decision-irrelevant within a policy-defined tolerance T_D"
