about: >
  Shares its first 429 lines byte-identically with 0463 (the Compare/Challenge formalization for
  Assertions -- verified via `diff`, identical through line 429) but diverges from that point to deliver a
  genuinely new, disciplined resolution of **Question 4A** (launched at 0462's close: "What exactly is an
  Epistemic State?"), correcting both corpus-integrity tensions flagged at 0463.

  **The resolution**: explicitly rejects the previously-assumed single scalar Sigma in {Unknown,
  Hypothesized, Assumed, Inferred, Observed, Confirmed, Conflicting, Unresolved, Rejected, ABSENT} as
  insufficient, giving four concrete reasons -- Observed describes acquisition mode not evaluation;
  Confirmed describes evaluation not acquisition; Conflicting describes a relationship not a state;
  Unresolved describes a status not a state -- concluding these are different **dimensions**, not positions
  on one axis. Formalizes **Epistemic State as a five-dimensional vector**:
  Sigma = (Acquisition, Support, Resolution, Validity, Conflict), with each dimension given a complete,
  concrete value set: **Acquisition** in {Observed, Reported, Inferred, Calculated, Assumed, Hypothesized,
  Unknown} (7 values); **Support** in {None, Weak, Moderate, Strong, Very Strong} (5 values, with numeric
  bands 0, (0,0.3), [0.3,0.6), [0.6,0.9), [0.9,1]); **Resolution** in {Open, In Progress, Resolved,
  Unresolvable} (4 values); **Validity** in {Current, Stale, Expired, Unknown} (4 values); **Conflict** in
  {None, Potential, Active, Resolved} (4 values). Computes the full state space size
  |S| = 7x5x4x4x4 = 2240 possible epistemic-state combinations -- the corpus's most concrete, enumerated
  epistemic-state space to date.

  Defines a per-dimension transition function Sigma_new = T(Sigma_old, E), with T decomposed into five
  independent sub-functions T_A, T_S, T_R, T_V, T_C (one per dimension), and a worked three-step transition
  sequence (Assumed/None/Open/Current/None -> Observed/Strong/Resolved/Current/None via direct observation
  -> .../Active via contradictory report -> .../Resolved via conflict resolution). Extends Zero, Lord, and
  Sārathi to operate **per-dimension** rather than on a single scalar Sigma: Zero asks a distinct diagnostic
  question per dimension (acquisition reliability, support sufficiency, resolution status, currency,
  conflict presence); Lord suggests alternatives per dimension; Sārathi gives per-dimension next-step
  guidance (seek direct observation, find additional evidence, investigate the unresolved aspect, recheck,
  resolve the conflict).

  **Correctly resolves the Bhīṣma grandfather/enemy worked example this time**, directly repairing 0463's
  flagged corpus-integrity tension: "Bhīṣma is Arjuna's grandfather" reaches Sigma_1 =
  (Observed,Strong,Resolved,Current,None); the new proposition "Bhīṣma is Arjuna's enemy" independently
  reaches an identical acquisition/support/resolution/validity profile, and the tension between the two is
  now correctly localized **entirely within the Conflict dimension** (updated to Active on both assertions),
  never treated as a logical contradiction on Acquisition/Support/Resolution/Validity. The narrative
  explicitly states "Arjuna realizes the conflict is normative, not logical," and the Conflict dimension is
  subsequently marked Resolved once the moral-conflict proposition is formed -- correctly applying 0462's
  Logical!=Normative-Conflict distinction that 0463's own worked example had failed to apply. This directly
  answers 0463's flagged corpus-integrity observation #1 within the very next file.

  Formalizes the complete model: Sigma=(A,S,R,V,C) with each component's value set restated, the transition
  function T decomposed per-dimension, and the state-space size 2240 restated. Closes with the core
  invariants (Epistemic State is multidimensional; Acquisition != Support != Resolution != Validity !=
  Conflict; evidence can change one or more dimensions independently) and confirms all seven concepts
  formalized so far (Proposition, Assertion, Epistemically Accepted, Evidence, Comparison, Challenge,
  Epistemic State), proposing **Question 5 -- How do we update and preserve Assertions?** as the next
  research target (renumbering what 0463 had called Question 5 -- Compare/Challenge -- since Question 4A's
  resolution now precedes it, consistent with 0462's original sequencing intent).
