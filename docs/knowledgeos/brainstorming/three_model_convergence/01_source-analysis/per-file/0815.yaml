defines:
  - concept: "Hindsight contamination HC(D,t_0,t_1)"
    definition: "A quantifiable failure mode in which information first acquired after a decision was made (at t_1>t_0) is incorrectly incorporated into the evaluation of that decision as though it had been available at decision time t_0 -- formally, the forbidden operation is using e_{t_1} in DecisionEvaluation_{t_0} without acknowledging AcquisitionTime(e)>t_0; preventing this requires the architecture to always evaluate a historical decision against the epistemic state that was actually available at its own decision time, reserving later knowledge exclusively for explicitly-labeled retrospective or counterfactual analysis"
  - concept: "Decision replay (historical vs. counterfactual)"
    definition: "A precisely defined analytical operation Replay(D,t_0) that reconstructs the knowledge, rules, and authority state (K_{t_0}, R_{t_0}, A_{t_0}) that existed at the time decision D was made, then asks whether D was admissible under those conditions. Historical replay Replay_historical(D,t_0) uses only genuinely t_0-available information and answers 'was this decision justified given what was actually knowable then?' Counterfactual replay Replay_counterfactual(D,t_0,K_{t_1}) deliberately substitutes later knowledge to ask 'what would have happened if that information had already been available?' -- analytically useful, but the two modes must never be conflated, and only historical replay may inform judgments about the decision's actual legitimacy"
  - concept: "The filtration model of organizational knowledge"
    definition: "Borrowed directly from stochastic-process theory: organizational knowledge at time t is represented by an information set 𝓕_t, and these sets are monotonically nested (𝓕_{t_0}⊆𝓕_{t_1}⊆...⊆𝓕_{t_n}) as time progresses -- a legitimate decision is a function only of the information set available at its own time, D_t=f(𝓕_t), never of a later, larger set without explicit retrospective framing; critically, this monotonicity applies to the INFORMATION SET (what has entered organizational awareness), not to the epistemic status of any individual proposition, which can still be corrected, superseded, or contradicted as new information arrives within that growing set"
