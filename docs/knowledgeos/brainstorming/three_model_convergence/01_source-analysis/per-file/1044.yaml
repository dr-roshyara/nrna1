about: >
  "04 — Congruence and Per-Operation Equality Bindings (mandate §§10-14)."

  **§10 delivers the formal congruence criterion, "Proposition 258-A" (`258.30`)**: `F∘T_H=T̄∘F` -- every
  mandatory transformation must FACTOR THROUGH the quotient map `F`, with a commuting diagram at `258.23`.
  Confirms global congruence "CANNOT YET BE PROVEN because the transformation family is not fully closed"
  (`259`), and that `259.16` distinguishes LOCAL from GLOBAL congruence. Confirms the already-tracked
  executed demonstration (file 1039) that `=` is NOT a congruence, reproducing corpus `258.10`/`258.15` on a
  toy model, boxed: "Current structural equality is insufficient evidence of semantic equivalence."

  **§11 DELIVERS THE CORPUS'S OWN "`261.19`" MATRIX, A GENUINELY MAJOR CONFIRMED FINDING**: "7 operations × 5
  relations, EVERY CELL UNRESOLVED" -- concludes boxed: **"No single equality relation is adequate for all
  KnowledgeOS operations."** Delivers the full per-operation binding table across THIRTEEN operations
  (Deduplicate, Merge, Retract, Supersede, Validate, Replay, Authorize, Policy evaluation, Publish, Apply,
  Verify, Remove, Revise), confirming **SIX OF THE MANDATE'S ELEVEN NAMED OPERATIONS HAVE NO CORPUS EQUALITY
  ANALYSIS AT ALL** (`Retract`, `Authorize`, `Policy evaluation`, `Publish`, `Apply`, `Verify`) --
  explicitly tied to the already-tracked unenumerated-`𝒪` gap: "the operation set itself is a dependency,
  exactly as `261.23` condition 2 states." Delivers `261.28`'s reframing of the entire equality-decision
  problem: KnowledgeOS "requires a TYPED FAMILY of equality, identity, equivalence, provenance and historical
  relations. The decision is not 'pick one' -- it is 'bind each operation.'" Also confirms `Validate` is
  reclassified as "an ASSESSMENT relation, not an equality" -- a genuinely useful category clarification.

  **§12 delivers a comprehensive nine-sameness-kind table for Deduplication** (same reference/entity/
  assertion/content/semantics/provenance/observation/state/history), with FOUR RIVAL CRITERIA (`261.17`) and
  the choice classified NORMATIVE/DOMAIN-DEPENDENT. **Delivers a comprehensive eight-shape counterexample
  catalog** required by the mandate: structurally different but semantically equal; semantically equal but
  provenance-distinct; observationally equal but operationally different (EXECUTED); same-test-output but not
  extensionally equal (EXECUTED); same content different identity; same identity different epistemic state;
  equal properties different entities; and a non-contradiction (two IPs, `Functional(HasIPAddress)=False`).
  "Does the corpus supply enough to choose the production criterion? NO."

  **§13 delivers the quotient/canonicalization completeness check**: 0 of 8 required properties satisfied for
  any candidate quotient (`K=[H]_∼_H` or `ℋ/≡_𝒯`) -- "Mathematical equivalence ≠ implementable
  canonicalization," and confirms transitivity is a genuine prerequisite for any quotient to exist at all,
  resolved only for `≅_I` within a context.

  **§14 delivers the definitive hash/fold/structural-identity characterization**: `H(x)=H(y)` requires FOUR
  things -- a specified serialization, canonicalization, collision model, and scope -- "THREE OF THE FOUR ARE
  UNSPECIFIED," confirmed with the already-tracked executed demonstrations (key-order flip, locale-ambiguous
  date).
