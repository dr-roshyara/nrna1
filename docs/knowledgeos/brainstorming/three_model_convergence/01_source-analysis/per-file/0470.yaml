  - concept: "Statement declared explicitly equivalent to Proposition, resolving a lingering terminological ambiguity between 0454-0457's Statement and 0461's Proposition"
  - concept: "Circularity exposed and resolved: Zero-findings/Lord-candidates and History must NOT be embedded inside the Knowledge State tuple K_t (since Z_t=Zero(K_t), L_t=Lord(K_t), and H_t recursively contains prior K_i's own history) -- they are derived operations/separate structures, not foundational components"
  - concept: "Knowledge State must be parameterized by Knower/Observer, Purpose, Context, and Time: K_t=K(X,P,N,C,τ), not an absolute global object"
  - concept: "𝒜_t (the assertion set) must include all epistemically classified assertions (accepted, rejected, unresolved, contested, historical), not only currently accepted ones"
  - concept: "Knowledge Graph generalized to a typed graph G=(V,E) over ten semantically meaningful object kinds, with the assertion-only graph as one projection G_A=Π_A(G)"
  - concept: "Evidence Support Matrix marked provisional: real evidence relations (supports/contradicts/qualifies/contextualizes/supersedes/invalidates/independent-of) likely require a structured relation Support(E,A,C,τ), not a bare scalar in [-1,1]"
  - concept: "Scope named as the most important missing concept: an assertion holds only within some Scope=(Context,Time,Subject,Boundary,...), essential for avoiding false contradictions across differing scopes"
  - concept: "Knowledge State != Conflict-Free State, formalized as an explicit named principle confirming 0466's hypothesis"
  - concept: "Coherence redefined: mutual interpretability of all assertions under their dimensions/scopes/contexts/temporal constraints, NOT the absence of contradictions -- a coherent state may contain unknowns, conflicts, competing interpretations, and normative tensions"
  - concept: "Zero(K_t) != K_t as an explicit invariant: Zero is a measurement/transformation of the state, never the state itself"
  - concept: "System State extended to five components by adding the Knower N: State_t=(K_t,I_t,Q_t,C_t,N)"
  - concept: "Clarification is itself an epistemic operation: an underspecified question Q_t can be detected via Zero(Q_t,K_t), triggering a Sārathi clarifying question rather than premature investigation"
  - concept: "Six new numbered questions launched (Coherence, Conflict, Conflict Resolution, Gap taxonomy, Ideal State, Knowledge-Ideal distance), with a seven-way non-collapsible Gap taxonomy for Question 10"
  - concept: "A deeper prior question identified: 'What is the mathematical nature of Knowledge itself?', since the corpus has used 'knowledge' for at least five distinct mathematical objects (Proposition/Assertion/Epistemic-State/Knowledge-State/Knowledge-Space Ω) that are not interchangeable -- recommended as the renumbered true Question 7"
defines:
  - concept: "Scope"
    definition: "Scope=(Context,Time,Subject,Boundary,...): the domain within which an assertion is claimed to hold, needed to avoid false contradictions between assertions that are each true only within their own scope"
  - concept: "Coherence (redefined)"
    definition: "All assertions in a Knowledge State are mutually interpretable under their dimensions, scopes, contexts, and temporal constraints -- not the absence of contradictions; unknowns, conflicts, and normative tensions do not by themselves break coherence"
  - concept: "System State (extended)"
    definition: "State_t=(K_t,I_t,Q_t,C_t,N): Knowledge State, Ideal State, Inquiry/Questions, Context, and Knower -- five components, not four"
refines:
  - concept: "0469's six-component Knowledge State K_t=(𝒜_t,ℛ_t,ℰ_t,ℋ_t,𝒵_t,ℒ_t)"
    refinement: "Zero-findings, Lord-candidates, and History removed from K_t's foundational definition to resolve a genuine self-referential circularity, and 𝒜_t widened to include all epistemically classified assertions, not only accepted ones"
  - concept: "0468's relational Conflict(P1,P2,NormativeContext)"
    refinement: "Further generalized into Conflict(P1,P2,C,τ,D), explicitly launched as Question 8 rather than assumed solved"
  - concept: "0466's hypothesis that a valid Knowledge State can contain contradictory/unresolved assertions"
    refinement: "Confirmed and elevated to an explicit named principle (Knowledge State != Conflict-Free State) underlying a redefined notion of Coherence"
  - concept: "0393's observer-relative, time-varying dimension set D_t^A"
    refinement: "Generalized: the ENTIRE Knowledge State, not merely the dimension set, is now argued to be Knower/Observer-relative"
