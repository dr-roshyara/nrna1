about: >
  `t291_bootstrap.py` — an executable Python dependency-graph script re-auditing the already-tracked Step-289
  bootstrap-cut analysis (file 1052), with one explicit, mandate-driven KEY CHANGE: "O, T and O_K are
  SEPARATE nodes (mandate §2: 'Do not assume that O, O_K and T are identical')." This directly follows from
  and formalizes the already-tracked file-1068 finding that `𝒪_K` relates to `Σ`-level observation
  operations, a subset/kind of the broader operation set `𝒪`.

  **INTRODUCES A NEWLY-CITED CORPUS BASIS FOR THE THREE-WAY SEPARATION**: `259.7` gives a FIVE-WAY operation
  classification (state-transformations | assessments | governance | audit/history | OBSERVATION operations)
  and explicitly states "Not every operation has the form `T:K→K`"; `259.8` separates the state-transforming
  operations (which enter "the primary congruence test") from Assess and Authorize (which "get DIFFERENT
  tests"). This yields: `𝒯 ⊂ 𝒪` (kind 1 of 5); `𝒪_K` relates to kind 5 (observation operations) — THREE
  distinct objects, not one conflated node as an earlier (Step-289) graph may have modelled.

  **REBUILDS THE FULL DEPENDENCY-GRAPH EDGE LIST (42 audited edges, matching Step-289's edge count, file
  1052) WITH THE THREE-WAY SEPARATION**, re-including all already-tracked structural edges (congruence per
  `258.9`, minimality per `259`, the quotient/state relation per `258.12`, identity per `195.16`/`258.2`,
  Decision-3/`Pi` per `254/261.8`, per-operation bindings per `261.19`, canonicalization per `38.85`, merge
  idempotence per `25J.45`, the `261.23` six-condition kernel-gate edges, `Qualify`/`π_K` per `285`) plus TWO
  NEW EDGES specific to the Assess/Authorize distinction from `259.8`: `equiv→assess_det`
  ("`K_1==K_2⟹Assess(K_1,x)=Assess(K_2,x)`") and `O→assess_det` ("Assess is kind 2 of `O`").

  **DELIVERS EXPLICIT SCRIPT-LEVEL METHODOLOGICAL SAFEGUARDS DIRECTLY RESPONDING TO STEP 289'S OWN
  SELF-DIAGNOSED BUG (file 1052's "definitional artifact" fix, already tracked)**: an exhaustive minimal-cut
  search restricted to a defined `RESOLVABLE` node set (mirroring Step 289's methodology); explicit
  degeneracy checks on zero-results (mandate §18: "could 'cut {O}→False' be vacuous?", checking non-emptiness
  and per-node cycle-membership counts); and a final scope-limiting disclaimer echoing Step-289's own
  disciplined closing note: "SCOPE: conclusions hold for THIS audited edge list. No `O`, `T` or `O_K` is
  proposed."

  This is executable script content (not yet run/read as output in this record — the corresponding output
  file, if the established step-288/289/290 pattern holds, is expected as a subsequent sequence). The script
  itself is the primary evidentiary artifact of this file: it directly re-examines whether the already-
  tracked `{equiv}` unique minimal bootstrap cut (files 1052, 1069) survives once `O`, `T`, and `O_K` are
  properly separated rather than potentially conflated.
