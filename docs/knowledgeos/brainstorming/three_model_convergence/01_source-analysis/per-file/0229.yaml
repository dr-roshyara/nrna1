about: >
  Applies only the Zero and Leonardo lenses (from the 26-lens system) to the AI-Efficiency Kernel
  proposed in 0227, continuing the 0226-0228 arc. Zero asks "what happens when a prerequisite is
  missing?"; Leonardo asks "have we understood the whole relevant bounded context?" Together: no
  computation without sufficient basis, no decision from an incomplete context. Produces a formal
  Epistemic Readiness primitive replacing generic confidence as the kernel's execution-control gate.
introduces:
  - concept: "EpistemicCondition != PrerequisiteCondition: distinguishes UNKNOWN from NO_BASIS/NOT_APPLICABLE/CONTRADICTORY -- absence of a constitutive prerequisite is not itself an epistemic state"
  - concept: "Z-KOS Computational Gate: an inference process shall not execute when a constitutive prerequisite is absent; formalized Prerequisites(M,Q)=R, if R not subset of AvailableKnowledge then Inference(M,Q)=NoBasis (not False, not UnknownState) -- an O(1) fail-before-inference check saving expensive downstream computation"
  - concept: "Two-dimensional readiness gate: Basis completeness B (binary per prerequisite, product of B_i=0 means NO_BASIS regardless of statistical confidence -- an anti-hallucination mechanism) vs. Context completeness C (a coverage vector across relevant dimensions: domain/authority/temporal/dependencies/operational/security, not a single ratio)"
  - concept: "Evidence Acquisition Planner: Leonardo enables targeted retrieval of exactly the incomplete dimension(s) rather than 'retrieve everything'; formalized as E*=argmin Cost(E) subject to Prerequisites(E)=1 and ContextCompleteness(E)>=tau and Assurance(E)>=required"
  - concept: "KnowledgeKey=(Context,Concept,Meaning,Version) replacing bare Concept identity -- same expression ('approved') in different bounded contexts (ArchitectureGovernance vs. Security) must resolve to distinct knowledge objects, both an anti-hallucination and an LLM-efficiency mechanism (search space and prompt size shrink, semantic precision rises)"
  - concept: "Completeness scoped to the bounded context, never the universe: Completeness = Completeness_bounded-context, not Completeness_universe -- the AI needs the DecisionRelevantBoundedContext, not WorldKnowledge"
  - concept: "'Compression must preserve epistemic readiness' invariant: ER(RawContext) must equal ER(CompressedContext) for the intended decision (or a formally accepted bound) -- stronger than merely preserving semantic similarity; explicitly connects to the Escher lens (what invariant survives transformation) as a natural next step toward a 'safe compression triad' (Zero+Leonardo+Escher)"
  - concept: "Four-state readiness taxonomy replacing bare UNKNOWN: NO_BASIS (Zero failure) / INSUFFICIENT_CONTEXT (Leonardo failure) / CONTEXT_CONFLICT (context populated but internally contradictory, e.g. ADR says approved, governance record says rejected, runtime follows neither) / UNKNOWN (context sufficiently established, inference genuinely unresolved)"
  - concept: "Formal Epistemic Readiness truth table R=(B,C,K) -- prerequisite basis / contextual completeness / contextual consistency -- with only B=1,C=1,K=1 (READY) entering the ordinary inference pipeline; B=0 -> NO_BASIS regardless of C,K; C=0 -> INCOMPLETE_CONTEXT; K=0 -> CONFLICTED_CONTEXT"
  - concept: "Actionable-unknown telemetry: replacing a bare UNKNOWN with structured status+missing-dimensions YAML, enabling an agent to perform a targeted follow-up action instead of hallucinating"
  - concept: "Full mathematical formalization: Ready(Q,E) = B(E) AND C(E,Q)>=tau_C AND K(E)=1; only if Ready=1 does the system select M*=argmin[Compute(M)+ExpectedLoss(M)] subject to Assurance(M)>=A_Q -- unifying this file's readiness gate with 0226's escalation-cost formalism"
  - concept: "Reframed AI-efficiency question: not 'how can I make the LLM answer faster' but 'how can I determine whether an LLM is needed at all'"
  - concept: "Epistemic Readiness Principle (formal candidate): KnowledgeOS shall distinguish absence-of-prerequisites, incomplete-contextual-understanding, contextual-conflict, and genuine-unresolved-uncertainty; expensive inference shall not be invoked until prerequisites and decision-relevant bounded context are sufficiently established"
  - concept: "Recommended kernel component list: IdentityResolver, ContextResolver, PrerequisiteGate (Zero), ContextCompletenessEngine (Leonardo), EvidenceAcquisitionPlanner, ContextConsistencyEngine, StateResolver, InferenceRouter, ModelRegistry, AssessmentEngine, AssuranceBoundary -- LLM explicitly sits downstream of all of these, not inside the kernel"
