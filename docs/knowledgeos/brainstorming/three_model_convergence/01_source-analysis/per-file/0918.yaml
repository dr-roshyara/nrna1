defines:
  - concept: "The formal repair minimality criterion (Necessity, Irreducibility, No redundant distinction)"
    definition: "For an original state representation R_0 and a proposed repair R*=R_0+ΔR (where ΔR is the added structure), the repair is minimal if and only if three conditions jointly hold: (M1) Necessity -- every individual component of ΔR is required to distinguish at least one pair of mandatory states that would otherwise be conflated; (M2) Irreducibility -- no proper subset ΔR'⊊ΔR is by itself sufficient to distinguish all the mandatory state pairs (i.e. nothing in ΔR is redundant given the rest); (M3) No redundant distinction -- the repair must not introduce distinctions between states that no mandatory KnowledgeOS operation can actually observe or act upon, even if those distinctions would be conceptually interesting. This directly generalizes the K-component Deletion Test (0902-0904) and the Σ_min power-set derivation (0912) into a reusable three-part criterion applicable to any future theory-defect repair"
  - concept: "The Orphan/Epistemic State separation"
    definition: "A disciplined architectural finding that an 'orphan' object (an assertion or document that exists in the system, a∈A, but has no relationships to other knowledge objects, Rel(a)=∅) must NOT be automatically classified as having epistemic status Unknown or any other epistemic value. Instead, orphanhood is a genuinely different kind of fact -- a structural/relational connectivity condition -- with (at minimum) three distinct sub-cases: O1 (the assertion legitimately and permanently has no required relationship, a valid state), O2 (a relationship is required by the domain but has not yet been established, an incomplete state), O3 (the underlying document has been ingested into the system but has not yet undergone semantic qualification at all). Conflating any of these with an epistemic status would incorrectly promote what is fundamentally an implementation/structural artifact (a document sitting unlinked in a repository) into a substantive epistemic claim about a proposition's truth-support, which the theory must not permit"
