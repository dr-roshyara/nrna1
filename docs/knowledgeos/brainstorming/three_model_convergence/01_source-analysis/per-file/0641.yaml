defines:
  - concept: "Conflict is itself a valid domain state"
    definition: "When two concurrent operations produce genuinely incompatible proposals for the same protected state, the correct response is to preserve both as an explicit Conflict record rather than arbitrarily selecting one — the conflict itself carries domain-relevant information"
  - concept: "ConcurrencyConflict vs. SemanticContradiction"
    definition: "ConcurrencyConflict means two operations attempted to modify the same versioned state simultaneously (a technical/optimistic-concurrency concern); SemanticContradiction means two propositions genuinely disagree about the world (an epistemic concern) — the two must not be conflated"
  - concept: "AuthoritativeOperationalState vs. AlternativeKnowledgeState"
    definition: "Operational domain state generally requires exactly one authoritative successor per transition (no ambiguous forking), while epistemic/knowledge state may legitimately support multiple simultaneously valid, competing hypotheses as branches — these two kinds of state require different concurrency-safety treatment"
  - concept: "ConcurrencyPolicy=f(DomainOperation,Invariant)"
    definition: "There is no single universal concurrency strategy for KnowledgeOS; the appropriate strategy (parallel execution, version-checked serialization, ordering, explicit branching) is determined per operation class based on its specific domain semantics and the invariant it must preserve"
