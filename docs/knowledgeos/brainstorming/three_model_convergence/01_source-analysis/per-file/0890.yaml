defines:
  - concept: "The six-notion equality/identity relational family"
    definition: "A formal separation of six genuinely distinct relations that the overloaded notation K_1=K_2 had previously conflated: structural/representation equality (=, or =_str -- do the representations match syntactically), semantic equality (≡, or ≡_sem -- does Semantics(x)=Semantics(y) under a not-yet-formally-defined interpretation function), observational equivalence (≈, or ≈_obs -- do all permitted observations O∈𝒪 agree, the relation underlying Step 260's behavioral quotient), identity equivalence (≅_I, or SameId -- do these two references denote the same domain object, independent of current representation or meaning), provenance-sensitive equivalence (≅_P -- does equality additionally require identical evidentiary origin), and historical equivalence (≅_H -- are these the same point in an evolution history, independent of current semantic content). The file's central methodological claim is that these must never be collapsed into a single primitive, since different KnowledgeOS operations (Merge, Supersede, Replay, Remove, Revise, Deduplicate, Validate) each depend on different, non-interchangeable subsets of this family"
  - concept: "The a∈_exp K vs K⊨a membership distinction"
    definition: "A proposed formal distinction between explicit assertion membership (a∈_exp K: the assertion a is literally, explicitly stored as one of the state's assertions) and semantic entailment (K⊨a: the assertion a is a logical/semantic consequence of the state's content, whether or not it is explicitly stored) -- explicitly framed as preventing the category error of treating a stored fact as equivalent to a logically derived fact, directly relevant to how Step 262's forthcoming assertion type must be specified"
refines:
  - concept: "0887's three-relation framework (=_X object equality, ≡_K state equivalence, ∼_H history equivalence)"
    refinement: "EXPANDED from three to six explicitly distinct relations, adding structural equality, observational equivalence, and provenance-sensitive equivalence as further genuinely distinct dimensions beyond 0887's original three, while preserving 0887's core identity-precedes-equality and state/history-equivalence distinctions"
  - concept: "0888's Hash identity≠semantic identity finding"
    refinement: "GENERALIZED into an explicit DDD warning: a database PRIMARY KEY must not automatically be interpreted as SemanticIdentity, and a content hash must not automatically become DomainIdentity -- extending the specific hash-vs-semantics caution into a general principle about mistaking any convenient technical identifier for genuine domain identity"
  - concept: "0888's/0889's quotient-construction and congruence program (K*=ℋ/≡_𝒯)"
    refinement: "GROUNDED with the concrete candidate observational equality definition K_1≡_KK_2⟺∀O∈𝒪_K:O(K_1)=O(K_2) and the explicit dependency chain Equality→Congruence→Quotient→Minimality, giving the abstract congruence relation ≡ from 0888/0889 a specific candidate formal content"
