defines:
  - concept: "Assurance Graph as projection"
    definition: "Each bounded context (Governance, Knowledge, Evidence, Assurance, Agent Platform) owns and transacts its own state independently; the Assurance Graph is not itself an aggregate or source of truth but a continuously reconstructed read-side projection derived from the domain events those contexts emit -- avoiding a single giant cross-context aggregate"
  - concept: "Semantic spoofing prevention"
    definition: "A domain event (e.g. DecisionApproved) may only be emitted by the bounded context that actually owns and performed that state transition; an agent's natural-language statement describing or claiming the same fact (e.g. a transcript saying 'I approve this decision') is a mere AgentStatement, never equivalent to the governed event, preventing an AI system from creating organizational authority through language alone"
  - concept: "Source-of-truth rule"
    definition: "Every semantic concept has exactly one authoritative owner; every other representation of that concept elsewhere in the system (a cache, an index, an agent's local memory copy, an observation) is explicitly a projection or reference, never a competing authority"
refines:
  - concept: "0716's Assurance Graph (as sometimes ambiguously described)"
    refinement: "Clarified precisely as a read-side projection over bounded-context state, resolving latent ambiguity about whether the graph itself held authoritative data"
  - concept: "0717's Agent Port concept"
    refinement: "Operationalized into a concrete nine-step sequential Agent execution contract shared by Claude, Codex, and future agent adapters"
  - concept: "0714's/0723's Finding-creation rule (FAIL→FindingCreated)"
    refinement: "Refined with the nuance FAIL⇏Finding universally -- Policy(FAIL)→Disposition, since not every failure warrants a persistent Finding"
  - concept: "0693's/0699's/0708's/AFR-10's Unknown-preservation discipline"
    refinement: "Extended into execution-failure terms specifically: a crashing checker produces UNKNOWN, not FAIL"
  - concept: "the corpus's technical-capability≠organizational-authority family and the pointer-layer principle"
    refinement: "Given its most concrete, directly implementable architectural mechanism to date: event-emission ownership restricted to the transition-owning bounded context, preventing an agent's own narrative confidence from being mistaken for an actual governed state change"
  - concept: "0705's/0716's/0717's technology-independence discipline"
    refinement: "Directly extended into the event-sourcing-vs-not persistence decision, explicitly left open pending further analysis"
