  quantifies over `𝒯`." Confirms it is NOT executed -- "Step 281's repair remains specified and unexecuted,
  and this ADDS A CANDIDATE STRUCTURE, not an execution." Precisely, disciplined final characterization: "It
  addresses THE SPECIFIC MEASURED FAILURE (CF#7), not the whole `M1`-`M7` repair. The carrier's STRUCTURE
