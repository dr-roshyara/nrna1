  CANDIDATE that addresses a MEASURED FAILURE rather than a conceptual gap. Every other candidate across 18
  chapters was a distinction, a shape, or a corroboration."

  **DELIVERS A RIGOROUS, HONEST AUDIT OF EXACTLY HOW FAR THIS CANDIDATE GOES**: confirms it separates
  `not-asked` from `recognized-but-unknown` exactly matching CF#7's failure, but explicitly does NOT supply
