  - concept: "Refined extraction formalization: K_t^A = Extract(H_<=t, F_t^A, R_t) -- the extracted knowledge state is explicitly TIME-INDEXED, with correctness relative to the state of the relevant world/domain AT THE TIME the knowledge claim is made"
  - concept: "Foundational three-property distinction, illustrated by a worked 'Nexus version 3.69.0 -> 3.80.0' example: Truth(K,t) / Completeness(K,t) / Currentness(K,t) -- a historically-correct knowledge state (K_10:00) can remain TRUE while becoming an incomplete representation of a later state (K_14:00), without ever having been false"
  - concept: "Three-times distinction for any knowledge attribution: t1 = when the underlying state existed, t2 = when it was observed, t3 = when the knowledge attribution was made -- worked example (14:00 system change, 14:05 monitoring observation, 14:07 analyst conclusion) showing these are genuinely different temporal events, explaining why history/provenance keep recurring in the research"
  - concept: "'Knowledge does not become false' principle: worked 'Election E is open' example (True at t1, False at t2) -- the correct statement is 'Q was true at t1' and 'Q is false at t2,' never 'the knowledge at t1 was wrong'; the Kernel must therefore preserve TEMPORAL VALIDITY, not merely the latest value"
  - concept: "Formal pipeline: WorldState_t -> Observation_t^A (O_t^A subset WorldState_t, the participant does not necessarily observe the complete world) -> InformationState_t^A (F_t^A) -> EpistemicState_t^A (E_t^A), the whole process evolving across t1->t2->t3->..."
  - concept: "Reframing of changing probability: P(K_t^A|F_t^A) != P(K_t+1^A|F_t+1^A) is explained by F_t+1^A = F_t^A union O_t+1^A (NEW INFORMATION available for extraction), not by the underlying knowledge object having 'changed' in the same mathematical sense"
  - concept: "New concept: 'epistemic versioning' -- a sequence E_1^A, E_2^A, ... each carrying participant/context/validity-time/observation-boundary/extraction-regime/input-history, explicitly distinguished from mere database versioning: 'it is EPISTEMIC STATE EVOLUTION'"
  - concept: "Completeness relativization: Complete(K,t1) does NOT imply Complete(K,t2) for an evolving domain (boxed as a possibly fundamental KnowledgeOS property); four distinct, non-equivalent senses of 'complete': Complete(K,F_t^A) [w.r.t. observations], Complete(K,D_t) [w.r.t. domain], Complete(K,Q) [w.r.t. a query], Complete(K,M) [w.r.t. a model] -- a state can be complete for answering a question while incomplete as a domain model"
  - concept: "Refined projection formula: Pi_{A,C,R,t}: H_<=t -> E_{A,C,R,t}, depending on history/participant/context/regime/time jointly -- 'a knowledge state is not simply extracted once; it is a TIME-INDEXED PROJECTION of historical substrate'"
  - concept: "Strongest-yet candidate Kernel guarantee: Kernel(H_<=T) => Reconstruct(E_t) for all t<=T, subject to the applicable regime and available assumptions -- explicitly contrasted with 'the Kernel stores knowledge' (it doesn't; it stores what allows knowledge states to be RECONSTRUCTED HISTORICALLY)"
  - concept: "New major invariant: World Change != Information Change != Knowledge Change -- worked asymmetry example (world changes, participant does not observe it, information unchanged, epistemic state unchanged; later: participant observes, information changes, epistemic state changes) -- 'may turn out to be one of the most important conceptual invariants in the entire KnowledgeOS model'"
  - concept: "Correction to the corpus's 'learning' vocabulary, directly connecting to the earlier martingale/submartingale corrections (0334/0335): 'knowledge changed -> learning occurred' is rejected; three possibilities distinguished (world changed but nothing learned; information changed but conclusion unchanged; epistemic state changed) -- only the third, under ADDITIONAL SEMANTIC CONDITIONS, might be called learning; 'mathematical state change should not automatically be assigned a semantic label such as learning'"
  - concept: "Stronger six-stage research chain: World -> Observation -> Information -> Extraction -> Epistemic State -> Knowledge Attribution, all indexed by time (.)_t, with history preserving H_<=t; H_<=t -[R]-> E_t^A and H_<=t+delta -[R]-> E_t+delta^A can legitimately differ"
  - concept: "Refined 'knowledge is provisional' statement: NOT 'knowledge is probably true' but 'a knowledge state is a temporally situated epistemic result whose validity must be interpreted relative to the domain state, available information, context, and applicable epistemic regime at the time of extraction' -- explicitly does not make Knowledge itself probabilistic; probability describes uncertainty in the EXTRACTION, P(E_t^A|F_t^A)"
  - concept: "New major research question, explicitly added to the research programme and judged 'now more fundamental than the question what objects belong in the Kernel': 'what is the temporal semantics of Knowledge?' with ten subquestions (correctness-at-t / remaining-correct-at-t+delta / obsolete-vs-false / incompleteness / complete-relative-to-what / what-constitutes-a-state-transition / can-old-knowledge-remain-valid-after-world-changes / what-history-is-required-to-reconstruct / when-does-change-constitute-learning / how-does-a-probabilistic-regime-represent-changing-information-over-time)"
  - concept: "Final research-hypothesis chain (explicitly not architecture): H_<=t -[information boundary]-> F_t^A -[extraction regime R]-> E_t^{A,R} -[epistemic criteria]-> K_t^{A,R}, with K_t^{A,R} != K_t+delta^{A,R} explicitly NOT implying the first state was wrong -- 'the world, information, context, or epistemic model changed'; closing claim: 'time and reconstructible history may eventually prove to be much more fundamental to the KnowledgeOS Kernel than Knowledge itself'"
  - concept: "PART 3 -- direct answer to 'is measure theory important now?': 'yes -- but in a much more specific way than initially thought'; measure theory is 'important as a mathematical foundation for a specific part of the problem -- temporal/probabilistic knowledge extraction -- but not yet important for defining KnowledgeOS or the Kernel'"
  - concept: "PART 3 -- explicit correct dependency direction, contrasted with the rejected reverse: Knowledge phenomenon -> temporal extraction problem -> probabilistic model -> measure theory (correct), NOT Measure theory -> definition of Knowledge -> Kernel (rejected)"
  - concept: "PART 3 -- six questions measure theory CAN rigorously answer once a probabilistic extraction problem is already defined: what is the probability space (Omega,F,P); what information is available at t (the filtration F_t); how should an uncertain state be estimated (E[X_t|F_t]); how does information evolve (F_s subset F_t for s<=t); how should different probabilistic models be related (Radon-Nikodym derivatives, change of measure, absolute continuity); what does temporal stochastic evolution mean (martingales, Markov processes, stopping times)"
  - concept: "PART 3 -- six questions measure theory CANNOT answer, explicitly named 'prior questions': what is Knowledge; what makes a state Knowledge rather than belief; what gives a Knowledge state identity; what must KnowledgeOS preserve; what should the Kernel contain; whether a probabilistic extraction is even the appropriate mechanism for a particular KnowledgeOS episode"
  - concept: "PART 3 -- explicit warning against importing standard probability-space machinery before defining its terms: 'we have not yet established what the random variable actually is' -- what is X_t (world state? proposition truth-value? epistemic state? candidate knowledge state? measurement? observation? latent domain state?), what exactly is Omega, what exactly belongs in F_t -- 'we should not decide these by importing the standard probability-space machinery first. Otherwise we risk recreating the original category error: we have a probability space, therefore that must be Knowledge Space'"
  - concept: "PART 3 -- reprioritized twelve-row research-priority table, explicitly revising the corpus's earlier binary 'measure theory ready and waiting' framing: VERY HIGH priority (What is Knowledge? What is Knowledge Space? What is an epistemic state? Temporal semantics of Knowledge; History/reconstruction; Knowledge extraction); HIGH priority (Kernel requirements -- derive rather than assume; Probabilistic extraction as a research case); MEDIUM/'important supporting foundation' (Measure theory itself); DEFER (Advanced stochastic calculus; L2/Hilbert-space theory; Differential geometry)"
  - concept: "PART 3 -- concrete next-experiment proposal: instantiate 'Election E is valid' (Q_t), construct its history H_<=t, identify the information available to participant A (F_t^A), then ask whether a rigorous probabilistic extraction model P(K_t^A|F_t^A) can be constructed, and let the CASE ITSELF determine exactly which measure-theoretic machinery (probability space alone? filtrations? conditional expectation? stochastic processes? almost none of the advanced machinery?) is actually required -- 'we should let the case tell us'"
  - concept: "PART 3 -- revised two-track research architecture diagram: KNOWLEDGEOS FOUNDATIONAL RESEARCH -> Knowledge/State/Time -> Extraction problem -> [Logical extraction, Probabilistic extraction -> Measure theory] -> Compare regimes -> What must Kernel preserve -- explicitly 'the right architecture of the RESEARCH, not yet the architecture of KnowledgeOS'"
  - concept: "PART 3 -- final reframing of the whole measure-theory debate as an EMPIRICAL question rather than a foundational one to resolve in the abstract: 'stop debating whether measure theory belongs in KnowledgeOS' and instead ask 'for a concrete temporal KnowledgeOS extraction problem, exactly which measure-theoretic structures are necessary -- and which are unnecessary?'"
