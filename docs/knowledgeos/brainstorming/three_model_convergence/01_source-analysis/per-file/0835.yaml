defines:
  - concept: "The semantic contract"
    definition: "A formal specification of how one bounded context may consume another's semantic output without importing or corrupting its internal model, C_{A→B}=(Identity,Meaning,Version,Preconditions,Guarantees,FailureSemantics,Lineage) -- strictly a superset of a technical API schema, since an API contract only specifies data shape while a semantic contract additionally specifies what the data MEANS, under which model, based on which evidence, at what time, under which epistemic criteria, and whether the result is authoritative for governance purposes; consumers are entitled only to the minimal sufficient semantic projection the contract promises, never the producing context's full internal state"
  - concept: "'Backward compatible schema⇏backward compatible meaning'"
    definition: "Two versions of a data structure can be byte-for-byte identical in their JSON schema (the same field names and types, e.g. status:'APPROVED' in both v1 and v2) while the underlying semantic meaning of that value has changed between versions -- so schema-level backward compatibility checks (as commonly performed by API tooling) are insufficient to guarantee that a consumer correctly interprets a message, and semantic compatibility must be verified independently of, and in addition to, schema compatibility, a distinction the file flags as especially important for AI systems that may otherwise silently reinterpret old data under new semantic assumptions"
  - concept: "The retrospective-judgment distinction"
    definition: "Two categorically different questions that must never be conflated when evaluating a past decision: 'was this decision valid at the time it was made?' (Valid(D,t), evaluated against the knowledge, policy, and authority that existed at time t) versus 'would we make this same decision now?' (WouldWeMakeDecisionNow?, evaluated against today's knowledge, policy, and authority) -- a decision can be genuinely valid at t while the same decision would no longer be made at t+1 purely because the information state has since changed, and this divergence does not by itself mean the original historical decision was erroneous; historical validity must always be judged against the epistemic and governance conditions applicable at the time the decision was made, never retroactively against later knowledge"
