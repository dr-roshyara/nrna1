defines:
  - concept: "Identifiability"
    definition: "A property X is identifiable from observations O if observational equivalence (π(W_1)=π(W_2)) always implies X(W_1)=X(W_2); otherwise X is structurally not identifiable from the available observations, regardless of any stated confidence"
  - concept: "CanCompute(x)≠CanJustify(x)"
    definition: "A model may technically produce a numeric output f(x) for any input, including inputs far outside its validated domain, but that computability does not by itself establish that the output is epistemically justified"
  - concept: "The identifiability-aware epistemic-honesty distinction"
    definition: "'I don't know' expresses a state of subjective uncertainty; 'I cannot know this from the currently available observations' is a stronger, formal claim about the structural identifiability of the property in question given the current evidence"
  - concept: "Query-dependent sufficiency"
    definition: "Sufficient(E,q) — whether a compressed or summarized representation retains enough information to answer a specific query q; sufficiency for one query does not imply sufficiency for another (SufficientFor(q_1)⇏SufficientFor(q_2))"
