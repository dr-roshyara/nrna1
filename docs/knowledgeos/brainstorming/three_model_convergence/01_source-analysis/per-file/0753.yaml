defines:
  - concept: "Continuity≠Accessible Memory"
    definition: "An identity or state may possess genuine underlying continuity across transitions (Identity_t→Identity_{t+1}) without the later state having direct access to the complete memory of the earlier one (Memory(Identity_{t+1}) does not necessarily contain Memory(Identity_t)) -- continuity of being and completeness of accessible recollection are two independent properties, and a third party may hold knowledge of the full lineage that neither individual state possesses"
  - concept: "State≠History≠Accessible Memory (the three-layer memory model)"
    definition: "Current state S_t (what an actor presently knows), Historical lineage H={S_0,...,S_t} (what actually happened across all previous states), and Authorized historical knowledge K(H) (what some actor or system is actually permitted or capable of knowing about H) are three distinct layers that must never be collapsed into one; an actor's current accessible memory is generally a proper subset of the full history, and access to history is itself a governed, authority-scoped question"
  - concept: "Ephemeral Agent Memory≠Authoritative Knowledge Memory"
    definition: "An AI agent's own session-scoped operational memory (what it currently recalls having done or decided) must never be treated as the authoritative record of governed knowledge -- authoritative history is retained by KnowledgeOS itself, external to and independent of any single agent session's transient state, so that a new agent session need not (and cannot be assumed to) carry the complete history of prior sessions"
  - concept: "Provenance≠Lineage"
    definition: "Provenance answers 'where did this specific piece of knowledge come from?' (its origin, acquisition, transformation, and derivation chain); Lineage answers 'what states or instances are connected through continuity?' (the broader thread of identity/continuity across a sequence of states) -- the two concepts overlap substantially but are not identical, and an architecture should track both explicitly rather than conflating them into one field"
  - concept: "Wisdom as a cross-cutting domain function (not a domain class)"
    definition: "Rather than reifying 'Wisdom' as a stateful domain entity or aggregate, it should be modeled as a pure function taking governed inputs (Knowledge, Context, Evidence, Rules, Authority) and producing an ActionGuidance verdict from a fixed vocabulary (DO, DON'T, WAIT, ASK, ESCALATE, INVESTIGATE) -- a cross-cutting capability multiple bounded contexts can invoke, not a new aggregate root owning its own persisted state"
refines:
  - concept: "0745's Determination immutability and Supersession discipline"
    refinement: "Extended with an explicit rationale grounded in Continuity vs. Accessible Memory: a finalized Determination must retain its full actor/context/evidence/method/timestamp/provenance externally precisely because the producing agent's own session memory cannot be relied upon to retain or reconstruct it later"
  - concept: "0742's/0744's/0750's/0751's established assurance discipline (Evidence⇏Truth, INCONCLUSIVE retention)"
    refinement: "Extended with the parallel principle Knowledge⇏Action, requiring an explicit intermediate Judgment/Wisdom stage between Knowledge/Determination and Action, and with 'do nothing' elevated to a first-class Decision outcome alongside Act/Defer/Escalate"
  - concept: "0751's AGENTS.md≠KnowledgeOS and the Claude/Codex-harness-symmetry architecture"
    refinement: "Independently re-derived and reinforced from an entirely different angle (the Continuity-vs-Accessible-Memory distinction) as Ephemeral Agent Memory≠Authoritative Knowledge Memory -- two independent Chapter-4-adjacent lines of reasoning converging on the same architectural conclusion"
  - concept: "0752's Person≠Role distinction and its explicit anti-premature-analogy discipline"
    refinement: "Directly honored: Krishna is explicitly NOT modeled as 'the administrator who has all memory' (an omniscient-database analogy that would have violated 0752's own warning), but reframed through the more careful abstraction Witness+Teacher+Source of continuity"
