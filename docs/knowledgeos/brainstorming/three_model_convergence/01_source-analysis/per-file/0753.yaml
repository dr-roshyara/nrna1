title: "Gita Chapter 4 -- What to Do Versus What Not to Do (MAJOR SYNTHESIS MILESTONE): Delivers Two Genuinely New Architectural Principles Rather Than Restating Prior Content -- Principle IV-A, 'A Governed System Must Be Capable of Determining Both What Should Be Done and What Should Not Be Done' (Decision→{Act,Refrain,Defer,Escalate,Investigate}, With 'Do Nothing' as a First-Class Outcome and Insufficient-Evidence⇒Do-Not-Determine as Explicit Epistemic Restraint), and Principle IV-B, 'Continuity Exceeds Accessible Memory' (State≠History≠Accessible Memory, Derived From Krishna Remembering Past Births That Arjuna Does Not) -- Delivers Provenance≠Lineage, a Fresh Independent Justification for Ephemeral Agent Memory≠Authoritative Knowledge Memory (Directly Reinforcing 0751's AGENTS.md≠KnowledgeOS Finding), the Seven-Statement Epistemic-Maturity Checklist ('The Actor Must Know the Limits of Its Own Knowledge' -- 'Perhaps the Most Important Principle for AI'), and Proposes Wisdom as a Cross-Cutting Domain FUNCTION (Not a Naive Domain Class) -- Explicitly Self-Assessed as Strengthening Rather Than Forcing a Redesign of Ten Prior Architecture Decisions"
