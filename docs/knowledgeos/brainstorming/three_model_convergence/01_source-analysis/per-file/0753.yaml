about: >
  Opens as a direct response continuing the Chapter-4 analysis (following 0752), identifying two
  architectural ideas explicitly deeper than the corpus's established "knowledge has provenance" theme,
  with an upfront methodological caution: "these are not just metaphors for our architecture. They can
  become design principles if we translate them correctly" -- maintaining the analogy-discipline 0752 had
  just reasserted.

  **Delivers the "what to do vs. what not to do" distinction**: Krishna's chapter-wide treatment of action/
  wrong-action/inaction is reframed as the harder engineering question "given a situation, how do I know
  which action is right?" paired with "how do I know which action must NOT be taken?" -- explicitly
  distinguished from a naive `IF condition THEN execute action` command system via the sequence
  Situation→Understanding→Applicable principle→What should be done?→What should not be done?→Action/
  restraint. **Delivers the deontic four/six-value governance vocabulary**: `Required, Permitted, Forbidden,
  Unknown` (plus optionally `Recommended, Discouraged`), explicitly replacing a naive boolean
  `allowed=true/false` governance model -- "much closer to a policy/dharma model."

  **Delivers "wisdom is concerned with the action boundary"**: wisdom is not storage but a continuous
  dual question, "what should I do?" and equally "what should I refrain from doing?" -- yielding a revised
  chain `Knowledge→Wisdom→Action Guidance`, where Wisdom branches into `DO/ACT` and `DO NOT ACT` before
  reconverging into Action.

  **Delivers "'do nothing' must be a first-class outcome,"** explicitly rejecting the assumption
  `Decision⇒Action`: `Decision→{ACT, REFRAIN, DEFER, ESCALATE, SEEK MORE KNOWLEDGE}`. Worked through a
  concrete AI-agent example: an agent lacking sufficient evidence should conclude `Insufficient Evidence⇒
  Do Not Determine`, optionally `⇒SeekMoreEvidence` -- named "epistemic restraint." **Connects this
  directly to the prior established `Evidence⇏Truth` principle**, adding the parallel `Knowledge⇏Action`,
  requiring an intermediate `Knowledge→Judgment→Action/Restraint` step.

  **Delivers the second deep idea: Continuity vs. Accessible Memory**, derived from Krishna telling Arjuna
  both have had many births, but Krishna remembers them while Arjuna does not -- explicitly NOT modeled as
  "a database containing previous lives," but as a precise distinction between `Continuity` and
  `Accessible memory`, "not the same thing." Formalized: `Identity_t→Identity_{t+1}` continuity may hold
  while `Memory(Identity_{t+1})⊉Memory(Identity_t)`, with a separate actor (Krishna) possessing knowledge of
  the complete lineage.

  **Delivers a three-layer memory model**: Layer 1 Current state `S_t`; Layer 2 Historical lineage
  `H={S_0,S_1,...,S_t}`; Layer 3 Authorized historical knowledge `K(H)` (what some actor/system is actually
  permitted or capable of knowing about H) -- boxed as `State≠History≠Accessible Memory`, "a profound
  architectural distinction." Connects this to the corpus's existing KnowledgeClaim/KnowledgeVersion/
  Provenance/ContextSnapshot/Determination/Supersession machinery, but delivers the sharper new invariant:
  "a new state does not necessarily inherit the complete epistemic memory of the previous state" --
  `History exists ≠ Current agent knows history`.

  **Delivers "this solves a major AI-agent problem,"** worked through a concrete Agent-A-Session-1 /
  Agent-B-Session-2 example: `Agent_{t+1}≠Agent_t` in accessible-memory terms even when operationally "the
  same agent," while KnowledgeOS preserves `History(Agent)` outside the ephemeral agent state -- "the
  agent does not have to carry its entire history."

  **Delivers a fresh, independently-derived justification for a new architectural principle,
  `Ephemeral Agent Memory≠Authoritative Knowledge Memory`**, explicitly cited as strongly validating the
  prior architecture decision that `.claude/` and `.codex/` should not become the authoritative KnowledgeOS
  memory (the agent harness holds operational memory; KnowledgeOS holds governed historical knowledge) --
  directly and independently reinforcing 0751's `AGENTS.md≠KnowledgeOS` finding from a completely different
  Chapter-4-derived angle.

  Delivers a deeper identity decomposition (Actor identity/State/Memory/Role/Authority/Experience/
  Knowledge as separate dimensions: `ActorIdentity=A`, `State(A,t_1)≠State(A,t_2)`,
  `Memory(A,t_2)⊉Memory(A,t_1)`, yet `History(A)` persists). **Delivers "this is exactly why provenance
  must be external to transient state,"** worked through a concrete Determination-D1 example: without
  externally-retained actor/context/evidence/method/timestamp/provenance, D1 degrades from governed
  knowledge into merely "something the AI once said" -- reframed as the necessary alternative,
  `Historical epistemic artifact`.

  **Refines Krishna's architectural characterization**: explicitly rejected as "the administrator who has
  all memory" (an "omniscient database"), replaced with `Witness+Teacher+Source of continuity` -- "a
  trusted epistemic authority that can establish continuity across states that individually lack complete
  historical memory" -- a disciplined, non-literal translation avoiding the exact naive-analogy trap 0752
  warned against.

  **Delivers a new KnowledgeOS concept, Historical Continuity**: a governed mechanism maintaining
  `Lineage(x)` even when `Memory(x,t)` is incomplete, illustrated via a lineage-of-partial-memory-states
  diagram. **Delivers `Provenance≠Lineage`**: Provenance asks "where did this knowledge come from?"
  (`Provenance(x)`); Lineage asks "what states/instances are connected through continuity?" (`Lineage(x)`)
  -- overlapping but distinct, "worth adding to our architecture vocabulary."

  **Names two formal architectural principles explicitly**: **Principle IV-A — Wisdom of action and
  restraint** (`A governed system must be capable of determining both what should be done and what should
  not be done`, therefore `Decision→{Act,Refrain,Defer,Escalate,Investigate}`); **Principle IV-B —
  Continuity exceeds accessible memory** (`Historical continuity must not depend on the current actor's
  accessible memory`; `CurrentMemory⊆HistoricalKnowledge` may hold, but `CurrentMemory=HistoricalKnowledge`
  must never be assumed).

  **Delivers a third emergent principle, unnamed but flagged "perhaps the most important principle for
  AI"**: "the actor must know the limits of its own knowledge," worked through a seven-statement epistemic-
  maturity checklist an agent should be able to produce (I know this / I do not know this / I previously
  knew this but cannot currently reconstruct it / the system has historical evidence for this / the
  evidence is insufficient for action / the action is prohibited / the action requires authority) --
  "epistemically mature architecture," a genuinely precise and directly applicable AI-honesty/calibration
  framework.

  Delivers a revised master architecture diagram (HISTORICAL LINEAGE→KNOWLEDGE→INQUIRY→EVIDENCE→
  DETERMINATION→WISDOM→{SHOULD DO, SHOULD NOT DO}→DECISION→{ACT, DEFER, REFRAIN}→EXECUTION→OBSERVATION→
  NEW KNOWLEDGE/UPDATE, under `PROVENANCE+LINEAGE`), and an explicit self-assessment that Chapter 4
  strengthens rather than forces a redesign of ten previously-established architecture decisions (knowledge
  separated from agents; evidence separated from claims; determination separated from decision; decision
  separated from execution; provenance preserved; context snapshots; immutable historical determinations;
  supersession rather than overwriting; AI agents treated as actors; governance as a separate concern).

  **Closes by explicitly naming "one thing still missing": Wisdom as a domain capability**, deliberately
  NOT proposing a naive `Wisdom` domain class ("that would be premature"), instead proposing Wisdom as a
  cross-cutting domain FUNCTION: `Wisdom:(Knowledge,Context,Evidence,Rules,Authority)→ActionGuidance`, with
  `ActionGuidance∈{DO,DON'T,WAIT,ASK,ESCALATE,INVESTIGATE}` -- explicitly flagged "something I think we
  should examine very seriously before Step 158," closing with the capstone: "Chapter 4 may have revealed a
  missing layer in our architecture: not another repository of knowledge, but a governed mechanism for
  converting knowledge into appropriate action -- or appropriate restraint." No actual code execution,
  repository inspection, or verified filesystem/architecture claim reported anywhere in this file. The
  verse-level Chapter 4 summary and Chapter 1-4 cumulative matrix promised at 0752's close have STILL not
  been delivered as of this file -- Step 158 remains deferred a third time.
