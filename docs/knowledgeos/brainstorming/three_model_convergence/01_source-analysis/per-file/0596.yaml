defines:
  - concept: "Value of Information (VOI)"
    definition: "VOI(E)=E_e[max_a EU(a|E,e)]-max_a EU(a|E) — the expected improvement in achievable decision quality from acquiring evidence E before deciding, versus deciding now"
  - concept: "Zero_epistemic vs. Zero_decision"
    definition: "Zero_epistemic is a raw, undifferentiated knowledge gap; Zero_decision (DecisionRelevantKnowledgeGap) is the subset of knowledge gaps whose resolution has nonzero VOI for a current decision — only the latter warrants an information-acquisition action"
  - concept: "Information-action selection"
    definition: "i*=argmax_i[VOI(i)-Cost(i)-RiskCost(i)] — Lord selects the information-gathering action with the highest net value, explicitly accounting for the cost and risk of the acquisition action itself"
  - concept: "Next Best Action"
    definition: "NBA=argmax_{x∈X} ExpectedDecisionValue(x), where X spans ordinary Actions, InformationActions, and Escalations — a unified optimization target across acting and information-gathering"
