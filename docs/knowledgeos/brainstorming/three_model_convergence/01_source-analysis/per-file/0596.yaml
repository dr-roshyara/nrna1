about: >
  Opens Step 25R directly executing 0595's closing commitment, moving from knowing/predicting to acting,
  with the founding warning against the implicit fallacy `most probable outcome⇒best action`. **RESOLVES
  the corpus-integrity flag raised at 0595**: this file substantially extends, rather than duplicates,
  0557's Step 15 and 0585's/0586's Lord/Sārathi algebras, delivering genuinely new formal apparatus --
  most notably a rigorous Value-of-Information-based mathematical justification for Zero itself, an
  information-acquisition-as-action formalism with explicit risk cost, a formal Aleatoric/Epistemic
  uncertainty distinction, Decision regret, evidence prioritization via net VOI, a formal Next-Best-Action
  definition, and a newly precise, mathematically coherent Lord/Sārathi boundary -- none of which appear in
  0557, 0585, or 0586.

  Delivers the central sequence `Knowledge→Prediction→Consequences→Utility/Risk→Decision` and
  `Decision↔ValueOfInformation`, formalizing `Decision≠Inference`: expected utility
  `EU(a|E)=Σ_s P(s|E)U(a,s)`, `a*=argmax_a EU(a|E)`, worked through a concrete four-row upgrade/outage
  consequence table demonstrating that `P(Outage|Upgrade)=0.05` alone says almost nothing about whether to
  upgrade. **Delivers Risk formally separated from Probability**: `ExpectedLoss=Σ_s P(s|E)L(a,s)`, with a
  worked Tail-risk counterexample (two actions sharing identical expected loss `€1,000` but dramatically
  different catastrophic-tail probabilities) demonstrating **`ExpectedValue alone may be insufficient`** --
  risk policy must explicitly specify how severe/irreversible outcomes are treated. Delivers the explicit
  caution that a utility function encoding risk aversion is a normative organizational choice KnowledgeOS
  must never secretly invent.

  **Delivers a formal `DecisionContract=(Actions,States,UtilityModel,Constraints,RiskPolicy,Authority,
  EvidenceRequirements)` DDD concept**, with optimization explicitly constrained to admissible actions
  (`a*=argmax_{a∈A_{admissible}} EU(a)`), and a precise three-way decision-blocking taxonomy
  (`TechnicalRiskTooHigh`/`GovernanceAuthorizationMissing`/`EvidenceInsufficient`), requiring Sārathi to
  return a structured `DecisionStatus:blocked` record with an explicit reason rather than a bare "no."
  Reconfirms `Recommendation≠Decision≠Authorization`, and formally characterizes Sārathi as
  "decision-support/decision-orchestration intelligence, not an autonomous source of authority"
  (`Sārathi:(K,Models,Constraints)→DecisionCandidate`, with governance separately determining
  `Authorize(DecisionCandidate)`).

  **Delivers Lord's role newly formalized via meta-decision-making**: choosing among four concrete option
  types (decide now / collect observation / run simulation / ask human expert) rather than merely acting.
  **Delivers the file's central formal deliverable -- Value of Information, self-described as "one of the
  most powerful mathematical ideas for the KnowledgeOS architecture"**:
  `VOI(E)=E_e[max_a EU(a|E,e)]-max_a EU(a|E)`, worked through a concrete `EU(Upgrade)=100` vs.
  `EU(DoNothing)=95`, `VOI(Inspection)=20`, `Cost=5`, `NetVOI=15>0` example demonstrating that
  `AcquireInformation` can itself be the rational action -- **"this gives Zero a mathematical foundation."**

  **Delivers the file's most consequential architectural refinement -- Zero itself is decomposed**:
  `Zero_epistemic` (a raw knowledge gap) is formally distinguished from `Zero_decision`
  (`DecisionRelevantKnowledgeGap`), worked through a deliberately irrelevant missing-kernel-version example
  (`VOI≈0` implies Lord should do nothing) -- delivering the file's headline architectural principle,
  explicitly called "a profound architectural principle": **`optimize for SufficientKnowledge for the
  decision, not CompleteKnowledge`**, explicitly preventing KnowledgeOS from "endlessly trying to make
  itself complete."

  **Delivers information acquisition formalized as its own optimizable action**: a set of typed
  information-gathering actions `I={ReadConfiguration,AskHumanExpert,RunTest,QueryAPI,RunSimulation}`,
  each with `Cost(i)` and `VOI(i)`, selected via `i*=argmax_i[VOI(i)-Cost(i)]` -- "a beautiful mathematical
  formulation of the Lord loop." **Delivers the important refinement that evidence acquisition itself
  carries risk** (worked "restart production server to verify configuration" example), yielding
  `NetValue(i)=VOI(i)-Cost(i)-RiskCost(i)` -- Lord "cannot blindly maximize information." Delivers the
  architectural reframing `KnowledgeOS=PassiveKnowledgeSystem+ActiveInformationAcquisition` (when
  authorized), and an exploration/exploitation framing explicitly NOT requiring KnowledgeOS to become a
  reinforcement-learning system. **Delivers a precise reconfirmation of the corpus's recurring AI-
  governance boundary applied specifically to information-gathering**: `VOI(i)>0` never implies
  `Execute(i)`, only `Candidate(i)`, with governance separately determining authorization.

  **Delivers a formal Aleatoric-vs-Epistemic uncertainty distinction**, worked through a concrete outcome
  record separating irreducible process randomness from a reducible unverified-firewall-configuration
  example -- more evidence can reduce epistemic uncertainty but "generally cannot eliminate genuine
  aleatoric randomness." Delivers Decision robustness as stability of the optimal action across plausible
  models/parameters, with two named explicit decision-policy formulations -- worst-case/robust
  (`argmax_a min_M EU_M(a)`) versus expected-over-models (`Σ_M P(M|E)EU_M(a)`) -- explicitly requiring
  `DecisionRule` to be stated, never implicit. Delivers a DDD `DecisionPolicy` domain object (scope,
  admissible actions, constraints, utility/risk model, evidence threshold, escalation rule, authority
  requirement, revision policy), explicitly framed as preventing "business-critical decision logic from
  disappearing into an AI prompt."

  Delivers a six-stage event-sourced Decision lifecycle (Candidate→Evaluated→Recommended→Approved→
  Executed→Verified, with Executed→Failed / Executed→Reversed branches) and closed-loop decision
  verification (`Decision→Action→Observation→ModelEvaluation`). **Delivers Decision regret**
  (`Regret(a,s)=U(a*(s),s)-U(a,s)`) as a retrospective metric for evaluating the cost of epistemic
  uncertainty itself -- explicitly named as measuring `ValueOfKnowledge`, not merely `KnowledgeAmount`,
  "a profound connection between the epistemic layer and the business layer." **Delivers a worked evidence-
  prioritization example** (three candidate evidence items with cost/benefit figures, net VOI computed as
  `1`, `15`, `-1` respectively, with Lord prioritizing the highest), explicitly contrasted as "far better
  than 'collect all missing information.'" **Delivers a formal Next Best Action definition**:
  `NBA=argmax_{x∈X} ExpectedDecisionValue(x)` over `Actions+InformationActions+Escalations`, explicitly
  proposed as a candidate core formal definition of Lord.

  **Delivers the file's central architectural deliverable -- a newly precise, mathematically coherent
  Lord/Sārathi boundary**: Lord answers "what should happen next?" under workflow/information/control
  constraints; Sārathi answers "which decision is best supported?" given knowledge/models/utility/policy --
  explicitly caveated as "not absolute -- the exact boundary is a DDD design decision -- but the
  distinction is now mathematically coherent," directly sharpening the qualitative split first drawn at
  0586. Reconfirms human authority for high-impact decisions (`Sārathi→Recommendation`, then
  `Human/Board→Authorization`), preventing optimization from being confused with authority.

  **Delivers eight labeled falsification tests (A-H), ALL PASS**: probability without utility (utility
  needed to determine decision); high-risk tail (risk policy distinguishes equal-expected-loss actions with
  different tails); unauthorized optimum (`NotAdmissible`); information value (`VOI>0` changes the optimal
  action); useless knowledge (`VOI≈0`, no information action); expensive evidence
  (`VOI<Cost`, do not acquire); irreversible action (higher evidence threshold, if policy specifies);
  decision feedback (prediction evaluation).

  Delivers a normal-PC computability reconfirmation for EU/Risk/VOI/Sensitivity/ScenarioAnalysis, with
  large state spaces, many actions, long planning horizons, stochastic simulation, and partial
  observability explicitly framed as complexity/scaling problems, not fundamental architecture problems.

  **Delivers Step 25R's verdict**: **"25R — PASS,"** with the major result `Decision≠Inference`, formalized
  as `Decision=Optimization under Uncertainty+Utility+Constraints+Authority`, and the important
  self-standing conclusion **`InformationAcquisition is itself a decision`** -- "a rigorous mathematical
  foundation for Zero→Lord→Sārathi." **Delivers the corpus's most complete consolidated epistemic-decision
  cycle notation to date**: the main loop
  (`World→Observation→Evidence→Assessment→Knowledge→Model→Prediction→Decision→Authorization→
  Action→Observation`) plus two subsidiary loops
  (`KnowledgeGap→Zero→Lord→InformationAction→Evidence`; `Decision→Outcome→ModelEvaluation→
  ModelRevision`) -- "a genuine epistemic-control architecture rather than merely an AI knowledge
  repository."

  **Closes by identifying one remaining major boundary the file explicitly refuses to skip -- entity/
  reference identity**: worked through a series of pointed questions ("Which Nexus? Which server? Which
  environment? Which installation? Which time? Which evidence? Which organization?"), noting that two
  records can share identical text yet refer to different real-world entities. **Delivers the file's
  explicit reconnection to the corpus's Knowledge Atma landmark (0587)**: "this is especially important
  because our previous work introduced Knowledge Atma." **Opens "Step 25S — Identity, Entity Resolution,
  Same-As, Distinct-From and Knowledge Atma,"** posing the central question "When can KnowledgeOS
  legitimately conclude that two pieces of knowledge refer to the same thing?" and its more dangerous
  converse, "When must KnowledgeOS refuse to merge them because identity is uncertain?" -- explicitly framed
  as testing whether the Knowledge Atma concept is "mathematically and computationally sound enough to
  serve as the identity foundation for the entire KnowledgeOS architecture." No actual code execution
  reported.
