about: >
  "25 — THE GĪTĀ TRACK CLOSED (Ch 17 · 18 · 5) · four controlled comparisons · and the `Guṇa` fork," verdict
  "FOUR controlled comparisons now, all the same shape. The `Guṇa` flag -- open since Step 286 §4 -- is not
  dissolved but SHARPENED into a two-branch fork. `Determination` RECOVERS a corpus object lost since Steps
  157/165. And 'equal treatment of all evidence' is REFUTED by the corpus's own statistics." Closes the
  kernel-lane side of the Gītā track: Ch 5-18 now fully read.

  **EXTENDS THE ALREADY-TRACKED CONTROLLED-COMPARISON METHODOLOGY (file 1102) TO FOUR TOTAL CHAPTERS**,
  tabulating all four head-to-head: Ch 16 (already tracked), Ch 17 ("'Trust Problem — Solved'" vs "guṇa as a
  mode/state model... 'not an assertion that KnowledgeOS literally implements the metaphysics'"), Ch 18
  ("'Completeness ✅ Complete'" vs "five separations + two candidate capabilities"), Ch 5 ("'Non-Attachment
  ✅ Complete'... 'Self-Satisfaction ✅ Complete'" vs "clarifies several kernel mechanisms that were
  previously implicit"). Boxed: "4 chapters · 2 lanes · 13 'Solved/Complete' claims against 0 of 13 closure
  rows. The kernel lane declares nothing solved in any of the four." Explicitly upgrades the already-tracked
  `G-85` lane conflict: "now supported by FOUR CONTROLLED COMPARISONS, not by aggregate counting."

  **DELIVERS THE `GUṆA` FORK, GENUINE PROGRESS ON A FLAG UNTOUCHED SINCE STEP 286 §4 (already tracked, file
  1099)**: introduces `K_t=(Σ_t,G_t,...)` with kernel MODE `G_t` as a component separate from `Σ` ("'Knowledge
  state and kernel mode must remain separate.'"). Precisely forks the already-open flag into two named,
  costed branches: if `G_t` is DERIVED from `Σ`, "the threshold returns -- a derivation rule over `S`'s
  ordinal bands is exactly the `θ` gap `§4` flagged"; if `G_t` is INDEPENDENT of `Σ`, "a new state component
  with NO CARRIER... another OPEN-ENDED TUPLE, which `258.35` warns against." Boxed: "Neither branch is free.
  The flag is not lifted -- it is converted from a VAGUE CAUTION into a TWO-BRANCH QUESTION WITH NAMED
  COSTS." Explicitly confirms `§4`'s scale-type gate still binds, since neither branch declares one.

  **DELIVERS A GENUINELY STRIKING RECOVERY FINDING**: Ch 18 proposes `Buddhi→discrimination` and
  `Dhṛti→persistence/stability`, chaining `Knowledge→Buddhi→Determination→Action`. **Discovers this
  `Determination` is not new but RECOVERED** -- the corpus's own already-existing `01-STEP-272-PREMISE-AUDIT`
  (`PA-1`) already lists "`Determination` -- a FULL AGGREGATE ROOT, Steps 157/165, ABSENT FROM Steps
  262-271" as one of four concepts specified and then dropped, with `Determine` among the already-tracked 14
  forced operations and `D_t` appearing in the canonical `K`. Boxed: "The Gītā lens INDEPENDENTLY RE-RAISES an
  object the corpus SPECIFIED AND LOST. That is a RECOVERY SIGNAL for a documented drop, not a new
  candidate." Precisely disciplined: "it does not RESTORE it -- `PA-1`'s finding stands: 'the corpus has no
  mechanism that notices a commissioned step not being performed.' RE-RAISING AN OBJECT IS NOT
  RE-INSTATING IT." Also notes `Dhṛti` (persistence) converges with the already-tracked `H-G6-3` Epistemic
  Stability hypothesis -- a second independent arrival.

  **DELIVERS CH 18'S FIVE-WAY SEPARATION AUDITED AGAINST CARRIERS**: `Knowledge≠Understanding≠Determination≠
  Action≠Result`, finding two of five have no carrier (`Understanding`, straddling the already-tracked
  `Qualify`/`GK-Q2`; `Result`, already-tracked `Command≠Transformation` corroboration), one is a recovered-
  but-lost object (`Determination`), one is ratified (`Action`), one is the already-open canonical `K`
  (`Knowledge`). Explicitly confirmed as corroboration, not derivation, since the source itself cites the
  already-established `256.21`.

  **DELIVERS A STRIKING, CONCRETE REFUTATION OF AN `external_research` OVERCLAIM USING THE CORPUS'S OWN
  STATISTICAL PRINCIPLES**: Ch 5's `external_research` claim "'Equal Vision ✅ Complete -- equal treatment
  of evidence'" is directly REFUTED by two already-established corpus loci: `25J.29-32` (evidence
  independence must be modelled; treating dependent evidence as independent "double-counts... a SERIOUS
  STATISTICAL ERROR") and `25J.34` ("never implement `Confidence=Average(SourceConfidences)`"), plus the
  already-tracked `38.20` asymmetric-loss principle. Boxed: "'Equal treatment of all evidence' is PRECISELY
  THE ERROR THE CORPUS NAMES. `Samatva` as EQUANIMITY is a stance; as EQUAL WEIGHTING it is A STATISTICAL
  MISTAKE." Explicitly diagnosed as the same error shape as the already-tracked `E2` type error (file 1096):
  "a philosophical term mapped onto a technical operation whose semantics CONTRADICT it."

  **DELIVERS THE ELEVENTH NEGATIVE CONSTRAINT, `C11`**: "Knowledge state ≠ kernel mode (`K_t` and `G_t` must
  remain separate)."

  Closes with the final tally: T4 still 3, T4-SHAPE still 3, T0 rises to 18 (two new: "equal treatment of
  evidence" and Ch 18's own false "complete transition system" claim). Boxed: "The Gītā track is now COMPLETE
  on the kernel-lane side: Ch 5-18 read. Still ZERO new primitives." Confirms the disciplined non-license: the
  `Guṇa` fork not resolved, `Determination` re-raised not re-instated, nothing promoted, Steps 288-291
  unchanged, all `R6`.
