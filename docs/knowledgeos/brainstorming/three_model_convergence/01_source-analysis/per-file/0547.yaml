  - concept: "Expected Discrepancy Reduction (EDR) formalized as more fundamental for KnowledgeOS than entropy reduction: the objective is K_t->I_t, not H(K_t)->0"
  - concept: "A concrete counterexample proving InformationGain≠PurposeValue: reducible entropy about an irrelevant proposition has high information gain but near-zero discrepancy reduction, while a purpose-relevant proposition can have low apparent information but high value"
  - concept: "Value of Evidence VOE_ρ(e|K_t,I_t,P,C) and a cost-inclusive Utility function U_ρ(e)=Benefit_ρ(e)-Cost_ρ(e), demonstrating that maximum information gain alone is an insufficient acquisition criterion"
  - concept: "Lord's evidence-acquisition optimization problem formalized as q*=argmax_{q∈𝒬} U_ρ(q|K_t,I_t,P), named one of the most important equations in KnowledgeOS theory"
