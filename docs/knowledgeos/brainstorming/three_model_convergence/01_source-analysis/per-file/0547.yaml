  - concept: "Expected Discrepancy Reduction (EDR)"
    definition: "EDR(e)=𝔼[D(K_t,I_t,P)-D(K_{t+1},I_t,P)|e] — the expected reduction in discrepancy from the Ideal State resulting from acquiring evidence e, deliberately more general than and preferred over entropy-based information gain"
  - concept: "Utility of evidence (U_ρ)"
    definition: "U_ρ(e)=Benefit_ρ(e)-Cost_ρ(e), potentially α·EDR(e)+β·DecisionImpact(e)-γ·Cost(e)-δ·Time(e) with policy-specific coefficients — the basis for selecting the optimal next evidence-acquisition action q*=argmax U_ρ(q)"
  - concept: "The KnowledgeOS Decision Loop (nine-step algorithm)"
    definition: "K_t -> Zero(K_t,I_t)->Δ_t -> GenerateCandidates(Δ_t)->Q_t -> EvaluateValue(Q_t,K_t,I_t,P,ρ) -> q*=argmax U_ρ(q) -> Acquire(q*)->e_t -> Assess(e_t) -> Update(K_t,e_t)->K_{t+1} -> Repeat — the corpus's first complete, executable active-epistemic-system algorithm"
