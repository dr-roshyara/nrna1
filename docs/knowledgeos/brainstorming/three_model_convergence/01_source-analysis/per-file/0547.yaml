  - concept: "'Much more than RAG': KnowledgeOS's full pipeline (Purpose->IdealState->Discrepancy->EvidenceValue->AcquisitionPlan->Evidence->Assessment->KnowledgeState) contrasted explicitly against conventional RAG's Question->Retrieve->Generate"
  - concept: "A general, calculus-agnostic stopping condition for evidence acquisition: no candidate action has sufficient expected utility, rather than requiring a scalar discrepancy threshold"
  - concept: "An explicit epistemic-discipline safeguard rejecting 'Moksha=Δ=0' or any similar equation as a global mathematical consequence of the framework: Δ=0 is always relative to a specified purpose/context, never a global terminus"
