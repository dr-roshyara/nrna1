defines:
  - concept: "The four-state construct-maturity discipline (discussed / defined / derived / ratified)"
    definition: "Four sharply distinct states a KnowledgeOS construct or claim can occupy, which must never be conflated: 'discussed' means the idea has appeared in prose or conversation with no formal commitment; 'defined' means it has received a precise, unambiguous formal or semantic specification; 'derived' means it has been shown to follow necessarily from established axioms, definitions, or prior ratified constructs via an explicit derivation chain; 'ratified' means a legitimate governance authority has formally accepted it as canonical. A construct can be discussed without being defined, defined without being derived, and derived without being ratified -- treating any earlier state as though it were a later one is the central error this file's entire gap analysis is designed to catch"
