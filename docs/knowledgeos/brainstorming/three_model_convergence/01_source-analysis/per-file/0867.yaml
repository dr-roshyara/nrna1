defines:
  - concept: "The heterogeneous-kernel finding"
    definition: "A structural observation about the candidate five-element kernel 𝔎_5=(G,σ,θ,λ,π): rather than being five instances of one uniform kind of mathematical primitive, each component plays a genuinely distinct semantic role -- G is a representational/relational structure, σ is an epistemic-qualification function, θ is a temporal-qualification function, λ is a provenance/lineage structure, and π is a governance-constraint object. This heterogeneity does not invalidate the kernel, but it means the common assumption that all five are 'primitives' of equal mathematical standing has not been justified and should not be assumed -- the file proposes instead that these five may be better understood as cross-cutting DIMENSIONS that qualify a more fundamental knowledge-content object from several independent directions, rather than as the complete set of primitive building blocks of the knowledge state itself"
  - concept: "The four circularity-test classifications"
    definition: "The mandated audit of potential circular definitions within the theory's dependency structure, applied to four specific candidate cycles: Validation↔Knowledge is judged benign/well-founded because a validation function evaluating an already-defined state (V:K→{true,false}) does not use its own output as an input; Evidence↔Knowledge is judged a legitimate temporal feedback loop rather than a circular definition, because the apparent cycle actually unfolds across successive time steps (current knowledge generates a question, which generates an evidence request, which generates new evidence, which produces the NEXT knowledge state) rather than within a single synchronous definition; Policy↔Authority is left explicitly UNDEFINED because the corpus does not yet specify enough formal structure to determine whether authority and policy are mutually defining (genuinely circular) or whether authority is established independently with policy merely recording its constraints (non-circular); and Provenance↔State is left explicitly OPEN because a naive provenance-reconstruction scheme that derives history from the very state it explains would be circular, and the corpus does not yet establish that its provenance mechanism is always anchored independently of the state it traces"
refines:
  - concept: "0865's kernel genealogy finding (all five components historically grounded) and 0866's D-15 finding (the deepest contradiction may be semantic/type-based, not formula-based)"
    refinement: "SUBSTANTIALLY EXTENDED into a full necessity/dependency audit that goes beyond mere historical presence to ask what each component is actually FOR and whether it is logically required -- directly operationalizing D-15's type-theoretic reframing by explicitly typing and classifying each candidate dependency rather than treating the kernel components as an undifferentiated set of five primitives"
  - concept: "0866's D-01 finding (the ~25 competing K_{t+1} formulations) and the typed meta-model resolution strategy"
    refinement: "The Transformation→K_{t+1} dependency is classified NECESSARY despite the unresolved transition-signature contradiction, explicitly noting 'the dependency is strong even though the function definition is not canonical' -- a disciplined separation of the STRUCTURAL question (does K_{t+1} depend on Transformation?) from the FORMAL question (what exactly is the transformation function?), directly consistent with the typed meta-model strategy's spirit of mapping structure before settling exact formulas"
