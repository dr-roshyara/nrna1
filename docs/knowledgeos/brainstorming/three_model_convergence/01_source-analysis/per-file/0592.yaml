defines:
  - concept: "Likelihood ratio"
    definition: "LR(E)=P(E|H)/P(E|¬H); LR>1 favors H, LR<1 favors ¬H, LR≈1 contributes little discrimination — a more principled measure of evidential strength than a subjective confidence score"
  - concept: "No universal evidence aggregation function"
    definition: "𝒜(E_1,...,E_n;A,M)→Assessment(A) — the aggregation operator is unavoidably parameterized by an explicit model M; there is no universal mathematical resolution for combining evidence with differing authority/reliability profiles without reference to Question, Domain, Contract, and Governance"
  - concept: "Evidence has no intrinsic universal weight"
    definition: "The epistemic effect of evidence is strictly relational — Effect(E,A|C,M) — never an absolute property of the evidence item alone, independent of the specific claim, context, and assessment model"
  - concept: "Conservative Evidence Principle"
    definition: "Do not claim more evidential strength than the dependency model justifies — an independence-based combination formula (e.g. LR_combined=∏LR_i) must never be applied when the dependency structure among evidence items is unknown or unestablished"
