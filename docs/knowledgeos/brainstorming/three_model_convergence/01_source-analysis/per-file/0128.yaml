about: >
  The actual SEP scholarly article (Gillon, first published 2011, rev. 2023-08-23) underlying several
  earlier derivative files' Nyāya/tri-rūpa-hetu/hetvābhāsa citations (0092, 0096, 0100, 0127). Covers
  preclassical Buddhist debate/reasoning texts (Yamaka, Kathā-vatthu, Milinda-pañha), the classical-period
  emergence of the canonical syllogism (Caraka-saṃhitā through Vasubandhu), fallacy/rejoinder taxonomies,
  and Dignāga's culminating formalization (svārtha-/parārtha-anumāna, hetu-cakra "wheel of reasons" 3x3
  matrix, tri-rūpa-hetu, Dharmakīrti's pervasion-grounding problem). Zero KnowledgeOS/kernel framing --
  a pure academic reference text, not a derivative extraction.

introduces:
  - "Direct textual grounding, for the first time in the corpus, of the primary scholarly source behind
    the Nyāya/hetvābhāsa/tri-rūpa-hetu thread that multiple prior files (0092/0096/0100/0127) summarized
    or cited secondhand"
  - "Dignāga's hetu-cakra (wheel of reasons): a 3x3 matrix classifying a reason's occurrence in
    subject-like/subject-unlike things into good vs. bad syllogisms -- a more precise formal structure
    than any prior derivative summary captured"
  - "The scholarly debate on whether Dignāga's canonical syllogism is inductive, deductive, or
    defeasible (Hayes vs. Oetke vs. the article's own deductive-validity reading) -- not previously
    surfaced in derivative files"
  - "Dharmakīrti's unresolved problem of how a universal major premise is known at all (causation/
    identity relations proposed, both noted as ultimately unsuccessful) -- a genuine open epistemological
    gap in the classical source tradition itself, not previously surfaced"

