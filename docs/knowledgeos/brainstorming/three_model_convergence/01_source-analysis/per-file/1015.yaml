about: >
  "06 · Gap Update — Translation Register v0.1 + the Kernel Research Programme," processing five renamed
  prompt files this reconstruction has just documented (files 1010, 1011, 1012, 1013's duplicate, 1014).

  **§2 DELIVERS THE FORMAL, DIRECT RESOLUTION OF THIS RECONSTRUCTION'S OWN FLAGGED FILE-1011 TENSION**: the
  Translation Register v0.1 (19 entries) and the revised Step 286 register (16 entries, file 0997) are
  confirmed to assign DIFFERENT IDs to the SAME terms -- a full cross-mapping table given (Sañjaya:
  GK-09/v0.1 vs GK-16/r286; Buddhi: GK-10/v0.1 vs GK-09/r286; Vairāgya: GK-14/v0.1 vs GK-11/r286; Guṇa:
  GK-16/v0.1 vs GK-14/r286; Mokṣa: GK-17/v0.1 vs GK-15/r286; `Ω`/Zero: GK-18/19 in v0.1, absent from r286;
  Jñāna: GK-13 in both, "the only one that agrees"). **"`GK-16` means Sañjaya in one document and Guṇa in
  the other... This is the same defect class as the `H-K04`/`H-K06` collision -- now at the GK level and
  ACROSS TWO DOCUMENTS, which is worse: a cross-document citation of `GK-16` is unresolvable."** Explicitly
  confirms "My artifacts use the revised-286 scheme throughout" -- **directly settling this reconstruction's
  own flagged ambiguity about whether file 1011's v0.1 register was a genuine relapse or a preserved earlier
  draft: it is confirmed here as an EARLIER, SUPERSEDED numbering scheme, not the operative one, though
  neither register is "renumbered" -- disambiguation is used instead (`GK-nn/v0.1` vs `GK-nn/r286`).**

  **§3 DIRECTLY ADJUDICATES the three points where v0.1's content weakened already-tracked findings**
  (flagged at file 1011): Jñāna (v0.1 says "Knowledge→K, Partial"; adjudicated "my finding stands," since
  v0.1's own classification is only "Partial," not a strong assertion); Kṣetra-jña (v0.1 says "Candidate";
  adjudicated "the register UNDERSTATES it" -- it is ratified, FA-4, grade [E]); Sañjaya (v0.1 says
  "Analogy, Canonical? No"; adjudicated "the register UNDERSTATES it" -- it is a corpus-native construct
  with six formalized principles). **Governing rule: "Where it and the corpus differ, the corpus governs.
  No register entry is changed here."** This CONFIRMS file 1011's own weaker treatment of these constructs
  was a genuine feature of the earlier draft, not a relapse this reconstruction needed to independently
  flag as severely as file 0971's -- the corpus's own later research explicitly supersedes it, in writing,
  here.

  **§4 delivers the direct answer to Step 285's eight canonical-K questions (file 1012) via `D285-6`**: same
  abstraction? NO. **One a projection of the other? YES — `(𝒜,ℛ)=_semantic π_K(K_t)`, lossy.** A refinement?
  no. Different layers? yes (that is what the projection means). Both required? YES (`K_t` governance anchor,
  `(𝒜,ℛ)` epistemic sub-state). Which is canonical? `K_t` (the only one with a ratification act). Which is
  kernel state? UNDETERMINED (depends on unenumerated `𝒪`). Which terminology becomes canonical? NORMATIVE,
  not the research's to decide. **Explicitly distinguishes the research answer from the required governance
  artifact**: "`D285-6` supplies Step 285's research answer. It cannot supply the `K-CANONICAL-DECISION`
  artifact... The research is done; the act is not mine."

  **§5 confirms Reviewer B's discovery-vs-formal correction and adds `Ω`'s executable semantics as a NEW
  formal gap** to the frontier, distinct from the already-tracked structural recovery.

  **§6 delivers a refined gap-movement table** with the net: "1 new discovery gap (GK ids) · 1 new formal
  gap (`Ω` semantics) · 1 framing correction · 0 formal gaps closed."

  **§7 DELIVERS THE FILE'S CENTRAL STANDING POSITION, THE DEFINITIVE CLOSURE OF THE ENTIRE EQUALITY/KERNEL
  RESEARCH ARC**: "The programme has reached a governance boundary, not a research one. FOUR INDEPENDENT
  VOICES now agree" -- Reviewer A (governance decision required at Step 285), Reviewer B (hand Decision 3
  to human governance), the corpus itself (Step 261 §261.23's own halt), and this research. **Names the two
  dependency-ordered decisions remaining**: (1) `Π∈≡`? -- settles `≡`, `≅_λ`'s distinctness, D285-5/6's
  legitimacy; (2) `K-CANONICAL-DECISION` -- ratify `K_t` as canonical with `(𝒜,ℛ)` as its lossy projection,
  or rule otherwise. **"Neither is taken here. No new Sanskrit hypothesis was opened."**
