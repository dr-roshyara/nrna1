  - concept: "0591's (25M) revision-as-event-addition architecture (Revision=EventAddition+StateReDerivation)"
    refinement: "Directly mirrored for models specifically: ModelRevision=NewModelEvent, not deletion, with explicit model lineage tracking (predecessor, changed assumptions/parameters/structure, reason, supporting evidence)"
