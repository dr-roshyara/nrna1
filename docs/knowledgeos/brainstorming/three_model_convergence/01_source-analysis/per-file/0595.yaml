  - concept: "ModelScore≠Truth — AIC/BIC and similar model-selection criteria are explicitly declared not universal truth mechanisms, only relative rankings under a stated criterion"
  - concept: "Underdetermination (EvidenceInsufficientForModelSelection) formally reframed as another form of Zero, directly extending the established Zero mechanism into the model-selection layer"
  - concept: "Model falsification requires model likelihood P(O|M), not merely the occurrence of a prediction failure — grounded in Bayesian model comparison with explicit, non-invented priors"
  - concept: "'KnowledgeOS can learn without training an AI' — ModelRevision based on accumulated evidence is explicitly a broader concept of learning than LLM retraining"
  - concept: "ModelFailure→KnowledgeGap→EvidenceAcquisition, an elegant further connection between scientific model reasoning and the Zero/Lord/Sārathi loop, directly paralleling 25P's causal-identifiability pattern"
  - concept: "A seven-value ModelFailureType taxonomy (ParameterError/DataError/AssumptionViolation/StructuralError/MeasurementError/DistributionShift/UnknownCause), replacing a bare model_failed Boolean"
  - concept: "'Step 25R — Decision Theory, Utility, Risk, Value of Information and Rational Action', flagged for possible topic overlap with 0557's Step 15 and 0585/0586's already-formalized Lord/Sārathi utility/risk algebras"
defines:
  - concept: "Model (formal structure)"
    definition: "M=(Variables,Relations,Assumptions,Parameters,Scope,Predictions,Version), formally distinct from an Assertion (a single fact claim); assumptions are explicit, first-class components whose violation can explain prediction failure without refuting the model"
  - concept: "Calibration"
    definition: "A probabilistic model is well-calibrated when its stated probabilities match observed frequencies (e.g. P(Event)=0.8 predictions should be followed by the event roughly 80% of the time); explicitly distinct from raw predictive Accuracy"
  - concept: "Scientific inference chain"
    definition: "H→M→P→O→E→Assessment(M)→Revision(M) — Hypothesis, Model, Prediction, Observation, resulting Evidence, Model Assessment, and Model Revision as a complete, auditable pipeline"
  - concept: "Model Contract"
    definition: "MC=(InputSchema,OutputSchema,Assumptions,ValidityDomain,Version,EvaluationMethod) — an API-contract-like structure required before a model can be safely reused across contexts"
