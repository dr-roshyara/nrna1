defines:
  - concept: "Unknown≠False∧Unknown≠True"
    definition: "A proposition for which no evidence exists must be represented as the distinct semantic state Unknown, which is neither logically equivalent to False nor to True — explicitly declared fundamental to KnowledgeOS"
  - concept: "Confidence does not transform inference into truth"
    definition: "An AI-generated inference's numeric confidence score (however high, e.g. 0.99) does not by itself elevate that inference to the status of verified fact or authoritative evidence; confidence and evidentiary/authoritative status are orthogonal dimensions"
  - concept: "AgentAutonomy=Authority constrained by Policy"
    definition: "An autonomous agent action is legitimate only when it falls within an explicit, pre-authorized policy scope (Policy→Authority→Action); autonomy is never unlimited permission, and any action outside the pre-authorized policy requires explicit decision/authorization"
  - concept: "Execution success≠Business success"
    definition: "A technical action (e.g. a migration command, a deployment) can complete successfully (Action=Succeeded) while the resulting organizational/business outcome fails (Outcome=Failed); these are distinct states that must not be collapsed into a single success/failure flag"
  - concept: "NameMatch≠SemanticConformance"
    definition: "The mere presence of a code class, table, or module named after a semantic concept (e.g. a class literally called Evidence) proves nothing about whether the system actually implements that concept's required behavior, relationships, and provenance; semantic conformance requires DataModel+BusinessRules+Tests+RuntimeBehavior, not naming alone"
  - concept: "The falsifiability criterion for genuine KnowledgeOS"
    definition: "If the actual implementation contains only Documents+Embeddings+LLM+Search+Agents — without the formal Evidence/Claim/Inference/Decision/Authority/Action/Observation semantic separation and relationships this file specifies — then the system, however good an AI engineering platform it may be, is not yet the KnowledgeOS architecture this corpus designed"
