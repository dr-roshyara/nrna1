  - concept: "First recorded appearance≠Current accepted understanding"
    definition: "A file's timestamp establishes only a chronological-ordering signal among the files in a corpus, never proof of when an idea was actually first conceived by its author -- a later-timestamped file may record an idea genuinely discussed earlier off-record, and an earlier-timestamped file may record a tentative idea later abandoned; a faithful historical reconstruction must track both dimensions (recorded order and inferred conceptual origin) separately rather than conflating them"
  - concept: "'Newer≠automatically correct' (source-evolution evaluation discipline)"
    definition: "When a later-timestamped source in a historical corpus appears to refine, contradict, extend, specialize, generalize, or replace an earlier one, the later position must not be accepted merely because it is more recent -- the actual reasoning behind each position must be evaluated on its own merits before determining which (if either) represents the more defensible current understanding"
