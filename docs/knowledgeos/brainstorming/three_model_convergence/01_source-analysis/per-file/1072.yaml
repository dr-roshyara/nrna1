about: >
  "08 — Decision Register (mandate §9)." Delivers the final, formal governance-register closure of the
  entire N-1 conflict this reconstruction has tracked in extraordinary depth since file 1041.

  **CLASSIFIES N-1 AS N-1A — DISTINCT**, and explicitly rejects each of the four possible alternative
  outcomes with named reasons: N-1B (SAME) rejected on five loci in two notations (`246`, `261.1`, `261.20`,
  `261.25`, `261.19`); N-1C (DERIVABLE COLLAPSE) rejected since `261.21` "self-labels as 'not a completed
  theorem'"; N-1D (GOVERNANCE-CHOICE) rejected for the distinction itself (the corpus already decides that),
  with a residual governance question surviving as the NEW item `N-1′`; and, most importantly, **N-1E
  (CORPUS-CONTRADICTION) is explicitly named as "what Steps 288-289 claimed. WITHDRAWN."** — the formal,
  final closure of the characterization this reconstruction tracked as critical since file 1041.

  **CREATES THE NEW GOVERNANCE RECORD `N-1′`**: "Should `261.21`'s candidate identification `≡_sem:=(∀O∈
  𝒪_K)` be RATIFIED?" with three alternatives (ratify/reject/defer), precise consequences for each, the
  explicit note that ratification is a promotion act research cannot perform ("the candidate is defined over
  an unclosed set, so research cannot even determine what would be ratified"), authority ARB, and **priority
  explicitly marked NOT CRITICAL, downstream of `N-4`.**

  **DELIVERS THE DEFINITIVE, FORMAL REGISTER CORRECTIONS THAT CLOSE THIS RECONSTRUCTION'S LONGEST-TRACKED
  OPEN GOVERNANCE ITEM**: "**`G-67`** ('`≡`/`≈` share one definition while listed as distinct — CRITICAL,
  adjudicate first') 🔴 **WITHDRAWN.** Replaced by `N-1′`: non-critical, downstream of `N-4`, and not
  evaluable yet." Confirms "**`N-1`** (Step 288/289 register) ✅ **PERFORMED — returns `N-1A`.** Closed as a
  research question." And explicitly supersedes the earlier ordering claim: "'`N-1` is the earliest
  legitimate next act' — **SUPERSEDED** — the earliest act is **`N-4`** (`𝒪`/`𝒯`), which now gates `N-1′` as
  well."

  **DELIVERS THE REVISED GOVERNANCE ORDERING**, with `N-4` (`𝒪`/`𝒯`) as the unambiguous single root (no
  incoming derivation edge), gating `N-3`, the newly-demoted `N-1′`, `N-2`'s technical half, `N-11`, and
  `N-16`/`N-17`; with `N-8`, `N-13`, `N-12`, `N-19`, `N-20`, `N-21` independent. Boxed capstone summary: "Net
  effect of Step 290 on the governance surface: ONE CRITICAL ITEM REMOVED, ONE NON-CRITICAL ITEM ADDED, and
  the surface's single root is now unambiguously `N-4`."

  Confirms the STATUS block: ESTABLISHED `N-1A`, the four rejections, `N-1′`'s six fields, the revised
  ordering · WITHDRAWN `G-67` · SUPERSEDED "N-1 first" · NORMATIVE `N-1′` and the 20 carried records ·
  BLOCKED `N-1′` behind `N-4` · DEFERRED all decisions.
