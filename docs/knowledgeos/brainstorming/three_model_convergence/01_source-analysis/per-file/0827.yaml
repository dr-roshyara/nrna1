defines:
  - concept: "Provenance≠Truth (the four types of 'truth')"
    definition: "The arc's most explicit rejection of a single undifferentiated 'truth' concept: Observational truth (Observed(x), what was directly perceived), Historical truth (Recorded(x,t), what the system's lineage shows was recorded at a given time), Epistemic assessment (Supported(H|E), what the current evidence and model justify believing), and Governance truth (AuthorizedDecision(d), what an authorized body has determined) are four genuinely distinct properties that can diverge from one another -- a record can be perfectly auditable (historically true) while containing a claim that is epistemically false, which is not a system contradiction but precisely the distinction the architecture needs to represent honestly"
  - concept: "The Level 1/Level 2/Level 3 epistemic-discipline device"
    definition: "A three-tier distinction the book (and by extension any KnowledgeOS-inspired documentation) must preserve and never collapse: Level 1 is a conceptual principle stated in natural language (e.g. 'do not confuse authority with knowledge'); Level 2 is that principle's formal mathematical model (e.g. Authority(a,d) and Knowledge(a,H,E) as distinct predicates); Level 3 is a verified property established by actual proof or exhaustive checking (e.g. ∀τ∈T: Valid(τ)⇒I(τ)) -- an architecture may legitimately be strong at Level 1 and Level 2 while still lacking Level 3, and the discipline requires never presenting a Level 1 conceptual claim with the rhetorical weight of a Level 3 verified one"
  - concept: "The biggest unresolved issue: competing notions of 'state'"
    definition: "The architecture accumulated through Steps 1-200 uses at least five distinct 'state' concepts (DomainState, ProcessState, EpistemicState, GovernanceState, AuthorityState) without ever having determined their formal relationship -- whether they form one unified Cartesian state space (S=S^D×S^P×S^E×S^G), remain fully separate state spaces, are projections of one canonical underlying state, or are related-but-independently-evolving aggregates connected only through explicit transitions and events -- explicitly flagged as a decision that must be derived from domain analysis rather than guessed, since it will directly determine the DDD aggregate architecture"
