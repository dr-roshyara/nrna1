about: >
  "STEP 290 / N-1 AUDIT. Question: are the corpus's `≡` (semantic) and `≈` (observational) one relation or
  two?" -- a genuinely disciplined, executable script directly targeting the long-tracked N-1 conflict (files
  1041, 1047, 1054-1055, 1057-1062), the first artifact in a new `research/step-290/` package following the
  closure of `step-289/`.

  **Opens with five explicit assumptions printed up front** (mandate §12): only primary corpus text is
  admitted; a self-labelled "candidate" is NOT an assertion of the relation's identity; different symbols
  alone do not prove distinctness, nor does a shared formula alone prove identity; no philosophical source or
  governance preference is used; results are explicitly marked MEASURED vs CORPUS.

  **Transcribes the full primary register (19 entries across seven corpus loci)**, finding only 4 of 19
  entries carry an actual definition, the rest merely NAME a relation.

  **Q1 confirms the corpus EXPLICITLY distinguishes `≡` and `≈`** at five independent loci in two different
  notations, including a NEW corpus reference **"261.20/25," a SEVEN-TUPLE typed family**
  `K=(K,=_str,≡_sem,≈_obs,SameId,≡_H,≡_P)` -- a further, previously-uncited corpus formulation adding a
  seventh named relation family, with explicit warnings "should therefore NOT be collapsed" and "should not
  be conflated."

  **DELIVERS THE DECISIVE, POTENTIALLY RESOLVING FINDING FOR THE N-1 CONFLICT**: confirms the same
  observational formula (`∀O∈𝒪_K: O(K_1)=O(K_2)`) is indeed attached to both `≡_K` (at `261.21`) and `≈` (at
  `261.5`) -- but then performs the decisive check: is this an ASSERTION of identity, or merely a CANDIDATE
  proposal? **BOTH loci that give `≡_K` a definition SELF-LABEL IT AS A CANDIDATE/PROPOSAL, NOT AN ASSERTION**:
  `261.21` explicitly calls it "a candidate formal definition, NOT a completed theorem"; `258.8` calls it "a
  stronger definition IS observational" (a proposal), with a NEW corpus citation **"258.37: we still do not
  have the final `=_X` or `≡_K`."** Concludes: **"The corpus does NOT assert `≡_K`=`≈`. It PROPOSES FILLING
  THE `≡_sem` slot with the observational formula, and marks it UNRATIFIED."** This is a materially important
  clarification of the already-tracked N-1 conflict (files 1041, 1060), suggesting the apparent contradiction
  may not be a genuine internal corpus inconsistency after all, but rather a distinction between an ASSERTED
  distinctness (`≡`≠`≈`) and a merely PROPOSED, EXPLICITLY UNRATIFIED candidate filling for `≡`'s still-
  missing definition -- though this script explicitly defers the final classification to a separate document
  ("REFINED-STEP-290.md," not yet directly encountered).

  **Explicitly tests, and confirms as UNDECIDABLE FROM THE CURRENT CORPUS, whether a distinguishing witness
  can even be constructed** (some `K_1,K_2` with `K_1≡K_2` but not `K_1≈K_2`): "FAIL LOUDLY: required
  definition ABSENT" for both a semantic decision procedure and a closed `𝒪_K` -- "NO HYPOTHETICAL IS
  CONSTRUCTED," honoring the mandate's discipline against inventing examples to force a distinction.

  **Delivers a comprehensive nine-item "required negative checks" self-audit**, explicitly confirming
  nothing was wrongly assumed (names are not evidence for either sameness or distinctness; `≈_X` is not
  assumed to be the corpus's canonical `≈`; a dependency is not treated as a semantic identity; no
  philosophical source or governance preference was used).

  **Carries forward the already-tracked degeneracy finding (file 1057) without re-running it**, confirming 30
  non-degenerate `≈_X` candidates, per the mandate's explicit instruction not to repeat prior audits.

  **Explicitly defers all classification to a separate document**: "VERDICT INPUTS ONLY. Classification is
  made in `REFINED-STEP-290.md`, not here. Nothing above selects a relation, repairs the corpus, or
  recommends a branch."
