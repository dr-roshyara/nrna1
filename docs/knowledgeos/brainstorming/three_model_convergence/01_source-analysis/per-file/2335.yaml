about: >
  Delivers a full fourteen-row crosswalk table, each row explicitly labeled with one of five
  independence categories: REITER-DERIVED, KnowledgeOS-DERIVED, CORROBORATED BY REITER, NEW SYNTHESIS,
  NORMATIVE. This is a finer-grained elaboration of file 2332's already-tracked synthesis, with several
  specific verdicts not previously captured at that level of detail:

  Situation (a history) → History_t, EXPLICITLY NOT A_t -- DERIVED, KnowledgeOS-DERIVED (corroborated).
  State projection → A_t (POST-R1, FORMERLY K_t) -- DERIVED, KnowledgeOS-DERIVED. This confirms A_t as
  the corpus's current name for what earlier material called K_t, following the already-tracked R1
  finding (KnowledgeOS's object is an attribution, not a state carrying Knows).

  do(a,s) → δ(A_t,e_t)→A_{t+1} -- BOUNDED (see 04). Fluent → a requirement's evaluation or a component of
  A_t -- OPEN, "the corpus has no fluent notion."

  Poss(a,s) → EXPLICITLY DISTINGUISHED FROM Qualify: "a precondition gate -- not Qualify" -- REFUTED as a
  candidate for Qualify; SUPPORTED as a precondition gate in its own right, REITER-DERIVED. This is a
  precise negative result not previously this explicit in this reconstruction's already-tracked material:
  the already-tracked "G1"/Qualify problem (files 2292, 2298, 2306+) cannot be solved by importing Poss.

  SSA → candidate shape for δ -- BOUNDED (presupposes causal completeness), consistent with file 2332's
  already-tracked disqualification. Regression → verification mechanism -- SUPPORTED. Progression →
  forward state update -- SUPPORTED but insufficient alone (P10). Basic action theory → OPEN, KnowledgeOS
  has none. Golog/RGolog → workflow model, OPEN, unreachable until δ is settled.

  Reiter's Knows → struck through (~~Knows~~) -- REFUTED, with the explicit gloss "R1 made KnowledgeOS's
  object an attribution" -- labeled NORMATIVE (governance), the only row given that label, signaling this
  is a settled architectural/governance position rather than a mathematical result.

  Sensing → Observation -- OPEN (see 07).

  Unique names axiom → candidate for ≡_sem -- REFUTED: "syntactic ≠ semantic," KnowledgeOS-DERIVED. This
  is a precise, previously-uncaptured negative result: Reiter's unique-names axiom (a purely syntactic
  identity condition) cannot serve as the corpus's semantic-equality relation ≡_sem, directly relevant to
  this reconstruction's already-tracked four-relation equality apparatus (=,≡,≈_X,≅_λ).

  Second-order induction → inherited limitation: not fully first-order decidable -- REITER-DERIVED,
  confirming any transfer of Reiter's machinery inherits this decidability limitation.
