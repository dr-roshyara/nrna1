about: >
  "09 — Normative Decision Register (mandate §14)," explicitly binding: "NOTHING below is recommended,
  preferred, or ranked by desirability."

  **Delivers the final, definitive twenty-one-item decision register (N-1 through N-21)**, superseding file
  1047's earlier twenty-item version, with a materially richer six-field format per record (decision
  question, alternatives, consequences, evidence available, evidence unavailable, "why research cannot decide
  it," authority). Confirms and completes every already-tracked open decision (N-1 the `≡`/`≈` conflict; N-2
  Decision 3; N-3 the observation set; N-4 the operation/transformation set; N-5 the axis-subset choice, now
  explicitly "30" not "32" per the already-tracked degeneracy finding; N-6 through N-21 covering provenance
  relevance, transitivity, identity context, invariant ratification, decision codomains, per-operation
  bindings, deduplication criteria, canonicalization, the `id`/mutable-state conflict, identity-scheme
  ratification, `Continuity`'s kernel status, the `G_I`-graph question, `Merge`'s algebraic laws, the
  decision-theoretic loss asymmetry, register ownership, and the "287" identifier collision).

  **DELIVERS A GENUINELY RIGOROUS, GRAPH-DERIVED "FORCED ORDERING," EXPLICITLY DISTINGUISHED FROM PRIOR
  INFORMAL PRIORITY OBSERVATIONS**: "from the graph, not from preference" -- confirms **N-1, N-4, N-8, N-13
  are each INDEPENDENT PREREQUISITES** to large downstream sets (N-1 prerequisite to every `≡`-dependent
  record; N-4 prerequisite to N-3, N-11, N-16, N-17, and N-2's technical half; N-8 unbinds `I_48`; N-13
  unbinds `=`), while N-2(technical), N-3, N-5, N-11, N-16, N-17 are explicitly ORDERED to follow N-4. This
  formalizes, with the same rigor as the already-tracked minimal-cut computation (files 1049-1055), which
  decisions can be taken in any order versus which are strictly gated.

  **Consolidates the already-tracked withheld-from-governance list** (file 1059) into its final form:
  congruence, `N-18` merge laws, `N-14`'s selection (authorize only, not select), `N-5`'s two degenerate
  endpoints, and `≡`'s total Boolean procedure (undecidable by anyone) -- five items explicitly marked as not
  belonging on the governance decision surface at all.

  This is the capstone, final governance artifact for the entire multi-file equality/identity/kernel research
  programme this reconstruction has tracked in extraordinary depth across files 0989-1061 (the D285-x
  hypothesis-testing arc, the equality-investigation arc, the step-288 register/decision-register package,
  and now the step-289 dependency-graph/bootstrap-cut package) -- delivering, in one final table, every open
  decision, its evidentiary basis, and the rigorously-derived order in which the twenty-one items must or may
  be addressed.
