about: >
  `[EXT]` throughout, "extracted, not endorsed." Delivers the exact formal axiom notation underlying
  Reiter's situation calculus, already substantively summarized in this reconstruction's already-tracked
  file 2332: ontology table (Situation=finite action sequence/history not state; S_0=initial situation;
  do(a,s)=successor situation; Fluent=situation-varying predicate/function; Poss(a,s)=possibility gate,
  not an effect); the four foundational axioms verbatim -- unique names (do(a_1,s_1)=do(a_2,s_2)⊃a_1=a_2
  ∧s_1=s_2), induction (explicitly flagged SECOND-ORDER: (∀P).P(S_0)∧(∀a,s)[P(s)⊃P(do(a,s))]⊃(∀s)P(s)),
  subhistory (¬s⊏S_0; s⊏do(a,s')≡s⊑s'), executable(s) (∀a,s*.do(a,s*)⊑s⊃Poss(a,s*)) -- "the system is
  not fully first-order decidable. Any transfer inherits this"; the successor-state axiom exact formula
  F(do(a,s))≡γ⁺_F(a,s)∨(F(s)∧¬γ⁻_F(a,s)), explicitly resting on "the causal completeness assumption:
  the given effect axioms enumerate all the ways a fluent can change -- an assumption about the
  axiomatiser's knowledge, not a theorem"; regression R[φ] and the regression theorem (a regressable
  query holds iff its regression holds in the initial theory); and a closing list of the machinery above
  basic action theories (Golog's Do macro, RGolog interrupts, sequential/concurrent/natural-action
  situation calculus, sensing/knowledge via accessibility).
