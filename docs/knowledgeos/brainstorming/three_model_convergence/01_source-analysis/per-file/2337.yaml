about: >
  Delivers the detailed audit behind file 2332's already-tracked "decisive limit" on the successor-state
  axiom (SSA) as a δ candidate.

  **DELIVERS THE FOUR-PROPERTY VERIFICATION TABLE (A2)**: deterministic ✔; persistence (a fluent no
  effect axiom mentions is unchanged) ✔; regression≡progression ✔ 12/12 checks (A3); Poss gates non-
  executable histories ✔ (A4). "The machinery works. That is not the question."

  **DELIVERS THE PRECISE MEASUREMENT OF THE COLLAPSE**: "[NEG] when γ⁺ and γ⁻ both name F, the SSA
  yields F=TRUE with no signal that the effect axioms were inconsistent. Measured: from F false AND from
  F true, the conflicting action yields {F} in both cases." The frame solution presupposes consistent
  effect axioms and cannot detect their inconsistency; the causal-completeness assumption is "about the
  axiomatiser's knowledge, not a theorem."

  **NAMES THE EXACT PRIOR-CORPUS COLLISION THIS MAPS ONTO**: "a transition function that resolves γ⁺∧γ⁻
  silently in favour of γ⁺ is the same failure mode the programme has spent four experiments
  eliminating. It is Candidate C of KR-CONTR-EVAL, relocated into the transition" -- a bridge candidate
  directly identifying the already-tracked-elsewhere KR-CONTR-EVAL experiment's own rejected
  "Candidate C" as structurally identical to the SSA's failure mode.

  **DELIVERS THE PRECISE CONDITIONAL RESTATEMENT**: "P3 is therefore REFUTED, and the correct statement
  is conditional: [PROP] the SSA is an available shape for δ IF AND ONLY IF contradiction is detected
  and handled BEFORE the transition -- i.e. Contr must be defined first, and the composition/frame
  questions (DECISION-02) settled first. δ cannot be resolved ahead of them." This sharpens file 2332's
  looser "δ cannot be settled before Contr" into an exact biconditional with two named preconditions
  (Contr AND DECISION-02).

  **DELIVERS A FIVE-ITEM TABLE OF WHAT δ MUST HANDLE THAT THE SSA DOES NOT ADDRESS**: contradictory
  effects (silently collapsed); provenance of the effect (absent from the construct); the evaluation
  frame φ (absent); boundary/reason for a fluent having no value (absent -- "Reiter's fluents are
  two-valued," directly relevant to this reconstruction's already-tracked many-valued Zero/discrimination-
  result vocabularies throughout the Gītā thread); non-evidential invariance (DECISION-01, untested
  against the SSA, OPEN).
