defines:
  - concept: "Memory≠Authority"
    definition: "An AI agent's own memory of having previously held a role or authority (e.g. 'I was the Architecture Reviewer yesterday') does not itself confer that authority in the present; authority must be re-resolved from the governed runtime at each operating cycle, never assumed from persisted agent memory"
  - concept: "Semantic similarity≠Epistemic authority (retrieval ranking is not epistemic ranking)"
    definition: "A higher vector-similarity score for a retrieved document relative to a query does not establish that the document is more authoritative or more true than a lower-scoring one; similarity measures retrieval relevance to a query, never epistemic status, and must never be silently treated as a proxy for authority or truth in a RAG-based system"
  - concept: "The Candidate Determination pattern"
    definition: "AI reasoning over evidence and knowledge produces a Candidate Determination, never a final one -- the word 'candidate' marks that the output must reference its claim, evidence, rule, method and context, and must pass through deterministic assurance or human review before becoming an actual Determination"
  - concept: "'No silent transitions' constitutional principle"
    definition: "Five specific transitions in the operating lifecycle (Claim→Determination, Determination→Decision, Decision→Authorization, Authorization→Action, Action→Verified Effect) must always be explicit, recorded steps; the system must never let one silently collapse into or be inferred from the next"
  - concept: "The LLM semantic-collapse-chain warning"
    definition: "A language model's natural tendency to collapse four distinct epistemic/governance steps into one: 'I found something' (observation) silently becomes 'it is true' (truth claim), which silently becomes 'we should do it' (decision), which silently becomes 'I did it' (unauthorized action) -- KnowledgeOS's entire staged pipeline exists structurally to prevent exactly this chain of collapses"
  - concept: "Audit log versus epistemic trace"
    definition: "A conventional audit log records only what happened (e.g. a timestamped API call); an epistemic trace additionally reconstructs the full chain of actor, intent, inquiry, context, evidence, determination, decision and authorization that made the action legitimate -- explaining why the action was justified, not merely that it occurred"
