title: "Step 156 -- KnowledgeOS Operating Model (REVISION, MAJOR SYNTHESIS MILESTONE): a Complete Rewrite of 0744 That Silently Supersedes It by Building Entirely on 0745's Epistemic Kernel -- Delivers 'KnowledgeOS Is an Operating System, Not a Knowledge Database,' Actor=(Identity,Role,Authority,Scope), Memory≠Authority, 'RAG Is Therefore Not the Architecture,' 'Retrieval Ranking Is Not Epistemic Ranking' (Semantic Similarity≠Epistemic Authority), the Candidate-Determination Pattern, the Fifteen-Stage Master Operating-Model Diagram, the Five Control Planes, a Concrete Eleven-Row Agent Authority Matrix, 'The Human-in-the-Loop Formulation Is Too Weak,' the Sharpest Single AI-Hallucination-Chain Warning in the Reconstruction ('I Found Something'→'It Is True'→'We Should Do It'→'I Did It'), a Twelve-Category Failure Taxonomy, and the Three-Lifecycle Decomposition (Epistemic+Governance+Execution) -- Never Explicitly Cross-References or Retracts 0744's Now-Superseded L0-L5 Ladder -- Closes by Opening Step 157, KnowledgeOS Domain Model & Bounded Context Validation"
