  - concept: "Explicit HPA ruling that the two-level scaffold (brainstorming/ vs brainstorming/kernel/) must have DIFFERENT functions per level rather than mirrored trees, since mirroring created ambiguity about which to use -- a table assigning distinct roles: classification/ is corpus-wide-coordination at root vs ACTIVE-census-and-dependency-map at kernel level; corpus/ is inert-by-decision at both levels; synthesis/ is not-the-working-location at root vs RESERVED-Phase-D/E-not-started at kernel level; falsification/ is not-the-working-location at root vs RESERVED-Phase-G-not-started at kernel level -- explicit warning: 'an empty directory is not evidence that its phase has run'"
