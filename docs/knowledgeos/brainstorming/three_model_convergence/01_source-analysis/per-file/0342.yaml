  - concept: "Four-dimension classification scheme applied to all 158 documents: A-Subject (KB/ID/ES/ADM/EV/KS/EP/ST/LM/GP/EX/AR -- eleven categories); B-Altitude (PH/CM/DM/BC/AG/VO/INV/CAP/BD/PT/MECH/IMP -- twelve levels from philosophy to implementation); C-Epistemic role (O/Q/H/A/CM!/CX/F/D/R/AN/AP/SRC/DUP); D-Kernel relevance (K0 irrelevant/K1 contextual/K2 potentially relevant/K3 direct Kernel evidence/K4 Kernel-adversarial)"
  - concept: "Explicit methodological self-limitation: classification is based on each document's opening 12-18 non-blank lines plus slug plus an objective concept-density matrix (identity/epistemic-state/admission/justification/evidence/aggregate-boundary/invariant/port/falsification token counts) -- NOT a full read; Subject and Altitude are high-confidence, Epistemic-role and K-level are explicitly PRELIMINARY, flagged rows expected to be corrected by Phase D"
