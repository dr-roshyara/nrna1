  - concept: "Explicit scope statement of what Phase A deliberately did NOT do: no merit ranking, no synthesis, no contradiction resolution, no promotion of any hypothesis, no Zero pass, nothing written to KnowledgeOS law -- T-1..T-7 'registered, not adjudicated'"
