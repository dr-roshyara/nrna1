defines:
  - concept: "The four independent governance relations Cap/Perm/Auth/Resp"
    definition: "Capability Cap(a,x) asks only whether actor a can technically perform operation x. Permission Perm(a,x,c,t) asks whether a is technically/procedurally permitted to execute x in context c at time t (an access-control question). Authority Auth(a,d,c,t) asks whether a possesses legitimate domain/governance authority to make determination d in context c at time t (a governance-legitimacy question). Responsibility Resp(a,d,c,t) asks who is accountable for d. None of these four relations can be inferred from any other -- the common architectural error of assuming a linear implication chain (technical capability implying permission implying authority implying responsibility) is explicitly false and must be avoided by modeling all four as independent relations"
  - concept: "'The Kernel is not the sovereign' / the constitutional separation of powers"
    definition: "The KnowledgeOS Kernel's proper role is strictly to enforce declared, externally-sourced rules -- it enforces authority claims but does not originate authority; it preserves epistemic status but does not originate truth; it preserves decisions but does not originate organizational decisions. Formally, the sources of truth, authority, and governance are all explicitly distinct from the Kernel itself (Source_Truth≠Kernel, Source_Authority≠Kernel, Source_Governance≠Kernel); the Kernel is instead an EnforcementBoundary that checks whether a proposed transition satisfies its declared constitutional contract (via the deterministic admission function Adm(r,a,K)), never itself deciding what that contract should require or whether an underlying determination is wise or correct"
  - concept: "Authority as provenance-bearing"
    definition: "Just as an organizationally established knowledge claim requires provenance to be epistemically complete, an authority claim likewise requires its own basis to be complete: AuthorityClaim=(Actor,Scope,Rule,Validity,Provenance) -- an assertion that 'A can approve X' is epistemically incomplete without knowing WHY (which rule, delegation, or appointment grants that authority, and within what validity period and scope), extending the arc's provenance discipline from the epistemic domain into the governance domain for the first time as an explicit, named requirement"
