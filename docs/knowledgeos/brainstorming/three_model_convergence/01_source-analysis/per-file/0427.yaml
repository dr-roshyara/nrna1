  - concept: "Observation-without-physical-presence: an observer/source can supply observation on behalf of a Knower who is not physically present at the observed state (Sanjaya observing for Dhrtarastra), yielding Observed-reality->Observation-capability->Observer/source->Information->Knower"
  - concept: "Krishna-Lens-derived active repositioning principle: an agent can and should deliberately change its observation position before deciding, rather than deciding from a fixed vantage (Decision<-Observation<-Positioning)"
  - concept: "'More information does not imply more decision certainty' -- Arjuna's knowledge strictly increases while his decision certainty strictly decreases, because new dimensions change the interpretation of already-known entities rather than merely adding independent facts; explicit architectural warning that KnowledgeOS must never equate information volume with decision quality"
  - concept: "The ideal state is NOT necessarily frozen: the Knower's own understanding of the ideal state can be revised by observation, formalized as Observation->Knowledge->Understanding->IdealState_{t+1} -- a significant extension of the corpus's previously-static S*_t treatment"
  - concept: "Uncertainty-about-Decision != Uncertainty-about-Observation: an agent can be highly certain about an observed fact while being deeply uncertain about the resulting decision, motivating separate epistemic dimensions Knowledge-about-State vs Knowledge-about-Decision"
  - concept: "Explicit chapter-by-chapter falsification-testing research programme: candidate principles derived from Chapter 1 are to be explicitly tested against later chapters for survival, refinement, or contradiction"
