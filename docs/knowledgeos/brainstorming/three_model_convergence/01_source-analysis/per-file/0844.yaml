defines:
  - concept: "The three-label Gita-relationship taxonomy (P1/P2/P3)"
    definition: "A mandatory classification for every philosophical connection drawn between a Gita chapter and a technical/architectural concept, preventing both underuse and overuse of the philosophical material: P1 Historical influence means genuine evidence exists that the philosophical reflection actually influenced the engineering reasoning at the time (a strong historical claim requiring supporting evidence); P2 Conceptual correspondence means the technical and philosophical concepts independently exhibit a meaningful structural similarity without either having caused the other; P3 Retrospective interpretation means the connection was only noticed after the technical concept already existed, which is explicitly legitimate and does not diminish the connection's interest -- these three labels must never be conflated, since presenting a P3 retrospective connection as though it were P1 historical influence would misrepresent the actual intellectual history"
  - concept: "The five-layer epistemic pipeline and its non-reversal rule"
    definition: "Reconstruction work should pass through five explicit layers -- Source (S, what was actually written/generated/coded/observed), Evidence (E(S), what the source establishes), Interpretation (I(E), what meaning can reasonably be derived), Architecture (A(I), what architectural principle follows), and Synthesis (T(A), how this contributes to the overall theory) -- and later layers must never be used to retroactively rewrite earlier ones: a later theory T must not rewrite an earlier source S (T↛S), and an architectural claim A must not be treated as though it were itself evidence E, except when explicitly performing a labeled verification pass (Architecture→Evidence, asking whether the evidence actually supports a claim, as opposed to Discovery's Evidence→Architecture, asking what architecture the evidence produced)"
