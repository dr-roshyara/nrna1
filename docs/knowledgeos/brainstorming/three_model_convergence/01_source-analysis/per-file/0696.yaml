defines:
  - concept: "ObservedBehavior>ComponentName"
    definition: "A component's actual responsibility must be determined from its observed commands, queries, data mutations, and dependencies, never from its name or documentation claims alone — a component named 'KnowledgeManager' that actually performs Git reading, Markdown parsing, and embedding generation is an ingestion/indexing component, regardless of its name"
  - concept: "Semantic collision vs. Semantic duplication"
    definition: "Semantic collision (SameTerm→DifferentMeaning) is when one term (e.g. 'Knowledge') carries incompatible meanings across different modules; Semantic duplication (DifferentTerms→SameMeaning) is the reverse — different terms (Evidence, Artifact, SourceRecord) that actually denote the same underlying concept, potentially indicating accidental architectural duplication"
  - concept: "The three-outcome architectural diagnostic (Coherent/Fragmented/Monolithic)"
    definition: "Given a reconstructed component inventory, the relationship between components and intended architectural boundaries falls into one of three broad patterns: Coherent (components approximately align with architectural boundaries), Fragmented (one concept is implemented across many overlapping components), or Monolithic (many distinct concepts are implemented within one large component) — each implying a materially different architectural conclusion and remediation path"
