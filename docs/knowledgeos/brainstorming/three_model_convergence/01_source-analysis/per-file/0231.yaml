about: >
  A parallel/companion extraction from the same Elements of Statistical Learning source as 0228, applying
  Zero + Leonardo + DDD explicitly (rather than 0228's fact/interpretation split). Substantially overlaps
  0228's content (cross-validation leakage, regularization, bootstrap, ensembles, clustering, FDR) but
  organizes it differently: six conceptual subdomains, a Zero-gate sequence G0-G9, and a 17-item EP-00..16
  technique catalogue -- a DIFFERENT numbering/organization scheme from 0228's twelve KOS-ML invariants,
  not cross-referenced to it. Explicitly labeled "Book Extraction Round 1," with a stricter Adopt/Adapt/
  Research/Reject pass proposed as the next step.
introduces:
  - concept: "Six conceptual subdomains reorganizing the book's methods: Representation (feature/kernel/basis/latent), Inference (model/estimator/loss/parameter), Model Control (regularization/shrinkage/sparsity/pruning), Assessment (CV/bootstrap/bias/variance/optimism), Aggregation (bagging/boosting/stacking), Structure Discovery (clustering/PCA/graphical-models/PageRank/association-rules)"
  - concept: "InferenceProblem domain object (question/target/observations/representation/objective/loss/constraints/evaluation-protocol) and Zero Principle Z-SL-01: an inference problem must be constituted before a method can be selected"
  - concept: "Representation Principle: a representation is a deliberate transformation of observations for a defined inference purpose; it must not silently become the observation itself (Observation != Representation, worked example: 'architecture review rejected' admits radically different representations)"
  - concept: "DecisionObjective concept: a model is not intrinsically good, only good relative to a stated objective (accuracy vs. minimize-false-negatives vs. minimize-catastrophic-mistakes vs. interpretability-subject-to-error) -- model selection is subordinate to the decision objective"
  - concept: "One-standard-error rule reframed as an engineering principle: choose the simplest strategy statistically indistinguishable from the best-measured one, not the absolute best-measured configuration (worked example: 17-step strategy at 97.1% vs. 5-step strategy at 96.8%, within an accepted uncertainty band)"
  - concept: "Inference Flexibility Ladder (deterministic rule -> linear/additive -> structured nonlinear -> ensemble -> fully flexible/LLM), giving a controlled-increase-in-flexibility vocabulary rather than a binary rules-vs-LLM choice"
  - concept: "Decision Margin (from SVM): distance from a decision boundary, not merely which side -- strongly-admissible vs. strongly-inadmissible vs. borderline ACCEPT should not be treated identically"
  - concept: "DerivedStructure vs. Canonical Knowledge boundary: a Cluster/embedding/PCA-projection is DerivedStructure (= Representation+Method+Parameters+EvidenceSnapshot with provenance), never allowed to silently overwrite canonical Observation/Evidence/Decision -- an explicit anti-corruption boundary"
  - concept: "Zero-gate sequence G0-G9 (Problem Constitution / Target Definition / Representation Adequacy / Objective-Loss Definition / Evidence Sufficiency / Method Applicability / Complexity Control / Independent Assessment / Stability Assessment / Governance Admissibility)"
  - concept: "MethodSelector domain service: takes InferenceProblem+Representation+Loss+Constraints+EvidenceProfile+AssuranceRequirement+CostBudget, returns CandidateMethods+Rationale+ExpectedTradeoffs -- never a bare model name"
  - concept: "Seventeen-item EP-00..16 technique catalogue (EP-00 Method Is Not Authority as the meta-principle, plus Problem Constitution/Representation Analysis/Loss-Based Selection/Complexity Regularization/Sparse Evidence Selection/Bias-Variance Analysis/Independent Assessment/Bootstrap Stability/Ensemble Stability/Residual-Driven Refinement/Decision Margin/Hierarchical Discovery/Graph Centrality/Latent-Factor Discovery/Dimensional Compression/Multiple-Discovery Control)"
  - concept: "Epistemic hierarchy that must not collapse: Observation -> Representation -> Pattern -> Inference -> Prediction -> Decision -> Knowledge Claim, each transition governed by distinct epistemic rules (embedding != observation, cluster != domain, prediction != fact, high-confidence-inference != validated-knowledge, model-agreement != truth)"
  - concept: "PageRank reframed for KnowledgeOS: evidence/claim/decision centrality as structural importance, explicitly centrality != truth"
  - concept: "InferenceEvidence role lifecycle: Source Evidence -> Training Evidence -> Selection Evidence -> Validation Evidence -> Test Evidence as distinct roles requiring explicit representation, not one undifferentiated 'data' pool"
  - concept: "Boosting's residual-driven refinement pattern bounded by an explicit stop condition (iteration budget/evidence budget/loss threshold/assurance threshold), explicitly warned against becoming uncontrolled agent self-revision ('agent keeps reasoning until it likes the answer')"
