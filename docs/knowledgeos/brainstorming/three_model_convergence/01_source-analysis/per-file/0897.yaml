defines:
  - concept: "The Policy congruence criterion"
    definition: "Directly analogous to the state congruence criterion F∘T̂=T∘F used to resolve K's minimality: two policies π_1,π_2 are congruent, G(π_1)=G(π_2), only if this implies ∀o,K:T(K,o,π_1,α)=T(K,o,π_2,α) (they produce identical transformation outcomes for every operation and state) AND Assess(x,π_1)=Assess(x,π_2) for every assessable object x (they produce identical assessment outcomes). If two policies are indistinguishable under every mandatory KnowledgeOS operation, they may be treated as belonging to the same semantic equivalence class -- giving a principled route to a minimal Policy semantics (Minimality(Π|𝒪_π), relative to the operation set 𝒪_π={T, Assessment, Validation, Authorization-related operations}) without prematurely committing to a specific policy representation or language"
  - concept: "CB-5/CB-6 non-independence: Policy→Assessment→Σ"
    definition: "A sequencing finding that the theory's two remaining apparent blockers -- CB-5 (finalizing the epistemic-status space Σ) and CB-6 (defining Policy semantics) -- cannot be resolved independently or in either order, because Assessment (the function that produces Σ from a Proposition/Evidence/Context/Policy tuple) is demonstrably policy-sensitive: the same assertion and evidence can yield different Σ values under different policies. This forces a strict resolution order: Policy semantics must be established first (to the minimum extent needed to make Assessment well-defined and computable), only then can Assessment itself be closed, and only then can Σ be canonicalized -- attempting to finalize Σ or Assessment before Policy semantics exist would risk basing the canonicalization on an unstable or incomplete dependency"
