defines:
  - concept: "The KnowledgeOS Ledger"
    definition: "The complete set of authoritative state transitions, evidence references, domain events, and provenance relationships necessary to reconstruct governed engineering activity -- a semantic audit concept, not necessarily a single physical database, with the Assurance Graph understood as one derived projection over this underlying ledger rather than the ledger itself"
  - concept: "'Evidence does not have to be blockchain'"
    definition: "A cryptographic content hash (ContentHash=H(payload)) combined with controlled, governed provenance metadata provides sufficient evidence-integrity guarantees for KnowledgeOS's purposes without requiring distributed-ledger/blockchain infrastructure -- the integrity requirement and the blockchain-technology requirement are not the same thing"
  - concept: "ContextFingerprint"
    definition: "A hash derived from the exact set of governed inputs used to construct a given ContextPackage (relevant knowledge versions, applicable rules, governance state, evidence, scope, and time), enabling later verification that a specific context is reproducible from, and traceable to, those exact inputs"
