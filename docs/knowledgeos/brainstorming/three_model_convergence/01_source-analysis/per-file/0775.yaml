defines:
  - concept: "The five-step philosophical interpretation method"
    definition: "A disciplined procedure for extracting architecturally-relevant content from a philosophical source text without collapsing analogy into architecture: (1) extract the underlying philosophical principle, stripped of names/mythology/narrative specifics; (2) generalize it, removing theological context while preserving the core idea; (3) compare it against the existing architecture to see whether a mechanism expressing it already exists; (4) stress-test that existing mechanism against the principle's actual demands; (5) classify the outcome as CONVERGENT, REFINING, NEW HYPOTHESIS, NOT APPLICABLE, or CONTRASTING -- never skipping directly from source text to formal architecture"
  - concept: "'Wisdom prevents blind execution'"
    definition: "A knowledge-bearing system must never move directly from available information to executed action without an intervening discriminative stage that distinguishes what is merely possible from what is actually appropriate -- providing an independent philosophical rationale (derived from, but not proven by, the Gita's wisdom/action-discrimination theme) for keeping evidence, determination, decision, authorization, and execution as non-collapsible, distinct stages"
