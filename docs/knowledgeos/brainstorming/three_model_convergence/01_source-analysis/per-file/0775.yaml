    refinement: "Sharpened into a precise single-sentence formulation ('wisdom is an ongoing capacity for discrimination that guides the selection of appropriate action') and explicitly connected to the existing architecture's middle stages (between knowledge collection and decision), rather than proposed as a new standalone component"
  - concept: "0773's/0774's disciplined Gita-Chapter-4 governance-disposition thread and its five-category external-material triage schema"
    refinement: "Given a formal, general-purpose, directly reusable five-step procedure with a distinct five-category outcome taxonomy (CONVERGENT/REFINING/NEW HYPOTHESIS/NOT APPLICABLE/CONTRASTING) -- more precise and more general than the material-classification schema in 0773, applicable to any future philosophical-source interpretation task, not only this specific DeepSeek document"
  - concept: "The corpus's unresolved OQ-4 (action/execution semantics)"
    refinement: "Given a candidate formalization, ActionMeaning=f(K_t,Purpose,Intention,Authorization,Context), explicitly offered as a research hypothesis worth testing against OQ-4, not a resolution of it"
