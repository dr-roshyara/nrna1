about: >
  Tests Reiter's basic-action-theory registry shape against the already-tracked Step 291 operation-
  registry audit (already-tracked-elsewhere in this reconstruction's earlier-project material, referenced
  extensively throughout files 2298-2321 of this window's Gītā thread).

  **DELIVERS WHAT REITER SUPPORTS**: "[EXT] a basic action theory is exactly a registry: for each action,
  a precondition axiom (Poss) and effect axioms (γ⁺,γ⁻), plus unique names and S_0. A4 verifies that Poss
  functions as a gate: a non-executable history is rejected at its first violating prefix, not repaired."
  "[EXP] the shape (name, precondition, positive effects, negative effects) is formally supported. This
  is the most directly transferable structure in the source."

  **DELIVERS THE PRECISE STEP-291 REGISTRY FRACTIONS, BLOCKING ADOPTION**: "Step 291 already audited the
  operation registry independently, and its verdict stands: membership, signatures (8/22), bodies
  (0/22), identity (0/22) and ratification (0/22) are all OPEN. Reiter supplies the SHAPE of a registry
  entry. Step 291 established that KnowledgeOS does not yet know its MEMBERSHIP, its signatures, or its
  bodies. A shape without members is not a registry. [NEG] Reiter does not close step 291's gaps, and
  must not be cited as closing them." This is the most precise numeric quantification of Step 291's
  operation-registry state this reconstruction has yet encountered (8 of 22 candidate operations have a
  signature; 0 of 22 have a body, an identity treatment, or ratification).

  **DELIVERS A FIVE-ITEM INSIDE-VS-OUTSIDE-THE-TRANSITION PLACEMENT TABLE**, explicitly on corpus
  evidence, not on Reiter: Authority -- OUTSIDE (R1 put verification outside; governance acts are not
  state transitions); Provenance -- INSIDE the state, OUTSIDE the transition rule (must survive the
  transition per KR-CONTR-EVAL's indispensable boundary component, but does not gate it); Identity/
  Equality -- UNRESOLVED, cannot be placed (≡_sem is OPEN; placing it now would decide it by
  implication); Observation -- UNRESOLVED (OPEN in v1.2, see 07); Qualification -- UNRESOLVED (P4
  refuted the Poss identification -- confirming this reconstruction's already-tracked file 2335 Poss≠
  Qualify finding via a distinct experiment label, P4). "Four of six cannot be placed. Recording that is
  the result; guessing would be the error."
