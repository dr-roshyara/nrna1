about: >
  Directly executes 0556's closing "Step 15 -- Decision Theory, Value of Information, Action Selection, and
  Sārathi," opening with the point at which "the three-lens architecture becomes mathematically
  operational": Zero identifies discrepancy, Lord generates candidate remedies, and Sārathi "must now
  determine what should happen next." Delivers the file's crucial corrective principle: `Best action ≠
  action that merely reduces discrepancy most`, since a real action carries cost, risk, reversibility,
  authority requirements, information value, and downstream consequences.

  **Reconfirms `Knowledge≠Action` and `Recommendation≠Execution`**, worked through the distinction between
  "changing the firewall rule is likely to solve the discrepancy" and "change the firewall rule" -- an
  explicit governance boundary separating the two. **Formalizes Action as a structured domain object**
  `a=(Intent,Preconditions,Effects,Cost,Risk,Reversibility,Authority,EvidenceRequirements,Context)`, with
  preconditions evaluated against `K_t` (`Executable(a)=False` if a critical precondition is unknown,
  unless governance explicitly permits proceeding), and effects modeled as a possibly-uncertain state
  transition `Transition_a(X_t)->X_{t+1}`.

  **Delivers standard expected-utility reasoning** `EU(a)=Σ_i P(o_i|a,K_t)U(o_i)`, then delivers the
  file's foundational insight that information itself has decision value: an action like inspecting
  firewall logs may have zero direct operational effect yet substantially reduce uncertainty.
  **Rigorously formalizes the Expected Value of Sample Information**,
  `EVSI(q)=𝔼_r[max_a EU(a|K_{t+1}(r))] - max_a EU(a|K_t)`, and delivers a simpler KnowledgeOS-level
  approximation, `VOI(q)=ExpectedDecisionImprovement(q)-Cost(q)`, with a candidate-investigation ranking
  rule `q*=argmax_q VOI(q)` subject to `Risk(q)≤RiskLimit`.

  **Redefines Lord's role with full mathematical precision**: `Lord:(K_t,I_t,Δ_t)->𝒜_t`, "generate
  candidate actions and investigations that have high expected value for reducing relevant uncertainty,
  discrepancy, or decision risk," with each candidate annotated by ExpectedBenefit, Cost, Risk, VOI, and
  Reversibility. **Formalizes Sārathi as a genuine decision function**,
  `Sārathi:(K_t,I_t,Δ_t,𝒜_t,ρ)->Decision`, with a six-value decision vocabulary
  `Decision∈{Execute,Investigate,Defer,Reject,Escalate,RequestApproval}`. **Delivers a crucial authority
  boundary**: even when KnowledgeOS concludes a production firewall change is the best action, if its
  authority belongs to the Architecture Board, Sārathi must output `RequestApproval(a)`, never
  `Execute(a)` -- `Decision capability≠Execution authority`.

  **Formalizes decision feasibility** `Feasible(a,K_t,ρ)=Preconditions∧Authority∧Constraints∧Safety`,
  restricting the decision set to `𝒜^{feasible}⊆𝒜`, and a constrained optimization formulation
  `a*=argmax_{a∈𝒜^{feasible}} EU(a)` subject to risk and cost ceilings. **Delivers the file's key
  theoretical caution**: there is no universal utility function -- `UtilityFunction is policy/purpose
  dependent` (cost may dominate for one organization, safety for another, time-to-recovery during an
  incident), "following the same principle established for thresholds." **Delivers multi-objective decision
  making** over a named objective set (Cost, Risk, Time, Quality, Compliance, Security, Availability),
  represented as a vector utility with a policy-defined aggregation function.

  **Delivers the file's central methodological recommendation for genuinely irreducible tradeoffs --
  Pareto optimality**: rather than forcing a single scalar utility, Sārathi can compute the Pareto frontier
  `𝒫={a | ∄b:b≻a}` and present the resulting non-dominated candidates to a human decision-maker, "often
  better than pretending the system knows the organization's exact utility weights." Worked through a
  concrete five-action comparison table (inspect logs, ask owner, run test, change firewall, do nothing)
  showing that neither a naive cost-minimizer (choosing "do nothing") nor a naive discrepancy-eliminator
  (choosing "change firewall") captures the genuinely preferable choice -- inspecting logs, which has high
  information value at low risk -- "precisely what we want Sārathi to capture."

  **Introduces the classical exploration-versus-exploitation distinction** into KnowledgeOS's decision
  model, and formalizes sequential decision making explicitly (`a_2=f(K_{t+1})`, not one-shot
  optimization), with a state-action-transition model `(K_t,a_t,o_t)->K_{t+1}=Update(K_t,a_t,o_t)`
  connecting action directly back into the epistemic loop. Delivers "the complete Sārathi loop" diagram
  spanning Current Knowledge -> Zero -> Discrepancy -> Lord -> Candidate Actions -> Sārathi ->
  {Investigate, Execute, Defer, Escalate, Reject} -> Action/Observation -> New Evidence -> Knowledge State.

  **Reconfirms action outcomes are evidence** (`Action->Observation->Evidence->Knowledge`, "closes the
  loop"), and delivers the file's most consequential engineering-relevant finding: **failed actions are
  also knowledge**, worked through a failed firewall connectivity test producing genuine evidence
  (`FirewallTestFailed`) rather than mere operational failure -- "failure is an epistemic event," "very
  important for engineering systems." **Formalizes Action provenance** via a fully-specified `ActionEvent`
  object (Actor, Action, Intent, KnowledgeState, Policy, Timestamp, Outcome, Evidence), enabling
  KnowledgeOS to answer both "why was this action taken?" and "what happened after it?"

  **Delivers explicit, first-class modeling of human decisions**: when a human overrides Sārathi's
  recommendation, choosing `a_2` instead of the recommended `a_1`, this is explicitly NOT treated as an
  error but as a new `HumanDecision` event carrying decision-maker, authority, rationale, knowledge state,
  accepted risks, and the selected action -- "KnowledgeOS records the divergence." **Delivers a crucial
  statement on where human agency belongs**, explicitly rejecting any implied `AI->Action` shortcut in
  favor of `Knowledge->Recommendation->Human/GovernanceDecision->AuthorizedAction`, with automation existing
  only where explicitly authorized.

  **Formalizes Decision Rationale** as a constructible explanation `Why(a)?` drawn from {Purpose,
  Discrepancy, Evidence, ExpectedOutcome, Risk, Cost, Constraints, Policy}, worked through a concrete
  example sentence explicitly contrasted with the unacceptable baseline "the AI recommended it." **Delivers
  `DecisionConfidence≠EvidenceSupport`**: a decision can simultaneously carry high expected utility, high
  uncertainty, low risk, and strong evidence -- genuinely distinct dimensions that a useful decision report
  must expose rather than collapse into one number.

  **Introduces Regret** (`Regret(a)=Utility(a*)-Utility(a)`, and expected regret under uncertainty),
  explicitly classified as a policy-level decision criterion rather than a fundamental epistemic property.
  **Delivers robust decision making under model uncertainty**: when the probabilities themselves are
  uncertain (e.g. "what if our causal model is wrong?"), Sārathi can prefer a minimax-style robust criterion
  `min_{M∈ℳ}U(a,M)`, remaining safe across multiple plausible causal models rather than trusting a single
  point estimate. **Formalizes multiple possible worlds** `𝒲={w_1,...,w_n}` consistent with current
  knowledge, with a robust action defined as one whose outcomes remain acceptable across many plausible
  worlds -- "connects beautifully to our Ideal State and causal models."

  **Delivers "Sārathi therefore needs epistemic humility"**: unknown world state implies uncertain outcome,
  and KnowledgeOS must never manufacture a single confident future merely because an LLM can describe one --
  it must preserve the full set of possible outcomes explicitly. Worked through a concrete unresolved-cause
  scenario (Nexus failure with an unresolved cause) where a high-risk restart is correctly deprioritized in
  favor of low-risk, high-information-value inspection actions unless urgency overrides the policy --
  "risk-aware epistemic action selection."

  **Delivers the file's central formal deliverable -- the fully specified Sārathi function**:
  `S_t=𝒟_ρ(K_t,I_t(P),Δ_t^P,𝒜_t,R_t,Auth_t,C_t)`, returning
  `Decision∈{Execute,Investigate,Defer,Escalate,Reject,RequestApproval}`. **Delivers the corpus's cleanest
  three-lens mathematical differentiation to date**: `Zero(K,I)->Δ` ("what is missing, inconsistent,
  uncertain, or deficient?"); `Lord(K,I,Δ)->𝒜` ("what could reduce the relevant discrepancy or
  uncertainty?"); `Sārathi(K,I,Δ,𝒜,ρ)->Decision` ("given purpose, risk, authority and constraints, what
  should happen next?") -- "no longer merely metaphorical. It is a coherent computational architecture."
  Delivers the summary architectural invariant "Zero detects; Lord proposes; Sārathi decides," alongside
  "Decision does not imply Execution" and "Execution produces Evidence," completing the feedback loop.
  Delivers a full action lifecycle (Candidate -> Evaluated -> Feasible -> Recommended -> Approved ->
  Executed -> Observed -> Evaluated, with terminal states Rejected, Cancelled, Failed, Succeeded, Expired,
  Superseded), explicitly domain states, not epistemic ones.

  **Delivers the file's central formal invariant deliverable -- fourteen canonical Step-15 invariants
  (DE1-DE14)**: DE1 Action≠Knowledge; DE2 Recommendation≠Execution; DE3 Decision≠Authority; DE4 Authority is
  explicitly governed; DE5 Information acquisition is itself an action; DE6 Information has decision value;
  DE7 Action outcomes become evidence; DE8 Action failure can produce knowledge; DE9 Utility is
  purpose/policy dependent; DE10 Risk and uncertainty are not interchangeable; DE11 Unknown outcomes must
  remain representable; DE12 Human decisions remain first-class decision events; DE13 Every consequential
  decision retains its decision basis; DE14 (flagged particularly important) Execution changes the domain
  state; observation changes the knowledge state.

  **Delivers Step 15's verdict**: THEORETICALLY RESOLVED AT THE FRAMEWORK LEVEL, delivering the corpus's
  canonical, final definition of Sārathi -- "the policy-governed decision mechanism that selects or
  escalates actions under uncertainty, based on purpose, discrepancy, expected consequences, information
  value, risk, authority, and constraints" -- explicitly NOT "the AI that decides what to do,"
  "fundamental" as a distinction. Consolidates the complete reasoning loop
  (`K_t --Zero--> Δ_t --Lord--> 𝒜_t --Sārathi--> Decision_t --Authority--> Action_t --World--> Outcome_t
  --Observation--> Evidence_{t+1} --Assessment--> K_{t+1}`), "a genuine closed epistemic-action loop."

  **Delivers a major architectural self-assessment**: KnowledgeOS has crossed from "Knowledge Management +
  Reasoning" to "Knowledge + Reasoning + Discrepancy Detection + Decision Support + Governed Action Loop,"
  "much closer to an epistemic operating system." **Identifies one major remaining missing mathematical
  component**: the world changes continuously WITHOUT KnowledgeOS acting (documents change, systems change,
  people change decisions, policies change, deployments happen, external events happen), requiring a formal
  model of Time, Events, State Evolution, and Change.

  **Closes by opening "Step 16 -- Temporal Knowledge, Events, State Evolution, and Knowledge Versioning"**,
  posing the central question of how KnowledgeOS distinguishes what was true, believed, valid, or required
  at one time from another, explicitly noting that the temporal-validity component `τ` had been introduced
  early in the arc but never fully formalized.
