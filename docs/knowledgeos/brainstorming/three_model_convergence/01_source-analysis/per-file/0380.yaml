    refinement: "Given a structurally parallel but more rigorously justified successor: the ten-component invariant (Content/Participant/Context/Time/Commitment/Support/Incompatibility/Consequence/Provenance/Transition) plays an analogous Kernel-candidate role, but is derived via an explicit representation-equivalence criterion rather than a raw cross-regime substrate intersection"
