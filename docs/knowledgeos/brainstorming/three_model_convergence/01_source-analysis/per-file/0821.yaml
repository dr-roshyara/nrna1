title: "Step 194 -- The Causal Boundary (MAJOR SYNTHESIS MILESTONE, delivers 0820's promised causality test, CONTINUES I-series to I47): Delivers Rigorous Pearl-Style Causal Inference (P(Y|X) vs. P(Y|do(X)), a Worked Confounder Example) Applied Directly to AI-Generated Causal Claims -- Delivers 'Human Authority Does Not Repair Bad Causality' (Authority≠EpistemicTruth) -- Delivers the Two-Dimensional Knowledge State K(p)=(EpistemicStrength,GovernanceStatus) With a Worked Four-Row Table Showing Weak-Evidence-Yet-Approved as Legitimate -- Delivers Causal Claims as Immutable Versioned Assertions (Claim_v1→[Superseded/Refuted]→Claim_v2) and CausalClaim's Full Statistical-Provenance Tuple -- Explicitly Names and Forbids Circular Justification (Decision→Claim→Evidence→Decision) -- Delivers 'Reproducibility Is a Knowledge Invariant Where Quantitative Claims Matter' -- Delivers Three New Invariants I45-I47 -- Delivers the Deepest Result: the Architecture Must Preserve (at Least) Four Distinct Semantic Graphs (Temporal/Epistemic/Governance/Causal) -- Opens Step 195's Identity Boundary (Identity≠Name≠State≠Representation)"
