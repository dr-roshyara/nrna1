about: >
  Directly continues 0820, opening "we established `TemporalOrder≠CausalOrder`. Now we need to determine
  whether KnowledgeOS can distinguish what happened before something from what actually contributed to
  making it happen... an AI can easily observe `X→Y` in the data and incorrectly conclude `X causes Y`. A
  serious knowledge architecture must not permit that inference without an appropriate basis."

  **§194.1-194.5 delivers four distinct relations** (`Precedes, Correlates, Supports, Causes`) and the
  rigorous causal-inference core: `Precedes(X,Y)` means only `T(X)<T(Y)`, boxed **`Precedes(X,Y)⇏
  Causes(X,Y)`** (a deployment preceding an outage does not establish causation). Delivers the crucial
  distinction between observational conditioning `P(Y|X)` and interventional `P(Y|do(X=x))` -- "what is
  the distribution of Y if we intervene and set X=x?" -- explicitly "fundamentally different" from
  conditioning.

  **§194.6-194.8 delivers a fully worked confounding example**: `P(Outage|Deployment)=0.25` alone is
  insufficient, since a latent `SystemInstability` may drive both `Deployment` and `Outage`, formalized as
  a small causal graph (`Instability→Deployment`, `Instability→Outage`), concluding `Deployment⇏Outage`
  necessarily -- "the observed association is confounded." Delivers **`RelationType=ObservedSequence`
  explicitly kept distinct from `RelationType=Causal`**.

  **§194.9-194.14 delivers a nine-relation candidate taxonomy** (`Precedes, Follows, Correlates, Supports,
  Explains, Causes, Enables, Prevents, Contradicts`) with **relation-dependent evidential requirements**,
  boxed: **`EvidenceRequirement(Cause)>EvidenceRequirement(Sequence)`** in general. Delivers the refinement
  of 0819's `Evidence⇒Assessment` into **`Assessment=f(Evidence,ClaimType,Model,Assumptions)`**, worked
  through a concrete server-restart-after-deployment example where log evidence establishes `Deployment≺
  Restart` but not `Deployment→Restart`, boxed: **`ClaimType determines EvidenceSufficiency`**. Delivers
  **causal confidence** `C_{X→Y}=P(Y|do(X))-P(Y|do(¬X))`, explicitly "conditional on the causal model and
  assumptions. It is not metaphysical truth," and the statistical architecture chain `Data→
  StatisticalModel→Estimate→Interpretation`, requiring `Model,Assumptions,Population,Sample,Method` be
  retained alongside any point estimate.

  **§194.15-194.18 delivers AI-generated causal claims properly bounded**: an AI's `Deployment causes
  outage` output must initially be `CandidateCausalClaim`, never `EstablishedCausalClaim`, boxed:
  **`AIInference≠EstablishedKnowledge`**. **Delivers the file's central governance-discipline finding,
  "human authority does not repair bad causality"**: an Architecture Board approving "deployment caused
  outage" creates a `Determination(C)` but "does not magically turn a weak causal inference into
  scientifically established causality," boxed: **`Authority≠EpistemicTruth`** -- "authority establishes
  organizational validity for a purpose. It does not rewrite the statistical model."

  **§194.18-194.20 delivers the two-dimensional knowledge state**, boxed: **`K(p)=(E_p,G_p)`**
  (EpistemicStrength, GovernanceStatus), worked through a **four-row concrete table** (deployment-preceded-
  outage: High/Accepted; deployment-correlated: High/Accepted; deployment-caused-weak: Weak/Approved;
  deployment-caused-strong: Strong/Accepted) -- "much more accurate than a single `status=approved`."
  Delivers **the explicit worked legitimacy of `WeakEvidence` + `ApprovedForOperationalUse`**
  simultaneously (a board choosing a conservative policy despite incomplete evidence), explicitly: "the
  architecture should represent this honestly. It should not transform `WeakEvidence` into `StrongEvidence`
  because somebody approved an action."

  **§194.21-194.25 delivers the extended, typed causal lineage graph**
  (`Observation→Evidence→StatisticalAnalysis→CausalClaim→[EpistemicAssessment/GovernanceDetermination]→
  Decision→Action`) and reconfirms typed edges (`supports/precedes/causes/justifies/authorizes`) over a
  generic `Relationship{type:"whatever"}`. Delivers **six candidate DDD bounded-context boundaries**
  (Observation/Evidence/Epistemic/Governance/Decision/Execution Context), explicitly "should not
  automatically become six microservices... but they are strong semantic boundaries," and the aggregate
  question of which transitions require atomic consistency (`EvidenceRegistration` atomically establishes
  Identity+Provenance+Integrity, but not `GovernanceDecision`).

  **§194.26-194.29 delivers causal claims as immutable versioned assertions**: never silently overwrite
  `cause=deployment`; instead create `Claim_v2=Refuted` referencing `Claim_v1→[superseded/refuted]→
  Claim_v2`. **Delivers AI model evolution requiring explicit provenance**: `Model_1≠Model_2` must be
  preserved -- "otherwise we cannot understand why the epistemic assessment changed." Delivers **the full
  `CausalClaim` provenance tuple**, boxed: **`CausalClaim=(Proposition,Evidence,Model,Assumptions,
  Population,Method,Assessment,Time)`**, explicitly "the statistical equivalent of software provenance."
  Delivers **statistical reproducibility as a knowledge invariant**: "could another qualified analyst
  reproduce the assessment?", requiring `Data+Method+Model+Assumptions+Version`, boxed: **"reproducibility
  is a knowledge invariant where quantitative claims matter."**

  **§194.30-194.32 delivers three new invariants**: **`I45`** (a causal claim must be distinguishable from
  the temporal or statistical association that motivated it); **`I46`** (evidential requirements for a
  claim must depend on the claim's semantic type); **`I47`** (governance approval must not silently
  upgrade epistemic strength), explicitly flagged "particularly important."

  **§194.33-194.36 delivers the epistemic/causal graph versus governance graph as related but non-
  identical structures** (`E_causal: Evidence→Inference→Claim` versus `G_gov: Claim→Determination→
  Decision`), and **explicitly names and forbids circular justification**: a dangerous architecture
  permitting `Decision→Claim→Evidence→Decision`, worked through the concrete circular example "we approved
  the architecture because the architecture was already approved" (`A→B→A`). Delivers **a new acyclicity
  consistency rule**, boxed: **`G_justification` should be acyclic unless an explicit domain rule permits
  cycles**.

  **§194.37-194.41 re-walks all four Gita chapters once more specifically for the causality/decision
  distinction**: Chapter 1 (`MultipleConstraints+ConflictingValues→DecisionProblem`, explicitly rejecting
  `Evidence→UniqueDecision` -- "there can be several legitimate decisions under different objectives");
  Chapter 2 (`DecisionQuality≠OutcomeQuality`, "important when evaluating AI agents"); Chapter 3
  (`Knowledge→Action` but never `Knowledge=Action`, "an action is an operational transition. It should
  remain separately observable"); Chapter 4 (`Transmission≠CompleteReconstruction`, "the recipient may
  possess only a projection... this again reinforces provenance"). Delivers **the four-chapter
  architectural-question table plus Step 194's own fifth question**: "how do we distinguish temporal
  sequence, evidence, correlation, and causation?"

  **§194.42-194.45 delivers "the architecture is becoming a semantic calculus"**: an assertion is not bare
  `A` but `A(Context,Time,Evidence,Model,Authority,Lineage)`, and a transition is not bare `S_1→S_2` but
  `τ(S_1,S_2,Reason,Rule,Witness,Actor,Authority,Time)`. Delivers **the central architecture equation**,
  boxed: **`KnowledgeState_{t+1}=Transition(KnowledgeState_t,Evidence,Model,Context,Rule,Authority)`**
  subject to `InvariantSet`, kept explicitly separate from `Reality_{t+1}=Action(Decision,Environment)` --
  "the two systems interact, but they are not identical." Delivers **two coupled state machines**
  (Epistemic `K_t`, Operational `R_t`) with the full closed feedback-loop diagram
  (Reality→[observe]→Evidence→[assess]→Knowledge→[determine]→Decision→[execute]→Reality'), surrounded by
  `Time+Lineage+Authority+Provenance`.

  **§194.46 delivers the file's deepest result**: the architecture must preserve at least four distinct
  semantic graphs, boxed: **`TemporalGraph`**, **`EpistemicGraph`**, **`GovernanceGraph`**, and (newly
  emerging) **`CausalGraph`**, explicitly "should not automatically be implemented as four databases or
  four services. They are four semantic structures. Implementation comes later."

  **§194.47 delivers the Step 194 verdict**, three boxed results: **`Sequence≠Correlation≠Evidence≠
  Causation`**; **`EpistemicStrength≠GovernanceStatus`**; **`Decision≠Outcome`** -- "mutually consistent
  with Steps 191-193 and with the Chapter 1-4 lenses."

  **Closes opening "Step 195 — the next boundary: identity,"** motivated by real distributed-systems
  concerns (names change, systems are replaced, repositories are forked, services are renamed, AI agents
  are recreated, knowledge is copied, domains evolve), boxed: **`Identity≠Name≠State≠Representation`**,
  posing the concrete question "how can KnowledgeOS know that the 'Nexus' observed yesterday is the same
  domain/system entity as the 'Nexus' discussed today after migration?" -- explicitly connecting to the
  Chapter 2 continuity-through-change lens and DDD's identity-versus-attributes distinction. No actual
  repository implementation occurs within this file itself; every relation, tuple, and graph remains a
  conceptual specification pending Step 195's identity test.
