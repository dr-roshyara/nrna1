defines:
  - concept: "'Human authority does not repair bad causality'"
    definition: "When an authorized governance body (e.g. an Architecture Board) formally approves or determines a causal claim, that act establishes organizational validity for the claim's use within governance purposes, but it does not and cannot retroactively strengthen the underlying statistical/causal evidence -- a weak causal inference approved by authority remains a weak causal inference; Authority and EpistemicTruth (or EpistemicStrength) are orthogonal dimensions, formalized as the two-dimensional knowledge state K(p)=(EpistemicStrength,GovernanceStatus), which explicitly permits and represents combinations like WeakEvidence+ApprovedForOperationalUse as legitimate rather than forcing governance approval to silently upgrade the evidence's actual strength"
  - concept: "Causal claim immutability and versioning"
    definition: "A causal claim, once asserted, should never be silently overwritten in place when later analysis contradicts it -- instead a new versioned claim (Claim_v2) is created that explicitly supersedes or refutes the original (Claim_v1→[superseded/refuted]→Claim_v2), preserving the full CausalClaim provenance tuple (Proposition, Evidence, Model, Assumptions, Population, Method, Assessment, Time) for each version, so that a later disagreement between model versions or reanalysis is itself an auditable, reconstructable event rather than a silent, untraceable correction"
  - concept: "Circular justification"
    definition: "A dangerous architectural failure mode in which a decision's justification chain loops back to depend on an artifact whose own existence or validity depends on that same decision (formally A→B→A, e.g. 'we approved the architecture because the architecture was already approved') -- while cycles are not automatically invalid in every knowledge graph, a justification relation (Justifies) specifically should be required to form an acyclic graph unless an explicit domain rule deliberately permits cycles, since an unnoticed justification cycle manufactures apparent legitimacy from nothing"
