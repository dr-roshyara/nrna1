defines:
  - concept: "The formalization-discipline gate"
    definition: "Moving from a raw source observation to a semantic concept, then to an architectural inference, then to a formal mathematical object requires an explicit, deliberate checkpoint at each transition -- skipping a gate risks confusing the source material's own ontology with the architecture's abstractions, promoting a concept to a formal dimension before it has earned that status, or overloading a state representation with items that are actually derived relations rather than primitive state"
  - concept: "Discrepancy as a typed set of findings"
    definition: "Rather than modeling architectural/epistemic discrepancy as a fixed-length vector of orthogonal dimensions (e.g. one slot each for Epistemic, Semantic, Normative divergence), model it as a set of individually-typed findings, where a single finding may legitimately carry multiple simultaneous types -- because the underlying source material does not actually support an assumption that these dimensions are separable or mutually exclusive"
  - concept: "Zero/Lord/Sārathi as pure functions"
    definition: "Rather than modeling Zero, Lord, and Sārathi as stateful components or 'god objects' owning broad responsibility, model each as a narrowly-scoped pure function: Z(S,P)→Δ (diagnose discrepancy from state and purpose), L(K,N,U,C)→R (resolve/synthesize/orient a response from knowledge, norms, understanding and context), Sa(S,R)→G (contextualize the resolution into guidance) -- keeping each lens focused on exactly one transformation rather than accumulating broad, undifferentiated responsibility"
