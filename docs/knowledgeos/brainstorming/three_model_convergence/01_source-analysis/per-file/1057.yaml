about: >
  "08 — Degeneracy Audit (mandate §13) · retrospective over Steps 287-288."

  **DELIVERS A NEW STANDING AUDIT PRINCIPLE, EXPLICITLY PROMOTED**: "No algebraic property may be accepted
  from a zero-counterexample result without first checking whether the tested relation is DEGENERATE" --
  universal, empty, singleton, identity, degenerate along an axis, or otherwise incapable of meaningfully
  exercising the property. Mandates a "REQUIRED COMPANION MEASUREMENT": every relation reported as satisfying
  equivalence axioms must ALSO report its block count, since "1 block (universal) and `|carrier|` blocks
  (discrete) both satisfy every axiom and carry no information." Traces this principle's origin to the
  already-tracked `≈_S∘≈_V` universal-relation near-miss (file 1046's §J self-catch).

  **Applies this principle retrospectively to all fourteen equality/observability results from Steps 287-288**,
  finding **THREE OF FOURTEEN REQUIRE DOWNGRADE, ALL THREE AT ENDPOINTS**: `≈_∅` (the empty-subset projection)
  is confirmed UNIVERSAL, 1 block -- "axiom-satisfying, information-free; NOT A CANDIDATE `≈`"; `≈_{A,S,R,V,C}`
  (the full-subset projection) is confirmed DISCRETE (identical to structural equality on `Σ`), 2240 blocks --
  "relates nothing but self... not an independent [equivalence] candidate," though it remains valid AS
  structural equality; and the already-known `≈_S∘≈_V` composition remains downgraded as previously caught.
  Confirms SIX of the fourteen results are "immune by construction" since they rest on POSITIVE
  counterexamples, which cannot be vacuous by definition.

  **DELIVERS A GENUINELY IMPORTANT FURTHER REFINEMENT OF THE ALREADY-TRACKED "EXACTLY 32" `≈_X` FINDING**
  (files 1039, 1043, 1046): "'exactly 32 distinct `≈_X` relations' STANDS as a count of distinct partitions.
  But as a count of USABLE CANDIDATE OBSERVATIONAL RELATIONS it is **30**, because two endpoints are
  degenerate. The normative choice space `N-5` [already tracked, file 1047] IS 30, NOT 32."

  **DELIVERS A GENUINELY VALUABLE SELF-AWARE META-OBSERVATION about the programme's own recurring pattern**:
  "This is the THIRD TIME in this programme a count has needed narrowing after measurement (47 tests→4; at
  most 32→exactly 32; 32→30 usable). The pattern is not arithmetic error -- it is reporting a computed
  cardinality WITHOUT ASKING WHAT THE EXTREMES MEAN." This identifies a recurring, named class of
  methodological error distinct from the already-tracked "F5 error class" (Σ-order-vs-K-order conflation) and
  the "scaffolding contradicts body" pattern (files 1031-1032, 1034) -- a third, previously unnamed
  recurring error class specifically about endpoint/boundary-case degeneracy in cardinality counts.

  **Confirms the additional already-tracked note that `I_48`'s within-context transitivity CANNOT currently
  be degeneracy-checked at all**, since "identity context" remains undefined and no partition can be
  computed -- "confirms BOUNDED, not established," a further reinforcement of the already-tracked unbound-
  parameter caveat.

  **Closes with a general statement of what the rule protects against**: "A verification suite reporting
  'reflexive ✅ symmetric ✅ transitive ✅' across a family of relations LOOKS STRONGEST EXACTLY WHERE THE
  RELATIONS HAVE COLLAPSED -- because a degenerate relation cannot produce a counterexample to anything.
  Degeneracy inflates a pass rate. The block-count companion measurement is the cheapest available guard, and
  it is now mandatory in this programme."
