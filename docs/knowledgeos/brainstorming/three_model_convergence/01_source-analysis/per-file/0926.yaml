defines:
  - concept: "Valid_G(d,t), the governance-validity predicate"
    definition: "A governance decision d is valid at time t if and only if AuthorityValid(d) (the deciding authority is legitimate) AND DecisionExplicit(d) (the decision content is unambiguous) AND RecordDurable(d) (a durable record of the decision exists) AND ScopeDefined(d) (the decision's applicability is explicitly bounded) AND EffectiveAt(d,t) (t falls within the decision's validity interval). A governance decision is never considered authoritative merely because a document containing it exists -- all five conjuncts must independently hold"
  - concept: "GC = ACHIEVED (formal criterion)"
    definition: "Governance closure is ACHIEVED if and only if every governance-critical decision d in the governance-critical decision set D_G satisfies Valid_G(d): each has identified legitimate authority, an explicit decision, a durable governance record, an effective date, a defined scope, recorded justification, an impact assessment where required, satisfied prerequisites, and no unresolved governance-critical dependency. Formally: GC=ACHIEVED iff for-all d in D_G, Valid_G(d) holds"
  - concept: "The GD-critical/optional distinction (from the appended supervisory review)"
    definition: "Of the eight governance decisions GD-01 through GD-08, the review classifies GD-01 (Root Authority), GD-02 (Policy Amendment Authority), GD-04 (Policy Conflict Default), GD-06 (Determination Scope), and GD-07 (Canonical Theory Acceptance) as governance-critical (required for GC=ACHIEVED), while GD-03 (Emergency Governance), GD-05 (Policy Propagation Mode), and GD-08 (unask semantics) are classified optional -- not required for GC=ACHIEVED even though they remain open governance questions"
