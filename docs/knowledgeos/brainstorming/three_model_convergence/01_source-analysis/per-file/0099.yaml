about: >
  Maps all five named Hetvābhāsa sub-types individually onto a "Reasoning Anti-Corruption Layer,"
  proposes Avacchedaka as a formal type-system foundation (a six-field Knowledge Identity tuple
  including Context as a required field), argues graph/hypergraph storage is "almost mandatory"
  (a technology-choice statement in tension with this thread's own repeated discipline), and invokes
  "Cubical Type Theory" for a section whose actual content is generic dependent/parameterized-type
  reasoning, not cubical-specific machinery -- a title/content precision gap. Produces a tenth anchor
  reshaping and names a new philosopher, Bhartṛhari, alongside Matilal.

introduces:
  - "Five Hetvābhāsa sub-types individually mapped (more granular than 0092's bare naming): Savyabhicāra
    (invalid generalization), Viruddha (opposite conclusion), Satpratipakṣa (competing reasoning),
    Asiddha (unproven premise), Bādhita (overridden by stronger evidence) -- each given its own
    KnowledgeOS-equivalent section as a distinct 'anti-corruption' check"
  - "Avacchedaka -> 'the missing type system': a relation always requires Entity + Property Boundary +
    Context Boundary + Relation Mode, illustrated by a worked JSON example (bounded_by: {domain,
    lifecycle, authority})"
  - "⭐ FOURTH-plus distinct Context treatment: 'Avacchedaka becomes Context-Bounded Identity' --
    Knowledge Identity = (Entity, Property, Context, Relation, Time, Authority), a formal SIX-FIELD
    tuple in which Context is a REQUIRED FIELD of Identity itself -- neither a flat peer dimension
    (0089/0090), nor merged away (0091), nor a pure external delimiter (0094), but a named component
    of a formal Identity structure. Added to the Unresolved Equivalence Registry group, not treated as
    resolving the dispute"
  - "'Why Graph Storage Becomes Almost Mandatory': argues relational/tabular storage cannot represent
    'relation between relation between relation' (paramparā-sambandha, cf. 0094), proposing a property
    graph/hypergraph (nodes: entities/concepts/agents/evidence/contexts; edges: supports/contradicts/
    derives/limits/qualifies). FLAGGED: this is a technology-choice statement, in tension with this
    entire thread's own repeated explicit discipline ('do not choose technology', stated verbatim at
    0080/0088/0092/etc.) -- the document itself does not note this tension"
  - "'Cubical Type Theory -> KnowledgeOS Type Foundation': proposes parameterized/dependent types
    (Knowledge<Person,Context,Time,Evidence>; SecurityStatus:(system,audit-context,timestamp,assessor)
    ->EpistemicClaim). FLAGGED: the section title names 'Cubical' type theory specifically (a real,
    technical branch of homotopy type theory involving path types, Kan operations, and univalence) but
    the actual content shown is generic dependent/indexed-type reasoning, engaging NONE of cubical
    type theory's distinguishing machinery -- a title/content precision gap, not necessarily
    deliberate misrepresentation, but should not be read as evidence of genuine cubical-type-theory
    engagement"
  - "⭐ Tenth anchor reshaping: 5-layer 'New KnowledgeOS Constitutional Layers' stack -- Truth
    Constitution (Vedanta) / Epistemic Engine (Nyaya Pramana) / Semantic Engine (Matilal/Bhartṛhari,
    NEW NAMED PHILOSOPHER) / Reasoning Integrity (Hetvabhasa Guard) / Type Kernel (Avacchedaka,
    Dependent Types) -- the first reshaping to name Vedanta explicitly as an architectural LAYER
    (Truth Constitution) rather than only a correspondence lens, and the first to name Bhartṛhari"
  - "Type-error / epistemic-error analogy table: Type error<->Epistemic error, Invalid cast<->Invalid
    inference, Null reference<->Unsupported premise, Wrong interface<->Wrong semantic context, Runtime
    failure<->Knowledge corruption"
  - "Final synthesis progression: Veda('what is knowledge?')->Upanishad('what is the knower?')->
    Vedanta('HOW IS IGNORANCE REMOVED?')->Nyaya('how is knowledge justified?')->Tarka('how is
    reasoning tested?')->Matilal('how does meaning become knowledge?')->Navya-Nyaya('how do we prevent
    reasoning corruption?')->KnowledgeOS. NOTE: Vedanta's question is characterized as ignorance-
    removal, the closest the corpus has come to the tracked Purification/Mokṣa territory -- but this
    is a paraphrase, not the technical vocabulary (guṇas/Buddhi/purification/Mokṣa) itself, and is
    recorded as new but non-doctrinal evidence"

