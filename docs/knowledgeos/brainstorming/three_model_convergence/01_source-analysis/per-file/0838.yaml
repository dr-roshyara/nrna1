defines:
  - concept: "Architecture assurance gap"
    definition: "An invariant that the corpus has derived and formally stated but that, when checked against the Architecture Assurance Graph (AAG=(Components,Contracts,Invariants,Evidence,Dependencies)), has no identified owning component, no carrying contract, and/or no proving test -- explicitly named as the measurable distance between 'our derived architecture' and 'the actual software,' marking the transition point where the corpus's work shifts from designing an ideal KnowledgeOS to auditing how much of that design is genuinely realized"
  - concept: "The three-level assurance hierarchy (Documentation/Executable/Formal)"
    definition: "A strict ordering of assurance strength for any architectural claim: Level 1 Documentation assurance (the claim merely exists in written architecture documentation, the weakest form); Level 2 Executable assurance (an automated test demonstrates the property holds under the specific conditions tested); Level 3 Formal assurance (a proof, model-checking run, or static verification establishes the property holds within a fully defined formal model, the strongest form) -- Documentation<ExecutableEvidence<FormalProof, with the explicit caveat that not every property warrants the cost of formal verification; risk-based assurance should allocate the strongest evidence tier to the highest-criticality invariants (e.g. UnauthorizedExecution) rather than uniformly"
