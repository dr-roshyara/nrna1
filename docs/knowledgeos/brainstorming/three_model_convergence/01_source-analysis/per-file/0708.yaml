defines:
  - concept: "The anti-circularity boundary for self-verification"
    definition: "A system claiming to verify its own conformance must never simply assert its own correctness; it must run deterministic, independently reproducible checks that produce evidence and a verdict — self-verification is a checking discipline, not a self-certifying declaration"
  - concept: "Positive+Negative testing (governance controls)"
    definition: "Verifying a governance/authorization control requires two complementary tests: a positive test confirming that an authorized action succeeds (proving the control does not block legitimate use), and a negative test confirming that an unauthorized action is actually rejected (proving the control genuinely enforces the boundary) — a positive test alone never establishes enforcement"
  - concept: "Epistemic downgrade"
    definition: "The failure mode where a piece of knowledge that was Verified or Authoritative silently loses that status and becomes treated as a mere unsupported Inference, typically due to a serialization, transformation, or data-migration error rather than a deliberate epistemic-status change — this must be prevented or at minimum made explicit whenever it occurs, symmetric to the more commonly discussed upward-promotion-abuse concern"
  - concept: "SyntheticVerification≠UniversalCorrectness"
    definition: "A synthetic (deliberately staged) test demonstrating that a mechanism correctly handles a specific constructed scenario proves only that — it does not establish that the mechanism correctly handles every possible real-world scenario; synthetic evidence is valuable precisely because historical incidents may never have exercised a given mechanism, but its scope must not be overstated"
  - concept: "The Independent verifier principle"
    definition: "For high-value constitutional/governance controls, the entity verifying conformance should be architecturally and organizationally distinct from the system being verified (Verifier_A≠System_A), e.g. an independent CI-run database query rather than trusting the system's own API-reported summary — this reduces the risk that a self-reporting mechanism silently misrepresents its own state"
  - concept: "Why PASS can be misleading (EXCEPTION as a distinct state)"
    definition: "A constitutional rule's current status must distinguish PASS (genuinely satisfied), FAIL (violated with no approved deviation), EXCEPTION (a currently-approved, time-bounded deviation from the rule), and UNKNOWN (insufficient evidence); collapsing an active approved exception into a bare 'PASS' obscures the fact that the rule is not actually being met, only that its violation is currently authorized"
