defines:
  - concept: "EpistemicMajorityError"
    definition: "The number of agents holding a belief does not determine its truth probability; a numerical majority of engineers estimating low risk based on weak collective reasoning must not override a minority specialist's evidence-backed higher risk estimate purely by vote count — epistemic questions require evidence-weighted, not headcount-weighted, resolution"
  - concept: "FormalAuthority≠EffectiveInfluence"
    definition: "An agent controlling the agenda, information presentation, or sequencing of a collective decision process can materially shape its outcome even without formal voting rights or decision authority; effective influence over a decision is not fully captured by the formal authority structure alone"
  - concept: "The Truth≠Belief≠Preference≠Recommendation≠Decision≠Authorization hierarchy"
    definition: "Seven institutionally and epistemically distinct objects that must never be collapsed into a single generic status field: Truth (what is the case, independent of anyone's knowledge), Belief (what an agent believes), Evidence (why it is believed), Preference (what outcome an agent wants), Recommendation (what a model/analysis suggests), Decision (what the authorized institution has chosen), and Authorization (what is actually permitted to be executed)"
