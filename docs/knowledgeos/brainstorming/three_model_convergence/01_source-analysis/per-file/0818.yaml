about: >
  Directly continues 0817, opening "we now test the boundary that is essential for making KnowledgeOS
  implementable: when does a change in the software become a domain-significant transition, and when is
  it merely a technical mutation? This is where our theory meets the actual architecture: Git, hooks,
  registry, evidence, governance, CI/CD, AI agents, databases, and execution."

  **§191.1-191.5 delivers the formal significance function**: for a mutation `m:S_t→S_{t+1}`, boxed
  **`TechnicalMutation≠SemanticTransition`**, formalized via `Σ(m)∈{0,1}` over eight protected domain
  dimensions `D={Identity,Meaning,EpistemicStatus,Authority,Decision,Obligation,Lifecycle,Lineage}`:
  `Σ(m)=1` iff `ΔD(m)≠0`. Worked through five concrete examples (database index update `Σ=0`; evidence
  added `Σ=1`; authority revoked `Σ=1`; AI-generated internal token `Σ=0`; AI-generated candidate
  proposition `Σ=1`), explicitly "a much better boundary" than the initial vague `Σ(m)` alone.

  **§191.6-191.9 delivers the architectural semantic filter** (system activity→semantic filter→
  Technical[normal logging] vs. Semantic[governed lineage+witness]), boxed: "the constitutional machinery
  should not observe every byte-level mutation. It should observe the mutations that carry domain
  meaning." **Delivers the Git-specific formalization**, boxed: **`GitCommit≠SemanticDecision`** (a commit
  may be formatting, typo correction, refactoring, dependency upgrade, or architecture change -- "the
  semantic classification must come from context"). Delivers **the subtle witness distinction**: a commit
  can serve as `Witness(C_123,Transition)` while boxed **`Witness≠Cause`** and **`Witness≠Authority`** --
  explicitly preventing the common architecture mistake **"it is in Git, therefore it is approved."**
  Delivers **the hook-specific discipline**: a hook detecting `GitChange` should not directly declare
  `ArchitectureChange`, instead `GitChange→[Classification]→CandidateSemanticChange`, with a deterministic
  policy then determining the boundary crossing.

  **§191.10-191.12 delivers the three-valued classification function**, boxed: **`Classify(m,C,R)→
  {Technical,Semantic,Unknown}`**, explicitly including `Unknown` because "forcing every mutation into a
  binary classification creates false certainty." Worked through an AI-modifies-ADR-017.md example where
  the correct response is `Unknown→Assessment`, never inventing a meaning. Delivers **a classification
  state machine** `C={Detected,Classified,Unclassified,Semantic,Technical,Rejected}`, explicitly kept
  distinct from `KnowledgeState`.

  **§191.13-191.16 delivers a five-event taxonomy** (Technical `E_T`, Observational `E_O`, Epistemic
  `E_E`, Governance `E_G`, Operational `E_A`), boxed cycle **`Observation→Epistemic→Governance→Action→
  Observation`**, "much more useful than calling everything an event." Delivers **`Event≠State`**
  (`NexusUpgraded` the event vs. `Version=3.70` the resulting state) and its replay implication, boxed:
  **`TransitionHistory⇒Replayability`** -- again explicitly noting replayability is the requirement, event
  sourcing merely one candidate implementation.

  **§191.17-191.20 delivers the semantic event contract** `E=(EventID,EventType,Subject,Actor,Context,
  Time,PreviousState,NewState,Reason,Witness)` and **`Actor≠Authority`**, worked through a directly
  self-referential example: **"suppose `Actor=Claude`. The AI generates `CandidateArchitectureChange`...
  the event should say `Actor=AI`. But `Authority=HumanArchitect` if the architect later accepts the
  proposal,"** formalized `AI→[Proposes]→Candidate→[ArchitectAuthority]→AcceptedChange` -- "precisely the
  human/AI separation we want." **Delivers "the 'AI did it' anti-pattern," explicitly named and
  forbidden**: an unsafe system recording `architecture_status=approved, modified_by=AI` collapses
  generation, assessment, authority, and decision into one fact -- "our architecture explicitly forbids
  that collapse," boxed: **`AI Generation≠Human Determination≠Governance Approval`**.

  **§191.21-191.23 delivers semantic significance as explicitly contextual**: `README.md changed` normally
  has `Σ=0`, but `Σ=1` if that README is the official Architecture Constitution, formalized
  `SemanticTransition=f(Mutation,Context,Policy)` -- "context is not optional metadata. It influences
  semantics." **Delivers an explicit critique of this reconstruction's own kind of implementation
  heuristic**: a rule like "if path starts with `architecture/` require architecture approval" is
  explicitly named "only a heuristic" -- the actual semantic classification is
  `f(Content,Context,Intent,Policy)`, boxed: **`Path⇏SemanticMeaning`** is not universally valid.

  **§191.24-191.26 delivers the deterministic-enforcement resolution**: once the semantic policy is
  declared (e.g. `SemanticClass=ArchitectureRelevant` requires `ADR+ArchitectAuthority+Witness`),
  enforcement can still be fully deterministic -- "the system doesn't need to understand architecture
  philosophically. It needs to enforce the declared contract." Delivers **AI-assisted classification's
  proper boundary**: `AI→ClassificationCandidate`, final classification via `Rule+Evidence+HumanReview`
  where required -- "AI classification is itself an epistemic assertion. It must not silently become
  governance truth." Delivers the formal `SemanticBoundary(M,C,R)` function.

  **§191.27-191.28 delivers `Semantic⇏GovernanceApproval`**: not every semantically meaningful transition
  (e.g. an HTTP 200 observation) requires human approval -- `SemanticTransition→TransitionType→
  AuthorityRequirement` "keeps the model from becoming bureaucratic." Delivers **an eight-row transition
  policy matrix** (Cache update/System observation/Evidence registration/AI recommendation/Determination/
  Governance approval/Deployment/Log rotation, each scored for Semantic?/Authority?/Evidence?/Witness?),
  explicitly noted as provisional pending derivation from the real governance model.

  **§191.29-191.32 delivers the file's central architectural payoff**: the summarized transition model
  `M→[Classify(C,R)]→T→[Validate(T)]→S_{t+1}`, `T={Technical,Observational,Epistemic,Governance,
  Operational}`. **Delivers the much-smaller-Kernel conclusion**: the Kernel needs to understand only
  `Identity+Context+Time+State+Transition+Rule+Authority+Witness+Lineage`, explicitly **not every business
  domain** -- "a very important architectural simplification." Delivers **domain semantics remaining
  outside the Kernel** (Nexus, Election, ArchitectureDecision are domain-specific; the Kernel provides only
  generic guarantees: TransitionValidity/Provenance/TemporalIntegrity/AuthorityValidation/Lineage) -- "a
  true platform architecture." Delivers **the three-layer decomposition diagram**: Domain Policy
  (what counts as valid? who may decide? which evidence suffices? which transitions are allowed?) →
  Constitutional Kernel (identity/time/provenance/witness/transition integrity/authority
  enforcement/lineage) → Implementation (Git/DB/API/hooks/AI/CI-CD).

  **§191.33 delivers the file's most directly self-referential critique**: explicitly named "connection to
  your earlier KnowledgeOS work" -- existing concepts such as registry, hooks, governance, evidence,
  assurance, AI agents, memory, and repository structure "should not all be considered the same
  architectural layer... they are mechanisms participating in different transition types" -- a Hook is an
  enforcement mechanism, **not itself Governance**; a Registry is a knowledge/identity mechanism, **not
  automatically Authority**.

  **§191.34 delivers an explicit Conway's Law warning**: if one team owns `Evidence+Governance+Execution`
  without clear boundaries, "the software may collapse those concepts too," boxed: **`Domain boundaries→
  organizational boundaries→software boundaries` must be considered together**.

  **§191.35-191.36 re-invokes the Gita Chapter 4 Karma lens once more, disciplined**: "we should not
  translate these directly into software classes. But the lens reinforces our architecture" --
  `Knowledge≠Action`, `Action≠Outcome`, and crucially **`RightToAct≠AbilityToAct`**, explicitly mapped
  "beautifully" onto **`Authority≠Capability`**. Delivers **the cumulative four-chapter question table**
  (Ch1: "what should be done?" `DecisionUnderConflict`; Ch2: "what persists through changing states?"
  `Identity+Continuity`; Ch3: "how does knowledge become action?" `Knowledge→Action`; Ch4: "how is
  knowledge/action transmitted across time and actors?" `Transmission+Lineage+Authority`), explicitly
  qualified: "these are philosophical lenses -- not software specifications. But they repeatedly expose
  exactly the distinctions our mathematical model needs."

  **§191.37-191.38 delivers two new paired invariants**, boxed: **`I35`: technical mutation must not be
  mistaken for semantic transition** and **`I36`: a semantic transition must not be hidden as an ordinary
  technical mutation** -- explicitly "together prevent both over-governance and under-governance."
  Crystallized into **the deeper principle**, boxed: **"governance begins at semantic significance, not at
  technical mutation"** -- explicitly flagged as potentially "one of the foundational principles of
  KnowledgeOS."

  **§191.39 delivers the Step 191 verdict and the file's capstone formulation**: the constitutional Kernel
  should not try to model all system activity, only intercept and validate transitions crossing declared
  semantic boundaries, boxed: **"KnowledgeOS Kernel = Semantic Transition Assurance"**, explicitly not
  `KnowledgeOS = Everything`.

  **Closes opening "Step 192 — Next test: the boundary of truth,"** having now separated
  `Technical→Semantic→Epistemic→Governance→Operational`, posing the deeper unresolved question: "what
  exactly does KnowledgeOS mean when it says that something is 'true,' 'valid,' 'known,' or 'accepted'?"
  -- proposing to derive a **formal truth/knowledge lattice** tested against five specific edge cases
  (objectively true but unknown; believed but false; supported but later refuted; officially determined
  but objectively wrong; operationally true but not yet recorded). No actual repository implementation
  occurs within this file itself; every function, contract, and boundary remains a conceptual
  specification pending Step 192's truth-lattice test.
