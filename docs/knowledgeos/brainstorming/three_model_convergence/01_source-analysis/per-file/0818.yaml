defines:
  - concept: "The significance function Σ(m)"
    definition: "A mutation m:S_t→S_{t+1} is semantically significant (Σ(m)=1) if and only if it changes at least one of eight protected domain dimensions (Identity, Meaning, EpistemicStatus, Authority, Decision, Obligation, Lifecycle, Lineage) -- formally Σ(m)=1 iff ΔD(m)≠0; otherwise the mutation is merely technical (Σ(m)=0) and requires only ordinary handling, never governed lineage or witness treatment. This function must also depend on context, not the mutation alone, since the identical file change can be technical in one context and semantically significant in another"
  - concept: "'The AI did it' anti-pattern"
    definition: "A dangerous architectural failure mode in which a system records a single collapsed fact such as architecture_status=approved, modified_by=AI, thereby erasing the distinction between four genuinely separate events: the AI's generation of a candidate, an assessment of that candidate's merit, the authority that legitimately governs the domain, and the actual decision to approve it. The correct architecture explicitly keeps AI Generation, Human Determination, and Governance Approval as three separate, never-collapsed facts, with Actor (who produced the artifact) kept distinct from Authority (who legitimately approved it)"
  - concept: "KnowledgeOS Kernel = Semantic Transition Assurance"
    definition: "The capstone architectural formulation resulting from this file's analysis: the constitutional Kernel's job is not to model or understand all system activity (which would make it 'KnowledgeOS = Everything'), but specifically to intercept and validate only those transitions that cross a declared semantic boundary -- providing generic guarantees (transition validity, provenance, temporal integrity, authority validation, lineage) while remaining entirely agnostic to domain-specific content (Nexus, elections, specific architecture decisions), which is left to a separate Domain Policy layer"
