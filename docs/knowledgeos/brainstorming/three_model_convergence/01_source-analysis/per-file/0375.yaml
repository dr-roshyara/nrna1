    refinement: "Confirmed and extended by explicitly critiquing an external synthesis that had skipped the conditional-determination middle stage entirely, reinforcing the corpus's own conclusion as a genuine advance over the uploaded document"
  - concept: "0370's Navya-Nyaya/relation-theoretic typed-edge proposal (Claim-supportedBy->Evidence)"
    refinement: "Pushed one level deeper: Evidence itself is reconceived as a relation Supports(O,p,C,t) between Observation and proposition, rather than assuming Evidence is already a well-formed object to which further relations attach"
  - concept: "0358's seven-regime Intersection Method (Kernel Candidate ~= intersection over regimes of Requirements(R))"
    refinement: "Given a more concretely operationalized six-regime comparison experiment with a single named proposition, a nine-item preserved substrate, and an explicit eight-question comparison protocol -- moving from methodology-in-principle toward an executable experimental design"
  - concept: "0372's Kernel-preserves-substrate/regimes-interpret principle and Assessment(p,context,time,basis) candidate"
    refinement: "Sharpened into 'epistemic provenance' as a candidate invariant, explicitly distinguished from mere uncertainty representation, and reframed via the two-dimensional Mathematical-vs-Kernel question split"
contradicts:
  - concept: "An uploaded synthesis document's claims that (a) 'the Kernel preserves raw evidence: observations, assertions, measurements' and (b) the Kernel invariant might be 'the set of possible worlds/states consistent with the evidence'"
    source: "this file's own critical review"
    resolution: "(a) rejected -- evidence is not raw/intrinsic but a relation requiring interpretation, 'raw evidence' is dangerous terminology; (b) downgraded from conclusion to untested hypothesis, since different regimes disagree about what 'consistent' means"
