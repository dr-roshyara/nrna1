about: >
  Reviews "the new findings in 06-08 and the D288 scope" and delivers a sequencing decision: Step 286
  (Ontology) and Step 287 (Invariants ℐ) should BOTH be written now, as RESEARCH ONLY (not canonical), while
  "D288 · Decision Procedures" remains governance-dependent closure, "Scoped, not executed" (already tracked,
  file 1005) -- and a fourth row, "Canonical Ontology," is explicitly "Not yet promotable."

  **THIS SEQUENCING CONVERGES THIS RECONSTRUCTION'S ALREADY-TRACKED THREE-WAY ROADMAP-NAMING CONFLICT
  (files 1002/1005 vs 1010 vs 1012) TOWARD ONE ADOPTED SCHEME**: 287 = Invariants ℐ (matching file 1012's
  scheme, not file 1010's "287=Qualify+Equality"), and "D288" is retained as the separate name for the
  decision-procedure-closure work (matching files 1002/1005), effectively demoting file 1010's alternative
  287/288 content-pairing. The research chain diagrammed: `285 (verification/projection) → 286 (Ontology) →
  287 (Invariants) → 288 (Decision-Procedure Closure: ≡/≈/≅_λ/Qualify)`.

  **INTRODUCES A GENUINELY NEW, QUANTIFIED MATHEMATICAL STRUCTURE, CITING A NEW CORPUS SOURCE ("THE Q-SERIES,
  Q4A")**: a five-axis epistemic state `Σ=(A,S,R,V,C)` with **"2240 states"** -- a specific cardinality this
  reconstruction has not previously seen for any Σ formulation -- plus a componentwise transition function
  `Σ_new=T(Σ_old,E)` and a candidate PRODUCT-ORDER structure for `K_{t+1}≻K_t`:
  `Σ_1⪯Σ_2 ⟺ A_1⪯_A A_2 ∧ S_1⪯_S S_2 ∧ R_1⪯_R R_2 ∧ V_1⪯_V V_2 ∧ C_1⪯_C C_2`. **This is a further, materially
  more elaborated addition to this reconstruction's already-tracked, escalating Σ-representation
  inconsistency** (previously tracked formulations: `Σ_min`, `Σ=(A,S,R,V,C)` without cardinality, `Σ=
  (Direction,Strength)`, `Σ-A`, `Σ={Sattva,Rajas,Tamas}`, `Θ_t`/`Mode_t`) -- notably, the five-letter
  labeling `(A,S,R,V,C)` matches one already-tracked prior formulation, but this file is the first to supply
  its exact state-count (2240) and a concrete product-order candidate.

  **DELIVERS A GENUINELY IMPORTANT DISCIPLINED WARNING against silently canonicalizing this new structure**:
  "286 must not freeze `Σ` as the final KnowledgeOS epistemic ontology merely because Q4A supplies it. The
  strongest current statement is: the corpus contains a five-dimensional epistemic-state construction with
  explicit componentwise transition functions. This establishes a substantially richer candidate epistemic-
  state ontology than the previously assumed `Σ₀`, but does NOT by itself establish that this construction
  is the canonical KnowledgeOS state model." Cites an already-existing corpus repair,
  `Σ=(A,𝒫({Sup,Ref}),R,V,C)`, which "must remain DERIVED/candidate, not corpus-canonical, exactly as your
  Step 08 correctly says" -- a further cross-reference to the not-yet-encountered "Step 08" bridge candidate.

  **Delivers the file's central epistemic-discipline distinction**: "The structure permits this invariant"
  vs. "KnowledgeOS has adopted this invariant" -- Step 287 must keep these separate.

  **Details Step 287's proposed "Invariant ℐ Research & Derivation Audit" methodology**: extract every
  corpus-stated invariant; classify as axiom/law/constraint/non-collapse-law/transition-invariant/type-
  invariant/equality-related-invariant; derive further invariants only when mechanical; mark each as
  `CORPUS`/`DERIVED`/`CANDIDATE`/`NORMATIVE`/`BLOCKED`; explicitly test dependency on `≡`,`≈`,`≅_λ`,
  `Qualify`,`Π`, the canonical-K choice, and Σ's unresolved component orders.

  **Closes with the required status line for both new steps**: "RESEARCH ARTIFACT — corpus reconstruction;
  normative promotion explicitly prohibited," and reaffirms the standing stop-gate (no new Sanskrit
  expansion, no invented equality procedure, no invented `Qualify`, no silent promotion of `Π`/`Σ`/the
  candidate order into architecture). Recommends Step 286 precede Step 287, since invariants should be
  derived against the newly reconstructed ontology, not the older 8-component model.
