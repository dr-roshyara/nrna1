defines:
  - concept: "EntityId=(Namespace,Value)"
    definition: "A typed identifier combining a namespace and a value, preventing the ambiguity of a bare identifier string that could plausibly denote any kind of entity; typed identifiers (EvidenceId, DecisionId, etc.) give compile-time protection against passing the wrong kind of identifier to an operation"
  - concept: "Claim EpistemicStatus (eight-value enum)"
    definition: "Candidate, Supported, Validated, Questioned, Contradicted, Rejected, Superseded, Unknown — a claim's epistemic status is tracked as a first-class, domain-controlled state distinct from any probability or confidence score attached to it (Status≠Truth)"
  - concept: "ModelRef=(ModelId,Version,ArtifactHash)"
    definition: "A model reference binding its logical identity (ModelId, Version) to a cryptographic or otherwise reliable hash of the actual deployed artifact, directly resolving the model-registry version-mismatch vulnerability discovered at 0631's Attack 36"
  - concept: "SemanticTypeSystem vs. ClassHierarchy"
    definition: "The essential artifact at this stage of the corpus's software derivation is a rigorously defined set of domain concepts and their semantics, not a committed object-oriented class hierarchy; the same semantics can be legitimately implemented via classes, records, algebraic data types, relational schemas, or immutable value objects"
  - concept: "InferenceAdapter"
    definition: "An LLM or statistical model is represented purely as an adapter (Infer:Context→CandidateResult) producing a CandidateClaim or DecisionProposal that must pass through domain validation before promotion; substituting one model/LLM for another requires changing only the adapter, never the Knowledge domain itself"
