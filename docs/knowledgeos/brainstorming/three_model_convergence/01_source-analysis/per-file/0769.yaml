defines:
  - concept: "The evidence-gating discipline for historical reconstruction (I.3's rule)"
    definition: "A chapter or section reconstructing historical/discovery narrative must not be written from memory, inference, or an existing condensed summary alone -- it requires its own dedicated full-read commission over the complete relevant source documents, establishing chronology and evidence before reconstruction is attempted, with independent review afterward; skipping this and inferring the historical story directly from prior familiarity is explicitly forbidden"
  - concept: "The DeepSeek research-intake protocol"
    definition: "External-AI-sourced research material must pass through a dedicated seven-step gate before any of its content can be incorporated into authoritative project output: recovery/preservation as evidence, per-connection classification, five-way categorization (established/compatible-interpretation/hypothesis/speculation/contradiction), independent verification, a formal intake decision gate, and only then a decision on incorporation -- a proposed idea from such material may become a tracked research hypothesis, but must never silently become accepted architecture merely by having been proposed"
  - concept: "'Findings, not accidental architecture changes' (production findings discipline)"
    definition: "A discrepancy or discovery surfaced during production work (e.g. the source material showing nine statuses where the ratified architecture compresses to four) must be explicitly recorded as a named finding with its own governance disposition options, never silently folded into or treated as an implicit revision of the ratified architecture without an explicit governance act"
