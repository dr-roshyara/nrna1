defines:
  - concept: "Agent≠Model (Agent≠LLM)"
    definition: "An agent is an operational actor (id, role, capabilities, authority, responsibility) that may use one or more underlying models/tools/humans as implementation details; replacing the underlying model does not necessarily change the agent's organizational identity"
  - concept: "Capability≠Authority≠Responsibility"
    definition: "Technical ability to perform an operation (Capability), permission to perform it (Authority), and ultimate organizational accountability for its consequences (Responsibility) are three separately represented properties; none implies either of the others"
  - concept: "Delegation≠AuthorityCreation"
    definition: "An agent delegating a task to another agent cannot thereby grant authority beyond what the delegator itself legitimately possesses; multi-hop delegation chains must remain fully traceable for authority to be provably established at any point in the chain"
  - concept: "LocalCorrectness⇏CollectiveCorrectness"
    definition: "A set of individually policy-compliant, individually optimal agents can jointly produce a degraded or risky collective outcome purely through interaction effects, even when no individual agent violates any rule — motivating the study of emergent multi-agent behavior as a distinct concern from individual-agent correctness"
  - concept: "Agent∈KnowledgeOS ecosystem, not Agent=KnowledgeOS semantic center"
    definition: "KnowledgeOS is shared governed semantic infrastructure that humans, AI agents, services, and systems all operate against as peripheral participants exchanging governed contracts; it must not be architected as a single centralized AI intelligence with agents as mere extensions of it"
