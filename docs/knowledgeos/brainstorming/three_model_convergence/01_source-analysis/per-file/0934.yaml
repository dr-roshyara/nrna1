defines:
  - concept: "The Knowledge Atma identity criterion"
    definition: "Two Knowledge Atmas 𝒦_1 and 𝒦_2 are identical (𝒦_1≡𝒦_2) if and only if all three of the following hold: their propositions are equivalent under propositional equivalence ≡_P (same truth condition), their referents are identical under referential identity ≡_R (same entities, dimensions, and values), and their truth conditions are equivalent under the same context. All three conjuncts are independently required"
  - concept: "The Knowledge Atma algebra's six named operations/relations"
    definition: "𝔄=(𝒦,≡,⊕,⊗,∼,≤) where 𝒦 is the set of all Knowledge Atmas; ≡ is the identity/equivalence relation (reflexive, symmetric, transitive); ⊕ is composition, forming a commutative monoid with identity element the empty knowledge 𝒦_∅ (associative, commutative, idempotent); ⊗ is refinement by a transformation δ, inducing a monotonic increase in informativeness and the derived order relation 𝒦_1≤𝒦_2 iff some δ transforms 𝒦_1 into 𓒦_2; ∼ is the contradiction relation (symmetric, non-reflexive, and explicitly a tolerance relation -- not necessarily transitive); and ≤ is entailment, forming a partial order (reflexive, transitive, antisymmetric) over 𝒦"
