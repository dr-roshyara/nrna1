defines:
  - concept: "The 'no retrospective contamination' rule"
    definition: "When a later concept Y (e.g. introduced at Step 150) is understood, with hindsight, as a generalization or refinement of an earlier concept X (e.g. introduced at Step 40), the historical reconstruction must never rewrite the earlier record as though X had originally meant Y. Instead the genealogy must explicitly preserve the actual sequence (X_40→Y_150), keeping the later interpretation visible as an interpretation rather than silently substituting it for the original historical content -- directly extending the arc's non-backdating discipline (0851) to the specific case of concept generalization over time"
  - concept: "The candidate statement: KnowledgeOS=Knowledge Transformation Governance"
    definition: "A firmer, though still explicitly uncertified (A_R, not A_H), candidate restatement of KnowledgeOS's essential purpose: rather than being a system that stores or manages engineering knowledge, it is a system that GOVERNS TRANSFORMATIONS of engineering knowledge, ensuring that as knowledge moves between people, tools, contexts, and time, the semantic, epistemic, temporal, and governance properties that the receiving context requires are either preserved or their loss is explicitly declared -- operating via a Transformation→Contract→Verification→Evidence pipeline embedded in a continuous Observe→Interpret→Decide→Act→Verify→Learn feedback loop. Its status remains provisional pending confirmation that this interpretation genuinely and demonstrably emerges from the actual Steps 1-182 historical evidence rather than being an appealing later synthesis"
