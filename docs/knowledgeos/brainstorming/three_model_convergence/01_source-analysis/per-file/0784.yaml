defines:
  - concept: "'The major architectural discovery' (semantic integration, not missing mechanisms)"
    definition: "An architecture audit that finds many individual engineering mechanisms already exist (logging, memory, governance artifacts, architecture documentation, verification checks, agent integrations) but discovers they are not related to each other through explicit, governed semantics (meaning, identity, lineage, authority, time) has identified a fundamentally different -- and typically smaller-scope -- problem than an architecture that is genuinely missing capabilities outright; the correct response is establishing semantic contracts and integrating existing mechanisms, not building large amounts of new functionality"
  - concept: "Graph should not silently become authoritative"
    definition: "When canonical domain knowledge K is represented in a graph structure G via a projection function G=P(K), the direction K→G is architecturally safe because G can always be rebuilt from K if lost; the reverse direction G→K is not guaranteed to be recoverable, so treating the graph itself as the authoritative source of truth (rather than a derived, rebuildable view over the canonical domain records) risks permanent, silent loss of authoritative state unless that choice is made explicitly and deliberately"
  - concept: "The five-category Delta taxonomy (D1-D5)"
    definition: "Remaining architectural work should be classified into five distinct categories rather than one undifferentiated backlog: D1 Formalization (the concept already exists implicitly but lacks an explicit semantic representation), D2 Integration (separate mechanisms exist but lack governed relationships connecting them), D3 Enforcement (a rule is defined but not mechanically enforced), D4 Evidence (a behavior exists but cannot yet be adequately proven with traceable evidence), D5 Missing capability (the concept itself has no current representation at all) -- each category implies a different, appropriately-scoped kind of remediation work"
  - concept: "Authentication vs. Authorization vs. Governance"
    definition: "Three distinct questions that must never be conflated: Authentication establishes who the acting entity actually is; Authorization determines what that specific, authenticated actor is permitted to do; Governance determines, independently of any specific actor, whether a given action should be permitted to occur at all under current policy -- a system can correctly authenticate and authorize an actor for an action that governance has not actually sanctioned as a category of action"
