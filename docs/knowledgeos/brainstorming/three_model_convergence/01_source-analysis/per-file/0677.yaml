defines:
  - concept: "LastWriterWins⇏MostAuthorized (concurrency-specific instance)"
    definition: "In a distributed system using last-writer-wins conflict resolution, a more recent but unauthorized policy write must not silently override an older, validly authorized one; write recency and epistemic/governance authority are independent dimensions, directly paralleling the corpus's already-established TemporalWriteOrder≠EpistemicPriority principle"
  - concept: "Compensation≠PerfectRollback"
    definition: "When a distributed multi-step action sequence fails partway through and a later step must be undone via a compensating action rather than a true transactional rollback, the compensation may not perfectly restore the pre-transaction state if intervening steps had irreversible external side effects (e.g. an executed money transfer); irreversible actions therefore require RequiredAssurance=f(Irreversibility,Impact,Criticality) proportional to their inability to be perfectly undone"
  - concept: "The concurrency-aware decision tuple D=F(E_{v_e},P_{v_p},M_{v_m},A_{v_a},C,R,t)"
    definition: "A decision made under concurrent, distributed execution must record not just its outcome but the specific evidence snapshot version, policy version, model version, and authority state against which it was validated, plus applicable constraints, the decision rule, and temporal context — explicitly unifying the corpus's temporal-reasoning (Step 83), information-sufficiency (Step 88), and formal-specification (Step 91) disciplines into one object specific to the concurrency case"
