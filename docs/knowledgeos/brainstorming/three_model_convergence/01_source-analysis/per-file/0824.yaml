title: "Step 197 -- Invariants, Conservation, and the Formal Transition System (CAPSTONE FORMAL-SYSTEM MILESTONE, delivers 0823's promised conservation test, CONTINUES I-series to I57): Delivers the Full State-Transition-System Object K=(S,T,I,L) and the Fundamental Rule ValidTransition⇒InvariantPreservation -- Delivers Conservation as a Formal Function Q(S_t)⊆Q(S_{t+1}) Distinguishing What Must Persist (Lineage, Provenance, Identity, Evidence) From What May Legitimately Change (CurrentStatus) -- Delivers Three New Invariants I55-I57 (Evidence Survives Reinterpretation, Revocation Preserves Historical Existence, Cross-Context Transfer Preserves or Records Semantic Transformation) -- Re-Engages the Krishna/Chapter-4 Lens Once More, Delivering 'Systemic Memory Can Exceed Local Actor Memory' and the Projection Function π_a -- Delivers 'Data Preservation Does Not Guarantee Semantic Preservation' as Possibly the Most Important Lesson From All Four Chapters -- Delivers the Proof-Obligation Framing Γ⊢τ:S_i→S_j and Determines ValidTransition(τ)=1 Rather Than Truth(p)=1 -- Delivers the DDD Aggregate-Discovery Method From Invariant Co-Change Rather Than Nouns -- Delivers an Eight-Question Falsifiability Test for the Architecture -- Opens Step 198's Composition/Saga/Workflow-Orchestration Boundary"
