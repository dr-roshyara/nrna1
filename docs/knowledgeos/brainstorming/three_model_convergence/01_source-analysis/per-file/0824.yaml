defines:
  - concept: "Conservation (in the KnowledgeOS formal transition system)"
    definition: "A property Q of the KnowledgeOS state that must satisfy Q(S_t)⊆Q(S_{t+1}) across every valid transition -- meaning the property can only grow or stay the same, never shrink or silently vanish; conservation applies to historical lineage, semantic provenance, identity, and evidence, but explicitly NOT to current/active status fields (e.g. a claim's Candidate→Confirmed→Refuted status legitimately changes), so the architecture must distinguish what is conserved (the record of what happened) from what is mutable (the current interpretation of what happened)"
  - concept: "'Systemic memory can exceed local actor memory'"
    definition: "The architecturally-disciplined translation of the Krishna/Atma continuity observation: rather than personifying any component as an omniscient oracle, the architecture can preserve HistoricalLineage and GlobalContext that no single current actor (human, AI agent, or service) possesses in its local/session memory, formalized as LocalKnowledge(a,t)⊆SystemKnowledge(t) without claiming the system itself is omniscient -- it simply retains a larger preserved lineage than any individual projection of it"
  - concept: "'Data preservation does not guarantee semantic preservation'"
    definition: "A concept or claim can survive transmission across bounded contexts as intact data (bytes, records, fields) while its MEANING is reinterpreted by the receiving context, because meaning is context-dependent and requires an explicit semantic mapping/contract to establish correspondence -- so preserving data alone is insufficient; cross-context transfer must either preserve semantic meaning under an established mapping or explicitly record that a semantic transformation occurred, flagged by the file as possibly the single most important lesson drawn from all four Gita-chapter lenses combined"
