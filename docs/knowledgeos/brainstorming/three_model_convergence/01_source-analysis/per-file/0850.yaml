defines:
  - concept: "Concept convergence vs. divergence"
    definition: "Convergence(k)=|IndependentOrigins(k)| measures how many genuinely independent reasoning paths (e.g. an experiment, a DDD analysis, a governance problem) each separately arrived at the same concept k -- high convergence is evidence that multiple lines of reasoning found the concept useful, but explicitly does NOT imply the concept is true (HighConvergence⇏Truth). Divergence(k) measures the number of distinct meanings a single term k carries across the corpus -- when Divergence(k)>1, the term is not one domain concept but likely represents multiple bounded-context-specific concepts sharing a name, making divergence itself a signal for discovering hidden bounded-context boundaries rather than a defect to be immediately resolved"
  - concept: "The three-object architecture-state model (A_H/A_R/A_F)"
    definition: "A mandatory three-way separation to prevent conflating fundamentally different epistemic claims about KnowledgeOS's architecture: Historical architecture (A_H) is what the actual engineering work had established by Step 182, evidenced by the real historical record; Reconstructed architecture (A_R) is what the complete body of evidence, once properly audited, suggests the architecture actually means (which may differ from A_H if the original work was itself confused or incomplete); Idealized/future architecture (A_F) is what the team now believes KnowledgeOS could or should become, an aspirational target. These three are explicitly required to remain distinct (A_H≠A_R≠A_F) even though they may overlap substantially, since collapsing them would let aspirational design silently masquerade as historical fact"
