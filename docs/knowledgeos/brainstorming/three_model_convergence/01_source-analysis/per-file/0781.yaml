defines:
  - concept: "NOT YET EVIDENCED (fourth conformance verdict)"
    definition: "A distinct verdict from ALIGNED, PARTIALLY ALIGNED, and CONTRADICTED, applied when the audit has found no evidence either confirming or refuting an architectural assertion -- explicitly required to prevent the silent slide from 'we have not seen evidence against it' to 'it exists'"
  - concept: "Checker≠Verification≠AssuranceResult"
    definition: "A Checker is the implementation (a script or tool); a Verification is the domain fact that implementation produces when run against an identifiable RuleID+Version+Evidence; an AssuranceResult may be a higher-level synthesis over multiple verifications -- a script that merely prints PASS without traceable rule/version/evidence identity is a TechnicalCheck, not yet a GovernedVerification"
  - concept: "Architecture Drift vs. Architecture Evolution"
    definition: "A difference between observed and declared architecture (D_A=A_observed△A_declared) is Drift only if it is unauthorized; if a governance act (e.g. a new Registry version) legitimately changes what is declared and the implementation subsequently follows, the resulting difference from the OLD declaration is Evolution, not Drift -- the audit must therefore be version-aware, comparing observed state against the currently-effective declaration, not an outdated one"
  - concept: "The ActionDisposition model"
    definition: "Rather than every Decision flowing directly into Action, a Decision first produces one of six dispositions -- ACT, REFRAIN, DEFER, ESCALATE, INVESTIGATE, or REQUEST_AUTHORIZATION -- with only ACT leading onward through Authorization to Action; REFRAIN and the other non-ACT dispositions terminate the chain in NoAction, making a legitimate decision not to act (or not yet to act) a first-class, representable outcome rather than a system failure"
