about: >
  Opens with an explicit methodological caution: "we should not invent a universal formula for 'evidence
  strength.' The mathematics should tell us what can be combined, what must remain separate, and where a
  domain policy enters." Executes "Step 3 -- the Evidence Assessment Algebra" from input
  `(ℰ,G_E,P,C,ρ)` to output `EA_ρ(ℰ,G_E,P,C)`, "an Evidence Assessment, not merely a number."

  **Formalizes Evidence Assessment as an eight-component structured object**
  `EA=(S^+,S^-,U,Q,V,D,X,Π)` (Supporting evidence, Opposing evidence, Uncertainty, Quality assessment,
  Validity/temporal assessment, Dependency structure, Context/applicability, Provenance), explicitly
  excluding Truth. **Delivers the file's first governing principle**: support and opposition must never be
  collapsed via subtraction (`S(P)=S^+-S^-`) since that destroys information -- a worked example
  (`S^+=0.9`, `S^-=0.8`) shows the correct reading is NOT `S=0.1` but "there is substantial evidence on both
  sides," i.e. an active conflict, formalized as `Conflict(P)=True` iff `S^+>0∧S^->0`, with the full
  structured conflict object `C=(E^+,E^-,R,Ctx,Status)` preserved for Zero's explainability.

  **Formalizes a normalization function** `N_ρ:ℰ->ℰ'` performing identity resolution, provenance
  resolution, semantic classification, relevance determination, temporal validity assessment, dependency
  classification, and polarity determination, delivering the architectural invariant "Aggregation must
  occur after normalization." **Formalizes an evidence contribution vector**
  `q(e,P,C)=(r,q_s,q_r,q_t,q_c,q_p)` (Relevance, Source quality, Reliability, Temporal validity, Contextual
  applicability, Provenance quality), worked through a concrete counterexample (two evidence items sharing
  identical authority/currency/provenance but differing only in relevance) showing a single collapsed
  "quality=0.9" score would hide the difference -- crystallized as `Quality≠Relevance`,
  `Reliability≠Validity`, `ProvenanceQuality≠SourceAuthority`.

  **Delivers a contribution-filtering function** `F_ρ(e,P,C)` returning zero contribution for irrelevant
  evidence while the evidence itself REMAINS STORED -- `NonContributing≠Nonexistent`. Reuses and
  reconfirms the aggregation equivalence class `[e]_∼O` (0537's ℰ/∼ construction) for same-underlying-
  observation evidence, and reconfirms (per 0538) that `Corroboration_ρ(e_1,e_2)>0` for independent
  evidence is "a policy operation, not a universal mathematical law."

  **Delivers five formal algebraic property requirements for any aggregation operator**: Permutation
  invariance (arrival order must not matter), Duplicate invariance, Monotonicity (scoped specifically to
  the support-only measure under added independent supporting evidence), Boundedness, and Dependency
  sensitivity (derived evidence must not automatically produce the same increment as an independent
  observation). **Delivers an important sharpening of the monotonicity requirement**, extending 0536's
  earlier nuance: `SupportAggregation` may be monotonic with respect to additional supporting evidence
  alone, but `CompleteAssessment` need NOT be monotonic overall, since newly discovered contradictory
  evidence can legitimately change (including decrease) the overall assessment.

  **Delivers the file's central and most consequential formal result**: Evidence Assessment is NOT a
  scalar algebra. The real mathematical structure is `EA_ρ:(ℰ,G_E,P,C)->𝒜` (a space of structured
  assessments), with any scalar `s∈[0,1]` being merely one possible, optional PROJECTION
  `π_s:𝒜->[0,1]` -- explicitly named "a very important result," reformulating the corpus's Evidence
  pipeline as `Evidence -> Evidence Assessment -> optional -> scalar view`
  (`ScalarScore=π_ρ(EvidenceAssessment)`), confirming "the scalar is derived rather than fundamental."

  **Delivers a DDD `EvidenceAssessment` aggregate** (AssessmentId, Proposition, Context,
  SupportingEvidence, OpposingEvidence, DependencyGraph, QualityAssessment, UncertaintyAssessment,
  ValidityAssessment, AssessmentPolicy, AssessmentBasis, CreatedAt) with an explicit aggregate invariant:
  "An EvidenceAssessment must preserve the evidential basis from which its assessment was produced" --
  never storing a bare `confidence=0.91` without the ability to reconstruct "why." Formalizes assessment
  provenance/reproducibility: `Basis(EA)⊆ℰ`, `Policy(EA)=ρ`, `Context(EA)=C`, `EA=f_ρ(E,C)`, with
  `EA_{ρ_1}≠EA_{ρ_2}` a legitimate outcome across different policies.

  **Works a rich four-evidence Nexus-version example** (API observation, filesystem inspection, LLM
  summary of the API observation, and a stale old architecture document reporting a different value),
  producing a fully structured natural-language assessment (supporting observations, derived support,
  opposing evidence, dependency, temporal staleness, historical-vs-current conflict status, qualified
  overall support) explicitly contrasted with a bare `P(Nexus=3.69)=0.93` scalar -- "notice how much more
  information this contains."

  **Delivers the file's second major architectural result -- a four-layer pipeline distinguishing three
  previously-conflated domain concepts**: `EvidenceAssessment≠Conclusion≠Decision` -- Evidence Assessment
  answers "what does the evidence support?"; Conclusion answers "what proposition do we currently accept?";
  Decision answers "what should we do?" -- formalized as `Evidence->Assessment->Conclusion->Decision`,
  explicitly NOT `Evidence->Decision` directly. **Delivers four matching named DDD context boundaries**:
  Evidence Context (what evidence exists and how it relates), Assessment Context (how evidence bears on a
  proposition), Knowledge Context (what assertions are currently held in the Knowledge State), and
  Decision Context (what action should be taken under a purpose/policy) -- "extremely important for DDD."

  **Precisely repositions Zero, Lord, and Sārathi within this refined architecture**: Zero does not itself
  decide truth -- it detects EvidenceDeficiency, Conflict, InsufficientSupport, Staleness,
  UnknownDependency, and other discrepancies, formalized as
  `Zero:KnowledgeState+EvidenceAssessment+IdealState->Findings`; Lord asks what additional evidence would
  most reduce a detected discrepancy, worked through a concrete example ("Current version not
  independently verified through deployment inventory" -> "Acquire deployment inventory evidence"),
  explicitly "much stronger than 'search for more information'"; Sārathi takes `(Δ,EA,I,P)` and selects
  from a concrete seven-item action vocabulary (Investigate, AcquireEvidence, ResolveConflict,
  RefreshEvidence, ClarifyContext, ReviseIdeal, AcceptUncertainty) -- "Sārathi does not manufacture
  evidence."

  **Closes with a comprehensive seven-item "established" summary** (Evidence≠EvidenceAssessment;
  EvidenceAssessment≠Conclusion; Conclusion≠Decision; Support^+≠Support^-; Aggregation≠Inference;
  Dependency must precede aggregation; StructuredAssessment is fundamental) against one item still
  deliberately left open -- the universal aggregation operator has still not been selected, explicitly
  judged correct: "we now have enough structure to evaluate candidate operators rather than forcing one
  into the kernel." **Names "Step 4"**: define the governing KnowledgeOS axioms FIRST, then test candidate
  aggregation operators (max, mean, weighted sum, Dempster-Shafer, Bayesian, possibility theory, belief
  functions) against them via a rigorous six-step methodology (define axioms; construct counterexamples;
  test frameworks; identify universal properties; identify policy-dependent properties; identify
  kernel-vs-optional-module placement) -- posing the corpus's sharpest formulation yet of its central open
  question: does KnowledgeOS need one evidence calculus, or a family of admissible calculi?
