    refinement: "GROUNDS both directly in Shannon's actual mathematics (entropy, equivocation H(X|Y), mutual information I(X;E)=H(X)-H(X|E)) rather than analogy -- a genuine convergence event, the first time this sub-arc's independently-proposed entropy formulas are shown to trace to a single primary mathematical source rather than remaining independent resemblance-based proposals"
  - concept: "0259/0264's context/time-dependent epistemic state proposals (EpistemicState(P,t,c,s), S(P,t,c))"
    refinement: "Grounds via Shannon's Markov-source modelling and Weaver's identification of context as core to semantic communication; generalizes to K=K(P|C,T,D)"
  - concept: "The corpus's temporal-determinism work"
    refinement: "Adds the explicit reframing that a claim's truth-value drift over time (TRUE->UNKNOWN->FALSE) reflects context change, not logical contradiction"
