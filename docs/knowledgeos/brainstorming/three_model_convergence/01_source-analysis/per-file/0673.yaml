defines:
  - concept: "SufficientFor(D_1)⇏SufficientFor(D_2)"
    definition: "A knowledge representation (e.g. a summary) that is decision-sufficient for one specific question or decision is not automatically sufficient for a different question, even if both concern the same underlying source material; sufficiency claims must always be scoped to a specific question, model, and assurance context"
  - concept: "The compression-safety checklist (Truth, Provenance, Time, Uncertainty, Scope, Authority, DecisionSemantics)"
    definition: "A safe knowledge-compression or summarization transformation must preserve at minimum these seven semantic dimensions; a summary that preserves only a bare conclusion while discarding any of these dimensions constitutes UnsafeKnowledgeCompression regardless of how accurate the conclusion itself is"
  - concept: "¬K(P)⇏K(¬P) (Negative Knowledge under the open-world assumption)"
    definition: "The absence of found evidence for a proposition P (not known to be true) does not license concluding that P is known to be false; KnowledgeOS must adopt the open-world assumption (NotFound⇒Unknown) rather than the closed-world assumption (NotFound⇒False) for search/retrieval results, since the search space is generally not provably complete"
  - concept: "MinimalForCurrentModel≠SafeForFutureUse"
    definition: "The smallest evidence set sufficient to answer a question under the current model and policy may omit information that becomes necessary once the model or policy changes; minimality optimized for present needs is not automatically safe for long-term retention, motivating tiered preservation with authoritative raw evidence kept reconstructable regardless of current sufficiency calculations"
  - concept: "Embeddings are never authoritative knowledge"
    definition: "A derived embedding vector z=f(X) is useful for similarity search and candidate retrieval but must never be treated as the source of truth or as authoritative evidence itself; the safe architecture routes embedding-based retrieval through authoritative evidence before reasoning (Embedding→CandidateRetrieval→AuthoritativeEvidence→Reasoning), never directly from embedding to truth"
  - concept: "Information Loss Budget (L(T,D)≤L_max)"
    definition: "A knowledge transformation T's acceptable information loss relative to a protected decision D can be empirically tested and bounded by a governance-set maximum (e.g. the transformation must not change the resulting decision in more than L_max fraction of tested cases); this reframes summarization/compression quality assessment from a subjective judgment into a testable engineering assurance criterion"
