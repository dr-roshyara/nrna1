about: >
  Opens Step 33 directly executing 0612's close, delivering the file's central rejection: the naive
  multiplicative shortcut `Confidence_{total}=Confidence_1×Confidence_2×Confidence_3` is "generally
  wrong," with the correct propagation depending on what the uncertainty represents and the dependencies
  between quantities. Delivers a foundational seven-type uncertainty taxonomy (Measurement, Sampling,
  Parameter, Model, Prediction, Epistemic, Aleatory), and the file's central formal separation, explicitly
  called "foundational": **`Randomness≠LackOfKnowledge`** -- Aleatory variability (inherent process
  variation) formally distinguished from Epistemic uncertainty (incomplete knowledge), worked through a
  concrete traffic-variability-vs.-unknown-traffic-distribution example.

  **Delivers the file's central formal deliverable -- rigorous error propagation via the Jacobian**:
  `Var(Y)≈JΣJ^T` for `Y=f(X_1,...,X_n)`, explicitly identified as immediately exposing why naive
  independent multiplication of confidence values is inadequate. Delivers the covariance identity
  `Var(X+Y)=Var(X)+Var(Y)+2Cov(X,Y)`, formalizing **`Dependence matters`**. Delivers the corpus's evidence-
  duplication problem grounded in explicit covariance terms (`E_1=f(S)`, `E_2=g(S)` sharing source `S`
  implies `E_1⊥̸E_2`), and **the file's central architectural result**: **`Provenance→DependenceStructure→
  CorrectUncertaintyPropagation`**, explicitly named "a major result" -- provenance is not merely for audit
  but mathematically necessary for correct uncertainty combination.

  Delivers Bayesian updating explicitly typed and non-universal (requiring a valid probabilistic model,
  never the default inference engine), and Frequentist uncertainty preserved as a genuinely distinct
  framework, directly reconfirming 0606's `ConfidenceInterval≠CredibleInterval` separation. Delivers
  Interval uncertainty and Set-valued uncertainty as legitimate non-probabilistic representations
  (`Bounded≠ProbabilisticallySpecified`), and a formal `PartiallyIdentified` status
  (`θ∈Θ_I`), explicitly "stronger than simply saying 'uncertain.'" Delivers a worked deterministic-
  interval-propagation example (`10≤X≤20, Y=2X⇒20≤Y≤40`) and a formal Dependency graph/correlation matrix
  treatment, worked through a concrete common-calibration-error example (`Cov(X_1,X_2)>0`).

  Delivers Model uncertainty formally distinguished from Parameter uncertainty, with Model averaging
  explicitly requiring a genuine probabilistic model over models (never automatic), and Structural
  uncertainty (whether a relationship exists at all) formally distinguished from parameter uncertainty.
  Delivers Causal uncertainty reconfirming `Association≠Causation` ("prevents another major AI reasoning
  error") and formal `CausalIdentifiability` for competing causal-graph structures.

  **Delivers a rigorous worked counterexample demonstrating naive interval propagation through nonlinear
  functions is genuinely wrong**: for `Y=X²`, `X∈[-2,3]`, naive endpoint transformation
  (`[(-2)²,3²]=[4,9]`) is INCORRECT -- the true range is `[0,9]` (since `X=0` is achievable within the
  interval) -- demonstrating mathematical transformations must respect the actual structure of the
  uncertainty, not merely its boundary values. Delivers formal Monte Carlo propagation as computationally
  feasible for well-specified probabilistic models, paired with **the file's key epistemic caution,
  explicitly elevated to a new principle**: **`Computational precision≠Epistemic precision`** -- Monte
  Carlo sampling from an unjustified distribution produces precise-looking results that remain
  fundamentally unjustified; simulation cannot manufacture missing information.

  **Delivers the file's second central formal deliverable -- "Confidence Inflation" explicitly named and
  formally blocked**: a worked cascading-confidence-increase example (`0.8→0.9→0.95` across
  evidence/inference/decision stages with no corresponding new justification), formalizing the Anti-
  inflation rule: **`CertaintyIncrease requires Evidence or ValidInference`** -- LLM reasoning alone can
  never justify a certainty increase. Delivers a formal five-value `UncertaintyType` enum
  (`U_{prob},U_{interval},U_{set},U_{qualitative},U_{unknown}`), with Illegal uncertainty conversion
  explicitly forbidden (`Interval↛Probability` without an explicit modeling assumption), reconfirmed as
  "epistemic type safety again," directly connecting to 0612's type-safety machinery.

  Delivers Assumption formalized as a first-class object with its own dependency-graph node, and formal
  Sensitivity analysis (local, via partial derivatives, and global, via variance decomposition),
  identifying which assumptions dominate a conclusion's fragility and thereby prioritizing validation
  targets. Delivers formal `EpistemicRisk` (`Risk(D)=E[Loss(D,Y)]`, extended to include model uncertainty
  itself), with `Risk≠Uncertainty` (`Risk=f(Uncertainty,Consequences)`), worked through a concrete same-
  probability-different-risk example (a 1% failure probability being negligible for a harmless experiment
  but unacceptable for a catastrophic system).

  Delivers a formal decision-theoretic loss/expected-loss framework and Robust decision-making (worst-case
  optimization over a set of plausible distributions `𝒫` when no single probability model is sufficiently
  justified). Delivers the reconfirmed principle that partial knowledge can support action --
  **`DecisionQuality depends on required epistemic resolution`**, not perfect knowledge -- and
  `RequiredEvidence=f(DecisionCriticality)`, explicitly connecting DDD (criticality), statistics
  (uncertainty), and governance (required assurance) as three cooperating, non-overlapping ownership
  domains. Delivers an explicitly domain-specific `UncertaintyBudget` (`U(D)≤U_{max}(Context,Decision)`,
  never a universal threshold).

  **Delivers the file's most subtle and important single epistemic-honesty result, worked through a
  careful example**: additional evidence can legitimately INCREASE reported uncertainty when it reveals a
  previously-unknown source of variation or model oversimplification, explicitly NOT classified as worse
  knowledge -- formalized as **`Lower reported uncertainty is not always evidence of better knowledge`**,
  with the explicit design preference **`AccurateUncertainty over ArtificialCertainty`**. Delivers
  `EvidenceQuality≠ZeroUncertainty`, reconfirming that irreducible aleatory variance can persist even under
  perfect measurement.

  **Delivers ten labeled falsification experiments (A-J), ALL PASS**: same-source evidence naively treated
  as independent (`DependenceDetected`/`IndependenceUnknown` expected); an interval silently converted to a
  uniform distribution (`InvalidConversion`); an unknown distribution fed to Monte Carlo
  (`NoSimulation` unless explicitly specified); correlated inputs treated as independent
  (`DependenceWarning`); an unsupported LLM confidence jump (`UnsupportedCertaintyIncrease`); new evidence
  legitimately increasing reported uncertainty (correctly not auto-classified as worse); a low-probability
  but catastrophic-consequence decision correctly flagged as potentially unacceptable; disagreeing models
  correctly mapped to decision sensitivity; an invalidated assumption correctly triggering
  `Closure(A_1)` impact analysis; a genuinely exact deterministic transformation correctly yielding zero
  output uncertainty only when both the function and its inputs are truly exact.

  **Delivers Step 33's verdict**: **"STEP 33 — PASS,"** with **ten formally numbered architectural
  principles**: (1) Uncertainty is typed; (2) Dependence is first-class (evidence independence must never
  be assumed merely from separate record identity); (3) Precision is not knowledge
  (`ComputationalPrecision≠EpistemicPrecision`); (4) Certainty cannot be manufactured (requires evidence,
  valid inference, or explicit model assumption); (5) Unknown distributions remain unknown
  (`UnknownDistribution≠UniformDistribution`); (6) Model uncertainty is real uncertainty
  (`ParameterUncertainty≠ModelUncertainty`); (7) Risk is consequence-weighted uncertainty; (8) Evidence
  can reduce OR reveal uncertainty (`KnowledgeImprovement≠AlwaysLowerUncertainty`); (9) Uncertainty must
  propagate through dependencies with no universal multiplication rule; (10) Critical decisions require
  explicit epistemic thresholds, with exceeded thresholds barring automatic execution.

  Delivers the corpus's most complete uncertainty-annotated architecture diagram to date, a four-component
  schematic uncertainty decomposition (`U_D=U_{measurement}+U_{sampling}+U_{model}+U_{state}`, explicitly
  not always additive but conceptually powerful), and a formal "KnowledgeOS epistemic contract":
  transformations must preserve uncertainty semantics, source, dependencies, and type -- they may change
  the uncertainty, but never silently.

  **Delivers a self-reflective five-step progression recap**, explicitly framed as "a coherent progression
  rather than a collection of disconnected ideas": Step 29 (Consistency) → Step 30 (External Validation) →
  Step 31 (Formalization) → Step 32 (Epistemic Algebra) → Step 33 (Uncertainty Propagation).

  **Closes cleanly, with no renumbering collision, directly resolving the long-tracked question of where
  the resource-allocation/Next-Best-Information topic would finally land**: originally proposed as "Step
  31" at 0609, deferred to a future "Step 32" at 0610, then bypassed a second time at 0611 in favor of a
  differently-numbered Epistemic Algebra step -- it now finally appears as **"Step 34 — Information
  Acquisition and Value of Information,"** targeting the formula
  `VOI(I)=ExpectedLoss_{without I}-ExpectedLoss_{with I}-Cost(I)`, explicitly emphasizing "information has
  value only insofar as it can change or improve a decision." No actual code execution reported.
