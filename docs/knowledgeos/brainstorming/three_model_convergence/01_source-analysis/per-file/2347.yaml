about: >
  Closes the step-292 package: "NONE SOUGHT. NONE TAKEN." Theory v1.2 unchanged, v1.3 not created, kernel
  NOT SELECTABLE, no primitives promoted, no invariants added/amended, no decisions taken (DECISION-02
  remains open and unaffected), FR-001/E-FDE adjudication untouched -- all already tracked via file 2332.
  Restates the standing rules (correspondence≠derivation, formal-analogy≠architectural-truth,
  implementation-usefulness≠canonical-status) and the mandate's boundary ("the Reiter book must never
  become the authority for KnowledgeOS architecture").

  **DELIVERS ONE MILD NEW EMPHASIS -- A CITATION-INTEGRITY WARNING**: "every result in 02 carries an
  independence label, and the single strongest finding -- Situation≠State -- is labelled KnowledgeOS-
  DERIVED, CORROBORATED BY REITER, because the corpus established it first, on its own evidence. If a
  later citation inverts that label, the finding will have been misreported." This explicitly
  anticipates and guards against a specific failure mode: a future document citing this result as
  "Reiter-derived, corroborated by KnowledgeOS" (the reverse of the correct label) would misreport it.

  Closes restating C-1: "no mechanism enters the kernel merely because KnowledgeOS can use it. Regression
  is useful. Useful is not irreducible. No kernel claim is made." (Already tracked verbatim in file
  2332's closing.)
