defines:
  - concept: "Contextual trust"
    definition: "Trust(a,d,c,t) — trust in an agent is a function of the domain, context, and time being evaluated, never a universal per-agent scalar"
  - concept: "Competence(a,q)"
    definition: "A per-question-type competence assessment for an agent, explicitly richer and more meaningful than a global trust score — an agent can be highly competent for one question type and explicitly insufficient for another (e.g. an LLM: high for synthesis, not sufficient for authoritative approval)"
  - concept: "EvidenceQuality≠NodeCount"
    definition: "The formal distinction between KnowledgeOS's epistemic-justification question and Byzantine consensus's agreement-despite-faults question — a small number of high-quality, directly-acquired evidence sources may outweigh a larger number of low-quality or derivative ones"
  - concept: "Corroboration principle (the key result of 25U)"
    definition: "Corroboration should be measured in independent information, not in number of agents — directly generalizing the 25N/25C evidence-independence discipline to the multi-agent setting"
