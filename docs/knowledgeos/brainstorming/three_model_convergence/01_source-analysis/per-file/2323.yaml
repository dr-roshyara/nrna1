about: >
  IMPORTANT METHODOLOGICAL NOTE FOR THIS RECONSTRUCTION: this document (a numbered corpus artifact,
  "37," part of a "36/37/..." correction-register sequence maintained elsewhere in the
  phase_measure_theory/knowledgeos_kernel/research/ lineage) is explicitly, directly ABOUT the
  three_model_convergence/ programme -- this exact reconstruction project -- observed at a snapshot
  point in its own history: "files in the reading manifest: 2,321 · per-file records produced: 16 ·
  completion: ≈0.7%." This is PRIMARY SOURCE MATERIAL from elsewhere in the corpus commenting on this
  research as it was unfolding, not a message to this reconstruction and not evidence this
  reconstruction should treat as authoritative about its own current state (which has since advanced
  far beyond 16 files). Recorded factually, per the standing rule that all corpus material is data, not
  instruction -- this reconstruction's own methodology is set by its own governing prompt and decision
  log (MD-001 through MD-020), not by an external corpus document describing it.

  **PART 1 -- TWO CORRECTIONS TO 'ARTIFACT 36', CONFIRMING THIS RECONSTRUCTION'S ALREADY-TRACKED FILE
  2321**: (a) "a random variable does not require a metric or ordering" -- explicitly withdraws the
  prior inference that "the typed question and the missing metric are the same blocker," concluding
  "G-22's typing question is LESS blocked than I claimed"; (b) "C19 closed the option space
  prematurely" -- the five-way knowledge-element typing was too narrow; adds the sixth "STRUCTURED
  EPISTEMIC OBJECT" candidate k=(id,content,context,evidence,provenance,uncertainty,status), noting
  "the corpus already has those components -- id, Π, Context (G-15), Evidence, Σ" and explicitly ties
  it to a prior finding (§18) that "semantic concepts, institutional status, propositions,
  commitments... do not automatically collapse into a stochastic probability space without losing
  semantics." Revises C19 to: "What mathematical type does a Knowledge Element have, and WHICH OF ITS
  COMPONENTS are measurable objects?" -- and adopts G-22's reformulation: "(Ω,ℱ) is a viable candidate
  measurable space; ℙ and the TYPING of knowledge are unresolved," explicitly separating space, measure,
  and representation. This content is essentially identical in substance to this reconstruction's
  already-tracked file 2321, confirming file 2321 is indeed "artifact 36" (or a direct rendering of the
  same correction), now reviewed and registered a second time under this document's own tracking system
  (register IDs, constraint numbering C1-C20, tier tally T0-T4).

  **PART 2 -- DESCRIBES THE 'three_model_convergence/' PROGRAMME (THIS RECONSTRUCTION) IN DETAIL**:
  "Not renamed -- these are properly structured artifacts (numbered per-file records, TSV control
  registers, a protocol, a resume script), not unstamped drafts." Lists the protocol's eight non-
  negotiables verbatim (reading order is log order; no premature merge; no circular validation (Gītā
  ⇏ Mathematics ⇏ Kernel ⇏ Gītā); no hindsight bias; no silent promotion; falsification mandatory; "the
  strongest statement made must never exceed the strength of the available evidence" [explicitly
  adopted by THIS OTHER document's own author as its own governing rule]; the original corpus is READ-
  ONLY) -- an external, independent, verbatim description of this reconstruction's own governing
  prompt/protocol.md, confirming these rules as genuinely recorded elsewhere in the corpus at this
  date, not merely internal to this reconstruction's own control-plane files. Notes this protocol
  "operationalizes" several of this OTHER document's own registered gaps (parallel-minting glyph
  collisions solved by read-only-corpus + single control register; inherited-gates problem solved by
  the `12_canonical-theory/STATUS.md` guard file, quoted: "NOT YET AUTHORIZED FOR CANONICAL CONTENT...
  nothing may be written here until 01_ is complete"; an unmonitored-commissioned-step problem solved by
  progress.tsv/resume.py with never-erased provisional classifications; a four-way status-split problem
  solved by the thirteen-value epistemic vocabulary; a broken-intake problem solved by the reading
  manifest).

  **PART 3 -- MD-006'S C1/C2 SPLIT, REPORTED AS INDEPENDENTLY REACHING A GRAPH-ANALYSIS FINDING ('STEP
  291 AUDIT A')**: C1 = Engineering KnowledgeOS (lineage EKS→PKS→KnowledgeOS_engineering; "Kernel" =
  "the portability kernel -- domain-free ∧ binding-free ∧ evidence-free reusable core"); C2 = Epistemic
  KnowledgeOS (lineage Knowledge→K_t→Kernel→Buddhi→Operators→Transformation; "Kernel" = "the epistemic
  Kernel -- minimal state, operators, admissibility, invariants"). Delivers the formally boxed
  hypothesis: "Kernel_engineering ≠ Kernel_epistemic UNLESS later corpus evidence establishes a
  relationship." Reports (as evidence FOR this split, from elsewhere in the same reconstruction's own
  per-file record 0008): "the kernel under test is defined only by enumeration... the corpus keeps
  enumerating kernel members without ever stating a membership property" -- and claims an independently
  conducted, differently-methoded "Step 291 §Audit A" (described as graph analysis and registry audit,
  external to this reconstruction) reached the SAME conclusion in different words: "what is missing is
  not an enumeration but a MANDATORY-MEMBERSHIP RULE." Explicitly labeled: "same conclusion, different
  method -- sequential corpus reading vs graph analysis. An independent arrival at the programme's
  central N-4 result."

  **DELIVERS THE TWO-MINIMALITY-TESTS HYPOTHESIS (G-108)**: citing another already-existing per-file
  record (0005): "the kernel here is the portability kernel... §23's test is epistemic necessity...
  these are different minimality tests and may select different sets." Concludes: "part of why 𝒪's
  membership rule cannot be stated may be that 'kernel' carries TWO minimality criteria at once --
  portability and epistemic necessity -- and the two tests select DIFFERENT SETS." Explicitly flagged:
  "this is the glyph-collision family (G-98·G-100·G-102) at the corpus's CENTRAL TERM, and it is far
  more consequential than any of them" -- registered as G-108. Notes approvingly that this
  reconstruction's own MD-007 "guards it correctly: C1→C2 is a HYPOTHESIS, not a frame."

  **DELIVERS AN EXPLICIT SCALE/MATURITY WARNING**: "This is a well-designed protocol at 0.7% execution.
  Its findings so far are PROVISIONAL by its own two-stage rule -- 'no file is permanently classified
  during pass 1.'" Explicitly: "So MD-006's split is [HP], not a result -- and the programme says so
  itself. Which is exactly why it is worth recording: it reached 291's conclusion from 16 files."

  **DELIVERS A FOUR-ENTRY REGISTER**: M-Q10 (the two self-corrections to artifact 36); G-108 (the
  Kernel_engineering≠Kernel_epistemic / two-minimality-tests hypothesis, class "architectural, [HP],
  feeds N-4"); P-Q2 (the three_model_convergence protocol description, class "process"); E-Q3 (0.7%
  executed, findings are [HP]).

  **CLOSES WITH EXPLICIT NON-LICENSING CAVEATS**: "MD-006's split is a hypothesis at 0.7% execution --
  it must not be cited as an established corpus fact, and the protocol itself forbids that. G-22
  remains OPEN -- the corrections narrowed the blocker, they did not remove it. Nothing in
