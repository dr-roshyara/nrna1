about: >
  Direct follow-on to 0208, applying Zero/DDD/Wisdom lenses to the same Hernán & Robins material.
  Explicitly self-labeled as the research's OWN synthesis, not a claim the source book makes. Central
  discovery: causal inference answers "what would happen under intervention X?" while a separate
  WISDOM layer answers "should we therefore do X?" — these must not collapse into one model, since
  Evidence/Knowledge/Decision/Wisdom-assessment have different invariants (traceability / justified
  inference / legitimate authority / uncertainty-consequence-applicability accounting respectively).
  Proposes a full learning-loop domain model (Observation->Evidence->Question->Inference->Knowledge->
  Wisdom->Decision->Action->Outcome->new Observation) and an AI-governance principle: AI supplies
  epistemic scaffolding, never wisdom or decision authority itself.
introduces:
  - concept: "Three-lens triangle: Zero (what can be claimed?) / DDD (what are the domain concepts/boundaries?) / Wisdom (what should we do given what we know?)"
  - concept: "Deeper domain reframing: not 'statistics' or 'causal inference' but 'evidence-based reasoning about interventions and decisions'"
  - concept: "Knowledge != Wisdom distinction: causal knowledge answers 'what happens under X?'; wisdom answers 'should we do X?' — a major architectural separation"
  - concept: "ConsequenceAssessment concept (benefit/cost/risk/externality/reversibility/time-horizon/affected-parties) as required before wisdom can act on causal knowledge"
  - concept: "Applicability: causal effect valid in population A does not imply it should be applied to population B"
  - concept: "Two distinct uncertainty types that must not be conflated: epistemic uncertainty (do we know X causes Y?) vs. decision uncertainty (is acting on X worthwhile?)"
  - concept: "'DO NOT ACT YET' as an explicit wisdom-level output distinct from a causal recommendation — epistemic restraint"
  - concept: "Reversibility / rollback cost / option value as a decision-theoretic layer above causal inference"
  - concept: "Decision Experiment / LearningExperiment domain object (Question/Hypothesis/Intervention/Comparator/Population/SuccessCriteria/ObservationPlan/RiskConstraints/TimeHorizon/ExpectedEvidence/DecisionRule)"
  - concept: "FACTUAL/EMPIRICAL -> CONSEQUENCES -> NORMATIVE/GOVERNANCE -> Decision separation principle: causal analysis cannot determine what ought to be valued"
  - concept: "AI-overreach guard: AI may assist every stage (evidence, questions, hypotheses, assumptions, analyses, uncertainty, options, consequences) but must not silently collapse them into a decision"
  - concept: "Refined workflow: Observation->Evidence->Claim->Inquiry->Assessment->Knowledge->Wisdom Assessment->Decision->Action->Outcome, distinguishing a 'verdict' (evidence insufficient) from a 'decision' (run a controlled pilot)"
  - concept: "Candidate bounded contexts: Evidence / Reasoning / Decision, explicitly flagged as DDD hypothesis, not architectural fact"
