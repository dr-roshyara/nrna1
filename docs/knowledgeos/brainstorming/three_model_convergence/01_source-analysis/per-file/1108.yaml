about: >
  "31 — STATE VOCABULARY vs FIELDS · the OPERATOR CONTRACT · and SIX collisions in one table," verdict "A
  7-slot OPERATOR CONTRACT that shapes five of the pieces `291` found missing. A SEVENTH independent arrival
  at non-monotonicity -- with a real sharpening: the transformation law belongs to the OPERATOR, not to `K`.
  And SIX new glyph collisions in a single table, one of which would corrupt Decision 3. Plus a correction to
  my own artifact `30`."

  **DELIVERS A DISCIPLINED SELF-CORRECTION AGAINST ITS OWN PRIOR ARTIFACT (`30`)**: the eight ratified
  primitives are correctly named "'the state VOCABULARY; they are NOT eight equal fields'" by the source, but
  then written as an 8-tuple `K_t=⟨E_t,S_t,V_t,O_t,P_t,R_t,Π_t,A_t⟩` -- "the notation CONTRADICTS the caution
  one line above it," and forbidden by the already-tracked `258.35` extensional-not-compositional principle.
  Discovers this reconstruction's own file-30 (not yet directly read in this sequence) carries a MILDER
  version of the same defect (writing the eight as a set rather than a tuple), and corrects it at source:
  "the eight are the VOCABULARY IN WHICH state is expressed -- not the state's components, and not its
  fields."

  **DISCOVERS SIX GLYPH COLLISIONS IN A SINGLE TABLE, THE FIRST INSTANCE OF A SINGLE ARTIFACT PRODUCING SIX
  AT ONCE, BRINGING THE RUNNING TOTAL TO ELEVEN**: assigns single letters to the eight primitives, finding
  `S`(State) collides with `Σ`'s already-verified SUPPORT axis, `V`(Event) with `Σ`'s VALIDITY axis,
  `R`(Relation) with `Σ`'s RESOLUTION axis, `A`(Action) with `Σ`'s ACQUISITION axis (four of six hitting "the
  ONE FULLY-VERIFIED STRUCTURE in the theory," already-tracked `Q4A`-verified `Σ`), `O`(Observation) with the
  already-tracked operation set `𝒪` (already-tracked `G-78`), and -- explicitly diagnosed as "THE DANGEROUS
  ONE" -- `Π`(Policy) with the already-established PROVENANCE glyph, which is LOAD-BEARING IN THREE PLACES:
  the already-tracked `id=H(P,e,c,t,Π)` hash construction, `Lineage=Π∘ℛ_der*`, and, most seriously, "Decision
  3: `Π∈≡?`" Boxed: "A reader importing `Π` as POLICY would silently re-read Decision 3 -- THE PROGRAMME'S
  CENTRAL NORMATIVE QUESTION -- as 'is POLICY part of semantic equality?' IT IS NOT. IT IS PROVENANCE." Delivers
  the running collision tally: "Collision count: `𝒪`·`≅`/`≡`·`δ`·`ℐ`·`M`·+6 = ELEVEN. `G-102`." Explicitly
  connects to the already-tracked `G-101` root-cause diagnosis (file 1107): "Consistent with `G-101`'s root
  cause -- parallel minting, no shared registry -- and this is the FIRST INSTANCE where a single artifact
  produced six at once."

  **DELIVERS THE FIFTH `T4-SHAPE`: THE OPERATOR CONTRACT `⟨Name,Input,Pre,Transform,Post,Inv,Evidence⟩`**,
  precisely mapped against the already-tracked file-1092 Audit-A nine closure senses: supplies `Input`/
  `Transform` for the already-tracked 8-of-22 signatures; supplies a slot for (not a body of) the already-
  tracked 0-of-22 semantic bodies; supplies `Pre`/`Post` and `Inv` for the already-tracked "to be determined"
  pre/postconditions and invariants; introduces a genuinely new `Evidence` slot "WITH NO COUNTERPART IN THE
  CORPUS REGISTRY"; leaves identity and ratification entirely absent (`Name` is explicitly noted as "a label,
  not an identity"). Precisely distinguished as orthogonal to the already-tracked five-slot operation-identity
  schema (file 1100): "that asks WHAT AN OPERATION IS MADE OF; this asks WHAT IT MUST DECLARE. Two shapes, two
  axes -- and `291` needs both." Recorded `O-Q5`.

  **DELIVERS A SEVENTH ARRIVAL AT NON-MONOTONICITY, WITH A GENUINELY IMPORTANT SHARPENING NOT PRESENT IN ANY
  OF THE PRIOR SIX (already-tracked files 1099, 1104)**: "'the operator declares its transformation law'"
  rather than knowledge-can-only-increase being assumed globally. Boxed: "Monotonicity is NOT a property of
  the STATE SPACE. It is a PER-OPERATOR declaration." **Delivers a genuine reframing of the entire already-
  tracked join-semilattice dispute** (files 1058, 1073, 1077, 1092): "`060 §60.71` asked 'is `𝕂` a
  semilattice?' and answered 'not proven'... This says the question was MIS-ADDRESSED: the transformation law
  belongs to `op`, so `merge` MAY BE INFLATIONARY WHILE `retract` IS NOT -- and NEITHER FACT IS A PROPERTY OF
  `𝕂`." Delivers a genuinely valuable structural convergence: "Converges with `261.19`'s 'no single equality
  relation is adequate for all operations': PER-OPERATOR, again. Two independent per-operator results --
  equality and monotonicity -- pointing at the same structural conclusion: `𝕂`'s algebra is NOT GLOBAL."
  Recorded `M-Q7`.

  Delivers `C15` (monotonicity is a per-operator declaration, not a property of `𝕂`) and a new T0 (`K_t` as an
  8-tuple, forbidden by `258.35` and self-contradicted by its own source). Confirms the disciplined non-
  license: the operator contract not adopted (no filled slot), `M-Q7` relocates rather than establishes any
  law, no glyph renamed (`G-102` explicitly flagged "NOW THE MOST URGENT REGISTRY ITEM"), Steps 288-291
  unchanged, all `R6`.
