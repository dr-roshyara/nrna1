about: >
  "03 — Operation Registry Audit (mandate §5)." Delivers an exhaustive, disciplined table of every operation
  the corpus names (22 total, "Only operations the corpus names are listed. No operation is invented (mandate
  §21)"), scored across seven dimensions (exists, typed, semantic definition, observable, identity,
  governance status, missing specification): `Revise`, `Transform`, `Supersede`, `Merge` (the only operation
  with laws, per already-tracked file 1077's `060`-derived findings: non-destructive, idempotent modulo `≡`,
  commutativity "not imposed," associativity "a design goal"), `Split`, `Withdraw` (already-tracked identity-
  breaking effect, files 1041/1048), `Promote`, `Assess`, `Authorize` (flags the already-tracked `G-66`:
  "`authorities.yaml` is an enum, not an evaluator"), `Reject`, `Validate`, `Reintroduce`, `Replay`,
  `Determine`, `Qualify` (already-tracked `G1` irreducible body), `Resolve`/`Normalize`/`Compare` (the already-
  tracked partial-epistemic-function family, file 1038), `Deduplicate`, `Remove`, `Closure(Identity)` -- plus
  five PROSE-ONLY operations with NO corpus registry entry at all (`Retract`, `Publish`, `Apply`, `Verify`,
  `Policy evaluation`), flagged: "named in the Step-288 mandate; NO corpus registry entry."

  **DELIVERS THE QUANTIFIED CAPSTONE COUNT, DIRECTLY SUBSTANTIATING WITH HARD NUMBERS THE ALREADY-TRACKED
  'MEMBERSHIP RULE MISSING' FINDING (file 1076/1079)**: "operations with a corpus registry entry: 22 · typed
  (an explicit signature): 8 · with a semantic definition (a body): 0 · with operation identity: 0 ·
  governance-ratified: 0 · named only in prose, no entry: 5." Boxed: "22 NAMED · 8 TYPED · ZERO WITH A BODY ·
  ZERO WITH IDENTITY · ZERO RATIFIED."

  **DELIVERS A PRECISE, QUANTIFIED CONFIRMATION OF THE ALREADY-TRACKED FILE-1078 FINDING THAT EQUALITY-
  DEPENDENCE EXTENDS BEYOND `𝒯`**: "4 of the 8 typed ones are NOT `K→K` -- `Assess`, `Authorize`, `Compare`,
  `Resolve`/`Normalize`. `259.7`'s warning holds: 'we must not manufacture a false universal algebra.'" This
  is the exact operation-level evidence that grounds the file-1078 claim in concrete named operations rather
  than a general statement.

  Confirms the STATUS block's closing admission: "UNKNOWN whether the 5 prose-only operations belong in `𝒪`"
  -- an honest, disciplined refusal to resolve a scope question the registry itself does not answer.
