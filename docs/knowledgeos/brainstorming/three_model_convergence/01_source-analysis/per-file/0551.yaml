defines:
  - concept: "Uncertainty vector (U_A)"
    definition: "(U_source, U_measurement, U_semantic, U_inference, U_model, U_context) — a multidimensional decomposition of an assertion's uncertainty, replacing a single scalar and allowing each origin of uncertainty to be tracked and reasoned about separately"
  - concept: "The uncertainty contract (vs. formula)"
    definition: "The kernel-level requirement that every derived assertion carry Origin, Method, Dependency, Provenance, UncertaintySemantics, and Validity information — the actual numerical or qualitative propagation calculation is left to a pluggable calculus, never fixed in the kernel"
  - concept: "Provenance propagation is universal; numerical uncertainty propagation is calculus-dependent"
    definition: "Every derivation must always preserve its full causal/derivational lineage regardless of calculus choice, but quantitative combination of uncertainty values (e.g. via a specific formula) is only performed when the chosen assessment calculus defines how to do so"
