about: >
  "01 — Equality Register Reconciliation (mandate §3)," the first numbered artifact in the newly-organized
  `research/step-288/` package (explicitly placed there, with a recorded placement rationale, to avoid
  colliding with the existing `research/01-...` through `13-...` numbering).

  **§3.1 DELIVERS THE DEFINITIVE ENUMERATION OF NINE DISTINCT CORPUS EQUALITY/IDENTITY REGISTERS**, each
  precisely dated and sourced, spanning `08-27` through `08-30`: R1 (`25I.11`, three relations); R2 (`25J.5`,
  an implication chain with an explicit corpus question mark); R3 (`25J.26`, seven typed relation edges); R4
  (`25S.36/43`, three identity notions); R5 (**`246`**, the four already-extensively-tracked state relations);
  R6 (**`258.1`**, a NEW corpus locus, three relations by carrier); R7 (`258.4`, four object-level relations);
  R8 (`260`, candidate vs proven behavioural equivalence); R9 (**`261.1`**, a NEW corpus locus with **SIX**
  state-level relations, "the widest state-level register"); plus three further loci (`264.15` value-level;
  `195.21/52` Identity/Continuity/Similarity; `012§36/46` a six-value relation codomain). **"No corpus
  artifact reconciles them"** -- this document is the first attempt.

  **§3.2 delivers a precise six-way sorting of every relation**: genuinely different relations (different
  carriers/information); different NAMES for ONE relation (`≡_struct`(R1)≡`=_S`(R7)≡`E_struct`(R2)≡`=`
  (R5,R9) -- "four names, one relation"); relations at different LEVELS (value vs state; object vs reference;
  history vs state); INCOMPATIBLE definitions (flagged for §3.3); overloaded notation (`≅` alone carries four
  distinct relations: `≅_λ`,`≅_I`,`≅_P`,`≅_H`; `≡` carries six: `≡_exact,≡_struct,≡_sem,≡_K,≡_D,≡_𝒯`); and
  things that are NOT equalities at all (`Similarity` is evidence-for, `⪯` is an order, `Validate` is an
  assessment).

  **§3.3 DELIVERS ARGUABLY THE MOST IMPORTANT FINDING OF THE ENTIRE EQUALITY-RESEARCH ARC**: the corpus's own
  `261.1`/`246` explicitly declare `≡` (semantic) and `≈` (observational) "distinct, not interchangeable" --
  yet TWO SEPARATE CORPUS LOCI GIVE THEM THE IDENTICAL FORMULA: `258.8`/`261.21` define
  `K_1≡_K K_2 ⟺ ∀O∈𝒪_K: O(K_1)=O(K_2)` ("an observational/behavioral notion"), while `261.5` defines
  `K_1≈K_2 ⟺ ∀O∈𝒪_K: O(K_1)=O(K_2)` -- **THE IDENTICAL FORMULA.** Boxed: **"`≡_K` and `≈` share one formula
  while being listed as distinct."** "Either `≈` collapses into `≡` (violating the corpus's own non-
  interchangeability warning), or `≡` has no definition at all -- the observational one being the only one
  offered." Explicitly left `NORMATIVE`, unresolved, "no branch preferred here" -- this is a genuine internal
  corpus contradiction, not a research-lane gap, discovered here for the first time in this reconstruction's
  tracking.

  **§3.4 delivers the single most complete reconciled matrix across the entire equality-research programme**,
  covering eight named relations (`=`,`≡`,`≈`,`≅_λ`/`≅_P`,`≅_I`,`≅_H`/`∼_H`/`≡_𝒯`,`Continuity`,`≡_D`) across
  thirteen dimensions (level, corpus definition, source, decision procedure, computability, equivalence
  properties, congruence, provenance-inclusion, governance-inclusion, identity-involvement, dependencies,
  contradictions, normative decisions) -- consolidating and cross-referencing every finding this reconstruction
  has tracked across files 1005-1040 into one definitive table. Notably confirms `=`'s congruence failure is
  now labeled "EXECUTED `06§G`" (a cross-reference to file 1039's own concrete demonstration) and the id/
  mutable-state contradiction as "EXECUTED `06§H`" (also file 1039).

  **§3.5 DELIVERS A GENUINELY IMPORTANT HARDENING of the already-tracked hierarchy-rejection finding**: the
  implication lattice among equality relations is not merely unmeasured but **POSITIVELY FORBIDDEN as a
  strict chain** -- `25J.5`'s own implication arrow carries an explicit corpus question mark
  (`E_exact⇒E_struct⇒?E_sem`); a NEW corpus locus **`261.9`** states boxed **"No universal equality hierarchy
  has yet been proven"**; and `258.19` explicitly states the relations "should NOT be interpreted as a strict
  mathematical hierarchy... separate semantic constructs connected by explicit rules." Concludes: "`D285-5`'s
  `history⊊structural⊊semantic` chain is therefore not merely unmeasured -- it is FORBIDDEN." This is a
  materially stronger conclusion than the already-tracked "not corpus, withdrawn" finding (files 0991,
  0993-0994, 1036-1037) -- the corpus doesn't merely fail to support a hierarchy, it explicitly warns against
  ever treating these relations as one.
