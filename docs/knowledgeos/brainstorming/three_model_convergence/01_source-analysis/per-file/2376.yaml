about: >
  IMPORTANT NOTE: this is the LAST FILE in the primary-corpus manifest (2376 of 2376 total rows,
  1193 PRIMARY). It is also the exact primary-source document behind a finding this reconstruction's own
  session log (2026-09-04, a parallel, differently-scoped session) already reported as an external fact:
  "Gītā strand: stop testing it for kernel candidacy. Five cycles, zero machinery. Keep it as an external
  naming lens; the candidacy question is answered." This document IS that closure, delivered by the KR-
  SIM lane itself against KR-BRIDGE-02 (a Π×Q grid cycle).

  **DELIVERS TWO CONCRETE PROVENANCE-TRACKING FAILURES THIS CYCLE**: Π_value_set was declared to read the
  value field; under T_D_relational its value is actually computed from `rank`, and rank is computed by
  ordering values WITHIN A TAG GROUP -- so the observable was in fact carried by `tag`, the very field Q
  reads. "It did not know this. Neither did I, and I wrote it." The corrected map was STILL wrong:
  Π_arity reads no field by declaration, but after T_C_dedup it effectively reads `v`, because arity is a
  function of which records survive and membership is decided by a field. "A perturbation test found
  this; reading the code did not."

  **DELIVERS THE 3.27 CORRESPONDENCE, STRIPPED TO ITS STRUCTURAL CONTENT**: "the agent's account of its
  own activity is not the activity. Π reports {v}. Π is in fact carried by {v,tag}. Its self-description
  is sincere and wrong, and its wrongness is not visible from inside itself -- it is visible only from
  the transformation that constitutes it." Paired with 4.17 ("the way of action is deep/impenetrable"):
  "not mysticism here: dependency structure is not surface-readable. Two of my three provenance maps
  were wrong, and I was reading the code that produced them each time."

  **DELIVERS THE EXPLICIT 'WHERE THE ANALOGY BREAKS' SECTION**: the Gītā's own resolution is
  renunciation-of-fruit and non-doership (2.47, 5.8-9) -- a resolution "in the register of disposition."
  "There is no such move available here. The experiment's resolution was not disposition but
  PERTURBATION: change one input field, watch which output columns move, and let the observed dependency
  overrule the declared one. That is a mechanical test, not an insight. The lens supplies the question --
  'does this thing know what it reads?' -- and supplies NOTHING toward the answer. Treating the
  resolution as transferable would be exactly the category error the discipline forbids." This is the
  series' clearest, most explicit statement of where the philosophical analogy structurally cannot
  transfer, directly paralleling this reconstruction's own already-tracked Gītā-thread discipline (files
  2234-2321's correspondence≠derivation rule, and file 2308's warning against reversing lens-then-theorem
  order).

  **DELIVERS A FOUR-ITEM CANDIDATE REGISTER WITH HONEST PROVENANCE ATTRIBUTION**: Effective-read closure
  (an observable's read-set must be computed through the transformation's provenance, never declared) --
  [PROP] FR-003, EXPLICITLY "established by EXPERIMENT (KR-BRIDGE-02 §2), not by the lens. The lens named
  it after the fact"; Declaration≠verification as a standing experimental obligation -- [PROP], "two
  independent occurrences now: KR-BRIDGE-01's label mismatch on T_B, KR-BRIDGE-02's provenance failures.
  Two is not promotion (ES-006.1)"; Non-doership as a kernel stance -- REJECTED ("no mechanical content.
  Recorded so it is not proposed again"); "Action's depth" as an interpretive-humility argument -- REJECTED
  as machinery ("legitimate only as a reason to test, and testing is already an obligation").

  **DELIVERS THE FORMAL FIVE-CYCLE CLOSURE, EXPLICITLY NAMING ALL FIVE CYCLES**: "[CORPUS] the Gītā strand
  has now run FIVE CYCLES (contradiction · elimination · reduction · audit · bridge). In none of them has
  it produced a kernel primitive, and in each it has produced a question already answerable by
  experiment. That is itself a finding worth recording: the lens has been consistently useful for
  framing and consistently empty of machinery. Its value is in naming what an experiment already
  earned. It has never once been the source of a result, and after five cycles that is evidence, not an
  accident." This maps EXACTLY onto this reconstruction's already-tracked five KR-SIM companion studies
  in sequential order: contradiction (file 2329), elimination (file 2370), reduction (file 2372), audit
  (file 2373), bridge (file 2375) -- confirming this reconstruction independently tracked and recorded
  the identical five-cycle series this closing document explicitly tallies, in the same order.

  **DELIVERS THE FORMAL CLOSING RECOMMENDATION**: "[PROP] Recommendation: keep the strand, keep it
  external, and stop testing it for kernel candidacy -- THE CANDIDACY QUESTION IS ANSWERED. Its role is
  naming, and naming is enough." This is the exact, word-for-word source of the finding this
  reconstruction's own session log (a parallel, differently-scoped session on the same day) already
  reported: "Gītā strand: stop testing it for kernel candidacy. Five cycles, zero machinery. Keep it as
  an external naming lens; the candidacy question is answered" -- now directly, independently confirmed
  by reading the primary source itself, closing the loop on that earlier cross-reference.
