defines:
  - concept: "Severity≠Priority"
    definition: "Severity measures the impact of a finding/deviation if left unaddressed; Priority measures the urgency of the organizational response required; the two are independent — a low-severity deviation can still warrant high-priority response (e.g. because it blocks a production deployment), and these must not be silently conflated into one score"
  - concept: "Verify the actual violated condition, not a proxy"
    definition: "When verifying remediation of a finding, the verification must directly re-test the specific rule condition that was originally violated (e.g. 'is the forbidden VM deployment no longer active?'), not merely confirm that some remediation action was taken and produced a plausible-looking result (e.g. 'the replacement container starts successfully')"
  - concept: "The five-level automation-autonomy taxonomy (L0-L4)"
    definition: "L0 Detect (system identifies a discrepancy and creates a Finding); L1 Recommend (system proposes a Recommendation from a Finding); L2 Decide (system or authorized process makes a Decision from a Finding); L3 Execute (an authorized actor or agent performs the Action the Decision specifies); L4 Closed-loop automation (the system automatically remediates and verifies without human intervention) — the appropriate level for any given capability must be chosen based on risk, not uniformly applied"
  - concept: "Deterministic enforcement over advisory instruction"
    definition: "A governance policy intended to constrain agent or system behavior is only as strong as its enforcement mechanism; a policy expressed only as a natural-language instruction to an agent, without a corresponding machine-checkable technical control (Policy→MachineCheck→Allow/Deny), provides only weak, advisory-level assurance rather than deterministic guarantee"
  - concept: "TraceableKnowledgeEpisode"
    definition: "A candidate reframing of the fundamental unit of organizational knowledge: rather than a static Document, the basic unit may be an Episode = Intent+Decision+Action+Observation+Evidence+Learning — a complete traceable arc from motivation through outcome and organizational learning — held explicitly as an unconfirmed conceptual candidate"
