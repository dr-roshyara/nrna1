about: >
  Hernán & Robins' "Causal Inference: What If", mined via Zero Lens plus twelve architectural
  lenses (Causal Question, Counterfactual, Identification, Assumption, Causal Graph, Confounding,
  Selection Bias, Measurement Bias, Positivity/Coverage, Consistency, Intervention, Target Trial,
  Time-Varying Knowledge, Sensitivity/Triangulation, Machine Learning). Central distinction:
  association (data show a relationship) is never the same epistemic status as causation (evidence
  supports that intervening on X would change Y). Directly extends and operationalizes 0205's
  (Freedman) causal-assurance apparatus with an explicit identification/estimation pipeline,
  counterfactual outcomes, causal graphs, and a target-trial specification schema.
introduces:
  - concept: "Observational Knowledge vs. Causal Knowledge as never-equal epistemic statuses"
  - concept: "CausalQuestion schema (population/intervention/comparator/outcome/time-horizon/estimand)"
  - concept: "Counterfactual outcomes Y1/Y0 as first-class KnowledgeOS objects, not ordinary observations"
  - concept: "Identification vs. Estimation distinction: IDENTIFIABILITY -> ESTIMATION -> UNCERTAINTY -> ROBUSTNESS -> EPISTEMIC STATUS pipeline, with ABSTAIN as the not-identified branch"
  - concept: "Exchangeability / Positivity / Consistency as named identifying-assumption conditions, stored with provenance and status"
  - concept: "CausalGraph as distinct from a semantic/associative knowledge graph, with explicit edge semantics for confounding, selection bias, measurement bias, effect modification"
  - concept: "Confounding Lens as a first-class anti-false-inference mechanism (CAUSAL CLAIM REVIEW output template)"
  - concept: "Selection-Bias Lens: 'why are these observations present in the evidence set?'"
  - concept: "Measurement-Bias Lens: the observation mechanism itself becomes part of the evidence model"
  - concept: "Positivity/Coverage as an Evidence Coverage Check (claim scope vs. evidence support population)"
  - concept: "Consistency Lens: intervention must be well-defined enough that 'X happened' has one meaning (multiple-versions-of-treatment problem)"
  - concept: "Target Trial / Target Experiment specification schema (eligibility/treatment/comparator/assignment/time-zero/follow-up/outcome/estimand/analysis-plan)"
  - concept: "Time-varying knowledge: treatment-confounder feedback can bias traditional adjustment even with confounders measured; KnowledgeOS's evolving knowledge lifecycle is inherently longitudinal"
  - concept: "Sensitivity/Triangulation Lens: multiple methods/assumptions/graphs converging on ROBUST vs. SENSITIVE causal conclusion"
  - concept: "Prediction != causal inference as a proposed KnowledgeOS architectural invariant"
  - concept: "Four epistemic result types: Descriptive / Associational / Causal / Counterfactual — must not collapse into one another"
  - concept: "Causal Reasoning & Assurance Layer primitive list (CausalQuestion, CausalClaim, Intervention, Comparator, Outcome, Population, TimeZero, TimeHorizon, Estimand, Counterfactual, CausalGraph, Assumption, IdentifiabilityAssessment, Confounder, Mediator, Collider, SelectionMechanism, MeasurementMechanism, EffectModifier, SensitivityAnalysis, CausalEstimate, CausalEvidence)"
  - concept: "Two proposed constitutional principles: no associational->causal promotion without explicit question/intervention/assumptions/identifiability/sensitivity; predictive validity and causal validity must remain distinct"
