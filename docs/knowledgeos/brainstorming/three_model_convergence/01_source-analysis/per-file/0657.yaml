defines:
  - concept: "Integrity≠Truth / Authenticity is orthogonal to truth"
    definition: "A cryptographic hash proves content is unchanged (integrity); a valid signature proves an identity authored/signed a statement (authenticity); neither proves the statement's content is actually true — cryptography protects provenance and integrity, it does not manufacture truth"
  - concept: "Trust(x,y,C,t) is not generally transitive"
    definition: "High trust from x toward y and from y toward z does not imply high trust from x toward z; trust propagation through agent networks must not be assumed, preventing a specific and realistic security failure mode"
  - concept: "TamperEvidence, not Blockchain"
    definition: "The architectural requirement for verifiable, tamper-evident provenance history can be met with conventional cryptographically-linked append-only storage (e.g. Merkle-style hash trees); adopting blockchain specifically because 'knowledge must be trustworthy' is an unjustified technology choice not derived from actual requirements"
  - concept: "Capability(A)⊆RequiredCapabilities(A) (least privilege)"
    definition: "An agent (human or AI) should receive only the typed capabilities (Subject, Action, Resource, Scope, Validity) its bounded responsibility actually requires, never broad or role-based access that exceeds its specific task — applied uniformly to humans and AI agents"
  - concept: "SemanticTrustBoundary"
    definition: "A boundary between UnverifiedInput and TrustedKnowledgeState that no artifact crosses merely because an AI (or any actor) generated and signed it; an authenticated, provenanced claim without supporting evidence remains an AuthenticatedClaim, not NotVerifiedKnowledge — the corpus's clearest statement of 'who said this' versus 'why should we believe this'"
