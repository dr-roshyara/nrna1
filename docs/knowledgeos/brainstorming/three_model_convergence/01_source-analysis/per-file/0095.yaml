about: >
  A review of a distinctly-named external source ("Tarka - The Indian Science of Logical Analysis"
  paper, not the Stanford Encyclopedia material cited at 0092) covering largely the same ground already
  logged in detail at 0092-0094 (four Pramāṇas, 16 categories, five-membered syllogism, Tarka as
  non-independent reductio-ad-absurdum assistant, Hetvābhāsa). Genuinely new: a DDD-flavored
  "definition precision" candidate (over-/under-extension boundaries) directly relevant to the Context
  dispute, a clean "Reasoning Gate, not Answer Generator" framing, and a SIXTH non-identical anchor
  reshaping -- a nine-item "Constitutional Invariants" list that adds "Relations" as one more flat item
  alongside Context (kept separate, unmerged) rather than adopting 0094's more radical
  relations-replace-attributes framing.

introduces:
  - "INV-KOS-ReasoningLifecycle-001, INV-KOS-Pramana-001, INV-KOS-InferenceBoundary-001,
    INV-KOS-ArgumentStructure-001, INV-KOS-ReasoningGate-001 -- five candidates restating 0092-0094's
    already-logged Pramāṇa/inference/syllogism/Tarka content under the INV-KOS-* prefix (reusing the
    existing scheme, consistent with the positive consolidation pattern, not a new naming scheme)"
  - "INV-KOS-SemanticBoundary-001 (NEW, DDD-flavored): 'KnowledgeOS SHALL preserve defining
    characteristics and boundaries that distinguish a concept from related concepts' -- motivated by
    the paper's discussion of definitional over-extension/under-extension/impossible-characteristics,
    explicitly connected by the document itself to 'Context boundary, Semantic identity, Ubiquitous
    language.' A DDD-native (not Sanskrit-sourced) articulation of a boundary-precision concern
    structurally adjacent to, but not identical to, the Context dispute and to Avacchedaka (0094)"
  - "'Reasoning Gate, not Answer Generator': Tarka filters (invalid reasoning / insufficient evidence /
    contradiction -> accepted reasoning path) rather than generates -- INV-KOS-ReasoningGate-001
    formalizes 'KnowledgeOS SHALL separate hypothesis generation from epistemic validation'"
  - "⭐ Sixth non-identical anchor reshaping: 'Updated Kernel Model' lists NINE 'Constitutional
    Invariants' -- Identity, Context, Evidence, Authority, Transformation, Time, Uncertainty, Knower,
    Relations -- with Context kept as a FLAT, separate, unmerged item (treatment A, not 0091's merge or
    0094's delimiter reframing) and 'Relations' added as a NINTH flat item alongside the others, NOT
    replacing the attribute/dimension shape as 0094's own H-KOS-Relation-001 argued it should. This is
    a notable divergence: a later file citing the same Tarka/Nyāya material absorbs 'relations matter'
    as one more item in a list, not as the paradigm shift 0094 itself proposed"
  - "Six-candidate 'Final Verdict' strength table (5-star: Reasoning lifecycle, Pramāṇa-aware evidence
    model, Observation/inference separation, Argument chain preservation; 4-star: Semantic boundary
    precision, Fallacy detection) -- a star-rating convention, joining the emoji (0090) and text-grade
    (0092) informal strength-signaling styles already in use, none reconciled with any other"
  - "Closing six-lens convergence restated (Vāṇī/Zero/Vedanta/TMS-AGM/Topology/Nyāya-Tarka), producing:
    'KnowledgeOS is not a knowledge repository. It is an epistemic reasoning substrate that preserves
    the relationships, evidence, context, and reasoning paths required for trustworthy truth
    discovery.'"

