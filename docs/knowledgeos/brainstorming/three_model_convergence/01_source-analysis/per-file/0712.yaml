about: >
  Delivers the foundational DDD rule `Concept≠BoundedContext` and an explicit eight-criterion DDD test
  (distinct Ubiquitous Language, business/engineering purpose, meaningful invariants, distinct lifecycle,
  meaningful consistency boundary, identifiable ownership, explicit contracts, whether separation reduces
  ambiguity), directly matching classical Evans-style DDD strategic-design methodology and consistent with
  this repository's own governing DDD-discipline standards.

  Delivers eight candidates systematically tested: **Knowledge** (Strong Candidate, `ConfirmedBC=
  NotYetEstablished` -- the important ownership caution that `ArchitectureKnowledge` and
  `OperationalKnowledge` may have different owners, making "Knowledge" potentially too broad for one BC);
  **Evidence** (Strong Candidate, `ConfirmedBC=Unknown` -- high consumption across Knowledge/Governance/
  Assurance/Agents does not by itself imply a separate BC); **Governance** (Very Strong BC Candidate, the
  strongest evidence, given a likely genuine organizational-ownership boundary); **Assurance** (Strong BC
  Candidate, with the important `Assurance≠Governance` distinction precisely stated: "Assurance determines
  `Violation=True`. Governance determines what should we do about it" -- directly extending the corpus's
  Detection≠Authority family into a formal DDD-boundary argument); **Engineering State** (correctly demoted
  to "Supporting Domain, not necessarily BC" -- "this distinction prevents KnowledgeOS from becoming an
  accidental replacement for Git, Kubernetes, monitoring, etc."); **Agent Interaction** (correctly demoted to
  "Supporting Context" -- "is this KnowledgeOS domain semantics or AI infrastructure?", with `AgentIdentity`
  belonging to KnowledgeOS-facing integration while `PromptManagement` belongs to the agent harness); **Policy**
  (Candidate, boundary unresolved, with `Policy=What must/should happen` distinguished from
  `Decision=What was decided in a particular case`); and **Authorization** (correctly identified as "a
  classic identity/security domain" likely belonging to an existing enterprise IAM/security bounded context
  rather than KnowledgeOS, with the important anti-pattern warning: "KnowledgeOS should not attempt to
  recreate `EnterpriseIAM`. Instead: `KnowledgeOS→AuthorizationService`. It consumes authoritative
  authorization capabilities").

  **Delivers "do not over-fragment," a crucial and precisely reasoned DDD anti-pattern warning directly
  extending 0696's/0697's DDD-archaeology discipline into bounded-context-count discipline specifically**:
  an illustrative list of eleven tempting per-noun "BCs" (`KnowledgeBC, EvidenceBC, ClaimBC, DecisionBC,
  PolicyBC, AuthorityBC, VerificationBC, FindingBC, ObservationBC, ActionBC, AgentBC`) is explicitly
  rejected as `NounDrivenArchitecture` -- "we explicitly want to avoid that," directly matching this
  repository's own actual governing DDD/architecture standards against generic/noun-driven decomposition.
  Delivers the Aggregate boundary test ("which objects must change consistently in one transaction?"),
  concretely showing `Decision` referencing but not owning `Authority` or `Evidence`, with worked
  illustrative aggregate schemas for `GovernanceDecision` and `Evidence` demonstrating reference-not-
  duplication.

  **Delivers the Anti-corruption-layer discipline reconfirmed with two concrete external-system examples**,
  directly extending 0687's/0697's ACL discipline: Kubernetes (`Deployment ReplicaSet status`→translated to
  `Observed deployment state`) and, continuing the confirmed-fictional "Nexus" running example (0698),
  `NexusAsset→ArtifactObservation`. Delivers an Agent anti-corruption boundary precisely stated: Claude's
  internal concepts (conversation, token, tool call, context window) are explicitly NOT KnowledgeOS domain
  concepts -- "KnowledgeOS needs `AgentSession` only where agent activity has governance/evidence
  significance." Delivers the most complete DDD context-map diagram in this reconstruction (`Governance→
  {consumes evidence}Evidence→{supports}Knowledge→{defines expectation}Assurance→{observes}External
  Engineering Systems`, with an `Agent Layer` feeding in separately).

  **Delivers the file's central, genuinely significant DDD insight, directly resolving a tension this
  reconstruction has been building toward across the entire constitution/operating-model/information-model
  arc**: "KnowledgeOS may not be one bounded context. It may instead be an **Ecosystem of bounded contexts**
  connected by a common governance/evidence language" -- `KnowledgeOS=BC_1+BC_2+BC_3+Integration`, rather
  than `KnowledgeOS=OneHugeApplication` -- with the appropriately epistemically humble alternative
  explicitly left open: KnowledgeOS might instead be "primarily a platform boundary spanning several
  domains" rather than a BC itself, "this distinction must be resolved through implementation and ownership
  evidence." Delivers the precise risk analysis of getting this wrong (giant aggregates, a generic
  "KnowledgeService," universal repositories, shared domain models, excessive coupling, "that would
  undermine DDD"), crystallized with **the sharp, concrete "Generic Knowledge anti-pattern"**: a
  `KnowledgeService` exposing only `saveKnowledge()/getKnowledge()/updateKnowledge()/searchKnowledge()` is
  explicitly identified as "not automatically a domain model. It may merely be CRUD around documents" --
  directly matching and validating this very repository's own actual governing warnings against generic/
  anemic service patterns.

  **Delivers the "Domain behavior test," a genuinely valuable, reusable DDD-validation heuristic**: "can the
  context be described using meaningful domain verbs?" (`PromoteClaim, ApproveDecision, SupersedeDecision,
  VerifyFinding, GrantException`) rather than only generic CRUD (`save()/find()`) -- "if yes, it is stronger
  evidence of a domain boundary" -- worked through with concrete verb sets for each core candidate
  (Governance: Assess/Approve/Reject/Delegate/GrantException/Supersede; Assurance: Check/Verify/Compare/
  Detect/Classify; Evidence: Capture/Register/Validate/Link/Retain; Knowledge: Propose/Promote/Supersede/
  Invalidate/Publish/Resolve), producing a refined final hypothesis converging on `Governance+Knowledge+
  Evidence+Assurance` as the strongest core-domain candidates, with `AgentInteraction`+`EngineeringObservation`
  as Supporting and `IAM/Git/CI-CD/Kubernetes/Monitoring/Nexus` as External -- a clean three-tier
  classification directly matching classical DDD strategic-design terminology (Core Domain/Supporting
  Subdomain/Generic Subdomain).

  Delivers a comprehensive Domain-event catalog (`KnowledgeProposed, KnowledgeApproved, DecisionSuperseded,
  EvidenceCaptured, FindingDetected, FindingClassified, ActionAuthorized, ActionExecuted,
  VerificationCompleted`), the most complete such catalog in this reconstruction, with the precise Event-
  ownership rule "the context that owns the business meaning should own the event" (`Governance→
  DecisionApproved`, never a generic `KnowledgeOS GenericEventService→DecisionApproved`), an event-driven
  interpretation of the control loop as Event choreography, and **the important, precisely reasoned
  technology-independence caution "do not prematurely choose Kafka"** -- `DomainEvent` is the semantic
  concept; Kafka/messaging/database-events/webhooks are implementation mechanisms -- directly extending
  0705's technology-independence discipline into the event-architecture layer specifically.

  Delivers Step 127's verdict with confident, precisely hedged phrasing consistent with the ongoing Steps
  120-127 synthesis arc: the DDD analysis "currently supports `Governance, Knowledge, Evidence, Assurance`
  as the strongest bounded-context candidates," but the correct status remains explicitly `Candidate`, not
  `Confirmed`, crystallizing **the critical rule "KnowledgeOS should not be decomposed by nouns; it should
  be decomposed by semantic boundaries."**

  **Closes by opening "Step 128 — KnowledgeOS Context Map and Dependency Direction,"** promising to test the
  actual dependency direction across the candidate contexts (`Governance→Knowledge→Assurance→Engineering`
  desired, versus possible reverse dependencies/semantic leakage), and, most significantly, **explicitly
  naming the dangerous anti-pattern to test for: `Infrastructure/Agent→Authority`** -- "which would mean the
  technical implementation can silently redefine organizational truth" -- directly and sharply extending the
  corpus's entire Agent≠Authority discipline into a formal, testable dependency-direction anti-pattern for
  the first time, rather than only a behavioral/procedural rule. No actual code execution, repository
  inspection, or verified filesystem/dependency claim is reported anywhere in this file.
