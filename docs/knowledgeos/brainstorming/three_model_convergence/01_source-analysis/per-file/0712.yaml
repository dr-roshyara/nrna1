  - concept: "0687's/0697's Anti-Corruption-Layer discipline"
    refinement: "Directly extended with two concrete external-system examples (Kubernetes, Nexus) and an explicit agent-internal-concepts exclusion (conversation/token/tool-call/context-window are not KnowledgeOS domain concepts)"
  - concept: "0705's technology-independence discipline"
