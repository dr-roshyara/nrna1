defines:
  - concept: "The eight-criterion DDD bounded-context test"
    definition: "A candidate concept qualifies as a genuine bounded context only if it exhibits: (1) a distinct ubiquitous language, (2) its own business/engineering purpose, (3) meaningful invariants it owns, (4) a distinct lifecycle, (5) a meaningful consistency boundary, (6) identifiable ownership, (7) communication through explicit contracts, and (8) separation would genuinely reduce semantic ambiguity — satisfying some criteria makes a concept a 'candidate,' not yet 'confirmed'"
  - concept: "Assurance≠Governance (DDD boundary)"
    definition: "Assurance's domain purpose is determining whether a condition holds (Violation=True/False); Governance's domain purpose is deciding what organizational response should follow that determination — these are distinct business purposes with distinct language and lifecycle, even though they interact closely, supporting their treatment as separate bounded contexts"
  - concept: "The Domain behavior/verb test"
    definition: "A candidate bounded context is more strongly evidenced when it can be described through meaningful domain-specific verbs (e.g. PromoteClaim, ApproveDecision, GrantException) rather than only generic persistence operations (save(), find(), update()); a service exposing only CRUD-style methods around a noun is likely not a genuine domain model, regardless of how central that noun appears in the information model"
  - concept: "KnowledgeOS as an ecosystem of bounded contexts (vs. one application)"
    definition: "Rather than being a single monolithic bounded context or application, KnowledgeOS may be more accurately understood as an ecosystem of multiple distinct bounded contexts (candidate: Governance, Knowledge, Evidence, Assurance) connected by a common governance/evidence language and integration layer — or alternatively, KnowledgeOS may be a platform boundary spanning several domains rather than a bounded context itself; which framing is correct requires implementation and ownership evidence, not assumption"
