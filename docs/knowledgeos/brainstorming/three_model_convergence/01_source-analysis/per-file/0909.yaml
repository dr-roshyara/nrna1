  - concept: "0908's HPA Ruling ('STEP 278 — FORMAL POLICY/AUTHORITY SEMANTICS: CLOSED')"
    refinement: "DIRECTLY DOWNGRADED by this review's final statement ('Formal Closure: CONDITIONAL — requires corrections'), a further explicit instance of the corpus's recurring overclaim-then-correction cycle, this time via structured peer review rather than narrative self-correction"
  - concept: "0908's statistical measurement model for policy evaluation (§22-23) and Rule Independence model (§24-26)"
    refinement: "BOTH CRITIQUED as defined-but-not-operationalized: the measurement model needs an explicit StatisticalRule type and evaluation procedure plus a genuinely new calibration-verification requirement; the rule-independence model needs an explicit strongly-connected-component evaluation procedure connecting it to actual policy evaluation"
  - concept: "0908's thirteen falsification tests F1-F13"
    refinement: "CRITIQUED as stated but non-executable -- delivering a concrete worked executable-test-specification template (Setup/Execute/Expected/Pass-if) that Step 278's eventual final version would need to apply to all thirteen tests"
