defines:
  - concept: "Calibration requirement for probabilistic policies"
    definition: "A newly-raised, genuinely substantive statistical requirement: any policy rule of the form P(θ>c∣X)≥q (a probabilistic threshold rule) is incomplete without an explicit specification of how the underlying probability model was CALIBRATED -- i.e. how well its stated probabilities match observed outcome frequencies -- and how that calibration is independently VERIFIED. The recommended structure is Calibration=(Model, ValidationData, CalibrationMetric), with a CalibrationVerified predicate (CalibrationMetric≤threshold). Without this, a probabilistic policy rule's threshold q could be applied to an uncalibrated or miscalibrated probability estimate, silently producing systematically wrong Permit/Deny decisions despite the rule's superficially rigorous probabilistic form -- extending the corpus's standing Measurement≠Probability discipline with a concrete verification obligation specific to governance-facing probabilistic rules"
  - concept: "Formally Specified vs Formally Closed"
    definition: "A finer-grained split within the FC (Formal Closure) symbol from 0908's four-symbol taxonomy: Formally Specified means merely that a definition for a construct exists somewhere in the text (a symbol, a type, a signature); Formally Closed means that definition is additionally COMPLETE (covers all required cases) and INTERNALLY CONSISTENT (its parts do not contradict each other or leave gaps an adversarial reader could exploit). The review's central complaint is that 0908's closure matrix marks many foundations 'Formally Closed' when they have in fact only reached 'Formally Specified' -- e.g. the Policy evaluation function's type signature is specified, but since its actual evaluation algorithm is undefined, it cannot yet be called formally closed in the stronger sense"
