defines:
  - concept: "Formal Knowledge state"
    definition: "K_t=(E_t,A_t,M_t,C_t,F_t,V_t,R_t) — evidence, assertions, models, constraints, conflicts, validation state, and provenance/dependency relations, all indexed by time t; knowledge is inherently stateful and event-driven, K_t=Fold(e_1,...,e_t)"
  - concept: "Information-theoretic identifiability impossibility"
    definition: "If Ω(W_1)=Ω(W_2) for distinct world states W_1≠W_2, no algorithm operating on the resulting observation can recover the distinction — a fundamental limit of information destruction under the observation function, not a deficiency of any particular reasoning system"
  - concept: "Epistemic composability"
    definition: "A composition f_M∘f_A is valid only when Domain(f_M) contains Range(f_A) — the formal condition under which chained epistemic transformations (e.g. Evidence→Assertion→Model input) may be legitimately composed end to end"
  - concept: "Epistemic type safety"
    definition: "No inference or action may consume a knowledge object whose epistemic type (e.g. Hypothesis vs. ValidatedClaim) does not satisfy its required preconditions — formalized as UnsafeCast(Hypothesis,ValidatedClaim)=Forbidden, directly analogous to programming-language type safety"
  - concept: "The never-manufacture-epistemic-information principle"
    definition: "If the mathematically justified epistemic result is Unknown, Conflict, or Underdetermined, the system must be able to expose exactly that through its interfaces, never coerced into a forced Boolean or scalar merely to satisfy a downstream component's expected shape"
