about: >
  Continues the same disciplined companion-study pattern as this reconstruction's already-tracked file
  2329, now applied to Chapter 18 (Mokṣa-Sannyāsa-Yoga, the Gītā's final and longest chapter) against
  the KR-ZERO-ALGEBRA-2026-09 experiment (Vedic-mathematics-inspired Zero algebra, outside this
  reconstruction's primary scope). Restates the identical binding discipline (question/lens/corroboration
  only, never entity) and the experiment's own parallel discipline for its Vedic-mathematics inspiration
  ("do not claim that the experiment validates Vedic Mathematics" -- "the same discipline is applied here
  to the Gītā").

  **DELIVERS FIVE CHAPTER-18 LOCI, EACH TYPED**: 18.2 sannyāsa-vs-tyāga (renouncing the ACT vs renouncing
  the RESULT of action) -- Corroboration C-1 for KR-ZERO-ALGEBRA's Remainder result (three candidate
  Remainder constructions, two coincide exactly A≡C 1,182/1,182, while the third "B" -- the
  transformation residual -- differs: "the residue of the operation is not the residue of the concern").
  18.11/3.5 ("no embodied being can relinquish actions without remainder") -- Lens L-1 "there is always a
  remainder": a total-elimination operator's target state may not exist, explicitly NOT established by
  the experiment's own termination (H3, ≤2 iterations) and monotonicity (H4) findings -- "the lens is
  consistent with that and does not establish it. Consistency is not evidence." 18.48 (do not abandon
  flawed-but-native work) -- Corroboration C-2 for the boundary-preservation result: 196 of 1,223
  otherwise-tempting eliminations (16.03%) were blocked once provenance/uncertainty/scope/contradiction
  were in the contract -- "same visible result, changed boundary ⟹ not Zero." 18.7-9 (the three GROUNDS
  of tyāga -- tāmasa/rājasa REJECTED, sāttvika ACCEPTED, classified by ground not outcome) -- Corroboration
  C-3, EXPLICITLY "THE SHARPEST IN THIS STUDY": corroborates KR-ZERO-ALGEBRA's PATH-A/PATH-B two-methods-
  kept-apart result -- 55.75% agreement, asymmetric disagreement (1,559 elements the heuristic would
  remove are not Zero; only 301 that are Zero the heuristic keeps) -- "the heuristic removes the right-
  looking things for the wrong reason, and over-removes. An elimination is not adequately characterised
  by what it removes; it is characterised by the ground on which it removes it." 2.47 ("let not the fruit
  of action be your motive") -- Lens L-2, eliminability is Π-indexed (contract-relative), not intrinsic to
  x -- corroborates H8 REFUTED (495 differences, establishing contract-relativity by measurement, not by
  the verse).

  **DELIVERS THE 'WHAT THE GĪTĀ DOES NOT SUPPLY' TABLE**: no group/set formulation (H5/H6 both refuted,
  Zero is not element-wise in either direction, no textual counterpart to case I [x,x] or case J
  [+c,-c]); no ordering criterion (the process is non-confluent, different elimination orders reach
  different normal forms, and neither the text nor the experiment says which to prefer -- "that is a
  decision"); no algebraic property whatsoever (termination, monotonicity, commutativity, idempotence --
  "the text bears on none of them").

  **DELIVERS THE CORROBORATION MAP HONESTY CHECK**: "five of nine findings get nothing from the text --
  including every one of the algebraic results. That is the expected shape. The text speaks to the
  ethics of elimination, not to its algebra, and a reading that appeared to deliver the algebra would be
  a reading imposed rather than found."

  **DELIVERS THE FOUR-POINT KERNEL-VERDICT ARGUMENT, WITH AN EXPLICIT RUNNING COUNT**: (1) the
  experiment's own final status rule forbids declaring Zero a kernel primitive or the Vedic analogy
  canonical; (2) C-1 binds ("no mechanism enters the kernel merely because KnowledgeOS can use it...
  here the algebra was substantially refuted, so even usability is not established"); (3) the derivation
  ban forbids the chain; (4) "the programme's record is consistent: the Gītā has yielded questions and
  lenses and no entities. The one derivation it ever prompted -- the Zero/Śūnya chain -- was earned by
  1,620,000 assignments, not by the reading." EXPLICITLY: "it is the study's most disciplined output,
  and it is now the FOURTH CONSECUTIVE TIME this strand has produced none." This running count directly
  reinforces this reconstruction's already-tracked closure findings (files 2291/2293's zero-new-
  primitives, file 2329's "no kernel candidate, not one") with an explicit tally across at least four
  independent KR-SIM-companion passes.

  **DELIVERS A FIVE-ITEM CANDIDATE REGISTER (G-7 through G-11)**, each typed lens/corroboration with an
  explicit promotion condition, none promoted: G-7 residue-of-operation≠residue-of-concern (lens,
  already measured); G-8 there-is-always-a-remainder (lens, [OPEN], would need a proof no target state
  exists under a non-trivial contract); G-9 flawed-but-native-must-not-be-eliminated (corroboration,
  already established at 16.03%); G-10 elimination-characterised-by-ground-not-outcome (corroboration,
  already established at 55.75%/1,559); G-11 eliminability-not-intrinsic (lens, redundant to the
  already-established H8). Explicit refusal list: tyāga, sannyāsa, guṇa-typed elimination, aśeṣataḥ-as-
  a-remainder-operator -- "each would be an entity."

  **CLOSES WITH THE SAME GOVERNING RULE AS FILE 2329**: "the strongest statement made must never exceed
  the strength of the available evidence... this study's best finding is that a 2,000-year-old text and
  a 1,200-case generated corpus agree that an elimination is characterised by its ground rather than its
  outcome. That agreement is worth recording and worth nothing as proof."
