defines:
  - concept: "Determination (D(p,R))"
    definition: "D(p,R), the act of determining a proposition p given its supporting reasoning R -- formally distinguished from the proposition itself, the reasoning, the resulting epistemic value, and the aggregate Knowledge State"
  - concept: "Candidate Knowledge State (K_t, this file's tentative form)"
    definition: "K_t={p_i,R_i,D_i,V_i,...} -- explicitly a CANDIDATE representation pending cross-lens testing (via the twelve-lens invariant-discovery experiment), not a declared-correct definition"
  - concept: "Incomplete Knowledge vs. Irreducible Uncertainty"
    definition: "Incomplete Knowledge: hat-V_t(p) falls short of a theoretically achievable V_t*(p)=1 due to insufficient information. Irreducible Uncertainty: even the ideal state itself has V_t*(p)<1, so no amount of additional information would resolve it to certainty"
refines:
  - concept: "0374's earlier two-gap distinction (epistemic incompleteness vs. irreducible uncertainty)"
    refinement: "Independently re-derives and sharpens the identical distinction via a fresh worked argument (hat-V_t(p) vs. V_t*(p) under two different failure sources), reconfirming it as a robust, recurring finding rather than a one-off observation"
  - concept: "0358's Intersection Method and 0369's Ten-Lens Matrix methodology"
    refinement: "Relaunches both as a unified twelve-lens invariant-discovery experiment applied to one concrete proposition traced end-to-end, sharpening the governing question to 'what structure is present in every valid interpretation?' as the explicit Kernel-discovery criterion"
  - concept: "0508's inverse-problem framing of Knowledge extraction (K≠P(K|O))"
    refinement: "Extended with the observation that the 'current situation' being compared against accumulated facts is itself only an estimate (hat-S_t≠S_t), placing an additional layer of uncertainty upstream of the comparison/determination step, before Knowledge is even assessed"
