  - concept: "FailureToFindCounterexample≠ProofOfCorrectness"
    definition: "Surviving fifty adversarial tests without finding a counterexample justifies the qualitative statement that no counterexample was found in the tested scenarios; it does not justify the stronger claim that no counterexample exists, nor does it license assigning a specific numerical confidence without a justified prior and likelihood model"
