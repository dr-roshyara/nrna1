about: >
  Opens declaring intent to "stop extending the conceptual model and begin reconstructing the actual
  KnowledgeOS/EKS implementation," with the Reconstruction contract `Component→Responsibility→Dependencies→
  Authority→Evidence→Context`, then `Current→Target→Delta`, and the fair caution "no component is declared
  architecturally wrong merely because its name differs from our target terminology." **This file constitutes
  the FOURTH consecutive file in the 0717-0721 mode-change arc, and — like 0718 and 0719/0720 before it —
  never performs genuine empirical archaeology**: the first-pass component inventory (§134.2) lists
  categories by name only (Governance mechanisms, Registry, Deterministic assurance, Hooks, Session/change
  logging, Claude harness, Codex harness, `AGENTS.md`, Agent memory, Engineering knowledge artifacts) with no
  cited file path, directory listing, or code excerpt, explicitly flagged "known architectural areas, not
  yet a complete component inventory." Every subsequent conclusion in the file, including its own verdict,
  remains explicitly self-labeled hypothesis ("this is a working reconstruction hypothesis, not yet a
  certified current-state architecture," §134.34; "this is still a hypothesis matrix pending repository
  evidence," §134.37). Per the 0694 calibrating meta-finding, this is recorded factually without further
  escalating framing.

  **Notably, this file does NOT extend the mode-change promise a fifth time** — unlike 0717/0718/0719, it
  does not close by declaring yet another concrete empirical-archaeology commitment for the next file.
  Instead it arrives at a stable, appropriately hedged architectural hypothesis and pivots to Step 135's
  Semantic Ownership Matrix, a conceptual/DDD-ownership exercise consistent with the reconstruction's
  long-standing home register. This quiet abandonment of the escalating empirical promise (rather than a
  fifth explicit commitment) is itself a meaningful confirmatory data point for the 0694 calibrating
  meta-finding: the corpus's promise-then-defer pattern appears to self-resolve into a return to conceptual
  synthesis once the specific empirical framing has been exhausted, rather than persisting indefinitely.

  **Despite never performing genuine archaeology, this file delivers the arc's richest, most mature
  architectural hypothesis about the existing KnowledgeOS/EKS ecosystem.** It delivers "an important
  observation": KnowledgeOS "has evolved as a platform around agents, rather than simply as a conventional
  knowledge-management application," combining `Knowledge+Governance+AgentExecution+Assurance` — "we should
  not force it into the conceptual shape of a traditional Knowledge Management System." It directly
  addresses (still at the hypothesis level) 0712's open "ecosystem of bounded contexts" question: "the
  evidence so far points toward" `KnowledgeOS≠one domain model`, but rather
  `KnowledgeOS=Platform+DomainContexts+Assurance+AgentIntegration`.

  **Delivers the Platform-vs-Domain distinction, a genuinely valuable architectural separation principle**:
  Platform provides registration/execution/integration/hooks/context delivery/persistence/observability;
  Domain provides knowledge/governance/evidence/assurance semantics — "if these are mixed, the platform
  becomes difficult to evolve." Applies this to the Registry (`Registry=Identity+Discovery+Metadata`,
  "should not automatically be considered `KnowledgeDomain`," with a worked contrast between a
  platform-metadata-only entry and one carrying genuine governance semantics like `Decision/Authority/
  Validity/Evidence/Supersedes`) and to Hooks (`Hook=ExecutionMechanism` vs. `Rule=Domain/
  AssuranceSemantics` — "multiple technical mechanisms can execute the same architectural rule").

  Flags Deterministic assurance as "potentially the strongest existing architectural asset," worked through
  a five-stage evolutionary hypothesis (`Individual checks→Reusable verification mechanisms→Governed
  architecture rules→Evidence-producing assurance→Continuous architecture fitness`). Delivers `Log≠Evidence`
  ("a log is a technical record. Evidence has semantic meaning and provenance") and the
  Logging-to-evidence-promotion pipeline (`TechnicalLog→EvidenceAdapter→Evidence`), preserving existing
  logging mechanisms without making the logging format itself the domain model.

  **Delivers `PLP-01`, formally codifying the reconstruction's single most-tracked test case (the
  pointer-layer principle, tracked continuously since 0687) into yet another distinct, named invariant
  series** ("Pointer-Layer Principle"): "agent-specific artifacts may point to authoritative engineering
  knowledge but must not silently redefine it," applying to Claude, Codex, and future agents. Delivers the
  Memory-promotion pipeline (`Agent observation→Local memory→Candidate claim→Evidence→Verification→
  Governed knowledge`) and an Explicit-relationship-strength scale (`Weak` — filename coincidence;
  `Strong` — stable identifier; `VeryStrong` — cryptographic/evidential linkage), complementing 0716's T0-T4
  edge-traceability scale with a distinct existence-strength variant. Delivers Identity-centrality
  (candidate identity types `KnowledgeID, DecisionID, EvidenceID, VerificationID, AgentSessionID, ActionID`,
  "without stable identity, graph relationships become fragile") and Versioning/historical-identity
  (`KnowledgeState(K42,t)`, "required for historical reconstruction").

  **Delivers `Document≠DomainEntity`, a precise, valuable general distinction extending 0719's
  ADR≠Decision-entity finding**: a document can represent a Decision, but the Decision itself needs its own
  identity, lifecycle, authority, validity, and relationships — worked through a concrete mapping example
  (`ADR-42→DecisionID D42→Knowledge K17→Rule R11`, "the ADR document may remain the human-readable artifact.
  The domain object provides the semantic identity"). **Delivers "Markdown remains valuable," an explicit
  and appropriately mature anti-overcorrection caution**: "we should not conclude 'Markdown must be
  replaced by a database.' That would be premature" — Markdown can remain a `HumanReadableProjection` while
  the semantic model separately provides authoritative relationships.

  **Delivers `GitHistory≠GovernanceAuthority`, extending the corpus's Runtime≠Intent family into Git
  specifically**: "a commit can prove that a change happened. It cannot alone prove that the change was
  organizationally authorized," worked through a concrete, currently applicable AI-engineering example: an
  agent-created `Commit C81` proves `C81 exists`, but KnowledgeOS must separately establish
  `C81→AuthorizedAction` and `C81→VerifiedImplementation`.

  **Delivers the file's most significant architectural insight — "the critical architectural gap"**
  (§134.35): the missing element is not another agent, but "explicit semantic linkage" between
  `Governance↔Knowledge↔Evidence↔Assurance↔Implementation` — "that is exactly what the Assurance Graph
  addresses," directly tying this entire archaeology phase back to 0716's central deliverable. Delivers
  "therefore the target may be evolutionary" — an explicit rejection of a
  `CURRENT→DELETE→NEW KNOWLEDGEOS` replacement path in favor of a concrete six-item evolutionary strategy
  (`strengthen registry, formalize knowledge semantics, formalize evidence, connect assurance, normalize
  agent pointers, add graph relationships`)→`ASSURANCE GRAPH`, explicitly called "a much lower-risk
  architecture evolution" and directly extending 0717's/0718's/0719's migration-principle discipline into a
  concrete action plan.

  **Delivers the Architecture-delta hypothesis, a twelve-row worked table — the most complete
  concrete-action delta table in the reconstruction to date**, though still explicitly labeled "a hypothesis
  matrix pending repository evidence": Registry→Strengthen; Governance artifacts→Formalize; Markdown
  knowledge→Retain+structure; Hooks→Retain+connect to rules; Deterministic checks→Strengthen; Session
  logger→Connect; `.claude/`→Normalize; `.codex/`→Normalize; `AGENTS.md`→Constrain; `.claude/memory/`→
  Constrain/promote; Evidence relationships→Introduce/formalize; Authority model→Formalize.

  **Delivers "the architectural center shifts,"** a precise BEFORE/AFTER framing directly reinforcing
  0717's "architectural center" capstone: the existing platform appears organized approximately around
  `Agent+Knowledge+Tooling`; the mature target should instead be organized around `Governed Engineering
  Knowledge+Evidence+Assurance`, with agents becoming "consumers and actors around that center."

  Delivers Step 134's verdict, honestly qualified as "an important preliminary conclusion": "KnowledgeOS
  already contains many of the required mechanisms," reframing the central architectural challenge from
  "build a new platform" to "make the existing mechanisms semantically explicit, establish authority
  boundaries, and connect them through an evidence-backed assurance model" — the strongest candidate
  transformation: `Existing Platform→Governed Knowledge Platform→Assurance Graph`.

  **Closes by opening "Step 135 — Architecture Reconstruction: The Semantic Ownership Matrix,"** posing
  "who owns each concept?" via `Concept→Owner→Invariant→Authority→Consumers`, covering a sixteen-concept
  list (Decision, Policy, Knowledge, Claim, Evidence, Observation, Rule, Verification, Finding, Exception,
  Recommendation, Action, Agent, Session, Artifact, Runtime State) — "once ownership is explicit, we can
  determine `BoundedContext` more rigorously than by directory names or technology boundaries." This
  represents a return to the reconstruction's conceptual/DDD-ownership register rather than a fifth explicit
  empirical-archaeology promise. No actual code execution, repository inspection, or verified filesystem/
  architecture claim reported anywhere in this file — every diagram, table, and worked example remains an
  explicitly self-labeled hypothesis about the existing KnowledgeOS/EKS ecosystem, not an observed fact.
