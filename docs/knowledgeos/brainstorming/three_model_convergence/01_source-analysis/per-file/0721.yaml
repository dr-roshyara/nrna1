defines:
  - concept: "Platform vs. Domain"
    definition: "Platform capabilities (registration, execution, integration, hooks, context delivery, persistence, observability) are architecturally distinct from Domain capabilities (knowledge, governance, evidence, and assurance semantics); mixing the two makes the resulting system difficult to evolve, because platform-level mechanisms and domain-level meaning have different rates and reasons for change"
  - concept: "PLP-01"
    definition: "Agent-specific artifacts (Claude's .claude/, Codex's .codex/, and any future agent's equivalent) may point to authoritative engineering knowledge but must never silently redefine it -- the formally codified name for the reconstruction's long-tracked pointer-layer principle"
  - concept: "Document≠DomainEntity"
    definition: "A document (e.g. an ADR markdown file) can represent a domain object (e.g. a Decision), but the domain object requires its own identity, lifecycle, authority, validity, and relationships independent of the document that describes it; conflating the two treats the document's mere existence as proof of the domain object's full semantic structure"
  - concept: "GitHistory≠GovernanceAuthority"
    definition: "A Git commit proves that a change occurred, but it cannot by itself prove that the change was organizationally authorized or that the resulting implementation was verified; KnowledgeOS must separately and explicitly establish the commit's authorization and verification status rather than treating commit existence as sufficient governance evidence"
