defines:
  - concept: "Optimization≠Preference"
    definition: "Proving that an alternative is not Pareto-dominated is a mathematically objective fact requiring no value judgment; but selecting a single 'best' choice among multiple Pareto-optimal alternatives requires an irreducible subjective value judgment or governed policy that mathematics alone cannot supply"
  - concept: "WeightSelection is itself a governed artifact"
    definition: "The weights used to combine multiple objectives into a scalar utility (w_1,...,w_n) are not mathematical facts derived from the world but a preference model reflecting organizational values; their origin, authority, and version must be recorded as first-class governed provenance, not treated as given constants"
  - concept: "Is⇏Ought (Hume's-Law boundary)"
    definition: "An empirical, descriptive fact (what is, or what is statistically associated) does not by itself logically determine a normative conclusion (what ought to be done or preferred); KnowledgeOS must not silently transform a descriptive/predictive/causal statement into a normative one without an explicit value model bridging the gap"
  - concept: "WorldModel≠ValueModel≠PolicyModel"
    definition: "A causal/world model describes how reality behaves; a value/decision model describes how outcomes are weighed against each other; a policy model describes what actions are permitted — these are three distinct kinds of models serving different epistemic and governance roles, and conflating them into one undifferentiated model produces GovernanceOpacity"
  - concept: "NarrativeExplanation=Projection, not SourceOfTruth"
    definition: "A decision's authoritative rationale is its actual structured dependency record (evidence, causal model, decision model, policy); an LLM-generated natural-language explanation is merely a human-readable rendering (projection) of that structure, never itself an independent source of evidentiary or decision-making authority"
