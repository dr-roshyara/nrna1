defines:
  - concept: "TransitionAllowed(r)⟺Req(r)⊆Witness(r)"
    definition: "A candidate formal admission rule for the KnowledgeOS Kernel: each transition type r has a required witness-component set Req(r) (drawn from evidence, temporal context, authority, and governance-basis components), and the transition is permitted if and only if the actually-supplied witness for that transition instance is a superset of the required set -- this lets the Kernel enforce structural preconditions without needing to understand or evaluate domain semantics itself, which is offered as the mathematical explanation for why a minimal, domain-agnostic Kernel is architecturally plausible"
  - concept: "The Kernel as Invariant Enforcement Boundary"
    definition: "Mathematically, the Kernel is not a knowledge store or a database abstraction but the boundary that admits or rejects proposed state transitions based solely on whether their declared preconditions (witness requirements) are satisfied -- it explicitly does not calculate probabilities and declare truth, does not determine organizational or moral authority, does not interpret domain meaning, and does not judge whether an inference is semantically reasonable; all of that belongs to a separate semantic-evaluation layer, keeping the Kernel small, generic, and deterministic"
  - concept: "The semantic evaluator / transition validator split (f_sem vs. f_val)"
    definition: "Two functionally and architecturally distinct roles: f_sem(E,p)→Assessment is the intelligent, domain-specific function that evaluates evidence against a proposition to produce an assessment (appropriately performed by a human, an AI, or a domain-specific rule engine, and legitimately probabilistic or judgment-based); f_val(Assessment,r)→Allowed/Rejected is the deterministic function that checks whether a proposed transition's declared preconditions are met given that assessment (appropriately performed by the Kernel, and never itself judging the assessment's correctness) -- named 'exactly the architecture we have been searching for' because it lets AI participate richly in f_sem while keeping f_val strictly deterministic and auditable"
  - concept: "JustifiedStateTransition as the central mathematical object"
    definition: "Reframes KnowledgeOS's fundamental unit of concern away from static Knowledge (a stored state KS_n) toward the full witnessed trajectory of how that state was reached (KS_0→[W_0]→KS_1→[W_1]→...→KS_n) -- the organization's epistemic value lies not in what is currently believed but in the preserved, justified sequence of transitions that produced that belief, directly explaining why reconstruction (0809) and epistemic lineage (throughout the arc) are more fundamental architectural concerns than the current-state snapshot itself"
