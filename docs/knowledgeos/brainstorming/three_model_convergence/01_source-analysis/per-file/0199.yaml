about: >
  A second Timothy Williamson source (Modal Logic as Metaphysics, Oxford, 2013), distinct from the
  Knowledge-and-Its-Limits extraction at 0171, mined for theory-comparison METHODOLOGY rather than modal-
  metaphysics conclusions: "how do we compare competing conceptual systems without prematurely declaring
  one of them the truth?" -- explicitly framed as directly relevant to architecture reconstruction, DDD
  discovery, and AI reasoning. Produces thirty numbered KOS-WILL-001..030 findings via the 0191 protocol
  format. Key extractions: (1) logic is not a neutral referee -- it can itself function as a structural
  core of a theory and be disputed as part of the theory, mapped onto a warning that the KnowledgeOS Kernel
  is not automatically "neutral infrastructure" but may itself be "a minimal structural theory" requiring
  evidence/argument/comparison/governance to justify; (2) competing theories should be developed
  systematically (as complete rival theories, not straw-men) before comparison -- a direct research
  protocol for evaluating candidate architectures; (3) theory comparison requires theoretical virtues
  (strength, simplicity, compatibility with existing knowledge), not merely minimizing ontological
  commitments -- directly challenging the "fewer entities is always better" architectural instinct, with a
  worked counterexample (removing an explicit Capability concept can produce fewer entities but a LESS
  simple theory if the logic disperses across middleware/controllers/policies/UI); (4) reduction to a lower
  level is not automatically methodologically superior -- a higher-level theory (e.g. domain model) may
  need independent development and comparison even if theoretically reducible to a lower level (e.g. code),
  because bridge laws connecting them may be too complex/uncertain to make the reduction practically
  useful -- explicitly flagged as strong cross-lens convergence with Chalmers (0195/0197); (5) constraints
  between abstraction levels are BIDIRECTIONAL, not merely bottom-up -- domain/architecture/implementation/
  runtime/evidence mutually constrain each other; (6) bridge laws may themselves be uncertain, directly
  complementing Chalmers's bridging-principle/epistemic-lever concept, motivating a KnowledgeBridge object
  (source_level/target_level/relation/assumptions/evidence/confidence/validity_scope) explicitly flagged as
  very strong cross-lens convergence; (7) abduction is generalizing/unifying/ordering what is known, not
  merely "best explanation" -- an agent should ask what general principle organizes several observations,
  not generate independent per-observation explanations; (8) laws can explain by generalization, not only
  by causation, motivating a five-way explanation typology (causal/structural/functional/logical/
  architectural); (9) general principles require independently testable consequences, and failed
  counterexamples should be investigated for whether they instantiate a GENERAL repeatable failure pattern
  rather than being patched as isolated anomalies -- explicitly compared to experimental repeatability and
  flagged as a major AI-assurance principle (test-fails -> patch-test is explicitly rejected in favor of
  classify-failure -> search-for-general-pattern -> generate-additional-cases -> determine-invariant-
  violation); (10) evidence itself can be wrong (abductive reasoning does not require infallible data),
  motivating an EvidenceStatus taxonomy (observed/reproduced/independently_confirmed/disputed/superseded/
  invalidated) distinct from a bare evidence-equals-truth assumption; (11) mature disciplines develop
  standards for evaluating evidence over time (confusion->competing-standards->emerging-standards->
  established-principles->mature-methods), supporting the corpus's existing methodological-maturity
  concepts; (12) explicit rules are insufficient for good judgment -- "any explicit rule can be applied
  unwisely," directly relevant to AI-agent design, arguing the platform needs rules+examples+
  counterexamples+training+feedback+governance, not merely more rules; (13) representation is not meaning
  (formal/set-theoretic encodings are convenient representations, not the metaphysical content itself) --
  a YAML file is not the architecture, a class is not the domain concept, a graph edge is not automatically
  a semantic relation, a vector embedding is not the knowledge itself; (14) compositionality as a
  structural constraint -- a knowledge object's meaning should be composable from entity+relation+scope+
  context+state+qualification rather than being an arbitrary text bag, illustrated with a worked example
  ("DeterminationIssued" requires Context/Aggregate/Trigger/Authority/Temporal-relation to carry its actual
  semantics); (15) don't infer ontology directly from representation without establishing the intended
  interpretation -- directly relevant to LLM embeddings/vector-databases/JSON-schemas/UML-diagrams/
  database-tables/classes/events/YAML-registries; (16) weakness is not automatically a virtue -- a
  deliberately weakened, maximally-neutral theory is not thereby a BETTER theory (physics would stagnate if
  every theory were weakened to stay neutral between rivals), directly challenging the "make the Kernel as
  weak as possible so everyone agrees" architectural instinct, reframed as minimal+precise+strong-enough+
  evidence-supported; (17) neutrality and truth are different goals -- a Neutral Representation, a Canonical
  Representation, and a Truth-Claiming Representation are three distinct things, motivating a
  NeutralKnowledgeRepresentation candidate that supports cross-context communication without resolving
  underlying conceptual disputes; (18) competing conceptual systems can communicate through a constructed
  neutral core/mapping without either side abandoning its own formulation -- directly mapped onto bounded
  contexts with different legitimate vocabularies communicating via a neutral semantic layer rather than
  forcing vocabulary unification; (19) mapping is not translation -- a mapping can identify what one theory
  is "getting at" in a way another can accept without claiming literal proposition-identity, motivating a
  relation-type taxonomy (EquivalentTo/MapsTo/Expresses/Approximates/RefersTo/AgreesWith/InterpretableAs);
  (20) coarse-grained vs. fine-grained identity/individuation must be distinguished depending on research
  purpose -- directly convergent with Chalmers's granularity-dependent equivalence work, extended into
  "same result != same structure" and an EquivalenceClaim schema (left/right/relation/granularity/scope/
  purpose/evidence) explicitly noted as reinforcing the identical conclusion independently reached from
  Chalmers; (21) theories should generate consequences beyond their premises, and be evaluated by what they
  are forced to accept downstream, not merely by reviewing their prose -- motivating a ConsequenceAnalysis
  concept and an explicit "if we accept this principle, what else becomes true? what does it make
  impossible?" review discipline; (22) negative results are knowledge -- Williamson systematically catalogs
  incompatibilities/counterexamples/failed-formulations/unacceptable-consequences to narrow the theory
  space, motivating RejectedHypothesis/InvalidatedClaim/FailedArchitecture/Counterexample/
  IncompatiblePrinciple as first-class knowledge objects, independently converging with 0174's
  RejectedHypothesis-is-knowledge principle and 0179's Tractarian sense-not-truth finding, now a third
  independent convergence on preserving rejected/failed material as valuable knowledge; (23) a failed
  argument's hidden assumptions can be revealed by systematically varying them to find which one actually
  carries the result -- proposed as an explicit agent reasoning protocol; (24) "non-modal" does not mean
  "without modal consequences" -- absence of explicit statement about X does not imply absence of
  consequences for X, illustrated with an ADR-not-explicitly-stating-invariant-Y example; (25)
  representational significance has a scope -- not every representational difference matters to what is
  represented, motivating an explicit RepresentationalScope per artifact type (architecture diagrams
  represent boundaries/dependencies, deployment diagrams represent runtime topology, ADRs represent
  accepted decisions, tests represent behavioral evidence -- none is a complete representation of the
  others' scope); (26) formal model vs. intended interpretation must remain distinct -- a schema/graph/
  model does not automatically determine its own metaphysical/domain interpretation. Produces a fourteen-
  row "don't-collapse" distinction matrix (logic/theory, representation/meaning, model/interpretation,
  neutrality/truth, translation/mapping, equivalence/identity, simplicity/minimality, consequence/evidence,
  evidence/certainty, counterexample/general-failure-pattern, lower-level-reduction/higher-level-theory,
  explicit-rule/judgment, ontology/representation-of-ontology, coarse-identity/fine-identity) explicitly
  called "perhaps the most practically valuable part of the book," and eight ranked candidate principles
  P1-P8 (Theory Comparison, Bidirectional Constraint, Explicit Bridge, Consequence Testing, Counterexample
  Generalization, Representation/Meaning Separation, Neutrality!=Truth, Rule!=Judgment). Closes with an
  explicit combined-with-Chalmers synthesis and an explicit reformulated Kernel-design question: not "how
  little can the Kernel say?" but "what is the smallest set of principles strong enough to support the
  strongest generalizations justified by our evidence?" -- explicitly declines to promote any finding
  directly into the Kernel, adding everything to the research corpus pending cross-book convergence testing.

introduces:
  - "Theory-comparison as an explicit research protocol: develop competing theories/architectures fully
    (not straw-men) before comparing them via theoretical virtues (strength/simplicity/compatibility), not
    merely by minimizing entity count"
  - "Weakness-is-not-automatically-a-virtue: challenges the architectural instinct of deliberately weakening
    a Kernel to appear neutral -- a weak theory is not thereby a better one"
  - "Neutral Representation vs. Canonical Representation vs. Truth-Claiming Representation as three
    distinct goals, motivating a NeutralKnowledgeRepresentation concept for cross-context communication
    without resolving underlying conceptual disputes -- distinct from forcing vocabulary unification across
    bounded contexts"
  - "Mapping-is-not-translation, with a seven-value relation-type taxonomy (EquivalentTo/MapsTo/Expresses/
    Approximates/RefersTo/AgreesWith/InterpretableAs) for cross-context semantic relationships"
  - "The counterexample-generalization principle: a failed test/argument should trigger a search for the
    GENERAL repeatable failure pattern it instantiates, not a local patch -- explicitly compared to
    experimental repeatability, called a major AI-assurance principle"
  - "A third independent convergence (after 0174's Logitica and 0179's Tractatus) on negative-results-are-
    knowledge: rejected hypotheses, invalidated claims, and counterexamples are first-class knowledge
    objects, not merely discarded failures"
  - "An explicit hidden-assumption-discovery reasoning protocol: when an argument fails, systematically vary
    its underlying assumptions to determine which one actually carries the result"
  - "A fourteen-row 'don't-collapse' distinction matrix, explicitly called perhaps the most practically
    valuable single artifact extracted from the book"

