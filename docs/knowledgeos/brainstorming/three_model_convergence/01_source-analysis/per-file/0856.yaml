defines:
  - concept: "The derived-properties table (the file's central result)"
    definition: "A proposed functional decomposition showing each of the arc's previously-treated-as-independent architectural principles as a function of a small subset of the reduced five-element kernel (K,C,T,E,A): Semantic Integrity SI=f(K,C,T); Boundary Preservation BP=f(C,T); Epistemic Integrity EI=f(K,E); Governed Action GA=f(A,T); Temporal Lineage TL=f(T_{1:n}); Deterministic Assurance DA=f(E,T,Policy). The explicit conclusion is that these six (of the file's seven named) principles may not be seven independent architectural primitives but rather derived consequences of the smaller kernel -- directly resolving, within Step 230 itself, the independence-vs-derivation question that file 0855 had explicitly deferred to a separate 'Step 229'"
  - concept: "The context-mapping equivalence-relation model of semantic collapse"
    definition: "For a mapping φ_AB between two contexts' semantic spaces, define x1∼_φx2 iff φ(x1)=φ(x2); this induces equivalence classes [x]_φ. A semantic-loss event is a case where two elements are materially distinct in the source context (x1≁_Ax2, i.e. via the materiality predicate M_A) but become identified after mapping (φ_AB(x1)=φ_AB(x2)). Such a collapse counts as a genuine SemanticViolation only when the collapsed distinction is material in the source or target context (M_A or M_B) AND the collapse is uncontrolled/undeclared: SemanticViolation⟺MaterialDistinction∧UncontrolledCollapse. This gives the informal 'preserve semantics' requirement from earlier files (0848/0849/0851/0852) a precise, checkable equivalence-relation formalization for the first time"
  - concept: "The step-skip / inline-resolution pattern (Step 229 never appearing as its own file)"
    definition: "0855 (Step 228) explicitly opened 'Step 229 -- Derive the Core Architectural Invariants' as the next planned unit of work, posing the specific question of whether seven named candidate invariants are independent or derivable from deeper primitives. The very next primary-corpus file in this reconstruction's sequential pass (0856) is titled 'Step 230,' with no intervening Step 229 file -- yet Step 230's own §230.30-230.34 content directly and substantively answers exactly the question Step 229 was set up to investigate (the derived-properties table). This is either a numbering/authoring artifact (Step 229's content folded silently into Step 230's file) or a genuine skip in the corpus's own step sequence; either way it is the first confirmed instance of a promised step's content appearing without its own dedicated file, which future continuation should watch for as a recurring corpus quirk distinct from the two file-boundary/timestamp-ordering quirks already found at 0836/0837 and 0844"
