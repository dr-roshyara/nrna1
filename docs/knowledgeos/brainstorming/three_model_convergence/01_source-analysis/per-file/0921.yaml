defines:
  - concept: "The theoretical stopping-point criterion"
    definition: "A reframed, non-binary criterion for deciding whether a theory-reconstruction research programme should stop inventing new foundational theory: rather than asking the vague, all-or-nothing question 'is the theory complete?', ask specifically whether any remaining unresolved item is NECESSARY for the theory's own definition, semantics, transformation rules, identity relations, or invariants -- i.e. whether resolving it is a genuine prerequisite for the theory to be internally consistent and well-defined at all. If every remaining unresolved item can instead be classified as an implementation obligation, an empirical-observation gap, a governance/normative decision, or an engineering task -- none of which bears on whether the theory ITSELF is well-formed -- then the theory has reached its theoretical stopping point, even though substantial validation, ratification, and operationalization work may still remain. This decouples 'is the theory internally sound' from 'has the theory been fully validated against reality and ratified by governance,' which the corpus's own prior work had repeatedly conflated"
  - concept: "The theory-critical dependency matrix"
    definition: "A required six-stage analytical procedure applied to every remaining open or blocked item in the theory's gap register, used to decisively classify whether that item is theory-critical: (1) identify which definition or invariant, if any, actually requires this construct; (2) determine whether the theory can express the construct at all (even if unresolved); (3) determine whether the theory can reason about the construct (derive consequences, test consistency); (4) determine whether the construct is necessary for K, Σ, the transformation family T, Policy, or Authority specifically; (5) as the decisive final test, determine what happens if the item remains permanently unresolved -- does the theory become logically inconsistent, or does it merely remain silent/incomplete on a question outside its declared scope? Only an item that fails this final test (whose non-resolution genuinely breaks the theory's internal consistency) may be classified as a genuine theory-critical defect; every other remaining item, however unresolved it may feel, belongs to implementation, empirical validation, governance, or engineering instead"
