defines:
  - concept: "'Implementation>Theory' as an explicitly valuable audit outcome"
    definition: "One of four situations the eventual Steps-1-182 alignment audit should specifically detect: a case where the actual software implementation exhibits architectural concepts, distinctions, or mechanisms that the current mathematical/theoretical model has not yet formalized. This is explicitly flagged as 'extremely valuable' rather than merely a gap in the theory, because it treats the historical software artifact as a potential SOURCE of new architectural theory rather than solely a target for testing existing theory -- a notable methodological stance distinct from the arc's more common framing of the audit as confirming or falsifying a pre-existing hypothesis"
  - concept: "The double-sided architectural-humility principle"
    definition: "A symmetric methodological constraint on how theory and implementation may inform the canonical architecture: (1) no mathematical or conceptual construct, however elegant, may be adopted as part of the canonical KnowledgeOS architecture until it survives direct implementation evidence; and symmetrically (2) no implementation mechanism, however widely used in the actual software, may be promoted into the conceptual theory until its domain meaning has been genuinely understood (rather than merely observed as a pattern). Explicitly designed to guard against two opposite failure modes simultaneously: top-down overengineering (elegant mathematics imposed without evidence) and bottom-up accidental architecture (implementation quirks mistaken for intentional design)"
