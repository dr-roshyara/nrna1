    refinement: "Directly resolved: Williamson is read and integrated; the working truth+evidence+justification=knowledge decomposition is explicitly abandoned in favor of knowledge-as-prime, factive, broad, non-luminous"
  - concept: "The corpus's own earlier 'knowledge = capacity' proposal (this reconstruction's tracked Knowledge-as-Capacity closing synthesis, 0294)"
    refinement: "Explicitly corrected: capacity precedes and enables knowledge but is not identical to it (CAPACITY -> access/observation/reasoning -> epistemic state -> KNOWLEDGE)"
  - concept: "0285's Preservation Substrate synthesis and its UNKNOWN eight-category taxonomy (0285/0286)"
    refinement: "Extended with a Williamson-grounded assessment-status vocabulary (KNOWN/UNKNOWN/UNKNOWN WHETHER KNOWN/DISPUTED/OUTSIDE CURRENT MODEL/UNASSESSED) and a new K-INV-07 anti-luminosity invariant; UNKNOWN-taxonomy work not superseded, cross-validated"
  - concept: "0273 vs 0276/0278's unreconciled McGinn adversarial-lens-vs-literal-architecture tension"
