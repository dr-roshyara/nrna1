tier2_reason: "Landmark capstone synthesis file, explicitly flagged as pending since 0279. Argues the corpus's entire bottom-up knowledge-modelling process has been backwards and that Knowledge=Truth+Belief+Evidence+Justification should be abandoned in favor of treating knowledge as a factive, broad, prime, non-luminous primitive. Introduces seven new Kernel invariants (K-INV-01..07), a Reduction/Primeness two-part ontology test, a Knowledge Margin quantity M(P,A,C), a metaknowledge/self-report layer, a revised quantification vector Q(K,P,C,t), and a revised Kernel inside/outside/above boundary. Corrects the corpus's own prior 'knowledge=capacity' proposal (0294) and explicitly cross-validates its master capstone principle against seven independent prior lenses (McGinn, Floridi, Dretske, Fagin, Gardenfors, Searle, plus itself). Recommends ending the philosophy-reading phase in favor of formal meta-modelling and Zero-Lens falsification."
