about: >
  Peter Achinstein's "The Book of Evidence" (philosophy of science), mined via Zero + DDD + Wisdom
  lenses as a direct continuation of the 0205/0208/0209 causal-assurance arc. Central discovery:
  evidence acquisition is itself a domain, prior to evidence assessment — "Observation != Evidence."
  Uses Achinstein's historical Hertz/Thomson cathode-ray example (identical observed result,
  disagreement over evidential status, later shown to depend on an experimental flaw) and his
  biased-raven-selection and Michael-Jordan-Wheaties examples to argue that the SELECTION PROCEDURE
  by which an observation was obtained is constitutive of its evidential status, not mere metadata.
introduces:
  - concept: "Observation != Evidence, refined to Observation -> Candidate evidence -> Evidence assessment"
  - concept: "Selection Procedure as a first-class concept: the rule determining how to test or obtain evidence for/against a hypothesis; evidential status is partly determined by HOW an observation was obtained"
  - concept: "EvidenceAcquisition aggregate (Question/Hypothesis/TargetPopulation/SelectionProcedure/ObservationMethod/MeasurementMethod/Conditions/Instrumentation/SamplingRules/Exclusions/Competitors/ExpectedObservations/Result)"
  - concept: "Evidence Acquisition Context as a strong bounded-context candidate (explicitly not yet certified)"
  - concept: "Evidence Acquisition lifecycle: EvidenceQuestion -> AcquisitionDesign -> SelectionProcedure -> Observation -> Measurement -> ObservationRecord -> AcquisitionValidation -> CandidateEvidence -> EvidenceAssessment"
  - concept: "Two-dimensional evidence provenance: SOURCE PROVENANCE (who/when/where/version) vs. ACQUISITION/EPISTEMIC PROVENANCE (why selected, how generated, under what conditions, what alternatives excluded)"
  - concept: "Proposed invariant: no observation supporting a knowledge claim shall be treated as evidence without preserving its selection/generation procedure, when one exists"
  - concept: "EvidenceNeed concept (Decision/Claim/Uncertainty/RequiredObservation/RequiredPopulation/RequiredComparison/RequiredTimeHorizon/AcceptanceCriteria) -- reframes KnowledgeOS from data-warehouse-plus-AI to purpose-driven evidence system"
  - concept: "Evidence Quality != Quantity; Evidence Quality decomposed as observation quality x selection quality x measurement quality x context adequacy x explanatory relevance (explicitly NOT a literal formula, an architectural decomposition)"
  - concept: "Selection Audit capability: eight-question checklist (target population / actually observed / how selected / could selection guarantee the result / what excluded / exclusions known beforehand / alternative procedure possible / procedure appropriate to hypothesis)"
  - concept: "MeasurementContext as an 'epistemic measurement contract' (instrument/configuration/calibration/environment/resolution/detection-limits/operating-conditions/known-failure-modes)"
  - concept: "Three distinct objects that must not collapse: Observation (what happened) / Acquisition (how we obtained knowledge of it) / EvidenceClaim (why it supports the hypothesis)"
  - concept: "AlternativeExplanation as a first-class concept; acquisition should be designed to discriminate between hypothesis and named alternatives, not merely collect supporting evidence"
  - concept: "EvidenceRelevance: true observation != decision-relevant evidence (Michael-Jordan-Wheaties example: high probability given a fact is not itself an evidential/explanatory connection)"
  - concept: "EvidenceObservation distinguished from Observation: an operationally-collected observation may only later become evidence for a hypothesis not yet formulated at collection time -- evidence need not be newly predicted"
  - concept: "'Evidence is contextualized observation' -- the same observation can be evidence for one hypothesis and irrelevant to another"
  - concept: "Combined 24-step epistemic operating loop: Decision -> Evidence Need -> Evidence Question -> Acquisition Design -> (Selection/Measurement/Context) -> Observation -> Acquisition Audit -> Candidate Evidence -> Evidence Assessment -> Statistical Analysis -> Causal Assessment -> Knowledge -> Wisdom -> Decision"
  - concept: "Proposed AI-agent guard: agents must not collect 'supporting evidence' without an acquisition strategy (clarify hypothesis -> identify evidence need -> identify competing explanations -> define selection criteria -> collect -> record provenance -> audit selection -> assess -> conclude)"
  - concept: "Fourteen-question 'Evidence Acquisition & Provenance' discovery-round agenda (Q1-Q14), explicitly proposed as the next research round rather than jumping to implementation"
