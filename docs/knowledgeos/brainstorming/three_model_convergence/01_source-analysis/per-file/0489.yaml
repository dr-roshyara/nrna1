  - concept: "Priority target generalized from 'deficiency' to {Gap,Conflict,Finding,Question,Investigation,Action,...}, following 0488's Discrepancy≠Deficiency correction"
  - concept: "Priority reconceived as a context-relative relation Priority(d|S_t,P_t,C_t,R_t), not an intrinsic property of a finding/deficiency"
  - concept: "Severity≠Urgency≠Priority fully separated as three distinct concepts, with a worked counter-example (high-severity/low-urgency -> medium priority; low-severity/high-urgency -> high priority)"
  - concept: "Weighted-sum priority formula demoted from THE definition of priority to ONE possible policy implementation: π=F_policy(factors) is fundamental; π_weighted=Σw_i·x_i is merely an implementation choice"
  - concept: "Cost's sign corrected (high cost should reduce, not increase, priority) and Dependencies split into DependencyBlock (prerequisite gating) vs. DependencyLeverage (downstream unlocking) as two distinct, non-collapsible concepts"
  - concept: "Impact split into three distinct concepts: Consequence(d), Benefit(d), and Leverage(d) -- Impact≠Benefit≠Leverage"
  - concept: "Feasibility-First demoted from a general principle to one situational policy strategy: 'feasibility influences priority only through policy'"
  - concept: "Dependencies modeled as a graph G_D=(V,E) rather than a scalar factor, converting prioritization into a constrained ordering problem Order(Δ,G_D,π,Γ) where hard prerequisites override raw priority score"
  - concept: "Finding≠Action: prioritization must produce an action plan, not an ordered list of findings, since a single finding admits multiple candidate resolution actions"
  - concept: "Resolution Opportunity object O=(Target,Action,ExpectedEffect,Cost,Prerequisites,Context) introduced as the proper object of prioritization, replacing the bare deficiency/finding"
  - concept: "Priority's numeric [0,1] range removed as a requirement: priority may be an ordered set under a policy-defined ordering ≻, with numeric scoring as one optional implementation"
  - concept: "Sārathi corrected from 'select the highest-priority deficiency' to 'selects or recommends the next action based on the prioritized resolution opportunities and current purpose'"
