defines:
  - concept: "Resolution Opportunity (O)"
    definition: "O=(Target,Action,ExpectedEffect,Cost,Prerequisites,Context) -- a candidate action addressing a finding, the proper object over which priority is computed: π(O,S_t,P_t,C_t)"
  - concept: "Priority (final, corrected)"
    definition: "π:O×S×P×C->(𝒫,≻), a policy-defined ordering over candidate resolution opportunities, context- and purpose-dependent, not an intrinsic property of any finding; numeric scoring in [0,1] is one optional implementation, not a requirement"
  - concept: "Dependency graph (G_D)"
    definition: "G_D=(V,E) where (d_i,d_j)∈E means d_j depends on d_i; prioritization becomes constrained ordering Order(Δ,G_D,π,Γ), where a hard prerequisite can override raw priority score"
refines:
  - concept: "0485/0488's Discrepancy≠Deficiency and Discrepancy≠Gap/Conflict corrections"
    refinement: "Directly applied as the file's opening correction: prioritization cannot target 'deficiencies' as the fundamental abstraction, since a discrepancy may resolve to many different, non-deficiency finding types"
  - concept: "0483/0484's Guidance≠Authorization≠Execution≠Transition separation and Sārathi=Guidance-not-authority discipline"
    refinement: "Applied to correct Sārathi's role in prioritization: Sārathi recommends the next ACTION from a prioritized plan of resolution opportunities, never simply selects the top-scoring deficiency by fiat"
  - concept: "0482/0488's policy-parameter discipline (quantitative thresholds/severity scales are policy choices, not mathematical truths)"
    refinement: "Extended to the entire priority function itself: π=F_policy(factors) is fundamental, with any specific weighted-sum formula demoted to one implementation choice among several"
