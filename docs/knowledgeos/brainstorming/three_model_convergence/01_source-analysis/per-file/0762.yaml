about: >
  A two-line README establishing the provenance and epistemic status of the entire `external_research/`
  subdirectory: "this is external research to support or brainstorming measure theory related work of
  knowledgeos kernel. here are artifacts of deepseek saved. we should not take them as it is blindly."

  **This is a significant provenance-classification finding for this reconstruction**: it reveals a
  FOURTH distinct source stream feeding this corpus -- **DeepSeek** -- previously untracked across the
  691 primary files processed so far, which have been consistently understood (per this reconstruction's
  own established `model: {primary, secondary}` convention, `c1`=architecture/DDD/mathematics reasoning
  and `g1`=Gita-lens reasoning) as originating from a Claude/GPT-style reasoning stream. Every file under
  `external_research/` going forward must therefore be classified with this distinct provenance in mind:
  it represents an EXTERNALLY-SOURCED, independently-generated body of research explicitly flagged by the
  corpus's own author(s) as requiring skepticism -- "we should not take them as it is blindly" -- rather
  than the corpus's own primary c1/g1 reasoning voice.

  This directly instantiates, at the level of an entire subdirectory rather than a single artifact, the
  same epistemic-hygiene discipline this reconstruction has tracked since 0758's GN-01 (provenance-
  feedback-loop risk) and 0756-0761's broader evidentiary-discipline chain: material from a different,
  external generative source must be explicitly tagged and treated with appropriately reduced default
  trust, never silently absorbed as though it carried the same authority as the corpus's own primary
  research voice. The directory's own file list (confirmed via listing) contains a substantial further
  arc: several `hpa-*` (Human Principal Authority) ruling/review files evaluating this DeepSeek material,
  C4 architecture diagrams, distribution-theory-in-KnowledgeOS content, further Gita Chapters 6-10
  analyses, a "complete flowchart," a "complete pseudo-algorithm," a "complete knowledge transfer
  document," and a "complete Gita-KnowledgeOS term correspondence" -- confirming this subdirectory is a
  substantial, distinct arc requiring its own careful provenance-aware reading as this reconstruction
  proceeds sequentially through it. No architecture decision, invariant, or Gita analysis is delivered in
  this file itself; it is purely a provenance/classification declaration.
