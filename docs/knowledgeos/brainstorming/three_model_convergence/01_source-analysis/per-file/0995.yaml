about: >
  The actual R3 Hypothesis Register (previously known only by cross-reference, via files 0973-0994),
  status "9 of 16 mappings became testable hypotheses," revised 2026-08-31 with `H-K13` reassigned to Jñāna
  per the disambiguation this reconstruction already tracked (file 0990).

  **Delivers the full eleven-row hypothesis table** (H-K03 Knower/state distinction; H-K04b universal-knower
  image test; H-K06 action/result non-identity; H-K11 outcome-independence; H-K05 an Ātman-candidate
  invariant `P`; H-K08 Guidance≠Authority≠Decision≠Execution; H-K09 five distinct epistemic operations;
  H-K10 Role/Obligation/Permitted/Required separability; H-K06f failed-inquiry epistemic gain; H-K13
  Jñāna→Knowledge, explicitly marked "and it FAILS"; H-K16 Sañjaya=Ω), plus GK-01 (Kṛṣṇa→Ω) and GK-12 (Yoga)
  explicitly marked "not advanced."

  **Delivers the FULL H-K06f criteria table for the first time**, incorporating Reviewer A's already-tracked
  revision (file 0988) verbatim in place: criterion 4 (posterior changed) is struck through and replaced with
  the declared-metric version (`ΔU>0` or `ΔI>0`); criterion 5 ("only operational history was produced") is
  explicitly marked NOT epistemic gain, with the closing warning: **"Treating (5) as epistemic gain is how a
  knowledge system inflates its own evidence base — and it is exactly what a naive reading of 6.40 would
  license."**

  **Delivers the full H-K05 (Ātman) treatment for the first time**: stated against the null hypothesis that
  ordinary provenance already suffices, with named candidates for the invariant `P` (identity, provenance,
  lineage, historical continuity, knowledge source, epistemic identity) -- "If `P` reduces to provenance,
  H-K05 adds nothing," explicitly flagged as tested by R4 (already known, via file 0980, to have found
  exactly this: "ordinary provenance already supplies everything it was meant to provide," RX).

  **Delivers the full Jñāna/Tripuṭī derivation** (already tracked in outline via files 0988/0990): quotes the
  corpus's own Sanskrit gloss ("ज्ञान (Jñāna) — Knowing | Reasoning/transformation process," inside the
  Tripuṭī `Jñātā·Jñāna·Jñeya` = knower·knowing·known), confirms `Knowledge` is "absent from the 8 ratified
  primitives AND from the Steps 100-158 vocabulary," and closes: "Mapping a Priority-1 term onto a
  deliberately absent primitive would have reintroduced `Knowledge` by the back door. R4 — and it reinforces
  the ratified decision."

  **Delivers the Sañjaya (H-K16) summary**, restating `W--Ω-->O`, `Knower≠Observer`,
  `Sañjaya_K=(Observed,Inferred,Reported,Unknown,Conflicting,Unresolved)`, grade `R5` on structure, and
  EXPLICITLY CITES its full treatment as living in **`01-GAP-UPDATE-FROM-REVISED-286.md §2`** -- **this
  reconstruction's still-outstanding bridge candidate, named here for the third time (files 0990, 0993-
  indirectly, and now here) without yet being directly encountered.**
