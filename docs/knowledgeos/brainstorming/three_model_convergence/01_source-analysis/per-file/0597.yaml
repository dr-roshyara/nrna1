about: >
  Opens Step 25S directly executing 0596's closing commitment, with the file's own explicit motivating
  warning: "if identity is wrong, then almost everything we built before can become wrong" (the entire
  `Evidence→Assertion→Knowledge→Model→Decision` chain), because the system may be reasoning about the wrong
  object. **This file is the corpus's own deliberate stress-test of Knowledge Atma (0587) -- and it CONFIRMS
  and REFINES the concept rather than rejecting it**, directly fulfilling the highest-priority tracked
  bridge candidate for this reconstruction's own mandate.

  **Delivers the foundational separation `Reference≠Entity`**: a worked multi-reference example
  (hostname/IP/nickname all potentially denoting one server) grounds `SameEntity(r_1,r_2|C,E,M)` as
  irreducibly context-, evidence-, and identity-model-dependent, never mere string similarity. **Delivers
  a four-valued entity-resolution outcome space**: `Resolution(r_1,r_2)∈{Same,Different,PossibleSame,
  Unknown}`, explicitly rejecting a binary formulation. **Delivers the file's key safety principle**: a
  worked ambiguous-name (`nexus3` used in two conflicting documents) example demonstrating why `Unknown`
  is essential and must actively block automatic merging, rather than defaulting toward either `Same` or
  `Different`.

  **Delivers formal, carefully qualified SameAs/DistinctFrom relations**: `SameAs` should semantically
  behave as an equivalence relation (reflexive, symmetric, and transitive under strict entity identity),
  but **the EVIDENCE for SameAs is explicitly NOT necessarily transitive**
  (`Evidence(A,B)∧Evidence(B,C)⇏A=C`), formally distinguishing `SameAs` from `EvidenceForSameAs` -- another
  instance of the corpus's `Assertion≠Evidence` discipline. Delivers `DistinctFrom(x,y)` as formally
  distinct from `¬SameAs(x,y)` -- `KnownDifferent` vs. `NotKnownSame` -- unless the domain explicitly
  declares closed-world identity semantics.

  **Delivers a rich, evidentially graded treatment of identity evidence**: nine named identity-evidence
  types (globally unique identifier, database primary key, certificate identity, authoritative registry,
  exact system relationship, network identity, human confirmation, temporal continuity, cryptographic
  identity) with explicitly differing evidential strength, contrasting strong deterministic UUID-match
  evidence against weak, namespace-dependent name-match evidence -- **`IdentityEvidence is
  context-dependent`**. Delivers Composite identity (`IdentityKey=(Organization,Environment,Hostname,
  SystemID)`), formalized as **`EntityIdentity=ContextualTuple`** rather than a display name, directly
  reconfirming the corpus's established context-is-part-of-identity principle. Delivers Temporal and
  Logical/Physical identity distinctions (`SameLogicalRole(A,B)=True` while
  `SamePhysicalEntity(A,B)=False` for a hardware replacement, worked through a concrete server-migration
  example) -- **`Replacement≠SamePhysicalEntity`**.

  **Delivers the file's central formal deliverable -- Knowledge Atma refined from a two-level (0587) into
  a THREE-LEVEL identity split**: `EntityIdentity` (the real-world object referenced), `KnowledgeMeaningIdentity`
  (the semantic epistemic object an assertion represents, i.e. 0587's `KAID`), and `RecordIdentity` (the
  particular stored artifact/event, i.e. 0587's `RecordID`) -- explicitly self-described as "extremely
  powerful," worked through a concrete two-record example (differently worded records `R1`,`R2` sharing one
  `KnowledgeMeaningID` while carrying distinct `RecordID`s, both referencing one `EntityID=ProductionNexus`)
  that "preserves both semantic identity and provenance." **Delivers Knowledge Atma's finalized
  definition**: "the stable semantic identity of an epistemic meaning within a bounded context, while
  preserving explicit linkage to the real-world entity/entities, source records, temporal scope and
  provenance from which that meaning is derived," formalized as `KAID≠RecordID≠EntityID`, with
  **`KAID↔EntityID` itself an explicit, versioned semantic relationship** -- not an automatic identity.
  Delivers the explicit corrective that Knowledge Atma should NOT be simply "the ID of a record" and must
  remain stable under superficial label changes (`LabelChange≠IdentityChange`).

  **Delivers identity merge and split as formal, provenance-preserving revision events, directly extending
  0591's/0595's event-addition revision architecture into the identity layer specifically**: identity
  merge (`KAID_A,KAID_B→KAID_{Canonical}`, mapping preserved, no historical identity destroyed) and,
  notably, the much harder reverse operation, identity split (a previously-merged entity later found to
  actually be two, requiring `ReResolution(K(C))` of previously-attached knowledge rather than arbitrary
  reassignment) -- **delivering a new named Zero variant, `Zero=IdentityAmbiguity`** (e.g. "which server
  did this historical observation actually refer to?").

  **Delivers a disciplined identity-uncertainty-propagation safeguard**: `SameAs(A,B)=Possible` must NOT
  automatically propagate an assertion from `A` to `B` -- only `PotentialPropagation`, with inheritance
  becoming authoritative only once identity is confirmed -- "prevents catastrophic contamination of
  knowledge." Delivers an explicit rejection of automatic probability-to-identity conversion
  (`same_entity_probability=0.97` must never automatically become `SameAs=True`), formalizing
  **`IdentityThreshold is a policy, not a universal mathematical constant`**.

  Delivers a nine-stage Entity Resolution pipeline (Reference→Normalization→Candidate Generation→
  Identity Evidence→Context Check→Temporal Check→Conflict Check→Identity Assessment→Merge), with
  `Normalization≠EntityResolution` (superficial string cleanup only), an `O(n²)`-to-blocking/indexing
  complexity treatment (extending the corpus's established indexing discipline), and a provenance-carrying
  Identity graph `G_I=(V,E_I)` with typed `SameAs`/`DistinctFrom`/`PossibleSame` edges. Delivers the
  recurring LLM-governance reconfirmation applied specifically to identity: an LLM may generate identity
  candidates and semantic-similarity signals but must never autonomously establish identity in high-impact
  cases, formalized as `LLM→IdentityCandidate→Evidence→IdentityAssessment→Merge` -- **`AI proposes;
  governed epistemic machinery decides`**.

  **Delivers the file's most consequential single safety finding, self-named as such -- Identity
  contamination**: a formal cascading-corruption chain demonstrating why a single incorrect `SameAs`
  assertion is uniquely dangerous -- a wrong `SameAs(A,B)` misapplies `Evidence(A)` to `B`, corrupting
  `Knowledge(B)`, then `Model(B)`, then `Decision(B)` -- formalized as **`IdentityError is a
  high-propagation epistemic error`**, explicitly warranting stronger governance safeguards for identity
  resolution than for ordinary semantic similarity. Delivers identity provenance (every identity assertion
  must record why, with worked deterministic-match and probabilistic-resolution examples) and a
  three-stage identity lifecycle (Candidate→Supported→Confirmed, or →Rejected; Confirmed→Revised),
  event-sourced like the rest of the architecture.

  **Delivers identity formally shown time-dependent** (a worked IP-reassignment example across 2025/2026),
  requiring identity evidence to carry an explicit `TemporalScope`. **Delivers two crisp, architecturally
  load-bearing non-equivalences preventing a specific class of merge error**: `SameState(A,B)=True` does
  NOT imply `SameEntity(A,B)=True` (two different servers coincidentally sharing a version number remain
  different entities), and `SemanticEquivalent(A,B)` does not imply `SameEntity(A,B)` -- formalized as
  **`EquivalentProperties≠SameIdentity`**, explicitly warning the system could otherwise merge genuinely
  different systems merely because their properties match.

  **Delivers seven labeled falsification tests (A-G), ALL PASS**: same identifier (`Same`, subject to
  identifier contract); same name (`PossibleSame/Unknown`, not automatically `Same`); different environment
  (`Distinct`); same state, different entities (`SameState=True`, `SameEntity=False`); identity uncertainty
  (`Unknown`); identity merge (provenance preserved); identity split (affected knowledge re-evaluated).

  Delivers a computability reconfirmation for entity resolution (deterministic matching `O(1)`/`O(log n)`
  with indexes; candidate matching via hashes, indexes, blocking, graph algorithms, string similarity,
  embeddings, rule engines), with the file's precise conclusion: **"the difficult part is not computation.
  It is epistemic correctness."**

  **Delivers Step 25S's verdict**: **"25S — PASS,"** paired with an explicit, self-identified major
  architectural warning: **`Identity errors have unusually large propagation effects`**, requiring stronger
  safeguards than ordinary semantic similarity. **Delivers the file's central architectural result -- a
  six-layer hierarchy replacing the corpus's earlier undifferentiated use of "knowledge"**: World Entity →
  References/Observations → Evidence → Knowledge Meaning → Assessment → Decision, explicitly called "much
  cleaner than treating everything as 'knowledge.'"

  **Closes by identifying one deeper problem underlying everything solved so far**: how do we know a
  statement is CORRECTLY, logically derived from available knowledge and rules -- worked through a
  contrasted valid syllogism (`A→B∧B→C⇒A→C`) versus an invalid LLM-generated conclusion
  (`A→B∧B↛C` yet an LLM asserts `A→C`), requiring a formal boundary between `Inference` and
  `Unjustified Generation`. **Opens "Step 25T — Formal Inference, Derivation, Rules, Proof, Constraints and
  Verifiable Reasoning,"** posing the central question "Can KnowledgeOS represent a conclusion together
  with a machine-verifiable derivation showing exactly why that conclusion follows from its premises?" --
  explicitly framed as moving the architecture "from epistemic knowledge toward a genuine computable
  reasoning system," and "particularly important before we start claiming that the entire architecture is
  computationally complete." No actual code execution reported.
