tier2_reason: "LANDMARK OF FIRST-ORDER IMPORTANCE TO THIS RECONSTRUCTION'S OWN THREE-MODEL-CONVERGENCE MANDATE: this file is the corpus's own explicitly announced, deliberate stress-test of Knowledge Atma (0587) — the reconstruction's single highest-priority tracked bridge candidate at this point in the corpus — and it resolves the test as confirmation with substantial, well-motivated refinement rather than rejection. The two-level identity split from 0587 is extended into a three-level split by adding EntityIdentity as a prior, distinct layer; the provisional Knowledge Atma definition is finalized; and the relationship between Knowledge Atma and the real-world entity it concerns is itself formalized as an explicit, versioned semantic object rather than an automatic identity. Delivers a genuinely important, concretely traced safety finding — 'Identity contamination,' a named cascading-corruption failure mode — that precisely explains why identity errors are uniquely dangerous among all the epistemic error types the corpus has examined across its entire experimental sub-arc, directly justifying elevated governance specifically for identity resolution. Delivers rigorous, realistically-grounded formal machinery (four-valued entity resolution with a load-bearing Unknown state that actively blocks automatic merging, careful separation of SameAs/DistinctFrom from their naive Boolean negations, identity merge/split as governed provenance-preserving revision events with a new Zero=IdentityAmbiguity variant, and two crisp, practically consequential non-equivalences — SameState≠SameEntity and EquivalentProperties≠SameIdentity — that prevent a specific, realistic class of false-merge error) that meaningfully strengthens and operationalizes the corpus's overall identity architecture, directly relevant to how a Kernel built on this research would need to handle entity resolution safely."
