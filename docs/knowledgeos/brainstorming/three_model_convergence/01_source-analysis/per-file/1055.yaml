about: >
  "03 — Bootstrap Boundary (mandate §§5, 15)," formally classifying and refuting the prior Step-288 claim
  under an explicit A-F evidence scale: "F — NOT ESTABLISHED. And, as stated, REFUTED," with the exact
  supporting execution evidence (`{O,T}` fails, `{≡}` succeeds).

  **Delivers a disciplined caveat on what survives of the refuted claim**: "`𝒪`/`𝒯` IS a hard blocker, and no
  incoming derivation edge into it was found... That part stands. What fails is the inference from 'it is an
  unresolved prerequisite of the cycles' to 'it is the cycle-breaking node.'"

  **Delivers a comprehensive search for any derivation route TO `𝒪`/`𝒯`**, testing six candidate routes and
  finding all but one circular or inapplicable: deriving from `K` (circular, `K` is downstream); from
  invariants `ℐ` (downstream of `≡`); from a minimality proof (blocked, `259`); from the ratified 8
  primitives (NEW corpus citation "`C-022`/`049`": ratifies primitives, not operations, "the 8 have never been
  shown minimal against an operation space"); enumerating a forced lower bound (NEW corpus reference
  "`256.2`/`259.7`": "14 forced, upper bound 18 -- a candidate set, never a membership rule"); and
  DECLARING MEMBERSHIP -- "the only route with no unmet precondition." Boxed: "No derivation route to `𝒪`/`𝒯`
  was found in the ratified material. This is an ABSENCE OF EVIDENCE for an incoming edge, not a proof that
  none exists," explicitly applying the already-tracked negative-knowledge discipline (`225.11`/`224.11`).

  **DELIVERS THE DEFINITIVE FORMAL STATEMENT that the corpus's own Step 261 halt independently confirms the
  computed {equiv} result**: "`261.23`: 'final kernel selection must stop while EQUALITY remains ambiguous.'
  The corpus located the block at equality. Step 288's `𝒪`/`𝒯` gloss moved it, and the computed graph moves
  it back. Independent confirmation of `261.23`'s own wording, by a method `261` did not use."

  **DELIVERS THE GENUINELY IMPORTANT CENTRAL REFINEMENT OF THIS ENTIRE STEP**: formally distinguishes TWO
  DIFFERENT BOUNDARIES that must not be conflated -- the ACYCLICITY boundary `{≡}` (breaks all four feedback
  loops) versus the DERIVATION boundary `{𝒪,𝒯}` (unblocks the eight derivable prerequisites: `≈`, congruence,
  minimality, bindings, canonicalization, merge, invariants, sufficiency). Boxed: "Cutting the cycles ≠
  unblocking the derivation. `{≡}` does the first; `{𝒪,𝒯}` does the second... Minimum set for ACYCLICITY:
  `{≡}`. Minimum set for PROGRESS: `{≡,𝒪,𝒯}`." **This is a genuinely important sharpening**: the already-
  tracked capstone {equiv} result (files 1049-1052) breaks the CYCLES but does NOT, by itself, unblock the
  rest of the programme's derivable content -- both `𝒪`/`𝒯` and `≡` are ultimately needed, for different
  reasons.

  **DELIVERS A GENUINELY CRUCIAL EPISTEMIC SUBTLETY, previously unstated**: `≡` can be resolved TWO WAYS,
  which are NOT EQUIVALENT: (1) "BY DECLARATION -- a governance act fixing `≡`; breaks the cycles immediately,
  and does NOT need `𝒪`"; (2) "BY DERIVATION -- select `≡` by requiring congruence (`258.9`); needs `𝒯` and
  `δ` FIRST." Concludes: "`{≡}` is a cut ONLY UNDER THE DECLARATION ROUTE. Under the derivation route the
  cycle REASSERTS ITSELF through `𝒯→congruence→≡`. This is the precise sense in which the problem is
  UNDERDETERMINED: the formal material cannot select `≡`, and an authority can." No recommendation is made
  between the two routes.
