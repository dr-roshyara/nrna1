about: >
  Directly answers the long-standing ⚑ WATCH MARKER for a "Constitutional Invariant Map" style
  reduction (first raised 0105). Defines the Kernel as "an epistemic state-transition kernel" with eight
  named capacities (K1 Identity, K2 Evidence, K3 Provenance/History, K4 Context, K5 Contradiction, K6
  Temporal Evolution, K7 Constitutional Admissibility, K8 Deterministic State Transition), plus an
  explicit exclusion list (Semantic Compiler, LLM, natural-language parser, workflow engine, database,
  UI/API -- all interpretation providers or adapters, not Kernel authority). Closes with a "Kernel
  Boundary & Capability Mapping" matrix template -- every cell "?" -- explicitly recommended as the NEXT
  task, not completed here. References an expanding list of apparently-unencountered governance
  artifacts (KnowledgeOS v1.1, KnowledgeAggregate, Constitution, Port Contract, OQ-2/OQ-3/OQ-5, F-1..F-5).

