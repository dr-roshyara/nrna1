defines:
  - concept: "Operationally relevant properties (Relevant(p))"
    definition: "A precise, generalized formalization tool for deciding whether any given candidate property p of a knowledge object or state genuinely belongs in the semantic kernel: p is operationally relevant if there exists at least one mandatory transformation T and a pair of states K_1, K_2 differing only in p such that applying T to each, under the same admissible context, produces results that are NOT state-equivalent (T(K_1,c)≢_KT(K_2,c)). If no such T and pair exist, p can safely be discarded from the semantic state representation (or supplied externally as a transformation parameter instead) without loss of required behavior. This is a precise generalization of the earlier per-component disposability criterion (0875) into a uniform, per-property, per-operation testable form, and is presented as 'a principled way to discover the minimal kernel' -- directly operational rather than philosophical"
  - concept: "The meta-structure correction for the (K,C,T,E,A)-style kernel candidates"
    definition: "A significant methodological correction applying directly to this reconstruction's own extensive kernel-comparison work since 0863: rather than treating a proposed tuple like K=(K,C,T,E,A) as itself a candidate for the fundamental mathematical state, this file argues it should instead be understood as a meta-structure or organizing template whose actual content must be settled AFTER, not before, the true knowledge-state object K has been derived through observational/behavioral equivalence. Only once K is properly derived should the further question of whether Context, Evidence, Authority, Policy, etc. belong INSIDE that derived K, OUTSIDE it as external context, or as explicit parameters to specific transformations, be decided -- reversing the order in which this reconstruction's earlier kernel candidates (K8, K5, K230, K232) were actually proposed and compared"
refines:
  - concept: "0863-0872's entire kernel-comparison investigation (K8, K5, K230, K230v1, K232v2)"
    refinement: "REFRAMED via the meta-structure correction: these candidates should now be understood as competing META-STRUCTURES proposed before the correct derivation order (behavioral equivalence first, tuple structure second) was established -- not necessarily wrong, but methodologically premature relative to the now-clarified correct sequence"
  - concept: "0875's per-component disposability criterion and 0884's coarsest-sufficient-abstraction target"
    refinement: "GENERALIZED into the uniform Relevant(p) criterion applicable to any property, not just named kernel components, and DIRECTLY PARALLELED by the explicit bidirectional F(H1)=F(H2)⟺H1∼_HH2 target, now stated with a clean two-directional decomposition"
  - concept: "0886's identity-precedes-equality finding and per-operation identity tests"
    refinement: "FORMALIZED into the rigorous three-relation framework (=_X, ≡_K, ∼_H) and reorganized as explicit per-operation 'identity tests,' consolidating rather than extending the prior file's findings"
