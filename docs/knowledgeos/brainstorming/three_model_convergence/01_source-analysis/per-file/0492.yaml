defines:
  - concept: "Observation (O)"
    definition: "O=(Subject,Payload,Source,Time,Context,Provenance); Observed(x)⇏True(x)"
  - concept: "Proposition (P)"
    definition: "A semantically evaluable claim about entities, relationships, states, or events (e.g. IsOnBattlefield(Bhishma)); Proposition≠Assertion; Assertion=Proposition+EpistemicQualification+Provenance"
  - concept: "Relationship (formal)"
    definition: "Relationship=(Entity_1,RelationshipType,Entity_2), a first-class structure distinct from Dimension, itself carrying attributes (source, temporal validity, confidence/support, context)"
  - concept: "Evidence (formal, first full object)"
    definition: "Evidence=(Source,Content,Relevance,Reliability,Time,Provenance); EvidenceRelation(A,E) may support/weaken/contradict/qualify/contextualize an assertion A; Evidence≠Support"
  - concept: "Epistemic Lineage (Lineage(A))"
    definition: "The full traceable derivation chain of an assertion: Observation->Interpretation->Assertion->Evidence->Inference->DerivedAssertion->Conflict->Resolution->Decision, enabling 'why is this in the decision?' queries"
  - concept: "Question/Intent State (Q)"
    definition: "Q=(Intent,Entities,Constraints,Context,Purpose,Completeness,Ambiguity), feeding DimensionDiscovery and Clarification"
  - concept: "Investigation State"
    definition: "Investigation=(Question,Target,Strategy,Evidence,Status,Provenance), Status∈{Proposed,Accepted,Queued,Running,Waiting,EvidenceFound,EvidenceInsufficient,Completed,Abandoned}"
  - concept: "Master invariant (theory backbone)"
    definition: "KnowledgeOS must never silently convert an observation, interpretation, hypothesis, candidate, recommendation, or inference into established knowledge"
refines:
  - concept: "0482's Q16 epistemic-state discipline (Support≠Truth≠Resolution)"
    refinement: "Extended with Support≠Probability, since strong evidence does not mathematically imply a specific probability without an explicitly defined probabilistic model"
  - concept: "0485/0488's Discrepancy≠MetricDistance non-symmetry proof"
    refinement: "Restated and extended into a four-way Severity≠Priority≠Distance≠Risk separation with a fresh worked counter-example"
  - concept: "0483/0484's Guidance≠Authorization≠Execution≠Transition and Lord/Sārathi non-authority discipline"
    refinement: "Restated as constitutional invariants (LordCandidate≠Knowledge/Evidence; SārathiRecommendation≠Decision; SārathiAction≠HumanAuthorization) and extended into a Clarification operation preventing Sārathi from silently assuming missing context"
  - concept: "0472/0492-adjacent Coherence≠Truth discipline (Q8) and 0488's Coherence-as-Finding reframing"
    refinement: "Further refined into Coherent≠Consistent, distinguishing Representational coherence (can represent conflicting evidence) from Logical consistency (all accepted propositions simultaneously hold)"
  - concept: "0490/0491's DecisionReady≠Complete and Presentation≠Knowledge/Decision invariants"
    refinement: "Restated as part of a comprehensive retrospective, situating them within the newly-proposed seven-layer architecture and nine bounded contexts"
  - concept: "0410's D_t=∪-over-lenses architectural justification and 0411/0413's Zero/Lord canonical invariant catalogs"
    refinement: "Extended with the explicit warning Zero≠UniversalValidator, narrowing Zero's scope to avoid becoming a DDD god-object as the theory's invariant catalogs have grown"
