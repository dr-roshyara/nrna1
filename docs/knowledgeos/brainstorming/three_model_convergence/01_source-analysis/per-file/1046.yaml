about: >
  "06 — Mathematical Audits and Required Negative Results (mandate §§18, 19)," the write-up of file 1039's
  witness script, extended substantially.

  **Confirms the file-1039 ten-test results** (A-J), with two genuinely new elements. **E confirms the
  already-tracked "exactly 32" refinement** with full mathematical statement (`|blocks|:∅→1,
  {A,S,R,V,C}→2240`), reiterating "still `Σ`-level: not the corpus's `≈`." **J DELIVERS A DISCIPLINED SELF-
  CAUGHT NEAR-MISS**: the witness printed "0 transitivity violations" for the composition `≈_S∘≈_V`, which
  was "nearly recorded... as 'composition is safe.' It is the OPPOSITE." Because an intermediate state `m`
  satisfying both conditions ALWAYS EXISTS, the composition is actually **THE UNIVERSAL RELATION** --
  vacuously an equivalence relation, carrying ZERO information. "A vacuous PASS read as a substantive one --
  caught in the transcript, recorded here." Reinforces the general lesson: "the composition of two
  equivalence relations is not in general an equivalence relation, and relations must not be composed
  casually."

  **§18 DELIVERS THE COMPREHENSIVE, DEFINITIVE THIRTEEN-CLAIM FALSIFICATION CATALOG FOR THE ENTIRE EQUALITY-
  RESEARCH PROGRAMME**, each claim explicitly attacked and FALSIFIED: (1) one universal equality relation
  exists -- falsified by `261.19`'s own boxed conclusion; (2) semantic equality is already fully specified --
  falsified by the `≡/≈` formula-identity conflict (file 1041's §3.3); (3) observational equivalence is
  defined at `K` level -- falsified since `𝒪_K` is not closed; (4) `≈_X` IS the corpus's `≈` -- falsified,
  THREE RIVAL INDEXING SCHEMES exist (corpus by `𝒪`, `25I.35` by policy, `≈_X` by axis-subset); (5) `Σ`-order
  implies `K`-order -- falsified (introduces a new corpus reference "258.35": `K` should be EXTENSIONAL, not
  a tuple); (6) structural equality is a congruence -- falsified, EXECUTED; (7) hash identity is semantic
  identity -- falsified, EXECUTED; (8) finite-sample agreement proves equality -- falsified, EXECUTED; (9)
  provenance relevance is an executable predicate -- falsified (principle, never predicate); (10) Decision 3
  alone closes equality -- falsified (𝒪_K and 𝒯 remain open, congruence unproven); (11) the 32 projections
  close observational equivalence -- falsified (`Σ`-level, K→Σ projection itself unspecified); (12) Step 288
  can close kernel selection independently of Step 261 -- falsified, 0 of 6 conditions resolved (file 1045);
  (13) equality closure automatically yields an implementable kernel -- falsified (quotient not
  implementable, `δ`'s commit case unspecifiable). **BOXED FINAL RESULT: "13 of 13 falsified. Four by
  execution, nine from the corpus. Zero survived."**

  **DELIVERS THE FILE'S CENTRAL, EPISTEMICALLY CRITICAL DISCIPLINE FINDING**: "never convert NOT ESTABLISHED
  into IMPOSSIBLE. Of the thirteen, only #8 and #7 are genuine IMPOSSIBILITY results (and #7 only relative to
  an unfixed canonicalization); the rest are NOT-ESTABLISHED, and several would become true once `𝒪`/`𝒯`
  close. #2 is a CORPUS CONTRADICTION -- repairable by a governance act, not impossible. ONLY `012§35`'s
  undecidability of `≡` for arbitrary language is a genuine THEOREM-SHAPED LIMIT." This is a precise,
  disciplined closing distinction that prevents the comprehensive 13/13 falsification result from being
  misread as thirteen impossibility theorems, when in fact most are contingent gaps.
