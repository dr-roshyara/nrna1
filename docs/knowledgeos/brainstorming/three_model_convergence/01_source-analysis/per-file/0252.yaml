    refinement: "Adds the standpoint/perspective/authority dimensions (Ahamkara, Purusha/Prakriti) and the path-dependence formalization (Interpretation_t=f(Evidence_t,Knowledge_{t-1})) not present in 0247/0249/0251, and culminates in the Reflexive Knowledge System definition unifying provenance+uncertainty+authority+perspective+history+assumptions+limitations+transformations."
