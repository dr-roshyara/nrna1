defines:
  - concept: "The four named assurance situations"
    definition: "Every invariant in the AAG can be classified into exactly one of four situations: A (Defined and enforced -- the invariant has an owner, an enforcement mechanism, and a verifying test, the healthy case); B (Defined but not enforced -- an owner is declared but no enforcement mechanism exists, M=∅); C (Implemented but not architecturally declared -- a mechanism exists in the actual system but no one has established which invariant it is supposed to protect, an orphaned control); and D (Claimed but unverifiable -- documentation asserts the invariant holds, but no evidence of any kind supports the claim) -- D is explicitly named the most dangerous of the four, since it presents the outward appearance of assurance while providing none"
  - concept: "Vector assurance vs. premature scalarization"
    definition: "An artifact's or system's assurance should be represented as a vector across (at minimum) six independent dimensions -- structural, semantic, epistemic/statistical, temporal, provenance, and governance assurance -- rather than collapsed into a single scalar score, because a single number (e.g. 0.83) can conceal a complete absence of assurance along one indispensable dimension (e.g. provenance) while other dimensions score highly, and for critical systems a single missing indispensable property may be sufficient to block certification regardless of how strong the other dimensions are -- collapsing to a scalar before establishing a justified combination model is 'premature scalarization,' a named statistical-design anti-pattern"
