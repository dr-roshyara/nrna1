about: >
  "Gītā → KnowledgeOS Conceptual Translation Register," artifact ID "GITA-KOS-TRANSLATION-REGISTER-v0.1,"
  status "RESEARCH VOCABULARY (Not Canonical Architecture)." Delivers a full nineteen-entry GK-01...GK-19
  table with a DIFFERENT numbering scheme than this reconstruction's already-tracked sixteen-entry "revised
  286 register" (file 0997): here GK-09=Sañjaya/Reporter, GK-16=Guṇa, GK-17=Mokṣa, GK-18/19 are the
  KnowledgeOS-native `Ω`/Zero constructs folded into the GK-numbering itself -- a structure this reconstruction
  has not seen elsewhere, strongly suggesting this is the PRE-REVISION ORIGINAL that the "revised 286
  register" (cited as deriving from a `20260831-183219` prompt, per file 0997) subsequently reorganized down
  to 16 entries.

  **⚠️ RAISES AN OPEN CHRONOLOGY-VS-CONTENT TENSION**: this file's OWN FILENAME TIMESTAMP (`200600`, i.e.
  20:06) is LATER than every disciplined closure document this reconstruction has just processed (files
  0996/0998's Knowledge-Ātma destruction and Kṛṣṇa=Ω rejection, confirmed as final at ~19:40-20:02). Yet this
  register's OWN CONTENT re-presents both constructs at a materially WEAKER level than those already-
  established final verdicts: **§3.2 (Ātman≠Knowledge Ātma) treats `𝒦_ātma` as a still-live "research
  construct inspired by the analogy," NOT as the DESTROYED (RX) construct this reconstruction has tracked as
  formally settled since files 0975/0979/0980, reconfirmed in files 0996 and 0998's "did NOT introduce
  Knowledge Ātma (destroyed, RX)" closing statement.** **§3.3 and the GK-01 table row classify Kṛṣṇa→`Ω` as
  an "Analogy,"** not the explicit "REJECTED — the arrow is NOT identity" verdict this reconstruction has
  tracked as settled since files 0988/0996/0998. If this file's content genuinely postdates those closures,
  it would constitute a further methodological RELAPSE in the pattern this reconstruction has already
  flagged once, severely, at file 0971 -- though far milder in degree (no "source code" escalation, still
  hedged with "Analogy"/"hypothesis" labels throughout, and its own §6 Governance Status correctly disclaims
  canonical status). The alternative, more likely reading is that this is simply the chronologically-EARLIER
  v0.1 draft, filed/saved at this later timestamp for reference, preserved (not superseded-and-deleted) as
  the corpus's own historical record of the pre-revision state -- consistent with the standing instruction
  to record duplicates/superseded material without silently treating later-filed material as automatically
  authoritative. **This reconstruction records the tension rather than resolving it.**

  Otherwise substantially repeats already-tracked corrections in their earlier, less rigorous form:
  Arjuna≠simple-Knower (§3.1, already corrected via file 0990's GK-02 treatment); Kṣetra→Knowledge Field and
  Kṣetra-jña→Knower (§3.4-3.5, already ratified per files 0986, 0996-0998); Karma→Operation and
  Karma-phala→Result distinctness (§3.6-3.7, already the H-K06/07 finding); Sañjaya→Observer/Reporter (§3.8,
  a materially weaker "architectural metaphor" framing than the already-tracked corpus-native, six-principle
  formalization); Buddhi→Discrimination (§3.9, "strong heuristic," consistent with the still-open status per
  files 0988/0998's "still requiring careful treatment" bucket); Zero→Boundary of Knowledge (§3.10, correctly
  disclaimed as a KnowledgeOS-native construct, not a Gītā term).

  Delivers the three-level translation rule (`Gītā term→philosophical interpretation→KnowledgeOS research
  construct`, never `=`) already tracked as the programme's foundational discipline (files 0988, 0990,
  0999), and a vocabulary hierarchy diagram not previously seen in this exact layout.
