defines:
  - concept: "Historical-state identifiability"
    definition: "Borrowed directly from statistical parameter identifiability: history is identifiable from current state only if distinct histories always produce distinct current states (H_1≠H_2⇒Current(H_1)≠Current(H_2)); when this fails -- as the worked 100→80/120→80 counterexample shows it generally does for real business and knowledge systems -- the current state alone cannot determine which history actually occurred, and the architecture must therefore explicitly preserve additional information (version, provenance, lineage) wherever historical reconstruction is genuinely required"
  - concept: "Memory≠Knowledge"
    definition: "A bare recorded fact or event ('architecture approved at 14:32') constitutes memory -- it records that something occurred -- but does not by itself constitute knowledge, which additionally requires the semantic justification structure connecting evidence to determination to decision ('the architecture was approved because evidence X supported determination Y under rule Z'); memory can support knowledge reconstruction but does not automatically constitute it, and raw logs alone -- however voluminous -- are insufficient without these explicit semantic links, explicitly named as the point where the corpus's Gita-derived epistemic lens and its KnowledgeOS architectural work converge"
