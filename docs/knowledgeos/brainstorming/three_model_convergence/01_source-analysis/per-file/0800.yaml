title: "Step 175 -- The 'State Does Not Know Its Past' Experiment (MAJOR SYNTHESIS/KERNEL MILESTONE, delivers 0799's promised formal identifiability treatment): GIVES THE CORPUS'S GOVERNING GITA-CHAPTER-4 ARCHITECTURAL OBSERVATION ITS FIRST RIGOROUS MATHEMATICAL TREATMENT -- Delivers History→CurrentState as Many-to-One (H_1≠H_2 With Current(H_1)=Current(H_2)) via a Worked Numeric Counterexample (100→80 vs. 120→80), the Statistical-Identifiability Framing, and 'Historical State Is Not Identifiable From Current State Alone' -- Scores Four Architectural Models (State-Only FAILS; Versioned Partial; Event-History and Snapshot+Lineage PASS) -- Delivers 'Memory≠Knowledge' Explicitly Named as Where 'Our Gita Lens and KnowledgeOS Converge' -- Delivers Decision_t=f(K_t,Policy_t,Authority_t) as a Temporally-Anchored Invariant and 'NewKnowledge≠RewrittenHistory' -- Delivers a Directly Self-Referential AI-Context-Window Discussion (AIContext_{t+1}≠History; the Agent Consumes Organizational Memory, It Does Not Become Its Authoritative Owner) -- Opens Step 176's 'Who Knows?' Experiment Distinguishing KnowledgeExists/ActorKnows/ActorCanRetrieve"
