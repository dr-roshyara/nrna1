defines:
  - concept: "'The AI must not self-promote'"
    definition: "A candidate epistemic artifact produced by an AI agent (a claim, determination, or proposal) can never grant itself authoritative status by asserting it -- it must pass through an explicit Candidate→Evaluation→GovernedStatus pipeline before it can be treated as governed knowledge, regardless of how confidently or fluently it is expressed"
  - concept: "'The role of hooks' (Policy→Rule→Hook→EnforcementEvidence)"
    definition: "A repository hook (or any similar automated enforcement mechanism) is not itself an act of governance -- it is the mechanical enforcement of a governance-established rule, which itself derives from a governance policy; the chain Policy→Rule→Hook→EnforcementEvidence keeps the actual governance decision (the policy) conceptually distinct from its mechanical enforcement (the hook) and the evidence that enforcement produces, preventing the enforcement mechanism from being mistaken for the governance act itself"
  - concept: "The three interacting cycles (Epistemic/Governance/Operational)"
    definition: "KnowledgeOS's overall behavior decomposes into three distinct but interlocking cycles: the Epistemic cycle (Observation→Evidence→Knowledge→Determination, concerned with what is known), the Governance cycle (Determination→Decision→Authorization, concerned with what is decided and permitted), and the Operational cycle (Action→Execution→Observation, concerned with what actually happens) -- each cycle feeds the next, and the system as a whole is their interaction, not any single one of them alone"
