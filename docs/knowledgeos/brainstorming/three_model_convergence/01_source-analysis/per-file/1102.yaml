about: >
  "24 — CH 16 · A CONTROLLED TWO-LANE COMPARISON · and a REFINEMENT OF `G1`," verdict "A controlled test: the
  SAME chapter yields a 'Complete Integrity Framework solving three problems' in one lane, and ONE inequality
  in the other -- and the inequality turns out to be this programme's own governing rule. Plus the sharpest
  refinement of `G1` yet: part of `Qualify` may be NORMATIVE, not formal."

  **DELIVERS THE CLEANEST POSSIBLE CONTROLLED TEST OF THE ALREADY-TRACKED LANE CONFLICT (`G-85`, file 1096)**:
  Chapter 16 (Daivāsura-sampad-vibhāga) was read INDEPENDENTLY BY BOTH LANES, holding the chapter fixed and
  varying only discipline. The already-undisciplined `external_research` lane produces "'Part 3: The Missing
  Architecture — Solved'... 'Integrity Problem — Solved' · 'Bias Problem — Solved' · 'Character Problem —
  Solved'... 'The COMPLETE KnowledgeOS Integrity Framework.'" The disciplined kernel lane produces "'Chapter
  16 should NOT be converted'... 'another OPERATOR CANDIDATE'... ONE INEQUALITY." Boxed: "Same source
  chapter. One lane declares three problems solved and a complete framework. The other produces a single
  inequality and calls it a candidate. THE SINGLE INEQUALITY IS THE ONE WITH CONTENT." Explicitly upgrades
  this from "an inference about the lanes" (already-tracked file 1096) to "A CONTROLLED OBSERVATION."

  **DELIVERS THE MOST STRIKING, SELF-REFERENTIALLY SIGNIFICANT FINDING IN THE ENTIRE GĪTĀ TRACK**: the
  disciplined lane's single output is `Claim Strength ≤ Evidence Strength` ("The kernel must not simply ask
  'What can I conclude?' It must also ask 'What am I permitted to conclude from what I have?'"). Discovers
  this is EXACTLY "this programme's OWN GOVERNING RULE, reached independently": "The strongest statement made
  must never exceed the strength of the available evidence" -- the identical epistemic discipline this
  reconstruction has tracked as underlying every correction across the entire equality research arc (files
  1063-1101). Boxed: "The Gītā Ch 16 lens INDEPENDENTLY STATES THE PROGRAMME'S OWN FINAL RULE. And every
  correction in Steps 288-291 was an application of it: REFUTED → NOT ESTABLISHED · closed → classification
  closed · forced → repair class forced." Delivers the precise reasoning for why this is the strongest
  convergence in the track: "not because it is philosophically deep, but because THE PROGRAMME HAS BEEN
  EXECUTING IT FOR FOUR DAYS and can point to the corrections as evidence it is operable."

  **DELIVERS THE PRECISE CARRIER AUDIT FOR THIS CANDIDATE INVARIANT**, finding it "the closest any Gītā-
  derived candidate has come to being fillable": Evidence Strength has a carrier (`Σ`'s ordinal `S` axis,
  supports `≤`); the `≤` operation is available; but "Claim Strength: NO CARRIER. `Σ` records the strength of
  support FOR an assertion. The strength of WHAT IS CLAIMED is represented NOWHERE." Explicitly not filled --
  "adding a `ClaimStrength` field is an architecture change" -- recorded as `I-Q1`, compared to the already-
  established `38.20` asymmetric-loss item as a second well-formed-but-uncarried invariant.

  **DELIVERS THE SHARPEST REFINEMENT OF THE ALREADY-TRACKED IRREDUCIBLE `G1` GAP YET**: proposes
  `Qualify(x)→{Qualified,Unqualified,Undetermined,Terminus}`, with `Qualify = "determine whether the
  available basis is SUFFICIENT for the intended epistemic act,"` explicitly not "prove everything." Does NOT
  supply a body (relocates the gap into two new undefined terms, "sufficient" and "the intended epistemic
  act"), BUT discovers `Terminus` is a NORMATIVE object: "'justification may legitimately terminate' --
  deciding WHERE justification legitimately stops is an act of AUTHORITY, not a derivation." Delivers the
  sharp reclassification-risk finding: "`G1` MAY BE PART FORMAL (no body) AND PART NORMATIVE (where does
  justification terminate?). Step 291 §07 classified it wholly FORMAL/DERIVATIONAL → `G1`." Names the
  converse risk to the already-tracked Audit-291-§07 discipline (files 1085/1092): "if part of `Qualify` is
  normative, then that part is resolvable BY AUTHORITY and HAS BEEN SITTING IN THE IRREDUCIBLE PILE."
  Recorded as `G-97`, explicitly NOT reclassified (a governance matter, not a lens matter). Precisely
  distinguishes this as differing in kind from the already-tracked THIRD Qualify-motivation count (files
  1023-1024's Cavell, file 1095's Ch 7 Jñāna/Vijñāna): "the others motivated a RECLASSIFICATION; this
  proposes a specific CODOMAIN and NAMES the reclassification target," while still honoring the already-
  tracked "three gestures, not three-fold evidence" discipline -- the three must not be merged.

  **DELIVERS THREE FURTHER HYPOTHESIS-LEVEL DISTINCTIONS**: `T1` -- `False≠Unknown≠Unqualified`, discovering
  `Unqualified` as "A FOURTH MISSINGNESS MODE beyond `M1`-`M3`" (already-tracked Step-281 missingness states),
  `Qualify`'s negative outcome; `T2` -- growth≠expansion≠purification ("more information ⇏ better
  knowledge"), directly using the already-tracked file-1099 dimensional structure `D_t` and reinforcing the
  already-tracked `C8` constraint; `T3` -- `Manas`/`Buddhi` must not be collapsed, `Buddhi` non-Boolean, "a
  SIXTH rival decision codomain shape," reinforcing the already-tracked file-1088 "a procedure that answers
  Unknown is total without deciding" principle.

  Delivers `C10` (Qualify≠prove everything, joining the already-tracked `C1`-`C9`) and a new T0 entry
  (`external_research`'s "Complete Integrity Framework" against a register at 0 of 13). Confirms the
  disciplined non-license: `I-Q1` not adopted, `G1` not reclassified, no codomain/operator/distinction
  promoted, Steps 288-291 unchanged, all `R6`. Confirms the discipline held once more: the source explicitly
  refuses to add more Gītā material "before introducing more Gītā concepts" -- "the discipline working from
  the inside."
