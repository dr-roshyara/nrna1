about: >
  Confirms the already-tracked "[EXP] regression and progression agree on 12/12 checks across 6 action
  sequences × 2 fluents (A3). Executed, not asserted" (already summarized in file 2332).

  **DELIVERS THE PRECISE REASON PROGRESSION ALONE IS INSUFFICIENT (P10)**: "progression computes A_{t+1}
  and discards the history. KR-HISTORY established that the kernel writes history (and reads it 0
  times). Progression satisfies the read behaviour and not the write obligation."

  **DELIVERS A GENUINE NEW SYNTHESIS**: "both are needed, for different reasons... progression for the
  state, history retained for audit, regression as the mechanism that makes retention useful rather than
  merely dutiful." This is the thread's clearest three-part reconciliation of progression, history-
  retention, and regression into complementary, non-redundant roles.

  **DELIVERS AN EXPLICIT CAVEAT ON THE REGRESSION THEOREM'S TRANSFERABILITY**: "regression's guarantee is
  the regression theorem, which holds for regressable queries over a basic action theory. KnowledgeOS has
  no basic action theory, so the guarantee is not currently available -- only the mechanism's shape is."
  This precisely qualifies the already-tracked "regression SUPPORTED" verdict: the mechanism (query
  rewriting back to S_0) is usable as a design pattern, but its formal correctness guarantee is not yet
  established for KnowledgeOS specifically.
