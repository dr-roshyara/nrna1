title: "LANDMARK: Requirements-First Derivation of an Evidence Aggregation Algebra — Eight Labeled Experiments (A-H) and Seven Falsification Tests Deriving Required Algebraic Properties (Idempotency, Commutativity, Associativity, Contextuality) Before Any Framework Is Chosen; Bayesian/Dempster-Shafer/Fuzzy-Logic/Weighted-Scoring Each Explicitly Evaluated and Rejected as 'Candidate, Not Selected'; the Three-Layer Evidence≠Assessment≠Inference Distinction Named 'One of the Strongest Refinements Produced by 25C'; Verdict '25C — CONDITIONAL PASS' With Six Named Unresolved Sub-Problems (C1-C6); Opens Step 25C.1 (Compare Candidate Evidence Algebras) With the Explicit Prediction That the Final Answer Will Not Be One Universal Algebra but a Composable Combination"
