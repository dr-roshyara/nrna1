defines:
  - concept: "Generate(AI,ApprovalClaim)⇏Create(Authority)"
    definition: "An AI agent's ability to produce a statement claiming approval, authorization, or authority does not thereby create that authority; authority must originate exclusively from the governance mechanism explicitly empowered to grant it, regardless of how convincing or well-formed the AI's generated claim is"
  - concept: "Knowledge≠ControlPlane"
    definition: "Ordinary knowledge content — documents, retrieved text, chat messages, or any material an AI agent processes as data — must never be permitted to redefine agent permissions, system policies, security controls, or governance authority merely by asserting that it does; this is the formal architectural defense against prompt-injection-style attacks on retrieval-augmented and agentic AI systems"
  - concept: "Zero-trust principle (security-specific)"
    definition: "An object, claim, or piece of data crossing from a less-trusted domain (external system, user input, retrieved content) into KnowledgeOS must not automatically acquire the trust or authority level of the receiving domain; trust must be established through explicit evidence and policy evaluation at every boundary crossing, never inherited by mere transit"
  - concept: "SecurityEvent→Evidence→Inference"
    definition: "An unauthorized action attempt, once recorded with its actor/time/target/attempted-action/result, becomes first-class evidence that can feed the corpus's established inference pipeline (e.g. five failed authorization attempts correctly supporting a PotentialAttack inference), while the inference itself must remain explicitly distinct from the raw recorded events — directly connecting the security discipline to the corpus's general Evidence→Knowledge architecture"
