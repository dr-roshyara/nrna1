about: >
  Initial (not exhaustive) assessment of Karl Astrom's Introduction to Stochastic Control Theory, a
  scanned 150-page source. Central hypothesis: the deepest connection is not "stochastic control ->
  AI agent control" but a general epistemic loop -- uncertain environment -> observation -> sufficient
  state -> estimation -> decision -> action -> new observation -- making the STATE ESTIMATE an explicit
  intermediate object between raw evidence and action-driving knowledge. Explicit source-boundary caution:
  this particular volume does not appear to develop Kalman filtering or dynamic programming in depth, so
  those concepts must not be attributed to it.
introduces:
  - concept: "State as sufficient information: Astrom defines stochastic state as the minimum information needed to predict the FUTURE PROBABILITY DISTRIBUTION, not the exact future -- reframed as 'what is the minimum sufficient knowledge/context for a governed decision?'"
  - concept: "Information-timeliness principle: system performance depends on information available when a control signal must be determined; delayed measurements directly degrade performance"
  - concept: "Refined epistemic chain: Observation -> Evidence -> State Estimation -> State/Belief -> Prediction -> Decision -> Control/Action -> Observation, inserting an explicit STATE ESTIMATION stage between evidence and decision (page-8 diagram: environment -> observed signal -> estimator -> feedback)"
  - concept: "Uncertainty as intrinsic to the state model, not after-the-fact metadata: stochastic state models carry both mean and covariance, with future conditional distributions computed recursively"
  - concept: "Markov/sufficient-history principle: whether a knowledge state can be defined making future reasoning depend on a bounded sufficient state rather than the entire historical record"
  - concept: "Convergence taxonomy for the assurance vocabulary: convergence with probability one / convergence in probability / mean-square convergence kept distinct -- 'stable,' 'converged,' 'repeatable,' 'assured' should not collapse into one concept"
  - concept: "Model-precondition regularity as a Zero Lens candidate: Astrom imposes finite-variance/continuity conditions before a stochastic model is even legitimate"
  - concept: "Stability != finite/measurable result: an integral (loss evaluation) can exist even when the underlying dynamic system is unstable -- directly relevant to deterministic assurance"
