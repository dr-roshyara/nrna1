about: >
  A double-landmark file closing two major computational boundaries in a single continuous session,
  explicitly following the same discipline as before: "define -> formalize -> attack with counterexamples ->
  determine what is computable -> identify what remains policy-dependent."

  **PART A — Computational Closure 2 (Interpretation).** Establishes `Interpretation≠Assertion`
  ("this is what the source appears to mean," not "this proposition is accepted knowledge"). **Delivers
  the file's first major theoretical improvement**: Interpretation is formalized as a PARTIAL function
  `Interpret:𝒪_s×𝒞×𝒪_n×ℛ×ℳ⇀ℐ` (not total), since ambiguous observations may yield one, multiple,
  insufficient, or no valid interpretation. **Delivers a second major refinement**: interpretation should
  produce a SET, not a single result -- `Interpret(O_s,...)->𝒫(ℐ)` (worked through "the old system is no
  longer supported," yielding three candidate referents for "old system"), each candidate carrying its own
  provenance and qualification. **Establishes `Deterministic acquisition≠Deterministic interpretation`**:
  Capture(x) is deterministic, but Interpret is configuration-dependent
  (`Interpret(O_s,θ)={I_1,...,I_n}`, θ=ontology/grammar/context/rules/model/parser/LLM/domain vocabulary).

  **Proposes a layered "interpretation stack"** rather than one opaque LLM call: Source Observation ->
  Structural Analysis -> Syntactic Analysis -> Entity/Reference Resolution -> Semantic Role Extraction ->
  Domain Mapping -> Candidate Interpretation -> Validation, with different technologies participating at
  each layer (worked for PDF structure, Java code structure, and SQL structure -- "largely deterministic"
  at this layer). **Delivers the architectural rule `Technology≠Semantic Authority`**: neither a parser nor
  an LLM automatically establishes truth by generating a candidate structure. Reference resolution
  (resolving "it") is explicitly a `CandidateInterpretation`, never an accepted fact, since it is itself an
  inference. **Delivers the file's central mathematical principle**: `Meaning=f(Content,Context)` -- worked
  through a version statement whose meaning changes entirely once System/Environment/Host/ObservedAt context
  is attached.

  **Formalizes Dimension Discovery** as `DimensionDiscovery:O_s->CandidateDimensions`, explicitly distinct
  from ordinary entity extraction, and delivers a critical governance rule: Dimension Discovery must NOT
  silently change the ontology -- an LLM-proposed dimension is only ever a `CandidateDimension`; only
  Governance can promote it to an `ApprovedDimension` -- "protects the KnowledgeOS ontology from
  uncontrolled LLM expansion." Reconfirms `Interpretation≠EpistemicAssessment` and `LLM(Interpretation)
  ⇏Knowledge`.

  **Delivers a major epistemic-discipline finding**: `Ambiguity≠Error` -- multiple simultaneously valid
  interpretations of "Nexus is running" should be PRESERVED until context resolves them, not collapsed or
  treated as a failure -- "ambiguity is itself an epistemic state." Delivers a parallel finding,
  `InterpretationConfidence≠EpistemicSupport` -- an LLM can be extremely confident in a wrong
  interpretation. **Delivers the file's most consequential new formal distinction**: three genuinely
  different uncertainties -- semantic uncertainty U_sem (what does the source mean?), epistemic uncertainty
  U_epi (how well-supported is the proposition?), and domain uncertainty U_dom (what is actually true in
  the domain?) -- `U_sem≠U_epi≠U_dom`, "a significant strengthening of our earlier four-dimensional
  epistemic model." Proposes a non-epistemic interpretation lifecycle (Observed->Parsed->Structured->
  Interpreted->Candidate->Validated->{Accepted,Rejected,Ambiguous}) explicitly belonging to semantic
  reconstruction, not epistemic status. Names a "Semantic Reconstruction" bounded context (concepts:
  SemanticInterpretation, CandidateDimension, CandidateEntity, CandidateRelationship, CandidateProposition,
  Ambiguity, InterpretationMethod, InterpretationEvidence) explicitly barred from owning truth, final
  epistemic status, domain authority, or governance decisions.

  **Declares Part A's closure verdict**: Source Observation = CLOSED; Interpretation =
  **ARCHITECTURALLY CLOSED, SEMANTICALLY OPEN** -- the mechanism is known, but the interpretation result
  itself may legitimately remain ambiguous, incomplete, multiple, AI-assisted, human-assisted, or
  domain-dependent, explicitly "not a defect. Trying to make interpretation always deterministic would
  actually damage the model."

  **PART B — the Epistemic Admission Boundary (named mid-file "Computational Closure 3 — Epistemic
  Admission," later renamed at the file's close to make way for a further "Computational Closure 3 — The
  Knowledge State").** Poses a genuine design fork before proceeding: should KnowledgeOS allow an Assertion
  with an explicitly unresolved epistemic state (Unknown/Hypothesized/WeaklySupported), or require a minimum
  admission threshold first? States and then confirms the recommendation: **`Assertion≠Proven Truth`**.

  **Delivers a seven-point rationale** for why a minimum-threshold (binary Known/Unknown) admission model
  would be architecturally disastrous: it would destroy the Zero Lens's ability to detect gaps (no
  representation for Unknown/Hypothesized); destroy the Lord Lens's ability to generate candidates (no
  place for a Hypothesized assertion to reside); sever the Observation->Interpretation->Candidate->Assertion
  provenance chain; damage auditability (no record of what was considered but not yet accepted); make the
  corpus's standing incomplete-question problem (Arjuna's "those") unsolvable; collapse the Unknown≠Absent
  distinction; and break the learning trajectory Hypothesized->WeaklySupported->StronglySupported.

  **Delivers the file's central formal result -- the corpus's first complete eleven-state epistemic status
  vocabulary** for Σ: Unknown, Hypothesized, Reported, WeaklySupported, ModeratelySupported,
  StronglySupported, Confirmed, Conflicting, Stale, Invalidated, Absent -- each with a defining meaning and
  a worked Nexus-version example. Formalizes the Admission Boundary
  `Admit:CandidateAssertion×Evidence×Rules×Context->Assertion`, explicitly noting admission requires NEITHER
  StronglySupported NOR Confirmed NOR Truth -- "a much lower, more defensible boundary": admission means
  only "this proposition is now part of the Knowledge State, with an explicit epistemic status."

  **Re-runs the corpus's established eight-case test suite against this new admission model**, assigning a
  concrete epistemic state to each: Database->StronglySupported; Document->WeaklySupported;
  Internet(unknown site)->WeaklySupported with caveats; Human statement->Reported; LLM output->Hypothesized;
  Incomplete question->no assertion created, gap detected, clarification requested; Conflicting
  sources->both assertions coexist, tagged Conflicting; Unknown value->Assertion(Unknown) -- an explicit,
  first-class representable state rather than an absence of representation.

  **Delivers the file's second most consequential finding**: the Assertion (with explicit epistemic state)
  is the single source of truth for KnowledgeOS, but "truth" here is redefined as "this is what we currently
  represent, with this degree of support, uncertainty, and validity" -- explicitly NOT "this is factually
  correct in reality," formalizing **`Knowledge≠Reality`**.

  **Closes with a complete extended pipeline** (Input->Artifact->SourceObservation->
  SemanticInterpretation->CandidateAssertion->EpistemicAssessment->Assertion->Zero->Lord->Sārathi), six
  named constitutional invariants (Assertion≠Proven Truth; admission does not require verification; Unknown
  is a valid epistemic state, not an absence; epistemic status can evolve; multiple epistemic states can
  coexist as Conflicting; provenance is preserved), and the explicit declaration "The Epistemic Admission
  Boundary is computationally closed," proceeding next to a phase now retitled "Computational Closure 3 —
  The Knowledge State."
