defines:
  - concept: "Epistemic State Space Σ (eleven states)"
    definition: "Unknown (dimension exists, value unknown), Hypothesized (candidate value proposed, not evaluated), Reported (source reported, unverified), WeaklySupported, ModeratelySupported, StronglySupported (increasing evidence strength), Confirmed (verified via multiple independent sources), Conflicting (multiple sources disagree), Stale (once known, possibly no longer current), Invalidated (was believed, now disproven), Absent (determined not to exist)"
  - concept: "Interpretation (partial function)"
    definition: "Interpret:𝒪_s×𝒞×𝒪_n×ℛ×ℳ⇀𝒫(ℐ) — a partial function from a Source Observation, Context, Ontology, Rules, and interpretation Method to a set of candidate interpretations, which may be empty, singleton, or multi-valued"
  - concept: "Admit (Epistemic Admission Boundary)"
    definition: "Admit:CandidateAssertion×Evidence×Rules×Context->Assertion — the operation by which a candidate proposition enters the Knowledge State with an explicit epistemic status, requiring neither strong support nor confirmation nor truth"
