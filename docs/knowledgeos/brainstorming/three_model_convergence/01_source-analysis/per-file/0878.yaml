defines:
  - concept: "The overloaded-Transformation discovery"
    definition: "A specific linguistic/mathematical finding that the single word 'Transformation,' used pervasively throughout the corpus's mathematical-kernel-derivation sub-arc, actually denotes at least three genuinely different mathematical operations depending on context: (1) epistemic transformation, the movement of a candidate assertion into accepted knowledge (Candidate→Knowledge); (2) state transformation, an ordinary state-to-state transition within the knowledge-state space (K→K'); and (3) representation/projection transformation, the mapping of a knowledge state into a regime-specific representation (K→Y_R, e.g. a probabilistic or logical projection, as developed at 0874/0876). Because these three operations have genuinely different domains, codomains, and semantic purposes, the corpus cannot yet treat 'Transformation' as a single well-defined ubiquitous-language term without qualification -- doing so would silently conflate three operationally distinct concepts under one name, a specific instance of the general Same-word-does-not-imply-same-concept discipline this reconstruction has tracked since at least 0864's 'Zero'/'Lord' polysemy findings"
  - concept: "The Step-201 two-branch discovery"
    definition: "A specific corpus-structural finding, reported in this file as an already-established historical fact from prior archaeology, that the corpus's own Step 201 does not correspond to a single, unified piece of content but instead exists in two genuinely different branches: '201-A,' which freezes a canonical vocabulary, and '201-B,' which instead opens an extensive eighty-step verification programme. This is presented as a serious warning for the upcoming Step-251 genealogy test, since treating Step 201 as a single reference point when reconciling later transition formulations against it would silently conflate two divergent lines of development -- the genealogy test 'is not administrative bookkeeping. It may materially change which definitions are allowed into the final theory.' This reconstruction's own earlier files 0828 (Step 201, 'Refinement & Review Program') and 0829 (Step 201, 'Canonical Vocabulary Freeze v0.1') should be cross-checked against this 201-A/201-B branching characterization in any future synthesis work"
