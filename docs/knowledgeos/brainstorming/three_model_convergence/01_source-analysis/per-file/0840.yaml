about: >
  Directly executes the task proposed at 0839's close, opening "we now enter a different mode. Steps 1-211
  have largely been derivation... Step 212 begins the audit," boxed:
  **`Architecture→Implementation→Evidence→Gap`**, explicitly: "the purpose is not to make the software
  conform to the theory prematurely. The purpose is to discover, honestly, what is already there."

  **§212.1 delivers the five-state status classification**, boxed:
  **`Status(I)∈{Implemented,Partial,Specified,Missing,Unknown}`**, with the file's central discipline
  crystallized as two boxed inequalities: **`Unknown≠Missing`** and **`Unknown≠Implemented`**.

  **§212.2 delivers the file's central named risk**: gradually speaking of a well-derived architectural
  principle as though the existing system already implements it, explicitly named
  **"architectural hallucination,"** guarded against via the boxed rule: **`Derived Architecture≠Current
  Architecture`** -- "the current architecture must be established from evidence."

  **§212.3-212.4 delivers the formal per-invariant evidence-record tuple**
  `G_i=(I_i,Status,Owner,Mechanism,Evidence,Confidence,Gap)` and **restates the theoretical register from
  0838 verbatim by its I1-I15 IDs** (Identity≠State through No silent semantic strengthening), explicitly:
  "none of these should yet be marked 'Implemented' merely because we derived them" -- confirming 0838's
  local I1-I15 numbering is being actively reused as a working reference in this file, not merely a
  one-off local artifact.

  **§212.5-212.9 delivers a five-tier evidence-quality hierarchy** (E0 No evidence → E1 Claim/
  documentation → E2 Static implementation evidence → E3 Executable test evidence → E4 Runtime/production
  evidence → E5 Formal verification), worked through a concrete provenance example progressing from a bare
  documentation claim through a code field, an automated reconstruction test, to production-preserved
  lineage. Delivers **`Confidence(I)≠EvidenceLevel(I)`** (strong evidence from one inspected module does
  not establish system-wide confidence), and **the file's central statistical-honesty rule**, boxed:
  **`No arbitrary percentages`** -- explicitly rejecting a claim like "the architecture is 82% compliant"
  absent a defined population/weighting/independence/evidence-quality/confidence model, preferring the
  qualitative **`CriticalGap`** as "much more meaningful."

  **§212.10-212.14 delivers the conceptual gap equation** (`Gap(I)=Target(I)-Current(I)`, kept ordinal:
  `None/Partial/Significant/Critical/Unknown`) and **five named, co-existing gap classes**: G1 Semantic
  (domain meaning lost), G2 Governance (authority/responsibility ambiguous), G3 Temporal (historical state
  not reliably reconstructible), G4 Epistemic (evidence/uncertainty/assumptions lost), G5 Assurance
  (behavior may be correct but insufficiently proven) -- worked through a concrete AI-assessment example
  where `Implementation=Present` yet `Assurance=Weak`, an assurance gap rather than an implementation gap.
  Delivers **the three-way gap-type separation**, boxed: **`ArchitectureGap≠ImplementationGap≠
  VerificationGap`** (the design itself lacking a mechanism, versus code failing to implement a specified
  mechanism, versus correct-looking implementation with insufficient evidence). Delivers **the governance
  gap concretely**: a technically-working `AI→Assessment→Approval` pipeline with no defined approval
  authority yields `TechnicalCapability=Present` while `GovernanceCapability=Missing`.

  **§212.15-212.16 delivers "the ownerless invariant"** -- an invariant that exists with `Owner(I)=∅`,
  explicitly named "one of the most dangerous findings" since nobody remains responsible for maintaining
  it, boxed as a search target: **`Ownerless Invariants`**. Delivers the complementary "shared ownership
  problem" (multiple co-owners, `Owner(I)={A,B,C}`, without explicit division of responsibility, risking
  each team assuming another enforces it), crystallized: boxed **`Shared responsibility must not mean
  undefined responsibility`**.

  **§212.17-212.20 delivers a context-boundary audit checklist** (five questions per Bounded Context) and
  a **contract audit checklist** (seven questions per cross-context relationship), delivering **the
  semantic-loss function** `L(C)=InformationBefore(C)-InformationAfter(C)`, refined via
  `CriticalSemanticProperties(C)` and `Loss(C)={p|p∈CriticalProperties∧p absent after transformation}` --
  "a practical contract-audit mechanism," worked through a concrete Assessment tuple losing
  uncertainty/modelVersion/evidenceRef when a contract sends only `score`, crystallized as a
  **`Critical Semantic Gap`** when downstream governance requires the dropped fields.

  **§212.21-212.22 delivers the formal state-machine audit**: reconstructing `T_actual` from the actual
  implementation and comparing it against `T_target` via the symmetric difference, boxed:
  **`ΔT=T_target△T_actual`**, "a clean mathematical way to describe state-transition gaps." Delivers the
  illegal-transition-path finding, boxed: **`Unauthorized State Transition Path`**, for any
  `(s_i,s_j)∈T_actual` not present in `T_target`, "high priority if the state has governance
  consequences."

  **§212.23-212.25 delivers the historical replay audit**: attempting `Replay(A_t)` and checking whether the
  system reconstructs `Context_t` or wrongly substitutes `Context_now`, formalized as
  `Replay(A,t)=F(Data_t,Policy_t,Model_t,Schema_t,Context_t)`, with `Replay(A,t)=A_t` for deterministic
  portions and an explicit requirement to preserve provenance explaining why exact replay may be impossible
  when external conditions changed. Delivers **`Reproducibility≠Replayability`** (regenerating the same
  result versus reconstructing what happened and why -- "a system may be replayable without being
  perfectly reproducible," e.g. when an external service no longer exists).

  **§212.26-212.29 re-connects to Chapter 4 once more**, delivering the disciplined technical
  reinterpretation: `CurrentState=History` must not be forced; instead `CurrentState+
  HistoricalProvenance` should allow reconstruction of relevant prior meaning, crystallized: boxed
  **`History must be preservable, not necessarily embedded in every current state`**. Re-affirms the Gita
  lens as strictly a question-generator (`GitaLens→ArchitecturalQuestions`, never a specification),
  re-walking Chapters 2 and 4 as concrete worked examples. **Delivers the negative-space principle**: a
  mature architecture must specify `ForbiddenPaths`, not only `AllowedPaths`, boxed:
  **`Architecture=AllowedTransitions+ForbiddenTransitions`**, worked through four concrete forbidden
  implicit transitions (`Prediction→AutomaticAuthority`; `CurrentState→AssumeCompleteHistory`;
  `Unknown→False`; `Execution→AssumeSuccess`), explicitly "particularly valuable because architecture
  often fails through implicit transitions."

  **§212.30 delivers a concrete AAG extension showing a forbidden path explicitly marked**: an `X` on the
  `Assessment→Authority` edge in the assurance-chain diagram, formalized as `Assessment↛Authority`,
  representing a path "the architecture must prevent."

  **§212.31 delivers the provisional fifteen-item gap register**, using a THIRD, distinct ID scheme
  **`G-01` through `G-15`** (Category/Question format: Identity, Temporal, Provenance, Epistemic, AI,
  Governance, Decision, Outcome, State, Contract, Contradiction, Unknown, Assurance, Ownership, History),
  explicitly named "the audit instrument" -- these Gap IDs are distinct from both the established global
  I1-I75 invariant series and 0838's colliding local I1-I15 invariant IDs, adding a third, non-colliding
  but easily-confusable identifier namespace to the corpus.

  **§212.32 delivers the file's sharpest methodological warning**: "we must not populate it by imagination
  ... perhaps the most important methodological rule of Step 212," boxed:
  **`No evidence⇒Unknown`**, explicitly never `⇒Missing` and certainly never `⇒Implemented`.

  **§212.33 delivers the transition plan**: taking artifacts already generated across Steps 1-182 (and
  later implementation material) to build `Artifact→ArchitecturalFact→Invariant→Evidence` before
  populating the gap register.

  **§212.34 delivers the Step 212 verdict**: six named PASS/COHERENT sub-verdicts across Architectural
  reasoning, DDD, Mathematics, Statistics, AI, and the Gita Chapters 1-4 lens.

  **Closes opening "Step 213 — Evidence-First Reconstruction,"** proposing a four-way classification for
  every architectural claim, boxed: **`FACT|DERIVED|PROPOSED|UNKNOWN`**, connected to
  `Invariant→Implementation→Evidence`, explicitly framing this as "the point where our work changes from
  architectural invention to architectural archaeology" -- essential, the file argues, if the eventual book
  is to credibly claim the architecture "emerged from real engineering experience, rather than being
  designed retrospectively and projected onto the software." No actual repository implementation occurs
  within this file itself.
