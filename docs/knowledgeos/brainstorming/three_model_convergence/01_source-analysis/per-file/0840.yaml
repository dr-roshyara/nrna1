defines:
  - concept: "Architectural hallucination"
    definition: "A named risk specific to long architecture-derivation exercises: after deriving a good architectural principle through extensive theoretical work, the natural tendency to gradually begin speaking about that principle as though the existing implemented system already realizes it, without ever having checked -- directly analogous to an AI model confidently asserting an unverified claim as fact. The explicit guard is the rule Derived Architecture≠Current Architecture: the current architecture's actual status must always be established from evidence, never inferred from the quality or completeness of the theoretical derivation that produced the target architecture"
  - concept: "The three-way gap-type separation (Architecture/Implementation/Verification gap)"
    definition: "A precise decomposition of what 'the architecture has a gap' can actually mean, preventing conflated diagnosis: an Architecture gap means the DESIGN itself does not provide the required mechanism at all (nothing was ever specified to address the need); an Implementation gap means the architecture DOES specify the mechanism, but the actual code fails to correctly implement it; a Verification gap means the implementation APPEARS correct (and may in fact be correct) but insufficient evidence exists to actually prove it holds -- each requires a different remedy (design work, coding work, or testing/evidence work respectively), so treating all three as one undifferentiated 'gap' would misdirect the fix"
  - concept: "The negative-space principle"
    definition: "A mature architecture must be specified not only by what it permits (AllowedTransitions, AllowedPaths) but equally by what it explicitly forbids (ForbiddenTransitions, ForbiddenPaths): Architecture=AllowedTransitions+ForbiddenTransitions. This matters because architectures most often fail not through an explicitly-designed-but-wrong allowed path, but through an IMPLICIT transition nobody ever thought to forbid (e.g. a prediction silently becoming an authoritative action, an unknown silently becoming a false, an execution attempt silently being assumed successful) -- so an audit must actively search the negative space of what the architecture fails to prohibit, not only verify what it correctly permits"
