about: >
  Extracts a management/decision-theory book (central framework: Aims->Information->Evaluation->Decision,
  centered on the concept of "decisional space") not as generic decision-making methodology but as a
  "Decision Power model," continuing and versioning the Kernel-candidate track from 0174's v0.2. Central
  thesis: Knowledge != Decision != Decision Power -- decision power is "the bounded capability to choose
  among available alternatives under a mandate, using available information and evaluation, while carrying
  responsibility for the choice," proposed as a genuinely new kernel-level concept, not merely a Governance-
  context detail. Key extractions: (1) DecisionalSpace -- the set of choices an actor is actually permitted
  and able to make in a given context, richer than a bare role label; (2) DecisionRight (preferred over the
  vaguer "DecisionPower") -- a governed entitlement (Actor/Subject/Scope/PermittedOutcomes/AuthorityBasis/
  Constraints/Preconditions/RiskLimit/ValidityPeriod/Delegation/Accountability) from which effective
  DecisionPower is DERIVED (DecisionRights+Mandates+Constraints+Delegations+CurrentState), never persisted
  as a raw primitive nor inferred from role/knowledge/seniority/AI-capability; (3) an explicit rejection of
  the book's own 1998-era claim that computers cannot make "true" value-laden decisions, replaced with the
  more durable architectural insight "decision support capability does not automatically imply decision
  authority," producing three explicit AI operating modes (Advisory -> Human Decision; Delegated -> AI
  exercises a governance-granted DecisionRight; Deterministic execution -> policy/rule/condition, arguably
  not a "decision" in the book's sense at all); (4) DecisionKind typing (ConsideredDecision/
  DelegatedDecision/EmergencyDecision/DeferredDecision/AutomaticDetermination/Recommendation), with
  Recommendation != Decision and AutomaticDetermination != Human Decision as hard semantic boundaries; (5)
  "deciding not to decide" elevated to a first-class DecisionOutcome (Chosen/Deferred/Rejected/Escalated)
  rather than treating a null choice as an error, drawing on the book's four legitimate deferral reasons
  (insufficient information, option parity, deliberate option preservation, unsuitability to decide now);
  (6) a DecisionReadiness checklist (RequiredEvidenceSatisfied / RequiredQuestionsAnswered /
  ContradictionsResolved / AuthorityPresent / AlternativesKnown / RiskAssessmentComplete /
  PreconditionsSatisfied) gating Decision, extending 0174's Inquiry model; (7) DecisionBasis as a first-
  class structured object (Aims/RelevantEvidence/Assessments/Alternatives/Risks/Assumptions/Constraints/
  Values/Reasoning) replacing a bare natural-language "rationale" string, enabling reconstruction rather
  than mere representation; (8) an explicit Fact != Value != Preference != Constraint separation for
  decision inputs; (9) DecisionExposure/risk as a further dimension of decision power -- an actor's
  RiskAuthority can gate approval independent of evidence quality (e.g. an Architect with LOW risk
  authority cannot approve a HIGH-risk decision even with adequate evidence); (10) contingency/mitigation/
  fallback/insurance/reversibility explicitly shown to ENLARGE effective decisional space (a risky option
  becomes acceptable with rollback), making DecisionalSpace non-static; (11) a three-way distinction --
  DecisionRight ("may I decide?") vs. DecisionCapacity ("can I reasonably decide?") vs. DecisionReadiness
  ("should I decide now?") -- allowing a precise "authorized but not ready" system state rather than a
  blunt "cannot decide." Produces five named KOS-DP-01..05 candidate invariants (Decision Sovereignty --
  KnowledgeOS may expose grounds/constraints/alternatives/risk/readiness but must never infer or grant
  decision authority from knowledge/reasoning/recommendation-quality/system-access; Explicit Decision Right;
  Recommendation/Decision Separation; Valid Deferral; Decision Reconstruction) and explicitly rejects a
  numeric "decision_power_score" in favor of an inspectable, deterministic structured DecisionPower object.
  Concludes with a two-axis kernel model (Epistemic axis: "can we justify this?" vs. Decisional axis: "may
  we choose this?") and an explicitly versioned "Candidate KnowledgeOS Kernel v0.3": the existing EPISTEMIC
  section (Question/Evidence/Hypothesis/Assumption/Argument/Inference/Claim/Assessment/Provenance, from
  0173-0174) plus two new sections, DECISIONAL (Aim/Alternative/DecisionBasis/DecisionReadiness/Decision)
  and GOVERNED DECISION POWER (DecisionRight/DecisionalSpace/Constraint/Delegation/Accountability), with
  Inquiry/Risk/Scenario/Contingency/DecisionAnalysis/Governance/Workflow/AI-Agent as surrounding contextual
  capabilities. Closes by reformulating the KnowledgeOS mission: "KnowledgeOS preserves the epistemic basis
  and governed decision space within which decisions can legitimately be made" -- explicitly rejecting a
  "KnowledgeOS -> DecisionEngine -> decides" model in favor of "KnowledgeOS -> Decision Support ->
  [sovereign] Decision Authority -> Decision."

introduces:
  - "Five named KOS-DP-01..05 candidate invariants: Decision Sovereignty (KnowledgeOS must never infer or
    grant decision authority from knowledge possession, reasoning capability, recommendation quality, or
    system access), Explicit Decision Right, Recommendation/Decision Separation, Valid Deferral, Decision
    Reconstruction (an authoritative decision must be reconstructable from its DecisionBasis)"
  - "A new candidate kernel primitive set: DecisionalSpace, DecisionRight (Actor/Subject/Scope/
    PermittedOutcomes/AuthorityBasis/Constraints/Preconditions/RiskLimit/ValidityPeriod/Delegation/
    Accountability), DecisionBasis (Aims/RelevantEvidence/Assessments/Alternatives/Risks/Assumptions/
    Constraints/Values/Reasoning), DecisionReadiness (a seven-item gating checklist), DecisionOutcome
    (Chosen/Deferred/Rejected/Escalated), DecisionKind typology"
  - "A three-way DecisionRight/DecisionCapacity/DecisionReadiness distinction enabling a precise
    'authorized but not ready' system state, illustrated with a worked Architect example (Right=YES,
    Capacity=YES, Readiness=NO due to missing security evidence)"
  - "Three explicit AI-agent operating modes with respect to decisions: Advisory (recommendation to human),
    Delegated (governance-granted DecisionRight exercised by AI), Deterministic execution (policy/rule/
    condition, arguably not a 'decision' at all in the source's own sense)"
  - "'Candidate KnowledgeOS Kernel v0.3': extends 0174's v0.2 EPISTEMIC section with two new sections,
    DECISIONAL (Aim/Alternative/DecisionBasis/DecisionReadiness/Decision) and GOVERNED DECISION POWER
    (DecisionRight/DecisionalSpace/Constraint/Delegation/Accountability) -- continuing the explicit
    versioning discipline first seen at 0174"
  - "A two-axis kernel reformulation: Epistemic axis ('can we justify this?': Question/Evidence/Reasoning/
    Inference/Claim/Assessment) vs. Decisional axis ('may we choose this?': Aim/Alternative/DecisionRight/
    DecisionalSpace/Constraint/Risk/DecisionReadiness/Decision/Accountability), intersecting at Decision
