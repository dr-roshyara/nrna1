defines:
  - concept: "The three-dimension epistemic/governance/operational split"
    definition: "A proposition's status must be tracked along three genuinely independent axes rather than one linear chain: EpistemicState (what the organization is epistemically justified in asserting about the proposition -- Unknown/Observed/Supported/Determined/etc.), GovernanceState (what organizational decisions or approvals have been made concerning it), and OperationalState (what has actually been executed or changed in the world as a consequence) -- collapsing these into a single sequence (as in Supported→Determined→Decided) conflates categorically different kinds of events (epistemic status changes vs. governance/action events) and was identified as the central flaw in the model proposed at the end of 0815"
  - concept: "The formal conflict predicate"
    definition: "Two propositions genuinely contradict each other, Contradicts(p_1,p_2), only when they satisfy three joint conditions: IdentityCompatible (they concern the same semantic subject/proposition identity), ContextCompatible (they apply within the same or compatible bounded contexts), and TemporalOverlap (their validity intervals actually overlap) -- an apparent conflict failing any of these three conditions is not a genuine contradiction but instead a context difference, a temporal difference (mere Change), or an unrelated coincidence, formalized as Conflict(p_1,p_2)=I(p_1,p_2)∧C(p_1,p_2)∧T(p_1,p_2)∧¬Compatible(p_1,p_2)"
  - concept: "The DDD aggregate-boundary reframing"
    definition: "The traditional DDD question 'what objects/entities do we have in this domain?' is replaced by the sharper question 'which invariants must never be violated atomically?' -- aggregate boundaries should be derived from the set of invariants that require joint, transactional protection, not from a naive enumeration of nouns; this reframing directly follows from the mathematical stress-testing performed throughout Steps 186-189, which repeatedly discovered that naively-named 'objects' (like a single Knowledge aggregate, or a single linear state chain) failed to respect the genuine invariant boundaries the mathematics exposed"
refines:
  - concept: "0815's closing proposal of a single eight-state chain (Unknown→Observed→Believed→Supported→Determined→Decided→Refuted→Corrected)"
    refinement: "EXPLICITLY FOUND INCORRECT and replaced: the file discovers within its first few sections that this chain conflates epistemic, governance, and operational dimensions, and the Step 189 verdict explicitly states the test 'corrected our original model' rather than merely confirming it -- a genuine instance of the arc's stress-testing methodology catching and fixing its own prior proposal rather than validating it unchanged"
  - concept: "0806's ConflictType taxonomy and 0811's Difference≠Contradiction≠Correction≠Change≠Recontextualization inequality chain"
    refinement: "Given a precise, jointly necessary formal predicate (Contradicts requires IdentityCompatible∧ContextCompatible∧TemporalOverlap), converting the earlier qualitative inequality chain into a checkable logical condition"
  - concept: "0793's/0806's/0813's evidence-independence and multilayer-graph discoveries"
    refinement: "Extended into a full ten-relation typed algebra (adding Refines, Corrects, Supersedes, Derives, Causes, Authorizes, Decides, Executes alongside Supports/Contradicts), with the explicit DDD finding that 'the relationship itself carries domain meaning,' generalizing the multilayer-graph insight into a complete relation vocabulary"
  - concept: "0794's original disciplining of the Krishna/Atma metaphor, reaffirmed at 0808, 0812, 0813, and 0815"
