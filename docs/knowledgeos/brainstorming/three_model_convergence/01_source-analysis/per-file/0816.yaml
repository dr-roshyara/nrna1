about: >
  Directly continues 0815, opening "we now take the next step exactly as proposed: one proposition
  travels through the complete epistemic lifecycle. The objective is to determine what changes at each
  transition and what must never change."

  **§189.1-189.3 delivers the file's central self-correcting discovery**: attempting to move proposition
  `P` ("Nexus is running version 3.69") through the naive eight-state sequence proposed at 0815's close
  (`Unknown→Observed→Believed→Supported→Determined→Decided→Refuted→Corrected`) immediately reveals "these
  are not all the same kind of state" -- `Decided` is a governance/action event about a proposition, not a
  stronger degree of knowledge, so the naive chain `Supported→Determined→Decided` is "conceptually wrong."
  Delivers **three genuinely separate dimensions**, boxed: **`EpistemicState(E)≠GovernanceState(G)≠
  OperationalState(O)`**.

  **§189.4-189.6 delivers the epistemic state set** `ℰ={Unknown,Observed,Hypothesized,Supported,
  Conflicted,Refuted,Determined,Superseded}` (explicitly non-monotonic -- `Supported→Conflicted` and
  `Supported→Refuted` are both valid moves), and **explicitly rejects "Believed" as a canonical state**:
  the word carries at least four incompatible meanings (subjective belief, organizational working
  assumption, statistically supported hypothesis, officially accepted proposition), replaced by explicit
  typed alternatives `Belief_actor(p)`, `WorkingAssumption(p)`, `Supported(p)` -- "preserves the DDD
  principle of a precise ubiquitous language." Delivers **`Observed(P)≠True(P)`** (an observation can
  itself be wrong).

  **§189.7-189.11 delivers `Supported(P;E,R,C,t)`** (relative to an evaluation rule, evidence, context,
  and time -- "not an intrinsic property of P"), **`Supported(P)⇏Determined(P)`**
  (`Supported+DeterminationRule+Authority→Determined(P)`), and **`Determined(P,t_1)⇏True(P,t_1)`** --
  "under the applicable procedure and authority, the organization established P as its determination,"
  essential for auditable systems. **Delivers `Determination(P)≠Decision(D)` as genuinely different
  aggregates**: a board's `Determined(P)` and its subsequent decision `D:UpgradeNexus` are not states of the
  same object -- the decision merely references `P`, crystallized into the cleaner architecture
  `Evidence→EpistemicAssessment→Determination` and `Determination+Governance→Decision`.

  **§189.12-189.14 delivers `Decision≠Action≠Outcome`** (reconfirmed) and **the full lifecycle diagram**
  (Proposition→Observation→Evidence→EpistemicAssessment→[Supported/Conflict]→Determination/Resolution→
  GovernanceDecision→Action→Outcome→NewObservation), explicitly named "no longer one state machine... a
  causal/epistemic lifecycle consisting of interacting state machines." Delivers **the three named
  machines** (A Epistemic `E_t`, B Governance `G_t`, C Operational `O_t`) and their feedback loop, boxed:
  **`E_t→G_t→O_t→E_{t+1}`** -- "perhaps the cleanest mathematical expression yet of the KnowledgeOS
  lifecycle."

  **§189.15 delivers the DDD warning against a monolithic `KnowledgeAggregate`**, suggesting separate
  bounded contexts around evidence/observation, epistemic assessment, determination, governance decision,
  operational execution, and lineage/provenance -- "the mathematics is already warning us against a
  monolithic knowledge object."

  **§189.16-189.21 delivers what must remain invariant as `P` moves through its lifecycle**: Identity
  (`ID(P_t)=ID(P_{t+1})` unless explicitly a new proposition), Semantic context (preserved or explicitly
  changed), Provenance (every transition retains its witness), Temporal history (past states cannot
  disappear), Relation semantics (correction must not silently become change) -- explicitly "stronger
  candidates for invariants than the state names themselves." Delivers **context-dependent
  non-contradiction** (`P(C_1)≠P(C_2)`, "classic DDD bounded-context reasoning expressed mathematically")
  and **the formal conflict predicate**, boxed: **`Contradicts(p_1,p_2)` requires `IdentityCompatible∧
  ContextCompatible∧TemporalOverlap`**, formalized `Conflict(p_1,p_2)=I(p_1,p_2)∧C(p_1,p_2)∧T(p_1,p_2)∧
  ¬Compatible(p_1,p_2)` -- "much better than 'two documents say different things.'"

  **§189.22-189.25 delivers precise treatments of Refutation, Correction, Supersession, and Refinement**:
  refutation changes current epistemic status without erasing historical support (`Supported(P,t_1)`
  remains historically valid even after `Refuted(P,t_2)`), boxed **"refutation changes current epistemic
  status; it does not erase historical support"**; correction is distinct because the original proposition
  "may never have represented reality correctly," boxed **`Correction≠Change`**; supersession preserves
  historical correctness while making the proposition irrelevant, "another reason why `false` is
  insufficient as a universal state"; refinement is formalized via the partial order `p_1⪯p_2` (increased
  resolution without invalidation).

  **§189.26-189.27 delivers a ten-relation typed algebra**, boxed: **`ℛ={Supports,Contradicts,Refines,
  Corrects,Supersedes,Derives,Causes,Authorizes,Decides,Executes}`**, explicitly non-interchangeable
  (`Supports(e,p)≠Causes(e,p)`; `Authorizes(a,d)≠Supports(e,d)`), delivering **the major DDD finding that
  the relationship itself carries domain meaning**: a graph edge is not `source_id→target_id` but
  `(source,target,relation,context,time,witness)` -- "much closer to a real domain model."

  **§189.28-189.32 delivers the statistical/inference layer's proper containment**: `P(H|E)` belongs to an
  `Inference(H,E,M)` object (hypothesis+evidence+model+assumptions+posterior+uncertainty+provenance) that
  "does not become `Determination` automatically"; delivers **honest conditional probability**
  `P(H|E,M,A)` over a bare `P(H|E)`; delivers **distribution theory as an analytical-layer-only
  representation** (`θ~p(θ|E)` rather than a bare point estimate, explicitly "belongs to the analytical/
  inference layer, not necessarily the core domain kernel"). **Delivers the sharp AI assurance invariant**,
  boxed: **`LLMConfidence≠Probability`** unless calibrated and explicitly statistically interpreted, and
  crystallizes **"the epistemic state should therefore not contain 'confidence'"** -- `EpistemicState` and
  `InferenceAssessment` must remain architecturally separate objects.

  **§189.33-189.35 re-engages two further user-originated Gita observations under continued discipline**:
  first, **"what to do and what not to do — wisdom is continuously concerned with this distinction"**
  (paraphrasing Chapter-3-adjacent material), translated architecturally into `Knowledge≠Action` and
  `CorrectKnowledge≠CorrectAction` absent a normative layer, requiring `Knowledge→Action` to pass through
  `Governance/NormativeRule` -- "exactly why our architecture must not reduce organizational reasoning to
  statistical inference." Second, **a third repetition of "the new state does not necessarily know the old
  state,"** formalized `KS_t⇏Trajectory(KS_{0:t})`, with the current state reframed as
  `Projection(𝒯)` of the richer trajectory `𝒯=(KS_0,W_0,KS_1,...,KS_t)` -- explicitly named "a powerful way
  to represent the Chapter 4 lens without turning theology into software requirements." **Delivers a
  further careful reformulation of "only Krishna knows"**: `CurrentActorView=Projection(𝒯)` versus a
  complete lineage observer's `FullView(𝒯)`, requiring an explicit `LineageService/View` -- "not because
  the current state is deficient, but because state and history are different mathematical objects."

  **§189.36 delivers a new invariant**, boxed: **`I33`: a current state must not be assumed to contain its
  complete historical lineage** -- "lineage must be a first-class architectural concern."

  **§189.37-189.38 delivers the formal eight-stage lifecycle** (`Reality_t→Observation_t→Evidence_t→
  Assessment_t→Determination_t→Decision_t→Action_t→Outcome_{t+1}→Observation_{t+1}`, with `𝓕_t` and `W_t`)
  and **consolidates the arc's invariants into four named families**: Epistemic (`Unknown≠False`,
  `Inference≠Fact`, `Evidence≠Truth`, `Determination≠Truth`), Temporal (`ValidTime≠KnowledgeTime`,
  `PastState≠CurrentState`, `LaterKnowledge≠EarlierKnowledge`), Governance (`Capability≠Permission≠
  Authority≠Responsibility`, `Authority≠Evidence`), and Lineage (`Transition⇒Witness`,
  `CurrentState⇏FullHistory`) -- "this is becoming a genuine architecture rather than a collection of
  metaphors."

  **§189.39-189.40 delivers the DDD reframing**: aggregates should exist to protect invariants, not to
  represent "objects we have" -- boxed the correct governing question: **"which invariants must never be
  violated atomically?"** Delivers **five candidate aggregate boundaries**, explicitly provisional: Evidence
  (protects Identity+Provenance+Integrity), Epistemic Assessment (protects Assessment+EvidenceReference+
  Model/Rule), Determination (protects Determination+Authority+Witness), Decision (protects
  Decision+Authority+DecisionContext), Lineage (protects Transition+Witness+TemporalOrdering) -- "not yet
  our final aggregate map. We need to test it against real cases."

  **§189.41 delivers the Step 189 verdict**: "the test succeeded, but more importantly it corrected our
  original model" -- the naive single-chain sequence was "too simplistic"; the improved architecture is
  boxed: **`Epistemic State Machine ∥ Governance State Machine ∥ Operational State Machine`**, connected
  by explicit domain events and typed relations -- "a significant architectural improvement."

  **Closes opening "Step 190 — the next test,"** proposing a **DDD Aggregate Invariant Test** against
  three concrete real cases drawn from the corpus's own prior work (Nexus infrastructure discovery,
  Architecture Board decision, AI-generated KnowledgeOS proposition), reconstructing each through the full
  `Observation→Evidence→Assessment→Determination→Decision→Action→Outcome` chain and asking, boxed: **"which
  invariant must be protected at which aggregate boundary?"** No actual repository implementation occurs
  within this file itself; every relation, tuple, and aggregate boundary remains a conceptual specification
  pending Step 190's concrete-case test.
