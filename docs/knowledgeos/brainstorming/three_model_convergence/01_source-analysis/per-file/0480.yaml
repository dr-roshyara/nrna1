  - concept: "0479's just-corrected eight-component canonical Knowledge State"
    refinement: "The correction is repeated a third time against a fresh draft (K_t again embeds Zero/Lord/History), confirming a persistent recurrence pattern rather than an isolated lapse; re-corrected once more to K_t=(𝒜_t,ℛ_t,ℰ_t,𝒞_t,𝒯_t,Π_t) with Z/L/H external"
  - concept: "0471's Containment!=Set-Inclusion type-theoretic discipline"
    refinement: "Extended with an explicit Type-vs-Instance-Set separation (Type / Inst(Type)) to prevent the ontology from becoming self-referential"
  - concept: "0454's original Proposition/Statement P=(E,D,V) form"
    refinement: "Generalized to a full relational form P=(S,ρ,O,Γ), recovering the attribute case as a special instance rather than the general form"
  - concept: "0478's caution about calling component functions 'norms' and the aggregate a 'distance' without verified axioms"
    refinement: "Extended with concrete order-theoretic reasoning demoting the 'epistemic lattice' claim specifically, pending proof of per-component poset/lattice structure"
  - concept: "0475's Gap=Absence-relative-to-a-justified-requirement invariant (MissingEvidence=Gap)"
    refinement: "Used to catch and fix a direct logical inconsistency: Assertion's well-formedness had required evidence, which would make a missing-evidence Gap unrepresentable"
