defines:
  - concept: "Agent Port"
    definition: "An explicit architectural port defining agent-harness-agnostic operations (ProvideContext, SubmitRecommendation, RequestAction, ReportEvidence) that KnowledgeOS depends on, implemented separately by a ClaudeAdapter and a CodexAdapter, preventing vendor-specific coupling and making harnesses replaceable while the semantic contract they must honor stays fixed"
  - concept: "Policy Enforcement Point (PEP)"
    definition: "An explicit architectural boundary through which every agent action request must pass before execution: it evaluates policy and either DENIEs the request or ALLOWs it through to the tool adapter — the concrete mechanism implementing the AgentCapability≠AgentAuthority principle"
  - concept: "AssuranceDomain vs. AssuranceExecutionInfrastructure"
    definition: "Assurance has a dual nature: its semantics (Rule, Verification, Finding) belong to the domain layer, while its execution mechanisms (RepositoryScanner, RuntimeAPI, StaticAnalyzer) belong to infrastructure/integration; the two must be architecturally separated rather than treated as one undifferentiated 'assurance module'"
  - concept: "The architectural center"
    definition: "The stable core that all technology choices orbit and that must survive any vendor or infrastructure change: Governed Engineering Knowledge + Evidence + Assurance — explicitly not any AI agent (Claude/Codex), any database (Postgres/VectorDB), or any external platform (Nexus)"
  - concept: "Migration principle (strengthen before replacing)"
    definition: "Given that the existing KnowledgeOS/EKS ecosystem already contains real governance mechanisms, a registry, hooks, memory handling, agent harnesses, and deterministic checks, the safe migration path is to map and strengthen what already exists against the target architecture before considering wholesale replacement — the architecture delta (ΔArchitecture=Target-Current) must be classified into Retain/Refactor/Introduce/Remove/Integrate, never treated as blanket license to rewrite"
