about: >
  A concise direct continuation of 0247, formalizing knowledge as a continuously evolving temporal state
  K(t) rather than a static object, and explicitly distinguishing Fact from Knowledge (a fact can exist
  unobserved by anyone; it is not thereby knowledge for anyone). Largely consolidates temporal-knowledge
  concepts already present in the corpus (0225's HSMM state-duration work, 0235's knowledge-as-trajectory)
  rather than introducing wholly new architecture.
introduces:
  - concept: "K(t) = f(O_<=t, E_<=t, C_<=t): knowledge as a function of cumulative observations, evidence, and contextual interpretation up to time t -- explicitly a continuously evolving state, not a document"
  - concept: "Fact != Knowledge: a fact can exist (e.g. an unobserved physical event) without being knowledge for anyone -- Knowledge = Facts/claims + Evidence + Justification + Context + Temporal validity + Relationships, all of which can change, hence Knowledge = K(t)"
  - concept: "Old facts are not deleted but transition to historical status: Valid(F,t1)=true, Valid(F,t2)=false or Status(F,t2)=historical -- worked example: 'system uses Architecture A' (valid t0-t1) -> migration -> 'Architecture B' (valid t2-now), preserving the trajectory rather than overwriting"
  - concept: "Davidson invariance reframed temporally: distinguish what changes (representation/language/measurement/interpretation/model) from what remains invariant (relationships/truth-conditions/structural-properties) across a knowledge trajectory"
  - concept: "Reframed research question: not 'how much knowledge does a system contain?' but 'what is the current state of its continuously evolving body of justified facts, and how did that state change over time?' -- knowledge as a temporal state machine/trajectory, not a static repository"
defines: []
refines:
  - concept: "0247's Knowledge Vector (T,J,R,A,S,C,U) and time-indexed knowledge decay principle"
    refinement: "Sharpens the time-indexing into an explicit functional form K(t)=f(O,E,C) and adds the Fact!=Knowledge distinction and the non-deletion/historical-status trajectory principle not spelled out in 0247."
  - concept: "0225's HSMM three-layer state architecture and 0235's knowledge-as-trajectory principle"
    refinement: "Reconfirms the same trajectory-not-snapshot principle from a different (epistemological, not mathematical) angle."
