defines:
  - concept: "The witness invariant"
    definition: "Every epistemically meaningful state transition KS_i→KS_j in the knowledge state-transition system must be accompanied by a preserved witness W_ij={Evidence,Actor,Authority,Time,Context} sufficient to justify that transition under the applicable rules; the absence of a witness means the transition cannot be treated as a justified promotion, though it does not mean the transition never occurred -- named one of the most important mathematical formulations the corpus has derived, functioning as the load-bearing invariant beneath the candidate reconstruction and incompleteness theorems"
  - concept: "'Generation without new evidence cannot constitute epistemic advancement'"
    definition: "A formal, information-theoretic statement of AI-hallucination prevention: if a system's epistemic state regarding proposition X is Unknown, and an LLM subsequently generates a hypothesis H without any new evidence entering the system (E_new=∅), then the conditional entropy H(X|E_new) equals the unconditional entropy H(X) -- no uncertainty reduction has mathematically occurred -- so the generated text, however fluent or plausible, cannot be treated as having advanced the system's justified epistemic state; this derives the arc's repeated qualitative hallucination-prevention principle directly from information theory rather than merely asserting it"
  - concept: "The reconstruction theorem / incompleteness theorem pair"
    definition: "Reconstruction theorem (candidate): if every edge in the knowledge lineage graph carries a non-empty witness, and identity/context/time semantics are preserved throughout, then a future observer can reconstruct the RECORDED epistemic trajectory KS_{t_0}→...→KS_{t_n} -- explicitly not the actual historical reality, which is unrecoverable if it was never observed or recorded in the first place. Incompleteness theorem (its dual): if some transition edge lacks a witness, that transition may not be reconstructable, representing a POTENTIAL epistemic gap -- explicitly not proof the transition never happened, preserving Unknown≠False even at the level of a formal theorem statement"
