about: >
  Delivers the foundational principle `Data≠Knowledge` (a `status=APPROVED` field value alone insufficient
  to conclude an authorized decision exists without `WhoApproved/UnderWhichAuthority/When/WhatEvidence`,
  PASS), directly extending 0688's Evidence/Knowledge distinction, and a formal `Concept=(Identity,Meaning,
  State,Invariants,Relationships,Authority,Provenance)` semantic-object schema, with `ConceptMention≠
  ConceptImplementation` (`Evidence` appearing across `EvidenceCollector/EvidenceStore/EvidenceReport/
  EvidenceAPI` establishing terminology but not a coherent domain, PASS) directly extending 0688's
  `NameMatch≠SemanticConformance` to the concept level.

  Delivers a concrete Semantic-collision worked example (Module A treats "evidence" as a source document,
  Module B as a runtime observation, `OBS`) directly extending 0696's semantic-collision pattern, with the
  important clarifying nuance that `Evidence_A≠Evidence_B` across genuinely distinct contexts is legitimate
  -- the problem is only when the system treats them as identical without explicit translation --
  and `BoundedContext≠Directory` (an `evidence/` directory containing only file-parsing/OCR/embedding logic
  correctly identified as ingestion, not necessarily an Evidence bounded context, PASS).

  **Delivers the file's central reframing question, genuinely precise and directly useful**: `Who owns the
  meaning?`, not `who stores the record?` -- an `EvidenceRepository` that merely stores records is
  distinguished from an `EvidenceDomain` that defines what evidence means and what makes it valid (three
  services writing evidence records, only one defining validation rules, correctly identifying the
  validating service as the stronger semantic-owner candidate, PASS) -- crystallizing **`Invariant→Owner` as
  the strongest ownership-identification technique** (the component enforcing `Approved⇒AuthorityPresent`
  is the strongest candidate for owning the decision invariant, PASS), directly extending 0696's aggregate-
  ownership discipline with a general-purpose ownership-discovery heuristic. Delivers state-transition-based
  ownership discovery (any component being permitted to transition `Candidate→Authoritative` correctly
  flagged `OBS/VIOLATION`, depending on the intended rule), directly extending 0690's/0696's knowledge-
  promotion-lifecycle discipline.

  **Delivers `True≠Authoritative`, a philosophically clean and precisely reasoned restatement of the
  corpus's Recommendation≠Decision family**: an AI's "the architecture should use Kafka" correctly remains a
  `Recommendation`, never an `ArchitectureDecision` (PASS), crystallized as `Suggestion→Review→Decision→
  AuthoritativeState`. Delivers Semantic identity fragility (a decision identified only by filename
  `ADR-042.md`, breaking under rename, correctly flagged `OBS`), directly extending 0672's/0691's/0696's
  identity-stability discipline, and `Knowledge-version≠SourceCodeVersion` (an architecture decision
  changing independently of any application deployment, PASS), directly extending 0688's/0689's multi-
  dimensional versioning discipline.

  Delivers Conflict semantics with the important, precisely reasoned caution that the newest claim does
  NOT automatically win (two disagreeing architecture documents correctly yielding a recorded `Conflict`
  with sources/dates/authorities/scope preserved, PASS), directly extending the corpus's conflict-surfacing
  family, crystallized as **`Conflict is knowledge`** (`Conflict→Finding→Resolution`, "silently overwriting
  one side destroys organizational history"), directly extending 0682's `Dissent→KnowledgeArtifact`
  principle into semantic-ownership conflicts specifically.

  Delivers a semantic-specific relationship vocabulary (`supports/contradicts/supersedes/derivedFrom/
  implements/verifies/authorizes/violates`, "more important than simple foreign keys") and a formal semantic
  graph `G_K=(V_K,E_K)` with a valuable worked diagram (`ArchitectureRule→^{implementedBy}Component→
  ^{verifiedBy}Test→^{produces}Evidence→^{observedAt}Runtime`), directly extending 0687's/0689's/0693's/
  0695's/0696's Architecture Evidence Graph family with a semantic-specific edge-type vocabulary, "fundamentally
  different from a document repository."

  **Delivers an explicit, precisely formalized Anti-Corruption Layer principle, directly and usefully
  applying the classic DDD pattern to this reconstruction's own vocabulary**: `JiraIssue≠ChangeRequest`;
  instead `Mapping(JiraIssue,ChangeRequest)` (an automatic Jira-Issue-to-ChangeRequest identity assumption
  correctly rejected in favor of an explicit mapping relationship, PASS×2), directly extending 0687's/0693's
  external-source/projection disciplines with a named, currently reusable integration-architecture pattern,
  alongside a Bounded-context-candidate criterion (`Meaning+Rules+Lifecycle+Ownership` forming a coherent
  cluster, extending 0696's cohesion/coupling boundary-candidate discipline into explicitly semantic terms).

  Delivers an eight-row illustrative Semantic ownership matrix (all `?`, extending 0693's/0695's/0696's
  Conformance/inventory matrix family), Semantic orphan detection (`KnowledgeItem` used across five modules
  with no identifiable invariant or owner, `OBS`), directly extending 0682's/0687's/0696's orphan-detection
  discipline into concept-level semantics, and Semantic duplicate detection (`KnowledgeRecord` and
  `KnowledgeItem` with identical fields/lifecycle/API behavior, `OBS`), extending 0696's semantic-duplication
  pattern.

  **Delivers the file's most severe and explicitly self-flagged anti-pattern -- Semantic fragmentation
  (`OneConcept→ManyOwners`)**: `Decision` simultaneously "owned" by `ServiceA`, `ServiceB`, and `AgentMemory`,
  with three independent representations each claiming to be the current architecture decision, correctly
  flagged **`DRIFT`** -- explicitly self-declared "the most serious pattern" -- directly and precisely
  extending 0696's Fragmented-outcome diagnostic into a concrete, named DRIFT-classified anti-pattern.
  Delivers the resolving principle that centralization requires **`One authoritative semantic owner`**, not
  necessarily one database -- physical projections may legitimately exist elsewhere -- directly extending
  0691's/0693's "centralized means one semantic model, not one database" principle, with a Projection-
  staleness-detection mechanism (an agent cache holding decision version 4 while KnowledgeOS is at version
  5, correctly flagged `ProjectionStale`, PASS), explicitly and directly connecting this file's own framework
  back to the agent-architecture discussions: "this connects back to agents... Agent memory may be
  `Projection` but not `Authority`" -- unifying 0690's/0693's/0695's pointer-layer principle under this
  file's semantic-ownership framework for the first time.

  Delivers Authority-must-have-an-owner (`Rule→Authority→AuthorityHolder`, an unidentifiable authority
  holder correctly flagged `GovernanceGap`, PASS), directly extending 0687's/0689's authority-provenance
  discipline, and **the important, precisely reasoned principle that different semantic concepts require
  genuinely different state machines and must not be conflated into a single generic status flag**: `Claim`
  (`Proposed→Supported→Accepted→Superseded`), `Decision` (`Draft→Approved→Effective→Superseded`), and
  `Finding` (`Open→Investigating→Remediating→Verified→Closed`) each require their own lifecycle; a uniform
  `ACTIVE|INACTIVE` status applied to every concept correctly flagged as a semantic weakness (`OBS`) --
  directly and genuinely extending 0682's/0689's/0692's lifecycle-management family with an explicit anti-
  conflation caution. Delivers Semantic invariants with enforcement-location identification (domain code/
  application service/database constraint/policy engine/workflow/CI/runtime/human process; a README-only
  invariant correctly classified `DocumentedRule`, never `EnforcedInvariant`, PASS), directly extending the
  corpus's central `Specified≠Implemented` family.

  Delivers the capstone chain **`SemanticTruth→Invariant→Enforcement→Evidence`** -- "how semantic
  architecture becomes executable" -- and formally defines the **`KnowledgeOS Semantic Core`** as "the
  smallest coherent set of concepts and invariants that defines what 'knowledge' means in the system,"
  hypothesized as `Evidence+Claim+Decision+Authority+Provenance+TemporalValidity` but explicitly and
  precisely qualified as "a hypothesis until the implementation confirms it" -- directly and genuinely
  extending the corpus's central epistemic-honesty discipline into its own core-definition claim.

  **Delivers a genuinely valuable, generalizable heuristic -- the "semantic core test"**: "If this
  component disappeared, would KnowledgeOS lose the MEANING of its knowledge, or merely a technical
  capability?" (removing a search/indexing subsystem correctly leaving knowledge semantics intact, hence
  `SupportingCandidate`; removing the semantic identity/provenance model correctly destroying traceability
  entirely, hence `CoreCandidate`) -- a precise, currently reusable diagnostic for distinguishing genuine
  architectural cores from supporting infrastructure in any system, not merely this one.

  No explicit new named invariants section appears in this file, consistent with 0696's organizational/
  principle-driven (rather than atomic-invariant-introducing) character.

  Delivers Step 112's verdict continuing the calibrated methodology-only pattern: "STEP 112 — SEMANTIC
  OWNERSHIP MODEL: PASS. The actual ownership map remains: TBD until the repository evidence is mapped."

  **Closes by opening "Step 113 — KnowledgeOS Semantic Core Reconstruction," explicitly framed as "the
  deepest question so far,"** restating the corpus's central open tracked question in its sharpest form
  yet: whether `Evidence→Claim→Decision→Authority→Action→Observation` (with `Provenance` and
  `TemporalValidity` cross-cutting) represents "real domain concepts represented and enforced by the
  software, or merely concepts we have projected onto the existing implementation" -- **"that distinction
  will determine whether KnowledgeOS is truly a Knowledge Operating System or currently an AI engineering
  platform with knowledge-oriented tooling."** This directly echoes and sharpens 0688's falsifiability
  criterion (Documents+Embeddings+LLM+Search+Agents alone ≠ genuine KnowledgeOS), restating the same
  underlying tension at its most precise point in this reconstruction so far. No actual code execution,
  repository inspection, or verified filesystem/concept-ownership claim is reported anywhere in this file.
