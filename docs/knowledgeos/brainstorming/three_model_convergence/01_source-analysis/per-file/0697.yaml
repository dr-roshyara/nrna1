defines:
  - concept: "Who owns the meaning? (semantic ownership)"
    definition: "Semantic ownership of a concept is established not by which component stores its records, but by which component defines and enforces what the concept means and what makes an instance of it valid -- typically identified via the component that enforces the concept's governing invariant"
  - concept: "True≠Authoritative"
    definition: "A statement can be widely believed to be true (e.g. an AI's technical recommendation) without being the organization's official, authorized decision; only content that has passed through Suggestion→Review→Decision→AuthoritativeState counts as authoritative"
  - concept: "Semantic fragmentation (OneConcept→ManyOwners)"
    definition: "The most serious semantic-ownership anti-pattern: a single conceptual entity (e.g. 'the current architecture decision') is independently represented and asserted as current by multiple uncoordinated owners (e.g. two services and an agent's memory), creating genuine ambiguity about which representation is true"
  - concept: "The semantic core test"
    definition: "To determine whether a component belongs to a system's genuine semantic core (versus merely supporting infrastructure), ask: if this component disappeared, would the system lose the MEANING of its knowledge (identity, provenance, validity), or merely a technical capability (e.g. search speed)? Loss of meaning indicates a core candidate; loss of only technical capability indicates a supporting candidate"
