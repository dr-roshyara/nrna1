about: >
  A formal "REFINED STEP 292" artifact from the KR-SIM lane, testing Reiter's situation calculus
  (Raymond Reiter, "Knowledge in Action," 2001, external academic source `[EXT]`) against KnowledgeOS's
  own prior, already-derived corpus evidence -- with executable audit code and JSON results (already
  noted in this reconstruction's manifest as sequences 2348-2354, `step-292/exec/`). Verdict: "Situation
  = K_t REFUTED -- and refuted by KnowledgeOS's OWN prior evidence, not by Reiter. 9 of 10 negative tests
  refuted. One BOUNDED candidate (δ as an SSA), one SUPPORTED mechanism (regression), one method, one
  naming. NO open item closed. Theory v1.2 unchanged; no governance act."

  **DELIVERS WHAT REITER ESTABLISHES** `[EXT]`: situations are histories, not states (two situations may
  share fluent values and differ); the successor-state axiom (SSA) genuinely solves the representational
  frame problem, resting on the causal-completeness assumption; the regression theorem reduces reasoning
  about a history to reasoning about S₀ (verified: agrees with progression 12/12, test A3); Poss as an
  executability gate (verified, A4); the situation-calculus induction axiom is second-order -- "the
  system is not fully first-order decidable. Any transfer inherits this."

  **DELIVERS WHAT KNOWLEDGEOS INDEPENDENTLY ESTABLISHED BEFORE READING REITER**: KR-HISTORY T2 (identical
  current content, different histories, no function of K_t separates them; the kernel writes history and
  reads it 0 times, statically verified -- "this is Reiter's Situation≠State, reached independently");
  KR-CONTR-EVAL (the evaluation obstruction is structural, not cardinal -- no flat value domain of any
  cardinality is adequate); KR-CONTR-FDE (the surviving factorization is Status×Typed Boundary); KR-COMP
  (composition's load-bearing parameter is the frame qualifier, not the rule); R1 (KnowledgeOS's object
  is A_t, an attribution; no component may assert Knows); Step 291 (operation-registry membership,
  signatures, bodies, identity, ratification -- all OPEN).

  **DELIVERS WHAT REITER NEWLY ENABLES (FOUR ITEMS ONLY)**: a candidate shape for δ (the SSA), with its
  blocking conditions named -- BOUNDED; regression as a verification mechanism ("was this determination
  warranted at the time?") -- SUPPORTED; persistence-by-construction as a design method -- CORROBORATED; a
  third equivalence level (syntactic≠observational≠semantic) -- NEW SYNTHESIS, naming only.

  **DELIVERS THE LONG LIST OF WHAT REMAINS UNRESOLVED**: equality/≡_sem, Qualify, O/T, identity,
  provenance placement, operation registry (membership/signatures/bodies/ratification), Contr,
  Observation, δ, ℛ_req, DECISION-02, composition rule -- "all preserved. Reiter closes none of them."

  **DELIVERS THE DECISIVE FINDING**: "the extraction's own §1.2 table maps Situation→K_t, two lines above
  stating that situations are not states. That is a correspondence, not a derivation -- the exact failure
  the mandate names. It is REFUTED by execution (A1: two distinct situations, one state) and by the
  corpus (KR-HISTORY T2), and the corpus got there first." Delivers the important, generalizable
  methodological principle: "Independence label: KnowledgeOS-DERIVED · CORROBORATED BY REITER. Never the
  reverse." This is a formal, code-audited application of exactly the same corroboration≠derivation
  discipline this reconstruction's own Gītā thread has applied throughout (files 2234-2321), now
  extended to an external academic source outside philosophy entirely (AI/situation-calculus theory), and
  with the added rule that when a corpus finding predates the external source's reading, the corpus is
  the derivation and the external source is mere corroboration -- never the reverse, regardless of the
  external source's rigor or authority.

  **DELIVERS THE DECISIVE LIMIT ON δ-AS-SSA**: `[NEG]` "the successor-state axiom silently resolves
  γ⁺∧γ⁻ in favour of γ⁺ -- measured, from both F true and F false. It presupposes consistent effect
  axioms; it cannot detect their inconsistency." Consequence: "for a programme that has spent four
  experiments preventing exactly that collapse, this is disqualifying as a drop-in and clarifying as a
  boundary: δ cannot be settled before Contr." This directly connects to and further constrains this
  reconstruction's already-tracked measure-theoretic thread's own open contradiction-predicate question
  (Contr, files 2323-2324's G-109/G-110), showing that even a well-established external formalism (the
  SSA) cannot substitute for resolving Contr first.

  **DELIVERS THE NEGATIVE-TEST RESULT**: 9 of 10 negative tests (P1-P10) refuted -- "none fails because
  Reiter is wrong. Each fails because a construct is well-defined relative to assumptions KnowledgeOS
  does not satisfy -- causal completeness, consistent effect axioms, factive knowledge, an existing
  action theory." Summary principle: "Reiter's machinery is available exactly to the extent that
  KnowledgeOS supplies the assumptions it requires -- and those assumptions are precisely the programme's
  open items."

  **CLOSES WITH AN EXPLICIT NO-GOVERNANCE-ACT DECLARATION**: "none sought, none taken. Theory v1.2
  unchanged · no v1.3 · no primitive promoted · no invariant added · kernel NOT SELECTABLE · C-1
  restated: useful is not irreducible." The closing restated principle ("useful is not irreducible")
  directly echoes this reconstruction's already-tracked file 2329's kernel-verdict argument point 2 ("do
  not put a mechanism into the kernel merely because KnowledgeOS can use it").
