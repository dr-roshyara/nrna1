about: >
  A landmark architectural file crystallizing a central observation from 0451's case study -- "Arjuna did
  not initially ask a complex question. The complexity emerged from the dimensions revealed by the first
  observation" -- into a full Progressive Investigation architecture for KnowledgeOS. Models investigation
  as Q_0 -> O_0 -> D_1,D_2,D_3,... -> Q_1,Q_2,Q_3,..., with the initial question ("who are the people I must
  fight?") revealing seven dimensions (person, side, relationship, family, teacher, social role, moral
  relationship) that themselves generate entirely new questions -- explicitly "much more sophisticated than
  Question -> Search -> Answer."

  Delivers the file's central formal contribution: an explicit **six-level investigation-depth model**
  (Level 0, initial observation answering the original purpose; Level 1, dimension discovery -- the
  observation reveals additional dimensions such as enemy/relative/teacher/grandfather/friend/son/kinsman;
  Level 2, relationship investigation -- the question shifts from "who are they?" to "what is my
  relationship with them?"; Level 3, consequence investigation -- "if I kill them, what happens to family,
  duty, tradition, society?"; Level 4, ideal-state investigation -- "what should I actually consider the
  desired/ideal outcome?", where Arjuna's original determination is directly challenged; Level 5, decision
  investigation -- "given everything now known, what should I do?", where Arjuna explicitly requests
  Krishna's guidance). Crystallizes this into a named **Progressive Investigation Principle**: "the depth of
  investigation is not predetermined by the initial question. It is dynamically determined by the dimensions
  and relationships discovered during observation," formalized as Depth_{t+1}=f(D_new,R_new,Uncertainty_t,
  DecisionContext), with the explicit architectural consequence that KnowledgeOS must never decide upfront
  "this is a Level-3 investigation" -- investigation depth must emerge from discovered knowledge.

  Reframes "dimension" as potentially "a new axis of inquiry" that opens entirely new regions of the
  knowledge space, illustrated with a worked chain (Person -> Relationship -> Duty -> Consequence -> Ideal ->
  Action), explicitly connecting this to the corpus's established infinite-space hypothesis. Makes the Zero
  and Lord Lenses concretely OPERATIONAL rather than merely descriptive for the first time in this precise
  form: Zero(K_t) -> MissingDimension -> FurtherInquiry (worked example: detecting "relationship dimension
  not assessed" yields "the current answer is insufficient because an unassessed dimension may materially
  affect the purpose," rather than simply "answer found"); and Lord and Zero explicitly paired as Zero ->
  Gap while Lord -> PossibleDimension, worked via a concrete Bhisma example (Lord Lens suggests candidate
  dimensions relationship/duty/authority/history/consequence; Zero Lens asks which of these remain
  unassessed), after which the Sarathi decides how to guide the Knower through the investigation.

  Gives the Sarathi role a more precise operational characterization: not simply "answer the question" but
  **"a dynamic investigation guide"**, following a six-stage internal process (current epistemic state ->
  what has been discovered -> what dimensions are now relevant -> what remains unresolved -> what should be
  investigated next -> has the Knower reached decision sufficiency?). Uses this to explain, at an
  architectural level, why Krishna does not immediately answer Arjuna in Chapter 1: the full causal chain is
  Arjuna observes -> new dimensions appear -> his knowledge changes -> his uncertainty increases -> his
  conceptual model becomes inadequate -> he asks deeper questions -> Krishna begins guidance, rather than a
  simple question-answer exchange.

  Formalizes all of this as a named **Progressive Investigation Principle**: an observation may reveal
  dimensions not part of the original inquiry; newly revealed dimensions may create new questions, alter
  existing interpretations, increase uncertainty, and require deeper levels of investigation -- formalized as
  Q_t -> O_t -> D_new -> Q_{t+1}, with Q_{t+1} != Q_t in the general case, and
  Investigation_{t+1}=f(K_t,D_new,Z_t,I_t,P_t). Derives a significant architectural consequence: KnowledgeOS
  should NOT be built around a single "Observation Engine" producing one final answer, but instead requires
  an explicit **investigation loop** (Question -> Observation -> Dimension Discovery -> Zero/Lord Lens ->
  {more investigation needed? Yes -> new question -> new observation | No -> Guidance -> Knower}), explicitly
  named "a substantially different architecture from a conventional analytics system."

  Closes by sharpening the newly-launched Question 2 (What is a Dimension?) into a more precise prior
  question before attempting a definition: "when an observation reveals something that was not represented
  before, what exactly has been discovered?" -- offering four candidates (a new dimension, a new value of an
  existing dimension, a new relationship, a new statement, or potentially all four at different levels),
  using the Bhisma example to sharpen the stakes: "Bhisma did not suddenly become a new person. What changed
  was the KNOWLEDGE STRUCTURE around the person" -- explicitly proposed as the first sub-question of
  Dimension, to be answered by the human's own understanding before Gita/lens testing, per 0449's
  established methodology.
