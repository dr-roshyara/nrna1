defines:
  - concept: "The three-zone architecture"
    definition: "The eight epistemic-lifecycle concepts (Observation through Outcome) group not by individual noun but by type of responsibility into three zones: Epistemic (Observation→Evidence→Knowledge→Determination, answering 'what do we know and what follows from it') answers factual questions; Governance (Decision→Authorization, answering 'what shall we do and who is permitted to cause it') answers organizational-intent questions; Operational (Execution→Outcome, answering 'what did we do and what happened') answers operational-fact questions -- connected by a feedback loop from Operational back to Epistemic, forming a closed strategic-domain cycle that is 'a much more meaningful architecture than eight independent services,' though still explicitly a hypothesis, not yet a frozen set of bounded contexts"
  - concept: "AI capability≠Architecture"
    definition: "AI participates as an actor/capability crossing multiple bounded contexts at specific points (classification, synthesis, hypothesis generation, recommendation, anomaly detection) but must never itself become a bounded context or the owner of the domain model -- the architecture's validity must not depend on which specific AI model performs these roles, so that replacing the underlying AI technology (e.g. swapping GPT for Claude) would not destroy or require redesigning the domain model"
  - concept: "Domain contracts over shared internal models (anti-corruption discipline)"
    definition: "Adjacent bounded contexts (e.g. Epistemic and Governance) must exchange information through explicit, translated semantic contracts (such as a DeterminationSummary rather than the full internal Knowledge model) rather than by directly sharing or querying each other's internal persistence or domain models -- direct sharing (e.g. Governance querying a KnowledgeDatabase, or Execution querying a DecisionDatabase) creates accidental coupling that undermines the bounded-context boundary even when the boundary is conceptually well-motivated"
refines:
  - concept: "0797's opening of Step 173 and its proposed Language+Invariant+Lifecycle+Ownership+ChangePressure merge-test methodology"
    refinement: "DELIVERED: the full seven-pair merge test with worked examples, the qualitative scoring matrix, and the resulting three-zone architecture crystallization -- directly fulfilling the falsification-oriented bounded-context discovery methodology Step 173 was opened to perform"
  - concept: "0797's two-worlds model (Epistemic vs. Operational/governance, bridged by Determination→Decision)"
    refinement: "REFINED from two worlds into three zones by splitting 0797's single 'Operational/governance' world into separately justified Governance (Decision→Authorization) and Operational (Execution→Outcome) zones, each independently supported by the five-test DDD scoring matrix -- a genuine deepening rather than a mere restatement"
  - concept: "0793's Capability(a,x)⇏Authority(a,x) and the corpus's recurring 'AI as participant, not authority' theme"
    refinement: "Extended into a strategic-architecture-level principle, AI capability≠Architecture, applied not to a single actor's authority over one action but to the entire domain model's independence from any specific AI technology -- explicitly connected back to and validating the corpus's own prior Agent→Tools→KnowledgeOS harness design"
  - concept: "0787's DDD aggregate/bounded-context analysis (Evidence/Knowledge as Strong BC Candidates, Decision folded into Governance)"
    refinement: "Substantially extended via the full five-test scoring matrix and the resulting three-zone strategic hypothesis, which reorganizes 0787's per-concept candidate list into three responsibility-based zones rather than a flat list of individually-scored aggregate candidates -- a genuine strategic-level (not merely tactical-level) DDD deepening"
