about: >
  A review of a second real, named academic source -- Matthew Dasti & Stephen Phillips' "The
  Nyāya-sūtra: Selections with Early Commentaries" (a genuine, well-known Oxford translation) --
  proposing a process-centric (not relation-centric, cf. 0094) reframing of KnowledgeOS around Pramāṇa
  as knowledge-generating process rather than static knowledge objects. Introduces Pramāṇābhāsa
  (knowledge-source imitator, distinct from Hetvābhāsa) and a Git-like "Commentary Lineage" framing.
  Produces a NINTH unreconciled candidate-ID naming scheme (ADR-KOS-EPI-nnn), substantially overlapping
  in content with several already-tracked registry entries.

introduces:
  - "Process-centric reframing (distinct axis from 0094's relation-centric reframing): 'Knowledge is
    not primarily a stored thing. Knowledge is the output of a reliable process.' Object -> Knowledge
    Source (Pramāṇa) -> Valid Cognition -> Successful Action, replacing Data->Information->Knowledge"
  - "Pramāṇābhāsa (knowledge-source IMITATOR) -- distinct from Hetvābhāsa (pseudo-REASON, 0092): a
    source that only APPEARS genuine, mapped directly to hallucinated citations/false confidence/
    plausible-but-unsupported answers/outdated assumptions"
  - "'Commentary Lineage': Sūtra -> Commentary -> Later Commentary -> Refinement, explicitly compared
    to 'Git for institutional reasoning' -- a fresh angle on provenance/revisability as VERSIONED
    INTERPRETIVE lineage, not merely evidentiary chain-of-custody"
  - "Knowledge Production Pipeline / Verification Engine (process-centric) and 'Cognitive Review Mode'
    / 'Epistemic Escalation' (doubt triggers deeper verification only on contradiction/uncertainty/
    challenge)"
  - "⭐ NINTH unreconciled candidate-ID scheme: ADR-KOS-EPI-001..005 (Knowledge is Process-Generated;
    Evidence Source Registry; Knowledge Source vs Knowledge Imitator; Doubt Escalation; Commentary
    Lineage) -- substantially overlapping in content with already-tracked registry entries (Reasoning
    Provenance, Evidence Authenticity, Unknown Preservation, Revisability) under yet another new prefix"
  - "'Nyāya-inspired' architecture diagram: Epistemic Governance Layer -> Knowledge Production Engine
    (Observation/Inference/Testimony) -> Validation Engine -> Knowledge Objects -> Action/Decision --
    an eighth reshaping, itself a process-pipeline shape similar to 0096's but with different layer
    names/count (5 stages here vs 4 at 0096)"

