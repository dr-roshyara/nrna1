defines:
  - concept: "Fitness rule (formal)"
    definition: "A machine-checkable constraint F_i(S,C)→{PASS,FAIL,WARN,UNKNOWN} over observed system state S and applicable constitutional/governance context C; distinguished from a bare architecture principle (which only describes what should be true) by being objectively testable, and from a verification execution (which produces the actual evidence about whether it holds)"
  - concept: "Rule applicability governance"
    definition: "Whether a fitness rule applies to a given subject/state/time (Applicable(F,S,t)) must itself be determined by Scope+Policy+Authority, never by ad hoc developer discretion (rejecting the anti-pattern 'if inconvenient: rule.not_applicable = true')"
  - concept: "AFR-24 (agent-local memory)"
    definition: "Agent-local memory must not silently become enterprise authority — the fitness-rule-layer formalization of the pointer-layer principle first codified as invariant A1 (0706)"
  - concept: "Fitness-result disposition rule"
    definition: "A FAIL verdict creates a Finding; an UNKNOWN verdict must NOT automatically create a Violation, but instead a Finding of type InsufficientEvidence — preventing insufficient-evidence conditions from being misclassified as confirmed violations"
  - concept: "No single score"
    definition: "Architecture health must never be reduced to one aggregate percentage, because a single failed authority-critical rule can matter more than many passing cosmetic rules; instead, critical failures must be surfaced separately from an overall pass rate, with severity (BLOCKER/CRITICAL/HIGH/MEDIUM/LOW) itself governed"
refines:
  - concept: "0714's AFR-01..AFR-10 catalog"
    refinement: "Directly extended with sixteen additional numbered rules (AFR-11..AFR-26), spanning structural/semantic/governance/evidence/temporal/assurance/agent/action categories, transforming the prior catalog into a substantially complete, systematically organized fitness-rule set"
  - concept: "0714's binary .claude/memory/ FAIL test"
    refinement: "Refined into a content/framing-sensitive test: independent assertion of authoritativeness fails, but an explicit pointer to the KnowledgeOS-authoritative record passes"
  - concept: "0709's Constitutional self-protection concern"
    refinement: "Directly extended into the fitness-rule layer specifically: fitness rules themselves require governance, their own lifecycle, and version-tracked results, preventing a rule from being quietly weakened to manufacture a passing result"
  - concept: "0693's/0699's/0708's/0714's (AFR-10) Unknown-preservation discipline"
    refinement: "Directly extended into concrete result-handling logic: an UNKNOWN fitness verdict must produce a Finding(type=InsufficientEvidence), never an automatic Violation"
  - concept: "0711's H(ContextPackage) cryptographic-hashing proposal"
    refinement: "Directly extended into an operational fitness requirement via Recommendation→ContextHash, worked through a concrete example of a recommendation remaining bound to its originating context even as the architecture evolves"
