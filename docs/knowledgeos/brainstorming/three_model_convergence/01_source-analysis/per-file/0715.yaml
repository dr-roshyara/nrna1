about: >
  Formalizes the fitness-rule mechanism precisely: `F_i(S,C)→{PASS,FAIL,WARN,UNKNOWN}`, where `S` is
  observed system state and `C` is applicable constitutional/governance context, with the crucial framing
  distinction stated up front: "An architecture principle describes what should be true. An architecture
  fitness rule makes that principle testable. A verification execution produces evidence about whether it
  is true." Delivers a worked illustrative example (AFR-01-style provenance check, "Checked: 1,248 objects.
  Valid: 1,248. Invalid: 0" → PASS) and the `FitnessRule` object schema
  (id/name/principle/scope/predicate/severity/checker/checker_version/applicability/lifecycle), with the
  precise principle "the rule itself is governed knowledge" and an explicit rule-provenance chain
  (`FitnessRule→Principle→Authority`, e.g. `AFR-02→C1→Architecture Constitution→Approved Decision`).

  **Delivers Rule-applicability governance**, explicitly rejecting the anti-pattern `if inconvenient:
  rule.not_applicable = true` — applicability itself requires `Scope+Policy+Authority`, never ad hoc
  developer discretion. Delivers eight Fitness-rule categories (Structural, Semantic, Governance, Security,
  Evidence, Behavioral, Assurance, Agent) as a clean, complete organizing taxonomy for the entire rule
  catalog.

  **Delivers a substantial expansion of the AFR catalog, from 0714's AFR-01 through AFR-10 to a full AFR-11
  through AFR-26 (sixteen additional numbered rules)** — the most systematically numbered, concrete rule
  catalog in the reconstruction to date: AFR-11 (agent components may consume authoritative knowledge
  through approved interfaces but must not establish independent authoritative stores — directly
  operationalizes the Claude/Codex symmetry principle from 0714); AFR-12 (`AGENTS.md` must not silently
  become the enterprise architecture system of record); AFR-13 (Ubiquitous-Language rule: a term like
  "Approved" must have one governed meaning within a bounded context — `ApprovedDecision`≠
  `ApprovedDeployment` are not automatically the same concept); AFR-14 (only the owning context may perform
  invariant-sensitive state transitions on its aggregates — "a classic DDD fitness rule"); AFR-15 (every
  authoritative decision must reference valid authority, with authority explicitly temporal —
  `ValidAuthority(a,t)`, worked through a concrete failing test: a delegation valid `2026-01-01→2026-06-30`
  cannot authorize a decision dated `2026-07-15`); AFR-16 (every active exception must have authority, scope,
  and expiry, with the explicit "never use 'temporary' without expiry" anti-pattern — a record with
  `Expiry=null` fails, "this prevents temporary architecture from becoming permanent through neglect");
  AFR-17 (material authoritative knowledge must have traceable evidence, with metadata requirements
  Who/What/When/FromWhere/Hash/Version, plus `ObservedAt` specifically for runtime assertions); AFR-18
  (current authoritative retrieval must exclude superseded knowledge unless historical retrieval is
  explicitly requested, worked through a concrete stale-knowledge test: `K_1` current, `K_2` supersedes
  `K_1`, a current-query returning `K_1` fails); AFR-19 (verification results must identify the rule and
  checker version that produced them, motivated by a concrete reproducibility test `V_1=f(R,I)=V_2=f(R,I)`,
  a mismatch triggering `InvestigationRequired`); AFR-20 through AFR-24, the Agent-specific fitness rules
  (agent inference distinguishable from authoritative knowledge; agent actions have traceable identity;
  material actions require authorization; agents must not bypass governance gates; agent-local memory must
  not silently become enterprise authority — this fifth rule directly reprising and formally numbering
  0714's pointer-layer conclusion within the fitness-rule system itself); AFR-25 (every material agent
  action must reference the authorization under which it was executed, with a concrete negative test: an
  unauthorized production-change attempt must `BLOCK`, "the test itself becomes assurance evidence"); and
  AFR-26 (material governed changes require post-action verification, with the precise distinction
  `CommandSucceeded≠MigrationCorrect` — a successful `exitCode=0` proves the command ran, not that the
  migration was correct).

  **Delivers a genuinely valuable, more nuanced refinement of the `.claude/memory/` pointer-layer test case
  than 0714's binary FAIL** (§129.11): the fitness checker's actual question is "is this file an
  authoritative source or merely a local pointer/cache?" — a record independently asserting "Architecture
  Decision ADR-42 is authoritative" fails, but a record reading "See KnowledgeOS decision ADR-42" passes —
  refining the pointer-layer discipline from a blunt existence-test into a content/framing-sensitive test,
  a meaningful methodological advance for the eventual empirical (Step-131+) reconstruction phase.

  Delivers Agent-identity attribution as `Agent+Session+Task` (concrete illustrative example: "Agent: codex,
  Session: S-1842, Task: migrate Nexus configuration" — "far stronger than 'someone changed the
  configuration'"), Agent-recommendation fitness (`Recommendation→Evidence`, `Recommendation→Producer`,
  `Recommendation→ContextHash`), and a worked Context-integrity example: a Codex recommendation made under
  context `C_1` must remain permanently associated with `C_1` even after the architecture evolves to `C_2` —
  "otherwise we cannot explain what information caused the recommendation" — directly extending 0711's
  `H(ContextPackage)` cryptographic-hashing proposal into an operational fitness requirement.

  **Delivers the complete Architecture Fitness pipeline** (`Principle→Rule→Checker→Execution→Evidence→
  Verdict→{PASS,FAIL→Finding→Governance}`, "the executable architecture loop"), and, crucially, **a
  recursive self-governance requirement on fitness rules themselves** (§129.39-129.41, directly extending
  0709's "Constitutional self-protection" concern into the fitness-rule layer specifically): "What if someone
  changes AFR-19 to make a failing system pass? Then the rule change itself requires governance" — a rule
  has its own governed lifecycle (`Proposed→Reviewed→Approved→Effective→Superseded`) and `RuleVersion`,
  preserved on every `FitnessResult` "to preserve historical meaning."

  Delivers the `FitnessResult` object schema (id/rule_id/rule_version/subject/execution/expected/actual/
  verdict/evidence/executed_by/timestamp) and the precise principle `FitnessResult≠AuthoritativeKnowledge`
  — "a result says: at time T, checker C found condition X. Governance may subsequently interpret that
  result" — directly extending the corpus's Observation≠Knowledge/Evidence≠Authority family into
  fitness-result terms specifically. **Delivers the precise Fitness-result→Finding disposition rule**:
  `Verdict=FAIL→FindingCreated`, but `Verdict=UNKNOWN` must NOT automatically create a `Violation` — instead
  `Finding(type=InsufficientEvidence)` — a valuable, precise anti-false-positive safeguard extending 0693's/
  0699's/0708's Unknown-preservation discipline (crystallized formally as AFR-10 at 0714) into result-handling
  logic specifically.

  Delivers a Fitness state machine with `PASS|FAIL|UNKNOWN` as the minimum three-valued core, plus
  `NOT_APPLICABLE` and `EXCEPTION` as additional states, a worked Architecture-fitness dashboard mockup
  (ten AFR rules, mostly PASS with one WARN, explicitly caveated "actual statuses must come from execution,
  not documentation"), and Fitness trends over releases (a declining pass-rate example `100%→98%→96%`
  flagged as an architectural-drift signal).

  **Delivers a precisely reasoned "no single score" caution** (§129.50): architecture health must never be
  reduced to a single aggregate percentage — "a single failed authority invariant could be more important
  than twenty cosmetic successes" — instead `CriticalFailures` must be surfaced separately, paired with a
  Severity taxonomy (`BLOCKER/CRITICAL/HIGH/MEDIUM/LOW`, itself governed) and an Enforcement-policy mapping
  (`Verdict+Severity→PipelineDisposition`, e.g. `FAIL+BLOCKER→BLOCK`, `FAIL+LOW→WARN`), worked through a
  concrete constitutional-check-to-deployment-block scenario (a `C1` Constitution-principle FAIL propagating
  to a critical finding, a governance workflow, and a potential deployment block).

  **Delivers a precise, genuinely valuable Fitness-Rule-vs-Test-vs-Policy-vs-Decision taxonomy** (§129.54-
  129.56): `UnitTest⊂EngineeringAssurance` (does the implementation behavior work?) is distinguished from
  `FitnessRule⊂ArchitectureAssurance` (does the system continue to conform to this architectural
  constraint?) as complementary, not equivalent, disciplines; `Policy→FitnessRule` (policy states what is
  required, the rule states how it is objectively tested); and the complete governance-to-assurance path
  `Decision→Knowledge→FitnessRule→Verification`.

  **Delivers the file's central, precisely stated thesis** (§129.57): "`Narrative Architecture→Executable
  Architecture`... not by eliminating documents, but by attaching deterministic verification mechanisms to
  the parts that can be objectively tested" — an appropriately non-overreaching articulation avoiding the
  stronger, false claim that documentation becomes unnecessary. Worked through three concrete
  narrative-to-executable translation examples: the DDD boundary (`Governance owns decisions`→
  `OnlyGovernanceMayMutate(Decision)` checker inspecting the dependency graph, API ownership, and write
  access), the Agent boundary (`Agents cannot independently create authoritative decisions`→checker
  inspecting API permissions/service roles/authorization policies/integration paths), and Evidence
  (`∀x∈MaterialActions: ∃authorization(x)∧∃evidence(x)`, "potentially queryable continuously").

  Delivers Step 129's verdict, crystallizing "architecture fitness is the executable boundary between
  architecture governance and engineering reality," with the complete pipeline `Principle→Rule→Checker→
  Evidence→Verdict→Finding→Governance`.

  **Closes by opening "Step 130 — The KnowledgeOS Assurance Graph,"** promising to combine every object
  derived across the entire preceding synthesis arc (knowledge, claims, evidence, authority, decisions,
  policies, observations, findings, recommendations, actions, verification, fitness rules, agents, runtime,
  governance) into a single machine-traversable graph, explicitly reframing the central architectural
  question from "what objects exist?" to "can we traverse the complete lifecycle of an engineering decision
  from organizational intent all the way to runtime evidence and back?" — with the target graph
  `Intent→Decision→Knowledge→Rule→Implementation→Runtime→Evidence→Verification→Finding→Governance`,
  explicitly named as potentially "the central architectural construct around which the rest of the
  platform can be organized." No actual code execution, repository inspection, or verified filesystem/rule-
  execution claim reported anywhere in this file — every worked example (the 1,248-object provenance check,
  the delegation-expiry test, the `.claude/memory/` checker scenario, the dashboard, the trends) remains a
  hypothetical illustrative application of the stated fitness-rule mechanism, not an empirical finding.
