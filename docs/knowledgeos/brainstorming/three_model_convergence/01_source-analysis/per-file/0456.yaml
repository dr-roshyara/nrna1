about: >
  Directly continues 0455's Dimension Discovery thread by responding to a (not-independently-recorded, since
  this corpus captures only one side plus synthesis) proposal for two complementary natural-language parsing
  lenses -- a **C-type parser** and a **Sanskrit-grammar-type parser** -- and refines this into an explicit
  architecture rather than "KnowledgeOS uses two parsers." Characterizes the **C-type parser lens** as
  teaching structural decomposition (Sentence->Syntax Tree->Structured Representation) without itself
  providing semantic ontology -- "C parsing provides the architectural pattern for deterministic structural
  decomposition," not a literal natural-language parsing mechanism. Characterizes the **Sanskrit grammar
  lens** as teaching semantic/relational decomposition (Surface sentence->grammatical relations->semantic
  roles), useful specifically for Dimension Discovery. Produces a six-lens comparison table (C-parser=
  structural decomposition; Sanskrit grammar=semantic/relational decomposition; DDD=domain meaning/bounded-
  context semantics; Zero=what the representation does not establish; Lord=what dimensions may exist beyond
  the current representation; Sārathi=how to navigate the investigation), explicitly framing them as
  "different analytical lenses over language," never competing parsers.

  Produces a full architecture diagram: Human Knower -> natural-language intent -> Language Analysis
  {Structural Parser (C-type), Semantic Grammar (Sanskrit)} -> Semantic Representation -> Candidate
  Dimensions -> {Domain, Zero, Lord} Lens -> Dimension Assessment -> Investigation -> Knowledge. Reasserts
  the critical epistemic-discipline point already established for dimension discovery: **Parsing != Observation,
  Parsing != Knowledge** -- a parser can extract semantic candidates (e.g. Actor=Arjuna, Action=fight,
  Relation=with, Target=persons, Modality=obligation) but this does not establish "Arjuna must fight X" or
  "X is Arjuna's enemy," which require observation/evidence/context. Establishes that **DimensionDiscovery is
  recursive**: a new question produced by observation (Q_1) is itself run back through the language-analysis
  capability (Q_1->SemanticStructure_1->D_2), so the system continually reconstructs the semantic space as
  investigation proceeds rather than parsing once and stopping -- explicitly connected to a worked Level
  0-3 progressive-investigation example that operationalizes 0452's Progressive Investigation Principle in
  language-analysis terms.

  Proposes a new, broader KnowledgeOS capability, **Semantic Reconstruction**, of which Dimension Discovery
  is only one output, with an explicit extensible sub-branch structure (Structural Analysis/C-type,
  Grammatical Analysis/Sanskrit, Entity Analysis, Relation Analysis, Modality Analysis, Context Analysis,
  Dimension Discovery), noting later additions (DDD semantic analysis, domain ontology, temporal analysis,
  causal analysis, legal/scientific language analysis) could be added "without changing the fundamental
  architecture." Investigates whether Sanskrit grammatical roles can distinguish canonical question-dimensions
  of an event/statement (Who/What/To whom/With what/From where/For whom/Because of what/Under what
  condition), worked via "Arjuna fights Bhīṣma" (Agent=Arjuna, Action=Fight, Target=Bhīṣma) and "Bhīṣma is
  Arjuna's grandfather" (Entity_1=Bhīṣma, Relation=GrandfatherOf, Entity_2=Arjuna). Explicitly preserves
  methodological discipline: "The Sanskrit grammar lens is an analytical lens from which KnowledgeOS may
  learn useful principles of semantic decomposition. It is not evidence that the KnowledgeOS ontology must
  conform to Sanskrit grammar," directly paralleling "The Gita is not proof of our mathematical model... a
  source through which we observe potentially useful structures." Formalizes the resulting architectural
  hypothesis: NL->[StructuralAnalysis]->SyntacticStructure; NL->[Grammar/SemanticAnalysis]->SemanticStructure;
  (SyntacticStructure,SemanticStructure,Context,Domain)->CandidateDimensions;
  CandidateDimensions->[Observation+Zero+Lord+Sārathi]->InvestigatedKnowledge. Pauses Question 3 to first
  concretely decompose one test sentence ("Show me those with whom I have to fight") via both lenses.

  Delivers the promised concrete decomposition in a "Semantic Reconstruction: A Formal Analysis" section
  (appearing TWICE, verbatim, within this single file -- an internal duplication anomaly, not a separate
  sequence-level duplicate). Provides a full C-parser parse tree and structural-elements table for the test
  sentence (Action/Recipient/Target/Relation/Actor/Action/Modality/Implied-Object), with explicit strengths
  (clear grammatical roles, deterministic, handles complex structure) and limitations (no semantic-type
  distinction, no domain-specific inference, no implicit knowledge). Provides a full Sanskrit kāraka-based
  semantic-role extraction table using genuine Sanskrit grammatical categories -- **Kartṛ** (Agent),
  **Karma** (Object), **Kriyā** (Action), **Sambandha** (Relation), **Kartavya** (Obligation), **Karaṇa**
  (Instrument), **Apādāna** (Source), **Adhikaraṇa** (Location) -- mapped to candidate KnowledgeOS
  dimensions (Actor/Decision_Maker, Entity/Target, Action_Type, Relationship_Type, Duty/Obligation,
  Means/Method, Origin, Context/Situation), with strengths (captures semantic roles, distinguishes relation
  types, handles implicit knowledge) and limitations (requires domain ontology, may over-interpret
  grammatical roles, requires implementing semantic grammar). Synthesizes both analyses into eight candidate
  dimensions (Actor, Target_Entity, Action_Type, Relationship_Type, Obligation, Context, Purpose,
  Consequence) and the formula D_candidate=Extract(Q,Structural,Semantic,Domain). Applies the model to
  Arjuna's case end-to-end, distinguishing eight initial candidate dimensions from six observation-revealed
  dimensions (including Relationship_To_Arjuna and Moral_Obligation), and lists eight required implementation
  components (Structural Parser, Semantic Parser, Domain Ontology, Context Model, Pattern Recognition, Zero
  Lens, Lord Lens, Sārathi) plus the consolidated invariant Parsing != Observation != Knowledge. Closes
  (in both copies) by proposing to proceed to Question 3 (Statement) -- notably WITHOUT addressing Question
  2B (DimensionAssessment), launched at the close of 0455, at all.
