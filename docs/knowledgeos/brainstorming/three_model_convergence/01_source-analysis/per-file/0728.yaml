defines:
  - concept: "Why shared credentials are dangerous"
    definition: "If multiple agents (e.g. Claude and Codex) execute actions through the same shared credential against an external system, the system can observe that a change occurred but cannot attribute it to a specific agent, action, or session -- SharedCredential produces WeakAccountability; each agent action should instead flow through a scoped, temporary, individually-attributable credential derived from an authorization decision"
  - concept: "Trust zones"
    definition: "A four-tier classification of runtime components by trust level: Lower Trust (agent workstation, local files, agent memory, generated context), Medium Trust (agent gateway, context service, tool adapters), Higher Trust (governance, authoritative knowledge, authorization, evidence), and External Authority (Git, Kubernetes, Nexus, IAM, production systems) -- giving the pointer-layer principle a concrete security-architecture grounding by placing agent-local artifacts explicitly in the lowest trust tier"
  - concept: "Disaster-recovery data criticality"
    definition: "KnowledgeOS data should be classified as Critical (governance state, authorization, evidence, verification history -- loss is a critical incident), Important (knowledge, graph projections, registry), or Rebuildable (derived context packages, caches, search indexes -- can simply be regenerated from authoritative state), determining backup priority and recovery sequencing"
  - concept: "Platform self-assurance"
    definition: "Beyond assuring the engineering systems it governs, KnowledgeOS must eventually be able to verify its own operational health through deterministic checks (e.g. graph-projection lag, outbox backlog, evidence integrity, authorization-service health) -- an important maturity step distinct from, but complementary to, the constitutional self-verification-vs-self-governance boundary established earlier in the reconstruction"
