defines:
  - concept: "Relationship semantics≠Foreign keys"
    definition: "The presence of a database foreign key or ID reference between two records (e.g. a decision_id column in an audit table) establishes only structural linkage, not the semantic meaning of that relationship (e.g. whether the audit record actually functions as supporting evidence for the decision); semantic relationship claims require independent verification beyond schema structure"
  - concept: "Core_minimum (relationship-centric)"
    definition: "A system's semantic core strength is determined not by how many domain entities/concepts it represents, but by whether the minimum set of relationships necessary to preserve organizational meaning (e.g. Decision→Authority, Evidence→Claim) are actually present; a system with many well-represented entities but one missing critical relationship has an incomplete semantic core"
  - concept: "Knowledge Retrieval Platform vs. Knowledge Operating System"
    definition: "A Knowledge Retrieval Platform implements Documents→Embeddings→Retrieval; a Knowledge Operating System implements the fuller loop Knowledge→Evidence→Reasoning→Decision→Action→Observation→UpdatedKnowledge, distinguished by possessing organizational state and control semantics (authority, decision-governance, action-authorization) that a retrieval system lacks"
  - concept: "A negative finding is a valuable finding, not a failure"
    definition: "When empirical reconstruction concludes that a hypothesized richer semantic model is not actually implemented (e.g. only Document+Embedding representations exist, with no Evidence/Decision/Authority model), the correct response is to record this precisely as the current, honest architectural state — a legitimate and useful research outcome — rather than treating the absence of confirmation as a failed investigation"
