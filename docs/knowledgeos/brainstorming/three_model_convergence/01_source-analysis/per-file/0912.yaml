defines:
  - concept: "Σ_min as the power set of two independent epistemic predicates"
    definition: "The minimal epistemic-status structure is derived as Σ_min=𝒫({Support,Refute})≅{0,1}^2, where S(p)∈{0,1} and R(p)∈{0,1} independently encode whether proposition p currently has qualified evidential support and qualified evidential refutation, respectively. The four resulting combinations map to: (0,0)=Unknown (no qualified support or refutation exists); (1,0)=Supported (qualified support exists, no refutation); (0,1)=Refuted (qualified refutation exists, no support); (1,1)=Conflict (both qualified support and qualified refutation exist simultaneously). This is proven minimal (not merely proposed) via an exhaustive deletion test: removing any one of the four combinations leaves that specific (S,R) pattern unrepresentable, and each pattern is independently required by a mandatory operation (Assess, Support, Refute, or DetectContradiction respectively) -- giving |Σ_min|=4 as both necessary and sufficient under the stated mandatory operation set"
  - concept: "The derived join-semilattice merge operation for epistemic status"
    definition: "A candidate algebraic combination rule for merging two independently-derived epistemic states σ_1=(s_1,r_1) and σ_2=(s_2,r_2): σ_1⊔σ_2=(s_1∨s_2, r_1∨r_2), i.e. componentwise logical OR. This produces intuitive, checkable results: merging Unknown with any determinate state yields that determinate state (identity element behavior); merging Supported with Refuted yields Conflict (rather than arbitrarily picking one, preserving the disagreement as information); merging any state with Conflict yields Conflict (Conflict is the top element, absorbing); and merging a state with itself is idempotent. This gives Σ_0 the structure of a bounded join-semilattice with Unknown as bottom and Conflict as top, though the file explicitly flags this as 'a derived candidate algebra, not yet proof that all KnowledgeOS merge semantics must use it'"
