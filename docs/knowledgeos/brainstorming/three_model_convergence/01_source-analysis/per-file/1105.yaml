  is the sharpest registry finding of the whole Gītā track. Plus a FOURTH glyph collision (`ℐ`), and six
  controlled comparisons."

  **EXTENDS THE ALREADY-TRACKED CONTROLLED-COMPARISON METHODOLOGY TO SIX CHAPTERS**: adds Ch 3 (four "Solved/
  Complete" `external_research` claims vs "a CANDIDATE safety invariant") and Ch 4 (four more "Solved/
