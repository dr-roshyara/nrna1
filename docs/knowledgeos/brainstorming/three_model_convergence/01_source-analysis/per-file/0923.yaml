title: "CLAUDE EXECUTION PROMPT -- STEP 282: Theory-Criticality and Residual-Gap Closure Gate -- A Fully Operationalized, Highly Elaborated Adversarial-Verifier System Prompt Delivering Eight Theory-Criticality Criteria (TC-1..TC-8), an Eight-Code Gap-Classification System, a Ten-Item Residual-Gap Register, Twenty-One Required Falsification Tests (F1..F21, Extending F1..F13 From Earlier Files), a Twelve-Artifact Deliverable List, and a Seven-Symbol Evidence-Traceability Code -- Not Itself the Execution, But by Far the Most Detailed Operationalization of the Step-282 Mandate in This Sub-Arc"
