defines:
  - concept: "Theory-critical (formal definition via TC-1..TC-8)"
    definition: "A residual gap is theory-critical if and only if its unresolved state prevents at least one of eight named closure properties: the construct cannot be unambiguously defined (TC-1), lacks a well-defined type (TC-2), cannot be distinguished/compared per the theory (TC-3), a required transformation cannot be formally defined (TC-4), a required invariant cannot be stated or preserved (TC-5), two states the theory must distinguish cannot be represented (TC-6), the theory cannot state what evidence would refute a claimed property (TC-7), or the unresolved item creates an actual formal contradiction (TC-8). Explicitly NOT theory-critical merely because a construct is important to production or implementation"
  - concept: "The probability-necessity counterfactual test (§7)"
    definition: "To determine whether probability is a genuine foundational dependency of KnowledgeOS rather than an incidental vocabulary borrowing, ask: if probability were entirely removed from the foundational theory, would any mandatory KnowledgeOS construct become undefined? If no, probability belongs to a specialized measurement/statistical model layered atop the core theory, not to the core theory itself -- and the mere presence of words like 'uncertainty,' 'confidence,' 'likelihood,' 'probability,' or 'reliability' in the corpus is explicitly insufficient grounds to introduce probability as foundational"
refines:
  - concept: "0921's/0922's three-outcome A/B/C stopping decision"
    refinement: "FORMALIZED with explicit boolean conditions on the four-symbol closure vector (FC, CC, EC, GC): B requires FC=TRUE and no theory-critical gap while at least one of CC/EC/GC remains incomplete; C requires all four TRUE with actual evidence for each"
  - concept: "The recurring closure-vocabulary proliferation (0904, 0906, 0908-0910, 0915, 0919, 0920, 0921)"
    refinement: "FURTHER EXTENDED by two more distinct schemes introduced in this single file (the eight-code F/C/E/M/G/N/S/U classification, and the seven-symbol [D]/[F]/[E]/[R]/[N]/[I]/[U] traceability code) -- now the sub-arc's most vocabulary-dense single artifact, with at least nine distinct, only partially cross-referenced classification schemes accumulated across this reconstruction's tracking"
  - concept: "0919's/0920's/0921's L4/L5(/L6) evidence-hierarchy discipline"
    refinement: "RESTATED with a slightly different five-level L1-L5 scale in this file's own §9 (conceptual/formal/controlled-implementation/independent-executable-reference/real-KnowledgeOS-observation), distinct in granularity from 0915's/0919's seven-level hierarchies -- yet another minor inconsistency in the evidence-level numbering across sibling files"
