about: >
  Opens as a direct instruction ("For Claude, I would make Step 282 an execution mandate, not a request to
  merely write a report... Use the following prompt verbatim") delivering a complete, self-contained
  system-prompt artifact intended to be handed to an executing AI agent to actually PERFORM Step 282,
  rather than merely commissioning it as files 0921/0922 did.

  **§0 Governing Rule** restates the central question boxed **`Is there anything left that the theory
  itself must solve?`** via the sequence `Identify→Classify→Test→Falsify→Close or Escalate`.

  **§1** mandates reading the full corpus, the original Step 282 spec, the Step 281 execution report, its
  supervisory review, and inspecting the actual implementation repository before any conclusion --
  "do not trust previous reports merely because they say PASS, CLOSED, or CONFIRMED."

  **§2** lists twelve provisional Step-281 inputs (`K,Σ,Q_t,O_core`, Identity, Equality, Evidence, History,
  Replay, Provenance, Lineage, Transformation `T`) as "established candidates, not unquestionable axioms,"
  reopenable only on concrete contradiction.

  **§3 delivers THE FILE'S CENTRAL NEW FORMAL APPARATUS: EIGHT THEORY-CRITICALITY CRITERIA (`TC-1`-`TC-8`)**
  -- Semantic definition / Type closure / Identity-equality / Transformation closure / Invariant
  preservation / Mandatory distinguishability / Falsifiability / Internal consistency -- a residual gap is
  theory-critical ONLY if its unresolved state prevents at least one of these eight, explicitly refusing
  "important to production" as a criterion.

  **§4 delivers a NEW EIGHT-CODE PRIMARY GAP-CLASSIFICATION SYSTEM**: `F` Formal / `C` Computational / `E`
  Empirical / `M` Measurement / `G` Governance / `N` Normative / `S` Scope / `U` Undetermined-blocked --
  refining and extending the corpus's many earlier closure-vocabulary schemes (this reconstruction's
  eighth-or-so distinct scheme tracked across files 0904/0906/0908-0910/0915/0919/0920/0921) with a new
  M/S/U triad not present in most predecessors.

  **§5 delivers a TEN-ITEM RESIDUAL-GAP REGISTER carried forward from Step 281**: `T-3` probability, `T-4`
  non-identifiability, `I-1` 15/24 unobserved constructs, `I-2` circular dependency, `I-3` no `Authorize()`
  runtime, `E-1` Level-4-vs-Level-5 evidence, `E-2` no multi-node deployment, `E-3` no measurement executor,
  `G-P1` policy runtime, `Q_t` replayability/serialization -- with an explicit instruction to search for
  NEW gaps exposed by Step 281 rather than assume completeness.

  **§6** delivers a rigorous per-gap analysis template (all eight `TC` criteria scored PASS/FAIL/N/A, plus
  theory-critical YES/NO, primary classification, evidence level, falsification performed, result, required
  action) -- directly reusable and more granular than any prior per-item template in this sub-arc.

  **§§7-16** deliver detailed individual test protocols for each of the ten register items (T-3
  probability-necessity test via the removal counterfactual "if probability is removed... does any
  mandatory construct become undefined?"; T-4 non-identifiability via an explicit `K_1≠K_2` but
  `K_1≈_{O_core}K_2` counterexample construction; I-1/E-1 real-environment observability with an explicit
  five-level evidence scale `L1`-`L5` and "never upgrade L4 evidence to L5"; I-2 dependency-cycle test
  distinguishing definitional/operational/runtime/governance/reference dependency; I-3 `Authorize_formal`
  vs `Authorize_runtime`; E-2 multi-node execution; E-3 `MeasurementModel` vs `MeasurementExecutor`; G-P1
  the `GovernancePolicy∉K` vs `KnowledgeAboutPolicy∈K` distinction; Q_t replay/serialization identity
  tests; and a mandatory Policy/Knowledge separation test).

  **§17 restates the four-symbol closure-dimension scheme** (`FC≠CC≠EC≠GC`) with the explicit invalid-
  inference guards `FC∧CC⇏EC` and `FC∧CC⇏GC`.

  **§18 delivers SEVEN NAMED, NUMBERED FALSIFICATION TESTS `F14`-`F21`** (Theory-criticality / Non-
  identifiability / Policy-knowledge separation / Inquiry replay / Inquiry serialization identity /
  Dependency-cycle / Closure-category / Probability-necessity) -- the numbering `F14`-`F21` implies at
  least thirteen earlier-numbered falsification tests (`F1`-`F13`) exist elsewhere in the corpus, not
  directly encountered as a consolidated list by this reconstruction to date, constituting a further
  instance of the referenced-but-unseen-material pattern.

  **§19** delivers a DDD Boundary Test across four named bounded contexts (Knowledge/Governance/History-
  Provenance/Measurement) with the explicit four-way distinction boxed **`Mathematical Object ≠ DDD Entity
  ≠ Aggregate ≠ Database Representation`**.

  **§20** forbids the phrase "no contradictions remain" without active contradiction testing across ten
  named construct-pairs.

  **§21** delivers the Human Decision Boundary criterion (Normative classification permitted only when
  corpus, mathematics, execution, AND empirical evidence all cannot determine it), with an explicit
  per-decision record template and the instruction "do not ask 'which one do you prefer?'"

  **§22 delivers the three-verdict decision procedure** (A/B/C, matching but formalizing 0921/0922's
  outcomes with explicit boolean conditions on `FC,CC,EC,GC`).

  **§23 delivers a TWELVE-ARTIFACT REQUIRED DELIVERABLE LIST** (`01-THEORY-CRITICALITY-REGISTER.md` through
  `12-STEP-282-SUPERVISORY-VERDICT.md`) -- the first genuinely file-level deliverable specification
  encountered in this sub-arc, suggesting the corpus's own production process may (or was intended to)
  generate a cluster of twelve distinct named files for Step 282, none of which have yet appeared
  individually in this reconstruction's sequential pass.

  **§24 delivers A NEW SEVEN-SYMBOL EVIDENCE-TRACEABILITY CODE** (`[D]` Derived / `[F]` Formal / `[E]`
  Executed / `[R]` Real-environment / `[N]` Normative / `[I]` Inferred / `[U]` Unresolved) -- yet another
  distinct evidence-classification vocabulary, differing from the file's own §9 five-level L1-L5 scale and
  from 0904's six-value scheme and 0915's/0919's seven-level hierarchies -- a further instance of this
  sub-arc's closure-vocabulary proliferation, now spanning roughly eight to nine distinct, only partially
  reconciled schemes.

  **§25 delivers the Anti-Bias Rule**: "You are the adversarial verifier, not a completion engine,"
  explicitly forbidding forcing either a positive-closure or an open-theory verdict.

  **§26** explicitly forbids preselecting Step 283 before the verdict is reached.

  **§27** delivers an eleven-category Final Supervisory Report template (A-K).

  **§28 Final Command** closes with an explicit, forceful execution directive: "Execute Step 282 now. Do
  not merely describe how Step 282 should be executed... Actually inspect the corpus, inspect the
  implementation, execute the tests that are feasible..." followed by six explicit "do not promote X into
  Y" anti-conflation warnings and the boxed final objective **`Determine whether anything remains that the
  theory itself must solve.`**, closing "STEP 282 — EXECUTE."
