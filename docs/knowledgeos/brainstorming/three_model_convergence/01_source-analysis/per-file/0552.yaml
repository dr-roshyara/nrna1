tier2_reason: "LANDMARK complete formalization of entity identity, resolution, and semantic equivalence, delivering the corpus's most architecturally consequential simplification in this entire research arc: identity resolution and semantic equivalence both reduce to instances of the already-established Evidence/Assessment machinery, requiring no separate epistemology. Introduces a vividly-named, genuinely important AI-safety concept ('semantic hallucination becoming structural identity'), a precise EquivalentProposition≠SameAssertion distinction retroactively explaining why the corpus's many prior duplicate-evidence cautions were necessary, fully auditable Merge/Split operations treated explicitly as belief revision applied to identity, and a bidirectional demonstration that identity-resolution errors propagate into genuine epistemic errors in both the over-merging and over-separating directions. Extends the corpus's Knowledge≠Reality discipline specifically to entities (KnowledgeOS Entity≠Reality) and delivers fourteen canonical governing invariants, closing with a well-motivated next research phase reframing epistemic questions from truth to decision-readiness."
