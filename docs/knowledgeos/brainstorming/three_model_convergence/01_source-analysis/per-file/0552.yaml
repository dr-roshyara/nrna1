  - concept: "Semantic Comparison result (SC)"
    definition: "(P_1, P_2, Relation, Context, Basis, Status) where Relation∈{Equivalent,Compatible,Contradictory,Related,Independent,Unknown} — the relation and its epistemic certainty (Status) kept as separate fields, never conflated"
  - concept: "KnowledgeOS Entity (x̂) vs. Reality (x)"
    definition: "x̂ is the system's governed epistemic representation of a presumed real-world entity x; the two are never identified, preserving the corpus's Knowledge≠Reality discipline at the entity-identity layer"
