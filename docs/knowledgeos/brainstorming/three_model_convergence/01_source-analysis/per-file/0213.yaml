about: >
  Stephen Stigler's "The Seven Pillars of Statistical Wisdom" (Aggregation/Information/Likelihood/
  Intercomparison/Regression/Design/Residual), applied as a falsification-question generator against
  a minimal Knowledge Kernel rather than as a source of new positive architecture. Structurally
  different from prior extraction files (Parts 1-8, no ASCII-diagram domain models): produces ten
  strongest observations, ten falsification questions, five most-surprising findings, five directly
  Kernel-relevant findings, five findings explicitly excluded as not-yet-architectural, an "anti-reasoner"
  table, and ten questions DDD analysis alone would not expose. Central finding: the seven pillars are
  tools for MANAGING uncertainty, not eliminating it -- a Kernel that treats knowledge as certainty (or
  even high confidence) may be missing statistical inference's core insight.
introduces:
  - concept: "Aggregation paradox: information gain sometimes requires discarding information (the mean is a transformation revealing signal, not a loss); a Kernel preserving all detail may be preserving noise"
  - concept: "Diminishing information accumulation (root-n rule): the second 20 observations are worth less than the first 20; a Kernel must not treat all data as equally informative"
  - concept: "Likelihood as calibration, not truth: the P-value is a measure of surprise, not truth; a Kernel must not treat probabilities as truth values or certainty levels"
  - concept: "Intercomparison / radical self-reliance: inference can be made from internal data variation alone (Student's t-test), without external standards -- but this power can be abused"
  - concept: "Regression directionality: the same relationship gives a different answer asked backwards; a Kernel must not assume symmetric relationships (direction of conditioning matters)"
  - concept: "Design as planning-before-observation: randomization creates a basis for inference independent of modeling assumptions; a Kernel treating data as merely 'given' is blind to the structure giving it evidential meaning"
  - concept: "Residual-as-signal: what remains after subtracting known effects is often the source of discovery, not noise to discard; a Kernel must distinguish explanatory residuals from random residuals"
  - concept: "Rule-of-Three trap: proportional/ratio extrapolation is systematically biased in the presence of variation and measurement error"
  - concept: "Multiple-comparison / garden-of-forking-paths warning: simultaneous-correctness probability across many statements is not automatically relevant to any single statement's uncertainty"
  - concept: "Anti-Reasoner table mapping each of the seven pillars to a specific architectural failure mode it protects against (overfitting/false-certainty/mis-calibration/external-bias/naive-extrapolation/design-blindness/residual-neglect)"
  - concept: "Ten DDD-blind-spot questions: standard DDD treats aggregates as identity-holders (vs. aggregation-as-identity-discarding), data as equally valuable, probabilities as truth, data as generation-independent, residuals as error, relationships as symmetric, extrapolation as valid, all data as equally informative, randomization as optional, more-data as always-better"
