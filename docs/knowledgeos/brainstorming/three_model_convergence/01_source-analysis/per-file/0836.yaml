defines:
  - concept: "Semantic Laundering"
    definition: "A newly-named major AI architecture anti-pattern occurring when a probabilistic or otherwise epistemically-weak upstream claim (e.g. an AI prediction) passes through one or more downstream transformations (e.g. Assessment→'Approved') that lose or obscure its original provenance and uncertainty, causing the resulting artifact to be treated as stronger or more authoritative than its actual epistemic basis warrants -- the transformation has effectively 'laundered' a probabilistic result into an apparently authoritative statement without any explicit, justified inference step performing that strengthening, directly connected to the formal semantic-strength principle that any transformation increasing a claim's apparent epistemic strength (S(T(x))>S(x)) requires explicit justification"
  - concept: "The consolidated 'X cannot manufacture Y' family"
    definition: "A unifying set of six structurally identical non-implications, each guarding against a different category artificially acquiring the properties of a stronger category without passing through the explicit mechanism that legitimately grants it: Inference⇏Authority (an epistemic artifact cannot implicitly grant normative authority); Policy⇏Evidence (a policy stating evidence is required does not make that evidence exist); Decision(P)⇏Truth(P) (an organizational decision does not become empirical truth); Execution(X)⇏Authorized(X) (an executed action is not thereby proven authorized); and ObservedCorrelation⇏Causation (a statistical association does not establish a causal claim) -- together with 'Execution cannot manufacture authority,' these form a single coherent family the file explicitly begins consolidating rather than treating as unrelated individual observations"
  - concept: "'An architectural principle is not yet an architectural property merely because we have written it down'"
    definition: "The file's sharpest epistemic-discipline statement, directly extending 0827's Level 1/Level 2/Level 3 device: writing down a conceptual invariant or boxed principle in the corpus's own documentation does not by itself make that invariant an actual property of the implemented system -- a principle becomes a genuine architectural property only when an actual enforcement mechanism can be identified (where in the system is it checked?) and an actual test can verify that enforcement, explicitly framing the transition from Step 209's 'theoretical architecture' to Step 210's demanded 'verifiable architecture'"
