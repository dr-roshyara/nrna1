defines:
  - concept: "'The book must not become the architecture-authority mechanism'"
    definition: "A book or other explanatory/documentation artifact produced about a ratified architecture must strictly follow, never generate, architectural decisions -- discoveries made while writing (gaps, inconsistencies, richer source material than the ratified summary) must be recorded as findings requiring their own separate governance act, never silently absorbed into the architecture merely because the book's prose needed to say something coherent"
  - concept: "GN-42"
    definition: "A specific governance ruling stating that the Edition-2 book production effort is authorized to explain the ratified KnowledgeOS architecture with arbitrary depth and rigor, but is explicitly NOT authorized to expand, revise, or silently extend that architecture -- any architectural implication surfaced during writing must be routed through the normal architecture-change/finding process, never adopted directly by the book"
  - concept: "The architecture-to-book traceability spine (architecture-synthesis-map.md)"
    definition: "A dedicated artifact, kept outside the book itself, that traces every significant L2 (model-level) object through its full provenance chain -- originating source(s), the ratified statement about it, its L3 architectural realization, its L4 implementation status, the specific governance act that authorized each stage, and the book chapter that explains it to readers -- allowing the book's own prose to stay readable and non-technical while the full audit trail remains available and separately maintained"
refines:
  - concept: "0769's eight named production findings (PF-1 through PF-8)"
    refinement: "Given fuller plain-language restatement and explicitly reclassified as 'architecture discoveries,' not 'merely editorial discoveries' -- directly justifying 0769's own instruction that these findings must remain findings, never accidental architecture changes"
  - concept: "0764's GN-31 ratification and 0769's revealed Part IV.4 (devoted to the twelve retained OQs)"
    refinement: "Extended with GN-42, a new, distinct governance ruling specifically scoping what the Edition-2 book production effort is and is not authorized to do relative to the already-ratified v0.2 architecture"
  - concept: "This reconstruction's own discipline of preserving genuinely unresolved corpus contradictions/open questions rather than artificially resolving them for narrative tidiness"
    refinement: "Independently and explicitly endorsed from within the parallel synthesis effort's own governance reasoning: 'I would not wait for every open question to be solved before writing the book... that is not a weakness of the book. That is part of the subject matter' -- a genuine, mature convergence on the same epistemic-honesty principle"
