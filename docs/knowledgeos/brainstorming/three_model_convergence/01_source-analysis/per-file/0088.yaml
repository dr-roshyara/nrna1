about: >
  A rigorously-cited external-literature review (named authors, arXiv IDs) of Truth Maintenance
  Systems, AGM belief revision theory, justification logic, epistemic logic, and provenance-enhanced
  knowledge graphs, assembled into a candidate "Epistemic Operating System" architecture -- then
  explicitly and carefully distinguished from KnowledgeOS (organizational governance) as a
  complementary but distinct system, possibly a future component, never the same thing.

introduces:
  - "AGM belief revision postulates K*1..K*8 (Alchourron/Gardenfors/Makinson 1985), stated formally --
    the corpus's FIRST genuine, citable formal axiom system (not metaphor, not analogy) with real
    operators: Expansion (K+phi), Contraction (K-phi), Revision (K*phi)"
  - "Justification logic: Ki-phi (agent i knows phi, justified true belief) vs Bi-phi (agent i believes
    phi, may be false/unjustified) -- a genuine formal knowledge/belief distinction from the
    literature, structurally adjacent to this corpus's own UNKNOWN/FALSE and Evidence/Authority
    distinctions but not confirmed identical"
  - "Explicit EOS-vs-KnowledgeOS boundary table (section 8): EOS = reasoning/belief-revision/truth-
    maintenance (core unit: belief, operation: AGM revision, model: logical consistency); KnowledgeOS
    = knowledge governance/provenance/authority (core unit: Knowledge Product, operation: lifecycle
    transition, model: organizational authority). Explicitly 'complementary but distinct' -- EOS COULD
    be a future component of KnowledgeOS (e.g. for AI reasoning), never treated as identical to it"
  - "Five EOS invariants (7.3): epistemic consistency, justificatory transparency, minimal mutilation,
    global acyclicity, truth preservation -- explicitly scoped to EOS, NOT proposed as a rival
    KnowledgeOS kernel"
  - "EPI-001..005 candidate invariants (Justification Transparency, Epistemic Consistency, Minimal
    Mutilation, Provenance Homogeneity, Immutable Evidence Reference) -- a FIFTH unreconciled
    candidate-invariant ID scheme (after C-n, INV-KOS-n, H-ZERO-n/H-KOS-n, INV-CANDIDATE-n)"
  - "Forbidden-transitions table for EOS (6 rows): belief-without-justification, contradictory-beliefs-
    without-resolution, revision-without-minimal-change, circular-justification, belief-update-
    without-provenance, derived-belief-treated-as-core-belief -- structurally the same pattern family
    as the KnowledgeOS forbidden-collapse tables (0081/0084/0085/0086) but for a DIFFERENT, explicitly
    separate system"
  - "Explicit research-gap #6: 'no established epistemic OS pattern... limited work on bi-temporal
    epistemic states' -- independently converges with 0080/0081's temporal-knowledge weakness finding"

defines:
