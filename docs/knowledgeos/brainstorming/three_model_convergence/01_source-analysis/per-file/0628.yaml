defines:
  - concept: "Anchor(A) (epistemic anchor)"
    definition: "Evidence or validation whose epistemic generation is sufficiently independent of the system's current belief/policy, required to be operationalized per domain, with diversity of source/method/model/measurement/reasoning path required to avoid common-mode epistemic failure (EpistemicRedundancy≠NumberOfOpinions)"
  - concept: "Stable AND Wrong"
    definition: "A learning system can converge to a stable model that is nonetheless incorrect, which is more dangerous than obvious instability because a stable model appears trustworthy — Stability(M) and Validity(M) are formally separate properties that can diverge"
  - concept: "EpistemicFirewall"
    definition: "A formal architectural boundary preventing unvalidated (Candidate-level) learning output from directly influencing critical decisions, requiring a knowledge item to pass through the full maturity/promotion gate before it can inform high-stakes action"
  - concept: "Epistemic hysteresis"
    definition: "A failure mode in which a belief-update mechanism responds insufficiently to genuinely contradictory evidence (e.g. moving from 0.99 to only 0.98 confidence), reflecting statistically unjustified excessive persistence rather than appropriate stability"
  - concept: "KnowledgeOS must not be the sole authority for validating its own critical knowledge"
    definition: "For critical knowledge, an external or independent validation path (another measurement system, independent test, formal proof, external source, controlled experiment, or separately designed model — not necessarily a human) must exist outside the system's own self-assessment"
