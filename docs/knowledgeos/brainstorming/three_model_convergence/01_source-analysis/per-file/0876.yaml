defines:
  - concept: "The Markov-sufficiency test for state adequacy"
    definition: "A borrowed formalization from stochastic-process theory, used here as a diagnostic test rather than a claim about KnowledgeOS's underlying dynamics: a candidate state representation K_t is judged sufficient if the conditional distribution of the next state given the current state and any future input does not depend on the full prior history once K_t is known -- P(K_{t+1}|K_t,H_t,I_{t+1})=P(K_{t+1}|K_t,I_{t+1}). For a deterministic transformation, this becomes the requirement that T(K_t,I_{t+1}) determines the next state without needing hidden historical information. The file explicitly cautions this borrowed test does not imply KnowledgeOS itself is a Markov process (a substantive claim about its actual dynamics) -- it only supplies a useful, well-defined mathematical criterion for evaluating whether a specific candidate state abstraction has lost historically-dependent information that future transformations would need"
  - concept: "Knowledge State as an equivalence class of histories (K=[H]_{∼_H})"
    definition: "A candidate mathematical reformulation of what a Knowledge State fundamentally is, proposed as an alternative to treating it as merely 'the current graph' or a fixed tuple of components: define two histories H_1 and H_2 as equivalent (H_1∼_HH_2) exactly when they are semantically indistinguishable under every permitted KnowledgeOS operation, and then define the Knowledge State itself as the equivalence class [H]_{∼_H} of all histories semantically indistinguishable from a given one. This reframes the state not as a separately-constructed summary object built by extracting fields from a history, but as the history itself considered up to the coarsest equivalence that still respects all meaningful distinctions -- a mathematically elegant move that, if it holds up, would make the earlier state-abstraction function F:H→K simply the canonical quotient map onto equivalence classes. Explicitly flagged as a candidate formulation requiring validation against the corpus, not yet an accepted definition"
