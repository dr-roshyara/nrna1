about: >
  Adds Bishop's PRML (previously mined extensively at 0230) as a third book in the semantic-operator
  discovery research stack alongside Solution Mindset (0241) and ESL (0228/0231/0242). Central division
  of labor: Solution Mindset supplies OBSERVATION (what operations do humans describe?), PRML supplies
  EXPLANATION (what latent probabilistic structure could generate the observations?), ESL supplies
  VALIDATION (which discovered structures are statistically reliable and generalizable?). Reframes the
  Dhatu hypothesis as a testable latent-variable claim rather than an assumed ontology.
introduces:
  - concept: "Four-layer representation hierarchy: L0 Raw (words/observations) -> L1 Observable operation (select/compare/reduce) -> L2 Latent structure (underlying semantic state) -> L3 Invariant (structure surviving representation/domain changes); the prior Zero Lens work operated mainly between L1 and L3, PRML supplies the missing L2 machinery"
  - concept: "Dhatu formalized as a latent-variable hypothesis: candidate latent variable z generating multiple observable manifestations x, explicitly warning NOT to assume a candidate (e.g. FILTER) is a Dhatu -- test whether apparently different observations are better explained by a common latent structure"
  - concept: "Nonlinear latent-manifold framing (via PRML's GTM discussion) as a richer alternative to linear PCA: a discrete apparent semantic space (A/B/C/D) might actually be one continuous manifold transformation (A->B->C->D), motivating a research question about the DIMENSIONALITY AND GEOMETRY of the latent semantic space, not merely its primitives"
  - concept: "Semantic topology via graphical models: moves from 'what operations exist' (ontology) to 'how do operations depend on one another' (dependency graph, e.g. Question->Filter->Compare->Select->Act with an Observe/Update feedback loop) -- structure, not vocabulary"
  - concept: "Conditional independence / d-separation applied to problem-solving: which operations become irrelevant once certain information is known, motivating the concept of information bottlenecks in a semantic system and connecting Zero Lens to a formal notion of sufficient representation"
  - concept: "Information-theoretic reformulation of Zero: not 'shortest description' but 'smallest representation that preserves relevant information' -- minimality becomes empirically investigable (how much relevant information was lost by a candidate compression?)"
  - concept: "EM reframed as an iterative latent-operator DISCOVERY mechanism: instead of manually defining Dhatus first, iteratively infer operator assignments (E-step) and update the operator model (M-step) -- discovery rather than pure validation"
  - concept: "Problem-solving reframed as a state-transition/HMM system rather than a bag of operators: a trajectory through latent states (Uncertainty->Question->Observe->Analyze->Select->Act->Feedback->Update), posing the stronger scientific question: is human problem solving better represented as a static ontology or a probabilistic dynamical system over latent semantic states?"
  - concept: "Occam factor / BIC reframed as the formal complexity-penalty making Zero = model selection, not philosophical reduction -- explicit balance between explanatory power and complexity penalty, avoiding both 1000-operator overfitting and 3-operator aesthetic oversimplification"
  - concept: "Cross-book operator matrix methodology: for every major PRML/ESL concept (e.g. EM), extract a structured signature (input/operation/latent-status/transformation/objective/structure/failure-mode) and compare against Solution Mindset's named operators (FILTER/REDUCE/QUESTION/...) by STRUCTURAL SIGNATURE MATCH, not name match -- the central proposed next artifact"
