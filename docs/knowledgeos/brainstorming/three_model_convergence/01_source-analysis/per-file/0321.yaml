    refinement: "Explicitly framed as complementary rather than competing: Williamson supplies the 'do not reduce' discipline, Brandom supplies the 'model what discourse does' machinery (commitment/inference/entitlement/challenge/revision/communication)"
  - concept: "The corpus's own long-standing fact-vs-claim distinction struggle (tracked across many prior files)"
