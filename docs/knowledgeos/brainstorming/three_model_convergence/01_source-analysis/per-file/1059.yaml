about: >
  "04 — Derivation / Governance Matrix (mandate §§6, 7)," establishing a strict four-way classification --
  D (derivable) · E (empirically establishable) · N (normative) · G1 (irreducible) -- explicitly never
  collapsed, with secondary qualifiers noted separately, applied to twenty-one distinct open questions across
  the entire equality/identity research programme.

  **Delivers the definitive count**: 5 D (derivable: provenance identity ESTABLISHED, policy composition
  ESTABLISHED, congruence-under-operations and merge-laws both blocked pending upstream fixes); 2 E
  (empirically establishable, BOTH ALREADY EXECUTED, BOTH NEGATIVE: equality-under-withdrawal fails,
  equality-under-retraction's monotone-growth claim is refuted); 13 N (normative); 1 G1 (irreducible: `≡`'s
  decision procedure itself, per `012§35`'s theorem-shaped undecidability).

  **DELIVERS A GENUINELY IMPORTANT NEW GOVERNANCE-DISCIPLINE PRINCIPLE, EXPLICITLY POSED AS "WHAT MUST NOT BE
  GIVEN TO GOVERNANCE?"**: "Handing an authority a derivable question manufactures a decision that can no
  longer be revised by evidence." Identifies FOUR SPECIFIC ITEMS that must be WITHHELD from the governance
  surface because they are forced or testable, not matters of preference: (1) congruence under operations --
  the already-tracked "258-A" criterion is an EXECUTABLE TEST once `≡`,`𝒯`,`δ` are fixed; "Governance fixes
  the inputs; it must not declare the outcome"; (2) equality under merge -- `25J.45-47`'s commutativity/
  associativity/idempotence "are LAWS TO BE TESTED, not chosen"; (3) the `id`/mutable-state repair -- "FORCED:
  if `StructuralValid`'s no-dangling clause holds and `e.state` is mutable, then `state∉id`. Governance
  AUTHORIZES the repair; it does not SELECT it"; (4) `≈`'s two degenerate endpoints (the already-tracked
  `≈_∅`/`≈_{full}` finding, file 1057) -- "excluded by MEASUREMENT, not by preference. The choice space is 30,
  and offering 32 would present TWO NON-OPTIONS AS OPTIONS." Boxed: **"Governance decides `𝒪`, `𝒯`, `≡` and
  the scoping parameters. It must NOT decide congruence, merge laws, or a forced repair."**

  **DELIVERS A FURTHER GENUINELY IMPORTANT EPISTEMIC-DISCIPLINE CLOSING PRINCIPLE**, distinct from and
  complementary to the four withheld items: "one item must not be given to governance because it is NOT
  DECIDABLE BY ANYONE: `≡`'s total Boolean procedure -- `012§35` makes it a THEOREM-SHAPED LIMIT. AN AUTHORITY
  CANNOT RATIFY DECIDABILITY INTO EXISTENCE." This precisely distinguishes three categories of governance-
  surface item: what governance decides (genuine preferences/scoping choices), what is forced but requires
  authorization (not selection), and what no authority anywhere can decide regardless of who is asked.
