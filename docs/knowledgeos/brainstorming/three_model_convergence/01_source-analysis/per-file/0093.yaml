about: >
  A direct, disciplined elaboration of 0092's Tarka/Nyāya research into five new H-KOS-* candidate
  invariants (reusing the existing naming convention), a new "Updated KnowledgeOS Cognitive
  Architecture" pipeline diagram, and an explicit "what Tarka does NOT add" boundary list -- all
  scoped to the reasoning/validation LAYER, explicitly not the kernel identity layer.

introduces:
  - "Central reframing: 'KnowledgeOS preserves the conditions under which reasoning can transform
    evidence into trustworthy knowledge' (extends the prior 'preserves trustworthy knowledge
    evolution' framing with an explicit reasoning-transformation middle step, rejecting the 'Evidence
    -> Magic AI -> Truth' black-box pattern)"
  - "H-KOS-Reasoning-Separation-001: KnowledgeOS SHALL distinguish reasoning that PRODUCES knowledge
    (Anumāna/Inference Engine) from reasoning that EVALUATES/CHALLENGES/ELIMINATES knowledge (Tarka/
    Critical Reasoning Engine)"
  - "H-KOS-Reasoning-Provenance-001: derived knowledge SHALL preserve the reasoning path that produced
    it (premises, transformation rules, assumptions, conclusion) -- direct engineering translation of
    the five-membered syllogism's structure"
  - "H-KOS-Vyapti-001: KnowledgeOS SHALL preserve the logical relationship connecting evidence to
    conclusion for every derived knowledge object -- called 'perhaps the most architecturally valuable
    concept' in this file"
  - "H-KOS-Uncertainty-001: KnowledgeOS SHALL represent uncertainty as a structured epistemic state,
    not as missing data -- direct extension of Unknown Preservation via Saṃśaya"
  - "H-KOS-Fallacy-001: KnowledgeOS SHALL detect and preserve invalid reasoning patterns (circular
    dependency, infinite regress, self-reference) rather than silently accepting their conclusions"
  - "'Updated KnowledgeOS Cognitive Architecture' pipeline: Knower -> Observation -> Evidence Layer ->
    Reasoning Layer (Inference/Analogy/Deduction/Abduction) -> Validation Layer (Tarka/Contradiction
    Check/Fallacy Detection) -> Knowledge State -> Decision Support -- the richest single pipeline
    diagram so far, explicitly placing 'Knower' at the top (consistent with 0091's Agency addition)"
  - "Explicit 'What Tarka Does NOT Add' list: no new kernel dimension, no new bounded context, no new
    storage model, no new authority model, no AI architecture decision"
  - "P4 Candidate Additions summary table (6 rows, 2 'Strong candidate', 4 'Candidate') -- explicitly
    deferred pending comparison against EKS/PKS/AIP evidence before promotion"

