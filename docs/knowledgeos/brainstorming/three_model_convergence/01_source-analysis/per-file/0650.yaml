defines:
  - concept: "Syntactically possible≠Semantically admissible"
    definition: "A database schema or type system may permit an operation to be constructed (syntactically possible) while the epistemic type system explicitly prohibits it because no valid epistemic transformation rule establishes it (e.g. AIOutput⊢VerifiedFact is syntactically constructible but has no valid derivation)"
  - concept: "TypeSystem≠EntireBusinessDomain"
    definition: "The epistemic type system should define semantic boundaries and invariant rules only; encoding every business rule into it recreates the God Object / God Model problem the architecture has been avoiding — domain-specific meaning belongs to the owning bounded context"
  - concept: "Type≠Status"
    definition: "An artifact's epistemic type (e.g. Hypothesis) is a separate dimension from its lifecycle status (e.g. Supported, Disputed, Invalidated); a hypothesis remains typed Hypothesis even after being supported, unless an explicit promotion transformation changes its semantic role"
  - concept: "EpistemicTypeError"
    definition: "A meaningful architectural concept directly analogous to a programming-language type error (int+file): an attempted epistemic transformation or operation with no valid semantic rule (e.g. authorize(Prediction) with no underlying decision) must be rejected as a type error rather than silently executed"
  - concept: "GodObjectRisk (this file's FAIL result)"
    definition: "Combining observation, evidence, model, decision, authorization, and action fields into a single universal KnowledgeObject collapses the typed semantic boundaries the type system exists to enforce; the corrective principle is TypedArtifacts with explicit relationships, never a UniversalKnowledgeObject"
