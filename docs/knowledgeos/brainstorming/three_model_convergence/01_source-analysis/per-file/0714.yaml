defines:
  - concept: "Assurance owns Detection; Governance owns Disposition (Findings ownership)"
    definition: "A failed assurance check produces a Finding; Assurance's domain responsibility ends at detecting and reporting it (Assurance→FindingDetected); the organizational response (remediate, accept risk, grant exception, investigate, or classify as false positive) belongs exclusively to Governance (Finding→Governance) — this prevents technical verification from silently becoming organizational decision-making"
  - concept: "The three forbidden dependencies"
    definition: "(1) Runtime state must not automatically become authoritative knowledge feeding Governance (observation ≠ organizational intent); (2) Agent inference must not directly become authoritative architecture (must instead route through Evidence→Validation→Governance→Authority); (3) an Assurance violation must not automatically trigger a policy change (must instead route through Finding→Governance→Decision) — together these instantiate the master rule that technical contexts must not define organizational authority"
  - concept: "AFR-01"
    definition: "No agent component may become the system of record for authoritative organizational knowledge"
  - concept: "The fundamental semantic triangle"
    definition: "KnowledgeOS's architecture can be expressed as three distinct states: Should Be (Governance+Knowledge), Is (Runtime+Observation), and Why/Proof (Evidence+Assurance); the assurance system evaluates the relationship between Should-Be and Is using Evidence, and AI operates across the triangle's boundaries as a reasoning participant without owning any single vertex"
  - concept: "Governed Engineering Actor"
    definition: "The correct architectural model for an AI agent (Claude/Codex): neither a passive UserInterface nor an unconstrained Automation, but an actor with explicit Identity, Delegation, Evidence, and Action-scope fields, operating within — never above — the governance boundary"
