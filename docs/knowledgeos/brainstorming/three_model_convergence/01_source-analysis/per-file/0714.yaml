about: >
  Delivers the explicit target Context Map as a closed semantic feedback loop: `Governance→Knowledge→
  Assurance→Engineering→Evidence→Knowledge`, with each edge individually justified (§128.2-128.8): Governance
  establishes what is organizationally binding (`Governance→Knowledge`); Knowledge translates governance into
  reusable engineering meaning; Assurance needs Knowledge's expectation to evaluate reality
  (`Knowledge→Assurance`); Assurance observes/evaluates but does not own engineering
  (`Assurance→EngineeringState`, explicitly NOT ownership); Engineering produces evidence
  (`Runtime→Observation→Evidence`); and, critically, `Evidence↛Authority` automatically -- "one of the
  central boundaries."

  **Delivers Findings ownership precisely** (§128.9-128.10, directly extending the corpus's Detection≠
  Authority/Assurance≠Governance family): Assurance owns Detection (`Assurance→FindingDetected`); Governance
  owns Disposition (`Finding→Governance`), with an explicit five-branch disposition lifecycle (Remediate/
  Accept Risk/Exception/Investigate/False Positive), "this avoids mixing technical verification with
  organizational decision-making."

  **Delivers a precisely reasoned Shared-Kernel warning** (§128.11-128.12) against a tempting large shared
  Evidence model across all contexts: "a large shared model creates coupling" -- a shared kernel, if any,
  "should therefore be extremely small," potentially only `Identity+Reference+Version+ProvenanceMetadata`,
  never the entire Knowledge domain -- directly extending 0698's semantic-core-minimality discipline into
  context-mapping terms. Delivers Published Language candidates (`GovernanceDecisionApproved,
  GovernanceExceptionGranted, KnowledgePublished, EvidenceCaptured, FindingDetected, VerificationCompleted`)
  and reconfirms the Anti-Corruption-Layer discipline with four concrete external-system examples
  (Kubernetes, Nexus, Git, CI/CD), each with an explicit "KnowledgeOS ≠ [external system]" boundary
  statement (e.g. "the CI system remains the authority for the pipeline execution itself").

  **Places the AI agent (Claude/Codex) explicitly at the application/integration layer** (§128.18-128.22),
  consuming governed context and producing evidence/recommendations/actions, with the critical rule "the
  agent must not become an upstream context": `Agent→Governance` (as truth-determination) is explicitly
  rejected in favor of `Agent→Recommendation→Governance` -- "the agent is downstream from authority" -- with
  a recommendation schema (`producedBy=Agent, basedOn=Evidence, proposedFor=Decision`) making AI contribution
  explicit without granting authority. Delivers the Claude/Codex symmetry principle: both harnesses must
  consume the `SameKnowledgeAuthority/SameEvidenceDiscipline/SameGovernanceBoundary/SameActionConstraints`,
  explicitly NOT `SameConfigurationFiles` -- the harnesses may differ operationally, but the semantic contract
  must not.

  **Delivers the file's central, directly promised test -- three explicitly enumerated forbidden
  dependencies (§128.23-128.26), directly fulfilling 0712's close-of-file promise to test the
  `Infrastructure/Agent→Authority` anti-pattern**: (1) `Runtime→"Current reality"→Automatically authoritative
  knowledge→Governance` is forbidden, "because observation does not automatically establish organizational
  intent... Runtime can tell us what IS. It cannot necessarily tell us what SHOULD BE"; (2)
  `Agent→Inference→Authoritative Architecture` is forbidden, with the corrected chain given explicitly as
  `Agent→Inference→Evidence→Validation→Governance→Authority`; (3) `Assurance→Violation→Automatic policy
  change` is forbidden, with the corrected chain `Assurance→Finding→Governance→Decision`. Delivers the
  master dependency rule: "Technical contexts must not define organizational authority."

  Delivers DDD relationship-type classification for the context map (§128.27: Governance→Knowledge as
  Upstream/Downstream; Knowledge→Assurance as Published Language; Assurance→External Systems as
  Customer/Supplier), a candidate Context ownership table (§128.28, explicitly caveated "candidate
  ownerships, not established organizational facts"), and the Ownership-essential principle (§128.29:
  without ownership a bounded context "becomes only a technical grouping," requiring a genuinely empirical
  next phase inspecting actual repositories/teams/deployment ownership/Jira/APIs/documentation/ADRs -- a
  concrete, specific empirical-engagement commitment continuing the corpus's repeated promise-then-defer
  pattern, consistent with the calibrating meta-finding established at 0694).

  **Delivers the reconstruction's first numbered, concrete Architecture Fitness Rule catalog (AFR-01 through
  AFR-10), the most directly actionable synthesis deliverable in the reconstruction to date** (§128.30-
  128.39): AFR-01 "No agent component may become the system of record for authoritative organizational
  knowledge" (directly protects the KnowledgeOS boundary); AFR-02 "Authoritative knowledge must have
  explicit provenance and authority"; AFR-03 "External system models must not leak directly into
  KnowledgeOS domain semantics" (use adapters); AFR-04 "Assurance detects conformance; governance determines
  disposition"; AFR-05 "Agent recommendations must remain distinguishable from authoritative decisions";
  AFR-06 "Material agent actions require traceable authorization"; AFR-07 "Every material change must
  produce sufficient evidence for post-action verification"; AFR-08 "Constitutional rules must be
  independently testable where technically feasible"; AFR-09 "Historical authoritative states must remain
  reconstructable"; AFR-10 "Unknown must remain a valid epistemic outcome" ("the system must never
  manufacture certainty merely because an agent is expected to provide an answer").

  **Delivers a Context-map test directly and explicitly applying AFR-01 to the long-tracked pointer-layer
  test case (§128.40-128.42), the most precise, formal resolution of this recurring illustrative thread to
  date**: the proposal "Let the Claude `.claude/memory/` directory become the primary source of
  architectural knowledge because the agent already uses it" is explicitly tested against AFR-01 and
  produces `FAIL` — "`AgentLocalMemory≠AuthoritativeKnowledge`." A parallel test of Codex's `AGENTS.md`
  concludes it is acceptable only as a pointer/operating contract (`AGENTS.md→KnowledgeOS`, never
  `AGENTS.md=KnowledgeOS`), and a final symmetric statement fixes the boundary precisely: `.claude/` owns
  agent behavior/hooks/workflow/configuration/pointers; KnowledgeOS owns authoritative engineering
  knowledge/governance/evidence/decisions — directly and formally converging with, and giving precise
  vocabulary to, this very repository's own actual `.claude/`-vs-`docs/knowledgeos/` split. A Nexus-config
  test (§128.43) is delivered in parallel: `NexusConfig→Observation/Evidence`, never automatically a
  `GovernanceDecision`.

  **Delivers "the fundamental semantic triangle,"** a valuable new capstone conceptual framework
  (§128.44-128.45): `Should Be (Governance+Knowledge) / Is (Runtime+Observation) / Why-Proof
  (Evidence+Assurance)`, explicitly called "one of the most useful conceptual models for KnowledgeOS," with
  the Assurance system's role precisely stated as evaluating the relationship `ShouldBe↔Is` using `Evidence`.
  Delivers "where AI fits" in this triangle (§128.46-128.47): AI operates across the triangle's boundaries as
  a "reasoning participant" but "does not own any vertex," with the file explicitly rejecting both
  `UserInterface` and `Automation` as adequate models for the AI agent in favor of **`Governed Engineering
  Actor`** — with explicit `Identity+Delegation+Evidence+ActionScope` fields — a new, precise naming
  generalizing the corpus's prior `AgentAuthority`/A-series invariant discipline into a single agent-role
  concept.

  Delivers Context-map maturity as three explicitly distinguished levels (current-state reconstruction /
  target context map / fitness rules), directly extending the corpus's ArchitectureClaim≠
  ImplementationFact discipline (0693/0694/0706/0710) into context-mapping terms — "this prevents target
  architecture from being accidentally presented as current architecture."

  Delivers Step 128's verdict (context map formally established, converging on the same Core =
  Governance/Knowledge/Evidence/Assurance as 0712, with Runtime/Git/Nexus/CI-CD/IAM as external/supporting
  and Claude/Codex as agent/application-integration contexts), and the file's memorable capstone resulting
  principle: **"Authority flows downward; evidence flows upward"** (`Authority→ExpectedState→Engineering`;
  `Engineering→Observation→Evidence→Governance`, meeting at Assurance).

  **Closes by opening "Step 129 — KnowledgeOS Architecture Fitness Model,"** promising to convert the AFR
  principles above into genuinely executable, automatable checks capable of inspecting repository structure,
  dependencies, configuration, agent harnesses, KnowledgeOS APIs, governance records, evidence, and CI
  pipelines — formalized as the pipeline `Architecture Principle→Fitness Rule→Automated Check→Evidence→
  Verdict`, explicitly named "the bridge from DDD architecture to deterministic architectural assurance." No
  actual code execution, repository inspection, or verified filesystem/dependency claim reported anywhere in
  this file — all context-map tests (including the `.claude/memory/` and Codex/Nexus tests) remain
  hypothetical illustrative applications of the stated fitness rules, not empirical findings.
