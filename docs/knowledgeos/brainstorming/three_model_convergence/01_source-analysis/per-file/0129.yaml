    global consistency check as a named (candidate) sub-principle of Structural Enforcement"
  - "A four-way convergence statement (Gödel/Nyāya/Escher/Zero), each given one aphoristic role
    ('needs awareness of its own limits' / 'needs justified reasoning' / 'needs invariant relationships'
    / 'needs a neutral reference point') -- explicitly a continuation of the existing Gödel<->Zero
    unresolved_equivalence cluster (0122/0123/0126), not a new independent claim"
  - "Three named failure modes: infinite complexity without grounding (Relation=Meaning trap), the
    representation-illusion trap (local/global gap), infinite self-referential recursion (resolved by
    'Zero' as the regress-terminating ground) -- a candidate failure taxonomy, not previously named as
    a set in the corpus"

