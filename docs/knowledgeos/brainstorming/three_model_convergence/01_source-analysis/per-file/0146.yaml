about: >
  Direct elaboration of 0145's Constitutional DSL sketch into a "First Cut" grammar, a worked
  GovernanceConstitution v2.3.0 example (CONTEXT/ENTITY/EVIDENCE/RULE/CONTRADICTION_RULE/
  TRANSITION_RULE blocks), a closed Intent Vocabulary (14 actions, 8 entity types, 6 relationships,
  regex-based pattern grammar), a quantitative Evidence Weighting model (numeric base_weights per
  evidence type, multiplicative modifiers, a 1.5x contradiction-resolution threshold), and a 15-state
  Kernel state machine with explicit transitions. Ends by asking which component to build first --
  explicitly a design proposal, nothing executed or adopted.

introduces:
  - "Quantitative Evidence Weighting scheme: numeric base_weights per evidence type (CONSTITUTIONAL=1.0
    down to REFERENCE=0.2) with multiplicative modifiers (authority +20%, longer provenance +10%,
    longer validity +10%, recency +10%) and an explicit contradiction-resolution threshold (weight_A >
    weight_B * 1.5 to supersede; within 20% triggers reconciliation-or-escalation) -- the first
    numerically quantified evidence-strength model in the corpus"
  - "Closed Intent Vocabulary: 14 named actions (START_REVIEW, ADOPT, SUPERSEDE, ESCALATE, etc.), 8
    entity types, 6 relationship types, with a regex+slot-filling pattern grammar -- explicitly NOT
    general NLP, a closed recognition vocabulary"
  - "15-state Kernel state machine (IDLE through CONFIRMED) with explicit named transitions -- a
    concrete elaboration of 0145's 6-stage pipeline sketch"
  - "Worked Constitutional DSL example with 5 concrete RULE definitions and 2 TRANSITION_RULE
    definitions, illustrating priority-ordered rule evaluation with PASS/FAIL/AMBIGUOUS/CONTRADICTION
    outcomes"

