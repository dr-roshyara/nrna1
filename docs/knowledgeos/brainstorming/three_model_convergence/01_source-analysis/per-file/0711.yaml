defines:
  - concept: "Authority≠Authorization"
    definition: "Authority is the static basis of legitimate decision/action power held by an actor (a property that can be described and stored); Authorization is the dynamic, situational determination of whether a specific actor may perform a specific action on a specific resource in a specific context right now (Authorize(Actor,Action,Resource,Context)→Allow/Denied) — the two must not be conflated"
  - concept: "Claim vs. KnowledgeObject"
    definition: "KnowledgeObject is the persistent container/lifecycle object for a piece of organizational knowledge; Claim is the semantic assertion it carries (e.g. 'Service X owns Database Y'), which progresses through an explicit status lifecycle (Inferred→Verified→Authoritative) as evidence, verification, and governance accumulate — distinguishing the container from its evolving epistemic content"
  - concept: "KnowledgeOS as Semantic Governance Ledger"
    definition: "An architectural analogy (not a literal financial ledger) explaining why KnowledgeOS requires immutability and full traceability: it records what was believed, why, by whom, under which authority, when, based on what evidence, what changed, and what was verified — a durable record of organizational epistemic and governance history"
  - concept: "KnowledgeOS=Semantic+Temporal+Epistemic+Governance"
    definition: "The complete information architecture of KnowledgeOS decomposes into four necessary dimensions: Semantic (what does this mean?), Temporal (when was it true?), Epistemic (why should we believe it?), and Governance (who is authorized to make it authoritative?) — omitting any one dimension leaves the architecture incomplete"
  - concept: "Context integrity via hashing"
    definition: "A ContextPackage assembled for an agent can be hashed (H(ContextPackage)); subsequent actions the agent takes can reference this ContextHash, enabling later reconstruction of exactly which knowledge context (which decisions, evidence, exceptions, and observations) the agent was operating from when it acted — a content-addressable audit mechanism for agent context"
