defines:
  - concept: "TOCTOU in agent authorization"
    definition: "An authorization decision made at time t_1 (TimeOfCheck) may no longer reflect the conditions present when the authorized action is actually executed at time t_2 (TimeOfUse); to prevent acting on stale authorization, the authorization object must carry explicit validity bounds and, for high-risk/production actions, be revalidated immediately before execution rather than trusted indefinitely"
  - concept: "'ACLs everywhere? No'"
    definition: "An Anti-Corruption Layer is warranted only where an external system's domain model would otherwise leak into and contaminate KnowledgeOS's own domain model; where the external system's natural representation is already simple and stable (e.g. a Git commit reference), a plain technical adapter suffices without a full translation layer -- ACL usage should be proportional to actual semantic risk, not applied uniformly for architectural purity"
  - concept: "Open Host Service (applied to KnowledgeOS)"
    definition: "KnowledgeOS exposes a small set of stable, versioned contracts (context retrieval, knowledge queries, evidence submission, action requests, verification requests) that any agent harness (Claude, Codex, or a future agent) consumes as a downstream client, rather than each harness learning and depending on KnowledgeOS's internal implementation details directly"
