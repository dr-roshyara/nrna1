    refinement: "Given a precise, graded usage nuance ('ACLs everywhere? No') distinguishing when a full ACL is warranted (Kubernetes) from when a simple adapter suffices (Git), calibrating ACL application to actual semantic risk rather than applying it uniformly"
  - concept: "the corpus's long-tracked pointer-layer principle (0687-0725, now spanning A1/AFR-24/AAI-01-family/PLP-01)"
    refinement: "Re-codified yet again as CM-04, extending the reconstruction's ongoing invariant-notation-proliferation pattern without reconciling the prior codifications"
  - concept: "0717's Logical Architecture"
    refinement: "Positioned to be given finer component-level granularity in the promised Step 140, following this file's context-map-level (not yet component-level) specification"
  - concept: "0725's Assurance-Graph-as-projection finding"
    refinement: "Directly reconfirmed and extended with the precise distinction AssuranceGraph≠IntegrationBus"
  - concept: "the corpus's technical-capability≠organizational-authority family"
    refinement: "Extended into a concrete security-engineering mechanism (TOCTOU-aware revalidation) rather than only a static architectural principle"
