defines:
  - concept: "Formal Contradiction definition"
    definition: "Contradiction(A,B)⟺Context(A)≈Context(B)∧A⊨¬B — two assertions genuinely contradict only when they share the same relevant context AND one logically entails the negation of the other; apparent disagreement without contextual equivalence is not contradiction"
  - concept: "Defeater"
    definition: "Evidence that does not necessarily prove a conclusion's negation but invalidates the justification for accepting the conclusion, moving its status from Supported to Defeated or Undetermined rather than forcing a binary flip to false"
  - concept: "Contradiction containment invariant"
    definition: "A local contradiction about one property must not invalidate unrelated propositions unless an actual dependency relation exists between them — the architectural analogue of paraconsistent non-explosion"
  - concept: "Epistemic authority execution stack"
    definition: "Law/Policy→AuthoritativeRules→ValidatedDomainConstraints→Evidence→Models→GenerativeReasoning — an execution-precedence ordering (not a universal trust hierarchy) ensuring an AI-generated proposal can never silently bypass a binding authoritative constraint"
