  - concept: "0436/0438's claim that the Sarathi 'progressively reduces relevant uncertainty' and 'exposes Unknown Unknowns'"
    source: "this file's own explicit correction"
    resolution: "Both claims corrected: uncertainty reduction is not guaranteed (KnowledgeGain=/=>UncertaintyReduction); genuine unknown unknowns cannot be directly exposed, only evidenced as possible incompleteness"
