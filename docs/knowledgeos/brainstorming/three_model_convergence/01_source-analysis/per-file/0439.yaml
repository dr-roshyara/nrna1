  - concept: "0395's Priority-is-not-Knowledge finding"
    refinement: "Explicitly reconfirmed and formally protected against re-collapse by separating Knowledge from the newly-introduced Relevance function"
  - concept: "0433/0434/0435's Sarathi/purpose invariants (reduce Decision Uncertainty, guide toward readiness)"
    refinement: "Walked back from an unconditional uncertainty-reduction guarantee to a more precise invariant: uncertainty is made progressively more explicit, structured, and where possible reducible -- not always monotonically reduced"
  - concept: "0424's five-type completeness taxonomy and other prior completeness enumerations (0393/0414/0417/0419)"
    refinement: "Superseded by a cleaner three-tier hierarchy organized explicitly by scope (all-that-exists vs currently-represented vs decision-specific)"
  - concept: "0413/0414/0424's Lord Lens non-collapse discipline"
    refinement: "Sharpened with an explicit output type (CandidateDimension) and a mandatory Inquiry/Evidence step before any Lord-Lens-suggested dimension becomes Knowledge"
