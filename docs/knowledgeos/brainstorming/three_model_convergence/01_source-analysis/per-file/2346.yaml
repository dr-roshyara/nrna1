  **DELIVERS THE NOTABLE CLOSING EPISTEMIC PRINCIPLE**: "Reiter supplied one bounded candidate, one
  supported mechanism, one method, and one naming. It closed no open item. That is a real result and
  it is not a disappointing one -- an independent formal source that corroborated a corpus finding and
  closed nothing is exactly what 'independent' is supposed to look like. A source that appeared to solve
  nine open problems would warrant suspicion, not celebration." This is a generalizable methodological
  principle about how to correctly interpret a genuinely independent corroboration: modest, partial
  agreement is the EXPECTED and reassuring outcome; suspiciously comprehensive agreement would itself be
  a red flag.
