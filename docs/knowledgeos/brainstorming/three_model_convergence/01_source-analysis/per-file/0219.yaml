about: >
  A FOURTH independently-produced Kernel-architecture synthesis, this time integrating the
  philosophical/logic arc (Chinese Philosophy, Nyaya/Tarka pramana theory, Wittgenstein's Tractatus,
  Cavell) with Stigler's statistical pillars -- distinct in source composition from 0216's synthesis
  (Williamson/Chivers/Freedman/Stigler -> KnowledgeClaim/Evidence/Determination/Authority). Central
  insight: "Knowledge is not a possession -- it is a relationship. A Kernel must model that relationship,
  not just the proposition." Proposes a different candidate Kernel structure organized around
  Proposition/Position/Claim, with a mermaid architecture diagram, 12 architectural principles, 12 named
  design patterns, 5 architectural shifts, 10 core capabilities, 6 anti-reasoner capabilities, and 10
  falsification questions.
introduces:
  - concept: "Twelve architectural principles each with Implication/Architecture table and a named 'Architectural Pattern': Contextual Identity, Traceable Generation (pramana), Meaning-as-Use, Claim-as-Relation, Aggregation-as-Transformation, Weighted Information, Calibrated Uncertainty, Design-as-Context, Residual-as-Signal, Position-as-Meaning, Avoidance-as-State, Directional-Relation"
  - concept: "Proposition/Position/Claim triad as core Knowledge Units: Proposition (what is said), Position (who says it & why), Claim (response required) -- Claim explicitly not reducible to Proposition"
  - concept: "Traceable Generation: every knowledge unit records pramana (generation process/source); error modeled as a misplacement, not a separate category; default epistemic stance is trust, doubt only on reason"
  - concept: "Meaning-as-Use / Position-as-Meaning: propositions cannot be stored without utterance context; what is said != what is meant; implication is part of the knowledge unit, not external pragmatics; assertions conceal the self (Cavell)"
  - concept: "Avoidance-as-State: avoidance/refusal-to-acknowledge tracked as a state of the knower, not an information gap; 'the ordinary is not the obvious' -- difficulty is existential, not epistemic; more information is not always the solution"
  - concept: "Directional-Relation: conditional relationships are directional (regression as a property of the direction of inquiry, from Stigler); every relationship stored with its directionality"
  - concept: "Mermaid Knowledge Kernel diagram organizing Knowledge Units (Proposition/Position/Claim), Context & Relations (Source/Identity/Conditional Direction), Uncertainty & Calibration (Weight/Calibration/Residual), and Metadata (Avoidance/Design/Implication) into one candidate structure"
  - concept: "Five architectural shifts: Proposition -> Proposition-in-Context; Knowledge -> Knowledge-With-Uncertainty; Statement -> Position; Data -> Data-with-Design; Identity -> Relational Identity -- each with a before/after implementation checklist"
  - concept: "Ten core capabilities and six Anti-Reasoner capabilities (Avoidance Detection, Definition Adequacy [avyapti/ativyapti/asambhava testing], Reason Integrity [Tarka fallacy attacks], Representation-Truth Distinction, Category Confusion Detection, Conclusion Excess Detection)"
  - concept: "Ten falsification questions for any Kernel candidate (Identity/Generation/Meaning/Claim/Aggregation/Weighting/Calibration/Design/Residual/Direction questions)"
