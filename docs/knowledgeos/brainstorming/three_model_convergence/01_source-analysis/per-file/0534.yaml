defines:
  - concept: "Evidential Relation (ER, critique's reformulation)"
    definition: "ER(O,P,R,C,Π,τ) — observation, proposition, evidential relation type, context, provenance, temporal applicability — the atomic unit of evidence, quality being a separate assessment Q(ER,ρ) of this relation rather than a bundled field"
  - concept: "IndependenceFactor (concrete formula)"
    definition: "1/(1+dependency_depth(ER,evidence_graph)) — independence decreases monotonically with the length of the dependency chain back to the ultimate original source"
  - concept: "AggregateSupport (concrete formula)"
    definition: "Σ WeightedStrength(ER_i,policy,context) / (1+log(count(evidence_set))) — a logarithmically-dampened sum preventing naive linear scaling of apparent support with raw evidence count"
  - concept: "DeriveEpistemicState (decision table)"
    definition: "A deterministic default mapping of (support level, conflict status) combinations to named epistemic states: VeryStrong+NoConflict->Confirmed; VeryStrong+PotentialConflict->StronglySupported; Moderate+NoConflict->ModeratelySupported; Weak+NoConflict->WeaklySupported; Weak+ActiveConflict->Conflicting; None+None->Unknown; high contradiction->Contradicted; otherwise->Reported"
