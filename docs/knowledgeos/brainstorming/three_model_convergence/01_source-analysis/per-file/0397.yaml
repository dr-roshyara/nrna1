refines:
  - concept: "0362-0396's 'Knowledge ~ Difference(ObservedState,IdealState)' family of formulations"
    refinement: "Directly challenged: a correct comparison/determination is explicitly NOT automatically Knowledge under a factive, anti-luck epistemological account -- the corpus's dimension/state model explains the STRUCTURE of what is being known, but not yet the additional conditions qualifying it as Knowledge"
  - concept: "0395/0396's Knowledge!=Determination!=Decision three-way separation"
    refinement: "Sharpened into an explicit four-way distinction (Information/Determination/Knowledge/Decision), with the Determination-to-Knowledge boundary specifically tightened via factivity/belief/ability/safety conditions not previously present in the corpus's own internally-developed model"
  - concept: "0358's Pritchard engagement (Safety/Ability/Luck reclassified as RegimeDerived) and 0360's Belief-banning recommendation"
    refinement: "SAFETY is re-elevated from a merely RegimeDerived classification to 'probably the most important new concept for our research,' given an explicit modal-vs-statistical contrast with KST's error treatment; Belief is NOT banned outright but precisely scoped as a propositional attitude distinct from probability, refining rather than reversing 0360's caution"
  - concept: "0372/0396's Reason-has-Logic and Evidence->Reason->Logic->Justification->Trusted-Statement chain"
    refinement: "Explicitly shown to be NON-UNIVERSAL via Entitlement: some knowledge arises without requiring this full justification chain, a 'major correction' to an assumption the corpus had been implicitly relying on since 0372"
  - concept: "0359/0360's KST engagement, specifically its response-function error/lucky-guess model (beta_q/eta_q)"
    refinement: "Explicitly contrasted with Pritchard's safety condition as a STATISTICAL versus MODAL treatment of the same broad concern (error/luck), flagged as a genuine open research divergence rather than a settled equivalence"
