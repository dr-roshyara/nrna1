defines:
  - concept: "The five validity questions (as an explicit alternative to 'is the theory true?')"
    definition: "A research programme evaluating a formal theory like KnowledgeOS should never ask the single undifferentiated question 'is the theory true?' but instead pose five independent, separately answerable questions: (1) Mathematical validity -- are the definitions internally consistent?; (2) Computational realizability -- can the operators actually be implemented?; (3) Empirical adequacy -- does the implementation behave correctly on representative cases?; (4) Domain validity -- does it faithfully represent the domains (e.g. philosophical or religious source texts) from which its concepts are derived?; (5) Architectural fitness -- does the resulting model produce a viable system architecture? Each question can receive a different, independently-evidenced answer, and no answer to one question licenses an inference about another"
