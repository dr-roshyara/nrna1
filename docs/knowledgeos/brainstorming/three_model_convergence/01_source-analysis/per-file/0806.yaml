defines:
  - concept: "Contradiction⇒SemanticAlignment"
    definition: "Before two apparently conflicting claims can be classified as a genuine logical contradiction, the architecture must first verify they refer to sufficiently comparable states -- the same time, the same scope/environment, and the same version -- since an apparent conflict frequently dissolves once these dimensions are checked (a firewall claim from two different times, environments, or software versions is not a contradiction but simply a description of two different states); only claims that remain in tension after this alignment check constitute a genuine contradiction requiring further epistemic handling"
  - concept: "KnowledgeSituation as the unit of retrieval"
    definition: "Rather than retrieving a single document or a single claim in response to a query, a mature KnowledgeOS should retrieve a KnowledgeSituation: the full relevant bundle of claims, supporting and conflicting evidence, their relationships, temporal state, any unresolved conflict, and the current determination status -- so that a query about a genuinely disputed or uncertain proposition surfaces the dispute itself ('evidence A supports X, evidence B indicates otherwise, here is each one's provenance') rather than silently returning one answer as if it were uncontested"
  - concept: "The AI epistemic contract for conflict handling"
    definition: "An AI agent encountering conflicting knowledge is permitted and expected to detect the conflict, expose it explicitly in its output, preserve the provenance of both sides, assess the relative strength of the competing evidence, and recommend further investigation -- but it must never silently delete or suppress one side of a conflict, and must never invent a resolution (declare a winner) without an explicit, domain-appropriate resolution basis and the applicable authority to do so"
