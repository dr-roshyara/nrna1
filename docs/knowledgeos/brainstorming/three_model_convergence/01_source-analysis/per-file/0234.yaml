about: >
  A broad survey (not a single-book extraction) organizing statistical techniques into 17 capability
  families for KnowledgeOS knowledge-state assessment (Estimation, Bayesian inference, Hypothesis
  testing, Confidence/uncertainty, Correlation/dependency, Causal inference, Time-series/stochastic-
  process, Stability analysis, Resampling/robustness, Dimensionality reduction, Clustering/classification,
  Regression, Anomaly/change detection, Statistical Process Control, Monte Carlo, Optimization). Mostly
  consolidates techniques already introduced across 0205-0233 into one prioritized catalogue rather than
  introducing substantially new architecture; most novel contribution is applying Statistical Process
  Control to KnowledgeOS governance itself as a measurable process.
introduces:
  - concept: "Statistical Process Control (SPC) applied to the knowledge process itself, not a factory: monitor architecture-decisions-per-month, review-rejection-rate, contradiction-rate, evidence-freshness, knowledge-invalidation-rate against control limits -- turning governance into a measurable process rather than subjective judgment"
  - concept: "Five-question statistical research program: Estimation (what is the current state given evidence?), Uncertainty (how certain?), Stability (would the state survive reasonable perturbation?), Causality (associative vs. causal relationships?), Evolution (how should state change with new evidence?)"
  - concept: "Fifteen-item prioritized technique table (Bayesian updating #1, state-space models #2, uncertainty estimation #3, hypothesis testing #4, bootstrap #5, sensitivity analysis #6, causal inference #7, change-point detection #8, dependency/graphical models #9, robust statistics #10, SPC #11, optimization #12, PCA/factor-analysis #13, clustering #14, Monte Carlo #15)"
  - concept: "Explicit optimization/governance separation: optimization should recommend, governance should authorize"
defines: []
refines:
  - concept: "0233's Astrom-derived state-estimation stage and 0225's HSMM stability/entropy work"
    refinement: "Extends stability analysis with a concrete list of techniques (variance/sensitivity/perturbation/subsampling/influence-functions/condition-numbers/eigenvalue/Lyapunov analysis) directly usable to test whether a knowledge state is fragile under evidence perturbation."
