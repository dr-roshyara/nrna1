about: >
  Adds Paul & Elder's critical-thinking framework (Elements of Thought + Universal Intellectual Standards)
  as a qualitative epistemic state-extraction method, directly extending 0247/0249's Knowledge Vector work.
  Central hypothesis: critical reasoning can be used to reconstruct and evaluate the epistemic state of a
  knowledge corpus at a given point in time, producing a dynamic epistemic model rather than a static
  knowledge database or single scalar score.
introduces:
  - concept: "Eight Elements of Thought as raw state-extraction dimensions: Purpose, Question at issue, Information, Interpretation/inference, Concepts, Assumptions, Point of view, Implications/consequences"
  - concept: "Nine Universal Intellectual Standards applied to each element: Clarity, Accuracy, Precision, Relevance, Depth, Breadth, Logic, Significance, Fairness -- crossed into an element x standard matrix, explicitly more informative than one knowledge score"
  - concept: "KnowledgeState(t) formalized as a set/vector {Claims,Evidence,Relations,Assumptions,Uncertainty,Perspectives,Validity}_t rather than a single score; per-claim epistemic state vector KS(c,t) combining Evidence/Inference/Assumptions/Perspective/Contradictions plus the nine standards"
  - concept: "State transition on new evidence: K_{t+1}=Update(K_t,E_new); old claims are not deleted but re-evaluated -- e.g. C1 ('Architecture A used') remains historically valid but loses current validity when C2 ('replaced by B') becomes current"
  - concept: "Critical thinking as an adversarial knowledge filter: reasoning should actively search for information that OPPOSES a claim, not merely supporting it -- a claim is re-evaluated against supporting evidence, contradictory evidence, hidden assumptions, alternative interpretation, alternative viewpoint, implications, and contradictions"
  - concept: "Three-stage pipeline combining lenses: Text -> SemanticStructure (Dhatu/linguistic lens) -> EpistemicStructure (critical-thinking lens: justified claims/evidence/assumptions/inferences) -> InvariantStructure (Zero lens: what remains after removing language/rhetoric/representation)"
  - concept: "State(K,t) as an explicit multi-component vector (N_c claims, N_e evidence coverage, N_a assumption load, N_x contradictions, N_u uncertainty, C coherence, R relevance, B breadth, D depth, I invariance) with delta-state tracking (Delta-State = State(t2)-State(t1)) enabling qualitative statements like 'more complete but less certain' or 'gained evidence but accumulated contradictions' rather than a bare number change"
  - concept: "Three question types requiring different evaluation models: Definitive (single system, evidence/reasoning toward a correct answer), Subjective (no assessable answer in the same sense), MultiPerspective (evidence/reasoning can produce better or worse judgments) -- QuestionType as a first-class property affecting how a statement should be epistemically evaluated"
  - concept: "Final dynamic epistemic model formula: KnowledgeState(t) = CriticalAnalysis(Claims,Evidence,Inferences,Assumptions,Concepts,Perspectives,Implications), Evaluation = UniversalIntellectualStandards, KnowledgeState(t+1) = Update(KnowledgeState(t), NewEvidence, NewArguments, NewContradictions)"
