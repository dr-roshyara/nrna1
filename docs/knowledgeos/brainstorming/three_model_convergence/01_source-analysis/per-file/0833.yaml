defines:
  - concept: "The three nested unit-of-X non-identity statements"
    definition: "The arc's most important consolidated DDD architectural result to date: the unit of knowledge (a proposition, an assessment, a piece of evidence) is not necessarily the unit of consistency (an aggregate, whose boundary is determined by which invariants require atomic enforcement); the unit of consistency (an aggregate) is not necessarily the unit of process (a cross-aggregate workflow coordinated by a process manager, since no single aggregate need own an entire multi-step sequence); and the unit of process is not necessarily the unit of bounded context (a model boundary, determined by where the meaning of shared vocabulary actually changes, not by how many process managers or aggregates happen to exist) -- collapsing any two of these three distinct units into one is named as a source of a large class of common DDD design errors"
  - concept: "The Decision Basis composite B_D"
    definition: "A concrete formal composite (not a new domain entity in its own right) recording the exact versioned semantic inputs a decision relied upon: B_D=(AssessmentRef,PolicyRef,AuthorityRef,ContextRef), where each reference carries both an identifier and a version (e.g. AssessmentRef=(AssessmentId,Version)) so that a historical decision's basis remains fully reconstructible and immutable even after the current assessment, policy, authority, or context has since evolved -- ensuring a decision is never silently reinterpreted as if it had been made under today's mutable world rather than the world that actually existed at decision time"
