about: >
  Directly executes the task proposed at 0832's close, opening "we now have enough formal structure to
  attempt the first genuine DDD derivation: which concepts must share a consistency boundary?", restating
  the governing methodological rule: **"we do not derive Aggregates from nouns. We derive them from
  invariants, transactional atomicity, identity, lifecycle and concurrency,"** explicitly resisting the
  temptation to create `EvidenceAggregate`/`AssessmentAggregate`/`DecisionAggregate` merely because those
  words exist.

  **§205.1-205.2 delivers the formal Aggregate definition**, boxed: **`Agg=(I,O,B)`** (identity/owned
  state/invariant boundary), with the key property **`B defines what must remain consistent atomically`**,
  and three explicit non-identities: **`Aggregate≠DatabaseTable`**, **`Aggregate≠Entity`**,
  **`Aggregate≠BoundedContext`**. Delivers the Aggregate Root as the sole externally addressable entry
  point (`ExternalCommand→AggregateRoot→InvariantValidation→StateTransition`).

  **§205.3-205.6 delivers four rigorous derivation criteria**: (1) Invariant ownership --
  `Owner(I_i)=Agg_j`; if no aggregate can locally enforce an invariant, either the invariant is genuinely
  cross-context, the model is missing a concept, or the proposed boundary is wrong; (2) Atomicity --
  boxed **`Atomicity must be required by an invariant`**, explicitly rejecting "usually change together"
  as insufficient; (3) Lifecycle containment (`Lifecycle(B)⊆Lifecycle(A)`), explicitly insufficient alone
  if the contained object has an independent consistency boundary; (4) Concurrency cost, crystallized as
  an optimization principle, boxed: **`Minimize aggregate size subject to Invariant preservation`**.

  **§205.7-205.24 delivers a full per-candidate walkthrough** against these four criteria, testing ten
  concepts: **Proposition/Assessment** -- a proposition can exist before, and receive multiple, assessments
  over time (`Lifecycle(Proposition)⊄Lifecycle(Assessment)`), so `PropositionAggregate` is favored, with
  Assessment kept as a separate object (possibly owning only a `CurrentAssessmentReference`);
  **Observation/Evidence** -- Evidence can exist independently of any single observation and can originate
  from documents/system records/external datasets/calculations, so `Evidence≠Observation`, delivering
  `EvidenceAggregate` with an internal invariant `I_E:Verified⇒Provenance∧Integrity`, while Observation
  keeps its own independent lifecycle (`Captured→Corrected→Superseded`) and is referenced, not owned,
  crystallized: **`Reference is often preferable to containment`**; **Assessment** -- delivers its own
  traceable-basis invariant `I_A:Assessment→(P,E,M,U,L)`, with Evidence held only as references
  (`EvidenceRef_1,...,EvidenceRef_n`), never embedded; **Model** -- has independent identity and
  lifecycle, shared across multiple assessments, candidate `ModelRegistry/ModelContext`, delivering the
  major invariant **`VersionedModelIdentity`** (`M_v≠M_{v+1}` once referenced, required for
  reproducibility, "especially important for AI models"); **Uncertainty** -- explicitly NOT automatically
  its own aggregate, "a value/semantic component of Assessment" unless it later demonstrates its own
  lifecycle/calibration/governance; **Policy** -- independent lifecycle/versioning, Decision references
  `PolicyVersion` rather than copying the mutable policy, delivering the temporal-selection invariant
  `ApplicablePolicy(t)=Policy_v`; **Authority** -- independent lifecycle (`Authority_t≠Authority_{t+1}`),
  requiring the decision record to preserve the authority basis at decision time, boxed:
  **`PresentAuthority≠HistoricalAuthority`**; **Decision** -- a strong candidate with its own final-decision
  invariant `I_D:FinalDecision⇒ValidDecisionBasis`, explicitly referencing rather than owning Assessment
  (boxed: **`Decision references Assessment; it does not own Assessment`**, "otherwise Decision would
  become responsible for epistemic lifecycle... would violate bounded responsibility"); **Action** -- a
  strong candidate deriving from, but not owning, Decision (`Action→[derivedFrom]→DecisionRef`); **Outcome**
  -- explicitly difficult, externally produced, so not naturally owned by the Action aggregate
  (`Action→OutcomeObservation`), reinforcing **`ExecutionState≠Outcome`**.

  **§205.25-205.26 delivers a candidate aggregate map diagram** (Proposition→Assessment→[references
  Evidence, Model Version]; Assessment→Decision→[references Policy Version, Authority Version]→Action→
  Outcome/Observation), explicitly "considerably cleaner than one giant Knowledge Aggregate," crystallized
  as a central DDD teaching principle, boxed: **`An Aggregate owns invariants, not relationships`**.

  **§205.27-205.32 delivers the cross-aggregate reference pattern** (`Aggregate_A→ID_B` preferred over
  `Aggregate_A→MutableObject_B`, worked through `Decision.AssessmentId` not `Decision.Assessment`), and
  its refinement: an ID alone is insufficient, references must also carry semantic **version**
  (`AssessmentRef=(AssessmentId,Version)`, similarly for `PolicyRef`/`ModelRef`), delivering **the concrete
  Decision Basis composite**, boxed: **`B_D={AssessmentRef,PolicyRef,AuthorityRef,ContextRef}`**, "the
  decision records the exact semantic inputs used" so that "Decision is not dependent on today's mutable
  world to explain yesterday's decision" -- explicitly flagged "a major architecture property." Delivers
  **temporal consistency for historical decisions** (a decision made under `Policy_v1` must never be
  reinterpreted under `Policy_v2`), boxed: **`Historical semantic references are immutable`**, connecting
  once more (compactly) to the "new state does not know the old state" Chapter 4 lens via
  `CurrentPolicy≠HistoricalPolicy`/`CurrentAuthority≠HistoricalAuthority`/`CurrentModel≠HistoricalModel`,
  crystallized: **`Historical truth requires versioned semantic references`**, "far more precise than
  simply keeping an audit log." Delivers **`Audit⊊Lineage`** (audit asks who/what happened; lineage asks
  from what semantic inputs an artifact arose; audit is one projection of lineage).

  **§205.33-205.35 delivers a six-test aggregate-sizing framework** (Identity/OwnsInvariant/
  RequiresAtomicEnforcement/IndependentLifecycle/ContentionAvoidance/ReferenceableWithoutOwnership) and
  **the explicit "symmetry trap" warning**: a beautiful `OneConcept=OneAggregate` diagram is "aesthetically
  attractive but architecturally dangerous" -- DDD optimizes `Cohesion+Consistency-Coupling`, not symmetry,
  boxed: **`Architectural asymmetry is acceptable`**.

  **§205.36-205.37 delivers KnowledgeArtifact's conditional aggregate status**: it becomes a legitimate
  aggregate only if it owns its own invariant (worked example: `I_KA:Published⇒ApprovedAssessment∧
  CompleteLineage`), representing "the point where epistemic material becomes an organizationally reusable
  artifact," explicitly "not automatically" derived from Assessment -- "publication itself is a domain
  decision."

  **§205.38-205.42 delivers candidate commands per aggregate** (Proposition/Evidence/Assessment/Decision/
  Action, explicitly "candidate commands, not final APIs"), crystallized: **`Command≠Event`** and the
  pipeline **`Command→Transition→Event→State`**. Delivers **the Aggregate-as-Guardian formulation**, boxed:
  **`AggregateRoot=Guardian of local invariants`**, with three explicit non-identities (not
  `RepositoryFacade`, not `CRUDController`, not `WorkflowEngine`). Delivers the process-manager
  orchestration pattern for cross-aggregate sequences no single aggregate owns
  (`EvidenceValidated→AssessmentRequested→AssessmentCompleted→DecisionRequested`), explicitly "orchestration,
  not aggregate ownership."

  **§205.43-205.46 delivers a four-level candidate architecture hierarchy** (Level 1 Domain
  objects/Entity+ValueObject; Level 2 Aggregates/InvariantBoundaries; Level 3 Bounded
  Contexts/ModelBoundaries; Level 4 Processes/CrossContextOrchestration), a formal aggregate-to-bounded-
  context ownership cardinality (`Σ_j Owns(A_i,B_j)=1`, one primary owning context per aggregate, one
  context may own many aggregates -- `1→N`), and the aggregate-to-aggregate reference-over-containment
  preference. Delivers **a first candidate four-context structure** (DomainContext→
  Proposition/Evidence/Assessment-related models; GovernanceContext→Policy/Authority/Decision;
  ExecutionContext→Action; ObservationContext→Outcome/Observation), explicitly flagging that "which of
  these candidates genuinely deserve separate Bounded Contexts... we cannot answer that solely from
  aggregates."

  **§205.47 delivers the Step 205 verdict**: Aggregate derivation **PASS**, with an explicit
  three-tier confidence classification -- Strong candidates (Proposition, Evidence, Assessment, Model,
  Policy, Decision, Action); Conditional candidates (Authority, KnowledgeArtifact); Probably-not-
  independent-aggregates (Uncertainty, Lineage, Outcome, "unless further domain invariants demonstrate
  otherwise").

  **§205.48 delivers what the file itself calls "the most important architectural result": three nested
  non-identity statements**, each individually boxed: **`The unit of knowledge is not necessarily the unit
  of consistency`**; **`The unit of consistency is not necessarily the unit of process`**; **`The unit of
  process is not necessarily the unit of bounded context`** -- explicitly credited with preventing "a huge
  number of DDD design errors."

  **Closes opening "Step 206 — Bounded Context Derivation,"** promising to test each candidate boundary
  against a seven-factor criterion (`UbiquitousLanguage+SemanticModel+InvariantOwnership+
  Team/Responsibility+Lifecycle+ChangeRate+IntegrationNeed`) and, "especially," the single question boxed
  as "the true DDD boundary detector": **`Where does the meaning of a word change?`** -- explicitly
  reframing the guiding question away from "how many microservices should we build?" toward **"where does
  KnowledgeOS need a different model of reality?"** No actual repository implementation occurs within this
  file itself, and NO new numbered invariant is introduced (continuing the pattern from 0832 despite
  substantial new conceptual content -- e.g. VersionedModelIdentity, PresentAuthority≠HistoricalAuthority,
  Historical semantic references are immutable, and the three nested unit-of-X statements all read as
  strong invariant candidates left unnumbered).
