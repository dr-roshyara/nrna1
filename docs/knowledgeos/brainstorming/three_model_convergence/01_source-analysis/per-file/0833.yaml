title: "Step 205 -- Aggregate Derivation (PHASE-C-OPENING MILESTONE, delivers 0832's promised aggregate derivation, NO new invariant): Delivers Aggregate=(Identity,OwnedState,InvariantBoundary) With Aggregate≠DatabaseTable≠Entity≠BoundedContext -- Delivers Four Rigorous Derivation Criteria (Invariant Ownership/Atomicity-Required-By-Invariant/Lifecycle/ConcurrencyCost) Replacing Noun-Based Grouping -- Delivers a Full Per-Candidate Walkthrough (Proposition/Evidence/Assessment/Model/Uncertainty/Policy/Authority/Decision/Action/Outcome) Each Tested Against the Criteria, Concluding 'Reference Is Often Preferable to Containment' and 'An Aggregate Owns Invariants, Not Relationships' -- Delivers VersionedModelIdentity, PresentAuthority≠HistoricalAuthority, and 'Historical Semantic References Are Immutable' -- Delivers the Concrete Decision Basis B_D=(AssessmentRef,PolicyRef,AuthorityRef,ContextRef) So Decision Does Not Depend on Today's Mutable World to Explain Yesterday's Decision -- Delivers Audit⊊Lineage -- Delivers the 'Symmetry Trap' Warning (Architectural Asymmetry Is Acceptable; DDD Optimizes Cohesion+Consistency-Coupling, Not One-Concept-One-Aggregate) -- Delivers the Aggregate-as-Guardian-of-Local-Invariants Formulation and Explicit Non-Identities (Not RepositoryFacade, Not CRUDController, Not WorkflowEngine) -- Delivers a Four-Level Candidate Architecture Hierarchy (Domain Objects/Aggregates/Bounded Contexts/Processes) -- DELIVERS THE MOST IMPORTANT ARCHITECTURAL RESULT: Three Nested 'Unit of X Is Not Necessarily the Unit of Y' Statements (Knowledge≠Consistency≠Process≠BoundedContext) -- Opens Step 206's Bounded Context Derivation, Reframing the Central Question From 'How Many Microservices?' to 'Where Does KnowledgeOS Need a Different Model of Reality?'"
