defines:
  - concept: "VERIFICATION INDEPENDENCE = TRUE (proposed gate)"
    definition: "A boolean gate on a verification session's claimed independence, satisfied only when a formal provenance record for the session -- session ID, parent corpus snapshot, input artifact hashes, tools/version, generated artifacts, execution timestamp, dependencies, and an explicit list of prior verification artifacts read -- demonstrates the session did not read or depend on the output of the specific verification it purports to independently check. Motivated by the discovered failure mode of multiple sessions writing into the same tree within the same hour, which can silently convert a claimed independent corroboration into circular self-confirmation"
  - concept: "The mechanism-records-authority-it-does-not-create-authority boundary"
    definition: "A governance-integrity principle for any authority/acceptance chain (Decision→AuthorityAct→humanActRef→resolvable authority record→competence→scope→timestamp→authorized consequence): the recording mechanism (a document, a field, a status marker) may only ever RECORD that authority was exercised by a genuine, externally resolvable human/governance act; it must never itself be treated as the SOURCE of that authority. A validator enforcing this boundary must explicitly reject: self-authorized artifacts, unresolved humanActRef pointers, authority inferred merely from a document's existence, a grant recorded without a corresponding authority act, and authority apparently generated by the system itself (e.g. an artifact containing the word ACCEPTED that effectively accepts itself)"
