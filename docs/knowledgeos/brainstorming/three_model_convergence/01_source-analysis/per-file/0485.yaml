    refinement: "Extended into the Compare and Score functions: Compare(K_t,U_t,X_t,I_t,P_t,C_t,Policy_t)->Δ_t and Score_t=F(Δ_t,P_t,Policy_t), keeping discrepancy measurement and scoring explicitly policy-relative rather than intrinsic"
