defines:
  - concept: "Discrepancy (Δ_t)"
    definition: "Δ_t=Compare(K_t,I_t,P_t,C_t), the structured, purpose- and context-dependent representation of the conditions under which a current state fails to satisfy the applicable Ideal State; decomposes as Δ_t=(Δ^K_t,Δ^U_t,Δ^D_t); Δ_t∈𝔇, the space of valid discrepancy structures -- not assumed to be a metric"
  - concept: "Deficiency object (δ, 7-tuple)"
    definition: "δ=(Type,Target,Condition,Evidence,Severity,Context,τ) -- a single structured finding within a discrepancy, explicitly recording which Ideal constraint (Condition) is violated"
  - concept: "Scalar Score (derived decision instrument)"
    definition: "Score_t=F(Δ_t,P_t,Policy_t), a policy-dependent valuation function, explicitly NOT a universal mathematical distance and NOT intrinsic truth about knowledge -- a decision instrument only"
