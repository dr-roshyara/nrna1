defines:
  - concept: "The Gita-claim classification hierarchy (Analogy/Heuristic/Design Hypothesis/Formal Derivation/Governance Decision)"
    definition: "Every proposed correspondence between a Gita concept and a KnowledgeOS construct must be explicitly classified into exactly one of five escalating epistemic tiers: ANALOGY (a loose resemblance, establishing nothing); HEURISTIC (a useful rule-of-thumb for exploration, still establishing nothing normative); DESIGN HYPOTHESIS (a candidate architectural idea worth formally testing, still not established); FORMAL DERIVATION (the correspondence has been rigorously derived from accepted definitions/axioms via valid mathematical or logical steps); GOVERNANCE DECISION (a legitimate authority has ratified the correspondence as canonical). Only the last two tiers may establish normative KnowledgeOS semantics; the first three, however suggestive, must never be treated as if they settled a formal or architectural question"
  - concept: "State sufficiency (Sufficient(K,O,I), as investigated in this step)"
    definition: "A candidate state representation K is sufficient relative to an operation universe O and invariant register I if and only if K contains enough information to: (1) evaluate every mandatory invariant in I; (2) determine the legality of every operation in O; (3) execute every canonical transformation; (4) distinguish all state identities the theory requires to be distinguished; (5) support all required equality decisions; and (6) support deterministic replay wherever replay is required. This predicate's exact formal form remains to be derived in later work; this step explicitly refuses to assume it is already solved"
