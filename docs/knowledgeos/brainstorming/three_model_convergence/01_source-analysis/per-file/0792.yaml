defines:
  - concept: "Verification≠Validation"
    definition: "Verification asks whether a system correctly implements its stated specification (System⊨Specification) -- purely an internal-consistency question; Validation asks whether that specification/model is actually an appropriate representation of the real-world problem it is meant to address (Model≈Reality) -- a domain-fitness question independent of implementation correctness; a system can be perfectly verified against a specification that is itself wrong for the domain, in which case it remains a wrong system despite passing verification"
  - concept: "The verification ledger"
    definition: "A structured record distinct from an ordinary checklist: each entry L_i=(Claim, Predicate, Evidence, Method, Verdict, Timestamp) documents not merely that some work item was completed, but the precise claim being assessed, the testable predicate derived from it, the evidence examined, the method used to examine it, the resulting verdict, and when that assessment was made -- the six-value verdict vocabulary (UNASSESSED/SUPPORTED/VERIFIED/FAILED/INCONCLUSIVE/NOT_VERIFIABLE) preserves epistemic nuance that a binary done/not-done flag discards entirely"
refines:
