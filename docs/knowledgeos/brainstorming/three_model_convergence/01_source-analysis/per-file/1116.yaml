  monotone, `K_t` not." Confirms this must still not be conflated with the already-tracked `Continuity`
  relation (`195.51`, file 1038) -- a different carrier again.

  **DELIVERS THE FULL NINE-STRUCTURE MATCHING TABLE, PRECISELY SCORED**: 2 already established (bounded-
  knower/sub-σ-algebra; progress-survives-interruption/filtration-vs-state), 2 already refuted (Knowledge=
  conditional-expectation; martingale/submartingale analogies), 1 strong new match (obscuration/MNAR, below),
  3 blocked on a missing metric (epistemic drift/feedback-control, equanimity/Lyapunov-stability, same-
  quality-different-quantity/sufficiency), and 1 explicitly INADMISSIBLE (Jñāna-Vijñāna/conformal-prediction).

  **DELIVERS THE FULL, RIGOROUS DERIVATION OF THE MNAR FINDING (already-cited widely, file 1097's `17§3`)**:
  precisely identifies Ch 5's obscuration as specifically MNAR (missingness depending on the unobserved value
  itself), "exactly the case that is NOT IDENTIFIED from the observed data alone," names the already-tracked
  `A6`/`G-60` gap correctly, connects `M1`-`M3`'s already-tracked missingness modes to formal missing-data
  mechanism theory (Rubin 1976), and cites Manski's partial-identification bounds as "the honest response"
  matching the corpus's own already-tracked four-loci abstention rule. Precisely, honestly bounded: "What it
  does NOT do: supply the carrier... A vocabulary is not a carrier."

  **DELIVERS THE FULL DERIVATION OF THE METRIC/LOSS-FUNCTION GATE (`§4`) BLOCKING EVERY DYNAMIC MATCH**,
  including a genuinely valuable "statistician's note that cuts both ways": conditional expectation is
  optimal only under squared-error loss, so "'knowledge=`E[X|ℱ]`' silently imports a QUADRATIC LOSS,"
