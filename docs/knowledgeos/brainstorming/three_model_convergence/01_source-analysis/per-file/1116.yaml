  that the LOSS FUNCTION is a modelling CHOICE, never a fact about knowledge." Delivers the already-tracked
  `M-Q3′` unification (file 1099) in its full original derivation here: "the gap is NOT a missing measurement;
  it is a MISSING NORMATIVE ACT." Explicitly forbids the obvious fix: "Supplying a metric would be INVENTING
  ARCHITECTURE -- the very move `291§21` forbids. The correct output is the DIAGNOSIS, not the metric."

  **DELIVERS THE FULL, RIGOROUS ARGUMENT FOR WHY THE `Jñāna`/`Vijñāna` MATCH IS INADMISSIBLE, NOT MERELY
  BLOCKED (`§5`)**: precisely identifies that statistical tools (conformal prediction, bootstrap, calibration)
  WOULD furnish exactly the missing mechanism for the already-tracked `Qualify`/`G1` gap -- and delivers the
  sharp reasoning for why that is exactly why it must be refused: "Importing a mechanism into `G1` from
  outside the corpus is INVENTING ARCHITECTURE, not deriving it -- and the import would arrive with its OWN
  ASSUMPTIONS (exchangeability, i.i.d. sampling) that KnowledgeOS has never established." Confirms this is
