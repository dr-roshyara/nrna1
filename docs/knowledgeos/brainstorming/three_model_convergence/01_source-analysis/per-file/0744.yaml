defines:
  - concept: "Actor≠Authority (operating-model instance)"
    definition: "The Actor is whoever or whatever performs an operating-lifecycle step (a Developer, an AI Agent, a System); the Authority is the organizational role/body empowered to make the corresponding governance decision -- an AI Agent may reason, propose, and act within authorized bounds, but never itself constitutes governance authority"
  - concept: "INCONCLUSIVE (assurance result)"
    definition: "A distinct assurance verdict from PASS and FAIL, meaning the available evidence is insufficient to determine conformance either way; the absence of proof of violation must never be silently treated as equivalent to proof of conformance, nor may it be silently upgraded to FAIL -- retaining this category is an explicit statistical-discipline safeguard against both false confidence and false alarm"
  - concept: "Confidence≠Authority"
    definition: "A statistical or model confidence score (e.g. an AI output with Confidence=0.98) never by itself grants organizational Authority (=0 unless explicitly delegated) -- the two are orthogonal properties of a claim, and a high-confidence AI statement carries no automatic decision-making weight"
  - concept: "Authority(frequency)≠Authority(source) ('popularity≠truth')"
    definition: "The number of times a claim is repeated -- including by many independent AI agents -- does not increase its organizational authority; authority derives structurally from provenance (which authoritative source produced the claim), never from repetition count or consensus frequency"
  - concept: "The four-way authority decomposition"
    definition: "Epistemic Authority answers what knowledge/source is authoritative; Governance Authority answers what decision/rule is approved; Execution Authority answers who may perform an action; Observational Authority answers what actually happened -- four distinct authority types that must never be conflated when reasoning about who may do or decide what"
  - concept: "'KnowledgeOS is not an automatic controller' (the four-part constitutional separation)"
    definition: "Unlike classical automatic control (error→controller→automatic correction), governed engineering under KnowledgeOS follows error→finding→decision→authorized correction, formalized as: Assurance detects; Governance decides; Authorization permits; Engineering acts -- no stage may silently absorb the next stage's function"
  - concept: "The provisional L0-L5 epistemic ladder"
    definition: "A six-level knowledge-maturity scale -- L0 Raw Observation, L1 Evidence, L2 Analysis, L3 Derived Knowledge, L4 Validated Knowledge, L5 Governed/Authoritative Knowledge -- explicitly flagged as provisional in naming but architecturally intended to grade how far a piece of information has progressed toward authoritative status"
