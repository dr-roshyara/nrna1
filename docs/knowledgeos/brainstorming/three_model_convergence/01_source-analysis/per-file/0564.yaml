title: "LANDMARK & BRIDGE-CANDIDATE RESOLUTION: Goal≠Intention≠Decision≠Action≠Outcome Formalized to Close the Epistemic-to-Operational Gap — Refines (Does Not Duplicate) Step 15's Action Theory Into a Full Goal/Intention/Plan/Decision/Authorization/Execution/Outcome Type Hierarchy; Sārathi Redefined as 'Decision Support and Decision Governance Orchestrator'; Four Distinct Capabilities CanRecommend≠CanDecide≠CanAuthorize≠CanExecute; Eighteen Canonical D1-D18 Invariants; Opens Step 22 (Identity, Lineage, Provenance, Causality, and Traceability), Named One of the Last Foundational Steps Before a Complete Mathematical Closure Proof"
