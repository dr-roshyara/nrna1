    definition: "G=(GoalID,DesiredState,Purpose,Scope,Priority,Constraints,Deadline,Authority) — a desired state or outcome, richer than and distinct from a bare action statement or an IdealState"
  - concept: "Intention"
    definition: "Intention=CommitmentToGoalOrPlan — the system's or organization's current commitment to pursue a specific goal or plan, distinct from the goal itself"
  - concept: "Action (structured semantic contract)"
    definition: "A=(ActionID,Preconditions,Operation,ExpectedEffects,Resources,Constraints,RiskProfile,Reversibility,AuthorityRequirement)"
  - concept: "Decision record"
    definition: "D=(Goal,Alternatives,KnowledgeSnapshot,Evidence,Assumptions,Constraints,DecisionModel,ChosenAction,Authority,Timestamp,Rationale) — enabling decision reproducibility and explanation"
  - concept: "Sārathi (further refined definition)"
    definition: "Decision Support and Decision Governance Orchestrator — takes (K,Δ,G,𝒜,C,Risk,Policy) and produces DecisionRecommendation, or where authorized, Decision"
