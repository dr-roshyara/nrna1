defines:
  - concept: "The operation-to-information dependency matrix"
    definition: "A concrete, reusable bookkeeping artifact cross-tabulating the nine candidate KnowledgeOS operations (Add, Remove, Revise, Transform, Supersede, Merge, Split, Reject, Withdraw) against six categories of potentially-required information (Identity, Evidence, Provenance, Authority, Policy, History), with each cell marked ✓ (confirmed required), – (confirmed not required), or ? (genuinely unresolved). Most cells are honestly marked '?' rather than assumed, reflecting the actual state of the audit rather than a premature commitment. This directly operationalizes the previously vague question of whether a given concept (most importantly, provenance) 'belongs in' the knowledge state K: rather than debating the question abstractly, one can instead ask the concrete, checkable question of whether there exists some operation T for which ProvDep(T)=1, i.e. whether provenance information is genuinely required for that operation to be well-defined -- turning an open-ended ontological debate into a finite, operation-by-operation verification task"
refines:
  - concept: "0884's narrowed provenance REQUIRES-USER-DECISION question (does any mandatory operation distinguish histories solely by provenance?)"
    refinement: "OPERATIONALIZED into the concrete, tabulated dependency-matrix question ∃T∈𝒯:ProvDep(T)=1?, with Supersede and Merge specifically flagged as the two operations most likely to settle this question -- converting a philosophical framing into a finite, checkable verification task"
  - concept: "The equality/identity dependency chain traced since 0865/0870/0872/0882/0883"
    refinement: "EXTENDED with a concrete demonstration that Add and Revise cannot even be provisionally defined without first resolving identity/equality -- Revise in particular is shown to collapse into Remove+Add if identity is not preserved across the operation, giving a sharp, operation-level illustration of why equality cannot be postponed"
