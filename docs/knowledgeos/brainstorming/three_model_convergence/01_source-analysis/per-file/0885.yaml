title: "Step 256 -- Formal Operation Signature Registry: Delivers a Nine-Operation Registry With a Semantic-Role Taxonomy (Creation/Destruction/Modification/Derivation/Replacement/Combination/Decomposition/Epistemic-Disposition/Lifecycle-Disposition), Individual Sketches Showing Add Requires Identity/Equality, Revise Hinges on Whether Identity Is Preserved (Otherwise It Is Remove+Add), Supersede and Merge Identified as the Operations Most Able to Reveal Whether Provenance Is Operationally Essential, and a NINE-BY-SIX OPERATION-TO-INFORMATION DEPENDENCY MATRIX (Mostly Honest Unresolved '?' Entries) Operationalizing the Vague 'Does Provenance Belong in K?' Question Into 'Exists T: ProvDep(T)=1?' -- Opens Step 257's Formalization of the Four Most Discriminating Operations (Revise/Transform/Supersede/Merge), Promising 'the First REAL Congruence Experiment'"
