about: >
  "14 — Gap Update From the `025x` Algebra Seam," triggered by explicit user direction to a specific file,
  verdict: "`REFINED-STEP-288.md` was built on an incomplete evidence base. Six of its claims are corrected
  here; one is REFUTED." **Resolves the "25I.11"/"14-GAP-UPDATE-FROM-THE-025-ALGEBRA-SEAM.md" bridge
  candidate named in file 1036.**

  **§0 DELIVERS THE DISCIPLINED SELF-DIAGNOSIS**: "Step 288 was written without consulting the `025i-025z`
  seam" -- five specific dated files at `2026-08-28`, TWO DAYS BEFORE Step 246 and Step 260 -- naming `25I`
  (Knowledge Identity Algebra), `25J` (Semantic Equivalence/Refinement/Contradiction/Merge, "an EARLIER
  DRAFT of the Step 288 programme itself," verdicted PASS 72 seconds after `25I`), `25K`, `25S` (Identity/
  Entity Resolution/Same-As/Distinct-From/Knowledge Ātma), and `038`. **Names the root cause explicitly**:
  "This is not a failure of the corpus. It is a failure of my search. I searched for behavioural equivalence
  and found Step 260; I did not search for refinement, merge, entity resolution, or same-as... THIRD INSTANCE
  of my recurring error: SEARCHING FOR A PHRASE INSTEAD OF A CONCEPT."

  **§1 DELIVERS THE FILE'S HEADLINE REFUTATION**: "the register originates at Step 246" is REFUTED --
  `25I.11` states the non-interchangeability warning FIRST, over THREE relations (`≡_exact`, `≡_struct`,
  `≡_sem,C`), with the semantic relation ALREADY INDEXED BY CONTEXT `C`, further refined at `25J.6` to be
  indexed by BOTH context AND reference time (`SemanticEquivalent(A_1,A_2,C,t)`), observing at `25J.7` that
  `≡_sem^2025 ≠ ≡_sem^2026`. **STRUCTURAL CONSEQUENCE**: "`≡` is NOT ONE RELATION. It is a `(C,t)`-INDEXED
  FAMILY of relations. Every artifact in this programme -- 287, 288 included -- has treated it as a single
  relation." This fundamentally revises the state-level equality treatment tracked across dozens of files
  since file 0989.

  **§2 DELIVERS A GENUINELY MAJOR FINDING**: equality MAY NOT EVEN BE TRANSITIVE, and the corpus says so
  TWICE: `25J.27` ("we would also like transitivity, but this MUST BE CAREFULLY CONTROLLED because context-
  dependent semantic mappings can break naive transitivity"); `25S.6`/`25S.29`/`25S.30` (SameAs evidence "is
  NOT necessarily transitive," transitive closure "can propagate the error across a huge graph," naming the
  failure mode **`KnowledgeContamination`**). "Everything downstream that assumes a quotient -- including
  Step 260's `ℋ/≡_𝒯` and my own `≈_X` framing -- inherits this as a precondition." Delivers a disciplined
  self-catch: `≈_X`'s own transitivity is unaffected (constructed as a pullback, hence automatically
  transitive), "but that is exactly the point: `≈_X` is transitive because I constructed it that way, and
  the corpus's relation is not known to be. A property of my construction was being read as a property of the
  corpus's object. THIS IS THE SAME DEFECT TWO REVIEWERS CAUGHT IN `=_semantic`" -- a reflexive recognition
  of a recurring category error.

  **§3 delivers a three-level identity hierarchy** never previously registered: `EntityID≠KAID≠RecordID`
  (`25S.36`/`25S.43`), softening the already-tracked "`K_t` has no identity rule" (files 1006, 1035) to "a
  PROVISIONAL candidate exists (`KAID=Identity(CanonicalAssertion,Context)`), explicitly marked provisional,
  and was never ratified" -- plus two further separations: `SameState⇏SameEntity` and
  `SemanticEquivalent⇏SameEntity`.

  **§4 delivers a genuinely important correction**: equality decisions are NOT BINARY -- `25S.3` proposes a
  FOUR-VALUED codomain `{Same,Different,PossibleSame,Unknown}` for entity resolution, meaning "a procedure
  returning `Unknown` is total and decidable WITHOUT DECIDING EQUALITY" -- explicitly cross-referencing the
  already-tracked "negative-knowledge discipline" and "Step 224.11" ("absence of evidence should remain
  Unknown") as "two independent corpus loci, one rule."

  **§5 qualifies the already-tracked "columns 6 and 7 empty" claim**: the Level-7 governance PATHWAY IS
  specified (`25J.36/42`: `SemanticCandidate→GovernedValidation→AuthoritativeRelation`; `25J.49`:
  `Generation≠Validation≠Authority`, "one of the strongest principles in the entire architecture") -- "the
  Level-7 PATHWAY is specified; NO relation has been taken through it. Not the same claim as 'column 7 is
  empty.'" Also: `25J.41`'s 13-operation computability table rates semantic equivalence "computable but NOT
  DETERMINISTIC -- stronger and worse than my 'Level 2, no procedure.'"

  **§6 delivers a genuinely important correction to the already-tracked "K has no candidate structure at
  all" finding**: an ordering candidate DOES exist ONE LEVEL DOWN -- `25J.10` defines a PREORDER on
  assertions via entailment (`A_specific⇒A_general`), with PROVEN reflexivity and transitivity (`25J.27`),
  called "refinement" `⪰` (`25I.21`/`25J.8`) -- computable only relative to a version ontology `Ω` (`25J.11`).
  "`K` has no candidate order; `𝒜` has a DEFINED candidate preorder... which is materially different from
  'nothing at all.'"

  **§7 delivers TWO OPERATORS ABSENT FROM STEP 288 ENTIRELY**: (a) `Merge_K` with its own equality-RELATIVE
  invariants (`25J.44-47`: non-destructive INVARIANT; idempotent ONLY MODULO `≡`; commutativity/
  associativity explicitly NOT YET imposed/proven) -- "`Merge` is a SECOND operator whose invariants depend
  on Decision 3, alongside `δ`... The equality choice has a wider blast radius than Step 288 reported"; (b)
  a typed relation algebra `ℛ={Equal,Equivalent,Refines,RefinedBy,Contradicts,EvolvesTo,Independent}`
  (`25J.26`), seven typed edges between assertions (a different carrier from state/history equality
  relations), plus `TemporalEvolution≠Contradiction` and a domain-rule requirement for `Contradiction`.

  **§8 delivers a genuine ELEVATION of the already-tracked `id`/mutable-`e.state` contradiction repair**:
  it is no longer merely this reconstruction's engineering recommendation -- `25I.29-30` states the exact
  principle already, as a CORPUS PRINCIPLE ("`KnowledgeIdentity` is persistent; `KnowledgeState` evolves")
  now violated by a LATER construction -- "a governance matter, and a stronger finding than an engineering
  suggestion."

  **§9 delivers a genuinely major finding that the already-tracked `≈_X` (Σ-axis-subset) parameterization
  MAY NOT BE THE CORPUS'S ACTUAL RELATION AT ALL**: `25I.35` defines `≈_C` (context-relative, PURPOSE/
  POLICY-indexed, "equivalent for `MigrationPolicy_X`, not for `PatchCompliancePolicy_Y`") -- "these are NOT
  the same relation, and the corpus's is indexed by POLICY, not by axis subset. My 32-projection catalogue is
  a defensible construction; it is NOT ESTABLISHED to be the corpus's `≈`." Also delivers `25I.36`'s
  reframing of the entire equality-vs-sufficiency question: "Zero should not ask 'are these identical?' It
  should ask 'is the available knowledge sufficient?'" -- `Identity≠Equivalence≠Sufficiency`.

  **§10 DELIVERS A GENUINE SELF-RETRACTION WITHIN THIS VERY DOCUMENT**: originally claimed `Fold` supplies
  Step 260's missing quotient map (`H_1≡_𝒯H_2⟺Fold(H_1)=Fold(H_2)`) -- then explicitly retracts this, citing
  a still-earlier corpus refutation at "`258.11`" of exactly this naive relation, distinguishing it from the
  stronger, still-undemonstrated behavioural equivalence (`∀σ: F(σ(H_1))≡_K F(σ(H_2))`) -- "I conflated the
  naive relation with the strong one... `Fold`/`Replay` remain worth recording as a construction -- but as
  `~_F`, a relation the corpus names and REJECTS, not as a closure."

  **§11 delivers two missing layers** (`Representation`, `Assessment`) in the already-tracked `W--Ω-->O`
  observation model, with three load-bearing distinctions (`RepresentationIdentity≠ObservationIdentity`,
  `EvidenceIdentity≠AssertionIdentity`), and confirms the already-tracked `Qualify` gap is genuinely three
  days older than previously dated.

  **§13 delivers the definitive net-effect table on Step 288**: one claim REFUTED, seven CORRECTED/SOFTENED/
  WIDENED/RIVALLED/STRENGTHENED/RETRACTED. Closes: "Step 288's VERDICT stands: the equality problem is
  mapped, not solved. Its EVIDENCE BASE does not: six claims corrected, one refuted."

  **§12 delivers the disciplined evidence-status finding**: all of 25I/25J/25S is "self-verdicted PASS on
  ANALYTIC falsification tests... NONE IS EXECUTED... Every definition in this seam is marked by its own
  author PROVISIONAL... It raises no status to ESTABLISHED. It does show that several things I reported as
  ABSENT are PRESENT-BUT-UNRATIFIED -- a different verdict, and the honest one."

  **§15 explicitly lists what remains UNREAD** (`025k/l/m/o/t/v/w`, `038`, external-research reissues),
  flagging `025v` and `038` as "directly on-topic and unread. Recorded so this gap is not mistaken for
  coverage" -- a disciplined incompleteness disclosure.
