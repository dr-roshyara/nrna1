defines:
  - concept: "Assurance Graph"
    definition: "A graph-semantic model of KnowledgeOS's central knowledge structure (Intent→Decision→Knowledge→Rule→Implementation→Runtime→Evidence→Verification→Finding→Governance) that, unlike a generic knowledge graph, explicitly carries Authority, Evidence, TemporalValidity, EpistemicStatus, and Verification on its nodes and edges, making relationships trustworthy and explainable rather than merely descriptive; its physical persistence need not itself be a graph database"
  - concept: "Traceability strength (T0-T4)"
    definition: "A graded scale for how strongly a Decision→Implementation edge is evidenced: T0 no link, T1 textual reference, T2 explicit reference, T3 machine-linked, T4 verified — enabling a dashboard to distinguish weak from strong traceability rather than treating all links as equal"
  - concept: "Edge authority / evidence-backed edges"
    definition: "Relationships in the Assurance Graph (not only nodes) require provenance: an ownership or dependency claim between two nodes should itself be backed by Evidence, Source, and Status, so that the graph can explain why it believes a relationship holds rather than presenting an ungrounded assertion"
  - concept: "TraceabilityCompleteness (TC)"
    definition: "TC(D) = VerifiedRequiredRelationships / RequiredRelationships for a governed decision D; a high TC score can still mask an invalid decision if the specific missing relationship is critical (e.g. Authority), so completeness must always be paired with a criticality weighting rather than reported as a bare percentage"
  - concept: "Anti-hallucinated-topology safeguard"
    definition: "An AI agent's inference that two nodes are related (e.g. from name similarity) must be represented only as a CandidateRelationship, never adopted as a VerifiedRelationship or AuthoritativeRelationship, until it passes through Verification and, where required, Governance"
