defines:
  - concept: "Hindsight leakage"
    definition: "A governance/epistemic integrity failure that occurs when a later information state K_{t+1} -- one that was not part of the information set actually available at the time a decision Decision_t was made (K_{t+1}∉InformationSet_t) -- is used to evaluate or judge that earlier decision; formally HindsightLeakage=Use(K_{t+1},Decision_t) under that condition, and KnowledgeOS's architectural responsibility is to preserve enough temporal information (information-set boundaries, not just decision outcomes) to make such leakage detectable and preventable rather than silently normalized as 'obviously the decision-maker should have known'"
  - concept: "The two-function governance model E and G"
    definition: "The architecture separates two mathematically distinct functions: E (Epistemic), which transforms World+Evidence into a Determination -- answering 'what can we justifiably conclude?' -- and G (Governance), which transforms a Determination together with organizational Norms, Objectives, Constraints, and Authority into a Decision -- answering 'given what we know, what ought the organization decide?' -- with the critical property that G is not a deterministic function of the Determination alone: identical determinations can legitimately produce different decisions across different organizational contexts (objectives, risk tolerance, policy)"
  - concept: "'No semantic transformation may occur implicitly across bounded-context boundaries'"
    definition: "Each transition in the governed lifecycle chain (Determination→Decision, Decision→Authorization, etc.) must correspond to an explicit governance act, never an implicit or automatic promotion -- this is specifically named as the architectural defense against the characteristic AI-agent failure mode of collapsing 'evidence suggests X is safe' directly into 'therefore execute X,' skipping the required Determination→Governance→Authorization steps that a human organizational process would not skip"
refines:
  - concept: "0802's opening of Step 177 and its closing promise of the Decision=f(Knowledge,Values,Policy,Constraints,Objectives,Authority,Time) formalization"
    refinement: "DELIVERED IN FULL: the two-function E/G model, decision-as-constrained-optimization, the governance pipeline, and the Step 178 verdict boxing the final Decision=G(...)/Determination=E(...) formulation"
  - concept: "0793's/0797's/0802's repeated AIRecommendation≠GovernanceDecision and AI-as-participant discipline"
    refinement: "Given its most concrete, actionable form yet: the explicit worked failure-mode example ('evidence suggests the change is safe → therefore execute it') names precisely the reasoning pattern the discipline exists to prevent, and 'no semantic transformation may occur implicitly across bounded-context boundaries' generalizes the principle beyond AI specifically to any actor (human or AI) that might attempt to skip a governance step"
  - concept: "0802's second, distinct Gita Chapter 4 invocation opening this file (the ought/ought-not theme)"
    refinement: "Explicitly and self-consciously disciplined at §178.36: the corpus itself states 'without claiming that an ancient philosophical text is an enterprise architecture specification, we can use its conceptual distinction as a design lens' -- a rare, explicit moment of the corpus articulating its own analogy-not-identity discipline regarding its Gita source material, directly consistent with this reconstruction's own foundational epistemic mandate"
  - concept: "0797's Experiment F (a decision justified at t_1 remains justified after its knowledge basis is later invalidated) and the arc's broader temporal-justification discipline (0795, 0799, 0800)"
    refinement: "Given a sharper, more precisely named formal counterpart: where the earlier files established that later knowledge does not retroactively invalidate an earlier decision, this file names the SYMMETRIC failure mode -- using later knowledge to retroactively judge or fault an earlier decision as though it were available at the time -- as 'hindsight leakage,' a new and more general concept than the arc had previously articulated"
