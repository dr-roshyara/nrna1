about: >
  Directly continues 0802, opening "we now cross the most important boundary in the architecture," boxed
  **`What is the case? ≠ What should we do?`** -- "the bridge between the Epistemic and Governance
  domains."

  **§178.1-178.3 delivers the rejection of the first hypothesis** `Decision=f(Knowledge)`: identical
  epistemic states across two organizations (`K_A=K_B`) can legitimately yield different decisions given
  different objectives (`Objective_A=CostReduction` vs. `Objective_B=MaximumStability`), boxed **"knowledge
  does not determine decision."** Delivers the expanded formula
  `Decision=f(K,Policy,Objective,Constraint,Risk,Authority,Context)` and **the architecture's two
  separated functions**: `E: World+Evidence→Determination` (epistemic) and `G: Determination+Norms+
  Objectives+Constraints+Authority→Decision` (governance).

  **§178.4-178.9 delivers the epistemic-question/governance-question split** ("what can we justifiably
  conclude?" vs. "given what we know, what ought the organization decide?"), the **`Ought(Action|Context)`
  operator**, and the caveat that governance is not arbitrary -- it "itself has invariants"
  (RequiredEvidence/RequiredAuthority/PolicyCompliance/ConflictOfInterestCheck/ScopeCompliance).

  **§178.10-178.13 delivers `DecisionCorrectness≠DecisionLegitimacy`** (a decision can later prove a bad
  choice while having been legitimately made -- `Decision=Proceed` followed by `Outcome=Failure` does not
  imply `DecisionWasIllegitimate`), a physician-treatment statistical analogy for evaluating decisions
  against their contemporaneous `InformationSet_{t_1}`, boxed **"DecisionQuality(t) must be evaluated
  relative to the appropriate information and policy state at t,"** and **the novel formal concept
  "hindsight leakage"**: `HindsightLeakage=Use(K_{t+1},Decision_t)` when `K_{t+1}∉InformationSet_t` --
  explicitly named as requiring KnowledgeOS to "preserve enough temporal information to prevent accidental
  hindsight reasoning."

  **§178.14-178.18 delivers decision provenance** (`Decision=⟨Determination,Policy,Objective,Constraints,
  Authority,Time⟩`, plus optionally `AlternativesConsidered`, explicitly not requiring a full transcript --
  "preserve enough information to understand why the decision was legitimate at the time"), a worked
  three-alternative example (`Considered(A_1,A_2,A_3)`, `Rejected(A_1)` because of `Risk`), and **"decision
  is a transformation, not merely a status"** (avoid modeling decision as bare `status=APPROVED`).
  Delivers **`Approval≠Authorization`** (Architecture Board approval does not automatically mean
  production-change authorization) -- "this distinction prevents governance layers from collapsing."

  **§178.19-178.22 delivers `Facts and norms have different epistemic origins`**, boxed: an empirical
  proposition ("the server has 31GB RAM") is evaluated against evidence, while a normative proposition
  ("production changes require Architecture Board approval") "derives from organizational authority," not
  observation. Delivers **three distinct meanings of "valid"** (`Valid(K)` epistemic, `Valid(D)`
  governance, `Valid(X)` operational -- "not the same predicate"), explicitly warning against a generic
  `isValid=true` in favor of separate semantic predicates
  (`EpistemicallySupported`/`GovernanceCompliant`/`Authorized`/`ExecutionConformant`).

  **§178.23-178.27 delivers decision-as-constrained-optimization**: `a*=argmax_{a∈A}U(a|K,C,P)` subject to
  `Constraints(a)=true`, explicitly disclaimed as a mathematical model, "not... every real governance
  decision literally runs an optimization algorithm." Demonstrates via `U_cost` (favoring migration) versus
  `U_availability` (favoring postponement) why `K` alone cannot determine the action. Delivers **`Authority
  as itself a constraint`**: `Authority(a,Action)=false⇒Action∉A_allowed`, "capability is not enough."
  Delivers **the governance pipeline**, boxed: **`Knowledge→ApplicablePolicies→Constraints→Alternatives→
  Evaluation→Decision→Authorization`**, "substantially more rigorous than `Knowledge→Approval`."

  **§178.28-178.30 delivers the explicit acknowledgment that governance may choose non-optimal actions**
  (political considerations, strategic commitments, fairness, legal obligations, ethics, risk appetite),
  crystallized into the architectural invariant (rather than a literal optimization requirement), boxed:
  **"a legitimate decision must be explainable against its applicable governance context."** Delivers
  **`DecisionProvenance≠KnowledgeProvenance`** (both required) and **the complete eight-stage provenance
  chain**, boxed: **`Observation→Evidence→Claim→Determination→Decision→Authorization→Execution→Outcome`**.

  **§178.31-178.33 delivers the file's central AI-safety invariant**, boxed: **"no semantic transformation
  may occur implicitly across bounded-context boundaries"** -- `Determination=Feasible` must not silently
  become `Decision=Approved`; `Decision=Approved` must not silently become `Authorization=Granted`.
  **Explicitly names the precise AI-agent failure mode this prevents**: "an AI agent is particularly prone
  to collapsing these layers. It might reason: evidence suggests the change is safe → therefore execute it.
  That is precisely what the architecture must prevent" -- delivering the correct chain
  `Evidence→Determination→Governance→Authorization→Execution`, with the agent permitted to participate at
  each step "according to its role" but never to silently collapse them. Re-delivers
  **`AIRecommendation≠GovernanceDecision`** as "another example of separating Epistemic/Advisory from
  Normative/Authoritative" -- both an AI's `RecommendedAction=A` and Governance's `Decision=B` can be
  simultaneously valid artifacts even when they differ.

  **§178.34-178.35 delivers worked non-implication examples**: `Feasible⇏ShouldProceed`;
  `Determination=Risky` does not mathematically force `Decision=Reject` (governance may accept risk under
  explicit authority) -- crystallized into the correct logical relation: not `Knowledge⇒Decision`, but
  `Knowledge→DecisionBasis`, with `Decision=GovernanceFunction(DecisionBasis,Norms,Constraints,Authority)`.

  **§178.36 delivers an explicit, notably self-disciplined methodological statement about the corpus's own
  use of the Gita**: **"without claiming that an ancient philosophical text is an enterprise architecture
  specification, we can use its conceptual distinction as a design lens"** -- "knowing what is the case"
  versus "knowing what ought to be done" as different forms of reasoning, mapped onto the Epistemic/
  Governance separation, "precisely the kind of cross-domain insight our experiments are intended to
  uncover."

  **§178.37 delivers the Step 178 verdict**: `Decision=f(Knowledge)` explicitly rejected, replaced with the
  boxed two-function model **`Decision=G(Determination,Policy,Objectives,Constraints,Risk,Authority,
  TemporalContext)`** with **`Determination=E(Evidence,Method,Context,TemporalState)`**, crystallized as
  the boxed capstone: **"epistemic reasoning establishes what can be concluded; governance establishes what
  the organization chooses or is permitted to do."**

  **Closes opening "Step 179 — The 'Who Is Allowed to Say What?' Experiment,"** moving from "what
  transforms into what" to "who is allowed to produce each" -- proposing a formal relation system
  `Produces(a,x)`, `Owns(domain,x)`, `MayDetermine(a,x)`, `MayDecide(a,x)`, `MayAuthorize(a,x)`, testing
  whether these can be safely collapsed, with **an explicit stated prediction** (unusual for this arc's
  otherwise open-ended experiment framings), boxed: **"the person or AI capable of producing a
  determination is not necessarily the authority allowed to make the decision."** No actual repository
  implementation occurs within this file itself; every function, tuple, and invariant remains a conceptual
  specification pending Step 179's ownership/authority formalization.
