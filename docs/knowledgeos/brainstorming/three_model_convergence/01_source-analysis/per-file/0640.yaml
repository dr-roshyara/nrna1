defines:
  - concept: "The mutable live-knowledge-reference hazard"
    definition: "If a decision aggregate holds a mutable reference to 'current knowledge' rather than an immutable, versioned snapshot, a subsequent knowledge update can cause the already-created decision to silently observe the new knowledge state instead of the state that actually existed when it was made, corrupting historical decision integrity"
  - concept: "Authorization TOCTOU race"
    definition: "A decision's authorization is checked and found valid at time t_1, expires at t_2, and execution proceeds at t_3 relying on the stale t_1 check rather than revalidating — the corrected invariant requires Execute(A,t)⇒AuthorizationValid(A,t), verified at the actual point of execution, not merely at an earlier check"
  - concept: "The KnowledgeOS Compositionality Principle (provisional)"
    definition: "If (1) each context preserves its local invariants, (2) every cross-context interaction uses an explicit contract, (3) semantic translations preserve required meaning, (4) immutable/versioned references are used for historical state, (5) authorization is valid at the point of side effect, and (6) integration failures are represented explicitly, then LocalCorrectness+ContractCorrectness⇒RelevantGlobalCorrectness — explicitly a design hypothesis to continue testing, not a proven theorem"
  - concept: "EvidenceGraph vs. ExecutionGraph"
    definition: "Two complementary but non-identical explanatory graphs: the EvidenceGraph answers why a claim is believed (its epistemic derivation), while the ExecutionGraph answers what operationally happened (the decision/authorization/action/outcome chain) — they intersect but must not be blindly merged into one"
