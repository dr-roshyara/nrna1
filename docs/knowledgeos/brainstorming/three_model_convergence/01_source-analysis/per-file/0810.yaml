defines:
  - concept: "The three-state epistemic formalism"
    definition: "Established(E⊢P): the preserved evidence directly and sufficiently supports proposition P. Inferable(E,A⊢P): P is not directly established but can be derived from the preserved evidence E together with explicit, stated assumptions or inference rules A. Unknown(E⊬P): the preserved information is insufficient and no justified inference closes the gap. These are not degrees of confidence on a single scale but qualitatively distinct epistemic categories that must never be silently collapsed into one another -- particularly, an AI-generated inference must never be presented or stored in a way indistinguishable from an established historical fact"
  - concept: "Epistemic debt"
    definition: "Analogous to technical debt: when an important decision or proposition lacks recorded rationale (Rationale=Unknown), the organization has incurred a form of epistemic debt proportional to how important the missing information is, how recoverable it might still be, and how much is actually missing (conceptually Importance×Recoverability×Missingness) -- explicitly not every unknown constitutes debt: a genuinely Indeterminate unknown (fundamentally unknowable) carries none, while an important but merely NotRecorded unknown may carry substantial debt; this remains an explicitly unvalidated research model, not a production metric, pending further experimentation"
  - concept: "GovernanceStatus≠EpistemicCompleteness"
    definition: "Whether a decision was legitimately and properly authorized (its governance/historical validity) is a completely separate question from whether the reasoning behind it can now be fully reconstructed (its epistemic completeness) -- a decision can simultaneously be Valid (properly authorized at the time) and PoorlyDocumented (its underlying rationale was never adequately recorded), and KnowledgeOS must never conflate an incomplete evidence trail with an invalid or illegitimate decision, extending 0807's GovernanceAuthority≠EpistemicAuthority into the temporal/completeness dimension specifically"
refines:
  - concept: "0809's opening of Step 184 (closing Step 183) and its seven candidate responses to a recorded reasoning gap"
    refinement: "DELIVERED: the three-state formalism, six named types of unknown, the reconstruction-with-gaps model explicitly displaying holes, and the Step 184 verdict naming epistemic gap a first-class state -- effectively selecting and formalizing option 7 ('preserve the gap permanently') from 0809's list as the governing answer, combined with option 2 (mark unknown) via the six-way unknown-type taxonomy"
  - concept: "0805's 'hallucination boundary' (¬Evidence(C)⇏Evidence(¬C)) and 0802's AI-hallucination-prevention discipline"
    refinement: "Extended into a third, distinct hallucination-prevention mechanism specifically targeting historical-reconstruction inference: the AI agent's contract's three named forbidden transitions (Unknown↛Established, Hypothesis↛HistoricalFact, Recommendation↛Decision), explicitly claimed sufficient to 'eliminate many classes of AI hallucination' -- a third member of the arc's growing family of concrete, named hallucination-prevention invariants"
  - concept: "0807's GovernanceAuthority≠EpistemicAuthority and the broader Epistemic/Governance separation family"
    refinement: "Extended with a new orthogonal pair specifically about completeness/documentation rather than authority: GovernanceStatus≠EpistemicCompleteness, explicitly named 'a very strong conceptual extension' of the established principle"
  - concept: "The arc's repeated Unknown≠False family (0802, 0805, 0809) and 0805's four-situation conflict taxonomy"
