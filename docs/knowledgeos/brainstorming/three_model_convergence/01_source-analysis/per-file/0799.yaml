defines:
  - concept: "Snapshot versus live reference"
    definition: "A reference to an upstream domain object (e.g. KnowledgeId=4711) is insufficient for grounding a consequential decision if the referenced object's meaning can change after the reference is taken -- the architecture must instead use either an explicit version identifier (KnowledgeVersion=4711:v3) or an immutable snapshot (KnowledgeSnapshot_t1) so that re-evaluating the reference later reproduces the same meaning the decision was actually based on, rather than silently picking up whatever the object has since become"
  - concept: "The epistemic tuple D=⟨Conclusion,EvidenceState,Method,Context,Time,Actor,Version⟩"
    definition: "A determination is not adequately represented by its bare conclusion (e.g. 'non-compliant') alone; a statistically and epistemically defensible determination must also carry the evidence state it was computed against, the method/rule applied, the context, the time it was made, the actor or mechanism that produced it, and a version identifier -- this does not require storing an AI's private internal reasoning or chain-of-thought, only an auditable justification structure sufficient for reconstruction and challenge"
  - concept: "Identifiability of historical reconstruction (previewed for Step 175)"
    definition: "A statistical/mathematical criterion for whether an architecture's current-state representation is sufficient to reconstruct its history: reconstruction is identifiable only if no two distinct histories H_1≠H_2 could have produced the same current state (Current(H_1)=Current(H_2)); if such indistinguishable histories exist, the current state alone cannot determine which history actually occurred, meaning the architecture must preserve additional lineage/provenance beyond current state wherever historical reconstruction is required"
