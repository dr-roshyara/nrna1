  - concept: "Five distinct temporal concepts beyond a single Time field: TemporalContext, ObservationTime, AssessmentTime, DecisionTime, ValidityPeriod"
  - concept: "Explicit rejection of 'higher/lower knowledge' terminology as introducing an unintended value judgment, replaced with neutral abstraction-level/scope/domain/dimensional-layer/contextual-layer/observational-layer vocabulary"
