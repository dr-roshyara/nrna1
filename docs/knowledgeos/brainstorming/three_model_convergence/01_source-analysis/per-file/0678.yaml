defines:
  - concept: "Failure⇏SemanticCorruption"
    definition: "The occurrence of a system failure (crash, network partition, message loss) must never, by itself, be permitted to produce a state the mathematical model considers impossible; failure and recovery are themselves transitions in the state space, bound by the same invariants as ordinary operation"
  - concept: "Event durability≠Event correctness"
    definition: "An event-sourced system's guarantee that recorded events survive and can be replayed says nothing about whether those events were themselves valid; faithfully replaying an invalid event (e.g. an unauthorized approval) reproduces the invalid state just as reliably as a valid one, requiring explicit event validation (Validate(E,S)⇒Append(E)) before acceptance, not merely durable storage"
  - concept: "RecoveredState≠AutomaticallyCurrentState"
    definition: "Restoring system state from a backup or checkpoint taken at time t_0 establishes knowledge only up to t_0; the system must not automatically label itself as reflecting current (t_1>t_0) state until post-recovery synchronization or reconciliation with surviving authoritative sources has occurred"
  - concept: "Recovery should be monotonic"
    definition: "When recovering from a backup or checkpoint, if stronger, more current, or more authoritative knowledge survives from another source, recovery must not silently overwrite or downgrade that knowledge with the weaker value found in the backup; recovery should preserve the strongest trustworthy evidence available across all surviving sources, not blindly trust the restored snapshot"
  - concept: "Never infer completion from absence (recovery-specific instance)"
    definition: "If a workflow step's outcome is unknown because a failure occurred before its result could be observed (e.g. a network failure before receiving step D's response), the correct status is Unknown, not False — absence of a confirmed result is not evidence that the step failed, extending the corpus's three-valued epistemic logic into partial-workflow-failure representation specifically"
