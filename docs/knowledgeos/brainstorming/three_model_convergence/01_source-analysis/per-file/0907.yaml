defines:
  - concept: "The canonical operation layers 𝒪=𝒪_T∪𝒪_E∪𝒪_Q∪𝒪_G∪𝒪_R"
    definition: "A replacement for the earlier undifferentiated O_core formula, separating KnowledgeOS's total operation inventory into five genuinely distinct mathematical categories by role rather than by domain topic: 𝒪_T (state transformations -- operations like Assert, Retract, Supersede, Merge, Split, LinkEvidence that can produce a new knowledge state K'); 𝒪_E (evidence operations -- concerned with evidence qualification and assessment, distinct from state transitions); 𝒪_Q (observational/query operations -- Query, Compare, Trace, Explain, which read but never alter K); 𝒪_G (governance operations -- Authorize, Approve, Reject, ChangePolicy, which gate or record governance decisions without themselves being epistemic transformations); 𝒪_R (representation operations -- Serialize, Deserialize, Save, Load, which manipulate K's encoding without changing its semantic content). Only 𝒪_T (further narrowed to a genuinely minimal primitive subset) belongs to the semantic state-transition kernel proper; the other four layers exist and matter but do not define the mathematical semantics of the knowledge state itself"
  - concept: "The formal operation-minimality criterion"
    definition: "A precise, testable criterion for whether a candidate operation o belongs in the primitive transformation kernel 𝒯_K: o is primitive if and only if there exists some mandatory required distinction or capability r∈R_mandatory that is NOT contained in the closure of the transformation set with o removed (𝒯_{-o}=𝒯_K∖{o}) -- formally o is primitive⟺∃r∈R_mandatory:r∉Closure(𝒯_{-o}). This is structurally identical to the K-component Deletion Test used throughout files 0902-0904, now applied one level up to the operation universe itself, and provides the exact experimental protocol (the counterfactual K^{-x} and 𝒯_{-o} constructions) that Step 278 is explicitly tasked with actually executing"
