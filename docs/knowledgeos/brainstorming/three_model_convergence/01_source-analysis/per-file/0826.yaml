defines:
  - concept: "The five basic epistemic states (𝔼_5)"
    definition: "A minimum-viable epistemic status vocabulary richer than Boolean truth: Supported (evidence and rules justify accepting the proposition), Refuted (sufficient evidence against it), Unknown (information insufficient to determine either way), Ambiguous (multiple hypotheses remain compatible with the available evidence, i.e. genuine underdetermination rather than mere lack of information), and Conflicted (evidence exists on both sides and disagrees, which is a distinct state from simply not knowing) -- each state carries a precise semantic definition and must not be treated as an arbitrary status enum"
  - concept: "Conservation of uncertainty"
    definition: "An extension of Step 197's conservation-of-lineage principle into the epistemic domain: uncertainty present in the premises of a reasoning chain (A→B→C) must not silently disappear as it propagates through transformations or derived conclusions without an explicit justification for why it was resolved -- not necessarily tracked as an exact numerical quantity in every case, but semantically: a system must not silently produce a certain conclusion from uncertain premises"
  - concept: "No silent Uncertain→Certain conversion (I68)"
    definition: "The architecture's central uncertainty-governance boundary: an epistemic state assessed as Uncertain may only become AcceptedForAction (never silently 'Certain') through an explicit, rule-governed, and traceable transition -- such as a declared policy threshold (e.g. P(H|E)≥0.95 triggers CandidateAcceptance) -- so that any elevation from uncertainty to actionable status is a visible governance decision rather than an invisible mathematical or software default"
