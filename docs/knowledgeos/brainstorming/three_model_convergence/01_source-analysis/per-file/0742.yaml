defines:
  - concept: "Structural vs. Behavioral conformance"
    definition: "Structural conformance asks whether the code has the correct architectural shape (dependency direction, module ownership, adapter isolation, contract placement) -- verifiable by static analysis; Behavioral conformance asks whether the running system actually behaves according to the architecture (authorization cannot be bypassed, invalid transitions rejected, verification requires evidence) -- verifiable only by exercising the running system; both dimensions are required, since a system can have the correct static shape while still permitting a forbidden runtime path, or vice versa"
  - concept: "'No silent suppression'"
    definition: "An architecture violation must never be made to disappear from CI output by a developer simply disabling or ignoring the specific check (e.g. `ignore ARCH-DOM-001`); any suppression of a blocking finding must correspond to an actual governed, scoped, time-bounded exception approved through the governance process, never an ad hoc local configuration change"
  - concept: "'KnowledgeOS is now recursive' (bounded)"
    definition: "The same architecture-rule/checker/evidence/verification mechanism KnowledgeOS uses to govern the engineering systems it observes can be applied to KnowledgeOS's own implementation, making the platform capable of verifying itself -- but this self-application is deliberately bounded to Architecture→Implementation→Runtime rather than allowed to recurse into unbounded meta-layers"
