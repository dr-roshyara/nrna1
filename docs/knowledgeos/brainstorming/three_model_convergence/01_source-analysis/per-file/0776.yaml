defines:
  - concept: "Capability≠Authority"
    definition: "That an actor (human or AI agent) possesses the technical ability to perform an action (e.g. an API endpoint it can call) does not by itself establish that it is normatively permitted to perform that action -- capability and authority are independent properties, and conflating them is a distinct, stronger error than merely conflating decision with authorization, since capability may exist entirely outside any decision process at all"
  - concept: "The non-scalar Doubt model"
    definition: "Epistemic doubt should not be represented as a single scalar (e.g. the complement of a confidence score), but as a function of several qualitatively distinct underlying conditions -- unresolved conflict between valid claims, missing information, genuine ambiguity, insufficient evidence, and competing applicable frames -- each of which may call for a different resolution strategy, so collapsing them into one number discards information needed to actually resolve the doubt"
