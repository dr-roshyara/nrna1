    refinement: "Deepened with Discrepancy≠Deficiency (a genuinely new distinction not present in 0485), a directional K->I framing sharper than mere non-symmetry, a renaming of Δ_E to Δ_K, and a further split of Zero into a downstream Diagnose stage distinct from the prior Compare stage"
  - concept: "0472/0480's Coherence≠Truth discipline (Q8) and the general contradistinction between predicates and metrics"
    refinement: "Applied to reframe Coherence Violation as a Finding produced by a predicate Coherent(...), never merely another numeric discrepancy dimension"
  - concept: "0482's policy-parameter discipline (quantitative thresholds are policy parameters, not mathematical truths)"
    refinement: "Extended to Severity's value range itself: the choice of scale (ordinal vs. [0,1]) is a policy decision, not a mathematical necessity"
  - concept: "0485's empty-discrepancy boundary (Δ_t=∅⇏Truth/Completeness)"
    refinement: "Extended with a new, logically independent predicate Sufficient/Adequate(S_t,P), explicitly decoupling adequacy-for-purpose from discrepancy emptiness in both directions"
