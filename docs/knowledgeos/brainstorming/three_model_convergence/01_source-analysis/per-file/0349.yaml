  - concept: "Key distinction: Architecture Stable (true) vs. Core Semantics Frozen (not yet true) -- named concepts still lacking settled ownership/type at the time of writing: Domain Object, Context, Information, Epistemic State, Relations, Transition, valid(), supports(), infers()"
