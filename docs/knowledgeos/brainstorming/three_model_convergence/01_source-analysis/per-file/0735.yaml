defines:
  - concept: "The anti-hallucination architecture"
    definition: "An API design discipline that structurally prevents an agent from manufacturing authoritative state: there is no endpoint through which a caller can directly set a verdict, claim status, or verification result; every such state can only be produced by invoking the deterministic mechanism that owns it (e.g. RequestVerification triggers an actual checker, rather than accepting a caller-supplied PASS/FAIL value)"
  - concept: "API design = Governance enforcement boundary"
    definition: "The set of operations an API exposes determines which state transitions are structurally possible at all; because of this, API design is not a purely technical interface decision but a governance decision -- it is where architectural invariants either become enforceable or are silently left open to bypass"
  - concept: "ActionFingerprint / ContextFingerprint"
    definition: "A cryptographic hash of an action's exact parameters (or the context it was evaluated against) that an authorization binds to, ensuring the authorized action and the executed action are provably identical -- preventing a scenario where an action is authorized under one set of parameters (e.g. a staging environment) but silently executed under different, unauthorized parameters (e.g. production)"
  - concept: "Delegation invariant"
    definition: "An agent acting on behalf of a human or another principal can never possess more authority than that delegating principal actually holds -- Authority_agent⊆Authority_delegator, subject to applicable policy -- preventing delegation from becoming a privilege-escalation path"
