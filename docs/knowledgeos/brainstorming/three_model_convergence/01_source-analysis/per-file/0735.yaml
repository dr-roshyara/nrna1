about: >
  Opens with `API≠Domain Model`, `API≠Database Schema` -- the API exposes capabilities and governed
  interactions, not internal structures -- and delivers API domains organized around capabilities
  (Knowledge/Governance/Context/Assurance/Evidence/Agent/Action/Authorization), never around raw database
  tables. Delivers the Context API as "the most important initial API... the principal interface between
  KnowledgeOS and AI agents," with a full conceptual request/response schema
  (`ContextRequest{traceId,agentId,taskId,subject,scope,requestedAt,purpose}` →
  `ContextPackage{contextId,generatedAt,validUntil,governance,knowledge,rules,evidence,findings,
  permissions,provenance}`), Context provenance (every element traceable to source/reason/authority/
  validity), and **Context minimization**: "minimum sufficient governed context," explicitly not "maximum
  available context," improving reasoning, performance, security, and explainability. Delivers the
  appropriately humble "why we should not freeze REST yet" (`REST vs. GraphQL vs. gRPC` deliberately left
  open; "the stable architectural decision is: a governed Context capability must exist. Protocol is an
  implementation decision"), directly extending 0705's/0716's technology-independence discipline into
  protocol selection specifically.

  Delivers the Agent API (`getContext, getKnowledge, getEvidence, requestVerification,
  createRecommendation, requestAction, getActionStatus`), Agent registration and the AgentType-vs-
  AgentInstance distinction, and Agent capability declaration explicitly distinguished from permission
  (`MayPerform=DeclaredCapability∧Policy∧Principal∧Scope∧Context`). Delivers the Verification, Evidence,
  Governance, and Action APIs, with the explicit domain-operations-not-field-updates principle stated
  cleanly for the first time: `ActivateDecision` is "architecturally preferable to
  `UpdateDecision(status="effective")`" -- a precise API-design rule directly preventing arbitrary state
  mutation. **Delivers the explicit warning against a direct execution endpoint** ("we should be very
  careful with an API such as `POST /execute` because it collapses Request and Execution"), reaffirming
  `RequestAction→Authorization→Execution` at the API-shape level.

  **Delivers `ActionFingerprint`/`ContextFingerprint`, a genuinely valuable cryptographic authorization-
  binding mechanism** (§148.31-148.34), directly extending 0726's TOCTOU principle into a concrete,
  implementable security control: an authorization can bind to `Hash(ActionDefinition)`, so that
  `AuthorizedAction≠ModifiedAction` -- explicitly motivated by a worked attack scenario ("authorize: upgrade
  Nexus in staging; execute: upgrade Nexus in production... could theoretically happen if the implementation
  is poorly designed"). Delivers the High-risk action rule: "authorization must bind to Action+Context+
  Scope."

  Delivers CI/CD explicitly positioned as a symmetric consumer alongside agents (`GetApplicableRules,
  RunVerification, RegisterEvidence, GetFindings`), with the precise statement "KnowledgeOS should not
  become an 'AI-only' system" -- a valuable scope-broadening clarification not previously stated this
  explicitly. Delivers Engineering adapters/port contracts (a worked `NexusPort` interface) and "no adapter
  leakage" reconfirmed at the API-implementation level.

  **Delivers the Principal-vs-DelegatedBy distinction and the Delegation invariant**, a precise security
  principle extending 0728's human-delegation discussion into a formal constraint: "an agent cannot acquire
  more authority through delegation than the delegating principal possesses" --
  `Authority_agent⊆Authority_delegator`, subject to policy. Delivers API-audit fields
  (`RequestID/Principal/TraceID/Timestamp/Operation`) and API idempotency via `IdempotencyKey`, worked
  through a concrete retry-after-lost-response scenario, and a semantic API error-code catalog
  (`CONTEXT_EXPIRED, AUTHORIZATION_DENIED, RULE_NOT_APPLICABLE, EVIDENCE_UNAVAILABLE,
  ACTION_ALREADY_EXECUTED, INVALID_STATE_TRANSITION`), extending 0734's failure-reason taxonomy.

  **Delivers the Capability-Contract-vs-CRUD-Contract principle, worked through three sharp, concrete
  weak/strong API-design examples** (§148.54-148.57): weak `PATCH /actions/42{status:"AUTHORIZED"}` vs.
  strong `AuthorizeAction(42)`; weak `POST /verification{status:"PASS"}` vs. strong
  `ExecuteVerification(ruleId,subject)` ("the verdict is produced, not supplied by the caller"); weak
  `POST /claims{verified:true}` vs. strong `RegisterEvidence(...)+VerifyClaim(...)` ("verification becomes
  a domain operation"). **Delivers the file's most significant conclusion — "this is the anti-hallucination
  architecture"** (§148.58-148.59): "the platform should make it structurally difficult for an agent to
  manufacture authoritative state" -- `Agent↛SetClaimVerified(true)`; instead
  `Agent→RequestVerification→DeterministicChecker→Verification` -- with an API trust-hierarchy diagram
  (`Agent assertion=LOW → Candidate knowledge → Evidence → Deterministic verification → Governed
  state=HIGH`). This directly converts the reconstruction's longstanding "AI collapses inference into
  authority" governance principle into a concrete, structural API-shape decision (deliberately omitting any
  verdict-setting endpoint) rather than leaving it as a stated policy alone -- among the most directly
  implementable expressions of that principle in the entire reconstruction.

  **Delivers "the API is therefore part of governance," a genuinely important architectural conclusion**
  (§148.60): "API design determines: which state transitions are structurally possible... API design =
  Governance enforcement boundary" -- elevating API design from a purely technical interface concern into
  a first-class governance mechanism, directly consolidating the file's entire preceding discipline into one
  precise capstone statement.

  **Delivers the Minimal KnowledgeOS v1 API, a concrete, directly buildable API surface scoped specifically
  to the Golden Trace**: seven capability groups (Context: `GetGovernedContext`; Assurance:
  `RequestVerification, GetVerification`; Evidence: `RegisterEvidence, GetEvidence`; Agent: `CreateTask,
  CreateRecommendation`; Action: `RequestAction, GetAction`; Authorization: `EvaluateAuthorization`;
  Execution: `ExecuteAuthorizedAction, GetExecution`) -- "this is enough to prove the architecture." Delivers
  "do not build the entire API catalog first" (explicitly rejecting "150 endpoints before the first
  vertical slice works" in favor of `GoldenTrace→MinimalContracts→ReferenceImplementation`, then expand),
  an API acceptance test tracing the full operation sequence with `TraceID` requirement, and the reconfirmed
  Claude/Codex compatibility test (identical sequence, only the agent adapter differs).

  **Delivers `API-001` through `API-008`, eight new numbered API architecture invariants** cleanly
  synthesizing the file's discipline: external consumers cannot directly mutate authoritative domain state;
  a verification verdict is produced by the assurance mechanism, never supplied by an untrusted caller; a
  material action cannot bypass authorization; every material operation has trace/correlation identity;
  external system models do not cross the port/adapter boundary; agent capability does not imply execution
  authority; authoritative state transitions occur through explicit domain operations; and graph/search
  projections are not authoritative mutation interfaces (explicitly reconfirming that clients must not
  treat the graph as master state).

  Delivers the complete contract architecture diagram (the fullest single API-to-execution flow diagram in
  the reconstruction) and Step 148's verdict: "agents consume governed capabilities; they do not manipulate
  KnowledgeOS state directly... the first API does not need to be large. It needs to be semantically
  correct."

  **Closes by opening "Step 149 — Persistence & Data Architecture,"** promising to address where state
  actually lives and which storage mechanism is authoritative for which information type (Transactional
  State/Evidence/Graph/Search/Event History/Agent Memory), explicitly rejecting "the common mistake of
  choosing one database for everything" in favor of "a clear polyglot persistence boundary, while retaining
  one authoritative transactional model per bounded context" -- a natural, well-motivated continuation
  directly building on 0728's/0733's prior persistence-category work. No actual code execution, repository
  inspection, or verified filesystem/architecture claim reported anywhere in this file; every API contract,
  invariant, and worked example remains a target specification, though the Minimal v1 API is directly
  buildable and scoped precisely to the already-specified Golden Trace.
