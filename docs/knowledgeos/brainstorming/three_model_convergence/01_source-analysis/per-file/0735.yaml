    refinement: "Converted from a stated policy into a concrete, structural API-shape decision: deliberately omitting any endpoint that would let a caller directly set a verdict or claim status"
  - concept: "0726's TOCTOU principle"
    refinement: "Extended into a concrete cryptographic mechanism (ActionFingerprint/ContextFingerprint binding) preventing authorization-to-execution parameter drift"
  - concept: "0728's human-delegation discussion"
