title: "Step 171 -- The Authority-Responsibility-Evidence Matrix (MAJOR SYNTHESIS MILESTONE, delivers 0795's promised governance test): Five Distinct Roles (Initiator/Producer/Verifier/DecisionMaker/Executor/AccountableOwner) and Five Orthogonal Predicates Identity≠Capability≠Responsibility≠Authority≠Accountability -- Delivers the Full Transition-Matrix Table, the PromotionRule(S_i,S_{i+1}) Formalism, Normal-vs-Emergency-Path Separation, Contextual Independence (TechnicalIndependence/OrganizationalIndependence/EpistemicIndependence), and the Transition Contract Valid(T)=Preconditions∧EvidenceSufficient∧AuthorityValid∧TemporalConstraints∧VerificationSatisfied -- CULMINATES IN THE TWO-DIMENSIONAL MODEL (EPISTEMIC FLOW × GOVERNANCE FLOW) AND THE PROFOUND CONSEQUENCE 'KNOWLEDGEOS IS NOT MERELY AN INFORMATION FLOW; IT IS AN INFORMATION FLOW CONSTRAINED BY AUTHORITY' -- Delivers Historical Authority (CurrentAuthority≠HistoricalAuthority) via a Further Chapter-4 Connection -- Opens Step 172's Six-Scenario Separation-of-Duties Falsification Experiment"
