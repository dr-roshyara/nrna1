about: >
  Directly continues 0795, opening "Step 171 asks a different question: who is allowed to cause each
  transition, who is responsible for its correctness, and what evidence makes the transition legitimate?
  This is where the mathematical/epistemic model meets DDD and governance."

  **§171.1-171.3 delivers five distinct lifecycle roles** (Initiator, Producer, Verifier, DecisionMaker,
  Executor, AccountableOwner -- explicitly noting they "may sometimes be held by the same person or
  system... but that must be an explicit domain decision, not an accidental consequence of
  implementation"), and **three distinct predicates for actor `a` and action `x`**: `Cap(a,x)`, `Resp(a,x)`,
  `Auth(a,x)`, delivering `Responsibility⇏Authority` and `Authority⇏Capability` alongside the
  already-established `Capability⇏Authority`, worked via a system-administrator example (`Cap=true,
  Auth=false, Resp=true` simultaneously) -- `Cap≠Auth≠Resp`.

  **§171.4-171.5 delivers the transition matrix**: a six-question role table (who initiates/produces/
  verifies/authorizes-decides/executes/remains accountable), and the full eight-transition table (each with
  its primary concern and typical authority question), explicitly noting "the exact actors remain
  domain-specific. The structure does not."

  **§171.8-171.10 delivers the promotion-rule formalism**, `PromotionRule(S_i,S_{i+1})`, worked concretely
  for `Assessment→EstablishedKnowledge` (`EvidenceSufficient∧MethodValid∧RequiredReviewComplete`),
  explicitly preferred over the unnecessarily absolute "AI cannot create knowledge."

  **§171.13-171.18 delivers a DDD ubiquitous-language warning**: if a domain language collapses Determine/
  Decide/Authorize/Execute into a single word like "Approve," "that ambiguity will eventually become an
  architectural defect." Delivers `Decision→Authorization` as a separately governed transition, the
  `Auth=⟨Actor,Action,Scope,Policy,ValidityPeriod⟩` structure (explicitly "considerably stronger than
  `approved=true`"), `Execute(a,x,t)⇒ValidAuthorization(a,x,t)`, and **normal-path/emergency-path
  separation** as a named governance-modeling discipline: an emergency path must be modeled as an explicit
  exception (`EmergencyCondition→EmergencyAuthority→Execution→RetrospectiveReview`), never by weakening the
  normal-path `AuthorizationRequired` invariant -- "an exception is not the absence of governance. It is a
  different governance path."

  **§171.19-171.23 delivers the single-point-of-trust analysis promised at 0795's close**, applied to
  `Actor=A` performing `Generate→Verify→Approve→Execute`, and **contextual independence**:
  `TechnicalIndependence` vs. `OrganizationalIndependence` vs. `EpistemicIndependence` kept distinct (a
  verifier can be technically separate but organizationally dependent, or the same automated verifier can
  be genuinely independent of a human producer for a deterministic predicate), directly extending 0793's
  "three-agent problem" statistical-correlation discipline to the producer/verifier relationship (`P=V`
  does not automatically invalidate verification for low-risk deterministic checks). Delivers the boxed
  formula **`RequiredSeparation=f(Risk,Authority,Domain,ControlObjective)`**, explicitly not
  `RequiredSeparation=always` -- "this prevents overengineering."

  **§171.24 delivers the full Authority-Responsibility matrix table** across all eight lifecycle stages
  (Observation through Outcome), explicitly marked "deliberately generic... we must later instantiate it
  for each actual bounded context" -- directly fulfilling the matrix Step 171 was opened to construct.

  **§171.25-171.28 delivers a sharp AI-accountability discipline**: "we should never model `AI=
  accountable` merely because AI performed the action" -- `AI→TechnicalActor` while `AccountableHuman/
  Organization` is modeled separately -- and **`Delegation≠AccountabilityTransfer`** ("a system may
  delegate execution while retaining accountability").

  **§171.29-171.33 delivers `Identity≠Authority`, `Auth(A,x)⇏Accountable(A,x)`, and
  `Accountable(A,x)⇏Correct(x)`** ("accountability concerns responsibility, not epistemic truth"),
  crystallizing a five-predicate relation system (Identity/Capability/Authority/Responsibility/
  Accountability) that "a mature KnowledgeOS architecture should resist representing... as `role=admin`."

  **§171.34-171.35 delivers the transition contract** `T=⟨SourceState,TargetState,Preconditions,Producer,
  Verifier,Authority,Evidence,Time,Accountability⟩` and its validity formula `Valid(T)=Preconditions∧
  EvidenceSufficient∧AuthorityValid∧TemporalConstraints∧VerificationSatisfied`, framed as "the beginning of
  a constitutional model" expressed as invariants (`I_1`-`I_5`, e.g. "evidence must have provenance,"
  "consequential decisions must have identifiable authority") rather than technology prescriptions.

  **§171.36-171.40 delivers a falsification pass on the authority model itself**: a tiny low-risk
  application's `if user.isAdmin(): execute()` may be sufficient without a sophisticated Authority domain
  (`AuthorityModelComplexity∝GovernanceComplexity`), and Decision/Authorization may legitimately collapse
  into a single UI transaction ("approve and execute") without eliminating their conceptual distinction --
  crystallizing **`ConceptualSeparation≠PhysicalSeparation`** as a recurring theme, and the boxed central
  architectural rule: **"do not derive domain boundaries directly from technical component boundaries"** --
  `DomainMeaning→Invariants→Boundaries→Architecture→Technology`, explicitly warning against premature
  microservice decomposition (Evidence Service/Knowledge Service/Decision Service/... as separate services
  before establishing bounded contexts).

  **§171.41-171.43 culminates in the two-dimensional model**: the epistemic flow
  (Observation→Evidence→Knowledge→Determination→Decision→Authorization→Execution→Outcome) intersecting
  with the governance flow (Producer→Verifier→DecisionMaker→Authorizer→Executor→AccountableOwner),
  visualized as two intersecting-but-distinct ASCII flow diagrams, "that intersection is the governance
  architecture." Delivers **the file's capstone, doubly boxed**: **"KnowledgeOS is not merely an
  information flow. It is an information flow constrained by authority"** and **"governance is not merely
  a set of approvals. It is the control structure governing epistemic and operational transitions."**

  **§171.44-171.46 re-invokes "your earlier Chapter 4 insight"** to motivate **historical authority**:
  since current state does not contain all previous state, `Authority_current` cannot tell us
  `Authority_past` -- delivering `Authority(t)` as temporal, **`CurrentAuthority≠HistoricalAuthority`**,
  and the temporal authorization invariant `Execution(a,x,t)⇒ValidAuthority(a,x,t)`, explicitly not
  `ValidAuthority(a,x,t_now)`.

  **§171.47 delivers the Step 171 verdict**: two boxed structural conclusions -- the five-predicate
  orthogonality (`Identity≠Capability≠Responsibility≠Authority≠Accountability`) and the reaffirmed
  six-stage lifecycle chain -- "the two structures must meet without being collapsed."

  **Closes opening "Step 172 — The Separation-of-Duties Falsification Experiment,"** proposing an actual
  architectural experiment across **six concrete named scenarios** (A: one human performs everything; B:
  AI assesses, human verifies and approves; C: AI produces and verifies, human authorizes; D: automated
  deterministic verifier establishes compliance, governance board decides; E: emergency execution bypasses
  normal authorization; F: a later observation contradicts the knowledge used for an earlier decision),
  each to be tested against "does the architecture remain coherent?" -- with an explicit methodological
  commitment: **"if it fails in any scenario, we do not patch the example -- we revise the model."** No
  actual repository implementation occurs within this file itself; every role, predicate, and matrix entry
  remains a conceptual specification pending Step 172's scenario tests.
