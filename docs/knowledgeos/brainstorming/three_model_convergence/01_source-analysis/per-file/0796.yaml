defines:
  - concept: "The three orthogonal actor predicates Cap/Resp/Auth"
    definition: "For actor a and action x: Cap(a,x) means a can technically perform x; Resp(a,x) means a is responsible for the relevant result or process; Auth(a,x) means a is legitimately permitted to perform x -- these are three logically independent relations (a system administrator may have Cap=true and Resp=true for a deployment while Auth=false because approval is missing), so none can substitute for another in an architecture's authority model"
  - concept: "The two-dimensional epistemic/governance model"
    definition: "The KnowledgeOS lifecycle has two intersecting but non-identical structures: the epistemic flow (Observation→Evidence→Knowledge→Determination→Decision→Authorization→Execution→Outcome, answering what changes and what is known) and the governance flow (Producer→Verifier→DecisionMaker→Authorizer→Executor→AccountableOwner, answering who is entitled and responsible) -- their intersection at each lifecycle stage constitutes the actual governance architecture, and collapsing the two dimensions into one loses essential structure"
  - concept: "Normal-path/emergency-path separation"
    definition: "When a domain permits exceptional execution (e.g. emergency deployment bypassing normal authorization), the architecture must model it as an explicit, separately governed exception path (EmergencyCondition→EmergencyAuthority→Execution→RetrospectiveReview) rather than weakening the normal path's AuthorizationRequired invariant to accommodate it -- an exception is not an absence of governance but a different, still-governed path"
refines:
