defines:
  - concept: "Effective conflict predicate"
    definition: "Conflict(s_1,s_2,C,t) holds only when Applicable(s_1,C,t) AND Applicable(s_2,C,t) AND Conclusion(s_1)≠Conclusion(s_2) — cleaner than raw contradiction detection, since scope/time mismatches dissolve many apparent conflicts"
  - concept: "GovernanceResolve function"
    definition: "GovernanceResolve(C,S,t)→GR=(EffectiveRules,Conflicts,Exceptions,Supersessions,UnresolvedItems) — the formal governance-conflict-resolution operation over a set of applicable governance sources S"
  - concept: "Three-state governance resolution outcome space"
    definition: "Resolved (a deterministic precedence/exception rule exists) / Unresolved (valid sources conflict with no resolution mechanism) / Invalid (a source or rule cannot legally/semantically participate)"
  - concept: "Semantic unresolved vs Computational unresolved"
    definition: "Semantic unresolved: the meaning of a concept is not yet defined. Computational unresolved: the meaning is known but efficient calculation is not yet solved. The program's remaining problems are classified as overwhelmingly semantic"
