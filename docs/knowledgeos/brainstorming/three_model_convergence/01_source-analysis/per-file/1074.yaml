about: >
  "10 — Evidence Index (mandate §12 item 13)." The closing document of the ten-part Step-290 package (matching
  the ten-document pattern of Step-289, file 1062, and extending Step-288's eight-document pattern, file
  1048). Consolidates every primary-corpus locus cited across the entire package into a single evidence table
  with its precise role and evidentiary class (CORPUS / CORPUS-definition / CORPUS-candidate / CORPUS-
  proposal), covering all already-tracked loci from files 1063-1073 (`246`, `261.1/5/8/19/20/21/23/25`,
  `258.8/9/11/23/30/37`, `012 §35`, `264.15`, `060 §60.42/71`).

  **CONSOLIDATES THE EXECUTED EVIDENCE**: the Step-290 script (`t290_n1_audit.py`, already tracked file
  1063) delivering the 20-entry register, 5-defined/15-named split, the shared-formula-under-two-symbols
  finding, both `≡_K` loci confirmed CANDIDATE/PROPOSAL, and distinguishability failing loudly on two absent
  definitions; carried-forward evidence from Step-289's exec (30 non-degenerate `≈_X`, not re-run) and
  Step-288's exec (`=` not a congruence, hash canonicalization-relative, `id` re-keys on withdrawal) --
  reconfirming the disciplined "carried, not re-run" methodology already established (file 1068).

  **DELIVERS AN EXPLICIT, DISCIPLINED "NOT USED" NEGATIVE-EVIDENCE CHECKLIST**: "No philosophical source --
  no Gītā material, no Cavell, no Chalmers, no process algebra imported as architecture. (External literature
  appears NOWHERE in this step, not even for classification.)" No governance preference. No hypothetical
  state pair (already tracked, file 1066's refusal to invent a witness). No verification-lane artifact used
  as a definition, only as the target of C-7's correction (already tracked, file 1073). This directly mirrors
  and reconfirms the disciplined negative-checks methodology this reconstruction has tracked since file 1063.

  **DELIVERS THE FORMAL, CLOSING EVIDENCE-THRESHOLD CHECK AGAINST THE MANDATE'S OWN §10 REQUIREMENTS**: all
  five requirements (at least one primary definition; all materially conflicting primary definitions
  compared verbatim; an explicit comparison; no hidden normative assumption -- explicitly confirming "the one
  temptation... to build a witness... was DECLINED, since it would have presupposed Decision 3"; no imported
  philosophical/external premise) are confirmed MET. Boxed final verdict, closing the entire Step-290
  package: "Threshold met for `N-1A`. NOT met for semantic distinguishability, which is reported
  UNDECIDABLE." This is the package's own final, formal self-certification of its own evidentiary rigor,
  directly reconfirming (not extending) the already-tracked N-1A/N-1B split (file 1066) and the withdrawal
  finding (files 1067/1072).
