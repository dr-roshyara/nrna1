  - concept: "The precise, final characterization of the corpus's actual position on equiv/approx: a typed family with one slot (approx) filled and another (equiv) empty, with a candidate proposal to fill the empty slot using the filled slot's formula -- distinguishing without yet exhibiting a distinguishing witness"
defines:
  - term: "N-1A"
    definition: "The claim that the corpus explicitly, by design, declares equiv (semantic equality) and approx (observational equivalence) to be distinct, non-interchangeable relations -- established on the basis of five corpus loci and two notations"
  - term: "N-1B"
    definition: "The claim that equiv and approx are actually semantically distinguishable, i.e. that a witness pair exists satisfying one relation but not the other -- undecidable from current corpus material, since no independent procedure for equiv exists and the observation set for approx is not closed"
