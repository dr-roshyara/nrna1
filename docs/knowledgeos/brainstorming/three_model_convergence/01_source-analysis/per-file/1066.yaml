about: >
  "03 — Distinguishability Audit (mandate §4)," attempting to construct the two required witnesses that
  would settle whether `≡` and `≈` are genuinely semantically distinguishable, not merely declared distinct.

  **CONFIRMS, WITH FULL EXECUTED EVIDENCE (file 1063), THAT BOTH REQUIRED WITNESSES ARE UNDECIDABLE FROM
  CURRENT CORPUS**: W1 (`∃K_1,K_2: K_1≡K_2` and NOT `K_1≈K_2`) fails because the only two definitions ever
  offered for `≡_K` ARE the observational formula itself, so using either to build W1 would make it "vacuously
  empty BY CONSTRUCTION, not by fact"; W2 (`∃K_1,K_2: K_1≈K_2` and NOT `K_1≡K_2`) fails because `𝒪_K` is not
  closed. Explicitly honors the mandate's prohibition against inventing examples: "It would have been easy to
  write a pair differing in provenance and declare `≡` blind to it; THAT WOULD HAVE ASSUMED DECISION 3's
  ANSWER in order to manufacture a distinction. DECLINED." Boxed: "NO HYPOTHETICAL WAS CONSTRUCTED."

  **DELIVERS THE DEFINITIVE RESOLUTION OF THE LONG-TRACKED N-1 CONFLICT (files 1041, 1047, 1054-1055, 1057-
  1065), SPLITTING IT INTO TWO INDEPENDENTLY-ASSESSED CLAIMS WITH DIFFERENT EVIDENCE STRENGTHS**: **"N-1A" --
  "the corpus DISTINGUISHES `≡` from `≈`" -- is ✅ ESTABLISHED**, resting entirely on explicit corpus design
  statements at five loci and two notations (`246`'s "non-interchangeable"; `261.1`'s "should NOT be
  collapsed"; `261.20`'s "requires a typed FAMILY... should NOT be conflated"; `261.25`'s distinct tuple
  positions; `261.19`'s "no single equality relation is adequate," which PRESUPPOSES plurality). **"N-1B" --
  "`≡` and `≈` are SEMANTICALLY DISTINGUISHABLE" -- is 🔴 UNDECIDABLE**, since no witness is constructible.
  **Explicitly warns these two claims "must NOT be conflated."** Delivers the file's own precise closing
  characterization of the corpus's actual position: "A register can distinguish two slots WITHOUT YET
  EXHIBITING A PAIR THAT SEPARATES THEM -- and that is EXACTLY the corpus's position: a typed family with one
  slot filled, one slot empty, and a candidate proposal to fill the empty one with the filled one's formula."
  This directly synthesizes files 1063's (candidate-vs-assertion) and 1065's (glyph-reuse diagnosis) findings
  into the programme's most precise, final statement of what the N-1 conflict genuinely is and is not.

  **Reconfirms the comprehensive nine-item negative-checks discipline** (already tracked, file 1063), all
  explicitly recorded as EXECUTED.
