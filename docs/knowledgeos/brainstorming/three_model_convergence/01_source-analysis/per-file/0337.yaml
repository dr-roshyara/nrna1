  - concept: "PART 1 -- reaffirmed Information-History Principle: 'a participant's epistemic projection must be reconstructible from the information that was available to that participant at the relevant time, under the relevant context and access boundary' -- explicitly tied to replay/audit/AI-agent-assurance/governance/explanation/revision use cases"
  - concept: "PART 1 -- new named principle: Information Monotonicity / Epistemic Non-Monotonicity: F_t^A subset F_s^A MAY hold, but K_t^A subset K_s^A need NOT hold, because new information can force revision/contraction/supersession/withdrawal -- explicitly said to reconcile Aggoun & Elliott with Gardenfors and Gelfond & Kahl, 'an important candidate invariant'"
