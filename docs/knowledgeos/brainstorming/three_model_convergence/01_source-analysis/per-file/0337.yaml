  - concept: "PART 2 -- KNOWLEDGE-CONCEPT-EXTRACTION-001: a governed, one-concept-at-a-time ('What is Knowledge?') reconstruction spanning BOTH brainstorming/ root (Phase 1, 99 docs) and brainstorming/kernel/ (Phase 2, 151 docs), explicitly RESEARCH/NON-AUTHORITATIVE, 'no model chosen,' using a three-register discipline (CORPUS SAYS / INFERRED / FORMAL LAW) closely paralleling this reconstruction's own MD-017 methodology"
