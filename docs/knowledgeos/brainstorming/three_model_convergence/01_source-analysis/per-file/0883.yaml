about: >
  Delivers the formal, capability-by-capability removal tests opened at 0882's close, opening with a
  correction in emphasis: the latest reconciliation material has already executed a removal test showing
  the Step-230 kernel `𝒦_{230}=(K,C,T,E,A)` is "not demonstrated minimal," with four of its five
  components recoverable from `T`'s own signature, while Provenance -- the sole invariant across all nine
  historical kernel phases (0865's finding) -- is absent from both the Step-230 and Step-232 kernels, and
  the proposed reduction `L=History(T)` "fails for external provenance at the initial state `t=0`."

  **§254.1-254.3 delivers the governing methodology**: distinguishes `Representable`, `Derivable`, and
  `Primitive` as non-equivalent claims; formalizes the removal criterion via a reconstruction function
  `r_i:K^{-i}→K` and the commuting condition boxed **`r_i∘T^{-i}=T∘r_i`** (a formal specialization of
  0875's `F∘T̂=T∘F` state-sufficiency criterion); reaffirms `Minimality(K|𝒯)`, never `Minimality(K)` in
  isolation.

  **§254.4-254.14 delivers TEN INDIVIDUAL FORMAL REMOVAL TESTS** on the Step-230 candidate
  `𝒦=(K,C,T,E,A)` and several further candidates: `K` -- "T mentioning K⇏K derivable from T," NOT shown
  removable but ALSO not proven primitive; `C` (Context) -- cannot currently be removed (no established
  `C=f(K,T,E,A)`), but "Context appears semantically necessary to some formulations, but its formal type
  remains unresolved"; `E` (flagged with the corpus's own "E double-binding problem," Evidence-as-content
  vs. Evidence-as-warrant) -- taking `E=Evidence`, NOT removable, directly tied to the provenance
  base-case failure; `A` (Authority) -- NOT removable, since "authority may originate from an external
  actor/governance act," no general `Authority=f(K,C,T,E)`; `T` itself -- "may be primitive OR derived,
  but the corpus has not chosen," explicitly "one of the strongest unresolved foundational choices...
  determines the ontology of the entire kernel"; **`Provenance` -- THE DECISIVE TEST**; `Event` -- not
  proven derivable from `T` (externally observed events may exist independently); `Observation` --
  remains a live primitive candidate; `Proposition` -- strong primitive status, removal not justified;
  `Relation` -- "structurally necessary candidate" but not established primitive ontology.

  **§254.9 delivers a crucial independence finding**: at least four of the five `(K,C,T,E,A)`
  components appear INSIDE `T`'s own signature/definition -- "kernel independence... refuted for both
  Step 230 and Step 232" -- boxed **`Kernel component count≠number of independent primitives`**, "a
  five-tuple is not automatically a five-primitive ontology."

  **§254.10 delivers THE DECISIVE PROVENANCE COUNTEREXAMPLE, "one of the strongest findings in the
  entire reconstruction."** Construct two initial histories `H_1` and `H_2` with the SAME initial
  knowledge content but DIFFERENT externally-sourced evidence (`e_1≠e_2`); since no transformation has
  yet occurred, `History(T)=∅` for BOTH, yet `Provenance(H_1)≠Provenance(H_2)` -- boxed
  **`History(T) cannot reconstruct all provenance`**, "already recorded as a formal base-case failure."
  This is the sharpest, most concrete formal disproof of the `L=History(T)` reduction hypothesis (from
  0863's/0864's kernel work) found anywhere in this reconstruction's read-through.

  **§254.16 delivers the file's negative headline result**: minimal primitive sets cannot be derived by
  counting which symbols appear in a tuple; `(K,C,T,E,A)` is "not a primitive basis. It is better
  understood as a candidate ARCHITECTURAL KERNEL INTERFACE" -- "the contradiction is not necessarily in
  the tuple itself. The contradiction is in calling the tuple minimal independent primitives."

  **§254.17-254.18 delivers a striking, precisely-quantified TRANSFORMATION/PROVENANCE ASYMMETRY**:
  Transformation appears in `8/9` of the historical kernel candidates -- "the only near-universal role,"
  giving it "unusually strong historical support" -- yet "historically universal≠mathematically
  primitive" still holds, so Transformation is boxed **`the strongest historically supported kernel
  role`** but NOT yet mathematically primitive. Meanwhile Provenance is present as an invariant across
  ALL NINE historical phases (`Provenance∈I*`, 0865's finding) yet ABSENT from the latest (230/232)
  kernels -- "this is not yet a reason to insert Provenance into the kernel. It IS a reason why its
  exclusion cannot be justified by the current `History(T)` argument."

  **§254.19-254.20 redefines the minimality target**: not `min|𝒦|` (cardinality) but
  `K*=argmin Complexity(K_i)` subject to `∀T∈𝒯:F∘T̂=T∘F` and Identity/Provenance/Admissibility/History
  preservation wherever required -- boxed **`Mathematical minimality≠smallest number of fields`**.

  **§254.21-254.34 delivers a systematic survey of surviving candidate state families**: Content-only
  `K=Content` explicitly boxed `FALSIFIED as universal candidate`; Structured state and History-inclusive
  state families remain viable but unproven; "state-only semantics: VIABLE BUT UNPROVEN" (contingent on
  `F∘T̂=T∘F` holding for the full operation family, which the provenance counterexample means cannot
  currently be asserted); "some form of origin/provenance information is necessary if provenance-
  sensitive semantics are required" (a deliberately weaker, "scientifically safer" claim than requiring
  `History⊆K` outright); Lineage explicitly boxed **`NO`** as a universal provenance substitute --
  sufficient only for internal transformation lineage under explicit assumptions; the minimum additional
  structure indicated is a four-part requirement (explicit initial/external provenance preservation +
  formally typed state representation + explicit equality/equivalence relation + typed transformation
  semantics), with whether these belong in ONE kernel "not established."

  **§254.35 delivers the crucial methodological conclusion**: reframe from "which kernel is the
  smallest?" to boxed **`What information must be preserved so that every mandatory KnowledgeOS
  operation is well-defined, congruent, replayable and provenance-correct?`**, formalized as
  **`Semantic sufficiency→congruence→minimality`**, never `small tuple→assumed sufficiency`.

  **§254.36 delivers the final Step-254 verdict**: boxed **`MINIMAL KERNEL NOT FOUND`**;
  **`MINIMALITY TEST IS NOW FORMALLY SPECIFIED`**; and **`THE FIRST IMPORTANT COUNTEREXAMPLE EXISTS:
  provenance at t=0`**.

  **§254.37 DELIVERS THE FILE'S MOST STRUCTURALLY SIGNIFICANT MOMENT: THE FIRST EXPLICIT "REQUIRES USER
  DECISION" CHECKPOINT IN THIS ENTIRE RECONSTRUCTION'S READ-THROUGH.** Directly invoking the mandate's
  own rule (from 0871's `D` evidence class -- genuinely normative choices require stopping to ask rather
  than inventing an answer), the file identifies FOUR well-posed questions the corpus evidence cannot
  resolve on its own: **Decision 1** -- is provenance semantically PART of Knowledge
  (`Provenance⊆KnowledgeState`, requiring provenance to participate in state identity/equality) or
  maintained by a SEPARATE historical/audit substrate (Knowledge equality ignoring provenance while
  audit/replay retains it separately)? -- explicitly noting the corpus establishes provenance's
  historical universality and its non-reconstructibility from `T`, but does NOT decide whether it is
  constitutive of identity; **Decision 2** -- must `Replay(H)=K_t` reconstruct the EXACT state, or is
  observational equivalence (`Replay(H)≈K_t`) sufficient? -- directly affecting equality, lineage, and
  minimum retained information; **Decision 3** -- must `K_1=K_2` require identical
  Authority/Policy/Governance, or only identical epistemic content? -- determining whether governance
  belongs inside the semantic state or constrains operations purely externally; **Decision 4** -- which
  operations are MANDATORY (minimality is relative to `𝒯`, and five of nine candidate operations remain
  untyped in the latest audit)? "Without them, we can continue the mathematical attack, but we cannot
  legitimately declare a final minimal KnowledgeOS kernel." This is a genuinely important, self-aware
  moment: rather than continuing to elaborate methodology indefinitely (the earlier deferred-planning
  pattern) or silently inventing an answer, the corpus's own generative process explicitly recognizes the
  limit of what evidence alone can settle and defers to normative human judgment on four specific,
  actionable questions.

  **Closes opening "Step 255 — State/History Congruence and Counterexample Catalogue,"** proposing to
  construct explicit history pairs `(H_1,H_2)` and systematically test `F(H_1)=F(H_2)` against every
  mandatory operation, with the decisive experiment boxed
  **`F(H_1)=F(H_2) but T(H_1)≠T(H_2)?`** -- if such a case survives, state-only semantics fail; if none
  survives a sufficiently broad operation inventory, that becomes genuine positive evidence for
  sufficiency.
