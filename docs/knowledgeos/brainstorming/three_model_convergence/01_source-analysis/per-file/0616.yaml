    refinement: "Directly reused for post-hoc counterfactual evaluation (D(K) vs. D(K\\u)), converting the forward-looking VOI estimate into a backward-looking ActualInformationValue measurement, closing the feedback loop for future prioritization"
  - concept: "The corpus's recurring DDD bounded-context/context-dependence discipline"
    refinement: "Given a precise statistical grounding via the explicit naming of Simpson's Paradox, directly connecting a well-known aggregation pitfall to the architectural necessity of preserving bounded-context strata rather than aggregating across them"
