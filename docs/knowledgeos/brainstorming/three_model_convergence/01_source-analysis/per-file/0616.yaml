defines:
  - concept: "FalseAssurance"
    definition: "The failure mode where KnowledgeOS represents an epistemic state as sufficiently assured to justify an action, but subsequent validation demonstrates that assurance was unjustified — of greater governance significance than an ordinary wrong prediction, since it directly undermines the trust basis for authorized action"
  - concept: "Finite meta-level hierarchy"
    definition: "L0 (World) → L1 (Claims) → L2 (Validation/inference) → L3 (Evaluation of epistemic mechanisms) — a deliberately bounded hierarchy preventing infinite regress into ever-higher meta-validation levels, terminated by an explicit, governance-defined trust boundary"
  - concept: "MetaHealth vector"
    definition: "An eight-dimensional structured health assessment (Calibration, Coverage, Drift, FalseAssurance, ProvenanceIntegrity, ValidationReliability, ConflictResolutionQuality, DecisionPerformance), explicitly never collapsed into a single scalar health score"
  - concept: "Two coupled state spaces"
    definition: "KnowledgeState K_t (what the system currently believes, K_{t+1}=F(K_t,E_t,A_t,O_t,Θ_t)) and EpistemicMechanismState Θ_t (how trustworthy the current belief-producing mechanisms are, Θ_{t+1}=G(Θ_t,Outcome_t,MetaEvidence_t)) — two genuinely distinct, mutually coupled evolving structures rather than a single knowledge representation"
