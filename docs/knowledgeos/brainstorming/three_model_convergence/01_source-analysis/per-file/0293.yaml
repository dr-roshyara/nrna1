about: >
  Searle's Construction of Social Reality, read as planned back at 0279, adds an entire SOCIAL/
  INSTITUTIONAL layer to the Knowledge Space model -- of unusually direct relevance given the broader
  project's actual PublicDigit voting-platform domain (elections, voter/candidate/officer status,
  constitutional authority, governance ratification). Formalizes the brute-fact/institutional-fact
  distinction, the central mechanism X-counts-as-Y-in-context-C, deontic power (rights/obligations/
  authorizations) distinguished from causal power, collective intentionality (distinct from a union of
  individual beliefs), the descriptive-vs-constitutive/performative speech-act distinction, iterated status
  functions producing non-flat institutional structure, and a four-way relation typology (natural/semantic/
  epistemic/institutional). Extends the Knowledge Space model to three parallel spaces (Natural/Semantic/
  Institutional) converging into Epistemic Space, proposes StatusFunction(X,Y,C) as a new candidate
  institutional primitive, and closes with ten named Zero-Lens principles (ZL-S01..ZL-S10).
introduces:
  - concept: "Brute facts vs institutional facts, Searle's foundational distinction: physical facts (mountains, snow, causal events) exist independently of human institutions, while institutional facts (money, property, government, marriages, elections) depend on human agreement/institutional structures -- Knowledge Space should not be one undifferentiated FACT set; different facts have different ontological conditions"
  - concept: "Institutional reality explicitly NOT 'fake': institutional facts are REAL but their existence depends on institutional conditions rather than purely physical structure -- worked 'Person X is President' example, not determinable by looking at the body, depending on election+rules+votes+certification+institution+status-assignment+context; objective fact != physically intrinsic fact"
  - concept: "Truth model extended for institutional propositions: truth of a claim like 'this paper is a EUR20 note' requires X + status function + context + collective recognition + institution, not merely physical properties -- a major addition to the corpus's prior truth/evidence/aboutness/representation separation"
  - concept: "Central mechanism formalized as a candidate KnowledgeOS relation: X counts as Y in context C -- Searle's general logical structure underlying institutional facts; worked examples (ballot paper counts-as vote in Election E; person counts-as candidate in Election E; person counts-as president in State S; paper counts-as money in Monetary System M) -- the same physical X can have different Y statuses in different contexts, giving a formal 'institutional context' boundary type"
  - concept: "Status(X,Y,C) declared explicitly context-sensitive, sharpening the Knowledge Space boundary concept: 'a Knowledge Space boundary is not only a semantic boundary; it can determine the status-function rules under which an entity is interpreted' -- more precise than a bare 'topic boundary'"
  - concept: "Status is NOT intrinsic to the object: a piece of paper's physical structure does not by itself make it money; a person's biological properties do not by themselves make them president/judge/candidate/voter/attorney -- three-way distinction: intrinsic property, assigned status, observer-relative use, a further anti-collapse invariant"
  - concept: "Person model extended (building on the Persons-and-Causes lens, 0274): intrinsic properties + individual powers + institutional status functions (voter/officer/president/owner/authority), distinguishing natural/physical capacity (can physically perform an action) from institutional power (is authorized to perform an action) as profoundly different capability types"
  - concept: "Deontic power introduced as a major new structural category, distinct from causal power: rights, obligations, duties, privileges, permissions, requirements, authorizations, entitlements -- e.g. a President's right to veto or power to appoint are institutional, not physical, powers -- CAUSAL POWER vs INSTITUTIONAL/DEONTIC POWER, directly relevant to Governance"
  - concept: "Governance cascade formalized: Election -creates-> Mandate -assigns-> Role -grants-> Institutional powers -creates-> Rights/obligations -- an election result is not merely a fact, it can cause a cascade of institutional status changes; three interacting dynamics distinguished: WORLD CHANGE, EPISTEMIC CHANGE, INSTITUTIONAL CHANGE (Physical/natural state -> Institutional state -> Epistemic state)"
  - concept: "Collective intentionality distinguished from individual intentions and directly connected to the corpus's per-agent-projection work (0288/0289): Individual epistemic states (Alice/Bob/AI) -> Collective intentionality -> Institutional reality; collective knowledge is NOT merely union(Alice-knowledge, Bob-knowledge) -- the group can create something institutionally NEW; distinguishes individual belief / collective intention / collective acceptance / institutional status, connecting to Fagin's common/distributed knowledge"
  - concept: "Institutional facts declared RELATIONAL, not isolated: an institutional fact exists within a network of systematic relationships with other facts -- worked chains (Money depends-on exchange-system depends-on property depends-on contract depends-on institutional-recognition; President depends-on election depends-on electoral-rules depends-on institution depends-on collective-recognition) -- confirms the corpus's relational Knowledge Space hypothesis and directly extends it institutionally"
  - concept: "Process more fundamental than object, directly connected to the Merricks/Assertion-primitive debate (0270-0271): Searle argues for the primacy of social acts/processes over social objects -- a social object often only makes sense as a continuing possibility of activity; Marriage/Government/Election/Corporation/Money/Contract/Office are not inert objects but maintained practices/processes under rules and recognition -- reinforces the corpus's suspicion against turning every concept into a giant aggregate"
  - concept: "Institutional Object formalized as a maintained configuration: statuses + rules + practices + recognition, explicitly flagged as likely a derived PROJECTION, not a Kernel primitive"
  - concept: "Language refined from a pure expression layer (the corpus's prior Vani conclusion) to being CONSTITUTIVE for many institutional facts: a symbolic/representational system is required to maintain status functions and make them communicable and persistent; refined pipeline Natural/brute reality -> Social intentionality -> Status assignment -> Symbolic representation -> Institutional reality -- language is not the container of all meaning, but can be constitutive of some institutional realities (Searle explicitly distinguishes prelinguistic social behavior from full linguistically-structured institutions)"
  - concept: "Expressive vs constitutive/performative language distinguished: some language DESCRIBES reality, some CHANGES institutional reality; performative utterances ('I appoint you chairman', 'the meeting is adjourned', 'I declare the parliament in session') create institutional facts under appropriate constitutive rules -- the Kernel must not confuse DESCRIPTIVE and CONSTITUTIVE/PERFORMATIVE sentence types"
  - concept: "New assertion-type distinction: descriptive assertion ('Alice is President') vs constitutive act ('Alice is hereby appointed President') -- the second does not merely report a fact, under the correct institutional rule and authority it CREATES/CHANGES the status; speech act represents vs constitutes as different semantic/operational roles, highly relevant to GovernanceOS"
  - concept: "Authority-preservation requirement for institutional claims/actions: interpreting them correctly requires utterance + speaker + authority + context + constitutive rule + institutional state, reinforcing the corpus's existing governance architecture"
  - concept: "'Background' concept: explicit rules are distinguished from background capacities/abilities/dispositions/practices agents use to function within institutions -- a Constitution does not contain every practical competence required to execute the institution, further reinforcing that not all knowledge is linguistically explicit"
  - concept: "Ten-point Zero-Lens minimal extraction: a phenomenon/object can receive a status; status is assigned relative to a context; collective intentionality can support the assignment; constitutive rules define what counts as what; statuses can create powers/rights/obligations; institutional facts form networks; institutional facts depend on underlying brute facts; some statuses persist through representation and recognition; institutional processes create/change institutional states; some utterances are themselves institutional actions"
  - concept: "Knowledge Space extended to THREE parallel spaces: NATURAL REALITY & EVENTS (objects/properties/causes/events/observations), SOCIAL/INSTITUTIONAL REALITY (status functions -> roles/powers/obligations -> institutional state), SEMANTIC SPACE (concepts/propositions/meanings/representations), all converging into EPISTEMIC SPACE -> participants/agents -> knowledge projections -> Knowledge State"
  - concept: "NEW candidate institutional primitive: StatusFunction(X,Y,C), with associated collective recognition, rule, authority, power, rights, obligations, context, time; worked StatusFunction(person, President, Republic R) example generating rights/obligations/powers/responsibilities -- 'extremely compatible with our constitutional/governance architecture'"
  - concept: "Boundary typology extended to four types: Physical boundary (system X), Semantic boundary (concept C), Epistemic boundary (what agent A can currently distinguish), Institutional boundary (context C where X counts as Y) -- Status(X,Y,C1) != Status(X,Y,C2) is perfectly possible, so context must remain explicit"
  - concept: "Iterated status functions / interlocking institutional systems: a status can itself become the basis for another status, producing layered structure; worked election chain Person -> counts-as Voter -> votes -> counts-as Candidate/Election-outcome -> counts-as Winner -> counts-as President -> has Power -> can Appoint -> new Institutional Status -- 'incredibly relevant to elections', demonstrates the Knowledge Space is NOT a flat graph but has iterated institutional structure"
  - concept: "Four-way relation typology, self-described as one of the cleanest classifications found: Natural relations (causes/contains/touches/located-in), Semantic relations (means/refers-to/predicates/represents), Epistemic relations (supports/contradicts/believes/knows/justifies), Institutional relations (counts-as/authorizes/requires/permits/obligates/appoints/owns/certifies) -- proposed as a RELATIONAL SUBSTRATE meta-level (natural/semantic/epistemic/institutional sub-types), so the Kernel can preserve TYPED relations without prescribing all domain semantics"
  - concept: "'Preserve history, project state' model extended to institutions: Institutional State at t is derived from constitutional rules + status assignments + collective recognition + institutional events + history, mirroring History->projection->Knowledge State and adding Institutional State->Knowledge about Institutional State as a parallel track; institutional facts persist only so long as the relevant recognition/structures continue"
  - concept: "Governance-decision distinction proposed as a major architectural invariant, directly relevant to the broader project's PublicDigit voting domain: report of a decision ('X is approved') vs. a decision event that CONSTITUTES institutional change (status-function assignment -> new institutional status -> new rights/obligations/powers -> new institutional reality)"
  - concept: "Ten named Zero-Lens principles (ZL-S01..ZL-S10): Natural/Institutional Distinction, Contextual Status, Status Is Not Intrinsic, Constitutive Rule (X counts as Y in C), Collective Recognition, Deontic Consequence, Institutional Interdependence, Status Iteration, Constitutive Speech, Institutional Persistence"
  - concept: "Refinement of the per-agent-projection model (0288/0289): 'not all projections are projections of the SAME KIND of reality' -- Projection A projects natural reality, B projects semantic reality, C projects institutional reality, D projects epistemic reality; KnowledgeOS must preserve WHICH KIND of projection a given state is, a further major boundary condition"
  - concept: "Strong argument against monolithic 'Knowledge' as a Kernel object, worked via 'President': is it a person, a status, an institutional role, a relation, a power-bearing position, a concept, a proposition, or an epistemic object -- depending on context, all may be relevant; proposed structural alternative: preserve personX/status-function-X-to-President/context-C/institution-I/constitutive-rule-R/authority-A/time-T/rights-obligations-P/evidence-E as SEPARATE structures, from which different projections can derive 'X is President'/'X has presidential authority'/'X was President from T1 to T2' without losing the underlying structure -- 'exactly the kind of semantic integrity we have been looking for'"
  - concept: "Six-book convergence table (McGinn/Floridi/Dretske/Fagin/Gardenfors/Searle) collapsed into a single pipeline: Infinite Knowledge Space -> Reality/Semantics/Institutions -> Observations -> Epistemic States -> Projections"
  - concept: "Final architectural verdict: 'this book should materially influence the KnowledgeOS model'; the biggest addition is status assignment under context (X counts as Y in C), directly relevant to roles/elections/mandates/offices/authority/rights/obligations/ownership/certification/governance/constitutional-status/institutional-boundaries -- explicitly framed as directly relevant to KnowledgeOS governance, not abstract philosophy; closing statement: Knowledge Space contains not only objects/events and propositions/epistemic-states but also a socially/institutionally constructed space of statuses/powers/obligations/roles depending on rules and collective recognition, which must remain distinguishable from natural facts and from knowledge of both -- 'a substantial step toward defining the actual boundary of the KnowledgeOS Kernel'"
