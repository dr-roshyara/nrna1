tier2_reason: "Adds an entire institutional/social-reality layer to the Knowledge Space model, of unusually direct relevance to the broader project's own constitutional/governance/election domain: formalizes brute-vs-institutional facts, the X-counts-as-Y-in-C mechanism, deontic power distinct from causal power, collective intentionality, the descriptive-vs-constitutive speech-act distinction, iterated status functions producing non-flat institutional structure, and a four-way relation typology. Extends the Knowledge Space to three parallel spaces (Natural/Semantic/Institutional) converging into Epistemic Space, proposes StatusFunction(X,Y,C) as a new candidate primitive, and closes with ten named Zero-Lens principles -- explicitly assessed as materially influencing the KnowledgeOS model, not abstract philosophy."
