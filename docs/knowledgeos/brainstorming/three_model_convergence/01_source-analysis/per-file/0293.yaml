refines:
  - concept: "0285-0288's Preservation Substrate candidate and its natural/semantic/epistemic architecture"
    refinement: "Extends with an explicit third parallel space (Institutional), a fourth relation type (institutional relations), and a new StatusFunction(X,Y,C) primitive candidate -- the same overall architecture, substantially enriched rather than replaced"
  - concept: "0288/0289's per-agent projection model and epistemic orientation"
    refinement: "Adds that projections differ not only in perspective/orientation but in WHICH KIND of underlying reality they project (natural/semantic/institutional/epistemic), a further required dimension of orientation"
  - concept: "0270's Merricks non-redundancy/process-vs-object debate and 0274's Persons-and-Causes work"
    refinement: "Directly reinforces the process-over-object suspicion via Searle's own argument for the primacy of social acts over social objects, and extends the Person model with institutional status functions distinct from intrinsic properties and individual powers"
  - concept: "The corpus's Vani-lens conclusion that language is purely an expression layer"
    refinement: "Qualifies it: language remains not the container of all meaning, but CAN BE CONSTITUTIVE of institutional realities via performative speech acts -- an important, non-trivial refinement rather than a simple restatement"
