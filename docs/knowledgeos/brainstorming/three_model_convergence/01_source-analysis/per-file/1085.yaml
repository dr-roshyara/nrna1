about: >
  "07 — Governance vs Derivation Boundary (mandate §§8, 11)." Delivers the synthesis capstone of the entire
  Step-291 package, exhaustively testing eight candidate derivation routes for closing `𝒪`/`𝒯` (mandate §8):
  from `K` (CIRCULAR, `K←minimality←congruence←𝒯`); from invariants `ℐ` (CIRCULAR, downstream of `≡` per
  already-tracked file `287`); from a minimality proof (BLOCKED, `259`'s already-tracked prohibition); from
  the ratified 8 primitives (UNDER-SPECIFIED, `C-022`/`049` ratifies primitives not operations, never shown
  minimal against an operation space); from the forced lower bound (PARTIALLY DERIVABLE, `256.2`/`259.7`'s
  already-tracked 14-forced/≤18 candidate set, not a membership rule); from `259.7`'s five-kind schema
  (PARTIALLY DERIVABLE, "the schema IS derivable and `277` calls classification CLOSED -- it bounds KINDS,
  not MEMBERS"); from `Admissible(o,K)` (BLOCKED, routed to `G1`); and DECLARE MANDATORY MEMBERSHIP (✅
  NORMATIVE, "the only route with no unmet precondition"). Boxed capstone: "The SCHEMA is derivable (and
  largely derived). MANDATORY MEMBERSHIP is not. No route derives membership from already-ratified
  material." Applies the disciplined `225.11` absence-of-evidence caveat: this finding could be SUPERSEDED
  (not contradicted) by a later step finding a derivation route.

  **DELIVERS THE STEP-291 PACKAGE'S DEFINITIVE, MOST IMPORTANT SYNTHESIS: THE CASE-E MIXED SPLIT (mandate
  §11)**, cleanly partitioning everything this reconstruction has tracked across files 1075-1084 into three
  categories. **CAN BE DERIVED** (already-established, no decision needed): the five-kind operation schema;
  the 8 typed operation signatures; `𝒯⊆𝒪`/`𝒪_K⊆kind-5`; `≡_K`'s DEFINABILITY (already-tracked file 1076/1079
  five-of-six-blocked finding); the `Assess` determination condition; and the `258-A` congruence criterion,
  explicitly flagged "must NOT be given to governance." **IS AN ENGINEERING/DOCUMENTARY TODO, NOT A
  GOVERNANCE DECISION**: the `𝒪` glyph overload (already-tracked file 1076/1078); `261.21`'s self-reference
  (already-tracked file 1076/1079); registering `TraceOrigin`/`ExplainRevision` (already-tracked file 1081's
  sharpest finding); a type for observation-kind-5. **DELIVERS THE GENUINELY CRITICAL CORRECTIVE VERDICT**:
  "Four items that Steps 288-290 FOLDED INTO '𝒪 IS NOT CLOSED' are NOT DECISIONS AT ALL. CALLING THEM
  GOVERNANCE QUESTIONS WOULD HAVE MANUFACTURED FOUR DECISIONS." This is a genuinely important, disciplined
  methodological correction directly paralleling the already-tracked N-1/G-67 withdrawal (files 1067/1072):
  just as an over-stated "corpus contradiction" was withdrawn there, here an over-broad "governance blocker"
  characterization is corrected -- four items that appeared to require ARB decisions are shown to be mere
  engineering/documentation repairs requiring no decision at all. **GENUINELY REQUIRES A DECISION** (narrowed
  to exactly four items): which operations are MANDATORY (already-tracked `N-4`, "the WHOLE of the real
  blocker"); `𝒪_K`'s extension (`N-3`); the residue of Decision 3 (`N-2`); ratify/reject the `261.21`
  candidate (already-tracked `N-1′`, files 1072-1073).

  Confirms the STATUS block: DERIVED the schema/signatures/subset-relations/definability/258-A · IMPLEMENTATION
  4 documentary/type-theoretic TODOs, no decision needed · NORMATIVE 4 items, of which mandatory membership
  is the only structural one · G1 `Admissible` · UNKNOWN whether a membership derivation exists.
