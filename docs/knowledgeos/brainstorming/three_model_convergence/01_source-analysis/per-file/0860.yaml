defines:
  - concept: "The G0-G3 Gita-relationship taxonomy and its collision with 0855's G1/G2/G3"
    definition: "A four-level classification introduced at 0860 for the relationship between an architectural principle and the Gita: G0 No meaningful connection (no Gita interpretation is necessary); G1 Analogy (a conceptual resemblance exists, without further claim); G2 Interpretive principle (the Gita provides a useful philosophical lens for understanding the principle); G3 Explicit design influence (the architecture was consciously designed using that interpretation -- the strongest claim, explicitly requiring historical evidence of actual design influence). This collides severely with 0855's own three-level G1/G2/G3 scheme (G1 Direct historical influence [strongest]; G2 Explicit retrospective interpretation; G3 Structural analogy [weakest]): both schemes use the identical 'G' prefix letter and the identical digits 1 through 3, but assign INVERTED relative strength at matching labels -- 0855's G1 is the strongest possible claim (direct historical influence) while 0860's G1 is the weakest non-trivial claim (mere analogy); 0855's G3 is the weakest claim (structural analogy) while 0860's G3 is the strongest claim (explicit design influence). This is confirmed as more severe than the earlier P1/P2/P3-vs-G1/G2/G3(0855) mismatch, which merely reordered corresponding concepts under different prefix letters -- here the identical prefix-and-number combination is reused with genuinely opposite meaning, making any future reference to 'G1' from this stretch of the corpus ambiguous without knowing which file's scheme is intended"
  - concept: "The corpus's first notation dictionary (K/k/G/C/T/E/A/P)"
    definition: "A provisional table proposed at 234.18 reconciling the reconstruction's most heavily-used single-letter mathematical symbols to fixed canonical meanings: K→KnowledgeState (the full state object, e.g. 𝔎_t from 0857), k→KnowledgeItem (a single knowledge assertion, e.g. the tuple from 0857's §231.2), G→KnowledgeGraph (the semantic-graph layer of a knowledge state), C→Context, T→Transformation, E→Evidence, A→Authority, P→Policy. Explicitly labeled provisional, pending confirmation by the still-undelivered Steps 1-182 audit. This is the first time the corpus has explicitly attempted to reconcile any of its own recurring notation-collision problems rather than merely accumulating further colliding schemes, though it is narrowly scoped to these eight single-letter kernel symbols and does not address the I-series invariant numbering or the Gita-taxonomy-letter collisions documented separately"
