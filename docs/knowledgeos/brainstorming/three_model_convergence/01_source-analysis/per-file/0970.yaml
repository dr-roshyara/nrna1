defines:
  - concept: "The seven-layer Gita-to-KnowledgeOS provenance discipline"
    definition: "Any claim tracing back to the Gita must be explicitly located at one of seven strictly ordered layers, each requiring a distinct kind of justification to advance to the next: (1) Gita text -- the base source language itself; (2) Purport/commentary -- a specific translator's or commentator's interpretation of that text (never assume this is theologically or philosophically neutral); (3) Philosophical interpretation -- a further abstraction of the commentary's ideas; (4) KnowledgeOS analogy -- a proposed, still-unverified correspondence to a KnowledgeOS concept; (5) Design hypothesis -- a testable engineering proposition derived from that analogy; (6) Formal derivation -- a proposition established via genuine mathematical or logical proof; (7) Governance decision -- organizational ratification making the result canonical. A claim may never skip layers, and only layers 6 and 7 may establish binding KnowledgeOS semantics"
  - concept: "The Gita-specific acceptance rule (A-E)"
    definition: "Every proposed Gita-to-KnowledgeOS mapping must be classified as exactly one of: A Formally supported (an independent mathematical derivation exists); B Architecturally useful (a useful design principle, not a theorem); C Philosophically illuminating (improves conceptual understanding, no implementation consequence); D Unsupported analogy (does not survive critical examination); E Contradictory (conflicts with existing KnowledgeOS semantics). This prevents, in the document's own words, 'philosophical enthusiasm from becoming architecture by accident'"
