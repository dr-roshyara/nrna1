about: >
  "30 — THE EIGHT PRIMITIVES HOLD · a convergence on the answer," verdict "The Gītā lane independently
  reaches this programme's tiering result: KEEP THE EIGHT RATIFIED PRIMITIVES; the Gītā is a LENS, not a
  source of primitives. Both files mark themselves `DERIVED/RESEARCH, not CANONICAL`. One real defect found:
  `Karma` is mapped to TWO distinct ratified primitives, and the disambiguation sits unused in the same
  table."

  **DELIVERS THE CULMINATING CROSS-METHOD CONVERGENCE CLOSING THE ENTIRE ALREADY-TRACKED 18-CHAPTER TIERING
  SURVEY (files 1096-1107)**: an independently-sourced reconciliation document states "'I would keep the
  canonical kernel state EXACTLY at the eight ratified primitives, while using the Gītā-derived concepts as a
  PHILOSOPHICAL INTERPRETATION/LENS, NOT AS ADDITIONAL PRIMITIVES.'" Boxed: "Two methods -- SYSTEMATIC TIERING
  [the already-tracked ~60-correspondence T0-T4 survey], and THE LANE'S OWN SYNTHESIS -- reach the SAME
  CONCLUSION about the same corpus." Precisely characterized as "corroboration of a NEGATIVE result, which is
  the only kind available here... it raises confidence that '0 new primitives' is NOT AN ARTIFACT OF MY
  TIERING CRITERIA." This is the genuinely important closing validation for the entire multi-day, 18-chapter
  research programme -- an independent method, working from inside the philosophical material itself rather
  than an external tiering framework, reaches identically the same negative conclusion.

  **DELIVERS THE SOURCE OF THE ALREADY-TRACKED VOCABULARY-VERSUS-FIELDS SELF-CORRECTION (file 1108)**: writes
  the eight ratified primitives as a set `K_t={Entity,State,Event,Observation,Proposition,Relation,Policy,
  Action}`, later flagged (in the already-tracked file 1108) as "still compositional" and corrected at
  source: "The eight are the VOCABULARY IN WHICH state is expressed -- not its components, not its fields."

  **DELIVERS A DISCIPLINED PRIMITIVE-BY-PRIMITIVE AUDIT OF THE GĪTĀ LENS MAPPING**, confirming most mappings
  as genuine corroborations of already-ratified primitives (Entity↔Kṣetra, correctly onto a ratified primitive
  rather than adding a new type as the already-tracked T0-classified Ch-13 mapping did, file 1097's `18§3`;
  Observation↔Indriya-Manas, consistent with the already-ratified `Sañjaya`/`R5`; Proposition↔Jñeya, matching
  the already-existing Step-286 `Jñātā→Knower`/`Jñeya→Proposition` correction; Policy↔Dharma, upgrading
  Dharma from already-tracked `R4`-emphasis-only to a lens on a ratified primitive). **Delivers three explicit
  refusals of primitive status**: `Buddhi` is an operator not a primitive; `Kṣetrajña` restates the already-
  ratified `𝒩∉K` five days after `FA-4` recorded it "from the philosophical side"; `Guṇa` is a mode
  influencing kernel operation, consistent with the already-tracked `C11`, taking the already-tracked file-
  1103 Guṇa-fork's branch (b) that "leaves it without a carrier."

  **DISCOVERS A GENUINE, CONCRETE DEFECT**: `Karma` is mapped to BOTH `Event` ("something that happens/change
  occurs," glossed with `Kriyā`) and `Action` ("an operation/change DELIBERATELY PERFORMED") -- two primitives
  the ratified eight hold DISTINCT. Delivers the sharp diagnostic observation: "the DISAMBIGUATION is sitting
  UNUSED in the SAME TABLE: `Kriyā` appears only in the `Event` row. The natural split -- `Kriyā`=the
  happening, `Karma`=the deliberate act -- matches the table's own glosses... and is NEVER STATED." Precisely
  connects the stakes: "`Event≠State` is one of the three already-tracked T4 corroborations (file 1101), and
  `Event≠Action` is ENTAILED by both being ratified. A single Sanskrit term spanning two primitives would
  COLLAPSE A DISTINCTION THE CORPUS HOLDS." Identified as the same shape as the already-tracked `GK-Q2` Jñāna
  correction (file 1095). Recorded `GK-Q4`, not resolved (a registry act).

  **DELIVERS TWO NEW UNADJUDICATED REGISTER TERMS** (`Sambandha`→Relation, `Kriyā`→Event), explicitly
  diagnosed as "the `G-101` PATTERN AT THE VOCABULARY LEVEL" -- directly connecting to the already-tracked
  file-1107 root-cause diagnosis. Recorded `GK-Q5`.

  **DELIVERS THE GENUINELY VALUABLE CONFIRMATION THAT BOTH LANES NOW AGREE ITEM-FOR-ITEM ON WHAT REMAINS
  OPEN**: the reconciliation's own self-scoping list ("'equality semantics, the observation set, operation
  registry, `Qualify`, and the final canonical terminology are not all closed'") is confirmed to be "THIS
  PROGRAMME'S OPEN REGISTER, STATED FROM THE OTHER SIDE: `≡`·`𝒪_K`·`𝒪`·`Qualify`(`G1`)·terminology (`G-98`/
  `G-100`/`G-101`)." Delivers the closing philosophical-side restatement of the central open question: "Can
  the Kernel be expressed as a small, CLOSED ALGEBRA of typed state transformations? -- that is `N-4` PLUS
  MINIMALITY, asked from the philosophical side -- the same question `291` reached by graph analysis and
  `259` by congruence."

  Closes with the track's own summary: 18 of 18 chapters read, 2 complete opposing syntheses, 1 reconciliation
  to the ratified eight (this one), 3 T4 candidates all corpus-native, 0 new primitives "NOW INDEPENDENTLY
  CONFIRMED BY THE LANE ITSELF," 0 gaps filled. Boxed: "The Gītā track ends where the TIERING SAID IT WOULD:
  the eight ratified primitives stand, and the Gītā is a lens over them."
