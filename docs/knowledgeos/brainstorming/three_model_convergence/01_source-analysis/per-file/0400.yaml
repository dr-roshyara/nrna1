title: "Semantic Parser Architecture; Semantic Token T=(Entity,Dimension,Value,Relation,Context,Time,Source,EpistemicStatus); Dimension Resolver; Explicit Rejection of Document-Chunk-Embedding-Vector RAG Pipeline; Knowledge Unit Candidate Resolved"
