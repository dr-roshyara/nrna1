defines:
  - concept: "Instruction≠Enforcement"
    definition: "A written instruction to an AI agent (e.g. AGENTS.md saying 'never deploy directly to production') is useful guidance but not a security boundary, because a malicious, buggy, or misconfigured agent can simply ignore it; the actual enforcement mechanism must exist as a server-side authorization gate inside the platform, never solely as agent-facing instructions"
  - concept: "Control Plane vs. Data Plane (applied to KnowledgeOS)"
    definition: "KnowledgeOS functions as the semantic/governance control plane, determining what is authoritative, applicable, permitted, observed, and verified; engineering systems (Git, Nexus, Kubernetes, CI/CD) function as the execution/operational data plane, actually running and exposing real state; the AI agent is a reasoning actor operating within, but never itself constituting, the control plane"
  - concept: "Risk-sensitive fail-open/fail-closed policy"
    definition: "Whether the system fails open (allows an action to proceed despite unavailable governance/context state) or fails closed (blocks the action) must be a function of the action's risk level, not a single global policy: low-risk read operations may reasonably fail open, while governance-sensitive or high-risk actions must fail closed when required state cannot be confirmed"
