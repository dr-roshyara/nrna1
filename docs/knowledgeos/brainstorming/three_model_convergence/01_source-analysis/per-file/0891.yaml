defines:
  - concept: "Proposition type P=(x,d,v)"
    definition: "A proposed, disambiguated typed definition of the Proposition primitive: P=(x,d,v) where x∈ℰ (the entity/subject the proposition concerns, using ℰ for the Entity type to avoid collision with Evidence, previously also denoted E or e), d∈𝒟 (the dimension/semantic-property-type the value is measured on), and v∈V_d (a value drawn from the dimension-specific admissible value space). Superior to the ambiguous P=(E,D,V) notation because it separates the TYPE ℰ from an individual entity instance and from Evidence, which the corpus's own overloaded-symbol history had repeatedly collided. Supported by a three-way removal-test argument showing each of x, d, v is independently necessary: removing x loses subject identity (D,V alone cannot determine which entity is meant), removing d loses the value's semantic role (E,V alone cannot determine what kind of property the value represents), and removing v loses the proposition's actual asserted content (E,D alone states only that the entity 'has' the dimension, not what value it takes)"
  - concept: "Must-not-leak-into-P boundary discipline"
    definition: "A methodological constraint requiring that fields shown to be necessary at the Assertion level (context c, evidence e, temporal validity t) must NOT be pulled down into the Proposition type P, even though they are independently necessary somewhere in the overall Assertion tuple. The justification in each case is that doing so would destroy the very Proposition/Assertion distinction the theory depends on: if evidence were part of P's identity, two assertions of the same proposition with different evidence could no longer be recognized as sharing 'the same proposition'; if temporal validity were part of P's identity, a single proposition with two genuinely distinct validity intervals could not be represented without artificially duplicating the proposition itself"
