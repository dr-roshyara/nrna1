about: >
  "07 — Normative Decision Register (mandate §§6, 20)," explicitly binding: "this step makes NO governance
  decision. No branch is chosen... Nothing is recommended."

  **§6 delivers a fully disciplined, comprehensive both-branches analysis of Decision 3** (`Π∈≡`?),
  cross-corpus-cited (`261.8`, `254`), covering thirteen consequence dimensions (effect on `≡`, `≅_λ`,
  `D285-5`, `D285-6`, deduplication, canonicalization, provenance, replay, contradiction handling,
  operations, `δ`, governance, and invariant `I-C`) for both branches, with NO preference stated. **DELIVERS
  A GENUINELY IMPORTANT METHODOLOGICAL CLARIFICATION**, distinguishing what is TECHNICAL (decidable) from
  what is NORMATIVE within Decision 3 itself: "Does any mandatory operation observe `Π`?" is TECHNICAL,
  decidable by the already-tracked "258-A" congruence experiment (`∃T: F(H_1)=F(H_2)∧F(T(H_1))≠F(T(H_2))`),
  quoting a NEW corpus principle **"258.31: 'we do NOT ask philosophically'"** -- and confirms this
  experiment has ALREADY BEEN RUN once: "`258.15` already runs it: `TraceOrigin` distinguishes; pure audit
  metadata does not." Only "which operations are mandatory" (= `𝒪`/`𝒯` ratification) and "which of `258.31`'s
  three repairs" remain genuinely NORMATIVE.

  **DELIVERS THE DEFINITIVE, CAPSTONE TWENTY-ITEM NORMATIVE DECISION REGISTER** consolidating every open
  question this reconstruction has tracked across files 1005-1046 into one authoritative table, each with
  formally-consistent options, technical/governance consequences, status, and assigned authority (`ARB`,
  `PO`, `domain`, `registry`). Notably includes: **N-1**, explicitly flagged "OPEN — CRITICAL, newly found" --
  the `≡`/`≈` one-relation-or-two question stemming directly from file 1041's discovered corpus
  self-contradiction; N-4 (which `𝒪`/`𝒯`) explicitly marked "the single upstream gate" blocking N-3, N-5,
  N-11, and the technical half of N-2; N-19 (the decision-theoretic false-merge/false-split operating point),
  additionally blocked by the already-tracked missing-probability-space gap (`G-22`); and **N-20, the "287"
  identifier collision**, explicitly assigned authority to "registry... carried, user's call" -- notably
  DIFFERENT from every other item's `ARB`/`PO` authority assignment, treating this specific naming question
  as outside even the architecture review board's remit.

  **Closes with the definitive dependency-priority finding**: "20 open normative decisions. N-4 gates N-3,
  N-5, N-11 and the technical half of N-2" -- confirming, in its most explicit and complete form yet, that a
  single decision (ratifying the operation/transformation set `𝒪`/`𝒯`) is the master upstream gate for
  nearly the entire remaining equality/identity/kernel research programme.
