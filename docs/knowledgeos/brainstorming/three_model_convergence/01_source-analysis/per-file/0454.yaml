about: >
  A landmark file definitively resolving Question 2 (What is a Dimension?), one of the corpus's longest-
  running open questions (repeatedly revisited since 0361/0399/0400/0403 and most recently sharpened by
  0451/0452/0453's Bhisma test case). Opens by explicitly challenging the corpus's earlier hypothesis
  "dimensions are statements about the observation" via the Bhisma test case (simultaneously opponent,
  relative, teacher, grandfather, brother, friend, kinsman), posing five explicit sub-questions: is
  RelationshipToArjuna one dimension with many values, or is each relationship type its own dimension; is
  "Bhisma is Arjuna's grandfather" a dimension, a statement, or a relationship; is "killing my grandfather
  affects my family" a dimension, a derived statement, or an inference; does the original question define
  the dimensions to investigate, or can observation discover dimensions outside the question; and, most
  fundamentally, what makes something a dimension rather than merely a piece of information -- proposing a
  candidate resolution (Dimension = an axis along which a statement can be made; Statement = an assertion
  assigning/relating values along dimensions) while explicitly deferring to the human's own understanding
  first, per 0449's methodology.

  Delivers a disciplined critical review with three major corrections before freezing the resulting
  definition. First, confirms the crucial separation **Dimension != Statement != Value** (d=
  RelationshipToArjuna as the semantic axis; s=(Bhishma,d,grandfather) as the statement; grandfather as the
  value) as "a very important distinction." Second, explicitly REJECTS the claim that dimensions are
  necessarily primitive: since the corpus has already established Q_0 -> O_0 -> D_new (dimensions can be
  discovered), a dimension can itself be discovered, derived, decomposed, generalized, or constructed --
  illustrated by a worked hierarchy (Bhisma -[interpretation]-> RelationshipToArjuna -[specialization]->
  {Grandfather, Teacher, Elder}), yielding d_general -> d_specialized and the candidate formula
  Dimension=DerivedSemanticStructure in some cases, with the exact ontology deliberately left open: "a
  dimension is a semantic axis represented in the current knowledge model; its origin may be observed,
  defined, inferred, or discovered."

  Delivers the file's biggest correction: **upgrades Relationship from a simple four-tuple (E_1,E_2,D,V) to
  a rich, eight-component first-class construct** r=(E_1,E_2,T,R,Q,E,Sigma,tau) (participants, relationship
  type, relationship-specific attributes, qualifiers/context, evidence, epistemic status, temporal validity),
  motivated by a progressively richer worked example ("Nexus depends on PostgreSQL" -> "Nexus depends on
  PostgreSQL FOR AUTHENTICATION" -> "Nexus depends on PostgreSQL, according to configuration X, since date Y,
  based on evidence Z"), explicitly "exposing why relationship deserves first-class treatment." Establishes
  four genuinely distinct concepts (Dimension as semantic axis, Value as a position on that axis, Statement
  as an assertion, and Relationship as a semantic connection between entities), posing the open question of
  whether Relationship subset-of Statement or Relationship != Statement while still being expressible BY
  statements, explicitly favoring the latter ("I strongly suspect the second is more useful").

  Uses a detailed, layered decomposition of the Arjuna example (entity/entity/semantic-relation/statement for
  "grandfather"; entity/dimension/value for "side in conflict"; existing-statements -> inference ->
  consequence-proposition for "killing affects family traditions") to confirm, while explicitly refusing to
  freeze, the pipeline Observation -> Dimensions -> Statements -> Relationships -> Inference. Applies the
  Zero Lens concretely to the dimension question, directly reconfirming 0453's Zero-scope-limitation in this
  new context: Zero cannot claim RelationshipToArjuna is "missing" unless it is already part of the relevant
  model/scope, but once observation reveals the Bhisma<->Arjuna connection, Zero can legitimately say "the
  current representation does not contain the relationship dimension required to represent the newly
  observed fact." Reaffirms the clean three-lens separation established at 0452/0453: Zero=boundary
  detection, Lord=horizon expansion, Sarathi=investigation navigation.

  Confirms Consequences are derived statements, never primitive dimensions, formalized as
  Inference(S_1,...,S_n) -> S_derived, and names an important architectural requirement directly following
  from this: KnowledgeOS must be able to tell the Knower "this is directly observed" versus "this is inferred
  from three observations" -- an explicit evidence-provenance requirement.

  Delivers a further refinement not previously stated this precisely: **Dimension != observed variation** --
  a dimension (e.g. Version) remains a genuine dimension even when every current instance shares the same
  value (Version=3.69 for all Nexus instances), since a dimension enables DISTINCTION (classification,
  comparison, description) in general, not merely observed variance in a specific dataset. Produces the
  file's final, consolidated working definition: "a dimension is a semantic axis represented in the
  knowledge model along which an observation, entity, state, or relationship can be distinguished,
  classified, compared, or described. A dimension provides the semantic structure within which statements
  and values can be expressed," formalized as d:Observation/Entity/Relation -> V_d, with
  Statement=(Subject,Dimension,Value) as "a useful first-order form," and Relationship explicitly retained
  as a first-class knowledge construct rather than prematurely reduced to the same structure.

  Closes with a twelve-item status checkpoint using the established color-coded classification: eight items
  marked strong/green (Dimension!=Value, Dimension!=Statement, Dimension-as-semantic-axis [strong],
  dimensions-enable-comparison, dimensions-can-generate-questions, dimensions-may-be-discovered,
  consequences-are-derived [strong], relationship-is-first-class [strong hypothesis]); one marked red/not-
  established (dimension-is-always-primitive, explicitly rejected); and three marked open/yellow
  (relationship-mathematical-structure, dimension-origin/derivation, exact-value-space-mathematics).
  Declares "Question 2 is sufficiently mature to move forward" while explicitly keeping the last three open,
  and sets the precise forward research order Observation -> Dimension -> **Statement** -> Value ->
  Relationship -> Evidence -> Knowledge, explicitly declining to jump to Relationship next despite its newly-
  elevated status, launching Question 3 (What is a Statement?) instead.
