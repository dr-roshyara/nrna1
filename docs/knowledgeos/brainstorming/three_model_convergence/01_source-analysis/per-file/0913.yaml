defines:
  - concept: "PASS≠Theory Proven"
    definition: "A disciplined non-overclaiming principle for interpreting falsification-test results: when an executable implementation of a formal specification survives a specific falsification attempt (a PASS result), this establishes only that the TESTED IMPLEMENTATION satisfied that PARTICULAR CRITERION for that SPECIFIC TEST CASE. It does not establish that the underlying theoretical specification is universally correct, that the implementation is correct for untested cases, or that the theory as a whole has been 'proven.' This directly parallels the corpus's standing distinction between local and global congruence (file 0889) and between empirical demonstration and mathematical proof (file 0904's Defined≠Derived≠Demonstrated≠Closed), applied here specifically to the falsification-test-result interpretation layer"
  - concept: "The Governance-aggregate-cannot-directly-mutate-Knowledge-aggregate DDD invariant"
    definition: "A critical architectural invariant requiring that any effect governance decisions have on the knowledge state must flow through an explicit, auditable pipeline rather than a direct cross-aggregate write: Governance Command→Governance Aggregate→Governance Event→Cross-context handler→Knowledge/Transformation command→Knowledge Aggregate. This prevents governance logic from silently becoming a 'backdoor mutation mechanism' that bypasses the Knowledge aggregate's own invariant-protection boundary, preserving strict aggregate ownership as required by DDD -- directly operationalizing the standing Governance≠Epistemic-state separation this reconstruction has tracked since files 0894/0897/0900/0901/0907/0908/0910/0911/0912 into a concrete implementation-level enforcement mechanism"
