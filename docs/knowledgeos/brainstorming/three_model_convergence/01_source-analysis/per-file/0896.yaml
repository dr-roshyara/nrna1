defines:
  - concept: "The Three Kinds of Correspondence"
    definition: "A methodological typology for classifying any claimed theory-to-implementation mapping, to prevent overclaiming implementation status: Type 1, Semantic realization (ImplementationObject≡TheoryObject under the theory's defined semantics -- the implementation object provably behaves exactly as the theory object requires, e.g. under a complete relevant test suite); Type 2, Partial realization (ImplementationObject⊇ or ⊆TheoryObject -- the implementation covers only part of the required semantics, or covers more than the theory object without being a strict match); Type 3, Analogy (ImplementationObject∼TheoryObject -- the two objects share a name or apparent purpose but semantic equivalence has not been demonstrated). Only Type 1 (and cautiously Type 2, with explicit scope) may be reported as 'implemented'; Type 3 correspondences must never be reported as implementation, since doing so would let implementation vocabulary silently redefine the theory's meaning"
  - concept: "Domain Model≠Infrastructure Representation"
    definition: "A DDD-grounded principle stating that an implementation can contain every raw ingredient a theory requires (graphs, configuration files, identifiers, hashes, evidence collections, governance structures) while still lacking an explicit, canonical representation of the domain model itself (e.g. no object or aggregate literally realizing K=(𝒜,ℛ)). The correct empirical criterion for whether a theory object is implemented is semantic equivalence (does some combination of implementation mechanisms behave exactly as the theory object requires under its defined operations), not class-name equivalence (does a class or field with a matching or similar name exist) -- the theory's K need not appear as a literal KnowledgeState class; it may be legitimately realized through repositories, projections, graph storage, event streams, or query models, as long as the semantics genuinely match"
