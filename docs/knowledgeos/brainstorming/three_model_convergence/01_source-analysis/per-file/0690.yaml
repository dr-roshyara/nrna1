defines:
  - concept: "AgentHarness→KnowledgeOS (not =KnowledgeOS)"
    definition: "An agent harness's local configuration/memory should function as a pointer into the authoritative KnowledgeOS knowledge layer, never as an independent, competing authoritative knowledge store; ClaudeConfig may legitimately differ from CodexConfig in tools/format/lifecycle without violating this boundary, since what must remain symmetric is only the AgentBehavior→SharedKnowledge relationship"
  - concept: "Agent does not inherit unlimited human authority"
    definition: "A human's request that an agent perform an action the human is personally authorized for (e.g. 'approve this for me') does not automatically transfer that authorization to the agent; the agent's authority must be explicitly and separately designed and granted as a delegate authority, never assumed from the requester's own standing"
  - concept: "Agent memory three-way taxonomy"
    definition: "Ephemeral context (current task/session information), Agent state (operational information the agent needs to function), and Organizational knowledge (authoritative engineering knowledge) are three distinct categories; content in the first two categories (e.g. a remembered user preference) must not silently become or be treated as the third"
  - concept: "Agent-to-agent handoff governance"
    definition: "A governed handoff between agents (e.g. Claude delegating work to Codex) must carry Context+Task+Authorization+Evidence+ExpectedOutcome explicitly; a vague instruction with no defined scope or evidence constitutes a poorly governed handoff regardless of how capable the receiving agent is"
  - concept: "Centralized = OneAuthoritativeSemanticModel, not OneDatabase"
    definition: "KnowledgeOS's centralization requirement concerns having one authoritative semantic model/relationship structure across engineering knowledge, not requiring all physical data to reside in a single storage system; evidence, metadata, artifacts, and runtime events may legitimately live in different physical stores as long as KnowledgeOS maintains the semantic relationships and authority across them"
  - concept: "UntrustedInput≠Authority (prompt-injection resistance via hierarchy)"
    definition: "Content from a lower-precedence or untrusted source (e.g. a repository README, an ad hoc task instruction) can never override a higher-precedence authoritative governance/architecture constraint, regardless of its imperative phrasing; the agent-configuration precedence hierarchy (GlobalGovernance→KnowledgeOS→RepositoryArchitecture→AgentOperatingContract→TaskContext) gives this a structural, not merely behavioral, basis"
