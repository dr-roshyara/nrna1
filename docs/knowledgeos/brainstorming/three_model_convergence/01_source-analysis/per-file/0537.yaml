title: "LANDMARK: 'There Is No Universal Scalar Evidence Algebra for KnowledgeOS' (Provisional Theorem) — Seven Candidate Aggregation Algebras Systematically Tested and Six Rejected/Demoted to Pluggable Policies; Ordering≠Combination≠Inference; Idempotence Must Apply to Dependency Classes ℰ/∼, Not Raw Evidence"
