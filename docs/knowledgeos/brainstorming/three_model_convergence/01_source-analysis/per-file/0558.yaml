  - concept: "Bitemporal assertion (refined)"
    definition: "A=(P,E,Σ,Π,T_v,T_o,T_k,Context,ID) — proposition, evidence, epistemic state, provenance, validity interval, observation time, knowledge-incorporation time, semantic context, identity"
  - concept: "Event structure"
    definition: "e=(EventID,Type,AggregateID,Payload,Actor,OccurredAt,RecordedAt,Provenance,CorrelationID) — a standard event-sourcing structure adapted to the epistemic architecture"
  - concept: "Knowledge lag"
    definition: "L(A)=T_k(A)-T_e(A) — the delay between a real-world event occurring and KnowledgeOS incorporating knowledge of it, proposed as an operational metric"
  - concept: "Staleness"
    definition: "Staleness=f(Age,Volatility,Context) — explicitly distinguished from raw Age, since usefulness of an aging fact depends on how rapidly its underlying reality can change"
