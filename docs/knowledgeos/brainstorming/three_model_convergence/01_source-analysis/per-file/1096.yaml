about: >
  "19 — Gītā Candidate Tiering COMPLETED · all 18 chapters adjudicated," superseding the already-tracked
  scope limit ("24 of ~60 assessed"). Reads the ten remaining chapters (8-12, 14-18) directly rather than via
  the correspondence register, confirming the tier counts do NOT change (T4 KERNEL still 2, 0 new primitives,
  0 new canonical relations) but discovering something the register had concealed.

  **DISCOVERS AND MEASURES A MAJOR SYSTEMIC "LANE CONFLICT" (`G-85`) -- THE MOST STRIKING FINDING OF THIS
  FILE**: an entire parallel `external_research` Gītā lane, structured around section titles like "The
  Missing Architecture — Solved" (×5), "The Transformation Algebra — Completed," and "The Supervisory
  Verdict," has been DECLARING SOLVED across chapters 8-18 exactly the questions the disciplined research
  lane (this reconstruction's already-tracked equality arc, files 1010-1094) holds rigorously OPEN, on AT
  LEAST 14 MEASURED COUNTS: "all gaps addressed" (×8) vs. the already-tracked "0 of 13 closure-contract rows
  satisfied" (file 1062); "Architecture Gap ✅ Solved" vs. the already-tracked "`261.23` ACTIVE — 0 of 6
  conditions resolved, 4 FAILED" (files 1071/1084); "Type System ✅ Complete" vs. the already-tracked "`𝒪`
  membership OPEN; 0 of 22 operations has a body, identity, or ratification" (file 1080); "Σ Theory ✅
  Complete — three modes" vs. the already-tracked "`Σ` is FIVE axes, 2240 states; 0 of 5 ordered" (files
  1037-1039); and, most strikingly, Chapter 15's claim to answer "the complete theory of knowledge identity...
  what makes two knowledge objects the same" -- directly claiming to have SOLVED the exact equality question
  this reconstruction's entire tracked research arc (files 1063-1094) establishes as its central, still-open
  problem. Boxed: "Two lanes, one corpus, opposite verdicts on every load-bearing question. NEITHER CITES THE
  OTHER."

  **DIAGNOSES THIS AS A HIGHER-LEVEL, MORE SERIOUS INSTANCE OF THE ALREADY-TRACKED `G-68` VOCABULARY-
  DISJUNCTION FINDING (file 1092)**: "This is `G-68`'s shape at a higher level. `G-68` recorded THREE disjoint
  operation vocabularies. This is a DISJOINT CLOSURE STATUS -- and it is more serious, because a vocabulary
  gap is visible on inspection while a closure-status gap is only visible IF YOU READ BOTH LANES."

  **DISCOVERS A FOURTH DISJOINT VOCABULARY, THE FIRST AT PRIMITIVE LEVEL (`G-86`)**: measures the Chapter-13
  seven-type ontology against the already-tracked ratified eight primitives (`C-022`/step-049), finding "1
  CLEAR OVERLAP OF 8" (`Observation`) -- Entity, State (partial), Event, Proposition, Relation, Policy, Action
  all absent from the Gītā-7, with four Gītā-only types (two of which, `KnowledgeAtma` and
  `KnowledgeAtmaSupreme`, are `RX`). Boxed: "A seven-type ontology missing `Action`, `Policy`, `Event`,
  `Relation` and `Proposition` cannot express admissibility, governance, transitions, or the assertion graph
  -- i.e. cannot express the things Steps 285-291 are actually blocked on. IT IS NOT A COMPETING KERNEL; IT
  IS A DIFFERENT SUBJECT."

  **DELIVERS THREE CONCRETE, CHECKABLE TYPE ERRORS IN THE "SOLVED" FORMALIZATIONS (`G-87`, `G-88`, and part
  of `G-85`)**, invisible from the correspondence register and only found by reading the chapters directly:
  `E1` -- `𝒦_supreme=sup(Ω)` presupposes an order on `Ω` that measurement shows does not exist (0 of 5 `Σ`
  axes ordered, `(Ω,𝓕,P)` does not exist per already-tracked `G-22`); `E2` -- the Chapter-14 `Σ` mapping
  ("Supported"/"Refuted" values) targets the SUPERSEDED two-tuple `Σ_0=(D,S)` of Step 275, using values
  absent from all five ratified axes of the actual, current `Σ`; `E3` -- Chapter 8's `𝒦_ātma`-preservation
  claim quantifies over the unenumerated `𝒯`, "the same shape as `258.20`/`258.21`... a statement over an
  unclosed set is not a solution." "All three are checkable, and all three were invisible from the
  correspondence register... That is the specific reason `18`'s scope limit mattered."

  **DELIVERS THE COMPLETED, CHAPTER-BY-CHAPTER TIER TABLE FOR ALL 18 CHAPTERS**, with a striking movement: T0
  (refuted/`RX`) rises from 8 to 14 once chapters were read directly, entirely by MOVING candidates DOWN from
  T1 (mere correspondence, no formalization checked) once their actual formalizations were found to type-
  check badly -- "Reading the chapters directly did not add candidates. It moved SIX FROM T1 TO T0 -- because
  the register listed their TERMS while the chapters contained their FORMALIZATIONS, and the formalizations
  type-check badly."

  **DELIVERS THE EXPLICIT NON-LICENSE BOUNDARY**: "Does NOT license: deleting, correcting or superseding the
  `external_research` artifacts — that is a REGISTRY/GOVERNANCE act, not a research one... The conflict is
  one of RECORD, not of derivation." And, critically, reframes the discovery as VALIDATING (not undermining)
  the research lane's discipline: "none of this changes Steps 288-291. All remain `R6`. THE LANE CONFLICT IS
  EVIDENCE THAT THE DISCIPLINE WORKED — the research lane reached its verdicts WITHOUT CONSULTING a parallel
  lane that had declared victory."

  Closes with the survey's own final self-assessment: "SYSTEMATIC ANSWER, COMPLETE: ≈60 candidates → 16
  survive to T2+ → 2 reach the kernel, and both were already there. Fourteen are refuted. THE LARGEST SINGLE
  FINDING OF COMPLETING THE SURVEY WAS NOT A CANDIDATE — IT WAS A CONFLICT."
