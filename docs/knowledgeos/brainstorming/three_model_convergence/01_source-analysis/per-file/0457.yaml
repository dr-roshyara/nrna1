about: >
  A three-part, unusually dense landmark file that fully mathematizes 0455/0456's Dimension Discovery and
  parser-lens work, then performs a genuine self-correction and discovers a new, more complete ontological
  ladder that reformulates Question 3.

  **Part 1 (Mathematical Redefinition)** formalizes Parsing != Dimension Discovery != Knowledge as three
  distinct capabilities with a comparison table, then defines: a parsing function P:L->S (natural-language
  space to structured-representation space), decomposed into a structural sub-function
  P_struct:L->T (syntax trees) and a semantic sub-function P_sem:L->R (semantic-role-structure space, worked
  as a concrete set of (role,value) pairs for the Arjuna sentence), combined as
  P(Q)=(P_struct(Q),P_sem(Q)). Defines Dimension Discovery as D:(S,C,K)->2^D_candidate (a POWER-SET-valued
  function), with the discovery formula D_candidate=Union(D_Q,D_C,D_Domain,D_Pattern,D_Zero,D_Lord) (a
  six-source variant, folding observation into the Zero/Lord sources) and a full discovery algorithm in
  pseudocode. Fully works the Arjuna case end-to-end, producing a fourteen-element candidate-dimension set
  from six distinct sources including D_Zero (Moral_Obligation, "Zero detects unrepresented dimension") and
  D_Lord (Consequence, Karmic_Effect, "Lord horizon expansion").

  Formalizes the **recursive discovery cycle**
  Q_t -[P]-> S_t -[D]-> D_{t+1} -[O]-> K_{t+1} -[Zero+Lord]-> Q_{t+1}, with explicit recursive equations
  (D_{t+1}=D(P(Q_t),K_t,C_t); K_{t+1}=Investigate(D_{t+1},K_t); Q_{t+1}=GenerateQuestions(K_{t+1},Z(K_{t+1}),
  L(K_{t+1}))) and an explicit **termination condition**: Z(K_t)=empty-set OR
  DecisionSufficiency(K_t,I_t)=True -- directly reusing 0423's Decision Sufficiency construct as the halting
  criterion for the entire discovery loop. States **four mathematical invariants**: (1) Parsing!=Knowledge
  (P(Q)!=K); (2) Discovery!=Validation (D(P(Q),K,C)!=ConfirmedDimensions); (3) Recursive Refinement
  (D_{t+1} is a superset of D_t, or D_{t+1}!=D_t); (4) **Zero and Lord are Sources, Not Authorities**
  (Z(K)->Candidates and L(K)->Candidates; "both suggest dimensions; neither establishes them"). Produces a
  complete architecture diagram (Parsing Capability -> Dimension Discovery Capability -> Investigation
  Capability/Sārathi -> Knowledge) and closes by proposing Question 3/4/5 (Statement/Value/Relationship) to
  complete a six-component Knowledge tuple K=Knowledge(S,V,R,E,Sigma,tau) -- directly paralleling 0454's
  eight-component Relationship tuple pattern.

  **Part 2 (The Sanskrit-Type Parser: A Formal Analysis)** gives the classical **six-kāraka system** its
  correct canonical form for the first time in the corpus -- Agent/Kartṛ, Object/Karma, Instrument/Karaṇa,
  Source/Apādāna, Recipient/Sampradāna, Location/Adhikaraṇa (0456 had informally mixed in Sambandha/Kartavya
  as if they were additional kārakas; this file correctly separates the six canonical kārakas from
  supplementary semantic dimensions such as Sambandha/relation and Kartavya/obligation). Formalizes
  Sentence->Action(Kriyā)+Roles(Kārakas), a Sanskrit parsing function P_Sanskrit:L->K_roles, a role-to-
  dimension mapping function M:K_roles->2^D, and a combined discovery function
  D(Q,K,C)=Union(M(P_Sanskrit(Q)),M(P_struct(Q)),O_domain(C)). Produces detailed structural-vs-Sanskrit
  comparison tables and claims, at this stage, that the Sanskrit lens encodes a **"universal semantic
  ontology"** that is domain-independent and could function as a "universal semantic parser for any domain"
  -- a strong claim that Part 3 explicitly walks back.

  **Part 3 (critical review of Parts 1-2)** delivers the file's most significant correction: **rejects
  calling the Sanskrit approach a "universal semantic ontology,"** reclassifying it instead as a
  **candidate semantic-role lens that must be tested across domains** -- a live, in-file self-correction of
  Part 2's overclaim, consistent with the corpus's discipline of never treating an analogy/lens as
  established fact. Adds a missing pipeline element: the Question->Parsing->Dimensions chain is replaced by
  **Question -> Semantic Reconstruction -> Open Variables -> Candidate Dimensions -> Inquiry Assessment ->
  Observation/Clarification**, because a Knower's question can itself be *incomplete* (worked via "Show me
  those." -- "those" has an unresolved referent, which is **not a dimension but an epistemic/inquiry gap**,
  requiring KnowledgeOS to ask "Who or what do you mean by 'those'?"). This makes **Zero part of the
  language/inquiry pipeline itself**, not merely a post-processing gap check, and adds **Reference
  Resolution** as a new named sub-analysis inside Semantic Reconstruction (alongside structural, semantic-
  role, modality, and context analysis) via a refined architecture diagram culminating in an explicit
  incomplete/sufficient branch (ASK KNOWER vs. INVESTIGATE).

  Introduces a **five-way non-collapsible ontological ladder** -- SemanticRole (e.g. Agent) != CandidateDimension
  (e.g. Actor) != Dimension (Actor, once accepted) != Value (Arjuna) != Statement (Actor=Arjuna) -- extending
  0454/0455's four-way Dimension/Value/Statement/Relationship separation by prepending SemanticRole as a
  prior, fifth layer. On this basis, **rigorously reformulates Question 3**: not merely "What is a
  Statement?" but "What exactly constitutes a Statement in KnowledgeOS, and how do we distinguish an
  observed statement from an inferred, reported, assumed, calculated, or hypothetical statement?" --
  explicitly because Zero cannot function correctly without knowing a statement's epistemic status. Lists
  seven candidate statement sources (Observation, Natural-language assertion, Inference, Calculation,
  Relationship, External evidence, Human declaration) and six candidate epistemic-status values (OBSERVED,
  REPORTED, INFERRED, ASSUMED, CONTESTED, UNKNOWN), worked via the identical sentence "Bhishma is Arjuna's
  grandfather" carrying different possible epistemic statuses despite identical text. Concludes: proceed to
  Question 3, but require that epistemic provenance and status be made **part of the question itself**,
  rather than defining a Statement merely as (Entity, Dimension, Value).
