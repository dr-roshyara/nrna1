about: >
  Directly continues 0759's programme-status summary by addressing the eventual book-synthesis output
  structure (still not authorized to begin, per 0759's governance state), delivering the principle: "the
  old timestamped files are the research archive. The book is a new, curated narrative generated from that
  archive and from the validated architectural synthesis" -- book planned as "a separate synthesis
  product, not a pile of rewritten session files."

  Delivers a proposed final repository structure under `docs/knowledgeos/reviews/synthesis/`: `analysis/`
  (archaeology/evidence, matching 0757's seven deliverables), `model/` (canonical architecture, formal
  model, invariant system), `architecture/` (eventual 3C conformance/implementation-mapping results), and
  `book/` -- a ten-chapter provisional outline plus front-matter and appendices, each chapter in its own
  folder (`00-front-matter/`, `01-the-question/` through `10-conformance-and-reality/`, `99-appendices/`),
  each chapter folder containing `chapter.md`/`evidence.md`/`notes.md`.

  **Explicitly defers finalizing chapter titles**: "we have discovered the architecture, but we haven't
  finished 3B/3C. The eventual book structure should emerge from the validated synthesis" -- delivers the
  full pipeline this must follow before book architecture is even proposed as fixed: `Historical corpus→
  Phase 1 Archaeology→Phase 2 Separation/Lineage→Phase 3A Canonical model→3B Formal consistency→3C
  Repository conformance→BOOK ARCHITECTURE→Chapter map→Chapter evidence maps→Chapter drafts→Cross-chapter
  consistency→Final synthesis`.

  **Delivers a refined four-artifact per-chapter structure**, motivated explicitly by "what we have learned
  about evidence vs. interpretation": `chapter.md` (the readable book text), `evidence-map.md` (chapter
  claim→source document→exact evidence→epistemic grade), `claims.md` (distinguishing established/strongly
  supported/synthesized/hypothesis per claim), and **`unresolved.md`, whose explicit purpose is to
  "prevent Claude from unconsciously 'cleaning up' something that was actually unresolved"** -- a genuinely
  valuable documentation-discipline pattern directly protecting the historical-integrity rule established
  at 0756.

  **Delivers "the biggest danger" this structure is designed to avoid**: "we do NOT want Claude to take 408
  files and simply produce 10 chapters. That would be compression, not synthesis." Instead: "the book is
  the final explanatory projection of the research" -- delivered as a four-layer relationship diagram
  (`HISTORICAL CORPUS "what happened?" → ANALYSIS "what does evidence support?" → CANONICAL MODEL "what
  architecture can we responsibly state?" → BOOK "how did we discover it?"`), each layer answering a
  distinct question the layer below it cannot answer.

  **Delivers the file's central constitutional rule for the eventual book**: "no sentence in the final book
  may silently upgrade the epistemic status of the underlying evidence" -- explicitly grounded in "the
  whole project has demonstrated the difference between what was observed, what was inferred, what was
  formally derived, and what was actually tested" -- directly resonant with this reconstruction's own
  governing epistemic discipline against silently converting hypothesis into definition. No actual code
  execution or verified repository claim is made in this file; it is entirely prospective structural
  planning, and the book phase itself remains unauthorized per 0759's governance state (Phase 3/Book
  synthesis 🔒 Not authorized).
