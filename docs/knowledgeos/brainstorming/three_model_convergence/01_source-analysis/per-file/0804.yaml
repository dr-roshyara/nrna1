defines:
  - concept: "The four ternary governance relations R, H, U, Q"
    definition: "Over the set of actors A, actions X, and time T, four distinct subsets of A×X×T formalize the governance-relevant relationships an actor can have to an action at a given time: R (capability -- can the actor technically/cognitively perform it), H (responsibility -- who owns or is tasked with carrying out the concern), U (authority -- who is empowered to make a binding organizational determination about it), and Q (accountability -- who is answerable for its outcome); these are generally distinct sets (R≠H≠U≠Q), and collapsing them is identified as the source of 'a surprisingly large portion of enterprise governance confusion'"
  - concept: "'Capability is never sufficient evidence of authority'"
    definition: "No matter how strong the demonstration that an actor (human or AI) can technically perform an action -- however many times, however reliably, however sophisticated the capability -- this fact alone can never be treated as establishing that the actor is organizationally authorized to perform it; authority must always derive from an explicit, separately governed authority basis (role, scope, policy, time, delegation), never inferred backward from demonstrated capability, named one of the architecture's strongest AI safety and governance properties precisely because AI systems tend to make capability highly visible and authority easy to overlook"
  - concept: "The bounded AI role"
    definition: "When an AI agent performs activities associated with a named professional role (e.g. architecture analysis performed by an 'architecture agent'), the agent should never be treated as equivalent to a human holding that role (AIArchitect≠HumanArchitect) -- the AI's role is bounded to the specific capabilities and authorizations explicitly granted to it, excluding organizational accountability, legal responsibility, governance authority, and final approval authority that a human role-holder would carry, and its output should explicitly declare its epistemic position (e.g. 'Authority: Advisory') rather than implying a stronger authority than it possesses"
