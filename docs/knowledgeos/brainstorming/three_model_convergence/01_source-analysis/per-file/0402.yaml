about: >
  A landmark consolidation file, the natural formalization successor to 0392's twenty-two-question catalog,
  reorganizing the corpus's accumulated open questions from the 0389-0401 dimension/semantic/epistemology
  arc into TWELVE explicit questions grouped under FOUR CATEGORIES, followed by an explicit SIX-PHASE
  prioritized research programme and a concrete THREE-LENS empirical disagreement-detection experiment.
  Opens with the now-familiar self-discipline move: "stop adding new concepts temporarily and define the
  research questions that remain open."

  CATEGORY A -- What exactly is the object we are modelling? (1) What is a "state"? -- unresolved boundary
  question (technical properties? relationships? environment? dependencies? applicable rules? organizational
  decisions? all of these?); (2) What is a dimension? -- restates the working definition ("an aspect along
  which a state can be characterized") but poses six sharp sub-questions not previously assembled together:
  can every fact be a dimension? can a dimension itself have dimensions? are dimensions hierarchical? are
  relationships dimensions? can a dimension be DERIVED rather than observed? can a dimension become relevant
  without being explicitly named? -- explicitly named "probably one of the most important unresolved
  questions"; (3) What is the "ideal observed state" I-hat_t precisely? -- five candidate meanings restated
  (theoretically complete state / expected state / target state / reference-derived state / state
  reconstructed from all available knowledge), needing clarification before mathematical use.

  CATEGORY B -- How do we extract knowledge? (4) What is the smallest semantic unit? -- reconfirms 0399/0400's
  finding that sentence=dimension is too coarse, restates the Sentence->Claim->Dimension->Value chain and
  the candidate Assertion=Subject+Dimension+Value+Context, explicitly flagged as needing testing against
  real documents (not yet the resolved 0400 candidate, treated here as still provisional); (5) What exactly
  does the Sanskrit/Paninian lens contribute? -- explicitly demoted from philosophical to EXPERIMENTAL
  investigation, listing eight target extraction roles (subject/object/agent/instrument/source/context/
  relationship/action/semantic-role) and restating the key tested principle Expression->SemanticStructure
  (not Expression=Meaning), with an explicit requirement to determine WHICH Sanskrit grammatical principles
  are genuinely useful versus merely analogical; (6) How does a sentence become a dimension/value? --
  reconfirms the Observed-value versus Derived-value distinction via the Nexus version/outdated worked pair,
  named "a major unresolved point."

  CATEGORY C -- How do we establish knowledge? (7) What makes an extracted statement Knowledge? -- restates
  0397's epistemic-conditions list (truth/factivity, evidence, belief, justification, entitlement,
  recognitional ability, testimony, safety/anti-luck) and crystallizes the key unresolved question as
  Correct-determination =?= Knowledge, explicitly stating "we currently have no reason to assume they are
  identical"; (8) How do we represent uncertainty? -- reconfirms the two fundamentally different uncertainty
  types (known-dimension-uncertain-value versus unknown-dimension), crystallized memorably as "we don't know
  what we don't know," requiring separate mathematical treatment for each; (9) How do probability and logic
  interact? -- reconfirms Knowledge!=Probability while posing the extraction-order question (Observation->
  Probability->Determination versus Observation->Logic->Determination versus cases requiring both), and
  distinguishes FOUR separate uncertainty targets: probability-of-a-value, probability-that-a-dimension-is-
  relevant, confidence-in-extraction, and uncertainty-about-the-model-itself -- consolidating scattered
  probability-scoping findings from across 0374-0400 into one four-item list.

  CATEGORY D -- How does Knowledge evolve? (10) What exactly is a Knowledge State Transition? -- restates
  the NewInformation->NewDimension->Recalculation->Comparison->NewKnowledge chain (0396) and poses the
  sharpened preservation question (what must be preserved from K_t to reconstruct why K_{t+1} differs?),
  with a candidate substrate Evidence+Dimensions+Values+Relationships+Rules+Time+Provenance explicitly
  flagged as "not yet established as the minimum"; (11) How do contradictions work? -- reconfirms
  K={Claim_A,Claim_B,Conflict} as a legitimate knowledge state (0395/0396's Conflict-is-Knowledge), posing
  five unresolved sub-questions (what constitutes a conflict; can contradictions coexist; how is conflicting
  evidence represented; how does later evidence change a conflict; how does an owner decision relate to a
  conflict); (12) How does Knowledge relate to decisions? -- restates the Knowledge->Determination->Decision
  chain and the owner-decision-as-new-information/dimension finding (0396), posing the sharp unresolved
  question of what a decision IS in the knowledge model, with six candidate ontological categories (fact/
  dimension/governance-assertion/constraint/reference-state/action).

  Delivers the file's central methodological contribution: an explicit SIX-PHASE PRIORITIZED RESEARCH
  PROGRAMME, deliberately NOT researching all twelve questions simultaneously: Phase 1 ONTOLOGY (State->
  Dimension->Value->Relation); Phase 2 SEMANTIC EXTRACTION (Expression->SemanticStructure->Dimension/Value,
  investigating the Sanskrit/Paninian lens plus parser/AST approaches, directly building on 0400/0401);
  Phase 3 EPISTEMOLOGY (SemanticAssertion->Evidence->Determination->Knowledge, investigating Pritchard/
  Millar/Haddock/testimony/entitlement/safety, building on 0397); Phase 4 DYNAMICS (K_t->K_{t+1} with new
  dimensions, new information, recalculation, contradictions, temporal validity, building on 0393-0396);
  Phase 5 MATHEMATICS, explicitly deferred until AFTER the preceding four phases -- "what mathematical
  structure represents all of this?" (graphs, state spaces, probability, logic, lattices, temporal models,
  or something not yet identified); Phase 6 KERNEL, explicitly deferred until last -- "what is the smallest
  KnowledgeOS unit that must be preserved?" -- this explicit phase ordering formalizes and generalizes the
  corpus's recurring pre-Kernel-design discipline (0382/0391/0392) into a concrete six-stage sequence with
  Mathematics deliberately placed second-to-last, a striking departure from the corpus's earlier
  mathematics-first instincts (0327-0340).

  Closes by proposing the corpus's next concrete research experiment be LINGUISTIC, not architectural: take
  one real Nexus document and process every sentence through a full ten-stage pipeline (Sentence->Tokens->
  Syntax->Semantic-roles->Claims->Dimensions->Values->Relations->Evidence->Derived-determinations),
  explicitly proposing to examine WHERE THE MODEL BREAKS as more informative than continuing to define
  "knowledge" abstractly. Specifies a concrete THREE-LENS COMPARISON METHODOLOGY applied to the SAME
  sentences: (1) Conventional NLP/AST parsing; (2) Sanskrit/Paninian semantic-role lens; (3) the corpus's
  own dimension/value/state lens -- explicitly predicting "the places where all three disagree will probably
  reveal the real unresolved structure of KnowledgeOS," a genuine empirical disagreement-detection
  methodology directly structurally parallel to 0358's cross-regime Intersection Method, but newly applied
  specifically at the semantic-extraction layer rather than the epistemic-determination layer.
