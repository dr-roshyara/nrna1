  - concept: "Explicit rejection of a flat Knowledge=(Evidence,Justification,Confidence,History,...) tuple in favor of typed relational edges (Claim-supportedBy->Evidence, Claim-justifiedBy->Justification, Claim-assessedAs->EpistemicStatus, Claim_i-supersedes->Claim_j), explicitly converging Navya-Nyaya and relation theory and warning against turning every relation into an object property"
  - concept: "Order-theoretic challenge to epistemic-state linearity: Unknown/Validated/Rejected/Conflicted/Superseded may form a PARTIAL ORDER, not a linear state machine, and 'superseded' may not be a state at all but a relation K1-prec-K2 -- directly resolving the uploaded research's open SUPERSEDED/RECONCILED/CONTESTED/INSUFFICIENT_EVIDENCE states-vs-relationships-vs-events-vs-assessments-vs-derived-conditions question in the relations/events direction"
  - concept: "History reframed as a TEMPORAL RELATION over domain events rather than a property of Knowledge, via four named transition types: Persistence (F(t1)=>F(t2)), Revision (F(t1)!=F(t2)), Supersession (F1(t1)->F2(t2)), Withdrawal (F(t1)->not-Active(F,t2)) -- 'a major architectural distinction'"
