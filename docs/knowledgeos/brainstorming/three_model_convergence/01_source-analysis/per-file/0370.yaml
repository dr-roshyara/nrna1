  - concept: "Information-theoretic reading of the Viveka principle: I(C;E) as a precise mathematical interpretation of 'which distinctions must not collapse,' converting a philosophical distinguishability principle into a testable information-theoretic question (does the evidence contain enough information to distinguish A from B?)"
  - concept: "'A mathematical structure is earned by the phenomenon; we don't impose it' -- a governing epistemic-humility principle applied specifically to the topological/metric lens (a distance d(K1,K2) for 'small' epistemic change is adopted only if meaningful, rejected otherwise)"
  - concept: "Logic+Godel combined constitutional principle: Kernel validity != world truth -- the Kernel's Gamma|-P/Gamma|-not-P determinations cannot establish propositions about the system itself that lie outside Gamma, explicitly named 'potentially one of the deepest constitutional principles,' sharpening the uploaded research's own boundary principle"
  - concept: "Category-theoretic representation invariance: representation transformations f:C1->C2 preserving relevant semantic relations define what 'representation-independent' precisely means for the Kernel, sharpened into 'which structure must remain invariant under representation change?'"
  - concept: "Abstract epistemic-phenomenon object X with lens functions L1(X)..L6(X)+ (logical/relational/temporal/probabilistic/information/causal structure), with the convergence criterion 'what structure appears repeatedly across independent lenses?' as the research target, more valuable than any single lens's output"
  - concept: "Seven-row concrete cross-lens convergence table (checked against DDD/Nyaya/Viveka/Logic/Relations/Temporal/Information columns) demonstrating genuine independent-lens agreement on: Claim-distinguished-from-evidence; Evidence-traceability; representation-can-change-without-identity-change; supersession-is-relational; Confidence!=truth; History-is-not-merely-current-state; Boundary-cannot-prove-external-truth -- reframing the conclusion from a single-voice claim ('I think the Kernel is a constitutional membrane') to a convergence-based discovery statement"
  - concept: "Two new mathematical companion research questions added to the uploaded research's primary consistency-boundary question: (a) which mathematical structures represent the boundary's invariants without introducing domain-unsupported distinctions; (b) which structures survive across independent lenses"
