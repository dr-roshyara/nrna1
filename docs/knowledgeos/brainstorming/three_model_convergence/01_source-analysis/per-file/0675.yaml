defines:
  - concept: "GraphSize≠ReasoningSize"
    definition: "The total size of KnowledgeOS's knowledge graph is not the relevant computational scale for any given reasoning task; a reasoning engine should construct and operate on a query-relevant subgraph G_Q⊆G, with the critical unresolved question being how to establish that G_Q contains everything necessary (connecting directly to the completeness discipline established at 0673)"
  - concept: "CacheValidity=f(InputVersion,PolicyVersion,ModelVersion)"
    definition: "A cached derived artifact's validity is not a simple performance/freshness timestamp but depends jointly on the specific versions of the evidence, policy, and model from which it was derived; if any of these three inputs has changed since the cache entry was produced, the entry must be recognized as derived under the old version, not silently treated as current"
  - concept: "EconomicOptimization⊆GovernedFeasibleSpace"
    definition: "Cost-benefit optimization of computational effort (comparing Value of Information against computation cost) is a legitimate consideration only within the space of actions governance has already deemed permissible; a mandatory governance requirement (e.g. a required security scan) is never overridden by an unfavorable economic calculation"
  - concept: "CheapApproximation→CheckBoundary→RefineIfNecessary"
    definition: "A scalable computational pattern: first compute a cheap approximate estimate with a known error bound; check whether that estimate, with its uncertainty, is unambiguously on one side of the relevant decision boundary; only invoke expensive exact/refined computation when the boundary lies within the approximation's uncertainty interval — this avoids costly exact computation for the (typically common) cases where the answer is already clear"
  - concept: "Timeout as epistemic information (not evidence for False)"
    definition: "When a computation is terminated due to resource exhaustion or time limits before producing a definitive result, the correct outcome is an explicit Unknown/Incomplete status with the timeout recorded as the reason, never a silent default to a negative (or positive) conclusion; a timeout is provenance information about the limits of the attempted computation, not evidence bearing on the question itself"
