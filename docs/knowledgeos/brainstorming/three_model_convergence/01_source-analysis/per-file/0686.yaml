  - concept: "A_I ≅? A_C ≅? A_R(t)"
    definition: "The empirical conformance test comparing three distinct architecture states: A_I (intended, per architecture/ADRs/principles/governance), A_C (implemented, per actual repository/code/configuration), and A_R(t) (runtime, per actual deployed and behaving system at time t) — conflating any two of these without evidence is a category error"
  - concept: "Coverage≠Correctness"
    definition: "A conformance model showing 100% traceability (every requirement mapped to some implementation artifact) does not establish that the mapped artifacts are themselves correct; traceability, implementation, verification, and runtime conformance are four distinct dimensions that must not be collapsed into a single completion claim"
