about: >
  "03 — Decision-Procedure Matrix (mandate §§4, 15)."

  **§4 pins every relation to exactly one carrier level** (value/assertion/entity-object/state/history/
  operation/event/policy/observation/provenance/system-behaviour), confirming three levels have NO relation
  defined at all (operation, event, policy).

  **§4b DELIVERS A DEFINITIVE FIFTEEN-ROW PROMOTION-VALIDITY AUDIT**, consolidating every category error and
  valid theorem this reconstruction has tracked across the entire equality-research arc into one catalog: SIX
  INVALID promotions confirmed EXECUTED (value-to-state promotion; Σ-structural-to-K-structural; the F5
  Σ-order-to-K-order error, explicitly marked "binding per mandate §2"; `≈_X`-to-corpus-`≈`; finite-sample-
  to-equality; hash-to-semantic-equality; decidable-to-congruence); TWO VALID theorems confirmed EXECUTED
  (`X⊆Y⟹≈_Y` refines `≈_X`; `≈_X` is an equivalence relation); and several UNPROVEN/FORBIDDEN classifications
  (corpus `≈`'s equivalence-relation status is unprovable because `𝒪_K` is not closed -- "there is no function
  to take the kernel of"; `≡_sem`'s transitivity remains unproven; and the equality hierarchy is "UNPROVEN and
  FORBIDDEN as a chain," directly confirming and extending file 1041's already-tracked finding).

  **Re-audits every `Σ`-order/`K`-order occurrence across the entire programme and confirms CLEAN**: the
  already-tracked F5 defect is verified repaired at every occurrence (the "08" document, `REFINED-STEP-287`
  §4, "00-INDEX," `REFINED-STEP-288` v2 §7), with "no new `K`-order inference found" in a fresh sweep --
  confirming the disciplined correction cycle (files 1031-1037) genuinely held. Restates the per-axis order
  finding: "0 of 5 `Σ` component orders established," with a NEW explanatory note for `A`'s unorderability:
  "all seven `A` values are acquisition MODES... and modes do not order."

  **§15 delivers the definitive four-codomain reconciliation** (already tracked in outline via files 1037-
  1038, now completed): `012§36`'s governing principle ("the relation itself should not be confused with its
  epistemic certainty"), the derived `Decide_≡:𝒦×𝒦→(Relation×Status)` reconciliation, and the precise
  distinction "a procedure that answers `Unknown` is NOT a complete equality decision procedure" -- confirming
  `012§35`'s theorem-shaped undecidability result "is decisive and is a limit, not a work item," agreeing with
  four independent corpus loci.

  **DELIVERS THE DEFINITIVE, CAPSTONE COMPLETENESS MATRIX -- THE PROGRAMME'S SINGLE MOST COMPREHENSIVE AND
  DEVASTATING SUMMARY STATEMENT**: a ten-relation × eight-property table (Named/Defined/Typed/Parameterized/
  Decidable/Implementable/Governance-authorized/Congruent) covering every relation this reconstruction has
  tracked across the entire equality-research arc (`=`,`≡`,`≈`,`≅_P`,`≅_I`,`≅_H`/`≡_𝒯`,`∼_F`,`Continuity`,
  `≡_D`,`≈_X`). **BOXED FINAL RESULT: "ZERO unconditional Level-5 state-level relations. ZERO proven
  congruences. Implementable: EMPTY. Governance-authorized: EMPTY."** This is the definitive, quantified
  closure statement for the entire equality/identity research programme spanning files 0989-1043 -- every
  relation is named and mostly defined, but not one is simultaneously decidable, implementable, governance-
  authorized, AND congruent.

  **Also confirms `≈_X`'s already-tracked "exactly 32" refinement (file 1039) is now formally adopted in the
  BOUNDED classification**, "tightened from 'at most.'"
