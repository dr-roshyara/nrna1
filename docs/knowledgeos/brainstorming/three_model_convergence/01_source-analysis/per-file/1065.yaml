about: >
  "01 — Corpus Relation Register (mandate §3)," the full twenty-entry register (matching and completing file
  1063's script transcription), 5 of 20 entries carrying an actual definition, 15 naming only.

  **DELIVERS A GENUINELY IMPORTANT RESOLUTION OF THE '261.20/25' REFERENCE INTRODUCED IN FILE 1063**: the
  seven-tuple `𝔎=(K,=_str,≡_sem,≈_obs,SameId,≡_H,≡_P)` (`261.25`) is confirmed to be **THE SAME REGISTER AS
  `261.1`, JUST IN A SECOND NOTATION** -- "Six-for-six against `261.1`": `≅_I↔SameId`, `≅_P↔≡_P`, `≅_H↔≡_H`.
  **CONFIRMS THE ALREADY-TRACKED NINE-REGISTER COUNT (file 1041) STANDS UNCHANGED** -- this is not a tenth
  register.

  **DELIVERS A GENUINELY VALUABLE, POTENTIALLY DE-ESCALATING DIAGNOSIS OF THE LIKELY ROOT CAUSE OF THE ENTIRE
  N-1 CONFUSION**: "`261` is INTERNALLY INCONSISTENT IN GLYPHS while PERFECTLY CONSISTENT IN CONTENT -- and
  that drift is a PLAUSIBLE CAUSE OF THE CONFUSION Step 290 is resolving. `≡_H`/`≡_P` in the second notation
  REUSE the `≡` glyph that the first notation RESERVES for semantic equality. A reader tracking glyphs rather
  than sections would see `≡` doing FOUR JOBS." This is a materially important reframing of the already-
  tracked N-1 conflict (files 1041, 1047, 1054-1055, 1057-1063): the appearance of a genuine content-level
  contradiction in the corpus's equality relations may substantially trace to a SINGLE DOCUMENT'S OWN
  internally inconsistent glyph choices across two of its own notations, rather than a deeper substantive
  disagreement about what the relations actually mean. This directly complements file 1063's already-tracked
  finding (the shared observational formula for `≡_K` is self-labelled a candidate, not an assertion) with a
  second, independent, disciplined explanation for why the conflict appeared genuine at first reading.

  **Confirms the STATUS block's summary**: "the two `≡_K` loci are self-labelled candidates" (already tracked,
  file 1063) and "15 relations have no definition" -- reiterating the extensive gap in the corpus's own
  equality-relation specification.
