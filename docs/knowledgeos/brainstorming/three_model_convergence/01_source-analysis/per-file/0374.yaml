    refinement: "Every arrow re-derived as CONDITIONAL rather than certain -- Evidence is E|C,t, Reasoning is R|E,C,t, and the implication A=>B itself depends on a hidden assumption set C, correcting the prior chain's residual determinism"
  - concept: "0366/0372's K_t*/K-hat_t and V_t*(p)/V-hat_t(p) ideal-vs-actual gap formalizations, which implicitly assumed K_t*(p)/V_t*(p) in {0,1}"
    refinement: "That assumption is explicitly WITHDRAWN: the ideal state may itself be conditional and irreducibly probabilistic (K_t*(p|C_t)=0.73 is possible even at the ideal limit), decomposing the single gap into two genuinely distinct gaps (epistemic incompleteness vs. irreducible uncertainty) -- the most significant correction to this formalization family to date"
  - concept: "0364's overlapping-elements/inverse-problem finding (a single observation compatible with multiple underlying states)"
    refinement: "Given a precise mathematical operationalization within the conditional pipeline: O~S1,S2,S3 with P(Si|O,C) distributing probability across candidate states, directly connecting the inverse-problem framing to the new fully-conditional determination formalism"
  - concept: "0372/0373's V(p)=0.8 / assessment-vs-proposition interpretation-underdetermination discussion"
    refinement: "Deepened via the four-way uncertainty-type decomposition (evidence/model/state/proposition), explicitly warning against collapsing these into one number prematurely -- giving the corpus's interpretation-underdetermination concern a structured, named taxonomy rather than a general caution"
