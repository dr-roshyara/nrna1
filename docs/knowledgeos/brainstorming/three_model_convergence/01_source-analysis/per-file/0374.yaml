  - concept: "Hidden-assumption-set correction to implication: A=>B is revealed to actually mean (A AND C)=>B for a hidden assumption set C={c1,...,cn}, formalized as R(B|A,C) rather than an unconditional A=>B"
  - concept: "Fact reformulated from an unconditional truth-claim to Fact_t(p|C,R,E): p determined as a fact UNDER SPECIFIED conditions/evidence/reasoning at time t, explicitly permitting context-relative validity (Fact_t1(p) valid under one context while Fact_t2(p) is revised under new evidence)"
  - concept: "Four explicitly distinct uncertainty types that must not be collapsed into one number: Evidence uncertainty P(E|p,C); Model/reasoning uncertainty P(R|E,C); State uncertainty P(S|E,C); Proposition uncertainty P(p|E,R,C,t)"
  - concept: "Mathematical operationalization of 0364's overlapping-elements finding: a single observation O compatible with multiple candidate states (O~S1,S2,S3), so extraction is O->{S1,S2,...}->conditional-assessment, not O->S directly"
  - concept: "Explicit Probability!=Uncertainty refutation: probability is 'one mathematical representation of uncertainty under specified assumptions,' demonstrated via an inter-observer-disagreement worked example (P_A(p|E,C)!=P_B(p|E,C) for identical evidence/context but differing models) -- 'same information + different model -> different epistemic state'"
  - concept: "Fully conditional five-stage pipeline: O_<=t -[Evidence|C_t]-> E_t -[Reasoning|M_t]-> R_t -[Determination]-> F_t -[Assessment]-> K_t, with explicit conditional formulas for each stage and a fully conditional probabilistic realization P(F_t|O_<=t,F_<t,M_t,C_t)"
  - concept: "WITHDRAWAL of the prior assumption K_t*(p) in {0,1}: the ideal Knowledge state may itself be conditional and irreducibly probabilistic, K_t*(p|C_t)=P(p|C_t,E_t)=0.73, WITHOUT this meaning Knowledge is incomplete -- 'Ideal Knowledge != omniscience,' explicitly called 'a very important conclusion'"
  - concept: "New two-gap distinction resolving a latent ambiguity in every prior K_t*/K-hat_t formalization since 0366: Gap 1 (epistemic incompleteness, K-hat_t<K_t*, extractable but not yet extracted) versus Gap 2 (irreducible uncertainty, even K_t* itself is uncertain) -- explicitly named 'fundamental'"
  - concept: "Final research-target reformulation: 'Under what conditions does evidence, combined with conditional reasoning and existing determinations, warrant assigning a proposition a particular epistemic state?', formalized as (E,F_<=t,R,C,t) -> script-E_t(p), with probability as only one of several possible regime realizations (logical status, evidence interval, fuzzy truth value being others)"
  - concept: "Ten-area mathematical comparison programme for combining conditional evidence/reasoning into an epistemic state and finding what is invariant across representations: Bayesian probability, conditional probability, Bayesian networks, Dempster-Shafer theory, fuzzy/many-valued logic, non-monotonic logic, defeasible reasoning, argumentation theory, epistemic logic, temporal logic, measurement theory"
