defines:
  - concept: "TrueAt(C,t)≠KnownAt(C,t)"
    definition: "A claim can be true in the world at a given time while KnowledgeOS (or a specific decision process) has not yet learned it — a decision made before the system acquires knowledge of an already-true fact correctly reflects Known(F,t)=False even though Truth(F,t)=True, sharper than the more general ValidTime≠RecordedTime distinction because it is anchored to a specific decision-relevant moment"
  - concept: "Valid time versus Transaction time (bitemporal modeling)"
    definition: "Valid time (V(C)) records when a fact was true in the modeled world; Transaction time (T(C)) records when the system recorded that fact; the two are independent dimensions, and late-arriving knowledge (a fact valid earlier but recorded later) requires both to be preserved simultaneously"
  - concept: "DriftCause temporal attribution"
    definition: "An architecture-governance violation newly detected at time t must be attributable to a specific type of change (ImplementationChange, ArchitectureChange, or PolicyChange) that occurred, since a violation can emerge purely from a rule change with the underlying implementation completely unchanged — extending 0664's drift discipline with an explicit causal-attribution requirement"
