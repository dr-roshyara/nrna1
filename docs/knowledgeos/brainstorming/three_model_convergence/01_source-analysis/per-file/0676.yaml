defines:
  - concept: "Meaning≠Technology"
    definition: "Two implementations built on entirely different storage or infrastructure technologies (e.g. PostgreSQL versus MySQL, Neo4j versus a document database) can both correctly refine the same abstract mathematical/institutional model, provided their observable behavior is equivalent (Obs(I_1)=Obs(I_2)); the mathematical model describes meaning, the implementation describes mechanism, and architectural correctness does not depend on which mechanism is chosen"
  - concept: "Proof Surface"
    definition: "A conceptual metric for the number and complexity of distinct places in an implementation where a given invariant must be independently maintained and could independently be violated; an architecture minimizing proof surface (e.g. a single authorization boundary rather than fifty independently-authorizing components) is more formally tractable and easier to reason about, even before considering whether current tests happen to pass"
  - concept: "Refinement as selective abstraction"
    definition: "A correct implementation refinement does not need to structurally resemble its abstract mathematical model; internal implementation detail (caching, retries, message queues, database transactions) may be entirely absent from the abstract model as long as the externally observable, governed semantics are preserved — the goal is preserving the semantics that matter, not structural mimicry"
  - concept: "Compositional assurance (C_1⊨S_1 ∧ C_2⊨S_2 ∧ (S_1∧S_2⇒S) ⇒ C_1∥C_2⊨S)"
    definition: "Two independently correct components (each satisfying its own specification) compose into a correct combined system only if their individual specifications, taken together, are known to jointly imply the desired system-level property; per-component correctness alone does not guarantee this, since components can interact in ways that violate a shared invariant neither component's isolated specification addresses — requiring explicit interface contracts (Contract(A,B)) in addition to per-component contracts"
refines:
  - concept: "0674's (Step 89's) model-checking work"
    refinement: "EXPLICITLY AND CORRECTLY CROSS-REFERENCED ('this is where the model-checking work from Step 89 becomes directly useful'), applied to reachability-based state-invariant verification specifically"
  - concept: "0674's proof-versus-estimation discipline (P(H)=0.95≠Proof(H))"
    refinement: "Directly and genuinely extended into property-based testing specifically: passing many generated test cases is empirical evidence, never formal proof, regardless of test count"
  - concept: "0670's Governance Surface concept"
    refinement: "Complemented, not duplicated, by the genuinely distinct Proof Surface concept — Governance Surface concerns actual bypass paths around a governance mechanism; Proof Surface concerns the number of independent places an invariant must be maintained within an architecture, a related but formally distinct architectural-quality dimension"
  - concept: "The corpus's Decision≠Authorization family"
    refinement: "Directly and genuinely restated in the domain-event cross-boundary-interpretation context (a domain event from one context being silently over-interpreted by another as carrying more authority than intended)"
  - concept: "0641's (Step 59's) and 0656's (Step 72's, already-confirmed collision) concurrency treatments"
    refinement: "LIKELY THIRD-PASS COLLISION, NOT YET CONFIRMED: Step 92's opening preview (concurrency, distributed state, race conditions, event ordering, idempotency, conflict resolution) closely tracks vocabulary already substantially and, in 0656's case, confirmedly duplicatively covered; flagged as a notably severe likely tenth collision pending direct comparison once 0677 is read"
