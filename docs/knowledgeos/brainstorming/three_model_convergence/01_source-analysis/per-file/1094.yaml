about: >
  `REFINED-STEP-290.md` — "N-1 — `≡`/`≈` ADJUDICATION," scope "N-1 ONLY," verdict "`N-1A — DISTINCT`... and
  the 'corpus contradiction' reported by Steps 288–289 is WITHDRAWN." The fourth and final living-document
  synthesis in this trio/quartet (alongside files 1088, 1089, 1093), consolidating this reconstruction's
  already exhaustively-tracked N-1 resolution (files 1063-1073) into a single self-contained document.

  **SUBSTANTIALLY RECONFIRMS THE ALREADY-TRACKED N-1A FINDINGS**: the corpus/candidate distinction (`261.21`/
  `258.8` self-label as candidates, not assertions); the nine-registers-in-two-notations finding (`261.1` vs
  `261.20`/`261.25`, six-for-six, already tracked file 1065); the eight-question definition-comparison audit
  (Q1-Q8, already tracked file 1067); the UNDECIDABLE-FROM-CURRENT-CORPUS distinguishability verdict (already
  tracked file 1066); the `≈_X` audit and its "degenerate endpoint" terminology correction (already tracked
  files 1068, 1077, 1083); the independent congruence basis (`258.9`, already tracked file 1069); the
  declaration-vs-derivation fork (already tracked file 1070); the `261.23` zero-of-six impact finding
  (already tracked file 1071); the formal N-1A classification with all four alternatives rejected (already
  tracked file 1072); and the G-67 withdrawal with its N-1′ replacement (already tracked file 1072-1073).

  **DELIVERS ONE GENUINELY VALUABLE NEW CLOSING META-OBSERVATION**: the self-check log tallies "Three
  corrections, all mine, all in the same direction: I over-read a documented openness as a defect," and
  closes with a precise, disciplined characterization of a NEW failure-direction category: "THE PROGRAMME'S
  STANDING HAZARD HAS BEEN OVERCLAIMING; THIS WAS ITS MIRROR IMAGE -- OVER-CLAIMING A FAULT, which inflates
  URGENCY exactly as an overclaimed result inflates PROGRESS." This is a genuinely important addition to this
  reconstruction's already-tracked catalogue of the programme's self-correction patterns: it distinguishes
  two symmetric but opposite failure directions (overclaiming a positive RESULT, already tracked as the
  programme's dominant hazard across files 1057-1058, 1077, 1083; and overclaiming a NEGATIVE FAULT/defect,
  this file's own G-67 mis-scoring being the paradigm instance) as two faces of the same underlying
  discipline failure -- directly complementing the already-tracked Audit G finding (file 1092) that count
  errors in this programme have run in both directions (understating a defect vs. overstating a result).

  **DELIVERS ONE MORE DISCIPLINED CLARIFICATION NOT PREVIOUSLY STATED THIS PRECISELY**: the boxed
  "before-STOP" warning that N-1A must not be over-read: "N-1A RESOLVES THE TAXONOMY/REGISTER QUESTION, NOT
  THE EQUALITY-CONTRACT QUESTION. A later step could read `N-1A = DISTINCT` as '`≡≠≈` has been mathematically
  demonstrated.' IT HAS NOT." This is a precise, forward-looking guard against a plausible future misreading
  of the programme's own resolved finding.
