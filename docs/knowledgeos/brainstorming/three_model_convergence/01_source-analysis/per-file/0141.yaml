about: >
  The corpus's most mathematically substantial file to date. Formalizes the SNF (Semantic Normal Form)
  measurement idea with a semantic metric space (formal distance axioms), Bayesian posterior over
  interpretations, and five rigorously-defined metrics (convergence C_snf, non-collapse NC_snf,
  transformation-stability T_snf, normalized entropy H_sem, abstention). Self-corrects twice: renames
  a proposed graph distance "SNF Structural Distance" (not "Semantic Distance") because structural
  similarity≠semantic equivalence; distinguishes model/interpretation, representational, and epistemic
  uncertainty as three different things. Argues NC_snf must be a hard pass/fail safety gate, not a
  weighted composite component, with an asymmetric-risk argument (semantic collision is categorically
  worse than false divergence). Introduces Semantic Collision Rate (CR). Reports four progressively-run
  simulations (v0.1-v0.4), with v0.1 giving real numbers (25% injected collision rate, correctly
  detected) and v0.2/v0.3 EXPLICITLY REFUSING to report numbers when the execution environment did not
  return them ("I will not invent numerical results... I won't manufacture the numbers") -- the
  cleanest anti-fabrication instance in the corpus so far.

introduces:
  - "Formal semantic metric space d: S x S -> [0,1] with the four standard metric axioms; a Bayesian
    posterior P(theta_i | E, C) over semantic interpretations; rigorous H_sem, C_snf, NC_snf, T_snf
    definitions with stated ranges and interpretations"
  - "Distinction between 'SNF Structural Distance' (a Jaccard-style graph metric, what is actually
    proposed) and 'Semantic Distance' (not yet established to exist) -- structural similarity is
    explicitly NOT assumed to entail semantic equivalence"
  - "Three-way uncertainty taxonomy: model/interpretation uncertainty ('which interpretation should I
    choose') vs. representational uncertainty ('does my representation capture the meaning') vs.
    epistemic uncertainty ('is the proposition justified') -- previously conflated as one 'semantic
    uncertainty'"
  - "Hard-gate architecture: Semantic Collision (NC_snf failure) must FAIL the system outright rather
    than being averaged into a composite quality score, on an explicit asymmetric-risk argument: false
    divergence = compiler deficiency (safe); semantic collision = knowledge corruption (unsafe)"
  - "Semantic Collision Rate (CR): fraction of distinct-meaning pairs incorrectly mapped to the same
    SNF -- proposed as the primary safety metric, more intuitive and more dangerous-outcome-focused
    than NC_snf alone"
  - "Gold-Relation/Confusion-Matrix evaluation design (v0.3): compares SNF output against an
    independently labeled EQUIVALENT/DISTINCT/UNKNOWN relation, yielding three named failure classes
    (false divergence, semantic collision, false certainty)"
  - "v0.4 proposal: Bayesian calibration of the interpretation posterior (calibration error, Brier
    score, log loss, reliability curves) -- connects the SNF thread to formal statistical calibration
    theory for the first time"

