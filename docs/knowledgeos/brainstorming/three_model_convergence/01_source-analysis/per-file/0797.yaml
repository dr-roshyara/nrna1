  - concept: "0796's normal-path/emergency-path separation discipline"
    refinement: "Directly re-applied and confirmed in Experiment E, with the sharpened restatement Exception≠AbsenceOfRule and the explicit Governance_normal/Governance_emergency dual-path framing"
  - concept: "0795's temporal-justification invariant (Decision(D)⇒Basis(D,t_D)) and 0794's Krishna/Atma-Chapter-4-derived CurrentActorState≠CompleteSystemHistory discipline"
    refinement: "Experiment F delivers the concrete worked demonstration these two earlier principles were building toward: a decision justified at t_1 remains justified at t_1 even when its underlying knowledge is later superseded or invalidated at t_2, explicitly named 'one of the strongest architectural consequences we have obtained from the Chapter 4 lens' -- the clearest, most concrete instance yet of the Chapter-4-derived discipline actually determining an architectural verdict rather than merely motivating a dimension"
  - concept: "0793's AI-as-participant principle and 0796's AI-accountability discipline"
    refinement: "Extended into a full worked AI-agent role-boundary analysis (Generate/Verify/Approve/Execute kept non-implying for AI specifically) and the RequiredControl=f(Risk,Impact,Uncertainty,DomainPolicy) formula, explicitly rejecting both extremes (AI verifier=invalid, and every-AI-output-requires-a-human) in favor of a graduated, policy-governed model"
