about: >
  Directly continues 0796, opening "we now test the model against the six scenarios defined in Step 171.
  The purpose is not to demonstrate that our architecture works in friendly examples. The purpose is to
  find where it breaks."

  **Experiment A (one human does everything, §172.1)**: result "no architectural violation by itself" --
  the architecture does not require different actors per transition, only that semantic roles be
  distinguished; `Producer=Verifier=DecisionMaker=Authorizer=Executor=A` may be valid for low-risk domains,
  invalid where `RequiredIndependence=High`, `Valid(A)=f(DomainRisk,GovernancePolicy)`. Delivers the first
  boxed finding: **"separation of duties is a policy constraint, not a universal domain invariant."**

  **Experiment B (AI produces, human verifies/decides/authorizes, §172.2)**: "one of the most natural
  KnowledgeOS configurations." Result: "the architecture handles this cleanly. The AI remains a producer of
  an epistemic artifact, not automatically its authority" -- `AIOutput` only becomes `Verified(Assessment)`
  through human verification, only then potentially promotable to `Knowledge`.

  **Experiment C (AI produces AND verifies; human authorizes, §172.3-172.4)**: the harder case. Delivers
  the reframe **"the question is not: is the verifier AI? The real question is: what assurance does the
  verifier provide, and is AI verification accepted by the applicable policy?"** -- for deterministic
  properties (`Hash(A)=Hash(B)`) an automated verifier may be stronger than a human; for interpretive
  judgments ("this architecture is compliant") the required regime may be much stronger. Delivers
  `ValidVerifier(v,c)` depending on `Method,Scope,Risk,Evidence,Policy`, explicitly rejecting the blanket
  rule `AI verifier=invalid` as arbitrary.

  **Experiment D (automated deterministic verification feeding a governance decision, §172.5-172.6)**:
  "the architecture strongly supports this. It demonstrates why `Verification≠HumanApproval`" -- delivers
  `VerificationMechanism` and `DecisionAuthority` as independent dimensions: "a machine can verify. A human
  or governance body can decide. That is not contradictory."

  **Experiment E (emergency execution bypassing normal authorization, §172.7-172.8)**: survives only when
  modeled as `EmergencyCondition→EmergencyAuthorization→Execution→RetrospectiveReview`, never as an
  unexplained bypass -- reconfirms and extends 0796's normal/emergency-path discipline: **`Exception≠
  AbsenceOfRule`**, `Governance_normal` vs. `Governance_emergency` as two distinct, both-governed paths.

  **Experiment F (later evidence contradicts earlier knowledge, §172.9-172.14) is explicitly named "the
  most important experiment."** At `t_1`, `K_1` grounds `D_1`/`Decision_1`/`Action_1`; at `t_2>t_1`, new
  evidence `E_2` yields `K_2≢K_1`. Delivers the central finding: this does **not** invalidate `Decision_1`
  -- `ValidityAt(t_1)≠ValidityAt(t_2)`, `Justified(D_1,t_1)` may remain true while
  `CurrentValidity(K_1,t_2)=false`. Explicitly named as **validating "the Chapter 4 insight"** and
  delivering **"one of the strongest architectural consequences we have obtained from the Chapter 4
  lens"**: boxed `CurrentKnowledge≠HistoricalKnowledge` and `Supersession≠Deletion`. Further distinguishes
  Case 1 (new evidence changes an incomplete-but-reasonable conclusion, `Superseded`) from Case 2 (evidence
  shows `K_1` was actually invalid, `Invalidated`) as non-identical knowledge-lifecycle outcomes. Delivers
  the profound rule **the system must not rewrite history**: a later-invalidated `K_1` must remain recorded
  as `D_1`'s actual historical basis (`D_1→[basedOn]→K_1`, `K_1→[invalidatedBy]→E_2`), "if historically it
  was based on `K_1`... that would create a false history" -- crystallized as **`HistoricalTruth≠
  CurrentTruth`**, both required to be supported by "a mature knowledge system."

  **§172.15-172.16 delivers the consolidated six-experiment results table** (all six PASS, each with a
  named architectural finding) and the file's central new law: **boxed "ActorSeparation is not itself the
  invariant. RoleSeparation is,"** meaning a single actor may hold several roles, but the architecture must
  still know those roles are semantically distinct.

  **§172.17-172.21 applies this directly and extensively to AI agents** ("particularly important for our
  AI Engineering Platform"): a single AI agent may technically inspect/reason/generate/test/modify/report,
  but the architecture must not therefore treat `Generate=Verify=Approve=Execute` -- `AI.Generate` does not
  imply `AI.Verify`, which does not imply `AI.Authorize`. Models `Actor∈{Human,AI,System,ExternalSystem}`
  under the same transition contract ("AI becomes a new kind of actor participating in an existing governed
  lifecycle"), while flagging AI's distinguishing feature as introduced `Uncertainty`, requiring explicit
  `Confidence/Uncertainty/Evidence/Method/Verification` handling -- but explicitly rejecting the assumption
  that every AI output requires a human, via `RequiredControl=f(Risk,Impact,Uncertainty,DomainPolicy)` and a
  low-consequence/high-consequence transition classification. **Delivers a sharp, directly practical
  critique**: **"this is better than 'human in the loop.' The phrase is too vague. The real question is: at
  which transition is human authority required, and what exactly does the human establish?"** --
  distinguishing `HumanVerification` from `HumanAuthorization` from `HumanDecision`.

  **§172.22-172.26 delivers control points** `CP_1`-`CP_6` (`EvidenceQualified` through
  `OutcomeVerified`), each ideally a deterministic `Predicate(x)∈{PASS,FAIL}`, explicitly preferring an
  honest `Uncertain` state over a pretended `PASS` where determinism is impossible. Delivers the
  **statistical boundary** (`P(H|E)` supplies an input to `DecisionRule(P(H|E))`, never automatically
  becomes the rule itself) and **the descriptive/normative distinction**: inferential reasoning
  (`E→K`, "what is the case?") versus normative reasoning (`K,D_t→Decision`, "what should we do?"),
  "these must not be confused."

  **§172.27-172.28 delivers the two-worlds model**: the Epistemic world (`Observation→Evidence→Knowledge→
  Determination`) and the Operational/governance world (`Decision→Authorization→Execution→Outcome`),
  boxed **`Determination→Decision`** as the explicit bridge "where factual conclusions meet organizational
  intent" -- suggesting (not yet freezing) seven bounded-context candidates.

  **§172.29-172.30 delivers the falsification result**: the six experiments did not falsify the central
  model but exposed three necessary refinements (RoleSeparation≠ActorSeparation; historical state must be
  preserved where historical justification matters; Verification/Decision/Authorization must remain
  conceptually distinct even when co-implemented), crystallized into the Step 172 conclusion, boxed:
  **"a governed knowledge system does not require different actors for every transition; it requires
  explicit semantic roles, applicable control rules, and reconstructible consequential transitions" --
  "a much more mature principle than simple 'separation of duties.'"**

  **Closes opening "Step 173 — The Bounded-Context Discovery Experiment,"** proposing to test each
  candidate bounded context against `Language+Invariant+Lifecycle+Ownership+ChangePressure` and then
  **deliberately attempt to merge contexts**: "if merging does not create semantic conflict, we should not
  split. If merging destroys invariants or creates ambiguous language, the boundary becomes justified" --
  an explicit, falsification-oriented bounded-context discovery methodology. No actual repository
  implementation occurs within this file itself; every experiment and control point remains a conceptual
  test pending Step 173's actual bounded-context work.
