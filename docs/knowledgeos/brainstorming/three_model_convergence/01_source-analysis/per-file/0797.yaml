defines:
  - concept: "RoleSeparation≠ActorSeparation"
    definition: "A single actor (human or AI) may legitimately perform several roles across a transition chain (e.g. generate, verify, and execute), and this alone is not an architectural violation -- what the architecture actually requires is that those roles remain semantically distinguished internally (the system must still know 'this action was performed in the Verifier role, this one in the Executor role'), so that role-specific invariants, evidence, and accountability can still be tracked even when role and actor happen to coincide"
  - concept: "The 'better than human in the loop' principle"
    definition: "The common phrase 'human in the loop' is too vague to serve as an architectural control because it does not specify which transition requires human involvement or what exactly the human's involvement establishes; the more precise architectural question distinguishes HumanVerification (a human confirms a predicate holds) from HumanAuthorization (a human grants permission to proceed) from HumanDecision (a human exercises organizational judgment) as three distinct, independently specifiable control requirements"
  - concept: "The two-worlds model bridged by Determination→Decision"
    definition: "The KnowledgeOS lifecycle separates into an Epistemic world (Observation→Evidence→Knowledge→Determination, answering 'what is the case') and an Operational/governance world (Decision→Authorization→Execution→Outcome, answering 'what should we do and what happened'), with the Determination→Decision transition serving as the explicit bridge where factual/epistemic conclusions meet organizational intent -- this split is offered as a candidate basis for eventual bounded-context boundaries, not yet frozen"
