defines:
  - concept: "KnowledgeState (two-dimensional)"
    definition: "KnowledgeState=(EpistemicStatus, AuthorityStatus) — a knowledge object's degree of evidentiary confidence (PROPOSED/SUPPORTED/VERIFIED/AUTHORITATIVE/SUPERSEDED/DISPUTED/UNKNOWN) is tracked independently from whether it has been declared organizationally binding (e.g. OBSERVATIONAL vs. GOVERNING); a claim can be epistemically VERIFIED while remaining merely observational, and this separation is what prevents an LLM's confident inference from being silently treated as authoritative governance"
  - concept: "No god context"
    definition: "KnowledgeOS must not itself own decisions, runtime state, Git, agents, evidence, policies, and deployments all at once — doing so collapses the bounded-context model into a single undifferentiated authority; KnowledgeOS's role is to coordinate semantic relationships across contexts that retain their own ownership, not to absorb every context's authority into itself"
  - concept: "Authority edges vs. Evidence edges"
    definition: "A relationship in the domain graph must be typed as either an authority edge (governs/authorizes/approves — establishes organizational binding force) or an evidence edge (supports/observedBy/verifiedBy — establishes epistemic support), and the two types must never be conflated: evidence that a deployment occurred supports the deployment claim but does not authorize it"
refines:
  - concept: "0716's edge-authority/evidence-backed-edges discipline"
    refinement: "Directly extended with an explicit two-category edge-type taxonomy (authority edges vs. evidence edges) and a concrete worked example distinguishing supportedBy from authorizedBy"
  - concept: "0698's/0711's five-value node epistemic lifecycle (Candidate→Supported→Verified→Authoritative→Superseded)"
    refinement: "Extended to a seven-value enumeration adding DISPUTED and UNKNOWN, and further refined into a two-axis model separating epistemic status from authority status entirely"
  - concept: "the corpus's long-standing 'AI collapses inference into authority' family (0699's DelegatedAuthority, 0709's A2, 0714's AgentCapability≠AgentAuthority)"
    refinement: "Given its sharpest, most operationally precise single-sentence formulation to date: 'LLMs often collapse LikelyTrue into Authoritative. KnowledgeOS must explicitly prevent that semantic collapse'"
  - concept: "0716's/0717's technology-independence and non-premature-decomposition discipline"
    refinement: "Directly reinforced via 'modular semantic boundaries before microservice boundaries,' explicitly keeping a modular-monolith implementation option open"
  - concept: "0714's/0715's/0717's AFR-01..AFR-30 fitness-rule catalog"
    refinement: "Extended with AFR-31, specifically governing cross-context reference discipline (stable IDs, not shared mutable aggregates)"
