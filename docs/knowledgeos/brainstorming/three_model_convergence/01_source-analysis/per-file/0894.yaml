defines:
  - concept: "Provenance Reference vs Provenance Object"
    definition: "A distinction generalizing the corpus's established Evidence-Reference≠Evidence-Object separation to provenance: π denotes a provenance REFERENCE (a stable, deterministically resolvable identifier or pointer associated with an assertion), while P_π denotes the actual provenance RECORD/OBJECT (the full origin graph -- source documents, measurements, external systems, chains of custody, etc.). The critical formal consequence is that π∈K does not imply P_π∈K: the Knowledge State can preserve the IDENTITY of the provenance relationship (enough to deterministically resolve, merge-preserve, and explain an assertion's origin) while the full provenance object is stored and maintained by an external provenance/audit subsystem, resolved on demand via ResolveProvenance:𝒫ℐ→ProvenanceObject. This yields a materially smaller kernel than embedding the complete provenance graph inside K, while still satisfying every mandatory operation's provenance-dependent requirements"
  - concept: "Provenance preservation does not imply provenance-sensitive semantic equality"
    definition: "A finding demonstrating that satisfying the operational requirement to preserve provenance associations (so that Merge, Split, Replay, Validation, and Explanation all function correctly) is logically independent from whether provenance participates in the semantic equality relation used to determine whether two Knowledge States are 'the same.' Concretely: two states K_1={A_{Π_1}}, K_2={A_{Π_2}} with identical propositions (P_1=P_2) but different provenance (Π_1≠Π_2) may be judged equal under ordinary semantic equality (K_1≡K_2, if provenance is not treated as semantic content) while being judged distinct under a provenance-sensitive equality notion (K_1≇_ΠK_2). Both preservation and non-identity-relevance can hold simultaneously without contradiction, because they answer different questions (can the origin be resolved? vs. does the origin distinguish states?) -- directly applying Step 261's mandate that equality notions must not be conflated to resolve a concrete open provenance-equality case"
