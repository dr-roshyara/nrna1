about: >
  METHODOLOGICAL NOTE: despite its title's resonance with this reconstruction's already-tracked
  unresolved "Path B" bridge-candidate question (file 2319), this document's "bridge" refers to a
  statistical bridge HYPOTHESIS within the KR-BRIDGE-01 experiment (a proposed causal connection between
  two variables) -- entirely unrelated to file 2319's unidentified engineering/DDD research lineage. No
  connection should be inferred from the shared word.

  Fifth KR-SIM Gītā companion study, against KR-BRIDGE-01: "looked for a connection between two things
  and found that the apparent connection was a third thing acting on both. Pooled RD=-0.363; stratified,
  0.000 exactly. Redundancy was causing both Zero and inadequacy" -- a confounding-by-common-cause
  result.

  **DELIVERS FOUR LOCI**: 3.27 (guṇa as the true actor, agency-attribution is delusion) -- Corroboration
  C-1 for the SHAPE of the confounding correction (redundancy→Zero and redundancy→inadequacy share a
  common cause, "exactly the shape 3.27 describes"), explicitly not for the detection method
  ("stratification... the verse offers no stratification, no contingency table, no test"). 14.19 ("the
  seer perceives no agent other than the qualities") -- Lens L-1, "'no relationship' is a finding, not a
  failure," matching the experiment's OUTCOME A (a clean negative result). 2.48 (samatvam/evenness) --
  weak Corroboration C-2 for the protocol's equal-weighting of H0-H3 ("do NOT privilege H1"), explicitly
  flagged as a rhyme, not the same claim.

  **DELIVERS THE THIRD CONSECUTIVE REFUSAL OF THE SERIES' MOST QUOTABLE VERSE**: 2.48a ("established in
  yoga, perform actions, having abandoned attachment") tempts "having found no bridge, abandon
  attachment to the result and move on." "⚠️ REFUSED -- and for a reason specific to this experiment:
  OUTCOME A is not a null to be shrugged off. It is a constraint with content: it says a formal bridge
  hypothesis may not be proposed... a reading of 2.48a as 'release the result' would license exactly the
  drift the governance freeze forbids." Explicitly: "THIRD REFUSAL IN THREE STUDIES. 2.50 (skill in
  action), 18.66 (abandon all duties), and now 2.48a. All three are the text's most quotable lines, and
  all three would license a shortcut." This directly extends and confirms this reconstruction's already-
  tracked pattern from files 2372 (first refusal) and 2373 (second refusal, with explicit cross-
  reference) to a third instance.

  **DELIVERS THE CORROBORATION MAP**: five of eight get nothing, including every technical finding and
  the entire method -- "the text speaks to causal attribution as a POSTURE; the experiment needed causal
  attribution as a PROCEDURE."

  **DELIVERS A THREE-ITEM CANDIDATE REGISTER**: G-19 (third-factor-is-default-not-fallback, lens, already
  operationalized as §12 stratification); G-20 (declining-to-name-a-relationship-is-a-result, lens);
  G-21 (~~release attachment and proceed~~, REFUSED).

  **DELIVERS THE UPDATED RUNNING COUNT**: "kernel candidates -- NONE. SEVENTH CONSECUTIVE TIME." Extends
  this reconstruction's already-tracked tally (files 2370's fourth, 2372's fifth, 2373's sixth) to seven.

  **CLOSES WITH THE EXPLICIT VALUE-OF-REFUSAL PRINCIPLE, NOW GENERALIZED ACROSS THE SERIES**: "not that
  three refusals in three studies means the text is unproductive. The refusals are the most reliable
  output this strand produces -- each names a shortcut the programme would otherwise be tempted by...
  the refusal is again the most useful part." This closing statement generalizes the pattern first noted
  in file 2372 into an explicit standing claim about the series' most reliable output type.
