about: >
  Extracts Webb & Copsey's Statistical Pattern Recognition (a genuine statistics/ML textbook covering
  Bayesian and non-Bayesian discrimination, trees, ensembles, feature selection, clustering, complex
  networks) explicitly not as an ML-algorithm shopping list but as "a set of statistical reasoning, pattern-
  discovery, validation, uncertainty, selection, and drift techniques that can become capabilities of
  KnowledgeOS." Directly continues and formalizes the technical-pivot trilogy (0202-0204) and the Freedman
  epistemic-methodology extraction (0205) into the most rigorous statistical-methodology treatment in the
  corpus's reading order, explicitly fulfilling 0200's 35%-formal-mathematical redirection. TWO PASSES.
  PASS 1 produces twenty numbered KOS-01..KOS-20 techniques with priority tags (P0/P1). The single most
  valuable technique, per the file's own ranking: KOS-01 Reject/Abstain -- the book's own reject-option
  decision rule (a pattern is rejected when classification risk is too high) generalized into a six-value
  KnowledgeOS outcome vocabulary (SUPPORTED/WEAKLY_SUPPORTED/INCONCLUSIVE/INSUFFICIENT_EVIDENCE/
  CONTRADICTED/OUT_OF_SCOPE) and an explicit platform-capability rule ("if evidence does not support a
  sufficiently safe decision, abstention is a valid result," never merely an LLM prompt instruction). KOS-02
  Risk-Based Decision extends the book's minimum-risk decision theory (loss matrix over minimum-error) into
  a DecisionAssessment schema weighing false-positive/false-negative costs, directly integrating with 0205's
  Freedman risk work. KOS-04 Reliability!=Accuracy is elevated as "one of the strongest ideas in the book"
  -- the book's own discriminability-vs-reliability distinction (a classifier separating classes well while
  producing poorly-calibrated probabilities) generalized to Accuracy/Reliability/Calibration/Uncertainty as
  four separate KnowledgeOS dimensions. KOS-05 Independent Validation extracts the book's training/
  validation/test separation into an explicit architectural invariant: the same evidence must not serve
  both as construction evidence AND independent validation evidence for an AI-generated claim. KOS-06
  Cross-Validation/Resampling is generalized from k-fold/bootstrap/jackknife into an Evidence-Perturbation-
  Validation technique for detecting brittle AI reasoning (does an inference survive when the evidence set
  is perturbed?). KOS-07 Model/Method Selection extracts overfitting/underfitting/AIC/MDL/structural-risk-
  minimization into a CompetingExplanationSelection pattern requiring an AI agent to compare multiple rival
  hypotheses (H1..H5) against evidence rather than retrieving support for one preferred explanation only.
  KOS-08 Stability Analysis is called "a major discovery" -- the book's own feature-selection-stability
  research (different data samples produce different feature sets despite similar accuracy; reproducibility
  can matter as much as accuracy when humans interpret results) generalized into a KnowledgeStability metric
  (perturb retrieved documents/evidence-subset/temporal-window/model/reasoning-path and measure result
  consistency), motivating a multi-dimensional KnowledgeAssessment schema (correctness/evidence_strength/
  reliability/stability/freshness/coverage/contradiction_level) explicitly rejecting a bare confidence=0.87
  scalar. KOS-09 Drift Detection extracts population/sensor drift into a Validity schema (valid_from/
  valid_until/observed_environment/applicability_conditions/drift_status) and a Knowledge Validity
  Monitoring workflow (environment-changes -> drift-detector -> KNOWLEDGE_REVALIDATION_REQUIRED). KOS-10
  Anomaly Detection extracts the book's own nuanced treatment of outliers (error, contamination, OR
  genuinely valuable novel-structure signal, never simply "delete") into an explicit Anomaly!=Error
  taxonomy and an ANOMALY_DETECTED->INVESTIGATE workflow trigger. Further techniques cover Missing-Data
  Awareness (EvidenceCoverage schema tracking required/available/missing/assumed/inferred), Cluster
  Discovery+Validation (explicitly distinguishing DISCOVERED_STRUCTURE from an asserted bounded context
  until validated), Evidence Feature Selection (relevance/redundancy reduction generalized as a context-
  construction tool, with the book's own Markov-blanket example -- 25 variables reduced to 4 relevant ones
  while retaining similar performance -- proposed as a ContextBoundarySelection capability), Ensemble
  Evidence/Evidence Fusion (with an explicit caveat against blindly averaging evidence sources of differing
  authority/independence/provenance/freshness/correlation), Reliability/Calibration tracking per-agent
  (AgentReliability schema enabling agent-specific epistemic trust), ROC/Threshold Analysis (integrating
  directly with the risk-based decision model), a Complexity Penalty (MDL-inspired "complexity must be
  justified," not "always choose simplest"), and Graph/Network Analysis (centrality/community-detection/
  link-prediction mapped onto the knowledge graph, with an explicit "community!=bounded-context" and
  "candidate relationship, never fact" discipline for link prediction). Organizes everything into a four-
  layer hierarchy (Layer 1 Epistemic Assurance must-have; Layer 2 Knowledge Discovery must-have-eventually;
  Layer 3 Evidence/Model Reasoning; Layer 4 Advanced Statistical Engines explicitly pluggable infrastructure
  never KnowledgeOS domain concepts) and three named architectural invariants (Never-force-classification/
  Never-equate-performance-with-reliability/Never-treat-stability-as-optional). PASS 2, explicitly framed as
  "more rigorous than the previous extraction" and reframing the guiding question from "what techniques
  could be useful?" to "starting from zero assumptions, which statistical problems does KnowledgeOS
  actually have, which methods solve them, and which must NOT become part of KnowledgeOS?", applies nine
  lenses with Zero first (Zero/Epistemic/Evidence/Robustness/Discovery/Graph/Interpretability-Governance/
  Efficiency/Determinism-Assurance). The Zero-Lens pass produces the pass's central finding: KnowledgeOS is
  NOT primarily a classifier -- classification is the book's dominant orientation but only one KnowledgeOS
  capability among many (class-membership/group-discovery/outlier-detection/similarity/uncertainty/model-
  comparison/stability/drift/evidence-sufficiency/evidence-fusion/relationship-discovery/redundancy-
  reduction all rated "Yes, needed" against a fifteen-item statistical-problem checklist, with "generate a
  statistical model of everything" explicitly rated "No"). Produces a detailed method-by-method scoring
  table (nineteen methods x seven dimensions -- Epistemic/Evidence/Discovery/Robustness/Graph/
  Explainability/Efficiency, each explicitly labeled "my KnowledgeOS architectural assessment, not scores
  given by the book"), with Stability Analysis (4.6) and Feature Selection (4.6) scoring highest overall,
  and Neural Networks (1.9) and SVM (2.3) scoring lowest -- explicitly not because they are bad techniques
  but because they solve a different problem than KnowledgeOS's core epistemic-assurance need. The
  Determinism/Assurance lens (lens 9) produces a sharp reproducibility split: logistic-regression/LDA/
  decision-trees/hierarchical-clustering/k-means/robust-statistics/bootstrap/cross-validation/AIC-MDL/
  graph-metrics rated strong candidates GIVEN captured dataset/parameters/algorithm/seed/version/
  configuration, while MCMC/Bayesian-sampling/large-ensembles/neural-networks/complex-stochastic-clustering
  are rated "more difficult, not prohibited, but requiring stronger reproducibility controls" -- yielding
  the explicit architectural conclusion "stochasticity belongs inside a reproducible statistical-analysis
  boundary, not inside the semantic KnowledgeOS core." Reclassifies Bayesian inference from Pass 1's high
  rating into one implementation option among several for a broader "explicit uncertainty management"
  need (alongside frequentist/bootstrap/confidence-intervals/empirical-stability/deterministic-bounds),
  explicitly correcting the earlier pass. Produces the pass's second central architectural insight: four
  distinct statistical jobs requiring three separate engines rather than one generic StatisticalEngine --
  a Knowledge Assessment Engine (P0: reliability/uncertainty/risk/abstention/robustness/stability/model-
  comparison, using logistic-regression/Bayesian-estimation/bootstrap/cross-validation/stability-analysis/
  robust-statistics/decision-theoretic-thresholds/reject-option), a Knowledge Discovery Engine (P1: feature-
  evidence-selection/anomaly-detection/hierarchical-clustering/mixture-models/spectral-clustering/rule-
  induction, with the explicit invariant "discovery produces candidates, not knowledge" -- cluster ->
  candidate-structure -> validation -> domain-interpretation -> governed-knowledge), and a Knowledge
  Structure Engine (P1/P2: graph-connectivity/centrality/community-detection/link-prediction/weighted-
  network-analysis, the statistical layer around the knowledge graph). Produces an explicit list of methods
  rejected as DEFAULT KnowledgeOS methods (neural networks, SVM, random forests, deep ensembles, MCMC, PCA
  -- each explicitly "not bad, but solving a different problem," relegated to "external/optional/advanced
  analytical provider" status). Produces a five-level "KnowledgeOS Statistical Method Ladder" (Level 0
  Deterministic statistics -- counts/rates/distributions/correlations/distance/graph-metrics, cheap/
  transparent/reproducible, use first; Level 1 Simple statistical models as baselines; Level 2 Robust
  inference, explicitly called "extremely important in KnowledgeOS"; Level 3 Probabilistic inference, used
  only when uncertainty structure genuinely requires it; Level 4 Structure discovery; Level 5 Complex
  predictive models, used only when the problem genuinely demands them) and a final revised P0/P1/P2
  capability priority list (thirteen P0 items: evidence-selection/anomaly-detection/reliability-assessment/
  uncertainty-estimation/stability-analysis/cross-validation/bootstrap-robustness/reject-abstain/risk-based-
  decision/model-comparison/missing-data-awareness/drift-detection/rule-induction). Closes with an explicit
  general method-selection policy principle ("there is no universally best statistical method," grounded in
  the book's own no-universally-best-classifier warning) formalized into a QUESTION->DATA-PROFILE->METHOD-
  POLICY->ANALYSIS->STATISTICAL-RESULT->ACCEPT/ABSTAIN pipeline, and a final summary claim: "stability,
  evidence sufficiency, uncertainty, abstention, anomaly detection, and method selection are more central to
  KnowledgeOS than sophisticated prediction algorithms are."

