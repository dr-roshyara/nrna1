defines:
  - concept: "Graph rebuildability"
    definition: "The Assurance Graph, being a derived projection rather than a primary source of truth, can always be reconstructed from the authoritative bounded-context state (and the events that state emits) if the graph's own storage is lost -- a property that significantly reduces the architectural risk of treating the graph as a critical, irreplaceable store"
  - concept: "ADR-KOS series (candidate)"
    definition: "A proposed, not-yet-adopted set of five formal Architecture Decision Records packaging the reconstruction's accumulated conclusions into named governance decisions: KnowledgeOS as a modular bounded-context platform (KOS-01), the Assurance Graph as a cross-context projection (KOS-02), a common agent semantic contract (KOS-03), agent-local files as non-authoritative pointers (KOS-04), and deterministic assurance as authoritative wherever mechanically verifiable (KOS-05)"
  - concept: "Reconstruct(Action,t)"
    definition: "Given a recorded Action and its associated ContextID, the platform can reconstruct exactly which knowledge, decisions, evidence, and authorizations were available to the agent at the time it acted -- a reproducibility capability enabled by context integrity fields (ContextID/ContextVersion/ContextHash) and Action→ContextID traceability"
refines:
  - concept: "0717's Logical Architecture"
    refinement: "Given finer component-level granularity (named application services, per-domain object/responsibility lists, a concrete checker-plugin taxonomy, a five-category storage taxonomy) without fundamentally revising the six-layer structure"
  - concept: "0725's/0726's Assurance-Graph-as-projection finding"
    refinement: "Extended with the concrete rebuildability/disaster-recovery property: the graph can always be reconstructed from authoritative bounded-context state if lost"
  - concept: "0719's/0721's registry-classification discipline"
    refinement: "Sharpened into the precise distinction Registry≠Graph (existence vs. relationship), with the registry provisionally positioned as a Platform Registry pending implementation evidence"
  - concept: "0711's/0715's/0725's context-hashing and provenance discipline"
    refinement: "Operationalized into concrete ContextPackage fields (ContextID/ContextVersion/ContextHash) and the Action→ContextID traceability link enabling Reconstruct(Action,t)"
  - concept: "the corpus's long-tracked pointer-layer principle and its notation proliferation (A1/AFR-24/AAI-01-family/PLP-01/CM-04)"
    refinement: "Recast for the first time as a candidate formal Architecture Decision Record (ADR-KOS-04) rather than a numbered invariant -- a meaningfully different artifact type moving toward institutional adoption rather than further invariant-notation accumulation"
  - concept: "0716's audit-reconstruction concept"
    refinement: "Given concrete, implementable field-level support via ContextID/ContextVersion/ContextHash and Action→ContextID"
