about: >
  A two-part document: (1) an external-literature research review (Davis/Shrobe/Szolovits 1993
  knowledge-representation theory, philosophy of language, oral/written/digital transmission research,
  invariant graph learning, provenance research) testing a prior, not-yet-read "Vāṇī" hypothesis that
  treated expression/speech as carrying sacred authority; (2) an interpretive follow-up connecting the
  verdict to the EKS-08 invariant family and to the topology discussion opened at 0082. Verdict:
  Expression != Meaning is externally well-supported as a KERNEL INVARIANT TO PRESERVE, but Expression
  as a KERNEL DIMENSION, and "Vāṇī as kernel principle"/"sacred authority model," are explicitly NOT
  supported.

introduces:
  - "First appearance in the reading order of 'Vāṇī' (a term with clear Vedic/Sanskrit -- sacred-speech
    -- origin) and of a 'sacred authority model' associated with it. NOTE: the proposal that introduced
    Vāṇī as a candidate kernel/authority concept is NOT itself in the read corpus at this position --
    this document only tests and responds to it, so its original content and source_role cannot yet be
    classified. Recorded as a forward/external reference, not as confirmed G/C2 content."
  - "Verdict: Vāṇī as kernel principle / sacred authority model = NOT SUPPORTED (domain-specific, not
    universal); Expression != Meaning = SUPPORTED as a kernel invariant, explicitly NOT as a sixth
    kernel dimension -- it belongs to the representation/projection layer"
  - "EKS-08 invariant family, referenced as already-established (Recorded != Temporal truth; Derived !=
    Persisted; Projection != Source; Memory != Available evidence), extended with a fifth candidate:
    Expression != Meaning. NOTE: 'EKS-08' itself is a forward/external reference -- not yet directly
    encountered as its own document in this reading order"
  - "INV-KOS-002 (candidate): 'KnowledgeOS SHALL preserve semantic identity when knowledge changes
    expression, representation, or medium' -- explicitly candidate-status, evidence=external research
    only, EKS/PKS/AIP validation status = needs validation. Implies an INV-KOS-001 exists elsewhere,
    not yet located in the read corpus (forward reference)"
  - "Dimension-model simplification: Knowledge Identity splits into Kernel dimensions (Semantic,
    Evidence, Authority, Temporal, Lifecycle) vs. Representation (Expression, Language, Format, Medium,
    Projection) -- Expression placed firmly outside the kernel"
  - "Forbidden-collapse generalization (extends 0081's semantic non-collapse family): Document!=
    Knowledge, AI-summary!=Source, Confidence!=Authority, Popularity!=Truth, Representation!=Meaning --
    five instances of one general prohibition: 'a representation change must not silently become a
    semantic change'"
  - "Topology reframed a second time (after 0082): not 'KnowledgeOS uses topology' but 'topology may
    describe what remains invariant while knowledge undergoes transformation' -- directly tied to the
    transformation-invariant question rather than to state-space continuity as in 0082"
  - "Reframing of KnowledgeOS's purpose: 'not a knowledge storage kernel... a constitutional layer
    preserving separation between knowledge dimensions while allowing controlled evolution' -- kernel
    framed as being about 'protected relationships,' not objects"
  - "P4/P5 vocabulary referenced as an existing established layer -- forward/external reference, not
    defined in this document"

