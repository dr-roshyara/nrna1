defines:
  - concept: "'The knowledge repository records authority; it does not automatically possess authority'"
    definition: "KnowledgeOS storing a record of a decision, an authorization, or an approval does not itself confer the authority that record describes -- the repository is authoritative only as a RecordOfDecision, never automatically as CurrentOperationalReality or as a grant of AuthorityToChangeProduction; this principle applies with particular force to AI agents, which must not infer 'I am authorized to execute' merely from retrieving a stored Decision=Approved, but must separately and explicitly establish AuthorizationValid before acting -- preventing the knowledge system itself from becoming an unaccountable, hidden governance mechanism"
  - concept: "KnowledgeOS as constitutional infrastructure (the type-system analogy)"
    definition: "KnowledgeOS's proper role is analogous to a type system: it enforces the structural integrity of governance artifacts (every decision has an authority basis, every determination has an evidence basis, every authorization has a scope, every historical artifact has temporal context) without itself defining what those artifacts mean -- the platform guarantees well-formedness; domain governance supplies semantics -- keeping the infrastructure layer strictly separate from the domain-authority layer it serves"
  - concept: "The reconstruction experiment"
    definition: "A more demanding test than auditability: rather than merely being able to answer 'what happened?' (a sequence of recorded events), a mature KnowledgeOS must let a future engineer -- without consulting the original participants -- reconstruct 'why did it make sense to do that, given what was known, who had authority, what alternatives existed, and what constraints applied at the time?' -- proposed as potentially the actual semantic center of the entire KnowledgeOS architecture, unifying evidence, determination, decision, authorization, and their respective provenance into one coherent explanatory chain"
