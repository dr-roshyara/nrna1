defines:
  - concept: "GovernanceAuthority = Record(ValidRatificationAct), not Inference(theory)"
    definition: "The organizationally-recognized authority backing a governance decision comes into existence only through the durable recording of a valid ratification act performed by a legitimate human authority -- never through logical inference from the mathematical theory's own correctness or completeness. A theory being formally closed, computationally realized, or empirically validated supplies no organizational authority whatsoever; only an actual recorded ratification act does"
  - concept: "ValidRatification(d) (the formal ratification validity biconditional)"
    definition: "A governance decision d counts as validly ratified if and only if: a genuine organizational mandate for some authority a exists (Mandate(a)), a is authorized to decide on d (Authorized(a,d)), a actually made the decision (Decision(a,d)), the decision is recorded (Recorded(d)), and the decision is currently within its effective validity interval (Effective(d)). All five conjuncts are independently required; a missing link anywhere in this chain means governance closure cannot be claimed for that specific decision"
