  - concept: "Retrospective completeness revision: new information can reveal that PREVIOUS knowledge was less complete than believed, even when the newly-discovered dimension's own value is known with 100% certainty"
  - concept: "Knowledge != Determination, formalized as Delta-Knowledge != Delta-Determination: Knowledge can increase (enrichment) while an existing business/architectural determination remains unchanged"
  - concept: "Knowledge != Decision: KnowledgeOS presents evidence/reasoning/conflict/relevant-dimensions rather than deciding; chain Knowledge->Determinations->Human/Business-Decision, with KnowledgeOS explicitly forbidden from arbitrarily collapsing conflicting knowledge into a single answer"
  - concept: "CONFLICT ITSELF IS KNOWLEDGE: when two authoritative sources disagree (worked security-vs-architecture compliance example), KnowledgeOS should preserve BOTH positions and warn the owner rather than manufacturing a single answer -- a significant new principle with direct Kernel-content implications (Conflict added as a tenth candidate Kernel element)"
  - concept: "PRIORITY IS NOT KNOWLEDGE: Threat->Priority belongs to the decision/investigation context, not to Knowledge's definition; a dimension unimportant for today's decision remains genuinely part of the knowledge space"
  - concept: "Consolidated five-source list for why probability may be needed (uncertain values; incomplete observations; undiscovered dimensions; incomplete evidence; uncertain extraction), the corpus's first single consolidated enumeration of all uncertainty sources together"
  - concept: "Nine explicit 'what we have NOT solved' open problems, each precisely stated, including 'the biggest mathematical problem' (how to reason about the unknown portion of a dimension space whose elements are themselves unknown, explicitly deeper than ordinary probability) and Completeness(K_t)'s undefined-denominator problem"
  - concept: "Ten candidate Kernel elements for eventual Zero-Lens testing (Identity/Dimension/Value/Evidence/Provenance/Time/Relationship/Reasoning/Determination/Conflict), with Conflict newly added reflecting the Conflict-itself-is-Knowledge finding"
  - concept: "Nine-stage research-maturity position diagram with an explicit self-located checkpoint: 'around the Knowledge->trajectory->preservation boundary,' 'not yet at architecture,' judged as the correct position"
  - concept: "Single-question reduction of the entire research programme: how can an observer construct/evaluate/continuously-revise a knowledge state without knowing the dimensions that remain undiscovered, given a potentially infinite complete state"
  - concept: "Explicit methodological pivot toward EXTERNAL adversarial testing: 'I would now challenge our own model with external research rather than continue assuming that every conclusion we reached in this dialogue is correct' -- generalizing 0392's Pritchard-specific recommendation into a broader commitment"
