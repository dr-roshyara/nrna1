about: >
  Answers "where does a ChatGPT-like LLM get its information?" and uses the answer to derive a
  fundamentally different retrieval/ingestion architecture for KnowledgeOS. Notably the first file in this
  arc to cite real, specific external sources with footnotes (three OpenAI documentation pages on model
  training data sources, the "not a database" framing, and ChatGPT Search), rather than reasoning purely
  conceptually or from the Bhagavad-gītā/Vedic corpus.

  **Identifies two LLM information mechanisms**: (A) information learned during training -- the model
  adjusts parameters to learn patterns; OpenAI explicitly describes its models as learning machines rather
  than databases, so the model holds learned representations, not a KnowledgeOS-style explicit Knowledge
  State; (B) information retrieved at inference time (e.g. ChatGPT Search), explicitly noted as "much closer
  to what KnowledgeOS needs" than pure parametric knowledge. **Rejects the naive RAG architecture**
  (Documents->Chunk->Embedding->VectorDB->RAG->LLM) as "useful, but... not KnowledgeOS" -- it bypasses the
  epistemic model entirely. **Establishes the file's central distinction**: Document≠Knowledge; Document≠
  Evidence -- a document is an information-bearing SOURCE from which observations and candidate assertions
  may be constructed; it can PROVIDE evidence for an assertion but is not itself evidence, worked via a
  Document->DocumentSource->Observation->CandidateAssertion->Evidence->KnowledgeState pipeline.

  **Introduces a three-plane architecture**: the Source Plane (documents/APIs/Git -- answers "where did this
  information come from?"), the Knowledge Plane (entities/assertions/dimensions/relations -- answers "what
  do we currently represent as knowledge?"), and the Epistemic Engine (Zero/Lord/Sārathi -- answers "how
  justified, complete, current and coherent is that knowledge?"), both planes feeding the shared Epistemic
  Engine. **Makes Source Connectors a first-class platform capability**, naming sixteen concrete connector
  types (File System, PDF, DOCX, XLSX, Markdown, Git, GitLab, GitHub, Confluence, SharePoint, Jira,
  Databases, REST APIs, Web, Email, Enterprise repositories), explicitly requiring them to produce controlled
  ingestion events rather than dumping content into a vector database. **Delivers a detailed nine-stage
  ingestion pipeline**: External Source->Source Connector->Raw Artifact->Document Parser->Structural
  Model->Semantic Parser->Observations->Candidate Assertions->Evidence Objects->Knowledge State Update->
  {Zero,Lord}->Sārathi, reconnecting the corpus's long-standing C-parser/Sanskrit-parser intuition to a
  concrete example (extracting Entity/Dimension/Value candidates from "Nexus Repository Manager version
  3.69.0 is running on RHEL 9.8"), with the explicit discipline that KnowledgeOS "should not immediately
  declare these facts to be true knowledge" -- every candidate assertion carries Source/Location/ObservedAt/
  ExtractionMethod metadata pending epistemic evaluation. **Contrasts RAG's single question ("which chunks
  are relevant to this question?") against a twelve-step richer KnowledgeOS sequence** (what is the
  question -> what dimensions does it imply -> what knowledge is required -> which sources may contain it ->
  what observations can be extracted -> what assertions can be constructed -> what evidence supports them ->
  do they conflict -> are they current -> are they contextual -> what gaps remain -> what to investigate
  next). **Reformalizes Retrieval itself as a goal-directed epistemic operation**:
  Retrieve(Q,K_t,I_t,C)->EvidenceCandidates, replacing the naive Retrieve(Query)->Documents, "the retrieval
  system knows why it is retrieving," worked via a Nexus-migration example that discovers twelve relevant
  dimensions (version, repository topology, blob stores, storage, network, firewall, DNS, certificates,
  backup, authentication, dependencies, operational constraints) before retrieving documents specifically
  for those dimensions. **Delivers the file's most powerful architectural insight**: Zero can DRIVE
  retrieval -- Zero identifies specific gaps (backup verification, firewall rules, certificate ownership)
  against a partially-populated Knowledge State, and Sārathi then generates a targeted investigation/
  retrieval plan (search infrastructure docs for backup configuration; search network docs for firewall
  rules; search certificate inventory) -- crystallized as **Zero->Gap->Sārathi->Retrieval**, "the retrieval
  engine becomes part of the investigation loop." Extends the corpus's closed-loop architecture diagram to
  include Source Retrieval as an explicit stage within the Zero/Lord/Sārathi cycle, naming the result an
  "epistemic retrieval loop," "much more interesting than RAG." **Establishes LLM Output≠Knowledge**:
  LLM Output->CandidateInterpretation, which must then pass through KnowledgeOS's epistemic processing
  before becoming knowledge -- the LLM remains valuable for language understanding, semantic reconstruction,
  document interpretation, hypothesis generation, inference, summarization, question generation, planning,
  code generation, and explanation, but "does not become the authoritative knowledge store."
  **Formalizes three non-conflatable information pathways**: Path A (Model knowledge -- implicit,
  non-traceable, non-governed, from training data->foundation model->learned parameters->LLM response);
  Path B (External retrieval -- explicit, traceable, but ungoverned, from sources->retrieval->evidence->
  KnowledgeOS); Path C (KnowledgeOS accumulated knowledge -- explicit, traceable, governed, versioned, from
  observations+evidence+assertions+relationships+epistemic states+history->Knowledge State) -- "the three
  should not be conflated." **Addresses the enterprise 'memory' problem**: an LLM's learned parameters are
  not a suitable enterprise knowledge system; KnowledgeOS instead maintains K_t as an explicit, versioned,
  traceable Knowledge State, worked via a fully fleshed-out concrete Assertion object (A-10291, Nexus
  version, with Subject/Dimension/Value/Evidence/Source/ObservedAt/Acquisition/Support/Uncertainty/
  Validity/Provenance fields) -- "that is something an LLM alone does not provide." Crystallizes three key
  architectural principles: "Sources provide information; KnowledgeOS constructs governed knowledge from
  it." / "LLMs interpret; KnowledgeOS evaluates and governs." / "Retrieval supplies evidence candidates; it
  does not automatically create knowledge." Presents a final connection architecture (Source Layer /
  Cognitive Layer / Action Layer all feeding a shared Knowledge State -> Zero/Lord/Sārathi) and closes
  rejecting "build KnowledgeOS as our own RAG" in favor of Source Fabric + Semantic Reconstruction +
  Knowledge State + Epistemic Engine + Investigation Engine + AI Models -- "RAG becomes merely one
  retrieval mechanism inside KnowledgeOS, rather than the foundation of KnowledgeOS itself."

  **Part B** (an enthusiastic, fully affirming elaboration of Part A, not a corrective review) reorganizes
  Part A's findings into a formal comparison table for the three pathways with an explicit "critical error"
  warning (LLM Response≠KnowledgeOS Knowledge; Retrieved Document≠KnowledgeOS Knowledge; Training Data≠
  KnowledgeOS Knowledge), and -- its one genuinely new contribution -- **formally numbers three
  "Constitutional Invariants for Sources" for the first time**: Invariant 1 (Source≠Knowledge), Invariant 2
  (LLM Output≠Knowledge), Invariant 3 (Retrieval≠Knowledge Creation), escalating Part A's principles into
  named governance vocabulary. Closes with a clean side-by-side RAG-vs-KnowledgeOS pipeline comparison and
  the summary statement: "KnowledgeOS is an epistemic investigation system, not a question-answering
  system."
