defines:
  - concept: "Source Plane"
    definition: "The architectural layer answering 'where did this information come from?' -- documents, APIs, Git, and other raw sources, distinct from the Knowledge Plane"
  - concept: "Knowledge Plane"
    definition: "The architectural layer answering 'what do we currently represent as knowledge?' -- entities, assertions, dimensions, relations, distinct from the Source Plane and evaluated by the Epistemic Engine"
  - concept: "Retrieve (goal-directed, corrected)"
    definition: "Retrieve(Q,K_t,I_t,C)->EvidenceCandidates -- a retrieval operation parameterized by the current question, Knowledge State, Ideal State, and context, so the system knows WHY it is retrieving, not merely which chunks match a query"
  - concept: "Three information pathways (A/B/C)"
    definition: "Path A: Training data->Foundation model->Learned parameters->LLM response (implicit model knowledge). Path B: Sources->Retrieval->Evidence->KnowledgeOS (explicit external knowledge, ungoverned until processed). Path C: Observations+Evidence+Assertions+Relationships+EpistemicStates+History->Knowledge State (governed organizational knowledge)"
