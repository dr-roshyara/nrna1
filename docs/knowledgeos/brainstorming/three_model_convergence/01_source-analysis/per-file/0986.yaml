about: >
  The actual D285-2 artifact (previously known only by cross-reference from files 0973-0985), formatted per
  the HPA-mandated seven-section D285-x template. Tests `Knower≠K` and `Knower∉K`.

  **§2 DELIVERS A STATUS UPGRADE THIS RECONSTRUCTION HAD NOT ANTICIPATED**: this is not merely a tested
  hypothesis but **ALREADY-RATIFIED CORPUS** -- `FA-4-concept-terminology-reconciliation.md` (RATIFIED,
  **"GN-31"**, a NEW corpus reference), row `Knower`, records it as `H-KOS-Agent-001` / **Kṣetrajña** --
  "protected first-class agent," graded **`[E]` CONVERGENT** ("the only concept with the same Sanskrit
  lineage on both sides"), and the ratification record ITSELF already names the Gītā lineage -- **so
  `kṣetra-jña` did not enter through this D285-x research programme; it was already there**, predating it.

  **§3 delivers the formal treatment**: `Knower` persists across `K_t→K_{t+1}` (✅, via `I-1` goal-ownership);
  `K` definable without `Knower` (✅); `Knower` definable without `K` (🟡 partially, relationally defined as
  goal-owner); `Knower∈K` is **REFUTED** (🔴, would make the goal's owner a member of the goal's subject,
  violating the standing corpus invariant "Zero/Lord/Sārathi ∉ State Mutation Boundary").

  **§4 DIRECTLY RESOLVES THE LONG-TRACKED BRIDGE CANDIDATE "31.19"**: the Gītā source (13.3) identifies
  Kṛṣṇa as knower "in all fields" -- a UNIVERSAL knower level distinct from the individual `kṣetra-jña`.
  KnowledgeOS-side check: the individual level is needed and already ratified; **the universal level is
  explicitly REJECTED (`RX`) because the corpus's own ratified information-theoretic impossibility theorem,
  cited here in full for the first time as `31.19`: "No algorithm can recover information that the
  observation function destroys," DIRECTLY CONTRADICTS a total-knowledge oracle.** Declared "the most
  valuable result of the Gītā lens in this step, and it is a NEGATIVE one... the mapping must stop at one
  level, and the reason is mathematical, not doctrinal."

  **§ Template §6 (Independence) DELIVERS THE FILE'S OWN EXPLICIT SELF-CLASSIFICATION AS THE PROGRAMME'S ONE
  GENUINE PHILOSOPHICAL CONTRIBUTION**: "NOT independent -- FA-4 records `Kṣetrajña` with the same Sanskrit
  lineage on both sides, grade `[E]`. The concept entered via the lens. **This is the one genuine
  philosophical contribution, and it predates this programme**" -- **DIRECTLY, EXPLICITLY CONFIRMING file
  0980's capstone finding** ("the entire Step-25X track's only genuinely non-independent contribution
  predates the research programme itself").

  **§7 (seven-way classification)**: mathematical `R5`; architectural: already ratified; DDD: external
  actor, not an aggregate member; corroboration: explicitly marked ✗ ("contribution, not corroboration");
  sub-result `H-K03b` (universal knower) = `RX`, contradicts `31.19`.

  **§5 delivers a disciplined negative-result closure**: the Knower/state boundary "does not decide between
  `K_t` and `(𝒜,ℛ)` -- both exclude the Knower... eliminates nothing. Recorded so it is not later cited as
  evidence for a state choice it cannot support" -- an explicit anti-overclaiming guard.
