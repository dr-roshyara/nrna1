title: "Step 113 -- Delivers the Reconstruction's Richest Semantic-Core Falsification Exercise: an Explicit Ten-Question Falsification Checklist, Systematic Testing of Ten Candidate Concepts (Evidence/Observation/Claim/Decision/Authority/Action/Verification/Finding/Rule/Architecture), Artifact≠Evidence as a Semantic Transformation, Three Competing Architectural Identity Models (EvidenceAuthority/EvidenceAggregator/EvidenceProcessingPlatform), a Formal Semantic-Core-Minimality Principle (Core_minimal=argmin(Model) Subject to Model⊢ObservedBehavior, 'A Powerful Anti-Overengineering Principle'), Systematic Removal-Experiment Validation of 0697's Semantic-Core Test, the Graph-Not-Pipeline Refinement of the Semantic-Truth Hierarchy, and the Reconstruction's Most Precise Formulation of Its Central Tension Yet: 'CurrentAuthoritativeKnowledge' vs. 'TopKSimilarDocuments' -- Opens Step 114 -- Semantic Core Evidence Test With an Explicit STRICT Evidentiary Standard ('Every Non-Unknown Cell Must Have Evidence')"
