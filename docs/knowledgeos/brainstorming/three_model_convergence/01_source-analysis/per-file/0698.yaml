defines:
  - concept: "Artifact≠Evidence"
    definition: "A raw artifact (a document, a commit, a log line) is not itself evidence; it becomes evidence only through a semantic transformation in which a verification process or the system explicitly establishes its evidentiary role in supporting or constraining a specific claim"
  - concept: "The three evidence-architecture models (EvidenceAuthority / EvidenceAggregator / EvidenceProcessingPlatform)"
    definition: "Three mutually exclusive hypotheses for how a system actually relates to evidence: EvidenceAuthority (the system itself defines what counts as valid evidence and enforces evidentiary rules), EvidenceAggregator (the system merely collects and stores evidence from elsewhere without owning its semantics), EvidenceProcessingPlatform (the system transforms/processes evidence — e.g. indexing, embedding — without owning or defining its meaning); only implementation evidence can determine which model actually describes a given system"
  - concept: "Core_minimal=argmin(Model) subject to Model⊢ObservedBehavior (semantic-core minimality)"
    definition: "The correct semantic-core model for a system is the SMALLEST set of domain concepts sufficient to explain all currently observed behavior; introducing an additional domain concept that adds no explanatory power over already-established concepts, purely for conceptual elegance or architectural completeness, violates this minimality principle and should be avoided"
  - concept: "CurrentAuthoritativeKnowledge vs. TopKSimilarDocuments"
    definition: "A genuine knowledge operating system answers queries with CurrentAuthoritativeKnowledge — authoritative decisions on a subject, their supporting evidence, current temporal validity, and unresolved findings — rather than merely TopKSimilarDocuments, which is useful retrieval infrastructure but does not itself constitute a knowledge operating model"
