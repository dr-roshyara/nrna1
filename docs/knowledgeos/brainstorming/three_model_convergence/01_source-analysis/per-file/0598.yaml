defines:
  - concept: "Derivation (formal structure)"
    definition: "D=(Premises,Rules,Substitutions,Assumptions,Conclusion) — a first-class knowledge artifact recording exactly why a conclusion was accepted, never collapsed into a bare Boolean fact"
  - concept: "Proof-carrying assertion"
    definition: "An assertion accompanied by a step-by-step machine-checkable derivation that a deterministic verifier independently confirms, so acceptance of the conclusion does not depend on trusting the generating process's own reasoning narrative"
  - concept: "Zero as unresolved epistemic/proof obligation"
    definition: "The unified interpretation of Zero across the 25-series: any of missing evidence, unresolved identity, unresolved contradiction, unverified derivation, missing authorization, or unvalidated model assumption is an instance of a single underlying concept — an outstanding obligation the epistemic system has not yet discharged"
  - concept: "GenerativeReasoning+DeterministicAssurance"
    definition: "LLMs handle language interpretation, candidate premise/rule/hypothesis proposal, and explanation; deterministic components handle rule evaluation, constraint checking, identity checks, arithmetic, temporal validity, schema validation, proof checking, and authorization — the architecture's core division of epistemic labor"
