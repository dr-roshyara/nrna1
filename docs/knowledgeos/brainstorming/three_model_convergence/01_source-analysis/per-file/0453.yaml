about: >
  A landmark architectural file resolving a fundamental question left implicit throughout the corpus: does
  the Zero Lens belong to KnowledgeOS as a domain object, or as something else entirely? Delivers a clean,
  decisive answer: **Zero Lens is a KnowledgeOS EPISTEMIC CAPABILITY, explicitly NOT a domain object** such
  as Dimension, Observation, or Knowledge -- Zero operates ON knowledge, Zero(K_t)->Z_t, producing the set of
  detected epistemic gaps/boundaries, but is never itself part of the knowledge being represented. Produces
  the corpus's first explicit two-tier (later three-tier) architectural separation: **KnowledgeOS =
  Knowledge Model (Observation, Knowledge, Evidence, Dimension, Relationship, Ideal State, later expanded to
  include Statement, Value, Epistemic Status) + Epistemic Capabilities (Zero Lens, Lord Lens, Krishna/
  Sarathi) + Human (Knower/Decision Owner)** -- a genuinely new DDD-style architectural diagram clarifying
  precisely where each of the corpus's established lenses "lives" in the overall system, not previously
  stated this explicitly anywhere in the reconstruction's sequential pass.

  Makes Zero concretely operational via the Arjuna investigation-loop example: Observation -> Knowledge ->
  Zero -> Missing/Unresolved -> Further Observation, explicitly stating "Zero is not merely a quality-control
  mechanism at the end. It can become part of the investigation loop" -- directly building on 0452's
  Progressive Investigation architecture. Produces a clean three-way division of epistemic responsibility:
  Zero asks "what are we missing?"; Lord asks "what else could exist?"; Sarathi asks "what should the Knower
  investigate/do next?" -- with the Human Knower retaining Understand/Decide/Act.

  Delivers four important precision corrections to what Zero can and cannot legitimately claim, each a
  genuine epistemic-discipline refinement. First: **Zero does not detect truly missing dimensions in the
  strong sense** -- Zero can only say "dimension d is not represented" if d is ALREADY a known candidate
  dimension; Zero cannot say "there exists an unknown dimension you don't know about" -- that capability
  belongs exclusively to the Lord Lens. Reformalizes this as Zero = known boundary of current knowledge,
  versus Lord = potential expansion beyond current knowledge, "this prevents Zero from pretending to see the
  infinite unknown." Consequently splits Z_t's fourth component from M_t (missing/suspected dimensions) into
  **R_t (unresolved/requires-investigation findings)**, yielding Z_t=(U_t,C_t,A_t,R_t), with Lord separately
  producing L(K_t)->D^candidate_t -- "a very clean separation." Second: **Zero is more than mere gap
  detection** -- reformulated as Zero(K)=EpistemicBoundaryAnalysis(K), "a better long-term definition" than a
  simple missing-data detector, spanning unknown/undefined/unrepresented/unresolved/conflicting/assumed as
  distinct forms of epistemic boundary. Third: careful re-phrasing of what Zero can claim about the Arjuna
  example -- not "Zero knew those dimensions were missing" (which would imply prior knowledge of the specific
  missing content) but the more rigorous "the previous knowledge representation did not represent these
  newly revealed relationships." Fourth and fifth: **Zero does not prioritize** (Zero produces a Gap; a
  separate contextual evaluation determines Relevance(Gap|Purpose,Context) and Priority(Gap|Threat,Risk,
  Impact), reconfirming Knowledge!=Priority) and **Zero does not determine truth** (a detected conflict does
  not mean one source is false -- Conflict!=Falsehood, Unknown!=False, Unresolved!=Invalid, "exactly where
  the Zero Lens gives KnowledgeOS its epistemic discipline").

  Extends the investigation loop into a full five-stage pipeline with explicit per-stage questions:
  Observation -> Knowledge -> Zero ("what is unresolved?") -> Lord ("what else could exist?") -> Sarathi
  ("what should we investigate next?") -> new Inquiry -> Observation, "becoming a very strong architectural
  pattern." Consolidates the revised architecture with precise per-capability formal signatures: Zero:
  Knowledge -> EpistemicBoundary; Lord: Knowledge -> CandidateKnowledgeSpaceExpansion; Sarathi:
  Knowledge+Boundary+Candidates+Purpose -> Guidance.

  Produces the file's final, canonical Zero Lens definition, explicitly marked "Strong Working Definition"
  per 0449's status-classification discipline: "Zero Lens is an epistemic capability of KnowledgeOS that
  examines a knowledge state for epistemic boundaries -- unknown values, undefined or unrepresented aspects,
  conflicts, unresolved matters, unvalidated assumptions, and similar distinctions -- without collapsing them
  into falsity, absence, invalidity, or low confidence," paired with the explicit constraint "Zero does not
  claim to enumerate the unknown unknown" (that belongs to the Lord Lens/infinite-knowledge-space
  hypothesis).

  Delivers the file's most consequential methodological decision: **explicitly declines to proceed to Phase
  3** (the Zero/Lord/Sarathi relationship) of the twenty-phase programme, recognizing instead that "we need
  to finish defining the knowledge primitives -- especially Dimension -- because Zero can only operate
  meaningfully once we know what constitutes a dimension and a knowledge state." This is a genuine, live
  demonstration of the corpus's own disciplined research-sequencing methodology (0449) catching and
  correcting a premature ordering in real time, rather than merely describing the discipline abstractly.
  Closes by re-launching Question 2 (What is a Dimension?) via the Bhisma test case, now sharpened into four
  explicit candidate answers: is a dimension a statement, a semantic axis, a relationship, or something more
  fundamental?
