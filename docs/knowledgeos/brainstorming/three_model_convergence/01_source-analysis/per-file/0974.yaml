about: >
  **STRUCTURAL NOTE**: this is a standalone, self-contained, genuinely executable Python script (86 lines)
  located under `knowledgeos_kernel/research/exec/`, a further new sub-path within the kernel-track
  directory dedicated specifically to executable research code -- a qualitatively different kind of
  artifact from every prior file in this reconstruction's tracking. **UNLIKE FILES 0939's AND 0963's
  PSEUDOCODE (which contained bare `pass`-statement stubs for their hardest logic), EVERY LINE OF THIS
  SCRIPT ACTUALLY COMPUTES AND PRINTS A CONCRETE RESULT -- THIS IS THE FIRST FULLY EXECUTABLE, NO-STUB
  VERIFICATION ARTIFACT ENCOUNTERED IN THIS ENTIRE RECONSTRUCTION.** Its docstring explicitly identifies it
  as implementing "STEP 285 — formal reconciliation of the two K formulations. Tests T1-T8, Models A-F,"
  directly executing the formal test framework files 0969 and 0972 specified in prose.

  **§T-A (PRIMITIVE-LEVEL COMPARISON) delivers a concrete set-theoretic comparison**: the ratified `K_t`
  primitives (eight: Entity, State, Event, Observation, Proposition, Relation, Policy, Action) versus the
  verification lane's `K=(𝒜,ℛ)` (Assertion, Relation, with Assertion expanded via its own declared fields --
  `id,P,e,c,t,Π` with `P=(E,D,V)` -- into Proposition, Entity, Evidence, Context, Time, Provenance),
  computing the SHARED, RATIFIED-ONLY, and VERIFICATION-ONLY sets, and explicitly separating the
  ratified-only items into those the verification lane's own Steps 272B/273 declare EXTERNAL to `K`
  (History, Policy, Authority, Action, Event) versus those "simply ABSENT from the verification lane" --
  the first genuinely mechanized, reproducible computation of the exact construct-set overlap underlying
  files 0941's/0942's/0968's long-tracked K-collision.

  **§T-B (MODEL DISCRIMINATION) DELIVERS A CONCRETE, EXECUTED VERDICT ON FILE 0969's SIX CANDIDATE MODELS
  (A-F)**: **Model A** ("K_t=(𝒜,ℛ,Σ,...) complete") **REFUTED** -- "ratified K_t contains Action/Event/
  Policy, which the verification lane puts OUTSIDE K"; **Model B** ("K_t=(𝒜,ℛ), rest external") **REFUTED**
  -- "contradicts FA-4: ratified K_t is 'state over 8 primitives', not 2" (citing a specific, previously-
  unseen corpus reference "FA-4"); **Model C** ("(𝒜,ℛ)=π_K(K_t) projection") **HOLDS** -- "every
  VERIFICATION-ONLY item is a FIELD of an assertion, not a new primitive"; **Model D** ("K_t=
  π_knowledge(S_t)") **HOLDS**, explicitly "compatible with C; differs only in which object is called
  primary"; **Model E** (`S_t=(K_t,E_t,H_t,G_t,Q_t)` layered) **HOLDS**, "compatible with C; names the
  complement of the projection"; **Model F** (separate products) **REFUTED** -- "'Relation' and
  'Proposition' are shared primitives; a common referent exists" -- **THIS IS THE FIRST GENUINE, CONCRETE,
  MECHANICALLY-DERIVED ANSWER TO THE K_t/K=(𝒜,ℛ) RECONCILIATION QUESTION this reconstruction has tracked
  since files 0941/0942/0968/0969**: the ratified architecture's `K_t` and the verification lane's
  `K=(𝒜,ℛ)` are compatible via a projection relationship (Models C/D/E all describing essentially the same
  underlying structure from different vantage points), NOT identical, NOT unrelated, and NOT separate
  products.

  **§T-C (IS THE PROJECTION WELL-DEFINED?) DELIVERS "THE DECISIVE TEST" AND THE SCRIPT'S MOST IMPORTANT
  FINDING**: constructs the explicit projection map π for each of the eight ratified primitives (Proposition
  → inside Assertion's P; Entity → inside P; Relation → directly; Observation → evidence `e`, AFTER
  Qualify; State → the carrier itself; Event/Policy/Action → DROPPED as external), confirms the projection
  is TOTAL (every primitive has an image or an explicit, principled drop), **BUT THEN IDENTIFIES THAT ONE
  MAPPING IS MERELY CONDITIONAL**: `π(Observation)→e requires Qualify: Observation×Policy→Evidence`, and
  **"Qualify HAS NO BODY in the corpus (1 undefined hit, Step 170)"** -- **REVEALING A SPECIFIC, PREVIOUSLY-
  UNNAMED CONCRETE GAP TRACEABLE TO A SPECIFIC, VERY EARLY STEP NUMBER (Step 170) THIS RECONSTRUCTION HAS
  NOT DIRECTLY ENCOUNTERED BY NAME, IDENTIFIED AS STILL UNRESOLVED EVEN AT THIS LATE STAGE (Step 285) OF THE
  CORPUS'S OWN TIMELINE** -- delivering the script's central boxed conclusion (in prose form): **"π is
  DEFINABLE but NOT COMPUTABLE. The projection exists as a structure and cannot be evaluated. This is the
  precise reconciliation result."** -- a genuinely precise, actionable, falsifiable formal conclusion,
  qualitatively different from every decorative claim this reconstruction has flagged throughout the Step-
  25X track: it identifies EXACTLY what is missing (a computable body for `Qualify`) and EXACTLY where the
  gap originates (Step 170), rather than asserting vague completeness.

  **§T-D (SUFFICIENCY/IDENTITY/REPLAY) delivers three further concrete negative findings**: T1 sufficiency
  -- `(𝒜,ℛ)` alone cannot carry Action/Event/Policy, hence INSUFFICIENT for `K_t`'s full role; T2 identity
  -- assertions have an explicit identity rule `id=H(P,e,c,t,Π)` while `K_t` itself has NO identity rule,
  an explicit ASYMMETRY between the two lanes; T6 replay -- `K_t=fold(δ,H,K_0)` requires Action+Event, which
  `(𝒜,ℛ)` excludes, meaning replay is expressible in the ratified lane but not in the verification lane
  alone.

  **§T-E (ACTION≠RESULT) DELIVERS A GENUINE, EXECUTED, WORKED CONFIRMATION OF FILE 0969's §6 FORMAL
  INSIGHT** (`δ(K,o_1)=δ(K,o_2)⇏o_1=o_2`): constructs two concrete operations (`o1` asserting `a2` with
  provenance "origin:scan, actor:tool"; `o2` asserting the identical `a2` with provenance "origin:vendor,
  actor:human"), computes both resulting states as SET-EQUAL (`{a1,a2}={a1,a2}`) while the operations
  themselves are NOT equal, printing "CONFIRMED, REQUIRED" -- **BUT THEN DELIVERS A GENUINE FORMAL
  REFINEMENT NOT PRESENT IN FILE 0969's ORIGINAL STATEMENT**: "if ids hash Π [provenance], the assertions
  differ -- but then the STATES differ too, so the property must be stated over SEMANTIC equality, not
  structural [equality]... under SEMANTIC equality (ignore id, Π): states ARE equal, operations differ."
  Concluding "the property is REQUIRED and holds only under semantic equality. Typed result." -- **THIS IS A
  GENUINE, SUBSTANTIVE SHARPENING of file 0969's own formal claim, identified through actual code execution
  rather than prose argument, directly relevant to the eventual identity/equality semantics the corpus has
  repeatedly flagged as unresolved (files 0912, 0934, 0957, 0959, 0968).**
