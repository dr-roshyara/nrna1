defines:
  - concept: "The projection well-definedness distinction: definable but not computable"
    definition: "A projection map pi:K_t->(A,R) can be DEFINABLE -- meaning every element of its domain has a specified image or an explicit, principled exclusion, making the map total as a mathematical object -- while simultaneously NOT COMPUTABLE, meaning at least one of its component mappings depends on an auxiliary function (here, Qualify: Observation x Policy -> Evidence) that has never been given an actual implementation or algorithmic body anywhere in the corpus. A definable-but-not-computable projection exists as a valid mathematical structure but cannot actually be evaluated on real inputs until its missing component function is supplied"
  - concept: "The semantic-equality-scoped delta non-identifiability property"
    definition: "The property delta(K,o1)=delta(K,o2) does not imply o1=o2 (two different operations can produce the same resulting state) is REQUIRED (a genuine, necessary feature of the theory) but holds ONLY under semantic equality of states (comparing states by their asserted content, ignoring identity/provenance fields). Under structural equality (comparing states including their identity-hashing fields, which typically incorporate provenance Pi), differing provenance between o1 and o2 would make the resulting states differ too, since the assertion identity itself is a hash of provenance among other fields -- so the non-identifiability property would then vacuously fail to apply. The property must therefore be explicitly scoped to semantic equality to be meaningful, and any formal transformation algebra must treat delta's result-equality check as a TYPED result (semantic-equality typed) rather than assuming a single universal notion of state equality"
