defines:
  - concept: "The four named reasons a Sarathi decision cannot be reached"
    definition: "A decision-making attempt by the Sarathi component fails to produce a DecisionResult of Decision for exactly one of four reasons: (1) missing knowledge, formally Zero≠∅ (some required knowledge slot remains unfilled); (2) conflicting knowledge, formally Conflict≠∅ (the knowledge state contains an unresolved contradiction); (3) a missing decision model, i.e. utility or preference structure is undefined for the choice at hand; or (4) irreducible human authority, where even complete non-conflicting knowledge and a defined decision model still cannot substitute for a human decision that only a human is authorized or competent to make"
  - concept: "The Knowledge Atma Identity Problem"
    definition: "The open question of what criterion determines whether two knowledge objects (observations, assertions, or knowledge states) count as the same underlying knowledge, as distinct knowledge, as a refinement of one another (a more precise version of the same underlying content), or as merely two different representations of a single observed reality. Framed, by analogy with the Gita's Atma/Body distinction, as a search for a persistent 'Knowledge Atma' identity that underlies changing representations, expressions, and instantiations -- explicitly designated as an open frontier requiring a dedicated formal treatment (Step 25I) rather than assumed already solved by the existing identity/equality apparatus"
