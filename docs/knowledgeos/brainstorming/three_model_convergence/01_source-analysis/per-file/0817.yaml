defines:
  - concept: "'Provenance collapse'"
    definition: "A concrete failure mode in which an AI-generated claim's epistemic origin is silently lost as it propagates through organizational knowledge: an AI states a claim, a human copies it into a knowledge record without attribution, and the system eventually retains only the bare claim with no indication that its source was AI inference rather than direct infrastructure observation -- indistinguishable at that point from independently established fact; the architecture's provenance-preservation discipline exists specifically to prevent this collapse from occurring silently"
  - concept: "Evidence-backed state transition as the fundamental KnowledgeOS object"
    definition: "Rather than treating 'Knowledge' as the primitive concept KnowledgeOS is built around, the concrete case analysis suggests the more fundamental unit is the evidence-backed, witnessed state transition itself (Transition=(sourceState,targetState,rule,witness,time,actor)) -- Knowledge, Determination, and Decision are then understood as semantic products or classifications that emerge from analyzing these transitions, not as independently primary objects; this reframing directly parallels and reinforces 0813's JustifiedStateTransition conclusion, but arrived at here through concrete case comparison rather than abstract derivation"
  - concept: "SemanticTransition vs. TechnicalMutation"
    definition: "Not every state change in a running system deserves treatment as a governed epistemic/domain event -- a real system performs enormous numbers of purely technical mutations (cache updates, log writes, HTTP requests, lock acquisitions, memory changes) that carry no organizational epistemic or governance significance; the architecture must draw an explicit line distinguishing these technical mutations from genuinely semantic transitions (those that change what the organization knows, decides, or is authorized to do), since applying the transition-witness/invariant machinery to every technical mutation would be both impractical and meaningless"
