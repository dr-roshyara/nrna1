    refinement: "Extended with a directly analogous refusal for the DDD aggregate-boundary question: Lineage is explicitly NOT prematurely called an aggregate, and OperationalState is explicitly NOT owned by KnowledgeOS -- both are disciplined refusals to over-claim architectural ownership, directly consistent with the Kernel's own non-sovereignty principle from 0814"
