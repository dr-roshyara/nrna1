  - concept: "0359/0360's KST engagement and Galois-connection multiple-representations finding"
    refinement: "Given a precise characterization of WHAT is invariant in KST's own multiple-representations result (the knowledge structure K-script itself), sharply distinguished from the harder, unresolved question of invariance across DIFFERENT evidence-combination mechanisms (Bayesian/Dempster-Shafer/etc.), which KST does not address at all"
