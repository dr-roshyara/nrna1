  - concept: "Five candidate Kernel/regime invariants across evidence-combination mechanisms: the set of possible states; the posterior distribution; the set of plausible states (thresholded); the state ordering; the revision operation itself -- an explicit enumeration the corpus can test against"
  - concept: "Kernel/Regime/Projection architecture as explicitly proposed in this document (Kernel preserves raw evidence/structure/temporal-ordering; Regime determines combination-mechanism/output-representation/update-rule; Projection is the resulting epistemic state) -- the specific formulation 0375 partially rejects (raw evidence) and partially refines (regime concept retained, substrate reconceived via provenance/relations rather than raw evidence)"
