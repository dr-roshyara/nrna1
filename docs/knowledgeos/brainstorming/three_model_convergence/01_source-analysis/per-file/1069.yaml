about: >
  "05 — Congruence Audit (mandate §6)." Asks whether there is an INDEPENDENT corpus basis for requiring
  congruence of transformations under `≡_K` equality.

  **CONFIRMS YES, VIA `258.9`, INDEPENDENT OF `≈`**: quotes `258.9` in full: "For every valid transformation
  `T∈𝒯` we require `K_1≡_K K_2⟹T(K_1,c)≡_K T(K_2,c)`... THIS IS THE CRITICAL MATHEMATICAL REQUIREMENT. If it
  fails, then `≡_K` is too coarse." Cites `258.30` Proposition 258-A (`F∘T_H=T̄∘F`, every mandatory
  transformation must factor through the abstraction) and its commuting diagram (`258.23`). "None of these
  mentions `≈`." Delivers a clean four-way separation of previously-conflated notions: equality itself (no
  independent definition, two unratified candidates, already tracked file 1067); congruence of operations
  under equality (required by `258.9`, unproven globally since `𝒯` is not closed per `259`, and `=` is
  "EXECUTED not a congruence" per `288/06 §G`, already tracked); observational equivalence `≈` (defined,
  `261.5`, but `𝒪_K` open, already tracked); transformation semantics (`δ`/`𝒯`, commit case unspecifiable,
  `𝒯` unratified, already tracked).

  **SELF-DIAGNOSES A GENUINELY IMPORTANT RETROACTIVE CORRECTION TO THE ALREADY-TRACKED STEP-289 DEPENDENCY-
  GRAPH CYCLE ANALYSIS (file 1052)**: explicitly runs the mandate's own warned-against trap check ("Do not
  use the existence of a cycle as evidence that `≡` and `≈` are identical... a dependency edge is a claim
  about DERIVATION ORDER. Identity is a claim about EXTENSION.") and discovers that "Z-1's edge `≈→≡` CAME
  FROM `261.21`'S CANDIDATE -- i.e. the cycle existed in my graph BECAUSE OF THE CANDIDATE PROPOSAL, which I
  had MIS-MODELLED AS A DEFINITIONAL DEPENDENCY." This directly connects the newly-resolved N-1
  candidate-vs-assertion finding (files 1063-1067) back into a concrete correction of the earlier
  dependency-graph artifact (file 1052).

  **CONSEQUENCE FOR THE ALREADY-TRACKED MINIMAL-CUT RESULT**: cycles narrow from 4 to "3 necessary + 1
  candidate-dependency"; Z-1's status weakens from NECESSARY to a mere proposal-derived artifact; but **the
  minimal cut `{≡}` STILL HOLDS**, now carried entirely by Z-2 (congruence↔≡) and Z-4
  (congruence→≡→δ→congruence), both independently classed NECESSARY and surviving all three deletion tests
  (already-tracked methodology, file 1052). Delivers the precise, disciplined characterization of the
  correction's direction: "the cut is BETTER evidenced after the withdrawal, because the cycle that depended
  on a misreading is gone and the remaining ones do not."

  Confirms the STATUS block: ESTABLISHED congruence has an independent basis, the four notions are distinct,
  a dependency is not a semantic identity · REFINED Z-1 weakened, `{≡}` still the cut on 3 necessary cycles ·
  TECHNICALLY OPEN global congruence · BLOCKED on `𝒯`, `δ`.
