defines:
  - concept: "Proposition (final)"
    definition: "P=(E,D,V): a semantic possibility -- content without commitment, no epistemic status, evidence, temporal validity, or provenance"
  - concept: "Assertion (final)"
    definition: "A=(P,Σ,E,τ,Π): a proposition put forward as true, carrying epistemic status, evidence, temporal validity, and provenance"
  - concept: "Epistemically Accepted (final, replaces naive Knowledge)"
    definition: "K=(A,J,T_A): a justified assertion whose Truth Assessment (not absolute Truth) has been evaluated as supported by available evidence"
  - concept: "Reality/Ω"
    definition: "X_t: the actual state of reality at time t; determines truth but is inaccessible in full to KnowledgeOS, consistent with the infinite-knowledge-space hypothesis"
  - concept: "Knowledge State (functional)"
    definition: "K_t = 𝓔_t(𝓐_t), where 𝓐_t is the set of currently available assertions and 𝓔_t is KnowledgeOS's epistemic-evaluation function; updated via K_{t+1}=Update(K_t,Observation_t,Zero_t,Lord_t,Evidence_t)"
