  - concept: "Closure (of the epistemic state space)"
    definition: "𝒦 is closed under Update if every legitimate transition Update(K_t,E_t) always produces a representable K_{t+1}∈𝒦; tested via eight labeled experiments, all PASS"
  - concept: "History-monotonic / current-non-monotonic split"
    definition: "H_t⊆H_{t+1} (the event log only grows) while K_{t+1}=Derive(H_{t+1},Ω,EC) (the derived current state may change or shrink) — resolves the false expectation of naive knowledge monotonicity"
  - concept: "NonDeterministicAcquisition→GovernedInput→DeterministicStateTransition"
    definition: "An LLM or other nondeterministic source may propose a candidate input, but only after governed validation does it become a deterministic EpistemicEvent eligible for the state-transition function"
