about: >
  Proposes a Topological Lens as a candidate 27th lens, explicitly distinguished from Escher (Escher:
  invariant-preserving transformation, visual/recursive; Topology: invariant connected structure under
  continuous deformation -- connectedness, boundaries, neighborhoods, holes, as opposed to geometric
  properties like distance/angle/size). Strengthens the Zero lens with a richer vocabulary (removing a
  node changes the topology from connected to disconnected, not merely "one value is absent") and the
  Navya-Nyāya lens (the network of relationships itself, not any individual node, may be the true object
  of identity). Produces a ten-question boundary-crossing analytical checklist and five named topological
  failure modes. Most significantly, the source explicitly checks its own admitted-lens register and
  finds Topology is NOT yet formally admitted, declining to silently add it as a new family -- a clean,
  directly observable instance of anti-premature-promotion discipline.

introduces:
  - "Topological Lens core question: 'What structural relationships remain invariant when the form
    changes?' -- distinguishing topological properties (connectedness, separation, boundary, continuity,
    neighborhoods, holes, containment, adjacency) from geometric ones (distance, angle, size, shape)"
  - "Explicit Escher-vs-Topology distinction: Escher asks what invariant mathematical structure survives
    transformation; Topology asks what invariant relational/connected structure survives continuous
    transformation -- overlapping but not identical lenses"
  - "Zero-lens enrichment: removing a connecting element changes the SYSTEM'S TOPOLOGY (connected ->
    disconnected), not merely 'one thing is missing' -- a structural, not merely a value-level, reading
    of absence"
  - "Navya-Nyāya enrichment: 'Knowledge identity can sometimes reside in relational topology rather than
    in individual representations' -- the network itself as the object, not any single node"
  - "Ten-question boundary-crossing analytical checklist applicable to every KnowledgeOS boundary: what
    is inside/outside, what constitutes the boundary, what may cross, what transforms at crossing, does
    identity survive crossing, can something bypass, what if the boundary disappears, what if two
    regions merge, what if one region splits"
  - "Five named topological failure modes: Boundary Leakage (bypass without satisfying admission),
    False Connection (assumed relation without valid basis), Broken Connection (a required relationship
    for identity/justification disappears), Boundary Collapse (the architecture stops distinguishing
    external material from admitted knowledge -- explicitly flagged 'a very serious KnowledgeOS
    failure'), and Identity-Preserving Transformation (the desired positive case)"
  - "Explicit self-check against the corpus's own admitted-lens register: Topology is found NOT yet
    admitted as a formal family, and the source declines to silently promote it, citing its own rule
    that a confirming file must not silently become a new register row"

