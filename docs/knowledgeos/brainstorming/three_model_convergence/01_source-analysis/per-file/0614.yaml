about: >
  Opens Step 34 directly executing 0613's clean transition, delivering the file's foundational distinction:
  inference asks "what can we conclude from what we know?" while Step 34 asks **"what should we learn
  next?"** -- explicitly noting KnowledgeOS cannot investigate everything (worked million-uncertain-
  assertion scale example). **This is the corpus's final, successful landing of the resource-allocation
  topic this reconstruction has tracked across three prior renamings/deferrals (originally "Step 31" at
  0609, deferred to a future "Step 32" at 0610, bypassed a second time at 0611)**.

  **Delivers the file's central formal deliverable -- decision-theoretic Value of Information machinery**:
  `EVPI=L_0-L_{PI}` (Expected Value of Perfect Information, an upper bound), and
  `EVSI(I)=L_0-E_Y[min_d E[L(d,θ)|K,Y]]` (Expected Value of Sample Information for a realistic,
  imperfect information action), combined into `NVOI(I)=EVSI(I)-Cost(I)`, explicitly named "the core
  mathematical idea." **Delivers the corpus's first formal definition of `NextBestEpistemicAction`**:
  `I*=argmax_{I∈𝓘} NVOI(I)`.

  **Delivers the file's second central formal deliverable -- a precise separation between information
  value and mere uncertainty reduction**: `InformationValue≠UncertaintyReduction`, worked through a
  contrasted pair of examples (resolving RAM uncertainty when the migration architecture has a large safety
  margin has near-zero decision value; resolving backup-restorability uncertainty when execution critically
  depends on it has extremely high value), formalizing `DecisionSensitivity(A,D)` as the governing factor.
  Delivers `DependencyClosure+DecisionCriticality=EpistemicPrioritization`, directly reusing 0612's (Step
  32) `Closure(A)` machinery, and domain-owned `Criticality(D)` that KnowledgeOS consumes without inventing.

  **Delivers a genuinely useful new concept -- Decision Boundary Uncertainty**: uncertainty far from a
  governing threshold (e.g. a `Risk<5%⇒AutomaticApproval` rule) is largely harmless, while uncertainty
  straddling the boundary (worked `Risk∈[4%,7%]` crossing a `5%` threshold example) is critical and
  investigation-worthy, formalized as a conceptual triage rule
  `Priority(A)∝DecisionImpact(A)×Uncertainty(A)` (explicitly not yet a universal formula). Delivers worked
  net-value comparisons showing higher raw `EVSI` does not guarantee prioritization once cost is accounted
  for.

  Delivers Human attention and Compute formally recognized as epistemic resources with their own costs
  (`Cost_{human}(I)`), and Operational risk incorporated into `Cost(I)` for investigations that are
  themselves risky. **Delivers a formal eight-stage information-acquisition hierarchy** (existing evidence
  → existing independent evidence → read-only observation → automated validation → simulation → controlled
  experiment → expert investigation → operational intervention), with explicit "search existing evidence
  first" discipline preventing unnecessary duplicate investigation. Delivers `Sufficient(E,A,D)` as
  decision-relative (the same screenshot can be sufficient to establish "is it running?" but insufficient
  for "is it production-ready?").

  Delivers "epistemic active learning" as a generalization of the ML active-learning concept beyond model
  training to the entire knowledge system (spanning AI models, architecture, infrastructure, governance,
  and business knowledge), formal entropy-based Information Gain (`IG(Q)=H(K)-E[H(K|Q)]`), and the
  explicit caution **`InformationGain≠DecisionValue`** -- a high-entropy-reducing query about an irrelevant
  detail can have lower decision value than a lower-entropy-reducing query about something decision-
  critical, formalized conceptually as Decision-Weighted Information Gain. Delivers "Value of
  clarification" as a distinct information-action category -- semantic clarification (e.g. establishing
  what "production-ready" means in a specific bounded context) can dramatically reduce semantic uncertainty
  more effectively than acquiring another raw data point, directly reconnecting to the corpus's DDD
  bounded-context meaning-ownership discipline.

  Delivers a formal ten-value epistemic-action-category enum (`Retrieve, Observe, Measure, Validate,
  Clarify, Experiment, Simulate, Ask, Compare, Recalculate`), and a formal investigation-selection policy
  `SelectNext(K,D,𝓘)→I*` explicitly considering VOI, Cost, Risk, Dependency, and Criticality together.
  **Delivers an important limitation reconfirming the corpus's established assurance-gate discipline
  applied specifically to information-gathering actions**: the system must not autonomously execute every
  selected information action; `ActionAuthority(I)` is required, with a three-tier
  (`ReadOnly, OperationallySensitive, HumanApprovalRequired`) classification, and `Authorize(I,K)` must be
  evaluated before execution "the same assurance principle we established for ordinary actions." Delivers
  the crucial recognition that information actions can themselves modify reality (worked "restart to test
  recovery" example, explicitly `Experiment+Intervention`, requiring higher assurance than passive
  observation), formally reconfirming the corpus's established `Observe`/`do(X=x)` causal distinction
  applied to information-gathering specifically -- causal uncertainty may sometimes require genuine
  intervention to resolve, with `VOI_{causal}` explicitly required to include `InterventionRisk`.

  Delivers Sequential/adaptive information acquisition (`I_1→Observation→I_2(y_1)→...`) as generally more
  efficient than deciding all investigations upfront, formalized as an investigation policy
  `π:K_t→I` feeding a closed epistemic control loop (`Assess→Select→Acquire→Update→Reassess`), explicitly
  "substantially more powerful than a static knowledge repository." Delivers a formal stopping rule
  (`NVOI(I)≤0` for all feasible investigations, or governance-sufficient decision confidence, explicitly
  not necessarily reducible to a single scalar), and the Satisficing principle --
  **`SufficientKnowledgeForAction`**, not perfect knowledge, as the actual practical objective, with a
  formal, criticality-dependent `Sufficient(K,D)` predicate. Delivers a formal Epistemic budget concept
  (`Σ_i Cost(I_i)≤B`, an explicit resource-constrained optimization problem), and Investigation
  interaction effects (`Value(I_1,I_2)≠Value(I_1)+Value(I_2)`, both complementarities and redundancies
  possible), with provenance again identified as the mechanism for detecting redundant investigations, and
  Independent corroboration recognized as capable of producing high combined value when genuinely
  independent (worked runtime-inspection-plus-independent-monitoring example).

  **Delivers the file's third central formal deliverable, self-identified as a subtle and important
  insight -- the Value of Contradiction**: an investigation can be highly valuable even when it
  INCREASES uncertainty, by revealing that a strongly-held belief may be false, formalized as
  **`InformationValue can come from discovering that we are wrong`** -- directly extending 0613's parallel
  finding (new evidence can legitimately increase reported uncertainty) into the investigation-SELECTION
  domain specifically. **Delivers the file's central strategic principle, a precise operational
  application of Popperian falsification to investigation selection**: the optimal investigation strategy
  should NOT be "find evidence supporting my conclusion" but rather **"find the cheapest high-quality
  evidence capable of changing my conclusion"** -- explicitly "a much stronger epistemic strategy," giving
  concrete, actionable form to the falsifiability principle introduced informally at 0609 (Step 30).
  Delivers a formal Falsification-priority rule: critical claims with both high decision impact and high
  current uncertainty should generally receive high falsification-test priority.

  **Delivers ten labeled falsification experiments (A-J), ALL PASS**: preferring a moderate-cost
  independent decision-changing investigation over a cheap-but-redundant one; correctly assigning low
  priority to an irrelevant but highly uncertain assertion; correctly assigning high priority to a
  moderately uncertain but critical precondition; correctly assigning low decision value to an entropy-
  reducing but decision-irrelevant investigation; correctly gating an expensive investigation behind a
  cheaper pre-check; correctly prioritizing a potentially disconfirming investigation; correctly reducing
  the priority of and requiring authorization for an operationally dangerous investigation; correctly
  requiring an authorization gate for a privileged-access information action; correctly still classifying
  an uncertainty-revealing investigation as beneficial; correctly issuing `StopInvestigation` when no
  feasible action has positive net value.

  **Delivers Step 34's verdict**: **"STEP 34 — PASS,"** with the core formulation
  `I*=argmax_I[EVSI(I)-Cost(I)]` subject to Authorization, Safety, Resource, and Governance constraints,
  and **seven numbered architectural principles**: (1) uncertainty reduction is not automatically
  valuable; (2) decision impact determines information value; (3) information has cost; (4) human
  attention is a scarce epistemic resource; (5) contradictory evidence can be highly valuable; (6) the
  cheapest decision-changing investigation should generally be preferred; (7) information acquisition
  itself requires governance.

  Delivers an explicit architecture-level progression recap (Knowledge Representation → Knowledge
  Consistency → Knowledge Validation → Uncertainty Propagation → now Knowledge Acquisition), explicitly
  declaring "the architecture is becoming an active epistemic system," and the corpus's most complete
  single closed-loop notation to date, a thirteen-stage full cycle from Reality through Knowledge
  Revision and back.

  **Closes cleanly, with no renumbering collision, by identifying the next deeper problem -- competing
  decisions sharing one finite epistemic resource pool**: multiple decisions requiring evidence, compute,
  expert time, validation capacity, and operational access simultaneously, reframing the problem as
  **"portfolio-level epistemic resource optimization,"** explicitly larger than any single decision's VOI
  calculation. **Opens "Step 35 — Epistemic Resource Allocation, Attention Scheduling, Knowledge Triage
  and Portfolio Optimization,"** combining VOI, Risk, DecisionCriticality, DependencyImpact, Cost, Urgency,
  Freshness, and HumanCapacity, with the ultimate objective "maximize organizational decision quality per
  unit of epistemic resource." No actual code execution reported.
