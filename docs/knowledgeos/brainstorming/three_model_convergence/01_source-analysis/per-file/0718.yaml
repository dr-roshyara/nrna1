defines:
  - concept: "Capability/Assurance asymmetry (AgentCapability≤GovernanceAssurance)"
    definition: "An agent's operational capability (what it is technically able to do — read, write, deploy, etc.) must never exceed the maturity of the surrounding governance and evidence architecture that can assure and account for its actions; when capability outpaces assurance, the agent can act faster than the organization can establish what should be true, which is an unacceptable architectural risk for governed engineering"
  - concept: "FACT/DERIVED/HYPOTHESIS/TARGET"
    definition: "Every reconstructed architectural claim must be explicitly tagged: FACT (directly observed), DERIVED (logically derived from observed facts), HYPOTHESIS (an architectural interpretation requiring validation), or TARGET (desired future architecture) — this discipline prevents current and target architecture from being silently blended into a single undifferentiated claim"
  - concept: "The Architecture reconstruction rule (anti-duplication)"
    definition: "A target architectural component must never be introduced merely because a reconstruction pass has not yet located its conceptual counterpart in the existing system; the counterpart may already exist under a different name, especially in a platform that evolved incrementally — the correct disposition for genuine uncertainty is INVESTIGATE, not INTRODUCE"
  - concept: "Governance maturity ladder (G0-G6)"
    definition: "G0 governance exists only in documents; G1 governance documents are indexed; G2 decisions are registered; G3 decisions have authority/provenance/lifecycle; G4 decisions connect to implementation; G5 decisions connect to deterministic verification; G6 governance closes the runtime feedback loop"
