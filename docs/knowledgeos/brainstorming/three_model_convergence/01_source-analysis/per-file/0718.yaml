about: >
  Opens by declaring the governing rule for this phase, "Evidence before Architecture Claims," and a
  five-state classification (`Existing | Partial | Missing | Misaligned | Unknown`), refining 0717's
  five-way outcome taxonomy (`Already Exists|Partially Exists|Missing|Architecturally Wrong|Unknown`, with
  "Architecturally Wrong" renamed "Misaligned"). Delivers a five-question reconstruction model per capability
  (What should exist? What actually exists? What proves it — Evidence? Does it conform? What must happen
  next?) and a worked thirteen-row Current→Target matrix (Knowledge model/Provenance/Governance/Evidence/
  Assurance/Agent integration/Agent memory/Registry/Hooks/Context construction/Authorization/Runtime
  evidence/Assurance graph) — **every cell for the genuinely target-architecture-relevant rows remains
  `Unknown`, `Partial`, or `To reconstruct`/`To verify`; only Registry and Hooks are marked `Existing`, and
  even those without cited concrete evidence** — the file itself explicitly calls this matrix "deliberately
  conservative."

  **This file constitutes the direct, decisive resolution of 0717's explicit mode-change promise, and the
  resolution is NEGATIVE**: despite declaring "we have reached the point where we should stop extending the
  target architecture from assumptions" and explicitly framing the phase as "Evidence Mode," no actual
  repository, filesystem, or code inspection occurs anywhere in this file. The repository-structure template
  (§132.5) is explicitly hypothetical, caveated "we must NOT assume these directories exist." The `.claude/`,
  `.codex/`, `AGENTS.md`, and memory-classification sections (§132.7-132.10) pose the correct classification
  questions (most centrally, the recurring pointer-layer test: "does `.claude/` own knowledge, or does it
  point to knowledge?") but answer none of them with actual observed content. The file's own closing section
  explicitly reframes the still-undone archaeology as Step 133's job — continuing the corpus's established
  promise-then-defer structural pattern (0692→0693→0694; 0709; now 0717→0718→0719) one further level. Per
  the 0694 calibrating meta-finding, this non-fulfillment is recorded factually without escalating framing,
  but is explicitly noted as the direct resolution of the specific, unusually sharp promise flagged at 0717.

  **Despite the negative resolution, this file delivers substantial new, genuinely reusable methodology**,
  making it more than a pure repetition of the defer pattern. It delivers the precise Existing-vs-mature
  distinction (`Registry≠AssuranceGraph`, `Memory≠AuthoritativeKnowledge`, `Hook≠Governance`,
  `Check≠CompleteAssuranceModel`) and a self-referential inventory of mechanisms the corpus asserts the
  existing KnowledgeOS/EKS ecosystem already has (an AI Engineering Platform, governance mechanisms, a
  registry, hooks, agent-specific configuration, `.claude/`, `.codex/`, `.claude/memory/`, `AGENTS.md`,
  deterministic assurance mechanisms, session/change logging) — "therefore the current system is NOT a
  blank-slate knowledge platform" — itself an unverified but plausible claim within this file, not backed by
  citation to an actual inspected artifact.

  Delivers a Package-boundary test with five concrete dependency-direction questions (`Domain→
  infrastructure?`=FAIL if direct/inappropriate; `Agent→domain?`=potentially valid through application
  contracts; `Agent→database?`=needs scrutiny; `Governance→agent implementation?`=generally suspicious;
  `Assurance→external systems?`=expected through ports/adapters) directly operationalizing 0717's Logical
  Architecture for inspection use. Delivers a Hook-classification framework (`Trigger→Action→Evidence`,
  two worked examples: a Git-event validation hook vs. an agent-event session-logging hook, explicitly named
  "different architectural responsibilities") and the precise caution "hooks are not automatically
  governance" — a hook that blocks an operation is an enforcement mechanism, but `Hook→Policy` traceability
  must be established for hooks enforcing a governed rule.

  Delivers a Deterministic-assurance reconstruction checklist (eight specific questions: what is checked?
  where are rules defined? who owns the rules? how are results recorded? are results versioned? is evidence
  preserved? can results be reproduced? are failures connected to governance?), distinguishing
  `CollectionOfChecks` from `AssuranceSystem`, with the honest current classification
  `AssuranceCapability=Existing/Partial` (never `CompleteAssuranceContext`) and the precise minimum-evidence
  chain required for a genuine assurance architecture claim: `Rule→Checker→Execution→Result→Evidence→
  Finding` ("a checker exists" alone is "weak evidence").

  **Delivers three parallel seven-level maturity ladders, a genuinely valuable new methodological
  contribution**: Governance maturity `G0`(documents only)`→G1`(indexed)`→G2`(decisions registered)`→
  G3`(decisions have authority/provenance/lifecycle)`→G4`(decisions connect to implementation)`→
  G5`(decisions connect to deterministic verification)`→G6`(governance closes the runtime feedback loop);
  Knowledge maturity `K0`(documents)`→K1`(searchable)`→K2`(structured)`→K3`(governed)`→K4`(evidence-linked)
  →K5`(machine-traversable)`→K6`(continuously verified), target ≈ K6; and Agent maturity
  `A0`(standalone AI tool)`→A1`(repository-aware)`→A2`(knowledge-aware)`→A3`(governed)`→
  A4`(evidence-producing)`→A5`(authorized action)`→A6`(continuously assured), with the plausible but
  explicitly unverified claim "the current Claude/Codex architecture appears to be beyond A1, but the exact
  level must be established through evidence."

  **Delivers the file's most significant, currently and generally applicable AI-governance principle — the
  Capability/Assurance asymmetry** (§132.21-132.23): a system can have high agent capability (e.g. `A5`) but
  low knowledge maturity (e.g. `K2`), which is "dangerous" because `AgentCapability>KnowledgeAssurance`
  creates architectural risk — crystallized as the design principle `AgentCapability≤GovernanceAssurance`,
  "the more powerful the agent becomes, the stronger the surrounding governance/evidence architecture must
  become," worked through a concrete illustrative example (an agent capable of Read+Write+Deploy but a
  KnowledgeOS that only knows Documents+Search "can act faster than the organization can establish what
  should be true... unacceptable for governed engineering"). This principle is directly and currently
  applicable well beyond this reconstruction's own theoretical scope, to any real agentic-coding-tool
  deployment, including implicitly this very reconstruction's own operating context.

  Delivers a four-dimension current-architecture assessment framework (`Existence, SemanticMaturity,
  Enforcement, Traceability`) with a worked example table (mostly `?` placeholders, several rows partially
  filled with `Medium`/`High` for Agent hooks and Assurance checks specifically) and a Current-state
  evidence-strength hierarchy (`Runtime/Code > Executable Configuration > Tests/Checks > Structured Data >
  Architecture Documents > Narrative Statements`, "the stronger the claim, the stronger the evidence should
  be").

  **Delivers the FACT/DERIVED/HYPOTHESIS/TARGET claim-classification discipline**, worked through a
  precise, concrete four-line example directly and structurally consistent with this very reconstruction's
  own governing epistemic-discipline mandate (never silently convert hypothesis→definition): FACT (`.claude/
  contains a memory directory`) → DERIVED (`Claude has persistent local memory mechanisms`) → HYPOTHESIS
  (`the memory mechanism is intended as non-authoritative context`) → TARGET (`all authoritative
  engineering knowledge should resolve through KnowledgeOS`) — "this discipline is essential for the
  remainder of the reconstruction. This prevents accidental blending of current and target architecture."

  **Delivers an expanded, seven-category Current→Target delta classification**, refining 0717's five
  categories (`Retain/Refactor/Introduce/Remove/Integrate`) into seven (`KEEP/STRENGTHEN/REFACTOR/
  INTRODUCE/REMOVE/REPLACE/INVESTIGATE`), with a genuinely valuable, precisely reasoned justification for
  the new `INVESTIGATE` category (§132.29): "we should not turn uncertainty into architecture work
  prematurely" — a claim like "the registry might already provide evidence lineage" should be classified
  `INVESTIGATE`, never prematurely `INTRODUCE EvidenceSystem`.

  Delivers an Architecture-reconstruction sequence (`Repository→Modules/Packages→Data Model→APIs→Agent
  Harnesses→Hooks→Registry→Assurance→Governance→Integrations→Runtime→Current Architecture→Target Delta`),
  reframes "the most important question" from "what should KnowledgeOS be?" (already answered) to "how much
  of this target is already present, under what names, and with what guarantees?", and an Expected-
  reconstruction-output matrix template (again populated mostly with `...?` placeholders).

  **Delivers the "Architecture reconstruction rule," a genuinely valuable, precisely reasoned
  anti-duplication caution directly matching this repository's own actual "Canonical Discovery" obligation
  (ES-005.4: search before modelling, never create a second)**: "never introduce a target component merely
  because its conceptual counterpart has not yet been found. First determine whether it exists under
  another name. This is particularly important for KnowledgeOS because the platform has evolved
  incrementally."

  Delivers Step 132's verdict: "the architecture reconstruction has now formally switched from Design Mode
  to Evidence Mode" (`Current→Evidence→Assessment→Delta→Target`) — a verdict this analysis flags as itself
  another architecture-mode DECLARATION rather than a fulfilled transition, since no actual evidence
  gathering occurs within this file.

  **Closes by opening "Step 133 — Repository/Artifact Archaeology,"** promising "the first concrete
  archaeology pass" via an explicit ten-item ordered sequence (Repository topology, `.claude/`, `.codex/`,
  `AGENTS.md`, Knowledge/registry structures, Governance artifacts, Hooks, Deterministic assurance,
  Session/evidence logging, Application/domain boundaries), each item to be classified
  `FACT|DERIVED|HYPOTHESIS|TARGET` and mapped onto `Governance, Knowledge, Evidence, Assurance, Agent,
  Integration, Infrastructure` — explicitly and directly stated: "**this is where the next pass should
  become repository-specific rather than conceptual.**" No actual code execution, repository inspection, or
  verified filesystem/architecture claim reported anywhere in this file — every matrix, ladder, and worked
  example remains a hypothetical methodological specification, and the file's own self-referential
  inventory claims about the existing KnowledgeOS/EKS ecosystem (§132.3) are asserted, not evidenced, within
  this file.
