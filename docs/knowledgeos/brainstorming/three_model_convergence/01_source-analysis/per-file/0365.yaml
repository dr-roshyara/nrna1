about: >
  Intra-file self-duplicated (lines 1-604 byte-identical to lines 606-1209, separated by a bare "# what is
  the next problem?" marker -- the SIXTH instance of the pattern first seen at 0267, repeated at
  0343/0354/0360/0362). Content generalizes 0362-0364's observation-centric extraction pipeline to a full
  multi-source information model: I_<=t = {observations, documents, text, images, databases, logs,
  measurements, AI outputs, human testimony, ...} -- "everything available to the epistemic system up to
  time t," explicitly not merely statistical inference from sensor observations. Restates Information !=
  Knowledge, and formalizes I_<=t -[Knowledge Extraction]-> K_t with imperfection K-hat_t != K_t in
  general. Consolidates a clean three-level distinction R_t (reality/phenomenon) != I_<=t (available
  information) != K-hat_t (extracted Knowledge), called "one of the most important conclusions we have
  reached." Explains WHY extraction can never be exact: information sources are partial projections of
  reality (worked example: sensor/database/document/photograph/human-observation/measurement/log/AI-
  interpretation, each capturing some aspect), and even union of all sources does not guarantee
  I_1 union ... union I_n = R (due to unobserved aspects, hidden variables, measurement errors, missing
  context, ambiguous language, incomplete documents, conflicting sources, unknown relationships, future
  information) -- formalized as "More information does NOT imply complete Knowledge." Reformulates
  P(K_t|I_<=t) as strictly "epistemic uncertainty in extraction," not "Knowledge is probability." Extends
  the multi-source model to an explicit conflicting-sources worked example (I1:A, I2:not-A, I3:A-at-t1,
  I4:A-changed-at-t2), arguing the extraction process must not arbitrarily choose one source but must
  understand source/time/context/reliability/relationships/provenance/contradictions -- explicitly
  connecting this to "our earlier research about context, provenance, identity, authority and temporal
  history." Introduces the pivotal Knowledge-extraction-vs-Knowledge-storage distinction: extraction may be
  probabilistic/AI-based/logical/statistical/human-assisted, but the Kernel may need to preserve the
  evidence and history from which extraction can be RECONSTRUCTED, not merely the conclusion (worked
  example: storing "Nexus runs version 3.69" alone loses how that conclusion was reached) -- explicitly
  flagged as "a very strong argument for provenance and temporal history, but we still need to prove which
  parts are actually indispensable." Refines the "try our best" principle into a precise, falsifiable
  research statement: K-hat_t = Extract(I_<=t, R_t), where R_t is the applicable extraction/evaluation
  regime, with K-hat_t2 != K-hat_t1 not automatically meaning the earlier state was "wrong" (it may simply
  reflect I_<=t2 properly-contains I_<=t1). Poses the sharpened research question "what properties must the
  extraction function satisfy?" and proposes SIX candidate properties to investigate: Reproducibility
  (Extract(I,R)=Extract(I,R)); Monotonicity (I1 subset-of I2 => K(I1) subset-of K(I2)), EXPLICITLY FLAGGED
  AS POSSIBLY FALSE because new information can invalidate prior conclusions; Revision (contradictory
  evidence can produce K2 != K1); Provenance (every extracted element traceable to its supporting
  information sources, k_i -> {I1,I7,I12}); Temporal validity (Valid(k,t1) != Valid(k,t2)); and Uncertainty
  (Confidence(k|I_<=t) may change over time). Closes with a four-stage provisional model (Reality ->
  Information -> Knowledge Extraction -> Observed Knowledge), reaffirming Knowledge-itself-is-not-
  probability, and poses the sharpened Kernel research question as the next major step: "What information
  must the Kernel preserve so that Knowledge extraction can be repeated, challenged, revised, and
  reconstructed?"
introduces:
  - concept: "Multi-source information generalization: I_<=t = {observations, documents, text, images, databases, logs, measurements, AI outputs, human testimony, ...}, explicitly generalizing the corpus's prior observation-centric O_<=t notation to 'everything available to the epistemic system up to time t' -- not merely statistical/sensor inference"
  - concept: "Explicit WHY-extraction-can-never-be-exact argument: information sources are partial projections of reality, and even their union does not guarantee completeness, due to nine named failure modes (unobserved aspects, hidden variables, measurement errors, missing context, ambiguous language, incomplete documents, conflicting sources, unknown relationships, future information) -- 'More information does NOT imply complete Knowledge'"
  - concept: "Knowledge-extraction versus Knowledge-storage as a genuinely distinct Kernel design axis: the extraction PROCESS may use any mechanism (probabilistic/AI/logical/statistical/human-assisted), but the Kernel's obligation may be to preserve the evidence/history from which extraction can be RECONSTRUCTED, not the extraction's output conclusion alone -- worked counterexample: storing 'Nexus runs version 3.69' alone loses the reasoning trail"
  - concept: "Precise, falsifiable reformulation of the 'try our best' principle: K-hat_t = Extract(I_<=t, R_t), where R_t is the applicable extraction/evaluation regime -- K-hat_t2 != K-hat_t1 need not mean K-hat_t1 was wrong, only that I_<=t2 properly-contains I_<=t1"
  - concept: "Six candidate extraction-function properties posed as an open research programme: Reproducibility, Monotonicity (explicitly flagged as LIKELY FALSE -- new information can invalidate prior conclusions, a significant negative research finding), Revision, Provenance (k_i -> {I1,I7,I12} traceability), Temporal validity, and Uncertainty/Confidence-over-time"
  - concept: "Sharpened Kernel research question, replacing all prior formulations: 'What information must the Kernel preserve so that Knowledge extraction can be repeated, challenged, revised, and reconstructed?' -- explicitly framed as the necessary next step before any Kernel-entity design"
