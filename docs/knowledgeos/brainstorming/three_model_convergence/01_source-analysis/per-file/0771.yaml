about: >
  Titled "GN-43 EXTENSION — Mathematical/Statistical/Computational Verification," subtitled "READ / VERIFY
  / FALSIFY — DO NOT REPAIR." Explicitly adds a second, independent verification track (Mathematical/
  Statistical/Computational/Formal-consistency) alongside an already-running "Book-Driven Architecture
  Verification Protocol." States its purpose precisely: NOT to make the mathematics look elegant, but to
  determine whether KnowledgeOS's mathematical claims are well-defined, logically derived, statistically
  justified where applicable, computationally meaningful, algorithmically computable where claimed,
  numerically stable where relevant, consistent with the architecture, and honestly represented in the
  Edition-2 book.

  **§1 Governance Boundary**: strictly a verification task. Extensive MAY list (read/derive/calculate/
  test/simulate/construct counterexamples/run symbolic and numerical checks/implement independent
  reference calculations/compare formulations/inspect executable implementations/classify/report). **An
  even more extensive MUST-NOT list, critically including**: must not modify v0.2, Final Architecture,
  `BA-1…BA-6`, `BA-ED2`, Edition 1, or Edition-2 book chapters; must not repair mathematical definitions in
  place; must not silently replace formulas; must not resolve `OQ-1…12`; must not promote a mathematical
  hypothesis to architecture; must not introduce a new mathematical object as architecture; **must not
  incorporate DeepSeek**; must not create v0.3. "If something is mathematically wrong, report it... DO NOT
  FIX IT." Delivers the required workflow: `DISCOVER→FORMALIZE→CHECK→ATTACK→CLASSIFY→TRACE→REPORT→
  GOVERNANCE DISPOSITION`.

  **§2 Scope**: audits (A) ratified v0.2, (B) Final Architecture, (C) already-produced Edition-2 chapters,
  (D) **Production Findings `PF-1…PF-9`** (one more than the `PF-1..8` (minus PF-4) named at 0769/0770 --
  `PF-9` is introduced explicitly), (E) **Architecture Findings `AF-F-1…AF-F-6`**, a distinct, previously
  unseen finding series, and (F) the underlying source documents justifying those claims.

  **§3 delivers twenty-five required mathematical audit questions** applied to every mathematical object
  or formula (well-defined? domain/codomain defined? variables typed? operators defined? assumptions
  stated? internal consistency? conclusion follows from premises? derivation complete? uniqueness/
  existence/totality established where implied? finite/countable/infinite/unspecified? computable?
  algorithm specified? termination guaranteed? complexity? approximation vs. exact computation confused?
  numerical issues relevant? stochastic assumptions explicit? statistical interpretation legitimate?
  causal claims drawn from correlational/statistical quantities? probability/confidence/support/warrant/
  epistemic-status incorrectly treated as synonyms? metrics actually metrics? operators actually operators
  of the claimed mathematical kind?), with the explicit governing caution: "do not assume that a symbol
  such as 'distance', 'probability', 'measure', 'distribution', 'operator', 'projection', 'kernel', or
  'entropy' has its mathematical textbook meaning merely because that name is used."

  **§4 delivers a ten-item formal object inventory** to be audited at minimum: `EC=η(G,IdealState)`;
  `Zero(K,EC)`; the Zero source representation (nine-valued satisfaction set, per-requirement vector,
  Missing vs. Unknown, source-level `EC_G=(R_G,Γ_G)`); `KnowledgeState K_t` (eight primitives,
  `K_{t+1}=Learn(K_t,Observations_t,Events_t,Policies_t,Outcomes_t)`); the epistemic status system
  (Candidate/Supported/Accepted/Committed, source-level branched alternatives); the Decision Contract
  (six-tuple ratified form, source-level seven-tuple refinement, Hoare-style formulations, admissibility
  conjunctions); the Authorization relation; a governance algebra; the Evidence model (dependency
  structure, corroboration, duplicate invariance, EXP-01 operators/properties); and any metric, distance,
  probability, entropy, KL divergence, integration, measure, distribution, topology, or operator
  formulation appearing anywhere in the existing material.

  **§5-6 (Definition and Derivation Audits)** deliver a required per-object definition table (Object/
  Domain/Codomain/Definition complete?/Variables typed?/Assumptions/Computable?/Evidence) with explicit
  disallowed unsupported claims ("Zero is a function" without domain/codomain/semantics; "EC is total"
  without totality conditions; "K_t is a state" without content/equality specification), and a six-value
  derivation classification (`VALID DERIVATION/VALID BUT INCOMPLETE/RECONSTRUCTABLE/HEURISTIC/INVALID/NOT
  ESTABLISHED`) with the sharp caution: "'intuitively plausible' is NOT a valid mathematical status... a
  derivation may be architecturally useful and still be mathematically unproven."

  **§7-16 deliver ten specialized audit protocols**, each with precise required checks: **Computability**
  (reference algorithm/complexity/approximation-error/non-computable-domain-restriction/NOT ESTABLISHED,
  distinguishing "an LLM can produce a textual answer" from "the formal function is computable with
  specified semantics"); **Statistical** (probability space, random variables, distributions, independence/
  conditional independence, sampling, likelihood, posterior, calibration, confidence-vs-probability,
  support-vs-probability, epistemic-vs-statistical confidence, duplicate/dependent evidence effects,
  base-rate assumptions, aggregation validity -- specifically auditing any
  `P(Proposition)=Support(Proposition)/total support` formulation with "do NOT assume this is a valid
  epistemic probability merely because it produces numbers in [0,1]... if not, classify it as a heuristic
  scoring model rather than probability"); **Metric-Space** (the four metric axioms -- non-negativity,
  identity of indiscernibles, symmetry, triangle inequality -- with the explicit instruction "do not rename
  it to make it pass" if reclassified as dissimilarity/pseudo-metric/directed distance/weighted score);
  **Measure/Integration** (measurable space, sigma algebra, measure, measurable function, integrability,
  explicitly distinguishing "this can be represented as an integral" from "measure theory is required by
  the architecture" -- the latter needing architectural evidence, a direct, precise instance of the exact
  discipline this reconstruction's own governing corpus, `phase_measure_theory/`, was originally named for
  and has tracked since its earliest processed files); **Bayesian** (prior/likelihood/posterior/
  conditioning/independence/update equation/normalization, "pay particular attention to double-counting
  dependent evidence"); **Entropy/KL** ("do NOT automatically interpret entropy='epistemic uncertainty' or
  KL divergence='knowledge gap' without establishing the mapping"); **Topology** (worked example: a claim
  such as `Zero:Ω→∂Ω` requires Ω and ∂Ω to be mathematically defined, else "classify as a mathematical
  analogy/hypothesis, not a formal result"); **Operator** (worked examples `Z:Ω→∂Ω`, `L:Ω→P(Ω)`,
  `S:Ω×∂Ω→G`, `T:Ω→Ω`, checking domains/codomains/closure/deterministic-vs-stochastic/composability/
  existence/uniqueness -- "do not accept notation merely because it is elegant"); **Category-Theoretic/
  Functional-Analysis Claims**: a strict type/definition audit for projections, kernels, functors, Hilbert
  spaces, etc., **explicitly delivering "a kernel must not be confused with a bounded-context or
  architectural kernel"** -- a direct, precise instance of exactly the multi-sense "Kernel" terminology
  collision this reconstruction has tracked as an unresolved notation-proliferation issue across dozens of
  prior primary-corpus files.

  **§16 delivers "EXP-01 Recheck"**: independently reproduce the EXP-01 reasoning rather than merely
  rereading its verdict, comparing an independently-derived result against the historical verdict, with
  the explicit instruction "the historical CSV discrepancy must remain under its **`GN-27`** adjudication"
  -- a previously unseen governance-ruling reference. **Finally explains `PF-4`**, whose absence from the
  named production-findings list at 0769 this reconstruction had flagged as unexplained: "the design
  apparently specifies ten criteria A–J plus Calibration, while the executed matrix contains seven reported
  outcomes and includes a 'Bounded [0,1]' column not obviously matching the designed criteria" -- requiring
  determination of whether the historical experiment is correctly represented, the executed subset
  sufficient for the published conclusion, the negative conclusion follows only from tested properties, and
  whether any stronger claim would be invalid.

  **§17 delivers "Source-vs-Synthesis Mathematics"**: a required `SOURCE FORM→RATIFIED SYNTHESIS→
  EDITION-2 EXPLANATION` traceability chain applied to PF-1/PF-5 (Zero compression), PF-6 (status
  compression), PF-7 (DC six→seven tuple), PF-8 (selector compression), and **`PF-9` (governance
  compression, named here for the first time)**, asking "did the synthesis preserve the mathematical
  properties it relies on? A compression is not automatically wrong. It becomes a formal problem if
  information lost by the compression is required to preserve a claimed invariant, transition, or
  computation."

  **§18-19 deliver "Computational Reference Implementations"** (small independent test implementations,
  explicitly "TESTING TOOLS ONLY," never written into the KnowledgeOS repository unless separately
  authorized) and **"Counterexample Search"** (an extensive required edge-case list: empty set, singleton,
  duplicate evidence, contradictory evidence, dependent evidence, missing values, conflicting statuses,
  zero probabilities, infinite/unbounded cases, malformed inputs, policy changes, ambiguous propositions,
  multiple equally valid decisions), with the precise caution "a single counterexample does not necessarily
  invalidate the architecture, but it does invalidate the universal claim under the tested assumptions.
  Record scope precisely."

  **§20 delivers "Architectural Alignment,"** an eight-value classification that must never be collapsed:
  `MATHEMATICALLY CORRECT+ARCHITECTURALLY ALIGNED / +ARCHITECTURALLY ONLY INTERPRETIVE /
  MATHEMATICALLY INCOMPLETE / MATHEMATICALLY INVALID / COMPUTATIONALLY UNREALIZED / COMPUTATIONALLY
  POSSIBLE BUT UNSPECIFIED / ARCHITECTURALLY UNAUTHORIZED / NOT ESTABLISHED`, with the explicit examples
  "a formula may be mathematically valid but not part of the architecture," "an architectural object may be
  well-defined conceptually but have no computable realization," "a computation may work but compute a
  different quantity than the formula claims."

  **§21 delivers "Special Audit of the Book"**: scans completed Edition-2 Part III chapters for specific
  epistemically-loaded phrases (`"therefore," "hence," "must," "is equivalent to," "can be computed," "is a
  metric," "is a probability," "is Bayesian," "proves," "guarantees," "optimal," "minimal," "complete,"
  "unique"`) to determine "whether the source actually supports the strength of the statement. Flag
  epistemic inflation" -- a genuinely valuable, directly applicable prose-auditing technique.

  **§22 delivers the required deliverable and its twenty-six-section report structure** (Executive
  Summary through Recommended Governance Actions), to be written to
  `analysis/mathematical-verification-report.md` (plus, if needed, small reproducibility test artifacts
  under `analysis/mathematical-tests/`) -- confirmed via this reconstruction's own earlier directory
  listing of `docs/knowledgeos/reviews/synthesis/` (0756) that an `analysis/` directory exists in that
  confirmed synthesis output location.

  **§23 delivers a five-tier severity taxonomy** (`CRITICAL/HIGH/MEDIUM/LOW/OBSERVATION`, each precisely
  defined). **§24 delivers "NO SILENT REPAIR," explicitly flagged "the most important rule"**: any
  discovered error (incorrect equation, invalid derivation, invalid metric, invalid probability
  interpretation, impossible computation, wrong codomain, hidden assumption, counterexample, statistical
  error) must never be corrected in place, only reported through a strict eight-field template (WHAT IS
  WRONG / WHY / COUNTEREXAMPLE-CALCULATION / SOURCE / AFFECTED ARCHITECTURE / AFFECTED BOOK CHAPTER /
  SEVERITY / POSSIBLE REPAIR [explicitly optional and "clearly non-authoritative"]).

  **§25 delivers the required final verdict vocabulary**, fifteen precisely defined terms spanning
  mathematical soundness, computability, statistical validity, and architectural alignment -- with the
  explicit, absolute instruction: **"never use 'validated'."** **§26 delivers the final stop condition**:
  after the audit, STOP -- explicitly forbidding rewriting chapters, modifying formulas or architecture,
  resolving OQs, incorporating DeepSeek, creating v0.3, or approving any mathematical theory. **Closes
  with the file's capstone epistemic-dimension separation**: "the final report must make a clear
  distinction between mathematical correctness, mathematical completeness, computational possibility,
  computational realization, statistical validity, architectural authorization, and book-level explanation"
  -- seven genuinely distinct dimensions that must never be collapsed into one another, arguably the
  single most rigorous, precisely articulated epistemic-discipline capstone anywhere in this entire
  reconstruction. No actual code execution, repository inspection, or independently-verified filesystem
  claim is made by THIS reconstruction regarding whether this audit was ever actually carried out or what
  it found -- the protocol itself is recorded faithfully as a governance instruction, not as an executed
  audit.
