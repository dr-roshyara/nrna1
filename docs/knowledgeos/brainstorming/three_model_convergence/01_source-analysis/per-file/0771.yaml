defines:
  - concept: "'A kernel must not be confused with a bounded-context or architectural kernel'"
    definition: "The term 'kernel' carries at least two entirely distinct senses in this project's own vocabulary -- a precise mathematical/category-theoretic object (e.g. the kernel of a linear map, satisfying specific formal properties) and an architectural/DDD term of art (e.g. a shared kernel bounded context, or the 'KnowledgeOS Kernel' as a named architectural component) -- and a formal mathematical audit must never let the architectural usage silently satisfy or substitute for the mathematical usage's required properties, or vice versa"
  - concept: "The 'measure theory is represented vs. required' distinction"
    definition: "Observing that some quantity or aggregation in the architecture CAN be expressed using measure-theoretic notation (an integral, a measure) does not by itself establish that measure theory is architecturally REQUIRED -- the latter, stronger claim needs its own independent architectural evidence and must not be assumed merely because a representation happens to exist"
  - concept: "NO SILENT REPAIR"
    definition: "During a verification/audit task, discovering that a mathematical claim, derivation, definition, or computation is wrong, incomplete, or invalid must never lead directly to fixing it in place -- the finding must instead be reported through a structured template naming exactly what is wrong, why, the counterexample or calculation demonstrating it, its source, what architecture and book content it affects, its severity, and only optionally a clearly-labeled non-authoritative suggested repair, leaving the actual repair decision to a separate, later governance act"
