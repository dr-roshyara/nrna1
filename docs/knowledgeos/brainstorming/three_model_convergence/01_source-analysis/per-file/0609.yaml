defines:
  - concept: "Calibration"
    definition: "P(Y=1|p̂=p)=p — among all predictions assigned a given probability p, approximately that fraction should actually occur; a distinct statistical property from Discrimination (the ability to rank high-risk vs. low-risk cases correctly)"
  - concept: "Four drift sub-types"
    definition: "Data drift (P_t(X)≠P_{t+1}(X)) / Concept drift (P_t(Y|X)≠P_{t+1}(Y|X), more serious) / Label drift (P_t(Y)≠P_{t+1}(Y)) / Semantic drift (Meaning_t(X)≠Meaning_{t+1}(X), especially important for KnowledgeOS) — four genuinely distinct causes of degraded model/knowledge validity over time"
  - concept: "NoDetectedDrift≠NoDrift"
    definition: "A drift-detection mechanism reporting no change only establishes that no change was detected by the AVAILABLE detectors — it can never be strengthened into a claim that no drift actually occurred, since the observation mechanism may itself be blind to the relevant change"
  - concept: "Falsifier(H)"
    definition: "The formal specification of what observation or evidence, if obtained, would establish that hypothesis H is false — a design requirement encouraging assertions to be stated precisely enough to admit empirical refutation, rather than vaguely enough to escape it"
