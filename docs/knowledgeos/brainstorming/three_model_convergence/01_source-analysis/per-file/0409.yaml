  primary: g1
  secondary: c1
  secondary_note: "sustained engagement with Upanishadic material (Para/Apara Vidya, the Chariot analogy, Tripuṭī, Sat/Mithya/Asat, states of consciousness) mapped rigorously onto the corpus's own formal apparatus"
