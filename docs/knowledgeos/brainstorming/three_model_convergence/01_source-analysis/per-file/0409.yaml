  - concept: "Mode-of-knowing vs dimension-count distinction (Para/Apara Vidya lens): a knowledge space can contain fundamentally different MODES of knowing (phenomena vs. substrate/principle), explicitly 'not simply another dimension... a change in what kind of thing is being known' -- a new candidate orthogonal axis distinct from dimension-count and Zero-A/Zero-B value/dimension uncertainty"
  - concept: "Chariot-analogy-derived architectural pipeline (Observed world -> Observation -> Organization -> Discrimination -> Knowledge representation) and the principle Representation-of-knowledge != condition-of-knowing"
  - concept: "NEW Trustee/governance lens: Knowledge is a trust, not a possession; the knower is a trustee, not an owner; Knowledge -> entrusted -> used -> attributed -> accounted-for, in place of Knowledge -> stored -> owned; principle: a knowledge-bearing system should be accountable for what it represents without claiming ontological ownership of the knowledge itself"
  - concept: "Application of Sat/Mithya/Asat reification test directly to the corpus's own 'knowledge element' concept (e in K_t), reframing it as a possible Evidence->Interpretation->Claim->Qualification->Representation chain, independently corroborating the corpus's existing Kernel!=Aggregate/Aggregate!=Bounded-Context/Assessment!=State/Event!=Relationship/Admission!=Interpretation non-collapse discipline"
  - concept: "Edge-level Zero extension: Zero applies not only to nodes (e not-in K) but to relations/edges r(e_i,e_j), which may be known/unknown/not-assessed/unresolved/absent/not-represented -- previously unarticulated at the relation level"
  - concept: "Seven new explicit Zero non-collapse pairs (UNREPRESENTED!=NONEXISTENT, UNDISCOVERED!=ABSENT, UNCONCEPTUALIZED!=IMPOSSIBLE, UNMODELED!=IRRELEVANT, UNOBSERVED!=UNREAL, REPRESENTATION!=REALITY, MORE-OBSERVATIONS!=MORE-COMPLETE-KNOWLEDGE), plus 'Unknown dimension != unknown value of a known dimension' -- independently reconfirming 0405's Zero-A/Zero-B distinction from a second, distinct source engagement"
