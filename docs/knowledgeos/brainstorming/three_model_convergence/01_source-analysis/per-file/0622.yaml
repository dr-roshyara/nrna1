defines:
  - concept: "Sufficient(K,d)"
    definition: "A decision-specific predicate over available knowledge K and decision d, distinct from truth or certainty; satisfying it for one decision carries no implication for any other decision"
  - concept: "𝕃_3={T,F,U} for knowledge sufficiency"
    definition: "A three-valued epistemic logic in which Unknown is a first-class truth value with its own conjunction/disjunction behavior, never silently collapsed into True or False"
  - concept: "MinimalSufficientSet(d) as NP-hard Set Cover"
    definition: "The problem of selecting a minimum-cost evidence set that jointly covers all of a decision's requirements is formally equivalent to Minimum Set Cover, an NP-hard problem, addressed in practice via greedy approximation rather than exact optimization"
  - concept: "Human-in-the-loop≠Independent human validation"
    definition: "A human reviewer merely reading and agreeing with an AI's output, without independently examining the underlying source evidence, does not constitute an independent assurance path; genuine independent human validation requires direct examination of source evidence"
  - concept: "Policy is not mathematics"
    definition: "Mathematics evaluates whether a governance-defined decision policy's requirements are satisfied by available knowledge; it does not determine what those requirements should be, preserving the DDD boundary between governance ownership and epistemic evaluation"
