about: >
  Directly continues 0821, opening "we now reach a boundary that is even more fundamental than time...
  what exactly are we talking about? If the identity of the subject is unstable, then even perfect
  temporal and epistemic lineage can become meaningless," boxed: **`Identity≠Name≠State≠Representation`**.

  **§195.1-195.3 delivers the three foundational separations**: `StateChange⇏IdentityChange` (a Nexus
  version change from 3.69 to 3.70 does not change the underlying entity's identity, "basic DDD thinking");
  `Name≠Identity` (a system renamed from one hostname to another may remain the same entity, "name is an
  attribute of an identity, not necessarily the identity itself"); `Representation≠Identity` (the same
  entity `x` appears differently across CMDB, DNS, monitoring, firewall rules, KnowledgeOS, Git, Jira, and
  documentation -- `r_i≠x`, and `Representation→Entity` is "a mapping that itself requires evidence").

  **§195.4-195.7 delivers the identity problem worked concretely**: given six differently-named
  representations of what may be one Nexus system, "we cannot determine that merely from names. We need an
  identity model." Delivers **`RefersTo(R_i,x)` as itself carrying an epistemic status** (e.g. `Confirmed`
  for a CMDB entry versus merely `Likely` for a DNS entry), crystallized: **"relationship claims are
  themselves knowledge claims"** -- directly extending the arc's established knowledge-claim discipline
  into the identity domain. Delivers **identity as itself epistemic**: `SameEntity(x_1,x_2)` is an
  inference requiring evidence, never a given, and `Similarity(x,y)⇏Identity` (two systems can share
  software, configuration, purpose, and hostname pattern without being the same entity).

  **§195.8-195.13 delivers the migration example and its DDD resolution**: "is `Nexus_B` the same system as
  `Nexus_A`?" has "no universally correct answer. It depends on the domain identity semantics" -- the
  domain may define the migrated service as the same logical service (`Identity(Nexus_A)=Identity(Nexus_B)`)
  or as genuinely distinct instances (`Nexus_A≠Nexus_B`), "both can be correct depending on the bounded
  context." Delivers **identity as context-dependent**, boxed: **`Identity_{BC_1}(x)≠Identity_{BC_2}(x)`**,
  worked through three concrete contexts (Infrastructure BC: a VM has one identity; Application BC: the
  Nexus service has another; Business BC: "Artifact Repository Service" may have yet another), connected by
  explicit typed relations `Represents(x_I,x_A)` and `Hosts(x_I,x_A)` rather than pretending all three are
  one object -- "the question is not 'what is the one true identity?' The question is: identity according
  to which domain model?" Delivers **the formal identity function** `I_C(x)` and equivalence relation
  `x≡_C y` under a bounded context `C`'s identity rules.

  **§195.14-195.16 delivers the formal equivalence-relation requirements** (reflexivity, symmetry,
  transitivity), worked through a contradiction scenario (`A≡B, B≡C, A≢C` as an identity consistency
  violation), crystallized as **`I48`: identity equivalence must be transitive within a defined identity
  context**, "a mathematically clean invariant."

  **§195.17-195.21 delivers identity/lifecycle/continuity/similarity as four genuinely distinct
  concepts**: `LifecycleState(x,t)≠Identity(x)` (Created→Active→Suspended→Retired does not change identity);
  `SameIdentity(x,y)≠Replaces(y,x)` (a retired system's successor does not automatically share its
  identity); **`Continuity(x,y)` formalized as broader than identity** (operational continuity
  `Continuity(x,y)=True` can hold while `Identity(x)≠Identity(y)`); and a clear ordering diagram showing
  Similarity as evidence feeding both Identity and Continuity assessments, "they should not collapse."

  **§195.22-195.24 re-invokes the Chapter 2 lens**: "change does not necessarily destroy identity," and
  **revisits the Chapter 4 lens with a sharper conclusion**: since a current representation may lack
  sufficient information to reconstruct an earlier state, lineage (not merely current identity) is what
  actually carries continuity, boxed: **"continuity requires lineage, not merely current identity."**
  Delivers **identity and lineage as orthogonal dimensions**, worked through three cases (same identity
  across states; different identity with a continuity relation; different identity with no continuity at
  all).

  **§195.25-195.27 delivers identity itself as temporal**: `IdentityAssignment(x,t)` (a hostname can refer
  to different entities across time due to reassignment), and **explicitly names "name reuse" as "a
  classic source of historical corruption"**: reusing the name "nexus" for a different entity `y` in 2026
  after it referred to `x` in 2025 must never be silently merged by a naive knowledge system, boxed:
  **`NameReuse must not imply IdentityContinuity`**, crystallized as **`I49`: a reused name, identifier,
  address, or representation must not by itself establish identity continuity**.

  **§195.28-195.30 delivers immutable identity versus mutable attributes** (`ID(x)=constant` while
  `Name, Location, Version, Configuration, Owner` vary) and **`TechnicalIdentity≠DomainIdentity`**: a
  database UUID is not automatically a domain identity -- a deleted-and-recreated record's new UUID may or
  may not represent the same business entity to the domain, "the correct question is: what makes this
  entity the same entity in the domain? Not the database schema."

  **§195.31-195.35 delivers identity reconciliation as a full epistemic process**: an identity assertion
  `A_id: x≡_C y` carrying its own `Evidence(A_id)` (migration record, certificate, system registry,
  configuration, ownership, or explicit architectural decision), and **`P(x=y|E)` explicitly not
  metaphysical equality** -- "an epistemic assessment," not objective truth. Delivers **deterministic
  versus probabilistic identity** (a passport number under explicit authority can uniquely identify a
  person; other domains remain probabilistic), and **the identity resolution pipeline**, boxed:
  **`Representation→CandidateMatch→Evidence→IdentityAssessment→IdentityDetermination`**, explicitly noted
  as "structurally identical to the epistemic pipeline we derived earlier... a strong sign of architectural
  coherence." Delivers **AI identity claims properly bounded**: an AI's "these two repositories are the
  same system" must initially be a `CandidateIdentityClaim`, never an immediate silent merge -- "safer than
  allowing AI entity resolution to silently merge records."

  **§195.36-195.39 delivers "identity merge is a high-impact transition,"** boxed:
  **`Risk(identityMerge)>Risk(attributeUpdate)`**, because a wrong merge can contaminate `History, Evidence,
  Decisions, Ownership, Compliance, Causality` -- "it can effectively rewrite the meaning of the knowledge
  graph." Crystallized as **`I50`: identity merge, split, and reassignment must be explicitly represented
  and lineage-preserving**, explicitly flagged as "likely a constitutional-level rule." Delivers **the
  non-destructive identity-split pattern**: when `x` is discovered to have actually represented two
  distinct entities `y,z`, the architecture must never simply edit `x` in place, but represent
  `x→[resolvedAs]→{y,z}` while historical records referring to `x` remain historically valid.

  **§195.40-195.44 delivers a dedicated identity graph** `G_I=(V,E_I)` with typed edges (`sameAs, replaces,
  represents, hosts, derivedFrom, renamedTo`), its coupling with the temporal graph (`NameAssignment(nexus,
  x,[t_0,t_1])` then `NameAssignment(nexus,y,[t_1,t_2])`) and with the causal graph
  (`DecisionToReplace(x,y)→ReplacementAction`, explicitly noting replacement itself does not establish
  `sameAs`). **Delivers the file's central consolidating discovery**: five graphs now interact
  (`G_I` Identity, `G_T` Temporal, `G_E` Epistemic, `G_C` Causal, `G_G` Governance), crystallized: "KnowledgeOS
  is increasingly looking like a federation of semantic graphs over a common lineage model, rather than one
  undifferentiated graph" -- paired with an explicit anti-over-engineering caveat: "this does not mean
  'build five graph databases.' The graphs are conceptual models... DDD determines boundaries first.
  Technology comes later."

  **§195.45-195.46 delivers identity's relationship to aggregate boundaries**: an aggregate root must have
  a domain identity, but "an aggregate should not automatically contain every representation of the same
  real-world thing," boxed: **`DomainEntityIdentity≠AggregateBoundary`** -- "identity does not dictate
  transaction boundary," "an important DDD safeguard."

  **§195.47-195.50 delivers a substantial refinement of 0819's epistemic tuple**: a proposition must
  explicitly identify its subject, boxed: **`Proposition=Subject+Predicate+Object+Context+Time`** (at
  minimum), so that `p="Version=3.70"` becomes `p=(x,Version,3.70,C,T)`, preserving the ability to track
  subject identity even after `x` is later replaced by `y`. **Revisits the Chapter 4 insight once more**:
  if a new state lacks its historical identity/lineage context, a current observer cannot determine why
  the current state exists, requiring `CurrentState+HistoricalLineage` rather than current state alone.

  **§195.51-195.52 delivers the continuity equation**, boxed:
  **`Continuity(x,y)=f(IdentityRelation,TransitionLineage,DomainRules,Evidence)`**, explicitly not simply
  `x=y`. Delivers **the three genuinely distinct questions**, each separately boxed: **Identity** ("is it
  the same entity?"), **Continuity** ("does the history of one connect meaningfully to the other?"),
  **Similarity** ("how much does it resemble the other?") -- "these three questions may produce three
  different answers."

  **§195.53-195.54 delivers the Step 195 invariant set** (I48-I50 restated) plus a new fourth invariant,
  boxed: **`I51`: domain identity must be defined by domain semantics, not inferred solely from technical
  representation**. **Delivers the Step 195 verdict**: the architecture survives and becomes more precise,
  boxed the forward chain **`Identity→Continuity→Lineage→State→Evidence→Knowledge→Decision→Action`** and
  the reverse observation chain **`Reality→Observation→Representation→IdentityAssessment→Knowledge`** --
  "the architecture therefore cannot safely be a simple CRUD model of 'things and their current status.'
  It needs identity-aware, temporally versioned, provenance-preserving transitions."

  **Closes opening "Step 196 — the next boundary: authority,"** listing the seven concepts already
  established (Truth, Evidence, Knowledge, Causality, Identity, Time, Decision) and posing the remaining
  question: "who is allowed to assert, determine, change, or invalidate a state? ... this is not merely
  authentication. It is epistemic and domain authority," worked through a three-tier example (AI may
  propose; Engineer may verify; Architecture Board may determine), boxed: **`Authority≠Identity≠Role≠
  Permission≠Responsibility`**, explicitly proposing to "test whether our architecture can prevent an
  actor from acquiring epistemic authority merely because it has technical access." No actual repository
  implementation occurs within this file itself; every relation, tuple, and graph remains a conceptual
  specification pending Step 196's authority-boundary test.
