defines:
  - concept: "Identity vs. Continuity vs. Similarity"
    definition: "Three genuinely distinct questions that must not be collapsed: Identity asks 'is it the same entity?' (a strict equivalence relation within a bounded context); Continuity asks 'does the history of one meaningfully connect to the other?' (a broader historical relation that can hold between genuinely distinct identities, e.g. an old system replaced by a new one); Similarity asks 'how much does it resemble the other?' (a resemblance measure that may provide evidence for either Identity or Continuity claims but establishes neither by itself) -- these three questions can and often do produce three different answers for the same pair of entities"
  - concept: "'Identity merge is a high-impact transition'"
    definition: "Accepting that two previously-distinct representations x and y refer to the same entity (x≡y) and merging their associated knowledge histories carries substantially higher risk than an ordinary attribute update, because a wrong identity merge can contaminate history, evidence, decisions, ownership, compliance, and causality all at once -- effectively rewriting the meaning of the knowledge graph rather than merely correcting one field -- so identity merge, split, and reassignment must be treated as explicitly governed, lineage-preserving transitions rather than an ordinary data-cleanup operation"
  - concept: "The federation of semantic graphs"
    definition: "Rather than one undifferentiated knowledge graph, the architecture requires (at least) five distinct, interacting semantic graph structures -- Identity (what refers to what), Temporal (when things were valid/observed/known/decided/executed), Epistemic (what evidence supports what claim), Causal (what actually influenced what), and Governance (who is authorized to decide what) -- each with its own typed edges and semantics, conceptually distinct even though they interact and may share underlying implementation technology; this is explicitly a DDD/conceptual-modeling conclusion, not a mandate to build five separate graph databases"
refines:
  - concept: "0821's closing proposal of the identity boundary test (Identity≠Name≠State≠Representation) and its Nexus-after-migration continuity question"
    refinement: "DELIVERED IN FULL: the three foundational separations, the context-dependent identity function and equivalence relation, the identity resolution pipeline, and the Step 195 verdict directly resolving the migration question (both Identity(Nexus_A)=Identity(Nexus_B) and Nexus_A≠Nexus_B can be correct, depending on the bounded context's identity semantics)"
  - concept: "0819's epistemic tuple K=(P,E,M,A,C,T,S,W) and its proposition object"
    refinement: "Substantially refined by decomposing the proposition itself into Subject+Predicate+Object+Context+Time, explicitly named 'a substantial refinement of Step 192' -- ensuring propositions remain trackable across subject-identity changes, a gap the earlier tuple had left implicit"
  - concept: "0813's/0819's/0821's recurring multilayer-graph discoveries (evidence/semantic/temporal/governance/causal graphs)"
    refinement: "Extended with a fifth graph, the Identity graph G_I, crystallized into the consolidating capstone description 'a federation of semantic graphs over a common lineage model,' the arc's most complete graph-taxonomy statement to date"
  - concept: "0793's/0806's/0821's evidence-independence and 'relationship claims are themselves knowledge claims' family"
    refinement: "Directly extended into the identity domain: RefersTo(R_i,x) itself carries an epistemic status (Confirmed vs. Likely), demonstrating the family's principle applies even to the foundational question of what a representation refers to, not only to substantive domain claims"
  - concept: "0808's I1-I14 through 0821's I45-I47 invariant series"
    refinement: "DIRECTLY EXTENDED as I48-I51, an eleventh consecutive instance of correct invariant-series continuity spanning 0808 through 0822"
