    refinement: "Entitlement and Knowledge moved OUT of core preservation into 'derived epistemic machinery,' since their status depends on the reasoning regime; core preservation narrowed to Content/Input/History/Participant/Context/Commitment-Assessment/Relations/Transition/Provenance"
