    refinement: "Independently and formally grounded via ASP/P-log semantics into three distinct mechanisms (unresolved alternatives / unawareness-non-representation / blocked default), explicitly said to strengthen rather than replace the taxonomy, exact reconciliation left open"
  - concept: "0320's Williamson-derived factive/non-reductionist account of knowledge"
    refinement: "Explicitly kept as the philosophical layer while adding an operational computational layer -- 'may preserve computationally representable epistemic states without claiming those states exhaust the philosophical nature of knowledge'"
  - concept: "The corpus's snapshot/projection formula lineage (S_t, S_t^A, K_t^A, 0288's S_t=Project(...), 0321's K_t^A=(P,C,E,I,N,R))"
