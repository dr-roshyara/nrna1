about: >
  Tests Golog (complex actions via the Do macro over a basic action theory) and RGolog (interrupts as
  prioritized condition-action rules) against KnowledgeOS.

  **DELIVERS THE PRECISE UNREACHABILITY VERDICT**: "[NEG] P9 REFUTED as stated. Golog's semantics is
  defined relative to a basic action theory -- SSA+preconditions+unique-names+S_0. KnowledgeOS has none
  of these, and 04 shows the SSA is blocked behind Contr and DECISION-02. Golog is not 'not useful'. It
  is UNREACHABLE from the current state, and the distance is measurable: it needs δ, which needs Contr,
  which needs the evaluation representation, which needs ℛ_req." This delivers a precise four-link
  dependency chain (δ←Contr←evaluation-representation←ℛ_req) quantifying exactly how far Golog is from
  being adoptable, distinct from simply saying it is inapplicable.

  **DELIVERS THE EXPLICIT COMPARISON WITH KR-COMP (KNOWLEDGEOS'S OWN COMPOSITION EXPERIMENT)**: Reiter/
  Golog composes actions within a history, load-bearing parameter the action theory, result "composition
  is definable given a theory"; KR-COMP composes "evidence within and across frames," load-bearing
  parameter "the frame qualifier φ⊇{time,context}," result "the criteria select a FRAME QUALIFIER, not a
  rule." Explicitly: "these are not competing answers to one question. They are answers to different
  questions, and conflating them would import a sequencing model where the corpus has an evidential one.
  KnowledgeOS-DERIVED; Reiter neither corroborates nor challenges it."

  **DELIVERS THE RGOLOG VERDICT**: "interrupts-with-priority is a recognizable shape for governance
  triggers. No corpus evidence bears on it. RESEARCH ONLY."
