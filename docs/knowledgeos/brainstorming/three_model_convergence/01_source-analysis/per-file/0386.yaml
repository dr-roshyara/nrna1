  - concept: "Three-fact decomposition demonstrating Fact 3 (Determination) cannot be derived from Fact 1 (Observation) alone -- it requires Fact 2 (a predetermined reference/ideal state) -- the corpus's clearest, most concrete illustration to date of why observation alone cannot produce a comparative/evaluative determination"
  - concept: "Old(x) formalized as an explicitly RELATIONAL, not intrinsic, property: Old(2.69) iff 2.69<ReferenceVersion_t, demonstrated via a worked counterfactual showing the same observed value can be 'old' or 'not old' purely depending on which reference is in force"
  - concept: "THE IDEAL STATE ITSELF IS KNOWLEDGE -- a concrete, partial answer to 0383's 'Where does the Ideal State come from?': the reference state (e.g. '3.85 is the required version') is itself established via its own prior determination chain (Vendor releases 3.85 -> observed -> Evidence -> Determination -> reference state), revealing a genuinely RECURSIVE KnowledgeOS structure (Knowledge -> Reference State -> Comparison -> New Knowledge)"
  - concept: "Explicit correction to 0383's 'Ideal State -> Observation -> Probability -> Knowledge' pipeline as incomplete, replaced with 'Reference/Ideal Knowledge + Observed State + Comparison Rules -> New Determination,' with probability entering when EITHER the observed OR the reference state is uncertain -- a genuine dual-source extension beyond every prior single-source (observation-only) probability formulation in the corpus"
  - concept: "Knowledge statements reframed as RELATIONSHIPS between states rather than standalone facts (worked examples: 2.69<3.85; CurrentArchitecture!=RequiredArchitecture; ObservedState-does-not-model-RequiredState), proposing a Reference-State<->Observed-State comparison loop as KnowledgeOS's fundamental unit rather than independent fact lists"
  - concept: "Ideal State re-scoped from 'omniscient description of reality' to 'the reference state against which a particular domain question is evaluated,' demonstrated across five distinct domains (Nexus, election, software architecture, governance, business process) -- generalizing the concept beyond the single technical worked example"
  - concept: "New Descriptive-ideal versus Normative-ideal distinction: TWO KINDS of ideal state that can coexist for the same object (I_t^descriptive = current vendor version; I_t^normative = the required version), explicitly 'different,' with KnowledgeOS needing to understand BOTH -- directly extending 0383's six-candidate-source enumeration by showing two of those sources (reality-given, rules-given) can operate SIMULTANEOUSLY rather than as mutually exclusive alternatives, and connecting to 0366's Epistemic-vs-Normative dichotomy at the reference-state level"
  - concept: "Sharpened research question superseding 0383's framing: 'What is the nature of the reference/ideal state against which observations are compared, and how is that reference state itself established?', framed as the key to the full recursive cycle Knowledge->Reference-State->Comparison->New-Knowledge->Updated-Reference-State->..."
