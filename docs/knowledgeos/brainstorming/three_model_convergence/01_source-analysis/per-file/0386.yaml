  - concept: "0366's Epistemic-vs-Normative justification dichotomy (Manifesto/Documentation/Rules/Law hierarchy)"
    refinement: "Extended from the level of justification CHAINS down to the level of the reference/ideal STATE itself: an object can simultaneously have a descriptive ideal (what it currently is, per observation) and a normative ideal (what it should be, per rules), both coexisting rather than being alternative sources"
