about: >
  A second genuinely executable, no-stub Python script (57 lines), whose docstring explicitly states its
  purpose: "Applying the HPA review's mandate -- 'each test specifies its equality relation' -- to D285-6's
  own claim: `(𝒜,ℛ)=π_K(K_t)`. Which equality? The answer changes the strength of the result." **THIS IS A
  DIRECT, REFLEXIVE APPLICATION of file 0981's newly-mandated equality-naming discipline BACK ONTO THE
  AUTHOR'S OWN EARLIER CLAIM** (file 0974's own `t285_reconcile.py`, whose T-B/T-C sections asserted `(𝒜,ℛ)
  =π_K(K_t)` as "the precise reconciliation result" without ever naming which equality relation the claim
  used) -- a genuinely admirable instance of a research programme catching and correcting its own prior
  imprecision using a rule it had only just adopted.

  **§1 tests the claim under STRUCTURAL equality** (same components, same names): computes `π`'s
  non-dropped image set (`{Entity,Observation,Proposition,Relation,State}`) against the literal target
  `(𝒜,ℛ)={Assertion,Relation}`, finding them unequal and concluding **"the claim is FALSE under structural
  equality"** because "'Assertion' is not a ratified primitive at all."

  **§2 tests the claim under SEMANTIC equality** (same content, ignoring packaging): unpacks `Assertion`
  into its constituent fields (`{Proposition,Entity,Observation}`, per its declared structure `(id,P,e,c,t,
  Π)`), finds this unpacked set IS covered by `π`'s image, concluding **"the claim HOLDS under semantic
  equality -- and ONLY after unpacking Assertion."**

  **§3 delivers THE SCRIPT'S GENUINELY NEW CONTRIBUTION: A THIRD, CONCRETE EQUALITY NOTION, "OBSERVATIONAL
  EQUALITY"** (same answers to all mandatory queries), tested against seven named query classes
  (`member,contradicts,supersede,lineage` answerable in `(𝒜,ℛ)`; **`replay,policy-eval,authorize` NOT
  answerable**, since they require Event/Policy/Action which the projection explicitly drops), concluding
  **"FALSE under observational equality. The projection is LOSSY, by design."** -- this is the first time
  this reconstruction has encountered "observational equality" specified with concrete, named query
  classes, giving genuine operational teeth to a concept this reconstruction has previously only seen
  discussed abstractly (the corpus's earlier multi-way equality-notion collision, files 0912, 0934, 0957,
  0959, 0968).

  **THE SCRIPT'S CLOSING SECTION DELIVERS A GENUINE, PRECISE SELF-CORRECTION**: restates the original
  (imprecise) claim "WRONG (as D285-6 originally wrote it): `(𝒜,ℛ)=π_K(K_t)`", replacing it with **"CORRECT:
  `(𝒜,ℛ)=_semantic π_K(K_t)` after unpacking Assertion into its fields, and modulo the declared drop of
  {Event, Policy, Action}"**, explicitly noting the claim is **NOT** true under `=_structural` or
  `=_observational`. Delivers the precise consequence: **"'projection' is the right word only for a LOSSY,
  semantic-level map. D285-6's Outcome B stands -- but it is weaker than an unqualified '=' suggested, and
  the loss is now named: three primitives and three query classes."**

  **THE SCRIPT CLOSES WITH THE MOST GENUINELY SELF-CRITICAL STATEMENT ENCOUNTERED IN THIS ENTIRE
  RECONSTRUCTION'S TRACKING**: **"This is the SAME defect class D285-5 caught in the action/result property:
  a property stated without naming its equality is not a well-formed proposition. D285-5 caught it in
  someone else's property; it was present in my own."** -- an explicit, transparent admission that the
  author's own earlier work (file 0974's T-B/T-C reconciliation result) suffered from exactly the same
  imprecision the disciplined methodology was designed to catch in the Gita-derived hypotheses, and a
  genuine correction of it rather than a defensive dismissal.
