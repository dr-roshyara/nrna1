    definition: "Two representations of a state are observationally equal if and only if they produce identical answers to every mandatory query the KnowledgeOS kernel must be able to answer about that state. This script concretely tests seven such query classes -- member, contradicts, supersede, and lineage (all answerable using only Assertion/Relation content) versus replay, policy-eval, and authorize (all requiring Event, Policy, or Action information that the (A,R) projection explicitly drops) -- and finds the projection FAILS observational equality precisely because three of the seven mandatory query classes cannot be answered from (A,R) alone, confirming the projection is deliberately lossy rather than merely incompletely specified"
