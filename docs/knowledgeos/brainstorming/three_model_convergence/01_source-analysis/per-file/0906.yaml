defines:
  - concept: "Version 1's four closure types (Semantic/Formal/Computational/Governance)"
    definition: "A decomposition of the vague notion of 'closure' into four genuinely independent dimensions that must never be conflated: SemanticClosed(X) means the corpus provides a canonical, stable interpretation of X; FormalClosed(X) means X has a definition, type, defined inputs/outputs, defined relationships, and explicit assumptions (without implying an implementation exists); ComputationalClosed(X) means a formally defined construct has an actual decision procedure or executable implementation given sufficiently specified inputs and rules; GovernanceClosed(X) means the normative authority governing X (who may define/change/authorize it, what constrains that authority, what happens under conflicting authorities) is itself sufficiently defined. A construct can be closed on some dimensions while remaining open on others -- e.g. Policy is judged SemanticClosed and FormallyPartial while remaining ComputationallyConditional and GovernanceOpen"
  - concept: "Version 2's Defined≠Derived≠Demonstrated≠Closed vocabulary"
    definition: "A four-level epistemic-progression vocabulary explicitly designed to correct Version 1's overclaiming: Defined means a formal candidate has been specified (a definition exists); Derived means the candidate follows from corpus evidence or valid mathematical reasoning (stronger than a bare specification, but still not tested); Demonstrated means an actual test or execution has established the claimed property (empirical or computational confirmation); Closed means no unresolved foundational dependency remains for the claim at all (the strongest status, requiring all three prior levels plus resolution of every dependency). The explicit rule is that a construct must never be labelled CLOSED merely because it has reached only the first (Defined) or second (Derived) level -- directly targeting Version 1's practice of declaring K, Σ, Identity, and Equality all 'CLOSED' on the strength of definitions and derivations alone, without the required demonstration and dependency-resolution steps"
refines:
  - concept: "0903's Step 275 finding that Σ=(A,S,R,V,C) was partially refuted by an adversarial audit"
    refinement: "DIRECTLY CONTRADICTED by Version 1 (which reasserts this exact model as canonical and CLOSED without engaging 0903's critique) and INDIRECTLY LEFT UNRESOLVED by Version 2 (which downgrades the epistemic status of the same structure to 'substantially defined' without re-litigating the underlying dimensional-decomposition dispute) -- an open, unreconciled contradiction this reconstruction flags for the eventual §29-gated synthesis"
  - concept: "0904's five-level Defined≠WellTyped≠Decidable≠Executable≠Validated computability distinction"
    refinement: "A further, third, distinct vocabulary variant now exists alongside it: Version 1's four closure types (Semantic/Formal/Computational/Governance) and Version 2's four-level Defined≠Derived≠Demonstrated≠Closed -- none of these three vocabularies (0904's, Version 1's, Version 2's) is stated to be a strict refinement of another, though all three pursue the same underlying goal of separating 'a definition exists' from 'the theory actually satisfies it'"
  - concept: "0902's Deletion Test and the standing Required≠Primitive/Minimality(K|𝒯) discipline"
    refinement: "REAFFIRMED explicitly by Version 2 as still unexecuted: 'minimality requires a counterfactual test... until that experiment has been completed, K_minimal is a hypothesis, not a theorem' -- Version 2 treats the deletion-test methodology as the actual bar for closure, which Version 1 had implicitly bypassed by declaring K closed without citing completed deletion tests"
  - concept: "0904's operation-necessity test for O_core"
    refinement: "EXTENDED by Version 2's operation-typing correction, adding the further requirement that O_core's members be classified into genuinely distinct signature classes (𝒯/𝒬/𝒢/ℛ) before being treated as one homogeneous operation algebra -- a structural refinement beyond mere necessity-testing"
contradicts:
