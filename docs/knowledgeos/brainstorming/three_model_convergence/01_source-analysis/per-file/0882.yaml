defines:
  - concept: "The equality/transition ontology-dependency finding"
    definition: "A conclusive explanation for why this reconstruction has repeatedly found equality and the state-transition function left unresolved throughout the entire mathematical-kernel sub-arc (0857-0881): these are not independently answerable questions that merely await their own dedicated formal definition. Instead, both are strictly DEPENDENT VARIABLES of a still-unresolved prior choice -- what is the actual carrier-set ontology of the knowledge state K? If K is ultimately a set, equality naturally means set equality; if a graph, graph isomorphism; if provenance is constitutive of identity, a provenance-sensitive equivalence; if K is treated observationally, behavioral equivalence. Since the corpus has not yet settled which of these (or another) ontological candidate correctly describes K, any attempt to define equality or the transition function T:K→K in isolation is premature -- fixing K's ontology is a genuine logical PRECONDITION for either question, not merely a missing definition that happens to have been skipped"
  - concept: "The ontological-vs-structural-primitives distinction"
    definition: "A type-theoretic classification separating two categories of things the corpus has historically treated together as 'primitives': ontological primitives are things the theory claims genuinely EXIST as first-class domain objects (candidates: Entity, Observation, Event, Proposition), while structural primitives are mathematical organizing MECHANISMS used to relate or arrange those existing things (candidates: Relation, Identity, Ordering, Time). The file argues these should never be placed into one undifferentiated primitive set, since conflating 'what exists' with 'how what exists is organized' is precisely the kind of category mixing that made the historical eight-element candidate set (mixing Entity/State/Event/Relation/Policy/Action) untenable as a clean kernel"
