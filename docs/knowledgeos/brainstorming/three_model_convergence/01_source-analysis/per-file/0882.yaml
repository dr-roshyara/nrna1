title: "Step 253 -- Primitive-Object and Type-System Audit: THE HISTORICAL EIGHT-ELEMENT PRIMITIVE SET IS SHOWN NOT TO SURVIVE UNCHANGED -- Not Because It Is Mathematically Wrong but Because It Mixes Five Semantic Categories (Ontology+State+Event+Relation+Norm+Execution) Inside One Purported Primitive Set, a TYPE-SYSTEM PROBLEM -- Delivers the Ontological-vs-Structural-Primitives Distinction, the 'Encoding Power Is Not Proof of Ontological Reducibility' Principle, FOUR Candidate Knowledge-Ontology Options (Knowledge as Primitive Object / as Structured Configuration / as a State-Level Interpretation of an Underlying Substrate / as an Opaque Algebraic State), and the Crucial Finding That EQUALITY AND TRANSITION CANNOT BE FINALIZED UNTIL K's ONTOLOGY IS FIXED -- Reframes the Central Question From 'Which Eight Things Form the Kernel?' to 'Which Typed Ontological Objects Are Irreducible, and What Operates Over Them?' -- Opens Step 254's Formal Minimality/Reconstruction Removal Tests"
