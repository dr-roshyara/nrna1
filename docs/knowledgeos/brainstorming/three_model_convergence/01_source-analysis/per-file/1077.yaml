about: >
  `t291_equality.py` — "STEP 291: independent re-verification of 32->30 and the merge/join-semilattice claim
  (mandate §13, §14)." Executable script re-deriving, from scratch, the already-tracked 2240-state
  observational-family enumeration (files 1057-1058, 1068).

  **INDEPENDENTLY REPRODUCES THE 32-DISTINCT/2-DEGENERATE/30-NON-DEGENERATE RESULT (asserts `len(SIG)==2240`,
  measures 32 syntactically distinct axis subsets collapsing to distinct mathematical projections, finds
  exactly 2 degenerate endpoints -- universal and discrete)**, matching the already-tracked file-1068 result
  exactly. **DELIVERS A SMALL BUT GENUINE TERMINOLOGY CORRECTION**: "CORRECT TERMINOLOGY (mandate §13): 32
  mathematically distinct projections; 2 degenerate endpoints; 30 non-degenerate candidates. ==> The
  endpoints are DEGENERATE, not INVALID. The corpus supplies no validity criterion for them, so 'invalid'
  would be my word, not its. EARLIER ARTIFACTS SAID 'NOT A CANDIDATE' -- THAT IS TOO STRONG AND IS CORRECTED
  HERE TO 'DEGENERATE ENDPOINT'." This is a disciplined, precise language-level self-correction applied to
  this reconstruction's own already-tracked characterization (files 1057-1058) of the two excluded endpoints.

  **DELIVERS AN EXECUTED TEST OF WHETHER MERGE IS A JOIN, IN TWO STAGES**: first, confirms `PureClaimSetUnion`
  (plain set union) satisfies commutativity/associativity/idempotence -- "reproduces `060 §§60.39-60.41`"
  (already-tracked scope-restriction, file 1058/1073). Second, and more importantly, **constructs an
  EXECUTABLE minimal supersession-based merge model** (`sup_merge`, later-version-wins per subject) responding
  to `060.42`'s objection that the real merge involves supersession, and finds the three laws "HOLD for this
  minimal supersession model." **CRITICALLY SELF-DIAGNOSES THIS RESULT AS NON-EVIDENTIARY**: "DEGENERACY
  CHECK (mandate §18): is that vacuous? The test space is 3 states over ONE subject with a TOTAL VERSION
  ORDER. A total order makes 'max' a join BY CONSTRUCTION. So the PASS is an ARTIFACT OF THE MODEL'S TOTAL
  ORDER, NOT EVIDENCE about KnowledgeOS's merge. => RECORDED AS NON-EVIDENCE." Explicitly refuses to model
  `060.42`'s further-named obstacles (contradiction, temporal validity, semantic equivalence, probabilistic
  update, policy) since "modelling them would be inventing architecture (mandate §21)" -- a disciplined
  refusal directly consistent with this reconstruction's already-tracked no-invented-hypotheticals discipline
  (file 1066).

  **DELIVERS THE FINAL, EXECUTED-EVIDENCE-BACKED VERDICT ON `(𝕂,merge,∅)`, DIRECTLY CONFIRMING THE ALREADY-
  TRACKED C-7 SPLIT (file 1073)**: "NOT ESTABLISHED. `060 §60.71`: 'Not proven... we cannot yet assert
  KnowledgeOS is a semilattice.' Laws hold for `PureClaimSetUnion` ONLY. NOT REFUTED -- retraction concerns
  state EVOLUTION, a different operation. No lattice is inferred from merge existing. No AGM comparison is
  used." This is the executed-evidence backing for the C-7 correction this reconstruction already tracked
  from file 1073's prose-level analysis.
