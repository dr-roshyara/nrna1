defines:
  - concept: "Governance≠Documents"
    definition: "A governance system is not constituted merely by written policy documents; it requires explicit, operationally checkable representations of Authority, Rule, Scope, Trigger, Decision, Responsibility, Evidence, Exception, and Enforcement — documents are governance artifacts, not executable governance"
  - concept: "PolicyIntent≠PolicyControl"
    definition: "A stated policy that cannot actually be technically enforced (e.g. 'no direct production database modification' while developers hold unrestricted database credentials) remains mere PolicyIntent; it becomes PolicyControl only when backed by an actual enforcement mechanism"
  - concept: "AIInference⇏GovernanceRuleChange"
    definition: "An AI agent's discovery or recommendation of a better governance rule may become a RuleChangeProposal, but the agent can never silently activate the corresponding RuleChange — governance rules change only through their own authorized lifecycle"
  - concept: "Governance drift"
    definition: "The condition where an approved governance rule remains formally active while actual runtime behavior no longer follows it (ApprovedRule⊭Runtime); distinct from architecture/configuration/infrastructure drift (0684/0686/0687, runtime-vs-declared-architecture divergence) and from model/concept drift (0681, data-distribution shift) despite all three sharing 'drift' vocabulary"
  - concept: "KnowledgeOS = Semantic Model + Governance Model"
    definition: "The consolidating architectural identity from Steps 103-104 together: the semantic model (Step 103) answers 'what is this?' (Evidence/Claim/Inference/Decision/Authority/Action distinctions), and the governance model (Step 104) answers 'who may decide or act on it, under which rules?' — together, Meaning + Authority, the foundation required before agents can safely participate in the system"
