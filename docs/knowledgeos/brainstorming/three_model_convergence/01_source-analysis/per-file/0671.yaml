defines:
  - concept: "Mechanism≠Policy"
    definition: "A policy states what is allowed or forbidden as a declarative rule; a mechanism determines how rules, information, incentives, and consequences actually interact to produce enforceable behavior — a policy can exist formally while having zero effective enforceability if no mechanism operationalizes it"
  - concept: "FormalGovernance≠EffectiveGovernance"
    definition: "A governance rule can be formally correct and even show 100% recorded compliance while actual organizational behavior systematically circumvents it through unrecorded or bypassed paths; institutional equilibrium must be evaluated against actual behavior, not merely the existence of correct-looking rules"
  - concept: "DualControl≠GuaranteedIndependence"
    definition: "Requiring two separate approvers for a critical action (dual control) does not guarantee genuine independent oversight if the two approvers have aligned incentives and can simply approve each other's requests (collusion); true independence must be explicitly modeled across organizational, financial, technical, informational, and temporal dimensions, never assumed from formal role separation alone"
  - concept: "Governance Surface (GSurface)"
    definition: "The set of all action paths through which organizational behavior can materially affect a governed outcome; when GSurface_actual (all paths that actually exist) exceeds GSurface_governed (paths the governance mechanism actually covers), a Governance Surface Gap exists — an uncontrolled bypass path that undermines the governed mechanism regardless of how correct that mechanism is on its own covered path"
  - concept: "The feasible-set-first optimization principle (A^feasible={a:I_k(a)=True∀k})"
    definition: "Action selection should always first construct the feasible action set by applying all constitutional, governance, and authority constraints as hard filters, then optimize utility only within that already-constrained feasible set — never maximize utility first and check constraints afterward, since a strategic or careless agent could otherwise select a high-utility but constraint-violating action before the check occurs"
