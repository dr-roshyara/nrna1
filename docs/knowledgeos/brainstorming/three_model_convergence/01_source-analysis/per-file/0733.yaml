defines:
  - concept: "Aggregate boundary test"
    definition: "For any two candidate domain objects, ask whether an invariant would be broken if they were updated independently and inconsistently; if no invariant would break, the two objects belong in separate aggregates rather than one shared consistency boundary"
  - concept: "Aggregate≠Graph"
    definition: "An Aggregate answers 'what must change consistently in one transaction?'; the Assurance Graph answers 'what is related to what?' -- a node's graph relationships (e.g. a Decision governing a Policy, applying to a service, motivated by a Finding) never imply that those related objects must be transactionally contained within the same aggregate"
  - concept: "Action=intent vs. Execution=fact"
    definition: "An Action records what was requested and remains a valid record of that intent regardless of outcome; an Execution records what actually happened when the action was carried out -- the two are deliberately never merged, since a valid, properly authorized Action can still have a failed Execution"
