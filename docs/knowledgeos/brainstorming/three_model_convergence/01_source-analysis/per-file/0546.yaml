tier2_reason: "LANDMARK direct resolution of the corpus's central Evidence-theory closing question (what object is actually being aggregated?), delivering a rigorous seven-domain semantic separation, establishing relational (not scalar) representation as the epistemic foundation, and definitively explaining — rather than merely asserting — why no single universal evidence algebra can exist: some epistemic problems are genuinely probabilistic while others are genuinely argumentative, requiring two complementary mathematical families rather than one hybrid formula. Also delivers a mathematically precise and consequential new distinction (InformationGain≠EvidenceStrength, EvidenceValue≠EvidenceStrength) that reframes Lord's evidence-selection strategy from qualitative to quantifiable, opening a concrete named next research phase (Step 6: Value(e|K,I,P) and expected-discrepancy-reduction optimization)."
