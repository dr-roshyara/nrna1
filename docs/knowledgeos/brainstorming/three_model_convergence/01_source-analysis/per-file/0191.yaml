about: >
  A formal, highly detailed prompt-engineering artifact -- the actual "Claude Prompt: KnowledgeOS Book
  Research & Epistemic Fact Extraction" recommended for a SEPARATE reading session tasked purely with book
  extraction, explicitly distinguished from the architecture-deciding session ("another Claude session").
  This is the governing methodology template that retroactively explains the remarkably consistent
  structure observed across the entire preceding book-lens stretch (Williamson 0171, Audi 0172, Shieber
  0173, critical-thinking 0174, decision-power 0176, Nyaya-sutra 0177, Quine 0178, Tractatus 0179, Managing
  Memory 0180, Cavell 0184, Davidson 0185/0186): the five-level extraction ladder (SOURCE FACT -> SOURCE
  DISTINCTION -> SOURCE ARGUMENT -> KNOWLEDGEOS RESEARCH RELEVANCE -> ARCHITECTURAL HYPOTHESIS, each level
  requiring explicit classification and never silently promoted), the nine research dimensions (Knowledge,
  Truth, Evidence, Justification/Reasoning, Authority, Identity, Meaning/Interpretation, Categories/
  Distinctions, and cross-cutting Failure-Cases/Boundaries/Limits/Self-Reference/Temporal-Structure/
  Relations), the DDD-relevance discipline (identify concepts/relations/state-changes/invariants/ownership,
  formulate a "DDD question raised by this source," never invent an aggregate directly), a nine-question
  "KnowledgeOS lens" checklist (Identity/Evidence/Justification/Authority/Epistemic-State/History/
  Interpretation/Boundaries/Limits), and a cross-lens-comparison discipline requiring explicit
  SOURCE->CONCEPT->EXISTING-LENS->AGREEMENT-OR-TENSION->RESEARCH-QUESTION chains rather than bare
  "this agrees with X" assertions. Establishes disagreement/contradiction as explicitly HIGH VALUE ("do not
  try to reconcile every book... a contradiction between respected sources is often more valuable than
  their superficial agreement") and explicitly forbids false convergence ("never write 'all philosophers
  agree'... never force Nyaya+Davidson+Williamson+DDD into one unified theory"). Mandates strict provenance
  discipline (book/author/chapter/section/page/paragraph/exact-terminology/short-quotation/paraphrase, with
  an explicit PAGE UNKNOWN fallback rather than fabricated page numbers) and a rigid per-finding extraction
  record format with a STATUS field (SOURCE FACT/LENS OBSERVATION/RESEARCH HYPOTHESIS/UNRESOLVED). Specifies
  a mandatory 20-section "Final Book Report" template (Book Identification through Research Recommendation,
  with an explicit mandatory section "18. What This Book Does NOT Establish"), a five-value Research
  Recommendation vocabulary (HIGH VALUE/USEFUL/LIMITED/REDUNDANT/CONTRADICTORY), and a 12-item "No
  Architecture Drift" pre-submission gate (did I invent an aggregate/bounded-context/Kernel-capability;
  promote a metaphor into a domain object; treat semantic interpretation as Kernel responsibility; treat an
  LLM as epistemic authority; equate confidence with truth, evidence with justification, authority with
  truth, or representation with identity; resolve an unresolved question merely because the book suggests
  an answer; silently change the Constitution -- if YES to any, STOP and rewrite as hypothesis/question).
  Closes with two explicit methodological principles not previously stated this precisely in the corpus:
  (1) mandatory "negative extraction" -- ask not only "what does this book teach us?" but "what would this
  book make us stop believing about KnowledgeOS?", producing parallel constructive (useful distinctions/
  concepts/models/relations) and destructive (challenged assumptions/counterexamples/limits/failure-modes)
  extraction streams that both feed one KnowledgeOS research space before falsification; (2) an explicit
  anti-premature-merging discipline -- each book must first produce its own clean, independent extraction
  record before any cross-book comparison occurs, "to preserve the independence of the sources and prevent
  artificial convergence" -- stating the full intended production chain: Book -> extraction -> independent
  book report -> cross-book comparison -> falsification -> DDD scenarios -> governed architecture decision.

