defines:
  - concept: "The cross-aggregate invariant test"
    definition: "When a candidate joint invariant I_AB(A,B) is proposed to justify merging two candidate aggregates A and B into one, determine whether it is a genuinely strong consistency invariant that must hold within a single transaction, or whether it can tolerate eventual (asynchronous) coordination -- a one-directional implication typically tolerates separation, while a strict biconditional required to hold at every instant is a stronger signal for merging, though even then the possibility that the invariant actually belongs to a coordinating process (rather than either aggregate) should be investigated first"
  - concept: "Process≠Aggregate"
    definition: "A long-running business process that moves through several distinct domain stages (e.g. Decision→Authorization→Execution) does not thereby require those stages to be combined into one transactional aggregate -- the process itself (potentially realized as a Saga or Process Manager pattern) is the mechanism that coordinates the separate aggregates over time, while each aggregate retains its own local consistency boundary; the process pattern should only be introduced when genuinely needed, not by default"
refines:
  - concept: "0789's Step 164 event model and its recommendation of Step 165"
    refinement: "DELIVERED: the actual aggregate-boundary determinations via a rigorous invariant/consistency test, culminating in a three-tier classification (Strong/Medium/Weak) explicitly marked provisional"
  - concept: "0787's bounded-context-level determination (Decision folded into Governance; Authorization as a boundary object between Governance and Operations)"
    refinement: "Refined at the finer-grained aggregate level: Decision and Authorization are here classified as Strong aggregate candidates -- consistent with, not contradicting, 0787's BC-level analysis, since an aggregate can exist within a bounded context (Decision-as-aggregate fits inside the Governance BC) and a boundary-object role is compatible with independent aggregate status on either side of the boundary"
  - concept: "0784's Current↔Target↔Evidence discipline and 0781's real-repository findings"
    refinement: "Explicitly reinvoked at the AI-contribution-artifact analysis point, directly warning against inventing a theoretical aggregate without first checking whether the existing real KnowledgeOS implementation (agents, sessions, artifacts, hooks, governance, verification, memory, registries) already embodies the proposed boundary"
