title: "Step 165 -- Aggregate and Consistency-Boundary Derivation (MAJOR SYNTHESIS MILESTONE, delivers 0789's promised register): 'Aggregate = State+Invariants+Transactional Consistency,' the Test Being 'What Must Change Together?' -- Delivers the Final Three-Tier Aggregate Classification (Strong: Evidence/Knowledge/Decision/Authorization; Medium: Determination/Inquiry; Weak: Action/Execution/Observation) -- Delivers a Formal Mathematical Consistency Model c→(I_i)→S_i'→Event_i and the Cross-Aggregate Invariant Test (a True Strong Consistency Invariant vs. Tolerable Eventual Coordination) -- Delivers Process≠Aggregate ('a Long-Running Business Process... Does Not Imply Its Stages Are One Aggregate; the Process Coordinates Them') -- Delivers the Correct Hierarchy BoundedContext⊃Aggregates⊃Entities/ValueObjects -- Opens Step 166, Process Managers, Sagas and Long-Running Consistency, With 'a Process Coordinates Domain Boundaries; It Must Not Become a Substitute for Domain Ownership'"
