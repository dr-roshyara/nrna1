about: >
  Directly continues 0789, opening "we now move from events to the question of ownership," posing the
  governing question "which domain boundary is responsible for deciding whether that transition is
  legal?" -- "this is where we derive aggregates."

  **§165.1 delivers the DDD rule**: "the aggregate is not a convenient collection of related objects. It
  is a consistency boundary that protects invariants," formalized `Aggregate=State+Invariants+
  Transactional Consistency`, with the fundamental test "what must change together?"

  **Delivers per-concept aggregate analysis with concrete invariants and ownership boundaries**: Evidence
  (`E=(id,source,observation,provenance,integrity,status)`, invariants `Source(E)≠∅`, `Provenance(E)≠∅`,
  `Accepted(E)⇒IntegrityVerified(E)`; ruled a strong aggregate candidate; explicitly does NOT own the
  Knowledge claims it supports -- "Evidence owns Evidence. Not Knowledge" -- because one Evidence item may
  support several claims, `E_1→{K_1,K_2,K_3}`, and embedding Knowledge inside Evidence would create
  unnecessary coupling); Knowledge (`K=(id,claim,status,validity,authority,version)`, invariants
  `Status(K)`, relationships `supports(E,K)` and `supersedes(K_1,K_2)`; also ruled a strong aggregate
  candidate, explicitly not owning Evidence).

  **§165.48-165.49 delivers explicit AI-contribution-artifact analysis, directly connecting to the real
  existing KnowledgeOS system**: `CandidateArtifact⇒OriginKnown`, `Accepted⇒EvaluationRecorded`, with
  whether this belongs to a distinct "AI Contribution context" or the broader Knowledge context explicitly
  left open. Delivers a direct reminder that the real existing architecture already has concepts around
  "agents; sessions; artifacts; hooks; governance; verification; memory; registries" -- "we should
  therefore not invent a theoretical aggregate and assume it maps directly to the implementation" -- with
  the explicit return to "the `Current↔Target↔Evidence` discipline" established at 0784.

  **§165.50 delivers a formal mathematical consistency model**: for aggregate `A_i` with state `S_i` and
  invariant set `I_i(S_i)`, a command `c` produces `S_i'=Transition(S_i,c)` only if `I_i(S_i')=true`, after
  which `Event_i` may be emitted -- boxed `c→(I_i)→S_i'→Event_i`.

  **§165.51-165.53 delivers the cross-aggregate invariant test**: for a candidate joint invariant
  `I_AB(A,B)`, ask whether it is a genuinely strong consistency invariant (justifying combining `A` and `B`
  into one aggregate) or whether eventual coordination is tolerable, worked through two contrasting
  examples -- a one-directional implication (`AuthorizationGranted⇒DecisionExists`) does NOT require one
  aggregate (Decision can precede Authorization asynchronously), whereas a hypothetical strict biconditional
  holding "at every instant" (`AuthorizationGranted⟺DecisionApproved`) might require tighter consistency --
  but even then, the file cautions to first investigate "whether the invariant belongs to a higher-level
  process rather than a single aggregate."

  **§165.54-165.55 delivers `Process≠Aggregate`**: "a long-running business process (`Decision→
  Authorization→Execution`) does NOT imply Decision+Authorization+Execution are one aggregate. The process
  coordinates them," potentially via a `Saga/ProcessManager` pattern, "but we should only introduce that
  pattern if needed." Delivers **"the correct hierarchy"**: `BoundedContext⊃Aggregates⊃Entities/
  ValueObjects`, separately noting "processes coordinate aggregates. Events communicate facts. Commands
  request actions. Policies constrain transitions."

  **§165.56 delivers "Step 165 result," the file's central deliverable: a final, explicitly provisional
  three-tier aggregate classification**: **Strong aggregate candidates**: `Evidence, Knowledge, Decision,
  Authorization`; **Medium candidates**: `Determination, Inquiry`; **Weak/provisional candidates**:
  `Action, Execution, Observation` -- "not final. It is the result of applying the invariant/consistency
  test." **This notably reclassifies Decision and Authorization as aggregate candidates at the finer-
  grained aggregate level, refining (not contradicting) 0787's bounded-context-level analysis, which had
  folded Decision into an existing Governance bounded context and modeled Authorization as a boundary
  object between Governance and Operations** -- an aggregate can exist within a bounded context, so
  Decision-as-aggregate is consistent with Decision-belonging-to-the-Governance-BC, and this reconstruction
  records the refinement as a legitimate deepening across DDD granularities rather than a conflict.

  **§165.57 delivers "what we have learned," two central architectural principles**: "a domain concept
  earns an aggregate boundary by possessing invariants that require local consistency -- not simply
  because it is an important noun" and "a bounded context earns its boundary because its model, language,
  ownership and invariants differ -- not because we want another service" -- explicitly proposed to
  "remain central to the architecture."

  **Closes by opening "Step 166 — Process Managers, Sagas and Long-Running Consistency,"** posing "who
  coordinates the journey between them?" if Evidence/Knowledge/Determination/Governance/Authorization/
  Operations are separate consistency boundaries, examining whether KnowledgeOS needs
  `ProcessManager`/`Saga`/`Workflow`/`Case` concepts or whether existing governance mechanisms already
  provide coordination, delivering the governing principle for that examination: **"a process coordinates
  domain boundaries; it must not become a substitute for domain ownership"** -- explicitly framed as "the
  next place where we can test whether the architecture we have derived from Chapters 1-4 and our
  established KnowledgeOS lenses remains internally coherent." No actual repository implementation or code
  execution occurs within this file itself; every aggregate classification remains explicitly provisional.
