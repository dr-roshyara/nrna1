about: >
  A full "architecture archaeology" reconstruction of the CURRENT (as-implemented) Engineering
  Knowledge System (EKS), explicitly distinguished from any future/target KnowledgeOS Kernel
  architecture. Not philosophical or mathematical research — a descriptive baseline of what
  actually exists in the repository's implementation, tests, persistence, ADRs and governance
  records, using an eight-level evidence hierarchy (implementation > tests > persistence > ADRs
  > docs > diagrams > proposals > historical context) and an explicit classification vocabulary
  (CURRENT / IMPLEMENTED-BUT-IMPLICIT / PARTIAL / DOCUMENTED-ONLY / HISTORICAL / PROPOSED / UNKNOWN).
introduces:
  - concept: "Evidence hierarchy for architecture reconstruction (8-level priority: implementation > tests > persistence > ADR > docs > diagrams > proposals > historical)"
  - concept: "Classification vocabulary: CURRENT / IMPLEMENTED-BUT-IMPLICIT / PARTIAL / DOCUMENTED-ONLY / HISTORICAL / PROPOSED / UNKNOWN"
  - concept: "Engineering Activity -> Evidence -> Observation -> Assessment/Recommendation -> Human Decision -> Engineering Outcome -> Effectiveness Evidence -> Knowledge -> Future Engineering Activity (organizational-memory loop)"
  - concept: "Five architectural layers: Engineering Governance / Engineering Knowledge / Engineering Workflow / Observation Runtime / Developer Activity"
  - concept: "Recommendation -> Decision -> Outcome -> Assessment -> Effectiveness/Evidence workflow chain (most mature current domain model)"
  - concept: "ObservationTrigger -> ChangeSet -> ObservationRuntime -> Collectors -> Recommendation Engine -> Presentation runtime pipeline"
  - concept: "Capability/adapter separation principle (e.g. CommitTrigger capability vs. Husky/native-hook/CI adapters)"
  - concept: "Deferred Architecture Register: Deferred Concept -> Current Invariant -> Activation Criterion -> Evidence Required -> Status"
  - concept: "Three-Question Staging Principle: can we build it? / should we build it now? / should it join the platform? (orthogonal questions)"
  - concept: "'Deterministic does not mean demanded' principle"
  - concept: "Event Payload Principle: events carry references (commit_id, file ref), never embedded source code; repository remains source of truth"
  - concept: "'Measurement is not knowledge' / 'Measurement is not recommendation' distinction"
  - concept: "AI-human authority asymmetry: AI produces analysis/recommendation; only humans make architecture/governance/security decisions"
  - concept: "Bounded-context candidates table (Engineering Knowledge, Architecture Governance, Observation, Recommendation, Engineering Improvement, AI Engineering Platform, Verification) explicitly NOT promoted without further ownership/language/invariant evidence"
  - concept: "Eight architectural invariants (human authority, evidence-before-evolution, deterministic-precedes-learning, trigger/runtime separation, capability/adapter separation, measurement != knowledge, repository-as-source-of-truth, evidence-gated future evolution)"
