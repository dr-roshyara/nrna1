defines:
  - concept: "The three-layer separation model"
    definition: "A disciplined stratification of the entire KnowledgeOS research programme into three layers: the Philosophical Lens (Gita, Vedanta, the Zero lens) which generates questions but commits to no equations; the Epistemic Theory layer (mathematics, statistics, evidence, uncertainty formalisms) which may become formal theory only where independently justified by evidence; and the Software Architecture layer (EKS, PKS, AIP, DDD, governance mechanisms) which is the only layer that becomes actual software architecture -- named 'the most important architectural result of the review' because it retroactively explains why several earlier Gita-derived equations were legitimate as inspiration but illegitimate as architecture: they were promoted directly from the top layer to the bottom, skipping the required evidence-validation middle layer"
  - concept: "'The Gita lens gives invariants and questions about transitions, not components'"
    definition: "The correct way to use Gita source material architecturally is never to map a named entity (Krishna, Arjuna, Dharma, Karma) onto a named software component (a service, a class, a database field, a workflow step) -- that conflates metaphor with identity; the correct extraction is instead a structural question or invariant the entity's narrative role suggests (Krishna's completeness suggests asking 'what is the boundary of complete knowledge?'; Arjuna's limited knowledge suggests 'actor knowledge is not total knowledge'; Dharma's normative weight suggests asking about normative integrity as a property, not a stored value; Karma's action-orientation suggests investigating the knowledge-action relationship, not literally modeling 'a karma step')"
  - concept: "The symmetric hard rule on Gita-architecture promotion"
    definition: "Two paired, deliberately symmetric constraints protect the research programme's intellectual integrity: (1) no equation or formula derived from Gita interpretation may become an architectural rule unless independent software or domain evidence separately supports it -- a philosophical insight is not itself evidence; and (2) conversely, no existing software structure may be retroactively declared 'validated by the Gita' merely because an interpreter can construct a metaphor connecting them -- structural resemblance is not validation in either direction"
