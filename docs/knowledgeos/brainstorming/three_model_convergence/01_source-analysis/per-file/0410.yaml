  - concept: "D_t = union over all lenses of D_t^(lens): the corpus's own multi-lens architecture explained as a dimension-DISCOVERY mechanism (each lens surfaces dimensions others miss), not merely a set of alternative interpretations -- named potentially one of the most important roles of the lens architecture, and the first explicit architectural justification for the corpus's entire lens methodology encountered in this reconstruction's sequential pass"
