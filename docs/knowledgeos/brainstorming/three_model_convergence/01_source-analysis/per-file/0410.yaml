  - concept: "Discovery != Creation, paired with Representation/Interpretation CAN be constructed: the underlying situation pre-exists, but a derived knowledge statement (e.g. 'Nexus is outdated') is genuinely constructed from Version, RequiredVersion, and a Rule -- refining the rejected 'revealed not created' claim"
  - concept: "Four-way Unrepresented taxonomy: Derivable / Discoverable / Unknown-dimension / Currently-inaccessible, refining Latent!=Unknown"
  - concept: "Two-level Object-Knowledge/Meta-Knowledge framework: Level 1 K_t(O) (knowledge about the observed object/state) vs Level 2 M(K) (meta-knowledge about the structure of knowing itself -- which dimensions are recognized, how discovered, what assumptions define them, what evidence regimes are used, what kinds of uncertainty are representable), later reformalized as MetaK_t(K_t(Nexus)) and named the bridge between Infinite Knowledge Space, Zero, the Sanskrit semantic lens, and the eventual Kernel"
  - concept: "Cross-lens unification via the Virochana analogy: K_t!=Omega, Model(K_t)!=Reality(O), Representation!=Meaning!=Reality unified as one coherent principle spanning Zero, Vani, Quine, Mithya, Infinite Knowledge Space, and the dimension model"
  - concept: "Synthesis-must-preserve-provenance principle replacing the rejected Honeybee 'indistinguishable from components' claim: integrated knowledge may present as a unified determination while retaining traceability to contributing evidence and reasoning (D<-A,B,C, D<-Rule<-Evidence)"
  - concept: "K* (ideal knowledge state) formalized as an asymptotic convergence target: K_t != K* for any finite t under the infinite-space hypothesis, while K_1->K_2->...->K* is a genuine, real progression -- correcting the absolute 'complete knowledge is impossible' into a more precise asymptotic-process model"
  - concept: "Quality(K_{t+1}) > Quality(K_t) as the improvement criterion, replacing the rejected |K_{t+1}|>|K_t| (since a new dimension can invalidate or reduce confidence in an existing determination), with eight explicit quality criteria"
  - concept: "Formal completeness-seeking process: D*={d1,d2,...} (ideal observation space), D_t subset-of D*, K_t={(d_i,V_t(d_i))}, with the real objective being to discover D*-D_t and determine V(d) for d in D*-D_t; complete knowledge redefined as all relevant dimensions identified PLUS their values determined"
