defines:
  - concept: "KOS_ref=(X,Σ,T,X_0,I)"
    definition: "A deliberately small, non-production reference state machine over the mathematical kernel's states, event/command alphabet, transition function (deterministic or stochastic), initial state, and invariant set, existing solely to test whether the mathematical model executes coherently"
  - concept: "Optimistic concurrency via Version(S_t)"
    definition: "Execute(D) is permitted only if the current state's version matches the version captured in D's decision snapshot; a version mismatch triggers Revalidate(D) rather than allowing the decision to proceed against a stale basis"
  - concept: "Absence of confirmation≠confirmation of absence"
    definition: "¬Observed(Success)⇏Observed(Failure) — the absence of a success confirmation (e.g. after a connectivity loss) does not license concluding failure; the correct state is UnknownOutcome, a genuinely distinct fourth value alongside Success/Failure/Partial"
  - concept: "StateReplay≠ActionReplay (functional core / imperative shell)"
    definition: "Pure, deterministic state transitions can always be safely replayed for reconstruction, but external side effects (e.g. sending an email) must never be re-executed merely because the event log is replayed; this maps cleanly onto separating a deterministic FunctionalCore from an ImperativeShell that performs controlled side effects"
