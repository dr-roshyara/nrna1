about: >
  Extracts a practical four-part critical-thinking/logic/problem-solving/communication guide as a
  KnowledgeOS domain-analysis source ("extract the domain primitives that critical thinking requires,"
  not the methodology itself), directly continuing the Western-epistemology arc from 0171-0173 and
  explicitly combining with 0173's Shieber extraction into a labeled, versioned "Kernel Candidate v0.2."
  Key discoveries: (1) SCQH (Situation-Complication-Question-Hypothesis) exposes a missing kernel object,
  Question, with full domain identity (subject/context/scope/purpose/origin/status), distinguished from
  Inquiry (the investigating activity/process) -- AI agents "participate in an Inquiry," they do not
  directly create knowledge; (2) Hypothesis made first-class with an explicit lifecycle (Proposed->
  UnderTest->Supported/Refined/Rejected) and identity fields, motivating a RejectedHypothesis-is-knowledge
  principle (KnowledgeOS should preserve epistemic alternatives considered and rejected, not only accepted
  conclusions -- valuable for architectural archaeology) and a Hypothesis!=Claim boundary preventing AI
  speculation from silently becoming knowledge; (3) Assumption made first-class with challengeable
  lifecycle (Proposed/Accepted/Challenged/Validated/Invalidated/Superseded) and an explicit dependency
  relation (Claim depends-on Assumption), motivating a "claim inherits epistemic risk from unresolved
  assumptions" candidate invariant; (4) Argument made first-class (Purpose/Question/Premises/Assumptions/
  Evidence/Inference/Conclusion/Implications/PointOfView, from the Paul-Elder framework) replacing "AI
  text -> Claim" with "Argument -> Conclusion"; (5) Inference made an explicit first-class relation/process
  (not merely a claim-references-evidence link), preserving how a conclusion was obtained, feeding
  deterministic replay/auditability; (6) ReasoningMethod (Deductive/Inductive, explicitly NOT Abductive --
  flagged as unestablished by this source) as a typed property of Inference; (7) Test distinguished from
  Verification (Test = activity producing evidence relevant to a hypothesis; Verification = assurance
  activity against an established criterion); (8) Refutation made a first-class event/relation
  (Evidence-contradicts->Claim, Test-refutes->Hypothesis), producing a richer EvidenceRelation taxonomy
  (Supports/Contradicts/Neutral/Contextualizes) replacing a flat evidence[] list; (9) a multi-dimensional
  ReasoningAssessment vocabulary from the Paul-Elder intellectual standards (Clarity/Accuracy/Precision/
  Relevance/Depth/Breadth/Logic/Significance/Fairness), explicitly kept separate from KnowledgeClaim itself
  as a DDD boundary, avoiding a universal confidence scalar; (10) Relevance modeled as a relation to a
  Question-in-Context, not an intrinsic Evidence property; (11) 5W2H as an interrogation lens on Inquiry,
  not a literal entity; (12) Problem (CurrentState/DesiredState/Gap/Impact/Context) explicitly placed one
  level above the Kernel, in an Inquiry-context/knowledge-work layer, not a kernel primitive; (13) MECE
  reframed as a DecompositionQuality/CoverageAssessment concern, not a universal truth rule, feeding a
  Question-decomposes-into-Question[] kernel relation; (14) Decision explicitly kept distinct from
  Knowledge (Knowledge!=Decision; a decision uses knowledge, does not become knowledge merely by being
  made) while requiring an explicit knowledge basis (alternatives/criteria/evidence/assumptions/decider/
  time); (15) RACI motivating an epistemic-authority != execution-responsibility boundary (author!=
  authority); (16) Fallacy and cognitive Bias explicitly separated (logic-flaw vs. systematic cognitive
  error) and both modeled as ArgumentAssessment/InquiryAssessment defects, never as properties directly on
  Claim, so a detected fallacy flags the reasoning without automatically falsifying the conclusion; (17)
  Confirmation-bias risk motivating CounterEvidence as first-class and an Inquiry structure explicitly
  tracking SupportingEvidence/CounterEvidence/Hypotheses/AlternativeInterpretations as an anti-hallucination
  design; (18) correlation!=causation motivating typed Inference relations (CorrelationInference/
  CausalInference/etc.) and stronger evidentiary requirements for CausalClaim; (19) Pattern introduced as
  kernel-adjacent (Pattern != Rule, Pattern != Truth), placed in a "Knowledge Reasoning Context" outside the
  strict kernel; (20) a SufficiencyAssessment/InquiryCompletionCriterion concept for agent-independent
  "when is inquiry complete" governance, avoiding bare "Claude says I have enough information"; (21) a
  contradiction-is-information principle producing a richer EpistemicStatus enum (Proposed/Supported/
  Contested/Refuted/Accepted/Superseded) instead of true/false; (22) Perspective as a relation on
  Argument/Claim (Developer/Operations/Security/Governance viewpoints), modeled narrowly as
  ArgumentPerspective rather than a large aggregate; (23) a meta-level validation of the corpus's own
  "lens" architecture -- the book itself is a collection of lenses, and KnowledgeOS should supply generic
  Assessment objects to which Epistemic/Logic/Governance lenses attach, with the explicit rule "lenses
  inspect domain objects; they do not redefine them." Produces twelve named KOS-CT-01..12 candidate
  invariants (explicit question, hypothesis separation, assumption explicitness, inference explicitness,
  testability, counter-evidence, correlation/causation separation, contextual relevance, multidimensional
  reasoning quality, contradiction-is-first-class, epistemic-transition explicitness, revision). Combines
  with 0173's Shieber extraction into "Kernel Candidate v0.2": a Knowledge Kernel (Question/Hypothesis/
  Evidence/Claim/Argument/Inference/Assessment/Provenance) plus four surrounding bounded contexts --
  Inquiry Context, Reasoning Context, Decision Context, Governance Context -- collaborating through
  explicit contracts. Explicitly rejects importing generic self-help/methodology content (3-7-item memory
  heuristic, power poses, storytelling technique, arbitrary prioritization matrices, every listed bias/
  fallacy as hard rule) as architecture, preserving a Domain-Truth != Methodology != Heuristic !=
  Implementation-Preference distinction. Explicitly flags this as "Kernel Candidate v0.2," not frozen, with
  more lenses (testimony, argumentation, scientific method, organizational knowledge, information theory,
  decision theory) still to apply.

