about: >
  Tom Chivers' "Everything Is Predictable: How Bayesian Statistics Explain Our World", mined via seven
  lenses (Zero/DDD/Chinese/Evidence-epistemology/Causal/Wisdom/AI-Engineering), continuing the
  0205-0211 evidence-acquisition/causal-assurance/wisdom arc. Central thesis: KnowledgeOS needs an
  explicit mechanism for uncertainty, prior knowledge, evidence strength, belief revision, prediction,
  surprise, and model change -- NOT because KnowledgeOS should "be Bayesian," but because it needs to be
  a belief-revision system, not a document-accumulation system. One of the densest single-file
  extractions in the corpus: ~25 candidate domain concepts, ten Tier-1 "essential" architectural
  takeaways, and an explicit anti-pattern warning against over-adopting Bayesian machinery.
introduces:
  - concept: "Belief-revision reframing: KnowledgeOS should be a belief-revision system, not a document-accumulation system (WORLD->OBSERVATION->INTERPRETATION->BELIEF->PREDICTION->NEW OBSERVATION->REVISION)"
  - concept: "BeliefState aggregate (Proposition/Probability-Credence/Prior/EvidenceHistory/Posterior/Assumptions/Model/Timestamp), invariant: traceable to the information and assumptions that produced it"
  - concept: "Knowledge as a current confidence distribution rather than forced binary true/false"
  - concept: "'Contradiction is not an error to hide, it is an epistemically valuable event' -- prediction errors from unexpected evidence cause larger belief updates than expected evidence"
  - concept: "Prediction as first-class domain object (Prediction/PredictionOutcome/PredictionAssessment triad) and Kalman-filter-style estimate->predict->observe->update loop"
  - concept: "ReferenceClass / outside-view / base-rate concept from superforecaster methodology: establish base rate among comparable cases before updating with case-specific evidence"
  - concept: "Evidence acquisition should be directed by expected information value ('which observation would most reduce uncertainty?') rather than indiscriminate collection -- near-active-learning principle"
  - concept: "PriorAssessment as first-class, non-arbitrary object (reference class/historical evidence/assumptions/prior distribution/justification/source/date); priors can be checked, crowdsourced, tested for robustness"
  - concept: "Hyperpriors / two levels of uncertainty: Level 1 parameter uncertainty ('what is the probability?') vs. Level 2 model uncertainty ('are we using the right model at all?')"
  - concept: "ModelValidity state (active/degrading/contradicted/superseded/context-bound/unknown) -- distinguishes 'bad implementation' from 'outdated model' (worked synchronous-integration-architecture example)"
  - concept: "Conditional validity principle: represent 'X is correct under what conditions/phase/relationship/purpose' rather than universal truth"
  - concept: "HypothesisSet: evidence must update a hypothesis space (H1..H4 with priors/posteriors), not a single favored explanation -- direct AI-agent confirmation-bias guard"
  - concept: "Bayesian update principle: every significant belief update should have a reason (EvidenceImpact object: prior belief/evidence/likelihood ratio/posterior belief/affected hypotheses/rationale)"
  - concept: "Evidence Discriminative Power != Evidence Credibility -- distinct dimensions (likelihood ratio: how discriminating is this evidence between competing explanations, not how credible is it)"
  - concept: "ForecastCalibration capability: are predicted probabilities calibrated against observed frequencies (Brier scoring), enabling AI-agent qualification by empirical calibration profile, not sounding intelligent"
  - concept: "Prediction as a 'future evidence contract' -- an opportunity to generate future evidence about the model that produced it"
  - concept: "PredictionLedger / Epistemic observability (belief drift, prediction error, calibration, uncertainty, contradictions, model degradation, evidence quality) as a new observability category distinct from system observability"
  - concept: "Overfitting distinction: explains-existing-evidence != predicts-unseen-evidence; ModelComplexity/ComplexityPenalty as explicit trade-off, not an automatic simplicity preference"
  - concept: "Replication-crisis anti-pattern extraction (p-hacking, optional stopping, publication bias, HARKing, novelty bias, selective reporting) driving an extended provenance model: Source+Acquisition+Selection+Transformation+Analysis+Exclusion+Publication provenance"
  - concept: "AnalyticalLineage: full reconstructable path from raw dataset through cleaning/exclusions/transformation/subgroup-selection/statistical-test/model/result/claim"
  - concept: "EvidenceEpisode: replication is new evidence about the original claim, not an overwrite (original acquisition/replication/contradiction/extension/failed-replication/synthesis)"
  - concept: "Epistemic temporal versioning: belief-state versions (v1/v2/v3) with what-changed/why/which-evidence/which-assumptions/which-model recorded, not merely document versions"
  - concept: "Epistemic model vs. Decision model separation reconfirmed: same posterior can produce different decisions under different utilities (worked EUR10 vs EUR10M failure-cost example)"
  - concept: "Value of Information principle: before collecting evidence, ask how much it could change the decision; don't collect evidence that cannot change the decision"
  - concept: "'Activity != Learning' / 'More evidence != More knowledge' anti-pattern warning against high-volume low-information-gain agent behavior"
  - concept: "Five-state epistemic status model: UNKNOWN / UNCERTAIN / SUPPORTED / CONTRADICTED / ESTABLISHED (established explicitly not metaphysical certainty)"
  - concept: "Candidate EpistemicCore bounded-context-candidate (Proposition/Hypothesis/BeliefState/Evidence/EvidenceImpact/Prior/Posterior/Uncertainty/Prediction/PredictionOutcome/PredictionError/AlternativeHypothesis/Model/ModelValidity)"
  - concept: "Disciplined KnowledgeOS agent behavior chain: Formulate Question -> Identify Hypotheses -> Establish Reference Class -> Establish Prior -> Identify Evidence Need -> Acquire Evidence -> Audit Provenance -> Search Contradictions -> Update Beliefs -> Check Alternative Models -> Make Predictions -> Record Uncertainty -> Propose Decision Options -> Governed Judgment"
  - concept: "Two proposed constitutional principles (Zero): no unconditional-fact representation of graded/conditional belief; every material belief update traceable to evidence/assumptions/prior-state/model"
  - concept: "Chinese-lens constitutional principle: preserve conditions/relationships/temporal-context/transformations through which knowledge arises; contradiction/absence/surprise/change are sources of knowledge, not system errors"
  - concept: "Wisdom-lens constitutional principle: knowledge acquisition driven by decision-relevant uncertainty, not indiscriminate accumulation"
