about: >
  A rigorously-cited external-literature review (Stanford Encyclopedia of Philosophy, academic
  Indology sources, a 2026 Zenodo paper on fine-tuning LLMs on Navya-Nyaya methodology) of classical
  Indian formal logic and epistemology: the four Pramāṇas, the five-membered syllogism, Tarka as
  reductio ad absurdum, and the Vedic authority-constrains-reason principle. Maps nearly every concept
  explicitly onto existing KnowledgeOS/C1 principles with argued rationale. ⭐ First appearance of
  "Mokṣa" in the primary corpus (in a comparative-goals table cell, not elaborated).

introduces:
  - "Four Pramāṇas specified: Pratyakṣa (Perception, direct sensory experience, 'the primary and most
    fundamental source'), Anumāna (Inference, via invariable concomitance/vyāpti), Upamāna (Comparison/
    analogy), Śabda (Testimony/reliable verbal authority) -- a genuine specification beyond 0087's
    general Pramāṇa quartet (Pramātā/Pramāṇa/Prameya/Pramā), which named the KNOWING-PROCESS roles;
    this file names the four TYPES of valid knowledge-generating process itself"
  - "Five-membered syllogism (Nyāya-Parārthānumāna): Pratijñā (Proposition) / Hetu (Reason) /
    Udāharaṇa (Example, universal rule + concrete instance) / Upanaya (Application to the specific
    case) / Nigamana (Conclusion) -- a genuine, ancient, formally rigorous inference structure, with
    two named validity requirements: Pakṣadharmatā (the reason must actually be present in the
    subject) and Vyāpti (invariable concomitance between reason and conclusion)"
  - "Tarka defined as 'Pramāṇa-anugrahaka' -- an ASSISTANT to the pramāṇas, explicitly NOT an
    independent knowledge source (Apramāṇa): functions as reductio ad absurdum (prasaṅga), testing
    competing claims by showing absurd consequences, without itself producing knowledge"
  - "Five named types of fallacious Tarka (a genuine formal fallacy taxonomy): Pramanabadhita
    (contradicted by valid knowledge sources), Atmasraya (self-dependency/circular), Anyonyasraya
    (mutual dependency), Cakrakasraya (circular dependency chain), Anavastha (infinite regress)"
  - "Six-Phase Navya-Nyaya reasoning methodology (2026 AI implementation, cited with reported results):
    Samshaya (doubt analysis, 5 taxonomic categories) -> Pramana (evidence grounding) -> Pancha Avayava
    (5-member syllogism construction) -> Tarka (counterfactual testing) -> Hetvabhasa (5-type fallacy
    detection) -> Nirnaya (ascertainment: definitive knowledge vs hypothesis). Reported: '100% semantic
    correctness (10/10 examples)... dissociation between semantic correctness (100%) and format
    adherence (40%) suggests models internalize reasoning content even when strict schema compliance
    fails' -- a real, citable, empirical AI-reasoning result, not metaphor"
  - "Śaṅkarācārya's warning against 'duṣ-tarka' (corrupt/futile reasoning): 'reason (tarka) must serve
    scripture (śruti), not replace it' -- an independently (Vedic-)sourced argument for Authority
    constraining Reason, explicitly mapped onto Evidence!=Authority/Assessment!=Authority"
  - "Nyāya's iterative 4-phase cognitive cycle: pramā (valid cognition) -> saṃśaya (structured doubt)
    -> siddhānta/avayava/nirṇaya (theory construction/evaluation) -> vāda/jalpa/vitaṇḍā (formalized
    discourse: truth-seeking/competitive/destructive debate) -> back to 1"
  - "⭐ First appearance of 'Mokṣa' (liberation) in the primary corpus -- in a single comparative-table
    cell (Tarka Shastra's stated Goal, vs Western epistemic logic's Truth/justification/consistency),
    NOT elaborated doctrinally. Buddhi/guṇas/purification remain entirely unseen even here"
  - "TARKA-001..005 candidate invariants: Pramana Grounding (strong candidate), Vyapti Confirmation
    (candidate), Tarka as Assistant (strong candidate), Structured Doubt (candidate), Authority
    Constraint on Reason (strong candidate) -- a SEVENTH unreconciled candidate-invariant ID scheme"
  - "Explicit rejections: 'Tarka as kernel primitive' = Rejected/None; 'Nyaya as complete architecture'
    = Rejected/Dangerous -- the same self-limiting discipline as every prior extraction-prompt response"

