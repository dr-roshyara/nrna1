about: >
  A concrete applied-NLP research design combining a Hindi/Sanskrit primer (Swar Gyan, teaching aksara
  decomposition: consonant/vowel/matra/conjunct construction) with statistical/ML inference to recover
  dhatu (Sanskrit verbal roots) from surface forms. Explicit correction: the book teaches orthographic
  decomposition, NOT dhatu extraction itself -- dhatu inference requires morphology/lexical-knowledge/
  grammar/derivational-history/semantic-compatibility beyond character decomposition. Proposes a
  six-layer hybrid pipeline (deterministic grammar layer + statistical inference layer) and a four-model
  (A-D) comparative experiment design to test whether the decomposition actually contributes predictive
  information.
introduces:
  - concept: "Hybrid pipeline architecture: Layer A deterministic grammar (Unicode->Aksara->Matra->Conjunct->Morphological-candidate) feeding Layer B statistical inference (phonological/morphological/suffix/prefix/inflection/contextual/semantic/frequency features -> P(dhatu|word,context))"
  - concept: "Explicit level ladder of statistical methods appropriate to the problem, ordered by interpretability: frequency statistics -> Bayesian inference (P(D|W,C) with explicit uncertainty, e.g. root-A 0.91/root-B 0.05/other 0.04) -> HMM/CRF sequence labeling -> clustering (word-family discovery without supervision) -> dimensionality reduction (PCA/UMAP/t-SNE as empirical test of a linguistic hypothesis) -> supervised ML (start with interpretable statistical models before transformers, to understand which features actually identify a root)"
  - concept: "Four-model comparative experiment design (Model A: surface-word->dhatu; B: aksara-decomposition->dhatu; C: +matra+phonology+morphology; D: +context+semantic-features) with a full metric set (accuracy/top-1/top-5/precision/recall/F1/calibration/uncertainty/error-by-morphological-class) to empirically test whether the decomposition layer contributes predictive information"
  - concept: "Reversed-direction learning proposal: instead of only word->dhatu, learn dhatu->transformation-rules->surface-form, then invert for dhatu candidates -- explicitly framed as closer to the Panini/Sanskrit lens than ordinary NLP"
  - concept: "Dhatu reframed as a latent structural center via graph methods: build a transformation-family graph (root -> derived forms) and apply graph clustering/community-detection/embeddings/centrality/manifold-analysis to find the root as a structural center rather than a dictionary lookup"
  - concept: "Reaffirmed KnowledgeOS principle applied to this domain: statistical model proposes candidates, deterministic linguistic/knowledge system validates -- probabilistic inference should not silently become authoritative knowledge"
  - concept: "Central testable hypothesis: can deterministic Indic orthographic decomposition + Paninian morphological structure + statistical inference recover latent semantic roots with measurable accuracy? -- explicitly proposed as an actual experiment, not merely an architectural metaphor"
