defines:
  - concept: "System State (final, corrected)"
    definition: "S_t=(K_t,U_t,X_t,I_t,Q_t,C_t,N_t,P_t) -- the structured semantic state of the KnowledgeOS bounded context: Knowledge, Understanding, Domain (where applicable), Ideal, Inquiry, evaluation Context, Knower/Actor, and Policy. Derived analytical results (gaps, conflicts, discrepancies, coherence, Lord candidates, Sārathi recommendations) are projections computed FROM S_t, never part of it unless explicitly persisted as domain state."
  - concept: "Controlled transition system 𝔎"
    definition: "𝔎=(𝒮,ℰ,δ,S_0): valid states, valid events, a partial transition function δ:𝒮×ℰ⇀𝒮, and an initial state S_0"
  - concept: "Analysis function α"
    definition: "A_t=α(S_t)=(Δ_t,𝒢_t,𝒞_t,Coherence_t), the derived discrepancy/gap/conflict/coherence findings computed from state; Δ_t=Zero(S_t) is one subfunction of this analysis, not identical to it"
refines:
  - concept: "0470/0479/0480/0481's recurring Knowledge-State circularity (embedding Zero/Lord/History as K_t components, contradicting ZeroFinding≠Knowledge/LordCandidate≠Knowledge)"
    refinement: "The SAME pattern recurs a fifth time, now at the System-State level (Guidance State G_t as a component of S_t) -- but for the first time the review's correction is carried through cleanly to the final formalization with no remaining self-contradiction, unlike 0481 which corrected the pattern in prose while its own equations re-embedded it"
  - concept: "0481's event-sourcing architecture (H_{t+1}=H_t‖e_t, K_t=Replay(K_0,H_t), δ:K×E⇀K partial function)"
    refinement: "Generalized from the Knowledge State alone to the full System State: H_t=(e_0,...,e_{t-1}), S_t=Replay(S_0,H_t), δ:S×E⇀S with an explicit Pre(S_t,e_t) guard condition made syntactically explicit for the first time"
  - concept: "0483/0484's Guidance≠Authorization≠Execution≠Transition and Candidate/Approved Ideal State split"
    refinement: "Both applied at the full-system-state level: Decision≠Recommendation reused verbatim as a governance invariant; Discovery⇏IdealRevision extended by strict analogy to Discovery⇏Q_{t+1} for the Inquiry state"
  - concept: "0485's Zero≠Δ correction and Discrepancy (Δ) vocabulary"
    refinement: "Reused directly: Δ_t=Zero(S_t) is now explicitly one output of the broader Analysis function A_t=α(S_t), keeping Zero as a diagnostic subfunction rather than the whole of analysis"
