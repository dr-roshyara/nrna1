  IMPORTANT METHODOLOGICAL NOTE FOR THIS RECONSTRUCTION: this file explicitly and repeatedly refers to
  "Claude's corpus work" and "Claude's full corpus reconstruction" as the mechanism that will verify or
  refute the hypothesis this document proposes. This is very likely a direct, self-aware reference to
