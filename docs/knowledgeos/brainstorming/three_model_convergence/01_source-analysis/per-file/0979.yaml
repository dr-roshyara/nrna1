    refinement: "RESOLVED via corpus archaeology: the layer was not missing, merely not imported into the verification lane -- it already exists, named and formalized, as Sanjaya since 2026-08-26. This narrows the remaining blocker from a whole missing layer to a single undefined function body (Qualify)"
