    definition: "Rather than being competing, incompatible definitions of a single epistemic-status construct, Sanjaya_K=(Observed,Inferred,Reported,Unknown,Conflicting,Unresolved) and Sigma operate at genuinely different layers of the KnowledgeOS architecture: Sanjaya_K characterizes the OBSERVATION layer (how reliably and by what means a piece of information was obtained from the world), while Sigma characterizes the ASSERTION layer (the epistemic status of a claim already admitted into the knowledge state). They were 'never rivals' because they answer different questions about different objects in the pipeline -- this reframing potentially explains at least one instance of this reconstruction's long-tracked Sigma-representation-inconsistency puzzle as a layer confusion rather than a genuine definitional conflict"
