  - concept: "Person≠Role (Chapter-4 instance)"
    definition: "A named character in Chapter 4 is not identical to any single structural role -- Krishna simultaneously occupies Source, Teacher and Interpreter roles; Vivasvan occupies both Recipient and Transmitter roles in sequence -- so any later architectural mapping must map roles to architectural concepts, never characters directly, since a single actor may instantiate multiple roles at once or over time"
  - concept: "Transmission vs. Inquiry (two distinct Chapter-4 structures)"
    refinement: null
    definition: "Transmission is the linear, unidirectional lineage (Teacher→Recipient, e.g. Krishna→Vivasvan→Manu→Ikshvaku) that carries knowledge forward through successive custodians; Inquiry is a separate, bidirectional relationship (Questioner↔Teacher, e.g. Arjuna's exchange with Krishna) in which the recipient actively challenges and tests the transmitted claim rather than passively receiving it -- the chapter contains both structures simultaneously, and they must not be collapsed into one"
