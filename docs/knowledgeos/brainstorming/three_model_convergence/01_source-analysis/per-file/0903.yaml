about: >
  Opens explaining a sequencing correction driven by "the latest adversarial audit" (again referenced, not
  directly visible -- continuing the established pattern from 0892/0896/0897/0902): the three-state model
  `Σ={Unknown,Supported,Refuted}` has been "partially refuted" (cannot represent degree of support), and
  the older five-dimensional `Σ=(A,S,R,V,C)` "contains dimensions that belong elsewhere." **§275.0
  delivers the mandate**: neither candidate is acceptable; the real question is boxed **`What is actually
  epistemic, what is derived, and what belongs to another bounded context or mathematical layer?`**

  **§275.1-275.2 delivers a genuinely valuable methodological reframing**: explicitly refuses to "start
  with a vocabulary" (the corpus's ~12+ status-like terms), instead constructing a THIRTEEN-CONCEPT
  SEMANTIC-QUESTION TABLE mapping each status-like term (Unknown, Supported, Refuted, Support strength,
  Conflict, Contestation, Acceptance, Validation, Supersession, Approval, Acquisition, Validity,
  Resolution) to the distinct semantic question it actually answers -- reframing the whole investigation
  from "which terms are useful" to boxed **`Do they represent distinct semantic dimensions?`**

  **§275.3 delivers a candidate dimensional decomposition to be proven or falsified, not assumed**:
  `Σ=(epistemic direction, support magnitude)`, while Acquisition maps to Evidence/Provenance, Resolution
  to Lifecycle, Validity to TemporalSemantics, Conflict to a derived Relation/predicate, and Acceptance/
  Approval to Governance.

  **§275.4-275.7 delivers the crucial binary-vs-graded question**: the referenced audit found corpus
  evidence for a five-level ordinal support scale `S={None,Weak,Moderate,Strong,VeryStrong}`, meaning the
  three-state model cannot be complete unless support magnitude is shown NOT part of canonical epistemic
  semantics; explicitly warns against assuming ordinal arithmetic (`Strong≠3`, `VeryStrong≠4` absent a
  justified measurement scale, directly reapplying 0893's/0898's measurement-theory discipline); tests
  whether epistemic direction needs a genuine negative pole `D={Unknown,Positive,Negative}`; delivers a
  candidate `Σ=(D,S)`, explicitly noting it may be a CONSTRAINED SUBSET rather than the full Cartesian
  product (`(Refuted,VeryStrong)` plausibly meaningful; `(Unknown,VeryStrong)` plausibly contradictory) --
  boxed **`Σ⊊D×S`** possible.

  **§275.8-275.17 delivers an extensive battery of pairwise non-collapse tests**, each concrete and
  independently checkable: `Unknown≠None` (insufficient information to determine direction vs. no
  evidential support -- `Unknown+None` may be legitimate, `Supported+None` may not); `Confidence≠
  SupportStrength` unless formally established (probability/calibration/estimator vs. ordinal evidence
  assessment -- directly extending the corpus's standing confidence-ambiguity warning); `Refuted≠False`
  and `Supported⇏True` (epistemic justification, not metaphysical truth); `Conflict` tested as a
  potentially derivable relation, `Conflict(P)=f(R,E)`, making stored conflict status possibly redundant;
  `Contested≠Conflicted` (actor-challenge vs. incompatible-content coexistence); `Accepted≠Supported`
  (governance-dependent, reinforcing `Σ⊥Γ`); **`Superseded≠Refuted`, backed by a specific cited piece of
  running-system (EKP) evidence: "`supersedes` exists as a relation while the lifecycle status is a
  projection, not the source of truth" -- "strong evidence against treating every lifecycle label as
  primitive epistemic state"**; `TemporalValidity≠EpistemicStatus` (`Supported` but `Expired`, derivable
  from `t_start,t_end,now` rather than stored in `Σ`); Acquisition classified into Evidence/Provenance,
  not `Σ`; Resolution classified into Lifecycle, not `Σ`.

  **§275.18 delivers the file's central structural hypothesis, THE FIVE-TYPE DECOMPOSITION**: boxed
  **`StatusLikeInformation=Epistemic⊕Lifecycle⊕Governance⊕Temporal⊕Provenance`** (`⊕` denoting semantic
  separation, not necessarily mathematical direct sum) -- "a hypothesis to verify," giving the
  long-running status-vocabulary-proliferation investigation (tracked across many prior files back to the
  earliest windows) its most complete and precise decomposition target yet.

  **§275.19-275.22 delivers the same rigorous minimality apparatus as 0902's Step 273**, reapplied to `Σ`
  specifically: THE KEY MINIMALITY TEST (`K^{-d}` sufficient iff `∀o∈𝒪_core:o(K,x)=o(K^{-d},x)`, i.e. `d`
  is not primitive if no operation distinguishes its removal); the converse SEPARATING-EXAMPLE
  construction for dimensions believed necessary; a `Σ`-equivalence relation (`σ_1≡_Σσ_2` iff
  indistinguishable under mandatory epistemic operations, not mere tuple equality, worked via
  `(Supported,Strong)` vs. `(Supported,VeryStrong)`); and a `Σ`-ordering investigation explicitly warning
  the resulting structure may be "a product of heterogeneous structures, not necessarily one total order"
  (support strength ordinal, epistemic direction not naturally ordered -- `Refuted` is not "less than"
  `Supported`).

  **§275.23 reaffirms "do not manufacture probability"**, directly consistent with 0893's/0895's/0898's
  standing rejection of unestablished probability claims -- `SupportStrength` must not be interpreted
  probabilistically absent an actual `(Ω,𝔉,P)` space -- `Strong≠0.9`.

  **§275.24-275.27 delivers three explicitly separated questions and the file's most consequential
  methodological framing**: Q1 -- Representation (what values can `Σ` contain?); Q2 -- Determination (how
  is `Σ` computed?); Q3 -- Governance (who may establish/change the epistemic commitment?) -- explicitly
  different problems, none to be conflated. Since Assessment (`P×Evidence×Context×Policy→Σ`) depends on
  still-open Policy semantics, Step 275 explicitly must NOT claim `Σ` is computationally closed merely
  because its type has been reconstructed -- separating status REPRESENTATION from status DETERMINATION.
  **Delivers "perhaps the most important test," THE STORED-VERSUS-DERIVED QUESTION**: if
  `Σ=f(K,E,C,Π)` is genuinely reproducible, a stored `Σ` may be nothing more than a cache/projection --
  "do not automatically store derived values" -- directly reapplying 0902's/0897's Required≠Primitive and
  Semantic-necessity≠Representation-necessity safeguards to `Σ` specifically.

  **§275.28 delivers a valuable, constructively-framed historical-preservation principle**: the corpus
  contains a genuine lineage of competing formulations (the formal three-status ladder, the older rich
  vocabulary, the five-dimensional structured model, the later adversarial decomposition, executable status
  examples) arising in different eras, explicitly never fully reconciled -- requiring Step 275 to preserve,
  not erase, this lineage (`HistoricalModel→FormalModel→AdversarialRefutation→ReconstructedModel`) -- a
  constructive counterpart to the earlier `Later≠Better`/historical-regression caution (first crystallized
  at file 0863), applied here as an instruction to retain discarded formulations as record rather than
  silently discard them.

  **§275.29-275.30 delivers ten concrete falsification tests** for any candidate `Σ` structure (can it
  represent Unknown/Supported/Refuted; distinguish Weak from Strong; Supported from Accepted; Refuted from
  Superseded; Conflicted from Contested; Expired from Refuted; Unknown from Missing; and Strong-support
  from high-statistical-confidence). **Delivers a specific claimed EXECUTED falsification result**:
  "the executable corpus already distinguishes `Missing` (expected governed artifact absent) from
  `Unknown` (no evidence either way)... the independent execution falsified the claim that the corpus
  could not distinguish them" -- a further instance of the referenced-but-unseen-executed-evidence pattern
  (like the "closure artifact" at 0896), here specifically claiming a genuine empirical/executable
  falsification test was actually run, though not directly visible in this file. Follows with the further
  open question of whether `Missing` is itself epistemic, governance, or data-quality state -- "do not
  automatically put it into `Σ`."

  **§275.31-275.33 delivers a thirteen-row required classification matrix** (currently unfilled), a
  ten-artifact required-documentation list (dimensional decomposition, minimal structure, primitive/
  derived audit, ordinal-scale audit, equality-and-order, counterexamples, Unknown-vs-Missing audit,
  assessment dependency, policy boundary, updated closure status), and a nineteen-lettered final-verdict
  format (A through S).

  **§275.34 delivers THE NON-NEGOTIABLE CONCLUSION RULE**: explicitly names and rejects THREE UNACCEPTABLE
  SHORTCUTS for declaring `Σ` solved -- "three states ⇒ Σ solved"; "five dimensions ⇒ Σ solved"; "24
  vocabulary terms ⇒ 24 epistemic states" -- "all three are invalid without further derivation. The corpus
  itself has now demonstrated why."

  **§275.35 delivers the strategic objective**: boxed **`EpistemicState=the minimum formally typed
  information required to distinguish epistemic outcomes under the canonical operations`** -- everything
  else must be shown to belong elsewhere, to be derivable, or to be genuinely required.

  **Closes opening "Step 276 — Policy Minimal Semantics and Assessment Closure,"** reaffirming the overall
  formal dependency chain boxed **`K→Σ→Assessment→Policy→T→Computational Closure`**, explicitly continuing
  (rather than re-deriving) the localization of Policy as the remaining foundational dependency already
  established in files 0897/0900.
