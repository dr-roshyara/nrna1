defines:
  - concept: "The five-type decomposition hypothesis for status-like information"
    definition: "A candidate structural hypothesis proposing that all of KnowledgeOS's status-like vocabulary (Unknown, Supported, Refuted, Conflicted, Contested, Accepted, Superseded, Approved, Validated, Expired, Missing, etc.) decomposes not into one epistemic status set but into five semantically distinct, separately-governed dimensions: Epistemic (genuine evidential support direction and magnitude), Lifecycle (workflow/process stage, e.g. Open/InProgress/Resolved), Governance (authority-based acceptance/approval/rejection, independent of evidence quality), Temporal (time-bounded validity, e.g. Expired vs. currently applicable), and Provenance (how the information was acquired -- Observed/Reported/Inferred/Calculated/Assumed/Hypothesized). The ⊕ notation denotes semantic separation of concerns rather than a claim about a specific mathematical direct-sum structure. Only the Epistemic component is claimed to belong inside the canonical epistemic-status object Σ_epi; the other four dimensions belong to entirely separate KnowledgeOS subsystems/bounded contexts"
  - concept: "The Stored-versus-Derived question for Σ"
    definition: "Described as perhaps the single most important test for the epistemic-status investigation: determine whether Σ=f(K,E,C,Π) — the epistemic status as a function of the knowledge state, evidence, context, and policy — is genuinely reproducible (i.e. recomputable on demand, deterministically, from these inputs). If reproducibility holds, then any stored Σ value is merely a cache or projection of that function, not independently authoritative information, and storing it need not be treated as adding to the canonical minimal state. If reproducibility does NOT hold — if some additional persistent epistemic commitment exists that cannot be recovered purely from K, E, C, and Π — then that additional commitment (and only that) must be identified and separately justified as genuinely primitive, persisted state. This directly reapplies the Required≠Primitive and Semantic-necessity≠Representation-necessity safeguards from 0897/0902 specifically to the epistemic-status object"
refines:
  - concept: "0902's Σ PROBLEM (three competing models: single status / structured multi-dimensional / derived assessment)"
    refinement: "SHARPENED into the concrete five-type decomposition hypothesis and a specific candidate two-part structure Σ_epi=(D,S), with D={Unknown,Positive,Negative} and S={None,Weak,Moderate,Strong,VeryStrong} -- giving 0902's abstract three-model choice a specific, testable candidate structure and an explicit falsification test suite"
  - concept: "0902's Deletion/Replacement/Information-Loss test triad and Required≠Primitive/Semantic-necessity≠Representation-necessity safeguards"
    refinement: "REAPPLIED specifically to Σ via the Key Minimality Test, the separating-example construction, and the Stored-versus-Derived question, demonstrating the reusability of the general minimality methodology"
  - concept: "0893's/0895's/0898's/0900's standing rejection of unjustified probability/measurement claims"
    refinement: "REAFFIRMED for support strength specifically -- Strong≠0.9 absent an established probability space, and ordinal support labels must not be assumed to carry arithmetic meaning (Strong≠3) without a justified measurement scale"
  - concept: "0863's Later≠Better/Chronology≠Supersession finding about historical knowledge loss"
    refinement: "REFRAMED CONSTRUCTIVELY: rather than merely warning against treating later material as automatically superior, this file requires actively preserving the full lineage of competing prior formulations as an explicit deliverable, treating discarded models as retained historical record rather than material to silently discard"
