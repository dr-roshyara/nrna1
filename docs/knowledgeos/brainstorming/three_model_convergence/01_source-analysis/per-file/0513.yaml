about: >
  "Question 5 -- Updating and Preserving Assertions": a single-pass (no critical review) formal-definition
  document establishing how KnowledgeOS maintains assertions over time. Structurally identical to the
  phase_measure_theory Question-N files (Formal Definition -> Core Problem -> ... -> Summary -> Next Steps),
  but internal evidence places it CHRONOLOGICALLY EARLIER than much of the already-processed
  phase_measure_theory sequence: Section 11's "Complete KnowledgeOS Model" lists Epistemic State as the
  FIVE-dimensional Sigma=(A,S,R,V,C), matching the corpus's ORIGINAL five-dimensional formulation
  (established ~0464, "2240 states") that was later corrected to the four-dimensional
  Sigma_A=(Acquisition,Support,Uncertainty,Validity) at 0479/0482 with Conflict externalized as a relation.
  This confirms the kernel/ directory (entered for the first time at 0512) contains material from an
  earlier stage of the corpus's own research history, encountered later in this reconstruction's read
  sequence only because of directory-based manifest ordering, not true chronology.

  **Establishes the core distinction**: Update≠Overwrite; Update=CreateNewVersion+PreserveHistory. Defines
  an eight-stage Assertion Lifecycle: Created->Evaluated->Accepted->Updated->Challenged->Revised->
  Retired/Rejected. Formalizes Update(A,E,tau)->A_new with an explicit 8-step process (receive evidence,
  apply to current assertion, determine epistemic-state change, create new version if needed, preserve old
  version, update provenance chain, update temporal validity, return). Names four update triggers (New
  Evidence, Time Passage, Context Change, Challenge Resolution) and five update types (State/Value/
  Dimension/Entity Update, Retirement). **Formalizes the Preservation Principle**: "KnowledgeOS never loses
  the history of an assertion. Every change is recorded, and old versions remain accessible" --
  AssertionHistory={A_tau1,A_tau2,A_tau3,...}. **Introduces a six-field Provenance structure**:
  (VersionID,tau,Previous,Reason,Evidence,Actor), and a Versioned Assertion tuple
  A_versioned=(A,VersionID,tau,Provenance), with a worked Nexus-version history example (3.69 Assumed ->
  3.69 Confirmed -> 3.70 Confirmed) supporting concrete history queries ("what was the version on Monday?",
  "when/why/who updated it?"). Defines three concrete update functions (StateUpdate, ValueUpdate, Retire)
  and maps Zero/Lord/Sārathi to update-related roles (Zero detects staleness/weak-evidence/unresolved-
  conflict triggering an update need; Lord suggests new dimensions/alternative values/interpretations;
  Sārathi guides evidence collection/re-evaluation/resolution). Presents a full worked Arjuna example
  tracing assertion updates through a conflict lifecycle: the Grandfather-relationship assertion and a
  newly-observed Opposing-side assertion are flagged Conflict=Active, then resolved via a
  Moral_Conflict=True inferred assertion, updating both original assertions to Conflict=Resolved -- an
  earlier, simpler ancestor of the much more elaborate conflict/resolution machinery developed later in the
  phase_measure_theory arc (0472-0482). Closes with a formal model (Update(A,Delta,tau)->A_new; versioned
  assertion tuple; History(A) set; two preservation invariants -- History(A)≠empty-set for all A, and every
  A_tau_i is in History(A)), a four-invariant summary, and Section 11's eight-item "Complete KnowledgeOS
  Model" enumeration (Proposition(E,D,V); Assertion(P,Sigma,E,tau,Pi); Epistemic State(A,S,R,V,C) [the
  pre-correction five-dimensional form]; Evidence(S,T,C,R,rho,K,tau); Comparison; Challenge; Update;
  Preservation). Closes naming three next-phase questions matching the phase_measure_theory arc's actual
  subsequent development: how to form a coherent Knowledge State from Assertions (Q6-Q8 territory); how to
  resolve conflicts between Assertions (Q9 territory); how to measure Knowledge State quality (later
  Discrepancy/Coherence territory) -- "culminating in a complete formal specification of KnowledgeOS."
