about: >
  "01 — Dependency Graph (mandate §3)," the written formalization of the already-executed 27-node, 42-edge
  dependency graph and minimal-cut result (files 1049-1052), presented as a full edge-citation table matching
  the script's edges exactly, with the same audit note explaining the removed `K→≡_𝒯` spurious edge.

  **Delivers a genuinely useful new organizing taxonomy, §16 "Dependency ≠ Blocker,"** classifying all 27
  nodes into six categories: HARD BLOCKER (`𝒪`,`𝒯`,`𝒪_K`,`≡`,`δ`,`Qualify`); SOFT DEPENDENCY (`policy→δ`,
  `evidence→canonicalization`); DERIVABLE PREREQUISITE (`≈`,`congruence`,`minimality`,`bindings`,
  `canonicalization`,`merge`,`invariants`,`sufficiency` -- eight nodes that follow automatically once upstream
  decisions are made, matching the already-tracked `DERIVED_ONLY` set from files 1049-1052); GOVERNANCE
  PREREQUISITE (`Π`,`id_context`,`assertion`,`temporal`); IMPLEMENTATION PREREQUISITE (`state_rep`,`=`,
  `projection`); DOCUMENTATION DEPENDENCY (the already-tracked `≅`/`≡` glyph overloading). Closes: "Not every
  dependency is inflated into a blocker: 8 of 27 nodes are derivable prerequisites" -- a disciplined caution
  against treating the whole dependency graph as uniformly blocking, when in fact a third of it will resolve
  automatically once the hard blockers (and especially `equiv`, per file 1052's capstone result) are settled.
