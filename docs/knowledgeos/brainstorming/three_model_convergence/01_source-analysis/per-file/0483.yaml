defines:
  - concept: "Ideal State (governance-qualified)"
    definition: "IdealState = KnowerIntent + ApplicableNorms + Constraints + Purpose -- never simply the Knower's unilateral preference, since organizational policy/regulation/governance may constrain individual Ideal-State components"
  - concept: "Constraint / Policy / Norm (disambiguated)"
    definition: "Constraint(K): a condition on a state; Policy(a,K): a rule governing decisions/actions; Norm(K): a rule governing what ought to be the case -- three distinct kinds of rule, previously conflated"
  - concept: "Theorem G5 (Guidance is optional)"
    definition: "Guidance(K_t,I_t,...) is not required before every transition: there exists e_t such that K_{t+1}=δ(K_t,e_t) without a preceding Zero/Lord/Sārathi cycle"
refines:
  - concept: "0481's event-sourcing architecture (Event≠Operation≠Transition, δ as a partial function)"
    refinement: "Extended upstream with an Authorize/Execute pipeline (a_t->c_t->e_t) and non-deterministic Execute:C->{Success,Failure,Partial}, plus a post-transition invariant-preservation requirement"
  - concept: "0482's posed boundary question for Question 17 (how do Zero/Lord/Sārathi interact with the transition system without becoming part of the Knowledge State)"
    refinement: "Fully answered via the Guidance/Authorization/Execution/Transition four-way separation and Theorem G5, with Zero/Lord/Sārathi explicitly excluded from the State Mutation Boundary"
  - concept: "0476's KnowledgeOS≠Ideal-Owner boundary"
    refinement: "Sharpened further: even the Knower does not unilaterally own the Ideal State, which is also shaped by applicable norms, constraints, and governance -- directly setting up Question 18"
