defines:
  - concept: "The four-outcome directional traceability taxonomy"
    definition: "EndToEndTraceability (every stage of the Intent-to-Knowledge chain is linked and evidenced); TechnicalTraceability (implementation-to-runtime evidence is strong but intent-to-authority evidence is weak); GovernanceTraceability (decision-to-implementation evidence is strong but runtime evidence is weak); TraceabilityFragmentation (multiple individual stages have evidence but cannot be connected into a continuous chain) — these capture which half of the chain is strong, distinct from overall structural-coherence diagnostics"
  - concept: "Conformance=Technical∩Governance"
    definition: "Overall conformance for an engineering change requires both technical correctness (the implementation works and passes verification) AND governance correctness (the change was properly authorized); either dimension failing independently fails overall conformance — technical correctness never substitutes for authorization, and authorization never substitutes for technical correctness"
  - concept: "The verification-before-implementation temporal-impossibility check"
    definition: "If a verification event's timestamp precedes the timestamp of the implementation it purports to verify, this indicates either invalid/fabricated evidence or a data/clock synchronization problem — verification cannot legitimately precede the artifact it verifies"
  - concept: "The five-reality state-reconciliation model"
    definition: "A genuine KnowledgeOS must reconcile five potentially divergent realities for any given architectural requirement: DeclaredState (what was decided), ImplementedState (what the code contains), DeployedState (what was shipped), RuntimeState (what is actually running), and KnowledgeState (what the organization's authoritative knowledge currently records) — unifying the architecture-conformance A_I/A_C/A_D/A_R tiers with the semantic-core/knowledge-currency discipline into one reconciliation target"
