defines:
  - concept: "The nine-question operation-derivation method"
    definition: "A systematic procedure applied to every candidate capability found in the corpus before admitting it into the semantic operation universe: (1) What distinction does this capability require? (2) What operation expresses that capability? (3) Does the operation change K? (4) Does it merely observe K? (5) Does it operate on history? (6) Does it depend on governance? (7) Is it merely representation? (8) Can it be derived from another operation? (9) What happens if it is removed? Only capabilities whose distinction cannot be eliminated without loss, after passing through this full nine-question filter, are included in the semantic core -- explicitly deriving operations from mandatory distinctions rather than from pre-existing implementation method names"
  - concept: "Operations do not map one-to-one to state fields"
    definition: "A load-bearing methodological finding: the mere existence of an operation that manipulates or detects some distinction does NOT imply that distinction must become its own primitive field of the canonical state K or the epistemic status Σ. Concretely: the existence of DetectContradiction does not imply Conflict must be a primitive field of Σ; the existence of Supersede does not imply Superseded must be a primitive field of Σ (supersession is instead representable as a relation between assertions); the existence of Replay does not imply the complete transformation history must be embedded inside the instantaneous state K itself (history can remain a separate, externally-reconstructible structure). The general principle is that the operation universe O_sem constrains what K must be able to support, but never directly dictates how K's internal decomposition into fields/components should look -- that decomposition question requires its own separate, genuine sufficiency/minimality proof (the work later carried out in files 0902-0904/0907), which must not be shortcut by assuming a naive operation-to-field correspondence"
