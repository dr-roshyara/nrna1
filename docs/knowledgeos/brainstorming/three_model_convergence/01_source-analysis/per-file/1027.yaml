about: >
  Accepts Step 287 "as the correct closure of the RESEARCH DIAGNOSIS -- but NOT as closure of equality
  itself," confirming nine already-tracked findings (four relations correctly separated, `history⊊
  structural⊊semantic` withdrawal, Decision 3 as the major normative branch, `≈_X`'s 32-element
  derivation, label-projection vs behavioural-equivalence distinction, product-order qualification,
  non-injectivity-modulo-quotient, per-layer identity separation, `UNDER-SPECIFIED` not `ABSENT`/`SOLVED`,
  Step 261 as the decisive stop-gate).

  **DELIVERS A GENUINELY IMPORTANT CORRECTION to the already-tracked closure framing (file 1026)**: "What
  closes it: a ruling on Decision 3 and a declared axis subset for `≈`" is "slightly too strong" -- those
  two acts close only the CURRENTLY IDENTIFIED branches, not equality as a complete implementation contract,
  since decision procedures for `≡` and `≅_λ` THEMSELVES, precise state identity, equality implementation
  semantics, the component orders, and eventual interaction with `δ`/operations all still remain open.
  Reframes: "These are the next normative decisions required to remove the CURRENTLY IDENTIFIED equality
  ambiguity; they are not, by themselves, proof that the complete equality implementation contract is
  closed."

  **DELIVERS THE FULL, TWENTY-SECTION "REFINED STEP 288 — EQUALITY DECISION-PROCEDURE CLOSURE" MANDATE** --
  distinct from and NOT to be confused with the already-tracked "D288 -- Decision-Procedure Closure" (files
  1002, 1005), a further roadmap-naming variant. Governing question: "What is the minimum formal decision-
  procedure specification required to make each corpus equality relation evaluable, and which parts are
  derivable, which require normative governance, and which remain blocked by other unresolved constructs?"

  **DELIVERS THE FIRST FORMAL NAMING OF FOUR SPECIFIC GOVERNANCE ACTS, `G-EQ-1` THROUGH `G-EQ-4`**: `G-EQ-1`
  is Π inside semantic equality? (= the already-tracked Decision 3); `G-EQ-2` is what observation subset
  defines `≈`? (= the already-tracked axis-subset choice); `G-EQ-3` is what counts as relevant provenance for
  `≅_λ`? (= the already-tracked provenance-relevance predicate); `G-EQ-4` is what state identity rule is
  canonical? (a NEW, not-previously-separately-named fourth governance act). Explicitly caveated as
  provisional: "Do not assume these are the final names or the complete set."

  **Details a comprehensive twenty-section research protocol** with a strict non-negotiable discipline list
  (relation≠decision procedure≠implementation≠governance choice≠correspondence≠derivation≠canonicalization);
  a mandated seven-column reconstruction table for each of the four relations (corpus definition/domain/
  codomain/existing procedure/missing parameters/derivable?/governance required?/blocked by another
  construct?); dedicated investigation protocols for structural equality (representation, identity-type
  disambiguation), semantic equality (both Π-branches analyzed without choosing), observational equivalence
  (confirming, not choosing, the 32-subset derivation; explicitly separating label-projection from
  behavioural equivalence pending `δ`), and provenance-sensitive equivalence (determining whether the corpus
  supplies a principle/predicate/field-set/algorithm/governance-rule for "relevant," citing Step 105); a
  five-notion identity reconstruction (state/operation/authority-act/event/provenance identity), explicitly
  flagging `id=H(P,e,c,t,Π)` and an "unresolved issue identified in TG-06" (a NEW bridge candidate); a
  mandated dependency-graph derivation (identity→structural→semantic→postconditions→δ), explicitly checking
  for circularity rather than assuming the proposed chain; a per-axis product-order classification
  (corpus-defined/derivable/partially derivable/normative/absent) for all five axes; a fifteen-item decision-
  procedure completeness checklist for "IMPLEMENTATION-READY" status; application of that checklist as a
  matrix over the four relations; and explicit relation-to-Blocker-3 and relation-to-Blocker-1 sections,
  the former allowing Blocker 3 to be "confirmed, narrowed, split into multiple blockers," or found to have a
  "downstream" or "circular dependency."

  **Delivers a required seven-part final verdict structure** (A: what is closed; B: what is formally
  derivable; C: what remains under-specified; D: what requires governance; E: what is blocked by
  δ/𝒪/ℐ/another construct; F: has Blocker 3 been confirmed/refined/split; G: the smallest legitimate next
  act) and a five-condition stop condition, plus a mandatory evidence-discipline vocabulary
  (CORPUS/DERIVED/VERIFIED/INFERRED/GOVERNANCE/BLOCKED/WITHDRAWN/SUPERSEDED).

  **Closes with the file's own precise, single governing research question**: "Do we now know what an
  equality relation must contain to be executable, even though we still do not know which normative equality
  KnowledgeOS should adopt? ... Do not answer the normative question." Explains the rationale: "converts
  Step 287's excellent diagnosis into a precise DECISION INVENTORY. Then Governance can decide a small,
  explicit set of questions rather than being handed another large research corpus."
