defines:
  - concept: "Policy"
    definition: "A newly-discovered, necessary addition to the frozen vocabulary, answering 'what normative constraints govern behavior in this context?' -- formalized as a function Context×Action→{Must,May,MustNot,Conditional}. Policy is categorically distinct from Evidence, Authority, and Decision: it is not itself evidence, does not itself confer authority, and is not itself a decision -- it constrains which decisions and actions are permissible, and is explicitly separate from Authority (which answers who may legitimately decide or perform an action, not what may or should be done)"
  - concept: "The foundational triad Fact≠Norm≠Authority"
    definition: "Three categorically distinct grounds that can each independently motivate or explain an action, which must never be collapsed into one another: Fact/Descriptive ('it happened' -- what was observed to occur), Norm/Normative ('it should happen' -- what policy dictates ought to occur), and Authority/Governance ('this actor is authorized to decide/execute it' -- who is legitimately empowered regardless of whether the action is factually common or normatively mandated) -- flagged by the file as a candidate foundational philosophical/mathematical principle of the entire book, generalizing the Descriptive≠Normative distinction from Step 201 by adding the governance dimension discovered through this file's relation-matrix exercise"
  - concept: "The three-dimensional decision validity vector"
    definition: "An extension of Step 200's two-dimensional (Epistemic,Governance) decision-validity model to three dimensions, V_D=(E_D,G_D,P_D) -- epistemic support, authority/governance validity, and policy conformity -- so that a decision such as (1,1,0) can be honestly represented as 'well-supported and authorized, but violates policy,' a state a single Boolean validity flag could never express; this is explicitly defended as resolving a genuine semantic ambiguity the relation matrix itself uncovered, not as gratuitous conceptual inflation"
refines:
  - concept: "0829's closing proposal of Step 202's formal relation matrix task, explicitly positioned as the DDD-derivation point"
    refinement: "DELIVERED IN FULL, and productively: rather than merely confirming the frozen vocabulary's relationships, the relation-matrix exercise itself discovers a genuine gap (the missing Policy concept), demonstrating the review methodology's value beyond mere formalization -- exactly the kind of falsification-driven refinement 0828's governing program called for"
  - concept: "0800's Step 200 two-dimensional decision validity (EpistemicValidity,GovernanceValidity)"
    refinement: "EXTENDED to three dimensions by adding PolicyConformity, directly motivated by the newly-discovered Policy concept -- a concrete instance of the architecture legitimately growing in response to a discovered gap rather than speculative addition"
  - concept: "0801's/0829's Descriptive≠Normative distinction (D(x)⇏N(x), Invariant I71)"
    refinement: "GENERALIZED into the three-way foundational triad Fact≠Norm≠Authority by adding the governance dimension, directly connecting the epistemic-discipline family (Descriptive vs. Normative) to the authority-discipline family (Authority≠Correctness, Authority≠Truth) discovered across many earlier files"
  - concept: "0824's DDD aggregate-discovery method (boundaries from invariant co-change) and 0798's/0799's three-zone architecture"
    refinement: "Directly applied and sharply reinforced via an explicit new warning not previously stated this precisely: mathematical distinction between two concepts does not imply they belong to different bounded contexts -- bounded contexts are a function of Language+Model+Invariants+Ownership+Change boundaries, never mathematical type alone"
