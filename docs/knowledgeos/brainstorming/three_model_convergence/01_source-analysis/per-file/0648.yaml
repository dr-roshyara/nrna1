defines:
  - concept: "Observable→Identifiable→Computable"
    definition: "Three independent boundaries a quantity must clear before becoming decision-relevant: whether it can be observed at all given the available measurement architecture, whether the desired estimand can be uniquely determined from what is observed given the model/assumptions, and whether that identified quantity can be computed within available resources — none of these properties implies any of the others"
  - concept: "Observationally equivalent states"
    definition: "Two world states x_1, x_2 are observationally equivalent if they induce identical observation distributions (P(O|x_1)=P(O|x_2)); no amount of additional computation over the resulting observations can distinguish them, since the information required to do so was never captured by the observation process"
  - concept: "No downstream computational layer may silently upgrade the epistemic status of its input"
    definition: "A foundational KnowledgeOS principle requiring every processing stage to preserve, not inflate, the epistemic category of what it receives — a measurement must not become a fact, a fact must not become a causal explanation, a prediction must not become an outcome, AI consensus must not become independent evidence, and a decision must not become an authorization, purely by virtue of passing through another computational stage"
