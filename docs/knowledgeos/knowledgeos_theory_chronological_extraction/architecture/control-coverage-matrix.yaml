# control-coverage-matrix.yaml — for each Research Control Invariant: where it is
# stated, what enforces it TODAY, what audit covers it, and what was OBSERVED.
#
# STATUS: PROPOSED — authority: generated. Evidence snapshot, not a verdict.
# AS OF:  HEAD da9a5beec (2026-09-23). Gate facts from governance/gates.yaml and
#         governance/governance-state.yaml at that commit.
#
# coverage (what enforces the invariant)
#   ENFORCED            an ACTIVATED AUT gate checks the invariant's correspondence
#   MEASURED            an AUT gate exists and runs, but is NOT activated
#   PARTIAL             a gate checks part of it (e.g. form only, or C0 instead of C1)
#   REVIEW_ONLY         only a REVIEW-class gate (reported REVIEW_REQUIRED, never passed)
#   HUMAN_ONLY          only a HUMAN-class gate (never evaluated by the runner)
#   PROSE_ONLY          stated in architecture/protocol; nothing checks it
#   NONE                not even stated as an operative rule
#
# observed (what the evidence shows, separate from coverage)
#   HOLDS · PARTIAL · VIOLATED · AUDIT_FINDING · BREACHED_RECORDED · OPEN · UNVERIFIED
#
# Gate ids are governance/gates.yaml ids (the only gate namespace). New
# enforcement is named `PROPOSED:<name>`; an id is allocated only on
# registration in gates.yaml (research-control-architecture.md §10).

activated_gates: [KOS-G-001, KOS-G-002, KOS-G-003, KOS-G-010, KOS-G-022]
runner_self_test: "30/31 (theory_doc_exists MISMEASURED) — RCI-014 ⇒ verdicts of this version are INCONCLUSIVE by the proposed rule"

