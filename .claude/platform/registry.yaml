# PublicDigit AI Engineering Platform — Platform Registry
#
# RUNTIME CONFIGURATION, machine-readable (ARB amendment 1, 2026-07-08).
# Human documentation is GENERATED from this file — never the reverse.
# Governed by ADR-AIP-01 (Baseline v1.0 — Reference Implementation Pending).
#
# Identity rule (ARB C1 review, 2026-07-08): components carry stable ids
# CMP-nnn, assets carry stable ids AST-nnn. Paths change; ids never do.
# ADRs and reviews reference ids, not paths.
#
# Registry-first workflow (ARB strategic rule, 2026-07-08 — BINDING):
#   1. register the component/asset (with full five-question traceability)
#   2. review + approve the registry entry
#   3. implement the artifact
#   4. verify the implementation matches the registered intent
# Every asset answers the five questions (R-17): capability -> bounded context
# -> architecture principle -> platform decision -> ADR. An asset that cannot
# answer them shall not be registered — and shall not exist.
# Changes: governed construction slices only (plan + review + merge, R-21).
# Keep this file small, authoritative, machine-readable. No documentation here.

schema:
  version: 1
  name: publicdigit-platform-registry

platform:
  name: publicdigit-ai-engineering-platform
  baseline:
    adr: ADR-AIP-01
    designation: "Baseline v1.0 - Reference Implementation Pending"
  iteration: 1
  # OI-1 renames apply by supersession (ARB 2026-07-08: OI-1 does not block construction)
  vocabulary: engineering/architecture/baseline/Phase-02.6-Ubiquitous-Language.md
  # ARB amendment 3 (2026-07-08): knowledge loads before rules (rules depend on knowledge, never the reverse)
  loading_order: [configuration, registry, knowledge, rules, hooks, commands, agents]
  # Normalized runtime moments (enum) — the only legal values for assets.runtime_moments:
  runtime_moment_enum: [SESSION_START, PRE_ACTION, POST_ARTIFACT, SESSION_END, ON_DEMAND]

# Components are ABSTRACTIONS (Phase-03A section 1) with stable identity and
# their own version. A component is never bound to a technology; concrete
# scripts/files are its *implementations* (ARB amendment 2).
# bounded_context = architectural placement · owner = governance accountability.
components:
  - id: CMP-001
    name: composition_root
    version: 1.0
    bounded_context: none            # the root wires contexts; owns no domain
    owner: Architecture Review Board
    status: adopted

  - id: CMP-002
    name: session_manager
    version: 1.0
    bounded_context: session-continuity
    owner: Session Continuity
    realizes: [CAP-01, CAP-02]
    status: adopted

  - id: CMP-003
    name: knowledge_manager
    version: 0.0                     # not yet constructed
    bounded_context: knowledge-governance
    owner: Knowledge Governance
    realizes: [CAP-03]
    status: deferred                 # Iteration 1: plan files declare their reading lists; no gap evidenced by PB-004

  - id: CMP-004
    name: workflow_engine
    version: 1.0
    bounded_context: implementation-guidance
    owner: Implementation Guidance
    realizes: [CAP-05, CAP-06]
    status: adopted                  # minimal form: tripwires + plans/progress convention

  - id: CMP-005
    name: verification_engine
    version: 0.1                     # guard surface adopted; gate execution planned (C3)
    bounded_context: verification-evidence
    owner: Verification & Evidence
    realizes: [CAP-07, CAP-08, CAP-09]
    status: under-construction
    implementations:
      - asset: AST-007               # db-safety-check.sh — guard surface (Tier-1 blocking), adopted
      - asset: AST-010               # run-gates.sh — gate execution + evidence recording, planned (slice C3)

  - id: CMP-006
    name: review_engine
    version: 0.0
    bounded_context: adversarial-review-support
    owner: Adversarial Review Support
    realizes: [CAP-11]
    status: deferred                 # PB-004 reviews are human; automation waits for evidenced recurring need

  - id: CMP-007
    name: drafting_studio
    version: 1.0
    bounded_context: design-decision-support
    owner: Design & Decision Support
    realizes: [CAP-10, CAP-12]
    status: adopted-by-reference     # consumes frozen templates in docs/; creates no parallel copies

  - id: CMP-008
    name: platform_registry
    version: 1.0
    bounded_context: design-decision-support
    owner: Design & Decision Support
    realizes: [CAP-13]
    status: active
    implementations:
